    # 1 Agent 工程基础


    ## 开始之前：加入我们 Discord 上的 GenAI & LLM 社区


    在我们的 Discord 服务器上向作者提供反馈，并与其他早期读者聊天。


    ![一个带有橙色正方形的二维码，AI 生成的内容可能不准确](img/file0.png)


    [`packt.link/4Bbd9`](https://packt.link/4Bbd9)


    > *未来属于那些能够利用人工智能的组织，不是将其作为人类智能的替代，而是作为其增强。*


    — 吴恩达（Andrew Ng），AI 研究员，Coursera 联合创始人


    **人工智能**（**AI**）正处于一个变革性的边缘，这是由于**自主 Agent**的出现。它们代表了自从过程化转向面向对象编程以来，计算领域最重要的架构进步——对数字系统运行及其与其环境交互方式的根本性重构。这些
    Agent 不仅仅是增强的算法，而是能够感知周围、维持持久状态、对复杂目标进行战略性推理并根据经验调整其行为的认知实体。这种演变的影响远超技术实现细节，它挑战了我们对人类意图与计算行为之间关系的根本观念。


    本章为理解 **Agent 工程** 奠定了概念性基础，将其既视为一门理论学科，也视为一个实战框架。我们探索了从简单的反应式系统到复杂的认知架构的演变轨迹，研究了实现自主行为的结构性组件，并引入了桥接理论原理与生产实现的开发方法论。通过这种探索，我们旨在为您提供一个概念化
    Agent 系统的全面框架，并为有效设计、开发和部署它们提供实践见解——无论您是构建自主工作流的软件工程师，还是将智能助手集成到旧系统中的企业架构师，或是探索基于
    Agent 的平台如何提供可扩展的客户支持或合规自动化的产品领导者。


    这里概述的原则不仅仅是学术的——它们代表了寻求利用基于 Agent 的系统的变革潜力的组织的关键知识。无论是自动化复杂工作流、增强人类能力，还是实现全新类别的应用程序，自主
    Agent 正日益成为数字版图中不可或缺的。然而，实现它们的全部潜力通常涉及应对复杂的集成挑战，例如稳健的工具编排、安全的数据隐私和伦理对齐。理解它们的本质和架构要求，为成功实施提供了基础，并通过这些基础可以有效解决这些挑战。


    在本章中，我们将涵盖以下主题：


    *   介绍 Agent

    *   Agent 架构

    *   互操作性协议

    *   Agent 开发生命周期

    *   Agent 交互范式的演进

    *   Agent AI 演进框架（Agentic AI Progression Framework）

    *   现实世界的业务影响


    ## 介绍 Agent


    我们正处于计算史上的一个关键转折点。从传统软件系统到自主 Agent 的转变代表了场根本性的范式转移，改变了数字系统运行及其与其环境交互的方式。传统程序在显式指令定义的预测路径内运行，而基于
    Agent 的系统表现出以目标为引导的行为，维持持久状态，并根据环境反馈调整其策略。这种转变挑战了既有的软件工程原则，并为概念化计算系统的智能引入了新的框架。


    传统软件与基于 Agent 的方法之间的区别不仅是语义上的，更是架构上的。传统系统处理离散输入以生成可预测输出，而 Agent 在动态环境中持续运行，形成内部表示，在不确定下做出决策并从经验中学习。对于接受过确定性编程模型训练的从业人员来说，这种转变不仅需要新的技能，还需要对智能系统如何运作和演进进行重新概念。


    区分智能 Agent 与传统软件的关键特征包括：


    *   **自主性（Autonomy）**：无需持续人类指导即可运行的能力。

    *   **持久性（Persistence）**：跨交互维持状态和记忆。

    *   **反应性（Reactivity）**：实时响应环境的变化。

    *   **主动性（Proactiveness）**：根据内部目标发起行动，而不仅仅是由于外部触发。

    *   **适应性（Adaptability）**：从经验中学习并相应修改行为。

    *   **目标导向（Goal-orientation）**：在不确定下通过规划和推理追求目标。


    在常用用法中，Agent 是*采取行动或施加力量的*（Merriam-Webster）。在 AI 领域，这个定义演变为一个更技术的构造：AI Agent 是一种感知环境、处理内部状态并采取行动以实现定义目标的计算系统。这些系统表现出自主性、适应性和反应性——这些是区别于传统软件程序的关键属性。Agent
    的运行不仅是对输入做出反应，而是通过维持上下文、管理目标并根据反馈调整策略。这种动态行为源于**情境人工智能（situated AI）**范式，智能源于与环境的持续交互。Franklin
    和 Graesser (1997) 概括了这一概念：


    > *自主 Agent 是一个位于环境中并成为环境一部分的系统，它随时间对环境进行感知并采取行动，以追求自己的议程。*


