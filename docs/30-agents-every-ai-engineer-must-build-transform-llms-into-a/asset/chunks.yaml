  trans: "\n\n| **级别** | **代理类型** | **操作自主性** | **上下文感知** | **决策权限** | **典型用例** |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | 直接 LLM 交互 | 无状态 / 无 | 无 | 人类主导\
    \ | 一次性问答、创意生成 |\n| 2 | 代理代理 (Proxy Agent) | 低 | 轻量级上下文化 | 基于指令 | API 参数化、语义翻译\
    \ |\n| 3 | 助手系统 | 中等 | 基于会话 | 用户引导 | 数字化助手、工具增强型聊天 |\n| 4 | 自主代理 | 高 | 持久化内存 |\
    \ 部分自主 | 任务规划、研究助手 |\n| 5 | 多代理系统 (MAS) | 极高 | 共享 + 分布式 | 分布式自主性 | 供应链、编排、仿真 |\n\
    \n表 1.1 – 跨关键架构维度的智能体交互范式对比\n\n## 直接 LLM 交互：无状态的对话者\n\n这一基础层代表了代理参与的最基本形式，用户通过自然语言提示直接与\
    \ `LLM` 交互。这些交互是无状态的，没有对之前输入的记忆，且跨轮对话没有持久上下文。如 `Figure 1.9` 所示，用户输入类似“加拿大的首都是？”的查询，`LLM`\
    \ 立即回答“渥特华”。图表通过禁止图标强调了内存的缺失，表明模型孤立地处理每个提示。它没有内部上下文跟踪，没有任务历史，也没有对话线程。\n\n![Figure\
    \ 1.9 – Direct LLM interaction](img/file9.png)\n\n图 1.9 – 直接 LLM 交互\n\n这种方法在事实性问答、创意内容生成或一次性辅助等轻量级场景中表现出色。然而，它管理多步交互、维护用户状态或完成目标驱动的工作流方面存在局限性。缺乏内存或自适应反馈机制意味着这些系统无法构建长期上下文或参与真正的对话行为。典型的无状态\
    \ `LLM` 交互看起来是单个提示产生一次性响应，且对之前的查询没有记忆：\n\n```python\nfrom openai import OpenAI\n\
    client = OpenAI()\nresponse = client.chat.completions.create( model=\"gpt-3.5-turbo\"\
    , messages=[ {\"role\": \"user\", \"content\": \"What is the capital of Canada?\"\
    \ ] )\nprint(response.choices[0].message.content)\n```\n\n直接 `LLM` 交互的现实示例包括：\n\
    \n- **基于聊的问答系统**：例如零售网站上回答事实问题的聊天机器人——“你们的营业时间是什么？”或“我的订单在哪里？”。\n- **创意写作工具**：如\
    \ `Jasper` 或 `Sudowrite` 等应用程序，它们根据提示生成单段落或想法。\n- **教育闪卡助手**：回答离散学术问题的系统，例如“解释牛顿第一定律”，用于快速学习参考。\n\
    \n## 代理代理 (Proxy agent)：智能中介\n\n代理代理代表了智能系统架构中一种基础但往往被低估的模式。与维护状态或调用外部工具的自主或多轮代理不同，代理代理关注一个更窄但至关重要的责任：将非结构化的用户输入转换为适用于后端系统的结构化可执行格式。其核心，代理代理充当了语义中介。当用户提交如“寻找我附近的餐厅”之类的请求时，代理代理不会立即将其转发到服务端点。相反，它充当翻译器——注入额外的上下文、消除模糊术语、清理输入，并将查询重新格式化为结构化表示。这种设计不仅提高了精确性和可靠性，还保护了依赖于严格模式或预定义参数集的下游系统。\n\
    \n代理代理遵循定义良好的处理流程。首先，它捕获用户输入。这些输入通常是自由格式的自然语言，本质上具有模糊性或不完整。然后代理将此输入集成到结构化的提示模板中。该模板包含了对底层语言模型的指令以及动态数据（如用户查询或上下文元数据）的占位符。完成提示后，代理调用语言模型（例如\
    \ `OpenAI` 的 `GPT` 或 `Anthropic` 的 `Claude`），并接收结构化响应——通常是 `JSON` 或 `SQL` 格式。最后，将此结构化结果转发到目标服务或执行层。为了更好地理解其工作原理，请考虑以下示例场景：用户问道：“寻找我附近正在营业的餐厅。”\n\
    \n![Figure 1.10 – Proxy agent](img/file10.png)\n\n图 1.10 – 代理代理\n\n代理代理不会直接将此消息传递给餐厅发现\
    \ API。相反，它通过结构化转换流水线处理请求，将自然语言转换为机器可读的格式。\n\n### 实现示例\n\n以下代码演示了代理代理如何实现从自然语言到结构化数据的转换：\n\
    \n```python\nfrom langchain.prompts import PromptTemplate\nfrom langchain.chains\
    \ import LLMChain\ntemplate = \"\"\"\nYou are a proxy agent responsible for translating\
    \ natural language into structured queries.\nUser input: \"{query}\"\nReturn a\
    \ JSON object with the following fields-fields:\n- intent: 要执行的操作。\n- location:\
    \ 推断或陈述的位置。\n- time_filter: 指明查询是否包含时间限制。\n- format: 响应格式（例如，'list'）。\n仅用 JSON\
    \ 回答。\n\"\"\"\nprompt = PromptTemplate(input_variables=[\"query\"], template=template)\n\
    chain = LLMChain(prompt=prompt, llm=openai_chat)\nresponse = chain.run({\"query\"\
    : \"Find restaurants near me that are open now\"})\n```\n\n### 结构化输出\n\n执行时，该实现产生一个干净、结构化的响应，下游系统可以可靠地处理：\n\
    \n```json\n{\n    \"intent\": \"search_restaurants\",\n    \"location\": \"current_user_location\"\
    ,\n    \"time_filter\": \"open_now\",\n    \"format\": \"list\"\n}\n```\n\n此结果现在是干净、上下文丰富且完全结构化的——非常适合调用\
    \ API 或传递给下游规划器。模板确保了一致性，而语言模型提供了语义推理，以推断缺失的信息（如位置元数据或时间过滤器“正在营业”）。对于生产环境，其他考虑因素至关重要：\n\
    \n- **输入清理**：实施稳健的输入清理，以防止提示注入攻击或恶意/格式错误的用户输入导致意外模型行为。\n- **日志记录**：提示、响应和执行时间的详细记录对于调试、审计和理解代理在现实场景中的行为至关重要。\n\
    - **监控提示响应时间**：持续监控 LLM 调用的延迟，以确保代理符合性能 SLA 并提供响应的用户体验。\n\n"
