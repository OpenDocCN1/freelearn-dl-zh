  trans: "\n\n# 表 2.1 – 代理开发框架对比\n\n正如`第 1 章`中关于`cognitive loop model`章节所讨论的，有效的代理必须不断在感知、推理、规划、行动和学习之间循环。我们在本章中探索的框架在代码中实现了这种认知架构，每个框架在结构化这些关键功能方面都有自己的方法。\n\
    \n理解这些不同的方法至关重要，因为你选择的框架不仅决定了你构建和迭代代理的速度，还决定了它们最终能实现什么能力。例如，`LangGraph` 的有向无环图（`DAG`）模型支持复杂多步推理的并行分支，优化了复杂工作流的吞吐量；而\
    \ `CrewAI` 的设计则可以为线性、专门化的任务提供更快速、更集中的对话。每个框架都体现了对代理行为的不同假设，为常见模式提供了不同的抽象，并对底层认知过程提供了不同程度的控制。通过研究它们的优势、局限性和最佳用用场景，你将能够做出符合你对性能、可扩展性和可维护性特定要求的明智决策。\n\
    \n## 关键框架的综合分析\n\n起初，是一片混乱：拼凑在一起的临时脚本、模型与工具之间脆弱的连接、以及在复杂性压力下崩溃的脆弱推理链。随后，框架出现了：这种代理架构的结构化方法为这片数字荒野带来了秩序。然而，至关的一点是，虽然框架提供了显著的加速和结构，但它们引入了层层抽象。这种抽象虽然对快速开发有利，但有时会导致对底层机制的低级控制水平和理解的削弱。对于基础学习或高度自定义的场景，从更简单的\
    \ Python 代码开始构建代理能力，可以在利用完整框架之前提供更深层次的洞察。每个框架都代表了关于代码中如何结构化智能的不同哲学。\n\n### LangChain：组合式的先驱\n\
    \n在数字星空中拥有超过 70,000 个 GitHub Star，`LangChain` 堪称代理框架中的元老级。它的计算图模型镜像了认知科学中关于顺序推理的理论（通常被称为\
    \ `chain-of-thought` 思维链处理），允许开发者从更简单的构建模块组合复杂的行为。这种设计使代理能够遵循分步推理流水线，图中的每个节点都对应一个认知或功能操作，就像人类如何将问题分解为顺序子任务一样。\n\
    \n`LangChain` 的架构围绕几个核心抽象构建，我们将在书中广泛地使用它们：\n\n*   **Chains（链）**：连接多个组件的顺序处理流水线。`LangChain`\
    \ 还提供了稳健的回调和追踪机制，允许开发者观察、记录和调试这些链的执行流，这对于理解复杂的代理行为至关重要。\n*   **Agents（代理）**：自主决策者，它们接收输入，决定要采取什么行动（例如调用工具或查询\
    \ API），然后执行这些行动以实现目标。这一过程可能涉及工具选择、记忆检索或推理步骤，使代理能够以某种程度的自主运行。\n*   **Tools（工具）**：外部系统和\
    \ API 的接口\n*   **Memory（内存）**：维护对话上下文和长期存储的系统\n*   **Retrievers（检索器）**：访问和过滤相关信息的组件\n\
    *   **Embeddings（嵌入）**：用于语义操作的文本向量转换\n\n框架的模块化设计在实际实现显而易见。考虑这个基础代理设置的示例：\n\n```python\n\
    from langchain.agents import initialize_agent, AgentType\nfrom langchain.llms\
    \ import OpenAI\nfrom langchain.tools import Tool\nfrom sympy import sympify\n\
    from langchain.tools.ddg_search.tool import DuckDuckGoSearchRun  # hypothetical\
    \ import\n# 定义代理可以使用的工具\ndef calculator(expression: str) -> str:\n    \"\"\"安全地评估数学表达式.\"\
    \"\"\n    try:\n        result = sympify(expression)\n        return str(result)\n\
    \    except Exception:\n        return \"Invalid mathematical expression\"\n#\
    \ 使用 LangChain 提供的 DuckDuckGoRun tool\nsearch = DuckDuckGoSearchRun()\ntools =\
    \ [\n    Tool(name=\"Calculator\", func=calculator,\n         description=\"Useful\
    \ for mathematical calculations\"),\n    Tool(name=\"WebSearch\", func=search.run,\n\
    \         description=\"Search the web for current information\")\n]\n# 初始化代理\n\
    llm = OpenAI(temperature=0)\nagent = initialize_agent(\n    tools=tools,\n   \
    \ llm=llm,\n    agent=AgentType.ZERO_SHOT_REACT_DESCRIPTION,\n    verbose=True\n\
    )\n# 让代理对工具的使用进行推理\nresult = agent.run(\"What’s the square root of 144, and can\
    \ you find recent news about that number?\")\n```\n\n此示例展示了 `LangChain` 的强大：代理自动确定它既需要数学计算也需要网络搜索，按适当顺序执行它们，并汇总结果。`ZERO_SHOT_REACT_DESCRIPTION`\
    \ 代理类型实现了 ReAct（推理与行动）模式，模型对要采取的行动进行推理，然后根据这些决策采取行动。`LangChain` 的内存系统特别复杂，支持多种内存类型：\n\
    \n```python\nfrom langchain.memory import ConversationBufferMemory, ConversationSummaryMemory\n\
    from langchain.schema import BaseMessage\n# Buffer memory 保留原始对话历史\nbuffer_memory\
    \ = ConversationBufferMemory(\n    memory_key=\"chat_history\",\n    return_messages=True\n\
    )\n# Summary memory 压缩旧对话\nsummary_memory = ConversationSummaryMemory(\n    llm=OpenAI(),\n\
    \    memory_key=\"chat_history\",\n    return_messages=True\n)\n```\n\n该框架广泛的生态系统包含了超过\
    \ 100 个与流行服务的预构建集成，如 `OpenAI`、`Anthropic`、`Google`、`AWS`、向量数据库（`Pinecone`、`Chroma`、`Weaviate`）以及无数\
    \ API。这种生态系统的丰富性意味着大多数集成挑战已经由社区解决并测试。`LangChain` 的核心是模块化的研究：用于顺序处理的链、用于环境交互的工具，以及在对话数字突触中维护上下文的内存系统。其丰富的组件库减少了实现常见代理模式所需的代码，让开发者专注于他们作品的独特之处。然而，`LangChain`\
    \ 的灵活性也带来了复杂性。框架大量的抽象层可能会引入性能开销，而且在没有 `LangSmith` 等适当的可观测工具的情况下，调试复杂的链可能是挑战性的。正如传统软件工程从简单的打印语句演变为结构化日志，再到全面的可观测平台一样，代理工程也需要类似的进步。此外，虽然\
    \ `LangChain` 在单代理场景中表现出色，但在复杂的多代理系统中还需要额外的编排——这就是 `LangGraph` 变得至关的地方。**参考 URL**：[`www.langchain.com/`](https://www.langchain.com/)\n\
    \n#### LangGraph：工作流可视化器\n\n"
- fmt: "\nLangGraph represents the evolution of `LangChain` into stateful, cyclical\
    \ workflows that more closely mirror human cognitive processes. While `LangChain`\
    \ chains are typically linear, `LangGraph` enables complex, branching decision\
    \ trees with loops, conditional logic, and sophisticated state management. This\
    \ visual and stateful approach significantly eases the pain points of debugging\
    \ complex agent behavior; further transparency can be achieved through dedicated\
    \ observability tools like `LangSmith` or by integrating standard `OpenTelemetry`\
    \ hooks for comprehensive tracing and monitoring. At its core, `LangGraph` models\
    \ agent workflows as directed graphs:\n\n* `Nodes` represent discrete processing\
    \ steps or agent functions\n* `Edges` define the flow between steps\n* `State`\
    \ is maintained and passed between `nodes`\n* `Conditional routing` enables dynamic\
    \ decision-making\n\nThis architecture is particularly powerful for implementing\
    \ the cognitive loop discussed in `Chapter 1*`, where agents must cycle through\
    \ perception, reasoning, planning, and action phases. Here's a practical example:\n\
    \n```python\nfrom langgraph.graph import Graph, Node\nfrom langgraph.prebuilt\
    \ import ToolExecutor\nfrom langchain.tools import DuckDuckGoSearchRun, Calculator\n\
    # Define the agent’s workflow nodes\ndef research_node(state):\n    \"\"\"Gather\
    \ information about the topic.\"\"\"\n    query = state.get(\"user_query\")\n\
    \    search_tool = DuckDuckGoSearchRun()  # safer to specify\n    research_results\
    \ = search_tool.run(query)\n    return {\"research_data\": research_results, \"\
    next\": \"analyze\"}\ndef analyze_node(state):\n    \"\"\"Analyze the gathered\
    \ information.\"\"\"\n    research_data = state.get(\"research_data\")\n    #\
    \ In a real system, plug in LLM/analysis logic here\n    analysis = f\"Analysis\
    \ of: {research_data[:200]}...\"\n    return {\"analysis\": analysis, \"next\"\
    : \"decide\"}\ndef decide_node(state):\n    \"\"\"Decide whether more research\
    \ is needed.\"\"\"\n    analysis = state.get(\"analysis\")\n    # Loop condition\
    \ with optional MAX_ITER\n    if \"insufficient data\" in analysis.lower():\n\
    \        if state.get(\"loop_count\", 0) >= 3:  # prevent infinite loop\n    \
    \        return {\"next\": \"respond\"}\n        return {\n            \"next\"\
    : \"research\",\n            \"loop_count\": state.get(\"loop_count\", 0) + 1\n\
    \        }\n    else:\n        return {\"next\": \"respond\"}\ndef respond_node(state):\n\
    \    \"\"\"Generate final response.\"\"\"\n    analysis = state.get(\"analysis\"\
    )\n    response = f\"Based on my research and analysis: {analysis}\"\n    return\
    \ {\"final_response\": response, \"next\": \"END\"}\n# Build the graph\nworkflow\
    \ = Graph()\nworkflow.add_node(\"research\", research_node)\nworkflow.add_node(\"\
    analyze\", analyze_node)\nworkflow.add_node(\"decide\", decide_node)\nworkflow.add_node(\"\
    respond\", respond_node)\n# Define transitions\nworkflow.add_edge(\"research\"\
    , \"analyze\")\nworkflow.add_edge(\"analyze\", \"decide\")\nworkflow.add_conditional_edges(\"\
    decide\", lambda state: {\n    \"research\": \"research\" if state.get(\"next\"\
    ) == \"research\" else None,\n    \"respond\": \"respond\"\n})\nworkflow.set_entry_point(\"\
    research\")\nworkflow.set_finish_point(\"respond\")\n# Compile and run\napp =\
    \ workflow.compile()\nresult = app.invoke({\"user_query\": \"Latest developments\
    \ in quantum computing\"})\nprint(result)\n```\n\nThis example demonstrates `LangGraph`'s\
    \ key advantages: the agent can intelligently loop back to gather more information\
    \ if the initial analysis is insufficient, maintaining state throughout the process.\
    \ This cyclical capability is crucial for implementing sophisticated reasoning\
    \ patterns that simple chains cannot achieve. `LangGraph` excels in several critical\
    \ areas where traditional `LangChain` falls short:\n\n* Multi-step reasoning with\
    \ conditional branching\n* Human-in-the-loop workflows with approval gates: `LangGraph`\
    \ allows developers to design nodes that pause execution and await external input\
    \ or human review, such as an approval before a financial transaction, before\
    \ proceeding. This enables agents to collaborate with humans on critical decisions\
    \ or complex tasks\n* Complex multi-agent coordination and handoffs\n* Persistent\
    \ state management across long-running processes\n* Sophisticated error handling\
    \ and retry logic\n\nThe framework also provides powerful debugging and visualization\
    \ capabilities:\n\n```python\n# Visualize the workflow\nfrom langgraph.graph import\
    \ draw_mermaid\n# Generate a Mermaid diagram of the workflow\ngraph_diagram =\
    \ draw_mermaid(workflow.get_graph())\nprint(graph_diagram)  # Shows the visual\
    \ flow of your agent's logic\n```\n\n`LangGraph`'s state management is particularly\
    \ sophisticated, supporting both simple dictionary states and complex, typed state\
    \ schemas:\n\n```python\nfrom typing import TypedDict, List\nfrom langgraph.graph\
    \ import Graph\nclass AgentState(TypedDict):\n    user_input: str\n    research_results:\
    \ List[str]\n    analysis_confidence: float\n    iteration_count: int\n    final_response:\
    \ str\n# The graph maintains this typed state throughout execution\n```\n\n`LangGraph`\
    \ extends `LangChain` into a graph-based architecture, treating agent steps as\
    \ nodes in a directed acyclic graph. This visualization of reasoning paths provides\
    \ unprecedented transparency into agent decision processes. In practical implementations,\
    \ `LangGraph` offers precise control over multi-step agent tasks, excelling in\
    \ complex workflows with branching paths, advanced error handling, and state management\
    \ requirements. While it has a steeper learning curve than simpler frameworks,\
    \ the investment pays dividends in complex enterprise applications. Throughout\
    \ the remaining chapters of this book, we'll be using `LangGraph` extensively\
    \ for implementing sophisticated agent workflows, from simple sequential processes\
    \ to complex multi-agent orchestrations. Its combination of flexibility, observability,\
    \ and state management makes it ideal for building production-grade agent systems.\n"
