  trans: '


    -   **编排**：“连接的代理体”负责管理工具调用、更新线程状态并处理重试。Azure AI Foundry 支持具有内置代理体间消息传递的多代理体协作。Azure
    Logic Apps 是一种类似于 AWS Step Functions 的无服务器工作流引擎，适用于定义 LLM 代理流并与各种服务集成。Azure Durable
    Functions（Azure Functions 的扩展）允许通过代码编写编排函数以处理复杂的序列。Azure AI Studio Prompt Flow
    提供了一个可视化画布，用于链接提示词和 Python 代码节点。

    -   **信任**：企业级功能确保了可靠性，包括通过 Microsoft Entra 进行身份管理、基于角色的访问控制 (RBAC)、内容过滤、加密和网络隔离。

    -   **观测性**：AI Foundry 捕获日志、跟踪和评估，具有全线程级可见性并与 Azure Application Insights 集成。


    Azure 还提供了“OpenAI on Your Data”，这是在 Azure AI Studio 中用于 RAG 的简化设置方案，它可以自动使用 Azure
    Cognitive Search 为聊天模型索引并检索数据。


    ### 在 Azure 上集成开源框架


    Azure AI Foundry Agent Service 显式支持结合各种开源 SDK：


    -   **Semantic Kernel**：Semantic Kernel 中的 `AzureAIAgent` 提供了高级的对话能力和无缝的工具集成，专注于企业级就绪性、安全合规性。

    -   **AutoGen**：由微软研究院开发，AutoGen 将一切构化为专业代理体之间的异步对话，适用于多轮对话和实时工具调用。Azure AI Agent
    Service 可以将 AutoGen 中定义的单个代理体编排成复杂的多代理体工作流。

    -   **LangChain**：虽然集成深度不如 Semantic Kernel 或 AutoGen，但 LangChain 代理体可以部署在 Azure
    的计算服务（如 Azure Container Apps Dynamic Sessions）上，以为代码解释器提供安全的沙箱环境。


    ### 在 Azure 上的部署架构


    Azure 提供了灵活的部署选项：


    -   **无服务器 (Azure Functions, Azure Container Apps)**：Azure Functions 适用于部署 Semantic
    Kernel SDK 和 AutoGen 多代理体应用，提供自动扩展和成本效益。Azure Container Apps 可以托管带有 AI 代理的 Web
    端聊天应用程序，并为代码执行提供安全隔离的沙箱环境。

    -   **容器化 (Azure Kubernetes Service - AKS)**：AKS 是一种托管的 Kubernetes 服务，非常适用于需要大规模容器编排和对
    Kubernetes 环境进行深度控制的复杂分布式应用。


    ### Google Cloud：AI 创新中心


    Google Cloud 利用其在 AI 研究领域的领先地位和基础设施实力，提供高度可扩展且成本效益的 AI 服务，并战略性地关注互操作性和企业搜索。


    #### 原生工具：Agentspace, Vertex AI Agent Builder/Engine/ADK


    Google Cloud 的 LLM 中心是 `Vertex AI`，特别是其生成式 AI 产品，如 PaLM 2 和即将推出的 Gemini 模型系列。Vertex
    AI 还通过其 Model Garden 包含了 Meta 的 Llama 2 等特定的外部模型。Google Cloud 提供了一套用于构建和部署 LLM
    代理体的集成服务：


    -   **Agentspace**：用于企业工作的搜索和 AI 代理体中心，将应用程序连接到 Google 品的多模态搜索和 AI 代理体。它包含“代理设计器”（Agent
    Designer）和“代理库”（Agent Gallery）。注意 Agentspace 目前处于私测预览阶段。

    -   **Vertex AI Agent Builder**：用于发现、构建和部署 AI 代理体的全面功能 set。

    -   **代理体开发包 (ADK)**：一个开源、框架无关的框架，通过对代理体行为的精确控制，简化了复杂的多代理体系统的创建。它驱动了 Agentspace
    并简化了多代理体传输和规划。

    -   **Vertex AI Agent Engine**：一种全托管的 Google Cloud 服务，用于在生产环境中部署、管理和扩展 AI 代理体。它抽象了低级任务，并处理基础设施、扩展、安全、评估和监控。

    -   **Agent2Agent (A2A) 协议**：Google 正在积极开发开放的 A2A 协议，以实现 AI 代理体之间的互操作性，无论其底层框架或供应商为何。

    -   **模型上下文协议 (MCP)**：Google Cloud 还支持 MCP，这是一种代理体以标准化方式连接并利用外部工具及数据源开放开放。


    Google Cloud 的代理工具适用于多种用例，包括企业搜索、内容生成和自动化。作为 Agent Builder 的部分的 Vertex AI 扩展允许代理体连接到
    Google Workspace 和其他外部 API。


    ### 在 Google Cloud 上集成开源框架


    Vertex AI Agent Engine 设计为与框架无关，为流行的开源 LLM 框架提供灵活支持：


    -   **LangChain, LangGraph**：Vertex AI Agent Engine 提供与 LangChain 和 LangGraph
    的完全集成。LangChain 也可以通过 `LangServe` 部署在 Google Cloud Run 和 Google Kubernetes Engine
    (GKE) 上。

    -   **AutoGen, LlamaIndex**：通过 Vertex AI SDK 与托管模板集成的支持。

    -   **CrewAI**：通过 Vertex AI Agent Engine 上的自定义模板支持。


    Google 对 `ADK` 和 A2A 协议等开源工具的关注旨在为 AI 代理体培养更广泛、更互操作的生态系统，减少供应商锁定。


    ### 在 Google Cloud 上的部署架构


    Google Cloud 提供了灵活且可扩展的部署选项：


    -   **无服务器 (Cloud Run)**：一个全托管无服务器平台，为 AI 应用负载和代理体提供可扩展的环境。它根据需要自动扩展实例，提供按需付费模型，并与
    Gemini API 或 Vertex AI 端点集成。Cloud Run 可以配置为沙箱化代码执行。

    -   **容器化 (Google Kubernetes Engine - GKE)**：GKE 是一种托管的 Kubernetes 服务，适用于复杂的微服务架构、有状态应用以及需要自定义基础设施或网络配置的负载。`LangServe`
    可以简化 GKE 上的 LangChain 部署。Cloud Run 和 GKE 提供了高移植性，允许在两者之间运行相同的容器镜像。


    对于核心代理体推理之外的任务（如模型训练、微调和持续 RAG 更新）的健壮工作流编排，`Vertex AI Pipelines` 提供了一种定义和执行这些复杂
    ML 工作流的托管服务。


    ### 云平台选择建议


    “最佳”的云平台取决于特定的项目需求和现有的组织基础设施：


    -   **对于 AWS**：适用于已深耕 AWS 生态系统的组织，重视灵活性、多样化模型以及与现有 AWS 服务和数据湖的深度集成。它对多代理体协作和边缘分布式推理的关注使其适用于复杂、大规模的部署。

    -   **对于 Azure**：当必须使用尖端 OpenAI 模型（GPT-4），或需要将 AI 集成到以微软为中心的组织（Office 365, Dynamics,
    Teams, SharePoint）时是首选平台。Azure AI Foundry 提供了统一的平台体验，对代理体具有强大的治理和身份管理，吸引优先考虑简化运营和合规性的用户。

    -   **对于 Google Cloud**：对于那些重视成本效益的扩展、Google 的 AI 研究优势以及更强调开放标准和易工具连接的“整体”代理平台的人来说是一个强有竞争者。它在企业搜索和多模态
    AI 方面的优势，结合 Cloud Run 等快速部署选项，使其对偏好编码与托管服务混合的开发者具有吸引力。


