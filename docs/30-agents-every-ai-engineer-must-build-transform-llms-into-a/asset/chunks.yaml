  trans: "\n这一定义为整合感知、规划、行动和学习的架构奠定了基础。在企业应用中，代理（agents）越来越多地部署为数字员工——处理客户入职、处理发票、管理工作流——每个代理都具有持久状态、内存和反馈机制。AI\
    \ 代理的发展史可以分为不同的技术时代：\n\n*   **1970s–1980s**：基于规则的专家系统，例如 `MYCIN`（斯坦福大学开发的一种用于诊断血液感染和推荐抗生素的系统），使用基于逻辑的推理引擎来解决定义狭义的问题。尽管具有确定性的精度，但这些系统是脆弱且缺乏灵活性的。\n\
    *   **1990s**：决策树和 `SVMs` 等经典机器学习方法引入了模式识别能力。虽然比规则系统更具适应性，但它们仍然是特定任务的且无状态的。\n\
    *   **2010s**：深度学习彻底改变了数据感知。语音识别、图像分析和翻译达到了人类水平。然而，这些模型在很大程度上是响应式的，设计用于输入输出预测，而非自主行为。\n\
    *   **2020s 及以后**：`大语言模型` (`LLMs`——在海量文本数据集上训练以理解和生成人类语言的 AI 系统）以及 `transformers`（擅长处理顺序数据的神经网络架构）的出现，引入了涌现推理、自然语言生成和少样本学习。然而，早期的\
    \ `LLMs` 受限于上下文大小、缺乏内存和工具集成。\n\n虽然 AI 领域的许多最新进展——例如 `检索增强生成` (`RAG`)、外部工具使用、API\
    \ 编排和内存系统——其本身具有至关重要的作用，但它们也是构建更强大的自主代理的关键赋能者。诸如 `LangGraph`、`CrewAI` 和 `AutoGen`\
    \ 等框架支持规划、决策和实时交互，使代理能够在开放式环境中完成多步目标。例如，在客户支持领域，这种演变是巨大的：\n\n*   **2010**：静态 FAQ\
    \ 脚本为常见问题提供预定义的答复，任何偏离都需要人工干预。\n*   **2018**：基于机器学习的工单路由系统可以分类并将支持请求分配给相应部门，但仍需人工解决。\n\
    *   **2025**：先进的多代理系统现在在生产部署中已显示出 70-85% 的解决率（基于 Zendesk、Intercom 和 ServiceNow\
    \ 等公司的实现），集成了用于自然对话的 `LLMs`、用于个性化上下文的账户系统以及当前信息的实时知识库。\n\n这种演进轨迹（*图 1.1* 所示）强调了传统\
    \ AI 应用与真正的自主代理系统之间根本的架构和哲学区别——这些差异远超技术实现，延伸到这些系统运行、学习以及与环境交互的方式。这些架构转变不仅是学术上的——它们转化为可衡量的业务成果，如降低支持成本、提高首次接触解决率、更快的入职以及跨客户触点的扩展扩展性。\n\
    \n![Figure 1.1 – Evolution of AI agent technologies](img/file1.png)\n\n图 1.1 –\
    \ AI 代理技术的演进\n\n在追踪了 AI 代理从基于规则系统到今天复杂的自主实体的历史演变后，我们现在转向研究这种智能行为的结构基础。理解代理是如何构建的——认知循环、通信模式以及将计算系统转换为目标导向实体的设计选择——对于构建有效的代理解决方案至关重要。\n\
    \n## 代理的架构\n\n智能代理的架构设计标志着从过程化逻辑向认知驱动计算的根本转变。与响应定义输入而执行静态指令的传统软件系统不同，代理在动态环境中持续运行，做出实时决策，维持持久内存并随着时间调整其策略。核心在于，代理的架构必须将关键认知功能——`感知`、`推理`、`规划`、`行动`和`学习`集成到一个模块化的、有状态的框架中，该框架同时支持响应和深思。这通常从已有的\
    \ AI 范式中汲取灵感：例如 `BDI`（信念-愿望-意图）等模型为代理管理其对世界的信念、愿望（目标）和意图（选定的计划）提供了一个框架。同样，将符号推理（处理显式知识和逻辑规则，通常用于规划和决策）与神经网络（擅长模式识别和从数据中学习）相结合的混合方法，使代理形成稳健的内部表示，对复杂目标进行有效推理，并在追求长期目标的过程中协调复杂的工具使用。在实践中，这意味着设计分离关注点的系统：感知模块与传感器或\
    \ API 接口；规划引擎分解目标；内存子系统管理历史和语义上下文；执行层与工具、服务或其他代理接口。诸如 `LangGraph` 和 `CrewAI` 等框架通过提供可组合的运行时环境实现了这些原则，代理可以在这些环境中跨会话维护状态、使用图编排工作流并自主运行。这种架构的凝聚力是将代理从响应式机器人转变为能够应对开放现实世界复杂的智能系统的关键。为了理解这种架构愿景如何转化为实际实现，我们检查了三个基础要素：驱动代理决策的认知循环、实现组件间无缝交互的通信模式，以及决定代理如何将感知转化为行动的设计模式。\n\
    \n### 认知循环\n\n智能代理的认知架构定义了感知如何通过结构化、可重复的过程转化为有目的的行动。这种设计的内核是`认知循环`（cognitive loop）——感知、推理、规划、行动和学习的持续循环——它使代理能够在动态环境中运行。正如*图\
    \ 1.2* 所示，这个循环形成了智能代理行为的骨干，提供了做出决策、执行行动以及随时间积累知识的支架。\n\n![Figure 1.2 – Cognitive\
    \ architecture of intelligent agents](img/file2.png)\n\n图 1.2 – 智能代理的认知架构\n\n\
    为了理解这种架构在实践中如何运作，让我们详细探索认知循环的每个阶段——从`感知`开始，这是塑造后续所有步骤的关键第一步：\n\n1. **感知**通过从环境中捕获数据（无论是通过用户输入、API、传感器还是外部系统）并将其转换为适合处理的结构化格式启动循环。这些原始输入形成了后续认知步骤的基础，并决定了代理情境感知范围。\n\
    \n```\n# Example：客户服务代理中的感知\ndef perceive_input(user_message, context):\n    return\
    \ {\n        \"message\": user_message,\n        \"timestamp\": datetime.now(),\n\
    \        \"user_id\": context.get(\"user_id\"),\n        \"session_state\": context.get(\"\
    session\"),\n        \"sentiment\": analyze_sentiment(user_message)\n    }\n```\n"
- fmt: "\n### 1. Reasoning\n`Reasoning` follows by contextualizing this perceived\
    \ information, applying pattern recognition, inference engines, or statistical\
    \ models to extract meaning and relevance. This stage transforms signals into\
    \ insights, allowing the agent to understand not just what is happening, but why\
    \ it matters.\n\n```python# Example: Reasoning about customer intent\ndef reason_about_intent(perception_data):\n\
    \    intent = classify_intent(perception_data[\"message\"])\n    priority = determine_priority(\n\
    \        intent,\n        perception_data[\"sentiment\"],\n        user_history=get_user_history(perception_data[\"\
    user_id\"])\n    )\n    return {\"intent\": intent, \"priority\": priority, \"\
    context\": perception_data}\n```\n\n### 2. Planning\n`Planning` orchestrates these\
    \ insights into a coherent sequence of actions. Whether using deterministic rule\
    \ chains or probabilistic models, the agent decomposes objectives into tasks,\
    \ evaluates options, and prioritizes steps in accordance with predefined goals\
    \ and environmental conditions.\n\n```python\n# Example: Planning response strategy\n\
    def create_action_plan(reasoning_result):\n    if reasoning_result[\"intent\"\
    ] == \"billing_issue\":\n        return [\n            \"fetch_account_details\"\
    ,\n            \"analyze_billing_history\",\n            \"generate_explanation\"\
    ,\n            \"offer_resolution\"\n        ]\n    elif reasoning_result[\"priority\"\
    ] == \"urgent\":\n        return [\"escalate_to_human\", \"log_urgent_case\"]\n\
    ```\n\n### 3. Action\n`Action` then executes the selected steps, interfacing with\
    \ external tools, APIs, databases, or systems to operationalize the agent's decisions.\
    \ This phase is often implemented using function-calling frameworks or tool orchestration\
    \ layers such as those found in `LangChain` or `LangGraph`.\n\n```python\n# Example:\
    \ Action execution\ndef execute_action(action_plan, context):\n    results = []\n\
    \    for action in action_plan:\n        if action == \"fetch_account_details\"\
    :\n            result = billing_api.get_account(context[\"user_id\"])\n      \
    \  elif action == \"generate_explanation\":\n            result = llm.generate_response(context,\
    \ results)\n        results.append(result)\n    return results\n```\n\n### 4.\
    \ Learning\n`Learning` closes the loop by analyzing outcomes, measuring the success\
    \ of actions, and updating internal models or memory stores. This feedback mechanism\
    \ allows the agent to refine its behavior over time, improving performance based\
    \ on both successes and failures.\n\n```python\n# Example: Learning from interaction\n\
    def learn_from_outcome(interaction_data, user_feedback):\n    success_score =\
    \ calculate_success(user_feedback)\n    update_user_preferences(interaction_data[\"\
    user_id\"], success_score)\n    if success_score < 0.7:\n        flag_for_model_improvement(interaction_data)\n\
    ```\n\nAs seen in `Figure 1.2`, these phases form a feedback-driven system rather\
    \ than a linear pipeline. Each component influences and is influenced by others,\
    \ enabling the agent to adapt to new data, unforeseen conditions, and evolving\
    \ goals. In practice, this architecture supports applications ranging from customer\
    \ engagement agents that tailor responses based on prior interactions, to supply\
    \ chain agents that continuously adjust operations based on shifting constraints.\
    \ This modular yet interdependent structure—where sensing leads to understanding,\
    \ planning leads to execution, and learning closes the loop—is what elevates agents\
    \ from automated scripts to intelligent, adaptive systems. Understanding this\
    \ architecture is essential for designing agents capable of long-horizon objectives,\
    \ contextual decision-making, and real-world autonomy.\n\n### Communication patterns\
    \ between components\n\nAn intelligent agent is not defined solely by the sophistication\
    \ of its reasoning engine or the accuracy of its outputs, but also by the integrity\
    \ of the communication pathways that bind its internal components. These pathways—illustrated\
    \ in `Figure 1.3`—form the nervous system of cognition, transforming disjointed\
    \ subsystems into unified, adaptive intelligence.\n\n![Figure 1.3 – Communication\
    \ patterns in agent cognitive architecture](media/file3.png)\n\nFigure 1.3 – Communication\
    \ patterns in agent cognitive architecture\n\nAt the center of this architecture\
    \ lies the `Cognition Core`, the executive coordinator responsible for synthesizing\
    \ input from other modules, resolving conflicts, orchestrating actions, and maintaining\
    \ coherence across the agent's state. Every major function—reasoning, planning,\
    \ memory, and interaction—is mediated through this core, which acts less like\
    \ a centralized command and more like a dynamic broker of task-relevant signals.\n\
    \n> In real-world deployments, this central role can introduce concerns about\
    \ single points of failure. Robust implementations typically address this through\
    \ redundancy, distributed coordination layers, and health-check mechanisms that\
    \ ensure the `Cognition Core` can recover from crashes, load spikes, or degraded\
    \ components. Some frameworks implement fallback nodes, heartbeat signals, or\
    \ cloud-native orchestration to guarantee uptime and responsiveness in production\
    \ environments.\n\nSurrounding the core are five foundational communication layers,\
    \ each representing a distinct functional role:\n\n*   **Profile/Persona**: This\
    \ layer defines the agent’s character—its tone, behavioral constraints, and system-level\
    \ alignment with user intent. In implementation terms, this might take the form\
    \ of system prompts or role templates, acting as an initialization boundary that\
    \ informs how the agent interprets ambiguity, enforces guardrails, and communicates\
    \ with users. Notably, this layer is not static; it responds to evolving context\
    \ and can be updated during runtime to reflect changes in audience, task, or ethical\
    \ parameters.\n\n*   **Tool Use/Action Interface**: This connects the agent’s\
    \ internal deliberations with the external world. Reasoned intent is transformed\
    \ here into tool invocations, API calls, or system commands. This channel handles\
    \ both the dispatch of actions and the interpretation of their results, feeding\
    \ execution feedback back into the cognition loop. In production systems, this\
    \ is often the most latency-sensitive component and requires robust error handling,\
    \ retry logic, and observability pipelines.\n\n*   **Planning/Feedback**: This\
    \ module provides forward-looking strategy and backward-looking correction. Goals\
    \ are decomposed into task graphs, prioritized based on constraints, and monitored\
    \ for success or failure. When an outcome deviates from expectations—say, a hotel\
    \ booking fails or a response from an API times out—this layer triggers replanning.\
    \ This feedback loop is essential for long-horizon autonomy and is often orchestrated\
    \ using frameworks like `LangGraph`.\n\n*   **Knowledge/Memory**: This layer is\
    \ the agent’s temporal substrate. It comprises short-term working memory, long-term\
    \ knowledge stores, and episodic recall systems. These components allow the agent\
    \ to ground its behavior in history, recall prior tasks, reuse contextual constraints,\
    \ and deliver coherent behavior over time. Architecturally, memory is accessed\
    \ asynchronously, enabling the agent to preserve real-time responsiveness while\
    \ retrieving deep context in the background. To minimize latency and ensure consistent\
    \ real-time responsiveness, production-grade agents often employ caching strategies\
    \ for frequently accessed knowledge (e.g., user profiles or recent interactions),\
    \ as well as vector index prefetching or approximate nearest-neighbor (ANN) search\
    \ techniques. Additionally, memory systems may implement time-to-live (TTL) caching,\
    \ request batching, or tiered memory (e.g., short-term vs. long-term) to balance\
    \ depth of context retrieval with speed.\n"
