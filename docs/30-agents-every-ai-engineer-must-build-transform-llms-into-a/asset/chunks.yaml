  trans: "\n这些协议共同构建了动态、可插拔且具韧性的系统，能够在跨能力和组织边界进行扩展。在真实的生产系统中，`versioning and schema\
    \ management`对于确保长期稳定性至关重要。`MCP` 和 `A2A` 等协议通常依赖于`contract-based designs`，使用 `OpenAPI`\
    \ 规范、`Protocol Buffers` 或 `JSON Schema` 等技术来定义消息格式和服务能力。对这些契约进行显式版本控制允许系统保持向后兼容，在代理与服务之间协商能力，并优雅地处理更新引起的不匹配。这确保了新版本的代理可以与旧组件及外部\
    \ API 安全地交互——这对于随着时间推移维护健壮且演化的系统至关重要。\n\n## 模型上下文协议 (MCP)\n\n`MCP` 定义了一个通用框架，代理通过该框架发现、评估并调用外部能力。如图\
    \ 1.6 所示，`MCP` 引入了一个`universal interface layer` 来抽象外部服务，通过三个关键操作将其暴露：\n\n* **能力描述**：每个工具都以机器可读的格式注册其功能和元数据（输入、输出、约束）。例如，一个简单的\
    \ `JSON schema` 可以定义天气检索工具的能力：\n\n```json{\n  \"name\": \"SearchFlights\",\n \
    \ \"description\": \"Retrieve available flight options based on input parameters\"\
    ,\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n \
    \     \"origin\": { \"type\": \"string\" },\n      \"destination\": { \"type\"\
    : \"string\" },\n      \"departure_date\": { \"type\": \"string\", \"format\"\
    : \"date\" }\n    },\n    \"required\": [\"origin\", \"destination\", \"departure_date\"\
    ]\n  },\n  \"output_schema\": {\n    \"type\": \"array\",\n    \"items\": {\n\
    \      \"type\": \"object\",\n      \"properties\": {\n        \"airline\": {\
    \ \"type\": \"string\" },\n        \"price\": { \"type\": \"number\" },\n    \
    \    \"duration\": { \"type\": \"string\" }\n      }\n    }\n  }\n}\n```\n\n*\
    \ **发现**：代理查询通用层，根据当前任务需求和能力元数据识别合适的工具。\n\n* **调用**：一旦选定工具，代理通过标准化协议调用它，而无需特定工具的集成。\n\
    \n![Figure 1.6 – Model Context Protocol](img/file6.png)\n\nFigure 1.6 – 模型上下文协议\n\
    \n这种架构使得代理能够独立于硬编码的服务逻辑运行，实现了即插即用的集成。可以动态引入新工具，并在不影响代理核心逻辑的情况下更新旧工具。例如，执行产品研究的代理可以查询市场数据\
    \ API、评估情感分析器或调用摘要引擎——所有操作都通过同一种接口模式实现。`MCP` 还促进了跨代理的工具复用，确保工具注册不会在代理网络中重复。这创建了全组织范围的能力注册表，促进了标准化、治理和更快的集成周期。\n\
    \n## 代理到代理 (A2A) 协议\n\n虽然 `MCP` 管理的是代理与服务之间的垂直交互，但 `A2A` 协议促进了对等之间的协作。这些协议格式化了在共享环境中运行的代理之间的消息交换，它们能够共享状态、分配角色并异步协调任务。在设计此类系统时，考虑各种一致性模型（例如强一致性、最终一致性）至关重要，以确保共享状态在代理之间得到适当同步，平衡数据完整性与性能需求。如图\
    \ 1.7 所示，代理使用包含以下内容的结构化消息包进行通信：\n\n* **状态 (State)**：包含代理共享的上下文数据和中间结果，以维持团队的情境感知。\n\
    \n* **角色 (Role)**：包含功能性定义和职责，定义了每个代理在协作工作流中的位置和能力。\n\n* **状态 (Status)**：包含生命周期更新，包括成功、失败或就绪指示，让所有代理了解任务进度和系统健康。\n\
    \n![Figure 1.7 – Agent-to-Agent protocols](img/file7.png)\n\nFigure 1.7 – 代理到代理协议\n\
    \n这种架构允许代理团队：\n\n* 分配专门任务（例如研究、验证、质量保证）。\n* 在保持协调的同时进行异步操作。\n* 通过动态向备份代理分配角色来从故障中恢复。\n\
    \n例如，在客户服务自动化流水线中，分拣代理可能会将订单传递给账单专家，后者随后将案件转发给合规性验证器。这些交互在没有中心化编排的情况下发生——代理使用共享协议规则做出局部决策，促进了容错性、并行性和自愈工作流。诸如\
    \ `CrewAI` 和 `LangGraph` 等框架提供了对 `A2A` 模式的原支持，通过基于 Actor 模型、状态通道和发布/订阅消息实现结构化交互。流行的开源系统如\
    \ `NATS`、`RabbitMQ` 和 `Apache Kafka` 通常用于实现这些消息层，实现分布式代理之间可靠且可扩展的通信。在建立了对代理架构和通信协议的稳固理解后，我们现在检查通过结构化开发方法论将这些智能系统从概念推向生产的实际过程。\n\
    \n## 代理开发生命周期\n\n自主代理的发展遵循一个结构化的迭代生命周期，这作为一个路线图——但它从根本上区别于传统的软件工程实践。与依赖静态逻辑和预定义行为的过程系统不同，智能代理必须在动态、不确定的环境中运行。它们解释模糊的输入，在不确定的情况下做出决策，调用外部工具并通过反馈不断完善其行为。这些演化的、目标导向的行为需要不仅是迭代的，而且是深度适应的生命周期模型——支持推理、学习、记忆和编排。代理开发生命周期（`ADL`）的设计是为了满足这一需求，提供了一个镜像现代基于代理系统操作复杂性的灵活框架。本节概述了\
    \ `ADL`——一个从早期概念化到部署后完善的实用框架。它为开发者和组织构建健壮、目标目标且随时间不断改进的代理系统提供了路线图。\n\n接下来的子章节将详细探讨该生命周期的每个阶段，研究代理开发与传统软件工程方法不同的独特考虑和最佳实践。\n\
    \n### 概念化与需求分析\n\n"
- fmt: '

    Agent development begins with defining the problem space and articulating the
    agent’s goals in context. This is more than requirements gathering—it’s an exercise
    in modeling a cognitive workload, meaning the mental processes the agent must
    simulate or manage in order to operate intelligently. This includes tracking user
    intent, interpreting environmental signals, selecting appropriate strategies,
    and updating plans based on feedback—functions traditionally associated with human
    cognition. Developers must analyze the domain, understand the user''s intent,
    and assess the capabilities the agent will require to operate effectively. Unlike
    static applications, agent goals may evolve and must be formulated with sufficient
    flexibility to accommodate environmental changes and emerging requirements.


    In this stage, developers identify the operating environment, map objectives into
    achievable sub-goals, and determine the ethical, technical, and operational boundaries.
    For instance, an agent assisting in regulatory compliance may require explicit
    constraints on behavior that are both encoded into rules and monitored during
    execution. Importantly, this phase includes evaluating success metrics—performance,
    alignment, and user trust—all of which guide future decisions in architecture
    and implementation. To summarize, key activities in this conceptualization phase
    include:


    *   Defining clear, high-level agent goals.

    *   Mapping these goals into achievable sub-goals or tasks.

    *   Setting measurable success metrics (e.g., performance, alignment, user trust)
    to guide development and evaluation.


    ### Architecture and design


    Once the objectives are well-scoped, the agent’s internal architecture is designed
    to support them. As discussed in `Architecture of agents` section, this includes
    choosing between cognitive models—such as `ReAct`, `plan-and-execute`, or `BDI`—and
    specifying components responsible for sensing, planning, acting, and learning.
    The architecture must balance modularity, autonomy, and extensibility. In this
    stage, agent designers define memory strategies (short-term, long-term, episodic),
    internal communication flows, and interaction points with external systems. Just
    as importantly, they ensure the agent can interoperate via established protocols
    and persist state across sessions. Security and safety mechanisms are integrated
    from the start, not as afterthoughts. This design phase forms the conceptual and
    technical backbone of the entire system. To ensure traceability and informed iteration,
    many teams adopt `Architecture Decision Records` (`ADRs`) to document key design
    decisions—such as why a particular memory model, orchestration strategy, or protocol
    framework was selected. This helps future contributors understand tradeoffs, revisit
    past assumptions, and evolve agent architectures without losing institutional
    knowledge.


    ### Implementation and integration


    Implementation brings the architecture to life using development frameworks such
    as `LangChain`, `CrewAI`, or `LangGraph`. Developers construct modules for reasoning,
    perception, planning, and memory, and bind them through workflow graphs or event-driven
    engines. Function calling APIs, memory databases, and orchestration layers are
    stitched together using open toolchains. The focus here is on cohesion and correctness—modules
    must interact predictably, and the agent’s behavior must match its defined goals.
    Developers run local simulations or stage deployments to test the interaction
    of cognitive components under load. It’s at this point that real-world constraints
    emerge—latency, context limits, token usage—and require engineering trade-offs
    to balance capability with cost. To support robust iteration, teams often integrate
    agent behavior testing into CI/CD pipelines. These pipelines validate cognitive
    workflows (e.g., reasoning chains, tool calls, memory usage) using automated test
    harnesses, synthetic prompts, and simulated failure cases—ensuring stability across
    deployments and catching regressions early.


    ### Evaluation and optimization


    After deployment in a testing or controlled environment, agents must be rigorously
    evaluated. Unlike conventional systems, success is not always binary. Performance
    metrics include task completion rates, decision quality, and robustness under
    ambiguity. Evaluation may involve synthetic environments or production shadows,
    with extensive logging and telemetry pipelines in place. Feedback from internal
    reflection mechanisms—such as confidence scoring or critique loops—is coupled
    with external signals like user satisfaction and tool performance. These insights
    feed back into the architecture, enabling adaptive changes. Optimization in this
    phase may include refining planning depth, adjusting context window strategies,
    or improving memory relevance scoring. Typical optimization metrics include `task
    success rate`, `average response time`, `user satisfaction scores`, `tool invocation
    latency`, and `fallback frequency` (how often the agent defers or fails). Tracking
    these metrics enables teams to iteratively improve agent quality based on both
    performance and user trust signals.


    ### Governance and lifecycle management


    Deploying an agent is not the end of its development but the beginning of a continuous
    improvement loop. Lifecycle management includes proactive monitoring, log auditing,
    model updating, and failure recovery. Governance also encompasses security patching,
    compliance auditing, and ethical oversight—ensuring the agent remains reliable,
    transparent, and aligned with human intent. This phase encompasses both the monitoring
    and iterative improvement processes. Agents deployed at scale must support observability
    and incident response. Tools such as `LangSmith` or `Prometheus` provide real-time
    insights into agent performance and health. Furthermore, policies for model retraining,
    versioning, and rollback ensure that system changes are deliberate and recoverable.
    Continuous iteration based on performance data, user feedback, and changing requirements
    ensures that agents evolve and improve over their operational lifetime. This is
    critical in mission-critical domains like finance, legal, or healthcare, where
    unexpected behavior can have significant consequences. For example, logs from
    `LangSmith` or `Prometheus` might reveal a drop in tool invocation success rates
    or an increase in hallucinated outputs. This can trigger alerts, initiate human
    review, and lead to adjustments in prompt design, fine-tuning, or even retraining
    the underlying model. Incorporating this loop—from `observability to auditing
    to retraining`—is essential for building resilient agents in production.


    ## Evolution of agent interaction paradigms


    As AI systems become more embedded in our daily lives and enterprise workflows,
    understanding the levels of agent interaction becomes essential for designing
    robust, scalable, and intelligent architectures. These levels represent a progression
    in agent capabilities—ranging from basic prompt-response interactions to collaborative,
    distributed agent networks. The five-level interaction paradigm framework offers
    a structured approach for analyzing agent design along three critical dimensions:
    operational autonomy, contextual awareness, and decision-making authority. It
    helps system architects, developers, and stakeholders make informed decisions
    about which type of agent architecture is most appropriate for their use case.
    The five models that follow illustrate this evolution, each grounded in a representative
    figure and defined by its interaction pattern, processing capabilities, and architectural
    complexity. To help system designers quickly assess and compare different levels
    of agent complexity, the following table summarizes the five agent interaction
    paradigms across key dimensions such as autonomy, context awareness, and decision-making
    authority.

