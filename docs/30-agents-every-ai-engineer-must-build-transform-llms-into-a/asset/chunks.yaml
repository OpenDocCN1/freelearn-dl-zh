    The ability of proxy agents to act as a controlled layer between natural user
    intent and rigid system requirements makes them ideal in safety-critical or schema-bound
    systems. For instance, they are widely used in financial services platforms to
    validate and transform client instructions, in healthcare systems to process patient
    queries into structured triage protocols, and in customer service tools to sanitize
    requests before executing backend operations. Importantly, proxy agents also mitigate
    risks associated with prompt injection or instruction manipulation. Because prompt
    templates define a clear structure and isolate user content from system directives,
    developers can enforce strict boundaries around how the model interprets and processes
    each input. While proxy agents do not manage memory or initiate long-term plans,
    their role as input optimizers is fundamental to building robust, trustworthy,
    and production-grade AI systems. In any architecture where backend services expect
    strict inputs—but users communicate naturally—a proxy agent bridges the gap with
    clarity and control.


    Proxy agents serve as translators, taking natural language inputs and turning
    them into structured data for backend execution. Their real-world applications
    include:


    * **Voice-to-command processing**: Virtual assistants like `Google Assistant`
    converting "Play my workout playlist" into structured API calls to music services.

    * **Form-fill and processing bots**: Healthcare bots that take patient free-text
    symptoms and reformat them into structured triage reports for doctors.


    ## Assistant system: The tool-augmented helper


    Assistant systems represent a substantial step forward, combining session-level
    memory, tool invocation, and user-guided autonomy. These agents not only interpret
    user requests but also have access to external tools or services that they can
    invoke to complete tasks. In `Figure 1.11`, a user requests “Book a flight to
    Paris.” The assistant system interprets this instruction and invokes appropriate
    services—such as flight APIs, booking databases, or calendar tools—to carry out
    the task. The diagram shows the assistant acting as a `task orchestrator`, capable
    of interacting with external systems through tool invocation pathways.


    ![Figure 1.11 – Assistant system](media/file11.png)


    Figure 1.11 – Assistant system


    The assistant maintains session state across turns, enabling dialog continuity,
    clarification handling, and result summarization. However, it typically operates
    with user-in-the-loop approval, seeking confirmation before taking consequential
    actions like completing bookings or initiating transactions. For example, if a
    user first says, "I want to fly to Paris next Friday," and later adds, "Also book
    a hotel near the Eiffel Tower," the assistant retains the earlier flight request
    and destination context while processing the new command. This ability to track
    and apply session variables (like destination and date) across turns allows the
    assistant to complete multi-step tasks with continuity and precision. This model
    is ideal for enterprise digital assistants, intelligent customer service bots,
    and personal productivity agents that require controlled autonomy and operational
    transparency. Assistant systems combine natural language understanding with tool
    invocation and limited session memory. Their examples in practice include:


    * **Enterprise digital assistants**: Like `Microsoft Cortana for Business`, which
    helps schedule meetings, manage emails, and fetch documents across different enterprise
    systems.

    * **Customer service bots**: Intelligent virtual assistants in banks that can
    access user account data, process simple transactions (e.g., balance inquiries,
    fund transfers), and escalate to human agents when needed.

    * **Notion AI and similar productivity agents**: these can search databases, summarize
    project notes, or create structured content templates, extending beyond single-turn
    interactions to support real productivity.


    ## Autonomous agent: The independent problem solver


    Autonomous agents mark a pivotal evolution in the design of intelligent systems.
    Moving beyond reactive tools or assistant-style interfaces that rely on step-by-step
    user input, autonomous agents possess the ability to act independently—interpreting
    goals, reasoning about strategy, invoking tools, and adjusting behavior dynamically
    in response to changes. This independence enables them to perform complex, long-horizon
    tasks in a manner that closely resembles human cognitive problem-solving. However,
    increased autonomy also introduces risks—agents operating without adequate oversight
    may misinterpret goals, pursue unintended strategies, or trigger undesirable actions.
    Therefore, safeguards such as policy constraints, human-in-the-loop checkpoints,
    or behavior monitoring mechanisms are critical to ensuring reliability in sensitive
    domains.


    At the core of their architecture lies the `SMPA loop`—a conceptual framework
    that mirrors intelligent decision-making processes. In this loop, the agent begins
    by sensing its environment, which may include user inputs, internal state changes,
    or external API responses. This information feeds into a model that maintains
    contextual memory, tracks historical actions, and represents the agent''s understanding
    of its task space. The agent then formulates a plan by decomposing high-level
    objectives into actionable steps, sequencing them based on dependencies and constraints.
    Finally, it acts by executing those steps, interacting with external systems,
    APIs, or tools, and adapting its approach as needed.


    Consider the scenario where a user issues the instruction, “Plan my trip to Paris.”
    While a conventional assistant might respond with a static list of flights or
    hotel options, an autonomous agent interprets this request as a multi-stage objective.
    It initiates a process that includes itinerary generation, hotel selection, visa
    eligibility assessment, and travel insurance procurement. Rather than treating
    each task in isolation, the agent constructs a coherent plan, identifying dependencies—for
    example, determining visa requirements before finalizing flight bookings—and executes
    the workflow end-to-end.


    Throughout this process, the agent maintains a persistent internal memory. It
    remembers user preferences, such as favored airlines or accommodation types, and
    uses that knowledge to refine decisions. If a preferred hotel is fully booked,
    it searches for alternative accommodation that meets similar criteria. If a visa
    application process introduces unforeseen delays, the agent reschedules connected
    elements of the itinerary accordingly. These adaptations are not hardcoded but
    emerge from feedback loops that assess success or failure and revise strategy
    in real time.


    ![Figure 1.12 – Autonomous agent](media/file12.png)


    Figure 1.12 – Autonomous agent

    '
