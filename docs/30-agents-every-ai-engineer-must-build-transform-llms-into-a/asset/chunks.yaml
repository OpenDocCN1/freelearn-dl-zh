  trans: "\n\n智能体（Agent）开发始于定义问题空间并在上下文中阐述智能体的目标。这不仅仅是需求收集——它是一种对认知负荷的建模练习，意味着智能体为了智能运行而必须模拟或管理的心理过程。这包括跟踪用户意图、解释环境信号、选择合适的策略以及根据反馈更新计划——这些功能在传统上与人类认知相关。开发者必须分析特定领域，理解用户意图，并评估智能体有效运行所需的能力。与静态应用程序不同，智能体的目标可能会发生演变，并且必须具有足够的灵活性，以适应环境变化和新出现的需求。\n\
    \n在这一阶段，开发者会识别运行环境，将目标映射为可实现的子目标，并确定伦理、技术和操作边界。例如，一个协助合规的智能体可能需要对行为进行显式约束，这些约束既被编码到规则中，又在执行期间受到监控。重要的是，此阶段还包括评估成功指标——性能、对齐和用户信任——所有这些指标都指导未来架构和实施的决策。总而言之，概念化阶段的关键活动包括：\n\
    \n*   定义清晰的高层级智能体目标。\n*   将这些目标映射为可实现的子目标或任务。\n*   设定可衡量的成功指标（例如：性能、对齐、用户信任）以指导开发和评估。\n\
    \n### 架构与设计\n\n一旦目标界定了良好范围，就会设计智能体的内部架构来支持这些目标。正如在 `Architecture of agents` 部分讨论的，这包括在认知模型之间进行选择——例如\
    \ `ReAct`、`plan-and-execute` 或 `BDI`——并指定负责感知、计划、行动和学习的组件。架构必须在模块化、自主性和扩展性之间取得平衡。在此阶段，智能体设计师定义内存策略（短期、长期、事件性）、内部通信流以及与外部系统的交互点。同样重要的是，他们确保智能体能够通过既定协议进行互操作，并在会话之间持久化状态。安全和防护机制从一开始就被集成，而不是事后考虑。这一设计阶段形成了整个系统的概念和技术骨干。为了确保可追溯性和信息化迭代，许多团队采用`架构决策记录`（`ADRs`）来记录关键设计决策——例如选择特定内存模型、编排策略或协议框架的原因。这有助于未来的贡献者理解权衡，重新审过去的假设，并在不丢失组织知识的情况下演进智能体架构。\n\
    \n### 实现与集成\n\n实现阶段使用 `LangChain`、`CrewAI` 或 `LangGraph` 等开发框架使架构恢复活力。开发者构建用于推理、感知、计划和内存的模块，并通过工作流图或事件驱动引擎将它们绑定。函数调用\
    \ API、内存数据库和编排层通过开源工具链缝合在一起。这里的重点是内聚性和正确性——模块必须以可预测的方式交互，智能体的行为必须符合定义的目标。开发者运行本地模拟或分阶段部署，以测试负载下认知组件的交互。正是在此时，真实世界的约束开始显现——延迟、上下文限制、token\
    \ 使用率——并需要工程权衡来平衡能力与成本。为了支持稳健迭代，团队通常将智能体行为测试集成到 CI/CD 流水线中。这些流水线使用自动化测试框架、合成提示词和模拟失败案例来验证认知工作流（例如推理链、工具调用、内存使用），确保跨部署的稳定性并尽早发现回归。\n\
    \n### 评估与优化\n\n在测试或受控环境中部署后，必须对智能体进行严格评估。与传统系统不同，成功并非总是二元的。性能指标包括任务完成率、决策质量和在模糊情况下的稳健性。评估可能涉及合成环境或生产影子，并配有完善的日志记录和遥测管道。来自内部反思机制的反馈（如信心评分或批判循环）与用户满意度和工具性能等外部信号相结合。这些见反馈回架构，实现自适应更改。此阶段的优化可能包括完善计划深度、调整上下文窗口策略或提高内存相关性评分。典型的优化指标包括`任务成功率`、`平均响应时间`、`用户满意度评分`、`工具调用延迟`和回退频率（智能体延迟或失败的频率）。跟踪这些指标允许团队根据性能和用户信任信号迭代改进智能体质量。\n\
    \n### 治理与生命周期管理\n\n部署智能体开发的结束，而是持续改进循环的开始。生命周期管理包括主动监控、日志审计、模型更新和故障恢复。治理还涵盖了安全补丁、合规审计和伦理监督——确保智能体保持可靠、透明并符合人类意图。此阶段涵盖监控和迭代改进过程。大规模部署的智能体必须支持可观测性和应急响应。诸如\
    \ `LangSmith` 或 `Prometheus` 等工具提供了对智能体性能和健康的实时洞察。此外，模型重训、版本控制和回滚策略确保系统更改是经过思虑且可恢复的。基于性能数据、用户反馈和不断变化的持续迭代确保了智能体在其运行生命周期内演进和改进。这对于金融、法律或医疗等任务关键领域至关重要，意外的行为可能会产生严重后果。例如，`LangSmith`\
    \ 或 `Prometheus` 的日志可能会显示工具调用成功率下降或幻觉输出增加。这可以触发告警、启动人工审查，并导致提示词设计、微调甚至底层模型重训的调整。纳入这种循环——从`可观测性到审计到重训`——对于构建生产环境中韧性的智能体至关重要。\n\
    \n 交互范式的演进\n\n随着 AI 系统日益融入我们的日常生活和企业工作流，理解智能体交互的级别对于设计稳健、可扩展且智能的架构变得关重要。这些级别代表了智能体能力的演进——从基础的提示响应交互到协作的分布式智能体网络。五级交互范式框架为沿三个关键维度分析智能体设计提供了一种结构化方法：操作自主性、上下文感知和决策权限。它帮助系统架构师、开发者和利益相关者就哪种智能体架构最适合其用例做出明智决策。以下五个模型说明了这种演进，每个模型都基于一个代表性图形，并由其交互模式、处理能力和架构复杂度定义。为了帮助系统设计师快速评估和比较不同层级的智能体复杂度，下表在自主性、上下文感知和决策权限等关键维度上总结了五种智能体交互范式。\n\
    \n"
- fmt: "\n| **Level** | **Agent Type** | **Operational Autonomy** | **Contextual Awareness**\
    \ | **Decision-Making Authority** | **Typical Use Case** |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| 1 | Direct LLM Interaction | Stateless / None | None\
    \ | Human-led | One-off Q&A, creative generation |\n| 2 | Proxy Agent | Low |\
    \ Light contextualization | Instruction-based | API parameterization, semantic\
    \ translation |\n| 3 | Assistant System | Medium | Session-based | User-guided\
    \ | Digital assistants, tool-augmented chat |\n| 4 | Autonomous Agent | High |\
    \ Persistent memory | Partial autonomy | Task planning, research assistants |\n\
    | 5 | Multi-Agent System (MAS) | Very High | Shared + distributed | Distributed\
    \ autonomy | Supply chains, orchestration, simulations |\n\nTable 1.1 – Comparison\
    \ of agent interaction paradigms across key architectural dimensions\n\n## Direct\
    \ LLM interaction: The stateless conversationalist\n\nThis foundational level\
    \ represents the most basic form of agent engagement, where a user interacts directly\
    \ with an `LLM` through natural language prompts. These interactions are stateless,\
    \ with no memory of prior inputs and no persistent context across turns. As shown\
    \ in `Figure 1.9`, a user inputs a query such as “What’s the capital of Canada?”\
    \ and the `LLM` instantly responds with “Ottawa.” The diagram highlights the absence\
    \ of memory using a prohibition icon, indicating that the model treats each prompt\
    \ in isolation. There is no internal context tracking, no task history, and no\
    \ conversation threading.\n\n![Figure 1.9 – Direct LLM interaction](media/file9.png)\n\
    \nFigure 1.9 – Direct LLM interaction\n\nThis approach excels in lightweight scenarios\
    \ such as factual Q&A, creative content generation, or one-shot assistance. However,\
    \ it is limited in its ability to manage multi-step interactions, maintain user\
    \ state, or complete goal-driven workflows. The lack of memory or adaptive feedback\
    \ mechanisms means these systems cannot build long-term context or engage in truly\
    \ conversational behavior. A typical stateless `LLM` interaction looks like a\
    \ single prompt producing a one-time response, with no memory of previous queries:\n\
    \n```python\nfrom openai import OpenAI\nclient = OpenAI()\nresponse = client.chat.completions.create(\
    \ model=\"gpt-3.5-turbo\", messages=[ {\"role\": \"user\", \"content\": \"What\
    \ is the capital of Canada?\"} ] )\nprint(response.choices[0].message.content)\n\
    ```\n\nReal-world examples of direct `LLM` interaction include:\n\n- **Chat-based\
    \ QA systems**: For instance, chatbots answering factual questions on a retail\
    \ website—like \"What are your opening hours?\" or \"Where's my order?\".\n- **Creative\
    \ writing tools**: Applications like `Jasper` or `Sudowrite` that generate single\
    \ paragraphs or ideas based on prompts.\n- **Educational flashcard assistants**:\
    \ Systems that answer discrete academic questions, such as \"Explain Newton's\
    \ First Law\" for quick study references.\n\n## Proxy agent: The intelligent intermediary\n\
    \nProxy agents represent a foundational yet often underappreciated pattern in\
    \ the architecture of intelligent systems. Unlike autonomous or multi-turn agents\
    \ that maintain state or invoke external tools, proxy agents focus on a more narrowly\
    \ defined but crucial responsibility: transforming unstructured user input into\
    \ a well-structured, executable format suitable for backend systems. At their\
    \ core, proxy agents function as semantic intermediaries. When a user submits\
    \ a request such as “Find restaurants near me,” the proxy agent doesn’t immediately\
    \ forward this to a service endpoint. Instead, it acts as a translator—injecting\
    \ additional context, disambiguating vague terms, sanitizing input, and reformatting\
    \ the query into a structured representation. This design not only enhances precision\
    \ and reliability but also protects downstream systems that depend on strict schemas\
    \ or predefined parameter sets.\n\nThe proxy agent follows a well-defined processing\
    \ flow. First, it captures the user’s input. This input is typically in free-form\
    \ natural language, which is inherently ambiguous or incomplete. The agent then\
    \ integrates this input into a structured prompt template. This template contains\
    \ both instructions for the underlying language model and placeholders for dynamic\
    \ data such as the user query or contextual metadata. After completing the prompt,\
    \ the agent invokes a language model, such as `OpenAI`’s `GPT` or `Anthropic`’s\
    \ `Claude`, and receives a structured response—often in `JSON` or `SQL` format.\
    \ Finally, this structured result is forwarded to the intended service or execution\
    \ layer. To better understand how this works, consider the following example scenario:\
    \ A user asks: “Find restaurants near me that are open now.”\n\n![Figure 1.10\
    \ – Proxy agent](media/file10.png)\n\nFigure 1.10 – Proxy agent\n\nThe proxy agent\
    \ doesn't relay this message directly to the restaurant discovery API. Instead,\
    \ it processes the request through a structured transformation pipeline that converts\
    \ natural language into machine-readable format.\n\n### Implementation example\n\
    \nThe following code demonstrates how a proxy agent implements this natural language\
    \ to structured data transformation:\n\n```python\nfrom langchain.prompts import\
    \ PromptTemplate\nfrom langchain.chains import LLMChain\ntemplate = \"\"\"\nYou\
    \ are a proxy agent responsible for translating natural language into structured\
    \ queries.\nUser input: \"{query}\"\nReturn a JSON object with the following fields:\n\
    - intent: The action to perform.\n- location: Inferred or stated location.\n-\
    \ time_filter: Indicate if the query includes time-based constraints.\n- format:\
    \ Response format (e.g., 'list').\nRespond ONLY with JSON.\n\"\"\"\nprompt = PromptTemplate(input_variables=[\"\
    query\"], template=template)\nchain = LLMChain(prompt=prompt, llm=openai_chat)\n\
    response = chain.run({\"query\": \"Find restaurants near me that are open now\"\
    })\n```\n\n### Structured output\n\nWhen executed, this implementation produces\
    \ a clean, structured response that downstream systems can reliably process:\n\
    \n```json\n{\n    \"intent\": \"search_restaurants\",\n    \"location\": \"current_user_location\"\
    ,\n    \"time_filter\": \"open_now\",\n    \"format\": \"list\"\n}\n```\n\nThis\
    \ result is now clean, context-rich, and fully structured—ideal for calling an\
    \ API or passing to a downstream planner. The template ensures consistency while\
    \ the language model provides the semantic reasoning to infer missing information\
    \ such as the location (from user metadata) or the time filter (`\"open now\"\
    `). For production, additional considerations are vital:\n\n- **Input sanitization**:\
    \ Implement robust input sanitization to prevent prompt injection attacks or unexpected\
    \ model behavior from malicious or malformed user inputs.\n- **Logging**: Comprehensive\
    \ logging of prompts, responses, and execution times is essential for debugging,\
    \ auditing, and understanding agent behavior in real-world scenarios.\n- **Monitoring\
    \ prompt response times**: Continuously monitor the latency of LLM invocations\
    \ to ensure the agent meets performance SLAs and provides a responsive user experience.\n"
