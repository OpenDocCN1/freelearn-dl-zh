  trans: "\n第一阶段向量检索能帮你找到相关内容的区域，但重排序器（rerankers）能帮助你找到精确的房屋。像 `Cohere` 的 `reranker`\
    \ 或 `Sentence Transformers` 的 `cross-encoders` 等模型会对查询-文档对进行详细检查，从而大幅提高精度。\n\n\
    ### 元数据：你的秘密武器\n\n纯语义搜索虽然强大，但将其与元数据过滤相结合可以产生魔法。想象不仅通过含义，还可以通过：\n\n* 时效性（优先考虑新信息）\n\
    * 来源权威性（偏经过验证的来源）\n* 部门相关性（关注特定的业务部门）\n* 用户交互历史（个性化检索）\n\n### 可观测性：透视黑箱\n\n当检索失败时，理解原因至关重要。像\
    \ `LangSmith` ([smith.langchain.com](https://smith.langchain.com/)) 等工具让你可视化：\n\
    \n* 检索了哪些块\n* 它们获得了什么样的相似性评分\n* 它们是如何影响最终响应的\n\n这种观测性让 RAG 从神秘变得可管理。\n\n### 展望：内存增强的未来\n\
    \n我们正见证内存增强 AI 智能体的开始。未来的系统可能具有以下特征：\n\n* **多模态向量存储**：将图像、音频和文本嵌入到统一空间中\n* **推理感知检索**：系统不仅理解存在哪些信息，还理解哪些信息有助于解决特定的推理任务（这一能力目前是活跃的研发领域）\n\
    * **自演进的内存**：智能体根据用户反馈完善自己的分块和检索策略\n\n向量数据库不仅仅是技术上的改进——它们代表了 AI 系统与知识之间关系的根本性转变。它们将\
    \ LLM 从静态、冻结的知识系统转变为动态的推理器，能够纳入新信息并适应变化的环境。然而，这种向可变内存的转变引入了新的挑战，特别是关于实时更新的写入延迟以及确保分布式内存存储之间的数据一致性问题。对于构建下一代\
    \ AI 智能体的开发者来说，掌握向量检索不是可选的——它是创建一个智能聊天机器人与构建真正智能助手之间的区别。\n\n> *智能的衡量在于改变的能力。*\n\
    \n— 阿尔特·爱因斯坦\n\n这句话不仅适用于人类，也适用于我们的 AI 系统。向量数据库赋予了智能体改变其所知的能力——这是迈向真正机器智能的第一步。在探索了向量数据库如何彻底改变智能体内存和知识检索之后，我们现在转向让智能体与外部世界交互并操作的机制。内存系统允许智能体学习和记忆信息，而工具集成框架在智能体的内部推理与其采取具体行动的能力之间提供了关键桥梁——从\
    \ API 调用、数据库查询到文件操作和系统命令。\n\n### 工具集成框架\n\n工具是智能体智能的解放，使其能够超越数字限制并操纵世界。在“感知-推理-行动”循环中，工具代表了思想转化为结果的时刻。可用工具的生态系统庞大且不断扩展——从简单的\
    \ API 封装器和数据库连接器到复杂的自动化平台和专业的领域工具。我们并没有尝试列出详尽的目录，而是专注于支持几乎所有智能体-工具交互的最两个基础的集成模式：用于\
    \ Python 开发的 `LangChain` `Tool` 抽象，以及用于直接模型集成的 `OpenAI` `function calling`（函数调用）。注意的是，这两种方法并不是互斥的；例如，`LangChain`\
    \ 可以使用 `StructuredTool` 类封装 `OpenAI` 的 JSON Schema，允许开发者在 `LangChain` 智能体中使用 `OpenAI`\
    \ 强大的函数调用能力。理解这些核心模式为集成任何工具提供了基础，无论其具体的实现或领域如何。\n\n### LangChain Tools\n\n`LangChain`\
    \ 提供了 `Tool` 抽象，这是一种强大的模式，可以将普通的 Python 函数转换为智能体兼容的工具。这种抽象处理了语言模型与外部系统之间复杂的编排，自动管理输入验证、错误处理和响应格式。`Tool`\
    \ 封装器本质上创建了一个智能体可以可靠发现和调用的标准接口，Python 函数在此转换为生产环境中的可靠工具：\n\n```python\nfrom langchain.agents\
    \ import Tool\ndef get_stock_price(ticker: str) -> str:\n    \"\"\"返回模拟的股票价格或处理无效输入.\"\
    \"\"\n    try:\n        # 虚拟逻辑：在真实场景中，这可以调用 API\n        if not ticker.isalpha():\n\
    \            raise ValueError(\"Invalid ticker symbol\")\n        return f\"The\
    \ price of {ticker} is $123.45\"\n    except Exception as e:\n        return f\"\
    Error fetching stock price: {str(e)}\"\ntool = Tool(\n    name=\"StockPriceTool\"\
    ,\n    func=get_stock_price,\n    description=\"Fetches the current price of a\
    \ stock\"\n)\n```\n\n这个示例展示了 `Tool` 模式的简单性：我们从一个普通的 Python 函数开始，它接受股票代码并返回价格信息。然后\
    \ `Tool` 封装器将该函数与智能体可以理解的元数据打包——一个用于识别的描述性名称、实际执行的函数，以及对工具用途的清晰描述。当智能体需要股票价格信息时，它可以通过名称和描述发现此工具，然后通过带有适当参数的底层函数来调用。`Tool`\
    \ 抽象处理了智能体推理过程与函数执行之间桥接的所有复杂性。\n\n### OpenAI function calling\n\n`OpenAI` 的函数调用通过基于\
    \ JSON 的 Schema 提供了一了一套复杂的命令系统：\n\n```json\n{\n  \"name\": \"get_weather\",\n\
    \  \"description\": \"Get the weather for a city\",\n  \"parameters\": {\n   \
    \ \"type\": \"object\",\n    \"properties\": {\n      \"city\": { \"type\": \"\
    string\" }\n    },\n    \"required\": [\"city\"]\n  }\n}\n```\n\n此 JSON Schema\
    \ 定义了一个智能体可以调用的天气函数，指定了函数名称、其用途以及带有数据类型的必需参数。与 `LangChain` 以 Python 为中心的方法不同，`OpenAI`\
    \ 的函数调用使用跨越不同语言和平台的标准 JSON Schema。语言模型可以解释此 Schema 以理解函数的功能以及如何正确调用它，从而在对话期间生成格式格式的函数调用。在有了健壮的工具集成让智能体能够在世界中采取行动后，我们的下一个重点转向如何通过全面的评估和基准测试系统确保这些行动产生预期的结果。\n\
    \n## 云原生智能体开发平台：托管军库\n\n"
- fmt: '

    This section provides a comparative overview of cloud-native platforms for LLM
    agent development, drawing insights from industry reports and cloud provider documentation.
    While open-source frameworks provide unparalleled flexibility and control for
    custom implementations and specialized requirements, the major cloud providers—Amazon
    Web Services (AWS), Microsoft Azure, and Google Cloud—offer powerful, managed
    platforms designed to simplify the development, deployment, and scaling of LLM
    agents in production environments. These cloud-native solutions abstract away
    much of the underlying infrastructure complexity, providing essential capabilities
    such as multi-agent collaboration, RAG, memory retention, and integrated guardrails
    for safety and reliability. A growing trend in agent engineering is a hybrid approach,
    combining the strengths of these managed cloud services for foundational infrastructure
    and core LLM access with open-source frameworks for defining complex agent logic
    and custom tool integrations. This section explores the key offerings from each
    major cloud provider, highlighting their native tools, integration capabilities,
    and deployment considerations.


    ### AWS: The flexible ecosystem


    AWS offers a comprehensive suite of services for building and deploying LLM agents,
    characterized by its breadth of model choices and deep integration with existing
    AWS services.


    #### Native tools: Amazon Bedrock Agents


    `Amazon Bedrock` is AWS''s flagship managed service for generative AI, providing
    access to a variety of foundation models (FMs) through a single API endpoint,
    including Amazon''s `Titan` models and third-party models like `Anthropic Claude`,
    `AI21 Labs Jurassic`, `Cohere Command`, `Meta''s Llama 2`, and `Stability AI`.
    `Bedrock` supports on-demand usage and customization techniques such as fine-tuning
    and RAG. A unique feature within AWS is `Amazon Bedrock Agents`, a fully managed
    service for building and scaling generative AI bots capable of executing complex
    tasks autonomously. Key features include:


    *   **Multi-agent collaboration**: `Bedrock Agents` support orchestrated multi-agent
    workflows, where a single supervisor (orchestrator) agent manages the execution
    of chained task agents. While this enables division of labor and modular task
    handling, it currently follows a centralized coordination model rather than decentralized
    agent-to-agent collaboration

    *   **RAG**: `Bedrock Knowledge Bases` provide a fully managed RAG workflow, handling
    document ingestion, embedding storage in a vector database, and retrieval of context
    from your data. It can connect to various data sources like databases and `S3`.
    Notably, it supports structured data retrieval using natural language to SQL.


    *   **Orchestration and multistep tasks**: `Bedrock Agents` use the reasoning
    capabilities of FMs to analyze user requests, decompose them into logical sequences,
    and automatically call necessary APIs (defined as "Action Groups"). `AWS Step
    Functions` is a powerful serverless orchestrator that can sequence and manage
    state across multiple steps, integrating directly with `Bedrock` API calls.

    *   **Memory retention**: Agents can maintain conversation history across interactions
    for personalized and seamless user experiences and improved accuracy in multi-step
    tasks.

    *   **Code interpretation**: The service supports dynamic generation and execution
    of code within a secure environment, automating complex analytical queries and
    data analysis.

    *   **Prompt engineering**: `Bedrock Agents` automatically create prompt templates
    from user instructions, action groups, and knowledge bases, which developers can
    refine.

    *   **Guardrails**: Built-in security and reliability features, such as `Amazon
    Bedrock Guardrails`, filter user inputs and model responses for harmful content.
    However, these guardrails currently support only pre-defined moderation configurations—custom
    policy scripting or deeply tailored safety rules are not yet available.


    For hosting custom models or open-source LLMs, `Amazon SageMaker` provides capabilities
    to deploy any model to a managed endpoint with autoscaling. Additionally, `SageMaker
    JumpStart` offers pre-built inference containers and deployment templates for
    popular open models like `Llama 3`, `Mixtral`, and others—significantly reducing
    the operational effort for production-grade deployments.


    #### Integrating open-source frameworks on AWS


    AWS actively supports the integration of popular open-source LLM agent frameworks:


    *   **LangChain and LangGraph**: There is a dedicated `langchain-aws` toolkit
    and official examples showing how to integrate `LangChain` (and `LangGraph`) with
    `Bedrock`. `LangChain` agents can directly invoke `AWS Lambda` functions as tools.

    *   **Strands Agents**: AWS has introduced `Strands Agents`, an open-source SDK
    for AI agent development through a model-driven approach. It allows defining agents
    with natural language prompts, tools, and models (supporting `Bedrock` and others
    via `LiteLLM`).

    *   **Model Context Protocol (MCP)**: AWS supports `MCP`, an open standard defining
    how AI models connect to various data sources or tools, aiming to standardize
    agent-tool interaction and promote reuse across enterprises (note: the `MCP` specification
    is currently in draft form and subject to change). `SageMaker AI` plays a crucial
    role in hosting LLMs that perform actions with tools implemented by `MCP` servers.


    #### Deployment architectures on AWS


    AWS offers flexible deployment architectures:


    *   **Serverless (AWS Lambda, API Gateway)**: `Lambda` functions are ideal for
    event-driven applications and microservices, serving as core logic for LLM agents
    triggered by `Amazon API Gateway` for real-time interactions. This setup offers
    automatic scaling and a pay-per-use model.

    *   **Containerized (Amazon ECS, Amazon EKS)**: For complex, distributed, or stateful
    LLM agent applications, AWS provides `Amazon Elastic Container Service (ECS)`
    and `Amazon Elastic Kubernetes Service (EKS)`. `ECS` is AWS''s proprietary container
    orchestration platform, cost-effective and deeply integrated with other AWS services.
    `EKS`, built on Kubernetes, offers extensive features for managing containerized
    applications at scale and greater open-source support. `MCP` servers, implementing
    agent tools, can be hosted on `EC2`, `ECS`, or `EKS`.


    ### Azure: The enterprise powerhouse


    Microsoft Azure provides a robust and integrated ecosystem for developing and
    deploying LLM agents, especially for organizations deeply embedded in the Microsoft
    ecosystem.


    #### Native Tools: Azure AI Foundry Agent Service


    `Azure OpenAI Service` is Azure''s marquee offering, providing API access to OpenAI''s
    models (`GPT-3.5 Turbo`, `GPT-4`, `Codex`, `DALL-E 2`) hosted in Microsoft''s
    cloud data centers with enterprise-grade security and compliance. Note that `GPT-4o`
    is currently available in multi-tenant mode only.**Azure AI Foundry Agent Service`
    is a unified platform designed to build, deploy, and operate intelligent agents
    powered by LLMs in enterprise environments. It is conceptualized as an "Agent
    Factory" with comprehensive capabilities across multiple dimensions:


    *   **Models**: Selection from a growing catalog, including `Azure OpenAI` models,
    `Llama`, `Mistral`, and `Cohere`.

    *   **Customization**: Models are tailored through fine-tuning, distillation,
    or domain-specific prompts to encode agent behavior.

    *   **AI tools**: Agents are equipped to access enterprise knowledge (e.g., `Bing`,
    `SharePoint`, `Azure AI Search`) and take actions via `Azure Logic Apps`, `Azure
    Functions`, or `OpenAPI`.

