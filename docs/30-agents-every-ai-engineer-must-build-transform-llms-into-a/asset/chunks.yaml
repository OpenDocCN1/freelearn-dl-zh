  trans: '

    本节提供了 LLM Agent（智能体）开发云原生平台的对比概述，参考了行业报告和云提供商的文档。开源框架为自定义实现和特殊需求提供了无与伦比的灵活性和控制力，而主要的云提供商——Amazon
    Web Services (AWS)、Microsoft Azure 和 Google Cloud——提供了强大的托管平台，旨在简化生产环境中 LLM Agent
    的开发、部署和扩展。这些云原生解决方案抽象了大部分底层基础设施的复杂性，提供了核心能力，如多智能体协作、RAG（检索增强生成）、记忆保留以及用于安全和可靠性的集成护栏。代理工程领域日益增长的趋势是混合方法，即结合这些托管云服务在基础基础设施和核心
    LLM 访问方面的优势，以及开源框架在定义复杂代理逻辑和自定义工具集成方面的优势。本节将探索各家主要云供应商的核心产品，重点介绍它们的原生工具、集成能力和部署考虑。


    ### AWS：灵活的生态系统


    AWS 提供了一全套用于构建和部署 LLM Agent 的服务，其特点是模型选择广泛且与现有 AWS 服务有深度集成。


    #### 原生工具：Amazon Bedrock Agents


    `Amazon Bedrock` 是 AWS 旗舰级的生成式 AI 托管服务，通过单一 API 端点访问多种基础模型（FMs），包括 Amazon 的 `Titan`
    模型以及第三方模型，如 `Anthropic Claude`、`AI21 Labs Jurassic`、`Cohere Command`、`Meta''s
    Llama 2` 和 `Stability AI`。`Bedrock` 支持按需使用以及微调和 RAG 等自定义技术。AWS 内部的一个独特功能是 `Amazon
    Bedrock Agents`，这是一项完全托管的服务，用于构建和扩展能够自主执行复杂任务的生成式 AI 机器人。关键特性包括：


    *   **多智能体协作**：`Bedrock Agents` 支持编排多智能体工作流，由单个主管（协调器）智能体管理链式任务代理的执行。虽然这实现了分工协作和模块化任务处理，但它目前遵循的是中心化协调模型，而不是去中心化的智能体间协作。

    *   **RAG**：`Bedrock Knowledge Bases` 提供了全托管的 RAG 工作流，负责处理文档摄入、向量数据库中的嵌入存储以及从你的数据中检索上下文。它可以连接到数据库和
    `S3` 等各种数据源。值得注意的是，它支持使用自然语言转 进行结构化数据检索。

    *   **编排与多步任务**：`Bedrock Agents` 使用基础模型的推理能力来分析用户请求，将其分解为逻辑序列，并自动调用必要的 API（定义为“动作组”）。`AWS
    Step Functions` 是一个强大的无服务器编排器，可以跨多个步骤排序并管理状态，并直接与 `Bedrock` API 调用集成。

    *   **记忆保留**：智能体可以在交互中维护对话历史，以提供个性化且无缝的用户体验，并提高多步任务的准确性。

    *   **代码解释**：该服务支持在安全环境中动态生成和执行代码，实现复杂的分析查询和数据分析。

    *   **提示词工程**：`Bedrock Agents` 可根据用户指令、动作组和知识库自动创建提示词模板，开发者可以对其进行精炼。

    *   **护栏**：内置的安全和可靠性功能（如 `Amazon Bedrock Guardrails`）可以过滤用户输入和模型响应中的有害内容。然而，这些护栏目前仅支持预定义的审核配置——尚不支持自定义策略脚本或深度定制的安全规则。


    对于托管自定义模型或开源 LLM，`Amazon SageMaker` 提供了将任何模型部署到具有自动扩展能力的托管端点的功能。此外，`SageMaker
    JumpStart` 为 `Llama 3`、`Mixtral` 等热门开源模型提供了预构建的推理容器和部署模板——显著减少了生产级部署的运营工作。


    #### 在 AWS 上集成开源框架


    AWS 积极支持流行的开源 LLM Agent 框架的集成：


    *   **LangChain 和 LangGraph**：有一个的 `langchain-aws` 工具包和官方示例，展示了如何将 `LangChain`（以及
    `LangGraph`）与 `Bedrock` 集成。`LangChain` 代理可以直接调用 `AWS Lambda` 函数作为工具。

    *   **Strands Agents**：AWS 推出了 `Strands Agents`，这是一个通过模型驱动方法进行 AI 开发的开源 SDK。它允许通过自然语言提示词、工具和模型定义代理（通过
    `LiteLLM` 支持 `Bedrock` 等其他模型）。

    *   **模型上下文协议 (MCP)**：AWS 支持 `MCP`，这是一种定义 AI 模型如何连接到各种数据源或工具的开放标准，旨在标准化智能体与工具的交互并促进企业内部的用（注意：`MCP`
    规范目前处于草稿阶段，可能会发生变化）。`SageMaker AI` 在托管通过 `MCP` 服务器实现的工具执行动作的 LLM 起着至关重要的作用。


    #### AWS 部署架构


    AWS 提供灵活的部署架构：


    *   **无服务器 (AWS Lambda, API Gateway)**：`Lambda` 函数是事件驱动应用和微服务的理想选择，作为由 `Amazon
    API Gateway` 触发用于实时交互的 LLM Agent 核心逻辑。这种设置提供了自动扩展和按需付费模式。

    *   **容器化 (Amazon ECS, Amazon EKS)**：对于复杂的、分布式或有状态的 LLM Agent 应用程序，AWS 提供了 `Amazon
    Elastic Container Service (ECS)` 和 `Amazon Elastic Kubernetes Service (EKS)`。`ECS`
    是 AWS 专有的容器编排平台，具有成本效益并与其他 AWS 服务深度集成。基于 Kubernetes 构建的 `EKS` 提供了管理大规模容器化应用的丰富功能和更强的开源支持。实现代理工具的
    `MCP` 服务器可以托管在 `EC2`、`ECS` 或 `EKS` 上。


    ### Azure：企业级动力源


    Microsoft Azure 为开发和部署 LLM Agent 提供了一个强大且集成的生态系统，特别是对于深度嵌入微软生态系统的组织。


    #### 原生工具：Azure AI Foundry Agent Service


    `Azure OpenAI Service` 是 Azure 的旗舰产品，提供了对 OpenAI 模型（`GPT-3.5 Turbo`、`GPT-4`、`Codex`、`DALL-E
    2`）的 API 访问，这些模型托管在微软云数据中心，具有企业级的安全性和合规性。注意 GPT-4o 目前仅支持多租户模式。Azure AI Foundry
    Agent Service 是一个统一平台，旨在为企业环境构建、部署和运行由 LLM 驱动的智能代理。它被概念化为代理工厂，在多个维度具有全面的能力：


    *   **模型**：从不断增长的目录中选择，包括 `Azure OpenAI` 模型、`Llama`、`Mistral` 和 `Cohere`。

    *   **自定义**：通过微调、蒸馏或领域提示词对模型进行定制，以编码代理行为。

    *   **AI 工具**：智能体配备了访问企业知识（例如 `Bing`、`SharePoint`、`Azure AI Search`）并并通过 `Azure
    Logic Apps`、`Azure Functions` 或 `OpenAPI` 采取行动的能力。

    '
- fmt: '

    - **Orchestration**: "Connected agents" manage tool calls, update thread states,
    and handle retries. Azure AI Foundry supports multi-agent coordination with built-in
    agent-to-agent messaging. Azure Logic Apps is a serverless workflow engine similar
    to AWS Step Functions, suitable for defining LLM agent flows and integrating with
    various services. Azure Durable Functions (an extension of Azure Functions) allow
    writing orchestrator functions in code for complex sequences. Azure AI Studio
    Prompt Flow provides a visual canvas to chain prompts and Python code nodes.

    - **Trust**: Enterprise-grade features ensure reliability, including identity
    management via Microsoft Entra, Role-Based Access Control (RBAC), content filters,
    encryption, and network isolation.

    - **Observability**: AI Foundry captures logs, traces, and evaluations with full
    thread-level visibility and integration with Azure Application Insights.


    Azure also offers "OpenAI on Your Data," a simplified setup for RAG in Azure AI
    Studio, which automatically uses Azure Cognitive Search to index and retrieve
    data for a chat model.


    ### Integrating open source frameworks on Azure


    Azure AI Foundry Agent Service explicitly supports combining various open-source
    SDKs:


    - **Semantic Kernel**: An `AzureAIAgent` within Semantic Kernel provides advanced
    conversational capabilities and seamless tool integration, focusing on enterprise
    readiness, security, and compliance.

    - **AutoGen**: Developed by Microsoft Research, AutoGen frames everything as an
    asynchronous conversation among specialized agents, suitable for multi-turn conversations
    and real-time tool invocation. Azure AI Agent Service can orchestrate single agents
    defined in AutoGen into complex multi-agent workflows.

    - **LangChain**: While not as deeply integrated as Semantic Kernel or AutoGen,
    LangChain agents can be deployed on Azure''s compute services, such as Azure Container
    Apps Dynamic Sessions, to provide secure, sandboxed environments for code interpreters.


    ### Deployment architectures on Azure


    Azure provides flexible deployment options:


    - **Serverless (Azure Functions, Azure Container Apps)**: Azure Functions are
    suitable for deploying Semantic Kernel SDK and AutoGen multi-agent applications,
    offering automatic scaling and cost efficiency. Azure Container Apps can host
    web-based chat applications with AI agents and provide secure, isolated sandboxed
    environments for code execution.

    - **Containerized (Azure Kubernetes Service - AKS)**: AKS is a managed Kubernetes
    offering well-suited for deploying complex, distributed applications requiring
    container orchestration at scale and deep control over the Kubernetes environment.


    ### Google Cloud: The AI innovation hub


    Google Cloud leverages its AI research leadership and infrastructure prowess,
    offering highly scalable and cost-efficient AI services with a strategic focus
    on interoperability and enterprise search.


    #### Native Tools: Agentspace, Vertex AI Agent Builder/Engine/ADK


    Google Cloud''s hub for LLMs is `Vertex AI`, particularly its Generative AI offerings
    like PaLM 2 and the upcoming Gemini model suite. Vertex AI also includes select
    external models like Meta''s Llama 2 via its Model Garden. Google Cloud provides
    a suite of integrated services for building and deploying LLM agents:


    - **Agentspace**: A search and AI agent hub for enterprise work, connecting applications
    to Google-quality multimodal search and AI agents. It includes an "Agent Designer"
    and "Agent Gallery". Note that Agentspace is currently in private preview.

    - **Vertex AI Agent Builder**: A comprehensive suite of features for discovering,
    building, and deploying AI agents.

    - **Agent Development Kit (ADK)**: An open-source, framework-agnostic framework
    simplifying the creation of sophisticated multi-agent systems with precise control
    over agent behavior. It powers Agentspace and streamlines multi-agent transfer
    and planning.

    - **Vertex AI Agent Engine**: A fully managed Google Cloud service for deploying,
    managing, and scaling AI agents in production. It abstracts away low-level tasks
    and handles infrastructure, scaling, security, evaluation, and monitoring.

    - **Agent2Agent (A2A) Protocol**: Google is actively developing an open A2A protocol
    to enable interoperability between AI agents, regardless of their underlying framework
    or vendor.

    - **Model Context Protocol (MCP)**: Google Cloud also supports MCP, an open standard
    for agents to connect with and utilize external tools and data sources in a standardized
    way.


    Google Cloud''s agent tools are applicable across various use cases, including
    enterprise search, content generation, and automation. Vertex AI extensions, part
    of Agent Builder, allow connecting agents to Google Workspace and other external
    APIs.


    ### Integrating open-source frameworks on Google Cloud


    Vertex AI Agent Engine is designed to be framework-agnostic, providing flexible
    support for popular open-source LLM frameworks:


    - **LangChain, LangGraph**: Vertex AI Agent Engine offers full integration with
    LangChain and LangGraph. LangChain can also be deployed on Google Cloud Run and
    Google Kubernetes Engine (GKE) using `LangServe`.

    - **AutoGen, LlamaIndex**: Supported via Vertex AI SDK integration with managed
    templates.

    - **CrewAI**: Supported through custom templates on Vertex AI Agent Engine.


    Google''s focus on open-source tools like `ADK` and the A2A protocol aims to foster
    a wider, more interoperable ecosystem for AI agents, reducing vendor lock-in.


    ### Deployment architectures on Google Cloud


    Google Cloud offers flexible and scalable deployment options:


    - **Serverless (Cloud Run)**: A fully managed, serverless platform providing a
    scalable environment for AI application workloads and agents. It automatically
    scales instances on demand, offers a pay-per-use model, and integrates with Gemini
    API or Vertex AI endpoints for AI models. Cloud Run can be configured for sandboxed
    code execution.

    - **Containerized (Google Kubernetes Engine - GKE)**: GKE is a managed Kubernetes
    service suitable for complex microservices architectures, stateful applications,
    and workloads requiring custom infrastructure or network configurations. `LangServe`
    can streamline LangChain deployments on GKE. Cloud Run and GKE offer high portability,
    allowing the same container images across both.


    For robust workflow orchestration of tasks beyond core agent inference, such as
    model training, fine-tuning, and continuous RAG updates, `Vertex AI Pipelines`
    provides a managed service to define and execute these complex ML workflows


    ### Recommendations for cloud platform selection


    The "best" cloud for LLM agents depends on specific project needs and existing
    organizational infrastructure:


    - **For AWS**: Ideal for organizations already deeply invested in the AWS ecosystem,
    valuing flexibility, a variety of models, and deep integration with existing AWS
    services and data lakes. Its focus on multi-agent collaboration and distributed
    inference at the edge makes it suitable for complex, large-scale deployments.

    - **For Azure**: The platform of choice when cutting-edge OpenAI models (GPT-4)
    are a must, or when integrating AI into a Microsoft-centric organization (Office
    365, Dynamics, Teams, SharePoint) is required. Azure AI Foundry offers a unified
    platform experience with strong governance and identity management for agents,
    appealing to those prioritizing streamlined operations and compliance

    - **For Google Cloud**: A strong contender for those who value cost-efficient
    scaling, Google''s AI research edge, and a more "holistic" agent platform with
    emphasis on open standards and easy tool connectivity. Its strengths in enterprise
    search and multimodal AI, coupled with serverless options like Cloud Run for rapid
    deployment, make it appealing for developers who prefer a mix of coding and managed
    services.

    '
