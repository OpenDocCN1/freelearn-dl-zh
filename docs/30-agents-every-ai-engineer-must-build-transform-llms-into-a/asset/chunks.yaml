  raw: 'Inputs are initially processed and assessed for urgency through priority classification
    mechanisms that evaluate factors such as time constraints, safety implications,
    and task criticality. Time-critical events are routed directly to the reactive
    layer, shown in orange, which executes predefined actions using direct stimulus-response
    mappings. This enables immediate behavior such as obstacle avoidance, safety shutdowns,
    or alert handling.In engineering practice, this routing logic is often implemented
    using asynchronous patterns such as event buses (e.g., Kafka, NATS) or message
    queues (e.g., RabbitMQ, AWS SQS), which allow agents to decouple input classification
    from response execution while ensuring reliable delivery and prioritization under
    load.At the same time, the deliberative layer—represented in blue—monitors the
    environment from a strategic perspective. It maintains internal models of goals,
    state information, and resource constraints. This layer is responsible for higher-order
    reasoning tasks such as path planning, multi-step execution, prediction of future
    states, and optimization across time horizons. It can influence or override the
    behavior of the reactive layer by adjusting thresholds, modifying routines, or
    introducing new goals based on ongoing evaluation.Crucially, the communication
    between these layers is bidirectional. Consider a warehouse robot navigating to
    deliver packages: when the robot encounters an unexpected obstacle (like a fallen
    box), its reactive layer immediately stops movement and initiates avoidance maneuvers.
    Simultaneously, this obstacle detection triggers an interrupt to the deliberative
    layer, which reassesses the optimal delivery route, updates its internal map,
    and may decide to request human assistance if the obstacle represents a persistent
    blockage. Meanwhile, the deliberative layer continuously updates contextual information—such
    as delivery priorities or battery levels—that informs the reactive system''s parameters,
    perhaps adjusting movement speeds based on urgency or remaining power. *Figure
    1.5* highlights these interactions through feedback arrows and optional dashed
    pathways that activate under such dynamic situational conditions.This architecture
    supports a coordinated output mechanism that balances rapid decision-making with
    longer-term objectives. Final actions emerge as a negotiated outcome, often synthesized
    from both layers depending on the current operational context. The warehouse robot
    example demonstrates how reactive collision avoidance operates in parallel with
    deliberative route optimization, creating seamless navigation that is both safe
    and efficient.Different implementation models exist to realize hybrid behavior.
    Subsumption-based systems may place reactive control at the core, augmented by
    strategic planning layers. Other designs use arbitration mechanisms where multiple
    subsystems propose actions, and a control module selects the most appropriate
    one based on priorities and environmental conditions. Blackboard architectures
    (shared memory systems where different reasoning components contribute knowledge
    to a common workspace) further support hybridization by using shared memory repositories
    where each layer contributes to a collective decision space.Hybrid agents are
    particularly effective in complex environments that demand flexibility. In industrial
    robotics, they coordinate immediate stop mechanisms with production scheduling.
    In autonomous vehicles, they manage obstacle avoidance in parallel with navigation
    planning. In cybersecurity, emerging hybrid agent models aim to block live threats
    while concurrently evaluating longer-term system integrity—though most current
    implementations focus on rule-based detection with limited adaptive coordination.
    The hybrid approach represents a next step toward dynamic, self-adjusting defenses.
