  \ Packt 网站购买不需要发票。\n\n# 2. Claude Code 要点\n\n本章将通过演示其实际工作方式，帮助您熟悉 Claude Code。我们不会直接跳入高级功能，而是从构建对系统本身的理解、它所使用的术语以及它与代码库交互的方式入手。在此过程中，您将看到\
