  \ Packt 网站购买的不需要发票。*\n\n# 第 3 部分\n\n# 高级智能体与深度系统设计\n\n在本书的最后一部分，你将探讨现代编码智能体如何大规模且长周期地运行。我们将探索智能体技能，如结构化能力扩展，并分析它们如何影响上下文流和执行模式。你将看到\
