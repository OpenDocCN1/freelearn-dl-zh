  \n图 10.19 – 确认更新后的 HookHub 仓库链接\n\n## 理解 Git Worktree 布局\n\n由于使用了 Git Worktree，单独的目录代表不同的活动分支。\n\
  \n主仓库目录保持完整。在此旁边，还有一个额外的 Worktree 目录：例如 `zealous‑jemison`（由 Claude Code 自动生成）对应另一个分支。每个并行任务都在自己的\
  \ Worktree 上下文中运行，这防止了功能实现之间的干扰。\n\n在本例中，三个独立功能同时开发：应用程序的 UI 动画、Hook 仓库数据库的更新以及\
  \ Hero 区域的重新设计。每个功能都在单独的分支中实现，稍后再合并到单个分支中。\n\n## 准备合并工件\n\n剩下的挑战是整合所有工件。您有三个分支需要汇总：一个由云端代理更新的远程分支，以及两个包含动画变更和数据库更新的本地\
  \ Worktree 分支。\n\n这些变更必须合并到一个单一、连贯的代码库中。因为一个分支存在于远程，而其他分支通过 Git Worktree 存在于本地，因此合并需要显式协调。\n\
  \n下一步是指示 Claude Code 合并这些分支，以便包括动画、更新的 Hook 仓库和重新设计的 Hero 区域在内的所有工件都合并到单个统一分支中，如以下提示词所示。\n\
  \n```\nMerge all the commits here to branch project/hookub\n```\n\n从并行执行到受控集成的这一转变，完成了本地和基于云端的开发工作流的编排。\n\
  \n# 理解 Claude Code 中的 Git Worktree\n\n在继续合并之前，我们需要了解 Git Worktree 的底层原理以及这种设置下版本控制的行为。目标是对\
  \ Claude Code 创建隔离工作副本时发生的情况建立正确的直觉。\n\n当 Claude Code 创建 Worktree 时，它会创建一个与仓库关联但检出到不同分支的独立工作目录。\n\
  \n![图 10.20 – Claude Code 用于并行开发的 Git Worktree 架构](img/B37082_10_20.png)\n\n图 10.20\
  \ – Claude Code 用于并行开发的 Git Worktree 架构\n\n## Claude Code 如何使用 Worktree\n\n当我们逐步查看时，流程更容易理解。以下是\
  \ Claude Code 创建并开始在 Worktree 内工作时发生的确切操作序列：\n\n1. Claude Code 创建一个带有新分支的 Worktree。例如，我们可以将\
  \ Worktree 命名为 `vigilant feistel`（由 Claude Code 自动生成）。\n2. 所有代码和所有变更都发生在 Worktree\
  \ 目录内。\n3. 当我们提交代码时，提交存在于 `vigilant feistel` 分支中。\n4. 原始分支 `project/hookhub` 保持完全未被触动。\n\
  \n\n\n\n\n## 5. 合并或放弃 Worktree 更改\n\n5. 如果我们对 Claude Code 的构建成果满意，则进行合并。\n\n6. 如果不满意，则删除\
  \ Worktree 和分支，不留任何烂摊子。\n\n## 并行使用多个 Worktree\n\n在**图 10.20**中，有两个 Worktree——`vigilant\
  \ feistel` 和 `zealous jemison`：\n\n1. 我们打开编辑器，看到常规的 `hookhub` 目录结构。\n2. 我们还看到两个额外的目录，其中每个目录都包含原始分支代码库的完全副本。\n\
  3. 尽管目录结构匹配，但 Git 分支是分离的；`vigilant feistel` 和 `zealous jemison` 是独立的 GitHub 分支，不同于\
  \ `project/hookhub`。\n4. 这允许执行多个并行任务，每个 Claude 实例在完全不同的分支中工作，并使用原始代码的全新副本。\n\n使用多个代理进行工作需要编排，这意味着开发者必须协调多个工作上下文、分支和任务。Git\
  \ Worktree 为管理这种协调提供了便捷的机制。\n\n# 合并并行功能分支\n\n本地 Claude Code 实例在 `vigilant feistel`\
  \ 目录中实现了动画。该目录是一个链接到主仓库但检出到不同分支的 Git Worktree。\n\n即使目标分支是 `project/hookhub`，所有实际工作都发生在\
  \ `vigilant feistel` 目录中。这正是 Git Worktree 的运作方式。它们允许在隔离的目录中进行开发，同时仍指向同一个仓库。\n\n\
  现在我们想要获取那里生成的代码并提交它。指示 Claude 创建一个提交，并在提交信息中明确说明更改是通过 Claude Code Desktop 生成的。\n\
  \n![Figure 10.21 – Reviewing animation feature changes generated in the vigilant_fiestal\
  \ worktree](img/B37082_10_21.png)\n\n**图 10.21 – 查看在 vigilant_fiestal worktree 中生成的动画功能更改**\n\
  \n当该进程（`vigilant fiestal`）运行时，另一个本地 Claude 实例正在一个名为 `zealous jemison` 的独立 Worktree\
  \ 中，使用 JSON 文件更新 GitHub URL。两个实例独立运行。Claude 准备暂存命令。\n\n下面的屏幕截图显示 Claude Code 正在准备提交并提交审批。\n\
  \n![Figure 10.22 – Claude Code preparing a commit for the animation feature changes](img/B37082_10_22.png)\n\
  \n**图 10.22 – Claude Code 正在为动画功能更改准备提交**\n\n批准它。提交信息清楚地表明更改是使用 Claude Desktop 生成的。批准后，一个重要细节变得可见。活动分支不是\
  \ `project/hookhub`。而是 `vigilant‑fiestel`。\n\n![Figure 10.23 – Commit applied to\
  \ the vigilant-fiestel Git worktree branch](img/B37082_10_23.png)\n\n**图 10.23 –\
  \ 提交已应用到 vigilant-fiestel Git worktree 分支**\n\n这证实了 Worktree 的行为方式。当在 Worktree 内部创建提交时，它会应用到该\
  \ Worktree 的分支——而不是原始分支。提交成功添加到了 `vigilant‑fiestel`。\n\n## 推送 Worktree 分支\n\n现在我们推送更改。切换到\
  \ `zealous jemison` Worktree。该分支已经包含其提交。将其也推送上去。\n\nClaude 将请求推送权限。下面的屏幕截图显示了 `zealous‑jemison`\
  \ 的情况，它实现了数据库更新，将新的 Claude Code 仓库条目添加到 `hooks.json` 中。\n\n![Figure 10.24 – Pushing\
  \ the zealous-jemison worktree branch to the remote repository](img/B37082_10_24.png)\n\
  \n**图 10.24 – 将 zealous-jemison worktree 分支推送到远程仓库**\n\n`vigilant‑fiestel` 的情况如下：实现了着陆页\
  \ hero 区域的 UI 动画功能。\n\n![Figure 10.25 – Pushing the vigilant-fiestel worktree branch\
  \ to the remote repository](img/B37082_10_25.png)\n\n**图 10.25 – 将 vigilant-fiestel\
  \ worktree 分支推送到远程仓库**\n\n两个都批准。`project/hookhub` 分支仍然不显示新提交。这是预期的。每个 Worktree 维护自己的分支。\n\
  \n还有一个由远程 Claude Code 实例创建的第三个分支，称为 `claude/anthropic‑hero‑design/<id>`。\n\n![Figure\
  \ 10.26 – Remote Claude Code agent completing the hero section redesign](img/B37082_10_26.png)\n\
  \n**图 10.26 – 远程 Claude Code 代理完成 hero 区域重新设计**\n\n该分支中的所有更改已经提交并远程推送。\n\n刷新仓库确认有三个新分支：\n\
  \n*   `vigilant fiestel`\n*   `zealous jemison`\n*   `Anthropic Hero Design`\n\n\
  下面的屏幕截图显示了仓库视图，其中可见这些新创建的分支。\n\n![Figure 10.27 – GitHub repository view showing\
  \ newly created feature branches](img/B37082_10_27.png)\n\n**图 10.27 – 显示新创建功能分支的\
  \ GitHub 仓库视图**\n\n每个分支代表一个独立开发的功能。\n\n## 将所有内容合并到 `project/hookhub`\n\n现在我们想将所有这些实现汇总到\
  \ `project/hookhub` 中。\n\n我们不手动检出并合并每个分支，而是将任务委托给 Claude Code。\n\n我们提供分支名称，并指示 Claude\
  \ 将所有提交合并到 `project/hookhub`。\n\n![Figure 10.28 – Prompting Claude Code to merge\
  \ all feature branches into project/hookhub](img/B37082_10_28.png)\n\n**图 10.28\
  \ – 提示 Claude Code 将所有功能分支合并到 project/hookhub**\n\nClaude 开始在本地工作并创建另一个名为 `suspicious‑bassi`\
  \ 的 Worktree。\n\n它没有直接合并到 `project/hookhub`，而是创建了一个临时集成分支 `project/hookhub‑merge`。\n\
  \n![Figure 10.29 – Creating the temporary project/hookhub-merge integration branch](img/B37082_10_29.png)\n\
  \n**图 10.29 – 创建临时 project/hookhub-merge 集成分支**\n\n这允许在接触主开发分支之前进行整合。\n\n## 执行合并\n\
  \nClaude Code 开始合并过程。操作期间出现合并冲突。\n\n![Figure 10.30 – Merge conflict detected during\
  \ branch consolidation](img/B37082_10_30.png)\n\n**图 10.30 – 分支整合期间检测到合并冲突**\n\n\
  Claude 准备了一个解决方案：\n\n1.  解决来自 `anthropic‑hero‑design` 的冲突。\n2.  合并 `vigilant‑fiestel`。\n\
  3.  合并 `zealous‑jemison`。\n4.  将所有内容推送到 `project/hookhub`。\n5.  冲突涉及全局 CSS 文件。\n\
  6.  Claude 提出编辑建议。我们批准它们。\n7.  创建合并提交。\n8.  Claude 继续：\n\n    ```\n    git merge\
  \ vigilant-fiestel\n    ```\n\n9.  然后运行以下命令：\n\n    ```\n    git merge zealous-jemison\n\
  \    ```\n\n下面的屏幕截图显示 Claude Code 正在执行合并并提交合并提交以供审批。\n\n![Figure 10.31 – Claude\
  \ Code presenting the final merge commit for approval](img/B37082_10_31.png)\n\n\
  **图 10.31 – Claude Code 提交最终合并提交以供审批**\n\n此时，所有功能分支已整合到 `project/hookhub‑merge`\
  \ 中。\n\n## 推送到 `project/hookhub` 前进行测试\n\nClaude 请求权限将合并结果推送到 `project/hookhub`。\n\
  \n暂时不要批准。推送前，先在本地测试。\n\n![Figure 10.32 – Testing the merged project locally before\
  \ pushing to the main branch](img/B37082_10_32.png)\n\n**图 10.32 – 推送到主分支前在本地测试合并后的项目**\n\
  \n指示 Claude 启动开发服务器：\n\n```\nnpm run dev\n```\n\n可能会出现错误：\n\n```\nnpm is not found\n\
  ```\n\nClaude 通过 source `.zshrc` 配置文件来加载环境并再次尝试。\n\n然后它确定缺少依赖并运行以下命令：\n\n```\nnpm\
  \ install\n```\n\n现在有两个进程正在运行：\n\n*   `npm install`\n*   `npm run dev`\n\n依赖安装完成后，开发服务器成功在端口\
  \ `3002` 上启动。合并后的实现现在正在本地运行。\n\n\n\n\n\n## 验证集成结果\n\n打开运行在端口 `3002` 上的应用程序，并将其与原始实现进行比较。\n\
  \n![图 10.33 – 对比原始与增强后的 HookHub Hero 部分](img/B37082_10_33.png)\n\n**图 10.33 – 对比原始与增强后的\
  \ HookHub Hero 部分**\n\n差异立竿见影。新的 Hero 部分现在包含以下内容：\n\n*   网格背景\n*   横幅元素\n*   曲折线条\n\
  *   仓库统计数据\n*   动画效果\n\n仓库列表包含的条目比以前更多。这些是由 Claude Code 调研并添加的。动画遍布整个网站，而不仅仅局限于孤立的组件。与原始的静态版本相比，体验感觉更具动态感。\n\
  \n所有三个独立开发的功能都能正确共存。\n\n## 完成合并\n\n验证完成后，我们批准推送。Claude 将 `project/hookhub‑merge`\
  \ 合并到 `project/hookhub` 中。\n\n![图 10.34 – 将所有功能分支合并到 project/hookhub 后的最终提交历史](img/B37082_10_34.png)\n\
  \n**图 10.34 – 将所有功能分支合并到 project/hookhub 后的最终提交历史**\n\n刷新仓库确认结果。该分支现在包含三次提交。每次提交合并一个不同的分支，这些分支源自由\
  \ Claude Code 创建的独立 Worktree。每个分支代表一个独立实现的功能。\n\n这种设置凸显了开发扩展方式的一个重要转变。三个独立的功能由不同的\
  \ Claude Code 实例并行开发，同时运行。除了两个本地实例外，另一个 Claude Code 实例在远程运行。\n\n看到这三条独立的开发线汇聚到一个分支中，其意义显而易见。我们通过委托并行功能实现，实际上实现了作为开发者的自我扩展。\n\
  \n同样值得注意的是，此过程中涉及的前端经验有限。为这些实现提供支持的 Claude Code 模型处理了前端工作，并证明了其能够生成所需代码。\n\n# 通过移动端在云端运行\
  \ Claude Code\n\nClaude Code 现已集成到移动应用程序中。桌面端使用的相同工作流可直接从手机发起。在此例中，从移动界面选择 `claude‑code‑crash‑course`\
  \ 仓库，会话由此开始。\n\n由于移动环境不在本地执行代码，所有操作均在 Anthropic 云端运行。不依赖本地机器。仓库在远程克隆，分支在远程检出，更改在远程提交。\n\
  \n我们首先指示 Claude 切换到 `project/hookhub` 分支并实现一个 Anthropic 风格的页脚。\n\n![图 10.35 – 从移动应用程序界面运行\
  \ Claude Code](img/B37082_10_35.png)\n\n**图 10.35 – 从移动应用程序界面运行 Claude Code**\n\n\
  工作流与桌面体验一致：Claude 克隆仓库，检出目标分支，检查项目结构，实现功能，提交更改，并准备拉取请求。\n\n过程逐步展开。仓库被获取。分支被切换。文件被检查。系统指令确认分支已切换至\
  \ `project/hookhub`。\n\n![图 10.36 – 从移动会话中 Claude Code 分析仓库](img/B37082_10_36.png)\n\
  \n**图 10.36 – 从移动会话中 Claude Code 分析仓库**\n\n理解项目上下文后，Claude 识别出该仓库是一个具有 Anthropic\
  \ 风格品牌的 Next.js 应用程序，并据此进行操作。\n\n值得注意的是，默认云配置不包含 MCP、自定义钩子或输出样式。环境使用默认设置运行。自定义配置可单独添加，但此会话在无此类配置下运行。\n\
  \n## 实现页脚组件\n\nClaude 在 `components` 目录下生成一个新的 `footer.tsx` 文件。\n\n![图 10.37 – 从移动端\
  \ Claude Code 会话创建并集成页脚组件](img/B37082_10_37.png)\n\n**图 10.37 – 从移动端 Claude Code\
  \ 会话创建并集成页脚组件**\n\n页脚组件体现了 Anthropic 视觉风格。创建组件后，Claude 通过导入并将其渲染在主页面中，将其集成到 `page.tsx`\
  \ 中。\n\n版本控制操作随之自动进行。更改被暂存并提交。由于请求指定将更改推送到 `project/hookhub`，且 Claude Code 内部使用\
  \ Git worktree，因此会在后台发生额外的 Git 操作，以将 worktree 提交合并到正确的分支。\n\nGit 日志确认了早期工作的先前合并和提交。新的页脚组件和页面修改现已成为分支历史的一部分。\n\
  \n## 审查拉取请求\n\n在 GitHub 上打开仓库可看到新创建的拉取请求。最初，拉取请求针对 `main` 分支，这并非预期的基础分支。基础分支被更正为\
  \ `project/hookhub`。\n\n调整分支后，拉取请求反映了两个修改过的文件：\n\n*   `page.tsx`\n*   `footer.tsx`\n\
  \n差异显示了符合预期的页脚组件集成。\n\n在此阶段，Claude 也可直接在 GitHub 上被 @ 提及以审查拉取请求。由于该分支未配置 GitHub 工作流，自动检查不会触发。\n\
  \n![图 10.38 – 在 GitHub 上审查由 Claude Code 创建的拉取请求](img/B37082_10_38.png)\n\n**图 10.38\
  \ – 在 GitHub 上审查由 Claude Code 创建的拉取请求**\n\n审查仍为手动进行。\n\n## 本地验证更改\n\n为验证集成，请运行以下命令：\n\
  \n```\ngit fetch\ngit pull\nnpm run dev\n```\n\n启动开发服务器后，应用程序加载并在页面上渲染新的页脚。品牌标语\
  \ **Built with love for Claude Code powered by Anthropic** 出现在底部。\n\n布局需要微调，可委托给\
  \ Claude Code 进一步优化。重要的是，整个工作流——从克隆到创建拉取请求——均从移动设备发起，并在云端完全执行。\n\n工程模型保持一致：指定意图，允许\
  \ Claude 推理仓库，审查输出，并迭代。界面变了，但底层开发流程未变。\n\n# 并行 Agent 适得其反的情况\n\n并行编码 Agent 很有用，但并非总是正确的选择。以下是并行运行\
  \ Agent 往往事与愿违的情况。\n\n*   **紧密耦合的功能**：当任务修改相同文件或相互依赖彼此输出时，并行 Agent 会产生合并冲突或无声地覆盖彼此的工作。如果功能\
  \ B 需要功能 A 的接口先存在，请按顺序运行它们。\n*   **共享状态和排序约束**：数据库迁移、配置文件更改和共享类型定义会产生隐式依赖。两个 Agent\
  \ 向同一配置、模式或路由文件添加条目会发生冲突。解决这些冲突的成本往往超过并行运行节省的时间。\n*   **微小任务**：每个 Agent 会话都带来开销：启动上下文、阅读代码库和规划工作。对于顺序执行只需两分钟的任务，将其拆分到多个\
  \ Agent 然后审查和合并结果反而可能耗时更长。如果任务舒适地适合单个会话，请保持原样。\n*   **高昂的协调成本**：如果你发现自己编写详细、明确的规范只是为了防止\
  \ Agent 互相干扰，这是一个信号。你花在定义边界上的时间越多，从并行性中获得的收益就越少。\n\n\n\n\n*   **探索性或不确定性工作**：当你尚未知道正确的方法时，例如调试棘手的问题或为不明确的设计制作原型，并行代理只会增加不确定性。一次专注的迭代会话比多个代理同时探索死胡同更有效。\n\
  \n**专业提示**：\n\n心智模型：当任务独立、定义明确且涉及代码库的不同部分时，并行代理效果最佳。拿不准时，先按顺序执行，确认任务间无交互后再并行化。\n\
  \n**并行开发检查清单**：\n\n1.  确保每个任务操作独立的文件/组件\n2.  验证每个代理提示词中的起始分支是否正确\n3.  推送到目标分支前测试合并结果\n\
  4.  合并后清理工作树目录\n\n# 总结\n\n在本章中，你学习了如何在桌面应用程序中使用 `Claude Code`，在 `Local` `worktree`\
  \ 和云模式之间切换，并行运行多个编码代理。你了解了 Git 工作树如何隔离功能开发，后台代理如何在云端运行，以及如何将独立开发的分支合并、测试并整合到单一的工作代码库中。你还探索了相同的工作流如何延伸到移动端，在那里所有执行都发生在云端。\n\
  \n这些信息很有用，因为它演示了如何从顺序开发转向编排的、多代理工作流。通过理解如何管理并行分支、协调本地和远程代理以及安全地合并它们的输出，你可以在保持对代码库控制的同时，显著提高开发吞吐量。\n\
  \n在下一章中，我们将探讨深度代理及其在长时程任务执行中的作用。我们将定义深度代理的特征并分析 `LangChain` 深度代理框架，包括其架构和执行模型。\n\
  \n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_10_39.png)\n\n![Image](img/B37082_10_40.png)\n\n*注意：请准备好发票。直接从\
  \ Packt 网站购买的不需要发票。*\n\n# 11\n\n# 理解深度代理\n\n在本章中，我们将深入探讨深度代理。深度代理是具有能力、实用性，并被设计用于执行各种任务的代理，特指那些需要跨多个步骤进行持续推理和行动的长时程任务。像\
  \ `Claude Code`、`Cursor CLI` 和 `LangChain Deep Agents` 这样的编码代理就属于这一类。这些系统不局限于单步工具使用；它们在扩展的工作流中运行，做出决策、调整计划，并迭代行动，直到达成更广泛的目标。\n\
  \n我们首先对深度代理进行分类，确定什么样的代理符合“深度”资格，并识别出将它们与简单代理模式区分开来的决定性特征。由此，我们在高层定义什么使代理成为深度代理，并考察那些支持长时程执行的属性。\n\
  \n这为像 `Claude Code` 这样的最先进编码代理是如何实现的提供了一个实用的视角，将我们的理解建立在真实工程基础之上。\n\n本章将涵盖以下主题：\n\
  \n*   生产系统中的代理分类\n*   什么使代理成为深度代理\n\n# 生产系统中的代理分类\n\n在讨论深度代理之前，我们首先需要建立一个分类体系，并阐明目前整个行业在生产环境中使用哪些类型的代理。我将对此进行简化，并描述我对这一格局的看法。\n\
  \n![Figure 11.1 – Agent taxonomy showing coding agents within Deep Agents](img/B37082_11_1.png)\n\
  \n图 11.1 – 显示深度代理中编码代理的代理分类图\n\n在最广泛的层面上，我们有代理领域。该领域包括当前真实系统中部署的所有类型代理。这些可以是完全自主代理或代理式应用。一个常见的例子是混合\
  \ RAG 架构，其中 LLM 决定下一步执行哪个步骤。\n\n![Figure 11.2 – Hybrid RAG workflow orchestrated\
  \ by an LLM](img/B37082_11_2.png)\n\n图 11.2 – 由 LLM 编排的混合 RAG 工作流\n\n模型可能决定是否执行搜索、是否在检索前重述查询，或是否执行其他操作。LLM\
  \ 实际上是在预定义工作流中编排下一个动作。\n\n![Figure 11.3 – ReAct loop connecting the LLM to external\
  \ tools](img/B37082_11_3.png)\n\n图 11.3 – 将 LLM 与外部工具连接的 ReAct 循环\n\n在此范畴下，我们找到了\
  \ ReAct（推理与行动）代理。在 ReAct 代理中，LLM 决定是否使用工具。如果选择了工具，系统执行它并将结果作为观察返回。然后 LLM 决定是否有足够的信息返回最终响应。如果没有，它将继续循环：选择另一个工具，接收另一个观察，并迭代直到得出答案。\n\
  \n这个 ReAct 循环开启了更广泛的代理范式。大多数现代代理架构都可以追溯到这种算法结构。该方法在论文“[*ReAct: Synergizing Reasoning\
  \ and Acting in Language Models*](https://arxiv.org/abs/2210.03629)”中被提出。\n\n##\
  \ 浅层代理及其局限性\n\n在本分类中，我将 ReAct 代理归类为浅层代理。原因不是它缺乏实用性，而是它缺乏深入的能力。考虑一项需要彻底和扩展研究的任务。即使代理拥有搜索工具、维基工具或\
  \ Tavily 工具，它也不太可能执行足够深入的研究。这种局限性既源于架构设计，也源于现代 LLM 的现实。\n\n该代理依赖函数调用。在每个决策点，LLM\
  \ 进行函数调用以选择要执行的工具。函数调用本身没有错，尽管它有权衡。然而，核心局限在于上下文窗口。\n\n此循环的每次迭代都会向上下文添加更多信息。LLM 决定，执行工具，结果被注入回提示词，循环重复。一两次迭代还能控制。随着迭代次数增加，上下文变得越来越大。\n\
  \n这种增长导致上下文腐烂。我们开始看到上下文混淆、上下文矛盾和上下文污染。随着时间的推移，性能下降，代理可能跑偏。\n\n![Figure 11.4 – Context\
  \ accumulation in iterative tool-calling workflows](img/B37082_11_4.png)\n\n图 11.4\
  \ – 迭代工具调用工作流中的上下文累积\n\n当处理复杂、长时间运行的任务时，这种局限性变得至关重要，例如实现一个功能、对一个主题进行深度研究，或执行一个需要持续推理和信息收集的多阶段工作流。这些从根本上不同于简单的请求，如预订航班。\n\
  \n除了质量下降，成本也会增加。每次 LLM 调用变得更重，因为它包含更多 Token。更多 Token 增加了延迟和费用。虽然 ReAct 架构是基础且强大的，但它不太适合复杂的长时程任务。\n\
  \n也就是说，浅层代理对于仅需几次迭代的任务非常有效。许多生产系统成功使用此架构。在许多现实用例中，此模式已足够，不需要额外的复杂性。\n\n# 深度代理\n\n\
  回到分类体系，我们现在从浅层代理转向深度代理。\n\n\n\n\n# 深度代理\n\n深度代理旨在执行长周期任务。这些任务复杂，需要多次迭代，并涉及大量推理和处理。深度代理是长期运行的系统。它们可能运行数分钟、数小时，甚至数天。它们可以暂停执行、请求用户输入，并在收到输入后恢复。\n\
  \n## 深度研究代理\n\n深度研究代理是常见的例子。像 Perplexity 这样的系统暴露了触发深度代理运行的深度研究功能。许多供应商现在提供类似的研究能力。`Claude\
  \ Code` 包含研究选项。`ChatGPT` 包含研究选项。这些中的每一个都会触发深度代理实现，尽管内部设计因供应商而异。\n\n也有开源的深度研究代理。`GPT\
  \ Researcher` ([`github.com/assafelovic/gpt-researcher`](https://github.com/assafelovic/gpt-researcher))\
  \ 是该类别中最受欢迎的开源项目之一。我为它创建了一门课程。您可以在此找到：[`www.udemy.com/course/langchain/?srsltid=AfmBOopb6uyyf5oNvX1gvDus-Nqdln5B-bwZtJAW1NLsv7z7ggPJLX9A`](https://www.udemy.com/course/langchain/?srsltid=AfmBOopb6uyyf5oNvX1gvDus-Nqdln5B-bwZtJAW1NLsv7z7ggPJLX9A)。\n\
  \n## 编码代理作为深度代理\n\n深度代理的另一个主要子集是**编码代理**。例子包括 `Claude Code`、`Devin`、`Cursor` 和 `Gemini\
  \ CLI`。编码代理是深度代理如何在行业中有效且被广泛采用的最有力演示之一。数百万开发者在使用它们。\n\n正如您所见，对于本书，我主要关注 `Claude\
  \ Code`，在撰写本书时，它是最流行的编码代理之一。`Claude Code` 能力极强，可以处理各种需要深度和规模的长期运行任务。\n\n我们可以要求此类代理实现一个应用程序或功能。它不仅仅生成代码。它可以运行测试、执行应用程序、打开浏览器、截屏，并执行软件工程师手动执行的许多相同步骤。\n\
  \n因此，编码代理是深度代理的一个专业化子集，专门针对软件开发工作流进行定制。\n\n## 应用层的创新\n\n深度代理目前推动了该领域的大部分创新。LLM 仍在改进，但这些改进是渐进的。推理质量提高。能力扩展。然而，进步是增量式的，而非指数级的。\n\
  \n与此同时，建立在 LLM 之上的应用层正在快速推进。通过在代理之上分层抽象并在系统内组合代理，我们可以构建高度强大的机器，以自动化复杂的人类推理任务。这个应用层通常被称为**代理工具箱**。\n\
  \n**代理工具箱**是一个用于构建 AI 代理的即用型环境。它位于运行代理的工具和系统之上，并预配置了您所需的一切：默认提示词、工具处理、规划、文件访问等。框架为您提供原始构建块。运行时管理执行。工具箱完成繁重的工作，以便您无需从头设置一切即可开始构建。\n\
  \n五年前，AI 系统能够在没有人工干预的情况下从头创建一个功能完善且视觉精美的应用程序这一想法似乎不切实际。如今，这种能力已成为现实。\n\n关键驱动力不仅是基础模型的改进，还在于我们作为开发者如何驾驭它们（工具箱工程）。创新正发生在应用层，在于我们如何实现和编排深度代理。\n\
  \n# 是什么让代理变得“深度”？\n\n深度代理没有严格的正式定义。在实践中，我认为如果代理能够以质量和可靠性执行复杂的长期运行任务，则它是深度的。\n\n\
  要实现这一点，深度代理需要解决上下文膨胀和累积问题的能力。核心挑战变成了上下文工程和智能上下文管理。没有它，长周期执行就会崩溃。\n\n大多数深度代理实现了几个常见的想法：\n\
  \n*   **规划工具**：代理在执行步骤前规划它将要做什么。\n*   **子代理能力**：系统生成在隔离上下文中运行的专业工作者。这允许并发执行，而不会使单个共享上下文膨胀。\n\
  *   **用于中间状态的文件系统**：中间结果和共享状态被写入磁盘，而不是完全保留在 LLM 上下文中。这防止了不受控制的上下文增长。\n*   **大型系统提示词**：深度代理通常依赖于一个综合性的系统提示词，该提示词编码了指令、约束和操作指导。\n\
  \n如果我们检查现代深度代理实现，通常会以某种形式看到这四个想法。在下一节中，我们将深入探讨这些组件中的每一个并检查具体实现。\n\n![图 11.5 – 深度代理架构的核心组件。改编自：LangChain\
  \ 博客，深度代理，https://blog.langchain.com/deep-agents/](img/B37082_11_5.png)\n\n图 11.5\
  \ – 深度代理架构的核心组件。改编自：LangChain 博客，深度代理，https://blog.langchain.com/deep-agents/\n\n\
  ## 深度代理中的规划工具\n\n虽然“深度代理”是一个通用术语，但 LangChain 团队在分析多个深度代理实现后对其进行了清晰的阐述。每个深度代理都包含一个规划工具。\n\
  \n当我们运行该工具时，我们会看到一个任务列表：一些已经完成，一个可能正在进行中，其他的排队等待执行。我们观察到的不是通过模型内部的思维链推理进行的隐式规划。相反，深度代理依赖显式规划工具。\n\
  \n这种规划机制通常以 Markdown 格式的**待办事项列表**形式实现。在执行步骤之间，代理主动审查并更新此计划。该计划是动态的。任务被标记为*待处理*、*进行中*或*已完成*。如果任务失败，代理不会像原始\
  \ `ReAct` 代理循环那样盲目重试。相反，规划工具以更受控的方式帮助引导执行。\n\n该计划持续更新，用户可以影响任务列表。在 `Claude Code`\
  \ 中，规划工具本身是内部的，其实现无法直接访问。在实践中，会调用 `TodoWrite` 和 `TodoRead` 动作。`TodoWrite` 工具创建和更新待办事项列表，接受\
  \ `{todos: Todo[]}` 参数。`TodoRead` 工具读取当前列表。此调用更新待办事项列表，反映执行计划的变化。即使内部推理不直接可见，`TodoWrite`\
  \ 和 `TodoRead` 等动作也能让我们洞察代理在处理任务时如何动态调整其计划。\n\n深度代理持续更新此待办事项列表，这提高了可靠性并增加了成功完成复杂任务的可能性。从概念上讲，这是直观的。在处理复杂工作时，我们将其分解为较小的任务并随时间跟踪进度。规划工具将这一相同模式形式化到了代理架构内部。\n\
  \n## 子代理和分层委托\n\n我们讨论了规划工具，或待办事项列表工具。深度代理的另一个决定性特征是子代理能力。\n\n深度代理利用子代理实现分层委托。主代理可以生成其自身的新实例，但这些实例是针对专注任务进行专业化的。每个子代理都有自己的系统提示词、自己的描述和自己的工具集，如下图所示：\n\
  \n![图 11.6 – 使用子代理进行分层委托](img/B37082_11_6.png)\n\n图 11.6 – 使用子代理进行分层委托\n\n\n\n\n\
  \n# 这种设计反映了现实生活中委派的工作方式\n\n在委派任务时，仅仅分配工作是不够的。受委派方必须具备正确的技能和正确的工具。清晰地沟通需要做什么也是必要的。\n\
  \n## 考虑一个实际例子\n\n假设有一项任务需要特定的工艺技能，例如修复房屋的结构问题。如果缺乏所需的专业知识，该任务必须委派给拥有适当技能和工具的人。此人自带设备，独立执行工作，并交付最终结果。中间步骤的细节对于原始请求者来说保持隔离。重要的是最终结果。\n\
  \n## 这是子代理的一个有用类比\n\n主代理通过提供清晰的描述来委派任务。子代理使用自己的工具和内部指令运行，独立执行工作，并返回结果。在执行过程中，子代理在隔离环境中工作。主代理看不到每一个中间推理步骤。它只接收最终输出。\n\
  \n## 从系统视角来看\n\n这意味着子代理在它们自己的上下文窗口中运行。它们不会污染主代理的上下文。每个子代理可以拥有不同的系统提示词和一组针对其专业化定制的不同工具。这通过将聚焦的职责分配给专业化代理，实现了扩展并提高了质量。\n\
  \n## 内部机制\n\n子代理执行它们自己的工具调用循环，包括它们自己的 ReAct 风格循环。完成后，它们仅返回最终响应，而不是完整的中间观察链。这种委派模式实现了上下文隔离，防止专业化工作膨胀主代理的上下文，并允许任务并行执行。因此，效率和深度都得到了提升。\n\
  \n## 实践中\n\n我们可以在 Claude Code 等系统中观察到这种模式。请看以下示例：\n\n![Figure 11.7 – Claude Code\
  \ spawning a subagent to explore authentication patterns](img/B37082_11_7.png)\n\
  \n图 11.7 – Claude Code 生成子代理以探索认证模式\n\n在此示例中，Claude Code 生成一个探索代理来搜索认证模式。该探索代理并发运行，执行自己的搜索，并在主代理继续执行的同时独立运行。这展示了对子代理和层级委派的内置支持。\n\
  \n到目前为止，讨论侧重于概念和架构推理，而非实现细节。此处的目标是使概念结构清晰，并将这些能力与日常工作流中使用的工具联系起来。\n\n这直接建立在 *第 7\
  \ 章* 讨论的基础上，在该章中，我们探讨了子代理如何防止上下文膨胀、强制上下文隔离，并最终带来更好的结果。\n\n# Deep Agents 中的文件系统访问\n\
  \nDeep Agents 的另一个关键特征是对文件系统的访问。Deep Agents 配备了搜索文件、读取文件、更新文件、删除文件的工具，并总体上保持对文件系统的完全控制。这种能力在管理长时程任务的上下文中起着核心作用。\n\
  \n## 在 Claude Code 中\n\n这通过一组文件操作工具体现出来。\n\n![Figure 11.8 – Claude Code file operation\
  \ tools available to the agent](img/B37082_11_8.png)\n\n图 11.8 – 可供代理使用的 Claude\
  \ Code 文件操作工具\n\n正如你所见，有一个用于读取文件内容的 `Read` 工具，一个用于创建或覆盖文件的 `Write` 工具，以及一个用于执行精确字符串替换的\
  \ `Edit` 工具。此外，Claude Code 还提供 `Glob` 和 `Grep` 工具来搜索文件和在文件内搜索。\n\n如果我们查阅 LangChain\
  \ 的 Deep Agents 文档，会看到一个类似的文件系统接口：`ls`、`read_file`、`write_file`、`edit_file`、`glob`\
  \ 和 `grep`。Deep Agents 暴露的是一个接口而非特定实现。这意味着底层存储可以各不相同。例如，文件系统可以由 Google Cloud 上的\
  \ Firestore 或 AWS 上的 DynamoDB 提供支持。接口保持不变，而实现是灵活的。\n\n### 为什么文件系统对长时程任务很重要\n\n正如之前讨论的，随着对话的增长，上下文窗口也随之增长。这会导致一系列问题，最终导致上下文腐烂。上下文腐烂会产生来自\
  \ LLM 的降级响应。这种降级可能源于上下文矛盾、上下文混淆或提示词中的过度噪音。\n\n在 LangChain 的一篇博客文章中，有一个说明捕捉了代理上下文工程的核心挑战。此处所示的图表受该解释启发。\n\
  \n![Figure 11.9 – Available context vs. selected context vs. required information.\
  \ Source: LangChain Blog, How agents can use filesystems for context engineering,\
  \ https://blog.langchain.com/how-agents-can-use-filesystems-for-context-engineering/](img/B37082_11_9.png)\n\
  \n图 11.9 – 可用上下文 vs. 选定上下文 vs. 所需信息。来源：LangChain Blog，代理如何利用文件系统进行上下文工程，https://blog.langchain.com/how-agents-can-use-filesystems-for-context-engineering/\n\
  \n想象一个巨大的蓝色矩形（框 1），代表所有可用上下文：代码库、文档、网络搜索结果、文件和数据库。这个空间可能很大且混乱。\n\n在此范围内，框 2 代表代理为给定步骤选择并拉入上下文窗口的信息子集。这是代理选择阅读或搜索的内容。最后，框\
  \ 3 代表代理完成任务实际需要的信息。\n\n每当红圈不能与绿圈正确对齐时，会出现几种失效模式：\n\n*   **检索不足**：代理仅检索了框 2 的一部分，遗漏了必要信息。\n\
  *   **过度检索**：`框 2` 变得太大，引入了过多噪音并稀释了信号。\n*   **检索错位**：代理在错误的地方搜索，`框 1` 与 `框 2` 完全没有重叠。\n\
  *   **上下文窗口限制**：紫色框是有限的。它无法容纳所有内容，如果变得太大，性能会下降。\n\n上下文工程的目标是使红圈尽可能小，同时完全覆盖绿圈。这种选择过程几乎可以在代理的每次迭代中发生。每一步都需要优化在上下文窗口中包含什么内容。\n\
  \n因此，信息如何被结构化、检索和优先排序，往往比提示词本身更重要。代理的质量取决于正确的信息是否存在于上下文窗口中。即使拥有强大的推理模型，不正确或不完整的上下文也可能导致错误结果或无法完成任务。\n\
  \n### 文件系统作为上下文引擎\n\n这就是深度代理的文件系统变得至关重要的地方。文件系统充当引擎，使代理能够触达正确的上下文。概念上，整个文件系统对应于可用信息的蓝色矩形：\n\
  \n1.  首先，文件系统允许代理将上下文写入持久化存储。临时结果、中间输出或检索到的信息可以写入文件。这些工件被存储在外部，而不是膨胀上下文窗口。\n2. \
  \ 其次，文件系统提供了选择相关上下文的机制。诸如 `glob` 之类的工具允许代理按模式查找文件，`grep` 允许其使用正则表达式搜索文件内容。这些工具使代理能够精确检索下一步所需的内容。\n\
  \n\n\n\n通过这种方式，文件系统实现了语境工程的两大核心原则（第 1 章）：将语境写入持久化存储，以及选择性地检索相关语境。它是实现这两大功能的机制，也是\
  \ Deep Agent 能够管理长时任务且不会遭受语境膨胀之苦的基础。\n\n# 系统提示词\n\n在 AI 工程领域，“*系统提示词很重要*”这一说法已略显陈词滥调。然而，观察行业领军者的实际做法会发现，这一组件究竟有多关键。我们看到的系统提示词动辄数百行，并大量注入了庞大的工具描述。\n\
  \n公司投入巨大的工程资源，随着 LLM 的演进，迭代地策划、优化和更新这些提示词。对于 Deep Agent 而言，系统提示词是其推理、身份与边界的基础架构。\n\
  \n一份高效的系统提示词利用了最先进 LLM 天生擅长的能力：模式识别，以及将通用规则应用于特定新情境。一份精心设计的系统提示词能够实现以下目标：\n\n* \
  \  **确立清晰的身份与范围**：通过明确定义 Agent 是什么（例如“处理基础订单的客服”）和不是什么（例如“非销售或市场职能”），提示词能立即确立运作边界。\n\
  \n*   **赋能而非约束**：优秀的提示词不会在何时使用何种工具上做死板规定，而是确立最终目标（例如“高效解决问题”），并授权 Agent 自主选择合适的工具。\n\
  \n*   **提供推理框架，而非流程图**：提示词不提供僵化的“如果/那么”分支逻辑，而是给出可复用的框架（例如：1. 识别核心问题，2. 收集语境，3. 提供解决方案，4.\
  \ 确认满意度）。这教会模型如何应对问题，使其即便面对全新情境也能成功。\n\n*   **利用启发式边界**：它依赖压缩后的原则而非详尽的清单。例如，指示模型“始终选择最简单的解决方案”充当贪心算法启发式，在不浪费\
  \ Token 空间的前提下，指导模型跨越数千个潜在边缘场景。\n\n*   **保持语言效率**：优秀的提示词不浪费词汇。它避免重复和指令重叠，以免混淆 LLM\
  \ 或导致行为矛盾。\n\n以下是 LangChain Deep Agents 内置的系统提示词。该提示词可在官方仓库（[`github.com/langchain-ai/deepagents/blob/main/libs/deepagents/deepagents/base_prompt.md`](https://github.com/langchain-ai/deepagents/blob/main/libs/deepagents/deepagents/base_prompt.md)）中找到，遵循\
  \ MIT 许可证。\n\n```\nYou are a Deep Agent, an AI assistant that helps users accomplish\
  \ tasks using tools. You respond with text and tool calls. The user can see your\
  \ responses and tool outputs in real time.\n\n## Core Behavior\n\n- Be concise and\
  \ direct. Don't over-explain unless asked.\n- NEVER add unnecessary preamble (\"\
  Sure!\", \"Great question!\", \"I'll now...\").\n- Don't say \"I'll now do X\" —\
  \ just do it.\n- If the request is ambiguous, ask questions before acting.\n- If\
  \ asked how to approach something, explain first, then act.\n\n## Professional Objectivity\n\
  \n- Prioritize accuracy over validating the user's beliefs\n- Disagree respectfully\
  \ when the user is incorrect\n- Avoid unnecessary superlatives, praise, or emotional\
  \ validation\n\n## Following Conventions\n\n- Read files before editing — understand\
  \ existing content before making changes\n- Mimic existing style, naming conventions,\
  \ and patterns\n\n## Doing Tasks\n\nWhen the user asks you to do something:\n\n\
  1. **Understand first** — read relevant files, check existing patterns. Quick but\
  \ thorough — gather enough evidence to start, then iterate.\n2. **Act** — implement\
  \ the solution. Work quickly but accurately.\n3. **Verify** — check your work against\
  \ what was asked, not against your own output. Your first attempt is rarely correct\
  \ — iterate.\n\nKeep working until the task is fully complete. Don't stop partway\
  \ and explain what you would do — just do it. Only yield back to the user when the\
  \ task is done or you're genuinely blocked.\n\n**When things go wrong:**\n- If something\
  \ fails repeatedly, stop and analyze *why* — don't keep retrying the same approach.\n\
  - If you're blocked, tell the user what's wrong and ask for guidance.\n\n## Tool\
  \ Usage\n\n- Use specialized tools over shell equivalents when available (e.g.,\
  \ `read_file` over `cat`, `edit_file` over `sed`)\n- When performing multiple independent\
  \ operations, make all tool calls in a single response — don't make sequential calls\
  \ when parallel is possible.\n\n## File Reading Best Practices\n\nWhen reading multiple\
  \ files or exploring large files, use pagination to prevent context overflow.\n\
  - Start with `read_file(path, limit=100)` to scan structure\n- Read targeted sections\
  \ with offset/limit\n- Only read full files when necessary for editing\n\n## Progress\
  \ Updates\n\nFor longer tasks, provide brief progress updates at reasonable intervals\
  \ — a concise sentence recapping what you've done and what's next.\n```\n\n由此可见，系统提示词是认知基线。过度依赖具体的硬编码会破坏模型的推理能力，而依赖模糊的指令则会导致混乱的不一致性。\n\
  \n# 总结\n\n在本章中，我们建立了生产环境中 Agent 的实用分类法，识别了浅层 Agent 面对语境膨胀和长周期工作流时的局限性，并定义了什么是“深度”\
  \ Agent。随后，我们分析了支撑深度执行的核心构建模块：通过动态待办列表进行显式规划、通过在隔离语境中运行的专用子 Agent 进行层级委派，以及将文件系统访问作为持久化状态和精准语境选择的机制。通过将这些组件与\
  \ Claude Code 和 LangChain DeepAgents 等真实系统相关联，我们将讨论落实到了具体实现上。\n\n# 获取本书的 PDF 副本、代码包及更多内容\n\
