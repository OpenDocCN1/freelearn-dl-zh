  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 您可能感兴趣的其他书籍\n\n## 索引\n\n\n\n\n\n# 前言\n\n生成式 AI\
  \ 和编码代理正在迅速改变软件的构建方式。Claude Code、Cursor 和 LangChain 深度代理等工具不再局限于简单的基于提示词的交互。它们可以在整个代码库中操作，集成外部工具，并执行长时间运行的多步骤工作流。随着这些系统变得越来越强大，理解它们如何工作以及如何控制它们变得至关重要。\n\
  \n本书专注于建立对 `Claude Code`、代理工作流以及使现代编码代理高效运行的底层概念的深刻且实用的理解。贯穿全书的核心主题是上下文工程，它解释了代理在推理和行动时如何构建、管理和使用上下文。随着代理变得更加复杂和工具驱动，恰当的上下文处理直接影响性能、成本、可靠性和一致性。\n\
  \n在本书中，您将学习 `Claude Code` 如何与代码库交互，如何对其进行配置以供日常使用，以及如何使用 `Model Context Protocol`\
  \ (`MCP`) 对其进行扩展。您将探索 `GitHub Actions` 自动化、结构化规划、多代理工作流、子代理、输出样式和代理技能。本书还深入探讨了架构层面的主题，包括深度代理如何运作以及长时程工作流在实践中如何实现。\n\
  \n本书不仅关注表层用法，更旨在帮助您理解这些系统的设计原理以及它们为何会表现出此类行为。通过将实用示例与深层架构洞察相结合，旨在赋予您有效使用现代编码代理的技能，以及随着领域持续演进所需的适应性理解。\n\
  \n# 本书适读对象\n\n本书面向希望超越基于聊天的 AI，利用 `Claude Code` 和 `MCP` 构建代理化、自动化开发工作流的开发人员和工程师。适合具有软件工程经验的应用程序开发人员，他们希望将上下文感知的\
  \ AI 代理集成到终端和 IDE 中，自动化复杂的编码任务，并设计可扩展的多代理系统。\n\n对于与现代开发工作流紧密协作的 AI 工程师和生成式 AI 从业者，本书也将大有裨益。\n\
  \n为了最大程度地利用本书，您应具有使用 `Python` 或 `TypeScript` 编写和调试代码的经验，熟悉 `Git` 和开发环境的使用，并理解 `LLMs`、`RAG`\
  \ 和代理等核心生成式 AI 概念。本书非入门级读物，假设读者具备软件开发经验。\n\n# 本书内容\n\n* 第 1 章，《上下文工程》，介绍上下文工程并解释其在构建现代\
  \ AI 代理时为何至关重要。涵盖上下文如何从提示词工程演变而来，如何在复杂系统中增长，以及不当的上下文处理如何影响性能和成本。本章还探讨系统提示词以及使用 `Claude\
  \ Code` 进行实用上下文管理的方法。\n\n* 第 2 章，《`Claude Code` 要点》，提供 `Claude Code` 的实用介绍，并解释其如何与代码库交互。涵盖项目初始化、`CLAUDE.md`\
  \ 文件、权限和上下文管理。本章还介绍 `MCP`、规格驱动设计，并开始构建贯穿全书的 HookHub 项目。\n\n* 第 3 章，《`Claude Code`\
  \ 入门——核心命令速览》，专注于配置 `Claude Code` 以供日常使用。涵盖定价和认证、斜杠命令、用户级和项目级配置，以及与 `Cursor` 的集成。本章还探讨钩子、检查点、自定义命令，以及语言服务器协议的作用。\n\
  \n* 第 4 章，《使用 `MCP` 服务器和插件扩展 `Claude Code`》，解释 `Model Context Protocol` 及其如何标准化\
  \ AI 应用程序与外部工具之间的集成。涵盖 `MCP` 架构，包括主机、客户端和服务器，并演示如何配置本地和远程 `MCP` 服务器。本章还涉及上下文管理、性能考量和基于插件的扩展。\n\
  \n* 第 5 章，《使用 `Claude Code` 和 `GitHub` 自动化开发工作流》，探讨 `Claude Code` 与 `GitHub` 之间的集成。涵盖仓库配置、拉取请求和议题自动化，以及用于工作流执行的\
  \ `GitHub Actions`。本章还解释 `YAML` 工作流文件如何定义事件驱动的自动化。\n\n* 第 6 章，《`Claude Code` 规划与多代理工作流》，探讨使用规划和协调多代理执行的结构化代理工作流。解释规格驱动开发如何提高可预测性，以及多个代理如何在同一代码库中协作。\n\
  \n* 第 7 章，《使用 `Claude Code` 子代理》，介绍 `Claude Code` 子代理，并解释它们如何实现结构化和隔离的工作流。涵盖自定义子代理配置、上下文流，以及使用无限代理循环模式进行并发执行。\n\
  \n* 第 8 章，《创建和自定义输出样式》，探讨输出样式如何塑造 `Claude Code` 的响应。涵盖创建和限定自定义样式的作用域、诸如 `YAML` 之类的结构化格式，以及在样式定义中自动化行为。本章还解释如何管理角色和会话配置。\n\
  \n* 第 9 章，《理解代理技能》，探讨代理技能作为扩展 AI 代理能力的机制。涵盖基础概念、在 `Claude Code` 和 `LangChain DeepAgent`\
  \ 中的实用用法，以及调用技能时的内部上下文流。本章以一个真实的实现示例结束。\n\n* 第 10 章，《使用 `Claude Code` 桌面版》，解释如何在桌面应用程序中使用\
  \ `Claude Code`。涵盖本地模式和云模式之间的切换、使用 `Git` 工作树运行并行代理，以及跨环境协调特性分支。\n\n* 第 11 章，《理解深度代理》，探讨深度代理及其在长时程任务执行中的作用。定义深度代理的特征，并分析\
  \ `LangChain` 深度代理框架，包括其架构和执行模型。\n\n# 如何最大程度利用本书\n\n本书假设读者具备软件开发经验和生成式 AI 概念。开始阅读前，您应能熟练使用\
  \ `Python` 或 `TypeScript` 编写和调试代码，从终端运行程序，并操作代码库。需要具备基本的 `Git` 知识，如克隆仓库和提交更改。您还应了解虚拟环境和环境变量。\n\
  \n需要熟悉 `大语言模型` (`LLMs`) 以及代理、`RAG` 和 `ReAct` 等核心概念。您应曾与 `LLM` 交互过，并至少构建过一个简单的代理。本书不涵盖入门级编程或生成式\
  \ AI 入门主题。\n\n为跟随实操示例，您需要一个配备 `Node.js` 和简单 `Next.js` 设置的开发环境（早期章节会介绍）。您还需要访问 `Claude\
  \ Code` 并完成相应的认证和定价配置。部分需要安装和配置 `GitHub CLI`、操作 `GitHub` 仓库并使用 `GitHub Actions`。后续章节涉及配置本地和远程\
  \ `MCP` 服务器，以及在 `Cursor` 和 `Claude` 桌面应用程序中运行 `Claude Code`。\n\n\n\n\n建议您按照示例逐步操作，并在介绍配置时进行尝试。本书内容循序渐进，多章依赖于前文建立的项目和设置（包括\
  \ HookHub 项目）。\n\n本书包含的示例和截图改编自作者的原始课程材料，引用了为教学目的创建的代码库。\n\n## 免责声明\n\n本书为独立出版物，与\
