  *   将 Playwright MCP 连接到 Claude Code\n*   使用规格驱动设计\n*   使用规格驱动设计实现主页面\n\n好了，让我们开始吧！\n\
  \n## 安装 Claude Code\n\n在继续之前，请确保您的机器上已安装 Claude Code。\n\nClaude Code 现在提供原生安装程序，可检测您的操作系统并自动安装相应版本。请遵循官方安装指南：\n\
  \n<https://code.claude.com/docs/en/setup#native-install-recommended>\n\n安装程序会根据您的机器类型处理设置和更新。安装完成后，您可以通过运行以下命令进行验证：\n\
  \n```\nclaude --version\n```\n\n确认 Claude Code 安装正确后，继续进行下面的 Next.js 设置。\n\n本章中的所有终端命令均在\
  \ macOS 上演示。如果您使用 Windows，应在 `WSL`（`Windows Subsystem for Linux`）或同等的类 Unix Shell\
  \ 环境中运行这些命令。这可确保 `npx`、`npm`、`claude` 和其他 CLI 工具等命令按示例所示运行。\n\n## 设置 Next.js 项目\n\
  \n在本节中，我们将手动设置 Next.js 项目。虽然可以提示 Claude 创建 Next.js 项目，但我由于本地权限问题和需要预先处理的配置，选择手动操作。对于倾向于让\
  \ Claude 操作的读者，只要给予正确的语法，Claude 完全有能力运行这些 Bash 命令。\n\n我们首先设置一个 Next.js 项目。您可以遵循官方\
  \ Next.js 安装指南 (<https://nextjs.org/docs/app/getting-started/installation>) 或粘贴以下命令：\n\
  \n```\nnpx create-next-app@latest\n```\n\n从以下截图可以看出，我们位于 `project/HookHub` 分支。\n\
  \n![图 2.1 – project/hookhub 分支](img/B37082_2_1.png)\n\n我们粘贴命令并搭建 Next.js 项目。您将看到如下所示的继续选项：\n\
  \n```\nedenmarco@Edens-MacBook-Pro-2 claude-code-crash-course % npx create-next-app@latest\n\
  Need to install the following packages:\ncreate-next-app@15.4.6\nOk to proceed?\
  \ (y)\n```\n\n粘贴命令后，您可能会遇到错误。这是因为当前用户没有在系统上全局安装包所需的权限。\n\n有两种解决方法。一种是使用 `sudo` 运行命令。另一种是调整\
  \ `npm` 权限，以便在无需提升权限的情况下进行安装。为求简便，我们使用 `sudo` 重新运行命令，这将授予必要的权限。\n\n使用正确权限执行后，Next.js\
  \ 项目搭建成功进行。系统将提示您确认配置选项。选择默认选项并继续。随后将安装依赖项并生成 Next.js 项目的样板代码。\n\n安装完成后，进入新创建的项目目录：\n\
  \n```\ncd hookhub\n```\n\n现在启动开发服务器：\n\n```\nnpm run dev\n```\n\n如果您尝试从错误的目录运行服务器，命令将会失败。请确保在运行命令前位于项目目录内。\n\
  \n服务器成功启动后，在浏览器中打开 `http://localhost:3000`。您应该会看到默认的 Next.js 样板应用程序。\n\n\n\n\n此时\
  \ Next.js 项目已在本地运行，准备好与 Claude Code 集成。再次运行命令后，我们创建 `hookhub` 项目。对提示选择 **Yes** 并安装所有必需依赖。设置完成后，你将看到\
  \ Next.js 项目的样板代码。\n\n## 运行并验证应用\n\n一切就绪后，我们进入 `hookhub` 目录并使用 `npm run dev` 运行项目。\n\
  \nNext.js 应用现已运行。打开 `localhost:3000`，你将看到标准的 Next.js 样板应用程序，如下图所示：\n\n![Next.js\
  \ 默认应用在 localhost:3000 上运行](img/B37082_2_2.png)\n\n图 2.2 – 默认 Next.js 应用在 localhost:3000\
  \ 上运行\n\n## 初始化 Claude Code\n\n在进一步更改之前，返回 Claude Code 并为其提供项目上下文。这通过初始化 `CLAUDE.md`\
  \ 文件来完成，以便将其添加到项目上下文中。\n\nClaude Code 通过 Cursor 集成打开。我个人倾向于将 Claude Code 置于中央、代码编辑器置于右侧，如图所示。此设置使\
  \ Claude Code 能充当主要驱动力。\n\n![Claude Code 通过 Cursor 集成打开](img/B37082_2_3.png)\n\n\
  图 2.3 – 通过 Cursor 集成打开的 Claude Code\n\n使用 Claude Code 初始化项目的第一步是运行 `/init` 命令。无论项目是全新的还是已包含许多文件，均适用。执行\
  \ `/init` 时，Claude 会扫描文件、检查其内容，并开始生成对代码库的思考。\n\nClaude 识别技术栈、主要内容和目录结构。所有这些信息均被记录在\
  \ `CLAUDE.md` 文件中，稍后将在本书中探讨。这些 Markdown 文件最终将分布在项目各处，以支持上下文工程。这些文件的目的是随每次请求向 LLM\
  \ 发送高质量上下文。这使 LLM 能更容易地生成准确且有用的代码。\n\n当 Claude 运行时，其状态显示为 **Booping**。\n\n![Cursor\
  \ 集成中的 Booping](img/B37082_2_4.png)\n\n图 2.4 – Cursor 集成中的 Booping\n\n在此语境下，Claude\
  \ 正在分析仓库、探索目录结构并读取文件内容。之后，将创建一个任务来分析代码库结构，并执行一系列批量命令以列出和读取文件。\n\n请记住，对于较大项目，此过程可能耗时更长。完成后，Claude\
  \ 将基于收集的信息准备创建 `CLAUDE.md` 文件，并生成如下内容：\n\n![生成的包含项目概览和命令的 CLAUDE.md 文件](img/B37082_2_5.png)\n\
  \n图 2.5 – 包含项目概览和命令的生成的 CLAUDE.md 文件\n\n如你所见，已创建 `CLAUDE.md` 文件，包含项目结构及相关详情。\n\n\
  为保存文件，Claude 请求权限。我们可以允许其写入文件并继续编辑而无需进一步提示，或拒绝更改（若想修改或丢弃）。此权限系统适用于每个新文件或编辑。\n\n\
  ```\n在 Cursor 中打开更改\n保存文件以继续...\n\n是否要对 CLAUDE.md 进行此编辑？\n1. Yes\n2. Yes, and don't\
  \ ask again this session (shift+tab)\n3. No, and tell Claude what to do differently\
  \ (esc)\n```\n\n这是实践安全代理编码的重要组成部分。允许不受限制的访问会迅速导致意外的文件更改和错误。保持控制可确保更安全的工作流。\n\n暂时选择\
  \ **Yes** 并选择本会话不再询问。Claude 完成流程并创建 `CLAUDE.md` 文件。\n\n### CLAUDE.md 文件的内容\n\n该文件包含项目架构、结构和基本信息，例如：\n\
  \n*   项目目标\n*   要解决的业务问题\n*   项目如何运行\n*   使用的框架，包括 Next.js\n*   文件夹和目录结构\n\n从此时起，每当向\
  \ Claude Code 发送提示时，它首先加载相关的 `CLAUDE.md` 文件。这些文件随项目变化动态演变。发生重大更新时，可再次运行 `/init`\
  \ 命令，并根据需要添加额外的 `CLAUDE.md` 文件。\n\n随着更多元数据和结构信息的提供，Claude 能表现得更一致并生成更高质量的结果。\n\n\
  Claude Code 现在提供专用安装程序，可自动处理设置和更新。若出现问题，重新运行安装程序通常可解决。\n\n退出当前会话并重启后，将出现一个名为 `security\
  \ review` 的新命令。该命令引入一个子代理，旨在协助安全审查和针对常见漏洞的渗透测试。它分析你的代码库并标记常见问题，如不安全模式、错误配置，以及与 OWASP\
  \ Top 10 风险一致的漏洞。\n\n子代理将在 *第 3 章* 中深入探讨。\n\n# 将 Playwright MCP 连接到 Claude Code\n\
  \n我们首先在 Google 中搜索 Playwright MCP。对于不知情者，Playwright 是一种浏览器自动化工具，可使用模型上下文协议 (MCP)\
  \ 连接到 Claude Code。若你不知道什么是 MCP，不必担心，本书将深入介绍。甚至还有整章专门讲解 MCP。\n\n你可以将 MCP 视为我们可以为\
  \ Claude Code 配备的外部能力。在该仓库中，有关于如何将 Claude Code 连接到 Playwright MCP 的说明。向下滚动并找到以下命令：\n\
  \n```\nclaude mcp add playwright npx @playwright/mcp@latest\n```\n\n复制该命令并粘贴到终端。此时，我们正在使用\
  \ Claude Code **命令行界面** (**CLI**)。\n\n![在终端中运行 Claude Code CLI](img/B37082_2_6.png)\n\
  \n图 2.6 – 在终端中运行 Claude Code CLI\n\n在终端中，我们按如下方式输入命令：\n\n```\nedenmarco@Edens-MacBook-Pro-2\
  \ claude-code-crash-course % claude mcp add playwright npx @playwright/mcp@latest\
  \ -s user\n```\n\n如你所见，我们将 MCP 名称指定为 `playwright`，并使用 `npx @playwright/mcp@latest`，这是\
  \ Claude Code 拉取仓库并运行代码的位置。运行的代码即 Playwright MCP，这赋予了 Claude Code 浏览器自动化的额外能力。\n\
  \n我们还添加了 `‑s user` 标志。这确保 MCP 对我们打开的每个 Claude Code 实例均有效，因为它应用于用户作用域。通过这样做，我们利用了\
  \ Claude Code 的层级系统，这将在后续章节深入探讨。\n\n## 验证 MCP 连接\n\n现在，我们再次打开 Claude 并输入 `/mcp`。按\
  \ *Enter* 后，我们应该看到所有连接到 Claude Code 的 MCP 服务器。\n\n![在 Claude Code 中验证 MCP 服务器连接](img/B37082_2_7.png)\n\
  \n图 2.7 – 在 Claude Code 中验证 MCP 服务器连接\n\n我们可以看到 **playwright** MCP，也可以看到另一个名为 **context7**\
  \ 的 MCP，它是之前配置的。这是另一个有用的 MCP，稍后将讨论。\n\n### 使用 Playwright MCP 打开浏览器\n\n为验证 Playwright\
  \ MCP 集成，我们在 Claude Code 中输入 `open browser` 并添加 `cnn.com`。此时，我们再次遇到权限系统，类似如下所示：\n\
  \n![Playwright MCP 打开浏览器的权限提示](img/B37082_2_8.png)\n\n图 2.8 – Playwright MCP 打开浏览器的权限提示\n\
  \nClaude Code 通过工具使用请求提示我们，询问是否可以运行 Playwright 工具导航到 URL [cnn.com](https://cnn.com)。\n\
  \n\n\n这是一个已连接到 Claude Code 的外部工具，而非内置工具。内置工具包括编辑文件、创建文件或删除文件等。与之前一样，选择 **Yes**，并选择不再针对该特定工具询问。\n\
  \n浏览器打开，我们进入 [cnn.com](https://cnn.com)。Claude Code 利用 Playwright MCP 进行浏览器自动化并打开了该网站。\n\
  \n当我们想要测试用户界面或执行 UI 自动化时，这变得非常有用。\n\n## 使用 Cursor Rules 作为额外上下文\n\n接下来，打开浏览器搜索 `cursor\
  \ directory`，或直接访问 [`cursor.directory/`](https://cursor.directory/)。Cursor Directory\
  \ 是一个寻找有用 Cursor Rules 的地方。这些规则允许通过 Markdown 文件向 Cursor 提供额外上下文，例如 AI 编码助手的人设 ——\
  \ 比如让它表现得像一位专精特定领域的资深开发者。\n\n这些 Cursor Rules 同样适用于 Claude Code。要在实践中看到这一点，请寻找一个\
  \ Next.js 的 Cursor Rule，选中一个并按图示复制它。\n\n![A screenshot of a computer AI-generated\
  \ content may be incorrect.](img/B37082_2_9.png)\n\nFigure 2.9 – 浏览 Cursor Directory\
  \ 寻找 Next.js Rules\n\n### 创建前端记忆上下文\n\n我们回到 Cursor 并将其添加到 `CLAUDE.md` 文件中。我们已经拥有\
  \ Claude 之前创建的 `CLAUDE.md` 文件。我们还拥有一个更广泛的记忆系统，可向 Claude 提供额外上下文。\n\n在此例中，我们想给它 Cursor\
  \ Rule 和一位精通 Next.js 的专家人设，目标是产出更好的结果。我们首先创建一个名为 `memory` 的目录，然后在其中创建一个名为 `frontend`\
  \ 的子目录。在里面，我们创建一个名为 `CLAUDE.md` 的文件，并粘贴之前复制的 Cursor Rule。\n\n提到的记忆文件不会被 Claude 自动加载。这是有意为之。Claude\
  \ 默认仅自动加载特定的 `CLAUDE.md` 文件。在本章中，我们首先搭建记忆结构。在 *第 3 章* 中，我们将配置这些记忆文件何时以及如何被加载以影响回复。\n\
  \n我复制的规则包含如下内容：*\"You are a senior frontend developer and an expert in React, Next.js,\
  \ JavaScript, TypeScript, HTML, CSS…\"* 等等。实际上，我们赋予了 Claude Code 一个与我们使用的技术栈更契合的聚焦人设。\n\
  \n在之前的 `CLAUDE.md` 文件中，我们告知它我们使用 Next.js 技术栈。在该 `CLAUDE.md` 文件中，我们赋予它一个人设。\n\n此时，显然上下文对\
  \ LLM 至关重要。于是我们向 Claude 提出以下问题：\n\n```\nWhat are you expert in?\n```\n\n你可能期望它背诵自己是前端工程、Next.js、TypeScript\
  \ 及 `CLAUDE.md` 中所写一切的专家。然而，回复可能令人惊讶。\n\n回答返回了一个通用声明：\n\n![A screenshot of a computer\
  \ program AI-generated content may be incorrect.](img/B37082_2_10.png)\n\nFigure\
  \ 2.10 – 未加载项目上下文时的通用 Claude 回复\n\n如你所见，它说 \"expert AI assistant specialized in\
  \ software engineering and coding tasks\"，没有任何特定于 Next.js 或前端的内容。这看起来像是文件未生效。\n\n\
  然而，这是设计使然。Claude 拥有一套自动加载 `CLAUDE.md` 文件的系统，这将在 *第 3 章* 中深入探讨。还有其他称为记忆文件的文件，不会被自动加载。\n\
  \n相反，我们可以根据上下文显式告诉 Claude 何时加载它们。这为上下文工程打开了大门，本书将对此进行探索。\n\n思路是我们可以配置 Claude 仅在需要时加载前端上下文。例如，在设计或构建\
  \ UI 时、仅处理 TypeScript 文件时、在特定目录中工作时，或请求明确与前端工作相关时加载它。\n\n这赋予了我们根据需求定制 Claude 行为的自由。本书将演示这一点，其中一个提示是可以使用钩子来实现。我们可以引用其他文件的上下文，处理记忆有多种方式，将在本书后续章节深入探讨。\n\
  \n# 使用规格驱动设计\n\n在本节中，我们不采用氛围编程，而是使用所谓的 **spec-driven design**。这将在本书后续详细阐述，但核心思想是创建一个描述应用程序、用例或业务用例，以及可能的非功能性需求的规格文件。\n\
  \n我们创建的规格文件应指示 Claude 在编码时引用该规格文件。这有助于优化上下文窗口并改善结果。\n\n开始时，我们按 *Shift* + *Tab* 切换到\
  \ Claude Code 的 **plan mode**。Plan mode 专为这类任务设计，我们希望进行只读工作、做一些调研，并规划 Claude 将要做的事。\n\
  \n我输入了以下提示，请求 Claude 帮助为一个名为 HookHub 的项目编写规格文件。\n\n```\nI want you to help me write\
  \ a spec file for a project I am building. It's called \"hookhub\". It's a place\
  \ where cool open source Claude hooks are displayed and browsed. Search on Claude\
  \ hooks and write an initial spec for this. Remember it's an MVP ATM and we need\
  \ only the functionality of displaying the hooks. Hooks are found in GitHub repositories,\
  \ they have name, category, description and link to repo. The main page should display\
  \ the hooks in a grid-like view.\n```\n\n如提示所示，我\n\n*   将 `HookHub` 描述为展示和浏览开源 Claude\
  \ hooks 的场所\n*   请求 Claude `search for Claude hooks` 并编写初始规格\n*   阐明这是一个 `MVP`，功能仅限于展示\
  \ hooks\n*   指定 hooks 位于 `GitHub repositories` 中，包含名称、类别、描述和仓库链接\n*   说明 `main page\
  \ should display the hooks in a grid view`\n\n这是完整提示。没有花哨技巧，也未应用提示工程。\n\n提交提示后，Claude\
  \ 仅使用只读工具。此阶段不发生写入或编辑操作。\n\n由于我们在 plan mode 下工作，粘贴提示前还需选择模型。使用 plan mode 时，通常倾向于具有深度推理能力的重量级模型。为控制使用哪个模型，我们运行\
  \ `/models` 命令并确保选中最新版 Opus。撰写时，这是可用于深度推理的最先进模型。粘贴提示时，我们仅看到文本的代表性显示而非实际文本。\n\nClaude\
  \ 开始调研 Claude hooks。它使用网络搜索工具，查询与开源 Claude Code hooks 相关的内容，并请求获取 Anthropic 文档的权限，我们批准后继续。\n\
  \n调研步骤完成后，Claude 提出类似以下的计划：\n\n![A screenshot of a computer program AI-generated\
  \ content may be incorrect.](img/B37082_2_11.png)\n\nFigure 2.11 – HookHub MVP 规格的\
  \ Claude 建议计划\n\n计划包含：\n\n*   创建涵盖项目概览的规格\n*   MVP 范围\n*   Claude Code hook 的数据模型\n\
  *   UI 和 UX 需求\n*   技术架构\n*   用户故事\n*   未来考量\n\n此时，我们批准该计划。Claude 随后进入 write mode\
  \ 并请求将文件写入 `hookhub/SPEC.md`。拒绝并指示 Claude 将规格写入 `spec` 目录下，文件命名为 `CLAUDE.md`。\n\n\
  ```\nI want you to write it into a spec directory and make this a CLAUDE.md file\n\
  ```\n\n\n\nClaude 再次响应并准备在 `spec/CLAUDE.md` 下写入文件。批准此操作并允许编辑。\n\nClaude 首次提供待办事项列表。Claude\
  \ 开始遍历任务和请求。我们根据提示批准这些操作。\n\nClaude 创建 `spec` 目录并生成 `CLAUDE.md` 文件。我们将在本书后面更详细地介绍待办事项，但重要的是要注意，它们在结果质量中起着主要作用。这是\
  \ Claude Code 作为编码代理表现良好的原因之一。具体来说，Claude Code 表现为一种**深度代理**，能够处理需要大量推理的长期、多步骤任务。深度代理以及\
  \ Claude 如何融入这一类别将在本书后面介绍。\n\n## 审查生成的规格说明书\n\n流程完成后，我们现在有了一个新的 `CLAUDE.md` 文件。\n\
  \n![A screenshot of a computer AI-generated content may be incorrect.](img/B37082_2_12.png)\n\
  \n图 2.12 – CLAUDE.md 中的 HookHub 产品规格说明书\n\n该文件包含项目概览、愿景以及大量信息，这些信息将帮助 Claude 在实现过程中进行开发。\n\
  \n规格说明书提供了有用的上下文，例如钩子类别、钩子对象结构以及应用程序的外观。它还包括构建项目所需的步骤。此文档将被添加到代码库中，并将帮助 Claude 在实现过程中产生更好的结果。\n\
  \n至此，你应该了解使用 LLM 帮助生成规格说明书是一种常见模式。其他高级模式将在本书后面介绍。\n\n最后，将 `spec` 目录移动到 `memory`\
  \ 目录下。\n\n此时，你的结构应如下所示：\n\n```\nmemory/\n  ├── frontend/\n  │   └── CLAUDE.md\n\
  \  └── spec/\n      └── CLAUDE.md\n```\n\n这使得所有长期上下文都可以在一个地方存放，并在需要时重复使用。\n\n# 根据规格说明书实现主页面\n\
  \n在实现任何内容之前，我们切换模型并使用 **Sonnet**。在提示词中，我们编写以下内容：\n\n> Can you please help me implement\
  \ the main page grid as specified in the spec file?\n\n然后我们使用 `@` 符号标记规格说明书文件。我们拥有的规格说明书文件是\
  \ `spec/CLAUDE.md`。我们需要标记该文件以将其附加到上下文中。\n\n每次我们发出提示、获得结果，然后再发出另一个提示，我们都在不断填充上下文。随着时间的推移，这会导致我们与\
  \ Claude 之间进行多次来回迭代。\n\n如果我们继续使用同一个会话而不做任何处理，最终会填满上下文窗口。一旦发生这种情况，结果质量就会开始下降。\n\n\
  有几种方法可以处理这个问题。本书后面将介绍自定义命令，它们有助于清理或总结上下文窗口，同时保留有用的部分。目前，我们使用一种简单、朴素的技术。Claude Code\
  \ 还提供内置命令，如 `/clear` 和 `/compact`，用于在不重启会话的情况下管理上下文窗口。这些命令之前已介绍过，我们稍后将重温它们。目前，重启会话以最直接的方式为我们提供了一个干净的环境。\n\
  \n我们通过运行 `/exit` 退出当前的 Claude Code 会话。之后，我们再次打开 Claude，导航到 HookHub Next.js 项目，并从那里打开它。此时，上下文是新鲜且空的。\n\
  \n我们再次编写提示词：*Can you please implement the main page, a grid of the hooks, as specified\
  \ in the spec file?*\n\n这一次，我们注意到找不到文件引用。原因是在 `HookHub` 目录中打开 Claude Code，但 `memory`\
  \ 目录仍位于项目的根目录下。\n\n为了修复这个问题，我们在层级结构中向上移动 `memory` 目录，使其位于 `hookhub` 下。完成此操作后，文件引用将按预期工作。在此移动后，`memory`\
  \ 目录不再位于速成课程的根层级。它现在位于 HookHub 项目目录内部。\n\n## 运行实现\n\n我们再次编写提示词，根据规格说明书实现网格。Claude\
  \ 现在开始繁重的工作。它创建一个待办事项列表，并开始实现列表中的每个任务。\n\n将出现一个批准文件写入的请求，例如创建 `Hooks.ts` 文件。批准后，实现将继续并需要一些时间才能完成。\n\
  \n实现完成后，钩子卡片组件被创建，Claude 继续执行剩余步骤。然后它运行代码检查以捕获潜在错误。完成后，我们将看到实现内容的摘要，包括卡片组件、Hero\
  \ 区域、页眉和其他相关部分。\n\n![A screenshot of a computer AI-generated content may be incorrect.](img/B37082_2_13.png)\n\
  \n图 2.13 – 代码生成后的 Claude 实现摘要\n\n在浏览器中刷新应用程序，你将看到一个 Claude Code 钩子卡片网格。\n\n![A screenshot\
  \ of a computer AI-generated content may be incorrect.](img/B37082_2_14.png)\n\n\
  图 2.14 – 基础 Next.js 应用程序\n\n这是一个基础的 Next.js 应用程序。虽然某些功能（如搜索）尚未实现，但其他功能已就绪。总体而言，它提供了一个可供我们继续构建的可靠骨架。\n\
  \n在本书后面，我们将探索用于 AI 编码的高级代理工作流。这包括动态启动多个子代理、迭代 UI 组件和使用元提示。该项目将作为这些实验的基础。\n\n此时，我们将代码提交到代码库以便共享。我们运行\
  \ `git status`，添加所有文件，并确认未包含任何密钥或环境变量。\n\n然后我们使用诸如 *initial project* 之类的消息提交更改，并将它们推送到代码库。\n\
  \n从代码库中，你可以导航到 `project/hookhub` 分支，查看文件，并从此提交拉取确切的代码。还提供了一个命令，以便你可以克隆代码库并在本地完成所有设置。要访问代码库链接，请按照*前言*中*下载示例代码文件*部分的步骤操作。\n\
  \n完成本章所有步骤后，你的 HookHub 项目应具有以下结构：\n\n```\nhookhub/\n  ├── app/\n  ├── components/\n\
  \  ├── memory/\n  │   ├── frontend/\n  │   │   └── CLAUDE.md\n  │   └── spec/\n\
  \  │       └── CLAUDE.md\n  ├── package.json\n  ├── next.config.js\n  └── ...\n\
  ```\n\n如果你的结构与此匹配，则你已正确设置好进入下一章的环境。\n\n# 总结\n\n在本章中，我们通过逐步完成设置和工作流的每个步骤，为使用 Claude\
  \ Code 奠定了实用基础。我们没有直接跳入高级功能，而是专注于理解 Claude Code 如何观察项目、如何通过 `CLAUDE.md` 文件构建上下文，以及如何依赖显式权限安全运行。这项基础工作至关重要，因为你从\
  \ Claude Code 获得的结果质量直接取决于你提供的上下文、结构和控制的质量。\n\n我们还了解到如何使用 MCP 扩展 Claude Code 的内置功能，外部工具（如\
  \ Playwright）如何融入工作流，以及为什么规格驱动设计有助于产生更一致、更可预测的结果。此处创建的 HookHub 项目不仅仅是一个示例，它是一个可工作的基线，将在我们探索更高级的代理工作流时重复使用。本章介绍的每个概念都是我们将在此基础上构建的内容，而不是从头开始重温。\n\
  \n在下一章中，我们将介绍定价和身份验证、斜杠命令、用户和项目级配置，以及与 Cursor 的集成。\n\n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问\
  \ [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_2_15.png)\n\n\n\n![Image](img/B37082_2_16.png)\n\n> **注意：**\
  \ 请准备好发票。直接在 Packt 网站购买不需要发票。\n\n# Claude Code 入门——核心命令速览\n\n在本章中，我们将从开始使用 Claude\
  \ Code 过渡到为其配置日常用途。目标是帮助您熟悉 Claude Code 在实践中的行为方式、如何在会话中控制它，以及如何对其进行设置，使其在各个项目中保持一致。\n\
  \n我们将简要介绍定价和认证，以便您在开始前选择合适的设置。之后，我们将重点关注您将持续使用的部分：用于管理会话和上下文的斜杠命令、用户级和项目级的配置，以及直接在\
  \ Cursor 等 IDE 中运行 Claude Code。然后，我们将在这些基础之上构建使长流程更安全、更可靠的功能，包括用于自动化的钩子、通过 `CLAUDE.md`\
  \ 文件实现的记忆、通过检查点实现的回溯，以及用于可重复、定义明确的工作流的自定义斜杠命令（技能）。\n\n技能可以使用 `/技能名` 语法手动调用，这也是旧版文档有时将其称为*技能*的原因。在内部，它们现在统一归属于\
  \ **Skills** 系统。\n\n本章将涵盖以下主题：\n\n*   Claude Code 的定价和计划\n*   使用斜杠命令控制 Claude Code\n\
  *   在 Claude Code 中使用钩子\n*   理解 Claude Code 中的记忆\n*   Claude Code 中的回溯功能\n*   Claude\
  \ Code 中的技能\n\n# Claude Code 的定价和计划\n\n在本节中，我们将讨论运行和使用 Claude Code 的定价选项及不同计划。我们从认证开始，因为您的认证方式也决定了代币使用的计费方式。\n\
  \n本节提到的定价和计划详情在撰写时是准确的。由于订阅层级、使用限制和计费政策可能会发生变化，请始终参考官方 Claude 定价页面以获取最新信息：[`claude.com/pricing`](https://claude.com/pricing)\n\
  \n![图 3.1 – Claude Code 认证选项屏幕](img/B37082_3_1.png)\n\n**图 3.1 – Claude Code 认证选项屏幕**\n\
  \nClaude Code 提供三种主要的认证和支付代币使用的方式。\n\n![图 3.2 – Claude Code 订阅和 API 计费的登录方式](img/B37082_3_2.png)\n\
  \n**图 3.2 – Claude Code 订阅和 API 计费的登录方式**\n\n## 选项 1：使用 Anthropic API 密钥\n\n其中一种选择是使用\
  \ Anthropic API 密钥进行认证。这采用按量付费的计费模式，用量通过 Anthropic 控制台追踪。此选项适合偏好基于用量计费，或希望在订阅前评估\
  \ Claude Code 的用户。\n\n在遵循本书内容时，若使用 Anthropic API 密钥方式，用量将取决于调用 Claude Code 的频率以及所使用的模型。\n\
  \n如果您选择此选项，请选择 API 密钥认证方式，并通过您的 Anthropic 组织授权 Claude Code。随后，Claude Code 将自动在终端中生成并配置\
  \ API 密钥。完成后，Claude Code 将按按量付费模式运行。\n\n### 使用 Anthropic API 时需注意的事项\n\n使用 API 密钥时，监控代币消耗非常重要。这可以直接在\
  \ Claude Code 内部通过 `/cost` 命令完成。该命令仅在 Claude Code 使用 Anthropic API 密钥认证时可用。它会显示消耗的代币数量及其分布情况。\n\
  \n![图 3.3 – 使用 /cost 命令监控代币用量](img/B37082_3_3.png)\n\n**图 3.3 – 使用 `/cost` 命令监控代币用量**\n\
  \n相同信息也可通过 Anthropic 控制台获取。费用为零是因为尚未使用任何代币。只需输入任意内容，收到输出后，再次输入 `/cost` 即可。\n\n![图\
  \ 3.4 – 运行提示词后的更新代币用量](img/B37082_3_4.png)\n\n**图 3.4 – 运行提示词后的更新代币用量**\n\n请记住，定价因所用模型而异。例如，使用\
  \ Opus 产生的代币成本高于其他模型。\n\n### 使用 API 密钥时的重要注意事项\n\n使用 API 密钥需要谨慎。存在意外泄露密钥的风险，这可能允许他人以您的名义消耗代币。极端情况下，这可能导致意外的高额费用。\n\
  \n此外，本书涉及代理、子代理和编排模式的使用，所有这些都可能消耗大量代币。如果配置错误，可能会同时触发许多代理，从而显著增加成本。\n\n降低此风险的一种方法是在\
  \ Anthropic 控制台中设置支出限额。Anthropic 允许您为账户定义使用限额，超出后将不再提供服务。有关配置这些限额的详细信息，请参阅 Anthropic\
  \ 设置页面（[`platform.claude.com/settings/limits`](https://platform.claude.com/settings/limits)）。\n\
  \n## 选项 2：使用 Claude 订阅\n\n如果您遵循了 *第 2 章* 中的设置，您正在使用选项 2，即通过 Claude 订阅进行认证。我们将在本书中始终使用此选项，即通过\
  \ Claude 订阅进行认证。通过这种方式，您可以将现有的 Claude 订阅直接连接到 Claude Code。这提供了无缝集成，并具有可预测的月度计费。\n\
  \nClaude 目前提供以下订阅层级：\n\n*   免费版 – 0 美元/月（不包含 Claude Code 访问权限）\n*   专业版 – 20 美元/月\n\
  *   Max 5x – 100 美元/月\n*   Max 20x – 200 美元/月\n\nClaude Code 访问权限从专业版及以上计划开始提供。\n\
  \n在本书中，我使用的是 Max 5x 计划，它提供比专业版更高的使用限额，同时对于常规开发工作流仍具成本效益。\n\n现在，与前一个选项不同，使用订阅计划时，费用监控的行为也不同。由于\
  \ Claude Code 的使用包含在订阅中，因此无需使用 `/cost` 追踪代币级别的成本。定价是固定的，尽管根据计划不同，使用限额仍然适用。\n\n![图\
  \ 3.5 – 使用 /usage 命令查看订阅用量](img/B37082_3_5.png)\n\n**图 3.5 – 使用 `/usage` 命令查看订阅用量**\n\
  \n### 此选项下的可用模型\n\n使用 `/models` 命令可查看可用模型。Claude Code 目前支持 Opus、Sonnet 和 Haiku：\n\
  \n*   **Claude Opus**：Claude Opus 是能力最强的模型，非常适合复杂任务和深度推理。它拥有 200K 代币的上下文窗口，通常用于深度规划或研究任务。由于成本较高，Opus\
  \ 通常不用于编写大量代码。\n*   **Claude Sonnet**：Claude Sonnet 在智能、速度和成本之间取得了平衡。它同样拥有 200K\
  \ 代币的上下文窗口，是本书中用于代码生成的主要模型。凭借其平衡性，Sonnet 在编写和修改代码时承担了大部分繁重工作。\n*   **Claude Haiku**：速度最快、最轻量的模型。它非常适合简单任务、快速迭代以及速度比深度推理更重要的低延迟工作流。\n\
  \n模型本身由 Anthropic 托管和提供服务。对于企业环境，也可以通过受支持的第三方云提供商访问，例如 AWS Bedrock、Google Cloud\
  \ Vertex AI 或 Microsoft Azure。这种设置通常被需要集中计费、云特定的合规控制、区域部署选项或通过现有云基础设施进行治理的组织所使用。\n\
  \n### 订阅计划和定价\n\nClaude 提供多个订阅层级。\n\n*   免费计划\n\n\n\n\n# 定价计划\n\n*   Pro 计划\n* \
  \  Max 5x 计划\n*   Max 20x 计划\n\n引入速率限制是为了防止滥用，例如共享凭证或滥用系统。这些限制适用于 Pro 和 Max 计划。\n\
  \n对于大多数用户，尤其是爱好者，建议从 Pro 计划开始。只有在需要更高使用量时，升级到 Max 计划才有意义。\n\n确切的使用限制难以量化，这并非 `Claude\
  \ Code` 独有。AI 编码代理的定价是整个行业持续面临的挑战。定价模式的变化导致开发者社区感到沮丧，这一领域仍在不断演变。\n\n本节旨在阐明可用的定价选项，帮助您了解使用\
  \ `Claude Code` 时的计费方式，以便选择最适合您需求的方案。\n\n## 选项 3：使用第三方云服务商\n\n`Claude Code` 还可以通过受支持的第三方云平台进行身份验证，例如\
  \ `Amazon Bedrock`、`Microsoft Azure AI` 或 `Google Cloud Vertex AI`。在这种情况下，计费和用量管理由所选云服务商管理，而非通过\
  \ `Claude` 订阅或 `Anthropic API key`。有关支持的第三方集成详情，请参阅官方文档：<https://code.claude.com/docs/en/third-party-integrations>\n\
  \n# 使用斜杠命令控制 Claude Code\n\n**斜杠命令** 是在 `Claude Code` 聊天中控制 `Claude Code` 功能和设置的主要方式。当我们输入\
  \ `/` 时，`Claude Code` 会显示可用命令列表，如下图所示：\n\n![Figure 3.6 – Listing available slash\
  \ commands in Claude Code](img/B37082_3_6.png)\n\nFigure 3.6 – Listing available\
  \ slash commands in Claude Code\n\n当我们与 `Claude Code` 进行大量对话时，对话历史会变得非常长，这会拖慢速度并导致上下文腐烂，这将在书中后面讨论。这也会花费更多费用，甚至如果\
  \ `Claude` 需要记住太多内容而感到困惑。\n\n为了应对这种情况，有两个命令：\n\n*   `/clear`，它擦除一切并重新开始，就像一张白纸\n\
  *   `/compact`，它创建重要内容的简短摘要，保留关键信息，并移除额外细节\n\n使用 `/clear` 和 `/compact` 有助于 `Claude`\
  \ 保持专注并随时间推移更好地工作。这就是上下文工程的实际应用（参见 *Chapter 1*）。\n\n让我们从零开始会话。为此，我们需要运行 `/clear`。\n\
  \n另一个值得注意的命令是 `/agents`，它有助于管理专用子代理。**子代理** 可以被视为为特定任务创建的专家助手，例如代码审查员、调试员或架构师。\n\
  \n它们拥有自己的上下文和工具，并作为多代理工作流的一部分使用。子代理和这些工作流将在后面的实操部分中介绍。\n\n接下来是 `/config` 命令。`/config`\
  \ 命令打开 `Claude Code` 的配置面板，显示设置和偏好。运行此命令后，您将看到如下所示的设置：\n\n![Figure 3.7 – Claude\
  \ Code settings panel with configuration options](img/B37082_3_7.png)\n\nFigure\
  \ 3.7 – Claude Code settings panel with configuration options\n\n例如，我们可以看到 **Auto-compact**\
  \ 已启用。这意味着当 `Claude` 检测到对话接近令牌限制或判断这是压缩上下文的好时机时，会自动运行 `/compact`。还有使用待办列表、检查点等设置。我们不会在此逐一介绍；完整且最新的设置列表请参阅官方\
  \ `Claude Code` 文档（<https://code.claude.com/docs/en/settings>）。\n\n除了各个选项本身，重要的是这些设置如何被组织和应用。`Claude\
  \ Code` 提供了一个细粒度的配置系统：\n\n*   用户级设置，存储在主目录下的 `.claude/settings`，适用于每个 `Claude Code`\
  \ 实例\n*   项目级设置，存储在项目目录中的 `.claude/settings.json`，仅适用于该项目，可与团队共享\n*   本地设置，允许个人微调而不影响共享的项目设置\n\
  \n这种结构使得维护全局默认值、应用项目级指南并保留个人偏好成为可能。全书中展示的设置均可根据个人和团队需求通过这些设置文件进行配置。\n\n最后，我们来看 `/cost`。由于此设置使用\
  \ `Claude Pro` 订阅，因此此处不显示成本监控，因为订阅包含 `Claude Code` 使用量。`/cost` 命令在您使用 `Anthropic\
  \ API key` 时变得更加相关。\n\n## 将 Claude Code 与 IDE 集成\n\n在结束本节之前，让我们看看如何将 `Claude Code`\
  \ 与 IDE 集成。在本例中，我们将把它与 `Cursor IDE` 集成。打开斜杠菜单并选择 **IDE** 以将 `Claude Code` 集成到 `Cursor`\
  \ 中。这将直接在 IDE 中安装 `Claude Code` 扩展。\n\n安装完成后，我们可以在 `Cursor` 中看到 `Claude Code` 扩展。\n\
  \n![Figure 3.8 – Claude Code extension inside the Cursor editor](img/B37082_3_8.png)\n\
  \nFigure 3.8 – Claude Code extension inside the Cursor editor\n\n您会注意到右上角的 `Claude\
  \ Code` 图标。这是大多数开发者在实践中使用 `Claude Code` 的方式。`Claude Code` 通常通过 `Cursor` 扩展打开，因此它直接在\
  \ IDE 内部运行。这使我们能在编辑器中工作，更清晰地查看差异，并将所有内容保持在一个地方。我们将在全书中使用此设置。\n\n我们还有 `/mcp` 命令，用于管理\
  \ MCP 服务器。通过此命令，我们可以添加、移除和列出所有已配置的 MCP 服务器。\n\n此时，尚未配置任何 MCP 服务器。MCP 服务器提供可添加到 `Claude\
  \ Code` 的额外功能。它们可能来自经过验证的供应商或开源项目，并能有效地用额外的工具和能力扩展 `Claude Code`。\n\nMCP 本身是一个深度话题。全书中，我们将把\
  \ MCP 服务器的集成和使用作为工作流的一部分。目前，假设您熟悉 MCP 服务器的基本概念。\n\n# 在 Claude Code 中使用钩子\n\n钩子是\
  \ `Claude Code` 中的一项强大功能。它们是在 `Claude Code` 工作流的特定节点自动运行的逻辑。\n\n![Figure 3.9 – Hook\
  \ configuration and security warning in Claude Code](img/B37082_3_9.png)\n\nFigure\
  \ 3.9 – Hook configuration and security warning in Claude Code\n\n例如，钩子可以在工具使用前或后运行，或在\
  \ `Claude` 完成工作时运行。它们有助于自动执行诸如格式化代码、运行测试或阻止不安全编辑等任务。通过这种方式，钩子确保这些操作无需人工干预即可一致地发生。\n\
  \n钩子是构建可靠工作流的关键部分，我们将在本书后面花费大量时间进行实操。简要预览一下，钩子还可以用于触发 `Claude` 的子代理。每个子代理都在自己的上下文中运行，并拥有自己的工具集，这为更复杂和强大的工作流打开了大门。\n\
  \n## 创建通知钩子\n\n现在让我们配置第一个钩子。在本节中，我们将构建一个简单的通知钩子，每当 `Claude` 完成输出生成时播放声音。\n\n所有相关代码均可在仓库的\
  \ `project/hooks‑notification` 下找到。在继续之前，请克隆仓库并检出 `project/hooks‑notification` 分支。\n\
  \n### 初始化环境\n\n请按以下步骤操作：\n\n1.  确保仓库包含所有必需工件，包括声音文件。除音频记录外移除所有内容，以便从头开始设置。\n\n\n\
  \n# 初始化 Python 环境并配置 Hook\n\n## 2. 初始化 Python 环境\n\n由于 Hook 是 Python 脚本，需要初始化 Python\
  \ 环境并安装依赖。使用 `uv` 初始化环境：\n\n> **提示**  \n> 此处使用 `uv`，这是 Astral 公司开发的快速 Python 包和环境管理器。若未安装\
  \ `uv`，请参考官方文档安装：[`docs.astral.sh/uv/.`](https://docs.astral.sh/uv/.)\n\n```bash\n\
  uv init\n```\n\n此命令会创建虚拟环境和主文件。\n\n## 3. 重命名并运行主文件\n\n将主文件重命名为 `play_sound.py`，然后运行：\n\
  \n```bash\nuv run play_sound.py\n```\n\n这将确认环境设置正确。\n\n## 4. 重新打开 Claude Code 并验证\
  \ Hook 尚不存在\n\n运行一个提示词，确认会产生响应但**不播放声音**。\n\n## 5. 让 Claude Code 编写 Hook 脚本\n\n\
  使用以下提示词：\n\n```\nI want you to please write a python script that is going to play\
  \ the sound @ulala.wav, every time the script runs.\n```\n\n让 Claude 编写一个每次运行时都播放录制声音的\
  \ Python 脚本。\n\n### 自定义通知声音\n\nHook 不依赖特定的声音文件，它只是播放脚本指向的任何文件。本节示例引用 `@ulala.wav`，但你可以替换为任何你喜欢的音频文件。\n\
  \n如果选择其他文件，请将其放在项目中（例如 `hooks/` 或 `assets/` 文件夹下），并更新脚本以使用新的文件名或路径。\n\n查看建议的更改。\n\
  \n![Figure 3.10 – Reviewing and approving hook file changes in diff view](img/B37082_3_10.png)\n\
  \n*Figure 3.10 – Reviewing and approving hook file changes in diff view*\n\n## 6.\
  \ 批准文件编辑\n\nClaude 显示 `diff` 视图，高亮显示新增和删除的行，并请求编辑 `play_sound.py` 的权限。选择批准选项：\n\n\
  ```\nChoose one of the approval options:\n1. Approve once\n2. Approve for the rest\
  \ of the session\n3. Reject and provide different instructions\n```\n\n选择“Approve\
  \ for the rest of the session”会更新本地设置，使 Claude 在本会话中不再针对该文件请求权限。此权限步骤是一项安全措施，因为\
  \ Claude Code 会直接修改文件。\n\n## 7. 安装所需依赖\n\n脚本使用 `pygame` 播放音频。运行以下命令安装：\n\n```bash\n\
  uv add pygame\n```\n\n## 8. 测试脚本\n\n再次运行脚本，确认声音播放正常：\n\n```bash\nuv run play_sound.py\n\
  ```\n\n## 9. 打开 Hook 配置，将脚本注册为自动化动作\n\n打开斜杠菜单，输入 `/hooks`，从提供的列表中添加新 Hook：\n\n*\
  \   **PreToolUse** – 工具执行前\n*   **PostToolUse** – 工具执行后\n*   **Notification** –\
  \ 发送通知时\n*   **UserPromptSubmit** – 用户提交提示词时\n*   **Stop** – Claude 结束响应前\n\n此步骤是必需的，以便\
  \ Claude Code 知道何时以及如何自动运行脚本，而不必每次手动执行。\n\n## 10. 选择 Hook 事件\n\n选择 **Stop** 事件，它在\
  \ Claude 完成响应前触发。这确保脚本在输出生成后立即运行，适合通知风格的 Hook。虽然存在其他事件，但目前该事件符合我们的需求。\n\n## 11.\
  \ 配置 Hook 命令\n\n将命令设置为：\n\n```bash\nuv run play_sound.py\n```\n\n如果脚本在文件夹中（如 `hooks/`）：\n\
  \n```bash\nyour/path/to/play_sound.py\n```\n\n这确保脚本在虚拟环境中运行。选择项目作用域，使 Hook 仅应用于此项目。\n\
  \n## 12. 查看生成的配置\n\n系统将创建一个 `.claude` 目录，其中包含一个设置文件，Hook 配置以 JSON 格式存储：\n\n```json\n\
  {\n  \"hooks\": {\n    \"Stop\": [\n      {\n        \"matcher\": \"\",\n      \
  \  \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"\
  command\": \"uv run /Users/edenmarco/GithubProjects/claude-code-crash-course/play_sound.py\"\
  \n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n空的 `\"matcher\": \"\"`\
  \ 字段表示该 Hook 适用于该类型的所有匹配事件。在此例中，它会在每个 Stop 事件上触发，无需额外过滤。\n\n配置指定了事件类型、可选的匹配器，以及\
  \ Claude 完成输出时要运行的命令。\n\n## 13. 重新加载 Claude Code\n\n退出并重新打开 Claude Code，以加载新设置。\n\
  \n## 14. 验证 Hook\n\n输入任意提示词，确认每当 Claude 完成响应时都会播放声音。这确认了 Hook 按预期工作。\n\n此时，Hook\
  \ 已完全配置。在 Cursor 中打开 Claude Code 并输入任意提示词：\n\n```\nhello how are you?\n```\n\n一旦\
  \ Claude 完成响应，通知声音应自动播放。\n\n这确认了：\n\n*   Python 环境已正确初始化\n*   脚本执行成功\n*   Hook 已注册并在\
  \ Stop 事件上触发\n\n如果没有声音播放，请重新检查 Hook 配置，确保命令路径正确。\n\n### 关于 Hook 与可扩展性的说明\n\n此 Hook\
  \ 不接收任何参数，但 Hook 可以配置为接收上下文信息。这可能包括用户输入、工具调用或其他运行时细节。Hook 最好组织在专用的 hooks 目录中，因为它们的功能类似于可复用的工具。\n\
  \nHook 还可以产生影响 Claude Code 后续行为的输出。它们可以阻止动作、修改行为，甚至触发子代理。更高级的 Hook 用法将在本书后面介绍。此示例仅作为简单入门。\n\
  \n技能继续按前文描述工作。内部上，命令已统一在技能的概念下。现有的 `.claude/commands/` 文件完全受支持，而 `.claude/skills/`\
  \ 下的等效技能定义行为相同。技能增加了可选结构、支持文件，并提供了对何时以及如何调用 Claude 的更多控制。更多关于技能的内容将在 *Chapter 9*\
  \ 中介绍。\n\n在继续之前，值得注意的是 Hook 是 Claude Code 提供的几种扩展行为机制之一。虽然 Hook 在特定执行点运行，但其他功能侧重于控制上下文和持久化，我们将通过记忆系统进一步探索这些功能。\n\
  \n> **最佳实践**  \n> **保持生产环境 Hook 轻量级。** Hook 会自动运行并可能频繁执行，因此繁重的脚本可能引入不必要的延迟。对于简单通知，极简的系统命令（如\
  \ macOS 的 `afplay sound.wav` 或 Linux 的 `aplay sound.wav`）通常比加载带有外部依赖的完整 Python 运行时更快。如果可能，请为高频\
  \ Hook 优先选择轻量级命令。\n\n# 理解 Claude Code 中的记忆\n\n在 Claude Code 中，记忆是指一种系统，允许 AI 保留并重用重要信息（如设置、规则和上下文细节）跨编码会话。记忆的目的是提高工作流效率并随时间保持一致性。\n\
  \n记忆主要通过称为 `CLAUDE.md` 的特殊文件来管理。这些文件存储指令和偏好，Claude Code 在每个会话开始时加载它们，并用于指导整个交互过程中的行为。\n\
  \n## 记忆类型\n\nClaude Code 中的记忆是细粒度的，可以在不同层级定义：\n\n\n\n\n# 存储层级\n\n## 用户内存\n用户级内存存储在用户的主目录下的\
  \ `~/.claude/CLAUDE.md` 中。此文件通常包含适用于所有项目的个人偏好，例如编码风格偏好、常用工作流、快捷方式及其他应保持一致的习惯，无论项目如何变化。\n\
  \n## 项目内存\n项目级内存存储为项目目录中的 `./CLAUDE.md` 文件。此内存通常包含团队共享的规则和项目特定上下文，如编码标准、架构决策及仅适用于该项目的常用工作流。\n\
  \n## 托管策略（组织级内存）\n由 IT 或 DevOps 团队管理的组织级指令。这些文件存储在系统级路径中（例如 macOS 上的 `/Library/Application\
  \ Support/ClaudeCode/CLAUDE.md`，Linux/WSL 上的 `/etc/claude‑code/CLAUDE.md`，或 Windows\
  \ 上的 `C:\\Program Files\\ClaudeCode\\CLAUDE.md`）。此内存用于公司级编码标准、安全策略和合规要求，适用于组织内的所有用户。\n\
  \n# Claude Code 如何读取内存？\n\nClaude Code 采用分层方法加载内存。从当前工作目录开始，它会递归向上搜索父目录以定位相关内存文件。所有发现的适用内存文件都会被加载到会话中并组合形成工作上下文。\n\
  \n这种设计允许 Claude Code 支持分层配置。全局偏好设置可与项目级规则共存，发生冲突时，更具体的指令会覆盖更宽泛的默认设置。\n\n## Claude\
  \ Code 内存层级\n\nClaude Code 将内存组织为多个层级，每个层级服务于不同目的。较高层级优先级更高，不能被较低层级覆盖：\n\n### Level\
  \ 1 – 托管策略（最高优先级）\n组织级规则，由 IT 或 DevOps 团队管理\n\n*   **位置**：系统管理路径（例如 macOS 上的 `/Library/Application\
  \ Support/ClaudeCode/CLAUDE.md`）\n*   **范围**：整个组织\n*   **覆盖行为**：不可被覆盖\n\n### Level\
  \ 2 – 用户内存\n此文件记录适用于所有项目的个人偏好\n\n*   **位置**：`~/.claude/CLAUDE.md`\n*   **范围**：仅个人\n\
  \n### Level 3 – 项目内存\n此文件定义项目的共享规则和约定\n\n*   **位置**：`./CLAUDE.md` 或 `./.claude/CLAUDE.md`\n\
  *   **范围**：团队共享并提交至版本控制\n\n### Level 4 – 项目规则\n对于大型项目，内存可拆分为特定主题的规则文件\n\n*   **位置**：`./.claude/rules/*.md`\n\
  *   **范围**：团队共享并提交至版本控制\n\n### Level 5 – 项目本地内存\n允许对特定项目进行个人覆盖\n\n*   **位置**：`./CLAUDE.local.md`\n\
  *   **范围**：仅个人，自动被 Git 忽略\n\n同一层级发生冲突时，更具体的文件（更接近当前工作目录）优先级更高。\n\n## 向上发现机制\n\n\
  启动时，Claude Code 从当前工作目录开始搜索内存文件，并继续向文件系统根目录方向搜索。\n\n例如，以下目录结构：\n\n```\n/Users/edenmarco/\n\
  ├── .claude/\n│   └── CLAUDE.md\n└── Desktop/\n    └── my-company/\n        ├──\
  \ CLAUDE.md\n        └── frontend/\n            └── CLAUDE.md\n```\n\n若从以下路径启动 Claude\
  \ Code：\n\n```\n/Users/edenmarco/Desktop/my-company/frontend/\n```\n\n会加载以下内存文件：\n\
  \n```\nfrontend/CLAUDE.md（当前目录）\nmy-company/CLAUDE.md（父目录）\n~/.claude/CLAUDE.md（用户级内存）\n\
  ```\n\n这三个文件组合形成有效上下文。\n\n## 嵌套内存文件的懒加载\n\n位于当前工作目录下方的内存文件不会立即加载。只有当 Claude Code\
  \ 访问这些子目录中的文件时，才会懒加载这些内存文件。\n\n例如，若在项目根目录启动 Claude Code，`backend/` 目录内的内存文件不会被加载，直到\
  \ Claude Code 开始处理该目录下的文件。\n\n## 在 Claude Code 中添加和编辑内存\n\n可使用井号（`#`）字符添加内存，这会提示\
  \ Claude Code 将信息存储在相应内存文件中。对于较大幅度的修改，可使用 `/memory` 命令直接在代码编辑器中打开内存文件。\n\n建议的最佳实践是保持内存文件简洁明确。过度填充模糊或过多信息会浪费\
  \ Token、引入困惑并降低结果质量。\n\n使用内存可减少重复指令，确保跨会话输出一致。这使交互更高效、更聚焦，同时保留重要上下文。\n\n若曾使用过 Cursor，此概念类似于\
  \ Cursor 规则。\n\n## 使用 /init 初始化内存\n\nClaude Code 还提供 `/init` 命令，可基于现有代码库初始化新的 `CLAUDE.md`\
  \ 文件。运行时，Claude 会检查项目文件并生成包含相关上下文信息的 `CLAUDE.md` 文件，以支持未来交互。\n\n本节主要侧重概念而非实操示例，后续章节将演示实际用法，帮助理解内存在真实工作流中的运作方式。\n\
  \n# 实操示例：在现有项目中使用内存\n\n为进一步说明内存的实际工作原理，我使用一个为 LangChain 项目创建的现有仓库。该项目旨在从 LinkedIn\
  \ 和 X 平台抓取信息并生成破冰话术。更多详情请访问 [`github.com/emarco177/IceBreaker`](https://github.com/emarco177/IceBreaker)。这是一个使用\
  \ LangChain Agent 构建的实用示例，非常适合演示 Claude Code 的能力。\n\n我们首先将仓库克隆到新目录并在 Cursor 中打开。本示例中目录命名为\
  \ `tmp3`。打开后可查看完整项目结构，这是一个基于 LangChain 技术栈构建的 Python 项目。\n\n![Figure 3.11 – Cloned\
  \ IceBreaker repository opened in Cursor](img/B37082_3_11.png)\n\nFigure 3.11 –\
  \ Cloned IceBreaker repository opened in Cursor\n\n随后打开 Claude Code 并将其固定在界面中。当提示时，批准\
  \ Claude Code 访问和分析项目文件的请求。\n\n第一步是运行 `/init` 命令为项目创建 `CLAUDE.md` 文件。运行初始化过程会导致\
  \ Claude 扫描仓库中的所有文件。它会识别技术栈、已安装包、所需环境变量及整体结构。基于此分析，Claude 生成捕获此信息的 `CLAUDE.md` 文件作为项目内存。\n\
  \n![Figure 3.12 – Claude scanning repository files to generate CLAUDE.md](img/B37082_3_12.png)\n\
  \nFigure 3.12 – Claude scanning repository files to generate CLAUDE.md\n\n此过程中，Claude\
  \ 会列出目录、搜索文件，并通过模式匹配和内容检查快速分析。读取文件后，它会生成建议的 `CLAUDE.md` 文件。\n\n![Figure 3.13 – Generated\
  \ CLAUDE.md file with project overview and architecture details](img/B37082_3_13.png)\n\
  \nFigure 3.13 – Generated CLAUDE.md file with project overview and architecture\
  \ details\n\n\n\n\n\n生成的文件包含诸如如何使用 `pip` 安装依赖、如何运行项目以及主要组件概览等详细信息，包括抓取、摘要和代理逻辑。一经批准，该文件将成为项目记忆的一部分。\n\
  \n从现在起，发送给 Claude 的每个提示词都将包含此 `CLAUDE.md` 文件的内容作为上下文的一部分。\n\n### 验证项目记忆\n\n为确认记忆功能正常工作，我们首先重置对话以消除先前聊天记录的任何影响。使用\
  \ `/clear` 命令，然后再次提问。例如，我曾询问 Claude 项目使用的技术栈：\n\n```\nWhat stack am I using for\
  \ this project?\n```\n\n输出应如下所示：\n\n```\nBased on the codebase analysis, your project\
  \ uses this tech stack:\n\nBackend Framework: Flask (Python web framework)\nAI/LLM\
  \ Framework: LangChain with OpenAI GPT models (GPT-4o-mini for agents, GPT-3.5-turbo\
  \ for content generation)\nData Sources: Scraping (LinkedIn), Twitter API, Tavily\
  \ (web search)\nPackage Management: Pipenv\nCode Quality: Black (formatting), isort\
  \ (import sorting), pylint (linting)\nTesting: pytest\nOutput Parsing: Pydantic\
  \ models\nFrontend: HTML templates with Flask templating\nEnvironment: Python 3.10+\n\
  The core architecture is a LangChain-powered AI pipeline that combines social media\
  \ data scraping with LLM-based content generation.\n```\n\nClaude 在无需调用任何工具的情况下提供了准确的回答。这些信息是在初始化期间\
  \ Claude 分析文件时推断出来的。\n\n至此，我们可以确认 Claude 依赖的是存储的记忆，而非聊天记录。\n\n### 添加和使用记忆条目\n\n\
  现在让我们看看如何添加新的记忆条目。此时，如果我们提出一个问题，例如 *What do I like to eat?*，Claude 会生成类似以下的回答：\n\
  \n```\n> what do i like to eat?\n\nI don't have any information about what you like\
  \ to eat. I can only see your codebase files and project structure, but there's\
  \ no personal information about your food preferences in this ice breaker application\
  \ repository.\nIf you'd like to share what you like to eat, I'd be happy to help\
  \ with any related coding tasks!\n```\n\n为了让 Claude 能够回答这个问题，我们使用井号语法添加一条记忆条目。在本例中，我们声明我们喜欢吃披萨，并将该条目存储在项目记忆中：\n\
  \n```\n# I like to eat pizza\n```\n\n添加此信息后，清除对话并再次提出相同的问题，Claude 现在将能够利用存储的记忆正确回答：\n\
  \n```\n> what do i like to eat?\nPizza\n```\n\n如果我们想添加另一条记忆条目，重复相同的过程并添加一条声明偏爱汉堡的新条目。这一次，该条目被存储在用户记忆中，位于\
  \ `~/.claude/CLAUDE.md`。清除对话并再次尝试提问。Claude 将正确回忆起这两种偏好：\n\n```\n> what do i like\
  \ to eat?\nBased on your CLAUDE.md files, you like to eat both Hamburger (from your\
  \ global preferences) and Pizza (from your project-specific memory).\n```\n\n同样的方法可用于其他类型的持久化信息，例如偏好的编码风格、常用工具，或我们希望\
  \ Claude 在跨项目和跨会话中记住的反复出现的工作流约定。\n\n### 使用多个记忆文件\n\n随着项目的增长，单个 `CLAUDE.md` 文件可能会变得庞大且难以管理。Claude\
  \ Code 支持在代码库中分布使用多个 `CLAUDE.md` 文件。Claude 会递归遍历目录结构，并将所有相关的记忆文件加载到上下文中。\n\n这使得记忆能够以结构化的方式进行组织。例如，服务端上下文可以位于一个区域，前端上下文位于另一个区域，而\
  \ DevOps 或 Claude 专用规则则位于别处。这种方法使记忆更易于维护且更具针对性。\n\n结合钩子使用时，这种设置能实现更高级的行为。例如，根据正在进行的工作类型，可以附加不同的记忆文件。上下文切换钩子可以在处理数据库代码时附加数据库相关的记忆、在处理\
  \ UI 组件时附加前端上下文、或在处理后端逻辑时附加 API 相关的记忆。\n\n这种级别的控制允许根据用户输入和工作流需求动态定制记忆，为更高级和灵活的上下文管理模式打开了大门。\n\
  \n# Claude Code 中的倒带功能\n\n在本节中，我们将探讨 Claude Code 的检查点和倒带功能，该功能允许您在编码会话中安全地撤销更改。Claude\
  \ Code 会自动跟踪每个提示词创建的文件修改，使得在需要时可以回滚不需要的编辑。\n\n要触发倒带，请按两次 `Esc` 键或使用 `/rewind` 命令。\n\
  \n## 倒带功能的优势与重要性\n\n该功能的价值显而易见：\n\n*   在尝试更大或更激进的更改时提供安全网\n*   允许在不丢失工作代码的情况下探索替代实现\n\
  *   使从错误中恢复变得快速且可预测\n*   通过让撤销操作变得简单，降低了纠正 AI 生成错误的成本\n*   增强了用户在使用 AI 辅助编码时的信心\n\
  *   通过降低使用 AI 工具的感知风险，鼓励更广泛的采用\n*   它与 **AI 恢复成本 (CAIR)** 指标密切相关（[`www.blog.langchain.com/the-hidden-metric-that-determines-ai-product-success/`](https://www.blog.langchain.com/the-hidden-metric-that-determines-ai-product-success/)），该指标衡量用户从\
  \ AI 错误中恢复的难易程度，并在课程后面重新探讨\n\n倒带功能在 Claude Code 最初发布几个月后引入。\n\n![图 3.14 – Claude\
  \ Code 发布时间线及倒带功能引入](img/B37082_3_14.png)\n\n图 3.14 – Claude Code 发布时间线及倒带功能引入\n\
  \n社区强烈呼吁倒带功能，且在它成为原生功能之前，已有多个开源工具尝试提供类似功能。如今，倒带功能直接内置于 Claude Code 中，且直观易用，几乎无需解释。为了解实际上倒带功能是如何显示和工作的，让我们简要回顾一下使用它的界面上下文。\n\
  \n## 实战中的倒带使用\n\n在撰写本书时，Claude Code 运行的是 2.1 版本。界面包含若干近期更新，包括视觉优化和 Sonnet 4.5 的使用，后者是\
  \ Anthropic 针对编码任务优化的最新模型。您还会注意到界面底部有一个自定义状态行。这是用户自定义的，将在本书后面介绍。\n\n为了演示倒带功能，我们从一个简单的\
  \ Next.js 示例开始：\n\n1.  向 Claude Code 提问，例如：\n\n```\nHow do I bootstrap a Next.js\
  \ project?\n```\n\n提示词在本地执行。设置完成后，使用 `npm run dev` 运行应用程序并在浏览器中打开。正如预期的那样，这将生成标准的\
  \ Next.js 样板应用程序。\n\n2.  然后我们有意对代码库应用一系列简短的增量更改。此处的目的不是评估用户界面的质量，而是模拟一个真实的开发工作流，其中更改可能稍后需要撤销。在我的示例中，我将执行以下操作：\n\
  \n    1.  首先，提示 Claude Code 为 HooksHub 创建一个具有视觉差异化风格的着陆页\n    2.  接着，提示 Claude Code\
  \ 添加一个常见问题解答 (FAQ) 部分\n    3.  最后，提示 Claude Code 添加一个页脚部分\n\n![图 3.15 – 使用 Claude\
  \ Code 生成的 HooksHub 着陆页](img/B37082_3_15.png)\n\n\n\n\n## 图 3.15 – 使用 Claude Code\
  \ 生成的 HooksHub 着陆页\n\n每个提示词都会导致文件编辑，这些编辑可通过 `diff` 视图查看，且每项更改都会即时反映在正在运行的应用程序中。\n\
  \n添加页脚后，显而易见，尽管该功能正常工作，但结果比预期更沉重、视觉上更具主导性。这是一个自然的节点，此时撤销更改比手动编辑代码或发出修正提示词更为合适。\n\
  \n### 3. 要还原更改，请使用 `/rewind` 命令调用倒带功能\n\n这将打开当前会话的时间线，显示迄今为止发出的所有提示词，并指示哪些提示词导致了文件修改。\n\
  \n![图 3.16 – 使用 /rewind 命令查看会话历史记录和文件更改](img/B37082_3_16.png)\n\n**图 3.16 – 使用 /rewind\
  \ 命令查看会话历史记录和文件更改**\n\n仅生成解释的提示词显示时不带关联的文件更改，而修改文件的提示词则清晰地显示受影响的文件和行。\n\n### 4.\
  \ 为您的示例选择最后添加的提示词\n\n在本例中，选择添加页脚的那个提示词。将向您显示三个选项：\n\n*   **还原代码和对话**，将文件和聊天上下文同时重置至该时间点\n\
  *   **还原对话**，保留文件更改不变\n*   **还原代码**，保留对话历史不变\n\n在实践中，同时还原代码和对话是最常见的选择，因为它能将项目恢复到干净一致的状态。仅还原代码在您希望保留对话上下文并重新处理实现时很有用。\n\
  \n### 5. 为了演示这一点，仅还原与页脚相关的代码更改\n\n页脚立即从应用程序中移除。之所以有效，是因为 `Claude Code` 在应用任何文件编辑之前会自动创建一个检查点。\n\
  \n每个导致代码更改的提示词都会创建一个新的检查点。这些检查点跨会话持久化，并保留长达 30 天，为实验和迭代提供了安全网。\n\n由于对话历史仍然存在，现在可以发出后续提示词，例如\
  \ `create a footer, make it minimalistic`（创建一个页脚，使其极简化）。`Claude Code` 利用现有上下文正确解析引用，并生成了更轻量的实现。刷新应用程序确认更新后的页脚更符合预期设计。\n\
  \n### 虽然倒带功能强大，但它也有局限性\n\n*   `Claude Code` 执行的 `Bash` 命令不被跟踪，无法还原\n*   在 `Claude\
  \ Code` 外部进行的手动编辑不会被检查点捕获\n*   倒带功能不能替代 `Git` 等版本控制系统\n*   检查点应被视为本地、短期的撤销功能，而非永久历史记录\n\
  \n正确使用时，倒带功能能显著降低实验成本。它鼓励探索，降低更改风险，并使与 `Claude Code` 的迭代开发更安全、更高效。\n\n# Claude Code\
  \ 中的自定义斜杠命令（由 Skills 提供支持）\n\n在本节中，我们将回顾如何在 `Claude Code` 中创建自定义斜杠命令。此功能非常强大，因为它赋予了开发者高度的灵活性，可定制和扩展\
  \ `Claude Code`。我们将通过定义一个用于创建 `Git` 提交信息的技能来创建一个自定义斜杠命令。更高级的技能将在 *第 7 章* 中介绍。\n\n\
  ## 创建技能\n\n我们将从一个干净的项目开始，并切换到 `custom‑commands` 分支。要创建技能，首先在项目中创建一个 `.claude` 目录（如果尚不存在）。在其中创建一个\
  \ `skills` 目录。\n\n1.  每个技能都定义为其自己的目录：\n\n    ```\n    .claude/skills/commit-code/\n\
  \    ```\n\n2.  在该目录中，创建一个名为以下内容的必需文件：\n\n    ```\n    SKILL.md\n    ```\n\n   \
  \ 技能定义为 Markdown 文件。元数据使用位于 `SKILL.md` 顶部的 YAML 前言声明，包含在 `---` 分隔符之间。文件正文包含实际的提示词，以\
  \ Markdown 编写。\n\n3.  为文件添加标题。此标题显示在斜杠命令菜单中。\n\n4.  编写命令提示词：\n\n    ```\n    Review\
  \ the files that have changed, and create a commit with a commit message summarizing\
  \ the changes made. Always try to give short and concise messages that convey the\
  \ business logic.\n    ```\n\n    我请求 `Claude Code` 查看已更改的文件，并创建一个提交，其提交信息总结所做更改，始终尝试给出简短且简洁的信息以传达业务逻辑。\n\
  \n虽然提示词本身很短，但 `Claude Code` 能够推断并执行多项操作。它可以使用 `Git` 命令检查已更改的文件，审查差异，并创建提交。这演示了单个技能如何封装一系列动作。\n\
  \n## 执行技能\n\n要测试该命令，打开 `Claude Code` 并输入 `/`。新的 `commit‑code` 命令应出现在列表中。执行它将导致 `Claude\
  \ Code` 运行 Markdown 文件中定义的提示词。\n\n`Claude Code` 还会检测 `.claude` 目录中的未跟踪文件，并询问是否应添加它们。任何批准的决定将存储在\
  \ `settings.local` 中。随后 `Claude` 将根据检测到的更改提出提交信息，并显示相应的 `Git` 命令。\n\n但如果生成的提交信息不够描述性怎么办？我们不继续执行，而是停下来改进技能。\n\
  \n## 使用 $ARGUMENTS 改进技能\n\n前往开头添加的初始提示词并更新命令提示词。在我的示例中，我要求 `Claude Code` 通过引入 `$ARGUMENTS`\
  \ 占位符来接受用户提供的提示。\n\n我们在调用技能时可以传递参数。参数通过 `$ARGUMENTS` 占位符获取。\n\n调用技能时，技能名称后面跟随的任何内容都将替换\
  \ `$ARGUMENTS` 占位符。更多相关内容将在 *第 9 章* 中介绍。\n\n```\nReview the files that have changed,\
  \ and create a commit with a commit message summarizing the changes made. Always\
  \ try to give short and concise messages that convey the business logic.\n\nUse\
  \ user hints to be the message main subject $ARGUMENTS\n```\n\n进行此更改后，再次执行 `/commit‑code`\
  \ 并提供与技能相关的主题提示：\n\n```\n/commit-code custom code\n```\n\n`Claude Code` 现在应生成更具描述性的提交信息，反映请求的更改。\n\
  \n批准后，提交被创建，由 `Claude` 共同编写。然后我们通过运行 `git push` 将更改推送到远程仓库，并在项目的 `custom‑commands`\
  \ 分支中验证提交。\n\n您也可以通过以下步骤创建并执行额外的技能：\n\n1.  创建一个带有适当标题的新命令文件\n2.  定义一个基于用户输入产生输出的提示词\n\
  3.  附加参数，以便命令可在运行时接受动态值\n\n重启 `Claude Code` 后，新命令变为可用，并可使用用户提供的输入执行。这展示了技能如何支持动态和灵活的行为。\n\
  \n# 通过上下文工程改进自动生成的提交信息\n\n早些时候，我们讨论了上下文工程。为了使其更具体，让我们看一个直接取自 `Claude Code` 文档的具体用例：\n\
  \n```\n---\nallowed-tools: Bash(git add:*), Bash(git status:*), Bash(git commit:*)\n\
  description: Create a git commit\n---\n\n## Context\n\n- Current git status: !`git\
  \ status`\n- Current git diff (staged and unstaged changes): !`git diff HEAD`\n\
  - Current branch: !`git branch --show-current`\n- Recent commits: !`git log --oneline\
  \ -10`\n\n## Your task\n\nBased on the above changes, create a single git commit.\n\
  ```\n\n\n\n\n# 此示例展示了一种技能，它执行与生成提交消息相同的任务，但方式更稳健、更安全、功能更丰富。理解这种方法为何更好，有助于阐明上下文工程、工具控制和代理设计在实践中是如何结合在一起的。\n\
  \n在技能中，我们可以运行 Shell 和 Bash 脚本。这意味着我们可以将任意代码作为命令的一部分来执行。因此，我们可以发起 HTTP 请求、运行容器，或执行任何可用代码表达的其他操作。这实际上消除了技能能力的大多数限制。\n\
  \n在这个特定的斜杠命令示例中，配置首先定义了一组允许使用的工具。这通过限制代理被允许使用的工具来限制其范围。\n\n如果你有实现代理的经验，这符合最小权限原则。其理念是界定代理的范围，使其仅拥有执行任务所需的最小能力集合。对于生成提交消息的情况，必要的操作仅限于诸如\
  \ `git add`、`git status` 和 `git commit` 等命令。\n\n以这种方式限制工具集可以提高安全性。在早期较简单的 `commit-message`\
  \ 命令中，未应用此类限制，这意味着代理可以访问 Claude Code 中所有可用的工具。在这种情况下，如果上下文被污染（例如，通过恶意输入），代理可能会在系统上执行意外操作。这是文档示例成为更强大、更安全设计的原因之一。\n\
  \n此示例还演示了深思熟虑的提示工程。上下文被显式定义并精心构建。在生成提交消息之前，命令会执行一系列 Git 命令，例如 `git status`、`git\
  \ branch` 和 `git log`。这些命令提供了关于仓库状态和待提交变更的精确上下文。\n\n从这个角度来看，该工作流与检索增强生成非常相似。首先，系统通过运行\
  \ Git 命令收集上下文来检索相关信息。一旦该上下文可用，生成步骤就会产出提交消息。\n\n这说明了检索和生成是如何在一个定义良好的单一命令中结合的。它还展示了前面讨论的多个概念，包括上下文工程、工具限制和代理设计，是如何以实用且可扩展的方式结合在一起的。\n\
  \n总体而言，这种方法为利用 Claude Code 中的技能构建更安全、更强大的工作流开辟了广阔的可能性。\n\n位于 `---` 分隔符之间的部分称为前置元数据，并在提示词主体之前进行求值。\n\
  \n# 总结\n\n在本章中，你学习了如何在基础之上配置和使用 Claude Code。我们从高层介绍了认证和定价，如何使用斜杠命令控制 Claude Code，以及如何将其直接集成到\
  \ IDE 中以获得更流畅的工作流。你探索了配置选项、用于自动化的钩子、通过 `CLAUDE.md` 文件实现的记忆，以及上下文如何在会话间加载和复用。我们还考察了用于安全撤销变更的检查点和倒带功能，以及用于封装可重复工作流并进行适当工具作用域划分的技能。至此，你应该了解\
  \ Claude Code 在实践中是如何运作的，如何使其保持安全和可预测，以及如何塑造其行为以支持更高级、长期运行的开发工作流。\n\n在下一章中，我们将探讨**模型上下文协议**\
  \ 以及它如何标准化 AI 应用程序与外部工具之间的集成。\n\n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_3_17.png)\n\n![Image](img/B37082_3_18.png)\n\n*注意：请准备好发票。直接从\
  \ Packt 网站购买不需要发票。*\n\n# 第 2 部分：扩展 Claude Code：协议、自动化与结构化工作流\n\n在本书的*第 2 部分*中，重点从个人使用转向结构化扩展和自动化。你将了解\
  \ Claude Code 如何通过**模型上下文协议 (MCP)** 连接到外部工具和服务，以及这些集成是如何被负责任地配置和管理的。我们将通过 GitHub\
  \ 工作流和事件驱动执行来探讨自动化在实践中是如何运作的。\n\n随着系统变得更加复杂，结构变得至关重要。你将探索基于规划的开发、协调的多代理工作流，以及用于隔离上下文以实现更安全执行的子代理。你还将了解输出样式和配置模式如何塑造行为并强制一致性。在本部分结束时，你将能够设计出深思熟虑、受控且可扩展的工作流。\n\
  \n本部分包含以下章节：\n\n*   *第 4 章*，《使用 MCP 服务器和插件扩展 Claude Code》\n*   *第 5 章*，《使用 Claude\
  \ Code 和 GitHub 自动化你的开发工作流》\n*   *第 6 章*，《Claude Code 规划与多代理工作流》\n*   *第 7 章*，《使用\
  \ Claude Code 子代理》\n*   *第 8 章*，《创建和自定义输出样式》\n\n# 第 4 章：使用 MCP 服务器和插件扩展 Claude Code\n\
  \n**模型上下文协议 (MCP)** 为 AI 应用程序提供了一种标准化方式，通过通用接口连接到工具、数据源和服务。开发者无需为每个宿主应用程序构建单独的集成，只需在\
  \ MCP 服务器中实现一次功能，即可跨任何兼容 MCP 的客户端复用。MCP 的引入旨在解决这一集成挑战。这一抽象层实现了互操作性、可移植性和生态系统增长。在\
  \ Claude Code 的语境下，MCP 变得尤为重要，因为它使开发者能够以结构化且可复用的方式，为编码代理扩展额外的工具、能力和集成。\n\n在本章中，你将了解什么是\
  \ MCP、为何创建它以及它在实践中如何工作。你将探索 MCP 解决的集成问题，并考察其核心架构组件：宿主、客户端和服务器。通过实际演示，你将把 MCP 服务器连接到\
  \ Claude 和 Cursor 等 AI 应用程序，配置本地和远程 MCP 服务器，并理解工具如何通过协议暴露和调用。\n\n你还将考察重要的运维因素。尽管\
  \ MCP 功能强大，但它也带来了与上下文管理、性能和执行效率相关的挑战。本章探讨了减少上下文污染的上下文工程策略、合理界定 MCP 配置作用域，以及在会话中动态管理服务器的方法。此外，你将了解\
  \ Claude Code 插件如何将 MCP 服务器和相关组件打包成可复用、可共享的单元，从而实现团队级的标准化。\n\n本章的总体目标是帮助你建立扎实的 MCP\
  \ 概念和实践基础。在最后，你将不仅理解 MCP 如何实现跨平台工具集成，还将掌握如何在真实世界的 AI 系统中负责任地配置和管理它。\n\n这一知识很重要，因为\
  \ MCP 正迅速成为基于代理架构中的基础层。随着 AI 开发转向工具增强和自主系统，理解 MCP 的架构、优势和权衡，将使你能够设计可扩展、高效且可互操作的\
  \ AI 应用程序。\n\n在本章中，我们涵盖以下主题：\n\n*   为什么需要 MCP？\n*   MCP 核心架构\n*   MCP 实战\n*   将\
  \ Claude Code 连接到 MCP 服务器\n*   MCP 作用域速查表\n*   MCP 生态系统中的上下文工程\n\n\n\n\n### 项目级\
  \ MCP 配置\n\n# MCP 的当前局限性\n\n# 使用 Claude Code 插件管理配置\n\n虽然本书以 Claude Code 为核心，但 MCP\
  \ 是一个跨平台协议，受多种 AI 开发工具支持。为了演示方便，本章在部分示例中使用了 Cursor。其底层概念保持一致，适用于使用 Claude Code 的场景。\n\
  \n# 为什么需要 MCP？\n\nMCP 得到了快速普及，引发了广泛讨论，并涌现了大量 MCP 服务器实现。许多 AI 应用（包括 `Claude Code`\
  \ 和 `Cursor` 等工具）都在其系统中集成了 MCP。\n\n在详细定义 MCP 之前，了解它所解决的需求至关重要。\n\n## 集成问题\n\n设想一个\
  \ AI 智能体，设计用于执行发送 Slack 消息、读取和发送电子邮件、查询数据库等操作。要启用这些能力，必须直接实现所需功能。这涉及使用 Slack 或 Gmail\
  \ 等 API，并编写自定义代码将这些集成封装为智能体可访问的工具。\n\n![Figure 4.1 – Agent integrating with Slack,\
  \ Gmail, and a database via APIs](img/B37082_4_1.png)\n\n**图 4.1 – 智能体通过 API 与 Slack、Gmail\
  \ 和数据库集成**\n\n在许多情况下，需要自定义实现。例如，电子邮件集成可能会有意排除 Gmail API 的删除端点，以防止意外数据丢失。因此，集成逻辑是根据特定需求量身定制并手动实现的。\n\
  \n框架可能提供内置工具。例如，框架可能包含一个涵盖完整 API 接口的预实现 Gmail 集成。此类工具可开箱即用，满足通用需求。然而，无论使用内置工具还是自定义工具，都必须在特定的智能体环境中集成功能。\n\
  \n一旦实现，智能体就能发送邮件、发布 Slack 消息或执行数据库查询。该集成在该特定智能体内生效。\n\n## 可移植性挑战\n\n假设该智能体被广泛采用，其他团队希望在不同环境中使用其功能。\n\
  \n例如，考虑一个最初构建用于在 `Cursor` 环境中运行的智能体。在此设置中，智能体通过各自的 API 与 Slack、Gmail 和数据库等外部服务集成。下图说明了这种架构。\n\
  \n![Figure 4.2 – Agent coupled to the Cursor environment and its API integrations](img/B37082_4_2.png)\n\
  \n**图 4.2 – 智能体与 Cursor 环境及其 API 集成耦合**\n\n在这种情况下，智能体与 `Cursor` 环境紧密耦合。与 Slack、Gmail\
  \ 和数据库的集成是专门为该设置实现的。\n\n现在假设我们要将相同的智能体能力集成到 `Claude Code` 中。尽管功能在概念上相同，但集成无法直接复用。因为实现是专门为我们的智能体编写的，所以必须为\
  \ `Claude Code` 重新创建集成。\n\n因此，发送 Slack 消息、与 Gmail 交互或执行数据库查询等类似能力需要为新环境重新实现。如果我们想集成到\
  \ `Cursor` 怎么办？\n\n![Figure 4.3 – Reimplementing agent integrations for the Claude\
  \ Code environment](img/B37082_4_3.png)\n\n**图 4.3 – 为 Claude Code 环境重新实现智能体集成**\n\
  \n扩展对 `Cursor`、`Bolt`、`GitHub Copilot` 或其他 AI 代码助手等其他环境的支持需要重复此过程。每次新增集成都会引入额外的实现工作。相同的功能必须为每个目标系统单独适配。\n\
  \n## MCP 作为抽象层\n\n可移植性挑战造成了一个反复出现的集成问题。每当相同功能需要在不同环境中使用时，开发人员都必须从头重建集成。\n\nMCP 通过引入额外的抽象层来解决这一问题。软件工程中有一条著名原则：\n\
  \n> “我们可以通过引入一个额外的间接层来解决任何问题。”\n>\n> —— Andrew Koenig\n\n这一想法与软件工程基本定理密切相关，该定理指出，许多复杂的系统问题可以通过增加一个抽象层来简化。MCP\
  \ 服务器即服务于此目的。\n\n开发人员不再将功能分别集成到每个智能体中，而是将实现一次性集成到 MCP 服务器中。支持 MCP 的智能体随后可以直接连接到该\
  \ MCP 服务器。\n\n![Figure 4.4 – MCP server acting as a unified integration layer for\
  \ external services](img/B37082_4_4.png)\n\n**图 4.4 – MCP 服务器作为外部服务的统一集成层**\n\n\
  采用这种方法，兼容性只需实现一次。一旦能力通过 MCP 服务器暴露，它们就可以在任何支持该协议的平台上使用。最初为 `Cursor` 实现的能力可兼容 `Claude\
  \ Code` 和其他支持 MCP 的环境，无需额外的集成逻辑。\n\n开发人员无需为每个平台重写或复制集成代码。任何支持 MCP 的系统都可以连接并无缝使用该功能。\n\
  \n### 网络效应与生态增长\n\nMCP 的增长反映了类似社交平台的网络效应。用户基数较小的社交应用提供的价值有限。随着采用率提高和用户贡献内容，系统变得更有价值，形成增长的强化循环。\n\
  \nMCP 也出现了类似动态。随着采用率提高和更多 MCP 服务器的开发，生态系统不断扩大。不断增加的实现拓宽了可用集成和能力的范围，提升了协议的整体效用。\n\
  \n奠定这一基础后，下一步是探究 MCP 的核心架构及其在实践中的运作方式。\n\n# MCP 核心架构\n\nMCP 标准化了应用程序向 `大语言模型` (`LLMs`)\
  \ 提供上下文的方式。上下文可以采取多种形式。它可能包含追加到提示词的额外信息、要调用的工具规范，甚至提示词本身。\n\n![Figure 4.5 – MCP\
  \ core architecture connecting hosts, clients, and MCP servers](img/B37082_4_5.png)\n\
  \n**图 4.5 – 连接主机、客户端和 MCP 服务器的 MCP 核心架构**\n\n从这个意义上讲，上下文涵盖了塑造 LLM 响应方式的支持数据和操作指令。\n\
  \n一旦此类标准被广泛采用，它就能在 AI 应用中实现强大且可扩展的集成开发。\n\n## MCP 的优势\n\nMCP 文档 ([`modelcontextprotocol.io/`](https://modelcontextprotocol.io/))\
  \ 强调了采用 MCP 的几大优势：\n\n*   首先，MCP 支持广泛的集成、工具和数据源生态系统，可模块化地连接到由 LLM 驱动的应用程序。例如，作为\
  \ AI 驱动的编码智能体，`Claude Code` 利用 MCP 通过结构化工具集成扩展其能力。\n\n*   其次，MCP 降低了对特定 LLM 供应商或\
  \ AI 应用提供商的耦合。开发人员可以将核心功能实现为工具，并通过 MCP 服务器暴露它们。这些工具随后可跨不同供应商和主机应用程序复用，无需修改。\n\n\n\
  \n\n*   开源框架（如 LangChain）解决了 AI 工程中一些重叠的挑战。然而，MCP 与 LangChain 处理这些问题的方式不同，且它们的解决方案并不直接重叠。例如，两者都可能支持可扩展性，但其机制和架构含义有所不同。\n\
  \n# MCP 的核心组件\n\nMCP 架构由三个主要组件组成：MCP 主机、MCP 服务器和 MCP 客户端。\n\n## MCP 主机\n\n`MCP`\
  \ `host` 是支持 MCP 的 AI 应用程序。示例包括 Claude Desktop、开发环境（如 Claude Code 或 Cursor）以及专用\
  \ AI 代理。这些应用程序通过 MCP 进行增强，将它们连接到原生不可用的额外工具、数据源或产品。\n\n![Figure 4.6 – MCP hosts connecting\
  \ to MCP servers through MCP clients](img/B37082_4_6.png)\n\n图 4.6 – MCP 主机通过 MCP\
  \ 客户端连接到 MCP 服务器\n\n## MCP 服务器\n\n`MCP` `servers` 向 MCP 主机暴露功能。这些功能可能包括以下内容：\n\n\
  *   访问外部工具，例如调用 API 以检索天气信息\n*   数据库搜索功能\n*   知识资源，如 PDF 或大型文本\n\n![Figure 4.7 –\
  \ MCP servers exposing tools, databases, and external APIs to MCP hosts](img/B37082_4_7.png)\n\
  \n图 4.7 – MCP 服务器向 MCP 主机暴露工具、数据库和外部 API\n\nMCP 服务器充当网关或代理，根据 MCP 规范暴露这些工具、资源和提示。\n\
  \n![Figure 4.8 – MCP server acting as a gateway that provides standardized access\
  \ to external resources](img/B37082_4_8.png)\n\n图 4.8 – MCP 服务器充当网关，提供对外部资源的标准化访问\n\
  \n为了符合协议，MCP 服务器会实现特定的方法，例如以下方法：\n\n*   `listPrompts`\n*   `getPrompt`\n*   `listTools`\n\
  *   `callTool`\n*   `listResourceTemplates`\n*   进度通知机制\n\n一旦实现，MCP 服务器即可连接到任何支持该协议的\
  \ MCP 主机。因此，一次编写的功能可跨多个主机应用程序复用。这种可复用性是 MCP 的核心架构优势。\n\n## MCP 客户端\n\nMCP 客户端位于\
  \ MCP 主机内部。它使用 MCP 实现主机与 MCP 服务器之间的通信。\n\n![Figure 4.9 – MCP client inside the host\
  \ managing communication with MCP servers](img/B37082_4_9.png)\n\n图 4.9 – 主机内的 MCP\
  \ 客户端管理与 MCP 服务器的通信\n\n例如，要将天气 MCP 服务器连接到 Claude Desktop，Claude Desktop 内部的 MCP\
  \ 客户端会管理与该服务器的交互。客户端和服务器完全通过定义的协议进行通信。\n\nMCP 客户端与 MCP 服务器之间存在一对一关系。单个 MCP 客户端无法与多个\
  \ MCP 服务器通信。因此，如果 MCP 主机需要连接到多个 MCP 服务器，它必须为每个服务器实例化多个 MCP 客户端，每个服务器一个。\n\n![Figure\
  \ 4.10 – Multiple MCP clients connecting a host to different MCP servers](img/B37082_4_10.png)\n\
  \n图 4.10 – 多个 MCP 客户端将主机连接到不同的 MCP 服务器\n\n这种结构完成了 MCP 的核心架构，并为构建可互操作、可扩展的 AI 应用程序奠定了基础。\n\
  \n# MCP 实战\n\n现在让我们演练一个添加和配置 MCP 服务器的实际示例。该演示展示了 MCP 启用的功能以及这些功能在实践中如何运作。该示例将实现天气检索功能的\
  \ MCP 服务器连接到两个不同的客户端：Claude Desktop 和 Cursor。\n\n这两种情况使用的是同一个 MCP 服务器。配置细节单独讨论；此处重点关注服务器连接后的结果行为。任何支持\
  \ MCP 协议的客户端都可以使用此功能，包括 Claude Code、Claude Desktop、Cursor、Claude Code、Lovable 和其他兼容客户端。\n\
  \n## 未连接 MCP 服务器时的行为\n\n在 Claude Desktop 中，开发者设置中最初未配置 MCP 服务器。例如，在未连接 MCP 服务器的情况下查询旧金山的天气时，语言模型通常会回答它无法访问实时天气信息。在某些情况下，它可能会尝试调用搜索工具以检索摘要信息。\n\
  \n没有 MCP，模型仅限于其训练数据，无法直接检索实时数据，除非通过通用的内置工具（如搜索）。\n\n## 连接 MCP 服务器\n\n配置天气 MCP 服务器后，它会出现在\
  \ Claude 的开发者设置中，并显示其运行时详情。\n\n![Figure 4.11 – Weather MCP server configured in\
  \ Claude developer settings](img/B37082_4_11.png)\n\n图 4.11 – 天气 MCP 服务器在 Claude\
  \ 开发者设置中已配置\n\n当再次查询旧金山的天气时，系统会提示请求权限在本地执行天气工具。工具执行需要批准，因为它可能涉及运行本地代码。与工具执行相关的安全考量将单独讨论。\n\
  \n**安全警告：** `MCP` `servers can run code on your machine`\n\nMCP 服务器在本地运行代码，拥有与您的用户账户相同的权限。这意味着它们可以访问您系统上的文件、环境变量和网络资源。\n\
  \n添加 MCP 服务器前，请注意以下风险：\n\n*   MCP 服务器可以在您的机器上执行命令，包括读取、修改或删除文件。\n*   恶意服务器可能将敏感信息（如源代码、环境变量或\
  \ API 密钥）发送到外部服务。\n*   来自 MCP 服务器的工具响应可能包含隐藏指令，从而影响模型行为。\n\n像对待任何第三方依赖一样对待 MCP 服务器。尽可能审查源代码，从可信维护者处安装服务器，并避免使用提升的权限运行\
  \ MCP 服务器。\n\n一旦授予 Claude Code 调用 MCP 工具的权限，将发生以下序列：\n\n1.  MCP 服务器包含检索天气数据的逻辑\n\
  2.  服务器暴露一个名为 `getForecast` 的函数\n3.  `getForecast` 函数接受两个参数：纬度和经度\n4.  语言模型（Claude\
  \ Sonnet 3.7）确定对应旧金山的纬度和经度\n5.  模型向 `getForecast` 函数发出 MCP 调用\n6.  MCP 服务器执行该函数并返回响应\n\
  7.  语言模型处理响应并生成最终答案：\n\n    ![Figure 4.12 – Claude invoking the MCP weather tool\
  \ and returning the forecast response](img/B37082_4_12.png)\n\n    图 4.12 – Claude\
  \ 调用 MCP 天气工具并返回预测响应\n\n结果是基于通过 MCP 服务器检索的实时数据生成的天气报告。\n\n虽然检索天气数据是一个简单的示例，但底层机制支持任意逻辑。任何功能都可以在\
  \ MCP 服务器中实现。通过实现 MCP 协议，开发者使兼容的客户端能够通过工具调用来调用该功能。这将 AI 代理扩展到静态模型能力之外，并允许它们执行外部逻辑。\n\
  \n## 跨客户端复用同一 MCP 服务器\n\n同一个天气 MCP 服务器可以连接到 Cursor。配置后，MCP 服务器会出现在 Cursor 设置的 MCP\
  \ 选项卡中。\n\n![Figure 4.13 – Claude invoking the MCP weather tool and returning the\
  \ forecast response](img/B37082_4_13.png)\n\n图 4.13 – Claude 调用 MCP 天气工具并返回预测响应\n\
  \n连接的服务器及其暴露的工具将被列出：\n\n*   `GetAlerts`\n*   `GetForecast`\n\n\n\n该配置还显示了用于运行服务器的命令，在本例中为\
  \ Node.js 服务器。在 Cursor Chat 中，使用代理模式时可使用 MCP 功能。\n\n![图 4.14 – 在代理模式下从 Cursor 调用\
  \ MCP 天气工具](img/B37082_4_14.png)\n\n图 4.14 – 在代理模式下从 Cursor 调用 MCP 天气工具\n\n当查询旧金山天气时代理会使用适当的参数调用\
  \ `GetForecast` 工具。在此配置中，Cursor 以 YOLO 模式运行，意味着工具会自动执行，无需人工批准。虽然这种方法很方便，但会带来安全隐患。\n\
  \n代理执行以下操作：\n\n1.  使用纬度和经度参数调用 `GetForecast` 工具。\n2.  从 MCP 服务器接收天气数据。\n3.  判断天气预警可能也相关。\n\
  4.  调用 `GetAlerts` 工具检查旧金山的预警情况。\n5.  将响应编译成最终答案，同时包含天气状况和任何活动预警。\n\n在本例中，单个提示词中调用了两个工具。代理自主决定调用哪些工具以及如何将其结果整合为连贯的回复。\n\
  \n天气示例演示了一种通用模式：MCP 使 AI 代理能够执行 MCP 服务器中定义的外部逻辑。支持 MCP 的客户端可以连接到这些服务器并调用其工具。\n\n\
  通过在服务器中实现 MCP 协议，开发者使其功能可被任何兼容的 MCP 客户端访问。这消除了静态模型知识施加的限制，并允许代理执行动态、实时和自定义操作。\n\n\
  # 将 Claude Code 连接到 MCP 服务器\n\n我们从一个空项目和本书 GitHub 仓库中一个名为 `project/MCP` 的空分支开始。要访问该仓库，请遵循*前言*中*下载示例代码文件*部分的步骤。然后我们使用\
  \ `/mcp` 斜杠命令列出可用的 MCP 服务器。此时，未列出任何 MCP 服务器。\n\n![图 4.15 – 使用 /mcp 命令在 Claude Code\
  \ 中列出可用的 MCP 服务器](img/B37082_4_15.png)\n\n图 4.15 – 使用 /mcp 命令在 Claude Code 中列出可用的\
  \ MCP 服务器\n\n有一个链接可通往 MCP 文档，其中解释了如何添加 MCP 服务器。有多种方法可以做到这一点：\n\n*   通过文件添加 MCP 服务器\n\
  *   使用 CLI 添加 MCP 服务器\n\nMCP 服务器可以通过文件添加；不过，推荐使用 CLI。CLI 通常是最新的，如果格式发生变化或 API 失效，使用\
  \ CLI 可确保兼容性。\n\n## 通过 CLI 添加 Context7 MCP 服务器\n\n**Context7** ([`context7.com/`](https://context7.com/))\
  \ 为大量包提供最新文档。许多包（尤其是 AI 生态系统中的包，如 LangGraph）更新频繁，拥有最新文档可确保生成的代码与最新 API 保持一致。\n\n\
  Context7 索引了近 30,000 个 ([`github.com/upstash/context7`](https://github.com/upstash/context7))\
  \ 包。\n\n撰写本文时，该仓库拥有约 49,200 颗星。\n\n要将 Context7 与 Claude Code 结合使用，需要 Claude Code\
  \ 集成。命令如下：\n\n```\nclaude mcp add --transport http context7 https://mcp.context7.com/mcp\n\
  ```\n\n该命令执行以下操作：\n\n*   使用 `claude mcp add`\n*   指定 HTTP 作为传输方式\n*   分配 MCP 名称\
  \ `context7`\n*   提供 MCP 服务器的 URL\n\n这是一个远程 MCP 服务器，意味着服务器不在本地运行。相反，它运行在 Context7\
  \ 服务器上。\n\n每次调用都会向远程服务器发送请求。这种方法具有以下优势：\n\n*   服务可以轻松扩展\n*   MCP 可从多个客户端访问\n\nHTTP\
  \ 传输和远程 MCP 服务器在以下 MCP 课程中有更详细的解释：[`www.udemy.com/course/model-context-protocol/`](https://www.udemy.com/course/model-context-protocol/)。\n\
  \n将该命令复制并粘贴到终端中。执行前，添加 `--help` 标志以便您查看可用选项。\n\n## MCP 服务器作用域与配置\n\n帮助输出显示可以配置 MCP\
  \ 服务器的作用域。MCP 服务器可以存在于以下作用域：\n\n*   用户作用域\n*   项目作用域\n*   会话作用域\n\n也可以为环境变量或 HTTP\
  \ 标头提供可选值。\n\n![图 4.16 – 使用 mcp add 命令向项目添加 MCP 服务器](img/B37082_4_16.png)\n\n图 4.16\
  \ – 使用 mcp add 命令向项目添加 MCP 服务器\n\n在本例中，添加 MCP 服务器时选择了项目作用域。\n\n执行后，将创建一个包含 Context7\
  \ MCP 配置的新文件。该配置指定了 HTTP 传输类型和 MCP 服务器的 URL。\n\n```\n{\n  \"mcpServers\": {\n  \
  \  \"context7\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.context7.com/mcp\"\
  \n    }\n  }\n}\n```\n\n要在本地运行 MCP 服务器而非远程运行，可以使用以下替代命令：\n\n```\nclaude mcp add\
  \ context7 -- npx -y @upstash/context7-mcp\n```\n\n该命令使用 `npx` 下载仓库并在本地执行。\n\n##\
  \ 重启 Claude Code 并启用 MCP 服务器\n\n安装 MCP 服务器后，必须重启 Claude Code。退出会话，清空终端，再次启动 Claude。\n\
  \n![图 4.17 – 重启后 Claude Code 检测并启用已配置的 MCP 服务器](img/B37082_4_17.png)\n\n图 4.17 –\
  \ 重启后 Claude Code 检测并启用已配置的 MCP 服务器\n\n启动时，Claude 将检测 `mcp.json` 文件并提示请求连接到已配置 MCP\
  \ 服务器的权限。选择第一个选项以允许连接。\n\n随后，Claude 会为当前用户会话创建一个 `settings.local.json` 文件。打开该文件可确认\
  \ Context7 MCP 服务器已启用，允许 Claude 在需要时查询它。\n\n# 列出并检查已安装的 MCP 服务器\n\n现在可以列出 MCP 服务器。我们可以看到\
  \ Context7 MCP 服务器已连接。\n\n![图 4.18 – 列出已安装的 MCP 服务器并检查已连接的 Context7 服务器](img/B37082_4_18.png)\n\
  \n图 4.18 – 列出已安装的 MCP 服务器并检查已连接的 Context7 服务器\n\n点击进入可看到它暴露了两个工具：\n\n*   `resolve-library-id`\n\
  *   `get-library-docs`\n\n这些工具描述成为代理上下文的一部分，允许代理根据需要动态调用工具。例如，当请求最新的 LangGraph 文档时，代理首先调用\
  \ `resolve-library-id` 以获取适当的上下文 ID，然后调用 `get-library-docs` 以检索最新文档。\n\n## 使用 Context7\
  \ MCP 服务器查询 LangGraph\n\n我们可以提出以下问题，并指定应使用 Context7 MCP 服务器：\n\n*LangGraph 的最新版本是什么？*\n\
  \nClaude Code 请求调用 Context7 MCP 工具的权限。我们批准该请求，权限会更新在 `settings.local.json` 中。\n\n\
  ![图 4.19 – 调用 Context7 MCP 工具检索最新 LangGraph 版本](img/B37082_4_19.png)\n\n图 4.19 –\
  \ 调用 Context7 MCP 工具检索最新 LangGraph 版本\n\nMCP 服务器解析库 ID，然后发起另一个请求以检索文档。\n\n根据 Context7\
  \ 返回的文档，LangGraph 的最新版本报告为 **1.2**。\n\nLangGraph 是一个活跃演进的框架。您可能会遇到比此处演示版本更新的版本；不过，此处讨论的架构概念和模式依然适用。\n\
  \n## 在项目记忆中持久化 MCP 服务器用法\n\n我们将 Context7 配置为每次询问关于 LangGraph 的问题时都使用。为此，我们添加一条指令并将其保存到项目记忆中，以便跨会话持久化。\n\
  \n\n\n该指令已记录，并将创建一个`Claude.md`文件，包含以下条目：\n\n```\nWhen discussing LangGraph, always\
  \ use context7 MCP\n```\n\n## 验证持久化 MCP 行为\n\n我们可以重启 Claude、清除会话，并提出以下问题：\n\n```\n\
  What is a LangGraph interrupt?\n```\n\nClaude Code 会自动选择 Context7 MCP 服务器。它会解析 LangGraph\
  \ 库，检索相关文档和代码片段，并返回关于 LangGraph 中断的解释。\n\n![图 4.20 – Claude 自动使用 Context7 MCP 服务器解释\
  \ LangGraph 中断](img/B37082_4_20.png)\n\n图 4.20 – Claude 自动使用 Context7 MCP 服务器解释\
  \ LangGraph 中断\n\n由于 Context7 提供对当前文档和 API 的访问，生成的代码反映了最新的用法。\n\n## 将 MCP 工件提交至版本控制\n\
  \n我们可以将生成的文件添加到 GitHub 仓库。我们使用提交信息`context7 mcp`提交更改，并通过以下命令推送到上游：\n\n```\ngit commit\
  \ -m \"context7 mcp\"\n```\n\n该提交可在本书的 GitHub 仓库中找到。要访问仓库链接，请遵循*前言*中*下载示例代码文件*部分的步骤。\n\
  \n# MCP 作用域速查表\n\n选择正确的作用域有助于保持环境有序，并防止不必要的配置泄露到无关项目中。下表总结了何时使用每种 MCP 作用域：\n\n|\
  \ **方面** | **项目作用域** | **用户作用域** | **会话作用域** |\n| --- | --- | --- | --- |\n| **配置位置**\
  \ | 项目根目录下的`.mcp.json` | `~/.claude/settings.json` | 通过`‑‑mcp‑config`标志启动或会话中途添加\
  \ |\n| **可见性** | 项目中的每个人 | 仅你，跨所有项目 | 仅当前会话 |\n| **提交到 Git？** | 是 | 否 | 否 |\n| **跨会话持久化？**\
  \ | 是 | 是 | 否 |\n| **与团队共享？** | 是 | 否 | 否 |\n\n表 4.1 – MCP 作用域对比：项目、用户和会话\n\n##\
  \ 何时使用各种 MCP 作用域\n\n以下指南说明了各作用域的常见适用场景。\n\n*   **项目作用域**（`.mcp.json`）\n    *   当\
  \ MCP 服务器是项目共享开发环境的一部分时，使用项目作用域。\n    *   特定于此项目的数据库工具（例如项目的 Postgres MCP）\n   \
  \ *   特定于项目的 API，如内部服务或预发布环境\n    *   整个团队需要的自定义工具，如部署脚本或测试运行器\n    *   与项目技术栈相关的文档服务器\n\
  \n*   **用户作用域**（`~/.claude/settings.json`）\n    *   将用户作用域用于个人工具或与您自己的凭据相关的工具。\n\
  \    *   个人生产力工具（Slack、Linear、Notion）\n    *   与您的凭据相关的工具，如带有您 PAT 的 GitHub 或电子邮件访问\n\
  \    *   您希望在所有项目中可用的通用服务器（例如 Tavily 搜索或 Context7 文档）\n    *   依赖您不想提交到仓库的机密信息的服务器\n\
  \n*   **会话作用域**（`‑‑mcp‑config`/临时性）\n    *   将会话作用域用于不应持久化的临时或实验性设置。\n    *   一次性调试服务器，如临时代理或模拟\
  \ API\n    *   您正在评估的实验性或不受信任的服务器\n    *   依赖短期令牌的服务器（OAuth 会话或临时凭据）\n    *   在运行期间动态启动服务器的\
  \ CI/CD 环境\n\n# MCP 生态系统中的上下文工程\n\n在本节中，我们将介绍 MCP 生态系统中的上下文工程。示例使用 Claude Code，但这些概念适用于任何支持\
  \ MCP 的智能体系统。\n\n![图 4.21 – 有限 LLM 上下文窗口内的良好与不良上下文使用](img/B37082_4_21.png)\n\n图\
  \ 4.21 – 有限 LLM 上下文窗口内的良好与不良上下文使用\n\n上下文是智能体系统中最昂贵且最有限的资源，尤其是在智能体编码工作流中。上下文直接影响智能体性能。不良的上下文会导致智能体性能不佳。本讨论仅关注性能影响，故意排除定价和延迟考量。\n\
  \n![图 4.22 – 上下文工程：通过仅加载必要上下文来减少 Token](img/B37082_4_22.png)\n\n图 4.22 – 上下文工程：通过仅加载必要上下文来减少\
  \ Token\n\n上下文低效最隐蔽但影响最大的来源之一是 MCP 配置。MCP 功能强大，但如果不小心使用，会显著降低上下文效率。主要问题是 MCP 可能会用不必要的\
  \ Token 使上下文窗口膨胀，这些 Token 属于当前任务不需要的工具。\n\n## 问题——过于通用的 MCP 配置\n\n上下文低效问题的根本原因是过于通用的\
  \ MCP 配置。当 MCP 服务器配置过于宽泛时，智能体会在处理任何请求之前，将所有可用工具加载到其上下文窗口中。这在任何推理开始之前就消耗了宝贵的 Token，留给实际任务的空间更少。\n\
  \n![图 4.23 – 过于宽泛的 MCP 配置导致的上下文窗口浪费](img/B37082_4_23.png)\n\n图 4.23 – 过于宽泛的 MCP\
  \ 配置导致的上下文窗口浪费\n\n在 Claude Code 中，MCP 服务器通常使用`mcp.json`文件在项目层面进行配置。该文件加载多个 MCP 服务器及其所有关联工具。\n\
  \n![图 4.24 – 通用 MCP 配置在启动时加载所有工具](img/B37082_4_24.png)\n\n图 4.24 – 通用 MCP 配置在启动时加载所有工具\n\
  \n大多数设置遵循此模式。单一的通用 MCP 配置用于加载所有 MCP 服务器和工具。初衷是为智能体配备它可能需要的一切。\n\n结果是每个会话都加载所有 MCP\
  \ 服务器和所有 MCP 工具，即使它们不相关。这在编写任何提示词之前就可能消耗数万个 Token。\n\n在本节中，我们介绍此问题并演示如何使用上下文工程技术来修复它。\n\
  \n## 示例仓库和 MCP 服务器\n\n本节使用的代码可在本书 GitHub 仓库的`context‑engineering‑mcp`分支中找到。要访问仓库链接，请遵循*前言*中*下载示例代码文件*部分的步骤。我们从第一次提交开始，以便完全复现设置。\n\
  \n该仓库包含一个在`verbose_mcp_server.py`中实现的简单 MCP 服务器。该服务器使用 FastMCP 编写，并暴露了大量 MCP 工具，包括以下内容：\n\
  \n*   `add_two_numbers`\n*   `subtract_two_numbers`\n*   `multiply_two_numbers`\n\
  \n该服务器有意包含许多不需要的 MCP 工具。每个工具还包含详细描述。示例如下：\n\n![图 4.25 – 冗长的 MCP 工具定义增加上下文大小](img/B37082_4_25.png)\n\
  \n图 4.25 – 冗长的 MCP 工具定义增加上下文大小\n\n这些描述有助于 MCP 客户端决定是否应调用工具，但它们也直接增加了上下文大小。\n\n###\
  \ 运行 MCP 服务器\n\nMCP 服务器使用 UV 包管理器运行。仓库包含一个定义 FastMCP 依赖项（[`github.com/PrefectHQ/fastmcp`](https://github.com/PrefectHQ/fastmcp)）的`uv.lock`文件。请遵循以下步骤：\n\
  \n1.  运行`uv sync`并使用以下命令激活虚拟环境：\n\n    ```\n    source .venv/bin/activate\n    ```\n\
  \n2.  环境激活后，FastMCP CLI（[`github.com/jlowin/fastmcp`](https://github.com/jlowin/fastmcp)）即可使用。我们使用`fastmcp\
  \ run verbose_mcp_server.py ‑‑transport http`启动 MCP 服务器。\n\n\n\n# 繁冗数学运算 MCP 服务器\n\
  \n繁冗数学运算 MCP 服务器现已使用可流式 HTTP 传输运行，并暴露在 `http://127.0.0.1:8000/mcp`。\n\n## 将运行中的\
  \ MCP 服务器添加到 Claude Code\n\n我们需要检查 MCP 服务器及其工具在加载到会话后如何影响上下文。在 MCP 服务器本地运行的情况下，我们打开\
  \ Claude Code 并添加此 MCP 服务器。\n\n为此，我们创建一个项目级 MCP 配置文件，名为 `.mcp.json`。\n\n如果我们返回仓库并检查分支，有一个标题为**添加基于项目的\
  \ MCP 配置**的提交。此配置可直接复制，按需添加 API 密钥。示例中显示的 API 密钥已进行混淆处理。\n\n### 项目级 MCP 配置\n\n项目级\
  \ MCP 配置定义了四个 MCP 服务器：\n\n*   一个本地运行的繁冗 MCP 服务器\n*   **Context7**，此前已介绍过 (<https://context7.com/>)\n\
  *   **Tavily** (<https://tavily.com/>)，用于搜索互联网、爬取网站和提取网页\n*   **Playwright MCP**，用于浏览器自动化\n\
  \n![Figure 4.26 – 定义在 mcp.json 中的包含多个服务器的项目级 MCP 配置](img/B37082_4_26.png)\n\n*图\
  \ 4.26 – 定义在 mcp.json 中的包含多个服务器的项目级 MCP 配置*\n\n这是一个项目级配置，意味着当从项目目录启动 Claude Code\
  \ 时，所有四个 MCP 服务器都会自动加载。\n\n配置中的 API 密钥已进行混淆处理。\n\n要验证配置是否正确应用，请执行以下步骤：\n\n1.  打开终端。\n\
  2.  切换目录到项目文件夹。\n3.  确认你位于 `context-engineering-mcp` 分支。\n4.  运行 Claude Code。\n\
  5.  运行 `/mcp` 确认所有四个 MCP 服务器均已连接。\n\n![Figure 4.27 – Claude Code 中连接的多个 MCP 服务器。](img/B37082_4_27.png)\n\
  \n*图 4.27 – Claude Code 中连接的多个 MCP 服务器。*\n\n## 检查上下文使用情况\n\n接下来，我们运行 `/context`\
  \ 以检查当前会话的上下文使用情况。\n\n此时，尽管尚未编写任何提示词，我们已经接近上下文窗口的一半。`/context` 的输出揭示了可用 Token 的分布情况。\n\
  \n![Figure 4.28 – MCP 工具消耗了上下文窗口的大部分](img/B37082_4_28.png)\n\n*图 4.28 – MCP 工具消耗了上下文窗口的大部分*\n\
  \n细分情况如下：\n\n*   约 2,000 个 Token 用于 Claude Code 的系统提示词\n*   Claude Code 的系统工具消耗了约\
  \ 12,000 个 Token\n*   MCP 工具描述消耗了接近 20% 的上下文窗口\n\n没有消息。没有记忆文件。未配置子代理。\n\n如果存在子代理，它们也会出现在上下文中，包括描述如何以及何时使用它们的说明。\n\
  \n在此阶段，上下文窗口已消耗近 50%。\n\n视任务而定，许多 MCP 服务器，尤其是繁冗数学 MCP 工具，都是不必要的。\n\n## 通过限定 MCP\
  \ 配置范围来减少上下文\n\n为减少上下文使用，必须更严格地限定 MCP 配置范围。\n\n执行以下步骤：\n\n1.  删除项目级 `.mcp.json`\
  \ 文件。\n2.  创建一个名为 `.mcp.json.tavily` 的新文件。\n3.  从仓库复制 Tavily MCP 配置。\n4.  将其粘贴到\
  \ `.mcp.json.tavily` 中。\n\n![Figure 4.29 – 使用 mcp.json.tavily 的限定范围 MCP 配置。](img/B37082_4_29.png)\n\
  \n*图 4.29 – 使用 mcp.json.tavily 的限定范围 MCP 配置。*\n\n此配置现在仅包含 Tavily MCP 服务器。\n\n接下来，使用限定范围的配置启动\
  \ Claude Code：\n\n返回终端并运行以下命令：\n\n```\nclaude --mcp-config .mcp.json.tavily\n```\n\
  \n`--mcp-config` 标志接受以空格分隔的 MCP 配置文件路径。\n\nClaude 启动时，我们再次使用 `/mcp` 检查 MCP 服务器。\n\
  \n![Figure 4.30 – 使用限定范围配置的活动 MCP 服务器。](img/B37082_4_30.png)\n\n*图 4.30 – 使用限定范围配置的活动\
  \ MCP 服务器。*\n\n此时，我们看到了预期的 Tavily MCP。然而，我们也看到了繁冗 MCP 服务器和 Context7。Playwright MCP\
  \ 服务器不再存在。\n\n发生这种情况是因为 Claude Code 仍在从用户级 MCP 配置加载 MCP 服务器，其中包含 Context7、Tavily\
  \ 和繁冗 MCP 服务器。\n\n## 强制执行严格的 MCP 配置\n\n为确保仅加载预期的 MCP 配置，必须强制执行严格配置。\n\n运行以下命令：\n\
  \n```\nclaude --mcp-config .mcp.json.tavily --strict-mcp-config\n```\n\n`--strict-mcp-config`\
  \ 标志指示 Claude Code 忽略默认的 MCP 层级结构，仅加载指定配置文件中定义的 MCP 服务器。\n\n让我们验证结果：\n\n1.  运行 `/mcp`\
  \ 并确认仅加载了 Tavily MCP 服务器。\n2.  运行 `/context` 并验证 MCP 工具的上下文使用量显著减少，因为仅 Tavily MCP\
  \ 服务器处于活动状态。\n\n![Figure 4.31 – 启用严格 MCP 配置后的上下文使用情况](img/B37082_4_31.png)\n\n*图\
  \ 4.31 – 启用严格 MCP 配置后的上下文使用情况*\n\nMCP 相关上下文使用量从近 20% 下降至约 2.4%。\n\n这使代理能够保持专注，并避免为当前任务（本例中为研究）携带不必要的工具上下文。\n\
  \n## 在会话中动态管理 MCP\n\n除了基于配置的限定范围外，MCP 服务器还可以在会话中动态管理。\n\n为此，请执行以下步骤：\n\n1.  恢复通用的项目级\
  \ `.mcp.json` 配置。\n2.  重启 Claude Code。\n3.  禁用繁冗 MCP 服务器。\n4.  禁用 Playwright MCP\
  \ 服务器。\n5.  运行 `/mcp` 确认两个服务器均已禁用。\n6.  运行 `/context`。\n\n![Figure 4.32 – 禁用选定服务器后的\
  \ MCP 上下文使用情况](img/B37082_4_32.png)\n\n*图 4.32 – 禁用选定服务器后的 MCP 上下文使用情况*\n\nMCP 相关上下文使用量现在约为\
  \ **3.2%**。\n\n此方法允许使用 CLI 在会话中直接启用或禁用 MCP 服务器，而无需修改 MCP 配置文件。\n\n# MCP 的当前局限性\n\
  \nMCP 旨在标准化代理连接数据的方式。然而，其当前实现引入了若干缺点。这些局限性主要源于 LLM 上下文的管理方式以及代理任务的执行方式。\n\n![Figure\
  \ 4.33 – LLM 与外部 API 之间的 MCP 抽象层](img/B37082_4_33.png)\n\n*图 4.33 – LLM 与外部 API\
  \ 之间的 MCP 抽象层*\n\n因此，代理可能比预期更慢、更昂贵且效果更差。没有完美的协议，MCP 也不例外。\n\n## 上下文污染\n\nMCP 最大的问题是上下文污染。MCP\
  \ 要求工具定义预先加载到模型的上下文中。这些定义（包括所需参数和预期输出）被放入系统提示词中。\n\n![Figure 4.34 – 预加载 MCP 工具定义导致的上下文污染](img/B37082_4_34.png)\n\
  \n*图 4.34 – 预加载 MCP 工具定义导致的上下文污染*\n\n由于必须预加载所有工具定义，这产生了巨大的 Token 开销。要使用 MCP 服务器，代理必须接收每个可用工具的定义。\n\
  \n在包含 GitHub MCP、Slack MCP 和 Central MCP 等服务器、共 58 个工具的配置中，工具定义 allein 可在对话开始前消耗\
  \ 55,000 个 Token。在某些情况下，工具定义可消耗数十万 Token。\n\n在 LLM 应用和代理系统中，上下文是必须优化的主要资源。当上下文被工具定义饱和时，代理会携带大量无关信息。\n\
  \n\n\n\n\n## 过多的 MCP 工具导致上下文膨胀\n\n例如，一个负责修改前端页面的智能体，仍会携带数千行与无关工具（如数据库工具或 PDF 阅读器）相关的上下文。这些无关数据会在对话的每一步和每一次迭代中持续存在。\n\
  \n![Figure 4.35 – Needle-in-a-haystack problem from too many MCP tools](img/B37082_4_35.png)\n\
  \n图 4.35 – 过多 MCP 工具导致的“大海捞针”问题\n\n随着无关定义填满上下文，模型性能下降。模型必须在海量信息中搜索，导致产生幻觉、指令跟随失败或工具选择错误的可能性增加。上下文污染越严重，模型定位相关信息就越困难。\n\
  \n## 低效的智能体执行\n\n除了上下文管理，MCP 还给智能体执行带来了低效问题。\n\n![Figure 4.36 – Inefficient agent\
  \ execution with repeated MCP tool calls](img/B37082_4_36.png)\n\n图 4.36 – 重复 MCP\
  \ 工具调用导致的低效智能体执行\n\n传统的 MCP 用法依赖“乒乓式”交互模式。每个动作都需要一个完整的往返过程：\n\n*   模型请求工具。\n*  \
  \ 工具执行。\n*   结果被追加到对话历史中。\n*   整个更新后的历史被发回模型以确定下一步。\n\n当需要多次工具调用时，这个过程会迅速膨胀。即使中间结果对于生成最终答案并非必要，它们仍会累积在上下文窗口中。虽然其中一些结果在后续阶段本可移除，但当前的\
  \ MCP 实现会保留它们，进一步污染上下文。\n\n![Figure 4.37 – MCP tool call round trips between model,\
  \ client, and server](img/B37082_4_37.png)\n\n图 4.37 – 模型、客户端与服务器之间的 MCP 工具调用往返\n\
  \n每次往返都需要一次额外的 LLM 推理。多次推理增加了延迟和成本。随着工具调用规模扩大，模型调用次数也随之增加，导致执行变慢、开支变大。\n\n## “母语”问题——JSON\
  \ 与代码\n\nMCP 还强迫 LLM 以一种不符合其训练方式的模式运行。\n\n![Figure 4.38 – LLM training vs tool-call\
  \ formats](img/B37082_4_38.png)\n\n图 4.38 – LLM 训练与工具调用格式的对比\n\n该协议严重依赖结构化的工具调用令牌和\
  \ JSON Schema。然而，LLM 主要是在自然语言文本和代码上训练的，而非专门的工具调用语法令牌上。\n\n尽管模型厂商已提升了工具调用的可靠性，但这种格式并非模型的原生运行模式。文本和代码是\
  \ LLM 更自然的表达形式。特别是代码，比基于 JSON 的工具调用机制更贴近训练数据和模型能力。\n\n这种错位在模型的训练分布与 MCP 要求的结构化交互风格之间制造了摩擦。\n\
  \n## 工具定义与 Schema 的局限性\n\nMCP 工具定义和 JSON Schema 描述了工具的样子：其参数、输入和输出。然而，这些 Schema\
  \ 无法捕捉使用模式。\n\n![Figure 4.39 – Limits of JSON schemas for tool usage](img/B37082_4_39.png)\n\
  \n图 4.39 – JSON Schema 在工具用法上的局限\n\n使用模式包括何时应使用工具、如何在上下文中使用工具，以及何时不应使用工具。这比单纯的结构定义是一个更深层的概念。\n\
  \n即使提供了指导工具使用的指令，Schema 本身也无法编码这些行为约束。因此，该协议定义了结构，却未定义意图或正确的应用模式。\n\n# Cloudflare\
  \ 的 CodeMode\n\nCloudflare 首先在一篇博客文章（`https://blog.cloudflare.com/code-mode/`）中推出了\
  \ **CodeMode**，这是一种旨在改变智能体与 MCP 工具交互方式的执行模型。\n\n这一思路旨在解决前述关于 MCP 的缺点，特别是由多次 LLM\
  \ 调用导致的上下文膨胀和延迟增加。\n\nCloudflare 建议不按常规方式使用 MCP，而是将 MCP 中的所有工具定义、工具接口和工具实现转换为 TypeScript\
  \ API。LLM 不再通过工具调用来选择调用哪个工具，而是被要求生成使用该 TypeScript API 的代码。\n\n![Figure 4.40 – Cloudflare\
  \ Code Mode replacing tool calls with code execution](img/B37082_4_40.png)\n\n图\
  \ 4.40 – Cloudflare CodeMode 以代码执行取代工具调用\n\n在此模型中，LLM 生成需执行的完整代码。生成的代码包含多个以函数调用形式实现的工具调用。随后，该代码在沙箱中一次性执行。\n\
  \n这种方法减少了工具调用中的往返次数。LLM 编写代码在内部执行调用序列，而非反复进行“调用工具、接收结果、再调用工具”的循环。主要优势在于 LLM 擅长编写代码。编写代码是\
  \ LLM 的常规任务，且其拥有海量代码训练数据。因为代码只需编写一次、执行一次，工具定义无需重复发送，从而减少了 Token 消耗。\n\n## 关键观察\n\
  \nCloudflare 指出，MCP 常被用于直接向 LLM 暴露工具。在 CodeMode 中，MCP 工具被转换为 TypeScript API，LLM\
  \ 编写代码来调用该 API。\n\n据报告，智能体因此能处理更多工具和更复杂的工具。MCP 的一个问题是工具过多会增加上下文大小，进而增加成本和延迟并降低性能。当工具以\
  \ TypeScript API 而非直接工具定义的形式呈现时，性能会提升。解释在于 LLM 训练中见过大量真实的 TypeScript 代码，但仅见过极少量人为构造的工具调用示例。\n\
  \n当必须将多个调用串联在一起时，该方法被描述为特别有效。在传统 MCP 用法中，每次工具输出必须传回 LLM 后才能进行下一次调用。这种重复消耗时间、精力和\
  \ Token。当 LLM 编写代码时，它在内部完成所有调用，仅返回最终结果。\n\n得出的结论是：LLM 编写代码来调用 MCP，比直接调用 MCP 表现更好。\n\
  \n## 工具调用及其约束\n\n在传统 MCP 用法中，LLM 生成代表工具调用的特殊令牌。这些令牌被解析以提取函数名和参数。系统随后执行函数并返回结果。\n\
  \n这些特殊的工具调用令牌在真实世界数据中并不常见。它们是在训练期间引入的句法构造。尽管模型厂商显著提升了工具调用性能，但该机制本质上仍是合成的。\n\n当暴露过多工具或过于复杂的工具时，LLM\
  \ 可能难以选择正确的工具，或错误地使用它们。因此，建议 MCP 服务器设计者简化 API，使其更适合 LLM 消费。\n\n相比之下，LLM 处理完整编程 API\
  \ 更有效。它们无需简化即可分析复杂 API 并生成代码。区别在于 LLM 见过大量真实代码，却极少见到真实的工具调用。\n\n文中提供了一个类比：让 LLM\
  \ 用工具调用执行任务，相当于让莎士比亚速成中文后要求他用中文写剧本。暗示是工具调用并非模型的强项。\n\n## MCP 的角色\n\nMCP 依然有用，因为它提供了一种连接智能体与工具的统一方法。MCP\
  \ 工具代表带有文档的 RPC 接口。大多数 MCP 服务器封装了现有的传统 API。\n\n\n\n\n与其将 MCP 工具直接暴露为可调用工具，CodeMode\
  \ 会将它们转换为编程语言 API。尽管传统 API 已经存在，但 MCP 提供了一种统一的方式来连接并了解这些 API，这在基于代理的系统中依然很有价值。\n\
  \n## 集成 CodeMode\n\nCloudflare 扩展了其 Agent SDK 以支持 CodeMode。在典型的 AI SDK 设置中，模型配置包含系统提示词、用户消息和工具。在\
  \ CodeMode 中，工具和提示词会使用 CodeMode 辅助函数进行封装。\n\n例如，考虑一个使用 Cloudflare AI SDK 构建的应用程序，其代码如下：\n\
  \n```\nconst stream = streamText({\n  model: openai(\"gpt-5.3\"),\n  system: \"\
  You are a helpful research assistant.\n    Your job is to help the user...\",\n\
  \  messages: [\n    { role: \"user\", content: \"Research on deep agents\" }\n \
  \ ],\n  tools: {\n    research agent's tool definition\n  }\n})\n```\n\n使用 CodeMode\
  \ 时，系统提示词和工具定义会在传递给应用程序之前，通过 `codemode` 辅助函数进行封装。\n\n```\nimport { codemode } from\
  \ \"agents/codemode/ai\";\n\nconst { system, tools } = codemode({\n  system: \"\
  \ You are a helpful research assistant.\n    Your job is to help the user...\",\n\
  \  tools: [\n    research agent's tool definition\n  ],\n})\n```\n\n完成此更改后，应用程序会生成并执行调用所定义工具（包括\
  \ MCP 服务器）的 TypeScript 代码。\n\n## 将 MCP 转换为 TypeScript\n\n当在 CodeMode 中连接到 MCP 服务器时，Agent\
  \ SDK 会获取 MCP 服务器的 Schema 并将其转换为 TypeScript API。生成的 API 包含源自 Schema 的 TypeScript\
  \ 定义和文档注释。\n\n这些 TypeScript 定义会被加载到代理的上下文中。目前整个 API 会一次性加载，尽管未来的改进可能允许动态搜索或浏览 API。\n\
  \n尽管一次性加载整个 API 仍会增加上下文大小，但这仅在初始化时发生一次。随后 LLM 读取 API 并生成代码。由于 LLM 擅长处理代码，这种方法利用了这一优势。\n\
  \n## 在沙箱中执行\n\n在 CodeMode 中，代理获得的是一个用于执行 TypeScript 代码的单一工具，而不是直接呈现所有 MCP 工具。\n\n\
  生成的代码运行在一个与互联网隔离的安全沙箱中。沙箱只能通过代表已连接 MCP 服务器的 TypeScript API 来访问外部系统。\n\n当沙箱代码调用 API\
  \ 函数时，调用会通过 RPC 经由代理循环路由回 MCP 服务器。沙箱使用 `console.log()` 返回结果。执行完成后，日志会返回给代理。\n\n\
  在传统 MCP 流程中：\n\n1.  代理从 MCP 服务器接收工具 Schema。\n2.  LLM 调用包含与 MCP 工具匹配的工具定义。\n3.  LLM\
  \ 输出用于函数调用的特殊 Token。\n4.  代理解析并执行工具调用。\n5.  过程重复。\n\n而在 CodeMode 中：\n\n1.  代理从 MCP\
  \ 服务器检索工具 Schema。\n2.  LLM 调用包含源自这些 Schema 的 TypeScript API。\n3.  LLM 针对该 API 编写\
  \ TypeScript 代码。\n4.  代码在沙箱中执行。\n5.  沙箱通过 RPC 绑定与 MCP 服务器交互。\n6.  最终日志返回给代理。\n\n\
  下图展示了传统 MCP 执行与 CodeMode 之间的架构对比。\n\n![Figure 4.41 – Traditional MCP vs Code Mode\
  \ execution flow](img/B37082_4_41.png)\n\nFigure 4.41 – Traditional MCP vs Code\
  \ Mode execution flow\n\nCodeMode 作为一种替代执行模型呈现，它依赖于 LLM 生成代码的能力，同时保留 MCP 作为统一的集成层。\n\
  \n# 使用 Claude Code 插件管理配置\n\n请查阅官方文档参考：[`code.claude.com/docs/en/plugins`](https://code.claude.com/docs/en/plugins)。\n\
  \n插件将斜杠命令（技能）、子代理、MCP 服务器和钩子捆绑成一个可共享的原语。这些插件可以在团队内部共享，或发布到开源社区，从而在各环境中实现复用和一致性。\n\
  \n在引入插件之前，复用配置需要大量的手动工作。例如，要使用开源仓库中的一个斜杠命令，我们必须导航到该仓库，复制斜杠命令，并将其粘贴到本地 `.claude`\
  \ 目录中。子代理和钩子也适用相同流程。MCP 服务器遵循不同的设置流程，但整体工作流仍然是手动且碎片化的。\n\nClaude Code 插件通过将所有这些组件捆绑到一个可无缝安装和集成的插件中来解决此问题。插件可以来自开源仓库或内部仓库，并跨团队共享。\n\
  \nClaude Code 提供了一个直观且易用的基于 CLI 的插件系统。\n\n## 插件系统的优势\n\n插件的主要优势之一是能够跨团队共享统一的 Claude\
  \ Code 设置。例如，新员工入职时，我们可能希望他们拥有与团队其他成员相同的工具、相同的代理和子代理，以及相同的 MCP 服务器。插件提供了一种标准化 Claude\
  \ Code 开发环境的机制。\n\n插件还支持细粒度安装。我们可以不安装整个插件，而仅安装特定组件，例如单个 MCP 服务器。\n\n此外，Claude Code\
  \ 引入了一个称为 marketplace（市场）的新原语。Marketplace 由一个描述可安装插件的 JSON 文件表示。\n\n值得注意的是，Google\
  \ 的 Gemini CLI 引入了一个类似的概念，称为 Gemini Extensions。Gemini Extensions 于 2025 年 10 月 8\
  \ 日发布，而 Claude Code 插件于 2025 年 10 月 9 日发布。这仅差一天的时间差表明，要么是 Claude Code 团队进行了极快的迭代，要么是两个团队在同时实现同一个想法。\n\
  \n## 探索官方插件市场\n\n为了了解插件如何工作，我们从 Claude Code 课程仓库开始。\n\n在 Claude Code 开源仓库中，有一个 `.claude‑plugin`\
  \ 目录。该目录内包含一个 `marketplace.json` 文件。\n\n该文件定义了官方插件市场。它列出了可用插件，并为每个插件提供元数据和源路径。\n\
  \n市场中列出的插件示例包括：\n\n*   `pr‑review‑toolkit`\n*   `commit‑commands`\n*   `agent‑sdk‑dev`\n\
  *   `feature‑dev`\n*   Security guidelines\n\nMarketplace 作为一个注册表，Claude Code 可以加载它以发现可用插件。\n\
  \n## 向 Claude Code 添加市场\n\n在安装插件之前，必须向 Claude Code 添加一个市场。\n\n要添加市场，请按以下步骤操作：\n\n\
  1.  打开 Claude Code 并运行以下命令：\n\n    ```\n    /plugin\n    ```\n\n2.  选择 **Browse**\
  \ 并安装插件。\n\n3.  由于最初未配置市场，请选择 Add Marketplace。\n\n4.  提供以下任一项：\n    *   GitHub 仓库\
  \ URL\n    *   指向 `marketplace.json` 文件的直接链接\n\n在本例中，提供了官方 Claude Code 仓库的基础 URL。Claude\
  \ Code 会自动检测市场文件并加载可用插件。\n\n市场文件加载后，插件列表及其描述将变为可见。\n\n![Figure 4.42 – Claude Code\
  \ plugin marketplace showing available plugins](img/B37082_4_42.png)\n\nFigure 4.42\
  \ – Claude Code plugin marketplace showing available plugins\n\n## 审查插件来源与安全考量\n\
  \n在此阶段，仅可见插件描述。要了解插件实际安装的内容，必须检查插件源代码。\n\n`marketplace.json` 中的每个插件条目都包含一个 source\
  \ 字段。该字段指向插件实现的位置。\n\n\n\n\n# 安装插件之前\n\n在安装插件之前，审查其来源非常重要。从安全角度来看，这类似于安装 MCP 服务器或使用他人编写的系统提示词和\
  \ Agent。在不审查实现的情况下安装插件会引入风险。\n\n## 审查插件来源\n\n请遵循以下步骤审查插件来源：\n\n1.  打开 `marketplace.json`\
  \ 文件。\n2.  定位插件条目。\n3.  识别 `source` 字段。\n4.  在仓库中导航到该源路径。\n\n例如，`agent‑sdk‑dev`\
  \ 插件指向仓库内的一个目录。要检查它，请遵循以下步骤：\n\n1.  导航到仓库。\n2.  打开 `plugins/` 目录。\n3.  打开 `agent‑sdk‑dev/`\
  \ 目录。\n4.  打开 `.claude‑plugin/` 目录。\n5.  检查 `plugin.json` 文件。\n\n`plugin.json` 文件包含插件元数据，并定义了该插件安装的\
  \ Agent 和斜杠命令（技能）。\n\n另一个例子是 `feature-dev` 插件。该插件包含多个 Agent，例如：\n\n*   Code reviewer（代码审查员）\n\
  *   Code explorer（代码探索员）\n*   Code architect（代码架构师）\n\n它还包含一个在 `feature‑dev.md`\
  \ 中定义的斜杠命令。该斜杠命令用于描述要实现的功能并指导工作流。\n\n# 安装和管理插件\n\n添加市场后，即可安装和管理插件。\n\n## 安装插件\n\n\
  要安装插件，请遵循以下步骤：\n\n1.  使用 `/plugin` 打开插件界面。\n2.  选择 **Browse and install plugins**（浏览并安装插件）。\n\
  3.  定位 `commit‑commands` 插件。\n4.  打开插件详情。\n5.  选择 **Install**（安装）。\n6.  等待安装完成。\n\
  \n安装后，该插件会出现在已安装插件列表中。\n\n## 验证安装\n\n要验证插件已安装并启用，请遵循以下步骤：\n\n1.  打开已安装插件列表。\n2.\
  \  定位 `commit-commands` 插件。\n3.  确认其标记为已安装。\n4.  确认其已启用。\n\n## 更新插件\n\n插件由仓库支持，可随时间更新。要更新插件，请遵循以下步骤：\n\
  \n1.  选择已安装的插件。\n2.  找到 **Update**（更新）选项。\n3.  应用更新。\n\n更新插件在概念上类似于针对仓库的最新版本进行变基。\n\
  \n## 尝试卸载插件\n\n插件界面包含卸载选项。要尝试卸载插件，请遵循以下步骤：\n\n1.  选择已安装的插件。\n2.  找到 **Uninstall**（卸载）选项。\n\
  3.  尝试卸载插件。\n\n在此阶段，卸载无法按预期工作。卸载操作不会移除插件。这似乎是当前的限制或 Bug。\n\n![Figure 4.43 – Attempting\
  \ to uninstall a Claude Code plugin](img/B37082_4_43.png)\n\nFigure 4.43 – 尝试卸载\
  \ Claude Code 插件\n\n# 使用 feature-dev 插件\n\n接下来，使用 `feature‑dev` 插件演示完整的工作流。\n\n\
  继续之前，请确保该插件已安装并启用。\n\n![Figure 4.44 – Feature-dev plugin details in Claude Code](img/B37082_4_44.png)\n\
  \nFigure 4.44 – Claude Code 中的 Feature-dev 插件详情\n\n## 启动工作流\n\n要启动工作流，请遵循以下步骤：\n\
  \n1.  打开 Claude Code 并运行以下命令：\n\n    ```\n    /feature-dev\n    ```\n\n2.  等待插件初始化。\n\
  \n命令执行后，Claude 进入发现阶段。此时，Claude 开始提问以了解需要实现的功能。\n\n## 在 feature-dev 工作流期间处理 Git\
  \ 状态\n\n在切换分支之前，Claude Code 会检查仓库的当前 Git 状态。\n\n此时，仓库可能包含**未提交的本地更改**。在不处理这些更改的情况下切换分支可能导致冲突或工作丢失。\n\
  \n### 检查 Git 状态\n\n作为工作流的一部分：\n\n*   Claude 检查当前工作树状态。\n*   Claude 检测到存在本地未提交更改。\n\
  *   Claude 判断直接切换分支不安全。\n\n这些检查作为 `feature-dev` 工作流的一部分自动发生。\n\n### 暂存本地更改\n\n为安全地继续，Claude\
  \ 使用 `git stash` 保存当前工作状态。\n\n在此步骤中，Claude 执行以下操作：\n\n*   暂存当前工作目录的更改\n*   确认工作树现已干净\n\
  *   继续切换分支\n\n这确保了本地更改不会丢失。\n\n### 切换分支并恢复状态\n\n检查功能分支后，Claude 返回原始分支并恢复之前的 Git\
  \ 状态：\n\n1.  Claude 切回主分支。\n2.  Claude 重新应用暂存的更改。\n3.  Claude 确认工作目录已恢复。\n\n此时，仓库回到原始状态，本地更改保持完好。\n\
  \n## 提供功能详情\n\n本示例中的任务是更新仓库的 `README` 文件。\n\n`README` 文件包含一个列出课程章节的表格。一个新章节存在于名为\
  \ `context‑engineering‑mcp` 的 GitHub 分支中，该分支必须添加到表格中。要访问仓库链接，请遵循 *Preface*（前言）中\
  \ *Download the example code files*（下载示例代码文件）部分的步骤。\n\n出现提示时，请执行以下操作：\n\n*   描述所需的更改。\n\
  *   提供 `context‑engineering‑mcp` 分支的 URL。\n\n## 检查功能分支中的 README 文件\n\nClaude 检查功能分支中的\
  \ `README` 文件。在此步骤中，Claude 执行以下操作：\n\n1.  切换到 `context‑engineering‑mcp` 分支。\n2.\
  \  检查 `README` 文件。\n3.  识别表格结构。\n\n    ![Figure 4.45 – Inspecting the README in\
  \ the feature branch](img/B37082_4_45.png)\n\n    Figure 4.45 – 在功能分支中检查 README\n\
  \n## 切回主分支\n\n检查功能分支后，Claude 执行以下操作：\n\n1.  切回主分支。\n2.  准备应用更改。\n3.  提出新的表格条目。\n\
  \n## 审查和优化建议的更改\n\nClaude 为新表格条目生成初步描述。继续之前，请执行以下操作：\n\n1.  审查描述。\n2.  识别不准确之处。\n\
  3.  优化措辞。\n\n![Figure 4.46 – Reviewing and refining the proposed README change](img/B37082_4_46.png)\n\
  \nFigure 4.46 – 审查和优化建议的 README 更改\n\n该描述基本正确，继续之前只需微调。\n\n## 提交、推送和验证更改\n\n变更获批后，将发生以下情况：\n\
  \n1.  Claude 创建提交。\n2.  Claude 将提交推送到远程仓库。\n3.  刷新仓库。\n4.  打开 `README` 文件。\n5. \
  \ 验证新章节条目是否出现在表格中。\n\n![Figure 4.47 – Verifying the README update after commit](img/B37082_4_47.png)\n\
  \nFigure 4.47 – 提交后验证 README 更新\n\n这确认工作流成功完成。\n\n# 插件市场与企业用例\n\nClaude Code 支持第三方插件市场。\n\
  \n例如，DevOps 自动化市场可提供包含与基础设施工作流相关的斜杠命令、Agent 和 MCP 服务器的插件。组织还可创建供内部使用的私有市场。这些市场可包含特定于内部工具或团队的插件并保持私有。\n\
  \n平台公司（如 Supabase）很可能会发布自己的市场和插件，以改善与 Claude Code 的集成。\n\n插件还支持细粒度安装。单个斜杠命令或 MCP\
  \ 服务器等独立组件可单独安装，无需安装整个插件。该插件生态系统预计将不断发展，并在企业级 Claude Code 采用中发挥重要作用。\n\n# 总结\n\n\
  \n\n\n在本章中，你学习了 MCP 创建的原因以及它如何解决 AI 系统中的集成问题。你探索了其核心架构：主机、客户端和服务器，并了解了 MCP 如何实现可复用的跨平台工具集成。通过实践示例，你配置并使用了\
  \ Context7 MCP，将服务器连接到 Claude，并使用 CLI 管理 MCP 设置。你还了解了糟糕的 MCP 配置如何污染上下文窗口并降低性能，以及如何通过上下文工程和作用域配置来优化使用。最后，你探索了\
  \ Claude Code 插件，考察了 MCP 的局限性，并回顾了 CodeMode 作为一种替代执行模型。\n\n理解 MCP 非常重要，因为它正逐渐成为基于智能体\
  \ AI 开发中的基础集成层。知道如何高效地使用它以及何时对其提出质疑，将帮助你构建更具扩展性和有效性的 AI 系统。\n\n在下一章中，我们将介绍 GitHub\
  \ 仓库配置、拉取请求和议题自动化，以及 GitHub Actions 在工作流执行中的使用。\n\n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问\
  \ [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_4_48.png)\n\n![Image](img/B37082_4_49.png)\n\n*注意：请准备好发票。直接从\
  \ Packt 网站购买的不需要发票。*\n\n# 使用 Claude Code 和 GitHub 自动化你的开发工作流\n\n在本章中，我们将深入探讨 Claude\
  \ Code 与 GitHub 之间的集成。该集成涉及一系列配置步骤，包括安装 GitHub CLI、将其配置为与 Claude Code 协同工作，以及选择\
  \ Claude Code 将在其上运行的仓库。\n\n配置完成后，Claude Code 可以直接在仓库中使用。它可以在拉取请求和议题中被 @提及，此时它会审查代码、提出修复建议并帮助解决报告的问题。Claude\
  \ Code 还可以参与拉取请求工作流，在创建拉取请求时审查变更。\n\n当打开拉取请求时，将使用 **GitHub Actions** 来运行自动化。GitHub\
  \ Actions 是 GitHub 的无服务器工作流平台，通常用于 CI/CD 任务。在此设置中，GitHub Actions 执行依赖于 Claude Code\
  \ CLI 和 Claude Code SDK 的工作流。\n\n对于不熟悉 GitHub Actions 的读者，它是一个响应事件运行的自动化系统。这些事件可以包括在议题中\
  \ @提及 Claude 或打开新的拉取请求等操作。每个事件都可以根据项目需求配置为触发特定的工作流。\n\n工作流本身使用 YAML 文件定义，通常称为 GitHub\
  \ 工作流文件。这些文件描述了哪些事件应触发操作，以及响应时应执行哪些命令或脚本。\n\n该集成已用于实际生产系统。例如，Anthropic 在其开源仓库中将\
  \ Claude Code 与 GitHub Actions 结合使用，以自动化议题处理和相关工作流。要查看公开示例，请参阅 Anthropic 的 GitHub\
  \ Actions 工作流：[`github.com/anthropics/skills/actions`](https://github.com/anthropics/skills/actions)。\n\
  \n本章将涵盖以下主题：\n\n*   安装和配置 Claude Code GitHub 集成\n*   @提及 Claude Code 以解决 GitHub\
  \ 议题\n*   利用项目记忆重新运行议题解决流程\n\n# 安装和配置 Claude Code GitHub 集成\n\n在本节中，我们将使用一个名为 IceBreaker\
  \ ([`github.com/emarco177/IceBreaker`](https://github.com/emarco177/IceBreaker))\
  \ 的不同仓库来演示集成，这是一个托管在 GitHub 上的开源项目。我们仅将此仓库用于演示目的。你可以使用任何你拥有的 GitHub 仓库跟随操作。如果你选择使用自己的仓库，请确保你拥有管理员权限，因为安装\
  \ Claude GitHub 应用和配置工作流需要管理员权限。\n\n在开始安装之前，请确保你是在一个已经初始化并连接到 GitHub 的 Git 仓库目录中运行\
  \ Claude Code。在本章中，我们使用已经配置好的 IceBreaker 仓库。集成仅在有效的 GitHub 仓库内才能工作。\n\n要开始 GitHub\
  \ 集成，从桌面打开 Claude Code 并输入 `/git`。这将显示 `/install-github-app` 命令。选择此命令将启动设置过程。\n\n\
  在 Claude Code 可以与 GitHub 账户集成之前，必须满足两个先决条件：\n\n*   首先，必须在本地安装 GitHub CLI（也称为 `gh`\
  \ CLI）。此时 CLI 尚未安装，接下来我们将安装它。\n*   其次，GitHub CLI 必须经过 GitHub 账户的身份验证。Claude Code\
  \ 依赖此经过验证的会话与仓库进行交互。\n\n## 安装先决条件\n\n安装命令因操作系统而异。下面的示例展示了使用 Homebrew 的 macOS。如果你使用的是\
  \ Linux 或 Windows，请参阅官方 GitHub CLI 安装文档，获取适合你平台的相应命令：[`cli.github.com/`](https://cli.github.com/)\n\
  \n要安装并验证 GitHub CLI，请完成以下步骤：\n\n1.  打开一个新的终端实例，并使用以下命令安装 GitHub CLI：\n\n    ```\n\
  \    brew install gh\n    ```\n\n2.  安装完成后，通过运行以下命令验证 CLI 是否可用：\n\n    ```\n   \
  \ gh --help\n    ```\n\n3.  接下来，通过运行以下命令使用 GitHub 对 CLI 进行身份验证：\n\n    ```\n   \
  \ gh auth login\n    ```\n\n在身份验证过程中，选择 **HTTPS** 作为连接方式，然后通过网页浏览器登录。系统会提供一个一次性代码，必须在浏览器中输入该代码以完成身份验证。如果启用了双因素认证，则使用配置的第二因素完成批准。\n\
  \n完成此步骤后，GitHub CLI 已成功通过身份验证，Claude Code 集成的所有先决条件均已就绪。\n\n## 安装 Claude GitHub\
  \ 应用\n\n完成先决条件后，我们返回 Claude 继续安装。我们关闭不再需要的终端窗口，并按提示在 Claude 中按 `Enter` 键。此时，我们将被重定向到一个\
  \ GitHub 页面。\n\n![Figure 5.1 – Installing the Claude GitHub app](img/B37082_5_1.png)\n\
  \n**Figure 5.1 – 安装 Claude GitHub 应用**\n\n开始将 Claude Code 集成到 GitHub 账户中。此集成允许 Claude\
  \ 发表评论、创建拉取请求并解决议题。我们将在本书后面演示这些功能。\n\n点击 **Install** 后，我们被重定向回 Claude Web 应用程序。返回终端，我们再次按\
  \ `Enter` 键继续。\n\n## 安装 GitHub 工作流\n\n安装集成需要向仓库添加一个 GitHub 工作流。该工作流运行处理 Claude 评论和操作的管道。\n\
  \n将向你提供两个安装选项：\n\n*   **Tag Claude**，允许我们在议题和拉取请求评论中 @提及 Claude，然后通过 GitHub 工作流运行。\n\
  *   **Claude Code Review**，自动审查新的拉取请求。\n\n我们选择第一个选项。\n\n接下来，我们选择一种身份验证方法。由于 Claude\
  \ 的使用会消耗 Token，因此需要有人为这些 Token 付费。我们可以配置一个与 Claude 订阅关联的长期 Token，或者提供一个 Anthropic\
  \ API 密钥。长期 Token 适用于订阅范围内的中小规模使用，而 API 密钥通常用于运行大规模或高频工作流、可能超出订阅限制的情况。在本例中，我们选择与\
  \ Claude 订阅关联的长期 Token。\n\n\n\n\n确认此选择后，我们授权该集成。此授权还会跟踪 Token 消耗并将其与 Claude 订阅关联。\n\
  \n如果出现错误，是因为 GitHub 集成是从未连接到 GitHub 仓库的目录发起的。\n\n要修复此问题，请在已初始化并连接到您账户的 GitHub 仓库的项目目录中打开一个新终端。在本例中，我们使用前文介绍且已配置好\
  \ GitHub 的 `IceBreaker` 目录。\n\n重新打开 Claude，再次导航至 GitHub 安装页面，Claude 应能正确检测当前仓库。打开配置弹窗，选择相应账户，并授予仓库访问权限。确认后，返回\
  \ CLI 并使用长效 Token 再次配置 Claude Code。\n\n### 创建 Pull Request\n\n认证完成后，Claude 通过获取仓库信息初始化集成，并自动创建\
  \ Pull Request。\n\n![Figure 5.2 – Automatically Creating a Pull Request for Claude\
  \ GitHub workflow](img/B37082_5_2.png)\n\nFigure 5.2 – Automatically Creating a\
  \ Pull Request for Claude GitHub workflow\n\n此 Pull Request 包含 `.github` 目录下的多个更新文件。这些是配置\
  \ GitHub 工作流的 YAML 文件。我们打开 Pull Request 进行审查。\n\n该工作流使 Claude 能在评论和 Issue 中被 @提及，并允许其通过\
  \ GitHub Actions 运行。GitHub Actions 提供了 Claude 运行的计算环境，且工作流配置为使用与我们账户关联的 Token。\n\
  \n从安全角度看，API 密钥或访问 Token 作为 GitHub Actions Secret 存储。这在配置期间自动完成。只有拥有相应仓库访问权限的用户才能触发工作流。当\
  \ Claude 被 @提及 时，它可以创建分支、提交和评论。\n\n合并 Pull Request 前，新添加的 GitHub 工作流应自动运行。在 **GitHub\
  \ Actions** 选项卡中，我们将看到 Claude Code 工作流正在执行。成功完成后，继续合并。\n\n工作流运行期间，它会更新 Pull Request。Claude\
  \ 读取其添加的文件，具体为 `.github/workflows` 下的两个 YAML 文件：`claude.YAML` 和 `claude‑code‑review.YAML`。它针对安全问题和代码质量审查这些文件，并将反馈直接发布在\
  \ Pull Request 中。\n\n审查结束时，Claude Code 批准该 Pull Request，表明它认为这些更改可接受，如下截图所示。\n\n\
  ![Figure 5.3 – Pull request approved with all checks passed](img/B37082_5_3.png)\n\
  \nFigure 5.3 – Pull request approved with all checks passed\n\n我们现在合并 Pull Request。合并后，仓库应包含一个之前不存在的新目录\
  \ `.github/workflows`。该目录下有集成添加的两个 YAML 文件：\n\n*   `claude.YAML`\n*   `claude‑code‑review.YAML`\n\
  \n第一个 YAML 文件将展示 Claude 工作流配置。文件将包含一个名为 **Run** **Claude Code** 的步骤。认证 Token 从名为\
  \ `CLAUDE_CODE_OAUTH_TOKEN` 的 Secret 引用。没有敏感信息直接存储在工作流文件中，这保证了设置的安全性。\n\n```\nname:\
  \ Claude Code\n\non:\n  issue_comment:\n    types: [created]\n\njobs:\n  claude:\n\
  \    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout repository\n \
  \       uses: actions/checkout@v4\n\n      - name: Run Claude Code\n        id:\
  \ claude\n        uses: anthropics/claude-code-action@beta\n        with:\n    \
  \      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}\n```\n\n\
  下方展示了工作流文件的简化摘录。\n\n![Figure 5.4 – Claude GitHub Actions Workflow YAML File](img/B37082_5_4.png)\n\
  \nFigure 5.4 – Claude GitHub Actions Workflow YAML File\n\n至此，集成完成。配置可进一步自定义，包括选择模型、定义\
  \ Claude 可用的工具，以及调整其他设置以匹配特定需求。\n\n# 使用 Claude Code 解决 GitHub Issue\n\n本节演示如何在安装集成后，通过\
  \ @提及 Claude Code 来帮助解决 GitHub 仓库中的 Issue。\n\n我们首先导航至仓库的 **Issues** 部分。我们关注的 Issue\
  \ 是一个简单的 Issue，由用户 `happyLolonly` 创建。该用户提出的问题是：通过将变量从 `linkedin_username` 重命名为 `linkedin_url`\
  \ 来提高可读性，因为该变量实际存放的是 LinkedIn URL。\n\n首先在 Issue 上 @提及 Claude 并请求其解决问题：\n\n```\n\
  @claude, can you fix this\n```\n\nClaude 被 @提及 后，新的 GitHub Action 会自动开始运行。在本例中，该\
  \ Action 称为 **small rename**。一旦提及 Claude，即触发此 Action。\n\n打开 Action 查看详情，实时观察流式日志。日志主要由显示工具调用、工具输入和工具输出的\
  \ JSON 输出组成。虽然此信息利于深度调试，但人类难以阅读，且难以在宏观层面跟进。\n\n对于大多数情况，不如返回 Issue 本身，而非检查原始日志。\n\
  \n## Claude 的待办列表与上下文发现\n\n回到 Issue 视图，Claude 创建一个随进度更新的待办列表。Claude 采取的第一步是尝试在仓库中定位\
  \ `CLAUDE.md` 文件。\n\n![Figure 5.5 – Claude To-Do List and Context Discovery in Issue\
  \ View](img/B37082_5_5.png)\n\nFigure 5.5 – Claude To-Do List and Context Discovery\
  \ in Issue View\n\n`CLAUDE.md` 文件的目的是提供额外上下文。这些文件帮助 Claude 了解技术栈、项目结构、编码规范以及我们想传达的任何偏好。这属于上下文工程的一部分，即我们有意提供信息以帮助模型更有效地执行任务。\n\
  \n剧透预警！此仓库中没有 `CLAUDE.md` 文件。这是有意为之，旨在说明一个重要观点：在 Agentic AI 工作流中，事情并不总能正确运行，错误在所难免。\n\
  \n因此，仔细审查任何更改而非盲目接受至关重要。此原则贯穿所有 Agentic 工作流，不仅限于此例。\n\n## 审查提议的更改\n\nClaude 完成待办列表后，会更新名为\
  \ `linkedin.py` 的文件。我们随后通过创建 Pull Request 打开 **diff** 进行查看。\n\n![Figure 5.6 – Reviewing\
  \ the pull request with proposed changes](img/B37082_5_6.png)\n\nFigure 5.6 – Reviewing\
  \ the pull request with proposed changes\n\n乍看之下，Pull Request 描述似乎合理。然而，当你检查实际代码更改时，会发现\
  \ Claude 重命名了一个作为第三方服务 API 请求一部分的变量。\n\n![Figure 5.7 – Incorrect Variable Rename\
  \ Breaking Third-Party API Contract](img/B37082_5_7.png)\n\nFigure 5.7 – Incorrect\
  \ Variable Rename Breaking Third-Party API Contract\n\n这是个问题。第三方 API 期望载荷遵循特定格式及特定变量名。更改此变量名会破坏与外部端点的契约，导致代码失败。\n\
  \n因此，该 Pull Request 不正确，不应被接受。\n\n### 理解 Claude 的工作流\n\nClaude 在其自动创建的新分支上执行更改。分支遵循类似\
  \ `claude/issue/<issue‑number>` 的命名约定。这是个重要细节，因为它意味着 Claude 从不直接在主分支上工作。\n\n\n\n\
  \n我们完全保留是否审查、修改或合并变更的控制权。这种分支策略也是扩展智能体工作流的基础。在实践中，我们可以并行运行多个 Claude 实例，每个实例在自己的分支上工作。\n\
  \n这一想法关联到更高级的工作流，例如使用 Git 工作树，我们将在本书后面介绍。\n\n这个例子展示了使用 Claude Code 解决问题的威力和局限性。Claude\
  \ 可以快速自动化变更，但如果缺乏足够的上下文，它可能会引入破坏性变更。代码审查依然至关重要，而理解 Claude 如何在分支中操作则是随着我们扩展智能体工作流而变得关键的。\n\
  \n# 使用 CLAUDE.md 添加仓库上下文\n\n本节的目标是展示添加显式仓库上下文如何帮助 Claude Code 在解决问题时产生更准确、更可靠的变更。\n\
  \n如果 Claude 因为缺乏足够的仓库上下文，而未能解决之前涉及变量重命名的 GitHub 问题，会怎样？让我们看看如何验证这一假设。我们首先进入桌面，GitHub\
  \ 项目目录就在那里。我们在 Cursor 中打开项目并运行一次快速获取以拉取最新变更。此时，我们已经拥有上一步中的 YAML 文件。接下来，我们打开 Claude。\n\
  \n## 初始化仓库上下文\n\n我们在 Claude 中运行 `/init` 命令。如前所述，此命令会生成一个 `CLAUDE.md` 文件，捕获特定于仓库的上下文，包括技术栈、项目结构和其他相关细节。确认命令后，Claude\
  \ 开始扫描仓库文件。这个过程只需很短的时间，Claude 就会收集所需信息。\n\n初始化期间，Claude 会请求执行某些命令的权限，例如列出文件。我们明确允许这些操作。本地设置文件会更新以将批准的命令加入白名单，这些权限在本地会话期间持久有效。这种批准模型提供了对\
  \ Claude 允许执行操作的细粒度控制。\n\n扫描完成后，Claude 写入 `CLAUDE.md` 文件。\n\n### 审查并提交 CLAUDE.md\n\
  \n我们在源目录中找到新创建的 `CLAUDE.md` 文件并审查其内容。该文件包含仓库的结构化摘要，看起来是正确的。\n\n然后我们指示 Claude 提交\
  \ `CLAUDE.md` 文件。Claude 准备一条提交信息，我们审查并接受。提交在本地创建，然后推送到远程仓库。提交此文件可确保仓库上下文被版本化、与团队共享，并在\
  \ Claude Code 在自动化工作流（如 GitHub Actions）中运行时可用。\n\n在提交历史中，我们应该会看到一条新记录，表明已添加 `CLAUDE.md`。\n\
  \n![Figure 5.8 – Committing CLAUDE.md to the repository](img/B37082_5_8.png)\n\n\
  Figure 5.8 – 将 CLAUDE.md 提交到仓库\n\n有了可用的仓库上下文，我们回到 Claude 之前未能解决的问题。\n\n我们再次在问题上提及\
  \ Claude，并请其解决该问题。这一次，我们提供了一个额外的提示，指明所需的变更位于特定函数内。我们提交评论：\n\n```\n@claude, can you\
  \ please address this issue? Please notice that you need to edit the function `ice_break_with`\n\
  ```\n\nGitHub Actions 流水线立即启动，确认 Claude Code 已被触发。我们等待工作流完成。\n\n### 检查 Claude 的变更\n\
  \nClaude 生成任务列表并开始执行。虽然由于额外的提示，该实验略有偏向性，但它仍然演示了提供适当上下文的效果。\n\n工作流完成后，检查 Claude 创建的分支。变更显示变量名已从\
  \ `linkedin_username` 更新为 `linkedin_url`，且该更新已在函数定义和调用点处一致地应用。与上一次尝试不同，此变更保留了外部\
  \ API 契约，且未破坏集成。逻辑是正确的。\n\n我们现在可以创建一个标题为 **Renamed `linkedin_username` to `linkedin_url`**\
  \ 的拉取请求。这准确反映了变更的范围。\n\n![Figure 5.9 – Pull request created with corrected variable\
  \ name](img/B37082_5_9.png)\n\nFigure 5.9 – 使用修正后的变量名创建拉取请求\n\n拉取请求一打开，Claude Code\
  \ 审查工作流就会自动运行。Claude 分析差异并执行代码审查，生成审查步骤和发现的清单。\n\n该审查系统完全可配置。根据需要，可以添加额外的检查，如代码检查工具、测试执行或自定义验证规则。这种可配置性是\
  \ Claude Code 能在基于团队的工程工作流中有效运作的关键原因。\n\n审查完成，总体评估为批准。未发现功能性问题。\n\n审查批准后，拉取请求即可合并。\n\
  \n# 总结\n\n在本章中，我们探讨了 Claude Code 如何与 GitHub 集成，以及如何将其作为真实开发工作流的一部分使用。我们演示了安装所需工具、配置\
  \ Claude GitHub 应用，以及设置允许 Claude 响应问题和拉取请求的 GitHub Actions 工作流。我们还了解了 Claude 如何通过创建分支、打开拉取请求和参与自动化审查来运作，以及为什么审查其变更至关重要。通过实际示例，我们观察到缺少仓库上下文如何导致错误变更，以及引入\
  \ `CLAUDE.md` 文件如何提高准确性。至此，您已清楚地了解如何安全地使用 Claude Code，它在何处增加价值，以及如何保留对代码库的完全控制权。\n\
  \n在下一章中，我们将专注于结构化智能体工作流，探讨规划模式、规格驱动开发以及并行智能体协调的实践。\n\n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问\
  \ [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_5_10.png)\n\n![Image](img/B37082_5_11.png)\n\n*注意：请准备好发票。直接从\
  \ Packt 网站购买的不需要发票。*\n\n# 6\n\n# Claude Code 规划与多智能体工作流\n\n智能体编码工作流受益于结构、规划和受控执行。随着系统变得更复杂并包含更多工具和自动化，依赖临时提示会增加意外变更和不可预测行为的风险。\n\
  \n本章探讨 Claude Code 如何通过规划和多智能体执行支持结构化智能体工作流。它展示了从探索性提示转向规格驱动开发如何提高安全性和可预测性，以及如何协调多个智能体高效地在同一代码库上工作。虽然示例使用的是\
  \ Claude Code，但讨论的原则广泛适用于智能体系统。\n\nClaude Code 规划模式在官方文档中有介绍。有关规划模式如何工作及何时使用的简要概述，请参阅以下内容：\n\
  \n[`code.claude.com/docs/en/common-workflows#how-to-use-plan-mode`](https://code.claude.com/docs/en/common-workflows#how-to-use-plan-mode)\n\
  \n在本章中，我们涵盖以下主题：\n\n*   Claude Code 规划模式\n*   并行使用多个 Claude Code 智能体\n\n# Claude\
  \ Code 规划模式\n\n\n\n\n\n# Claude Code 规划模式与并行开发\n\nClaude Code 提供了一个**规划模式**，支持从探索式编码向**规格驱动开发**转变。该模式是智能体编码工作流中的基础原则。在规划模式下，Claude\
  \ Code 仅限于只读操作，负责在进行任何代码更改之前生成规格说明或实施计划。\n\n规划模式允许 Claude Code 对问题空间进行研究、分析和推理，随后生成详细的实施计划。在计划被明确审查并批准之前，不允许进行代码更改。\n\
  \n## 规划模式的特征\n\n规划模式是一个只读阶段。Claude Code 可以读取文件、分析代码库、进行 MCP 调用、搜索文档并设计解决方案。它无法编辑、创建或删除文件，无法进行\
  \ Git 提交、安装软件包，或执行任何执行层面的操作。\n\n该模式映射了资深软件工程师的工作流程。流程始于收集上下文、理解需求和业务约束。接下来进行规划，仅在审查和批准后才进入执行阶段。\n\
  \n## 规划工作流\n\n规划工作流遵循结构化的序列：\n\n1.  Claude Code 对现有代码库或提供的需求进行研究和分析。\n2.  制定一份全面的实施计划或规格说明。\n\
  3.  提交计划供审查。\n4.  批准后，Claude Code 退出规划模式并开始实施。\n\n这种策略与执行的分离提供了一致性和安全性，特别是在处理大型或复杂代码库时。\n\
  \n通过建立只读规划阶段，该工作流为安全且审慎地做出实施决策创建了结构化基础。这一基础使得我们能够理解为何规划产物（如规格说明）在更可靠的开发工作流中扮演核心角色，我们将在接下来探讨这一点。\n\
  \n## 规格驱动开发的优势\n\n在设计复杂系统或理解大型项目时，规划模式尤为有用。主要优势在于规划与执行的清晰分离，这能降低风险并提高可靠性。\n\n常见的做法是将生成的计划或规格导出为\
  \ Markdown 文件。该文件可被共享、协作审查，并在项目生命周期中复用。这种方法通过使规划产物显性化和持久化，提升了 Claude Code 的整体价值。\n\
  \n该工作流是**规格驱动开发**的一个示例。与其立即实施功能，不如花时间定义业务问题、明确要解决的内容以及确定解决方案。这种方法能带来更好的结果，并能缩短整体实施时间，特别是结合子智能体时。\n\
  \n一份定义良好的规格能为语言模型界定问题空间、建立清晰边界并减少幻觉。它能防止意外副作用，例如不必要的文件更改或无关功能的回归。\n\n以下示例演练了如何通过端到端的规划与细化工作流在实践中应用这些原则。\n\
  \n## 示例：迭代优化 Hook 市场规格\n\n在本练习中，我们将使用 Claude Code 的规划模式为一个名为 **HookHub** 的新 Next.js\
  \ 项目起草规格说明。我们不直接编写实现代码，而是首先将项目的结构和需求定义为规划产物。这种方法允许我们在生成代码前迭代优化设计。\n\n```\n### 实操：使用规划模式\n\
  \n在项目目录中打开 Claude Code：\n\nclaude\n\n进入规划模式：\n\n/plan\n```\n\n以下示例展示了输入 `/plan`\
  \ 命令后 Claude Code 在规划模式下的运行状态。\n\n![图 6.1 – 执行 /plan 命令后在规划模式下运行的 Claude Code](img/B37082_6_1.png)\n\
  \n**图 6.1 – 执行 /plan 命令后在规划模式下运行的 Claude Code**\n\n在规划模式下，输入了以下提示词：\n\n*   为名为 HookHub\
  \ 的 Web 应用程序创建详细规格说明\n*   该应用程序应：\n    *   显示可用的 `Claude Code` hooks\n    *   以卡片形式渲染\n\
  \    *   将每张卡片链接到其 GitHub 仓库\n    *   支持按 Hook 事件类型筛选\n\nClaude Code 接收指令，为可用 `Claude\
  \ Code` hooks 的市场生成一款 Web 应用程序的规格说明。该应用以卡片集合的形式展示 hooks，每张卡片链接到一个包含 `Claude Code`\
  \ hook 的 GitHub 仓库，旨在支持开发者工作流。\n\n在规划模式下，Claude Code 生成初始任务列表、收集相关信息并产出规格文档。此阶段不编写任何代码。Claude\
  \ Code 执行研究、定义概念，并输出供后续实施使用的结构化规格说明。\n\n![图 6.2 – 规划模式下生成的初始 HookHub 应用程序规格](img/B37082_6_2.png)\n\
  \n**图 6.2 – 规划模式下生成的初始 HookHub 应用程序规格**\n\n初始规格包含需要细化的设计和功能决策。特别是在此用例中，hooks 采用轮播布局展示，且仅包含部分可用的\
  \ hook 事件类型。\n\n规格通过反馈进行细化。移除了基于轮播的展示方式，改为在主页显示所有 hook 卡片。向规格中添加了更多 hook 事件类型，包括代码生成后触发的事件。\n\
  \n## 持久化 Hook 市场规格\n\n细化完成后，Hook 市场应用的最终规格被导出为 Markdown 文件。\n\n![图 6.3 – 导出并保存 HookHub\
  \ 规格为 Markdown 文件](img/B37082_6_3.png)\n\n**图 6.3 – 导出并保存 HookHub 规格为 Markdown 文件**\n\
  \n`.md` 文件可提交至代码仓库，或存储在指定位置（如 `.claude` 目录）。该规格作为持久化的项目记忆被保留，并作为后续 `Claude Code`\
  \ 请求的上下文被复用。\n\n这种持久化的规范约束了 `Claude Code` 在实施过程中的行为，并在使用子智能体时确保一致的指导。\n\n本示例展示了如何使用规划模式和深度思考生成、细化并持久化具体的应用程序规格。通过对真实设计决策进行迭代，并将生成的规格作为项目记忆保留，该工作流为执行建立了稳定的上下文。有了规格作为基础，便可有效应用更高级的执行模式，包括并行开发。\n\
  \n# 并行使用多个 Claude Code 智能体\n\nClaude Code 支持同时运行多个 AI 智能体以加速开发工作流。核心理念是并行化独立任务，从而在更短时间内完成更多工作。此方法涉及在同一项目中运行多个\
  \ `Claude Code` 实例。\n\n该工作流可理解为多智能体编码系统的一个入门示例。虽然存在涉及子智能体的更复杂智能体工作流，但此设置演示了两个独立的\
  \ `Claude Code` 实例并行运行。\n\n![图 6.4 – 在同一共享代码库上并行工作的 Claude Code 智能体](img/B37082_6_4.png)\n\
  \n**图 6.4 – 在同一共享代码库上并行工作的 Claude Code 智能体**\n\n\n\n\n多个智能体可以比作多个开发者在同一个项目、同一个 GitHub\
  \ 分支上工作。每个智能体都拥有对整个代码库的读写权限。这种共享访问使得协作成为可能，但也需要仔细考虑任务分配以避免冲突。这种方法的有效性取决于分配给每个智能体的任务性质。\n\
  \n## 识别适合并行执行的任务\n\n当任务相互独立时，并行执行才有效。合适任务的示例包括修复不相关的 Bug、构建独立的 UI 页面，或在组件库中创建独立的组件。这些任务可以并发执行，互不干扰。\n\
  \n相互依赖的任务不应并行执行。一个常见的例子是全栈功能：先实现后端 API 端点，再由前端消费。如果单独的智能体同时在前端和后端工作，前端智能体可能会尝试消费一个尚不存在的\
  \ API。这通常会导致模拟实现或做出与最终 API 不符的假设，从而引发接口差异。\n\n多智能体工作流中的一项关键技能是识别哪些任务真正独立，哪些是顺序执行的。独立任务可以并行执行，而顺序任务必须按顺序完成。在这种工作流中，工程师的角色从直接实现转变为对\
  \ AI 智能体工作的协调与监督。\n\n## 示例：HookHub 项目中的并行开发\n\n本示例展示了如何利用本章前面创建的 HookHub 规范，让多个\
  \ `Claude Code` 智能体并行工作。该规范定义了应用程序的结构，并为实现提供了共享参考。\n\n该项目基于 `project/hookhub` 分支，从某个特定提交开始，该提交包含之前构建的应用程序状态。此提交代表智能体操作的基线，并定义了要实现的更改范围。\n\
  \n```\n### 确立起始点\n\n此演示始于 `project/hookhub` 分支的以下提交：\n\n<在此处插入提交哈希值>\n\n要复现起始状态：\n\
  \ngit checkout project/hookhub\ngit reset --hard <commit-hash>\nnpm install\nnpm\
  \ run dev\n```\n\n此时，应用程序显示：\n\n*   一个基础的 Hero 区域\n*   以简单布局渲染的 Hook 卡片\n*   无视觉优化\n\
  \n应用程序显示 Hook 卡片，并作为向多个智能体分配并行任务的上下文。\n\n![图 6.5 – 用于识别并行智能体执行的独立任务的 HookHub 界面](img/B37082_6_5.png)\n\
  \n图 6.5 – 用于识别并行智能体执行的独立任务的 HookHub 界面\n\n要有效使用多个智能体，我们首先需要识别真正独立的任务。独立任务可以并行执行，从而加快开发速度。\n\
  \n## 将独立任务分配给智能体\n\n在当前的 HookHub 界面中，页面的两个部分可以分别改进，使它们成为并行工作的良好候选者。识别出两个独立任务：\n\n\
  *   更新 Hook 卡片组件以改进其视觉设计\n*   更新主页的 Hero 区域\n\n![图 6.6 – 两个并行运行的 Claude Code 实例，分别更新\
  \ HookHub 界面的不同部分](img/B37082_6_6.png)\n\n图 6.6 – 两个并行运行的 Claude Code 实例，分别更新 HookHub\
  \ 界面的不同部分\n\n每个任务分配给一个单独的 `Claude Code` 实例。一个智能体被指示修改 Hook 卡片组件文件，而另一个智能体被指示修改 Hero\
  \ 区域。\n\n```\n### 运行多个 Claude Code 实例\n\n打开两个独立的终端窗口。\n\n终端 1 – 更新 Hook 卡片组件\n\n\
  claude\n\n提示词：\n改进 HookCard 组件的视觉设计。\n仅修改：\nsrc/components/HookCard.tsx\n请勿修改其他文件。\n\
  \n终端 2 – 更新 Hero 区域\n\nclaude\n\n提示词：\n\n重新设计 Hero 区域。\n仅修改：\nsrc/components/Hero.tsx\n\
  请勿修改 HookCard.tsx。\n```\n\n现在两个智能体独立并行运行。\n\n这种设置之所以有效，是因为 Hook 卡片组件和 Hero 区域是在单独的文件中实现的。如果两个组件定义在同一个文件中，并发修改将会引入冲突。\n\
  \n将组件分离到单独的文件中可以提高可维护性、可读性和可测试性。这是软件开发中的通用最佳实践，在使用智能体工作流时尤为重要。\n\n## 并发执行任务\n\n\
  两个 `Claude Code` 实例独立运行，并行执行其分配的任务。每个智能体仅修改与其任务相关的文件。由于组件是隔离的，执行过程中不会发生文件冲突。\n\n\
  执行完成后，更新后的 Hook 卡片组件和更新后的 Hero 区域反映了各自分配的更改。\n\n![图 6.7 – 对 Hook 卡片和 Hero 区域进行并发更新后的\
  \ HookHub 界面](img/B37082_6_7.png)\n\n图 6.7 – 对 Hook 卡片和 Hero 区域进行并发更新后的 HookHub\
  \ 界面\n\n## 审查并提交更改\n\n一旦两个智能体完成工作，将审查更改并提交到仓库。该提交记录了因多智能体工作流而对 Hook 卡片组件和 Hero 区域所做的改进。\n\
  \n两个智能体完成工作后，审查更改：\n\n```\ngit status\ngit diff\n```\n\n如果更改看起来正确：\n\n```\ngit add\
  \ .\ngit commit -m \"使用并行 Claude Code 智能体优化 HookCard 和 Hero\"\n```\n\n本示例演示了当任务独立且范围界定得当时，如何利用多个\
  \ `Claude Code` 实例并发工作以加速开发。\n\n本章中的示例有意演示了多智能体执行的最简单形式：多个 `Claude Code` 实例在同一分支上操作，拥有共享文件访问权限，通过修改不同文件来避免冲突。\n\
  \n这种设置有助于理解并行执行的核心思想。然而，在同一分支上运行多个智能体本质上是脆弱的。如果智能体修改重叠的文件或引入不兼容的更改，就会发生冲突。\n\n在专业开发环境中，并行工作的行业标准方法是使用\
  \ Git 分支或 Git 工作树来隔离更改。使用 Git 工作树时，每个智能体在其自己的分支上、在其自己的工作目录中操作，拥有代码库的独立副本。之后以受控方式审查并合并更改。\n\
  \n本章侧重于概念清晰度和最简单的可复现设置。更稳健的并行化策略，包括分支隔离和结构化合并工作流，将在本书后面介绍。\n\n# 概要\n\n在本章中，我们探讨了\
  \ `Claude Code` 如何通过规划模式和多智能体执行来支持智能体开发工作流。我们研究了规划模式如何通过将分析与实现分离来实现规范驱动开发，以及如何利用深度思考来优化规范并将其持久化为项目记忆。我们还演示了多个\
  \ `Claude Code` 智能体如何在共享代码库中并行处理独立任务。\n\n在下一章中，我们将探索 `Claude Code` 子智能体，以及它们如何在复杂开发任务中实现结构化、隔离且并发的工作流。\n\
  \n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)），按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![图片](img/B37082_6_8.png)\n\n![图片](img/B37082_6_9.png)\n\n*注：请准备好发票。直接从 Packt\
  \ 网站购买* *不需要发票。*\n\n\n\n# 使用 Claude Code 子代理\n\n在本章中，我们将探索 Claude Code 子代理，以及它们如何实现结构化、可扩展的工作流。我们首先了解什么是子代理，它们与主\
  \ Claude Code 代理有何不同，以及为什么上下文隔离是其设计的核心。这些基础知识在依赖子代理进行更高级的工程场景之前至关重要。\n\n随后我们将进入实战实现环节。我们将配置自定义子代理，检查提示词和工具访问权限如何影响执行，并详细分析上下文流向。最后，我们将通过无限代理循环模式使用并发子代理来扩展执行规模，演示如何利用并行代理编排来探索多种实现方案并选择最佳结果。\n\
  \n本章将涵盖以下主题：\n\n* Claude Code 子代理简介\n* 配置第一个子代理\n* 测试子代理\n* 使用子代理时维护内容流\n* 使用并发子代理进行扩展\n\
  * 无限提示词\n\n# Claude Code 子代理简介\n\n在本节中，我们将了解 **Claude Code 子代理** 的概念。本节偏向理论且宏观，但在动手实践前理解这些内容非常重要。我们将深入探讨该主题，包括底层实现方面的内容。\n\
  \n我们无需编写数十个单独的提示词，只需执行一条命令（如 `/cook`），即可编排一个专业化 AI 代理团队。每个代理专为执行单一任务而设计，但能将该任务完成得*极其出色*。\n\
  \n根据官方文档（<https://code.claude.com/docs/en/sub-agents>），*子代理是预先配置好的 AI 人设，Claude\
  \ Code 可以将任务委派给它们*。每个子代理都有其特定的用途和专长领域。从实际角度来看，这意味着每个子代理由一个特定的提示词定义。子代理的部分特性如下：\n\
  \n* 每个子代理拥有自己的系统提示词。我们完全控制该提示词，并可指定代理应如何运作、能做什么以及如何去做。这赋予了我们对代理行为的完全灵活性和控制力。\n*\
  \ 子代理在独立于主对话的上下文窗口中运行。这种上下文隔离是一项重要功能，因为它能防止上下文污染。主对话不会将偏见引入子代理的任务中。每个子代理始终专注于其高层目标。这一特性至关重要，将在本章后续内容中进一步讨论。\n\
  * 每个子代理可配置特定的工具集，规定其被允许使用的工具。从安全角度来看，这非常重要，因为它允许我们遵循最小权限原则。我们应仅授予子代理达成目标所需的工具。例如，代码审查代理可能需要读取文件或在线获取信息的工具。然而，因其职责仅限于代码审查，不应赋予其执行\
  \ Shell 命令或写入文件的工具。这种选择性的工具访问是子代理的关键属性。工具访问包含原生 `Claude Code` 工具，以及通过 MCP 服务器暴露的集成。技能（我们将在稍后章节中探讨）位于不同层面，定义的是结构化能力而非直接的工具权限。\n\
  * 子代理可复用。我们只需创建一次，即可在不同项目中使用，并作为各类工作流的一部分与团队共享。触发子代理的方式多种多样。它们可使用 Markdown 文件描述，并遵循\
  \ `Claude Code` 使用的相同层级结构。示例如下：\n\n```\nname: code-reviewer\ndescription: Senior\
  \ code review agent. Automatically analyzes code changes for bugs, security flaws,\
  \ and convention violations. Invoke after any code modification.\ntools: Read, Grep,\
  \ Glob, Bash\nmodel: inherit\n---\nYou are a meticulous code reviewer embedded in\
  \ the he110.me project (Next.js 16, React 19, TypeScript, Firebase, Tailwind v4).\n\
  ## Workflow\n1. **Collect diffs**: Execute `git diff --staged` and `git diff` to\
  \ capture all pending changes. If both are empty, fall back to `git diff HEAD~1`\
  \ for the most recent commit.\n2. **Examine full files**: For each touched file,\
  \ read it entirely — not just the changed lines. Understand the surrounding logic,\
  \ imports, and how the modification integrates with existing code.\n3. **Trace dependencies**:\
  \ Use Grep/Glob to locate every consumer of modified functions, types, or exports.\
  \ Flag any call sites that need updating.\n4. **Validate project rules** (per CLAUDE.md):\n\
  \   - Firestore Timestamps converted via `.toMillis()` before reaching client components\n\
  \   - AI utilities imported exclusively from `lib/ai/langsmith.ts`, never from `ai`\
  \ directly\n   - All profile writes routed through API endpoints, never via client-side\
  \ Firestore SDK\n   - Authenticated requests use `authFetch()`\n   - `VoiceWaves`\
  \ shares the recorder's MediaStream rather than opening its own\n   - Styles follow\
  \ mobile-first approach (bare classes = mobile, progressively enhanced with `sm:`,\
  \ `md:`, `lg:`)\n## Severity Levels\n### Critical — block merge\n- **Security holes**:\
  \ injection vectors, XSS, leaked credentials, absent `verifyAuth()` checks, SSRF,\
  \ open redirects\n- **Data corruption risk**: unguarded write operations, race conditions,\
  \ malformed Firestore batches\n- **Auth gaps**: missing ownership verification (`currentUser.uid\
  \ === profile.uid`), exposed protected endpoints\n- **Downstream breakage**: altered\
  \ signatures or deleted exports without updating all dependents\n### Warnings —\
  \ resolve before shipping\n- API handlers lacking input sanitization\n- Swallowed\
  \ promises or absent try/catch around async work\n- Performance pitfalls: gratuitous\
  \ re-renders, missing memoization on costly computations, repeated Firestore round-trips\n\
  - Inconsistent API response shapes across routes\n- Loose typing (`any`, implicit\
  \ `any`)\n### Suggestions — worth considering\n- Clearer naming for variables or\
  \ functions\n- Logic that could be expressed more simply\n- Existing helpers in\
  \ `lib/` that already solve the same problem\n# Response Format\nGroup findings\
  \ by severity. For every finding include:\n- **Location**: file path and line number\n\
  - **Issue**: single-sentence summary\n- **Impact**: what goes wrong if ignored\n\
  - **Recommended fix**: a concrete code snippet demonstrating the correction\n```\n\
  \n项目级子代理（特定于单个仓库）在 `.claude/agents/` 目录下创建。与项目相关的所有代理均存放于此。\n\n用户级子代理（跨所有项目共享）存储在\
  \ `home` 目录下的 `~/.claude/agents/` 中。\n\n## 子代理文件结构\n\n子代理使用以下结构通过 Markdown 定义：\n\
  \n![图 7.1 – 子代理文件结构](img/B37082_7_1.png)\n\n图 7.1 – 子代理文件结构\n\n每个子代理定义以 YAML 前置元数据块开头。仅\
  \ `name` 和 `description` 为必填字段，但可定义其他配置选项，包括 `tools`、`skills`、`mcp`、`model`、`hooks`、`memory`\
  \ 等。完整架构请参阅官方文档（<https://code.claude.com/docs/en/sub-agents>）。`description` 字段帮助主代理决定何时调用该子代理。\n\
  \n\n\n\n相同的概念也适用于子代理。子代理作为工具供主 Claude Code 代理使用。`name` 和 `description` 字段是必需的，不能省略，因为它们有助于\
  \ Claude Code 决定是否调用特定的子代理。\n\n子代理定义还包括子代理被允许使用的工具。这些工具按名称列在 Markdown 文件中。如果此部分留空，则子代理将被授予访问所有可用工具的权限。工具定义也可以包含\
  \ MCP，这将在后面介绍。\n\n子代理定义的最后一部分是系统提示词。此提示词包含子代理的所有指令。它可以以任何方式格式化，可以包含静态或动态上下文，并提供显著的灵活性。这是一个*系统提示词*，而不是*用户提示词*，这一区别很重要。系统提示词和用户提示词的区别将在本章后面详细讨论。\n\
  \n## 与 React 代理的关系\n\n如果您以前构建过 LLM 应用程序，此结构可能看起来很熟悉。它非常类似于 React 代理模式，其中模型被赋予一组工具，每个工具都有名称和描述，以及定义通用指令并界定代理专业领域的提示词：\n\
  \n```python\nfrom langgraph.prebuilt import create_react_agent\n\nagent = create_react_agent(\n\
  \    model=\"anthropic:claude-4-7-sonnet-latest\",\n    tools=[get_weather],\n \
  \   # A static prompt that never changes\n    prompt=\"Never answer questions about\
  \ the weather.\"\n)\n\nagent.invoke(\n    {\"messages\": [{\"role\": \"user\",\n\
  \        \"content\": \"what is the weather in sf\"}]}\n)\n```\n\nClaude Code 代理、Claude\
  \ Code 子代理和传统 React 代理之间有很强的相似性。然而，存在一个关键区别：Claude Code 的主编码代理及其子代理能够执行长时间运行的任务，并从头到尾实现功能。\n\
  \n理解这一点的一种方式是将 React 代理视为一个更广泛的类别，其中有一个深度代理的子集。Claude Code 的编码代理及其子代理属于这一子集。要被视为深度代理，它们必须满足某些特征，这将在课程后面介绍。\n\
  \n了解这些代理在底层如何工作，可以更好地洞察它们的行为，并能更有效地使用 Claude Code 的子代理。\n\n# 配置第一个子代理\n\n本节将重点介绍配置第一个子代理。创建一个新分支并打开\
  \ Claude，然后使用 `/agents` 命令查看可用代理列表：\n\n![图 7.2 - 使用 /agents 命令查看可用代理](img/B37082_7_2.png)\n\
  \n图 7.2 - 使用 `/agents` 命令查看可用代理\n\n此时，没有项目级代理，也没有安装用户级代理。唯一可用的代理是**通用内置代理**。还没有用户创建的代理。\n\
  \n如前所述，代理可以在两个不同的作用域中创建。在这种情况下，我们选择项目级代理，以便配置可以提交到存储库并作为项目的一部分共享。有两种可用的创建代理的方式。\n\
  \n*   使用 Claude 生成\n\n*   手动配置\n\n我们从第一种方法开始，这是最简单的方法，直接通过 Claude 生成。\n\n### 定义代理描述\n\
  \n点击第一个选项后，我们将首先被要求定义代理描述。此描述指定代理的目标及其操作方式。Claude Code 的主代理使用此描述来决定是否应调用子代理。\n\n\
  ```\nCreate new agent\nStep 3: Describe what this agent should do and when it should\
  \ be used (be comprehensive for best results)\n\nA funny staff senior ultra software\
  \ engineer that will review the code provided to him. Use this agent when you get\
  \ an input like funny review.\n```\n\n在此示例中，我要求定义一个有趣的资深资深超级软件工程师来审查提供给他的代码。当输入包含诸如\
  \ \"funny review\" 之类的短语时，打算使用此代理。这确立了代理的特征及其主要目标，即审查代码。\n\n包含一个**关键词触发器**来控制何时调用代理。当与\
  \ Claude 交互并显式调用代理时，此触发器变得很有用。代理也可以通过斜杠命令调用。\n\n如果提示词感觉太模糊或太宽泛，可以使用单独的 Claude 实例来改进\
  \ Claude Code 子代理提示词，而不是手动优化。需要将原始提示词作为输入提供，并请求使其更清晰，从而生成更详细的系统提示词。然后可以直接复制并使用此改进的系统提示词。代理不是手动作为\
  \ Markdown 文件编写的，因为使用 CLI 在代理目录中创建代理。\n\n#### 应用系统提示词\n\n输入提示词后，将向您显示诸如 \"funny\
  \ review\" 和 \"funny code review\" 之类的激活触发器。这些触发器决定何时调用代理。\n\n![图 7.3 - 配置子代理系统提示词和激活触发器](img/B37082_7_3.png)\n\
  \n图 7.3 - 配置子代理系统提示词和激活触发器\n\n按 `Enter` 键继续配置过程，将生成代理配置。\n\n### 为代理选择工具\n\n下一步是选择代理可以使用的工具：\n\
  \n![图 7.4 - 设置期间子代理的工具列表](img/B37082_7_4.png)\n\n图 7.4 - 设置期间子代理的工具列表\n\n您可以选择所有工具，也可以根据您的自定义选择任何特定工具。\n\
  \n在我们的例子中，由于这是一个代码审查代理，它主要需要只读工具。如果需要，也可以启用编辑工具和执行工具。也可以添加 MCP 工具。\n\n通过启用高级选项，我们可以查看\
  \ Claude Code 中可用的完整工具列表，包括 `bash`、`glob`、`grep`、`ls`、`read` 和 `edit`。之前配置的来自 Context7\
  \ 的 MCP 工具也可用并已附加。完成选择后，隐藏高级选项并继续该过程。\n\n### 选择模型和视觉设置\n\n然后我们选择子代理使用的模型：\n\n![图\
  \ 7.5 - 选择模型并查看子代理配置摘要](img/B37082_7_5.png)\n\n图 7.5 - 选择模型并查看子代理配置摘要\n\n模型选择将在本书后面详细讨论，但在这种情况下，选择了\
  \ Sonnet 以平衡性能、价格和延迟。\n\n您还将被要求选择一种颜色。在此配置中，选择了黄色。\n\n保存前，将显示配置摘要。如果需要，也可以编辑配置。至此，代理创建完成。\n\
  \n### 查看生成的代理配置\n\n我们打开生成的代理文件以查看其内容。该文件包含所有配置的信息。\n\n文件顶部是代理名称，随后是代理描述。此描述有助于 Claude\
  \ Code 的主代理确定何时应调用子代理。接下来列出可用工具。未启用写入工具。选定的模型是 Sonnet，颜色是黄色。\n\n\n\n---\nname: code-comedy-carl\n\
  description: >\n  当你想要一个既有趣又有娱乐性的代码审查，将真实的技术反馈与喜剧元素相结合时，请使用此 Agent。当用户请求搞笑审查、娱乐性审查、吐槽我的代码，或提及\
  \ Carl 或 CodeComedy Carl 时激活。该 Agent 以编程幽默、梗图和机智观察包装深刻的技术审查，同时保持专业性和教育价值。\ntools:\
  \ Glob, Grep, LS, Read, NotebookRead, WebFetch, TodoWrite, WebSearch, mcp__context7__resolve-library-id,\
  \ mcp__context7__get-library-docs\nmodel: sonnet\ncolor: yellow\n---\n\n所有配置值均可根据需要修改。定义完\
  \ Agent 后，它即可投入使用。\n\n# 测试我们的 Subagent\n\n我们首先创建一个计算斐波那契函数的主 Python 文件：\n\n```\n\
  > write a main python file that calculated fibonacci function\n```\n\n准备就绪后，即可使用该斐波那契实现。\n\
  \n![Figure 7.6 – Creating a Fibonacci script before invoking the review subagent](img/B37082_7_6.png)\n\
  \nFigure 7.6 – 创建斐波那契脚本以调用 Review Subagent\n\n## 运行代码审查 Subagent\n\n为演示 Subagent\
  \ 如何被调用及其工作方式，我们在 `@main.py` 上运行一段幽默代码审查：\n\n```\nfunny review @main.py\n```\n\n\
  此操作会显示先前创建的 Review Agent 并生成一个实例。Agent 初始化、读取文件内容并开始处理。\n\n若存在其他文件，可再次打开 Claude，创建同一\
  \ Review Agent 的额外实例。这说明了 Agent 的用处：可创建多个实例，每个实例在隔离环境中运行，互不影响。\n\n通过展开 Agent 视图（Windows/Linux\
  \ 为 <kbd>Ctrl</kbd>+<kbd>R</kbd>，macOS 为 <kbd>Cmd</kbd>+<kbd>R</kbd>），可查看 Agent\
  \ 的所有内部活动。\n\n## 生成多个 Review 实例\n\n现在不止生成一次 Review，而是生成两次：\n\n```\n❯ create 2 funny\
  \ code reviews of @main.py\n```\n\n此时会生成两个 Pull Request Agent 实例。可观察第一个与第二个实例处理任务的过程：\n\
  \n![Figure 7.7 – Spawning multiple review subagent instances for the same file](img/B37082_7_7.png)\n\
  \nFigure 7.7 – 为同一文件生成多个 Review Subagent 实例\n\n需注意：这两个 Review Agent 是**顺序**而非并发运行的。Claude\
  \ Code 并不总假设任务相互独立；若对可能的依赖关系存在不确定性，它会选择串行执行而非并行。\n\n实践中，可通过提示词措辞来影响此行为。若期望并行执行，提示词应明确说明。例如，与其要求“*review\
  \ this PR*”，不如说“*review these files in parallel*”或“*create separate review agents\
  \ for each file*”。让任务独立性显而易见，可增加并发执行的可能性。\n\n尽管本例中 Agent 顺序运行，但 Claude Code 的真正优势在于有意并行执行多个\
  \ Subagent。本章后续将探讨这一点。\n\n**添加** **额外** **Agent**\n\n若需另一个 Agent，可在 `agents` 目录下新建定义文件来创建。\n\
  \n# 使用 Subagent 时的上下文流向\n\n本节将借助下图剖析使用 Subagent 时的上下文流向，并理解 Subagent 为何在此场景下有用。我们从主\
  \ Agent 线程（即主对话）开始。该线程中的每条消息都会增加上下文的 Token 规模。\n\n![Figure 7.8 – Context flow between\
  \ the main agent and a subagent](img/B37082_7_8.png)\n\nFigure 7.8 – 主 Agent 与 Subagent\
  \ 之间的上下文流向\n\n当主 Agent 决定使用 Subagent 时，会创建一个新提示词。该提示词传递给 Subagent，代表 Subagent 执行期间**唯一**接收的上下文。Subagent\
  \ 不知晓之前发生的完整对话，仅能访问主 Agent 生成的提示词。\n\n我们可以优化此提示词，使主 Agent 以更利于任务执行、产出更好结果的方式提示 Subagent。Subagent\
  \ 的执行质量完全取决于此提示词，因为它是唯一提供的上下文。Subagent 独立工作、调用所需工具、可能执行集成，最后返回单一精简响应。每次生成新 Subagent，均从仅含生成提示词的全新上下文开始。\n\
  \n这种方法使主线程保持精简。通过将大量上下文委托给 Subagent，Subagent 在隔离环境中运行，仅将结果制品返回主 Agent。这样主对话可维持较小的上下文窗口。\n\
  \n因主 Agent 上下文越多性能越差，此法减少了使用 `/compact` 或 `/clear` 等命令的必要。保持主上下文精简有助于维持性能与稳定性。\n\
  \n总之，主 Agent 向 Subagent 发送单一输入，Subagent 完成工作并返回单一输出。这在持续推进任务的同时，实现了有效的上下文压缩。\n\n\
  ## 实际中的上下文窗口\n\n为直观演示，我们观察随 Claude Code 对话推进、上下文窗口如何增长。大语言模型有 Token 限制，我们受限于可发送的\
  \ Token 数量。\n\n![Figure 7.9 – Growth of the context window across multiple conversation\
  \ turns](img/B37082_7_9.png)\n\nFigure 7.9 – 多轮对话中上下文窗口的增长\n\n可选 200K、100 万 Token\
  \ 的模型，未来甚至可能达 200 万或 1000 万。无论规模如何，上限均为有限。我们应避免触及上限——超限即请求失败；即便未超限，更大上下文也会增加成本（每\
  \ Token 均有价格）并因延迟升高而拖慢响应。\n\n更重要的是，临近上限时易发生上下文污染。积累过多上下文会导致大量内容与当前任务无关，结果质量下降。这并非最佳工作方式，故我们要尽量保持上下文精简。\n\
  \n在与 Claude Code 交互中，每轮对话、每条消息都消耗 Token 并扩大上下文窗口。例如首轮增加 10K Token，次轮增至 30K，第五轮可能达\
  \ 100K。\n\n使用单个 Claude Code 实例时，最终会达到积累上下文过大、难以有效管理的临界点。此时需用 `/compact` 压缩上下文、用\
  \ `/clear` 完全清空，或另开新实例重头开始。这是在有限上下文窗口内工作的自然结果。\n\n关键在于：上下文有限，单个 Claude Code 实例无法无限期处理所有事务。上下文上限直接制约了我们与\
  \ Claude Code 的交互方式。\n\n\n\n\n\n# 子代理\n\n子代理提供了一种优雅的方式来解决这一限制。每次使用子代理时，它都会在自己的上下文窗口中运行。子代理消耗的\
  \ Token 不计入主 Claude 代理的额度。\n\n![图 7.10 – 通过将工作卸载给子代理来保留主上下文](img/B37082_7_10.png)\n\
  \n图 7.10 – 通过将工作卸载给子代理来保留主上下文\n\n执行结束时，子代理返回单一的浓缩响应。此响应可能包含 15K 或 20K Token，并可能包含摘要或代码变更。关键在于，子代理的完整内部上下文不会累积在主对话中。\n\
  \n这种方法在保持主上下文精简的同时，仍允许完成大量工作。每个子代理作为一个独立的侧链运行，拥有自己的系统提示词，专门针对特定任务量身定制。得益于这种专业化，子代理通常比主代理单独工作时能更有效地解决其任务。\n\
  \n这种上下文与责任的分离是子代理的核心理念。这是一个简单的概念，但也非常强大。\n\n到目前为止，我们一直关注子代理如何隔离上下文并向主代理返回浓缩结果。下一步是了解如何更有意识地塑造子代理的行为。\n\
  \n## 示例：创建 Mermaid 图表子代理\n\n我们将仔细研究子代理的系统提示词和配置，并了解修改它们如何影响执行流程和输出。我们将通过一个示例来实现这一点。\n\
  \n### 创建子代理配置\n\n在 `Claude Code` 中开始一个新会话。首先，调整输出样式并查看可用代理。该代理的目的是根据文本输入生成 Mermaid\
  \ 图表。因此，需要创建一个新代理。使用 `/agents` 命令，选择项目级代理，并直接使用 `Claude` 生成它。\n\n```\n创建新代理\n 描述该代理应做什么以及何时使用（为了获得最佳效果，请全面描述）\n\
  帮我编写一个 mermaid 图表代理，它将接收我的输入并根据输入创建一个 mermaid 图表\n```\n\n**Mermaid** 是一个基于 JavaScript\
  \ 的绘图和制图工具，允许我们使用简单、可读的语法定义图表（[`mermaid.live/`](https://mermaid.live/)）。这些图表可以在\
  \ GitHub 等平台以及其他文档系统上受控且清晰地渲染。支持多种图表类型，且语法刻意设计得轻量级。\n\n`Claude Code` 生成新子代理的元数据。在此阶段，目标不是构建最完美的代理。相反，我们专注于观察\
  \ `Claude Code` 主代理与我们创建的子代理之间的交互。这包括理解它们如何通信、传递了什么输入以及返回了什么输出。最初的提示词故意保持基础，稍后将进行优化。\n\
  \n### 工具选择与上下文考量\n\n生成子代理后，我们选择它可以使用的工具：\n\n![图 7.11 – 为 Mermaid 图表子代理选择工具](img/B37082_7_11.png)\n\
  \n图 7.11 – 为 Mermaid 图表子代理选择工具\n\n已启用**只读工具**、**编辑工具**和**执行工具**。此时，我们为此子代理选择的工具超出了其所需范围。\n\
  \nMermaid 图表生成器的唯一职责是根据文本输入生成 Mermaid 语法。它不需要 `bash` 等执行工具，也不需要写入权限来修改文件。授予这些额外能力是不必要的。\n\
  \n这是工具污染的一个例子，即子代理被配备了其特定任务不需要的工具。每个工具定义都会增加子代理上下文窗口的 Token 消耗。因此，过度配置工具会增加上下文大小并引入可避免的开销。此外，通过赋予代理超出其预期范围的能力，还可能造成不必要的安全风险。\n\
  \n实践中，子代理应仅被授予*它们实际需要的最小工具集*。这遵循*最小权限原则*，即组件仅获得执行其任务所需的足够权限，别无其他。应避免过度配置工具，以降低上下文开销并限制不必要的能力。\n\
  \n完成工具选择后，我们可以选择 `Sonnet` 模型并分配颜色。子代理配置最终确定并保存，生成一个名为 `mermaid‑diagram‑generator.md`\
  \ 的新文件。\n\n![图 7.12 – 最终确定并保存 Mermaid 图表子代理配置](img/B37082_7_12.png)\n\n图 7.12 –\
  \ 最终确定并保存 Mermaid 图表子代理配置\n\n### 理解子代理配置\n\n现在我们检查生成的文件，其中包含完整的子代理定义。该子代理的名称为 `mermaid‑diagram‑generator`。您还会注意到，描述被追加到了\
  \ `Claude Code` 主代理的系统提示词中。\n\n```\n---\nname: mermaid-diagram-generator\ndescription:\
  \ 当您需要将文本描述、需求、流程或概念转换为可视化的 Mermaid 图表时，请使用此代理。示例包括：<example>背景：用户想要可视化软件架构流程。 user:\
  \ '我有一个 Web 应用，带有 React 前端，调用 Node.js API，后者查询 PostgreSQL 数据库并将结果缓存在 Redis 中' assistant:\
  \ '我将使用 mermaid-diagram-generator 代理为此架构创建可视化图表' <commentary>由于用户正在描述系统架构，请使用 mermaid-diagram-generator\
  \ 代理创建合适的 Mermaid 图表。</commentary></example> <example>背景：用户需要记录业务流程。 user: '你能帮我创建一个客户入职流程的流程图吗？它从注册开始，然后是邮箱验证、资料设置，最后是账户激活'\
  \ assistant: '我将使用 mermaid-diagram-generator 代理为您的入职流程创建一个流程图' <commentary>用户正在描述一个顺序流程，因此请使用\
  \ mermaid-diagram-generator 代理创建流程图。</commentary></example> 主代理应始终将概念简化为核心要点。同时向子代理编写一些\
  \ ASCII 图来表示该概念。\ntools: Glob, Grep, Read, WebFetch, TodoWrite, WebSearch, BashOutput,\
  \ KillBash, Edit, MultiEdit, Write, NotebookEdit, Bash\nmodel: sonnet\ncolor: cyan\n\
  ---\n```\n\n此描述决定了哪些子代理可供主代理使用，并强烈影响特定子代理的调用时机。通过此字段，我们可以指导主代理如何委派任务。\n\n描述以代理功能的高层总结开头，随后列出应触发该代理的用户输入示例。在本例中，该代理旨在将文本描述、需求、流程和概念转换为可视化的\
  \ Mermaid 图表。总结和示例均有助于主代理决定何时将工作委派给此子代理。\n\n除了决定何时调用子代理外，描述还指示主代理如何提示子代理。由于子代理在隔离的上下文中运行，它们接收到的唯一信息就是主代理生成的提示词。通过精心设计此描述，我们可以控制该提示词的结构、格式和内容。这种影响子代理提示方式的能力，是\
  \ `Claude Code` 最强大的特性之一。\n\n在 YAML 前置元数据下方，我们定义了子代理的内部逻辑。此部分代表子代理的系统提示词，包含针对特定任务量身定制的指令。这些指令可以分步骤构建，也可以定义子代理如何格式化其响应。\n\
  \n\n\n\n当子代理完成执行后，其内部上下文会被清除，并向主代理返回单一响应。该响应是唯一保留的产物。我们可以塑造该响应的内容和格式，以便主代理能更有效地处理它。\n\
  \n## 调用子代理\n\n配置就绪后，让我们通过请求检索增强生成流程的 Mermaid 图表来调用子代理。主代理将把此请求委托给 Mermaid 图表子代理，并生成以下内容：\n\
  \n![图 7.13 - 调用 Mermaid 子代理](img/B37082_7_13.png)\n\n图 7.13 - 调用 Mermaid 子代理\n\n\
  检查此次调用可让我们看到传递给子代理的确切提示词。该提示词请求生成一个全面的 Mermaid 图表，以说明典型的检索增强生成流程，包括向量数据库、嵌入模型、文档分块、检索、查询处理和\
  \ LLM 生成器等组件。它还指定了使用带有清晰标签和逻辑流向的适当 Mermaid 图表类型。\n\n调用后，子代理在其独立的隔离上下文中执行。完成后，Claude\
  \ Code 会自动将子代理的最终响应转发回主代理。此响应通常包含 Mermaid 图表语法及图表解释。\n\n## 评估结果\n\n我们复制子代理生成的 Mermaid\
  \ 语法，并使用支持 Mermaid 输入的绘图工具进行渲染。本例中，我使用了 *Excalidraw* ([`excalidraw.com`](https://excalidraw.com))，它是免费使用的。在该工具中，我只是粘贴了\
  \ Mermaid 语法并按下了 *Enter* 键。\n\n![图 7.14 - 在 Excalidraw 中渲染生成的 Mermaid 图表](img/B37082_7_14.png)\n\
  \n图 7.14 - 在 Excalidraw 中渲染生成的 Mermaid 图表\n\n如你所见，图表生成成功，并可视化了检索增强生成架构。\n\n然而，有时结果可能不尽如人意。生成的图表可能一眼难懂、缺乏清晰组织，甚至让人感到不知所措。即使我们熟悉检索增强生成，也不一定能立即看清各组件如何交互。\n\
  \n这一结果清楚地表明，子代理配置需要改进。接下来，我们将专注于调整子代理定义，通过自定义描述子代理的 Markdown 来生成更清晰、结构更合理的结果。\n\n\
  ## 优化子代理描述\n\n我们首先返回子代理配置，在描述中添加额外指令。由于目的是简化图表细节，我在描述中添加了以下内容：\n\n```\n主代理应始终将概念简化到核心要点（GIST）。同时向子代理编写一些代表该概念的\
  \ ASCII 绘图。\n```\n\n该指令指定主代理应始终将概念简化至其核心要点。此处的意图是影响主代理构建将传递给子代理的提示词的方式。\n\n还添加了一句请求概念的可视化表示并明确降低代码优先级的指令。此阶段的重点完全在于塑造主代理为子代理生成的提示词。通过修改\
  \ `description` 字段，我们可以操控主代理提示子代理的方式。\n\n我们还可以指示主代理执行如进行 API 调用等操作。这种能力引入了重要的安全考量。\n\
  \n由于描述会被追加到 Claude Code 主代理的系统提示词中，来自不可信来源的子代理定义可能包含恶意指令。具有有害描述的克隆子代理可能在本地机器上执行意外或危险的操作。这是描述级控制如此强大的一个重要隐含意义。\n\
  \n## 观察更新后的提示词流程\n\n为查看更新是否生效，保存文件，重新打开 Claude Code，并编写类似请求以创建检索增强生成流程的 Mermaid\
  \ 图表。\n\n![图 7.15 - 显示传递给子代理的要点级指令的更新后提示词流程](img/B37082_7_15.png)\n\n图 7.15 - 显示传递给子代理的要点级指令的更新后提示词流程\n\
  \n查看发送给子代理的提示词，我们可以看到其中包含了要点级简化。这证实主代理已成功受到更新后描述的影响。请求现在包含简化的概念表示，这是注入子代理的唯一上下文。\n\
  \n此提示词是子代理接收到的完整且完整的上下文。预期这种改进将提升子代理输出的性能和质量。\n\n## 评估子代理输出\n\n执行完成后，可检查生成的流程图。与之前的图表相比，结构应更有条理。索引和检索组件应更易识别，整体流程应一目了然：\n\
  \n![图 7.16 - 更新后的子代理生成的优化 RAG 流程图](img/B37082_7_16.png)\n\n图 7.16 - 更新后的子代理生成的优化\
  \ RAG 流程图\n\n新图表更简单，步骤更少，因此更易于理解。\n\n返回给主代理的最终响应不会直接包含 Mermaid 代码。代码仅在展开并手动复制子代理输出时可见。取而代之的是，它包含执行工作的摘要：\n\
  \n![图 7.17 - 子代理返回摘要而非原始 Mermaid 代码](img/B37082_7_17.png)\n\n图 7.17 - 子代理返回摘要而非原始\
  \ Mermaid 代码\n\n这显示了当前子代理配置的一个局限性。子代理返回的是摘要而非实际图表代码，意味着它未完全达到预期目标。子代理清除其内部上下文并仅返回单一响应，而在本例中，该响应不包含期望的产物。这种行为需要解决，将在“优化子代理输出”部分处理。\n\
  \n到目前为止，重点一直在于操控主代理发送给子代理的提示词。虽然这改进了结果，但单靠此法还不够。\n\n下一步是超越提示词塑造，开始操控子代理本身的内部逻辑和执行流程。通过这样做，我们能更精细地控制子代理执行任务的方式，进一步提高其输出质量。\n\
  \n## 优化子代理输出\n\n我们现在需要更新子代理配置，明确要求子代理仅返回实际图表，不包含任何额外废话。这成为代理的第七个也是最后一步。此处目标是影响子代理向主代理返回输出时的响应格式：\n\
  \n![图 7.18 - 更新子代理以仅返回 Mermaid 图表而无任何额外文本](img/B37082_7_18.png)\n\n图 7.18 - 更新子代理以仅返回\
  \ Mermaid 图表而无任何额外文本\n\n我还添加了第零步，指示子代理检查在线资源，看是否已存在可作灵感的预制图表。\n\n![图 7.19 - 添加第零步以在生成前检查现有图表](img/B37082_7_19.png)\n\
  \n图 7.19 - 添加第零步以在生成前检查现有图表\n\n该指令笼统提及图表而非特指 Mermaid 图表。这行得通是因为子代理拥有网络搜索工具。\n\n\n\
  \n如果你希望保持输出简洁，则需要在描述中明确提及这一点，随后提醒保持解决方案最小化。\n\n![Figure 7.20 – Updating the subagent\
  \ system prompt to enforce simple, minimal output](img/B37082_7_20.png)\n\nFigure\
  \ 7.20 – Updating the subagent system prompt to enforce simple, minimal output\n\
  \n这部分 Markdown 定义了子代理的内部逻辑，仅适用于子代理本身，不影响主代理。\n\n添加这些更改后，保存配置。\n\n### 观察更新后的执行流程\n\
  \n再次发出相同的提示以生成 Mermaid 图表。任务按预期委托给 Mermaid 图表子代理。\n\n通过检查调用详情，我们可以看到主代理传递给子代理的完整提示。该提示代表了子代理执行期间可用的全部上下文。\n\
  \n![Figure 7.21 – Inspecting the full prompt passed from the main agent to the subagent](img/B37082_7_21.png)\n\
  \nFigure 7.21 – Inspecting the full prompt passed from the main agent to the subagent\n\
  \n搜索将花费显著的时间，但最终应确认我们已成功影响了子代理的执行流程。子代理执行的第一个动作是按指令进行的网络搜索。\n\n执行完成后，子代理再次返回汇总响应，而非原始图表代码。这是代理框架呈现子代理响应的当前限制。完整的\
  \ Mermaid 语法在内部生成，但不会直接显示在主线程中。要检查图表，必须手动展开并复制子代理输出。然后将 Mermaid 语法粘贴到绘图工具中进行渲染。\n\
  \n![Figure 7.22 – Mermaid parsing error displayed in Excalidraw during diagram rendering](img/B37082_7_22.png)\n\
  \nFigure 7.22 – Mermaid parsing error displayed in Excalidraw during diagram rendering\n\
  \n渲染期间，出现与流程框周围样式相关的解析错误。要继续，请移除该样式。之后，图表将成功渲染。\n\n![Figure 7.23 – Correctly rendered\
  \ RAG architecture diagram after fixing Mermaid styling issues](img/B37082_7_23.png)\n\
  \nFigure 7.23 – Correctly rendered RAG architecture diagram after fixing Mermaid\
  \ styling issues\n\n渲染后的图表比之前的版本组织得更好。可以看到两条截然不同的流程：一条代表检索路径，另一条代表索引路径。\n\n在检索侧，流程展示了用户查询被嵌入，随后对向量存储进行相似性搜索，检索前\
  \ K 个文档，并进行提示增强。检索到的上下文被追加到提示中，然后发送给语言模型。在索引侧，流程展示了文档被加载、预处理、分块、嵌入并存储在向量数据库中。\n\n\
  总体而言，结果明显更好。图表更简单、结构更清晰、一目了然。\n\n配置更新就绪后，将更改提交到仓库。该提交包括编辑后的子代理定义和修改的文件。\n\n推送提交后，更新后的配置可在仓库的\
  \ `subagents` 分支下获取。\n\n至此，我们已经考察了子代理的核心机制：如何创建、主代理与子代理之间上下文如何流动，以及如何通过配置和系统提示塑造其行为。我们还探讨了修改影响主代理的描述或子代理的内部指令如何直接影响执行和输出。\n\
  \n所有先前的示例均聚焦于单个子代理。然而，这种方法的真正优势在生成并并行运行多个子代理时变得清晰。通过并发执行任务，我们可以一次探索多种实现，并更有效地扩展工程工作流。在下一节中，我们将从单代理委托转向协调并行执行。\n\
  \n# 通过并发子代理进行扩展\n\n本节的实现基于 Infinite Agentic Loop 仓库（[`github.com/disler/infinite-agentic-loop`](https://github.com/disler/infinite-agentic-loop)），作者为\
  \ *IndieDevDan*。如果你对代理式编码模式和多代理工作流感兴趣，他的作品值得探索。他定期分享关于代理式开发的实用见解，更多作品可在 [agenticengineer.com](https://agenticengineer.com)\
  \ 找到。\n\n本节中，我们将探索生成多个并发工作的子代理来实现一项功能。每个子代理产出自己的实现，随后我们评估不同输出并选择最强版本。这种方法代表了一种软件工程模型：并行生成多种实现，评估后再集成。\n\
  \n这种方法在令牌使用方面可能变得昂贵。当生成多个子代理时，每个独立运行，并根据其自身的上下文和执行步骤消耗令牌。由于每个代理都会生成代码、评估代码，并可能执行额外推理，总体令牌使用量可能显著增加。\n\
  \n我在此刻意不提供成本估算。定价频繁变动，且令牌消耗因代码库大小、代理数量和任务复杂度而异。使用此模式时，请仔细监控使用情况。\n\n本节演示的实现基于仓库\
  \ **Infinite Agentic Loop**（[`github.com/disler/infinite-agentic-loop`](https://github.com/disler/infinite-agentic-loop)），由\
  \ *IndieDevDan* 创建。我们将其作为本示例中运行并发子代理的基础。*IndieDevDan* 是一位专注于代理式编码内容的 YouTuber，该仓库作为本节运行并发子代理的基础。该仓库和相关视频讨论随本章一并引用。\n\
  \n## 环境设置\n\n我们将继续在 Project Hookhub 项目中工作。该仓库已在本地克隆，我们进入工作目录。\n\n```\ngit clone\
  \ https://github.com/PacktPublishing/Agentic-Coding-with-Claude-Code\n```\n\n随后我们进入\
  \ Claude Code 速成课程目录并切换到 `project/hookhub` 分支。从提交列表中，我们选择标题如下的提交：\n\n```\nMerge\
  \ pull request #1 from emarco177/claude/add-anthropic-footer-01NXAnJSjYR7cx3t5Ag9HzAE\n\
  ```\n\n这是本节使用的提交。我们复制提交哈希并将其检出：\n\n```\ngit checkout -b project/hookhub<commit-hash>\n\
  ```\n\n我们应获得以下输出：\n\n![Figure 7.24 – HookHub project opened on the correct branch\
  \ in Cursor](img/B37082_7_24.png)\n\nFigure 7.24 – HookHub project opened on the\
  \ correct branch in Cursor\n\n我们可以确认处于正确分支，并导航进入 `hookhub` 目录。现有的 Next.js 项目随之打开。\n\
  \n## 安装依赖\n\n打开 Next.js 项目后，我们安装依赖：\n\n```\nnpm install\n```\n\n安装期间，若检测到任何漏洞，可通过运行以下命令修复：\n\
  \n```\nnpm audit fix --force\n```\n\n所有关键漏洞修补完成后，即可启动开发服务器：\n\n```\nnpm run dev\n\
  ```\n\n至此，使用 Anthropic 主题的 HookHub 应用成功运行。环境现已就绪：\n\n![Figure 7.25 – HookHub application\
  \ running successfully with the Anthropic theme](img/B37082_7_25.png)\n\nFigure\
  \ 7.25 – HookHub application running successfully with the Anthropic theme\n\n此时设置完成，我们可以继续编排多个代理并行工作。\n\
  \n\n\n## 无限斜杠命令\n\n现在，我们将重点放在智能体解码上。在 Infinite Agentic Loop（无限智能体循环）代码库中，有一个名为 `infinite`\
  \ 的斜杠命令。\n\n该命令接受三个输入：\n\n*   一个 `spec` 文件\n*   一个输出目录\n*   一个数字\n\n它读取描述我们要实现功能的\
  \ `spec` 文件。随后，它生成指定数量的智能体。这些智能体并发并行工作。每个智能体生成自己的产物，并将产物存储在输出目录中。\n\n该命令可以作为精简版运行，用于小批量智能体。其架构也支持扩展到更大数量的智能体，甚至接近无限循环的并发执行。\n\
  \n在本节中，我们从精简版开始。\n\n在本例中，我们要求子智能体实现 `Hero` 组件的不同变体。\n\n## 重组 Hero 组件\n\n我们首先创建一个名为\
  \ `specs` 的新目录。该目录用于保存所有的 `spec` 文件。\n\n此时，应用程序有一个包含页脚和 Hook 卡片的 `components` 目录，但没有专门的\
  \ `Hero` 组件。`Hero` 的实现目前位于 `page.ts` 中。在创建 spec 之前，我们将 `Hero` 的实现从 `page.ts` 提取到\
  \ `components` 目录中，以清理并重组代码库。我使用的提示词如下：\n\n```\nHi, can you please take the implementation\
  \ from page.ts? There is a hero implementation there.\nI want to create a new component\
  \ from it under the components directory, just to organize the code a little bit.\n\
  ```\n\n`Hero` 的实现从 `page.ts` 中提取出来，并在 `components` 目录下创建了一个新的 `hero.tsx` 文件。`page.tsx`\
  \ 内部的导入语句也被更新以引用这个新组件：\n\n![图 7.26 - 将 Hero 部分提取到单独的 hero.tsx 组件中](img/B37082_7_26.png)\n\
  \n图 7.26 - 将 Hero 部分提取到单独的 hero.tsx 组件中\n\n接着，在以下提示词的帮助下，我们将 `hero.tsx` 移动到 `components`\
  \ 下的专用 `hero` 目录中：\n\n```\nCan you please also move the hero.tsx file into a hero\
  \ directory under components?\n```\n\n在此操作过程中，请务必显式标记文件，以确保修改的是正确文件。\n\n移动完成后，原始的\
  \ `Hero` 实现从 `page.ts` 中移除。项目结构现在体现了一个位于自己目录中的专用 `Hero` 组件。\n\n我们现在创建了一个 `heros`\
  \ 目录。该目录的目的是存储多个子智能体生成的输出产物。此时，项目结构整洁，已准备好进行规范编写。\n\n### 从 Hero 文件生成 spec 文件\n\n\
  接下来，基于 `hero.tsx` 请求生成一个 `spec` 文件，使用以下提示词：\n\n```\n> Can you please review the\
  \ hero.tsx file and create from it a spec file describing what this component should\
  \ do, what its goals are, and specific guidelines, because I'm going to implement\
  \ different variations of this component. @../src/components/heros/Hero.ts\n```\n\
  \n该提示词包含以下内容：\n\n*   对 `hero.tsx` 的审查\n*   一份描述组件用途、目标和指南的规范\n*   将生成的 `spec` 文件放置在\
  \ `specs` 目录中（显式标记）\n\nClaude 将审查 `Hero` 的实现并生成规范文件。\n\n![图 7.27 - 生成的包含 Hero 组件规范的\
  \ hero.spec.md 文件](img/B37082_7_27.png)\n\n图 7.27 - 生成的包含 Hero 组件规范的 hero.spec.md\
  \ 文件\n\n创建了一个包含 `Hero` 组件完整规范的新文件。`Hero` 组件作为 HookHub 的主要着陆区域，旨在立即传达产品的价值主张、目标及其背景层。\n\
  \n在本地创建一个 `.claude` 目录。因为这是一个新分支，且 Claude 尚未在此代码库副本中初始化，所以该目录不存在。\n\n在此目录内，添加一个\
  \ `commands` 文件夹。从 Infinite Agentic Loop 代码库中，将 `infinite.md` 斜杠命令复制到此文件夹中。\n\n\
  该命令负责编排多个子智能体的并发执行。\n\n在此阶段，我们不分析其内部实现。重点转移到实际使用上。\n\n### 运行无限斜杠命令\n\n退出 Claude\
  \ 并重新启动，以便加载新的斜杠命令。Claude 初始化后，`/infinite` 命令即可用。\n\n根据代码库说明，该命令需要三个输入：\n\n*   一个\
  \ `spec` 文件：在本例中为 `hero.spec`\n*   一个输出目录：在本例中为 `heros`\n*   数量：在本例中，我们将使用六个智能体\n\
  \n按如下方式执行命令并提供这些输入：\n\n```\n>/infinite @../specs/hero.spec.md @../src/components/heros/\n\
  ```\n\n主智能体首先读取 `spec` 文件。成功读取后，主智能体即拥有了待实现内容的完整上下文。Claude Code 将启动六个并行子智能体来生成独特的\
  \ `Hero` 变体。我们将看到类似以下的任务：\n\n![图 7.28 - 并行子智能体任务生成多个 Hero 组件变体](img/B37082_7_28.png)\n\
  \n图 7.28 - 并行子智能体任务生成多个 Hero 组件变体\n\n待办事项列表更新，子智能体开始并发运行。\n\n同样，这属于成本较高的操作。每个智能体独立运行，生成自己的代码，并可能自行测试。如果使用\
  \ Anthropic API 密钥而非 Max 模式，应监控 Token 使用量，因为此工作流会消耗大量 Token。\n\n每个子智能体在本地机器上运行。如果将智能体数量增加到大得多的规模（例如\
  \ 100 个），解决方案需要跨机器扩展。这可以通过 Claude 的云服务实现。随着智能体开始完成任务，它们开始将输出文件写入 `heros` 目录。\n\n\
  如果因本地环境问题导致文件创建遇到阻碍，Claude Code 会尝试恢复。\n\n一旦允许文件创建，多个 hero 文件就会出现在 `heros` 目录中。最终，所有六个版本均创建完毕。\n\
  \n![图 7.29 - heros 目录中创建的多个生成的 Hero 组件文件](img/B37082_7_29.png)\n\n图 7.29 - heros\
  \ 目录中创建的多个生成的 Hero 组件文件\n\n此时，我们有了六个不同的 `Hero` 实现。\n\n现在所有版本都已存在，我们发出一个新提示词：\n\n\
  ```\nTake all the hero implementations and show them on the main landing page one\
  \ after another so we can compare them and choose the best one.\n```\n\n这是一个独立于斜杠命令的新提示词。务必记住，每个子智能体都在其自身隔离的上下文中运行。它们彼此不知情，且都从干净的初始状态开始。这有助于高效管理上下文。\n\
  \n主页面被更新以导入每个 `Hero` 变体并按顺序渲染。\n\n`page.tsx` 中预期的变更如下。\n\n*   从 heros 目录导入所有 Hero\n\
  *   在页面布局中按顺序渲染它们\n\n审查差异可确认以下内容：\n\n*   添加了新的导入语句\n*   每个 Hero 按顺序渲染\n\n应用程序现在显示以下\
  \ `Hero` 变体：\n\n*   Minimal（极简风格）\n*   Centered（居中风格）\n*   Waveform（波形风格）\n*   Particles（粒子风格）\n\
  *   Terminal（终端风格）\n*   Gradient mesh（渐变网格风格）\n\n每个版本在着陆页上均可见。\n\n在此阶段，我们将使用终端风格的\
  \ Hero 作为首选实现。\n\n### 细化前清理上下文\n\n继续之前，我们检查上下文窗口。由于之前的操作，它可能已严重膨胀。\n\n我们清理上下文，然后发出一个新提示词：\n\
  \n\n\n仅保留 `page.tsx` 中的终端 Hero 组件。从主着陆页移除所有其他 Hero 组件。保持 `heroes` 目录下的所有 Hero 文件不变。`page.tsx`\
  \ 文件和 `heroes` 目录已显式标记。\n\n由于上下文现已清理，执行速度将更快。\n\n主页已更新为仅渲染终端 Hero 组件。其他 `Hero` 组件保留在\
  \ `heroes` 目录中。页面现已简化。\n\n我们现在通过运行以下命令提交更改：\n\n```\ngit add\ngit status\n```\n\n\
  然后我们请求一条提交信息，描述以下内容：\n\n*   主页上的 `Hero` 组件变更\n*   新增用于运行多个子代理的斜杠命令\n\n我们使用的提示词如下：\n\
  \n```\nHi, can you please create a commit message about changing the hero in the\
  \ main page? And please add that we also added a slash command for running multiple\
  \ subagents.\n```\n\nClaude 检查差异并生成提交信息。提交被创建并推送。\n\n刷新仓库后，提交将出现，其信息类似如下：**Add hero\
  \ component system and infinite agent slash command**。\n\n## 目前为止我们做了什么\n\n我们使用了\
  \ `/infinite` 斜杠命令并行生成子代理。每个子代理独立实现一个变体。一旦生成所有变体，我们将它们并排渲染，进行视觉评估，并选择最佳实现。\n\n这种方法让我们能够通过算力进行扩展。我们愿意花费的\
  \ Token 数量决定了我们能负担多少并行探索。\n\n我们尚未深入探究其底层原理。这将在下一节解决。\n\n*IndieDevDan* 的 Infinite\
  \ Agentic Loop 仓库和配套的 YouTube 视频深入剖析了斜杠命令本身的实现。\n\n# Infinite prompt (无限提示词)\n\n\
  在本节中，我们将回顾 `infinite.md` 文件以及生成所有那些子代理的提示词。这是一个 **高阶提示词**。它接收一个提示词作为输入，并动态生成提示词。\n\
  \n这可以被视为 **元提示词**，类似于函数式编程中的高阶函数，后者接收函数作为参数并可返回函数作为返回值。这里我们对提示词做同样的事情。我们在 Infinite\
  \ Agentic Loop 命令中看到了这一机制的实际运作。\n\n提示词开始如下：\n\n```\nThink deeply about this infinite\
  \ generation task. You are about to embark on a sophisticated iterative creation\
  \ process.\n```\n\n`Think deeply` 指令旨在激活模型的深度推理能力。这是发送给我们主代理（主 Claude Code 代理）的提示词。\n\
  \n在 `Variables`（变量）部分，提示词定义了如下行：\n\n```\nspec_file: $ARGUMENTS output_dir: $ARGUMENTS\
  \ count: $ARGUMENTS\n```\n\n该行声明了三个变量：`spec_file`、`output_dir` 和 `count`。每个变量暂时被赋值为\
  \ `$ARGUMENTS` 占位符。\n\n当调用 `/infinite` 斜杠命令时，整个参数字符串作为 `$ARGUMENTS` 传入提示词。运行斜杠命令时提供的值被放置在同一行，导致重复值多次出现。这些重复值就是提供给斜杠命令的相同输入。\n\
  \n提示词包含负责解析的部分。当调用斜杠命令时，包含其参数的整个提示词被发送给 Claude Code 的主代理。提示词包含主代理如何解析输入的指令。\n\n\
  解析定义如下：\n\n*   `spec_file`：Markdown 规范文件的路径\n*   `output_dir`：迭代结果保存的目录\n*   `count`：迭代次数，`1`\
  \ 到 `N` 或 \"infinite\"\n\n所有解析均由主代理完成。没有负责解析的代码。每次调用命令时，解析都由 LLM 动态完成。\n\n变量定义并解析后，执行进入几个阶段。\n\
  \n## 阶段 1：规范分析\n\n阶段 1 是规范分析。主代理被指示阅读并深度理解位于 `spec_file` 的规范文件。这里使用了解析后的 `spec`\
  \ 文件路径。\n\n`spec` 文件定义以下内容：\n\n*   生成何种类型的内容\n*   格式和结构要求\n*   任何特定参数或约束\n*   迭代间预期的演进模式\n\
  \n提示词指示主代理仔细思考规范意图，以及每次迭代应如何在前序工作基础上构建。\n\n在先前示例中，没有迭代或前序工作的演进，因为这未写入 `spec` 文件。如果我们想这样做，提示词支持该功能。\n\
  \n这是给主代理的第一条指令：读取 `spec` 文件并理解我们要做什么。\n\n## 阶段 2：输出目录侦察\n\n阶段 2 是输出目录侦察。主代理被指示彻底分析\
  \ `output_dir` 以了解当前状态。\n\n此阶段包含：\n\n*   列出所有现有文件及其命名模式\n*   识别当前存在的最高迭代编号\n*  \
  \ 分析现有迭代间的内容演进\n*   理解前序生成的轨迹\n*   确定新迭代存在的空白或机会\n\n在先前示例中，没有迭代编号。我们使用了想要采用的风格名称。\n\
  \n此阶段指示主代理检查已完成的工作。\n\n## 阶段 3：迭代策略\n\n阶段 3 是迭代策略。基于规范分析和现有迭代，主代理被指示执行以下操作：\n\n\
  *   确定起始迭代编号或要创建的文件名\n*   规划每次迭代如何保持独特性和演进性\n*   考虑如何在保持新颖性的同时基于前序迭代构建\n*   如果 `count`\
  \ 为无限，准备持续生成直到达到上下文限制\n\n此阶段仍处于规划中。\n\n## 阶段 4：并行代理协调\n\n阶段 4 进入子代理的并行执行。主代理被指示部署多个子代理并行生成迭代，以实现最大效率和创意多样性。\n\
  \n分发策略定义如下：\n\n*   计数 1–5 时，同时启动所有代理\n*   计数 6–20 时，分批启动，每批 5 个代理以管理协调\n*   计数为\
  \ \"infinite\" 时，以 3 到 5 个代理为一波启动，监控上下文并生成新波次\n\n### 代理分配协议\n\n主代理使用 Claude Code\
  \ 的 task tool 生成子代理。提示词描述了主代理应如何创建传入这些子代理的提示词。\n\n每个子代理的输入是一个提示词。子代理在上下文隔离中运行，并向主代理输出一条消息。\n\
  \n每个子代理接收以下内容：\n\n*   **规范上下文**：完整的规范文件分析\n*   **目录快照**：启动时 `output_dir` 的当前状态\n\
  *   **迭代分配**：具体的迭代编号、起始编号及代理索引\n*   **唯一性指令**：避免复制现有迭代概念的显式指令\n*   **质量标准**：来自规范的详细要求\n\
  \n由于我们提供目录快照作为输入，子代理将知晓至今发生的事情。这有助于避免重复想法和重复实现。\n\n在先前示例中，我们没有迭代编号，因此迭代分配映射到我们使用的文件名。\n\
  \n### 子代理任务结构\n\n提示词包含传递给每个子代理的任务结构。\n\n任务框架如下：\n\n*   `generate iteration [NUMBER]\
  \ for [SPEC_FILE] in [OUTPUT_DIR]`\n*   `you are subagent [X] generating iteration\
  \ [NUMBER]`\n\n\n\n每个子代理提示词都包含如下上下文：\n\n*   规范（完整规范分析）\n*   现有迭代（当前 `output_dir`\
  \ 内容的摘要）\n*   您的迭代编号\n*   分配的创意方向\n*   需求\n\n提示词包含如下指令：\n\n*   `read and understand\
  \ the specification completely`（完整阅读并理解规范）\n*   `analyze existing iterations to\
  \ ensure the output is unique`（分析现有迭代以确保输出唯一）\n\n子代理提示词中还包含其他指令。\n\n### 并行执行管理\n\
  \n随后提示词回到主代理的执行管理指令。\n\n主代理被指示执行以下操作：\n\n*   使用任务工具同时启动所有分配的子代理\n*   监控代理进度和完成情况\n\
  *   通过重新分配迭代编号来处理代理失败\n*   确保不生成重复的迭代编号\n*   收集并验证所有已完成的迭代\n\n这是高阶提示词的主要部分。它接收一个提示词作为输入并输出许多提示词，因为每个子代理接收不同的提示词。\n\
  \n一个提示词创建出许多提示词。该命令还包含无限运行的指令，以及上下文优化和执行原则。这为主代理提供了更多上下文。\n\n这是一个高层级提示词。\n\n思考那些以提示词为输入并生成提示词作为输出的提示词，这非常有创新性。对我来说，阅读此内容令人震撼。向\
  \ `IndieDevJam` 致敬，以及如何创建和界定自定义样式、使用 YAML 等结构化格式，以及在样式定义中自动化行为。\n\n# 获取本书的 PDF 副本、代码包等\n\
  \n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_7_30.png)\n\n![Image](img/B37082_7_31.png)\n\n*注意：请准备好发票。直接从\
  \ Packt 网站购买不需要发票。*\n\n## 8 创建和自定义输出样式\n\n**输出样式** 是 Claude Code 中最强大且被低估的功能之一。它们定义了响应的结构和呈现方式，实际上塑造了用户与模型之间的通信协议。\n\
  \n在本章中，我们将探讨输出样式如何塑造 Claude Code 的沟通方式。您将学习如何创建自定义输出样式，在用户或项目层面对其进行界定，以及如何修改响应结构。我们还将探索输出样式如何与系统提示词交互，YAML\
  \ 等结构化格式如何改变推理模式，以及如何直接在样式定义中自动化工作流。\n\n读完本章后，您将理解如何设计 Claude Code 的交互模型，而不仅仅是消费其输出。您将能够设计专用配置、运行具有不同角色的并行会话、为您的设置进行版本控制，并使用自定义状态行扩展界面。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   使用 Claude Code 创建自定义输出样式\n*   创建高级项目级输出样式\n*   在 Claude\
  \ Code 中自定义状态行\n*   高级状态行：显示最后的用户提示词\n*   AI 编码的未来：专业化代理团队\n\nClaude Code 中可用的内置输出样式可能会随时间演变。根据您安装的版本，您看到的样式可能不止本章所示的那些。\n\
  \n### 使用 Claude Code 创建自定义输出样式\n\n使用 `/output‑style` 列出可用的输出样式时，Claude Code 会显示当前激活的样式以及任何内置样式。\n\
  \n默认情况下，系统包含以下样式：\n\n*   **Default**（默认）\n*   **Explanatory**（解释性）\n*   **Learning**（学习型）\n\
  \n下图显示了 Claude Code CLI 中的输出样式选择界面。当前激活的样式会被高亮显示，内置样式列在其下方。\n\n![Figure 8.1 – Claude\
  \ Code CLI output style selection interface](img/B37082_8_1.png)\n\nFigure 8.1 –\
  \ Claude Code CLI 输出样式选择界面\n\n如图所示，CLI 会展示可用样式并指示哪个处于激活状态。Explanatory 和 Learning\
  \ 样式是由 Anthropic 团队预构建的。您可以创建自定义输出样式，而不必使用这些预定义样式。\n\n#### 创建和查看新的输出样式\n\n要创建用户级输出样式，请在以下位置创建一个\
  \ Markdown 文件：\n\n```\n~/.claude/output-styles/\n```\n\n要创建项目级输出样式，请在以下位置创建：\n\n\
  ```\n.claude/output-styles/\n```\n\n该文件使用 YAML 前置元数据，后跟 Markdown 内容，这与子代理的定义方式类似。以下示例展示了位于\
  \ `~/.claude/output‑styles/minimal‑bullets.md` 的文件：\n\n```\n---\ndescription: Concise\
  \ bullet-point responses with direct communication\n---\n\n# Communication Style\n\
  - Use bullet points for all responses\n- Be direct and to the point\n- No unnecessary\
  \ language or filler\n\n# Response Format\n- Lead with the answer\n- Use nested\
  \ bullets for hierarchy\n- Skip preamble and transitions\n\n# Tone\n- Professional\
  \ and concise\n- No hedging or qualifications\n```\n\n该文件包含以下内容：\n\n*   一个描述，将其定义为具有直接沟通、无多余语言的简洁要点式响应\n\
  *   详述沟通风格的扩展章节\n*   响应格式准则\n*   语气准则\n\n样式生成后，Claude Code 会将此定义写入磁盘。下图显示了写入磁盘的生成的\
  \ minimal-bullets 定义。选择 `minimal‑bullets` 样式后，它会成为当前激活的输出样式。查看可用输出样式列表时，会相应地指示所选样式。\n\
  \n![Figure 8.2 – Minimal-bullets style selected](img/B37082_8_2.png)\n\nFigure 8.2\
  \ – 已选择 Minimal-bullets 样式\n\n一个示例输出样式生成的响应采用要点格式，结构直接、简洁，无废话。\n\n![Figure 8.3 –\
  \ Claude responding using the minimal-bullets output style](img/B37082_8_3.png)\n\
  \nFigure 8.3 – Claude 使用 minimal-bullets 输出样式进行响应\n\n一旦选择了样式，Claude Code 会将其指令应用于后续请求。\n\
  \n### 输出样式如何工作\n\n\n\n\n# 输出风格\n\n选择输出风格会用特定于风格的自定义指令替换 Claude Code 系统提示的部分内容。Claude\
  \ Code 移除其默认的软件工程指令，并用所选风格的指令替代。\n\n无论选择哪种输出风格，Claude Code 的核心功能（包括用于跟踪的文件操作和脚本执行）均保持可用。\n\
  \n修改后的系统提示会随通过 Claude Code 发出的每个请求直接发送给 LLM。因此，这是同一个底层模型在不同的系统提示下运行。\n\n使用 `/command`\
  \ 切换输出风格时，Claude Code 会更新其内部系统提示模板，并将更新后的模板应用于后续的 LLM 调用。\n\n项目级输出风格仅在特定项目内生效。\n\
  \n## 为何选择 YAML\n\n将 YAML 作为输出风格，能将沟通从显式指令转变为隐式语义结构，由格式本身传达含义。\n\n在 YAML 输出中，格式本身成为一种丰富的通信协议，其中缩进、键的选择、排序和结构决策均承载意义。因\
  \ YAML 支持层级，它自然映射到复杂的编码任务。\n\n依赖关系表现为父子关系。优先级可从顺序推断。作用域通过嵌套层级表示。相比于列出顺序步骤，嵌套的 YAML\
  \ 结构编码了问题空间的逻辑架构。为使此更具体，请看一个真实任务的结构示例。\n\n以下示例是启用 YAML 输出风格时 Claude Code 返回的实际输出。\n\
  \n```\nTask: \"Fix authentication bug\"\nPriority: \"Urgent high\"\nComplexity:\
  \ \"Medium\"\n\napproach:\n  investigate:\n    auth_flow: &flow\n      - login_endpoint\n\
  \      - token_validation\n      - session_middleware\n    debugging:\n      logs:\
  \ \"./auth.log\"\n      reproduce: \"invalid_token_scenario\"\n\nfix:\n  dependencies:\
  \ [*flow]\n  files_to_modify:\n    auth.js:\n      scope: \"token refresh logic\"\
  \n      risk: \"low\"\n    middleware.js:\n      scope: \"validation checks\"\n\
  \      risk: \"urgent\"\n\nverify:\n  tests: [\"auth_integration\", \"token_expiry\"\
  ]\n  manual_check: \"login flow end-to-end\"\n\nmetadata:\n  estimated_time: \"\
  2 hours\"\n  rollback_plan: \"revert commits\"\n  monitoring: \"error_rate_dashboard\"\
  \n```\n\n让我们拆解此结构：\n\n*   `task` 定义建立上下文\n*   `approach` 部分捕获调查路径和调试工件\n*   `fix`\
  \ 部分编码依赖关系和文件级作用域\n*   `verify` 部分定义验证机制\n*   `metadata` 部分捕获运营考量\n\n![Figure 8.4\
  \ – Claude generating a structured task plan in YAML format](img/B37082_8_4.png)\n\
  \nFigure 8.4 – Claude generating a structured task plan in YAML format\n\nYAML 鼓励基于关系和依赖而非顺序步骤进行思考。其层级结构将焦点从有序指令转移到相互关联的组件。\n\
  \n当 Claude Code 以嵌套 YAML 结构输出任务时，它不生成简单的待办清单。相反，它将问题空间的逻辑架构编码在结构本身中。关系、作用域和依赖通过嵌套和键组织来表达。\n\
  \n![Figure 8.5 – Human–AI collaboration enabled through customizable output styles](img/B37082_8_5.png)\n\
  \nFigure 8.5 – Human–AI collaboration enabled through customizable output styles\n\
  \n输出风格移除了单一固定交互模型的约束。它们允许通信协议本身被设计和调整。这反映了 Agentic Coding 的本质：主动塑造 AI 表达信息和在开发工作流中协作的方式。\n\
  \n因此，对交互的控制不限于模型提供商改进模型能力。开发者作为大语言模型的用户，通过输出风格定义并控制通信协议。\n\n## 创建 YAML 输出风格\n\n\
  项目级输出风格可配置为生成简洁的 YAML 响应，无额外冗余。在项目级定义时，该配置仅在该项目内生效。\n\n要创建此风格，请在项目目录下创建文件 `.claude/output-styles/yaml-concise.md`：\n\
  \n```\n---\ndescription: Concise YAML-formatted responses for structured communication\n\
  ---\n\n# Response Format\n- All responses must be formatted as valid YAML\n- Use\
  \ hierarchy and nesting to express relationships\n- Keep values concise — no full\
  \ sentences unless necessary\n\n# Structure\n- Use top-level keys to represent major\
  \ sections\n- Nest subconcepts under their parent context\n- Use lists for enumerations\
  \ and sequences\n- Use key-value pairs for properties and attributes\n\n# Tone\n\
  - No prose, no filler, no transitional language\n- Let the YAML structure carry\
  \ the meaning\n- Prefer short string values over paragraphs\n```\n\n创建文件后，运行 `/output-style`\
  \ 时，`yaml-concise` 风格会出现在可用输出风格列表中。项目的 `.claude` 文件夹下也会创建一个新目录。其中生成的 YAML 配置文件代表新定义的项目级输出风格。选择它以激活当前会话的风格。\n\
  \n激活 YAML 风格后，发出查询，例如：\n\n```\nWhat are Claude Code output styles? Give me an elaborate\
  \ answer.\n```\n\n响应将作为结构化 YAML 返回，而非段落或要点。层级、键和缩进编码了解释的结构。\n\n以下是一个典型示例：\n\n```\n\
  definition:\n  what: \"Custom response formats for Claude Code CLI\"\n  purpose:\n\
  \    - \"Control communication style and structure\"\n    - \"Support global or\
  \ project-level configuration\"\n\nlocation:\n  global: \"~/.claude/output-styles/\"\
  \n  project: \"./.claude/output-styles/\"\n  precedence: \"Project overrides global\"\
  \n\nfile_structure:\n  format: \"Markdown with YAML frontmatter\"\n  frontmatter:\n\
  \    description: \"Brief style explanation\"\n    content: \"System prompt modifications\"\
  \n\nfunctionality:\n  controls:\n    - \"Response formatting (bullets, YAML, prose)\"\
  \n    - \"Communication tone (formal, casual, technical)\"\n    - \"Information\
  \ density (concise, detailed)\"\n    - \"Task approach (speed vs thoroughness)\"\
  \n    - \"Workflow behaviors\"\n```\n\n输出结构反映了概念分组，而非线性解释。\n\n响应格式强调以下关系：\n\n* \
  \  章节成为顶级键\n*   子概念嵌套在其父上下文下\n*   配置作用域和优先级在结构上编码\n*   行为控制归类在共享功能类别下\n\n此方法映射了\
  \ YAML 在 Kubernetes 和 Docker Compose 等配置系统中的用法。结构保持可读性的同时保留了语义层级。\n\n激活项目级 YAML\
  \ 简洁风格后，响应将始终以此结构化格式返回，强化架构思维而非顺序叙述。\n\n![Figure 8.6 – YAML-concise output style\
  \ applied in Claude Code](img/B37082_8_6.png)\n\nFigure 8.6 – YAML-concise output\
  \ style applied in Claude Code\n\n\n\n\n# 创建高级项目级输出样式\n\n本节定义了一个新的项目级输出样式，并通过自动化文件生成行为对其进行了扩展。目标是生成结构为\
  \ ASCII 风格博客页面的 HTML 格式响应，并将该行为直接集成到输出样式定义中。\n\n## 定义自定义 HTML 输出样式\n\n让我们创建并查看输出样式配置文件。该配置的完整示例可在代码仓库中找到。要获取代码仓库链接，请遵循\
  \ *Preface* 中 *Download the example code files* 部分的步骤。\n\n在以下路径下创建一个新的项目级输出样式文件：\n\
  \n```\n.claude/output-styles/retro-ASCII_blog.md\n```\n\n该样式旨在生成格式化为 ASCII 风格博客页面的\
  \ HTML 输出。\n\n输出样式控制响应的格式，还可以嵌入工作流规则。\n\n输出样式的内容如下：\n\n```\n---\ndescription: Format\
  \ responses as retro HTML pages with ASCII art styling like a vintage blog\n---\n\
  Format all responses as complete HTML pages with retro ASCII art blog styling. Follow\
  \ these guidelines:\nHTML Structure\nAlways provide complete HTML5 documents with\
  \ proper DOCTYPE, head, and body tags\nUse semantic HTML elements (header, main,\
  \ section, article, aside, footer)\nInclude a proper HTML title that reflects the\
  \ content\nASCII Art Styling\nUse ASCII art for headers, dividers, and decorative\
  \ elements\nCreate borders using characters like ═, ║, ╔, ╗, ╚, ╝, -, |, +, *, #\n\
  Add ASCII art banners for section headers\nUse monospace fonts throughout for consistent\
  \ ASCII alignment\nInclude decorative ASCII elements like stars, lines, and boxes\n\
  CSS Requirements\nEmbed CSS in <style> tags in the HTML head\nUse monospace fonts\
  \ (Courier New, Monaco, Consolas, monospace)\nSet background to dark colors (#1a1a1a,\
  \ #2d2d2d) with light text\nUse retro color schemes (green on black, amber on black,\
  \ etc.)\nStyle ASCII art elements with appropriate spacing and alignment\nAdd subtle\
  \ glow effects or text shadows for retro terminal feel\nContent Structure\nFormat\
  \ content like a blog post with clear sections\nUse ASCII art dividers between sections\n\
  Create ASCII art headers for major topics\nInclude a decorative ASCII footer\nStructure\
  \ technical information in readable blocks\nAdd ASCII navigation or menu elements\
  \ when appropriate\nExample Elements to Include:\nASCII art title banners\nDecorative\
  \ borders around code blocks\nASCII bullet points and lists\nRetro-style ASCII progress\
  \ bars or indicators\nTerminal-style prompts and outputs\nASCII art logos or emblems\n\
  Remember to maintain readability while embracing the retro ASCII aesthetic. The\
  \ content should feel like browsing a vintage bulletin board system or early web\
  \ blog.\n```\n\n此输出样式超越了简单的终端格式化。它不生成要点或 YAML，而是由 `Claude Code` 生成作为复古 ASCII 艺术博客页面样式的完整\
  \ HTML 文档。\n\n说明组织为以下几节：\n\n- **HTML 结构** 定义了带有语义元素的完整 HTML5 文档\n- **ASCII 艺术样式**\
  \ 通过绘图字符和等宽字体建立视觉标识，以保持一致的对齐\n- **CSS 要求** 定义了复古终端美学，包括深色背景、绿底黑字或琥珀底黑字配色方案，以及微妙的发光效果\n\
  \n内容组织为博客文章，带有 ASCII 艺术分隔符、横幅和装饰性页脚。\n\n整个行为在单个 Markdown 文件中定义，无需代码或插件。一旦选中该样式并发出提示，`Claude\
  \ Code` 将生成 HTML 页面，将其写入磁盘，并在浏览器中打开。\n\n## 使用 HTML 输出样式\n\n选中 `retro‑ASCII_blog.md`\
  \ 作为活动输出样式后，发出以下提示：\n\n- 什么是输出样式？请提供详细答案。\n- 向我展示我目前拥有哪些输出样式。\n\n响应将以 HTML 形式生成。内容为有效的\
  \ HTML 标记，直接在终端中渲染。因为它作为标记发出，所以在这种情况下不易阅读。\n\n在此阶段，HTML 尚未写入可在浏览器中打开的文件。输出仅存在于生成的标记中。\n\
  \n要使结果可用，需指示 `Claude Code` 将生成的 HTML 转储到文件中。创建一个名为 `output‑styles‑guide.HTML` 的文件。\n\
  \n在浏览器中打开时，它将渲染为一个博客风格的页面，显示输出样式的解释。\n\n![Figure 8.7 – Generated HTML page documenting\
  \ Claude Code output styles](img/B37082_8_7.png)\n\n**图 8.7 – 生成的记录 Claude Code\
  \ 输出样式的 HTML 页面**\n\n渲染的页面显示了配置的输出样式，并演示了结构和格式完全可定制。HTML 并非旨在视觉上精致；其目的是说明生成内容拥有完全的自由度。\n\
  \n输出样式不限于静态页面。它可以扩展为将页面写入更大的应用程序中，例如 `Next.js` 项目，其中每个 `Claude Code` 生成的响应都在该应用程序中生成一个新页面。输出的结构和行为完全由配置定义，不存在预定义模板施加的固有限制。\n\
  \n## 自动化文件生成\n\n我们现在将工作流逻辑直接嵌入到输出样式定义中。每次提示 `Claude Code` 将 HTML 写入文件都很重复。我们不再在每次提示时发出此指令，而是将该行为直接嵌入到输出样式定义中。\n\
  \n`retro‑ASCII_blog.md` 文件已更新，包含以下代码片段的工作流说明：\n\n```\nWorkflow\nSave the HTML file\
  \ after writing it, it should have a descriptive name ending with .html\nOPEN the\
  \ generated file in the default web browser.\n```\n\n输出样式还可以编码工作流行为，允许 `Claude Code`\
  \ 自动保存生成的 HTML 文件并在浏览器中打开。\n\n![Figure 8.8 – Output style workflow instructions](img/B37082_8_8.png)\n\
  \n**图 8.8 – 输出样式工作流说明**\n\n未引入复杂逻辑。提示保持最小化。`Claude Code` 根据这些说明执行所需的文件生成步骤。\n\n\
  保存更新后的输出样式后，发出如下提示：\n\n```\nWhat are output styles?\n```\n\n这将导致自动创建一个名为 `output‑styles‑quick‑guide.html`\
  \ 的文件。系统请求确认在默认浏览器中打开该文件，一旦批准，渲染的 HTML 即刻可见。\n\n工作流现已嵌入输出样式本身。在此样式下生成的每个响应都会自动写入一个可供浏览器打开的\
  \ HTML 文件。\n\n## 使用多个输出样式\n\n运行单个输出样式演示了如何为特定目的自定义格式。通过同时运行多个 `Claude Code` 实例，每个实例配置不同的输出样式，可以扩展此配置。以下章节说明了单独的会话如何并行运行，以及这如何在同一代码仓库中实现特定任务的格式化。\n\
  \n### 启动新的 `Claude Code` 实例\n\n\n\n在仓库内打开一个新的终端实例，并启动 Claude Code。这将创建一个新会话，且尚未选择输出样式。\n\
  \n![Figure 8.9 – Launching a new Claude Code session](img/B37082_8_9.png)\n\n**Figure\
  \ 8.9 – Launching a new Claude Code session**\n\n随后从可用选项中选择一种输出样式。本例中选择了极简要点输出样式。\n\
  \n会话现已配置为使用极简要点格式生成响应。\n\n### 在同一仓库中打开第二个实例并使用不同的输出样式\n\n在同一仓库中打开第二个终端实例。在该新会话中再次启动\
  \ Claude Code。\n\n本例中选择了另一种输出样式 —— YAML 简洁输出样式。\n\n此时，有两个 Claude Code 实例同时运行：\n\n\
  *   一个配置了极简要点样式\n*   一个配置了 YAML 简洁输出样式\n\n每个实例维护各自激活的输出样式。\n\n![Figure 8.10 – Selecting\
  \ the YAML-concise output style](img/B37082_8_10.png)\n\n**Figure 8.10 – Selecting\
  \ the YAML-concise output style**\n\n### 并行输出样式的实践\n\n两个实例并行运行时，各终端生成的响应均反映其选定的配置。格式差异取决于当前激活的输出样式。\n\
  \n这确立了一种工作流：多个 Claude Code 会话并行运行，每个会话针对特定输出格式进行优化。\n\n![Figure 8.11 – Two Claude\
  \ Code sessions using different output styles](img/B37082_8_11.png)\n\n**Figure\
  \ 8.11 – Two Claude Code sessions using different output styles**\n\n## 专用输出样式工作流\n\
  \n两个实例同时可见时，每个会话都清晰地维持着各自的格式化行为。我们不再使用单一的整体环境，而是让每个 Claude Code 会话成为专门针对特定任务配置的专用\
  \ AI 助手。\n\n*   面向代码审查的会话可强调代码差异、安全漏洞和架构问题。\n*   面向解释的会话可针对教学见解或文档生成进行优化。\n*   面向调试的会话可专注于错误分析和故障排查，并使输出与之对齐。\n\
  \n每种输出样式都将 AI 的认知重点调整至当前任务。\n\n在终端窗口间切换时，无法直观得知当前激活的是哪种输出样式。界面并未显著显示此信息。\n\n在跨多会话工作时，这一限制会变得明显。可通过自定义状态行来解决，它能更清晰地标识当前激活的配置。\n\
  \n配置验证通过并按预期工作后，将更改提交至版本控制。\n\n在本节中，你通过定义项目级配置并集成更高级的格式化与行为逻辑，扩展了基础输出样式机制。你见证了输出样式如何超越简单的响应格式化，延伸为\
  \ HTML 等结构化输出及自动化工作流行为。这表明输出样式不仅影响响应的外观，还影响其运作方式。奠定此基础后，下一节将从输出格式化转向运行时界面定制 —— 通过修改\
  \ Claude Code 状态行。\n\n# 在 Claude Code 中自定义状态行\n\n状态行允许你运行任意脚本：脚本通过 `stdin` 接收 Claude\
  \ Code 的会话数据（模型、上下文用量、费用、Git 信息等 JSON），并将你想要的内容持久打印在终端底部。你可以在 `~/.claude/settings.json`\
  \ 中将 `statusLine` 键指向你的脚本来配置它，或使用 `/statusline` 斜杠命令配合自然语言描述自动生成。\n\n本节回顾如何使用专用命令和基于\
  \ Python 的实现来配置和实现 Claude Code 的自定义状态行。\n\n## 定义自定义状态行命令\n\n定义一个新的斜杠命令 `/statusline`。该命令包含一段描述，指明状态行应显示当前激活的输出样式。提供给该命令的提示词如下：\n\
  \n```\n/statusline I want you to create a statusline that displays the current used\
  \ output-style.\nYou should implement it in python and run it through uv\n```\n\n\
  指定了两项实现要求：\n\n*   状态行必须用 Python 实现\n*   必须使用 UV 包管理器执行\n\nClaude Code 的状态行可执行 Shell\
  \ 命令、Shell 脚本、Python 文件和 Node.js 文件，能运行任意可执行逻辑。基于熟悉度和偏好，选择 Python 作为实现语言。\n\n##\
  \ 初始化状态行设置\n\n执行 `/statusline` 命令后，Claude Code 初始化并生成一个子代理，负责协助创建状态行。\n\n子代理执行的首个动作是在主目录中搜索现有的状态行配置：\n\
  \n```\n~/.claude/settings.json\n```\n\n检查该文件是否存在 `statusline` 条目。由于不存在，配置文件随即更新。\n\
  \n![Figure 8.12 – Implementing a custom statusline script](img/B37082_8_12.png)\n\
  \n**Figure 8.12 – Implementing a custom statusline script**\n\n## 更新配置\n\n`settings.json`\
  \ 文件定义了默认模型，此处设为 `sonnet`。随后在配置中新增一个 `statusline` 条目。\n\n典型配置如下：\n\n```json\n{\n\
  \  \"model\": \"sonnet\",\n  \"statusline\": {\n    \"type\": \"command\",\n   \
  \ \"command\": \"uv run ~/.claude/statusline.py\"\n  }\n}\n```\n\n`type` 设为 `command`，配置的命令使用\
  \ `uv` 包管理器运行 `statusline.py` 脚本。\n\n默认情况下，脚本创建于主目录：\n\n```\n~/.claude/statusline.py\n\
  ```\n\n脚本可存放在任意位置，只需配置中指定正确的执行路径即可。\n\n## 实现状态行逻辑\n\n`statusline.py` 文件包含决定自定义状态行显示内容的逻辑。\n\
  \nClaude Code 通过标准输入（`stdin`）向脚本提供运行时信息。脚本读取该输入并将其作为 JSON 处理。使用 `json.load` 将数据加载到字典中，从而访问\
  \ Claude Code 提供的所有信息。\n\n![Figure 8.13 – Statusline script reading JSON input from\
  \ Claude Code](img/B37082_8_13.png)\n\n**Figure 8.13 – Statusline script reading\
  \ JSON input from Claude Code**\n\n最小实现如下：\n\n```python\nimport json\nimport sys\n\
  \ninput_data = json.load(sys.stdin)\nstyle = input_data.get(\"output_style\", \"\
  default\")\n\nprint(style)\n```\n\n可用键中包含 `output_style`。脚本从此键提取当前激活输出样式的名称。若未定义输出样式，脚本默认显示\
  \ `\"default\"` 作为输出样式。\n\n脚本将结果写入标准输出（`stdout`）。Claude Code 读取脚本打印到 `stdout` 的内容并将其显示在状态行中。\n\
  \n更改输出样式时，通过 `stdin` 传递的值会随之变化，状态行也会反映新样式。\n\n## ANSI 颜色支持与格式化\n\n状态行支持 ANSI 颜色格式化。修改\
  \ Python 脚本可更改输出的视觉外观，包括颜色和文本样式（如粗体）。\n\n例如，`print` 语句可包含 ANSI 转义序列：\n\n```python\n\
  print(f\"\\033[1;32m{style}\\033[0m\")\n```\n\n这些数字序列为 ANSI 转义码，用于控制终端格式化。本例中状态行将以绿色粗体文本显示。\n\
  \n\n\n当活动输出样式更改时，状态行会随之更新。由于逻辑在脚本中实现，状态行会动态反映当前配置以及脚本应用的任何格式调整。\n\n![图 8.14 - 显示活动输出样式的状态行](img/B37082_8_14.png)\n\
  \n图 8.14 - 显示活动输出样式的状态行\n\n## 扩展状态行功能\n\n由于状态行逻辑由可执行脚本驱动，它可以显示运行时环境可用的任何信息。这包括来自外部系统的数据、股票价格、新闻源或其他动态检索的信息。\n\
  \n输出样式的更多高级功能可以通过进一步扩展脚本逻辑来实现。\n\n在本节中，你使用 Python 脚本实现了一个自定义状态行，并将其集成到 Claude Code\
  \ 的配置中。你学习了运行时信息如何通过标准输入传递，如何提取结构化数据（如活动输出样式），以及如何在界面中显示动态值。这表明 Claude Code 的可扩展性不仅限于输出格式，还允许可执行逻辑塑造开发环境本身。基于此能力，下一节将通过读取记录数据并提取最后的用户提示词来进一步增强状态行。\n\
  \n# 高级状态行：显示最后的用户提示词\n\n在主目录中，`.claude` 目录包含一个 `projects` 子目录。`projects` 内部的每个子目录对应一个项目，并保存其对话历史和会话数据。目录名称反映了项目路径，其中路径分隔符（如\
  \ `/`）被替换为 `‑`。\n\n![图 8.15 - 存储会话数据的 Claude projects 目录](img/B37082_8_15.png)\n\
  \n图 8.15 - 存储会话数据的 Claude projects 目录\n\n在每个项目目录中，JSONL 文件存储对话日志。每个文件由 UUID 标识。这些\
  \ JSONL 文件包含会话期间交换的完整消息序列。\n\n检查一个此类 JSONL 文件会发现，每一行代表一个对应消息条目的 JSON 对象。当提交新的用户消息时，一个新的\
  \ JSON 对象会被追加到文件中。例如，如果用户发送 `\"hello\"`，会出现一个新条目，包含以下内容：\n\n*   `\"role\": \"user\"\
  `\n*   `\"content\": \"hello\"`\n\n此条目后面跟随的是助手的回复。\n\n![图 8.16 - 存储用户提示词的 JSONL\
  \ 记录](img/B37082_8_16.png)\n\n图 8.16 - 存储用户提示词的 JSONL 记录\n\nClaude 将所有用户提示词存储在这些\
  \ JSONL 文件中。目标是扩展状态行，使其显示当前会话中用户发送的最后一个提示词。此提示词必须从作为输入提供给状态行脚本的 `transcript_path`\
  \ 键所引用的记录文件中检索。\n\n只应显示用户提示词。必须排除状态行调用等命令以及助手回复。\n\n所有实现均包含在现有的 `statusline.py`\
  \ 文件中。\n\n## 定义状态行需求\n\n定义了一个 `/statusline` 指令，用于使用一个额外字段（当前会话中用户的最后一个提示词）来扩展状态行。\n\
  \n当 Claude Code 执行状态行命令时，它会通过标准输入将结构化运行时数据传递给状态行脚本。此 JSON 载荷包含诸如 `transcript_path`\
  \ 之类的字段，指向当前会话的 JSONL 记录文件。\n\n脚本从其输入中读取 `transcript_path` 值，加载引用的 JSONL 文件，并搜索最近的用户消息。该消息即为显示的提示词。仅考虑真实的用户提示词。助手回复和命令调用被排除。\n\
  \n以下 `/statusline` 指令扩展状态行，使其显示会话记录中最近的用户提示词。\n\n```\n/statusline 我希望你同时显示当前会话中用户的最后一个提示词。\n\
  你应该从 transcript_path 中的文件示例获取提示词。 /path/to/transcript.jsonl\n请记住用户提示词将是一个 role=\"\
  user\" 的消息。\n请记住完全不要有命令回复，在这个示例中只有用户提示词。\n```\n\n在演示案例中，记录文件中最近的用户提示词是 `hello`，它显示在状态行中。只应显示真实的用户提示词；即，必须排除记录在案的状态行命令和助手回复。因此，脚本会过滤条目，以便仅考虑有效的用户提示词。\n\
  \n该指令明确指出所有逻辑必须在现有的 `statusline.py` 文件中实现。这防止了创建额外的脚本或 Shell 实用程序，并确保功能保持在状态行实现内部。\n\
  \n### 访问记录路径\n\n在 `statusline.py` 内部，结构化输入被加载为字典。脚本访问 `transcript_path` 键，该键已知存在。该路径被传递给一个负责检索最后用户提示词的函数。状态行脚本检索记录路径并从会话日志中提取最近的用户提示词。\n\
  \n![图 8.17 - 读取记录路径以获取最后的用户提示词](img/B37082_8_17.png)\n\n图 8.17 - 读取记录路径以获取最后的用户提示词\n\
  \n函数返回提示词后，它会作为状态行输出的一部分被打印。\n\n### 实现最后用户提示词的检索\n\n检索函数执行以下操作：\n\n*   确认记录文件路径存在\n\
  *   打开并读取该路径下的 JSONL 文件\n*   遍历文件的每一行\n*   将每一行解析为 JSON 字典对象\n*   检查每个条目中的 `message`\
  \ 键\n*   检查 `message` 内部的 `role` 字段\n*   如果角色是 `user`，提取 `content` 字段\n\n以下 Python\
  \ 函数读取记录文件，解析 JSONL 条目，并检索最近的有效用户提示词。\n\n```python\nimport json\nimport sys\nimport\
  \ os\n\n\ndef get_last_user_prompt(transcript_path):\n    \"\"\"\n    Extract the\
  \ last user prompt from the transcript file.\n    \"\"\"\n\n    try:\n        if\
  \ not os.path.exists(transcript_path):\n            return \"No transcript found\"\
  \n\n        with open(transcript_path, \"r\") as f:\n            content = f.read().strip()\n\
  \n        if not content:\n            return \"Empty transcript\"\n\n        #\
  \ Split by lines and process each JSON object\n\n        lines = content.split(\"\
  \\n\")\n\n        for line in reversed(lines):\n            try:\n             \
  \   entry = json.loads(line)\n\n                # Entry has 'message' and not a\
  \ command\n                if entry.get(\"type\") == \"message\" and entry.get(\"\
  role\") == \"user\":\n                    message_content = entry.get(\"message\"\
  , {}).get(\"content\", \"\")\n\n                    # Skip command messages starting\
  \ with /\n                    if message_content.startswith(\"/\"):\n          \
  \              continue\n\n                    return message_content\n\n      \
  \      except json.JSONDecodeError:\n                continue\n\n        return\
  \ \"No user prompt found\"\n\n    except Exception as e:\n        return f\"Error\
  \ reading transcript: {e}\"\n```\n\n命令式占位符和助手回复会被跳过。仅保留有效的用户提示词。迭代过程中找到的最近的有效用户提示词将作为结果返回。\n\
  \n此时，`statusline.py` 文件执行三个不同的步骤。首先，它从标准输入读取结构化运行时输入。其次，它从该输入中提取 `transcript_path`\
  \ 值。第三，它打开引用的 JSONL 记录文件，扫描最近的有效用户提示词，并将该值打印到标准输出。\n\n## 测试并完成实现\n\n实现检索和显示最后用户提示词的逻辑后，下一步是确认行为按预期工作。这涉及验证新的记录条目是否正确追加、是否仅提取有效的用户提示词，以及每次交互后状态行是否一致更新。\n\
  \n\n\n\n### 验证实现\n\n提交新消息时，会在 JSONL 记录文件中追加一个新条目。记录下助手的响应后，状态行会更新以反映新提交的提示词。\n\n\
  重复此过程可确认以下几点：\n\n* 每条新消息都会添加一个新的 JSONL 条目\n* 显示的提示词会相应更新\n* 脚本能持续检索到最近的有效用户提示词\n\
  \n更改输出样式（例如改为 YAML 简洁样式），以确认新功能保持完好。状态行继续无误地显示最后的提示词。\n\n![图 8.18 – 状态行反映记录文件中最新的用户提示词](img/B37082_8_18.png)\n\
  \n图 8.18 – 状态行反映记录文件中最新的用户提示词\n\n### 更新输出标签\n\n在前几节中，我们探讨了如何使用输出样式控制 Claude Code\
  \ 的行为，以及如何通过状态行监控活动。这两套机制共同为塑造系统在运行时的通信与操作方式奠定了基础。\n\n有了这些能力，我们现在可以展望当它们结合并扩展时，智能体编码的未来可能是什么样子。我们不再依赖单个助手会话，而是可以让多个专业化的智能体协同工作，每个智能体都配置有自己的角色、上下文和输出行为。\n\
  \n# AI 编码的未来：专业化智能体团队\n\n随着智能体开发工作流的演进，单个助手会话往往不足以应对复杂任务。取而代之的是，多个专业化智能体可以协作，每个智能体负责特定的角色或领域。通过结合前文介绍的配置技术（如输出样式和运行时状态行），我们可以开始将这些智能体构建为一个协调系统，而非单一的通用助手。\n\
  \n## 智能体编码与多实例\n\n智能体编码的一种体现是同时运行多个 `Claude Code` 实例，每个实例拥有以下要素：\n\n* 输出样式\n* 上下文\n\
  * 角色\n\n我们不再依赖单个通用会话，而是将职责分发到各个专业化实例中。\n\n这映射了一个小型初创团队的结构。\n\n![图 8.19 – 智能体角色展示为专业化的初创团队](img/B37082_8_19.png)\n\
  \n图 8.19 – 智能体角色展示为专业化的初创团队\n\n在小型初创团队模型中，不同类型的工作会路由给不同的专家。UI 变更由前端工程师 Vinay 处理。后端变更由\
  \ Rajesh 处理。部署问题由 DevOps 工程师 Alex 处理。每个人都有独特的职责和技能，且倾向于以匹配其工作的方式进行沟通。此处使用的所有姓名均为�构，仅用于演示工作流中的示例角色。以下是一些示例：\n\
  \n* 面向 DevOps 的实例可能使用 YAML 样式输出\n* 面向后端的实例可能使用 OpenAPI 规范格式\n* 面向文档的实例可能使用结构化学习样式输出\n\
  \n每种输出样式均在系统层面配置，并影响响应的生成方式。一个实例也可能关联不同的命令、智能体和上下文约束。\n\n实例可以按其职责命名，类似于命名的团队成员。\n\
  \n## 命名与基于角色的上下文\n\n每个 `Claude Code` 实例可以代表一个命名角色，例如：\n\n* `frontend‑engineer`（前端工程师）\n\
  * `backend‑engineer`（后端工程师）\n* `devops`（运维开发）\n* `security‑review`（安全审查）\n\n名称反映了：\n\
  \n* 输出样式\n* 上下文\n* 处理的任务类型\n\n在终端间切换相当于在专业化团队成员间切换。安全相关任务在安全聚焦的实例中处理。UI 任务在前端聚焦的实例中处理。\n\
  \n这种结构实现了受控的上下文边界和清晰的职责分离。多个专业化的 `Claude Code` 实例作为协调智能体在开发工作流中运行。\n\n在本最后一节中，你探索了多个\
  \ `Claude Code` 实例如何并行运行，每个实例都配置有独特的输出样式和上下文聚焦。你了解了目录级配置如何影响行为，以及专业化会话如何映射开发团队中基于角色的协作。这巩固了本章的核心观点：`Claude\
  \ Code` 不是单一固定的界面，而是一个可配置系统，可被塑造为特定任务的智能体。\n\n# 总结\n\n在本章中，你学习了 `Claude Code` 输出样式的工作原理，以及如何在用户或项目范围内创建、审查和应用它们。你还考察了选择输出样式如何改变\
  \ `Claude Code` 的系统提示词行为，以及 YAML 和 HTML 等结构化格式如何改变响应的生成与消费方式。本章通过将文件生成行为嵌入输出样式，并使用读取运行时输入和记录历史的\
  \ `Python` 脚本实现自定义状态行逻辑，将此配置工作扩展到了工作流控制。\n\n这些信息之所以有用，是因为它建立了对 `Claude Code` 通信方式的直接控制，而不仅仅是它生成的内容。我们不再将模型输出视为固定的散文，输出样式允许将响应结构、语气和工作流行为定义为开发环境的一部分。这使得为不同任务定制\
  \ `Claude Code` 会话、并行运行多个专业化会话，以及将这些配置作为可复现工作流的一部分进行版本控制成为可能。\n\n在下一章中，我们将把目光投向理解智能体技能，作为扩展\
  \ AI 智能体能力的一种机制。\n\n# 获取本书的 PDF 副本、代码包及更多内容\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版次，然后遵循页面上的步骤操作。\n\
