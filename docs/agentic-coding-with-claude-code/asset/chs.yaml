  \ 第一部分\n\n# 上下文工程与 Claude Code 基础\n\n在**第一部分**中，您将建立对上下文工程的清晰实用理解，并知晓其在使用现代 AI 编码代理时的重要性。我们将探讨从简单的提示工程转向结构化上下文管理如何改变代理的设计与使用方式。您将探索上下文的创建方式、其随时间增长的机制，以及管理不善对性能、成本和可靠性的影响。\n\
  \n在奠定概念基础的同时，您将直接上手使用 Claude Code。通过指导性示例，您将了解它如何解读代码库、构建工作上下文，并将该上下文应用于实际开发任务。读完本部分，您将对\
  \ Claude Code 的理论与日常操作有扎实的理解。\n\n本部分包含以下章节：\n\n*   第 1 章，上下文工程\n*   第 2 章，Claude\
  \ Code 要义\n*   第 3 章，Claude Code 入门——核心命令巡礼\n\n# 第 1 章\n\n# 上下文工程\n\n\n\n\n# 上下文工程简介\n\
  \n在本节中，我们将深入探讨什么是上下文工程。如果你一直在使用 AI 代理，可能还涉及 `Cursor` 和 `Claude Code` 等编码代理，或者你甚至为公司或个人用途开发过\
  \ AI 代理，你可能知道这一切归根结底就是向 LLM 发送一个提示词，并在其周围进行大量的工程化工作。\n\n称 `Cursor` 和 `Claude Code`\
  \ 等应用仅仅是围绕 LLM 的*封装*确实有几分道理。然而，构建真正优秀的封装需要大量的深度知识和大量的工程工作。另一个常用于指代这种环绕系统的术语是 *agent\
  \ harness*（代理框架/挽具）。框架是围绕 LLM 的编排层。它负责管理工具调用、控制代理循环、处理错误、执行护栏机制，以及**最重要的是**，决定在每一步将什么上下文发送给模型。\n\
  \n在实践中，大多数真正的工程工作并不在 LLM 调用本身内部，而是在其周围。模型调用通常很简单。决定代理能否可靠工作的是周围系统如何管理状态、工具、记忆和上下文。这是因为对\
  \ LLM 的调用总是伴随着上下文，而这些上下文来自各种来源和正在进行的进程。\n\n例如，上下文可能来自多个地方：\n\n*   它可以来自应用程序的开发者\n\
  *   它可以来自用户\n*   它可以来自用户的过往交互、工具调用或其他外部数据\n\n每天都会增加新的上下文来源，上下文的数量也在不断增加。将正确且相关的上下文发送给\
  \ LLM 并不像早期我们想象的那么简单。\n\n## 从提示词工程到上下文工程\n\n在早期，我们认为提示词工程就足够了。我们以为编写一些花哨的提示词就能解决问题，给我们想要的结果。然而，问题在于提示词是静态的，而上下文是极其动态的。\n\
  \n如果上下文是动态的，那么构建正确的上下文也需要一个动态系统。这不再仅仅关乎编写静态提示词。这就是我们进入**上下文工程**领域的原因。它是提示词工程的自然演进，但它是一个深得多的概念。\n\
  \n### 为什么上下文对代理至关重要\n\n我们都知道 “*垃圾进，垃圾出*” 这句格言。这是代理系统表现不如预期的最常见原因之一。它们只是没有被提供正确的上下文。\n\
  \nLLM 无法读取我们的思想。我们需要给它们正确的信息。顺便说一句，这不总是仅指信息或数据。有时我们需要给它们正确的工具，以便它们获取其他信息、采取行动并为我们执行任务。\n\
  \n![Figure 1.1 – LLM Context Window (Adapted from concepts discussed by LangChain,\
  \ www.langchain.com)](img/B37082_1_1.png)\n\n图 1.1 – LLM 上下文窗口（改编自 LangChain 讨论的概念，www.langchain.com）\n\
  \nLLM 在推理方面变得越来越强。我们有了工具调用，并且可以构建运行工具、调用工具、获取输出并循环直到任务完成的 AI 代理。\n\n![Figure 1.2\
  \ – LLM Tool Calling Loop (Adapted from concepts discussed by LangChain, www.langchain.com)](img/B37082_1_2.png)\n\
  \n图 1.2 – LLM 工具调用循环（改编自 LangChain 讨论的概念，www.langchain.com）\n\n然而，当涉及到长期运行和复杂的任务时，我们经常会累积来自工具调用的反馈。\n\
  \n这导致上下文窗口不断增长，被工具调用结果和中间输出填满。\n\n![Figure 1.3 – Context Growth Across Multiple\
  \ Turns (adapted from concepts discussed by LangChain, www.langchain.com)](img/B37082_1_3.png)\n\
  \n图 1.3 – 多轮对话中的上下文增长（改编自 LangChain 讨论的概念，www.langchain.com）\n\n这会导致几个问题：\n\n* \
  \  上下文窗口可能超出其大小限制\n*   成本和延迟增加\n*   代理性能开始下降\n\n如果不采取措施，这种退化是不可避免的。最近的讨论探讨了长上下文在实践中为何会失败，以及随着无关或冲突信息的累积，退化如何逐渐显现。欲了解更深入的讨论，请参阅\
  \ Dan Breunig 的这篇优秀博客 “*How Long Contexts Fail*” ([`www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html`](https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html))。如果允许上下文在没有结构、选择或控制的情况下增长，代理系统中将开始出现各种问题，例如：\n\
  \n*   **上下文中毒**：当工具调用或 LLM 调用产生的幻觉进入上下文并开始影响未来的输出\n*   **上下文混淆**：当不必要的上下文影响响应，即使它与任务无关\n\
  *   **上下文冲突**：当上下文的不同部分相互矛盾\n\n在下一节中，我们将讨论更好的上下文工程技术。其中一些技术由应用程序开发者实现，例如在 `Claude\
  \ Code` 等工具中。其他技术则在用户端。\n\n作为 `Claude Code` 的用户，我们对最终发送给 LLM 的上下文以及我们收到的回答有很大影响。这意味着即使是非开发人员，如果想从\
  \ AI 系统和 AI 代理获得更好的响应，也需要理解上下文工程。\n\n`Claude Code` 等编码代理是上下文工程技术如何同时应用于开发者端和用户端的绝佳例证。这正是我们将在下一节中探讨的内容，以及如何更好地设计我们的上下文。\n\
  \n# Claude Code 及其上下文工程策略\n\n在本节中，我们将讨论 `Claude Code`、其上下文工程理念，以及 `Claude Code`\
  \ 如何应对这些挑战。`Claude Code` 通过实现所有四种方法来应用这些上下文工程策略，它们如下：\n\n*   **编写上下文**：持久化记忆系统\n\
  *   **选择上下文**：智能上下文检索与注入\n*   **压缩上下文**：高效的上下文表示与摘要\n*   **隔离上下文**：多代理与作用域上下文管理\n\
  \n\n\n\n![Figure 1.4 – Categories of context engineering (adapted from concepts\
  \ discussed by LangChain, www.langchain.com)](img/B37082_1_4.png)\n\nFigure 1.4\
  \ – Categories of context engineering (adapted from concepts discussed by LangChain,\
  \ www.langchain.com)\n\n让我们从第一个策略开始。\n\n## 策略 1：编写上下文与持久化记忆\n\n第一个策略是**编写上下文及其持久化记忆架构**。Claude\
  \ 拥有多层记忆系统，Claude Code 实现了三层记忆层级，在使用 Claude Code 编码时，能跨会话持久化上下文。\n\n*   首先是**项目记忆**\
  \ (`./CLAUDE.md`)。这是团队共享的上下文，包含项目架构、规范或与特定项目相关的任何内容。这类记忆受版本控制，所有团队成员均可访问。\n\n  \
  \  ```\n    # Project Context\n    \n    ## Architecture Overview\n    This is a\
  \ microservices application using:\n    - Node.js with Express for API services\n\
  \    - React with TypeScript for frontend\n    - PostgreSQL with Prisma ORM\n  \
  \  - Redis for caching\n    \n    ## Coding Standards\n    - Use functional components\
  \ with hooks\n    - Implement error boundaries for all route components\n    - Follow\
  \ RESTful API conventions\n    - Write unit tests for all business logic\n    ```\n\
  \n*   然后是**用户记忆** (`~/.claude/CLAUDE.md`)。这存储在用户的主目录下的 `claude` 目录中的 `CLAUDE.md`\
  \ 文件内。它包含该用户在所有项目中的个人偏好和快捷方式。它不会提交到 GitHub，且专属于特定用户。每个用户在此处的值都不同，且会跨越所有 Claude Code\
  \ 会话持久保存。\n\n    ```\n    # Personal Development Preferences\n    \n    ## Code\
  \ Style\n    - Always use explicit return types in TypeScript\n    - Prefer const\
  \ assertions over type annotations\n    - Use descriptive variable names, avoid\
  \ abbreviations\n    \n    ## Workflow Shortcuts\n    - When writing tests, use\
  \ Jest with React Testing Library\n    - Always run `npm run lint` before commits\n\
  \    - Prefer composition over inheritance\n    ```\n\n*   最后是**动态记忆导入**。这些允许我们使用\
  \ `@` 符号和语法从其他记忆文件导入内容。这类似于将常规上下文加载到 Claude Code 中，但这一次我们可以拥有包含特定信息的专用记忆文件，并在我们的记忆文件中引用它们。\n\
  \n    ```\n    # In any CLAUDE.md file\n    @path/to/memory/file.md\n    @./relative/path/context.md\n\
  \    @~/global/user/context.md\n    ```\n\n我们还可以通过编写脚本，根据 Git 分支动态更新上下文来自定义行为。然后将此脚本连接到上下文切换钩子，构建更具适应性的工作流。\n\
  \n一个需要牢记的重要细节是，我们应避免重复向 `CLAUDE.md` 追加相同的上下文引用。如果脚本在每次运行时仅使用 `>>`，文件将因重复条目而无限增长。为防止这种情况，我们添加了一个小的保护措施，在追加前检查上下文引用是否已存在。\n\
  \n以下是避免重复导入的改进版脚本：\n\n```\n# Script to dynamically update context based on git branch\n\
  #!/bin/bash\n# context-switcher.sh\n# Dynamically load relevant context based on\
  \ user query\n# Safe against duplicate imports\n\nCLAUDE_MD=\"CLAUDE.md\"\n\n# Create\
  \ CLAUDE.md if it doesn't exist\ntouch \"$CLAUDE_MD\"\n\nadd_context() {\n  local\
  \ context_ref=\"$1\"\n  grep -qxF \"$context_ref\" \"$CLAUDE_MD\" || echo \"$context_ref\"\
  \ >> \"$CLAUDE_MD\"\n}\n\n# --- Branch-based context ---\nbranch=$(git branch --show-current\
  \ 2>/dev/null)\n\ncase $branch in\n  \"feature/auth-\"*)\n    add_context \"@./context/auth-system.md\"\
  \n    ;;\n  \"feature/payment-\"*)\n    add_context \"@./context/payment-flow.md\"\
  \n    ;;\n  \"hotfix/\"*)\n    add_context \"@./context/production-hotfix.md\"\n\
  \    ;;\nesac\n\n# --- Query-based context ---\nuser_input=\"$1\"\n\nif [[ -n \"\
  $user_input\" ]]; then\n  if [[ $user_input == *\"database\"* || $user_input ==\
  \ *\"migration\"* ]]; then\n    add_context \"@./context/database-context.md\"\n\
  \  elif [[ $user_input == *\"API\"* || $user_input == *\"endpoint\"* ]]; then\n\
  \    add_context \"@./context/api-context.md\"\n  elif [[ $user_input == *\"frontend\"\
  * || $user_input == *\"component\"* ]]; then\n    add_context \"@./context/frontend-context.md\"\
  \n  fi\nfi\n```\n\n关键变化在于 `add_context` 辅助函数。它使用 `grep -qxF` 检查上下文引用是否已存在于 `CLAUDE.md`\
  \ 中。如果存在，则不追加任何内容。这使得脚本具有幂等性，可安全地在每次提交提示词时运行。\n\n然后我们将此脚本连接到钩子：\n\n```\n{\n  \"\
  hooks\": {\n    \"UserPromptSubmit\": {\n      \"command\": \"./scripts/context-switcher.sh\
  \ \\\"$PROMPT\\\"\",\n      \"description\": \"Dynamically load relevant context\
  \ based on branch and user query\"\n    }\n  }\n}\n```\n\n通过此设置，上下文切换变得动态，且随时间推移保持稳定。\n\
  \n## 策略 2：智能上下文检索\n\n第二个策略是**智能上下文检索**，通常通过动态上下文发现实现。\n\nClaude 会自动浏览文件夹以查找有用的上下文文件。如果我们位于子文件夹中，它也会从父文件夹拉取上下文，但在有更具体信息可用时，会优先使用具体信息。它还会优先考虑最近使用和频繁访问的信息。\n\
  \n这是应用层面的上下文工程，由 Claude Code 开发者实现此逻辑。不过，用户也可以使用 `/memory` 命令自行添加持久化上下文。例如：\n\n\
  ```\n/memory add Always use descriptive variable names\n```\n\nClaude 会提示询问此记忆应存储在项目级还是用户级，并自动更新相应的\
  \ `CLAUDE.md` 文件。这使用户无需手动编辑上下文文件即可影响未来行为。\n\n根据所使用的工具，不同的上下文会被传播给 LLM。例如，当 Claude\
  \ Code 即将编辑文件时，它会自动记起先检查现有代码风格、在创建新函数前查找现有函数等事项。这是与编辑工具相关的上下文。\n\n另一个例子是，当 Claude\
  \ Code 即将运行终端命令时，它会记起不同的事项，例如在运行命令前检查是否有现有的 `npm` 脚本，或在执行前确保文件路径存在。\n\n## 策略 3：上下文压缩\n\
  \n第三个策略是**上下文压缩**，关乎高效的上下文表示。Claude Code 包含内置压缩命令。\n\n*   `/clear` 命令重置当前上下文窗口的对话历史，同时保留底层的项目记忆和用户记忆。当正在进行的对话走向无益，或您想在不丢失系统已学到的项目知识的情况下开启全新交互时，这非常有用。\n\
  \n*   `/compact` 命令将现有对话总结为更短的形式。它保留关键决策和重要信息，丢弃次要细节，而不是抛弃所有内容。这种压缩后的历史占用更少的上下文窗口，从而降低成本和延迟，并为模型腾出更多空间处理新输入。\n\
  \n## 策略 4：使用子代理隔离上下文\n\n第四个策略是上下文隔离。为此，Claude Code 使用子代理。每个子代理在其独立的上下文窗口中运行，不会继承主代理完整的对话历史。此策略旨在为不同任务提供不同的专业版\
  \ Claude Code，每个版本拥有自己的聚焦知识库。\n\n\n\n与其让 Claude Code 试图一次性用所有信息处理所有事情，不如创建专门的子代理，作为不同领域的专家。我们可以有一个主\
  \ Claude 代理，充当管理者并委派任务。我们可以有一个代码审查代理，专注于代码质量和安全；一个测试代理，专注于编写和运行测试；还有一个研究代理，专注于查找信息和最佳实践。示例如下：\n\
  \n```\n// 代码审查代理 – 聚焦上下文\nTask(\n  description: \"Code review\",\n  prompt: \"Review\
  \ this PR focusing only on security and performance\",\n  subagent_type: \"code-reviewer\"\
  \n)\n\n// 研究代理 – 广泛上下文\nTask(\n  description: \"Research implementation\",\n  prompt:\
  \ \"Find best practices for OAuth2 implementation\",\n  subagent_type: \"general-purpose\"\
  \n)\n```\n\n这很有帮助，因为如果没有隔离，Claude Code 会试图一次性用所有可能的信息处理所有事情而感到困惑。有了隔离，每个专家都有特定的知识范围，并利用它有效地完成工作。\n\
  \n上述语法仅为演示目的的说明性简化。Claude Code 目前并不使用这种确切格式。实际上，定义子代理需要包含前言部分的 YAML 配置，我们将在本书后面介绍。\n\
  \n# 系统提示词及其重要性\n\n在本节中，我们将讨论系统提示词及其在上下文工程中的重要性。您可能在 X 和 LinkedIn 上读过无数遍：系统提示词很重要，您应该研究它们、迭代它们，使其变得非常好。说“拥有一个好的系统提示词”可能是\
  \ AI 工程中最通用的建议。\n\n有几个公开仓库收集了知名 AI 代理使用的系统提示词示例。这些仓库通常汇总公开共享或公开讨论过的提示词。许多示例聚焦于编码代理，如\
  \ `Claude Code`、`Cursor` 和 `Devin`，但也可能包含其他代理风格系统的提示词。\n\n引用这些仓库的目的不是为了验证每个提示词的真实性，而是为了说明在实践中，大型、结构化且经过精心设计的系统提示词通常是什么样子。\n\
  \n本节的目标不是详细分析每个提示词或解释每种使用的技术。我们可以专门写一整本书或开一门课程来讲系统提示词。\n\n我的重点是向您展示系统提示词很重要。系统提示词在不断演进。随着\
  \ LLM 演进，系统提示词也随之演进。大量工程精力投入到了策划这些提示词并使其变得越来越好。这是一个迭代过程。\n\n## 编写系统提示词的最佳实践\n\n\
  让我们谈谈策划和编写系统提示词时的一些最佳实践。这就像给某人指路。\n\n如果我们说“往那边走”，他们会困惑，不知道该去哪里。但如果我们给他们一本 50 页的手册，里面有每一个可能的转弯和街道，我们用信息淹没了他们，他们仍然到不了需要去的地方。\n\
  \n所以，我们要清晰、具体，并给予刚好足够的信息让他们到达目的地。困难的部分在于找到那个最佳平衡点。\n\n### 系统提示词的“黄金区间”\n\n编写系统提示词时，我们要寻找\
  \ Anthropic 所谓的 **黄金区间**。不要太模糊，也不要太详细，恰到好处。\n\n您可以把这想象成一个刻度。在最左边，提示词太具体。在最右边，提示词太模糊。我们想要的正是正中间。\n\
  \n![Figure 1.5 – Goldilocks Zone for System Prompts](img/B37082_1_5.png)\n\nFigure\
  \ 1.5 – 系统提示词的黄金区间（来源：Anthropic, \"Effective Context Engineering for AI Agents,\"\
  \ https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents）\n\
  \n让我们细分分析。\n\n#### 过度具体提示词的问题\n\n在最左边，我们有非常具体的提示词。这里的核心问题是我们将 LLM 视为确定性状态机，而不是智能代理。我们硬编码逻辑。\n\
  \n例如，我们可能会说：如果用户意图是事故解决，问三个后续问题。*为什么恰好是三个？两个够不够？万一需要五个呢？*\n\n我们还看到穷举枚举，试图列出每一种可能的升级场景。这不可能完成，且强迫模型走预设路径，可能与实际输入不匹配。这也变成了维护噩梦，因为每个新边缘情况都需要修改提示词。\n\
  \n那时，如果一切都是预设的，也许我们甚至不需要自主代理。也许确定性工作流就足够了。\n\n#### 过度模糊提示词的问题\n\n在光谱的另一端，我们有非常模糊的提示词。这里的核心问题是它们为一致性行为提供的信号不足。\n\
  \n在这些提示词中，我们经常看到没有可执行的指导。例如，考虑以下提示词：\n\n> *你是一家面包店的助手。你应该以符合公司品牌原则和精髓的方式尝试解决客户的问题。如果需要，升级给人工。*\n\
  \n那些原则是什么？\n\n还有错误的共享上下文假设。提示词假设模型了解公司、品牌和客户服务规范，但实际上它并不了解。\n\n我们还看到未定义的边界，如“如果需要，升级给人工。”何时需要？模型无从得知。\n\
  \n没有系统地解决问题的框架或结构。这导致行为不一致，同一个问题在不同运行中产生截然不同的处理方式。本质上，提示词在说“做正确的事”，却不定义什么是“正确”。\n\
  \n#### 优秀的中间地带提示词长什么样\n\n现在看看中间地带。考虑以下示例：\n\n> *你是 Claude 面包店的客户支持代理。*\n>\n> *你专门协助客户处理订单和回答关于面包店的基本问题。使用可用工具高效且专业地解决问题。*\n\
  >\n> *你可以访问订单管理系统、产品目录和店铺政策。你的目标是在可能的情况下快速解决问题。在提出解决方案前，先通过理解完整情况开始，如果不理解，请提出后续问题。*\n\
  >\n> *响应框架：*\n>\n> 1. *识别核心问题 – 透过表面投诉，理解客户真正需要什么*\n> 2. *收集必要上下文 – 在响应前，使用可用工具验证订单详情、检查库存或审查政策*\n\
  > 3. *提供清晰解决方案 – 提供具有现实时间线的具体后续步骤*\n> 4. *确认满意度 – 确保客户理解解决方案，并知道如果需要如何跟进*\n>\n>\
  \ *指导原则：*\n>\n> *   *当存在多种解决方案时，选择最简单且能完全解决问题的一个*\n> *   *如果用户提到订单，在建议后续步骤前检查订单状态*\n\
  > *   *调用 `human assistance tool`*\n> *   *对于法律问题、健康/过敏紧急情况，或需要超出标准政策的财务调整的情况，调用\
  \ `human assistance tool`*\n> *   *察觉用户语气中的沮丧或紧迫感，并以适当的同理心回应*\n\n您可以看到以下几点：\n\n\
  *   这里我们首先提供清晰的身份和范围。这立即建立了边界。是客户支持，不是市场或销售。涵盖订单和基本问题，不涉及复杂业务运营。\n\n\n\n\n# Claude\
  \ Code 要点\n\n本章将通过演示其在实践中的工作方式，帮助您熟悉 Claude Code。我们不会直接跳入高级功能，而是从构建对系统本身的理解、它所使用的术语以及它与代码库交互的方式入手。在此过程中，您将看到\
  \ Claude Code 如何观察项目、构建上下文，并利用该上下文来协助编码任务。\n\n## 核心原则\n\n*   **我们也赋能而非限制。** 我们不规定在每种情况下必须使用的确切工具，而是定义一个目标，例如高效且专业的解决方案。这里的启发式方法是，我们信任代理在需要时选择合适的工具。\n\
  *   **我们也提供推理框架而非流程图。** 此处遵循一个四步响应框架：识别核心问题、收集必要上下文、提供清晰的解决方案、确认客户满意度。这种框架应适用于各种场景，而非僵化的分支逻辑。\n\
  *   **最后，我们也确立了清晰的边界和原则。** 例如，如果有多种解决方案，选择最简单的一个。这是一种启发式方法，而非规则，类似于计算机科学中的贪婪算法。\n\
  \n过于具体的提示词试图替 LLM 思考，且在情况不符合脚本时会失效。模糊的提示词则没有给 LLM 提供足够的工作素材。\n\n中庸的提示词利用了现代 LLM\
  \ 真正擅长的能力：识别模式并将通用原则应用于特定情境。它能很好地处理新情况，因为它教授的是原则而非规则。它很高效，因为它不浪费词汇。每条准则都涵盖多种场景。原则经过压缩，且不存在重叠或相互矛盾的指令。\n\
  \n# 摘要\n\n在本章中，我们介绍了上下文工程，并解释了为什么它对于构建可靠且可扩展的 AI 代理至关重要。我们探讨了上下文与静态提示词的区别、上下文的来源，以及为何不管理上下文会导致性能下降、幻觉和行为不一致等问题。以\
  \ Claude Code 为实际案例，我们探讨了四种核心上下文工程策略：通过持久化记忆写入上下文、动态选择相关上下文、压缩上下文以保持可控、以及使用专用子代理隔离上下文。我们还讨论了系统提示词的作用，展示了有效的提示词如何在过于僵化和过于模糊之间取得平衡。至此，您应该对现代\
  \ AI 代理如何管理上下文以及开发者和用户如何影响其行为有一定了解。在下一章中，我们将在此基础上进一步构建，开始处理更高级的代理工作流，使用 HookHub\
  \ 项目来探索 Claude Code 如何协调任务、管理上下文，以及超越简单的单步交互进行操作。\n\n在下一章中，我们将深入了解 Claude Code 及其与代码库的交互方式。\n\
