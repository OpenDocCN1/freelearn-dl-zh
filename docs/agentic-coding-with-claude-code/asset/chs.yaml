  \ `LangChain` 深度智能体等编排框架的内部结构。读完这部分，你将对高级智能体系统的工程实现有实践性和架构层面的理解。\n\n本部分包含以下章节：\n\
  \n* 第 9 章，*理解智能体技能*\n* 第 10 章，*使用 Claude Code Desktop*\n* 第 11 章，*理解深度智能体*\n\n#\
  \ 第 9 章\n\n# 理解智能体技能\n\n智能体技能由 Anthropic 团队于 2025 年 10 月引入，作为扩展 AI 智能体能力的一种机制。技能允许将能力打包为结构化单元，包括自定义工作流和特定任务指令，使智能体能够执行更复杂和协调的任务。通过封装定义好的行为，技能将智能体的成就扩展到了通用推理之外。`Claude`\
  \ 可以根据其描述字段与对话上下文的匹配情况，自动调用技能。\n\n\n\n\n# Agent 技能\n\n本章深入探讨 Agent 技能的概念，建立清晰的理解，明确它们是什么，以及为何在设计更强大的\
  \ Agent 系统时至关重要。\n\n本章通过层层递进的方式探索技能，从基础概念和在`Claude Code`等环境以及`LangChain DeepAgents`（[`docs.langchain.com/oss/python/deepagents/overview`](https://docs.langchain.com/oss/python/deepagents/overview)）等工具中的实际应用入手。随后我们将深入表层之下，分析调用技能时上下文在\
  \ Agent 内部如何流动，阐明系统的内部运作机制。最后，我们将通过在真实 Agent 中对技能的具体实现来整合这些视角。目标不仅是理解如何使用技能，还要掌握其底层设计与动机，从而获得全面且技术扎实的概念理解。\n\
  \n技能背后的核心概念是**渐进式披露**。技能不会永久加载到 Agent 的活动上下文中。相反，系统仅在技能与当前任务相关时才加载它。这种设计防止了不必要的指令进入工作上下文，有助于在推理过程中保持清晰。本章后面我们将探讨调用技能时这种动态加载是如何工作的，以及它如何影响\
  \ Agent 内部的上下文流动。\n\n本章将涵盖以下主题：\n\n*   Agent 技能的要点\n*   深入探究 Agent 技能\n*   Agent\
  \ 技能与其他 Agent 原语的对比\n\n# Agent 技能的要点\n\n在本节中，我们将见证 Agent 技能的实际运作，并演示如何将其作为工作流的一部分加以使用。我们将对比完成同一任务的两种方法：首先不使用技能，然后使用技能，以便清晰地观察\
  \ Agent 在每种情况下的行为表现。\n\n前往代码仓库并切换到`hookhub`分支，然后打开提交列表。选择标题为**improved hookcard\
  \ and hero with multi agent working**的提交。此提交将作为我们的起点。\n\n由于后续会添加更多提交，分支历史可能会向前推进。然而，我们必须从这个确切的提交开始。复制其哈希值，打开\
  \ IDE，并切换到该分支和提交：\n\n```\ngit switch project/hookhub c125545ca118f51c07eb6defe61ba727dbf05788\n\
  ```\n\n切换后，会出现一个新的`hookhub`目录。该目录包含前几节开发的所有代码。\n\n进入该目录并安装依赖：\n\n```\ncd hookhub\n\
  npm install\n```\n\n安装完成后，启动开发服务器：\n\n```\nnpm run dev\n```\n\nHookHub 应用现已在端口`3000`上本地运行。这恢复了演示所需的确切基准环境。\n\
  \n![Figure 9.1 – HookHub running locally](img/B37082_9_1.png)\n\n图 9.1 – HookHub\
  \ 在本地运行\n\n## 场景 1：不使用技能进行样式设计\n\n*图 9.1*所示的 UI 有意保持简洁。假设我们希望 HookHub 应用采用特定的视觉形象，并完全匹配\
  \ Anthropic 的设计语言。\n\n不使用技能时，我们可以直接提示：\n\n```\nMake this web app Anthropic style.\n\
  ```\n\n此时，代码仓库中不包含任何关于 Anthropic 品牌指南的参考。Agent 会扫描项目文件，甚至从[anthropic.com](https://anthropic.com)获取信息。它从实时网站动态推导设计语言并开始实施更改。\n\
  \n这种方法行之有效。Agent 更新背景颜色、调整排版并应用视觉优化。最终结果非常接近 Anthropic 的美学风格，展现了令人印象深刻的能力。\n\n然而，请考虑其影响。每次重复此任务时，Agent\
  \ 都会再次获取并推导相同的设计语言。如果我们重复执行此工作流，每次都会重新引入冗余的上下文收集过程。\n\n一种可能的解决方案是将设计语言直接嵌入`CLAUDE.md`文件。问题在于，该上下文随后会附加到每一个提示中，包括与之无关的后端任务。这会导致不必要的上下文膨胀并最终引起性能下降。\n\
  \n## 场景 2：使用技能进行样式设计\n\n技能提供了一个更优雅的解决方案。我们可以创建一个指定 Anthropic 主题设计语言的技能。每当我们处理前端工作时，`Claude\
  \ Code`即可选择该技能、加以使用，并动态加载所需的设计上下文。让我们看看具体操作方法。\n\n打开官方 Anthropic 示例技能仓库（[`github.com/anthropics/skills`](https://github.com/anthropics/skills)）。每个技能位于各自的目录中。导航到`brand‑guidelines`技能并检查其`SKILL.md`文件。\n\
  \n本章中的部分示例改编自 Anthropic Skills 仓库（[`github.com/anthropics/skills`](https://github.com/anthropics/skills)），遵循\
  \ Apache License 2.0 许可证。实现和行为可能会随时间演变。\n\n一个技能可能包含多个文件，不仅限于 Markdown。它可以包含脚本、可执行文件和结构化资源。在本例中，`SKILL.md`文件定义了\
  \ Anthropic 的官方品牌颜色、排版和设计资产。\n\n该文件以前言开头。仅此部分在技能被选中时注入 Agent 系统提示词。Markdown 文件的其余部分包含详细的品牌指南，仅在技能被激活时才加载到提示词中。\n\
  \n这反映了我们之前通过子代理探索的选择性加载机制。上下文是有条件地注入，而非全局注入。\n\n来自官方`Claude Code`市场的技能在启动时若有新的上游版本可用会自动更新。第三方市场技能可能需要手动更新，或通过`/plugin`进行显式的自动更新配置。\n\
  \n### 在 Claude Code 中安装技能\n\n要为我们的编码 Agent 装备这些技能，请将 Anthropic 技能仓库作为市场插件添加：\n\n\
  ```\n/plugin add marketplace anthropic/skills\n```\n\n`Claude Code`会将仓库本地克隆到`.claude/plugins`目录中。\n\
  \n运行`/plugins`验证安装。浏览可用插件。出现两个类别：\n\n*   **文档技能**，包含 Excel 和 PowerPoint 等文档处理能力\n\
  *   **示例技能**，包含前面回顾的品牌指南技能\n\n一个值得注意的细节是，当`Claude`（而非`Claude Code`）推出创建幻灯片和文档的支持时，是与技能一同宣布的。这是因为那些功能在内部正是使用\
  \ Agent 技能构建的。换句话说，生成文档和演示文稿的能力由我们在此讨论的相同技能机制提供支持。\n\n安装示例技能。安装后，重启`Claude Code`并询问以下内容：\n\
  \n```\nWhich skills do you have?\n```\n\nAgent 现在会列出可用技能，包括我们接下来将使用的`brand‑guidelines`。\n\
  \n![Figure 9.2 – Claude listing installed skills, including brand-guidelines](img/B37082_9_2.png)\n\
  \n图 9.2 – Claude 列出已安装技能，包括 brand-guidelines\n\n### 启用技能进行样式设计\n\n清除上下文并启动一个全新的`Claude`实例。询问以下内容：\n\
  \n```\nCan you make sure that the logo is according to Anthropic brand?\n```\n\n\
  Agent 扫描代码仓库，随后请求使用`brand‑guidelines`技能的权限。技能描述随即显示。批准其使用。\n\n批准后，`Claude`将`brand‑guidelines`目录动态加载到上下文中。仅相关的\
  \ Markdown 文件被注入。这一额外上下文使 Agent 能够根据官方品牌定义应用设计变更。\n\n\n\n关键观察在于此上下文是动态加载的。它不会永久附加到每个提示词上。这种渐进式上下文加载保持了工作上下文窗口的整洁与高效。此过程也称为渐进式披露。\n\
  \n如果你希望仅通过斜杠命令调用技能，请在技能前置元数据中启用 `disable‑model‑invocation: true` 标志。\n\n应用更改后，运行构建流程：\n\
  \n```\nnpm run build\n```\n\n然后，重启开发服务器：\n\n```\nnpm run dev\n```\n\n更新后的设计现应呈现细微的优化，包括排版调整和品牌对齐的样式。此处的主要目标并非视觉差异，而是展示通过技能实现的受控上下文注入。\n\
  \n![图 9.3 – 通过技能应用品牌指南样式后的 HookHub 界面](img/B37082_9_3.png)\n\n图 9.3 – 通过技能应用品牌指南样式后的\
  \ HookHub 界面\n\n技能不限于静态 Markdown 上下文。部分技能包含可执行脚本。\n\n以 `skill‑creator` 为例。其目录包含多个\
  \ Python 脚本。在相应的 `SKILL.md` 中，智能体被告知可以执行这些脚本。\n\n脚本可用 Python、Bash、JavaScript 或环境支持的任意语言编写。只要在技能定义中清晰描述其行为，智能体即可将其作为确定性工具使用。\n\
  \n这种方法支持结构化工作流。若特定流程可编码为确定性脚本，则可通过技能将其组合为高阶能力。智能体继而可执行脚本序列并组合其输出，以完成复杂任务。\n\n# 深入探究智能体技能\n\
  \n本节我们将通过引入**自定义技能**，深入探究智能体技能。我们还将回顾一种技能，它不仅包含 `SKILL.md` 文件，还包含智能体可执行以协助完成任务的**辅助脚本**。\n\
  \n我们要考察的技能托管在一个在线仓库中。我们将下载它、在本地集成，随后通过修改和改进来迭代它，以契合我们的需求。这一过程演示了技能在设计结构化智能体工作流时所提供的灵活性。\n\
  \n## 探索 Claude 技能市场\n\n我们从一个名为 `claude‑skills‑marketplace` ([`github.com/mhattingpete/claude-skills-marketplace/tree/main`](https://github.com/mhattingpete/claude-skills-marketplace/tree/main))\
  \ 的仓库开始，该仓库基于 Apache 2.0 许可证发布。这是包含 Claude Code 技能的众多仓库之一，这些技能可被下载并集成到 Claude Code\
  \ 或任何其他支持技能的智能体中，例如 Claude Desktop 或 LangChain DeepAgents。\n\n该仓库包含多个可安装的技能。正如上一节所示，它甚至可通过插件系统作为市场添加到\
  \ Claude Code 中。\n\n在 `Engineering Workflows`（工程工作流）文件下，我们找到了一个名为 `git‑pushing`\
  \ 的技能。该技能旨在协助将代码推送到 GitHub。\n\n````\nApache License\nVersion 2.0, January 2004\n\
  http://www.apache.org/licenses/\n---\nname: git-pushing\ndescription: Stage, commit,\
  \ and push git changes with conventional commit messages. Use when user wants to\
  \ commit and push changes, mentions pushing to remote, or asks to save and push\
  \ their work. Also activates when user says \"push changes\", \"commit and push\"\
  , \"push this\", \"push to github\", or similar git workflow requests.\n---\n\n\
  # Git Push Workflow\n\nStage all changes, create a conventional commit, and push\
  \ to the remote branch.\n\n## When to Use\n\nAutomatically activate when the user:\n\
  - Explicitly asks to push changes (\"push this\", \"commit and push\")\n- Mentions\
  \ saving work to remote (\"save to github\", \"push to remote\")\n- Completes a\
  \ feature and wants to share it\n- Says phrases like \"let's push this up\" or \"\
  commit these changes\"\n\n## Workflow\n\n**ALWAYS use the script** - do NOT use\
  \ manual git commands:\n\n```bash\n\nbash skills/git-pushing/scripts/smart_commit.sh\n\
  \n```\n\nWith custom message:\n```bash\n\nbash skills/git-pushing/scripts/smart_commit.sh\
  \ \"feat: add feature\"\n\n```\nScript handles: staging, conventional commit message,\
  \ Claude footer, push with -u flag\n````\n\n打开该技能的 `SKILL.md` 文件，可见如下描述：\n\n*  \
  \ 使用规范提交信息暂存、提交并推送 Git 变更\n*   当用户想要提交并推送变更、提及推送到远程或要求保存工作时使用\n\n文件顶部的 YAML 前置元数据是唯一加载到\
  \ Claude Code 智能体系统提示词中的部分。文件其余部分仅在技能被选中执行时读取。\n\n### 技能中的既定工作流\n\n在 `SKILL.md`\
  \ 的工作流部分，我们看到智能体被指示始终使用名为 `smart_commit.sh` 的脚本。\n\n````\nApache License\nVersion\
  \ 2.0, January 2004\nhttp://www.apache.org/licenses/\n---\nname: git-pushing\ndescription:\
  \ Stage, commit, and push git changes with conventional commit messages. Use when\
  \ user wants to commit and push changes, mentions pushing to remote, or asks to\
  \ save and push their work. Also activates when user says \"push changes\", \"commit\
  \ and push\", \"push this\", \"push to github\", or similar git workflow requests.\n\
  ---\n\n# Git Push Workflow\n\nStage all changes, create a conventional commit, and\
  \ push to the remote branch.\n\n## When to Use\n\nAutomatically activate when the\
  \ user:\n- Explicitly asks to push changes (\"push this\", \"commit and push\")\n\
  - Mentions saving work to remote (\"save to github\", \"push to remote\")\n- Completes\
  \ a feature and wants to share it\n- Says phrases like \"let's push this up\" or\
  \ \"commit these changes\"\n\n## Workflow\n\n**ALWAYS use the script** - do NOT\
  \ use manual git commands:\n\n```bash\n\nbash skills/git-pushing/scripts/smart_commit.sh\n\
  \n```\n\nWith custom message:\n```bash\n\nbash skills/git-pushing/scripts/smart_commit.sh\
  \ \"feat: add feature\"\n\n```\nScript handles: staging, conventional commit message,\
  \ Claude footer, push with -u flag\n````\n\n该脚本包含实际的 Git 逻辑，包括 `git add`、`git status`\
  \ 和 `git commit` 操作。技能作者有意限制主智能体发出原始 Git 命令。取而代之，智能体必须使用指定脚本。\n\n这阐释了一个核心概念。技能编码的是既定工作流。若团队希望提交遵循特定结构或流程，可将该逻辑打包进技能。智能体随即以受控方式获得该能力。\n\
  \n## 审查脚本\n\n在 `scripts` 目录中，我们找到了 `smart_commit.sh`。该脚本定义了 Git 执行流程。智能体仅在决定使用 `git‑pushing`\
  \ 技能时才能运行此脚本。\n\n此脚本包含实际执行逻辑。它运行一系列 Git 命令，如暂存变更、检查状态、使用特定信息提交。主智能体在使用 `git‑pushing`\
  \ 技能时预期运行此脚本。关键在于，智能体仅在决定使用该技能后才知晓此脚本。脚本仅在技能被选中后成为可用上下文的一部分。\n\n与我们之前见到的品牌指南技能相比，此技能不仅提供参考内容。它包含智能体可执行以协助完成任务的**辅助脚本**，此处任务即提交并推送代码到\
  \ GitHub。\n\n这种脚本运行能力赋予了我们极大灵活性。若我们有想要以代码形式确定性定义的工作流，可将其打包进技能。智能体随后可将运行这些脚本作为完成工作流的一部分，而非即兴发出一系列手动命令。\n\
  \n尽管这可能类似于 MCP，但机制不同。MCP 实现 API 调用和与外部服务的通信。技能则通过注入结构化上下文并可选暴露脚本来运作。\n\n## 创建项目级自定义技能\n\
  \n\n\n# 切换到 `project/skills` 分支\n\n要创建项目级技能，我们需要在 `.claude` 目录下定义它，使其作用域限定在该仓库内。\n\
  \n创建以下结构：\n\n```\n.claude/\n  skills/git-pushing/\n    scripts/\n      smart_commit.sh\n\
  \    SKILL.md\n```\n\n结构如下所示：\n\n![图 9.4 – git-pushing 技能的本地技能目录结构](img/B37082_9_4.png)\n\
  \n**图 9.4 – git-pushing 技能的本地技能目录结构**\n\n这与市场技能的结构相同。\n\n将 GitHub 仓库中 `SKILL.md`\
  \ 和 `smart_commit.sh` 的内容复制到对应的本地文件中。`SKILL.md` 文件引用了 `scripts/smart_commit.sh`，因此保持相同的目录结构可确保兼容性。\n\
  \n此时，技能已在本地完全复刻。\n\n![图 9.5 – 引用 smart_commit.sh 自动化脚本的本地 SKILL.md](img/B37082_9_5.png)\n\
  \n**图 9.5 – 引用 smart_commit.sh 自动化脚本的本地 SKILL.md**\n\n虽然本可通过插件系统安装，但手动复制能提供对定制的完全控制。\n\
  \n## 使用自定义技能\n\n从项目目录打开 Claude Code 会话并添加以下提示词：\n\n```\nList available skills.\n\
  ```\n\n新创建的项目级 `git-pushing` 技能将与先前安装的市场技能一同显示。\n\n输入以下内容：\n\n```\npush changes\n\
  ```\n\nClaude 将询问是否使用 `git-pushing` 技能。批准后，它会加载 `SKILL.md` 并确定必须执行 `smart_commit.sh`。\n\
  \nAgent 不会发出单独的 Git 命令，而是运行该脚本。在某些情况下，脚本可能因 Git 错误而失败。若发生这种情况，Claude 不会停止，而是回退到其默认推理模式。它会分析仓库状态，建议运行\
  \ `git add -A`，使用自己的逻辑创建提交，然后手动推送变更。\n\n这意味着 Claude 能利用其默认行为解决问题并完成推送。这一点很重要，因为技能并不取代\
  \ Agent 的推理能力。当技能失败时，Claude 能回退到默认行为并继续任务。\n\n如果脚本执行失败，生成的提交将不是通过技能产生的，而是通过 Claude\
  \ 的默认行为产生的。这一区别很重要。技能提供结构化工作流，但不会剥夺 Agent 的通用推理能力。如果脚本化工作流失败，Agent 仍可尝试利用其基础能力恢复并完成任务。\n\
  \n澄清这一点后，我们现在可以着手定制技能行为本身。\n\n### 编辑技能行为\n\n在 `SKILL.md` 的 `When to Use`（使用时机）部分添加一个额外的触发短语，例如\
  \ `\"push to remote\"`。\n\n```\n ## When to Use\n\nAutomatically activate when the\
  \ user:\n- Explicitly asks to push changes (\"push this\", \"commit and push\",\
  \ \"push to remote\")\n- Mentions saving work to remote (\"save to github\", \"\
  push to remote\")\n- Completes a feature and wants to share it\n- Says phrases like\
  \ \"let's push this up\" or \"commit these changes\"\n```\n\n结束 `---` 分隔符上方的所有内容均为\
  \ YAML 前言，会被注入到 Agent 的系统提示词中。分隔符下方的内容仅在技能被激活时加载。\n\n```\n---\nname: git-pushing\n\
  description: Stage, commit, and push git changes with conventional commit messages.\
  \ Use when user wants to commit and push changes, mentions pushing to remote, or\
  \ asks to save and push their work. Also activates when user says \"push changes\"\
  , \"commit and push\", \"push this\", \"push to github\", or similar git workflow\
  \ requests.\n---\n\n# Git Push Workflow\n\nStage all changes, create a conventional\
  \ commit, and push to the remote branch.\n\n## When to Use\n\nAutomatically activate\
  \ when the user:\n- Explicitly asks to push changes (\"push this\", \"commit and\
  \ push\", \"push to remote\")\n- Mentions saving work to remote (\"save to github\"\
  , \"push to remote\")\n- Completes a feature and wants to share it\n- Says phrases\
  \ like \"let's push this up\" or \"commit these changes\"\n```\n\n为什么会这样？我们编辑了 `SKILL.md`\
  \ 内的 `When to Use` 部分并添加了 `\"push to remote\"` 短语。然而，该部分并不属于 YAML 前言。\n\n只有文件顶部的\
  \ YAML 前言会在每次请求时被注入到 Agent 的系统提示词中。除非技能已被选中，否则分隔符下方的所有内容对 Agent 不可见。\n\n这意味着我们所做的修改完全不会影响技能选择决策。\n\
  \n现在我们清除上下文以确保会话全新，并输入以下内容：\n\n```\npush to remote\n```\n\nClaude 仍会询问是否使用 `git-pushing`\
  \ 技能。这并非因为我们添加的短语。而是因为原始前言已将该技能描述为处理提交和推送操作。`\"push to remote\"` 的意图在语义上足够接近前言中已涵盖的\
  \ `\"push changes\"` 或 `\"push to GitHub\"`。\n\n因此，这里发生的情况非常重要。\n\n技能选择完全由前言驱动。Agent\
  \ 根据该 YAML 块中的 `name` 和 `description` 字段匹配用户意图。文件的其余部分在选择阶段不起任何作用。\n\n只有技能被选中后，Claude\
  \ 才会加载 `SKILL.md` 的其余部分，包括工作流指令和脚本引用。\n\n这就是**渐进式披露模型**：\n\n1.  Agent 始终看到前言。\n\
  2.  基于前言，它决定是否激活技能。\n3.  只有那时，它才会加载完整的技能上下文和任何辅助指令。\n\n这就是为什么我们的修改是多余的。它被放置在了不参与选择过程的文件部分之外。\n\
  \n澄清这一点后，让我们继续修改脚本本身的行为。\n\n### 启用自动技能批准\n\n既然我们了解了技能选择的工作原理，请考虑以下场景。\n\n如果技能触发正确，但每次使用时\
  \ Claude 都会暂停并请求批准才执行脚本，该怎么办？\n\n在这种情况下，尽管工作流封装在技能内，我们仍引入了摩擦。每次提交和推送操作都需要手动确认。如果目标是创建一个流畅、有主见的工作流，重复的提示将违背初衷。\n\
  \n因此，下一步合乎逻辑的做法是改变的不是技能的*选择方式*，而是其*执行方式*。如果允许技能无需每次询问权限即可运行，会怎样？\n\n确认技能触发正确后，选择允许\
  \ Claude Code 在无需每次询问批准的情况下使用此技能的选项。\n\n执行此操作时，Claude 会更新 `settings.local.json`。\n\
  \n这很关键。\n\n实际改变的不是技能本身。技能定义保持不变。取而代之的是，Claude 更新了本地配置，以便在选择该特定技能时，可无需交互式确认即可执行。\n\
  \n这意味着涉及两个独立的权限：\n\n*   激活技能的权限\n*   执行技能内定义脚本的权限\n\n通过启用自动批准，我们消除了在未来运行中手动确认这两个步骤的需求。\n\
  \n现在，当我们运行 `\"push to remote\"` 时，Claude 将立即加载技能并执行 `smart_commit.sh` 而无提示。技能内定义的工作流将实现全自动化。\n\
  \n脚本成功运行后，我们检查生成的提交。\n\n![图 9.6 – 由 smart_commit.sh 自动化脚本生成的提交信息](img/B37082_9_6.png)\n\
  \n**图 9.6 – 由 smart_commit.sh 自动化脚本生成的提交信息**\n\n如你所见，提交信息极简。它仅报告更新了特定数量的文件。\n\n\
  这并非 AI 生成的信息。\n\n\n\n如果我们检查 `smart_commit.sh`，会发现提交信息是使用静态逻辑构建的。它统计修改过的文件数量，并将该数字插入到一个预定义的信息模板中。脚本内部没有调用\
  \ Claude。因此，尽管工作流被包装在一个技能中，但该工作流的智能水平完全由脚本的实现决定。这是一个重要的区别。**技能并不自动意味着 AI 驱动的逻辑**。技能只是一种打包机制。它可以包含确定性脚本、AI\
  \ 调用，或两者兼有。\n\n目前，我们的工作流是确定性且简单的。所以，我们要改进它。\n\n## 修改脚本以使用 Claude CLI\n\n我们现在请求 Claude\
  \ 编辑 `smart_commit.sh`，使其调用 Claude CLI 来生成提交信息。\n\n提示词如下：\n\n```\ncan u please edit\
  \ @.claude/skills/git-pushing/scripts/smart_commit.sh to use Claude Code cli to\
  \ create the commit message like a pirate?\n```\n\n这将改变工作流的性质。\n\n以前，脚本使用静态 shell\
  \ 逻辑生成提交信息。\n\n现在，它执行以下操作：\n\n1.  脚本应使用提示词调用 `claude -p`。`-p` 标志以提示模式运行 Claude：它发送查询，将响应打印到\
  \ `stdout`，然后退出。\n2.  Claude CLI 将动态生成提交信息。\n3.  脚本将在 `git commit` 命令中使用该输出。\n\n\
  我们在这里创建了一个分层系统：\n\n1.  主 Claude Code 代理选择技能。\n2.  技能运行 `smart_commit.sh`。\n3.  脚本本身调用\
  \ Claude CLI。\n4.  Claude CLI 生成提交信息。\n5.  脚本完成提交和推送。\n\n这就是组合。技能协调确定性执行。脚本协调 AI\
  \ 调用。AI 调用生成结构化输出。脚本消费该输出。\n\n我们可以运行以下命令：\n\n```\npush to remote\n```\n\n我们现在可以在提交信息中看到海盗风格的语言。\n\
  \n![Figure 9.7 – Skill invoking the Claude CLI to generate an AI commit message](img/B37082_9_7.png)\n\
  \nFigure 9.7 – Skill invoking the Claude CLI to generate an AI commit message\n\n\
  这证实了脚本成功在内部调用了 Claude CLI。\n\n因此，我们已经从静态工作流转移到了混合确定性和 AI 工作流。\n\n## 破坏预期结构\n\n现在，如果目录结构不再与技能预期的一致，会怎样？为了探究这一点，请考虑此场景。我们回到\
  \ IDE 并有意破坏结构。我们将 `smart_commit.sh` 脚本从 `scripts` 目录移动到 `git-pushing` 目录的根目录。然后，我们完全删除\
  \ `scripts` 目录。\n\n此时，结构不再与 `SKILL.md` 指定的内容匹配。技能定义期望脚本位于 `skills/git-pushing/scripts/`\
  \ 下，但文件现在直接位于 `skills/git-pushing/` 下。这创建了一个不一致的设置。技能中描述的路径不再准确，且仓库结构在技术上现在是不正确的。\n\
  \n### 在结构不匹配后执行技能\n\n清除上下文以确保一个全新的会话。\n\n然后，输入以下内容：\n\n```\npush to remote\n```\n\
  \nClaude Code 选择 `git-pushing` 技能并继续执行脚本。\n\n即使目录结构不再与 `SKILL.md` 中描述的路径匹配，脚本仍然成功运行。\n\
  \n![Figure 9.8 – Running the git-pushing skill after modifying the directory structure](img/B37082_9_8.png)\n\
  \nFigure 9.8 – Running the git-pushing skill after modifying the directory structure\n\
  \n这种行为很重要。技能之所以仍能工作，是因为技能最终将上下文和指令注入代理。即使 `SKILL.md` 内部的路径引用不准确，代理也会推理仓库结构并在新位置找到\
  \ `smart_commit.sh`。不匹配并未阻止执行。代理解析运行 `smart_commit.sh` 的指令，搜索项目，找到文件，并执行它。\n\n因此，即使破坏了声明的结构，工作流仍然成功完成。\n\
  \n但为什么技能仍然有效？\n\n之所以有效，是因为技能不是绑定到确切文件路径的刚性绑定。它们提供上下文指令。即使上下文包含不准确的路径，代理也能通过检查项目结构来解析它。执行之所以成功，是因为文件仍然存在于仓库中的某个位置。代理进行了适应。\n\
  \n现在考虑一个略微不同的场景。如果 `smart_commit.sh` 被完全删除会怎样？\n\n此时，没有文件供代理定位。工作流无法执行，因为所需的工件不再存在。这说明了边界：如果结构不一致但文件存在，代理可以恢复。如果文件不存在，执行就会失败。\n\
  \n## 在隔离的子代理上下文中运行技能\n\n默认情况下，技能在当前对话上下文中运行。但是，可以通过设置以下内容在隔离的子代理上下文中执行它：\n\n```\n\
  ---\ncontext: fork\nagent: Explore\n---\n```\n\n当 context 设置为 fork 时，Claude 在单独的执行分支中运行技能。这将中间推理和工具使用与主对话隔离开来。\n\
  \nagent 字段决定哪种子代理类型处理执行（例如，Explore 或 Plan）。\n\n为了确保技能仅通过斜杠命令（例如，`/skill-name`）触发，而不被\
  \ Claude Code 自动调用，请在前置元数据中添加 `disable-model-invocation: true`。\n\n# 将代理技能与其他代理基元进行比较\n\
  \n在本节中，我们将代理技能与其他代理基元进行比较，例如 MCP、子代理、记忆和斜杠命令。比较重点关注上下文管理、上下文工程和执行流程。\n\n## 代理技能与\
  \ MCP\n\n代理技能和 MCP 服务器都是现代代理工具包中的重要工具，但它们解决不同的问题，并在上下文架构的不同层面上运行。代理技能是程序性知识容器。它们是包含指令、脚本和资源的文件夹，用于教导\
  \ AI 代理如何一致地执行专门任务。**一致性**是关键思想。通过代理技能，我们打包一个工作流并将其交给代理，以便它以预定义的方式执行任务。从上下文工程的角度来看，技能基于渐进式披露。\n\
  \n当与编码代理（或任何支持技能的代理）的会话开始时，代理仅加载可用技能的简短描述和名称。此阶段的上下文成本很低。通常，无论技能内部多么复杂，每个技能消耗约 100\
  \ 到 200 个 token。\n\n当技能与任务相关时（此决定由代理做出），从 `SKILL.md` 文件衍生出的完整指令会被加载到上下文中。只有当技能被主动使用且代理决定执行脚本时，该脚本才会被加载。如果技能包含多个脚本，未被使用的脚本不会被加载到上下文中。由于这种渐进式加载机制，技能具有很高的上下文效率。\n\
  \n现在考虑 MCP。在 MCP 架构中，工具定义和服务器规范在对话开始时预先配置。这影响上下文效率。例如，五个 MCP 服务器可能在发送第一个提示词之前就消耗\
  \ 50,000 个 token。\n\nMCP 解决不同的问题。它将代理连接到外部资源。这是 MCP 服务器的目的。\n\n技能解决不同的问题。它们赋予代理以一致的方式执行专门任务的能力。\n\
  \n因此，虽然两者都是代理基元，但它们处理系统的不同层面。\n\n### 调用和执行差异\n\n\n\n技能和 MCP 工具都是基于智能体的判断来调用的。智能体会根据各自的描述决定是使用技能还是\
  \ MCP 工具。\n\n因此，调用机制是相似的。在两种情况下，智能体都会评估该能力是否与任务相关。\n\n一个有趣的实验是将同一个能力实现两次：一次作为技能，一次作为由\
  \ MCP 服务器暴露的 MCP 工具。观察智能体在实践中选择哪一个，将揭示它是如何对这些基元进行推理的。\n\n然而，执行方式有所不同。对于 MCP，执行发生在\
  \ MCP 服务器内部。服务器可以在本地运行，也可以部署在云端。对于技能，执行通常发生在主智能体线程的本地环境中。技能中定义的脚本作为智能体主要执行流的一部分来执行。但是，如果技能前置元数据指定了\
  \ `context: fork`，则技能会在隔离的子智能体上下文中运行，而不是在主智能体中。\n\n在推理架构时，这种执行位置的区别非常重要。\n\n## 智能体技能与子智能体\n\
  \n智能体技能与子智能体的相似之处在于，它们都允许我们为特定任务定义专门的指令。技能包含结构化指令和可选脚本。子智能体也可以定义自己的指令。\n\n关键区别在于上下文隔离。子智能体在其自己隔离且全新的上下文窗口中运行。它们非常适合长时任务，否则这些任务会显著扩展主智能体的上下文窗口。相比之下，技能在智能体的主上下文中运行。当调用技能时，其指令会被加载到现有的上下文窗口中，而不是一个单独的窗口。\n\
  \n技能和子智能体都是由主智能体调用的。主智能体决定是将任务委托给子智能体，还是使用技能来执行。\n\n在灵活性和控制方面，子智能体提供了更多的灵活性。使用子智能体时，系统提示词可以动态调整并针对特定需求进行定制。而使用技能时，系统提示词保持为主智能体的提示词，这通常由供应商管理，不易修改。\n\
  \n作为经验法则，请注意以下几点：\n\n*   如果任务繁重且有膨胀主上下文窗口的风险，子智能体是合适的选择。\n*   如果目标是赋予智能体自动专业知识或为重复性任务强制执行特定方法论，技能是更好的选择。\n\
  \n两者都是有价值的基元，但它们在不同的上下文和执行模型下运行。默认情况下，技能在主智能体内联运行，而子智能体在隔离的上下文中执行。然而，技能可以指定 `context:\
  \ fork`，这使其在类似子智能体的轻量级隔离上下文中运行，尽管配置控制较少。\n\n为了将技能和子智能体置于更广泛的 Claude Code 模型中，下表将它们与\
  \ MCP 服务器和斜杠命令进行了比较。\n\n| **维度** | **技能** | **MCP** | **子智能体** | **斜杠命令** |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| **目的** | 标准化任务执行方式 | 连接外部服务 | 将工作委托给隔离智能体 | 用户触发的快捷方式\
  \ |\n| **上下文加载** | 先加载前置元数据，使用时加载完整内容 | 会话开始时加载工具 | 每次运行全新上下文 | 注入完整提示词 |\n| **触发方式**\
  \ | 智能体决策 | 智能体决策 | 智能体委托 | 用户运行 `/command` |\n| **执行位置** | 主智能体线程 | MCP 服务器（本地或远程）\
  \ | 隔离的子智能体上下文 | 主智能体线程 |\n| **上下文隔离** | 共享主上下文 | 外部执行 | 完全隔离 | 共享主上下文 |\n| **脚本支持**\
  \ | 是 | 否 | 是 | 否 |\n| **失败处理** | 智能体回退到推理 | 智能体处理服务器错误 | 主智能体重试或适应 | 无 |\n| **最佳用例**\
  \ | 可重复的工作流 | 外部 API 或服务 | 长时任务 | 快速操作 |\n| **上下文效率** | 高（懒加载） | 低（工具预先加载） | 高（工作卸载）\
  \ | 低（每次全量提示词） |\n| **定制化** | 完全控制 | 服务器定义 | 灵活 | 有限 |\n\n表 9.1 – 智能体基元对比\n\n# 总结\n\
  \n在本章中，我们从实践和架构两个角度探讨了智能体技能。我们首先通过直接提示智能体与使用技能封装结构化行为的实操对比，理解了智能体技能的核心要义。通过 HookHub\
  \ 示例，我们观察到技能如何实现渐进式上下文加载，使智能体能在需要时动态注入仅相关的指令，而非膨胀主上下文窗口。随后我们通过创建自定义项目级技能、集成辅助脚本、修改其行为，甚至增强其以调用\
  \ Claude CLI，进行了更深入的探索。这让我们看到技能如何打包固化的工作流，将确定性执行与 AI 生成输出相结合，并在脚本失败时仍允许回退行为。最后，我们通过将技能与\
  \ MCP 和子智能体对比，将其置于更广泛的智能体领域中，阐明了每个基元在上下文架构、执行流和控制方面的运作方式。\n\n我们不仅掌握了使用技能的能力，还建立了清晰的内部运作心智模型，明确了在设计更强大、更上下文高效的智能体系统时何时应用它们。\n\
  \n在下一章中，我们将学习如何在桌面应用程序中使用 Claude Code。\n\n# 获取本书的 PDF 副本、代码包等\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![Image](img/B37082_9_9.png)\n\n![Image](img/B37082_9_10.png)\n\n> **注意：** 请准备好发票。直接从\
  \ Packt 网站购买不需要发票。\n\n# 10\n\n# 使用 Claude Code 桌面版\n\n在本章中，您将学习如何在 Claude 桌面应用程序中使用\
  \ Claude Code，在本地模式和云模式之间切换，并使用 Git Worktrees 并行运行多个编码智能体。您将了解如何协调独立的功能分支、管理后台智能体，并将独立开发的变更合并到单一代码库中。\n\
  \n本章的目标是展示如何使用 Claude Code 在本地和云环境中编排并行开发。\n\n这很重要，因为它将开发从顺序的单线程工作转变为协调的多智能体工作流，使您能够扩展生产力，更快、更高效地构建功能。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   介绍 Claude Code 桌面集成与后台智能体\n*   运行模式：本地与云端\n*   编排并行的本地和云智能体\n\
  *   理解 Claude Code 中的 Git Worktrees\n*   合并并行功能分支\n*   通过移动端在云端运行 Claude Code\n\n\
  ## 介绍 Claude Code 桌面集成与后台智能体\n\n在本节中，我们将探讨 Claude Code 桌面集成。Anthropic 已将 Claude\
  \ Code 直接集成到 Claude 桌面应用程序和移动应用程序中，使开发任务和日常对话推理能在同一环境中进行。这减少了上下文切换的摩擦，实现了更流畅的工作流。除此之外，该集成还提供了开箱即用的基于云的后台智能体，直接在\
  \ Claude 中运行。\n\n![图 10.1 – Claude 桌面仓库选择界面](img/B37082_10_1.png)\n\n图 10.1 – Claude\
  \ 桌面仓库选择界面\n\n\n\n\n# 后台代理与并行开发\n\n后台代理使得多个功能能够并发开发，而非顺序开发。在准备本演示时，这种工作流转变的影响立即变得清晰。无缝桌面集成与后台代理的结合，创造了一种与以往设置截然不同的开发体验。\n\
  \n此处演示的工作流涉及多个同时进行的操作，逐步跟进并不现实。取而代之的是，目标是专注于概念，并观察集成在实践中如何运作。重点在于理解这些能力如何结合以提升生产力，并重塑我们构建功能的方式。\n\
  \n# Claude Code 安装与运行模式：本地与云端\n\nClaude Desktop 应用包含一个 **Code** 标签页，可通过图形界面运行 `Claude\
  \ Code`。它们共享相同的底层引擎和配置（`CLAUDE.md`、MCP 服务器、钩子等）。\n\n以下屏幕截图显示了带有 **Code** 标签页的 Claude\
  \ Desktop 界面。\n\n![Figure 10.2 – Claude Desktop Code tab interface](img/B37082_10_2.png)\n\
  \n**图 10.2 – Claude Desktop Code 标签页界面**\n\n打开 **Code** 标签页后，`Claude Code` 工作区随即出现，允许你选择项目文件夹并开始与代码库交互。\n\
  \n![Figure 10.3 – Claude Code workspace in Claude Desktop](img/B37082_10_3.png)\n\
  \n**图 10.3 – Claude Desktop 中的 Claude Code 工作区**\n\n## 选择工作区文件夹（本地工作树模式）\n\n在开始任何工作前，请先选择一个文件夹。该文件夹将成为\
  \ `Claude Code` 操作的工作区。在大多数情况下，此文件夹包含一个代码仓库，最好是 GitHub 仓库。\n\n此处的重要细节是我们选择的是一个*文件夹*。\n\
  \n当工作方式设置为 **Local worktree（本地工作树）** 时，`Claude Code` 会在本地机器上启动 Git 工作树（稍后讨论）。所有操作均在本地进行。此模式下无任何内容在云端运行。\n\
  \n由于工作在本地机器上进行，`Claude Code` 需要一个目录来创建和管理这些工作树。这就是我们提供文件夹位置的原因，它将在此处执行工作。\n\n我们打开工作方式选择器，并确认\
  \ **Local worktree** 已被标记。\n\n![Figure 10.4 – Selecting a workspace folder in Local\
  \ Worktree mode](img/B37082_10_4.png)\n\n**图 10.4 – 在本地工作树模式下选择工作区文件夹**\n\n选定后，我们打开\
  \ `Agentic‑Coding‑with‑Claude‑Code` 目录。该目录现在是所有操作将运行的工作区。此时，`Claude Code` 正使用 Git\
  \ 工作树在本地运行。\n\n## 切换至 Claude Code Web（云端模式）\n\n现在将工作方式切换至默认选项，即标有云图标的选项。当我们切换到此模式时，`Claude\
  \ Code` 将作为 Anthropic 基础设施上的托管实例运行。这被称为 **Claude Code web / remote workers / background\
  \ agents（Claude Code 网页版 / 远程工作器 / 后台代理）**。\n\n在此模型中，Anthropic 在其环境中运行容器化的 `Claude\
  \ Code` 实例。这些实例需要访问我们的代码。我们通过授予 `Claude Code` web 访问我们 GitHub 仓库的权限来提供该访问权。\n\n\
  ![Figure 10.5 – Selecting a repository in Claude Code Web (cloud mode)](img/B37082_10_5.png)\n\
  \n**图 10.5 – 在 Claude Code Web（云端模式）中选择仓库**\n\n授权访问后，提示时工作流按顺序进行：\n\n1.  Anthropic\
  \ 将启动一个 `Claude Code` 实例。\n2.  该实例克隆仓库。\n3.  它直接在代码上工作。\n4.  它可以提交更改。\n5.  它可以创建拉取请求。\n\
  \n由于实例拥有仓库访问权，其运作方式如同项目中的任何其他开发者。此模型提供了规模优势。你可以并行运行多个 `Claude` 实例，每个实例同时处理不同的任务。并发实例的数量取决于你所配置和付费的额度。我们稍后将在本节中看到这种并行能力的实际演示。\n\
  \n## Git 工作树如何实现并行开发\n\n在 **Local worktree（本地工作树）** 模式下，`Claude Code` 依赖 **Git Worktrees（Git\
  \ 工作树）**。Git 工作树允许我们将同一仓库的多个分支同时检出到不同的目录中，而无需多次克隆仓库。\n\n![Figure 10.6 – Git Worktrees\
  \ supporting parallel development in local mode](img/B37082_10_6.png)\n\n**图 10.6\
  \ – Git 工作树在本地模式下支持并行开发**\n\n当多个编码代理同时工作时，这变得尤为有用。\n\n每个代理可在其自己的工作树中操作自己的分支。我们无需频繁暂存更改或在分支间切换。隔离通过文件系统中的独立目录来处理。\n\
  \n我们无需深入了解 Git 工作树即可进行此工作流。只需知道它们允许多个分支同时保持活动状态，且 `Claude Code` 利用此机制支持并行开发即可。\n\
  \n工作区选定且工作模式选定后，我们即可继续进行。\n\n# 编排并行本地与云端代理\n\n为建立上下文，`Claude Code` 的工作目录指向 `Agentic‑Coding‑with‑Claude‑Code`\
  \ 仓库。\n\n![Figure 10.7 – Configuring the working directory for orchestrating local\
  \ and cloud agents](img/B37082_10_7.png)\n\n**图 10.7 – 为编排本地与云端代理配置工作目录**\n\n此阶段的所有操作均在本地机器上运行。该仓库当前已检出至现有实现中使用的\
  \ `hookhub` 分支。\n\n## 在本地运行 Next.js 应用\n\n我们首先提示 `Claude Code` 在本地运行 Next.js 应用。\n\
  \n由于工作目录已配置，无需克隆任何内容。`Claude Code` 检查目录结构，检测到 `hookhub` 目录，进入该目录并列出文件。`package.json`\
  \ 文件的存在表明这是一个 Next.js 项目。\n\n![Figure 10.8 – Running the Next.js application locally\
  \ with Claude Code](img/B37082_10_8.png)\n\n**图 10.8 – 使用 Claude Code 在本地运行 Next.js\
  \ 应用**\n\n随后，它确定正确的执行顺序：\n\n1.  安装依赖：\n    ```\n    npm install\n    ```\n2.  启动开发服务器：\n\
  \    ```\n    npm run dev\n    ```\n\n开发服务器在后台运行。部分输出未显示，但进程成功完成。执行期间，`Claude Code`\
  \ 检查 npm 版本。片刻后，Next.js 应用在端口 `3001` 启动，因端口 `3000` 已被占用而自动选择该端口。\n\n![Figure 10.9\
  \ – Next.js development server running locally through Claude Cod](img/B37082_10_9.png)\n\
