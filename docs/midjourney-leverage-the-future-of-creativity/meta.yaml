    \n![](img/de65630bac5611066a30f72c56787545_45_2.png)\n\n结果\n\n## 多提示词 (Multi Prompts)\n\
    \n多提示词允许你为不同的部分分配重要性。要实现这一点，你可以使用 `::` 作为分隔符。\n\n### 多提示词基础\n\n当你使用双冒时，机器人会分别处理这些部分。例如，如果你使用提示词\
