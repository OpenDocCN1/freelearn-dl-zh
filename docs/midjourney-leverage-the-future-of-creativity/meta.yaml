    \n## Pan（平移）选项\n\nPan 功能允许你在特定方向上拉伸图片，同时保持原始内容完整。\n\n### 平移图片\n\nPan 按钮在放大图片后出现。在平移过程中，图片的新部分由提示词和最近的\
