- img_proc: true
  md: '# 04 Familiarizing with Parameter List


    # Turbo


    --turbo mode uses a high-speed experimental GPU pool. Jobs run in Turbo mode generate
    up to four times faster but consume twice as many subscription GPU minutes as
    a typical Fast Mode Job.


    # Weird


    --weird or --weird This parameter adds eccentric and unconventional characteristics
    to the generated images, leading to distinct and surprising results that may be
    unexpected or uncommon.


    > TIP Default value is 0, and it accepts values between 0 and 3000.


    ```

    bunny with mustache and monocle --nweird 3000

    ```'
  merge: -1
  pgno: 35
- img_proc: true
