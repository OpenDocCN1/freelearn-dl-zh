  mdcn: "\n\n## 05 高级提示词\n\n### 提示提示词\n\n你可以使用图片提示词来决定内容的组成。图片提示词可以单独使用，也可以与文本提示词结合，你还可以组合不同的图片。\n\
    \n> 提示\n> 图片位于提示词的开头，你需要两张图片或图片与文本的才能生效。\n\n> 提示\n> URL 必须是在线图片的直接链接，并且应该以 .png、.gif、.webp、jpg\
    \ 或 jpeg 结尾。\n如果图片在手机中，你可以将其作为消息发送给 Midjourney Bot 以生成链接。\n\n## 将图片上传到 Discord\n\
    \n- 1. 将图片链接粘贴到与 Midjourney Bot 的聊天框中并按回车发送。\n- 2. 要获取图片链接，请根据你使用的平台遵循以下步骤：\n\
