    \n> **提示**\n> 一旦你在特定方向上平移了图片，你就被限制只能在相同方向（水平/垂直）上继续平移。你可以自由执行多次连续平移。然而，如果你执行多次且图片尺寸大到无法直接在\
    \ Discord 上分享，将为你提供图片的链接。\n\n## Remix 模式下的 Pan\n\n在 Remix 模式下 Pan 允许你在平移时更改提示词。\n\
