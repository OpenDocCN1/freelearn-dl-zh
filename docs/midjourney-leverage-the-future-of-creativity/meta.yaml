- img_proc: true
  md: '# 05


    # Advanced prompts


    Advanced prompts can include one or more imageURLs, multiple text phrases, parameters.


    ![](img/de65630bac5611066a30f72c56787545_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 05 Advanced prompts


    # # Image Prompts


    You can use image prompts to determine a Job''s composition. Image prompts can
    be use alone or combined with text prompts, you can also combine different images.


    > TIP

    Images go at the front of a prompt, and you need two images or a combination of
    image and text in order to work.


    > TIP

    The URL must be a direct link to an online image and it should en in .png,.gif,.webp,.jpg
    or jpeg.

    If the image is in your phone, you can send it as a message to the Midjourney
    Bot to generate a link.'
  merge: -1
  pgno: 39
- img_proc: true
  md: "# 05 Advanced prompts\n\n# Upload An Image To Discord\n\n+   1. Paste the image\
    \ link into the chat with Midjourney Bot and press enter to send it.\n\n+   2.\
    \ To obtain your image link, follow these steps depending on which platform you're\
    \ using:\n    - Desktop app: Right click on the image and select \"Copy Link\"\
    \ (NOT \"Copy Message Link\")\n    - Web app: Click to expand the image, then\
