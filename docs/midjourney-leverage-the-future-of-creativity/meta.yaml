- img_proc: true
  md: '# 05 Advanced prompts


    # Remix Mode


    You can use Remix Mode to change prompts, parameters, model versions, or aspect
    ratios between variations. Remix will take the general composition of your starting
    image and use it as part of the new Job.


    > **TIP** Remix is an experimental feature, this means it can be changed or removed
    at any time.


    # Using Remix


    Activate Remix Mode with the `/prefer remix` command or by using the `/settings`
    command and toggling the Remix Mode button. Remix changes the behavior of the
    variation buttons (V1, V2, V3, V4) and allows you to edit your prompt during each
    variation.


    To Remix an upscale, select Vary'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 05 Advanced prompts


    > TIP

    When you''re done with Remix, use the /settings or /prefer remix command to turn
    it off.


    ![](img/de65630bac5611066a30f72c56787545_45_0.png)


    Prompt

    bunch of balloons


    Modify or enter a new prompt


    ![](img/de65630bac5611066a30f72c56787545_45_1.png)


    ![](img/de65630bac5611066a30f72c56787545_45_2.png)


    Results'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 05 Advanced prompts


    # Multi Prompts


    Separating prompts allows you to assign relative importance to different parts
    of the prompt. To make this possible you can use :: as separator.


    # Multi-Prompt Basics


    When you use the double colon, the bot treats the parts of the prompt separately
    to create distinct concepts. For instance, with the prompt "cheese::cake," the
    bot would generate images of a cake made of cheese, combining the two separate
    concepts.


    > > Prompt

    > cheese:: cake drawing


    ![](img/de65630bac5611066a30f72c56787545_46_0.png)'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 05 Advanced prompts


    On the other hand, without the double colon, the bot would consider the entire
    prompt as one concept and generate images accordingly. This feature allows for
    more creative and diverse image generation based on the input you provide.


    ![](img/de65630bac5611066a30f72c56787545_47_0.png)


    > TIP \nThere is no space between the double colons ::


    Advanced prompts 4'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# 05 Advanced prompts


    # Prompt Weights


    If you use a double colon :: to split a prompt into sections, you have the option
    to attach a number right after the double colon. This number indicates how significant
    that specific section of the prompt is in terms of importance.


    ![](img/de65630bac5611066a30f72c56787545_48_0.png)


    | Prompt |

    | cup:: 2 cake |


    ![](img/de65630bac5611066a30f72c56787545_48_1.png)


    | Prompt |

    | cup:: cake |'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 05 Advanced prompts


    # Pan Option


    The Pan feature enables you to stretch the image canvas in a specific direction,
    all while keeping the original image content intact. The added space in the canvas
    is filled using instructions from both the prompt and the initial image.


    # Panning An Image


    Pan buttons will appear after upscaling an image. During panning, the new section
    of the image is determined using the prompt and the pixels closest to the image''s
    side, limited to the nearest 512 pixels.


    ![](img/de65630bac5611066a30f72c56787545_49_0.png)


    Prompt

    post apocalyptic city'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 05 Advanced prompts


    Starting image


    ![](img/de65630bac5611066a30f72c56787545_50_0.png)


    Pan ↔


    Pan ↕


    ![](img/de65630bac5611066a30f72c56787545_50_1.png)


    ![](img/de65630bac5611066a30f72c56787545_50_2.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 05 Advanced prompts


    Pan ↘


    ![](img/de65630bac5611066a30f72c56787545_51_0.png)


    Pan ➡


    ![](img/de65630bac5611066a30f72c56787545_51_1.png)


    Advanced prompts 4'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 05 Advanced prompts


    > **TIP**

    Once you''ve panned an image in a particular direction, you''re restricted to
    panning it further only in that same direction (horizontal/vertical). You''re
    free to perform this successive panning as many times as you want. However, if
    you do this multiple times and the image size becomes too large to share directly
    on Discord, a link to the image will be provided to you instead.


    # # Pan With Remix Mode


    Using Pan with Remix Mode allows you to change your prompt when panning.


    ![](img/de65630bac5611066a30f72c56787545_52_0.png)


    | Prompt |

    | countryside landscape |'
