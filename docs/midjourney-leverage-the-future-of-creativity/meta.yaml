- md: "\n## 05 Advanced prompts\n\n### Image Prompts\n\nYou can use image prompts\
    \ to determine a Job's composition. Image prompts can be used alone or combined\
    \ with text prompts, you can also combine different images.\n\n> TIP\n> Images\
    \ go at the front of a prompt, and you need two images or a combination of image\
    \ and text in order to work.\n\n> TIP\n> The URL must be a direct link to an online\
    \ image and it should end in .png, .gif, .webp, .jpg or jpeg.\nIf the image is\
    \ in your phone, you can send it as a message to the Midjourney Bot to generate\
    \ a link.\n\n## Upload An Image To Discord\n\n- 1. Paste the image link into the\
    \ chat with Midjourney Bot and press enter to send it.\n- 2. To obtain your image\
    \ link, follow these steps depending on which platform you're using:\n    - Desktop\
    \ app: Right click on the image and select \"Copy Link\" (NOT \"Copy Message Link\"\
    )\n    - Web app: Click to expand the image, then right-click and select \"Copy\
    \ image address\"\n    - Mobile app: Tap and hold the image, and then select \"\
    Copy Media Link\"\n    - If none of these methods work, you can expand the image\
    \ and then select \"Open in Browser\". Finally, you can copy and paste image's\
    \ URL.\n\n## Add An Image To The Prompt\n\n1. Type /imagine\n2. Drag the image\
    \ file into the prompt box to add the URL, or paste the link within the prompt\
    \ box.\n\n![](img/de65630bac5611066a30f72c56787545_41_0.png)\n\n> TIP Upload your\
    \ image in your Direct Messages with the Midjourney Bot to prevent other servers\
    \ users from seeing an image. Image prompts are visible on the Midjourney website\
    \ if the user doesn't have Stealth Mode.\n\n## Examples\n\nImage + Image\n\n![](img/de65630bac5611066a30f72c56787545_42_0.png)\n\
    \n+\n\n![](img/de65630bac5611066a30f72c56787545_42_1.png)\n\n> TIP\n> Use images\
    \ with the same aspect ratio for best results.\n\n## Examples\n\nImage + Text\n\
    \n![](img/de65630bac5611066a30f72c56787545_43_0.png)\n\n+ flower vase\n\n![](img/de65630bac5611066a30f72c56787545_43_1.png)\n\
    \n> TIP Use Image Weight parameter to adjust the importance of image vs. text\n\
    \n## Remix Mode\n\nYou can use Remix Mode to change prompts, parameters, model\
    \ versions, or aspect ratios between variations. Remix will take the general composition\
    \ of your starting image and use it as part of the new Job.\n\n> **TIP** Remix\
    \ is an experimental feature, this means it can be changed or removed at any time.\n\
    \n### Using Remix\n\nActivate Remix Mode with the `/prefer remix` command or by\
    \ using the `/settings` command and toggling the Remix Mode button. Remix changes\
    \ the behavior of the variation buttons (V1, V2, V3, V4) and allows you to edit\
    \ your prompt during each variation.\n\nTo Remix an upscale, select Vary\n\n>\
    \ TIP\n> When you're done with Remix, use the /settings or /prefer remix command\
    \ to turn it off.\n\n![](img/de65630bac5611066a30f72c56787545_45_0.png)\n\nPrompt\n\
    bunch of balloons\n\nModify or enter a new prompt\n\n![](img/de65630bac5611066a30f72c56787545_45_1.png)\n\
    \n![](img/de65630bac5611066a30f72c56787545_45_2.png)\n\nResults\n\n## Multi Prompts\n\
    \nMulti Prompts allow you to assign importance to different parts. To make this\
    \ possible, you can use :: as a separator.\n\n### Multi-Prompt Basics\n\nWhen\
    \ you use a double colon, the bot treats the parts separately. For instance, if\
    \ you use the prompt \"apple::cake,\" the bot would consider the prompt accordingly.\n\
    \n![](img/de65630bac5611066a30f72c56787545_46_0.png)\n\n## Weights\n\nMulti Prompts\
