  - '[PAGE 11]


    # 02


    # Creating your first

    Midjourney prompt


    You can interact with the Midjourney Bot on Discord using a **Command**. Commands
    are used to create images, change default settings, monitor user info, and perform
    other helpful tasks.

    The **/imagine** command generates a unique image from a short text description
    (known as a Prompt).


    +   1. Type /imagine prompt: or select the /imagine command from the slash commands
    pop-up.

    2. Type a description of the image you want to create in the prompt field.

    3. Send your message.'
  - '[PAGE 12]


    # 02 Creating your first Midjourney prompt


    ```

    /imagine prompt vibrant California poppies

    ```


    > TIP 💡

    The Midjourney Bot works best with simple, short sentences that describe what
    you want to see. Avoid long lists of requests. Instead of: Show me a picture of
    lots of blooming California poppies, make them bright, vibrant orange, and draw
    them in an illustrated style with colored pencils Try: Bright orange California
    poppies drawn with colored pencils


    Once you hit enter you should see a job in progress, that’s Midjourney creating
    up to four images for you to choose from.


    You’ll see something like this with a progress bar:


    ![](img/de65630bac5611066a30f72c56787545_12_0.png)


    Once the job finishes you can either upscale one of the images, or create more
    variations of one of the images.'
  - '[PAGE 13]


    # 02 Creating your first Midjourney prompt


    # Upscale Or Create Variations


    ![](img/de65630bac5611066a30f72c56787545_13_0.png)


    +   - U1 U2 U3 U4


    U buttons upscale an image generating a larger version of the selected image and
    adding more details.


    +   - V1 V2 V3 V4


    V buttons create slight variations of the selected grid image. Creating a variation
    generates a new image grid similar to the chosen image''s overall style and composition.


    The (re-roll) reruns a Job. In this case, it would rerun the original prompt producing
    a new grid of images.


    # Create Variations or Favorite Your Image


    ![](img/de65630bac5611066a30f72c56787545_13_1.png)


    Creates a variation of the upscaled image and generates a new grid of four options.


    Open the image in your gallery on Midjourney.com


    Tag your best images to easily find them on the Midjourney website.'
  - "[PAGE 14]\n\n# Save Your Image\n\nClick on the image to open it to full size,\
    \ and then right-click and choose Save image. On mobile, long-tap the image and\
    \ then tap the download icon in the top right corner.\n\nAll images are immediately\
    \ available to view on midjourney.com/app\n\n> TIP \nIf the public channels move\
    \ too fast for you, you can use the / imagine command while direct messaging with\
    \ the Midjourney Bot."
  - '[PAGE 15]


    # 03


    # Understanding

    Midjourney commands


    In our last chapter, we learned how commands serve as a means to interact with
    Midjourney. Now, in this chapter, we''ll dive deep into the diverse range of commands
    at our disposal.


    Understanding each command is crucial to unlocking Midjourney''s full potential.
    So, let us get started!'
  - '[PAGE 16]


    # 03 Understanding Midjourney commands


    ```

    /ask

    ```


    Get an answer to a question. Useful for asking questions related to midjourney,
    e.g. “how can I blend 2 images?”


    ![](img/de65630bac5611066a30f72c56787545_16_0.png)


    ```

    /describe

    ```


    The /describe command allows you to upload an image and generate four possible
    prompts based on that image. Use the /describe command to explore new vocabulary
    and aesthetic movements.'
- md: "\n## Understanding Midjourney commands\n\n### Prompt\n\nThe image to describe\n\
    \n![](img/de65630bac5611066a30f72c56787545_17_0.png)\n\nnintendo.png\n\n```\n\
    /describe image nintendo.png\n```\n\n![](img/de65630bac5611066a30f72c56787545_17_1.png)\n\
    \nOnce we send the /describe prompt to Midjourney, we'll get back 4 different\
    \ prompts to try and create similar variations for the image we uploaded.\n\n\
    ## 03 Understanding Midjourney commands\n\nIf we are not happy with the prompts,\
    \ we can ask Midjourney to re-generate all the prompts with the button. \n\nBy\
    \ clicking one of the options, we can have Midjourney run that specific prompt.\
    \ We can also ask Midjourney to run all the prompts with the Imagine all button.\n\
    \nWe can also edit one of the prompts ourselves and use the /image command. This\
    \ is the result of just doing that:\n\n> Prompt\n> video game console with two\
    \ nintendo controllers, in the style of retro gaming, with vibrant accent colors.\n\
    \n![](img/de65630bac5611066a30f72c56787545_18_0.png)\n\n## 03 Understanding Midjourney\
    \ commands\n\n```\n/blend\n```\n\nAfter typing the /blend command, you’ll be asked\
    \ to upload 2–5 images, Midjourney then looks at the concepts and aesthetics of\
    \ each image and merges them into a novel new image.\n\n![](img/de65630bac5611066a30f72c56787545_19_0.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_19_1.png)\n![](img/de65630bac5611066a30f72c56787545_19_2.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_19_3.png)\n\n## 03 Understanding Midjourney\
    \ commands\n\n> TIP \n> For the best results, upload images that are the same\
    \ aspect ratio as your desired result\n\nBlended images have a default 1:1 aspect\
    \ ratio, but you can use the optional dimensions field to select between a square\
    \ aspect ratio (1:1), portrait aspect ratio (2:3), or landscape aspect ratio (3:2).\n\
    \n![](img/de65630bac5611066a30f72c56787545_20_0.png)\n\n- - blend 1_yVOQPTOL-W3PAv84gYiwg.webp\
    \ image2 1_VvLDTPa2DFBP62HeddBb45g.webp\n  dim Landscape +3 more\n\n![](img/de65630bac5611066a30f72c56787545_20_1.png)\n\
    \n## 04\n\n### Familiarizing with Parameter List\n\nParameters are choices integrated\
    \ into a prompt that alter the way an image is formed. Parameters possess the\
    \ capacity to alter the aspect ratios of an image, shift between various versions\
    \ of the Midjourney Model, modify the selection of the Upscaler, and lots more.\n\
    \n![](img/de65630bac5611066a30f72c56787545_21_0.png)\n\n## 04 Familiarizing with\
    \ Parameter List\n\nParameters must be added at the end of a prompt, and you can\
    \ add multiple parameters to each prompt.\n\n```\n/imagine a vibrant california\
    \ poppy --aspect 2:3 --stop 95 --no sky\n```\n\n> TIP \n> You may notice that\
    \ double hyphens (--) are automatically changed to an em-dash (--) if you're using\
    \ an Apple device. Don't worry, Midjourney accepts both!\n\n## 04 Familiarizing\
    \ with Parameter List\n\n### Basic Parameters\n\n### Aspect Ratios\n\n--aspect\
    \ or --ar change the aspect ratio of a generated image.\n\n![](img/de65630bac5611066a30f72c56787545_23_0.png)\n\
    \n> Prompt\n> whimsical tarot card aesthetic the moon --ar 4:7\n\n> Prompt\n>\
    \ whimsical tarot card aesthetic the moon\n> --aspect 139:100\n\n![](img/de65630bac5611066a30f72c56787545_23_1.png)\n\
    \n## Familiarizing with Parameter List\n\n### Chaos\n\n--chaos <number 0-100>\
    \ changes how varied the initial image grids are. Higher values produce more unexpected\
    \ images.\n\n![](img/de65630bac5611066a30f72c56787545_24_0.png)\n![](img/de65630bac5611066a30f72c56787545_24_1.png)\n\
    \n```\nwarm apple pie --chaos 100\n```\n\n## Familiarizing with Parameter List\n\
    \n### Image Weight\n\n--iw <0-2> sets the importance of the image vs the text.\
    \ Higher values mean the image will have more impact on the finished result.\n\
    \n> Prompt\n> house --iw 2\n\n![](img/de65630bac5611066a30f72c56787545_25_0.png)\n\
    \n> Prompt\n> mushrooms --iw 0.5\n\n![](img/de65630bac5611066a30f72c56787545_25_1.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_25_2.png)\n\n## 04 Familiarizing with\
    \ Parameter List\n\n### No\n\n--no can be used to remove unwanted elements from\
    \ the prompt.\n\n![](img/de65630bac5611066a30f72c56787545_26_0.png)\n\n```\nfruit\
    \ painting --no grapes\n```\n\n![](img/de65630bac5611066a30f72c56787545_26_1.png)\n\
    \n## 04 Familiarizing with Parameter List\n\n### Quality\n\n--q <0.25-1> changes\
    \ how much time you want to spend generating the image. Default is 1.\n\n> Prompt\n\
    > fruit painting --q 0.5\n\n![](img/de65630bac5611066a30f72c56787545_27_0.png)\n\
    \n### Repeat\n\n--repeat runs a job multiple times.\n\n> Prompt\n> llama --repeat\
    \ 2\n\n![](img/de65630bac5611066a30f72c56787545_28_0.png)\n\n## Familiarizing\
    \ with Parameter List\n\n### Seed\n\nMidjourney uses a seed number to create the\
    \ initial image grids. This is a random number by default, but you can specify\
    \ it with the --seed parameter. Similar seed numbers will result in similar images.\n\
    \n> Prompt\n> classic tea --seed 42\n\n![](img/de65630bac5611066a30f72c56787545_29_0.png)\n\
    \n## 04 Familiarizing with Parameter List\n\n### Stop\n\n--stop stops the generation\
    \ at an earlier percentage. You can have less detailed results.\n\n> Prompt\n\
    > underwater --stop 30\n\n![](img/de65630bac5611066a30f72c56787545_30_0.png)\n\
    \n## 04 Familiarizing with Parameter List\n\n### Style\n\n--style customizes the\
    \ aesthetic of some Midjourney Models. It changes the artistic influence applied\
    \ during generation.\n\n> Prompt\n> dark academia --style raw\n\n![](img/de65630bac5611066a30f72c56787545_31_0.png)\n\
    \n## 04 Familiarizing with Parameter List\n\n### Version\n\n--version uses a different\
    \ version of the Midjourney algorithm.\n\n```\n--version <1, 2, 3, 4, 5, 5.1 or\
    \ 5.2> or --v <1, 2, 3, 4, 5, 5.1 or 5.2>\n```\n\n## 05\n\n### Advanced prompts\n\
    \nAdvanced prompts can include one or more imageURLs, multiple text phrases, parameters.\n\
    \n![](img/de65630bac5611066a30f72c56787545_38_0.png)\n"
  mdcn: "\n\n## 理解 Midjourney 命令\n\n### 提示词 (Prompt)\n\n待描述的图像\n\n![](img/de65630bac5611066a30f72c56787545_17_0.png)\n\
    \nnintendo.png\n\n```\n/describe image nintendo.png\n```\n\n![](img/de65630bac5611066a30f72c56787545_17_1.png)\n\
    \n一旦我们向 Midjourney 发送 /describe 指令，我们将获得 4 个不同的提示词，尝试为上传的图像创建相似的变体。\n\n## 03 理解\
    \ Midjourney 命令\n\n如果我们对提示词不满意，可以通过按钮让 Midjourney 重新生成所有提示。\n\n点击其中一个选项，可以让 Midjourney\
    \ 运行特定的提示词。我们也可以通过 Imagine all 按钮让 Midjourney 运行所有提示。\n\n我们还可以手动编辑其中一个提示词并使用 /image\
    \ 命令。这就是仅仅操作的结果：\n\n> 提示词\n> 带有两个任天堂控制器的游戏主机，复古游戏风格，带有鲜艳的强调色。\n\n![](img/de65630bac5611066a30f72c56787545_18_0.png)\n\
    \n## 03 理解 Midjourney 命令\n\n```\n/blend\n```\n\n在输入 /blend 命令后，会被要求上传 2–5 张图像，Midjourney\
    \ 然后会查看每张图像的概念和审美，并将它们合并成一张全新的图像。\n\n![](img/de65630bac5611066a30f72c56787545_19_0.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_19_1.png)\n![](img/de65630bac5611066a30f72c56787545_19_2.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_19_3.png)\n\n## 03 理解 Midjourney 命令\n\
    \n> 提示\n> 为了获得最佳效果，请上传与预期结果相同宽高比例的图像\n\n合并后的图像默认具有 1:1 的宽高比，但您可以使用可选的尺寸字段选择正方形比例\
    \ (1:1)、纵屏比例 (2:3) 或横屏比例 (3:2)。\n\n![](img/de65630bac5611066a30f72c56787545_20_0.png)\n\
    \n- - blend 1_yVOQPTOL-W3PAv84gYiwg.webp image2 1_VvLDTPa2DFBP62HeddBb45g.webp\n\
    \  dim Landscape +3 more\n\n![](img/de65630bac5611066a30f72c56787545_20_1.png)\n\
    \n## 04\n\n### 熟悉参数列表\n\n参数是集成在提示词中的选项，会改变图像形成的方式。参数具有改变图像宽高比、在不同的 Midjourney\
    \ 模型版本之间切换、修改放大器选择以及许多其他功能。\n\n![](img/de65630bac5611066a30f72c56787545_21_0.png)\n\
    \n## 04 熟悉参数列表\n\n参数必须添加在提示词的末尾，您可以为每个提示词添加多个参数。\n\n```\n/imagine a vibrant california\
    \ poppy --aspect 2:3 --stop 95 --no sky\n```\n\n> 提示\n> 您可能会注意到，如果您使用的是 Apple\
    \ 设备，双连字符 (--) 会自动转换为破折号 (--)。别担心，Midjourney 两种都接受！\n\n## 04 熟悉参数列表\n\n### 基础参数\n\
    \n### 宽高比\n\n--aspect 或 --ar 改变生成图像的宽高比。\n\n![](img/de65630bac5611066a30f72c56787545_23_0.png)\n\
    \n> 提示词\n> 奇幻的塔罗牌审美，月亮 --ar 4:7\n\n> 提示词\n> 奇幻的塔罗牌审美，月亮\n> --aspect 139:100\n\n\
    ![](img/de65630bac5611066a30f72c56787545_23_1.png)\n\n## 熟悉参数列表\n\n### 混沌值 (Chaos)\n\
    \n--chaos <number 0-100> 改变初始图像网格的变异程度。数值越高，产生的意外图像越多。\n\n![](img/de65630bac5611066a30f72c56787545_24_0.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_24_1.png)\n\n```\nwarm apple pie --chaos\
    \ 100\n```\n\n## 熟悉参数列表\n\n### 图像权重 (Image Weight)\n\n--iw <0-2> 设置图像相对于文本的重要性。数值越高，图像对最终结果的影响越大。\n\
    \n> 提示词\n> house --iw 2\n\n![](img/de65630bac5611066a30f72c56787545_25_0.png)\n\
    \n> 提示词\n> mushrooms --iw 0.5\n\n![](img/de65630bac5611066a30f72c56787545_25_1.png)\n\
    ![](img/de65630bac5611066a30f72c56787545_25_2.png)\n\n## 04 熟悉参数列表\n\n### 排除 (No)\n\
    \n--no 可用于移除提示词中不的元素。\n\n![](img/de65630bac5611066a30f72c56787545_26_0.png)\n\n\
    ```\nfruit painting --no grapes\n```\n\n![](img/de65630bac5611066a30f72c56787545_26_1.png)\n\
    \n## 04 熟悉参数列表\n\n### 质量 (Quality)\n\n--q <0.25-1> 改变您在生成图像上花费的时间。默认为 1。\n\n>\
    \ 提示词\n> fruit painting --q 0.5\n\n![](img/de65630bac5611066a30f72c56787545_27_0.png)\n\
    \n### 重复 (Repeat)\n\n--repeat 多次运行任务。\n\n> 提示词\n> llama --repeat 2\n\n![](img/de65630bac5611066a30f72c56787545_28_0.png)\n\
    \n## 熟悉参数列表\n\n### 种子 (Seed)\n\nMidjourney 使用种子值值来创建初始图像网格。默认情况下这是一个随机数，但您可以使用\
    \ --seed 参数指定它。相似的种子将产生相似的图像。\n\n> 提示词\n> classic tea --seed 42\n\n![](img/de65630bac5611066a30f72c56787545_29_0.png)\n\
    \n## 04 熟悉参数列表\n\n### 停止 (Stop)\n\n--stop 在更早的百分比停止生成。您可以获得细节较少的结果。\n\n> 提示词\n\
    > underwater --stop 30\n\n![](img/de65630bac5611066a30f72c56787545_30_0.png)\n\
    \n## 04 熟悉参数列表\n\n### 风格 (Style)\n\n--style 自定义某些 Midjourney 模型的审美。它改变了生成期间期间的艺术影响。\n\
    \n> 提示词\n> dark academia --style raw\n\n![](img/de65630bac5611066a30f72c56787545_31_0.png)\n\
    \n## 04 熟悉参数列表\n\n### 版本 (Version)\n\n--version 使用不同版本的 Midjourney 算法。\n\n```\n\
    --version <1, 2, 3, 4, 5, 5.1 or 5.2> 或 --v <1, 2, 3, 4, 5, 5.1 or 5.2>\n```\n\
    \n## 05\n\n### 高级提示词\n\n高级提示词可以包含一个或多个图像 URL、多个文本短语、参数。\n\n![](img/de65630bac5611066a30f72c56787545_38_0.png)\n\
    \n"
