- md: '

    # MIDJOURNEY


    Leverage The Future Of Creativity


    Adrian Twarog


    # 01

    Anatomy of a prompt


    A Prompt is a brief textual expression that triggers the Midjourney Bot to create
    an **image**.

    The Midjourney Bot deconstructs the words and phrases in the prompt, breaking
    them into smaller units known as **tokens**. These tokens are then matched against
    its training data, enabling the bot to generate an image.

    Skillfully composing a prompt can result in the production of distinctive and
    captivating images.


    ## 01 Anatomy of a prompt


    ## Basic Prompts


    A basic prompt can be as simple as a single word, phrase or emoji.


    ```

    prompt The prompt to imagine /imagine prompt description of what to imagine Text
    Prompt

    ```


    > TIP For the most effective results, use brief and straightforward sentences
    when describing what you want the Midjourney Bot to create. This way, the bot
    can better understand your vision and produce the desired image more accurately.


    > **Don''t** Show me a picture of lots of blooming California poppies, make them
    bright, vibrant orange, and draw them in an illustrated style with colored pencils.


    > **Do** Bright orange California poppies drawn with colored pencils.


    ## 01 Anatomy of a prompt


    ## Advanced Prompts


    Advanced prompts can include one or more imageURLs, multiple text phrases, parameters


    ```

    prompt The prompt to imagine

    /imagine prompt http://imageURL1.png http://imageURL1.jpg description of what
    to imagine --parameter 1 --parameter 2

    Image Prompts Text Prompt Parameters

    ```


    # Image Prompts


    Can be added to a prompt in order to influence the style and content of the finished
    result. They always go at the front of a prompt.


    # Text Prompt


    Is the text description of what image you want to generate. Well-expressed prompts
    help generate stunning pictures.


    # Parameters


    Change how an image generates. They go at the end of the prompt.


    ## 01 Anatomy of a prompt


    ## Prompting Notes


    ## Prompt Length


    Using very short prompts will heavily rely on Midjourney''s default style. However,
    overly long prompts do not always yield better results. The key is to concentrate
    on the main concepts you want to convey effectively.


    > Don''t Mask.


    ![](img/de65630bac5611066a30f72c56787545_4_0.png)


    Prompts can be very simple. Single words will produce an image, you can even use
    just an emoji!


    Mysterious venetian carnival mask.


    ![](img/de65630bac5611066a30f72c56787545_5_0.png)


    Focus on the main concepts about what do you want to create.


    # Grammar


    The Midjourney Bot doesn''t understand grammar like humans do. The words you choose
    are very important too. Remove words when possible, as it gives more influence
    to the words you choose. Use punctuation to help organize your thoughts if you
    want, but the bot will not reliably interpret them. Also, the Midjourney Bot doesn''t
    consider capitalization.


    ```

    Don''t

    nPlease draw a very big octopus, with an angry face. Also, I want it to be purple.

    ```


    ![](img/de65630bac5611066a30f72c56787545_6_0.png)


    Too many words that don''t really add to the final result.


    Gigantic furious purple octopus.


    Better word selection, each one has an impact on the final result.


    ![](img/de65630bac5611066a30f72c56787545_7_0.png)


    # Focus on what you want


    Don''t type what you don''t want. If you want to exclude something from the final
    image, try advanced prompting using the --no parameter.


    ```

    Don''t

    Burger with no cheese

    ```


    ![](img/de65630bac5611066a30f72c56787545_8_0.png)


    If you type burger with "no cheese", you will probably get an image with cheese.


    ```

    Do

    Complete burger --no cheese

    ```


    Try using advanced prompting parameters if you want specific things not to be
    included in the image.


    ![](img/de65630bac5611066a30f72c56787545_8_1.png)


    # Think about what details matter


    Be clear if you want specific details. Being vague is a great option to get variety,
    it all depends on what are you looking for.


    > Don''t

    Low-poly house


    ![](img/de65630bac5611066a30f72c56787545_9_0.png)


    Don''t be too vague if you''re looking for specific details


    > Do

    Low-poly cozy wood cabin smoking chimney autumn afternoon


    Think about subject, environment, mood, color, etc. Try to be clear about details
    that are important to you.


    ![](img/de65630bac5611066a30f72c56787545_9_1.png)


    # Use collective nouns


    Plural words leave a lot to chance. Try specific numbers

    and collective nouns if you want more detailed results.


    > Don''t

    Black puppies playing with ball


    ![](img/de65630bac5611066a30f72c56787545_10_0.png)


    > Do

    Black puppies playing with ball


    > Do

    Black puppies playing with ball


    ![](img/de65630bac5611066a30f72c56787545_10_1.png)


    ## 01 Anatomy of a prompt


    ## Creating your first prompt


    The Midjourney Bot doesn''t understand grammar like humans do. The words you choose
    are very important too. Remove words when possible, as it gives more influence
    to the words you choose. Use punctuation to help organize your thoughts if you
    want, but the bot will not reliably interpret them. Also, the Midjourney Bot doesn''t
    consider capitalization.


    ```

    Don''t

    nPlease draw a very big octopus, with an angry face. Also, I want it to be purple.

    ```


    ## 01 Anatomy of a prompt


    ## Creating your first prompt


    ![](img/de65630bac5611066a30f72c56787545_12_0.png)


    ## 01 Anatomy of a prompt


    ## Upscale or Create Variations


    ![](img/de65630bac5611066a30f72c56787545_13_0.png)


    ## 01 Anatomy of a prompt


    ## Upscale or Create Variations


    ![](img/de65630bac5611066a30f72c56787545_13_1.png)

