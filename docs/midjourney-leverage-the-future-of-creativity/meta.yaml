  - '[PAGE 46]


    # 05 Advanced prompts


    # Multi Prompts


    Separating prompts allows you to assign relative importance to different parts
    of the prompt. To make this possible you can use :: as separator.


    # Multi-Prompt Basics


    When you use the double colon, the bot treats the parts of the prompt separately
    to create distinct concepts. For instance, with the prompt "cheese::cake," the
    bot would generate images of a cake made of cheese, combining the two separate
    concepts.


    > > Prompt

    > cheese:: cake drawing


    ![](img/de65630bac5611066a30f72c56787545_46_0.png)'
  - '[PAGE 47]


    # 05 Advanced prompts


    On the other hand, without the double colon, the bot would consider the entire
    prompt as one concept and generate images accordingly. This feature allows for
    more creative and diverse image generation based on the input you provide.


    ![](img/de65630bac5611066a30f72c56787545_47_0.png)


    > TIP \nThere is no space between the double colons ::


    Advanced prompts 4'
  - '[PAGE 48]


    # 05 Advanced prompts


    # Prompt Weights


    If you use a double colon :: to split a prompt into sections, you have the option
    to attach a number right after the double colon. This number indicates how significant
    that specific section of the prompt is in terms of importance.


    ![](img/de65630bac5611066a30f72c56787545_48_0.png)


    | Prompt |

    | cup:: 2 cake |


    ![](img/de65630bac5611066a30f72c56787545_48_1.png)


    | Prompt |

    | cup:: cake |'
  - '[PAGE 49]


    # 05 Advanced prompts


    # Pan Option


    The Pan feature enables you to stretch the image canvas in a specific direction,
    all while keeping the original image content intact. The added space in the canvas
    is filled using instructions from both the prompt and the initial image.


    # Panning An Image


    Pan buttons will appear after upscaling an image. During panning, the new section
    of the image is determined using the prompt and the pixels closest to the image''s
    side, limited to the nearest 512 pixels.


    ![](img/de65630bac5611066a30f72c56787545_49_0.png)


    Prompt

    post apocalyptic city'
