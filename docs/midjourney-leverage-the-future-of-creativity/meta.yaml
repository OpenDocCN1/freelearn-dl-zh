    \ URL。\n\n##向提示词添加图片\n\n1. 输入 /imagine\n2. 将图片文件拖入提示词框以添加 URL，或在提示词框内粘贴链接。\n\n\
    ![](img/de65630bac5611066a30f72c56787545_41_0.png)\n\n> 提示 在 Midjourney Bot 的私信中上传图片，可以防止其他服务器的用户看到图片。如果用户没有开启隐身模式（Stealth\
    \ Mode），图片提示词在 Midjourney 网站上是的。\n\n## 示例\n\n图片 + 图片\n\n![](img/de65630bac5611066a30f72c56787545_42_0.png)\n\
    \n+\n\n![](img/de65630bac5611066a30f72c56787545_42_1.png)\n\n> 提示\n> 使用相同宽高比例的图片可获得最佳效果。\n\
    \n## 示例\n\n图片 + 文本\n\n![](img/de65630bac5611066a30f72c56787545_43_0.png)\n\n+\
