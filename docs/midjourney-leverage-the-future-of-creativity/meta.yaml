  - '[PAGE 21]


    # # 04


    # ## Familiarizing with Parameter List


    Parameters are choices integrated into a prompt that alter the way an image is
    formed. Parameters possess the capacity to alter the aspect ratios of an image,
    shift between various versions of the Midjourney Model, modify the selection of
    the Upscaler, and lots more.


    ![](img/de65630bac5611066a30f72c56787545_21_0.png)'
  - '[PAGE 22]


    # 04 Familiarizing with Parameter List


    Parameters must be added at the end of a prompt, and you can add multiple parameters
    to each prompt.


    ```

    /imagine a vibrant california poppy --aspect 2:3 --stop 95 --no sky

    ```


    > TIP You may notice that double hyphens (--) are automatically changed to an
    em-dash (--) if you''re using an Apple device. Don''t worry, Midjourney accepts
    both!'
  - '[PAGE 23]


    # 04 Familiarizing with Parameter List


    # # Basic Parameters


    # ## Aspect Ratios


    --aspect or --ar change the aspect ratio of a generated image.


    ![](img/de65630bac5611066a30f72c56787545_23_0.png)


    > Prompt

    whimsical tarot card aesthetic the moon --ar 4:7


    > Prompt

    whimsical tarot card aesthetic the moon

    --aspect 139:100


    ![](img/de65630bac5611066a30f72c56787545_23_1.png)'
  - '[PAGE 24]


    # Familiarizing with Parameter List


    # Chaos


    --chaos <number 0-100> changes how varied the initial image grids are. Higher
    values produce more unexpected images.


    ![](img/de65630bac5611066a30f72c56787545_24_0.png)


    ![](img/de65630bac5611066a30f72c56787545_24_1.png)


    ```

    warm apple pie --chaos 100

    ```'
  - '[PAGE 25]


    # Familiarizing with Parameter List


    # Image Weight


    --iw <0-2> sets the importance of the image vs the text. Higher values mean the
    image will have more impact on the finished job.


    ![](img/de65630bac5611066a30f72c56787545_25_0.png)


    Prompt mushrooms.png house --iw .5


    Prompt mushrooms.png house --iw 2


    ![](img/de65630bac5611066a30f72c56787545_25_1.png)


    ![](img/de65630bac5611066a30f72c56787545_25_2.png)'
  - '[PAGE 26]


    # 04 Familiarizing with Parameter List


    # No


    --no parameter can be used to remove unwanted elements from the prompt.


    ![](img/de65630bac5611066a30f72c56787545_26_0.png)


    ```

    Prompt

    fruit painting

    ```


    ```

    Prompt

    fruit painting --no grapes

    ```


    ![](img/de65630bac5611066a30f72c56787545_26_1.png)'
  - '[PAGE 27]


    # 04 Familiarizing with Parameter List


    # Quality


    --quality <.25, .5 or .1> or -q <.25, .5 or 1> changes how much time you want
    to spend generating an image (default is 1). Higher values use more GPU minutes.


    # Relax


    Use --relax mode to modify your current setting and run a single job.


    # Repeat


    --repeat runs a job multiple times.


    > > Prompt

    nhappy llama in the desert --r 2


    ![](img/de65630bac5611066a30f72c56787545_27_0.png)'
  - '[PAGE 28]


    # 04 Familiarizing with Parameter List


    # Seed


    The Midjourney Bot uses a seed number to create a starting point to generate the
    initial image grids. This is a random number by default, but you can specify it
    with the --seed parameter. Similar seed numbers with the same prompt will result
    in similar images.


    ```

    Prompt

    classic tea cups

    ```


    ![](img/de65630bac5611066a30f72c56787545_28_0.png)'
  - '[PAGE 29]


    # 04 Familiarizing with Parameter List


    Prompt

    classic tea cups --seed 429496729


    ![](img/de65630bac5611066a30f72c56787545_29_0.png)'
  - '[PAGE 30]


    # 04 Familiarizing with Parameter List


    # Stop


    --stop parameter stops the generation process at an earlier percentage. You can
    have less detailed images as result.


    ![](img/de65630bac5611066a30f72c56787545_30_0.png)


    colorful explosion underwater


    colorful explosion underwater

    --stop 30


    ![](img/de65630bac5611066a30f72c56787545_30_1.png)'
  - '[PAGE 31]


    # 04 Familiarizing with Parameter List


    # Style


    --style parameter customizes the aesthetic of some Midjourney Model Versions.
    You can use this parameter to generate more photo-realistic images, cinematic
    scenes or cute characters.


    ![](img/de65630bac5611066a30f72c56787545_31_0.png)


    > Prompt

    library dark academia aesthetic


    > Prompt

    library dark academia aesthetic

    --style raw


    ![](img/de65630bac5611066a30f72c56787545_31_1.png)'
  - '[PAGE 32]


    # 04 Familiarizing with Parameter List Stylize


    The Midjourney Bot has been trained to generate images with an emphasis on artistic
    color palettes, composition, and visual forms. The degree of artistic influence
    applied during generation can be controlled using the --stylize or --s parameter.


    > TIP

    Default value is 100, and it accepts integer values between 0 and 1000.


    colorful herbology painting --stylize 0'
  - '[PAGE 33]


    # 04 Familiarizing with Parameter List


    > Prompt

    colorful herbology painting --stylize 1000


    ![](img/de65630bac5611066a30f72c56787545_33_0.png)


    ![](img/de65630bac5611066a30f72c56787545_33_1.png)'
  - '[PAGE 34]


    # 04 Familiarizing with Parameter List


    # Tile


    --tile generates images that can be used as patterns.


    ```

    Prompt

    vibrant color peacock --tile

    ```


    ![](img/de65630bac5611066a30f72c56787545_34_0.png)


    ![](img/de65630bac5611066a30f72c56787545_34_1.png)'
  - '[PAGE 35]


    # 04 Familiarizing with Parameter List


    # Turbo


    --turbo mode uses a high-speed experimental GPU pool. Jobs run in Turbo mode generate
    up to four times faster but consume twice as many subscription GPU minutes as
    a typical Fast Mode Job.


    # Weird


    --weird or --weird This parameter adds eccentric and unconventional characteristics
    to the generated images, leading to distinct and surprising results that may be
    unexpected or uncommon.


    > TIP Default value is 0, and it accepts values between 0 and 3000.


    ```

    bunny with mustache and monocle --nweird 3000

    ```'
  - '[PAGE 36]


