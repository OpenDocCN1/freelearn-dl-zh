  ## 关于审稿人\n\n`Franck Benichou` 是一位拥有超过六年机器学习和大语言模型 (`LLM`) 工程经验的资深 `AI` 工程师。他目前在\
  \ `Carta` 工作，该平台是私募股权和基金管理数据的领先平台。在 `Carta` 收购 `Accelex` 后，`Franck` 推动 `AI` 驱动的文档智能技术进步，应用\
  \ `生成式 AI` 将复杂的金融数据转化为结构化洞察。在加入 `Carta` 之前，`Franck` 曾在 `德勤`（2024–2025 年）担任内部 `生成式\
  \ AI` 开发人员，创建企业 `AI` 解决方案并为该公司的内部 `AI` 战略做出贡献。从 2022 年到 2024 年，他在 `安永` (`Ernst &\
  \ Young`) 领导了 `生成式 AI` 倡议，开发检索增强和内容自动化系统。早些时候，在 `Intact Financial Corporation` 的研发数据实验室（2020–2022\
  \ 年），他专注于基于使用量的保险建模和分析，支持基于远程信息处理的定价创新。`Franck` 结合了深厚的技术功底和产品导向思维，构建可扩展且可解释的 `AI`\
  \ 系统，为数据驱动的组织带来自动化、智能化和可衡量的价值。\n\n## 前言\n\n大型语言模型 (`LLM`) 领域正以前所未有的速度飞速发展。当我们撰写本文时，`DeepSeek`\
  \ 团队刚刚发布了一篇新论文，展示了如何利用计算机视觉技术压缩 `LLM` 的上下文。人工智能领域的活跃程度令人惊叹，且没有放缓的迹象。\n\n作为本书的作者，我们曾思考，*关于\
  \ `DeepSeek`，我们能写出什么内容而不会使本书立即过时呢？* 我们的答案很简单：我们相信 `AI` 技术的未来是开放的，而这场运动的先锋就是 `DeepSeek`。\n\
  \n`DeepSeek` 不断给人工智能界带来惊喜，从发布功能极其强大的模型到发表专注于 `LLM` 的突破性研究。考虑到这些发展，我们清楚地认识到，我们需要写一本书来记录正在发生的事情。\n\
  \n本书的目标是为你——亲爱的读者——提供掌握 `DeepSeek` 所需的工具。我们希望它能成为你精通开源语言模型的指南。\n\n# DeepSeek 实践指南\n\
  \n### 概述\n\n本书涵盖了使用 DeepSeek 模型时可能遇到的几乎所有内容——从理解 DeepSeek 模型的独特之处，到如何将其用于实际应用。我们还深入探讨了如何精通\
  \ DeepSeek 模型的提示工程，以便您成为与该系列模型交互的专家。最后，我们深入实践层面，提供了如何设计、构建和部署由 DeepSeek 模型驱动的智能体（Agentic）与非智能体应用的示例。\n\
  \n在本书中，我们首先介绍 DeepSeek，探讨其基础，并理解它与其他模型的差异（**第 1 章**和**第 2 章**）。一旦您了解了 DeepSeek 的能力，接下来就是学习如何有效地使用它。我们有一整章专门讲解推理模型的提示艺术，向您展示“少即是多”（第\
  \ 3 章）。\n\n然后，我们进入实际应用，演示如何使用它对复杂问题进行顾问级分析（第 4 章）。在此基础上，我们构建了一个完整的端到端应用，您将从一个简单的\
  \ API 开始，直到在 Amazon Web Services 上运行一个完全容器化的服务（第 5 章）。\n\n在本书的最后一部分，我们探索大语言模型和 AI\
  \ 技术的前沿。您将学习如何使用 DeepSeek 模型作为智能体应用的骨干（第 6 章）。我们还将引导您完成一个更复杂的 MLOps 案例，您将使用更强大的\
  \ DeepSeek 模型将知识蒸馏到一个更小的模型中（第 7 章）。在本书的最后一章，我们涵盖了 DeepSeek 模型的部署及其多种权衡，以便您能为自己的用例选择最佳的部署方法（第\
  \ 8 章）。\n\n本书以**结语**部分收尾，带您回顾关键要点。本书还提供了一个**附录**，指导您使用 DeepSeek 的多种方式。\n\n### 本书的目标读者\n\
  \n本书面向任何想要了解 DeepSeek 模型工作原理的人。无论您是 AI 工程师、软件开发者、机器学习工程师还是研究员——只要您熟悉 Python，就能从本书中获益。如果您有数据科学、API\
  \ 和一些机器学习概念的经验，您将获益更多！\n\n### 本书涵盖的内容\n\n**第 1 章**，**什么是 DeepSeek**，介绍了 DeepSeek\
  \ 这一开源大语言模型，探讨了其突破、发展、与其他大语言模型的比较，以及对当今全球 AI 领域的影响。\n\n**第 2 章**，**深入解析 DeepSeek**，深入探讨了\
  \ DeepSeek 的架构、推理机制、高级能力，提供了对其独特优势和新兴争议的实践理解。\n\n**第 3 章**，**提示 DeepSeek**，向您展示如何有效地为\
  \ DeepSeek 模型构建提示，并特别展示了如何在 V 系列和 R 系列模型之间实现这种差异化。\n\n**第 4 章**，**使用 DeepSeek：案例研究**，展示了真实的\
  \ DeepSeek 案例研究，揭示了行业领导者如何应用它来提升生产力、改进开发并使用实用方法实施 AI 辅助工作流程。\n\n**第 5 章**，**使用 DeepSeek\
  \ 构建**，带您了解如何创建由 DeepSeek 模型支持的真实世界应用，如何迭代改进它，以及如何将 DeepSeek 模型部署到 AWS 作为独立服务。\n\
  \n**第 6 章**，**使用 DeepSeek 构建智能体**，向您展示如何开始使用 DeepSeek 模型构建智能体，存在的不同智能体模式，以及对 MCP\
  \ 的简要介绍。\n\n**第 7 章**，**使用 DeepSeek 驱动的 Gemma 3 法律推理微调**，涵盖了将 DeepSeek 的 R1 蒸馏到经过微调的\
  \ Gemma 3 模型中的过程。我们探索了一个法律案例，并讨论了在生产场景中如何对其进行评估。\n\n**第 8 章**，**部署 DeepSeek 模型**，展示了如何为生产用例部署\
  \ DeepSeek 模型。我们向您展示如何在云基础设施上启动全规模模型，并指导您如何将其作为生产技术栈的一部分进行管理。\n\n**第 9 章**，**结语**，回顾了您为理解\
  \ DeepSeek 内部原理、从应用到部署的有效使用方法所经历的旅程。\n\n**第 10 章**，**附录**，包含一份 DeepSeek 备忘单，向您展示如何快速入门。\n\
  \n### 如何充分利用本书\n\n*   具备使用 Python、API 以及 `Ollama` 或 `llama.cpp` 等工具的实践经验。\n*   具备使用\
  \ `uv` 和 `Docker` 等工具和平台的经验。\n*   扎实的机器学习概念理解。\n\n## 声明\n\n作者承认使用了尖端 AI（如 ChatGPT），唯一目的是增强本书的语言和清晰度，从而确保为读者提供流畅的阅读体验。\n\
