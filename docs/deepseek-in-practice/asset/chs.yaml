  \ |\n\n# 8\n\n# 部署 DeepSeek 模型\n\n在上一章中，我们蒸馏并微调了更小的、特定领域的模型，你可以在适度硬件和严格的隐私边界内运行。这项工作针对小规模的效率和控制进行了优化。本章采取了补充步骤，将全参数\
  \ DeepSeek 模型（V3 和 R1）部署为可靠的生产服务。\n\n**部署**是从研究到生产的桥梁。它迫使对内存占用、吞吐量和运行风险做出具体选择。DeepSeek\
  \ 的架构放大了这些权衡：V3 的 **专家混合** (**MoE**) 使 VRAM 放置紧张；R1 的扩展推理增加了令牌数量和首令牌时间。正确的路径取决于你的约束。\n\
  \n截至 2025 年 8 月，本章中的任何定价和吞吐量数字都是方向性的。在硬编码假设之前，请验证当前的提供商表格并在你的工作负载上进行验证。\n\n本章为在真实场景中部署全参数\
  \ DeepSeek 模型提供了实用手册。我们将重点部署全规模的 DeepSeek-V3 (671B) 和 DeepSeek-R1；较小的模型仅作为开发代理被提及。\n\
  \n我们将在本章中涵盖以下主题：\n\n*   DeepSeek 部署全景\n*   选择部署策略的决策框架\n*   硬件和推理优化需求\n*   实践部署指南\n\
  *   生产运营和监控\n*   你的部署手册\n\n**范围说明**\n\n本章不涵盖部署第 *7 章* 中提到的较小微调/学生模型。任何对较小模型的提及严格用于开发或代理工作流，而非全模型的生产部署。\n\
  \n### 技术要求\n\n在本章中，我们将探索部署 DeepSeek 的各种方法。对于每种方法，技术要求将在相应部分提及。你可以利用最适合你的应用程序以及对工具和平台访问权限的任何方法。\n\
  \n## DeepSeek 部署全景\n\n在生产中，你关注三件事：监控、扩展和成本。你监控每个请求的令牌数、**首令牌时间** (**TTFT**)、p95/p99\
  \ 延迟、GPU 和 **键值** (**KV**) 缓存使用情况，以及错误/超时率。你根据系统实际生成的令牌数量（而不仅仅是到达的 HTTP 请求数量）进行扩展。并且你通过限制令牌数、在可能的情况下批处理、缓存常见前缀以及在空闲时暂停或调整副本大小来控制成本。\n\
  \n为此，你需要关注以下内容：\n\n*   **内存占用**：这是运行时所需的 VRAM。它包括模型权重加上开销，如 KV 缓存和激活。跟踪峰值 VRAM 和每令牌的\
  \ KV 缓存字节数；这些数字决定了你的安全批量大小和上下文长度，以及你是否需要多个 GPU 或将部分权重移动到 CPU/NVMe。\n*   **吞吐量**：这是你的服务在目标并发下每秒可以生成的令牌数。对于规划，还要报告在固定提示/响应大小下的每秒请求数，并始终将其与\
  \ TTFT 和 p95/p99 延迟配对，以便该数字反映真实的用户体验。\n*   **运行风险**：这是由于不稳定或设置不当而错过 SLO 或超出预算的可能性。关注错误和超时率、**内存不足\
  \ (OOM) 事件**、队列增长以及你安全地推出更改或上下扩展的程度。\n\nDeepSeek 增加了一些额外的复杂性。V3 使用 MoE 设计，当所有专家都保留在\
  \ GPU 内存中时效果最佳，这推高了 VRAM 需求，即使进行量化也是如此；将权重移动到 CPU 或 NVMe 有助于适应但会减慢速度。R1 *思考*很多，通常在最终答案之前生成数千个内部令牌，这提高了\
  \ TTFT，增加了内存使用，并使延迟更不可预测。因此，在你选择 API、托管或自托管部署之前，明确的容量规划、仔细的批处理和基本的仪表板是必须的。\n\n###\
  \ DeepSeek 的部署特点\n\nDeepSeek 模型带来了特定的挑战：\n\n*   **模型规模**：即使是量化版本也推高了硬件极限。DeepSeek-V3\
  \ 的 671B 总参数需要大量的 VRAM，无论其 MoE 效率如何。\n*   **推理开销**：R1 模型生成广泛的内部推理链。一个看似简单的查询可能产生数千个中间令牌。\n\
  *   **架构考虑**：V3 的 MoE 设计通常将所有专家保留在 GPU 内存中以获得性能；然而，这不是硬性要求。现代堆栈可以将权重卸载/分区（CPU/NVMe，跨节点张量并行），但代价是显著的延迟/吞吐量损失。\n\
  \n这些挑战需要针对大规模模型部署的特定工具和技术。让我们首先研究为什么你可能自己部署 DeepSeek 而不是使用官方 API。\n\n### 为什么要自部署以及\
  \ DeepSeek 的独特之处？\n\n通常，你会遇到选择自部署 DeepSeek 或任何其他最先进 LLM 的场景。例如，假设你正在处理敏感的法律文件，如合并协议——官方的\
  \ DeepSeek API 可能不是一个选择。不是因为它不够好，而是因为客户合同通常禁止将特权文件发送给第三方服务。这个场景说明了为什么自部署不仅仅是一项技术实践。它通常是一种商业必要性。\n\
  \n让我们谈谈你可能想要自部署的一些关键原因：\n\n*   **控制和定制**：控制不是可有可无的；它是你如何将通用模型转变为适合你领域、风险状况和产品约束的系统的方式。自部署允许你接触\
  \ API 不会暴露的层（分词、路由、适配器、系统提示和安全策略），因此模型反映的是你的要求而非供应商的默认值。当 Bloomberg 构建 BloombergGPT\
  \ 时，他们不仅仅想要一个金融语言模型；他们需要修改分词器以处理金融术语，并将一半的训练语料库保密。这种程度的控制是基于 API 的服务无法实现的。\n\n对于\
  \ DeepSeek 部署，控制意味着以下内容：\n\n*   调整超出 API 限制的生成参数。\n*   合并特定领域的适配器（例如 LoRA）或专用适配器。\n\
  *   实现适合你领域的自定义安全过滤器。\n*   无供应商限制地修改系统提示。\n*   **规模成本**：成本不仅仅是一张价格表；它是利用率、批处理和缓存的函数。如果你的流量稳定或高容量，拥有服务堆栈可以让你分摊硬件成本并提高利用率，通常使有效的每令牌成本远低于按计量的\
  \ API。在规模上，经济性会急剧转变。对于每天处理数百份合同的法律文档工作流，使用以下方向性成本（截至 2025 年 8 月，硬编码前请验证）：\n    *\
  \   **API 成本**：每百万令牌约 $30–50\n    *   **自托管（分摊）**：每百万令牌约 $2–5\n    *   **盈亏平衡点**：通常在\
  \ 10-20M 令牌/月左右\n\n*   **隐私和数据驻留**：对许多组织来说，隐私不是可选的；它是合同和法规要求的。自部署将敏感令牌保留在你的边界内，执行数据驻留和保留策略，并提供对数据流向的审计能力。例如，波恩大学医院部署了本地\
  \ LLM 用于胸部 X 光报告，专门是为了遵守德国数据本地性规则。本地推理处理所有敏感的医疗数据，无需云端出口或第三方处理。\n\n在法律领域，要求更为严格：\n\
  \n*   律师-客户特权禁止大多数外部处理。\n*   财务文件可能引发 SOX 合规问题。\n*   欧盟数据驻留要求（GDPR）。\n*   特定行业的法规（如\
  \ HIPAA 和 PCI-DSS）。\n*   一些法律团队试验本地 LLM 以避免内容过滤器可能将特权材料标记为不当内容。\n\n*   **性能**：延迟和吞吐量是塑造用户体验、SLO\
  \ 甚至单位经济性的产品特性。自己运行堆栈消除了网络往返，并允许你针对你的硬件和工作负载定制服务引擎，释放比一刀切 API 更低的 TTFT 和更高的 tokens/sec。截至\
  \ 2025 年 8 月，vLLM 基准测试报告与之前最先进的系统相比有 2–4 倍的吞吐量提升（[`arxiv.org/abs/2309.06180`](https://arxiv.org/abs/2309.06180)），与\
  \ Hugging Face Transformers 相比高达 24 倍（[`blog.vllm.ai/2023/06/20/vllm.html`](https://blog.vllm.ai/2023/06/20/vllm.html)）并支持连续批处理。\n\
  \n自托管的性能提升如下：\n\n*   消除 API 往返延迟（通常 50–200ms）。\n*   实现连续批处理以获得更高吞吐量。\n*   针对你的特定硬件配置进行优化。\n\
  *   在本地缓存常见的提示前缀。\n\n*   **特定用例**：西太平洋银行（Westpac）等主要银行已与 Kasisto 合作（[`www.westpac.com.au/about-westpac/media/media-releases/2022/23-august/`](https://www.westpac.com.au/about-westpac/media/media-releases/2022/23-august/)）部署银行工作流的特定行业\
  \ LLM；这些部署通常在银行的云边界内运行。\n\n虽然自部署的动机广泛适用，但在你配置该 GPU 集群之前，DeepSeek 的架构创造了值得理解的独特挑战。\n\
  \n你应该注意的关于不同模型的一些 DeepSeek 特定部署考虑因素如下所列：\n\n*   **DeepSeek-V3 内存需求和放置**：V3 的 MoE\
  \ 设计在理论上是优雅的：671B 总参数，但每个令牌只有 37B 活跃。在实践中，这是一个内存管理难题。为了获得最佳性能，团队将所有专家保留在 GPU 内存中。将权重卸载或流式传输到\
  \ CPU/NVMe 或跨节点分片是可能的，但这会带来巨大的延迟和吞吐量损失。有关整合的 VRAM 和 GPU 规模（包括 INT4 占用空间和 H100 数量），请参阅关于硬件和推理优化引擎的部分。\n\
  *   报告的 4 GPU 部署通常针对较小的变体，或依赖于对 CPU/NVMe 的重度卸载/权重流式传输，这会引入大的减速。\n*   有关整合的 VRAM\
  \ 和 GPU 规模（包括 INT4 占用空间和 H100 数量）、容量规划和余量指南，请参阅关于硬件和推理优化引擎的部分。\n*   **DeepSeek-R1\
  \ 推理密集型生成**：R1 的推理链带来了不同的挑战。那些使 R1 如此强大的 `` 令牌也使内存使用和延迟激增（长*思考*阶段，尖峰内存）。一个简单的问题可能在实际答案之前生成数千个推理令牌。\n\
  \n那么这在实际环境中意味着什么？例如，使用 DeepSeek-V3 的 **多头潜在注意力** (**MLA**)，KV 缓存占用空间约为每令牌 70 KB（≈每\
  \ 10k 令牌 0.7 GB），远低于传统注意力 KV 大小，但对于容量规划仍然是首要的。R1 的公开文档没有发布每令牌的 KV 大小；内存和延迟将取决于推理深度：\n\
  \n*   由于*思考*阶段，TTFT 可能明显更高；具体的 TTFT 取决于工作负载和服务堆栈（没有广泛引用的 >30s 基准）。\n*   内存使用是不可预测的；它取决于推理复杂性。\n\
  *   吞吐量通常由*思考*阶段主导。\n\n截至 2025 年 8 月，完整 R1 的公开 H200 数字因堆栈和工作负载而异。NVIDIA 在早期 NVIDIA\
  \ 推理微服务 (NIM) 预览中报告了 8× H200 约 ~3,872 tokens/sec；后来的 Blackwell (8×) 营销声称达到 ~30k\
  \ tokens/sec。对于你自己的用例，请务必将供应商数字视为营销数字，直到在你的工作负载上进行验证，并在硬编码容量假设之前验证当前数字。无论哪种方式，单个请求可能仅用于内部推理就需要\
  \ 5,000+ 令牌。\n\n这些挑战并非旨在阻止自部署。它们旨在为你做好准备。本章重点部署全参数 DeepSeek-V3 (671B) 和 DeepSeek-R1\
  \ 模型；虽然较小的蒸馏或微调变体对于原型设计很有用，但它们不是这里的重点。关键点是，这并不自动意味着你应该自部署以省钱。自托管主要在合规性要求时或你拥有持续、高令牌量和强大\
  \ GPU 利用率时才能收回成本；否则，API 或托管服务通常更便宜、更简单，直到你测量的工作负载超过你验证的盈亏平衡点。\n\n关键是将你的部署策略与你的实际需求匹配：\n\
  \n*   需要处理敏感文件？自部署可能是强制性的。\n*   每天处理数百万令牌？经济学上倾向于自托管。\n*   需要低于 100ms 的延迟？具有优化服务的本地部署是最好的。\n\
  *   只是在试验？从 API 开始，需要时迁移。\n\n让我们引导你通过一个框架来系统地做出这些决策，将部署从一项艰巨的挑战转变为一系列可管理的权衡。\n\n\
  ## 选择部署策略的决策框架\n\n部署选择主要取决于我们在上一节讨论的关键驱动因素：控制、成本和复杂性。你将发现自己需要在这三者之间进行权衡并找到合适的平衡点。\n\
  \n根据你的用例，你可以选择以下三种部署策略之一：\n\n*   **API 方法**最大程度降低复杂性，但成本多变且控制较少。\n*   **托管服务**提供中等复杂性和企业功能，但单位成本更高。\n\
  *   **DIY（自托管）部署**最大化控制并在规模上实现最佳单位成本，同时施加最高的运营负担。\n\n让我们构建一个框架来帮助你明智地选择，提供一个决策表（*表\
  \ 8.1*），按合规约束、持续令牌率和目标 SLO 进行索引。\n\n| **选择** | **控制** | **成本** | **复杂性** | **典型用途**\
  \ | **关键 SLO 变量** |\n| --- | --- | --- | --- | --- | --- |\n| API | 低 | 可变，按令牌付费\
  \ | 低 | 原型设计；突发负载 | TTFT，p95 延迟（网络）；提供商速率限制 |\n| 托管 | 中 | 每令牌成本更高 | 中 | 企业功能；IAM\
  \ | TTFT，p95；自动扩展行为 |\n| DIY | 高 | 规模上最低 | 高 | 稳定高流量 | tokens/sec，TTFT，p95；GPU 利用率\
  \ |\n\n表 8.1：为 DeepSeek 模型选择部署选项\n\n每个部署决策都归结为这三个相互竞争的力量（控制、成本和复杂性）。根据我的经验，你可以优化其中两个，但很少三个都能优化：\n\
  \n*   **控制**意味着调整每个参数、合并模型、实现自定义安全过滤器或为合法研究运行*无审查*版本的能力。一家公司可能会从 Vertex AI 迁移到自托管的\
  \ vLLM，这给了他们所需的控制权，但他们必须配备专门的 *LLM SRE* 团队来维持低于 300ms 的延迟。\n*   **成本**是数学变得有趣的地方。DeepSeek\
  \ 的 API 按输入/输出令牌计费（你的有效*混合*费率取决于组合）。在 4× A100 GPU 上自托管？在 1,600 tokens/sec 下，这大约是每百万令牌\
  \ $1.24，但这假设你让那些 GPU 保持忙碌。仅就基础设施数字而言，自托管可能已经更便宜；真正的盈亏平衡分析只有在你为你的组织显式添加固定人员/运营开销后才会出现。\n\
  *   **复杂性**是隐性的税款。运行你自己的推理基础设施意味着雇佣专家、编写手册，以及在模型服务器凌晨 3 点崩溃时被呼叫。AWS 关于 EKS 上 DeepSeek-R1\
  \ 的参考架构需要深入的 Kubernetes 专业知识和 GPU 调度知识。\n\n最佳点？大多数组织发现不是完全选择一条路径，而是知道何时使用每条路径。你可以想象将低流量功能保留在\
  \ Vertex AI 上，同时将高流量的对账作业迁移到内部 vLLM 集群，将成本从每令牌 1.4¢ 降至 0.3¢。\n\n你可以使用以下决策图（*图 8.1*）作为起点来探索哪个选项最适合你。你可以选择最适合你应用程序的部署路径。我们稍后会详细介绍所有选项。\n\
  \n![图 8.1：选择如何部署 DeepSeek 的决策图](img/B33471_08_1.png)\n\n图 8.1：选择如何部署 DeepSeek 的决策图\n\
  \n**注意**\n\n决策树中的 Local/Ollama 路径仅适合作为开发代理，不适用于完整的 DeepSeek-V3 (671B) 或 R1 部署，后者需要多\
  \ GPU 或托管基础设施。\n\n总的来说，这个框架通过平衡控制、成本和运营复杂性，将每个用例映射到 API、托管或 DIY 策略。为了对已选择的选项进行压力测试，请使用你自己的\
  \ $/小时报价和工作负载上测量的 tokens/sec 运行快速成本健全性检查，这样你就是从测量的经济性（而非营销数字）进行决策。\n\n### 成本健全性检查\n\
  \n截至 2025 年 8 月，将 $/h 和 tokens/sec 视为变量，并在硬编码之前验证当前费率。\n\n例如，如果你的 8× H200 端点报价约为\
  \ $40/h 并且在你的测量中维持约 3,000 tokens/sec，基础设施成本≈ 每千令牌 $0.0037（不包括人员/运营）。将其与提供商的令牌价格和你观察到的提示/响应分布进行比较。\n\
  \n除非明确标记为*混合*或*摊销*，否则每令牌成本显示为*分割输入/输出*费率。任何单一数字都是*1:1 混合假设*或*摊销的基础设施估计*，并相应标注。在硬编码价格之前，请验证当前的提供商表格。\n\
  \n让我们用实际数字来说明这些权衡：\n\n| **部署路径** | **前期成本** | **每令牌成本** | **技术专业知识** | **延迟/吞吐量**\
  \ | **隐私** | **可扩展性** |\n| --- | --- | --- | --- | --- | --- | --- |\n| DeepSeek\
  \ API | $0 | V3：$0.27/M 输入 + $1.10/M 输出<br>R1：$0.55/M 输入 + $2.19/M 输出 | 非常低 | 环境相关的端到端\
  \ TTFT 和 p95 延迟<br>tokens/sec 吞吐量 | 数据离开 VPC | 弹性，由供应商管理 |\n| Local/Ollama (RTX\
  \ 4090) | 约 $1,599 GPU | $0.43/M 令牌（摊销） | 低-中 | 8–70 tokens/sec<br>TTFT < 150ms\
  \ | 完全本地控制 | 受限于 GPU RAM |\n| 托管服务 (Bedrock/Vertex) | 按需 $0。承诺 $2,000+/月 | Vertex\
  \ 上的 DeepSeekR1：$1.35/M 输入 + $5.40/M 输出（区域/模型相关） | 中 | 指示性；因模型/区域/批处理而异。<br>示例：R1\
  \ 在 8× H200 上约 ~3,872 tokens/sec（NVIDIA 预览）。 | 区域内，SOC2 | 自动扩展，全球化 |\n| DIY Kubernetes\
  \ (4× A100-80GB) | $5,155/月 基础设施（$1.79/GPU 小时） | @ 1,600 tokens/sec $1.24/M 令牌 |\
  \ 高 | 高达约 3,800 tokens/sec 在 8× H200 上（NVIDIA 预览） | 完全 VPC 隔离 | 手动扩展 |\n\n表 8.2：DeepSeek\
  \ 各种部署选项的定价比较矩阵（截至 2025 年 8 月）\n\n使用简单的规划公式来建模你的工作负载成本：\n\n例如，让我们为矩阵中的 4× A100 DIY\
  \ 设置代入数字。大约每小时 $7.16（4 GPU × $1.79/h）和测量的 1,600 tokens/sec，公式简化为每小时计算：*$7.16 ÷ (1,600\
  \ × 3600) ≈ 每百万令牌 $1.24*。你现在可以直接将其与 API 进行比较。这个自托管成本略低于 DeepSeek-R1 API 的约 $1.37/M\
  \ 令牌的混合费率（1:1 输入/输出）。决策随后取决于利用率：如果你的工作负载足够一致以保持 GPU 忙碌，自托管提供节省；如果是间歇性的，按需付费的 API\
  \ 将更便宜。\n\n那么你如何选择？\n\n*   **API 胜出时**：你正在试验，有可变负载，或每月处理少于 100M 令牌。零运营开销值得溢价。\n\
  *   **本地出色时**：你有开发、测试或绝对不能离开你场所的敏感数据。例如，假设 4090 GPU 上约 65 tokens/sec，1:1 I/O 比率，并将\
  \ $1,599 GPU 在 50% 利用率下分摊 24 个月，仅 GPU 成本约为每百万令牌 $0.8（不包括电力和运营）。使用成本公式根据你的工作负载进行调整。\n\
  *   **托管服务合理时**：你需要企业功能（审计日志、IAM 集成和全球化部署）而没有运营负担。更高的每令牌成本买来了安心。\n*   **DIY 提供价值时**：你每月处理数十亿令牌且有可预测的负载。一个处理\
  \ 3B 令牌/月的 4× A100 集群相比 API 节省约 $3,000 – 足以雇佣那个 SRE。\n\n但决策树不是万能的。它没有告诉你大多数成功的部署是混合的。回想一下我们在本章开头讨论的法律场景。他们可能需要一种部署选项。你可能会遇到三条路径或选择用于\
  \ DeepSeek 部署：\n\n*   使用 API 进行低容量实验功能，或在私有数据上进行合成数据生成。\n*   在本地 GPU 上部署微调的法律分类器进行文档处理。\n\
  *   利用 Bedrock 进行需要五个九正常运行时间的面向客户的应用程序。\n\n这个框架不是关于永远选择一条路径——而是关于知道哪条路径最适合每个用例。\n\
  \n你准备好看看每条路径在实践中实际是什么样子了吗？让我们深入实施细节。\n\n### 三条部署路径\n\n本节详细介绍了我们在 *图 8.1* 中确定的每条部署路径，并重点介绍了你可以为部署采取的具体步骤。\n\
  \n#### 路径 0：基线（官方 DeepSeek API）\n\nAPI 方法提供最低的运营开销。一切正常工作，其他人处理维护，你可以专注于你来要做的事情。对于许多团队来说，即使考虑了所有替代方案，这仍然是正确的选择。\n\
  \nDeepSeek API 提供两个主要模型：`deepseek-chat` (DeepSeek-V3) 和 `deepseek-reasoner` (DeepSeek-R1)。截至\
  \ 2025 年 8 月，两者都提供 128K 上下文窗口。最大输出令牌取决于 API 参数（例如 `max_tokens`）和提供商设置。定价与公开表格一致。V3\
  \ 每百万输入令牌 $0.27，每百万输出令牌 $1.10；R1 每百万输入 $0.55，每百万输出 $2.19。\n\n入门需要最少的仪式，正如你在 *第 5\
  \ 章* 中看到的：\n\n```python\nimport os\nfrom openai import OpenAI\n\nclient = OpenAI(\n\
  \    api_key=os.getenv(\"DEEPSEEK_API_KEY\"),\n    base_url=\"https://api.deepseek.com\"\
  \n)\n\nresponse = client.chat.completions.create(\n    model=\"deepseek-chat\",\
  \  # 或 \"deepseek-reasoner\" 用于 R1\n    messages=[\n        {\"role\": \"user\"\
  , \"content\": \"什么是合同中的关键条款？\"}\n    ],\n    max_tokens=1024\n)\n\nprint(response.choices[0].message.content)\n\
  ```\n\n\n### 引言\n\n```python\nimport deepseek\n\ndeepseek.api_key = \"YOUR_KEY\"\
  \n\nresp = deepseek.ChatCompletion.create(\n    model=\"deepseek-reasoner\",\n \
  \   messages=[{\"role\": \"user\", \"content\": \"Prove the Pythagorean theorem.\"\
  }],\n    stream=True,   # 始终使用流式传输——降低 R1 的感知延迟\n    # 原因：使用流式传输可降低 R1 的感知延迟（TTFT）；同时能限制客户端缓冲区的增长。\n\
  )\n\nfor chunk in resp:\n    print(chunk.choices[0].delta.content, end=\"\", flush=True)\n\
  # 原因：保护客户端免受 R1 漫长“思考”阶段的影响；请根据您的服务水平协议（SLA）进行调整（例如 60–120 秒）。\n```\n\n这段代码是使用 API\
  \ 获取响应并直接流式传输结果的一个简单示例。\n\n该 API 的实际运行情况既有惊喜，也有隐藏的复杂性。截至 2025 年 8 月，请求最长可运行约 30\
  \ 分钟超时。在依赖这些限制之前，请核实当前的限制。尽管前面的代码示例中未显示，但您可能需要密切关注 API 密钥的开销，以保护预算，特别是考虑到 R1 倾向于冗长的推理过程。\n\
  \n一家供应链 SaaS 公司记录了其从 OpenAI 的`GPT-4o`迁移到 DeepSeek 的过程，主要动机是 API 价格低了近 25 倍（`https://medium.com/tracified/deepseek-vs-openai-aec06fbee43a`）。然而，节省成本伴随着一个权衡：迁移并非简单的替换，而是需要彻底改革他们的提示词工程策略。该团队发现，DeepSeek\
  \ 需要更明确、更详细的指令，才能匹配他们从更灵活的 OpenAI 模型那里获得的提取准确性。\n\n### 路径 1：本地和本地部署（用于开发和特定场景）\n\
  \n本地部署是事情变得有趣的地方。此路径主要用于开发和原型设计；它不适用于全参数的`DeepSeek-V3`（671B）或`DeepSeek-R1`部署，因为后者需要多\
  \ GPU 或托管基础设施。您用 API 的便利性换取完全的控制权——这非常适合处理机密文件的法律分类器或探索*无审查*模型行为的研究实验室。\n\n我们首先使用`Ollama`进行本地部署。\n\
  \n#### Ollama：摩擦最小的本地路径\n\n`Ollama`已成为以最少麻烦在本地运行模型的**事实标准**。安装在 Linux 或 macOS 上只需一条命令，如下所示：\n\
  \n```bash\ncurl -fsSL https://ollama.com/install.sh | sh\n```\n\nWindows 用户可使用 MSI\
  \ 安装程序，可从`https://ollama.com/download/OllamaSetup.exe`下载。\n\n```bash\nollama pull\
  \ deepseek-r1:14b-q4_K_M  # 14B 蒸馏版，可在 16GB 显存内运行\nollama run deepseek-r1:14b\n\
  ```\n\n在前面的代码片段中，我们使用了 14B 蒸馏模型。14B 模型代表了一个有趣的中间平衡点，在本地运行的能力和其反馈答案的力量之间取得了平衡。在`Q4_K_M`量化下，它占用约\
  \ 8.5 GB 的显存，截至 2025 年 8 月，在`RTX 4090`（非科学测试；工作负载各异）上的非正式本地测试中，速度约为 65–72 tokens/秒。虽然不是极快，但对于开发或小规模生产使用来说完全足够。完整的模型目录范围从用于内存受限系统的激进\
  \ 3 位量化（约 7.5 GB）到保留更多原始模型能力的 8 位版本（约 16.7 GB）。\n\n#### Docker + vLLM：生产级本地服务\n\n\
  当`Ollama`的简单性达到其极限时，容器化的`vLLM`（即从 Docker 容器运行的`vLLM`）提供了一种更复杂的方法。这不是您标准的 Flask 或\
  \ FastAPI 包装的模型——`vLLM`带来了工业级的优化，例如分页注意力（Paged Attention），与简单实现相比实现了 24 倍的吞吐量提升。权衡在于复杂性与工作负载配置。那\
  \ 24 倍的提升反映了高并发负载下的吞吐量，这对生产来说是游戏规则的改变者，但对于在本地运行单个请求的开发者来说通常是过度的。对于低并发或开发工作流程，`Ollama`的简单性难以超越；当您需要从单个共享\
  \ GPU 为多个用户或应用程序提供服务时，`vLLM`才能证明其设置开销是合理的。\n\n**分页注意力**\n\n`分页注意力`是一种内存管理算法，它将 KV\
  \ 缓存存储在非连续的内存块中，就像操作系统使用虚拟内存和分页一样。这解决了内部内存碎片问题，能够实现更大的批处理大小，并最终带来`vLLM`所知的吞吐量提升。\n\
  \n使用`docker run --gpus all -p 8000:8000 -v models:/models deepseek-vllm:latest`启动以下脚本。您将获得一个与官方\
  \ DeepSeek API 使用相同协议的 OpenAI 兼容端点。\n\n```dockerfile\nFROM nvidia/cuda:12.4.1-runtime-ubuntu22.04\n\
  RUN pip install vllm==0.8.5\nENV HF_TOKEN=<your-token>\nCMD vllm serve \\\n    \
  \ --model \"deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct\" \\\n     --dtype \"bfloat16\"\
  \ \\\n     # 原因：限制上下文以约束 KV 缓存增长；仅在内存允许时提高此值。\n     --max-model-len \"8192\" \\\n\
  \     # 原因：推动显存使用以提升吞吐量；>0.95 可能在突发负载时导致内存溢出。安全范围：0.85–0.95。\n     --gpu-memory-utilization\
  \ \"0.95\"\n```\n\n### 面向部署的硬件与推理优化引擎\n\n当您需要在本地部署与云部署之间切换，而无需重写应用程序代码时，这种兼容性就变得至关重要。\n\
  \n对于处理敏感数据的团队，像`OnPrem.LLM`([`arxiv.org/html/2505.07672v2`](https://arxiv.org/html/2505.07672v2))这样的项目可以在这些本地服务层之上构建完整的\
  \ RAG 流水线，确保专有文档永远不会离开您的基础设施。\n\n## 路径二：托管推理服务（平衡之道）\n\n托管服务在控制力与便利性之间取得了绝佳平衡。您无需雇佣专门的\
  \ MLOps 团队，即可获得企业级功能（审计日志、IAM 集成以及全球部署）。想象一下，一家快速发展的 B2B SaaS 公司，其核心产品是 AI 驱动的分析仪表盘。公开\
  \ API 非常适合其最小可行性产品，但其新的企业客户要求保证正常运行时间、更低的延迟以及在私有网络内进行处理。自建 Kubernetes 集群需要数月时间，并需要雇佣专门的\
  \ MLOps 工程师。因此，他们转向了 Amazon Bedrock 或 Vertex AI 等托管服务。这一举措使他们能够以可预测的成本模型和最小的运维负担，获得所需的企业功能，如私有端点和预配置吞吐量，从而满足企业需求，而不影响其产品路线图。\n\
  \n各大主要云服务提供商都已拥抱 DeepSeek，尽管其方法各有不同。让我们来逐一介绍：\n\n*   **Amazon Bedrock** ([`aws.amazon.com/bedrock`](https://aws.amazon.com/bedrock))\
  \ 通过 Bedrock（包括 Marketplace）提供`DeepSeek-R1`，支持无服务器调用。Bedrock 中通常提供预配置吞吐量，但其可用性可能取决于具体的第三方模型和区域——请为您的账户核实。无服务器选项非常适合可变负载，而预配置吞吐量（在可用的情况下）一旦超过持续\
  \ Token 速率，即可保证一致的性能。其内置的护栏服务无需自定义代码即可添加内容过滤，这对于面向客户的应用至关重要。\n*   **SageMaker JumpStart**\
  \ ([`docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html`](https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html))\
  \ 采用了不同的方法，专注于可以在单 GPU 实例上轻松运行的蒸馏版本（8B 和 32B）。AWS 最近的一篇博客文章展示了在`ml.g5.xlarge`实例上服务\
  \ 8B 模型。定价因区域和承诺而异，请为您的账户核实费率。\n*   **Google Vertex AI** ([`cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek`](https://cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek))\
  \ 在其模型花园中添加了`DeepSeek-R1`，支持一键部署。截至 2025 年 8 月，`us-central1`区域的代表性价位约为每百万 Token\
  \ 6.75 美元。费率因区域/模型而异，请在您的账户中核实。它比官方 API 更贵，但包含企业级 SLA 和私有端点支持。\n*   **Azure AI Foundry**\
  \ ([`azure.microsoft.com/en-us/products/ai-foundry`](https://azure.microsoft.com/en-us/products/ai-foundry))\
  \ 补齐了三大云商的阵容，同时提供无服务器和专用集群选项。其负责任的 AI 记分卡提供自动偏差检测和内容安全分析——这些功能可以为受监管行业节省数月的定制开发时间。\n\
  *   **Hugging Face Inference Endpoints** ([`huggingface.co/inference-endpoints/`](https://huggingface.co/inference-endpoints/))\
  \ 因其透明度值得特别提及。其部署向导会预先显示明细成本，但费率因区域/计划/提供商而异。截至 2025 年 8 月，可将 8×H200 大约$40/小时作为市场参考（例如，Together\
  \ AI 的公开报价约为$0.67/分钟）。对于 Hugging Face Endpoints，自动`缩容至零`是可选加入的，并且默认在闲置约 15 分钟后触发（历史上也记录为约\
  \ 1 小时）。存在用于将端点`手动缩容`至 0 的编程控制；除非您的提供商明确支持，否则不要假设有 60 秒的闲置超时。请为您选择的区域/计划核实可用性和具体语义。\n\
  \n一种实用的混合模式是，将延迟敏感、面向客户的推理保留在托管平台上，而将大型、非交互式的批处理作业转移到专用端点以降低成本。SageMaker 上的成本案例研究报告了显著的节省；例如，Forethought\
  \ 指出，迁移到 SageMaker 后，推理成本降低了高达 80% ([`aws.amazon.com/solutions/case-studies/forethought-technologies-case-study/`](https://aws.amazon.com/solutions/case-studies/forethought-technologies-case-study/))。\n\
  \n## 路径三：在 IaaS 上自建（为了极致控制）\n\n自建部署是工程与经济的交汇点。您不仅仅是在运行一个模型；您是在构建基础设施。这条路径需要专业知识，但能提供无与伦比的灵活性和潜在的成本节约。以下是一些典型用例及各自示例：\n\
  \n*   **受监管和网络隔离的工作负载**：您必须将数据保留在特定的网络边界或国家内，并且不能使用第三方端点。例如，一家医院在自己的 VPC 中通过私有 API\
  \ 部署 DeepSeek，没有互联网出口。\n*   **稳定、高流量且注重每 Token 成本的工作负载**：您的工作负载具有可预测的每日/每周批处理任务，并保持\
  \ GPU 繁忙。例如，一个电子商务团队在`vLLM`集群上运行夜间目录充实和翻译，与按 Token 付费的 API 相比降低了单位成本，并控制了批处理窗口。\n\
  *   **超低延迟或网络邻近性**：您需要达到公共 API 难以企及的 p95 延迟目标。例如，一个交易台将推理节点与其市场数据流并置，使用编译内核（`TensorRT-LLM`）和\
  \ KV 缓存预热器，并避免跨区域跳转。\n*   **自定义模型或运行时控制**：您需要托管端点未暴露的能力。例如，一个法律科技平台合并领域 LoRA，执行自定义的脱敏过滤器，调整\
  \ R1 *思考*预算，并在`vLLM`中调整连续批处理参数以匹配其流量。\n*   **具有严格隔离和预算的多租户平台**：您必须保证每个租户的数据隔离，并在数千个租户间强制执行\
  \ Token 预算。例如，一个开发者平台为每个租户运行独立的命名空间，使用粘性路由会话以利用缓存局部性，并在网关处执行令牌桶限制。\n*   **本地部署、边缘或不可靠的\
  \ WAN**：您无法依赖稳定的连接。例如，一家工厂在一个小型本地 GPU 集群上运行 DeepSeek，并定期更新权重，以确保即使在无线网络链路中断时也能继续进行本地推理。\n\
  *   **供应商独立性和容量控制**：您希望在需求激增前提前锁定价格/可用性。例如，一家媒体公司在两个区域预留 GPU，为基线负载自建，仅在发布期间突发到托管端点。\n\
  \n这些模式充分发挥了自建的优势：完全控制内存放置（这对 V3 的 MoE 很重要）、限制或塑造 R1 推理 Token 的能力、大规模下可预测的单位经济学，以及与您自己的安全和\
  \ SRE 实践的深度集成。\n\n以下是一些您可以尝试的方法：\n\n*   **单 VM 或裸金属**：最简单的自建方法类似于本地部署，但使用更强大的硬件。一个典型配置可能包括\
  \ 4×A100-80GB GPU，运行`vLLM`，其中`DeepSeek-V3`被量化到 INT4。截至 2025 年 8 月，在高利用率下，实测吞吐量约为每秒\
  \ 1,600 个 Token，每百万 Token 的基础设施成本低于约$2；在承诺之前，请用您的工作负载进行验证。\n\n使用更新的硬件，这个计算变得更有意思。NVIDIA\
  \ 报告称，在早期 NIM 预览条件下，在 8×H200 上运行 R1 的速度约为 3,872 tokens/sec；后来的 Blackwell（8×）营销声称达到约\
  \ 30k tokens/sec（[`blogs.nvidia.com/blog/deepseek-r1-nim-microservice/`](https://blogs.nvidia.com/blog/deepseek-r1-nim-microservice/)\
  \ 和 [`developer.nvidia.com/blog/nvidia-blackwell-delivers-world-record-deepseek-r1-inference-performance/`](https://developer.nvidia.com/blog/nvidia-blackwell-delivers-world-record-deepseek-r1-inference-performance/)）。对于每天处理数十亿\
  \ Token 的组织来说，投资回报率可能很快显现。\n\n*   **Kubernetes 编排**：Kubernetes 部署将自建从*运行一个服务器*提升到*运营一个服务*。2025\
  \ 年的现代方法以`KServe` v0.15 作为服务层为核心，但真正的重点在于您如何思考扩展和优化。\n*   与传统的 Web 服务模式不同，LLM 部署需要不同的思维模型。您不是根据每秒请求数进行扩展；而是根据实际完成的工作量进行扩展：有多少请求正在积极生成\
  \ Token，与有多少在队列中等待。诸如**Kubernetes Event-driven Autoscaling**（`KEDA`）之类的工具通过监视真实的\
  \ LLM 指标（而非原始的请求计数）来实现这种更智能的扩展（[`keda.sh/`](https://keda.sh/)）。\n\n以下是自建部署中最关键的一些架构选择：\n\
  \n*   **智能自动扩展**：基于有意义的指标（如活跃的生成负载）进行扩展，而非 HTTP 请求速率。R1 较长的推理阶段使得这一点尤为重要。\n*   **Token\
  \ 预算控制**：与传统的速率限制不同，您需要在 Token 级别限制支出。Envoy AI Gateway 和类似工具提供了这种控制，无需重写客户端。\n*\
  \   **KV 缓存共享**：在会话式工作负载中，跨副本共享缓存可显著提高吞吐量。像 LMCache 这样的技术使这成为可能，无需更改应用程序。\n*   **多节点考虑**：当模型超出单节点内存时，您就进入了不同的复杂性领域。流水线和张量并行可以工作，但需要仔细规划，并且它们目前不支持自动扩展。\n\
  \n请注意，即使是 INT4 量化的 V3 也需要多个 GPU。R1 的思考阶段需要宽松的超时时间。对于最大的模型，较少但强大的节点加上快速互连通常优于许多较小的实例。然而，这些并非即插即用的解决方案。每个优化都需要理解您特定的工作负载模式。团队经常发现，他们的*聊天*工作负载实际上是\
  \ 80%的单轮提问，使得会话优化的缓存毫无价值；或者他们实现了复杂的自动扩展，结果发现他们的负载是完全可预测的。\n\n我们探索的每条路径都有其合理的用例。API\
  \ 擅长处理原型和可变负载。本地部署保护敏感数据，同时允许在较小模型上进行实验；完整的`DeepSeek-V3`或 R1 需要多 GPU 或托管服务。托管服务在功能和操作简便性之间取得了平衡。自建基础设施提供终极控制力和规模化的经济效益。\n\
  \n您的选择较少取决于技术优越性，更多取决于组织的现实情况。您是否有运行 Kubernetes 的专业知识？您的数据能否离开您的本地环境？您是否会处理足够多的\
  \ Token 来证明基础设施投资的合理性？诚实地回答这些问题，正确的路径就会变得清晰。\n\n接下来，我们将深入探讨使任何这些路径成为可能的基础技术，因为无论您是调用\
  \ API 还是运行自己的集群，理解底层机制都有助于您做出更好的决策。\n\n下一节将调查支撑这些选择的硬件和服务引擎。\n\n## 选择您的硬件\n\nVRAM\
  \ 容量决定了可行性；其他组件主要影响速度。在 LLM 部署方面，您的 GPU 内存决定了什么是可能的，而其他一切只决定了发生的快慢。\n\n当前用于 DeepSeek\
  \ 部署的 GPU 层级如下所示：配备 80 GB HBM3 的 H100 位于顶端，通过其 Transformer Engine 提供 3.3 TB/s 的内存带宽和原生\
  \ FP8 支持。A100（40 GB 或 80 GB 变体）仍然是生产主力——可靠、广泛可用，并且对于大多数用例来说速度仍然足够快。L40S 提供了一个有趣的中间选择，配备\
  \ 48 GB GDDR6——内存带宽较低，但通常更容易采购。\n\n一个采用 BF16（`bfloat16`）精度——这是一种在现代 GPU/TPU 上使用的\
  \ 16 位浮点格式，每个参数存储 2 个字节，在更少的尾数位（即精度位）下保留 FP32 的数值范围——的 33B 参数模型需要以下内容：\n\n*   基础内存\
  \ = 33B 参数 × 2 字节/参数 = 66 GB。\n*   运行时开销（约 10%） = 6.6 GB。\n*   总 VRAM 需求 = 约 73\
  \ GB。\n\n这还没计算用于上下文的 KV 缓存、用于批处理的激活内存，或者安全余量。您的 33B 模型勉强能塞进单个 H100，但一旦启用生产特性，就需要多个\
  \ GPU。\n\n如果您选择部署具有 671B 参数的`DeepSeek-V3`怎么办？即使进行激进的 INT4 量化，您也需要至少 335 GB。在这种情况下，多\
  \ GPU 集群不是可选的，而是强制性的。\n\n另一个重要方面是利用推理引擎。原因如下。\n\n## 推理引擎\n\n对于 DeepSeek，在简单的 Web\
  \ 服务器中编写一个快速的`model.generate()`函数是不够的。我们很快发现了推理引擎所解决的性能瓶颈。\n\n朴素的逐请求生成一次处理一个请求，并在每个序列上逐个\
  \ Token 生成，然后才接受新的请求。在 Token 之间，GPU 通常等待 Python 开销和内核启动，KV 缓存以大块连续方式分配，随着序列在不同时间完成，导致内存碎片。例如，一个简单的\
  \ Flask 或 FastAPI 服务器，每个 HTTP 请求都调用`batch_size=1`的`model.generate()`，会运行一个用户流直到完成，而其他用户排队等待，导致\
  \ GPU 利用率低下。另一个常见情况是固定批处理，等待批次中的所有序列完成；短提示在空闲，而最长的提示阻塞整个批次。\n\n转向`vLLM`或 TGI 并使用连续批处理可以避免这些间隙。它们重用分页的\
  \ KV 内存，并在其他请求完成时插入新请求，这使得设备保持饱和。在实践中，这通常能在相似延迟下带来 2-4 倍的吞吐量提升。公开基准测试反复显示，在负载下与\
  \ Hugging Face Transformers 服务器相比有巨大收益（[`arxiv.org/abs/2309.06180`](https://arxiv.org/abs/2309.06180)\
  \ 和 [`blog.vllm.ai/2023/06/20/vllm.html`](https://blog.vllm.ai/2023/06/20/vllm.html)）。\n\
  \n朴素的方法将每个请求视为孤立的。您昂贵的 GPU 在等待 I/O、内存碎片以及短序列完成时闲置，而较长的序列则阻塞整个批次。\n\n于是推理引擎登场。推理系统有助于解决\
  \ GPU 时间的浪费，提高吞吐量，并降低延迟。让我们谈谈您可用的各种选择：\n\n*   **vLLM** ([`github.com/vllm-project/vllm`](https://github.com/vllm-project/vllm))：LLM\
  \ 引入了 PagedAttention，借鉴操作系统的虚拟内存概念来高效管理 KV 缓存。`vLLM`不是预分配巨大的连续内存块，而是像现代操作系统处理 RAM\
  \ 一样，对缓存条目进行分页。这意味着与朴素的服务方式相比，吞吐量提升了 2-4 倍，某些工作负载甚至能看到高达 23 倍的提升。\n*   `vLLM`真正的魔力在于连续批处理。传统服务方式等待批次中的所有序列完成才处理新请求，而`vLLM`则在其他请求完成时动态插入新请求，使您的\
  \ GPU 保持饱和。这就像出租车司机，一种方式是等待所有乘客到达目的地，另一种方式是沿途搭载新乘客。\n\n以下是如何实现批处理：\n\n```\n```\n\
  \n\n# 传统批处理伪代码\n\n```\ndef serve_batch(requests):\n    outputs = model.generate(requests)\
  \  # 必须全部完成\n    return outputs\n```\n\n# 连续批处理概念\n\n```\ndef serve_continuous():\n\
  \    while True:\n        if completed := get_finished_sequences():\n          \
  \  yield completed\n            add_new_requests_to_batch()\n        step_active_sequences()\n\
  ```\n\n\n```\n*   **`Text Generation Inference`** (**`TGI`**) ([`github.com/huggingface/text-generation-inference`](https://github.com/huggingface/text-generation-inference))：Hugging\
  \ Face 的 `TGI` 为 IBM Watson 和 Grammarly 的企业级部署提供动力。其核心技术结合了 `Flash Attention` 内核、`tensor\
  \ parallelism` 和 `safetensors`，以实现近乎即时的模型加载。与优化吞吐量的 `vLLM` 不同，`TGI` 平衡了吞吐量与一致的延迟表现——这对于面向用户的应用至关重要。\n\
  \n`TGI` 的优势包括连续批处理、`Flash Attention`、`PagedAttention`、量化和 `tensor parallelism`。它使用\
  \ `safetensors` 和优化的加载器来加速冷启动，但权重必须在服务请求前完全加载。\n\n*   **`TensorRT-LLM`** ([`github.com/NVIDIA/TensorRT-LLM`](https://github.com/NVIDIA/TensorRT-LLM))：NVIDIA\
  \ 的 `TensorRT-LLM` 代表了*更贴近底层硬件*的方法。它将你的模型编译成优化的 CUDA 内核，融合操作，并利用 H100 Transformer\
  \ Engine 等硬件特性。编译步骤增加了复杂性，但回报是巨大的——从 A100 FP16 迁移到 H100 FP8 时，吞吐量可提高 4.6 倍。\n\n\
  需要注意的是，`TensorRT-LLM` 对模型架构和硬件更为挑剔。它在 NVIDIA 最新 GPU 上运行其熟知的模型时表现最出色。对于 DeepSeek\
  \ 的 MoE 架构，你可能需要等待官方支持或深入研究自定义插件。\n\n**那么，如何选择你的推理引擎？**\n\n选择不在于哪个引擎是*最好*的；而在于将优势与需求相匹配。以下是一个快速指南，帮助你做出决策：\n\
  \n*   当需要最大灵活性和吞吐量时，使用 `vLLM`。\n*   当需要生产环境稳定性和一致延迟时，选择 `TGI`。\n*   当你拥有现代 NVIDIA\
  \ 硬件并需要追求极致的每秒 token 数时，采用 `TensorRT-LLM`。\n\n大多数团队因易用性而从 `vLLM` 或 `TGI` 入手，然后在达到规模时评估\
  \ `TensorRT-LLM`。妙处何在？三者都提供兼容 OpenAI 的 API，因此切换引擎通常只需更改配置，而非重写代码。\n\n量化是另一种可以帮助你加速推理时间和降低成本的技术。\n\
  \n## 量化的力量\n\n回忆一下 *第 2 章*，量化通过降低精度来缩小内存占用并提高吞吐量，通常伴随轻微的质量损失。量化领域提供了多种技术，每种都有其权衡：\n\
  \n*   **`FP8`** 代表了最温和的压缩，在保持近乎完美精度的同时将内存使用减半。它需要较新的硬件（H100/L40S），但提供了最佳的质量与压缩比。可以把它想象成从无损的\
  \ **`FLAC`** 格式转向高比特率的 MP3：技术上有损失，但实际上难以区分。\n*   **`GPT quantization`** (**`GPTQ`**)\
  \ 采用训练后处理方法，分析你的模型以确定哪些权重可以压缩到 4 位而不会导致灾难性遗忘。它速度快，只需要几百个样本的校准数据集，通常精度损失不到一个百分点。（要了解更多关于\
  \ `GPTQ` 的信息，请查阅 Hugging Face 博客：[`huggingface.co/blog/gptq-integration`](https://huggingface.co/blog/gptq-integration)。）\n\
  *   **`Activation-aware weight quantization`** (**`AWQ`**) 更进一步，识别那些对输出有不成比例影响的*显著*权重，并保持其在更高精度。对于\
  \ DeepSeek 的 MoE 模型，这种激活感知特别有价值——专家路由依赖于精确的权重值，而 `AWQ` 能够保留它们。（要了解更多并找到理解其工作原理的资源，Hugging\
  \ Face 的 `AWQ` 文档是个好去处：[`huggingface.co/docs/transformers/en/quantization/awq`](https://huggingface.co/docs/transformers/en/quantization/awq)。）\n\
  \n一个简单估算 GPU 内存的方法是将其分为三部分：模型权重、少量运行时余量和 `KV 缓存`：\n\n*   **`权重`**：从权重张量本身开始。将参数数量乘以所选精度下每个参数的字节数。对于一个\
  \ 330 亿参数的模型，`BF16` 每个参数存储约 2 字节，因此仅权重就大约需要 66 GB。`FP8` 将其减半至约 33 GB。使用 4 位量化时，每个参数存储约半字节。这意味着，实际上，330\
  \ 亿参数模型的 `GPTQ-4b` 检查点通常在 16–17 GB 左右，而 `AWQ-4b` 检查点通常更接近 18–19 GB，因为它们将一些关键值保持在更高精度。在相同位宽下，`AWQ`\
  \ 通常比 `GPTQ` 保留了稍高的精度。\n*   **`运行时余量`**：在权重大小上增加约 10–20%，用于临时工作空间、CUDA 内核缓冲区、分配器碎片以及（对于\
  \ MoE 模型）路由开销。以同样的 330 亿参数模型为例，在考虑序列内存之前，`BF16` 部署可能需要在 66 GB 的权重之外额外 6–13 GB。\n\
  *   **`KV 缓存`**：最后，为 `KV 缓存` 预留空间，它随着上下文长度、生成 token 数和批处理大小而增长。这部分与权重大小是分开的。对于 DeepSeek-V3\
  \ 的 MLA，每个 token 的 `KV 缓存` 大约为 70 KB（大约每 10,000 个缓存 token 占用 0.7 GB）。其他架构可能更大。乘以并发序列数来估算总的\
  \ `KV` 占用量。\n\n简而言之，对于一个 330 亿参数的模型，预计需要大约 66 GB (`BF16`) 或 ~33 GB (`FP8`) 用于权重，或者\
  \ ~16–17 GB (`GPTQ-4b`) / ~18–19 GB (`AWQ-4b`)，再加上 10–20% 的运行时余量，以及为服务的 token 预留的\
  \ `KV 缓存`。\n\n一个重要的陷阱：确保你的服务栈原生运行低位内核。一些系统在磁盘上存储 4 位权重，但在加载或矩阵乘法时将其转换为 `BF16/FP16`。这会悄悄地将\
  \ VRAM 需求推回接近全精度的数字，从而抹去性能和成本节约。通过检查加载后的日志和观察到的 VRAM，验证你的引擎（例如 `vLLM`、`TGI` 或 `TensorRT-LLM`）正在使用预期的低位执行路径。\n\
  \n实际影响如何？那个在全精度下需要昂贵 H100 的 330 亿参数模型，在经过 4 位量化后，可以轻松运行在单个 L40S 上。你的推理成本下降了 75%，而精度仅损失\
  \ 1–2%——大多数生产系统都乐意接受这种权衡。\n\n并非所有模型都能均匀地量化。较小的模型从量化中受苦更多；它们可供牺牲的冗余较少。任务复杂性也很重要：摘要任务可能容忍激进量化，而法律文档分析则要求更高精度。\n\
  \n务必针对你的具体用例验证量化模型。那 0.5% 的平均精度下降可能掩盖了在罕见但关键输入上 10% 的性能退化。并且请记住：*量化只是虚拟的 VRAM*。你仍然需要一个理解低位格式的推理引擎，否则你会在运行时进行反量化，从而失去所有优势。\n\
  \n硬件提供了原始能力。推理引擎释放了该能力的潜力。量化扩展了你的硬件预算。三者结合，将 DeepSeek 从一个令人印象深刻的演示转变为一个生产就绪的系统。\n\
  \n关键洞察是什么？这些并非独立的选择。只有当你的推理引擎能够利用它时，H100 的 `FP8` 支持才有意义。只有当你的引擎高效处理混合精度执行时，`AWQ`\
  \ 才有帮助。你的部署策略必须考虑完整的栈，而不仅仅是单个组件。\n\n考虑到硬件和服务引擎后，下一节将演示三个具体的部署场景。\n\n## 实践部署指南\n\n\
  这三个部署示例从笔记本电脑实验到云上生产逐步推进，每一个都建立在前一个经验教训的基础上。请跟随与你当前需求匹配的示例进行操作，但建议阅读全部三个示例，以了解完整的部署谱系。\n\
  \n让我们先从托管端点的成本分析开始。截至 2025 年 8 月，托管提供商上一个 8× H200 部署的成本约为每小时 40 美元。Together AI 公开报价为\
  \ $0.67/min ([`www.together.ai/deepseek`](https://www.together.ai/deepseek))。这些成本会迅速累积：\n\
  \n*   持续运行的每日成本：960 美元。\n*   7x24 运行的每月成本：28,800 美元。\n*   部署启动时间：约 10-15 分钟 ≈ $7-$10。\n\
  \n那么，有哪些选项来管理你的成本？以下是一些智能的成本管理选项：\n\n1.  **在支持的地方使用缩容到零**：在 Hugging Face Inference\
  \ Endpoints 上，这是可选加入的，通常在空闲约 15 分钟后触发（尽管你可以根据需要配置）。通常不支持每端点 60 秒的空闲超时；相反，使用编程式手动缩容到零/暂停来实现激进的成本控制。检查你的提供商支持的功能。由于模型启动和基础设施配置通常需要几分钟，因此无论你设置什么值，扩容或缩容通常都会有一点延迟。\n\
  2.  **设置计费警报**：多个阈值是你的好朋友。大多数主要提供商都提供预算和使用量警报（AWS Budgets/CloudWatch、Google Cloud\
  \ Budgets and Alerting、Azure Cost Management，以及托管端点的使用量通知）；如果你的提供商没有提供，请在你的 API\
  \ 网关中强制实施 token 级别上限，并从你的可观测性栈中发出警报。默认情况下，在月度预算的 50%、80% 和 100% 处设置警报（在 100% 时自动限流或暂停），并添加每日*减速带*警报（例如，一天内消耗月度预算的\
  \ 10%），以便尽早发现失控的突发流量。\n3.  **考虑你的用例**：突发性工作负载？非常适合缩容到零。持续流量？也许可以协商容量预留块。\n4.  **算笔账**：以每小时\
  \ 40 美元计算，你需要处理足够的价值来证明计算成本是合理的。例如，如果你的端点持续处理约 3,000 tokens/sec，基础设施成本约为每 1k token\
  \ 0.0037 美元，那么一个 500 万 token 的批处理运行成本约为 18.5 美元（不包括人员/运维成本）。相反，如果你每小时只处理约 10 万 token，你实际上为每\
  \ 1k token 支付约 0.40 美元（约 $400/M），这通常高于 API 费率，因此对于这种负载模式，请暂停/缩容到零或使用无服务器服务。\n\n\
  此定价反映了运行具有企业级基础设施的完全托管 6710 亿参数模型的成本。将其与以下情况进行比较：\n\n*   自建 8x H200 集群：前期投入 50 万美元以上。\n\
  *   AWS 容量预留块：约每小时 36 美元（但你需要自己管理一切）。\n*   较小的云提供商：通常不可用或不可靠。\n\n    **专业提示**\n\n\
  \    对于实验，从较短的推理窗口开始。一次 2 小时的深入研究花费 80 美元，对于有针对性的实验来说是一笔可管理的费用。完成后执行 `endpoint.scale_to_zero()`\
  \ 以避免持续收费。\n\n这些数字可能看起来令人生畏，但它们强调了匹配工具与任务的重要性。就我个人而言，我的工作流程几乎总是从本地 `Ollama` 实例开始进行快速迭代，只有在需要大规模测试性能时才升级到托管端点。这种方法使开发保持快速，初始成本为零。\n\
  \n### 示例 1：使用 `Ollama` 和量化版 DeepSeek Coder 模型进行本地部署\n\n使用 `Ollama` 进行本地部署代表了阻力最小的路径。它是\
  \ LLM 部署的 *Hello World*——简单到可以在喝杯咖啡的时间内完成，同时又足够强大，能够驱动真实的开发工作流。我们将使用 160 亿参数版本并量化到\
  \ 4 位精度，这能提供接近完整模型的性能，同时能舒适地运行在消费级硬件上。本示例是一个开发代理，并未部署完整的 DeepSeek-V3 (671B) 或 R1\
  \ 模型。\n\n在本节中，我们的目标是在 10 分钟内让 DeepSeek Coder V2 在你的本地机器上运行起来，非常适合在没有云依赖或 API 成本的情况下进行开发和实验。\n\
  \n#### 前提条件和性能预期\n\n量化模型（DeepSeek Coder V2）重量约为 ~9 GB。在消费级硬件上，你应该预期 4 位 Coder 模型能达到每秒数十个\
  \ token 的速度，并且本地的首 token 时间（TTFT）通常 <1 秒。吞吐量因量化方式、驱动程序和工作负载而异。将本节中的任何单机数字视为方向性参考，而非\
  \ SLA 目标。\n\n让我们开始逐步部署步骤：\n\n1.  在类 Unix 系统上，安装只需一条命令：\n\n    ```\n    [在此处插入安装命令]\n\
  \    ```\n\n\n#### 使用 Ollama 部署 DeepSeek-Coder-V2 模型\n\n##### 安装 Ollama\n\n######\
  \ Linux/macOS\n\n```bash\ncurl -fsSL https://ollama.com/install.sh | sh\n```\n\n\
  ###### Windows\n\nWindows 用户可以从 Ollama 网站下载 MSI 安装程序：[`ollama.com/download/OllamaSetup.exe`](https://ollama.com/download/OllamaSetup.exe)。安装完成后，拉取模型非常简单：\n\
  \n```bash\nollama pull deepseek-coder-v2:16b\n```\n\n此命令会下载默认的 `Q4_0` 量化版本。下载过程会实时显示进度，Ollama\
  \ 会处理所有模型格式转换和针对您硬件的优化。\n\n##### 基本使用\n\n1.  要进行交互式测试，可以启动一个交互会话：\n\n    ```bash\n\
  \    ollama run deepseek-coder-v2\n    ```\n\n    这将启动一个 REPL 环境，您可以立即开始编写代码。但要与开发工具集成，您需要使用\
  \ API 服务器。\n\n##### API 服务器\n\n启动 API 服务器：\n\n```bash\nollama serve\n```\n\n这会在\
  \ `http://localhost:11434` 上暴露一个与 OpenAI 兼容的 REST 端点。其兼容层几乎完美；大多数期望使用 OpenAI API\
  \ 的工具只需简单更改基础 URL 即可工作。\n\n##### 验证与测试\n\n1.  通过快速 `curl` 测试来确认部署：\n\n    ```bash\n\
  \    curl http://localhost:11434/api/generate \\\n      -d '{\"model\":\"deepseek-coder-v2\"\
  ,\"prompt\":\"// bubble sort in Go\"}'\n    ```\n\n2.  对于 Python 应用程序，OpenAI 客户端库可以无缝工作。注意，OpenAI\
  \ 库已成为人们用于向 LLM 发出推理请求的标准 SDK。在以下代码示例中，我们传入了一个配置，指定我们希望对本地 Ollama 模型进行请求，而不是对云托管的\
  \ OpenAI 模型：\n\n    ```python\n    import openai\n\n    openai.base_url = 'http://localhost:11434/v1'\n\
  \    openai.api_key = 'ollama'  # 任何非空字符串均可\n\n    response = openai.chat.completions.create(\n\
  \        model='deepseek-coder-v2',\n        messages=[\n            {\n       \
  \         \"role\": \"user\",\n                \"content\": \"Write a Rust macro\
  \ for logging.\"\n            }\n        ]\n    )\n    print(response.choices[0].message.content)\n\
  \    ```\n\n##### 常见问题排查\n\n1.  最常见的问题是内存不足。如果看到 `cudaMalloc failed: out of memory`\
  \ 错误，您有三个选择：使用更激进的量化版本（尝试 `deepseek-coder-v2:16b-q3_K_M`），通过 `OLLAMA_NUMA=1` 启用\
  \ CPU 卸载，或者关闭其他占用 GPU 的应用程序。\n2.  下载中断会留下可能导致晦涩错误的局部文件。如果遇到 `EOF` 错误或 `model manifest\
  \ not found` 错误，请删除并重新拉取：\n\n    ```bash\n    ollama rm deepseek-coder-v2\n    ollama\
  \ pull deepseek-coder-v2:16b\n    ```\n\n3.  磁盘空间是另一个陷阱。下载过程临时需要大约 2 倍于模型大小的空间。如果您在中途拉取失败，可能需要运行\
  \ `ollama prune` 从孤立的 blob 文件中回收空间。\n\n##### 清理\n\n清理工作与部署一样简单：\n\n```bash\nollama\
  \ stop deepseek-coder-v2  # 停止运行中的模型\nollama rm deepseek-coder-v2     # 删除模型文件\n\
  ollama prune                    # 清理未使用的数据\n```\n\n\n#### 本节要点\n\n这个示例演示了模型生命周期管理的基础知识：拉取、运行、服务和清理。你已经看到量化如何使大模型在消费级硬件上变得实用，并且\
  \ Q4 量化仅以 **1-2 个百分点** 的精度损失为代价，就实现了 **75%** 的内存需求缩减。\n\n更重要的是，你现在拥有一个功能完备的 LLM\
  \ 开发环境。安装了 `Continue` 扩展的 VS Code 可以连接到你本地的 Ollama 实例，在无需将代码发送到外部服务的情况下，为你提供 AI\
  \ 驱动的编码辅助。这是进行实验、开发以及处理数据隐私至上场景的完美配置。\n\n接下来，我们将扩展到托管云部署，为此我们需要牺牲一些简易性，以换取企业级功能和生产环境的可靠性。\n\
  \n### 示例 2：在 Amazon Bedrock 上进行托管部署\n\nAWS 提供了多种 DeepSeek 部署路径。截至 2025 年 3 月，DeepSeek-R1\
  \ 已作为全托管无服务器模型在 Amazon Bedrock 中提供（[`aws.amazon.com/blogs/aws/deepseek-r1-now-available-as-a-fully-managed-serverless-model-in-amazon-bedrock/`](https://aws.amazon.com/blogs/aws/deepseek-r1-now-available-as-a-fully-managed-serverless-model-in-amazon-bedrock/)），提供了最简单的部署选项，支持自动扩缩容和按\
  \ token 计费。\n\n这里的目标是将任何受支持的 DeepSeek 模型（例如 R1 或 V3）部署到 Amazon Bedrock，以实现具有 AWS\
  \ 原生集成、安全性和合规功能的企业级托管推理。\n\nAWS 提供了三种主要方式来运行 DeepSeek 模型：\n\n*   **Bedrock 无服务器（最简单）**：完全托管，无需配置基础设施。按\
  \ token 付费，无空闲费用。可通过跨区域推理配置文件用于 DeepSeek-R1。\n*   **Bedrock 预置吞吐量**：适用于可预测工作负载的预留容量。提供有保障的性能，但需要预先承诺。请检查区域可用性，因为并非所有模型都支持此模式。\n\
  *   **AWS Marketplace + SageMaker**：自己部署模型，拥有完全控制权。此路径需要为大型 GPU 实例（例如配备 H100 的 `ml.p5en.48xlarge`）申请提高配额。你管理基础设施，但获得最大灵活性。\n\
  \n与其提供注定会过时的分步说明，不如直接访问你的 AWS 账户中的 Amazon Bedrock 控制台。该控制台提供最新的部署向导，并将指导你完成以下步骤：\n\
  \n*   `模型访问`：某些模型需要通过 `模型访问` 部分明确选择加入。\n*   `配额验证`：根据你的部署路径，检查 Bedrock（每分钟请求数）或\
  \ SageMaker（GPU 实例）的服务配额。\n*   `护栏配置`：用于生产部署的可选内容过滤。\n*   `IAM 设置`：用于应用程序的基于角色的访问控制。\n\
  \n如果选择 Marketplace 选项，请准备好申请大幅提高配额；即使经过量化，DeepSeek-V3 和 R1 也需要多个高端 GPU。\n\n无论你选择哪种部署路径，使用\
  \ AWS 部署时都需要做出几项重要决策：\n\n*   `API 选择`：AWS 提供多种推理 API。`Converse API` 提供跨模型的统一接口，并内置\
  \ token 使用量指标。`InvokeModel API` 使用特定于模型的架构，但可能提供更低的延迟。因此，选择取决于你的应用程序对标准化与性能的需求。\n\
  *   `超时配置`：DeepSeek-R1 的推理过程可能很长。因此，你需要将客户端超时至少配置为 300 秒。\n*   `成本控制`：务必设置 `maxTokens`\
  \ 限制。R1 可能生成非常长的推理链，单个请求可能消耗数千个 token。\n*   `私有网络`：对于敏感工作负载，配置 VPC 端点以将流量限制在 AWS\
  \ 内部。即使是 AWS 的托管服务，你也会遇到一些常见挑战：\n    *   `模型访问被拒绝`：在 Bedrock 控制台的 `模型访问` 下检查。即使具有正确的\
  \ IAM 权限，某些模型也需要明确选择加入。批准时间从即时到 48 小时不等，具体取决于你的账户状况。\n    *   `限流错误`：Bedrock 对每个模型强制实施速率限制（每分钟请求数和\
  \ token 数）。实现带有抖动的指数退避。\n    *   `配额问题`：对于 Marketplace 部署，你需要大量的 GPU 配额。单个 `ml.p5en.48xlarge`\
  \ 实例每月成本高达数千美元。请提前很久申请提高配额；AWS 可能需要数天才能批准大型 GPU 分配。\n    *   `推理时间过长`：R1 的推理深度差异很大。简单问题可能在几秒内返回，而复杂问题可能需要几分钟。实现流式响应以获得更好的用户体验。\n\
  *   `意外的成本`：如果没有适当的限制，单个失控的请求可能产生数千美元的费用。监控 CloudWatch 指标，并在多个阈值（预算的 50%、80% 和 100%）设置账单警报。在生产部署之前，你需要验证所选路径是否满足你的服务等级目标：\n\
  \    *   `首 token 延迟`：对用户体验至关重要。由于推理阶段，R1 的首 token 延迟可能较高。\n    *   `每秒 token 数`：根据部署类型和实例大小，差异显著。\n\
  \    *   `p95 延迟`：比平均延迟更有意义，适用于容量规划\n*   `并发请求处理`：在预期负载水平下进行测试；性能会呈非线性下降。考虑在一天中的不同时间进行负载测试，因为共享基础设施的性能可能波动。\n\
  \n#### 本节要点\n\nAmazon Bedrock 展示了云提供商部署大模型的方法：以供应商锁定和溢价为代价，实现与现有服务（IAM、CloudWatch\
  \ 和 VPC）的深度集成。无服务器选项完全消除了运维开销——无需管理实例，无需配置缩容至零，只需调用 API 和接收账单。\n\n关键的权衡在于控制与便利性。Bedrock\
  \ 无服务器让你对底层基础设施零控制，但也零责任。Marketplace 路径让你拥有完全控制权，但需要 GPU 实例管理、模型优化和容量规划方面的专业知识。\n\
  \n对于已经投入 AWS 生态系统的团队，Bedrock 的集成优势通常超过了其溢价。CloudWatch 原生指标、你的安全团队已经理解的 IAM 策略，以及与现有网络配置兼容的\
  \ VPC 端点，都降低了采用的隐性成本。\n\nAWS AI 服务的快速演进意味着具体功能和定价会变化，但基本模式不变：AWS 将继续提供全托管和自管理选项，其价格反映了你愿意接受的运维复杂性。\n\
  \n接下来，我们将探讨 Hugging Face Inference Endpoints，它提供了介于完全自管理和完全抽象之间的中间方案。\n\n### 示例\
  \ 3：使用 Hugging Face Inference Endpoints 将 DeepSeek V3 部署到云端\n\nHugging Face Inference\
  \ Endpoints 允许你自主选择硬件和区域，但由 Hugging Face 处理编排复杂性。对于 DeepSeek-V3，这种抽象尤其有价值；该模型仅加载就需要\
  \ 8 块 NVIDIA H200 GPU，更不用说高效服务了。\n\n在开始之前，我们先谈谈数字。\n\n如果你自己部署 DeepSeek，请准备好在常见的托管提供商上为\
  \ 8× H200 设置每小时花费约 40 美元（Together AI 公开报价 ≈$0.67/分钟 ≈ $40.2/小时）；Hugging Face Inference\
  \ Endpoints 的价格因区域/计划/提供商而异。如果你让推理端点持续运行，每天大约需要 960 美元——这仍然是一笔不小的数目。\n\n因此，始终选择支持“缩容至零”的功能（如果支持），以便在空闲期间管理成本。\n\
  \n要通过 HuggingFace API 进行部署，你需要以下内容：\n\n*   一个具有 API 访问权限的 Hugging Face 账户。\n*  \
  \ 一个具有写权限的 API 令牌。\n*   预算批准（请仔细检查账户支出限额）。\n\n最简洁的方法是使用 Hugging Face Python SDK。以下是完整的部署脚本：\n\
  \n```\n\n\n\n#### 在 Hugging Face 上部署 DeepSeek-V3\n\n本指南涵盖了从使用 Python SDK 创建端点、监控部署，到通过\
  \ REST API 和 ZenML 流水线进行部署的全过程。\n\n##### 基础配置与端点创建\n\n首先，使用 `create_inference_endpoint`\
  \ 创建一个具备生产就绪配置的端点。\n\n```python\nfrom huggingface_hub import create_inference_endpoint\n\
  \nendpoint = create_inference_endpoint(\n    name=\"deepseek-v3-prod\",\n    repository=\"\
  deepseek-ai/DeepSeek-V3\",\n    framework=\"pytorch\",\n    task=\"text-generation\"\
  ,\n    accelerator=\"gpu\",\n    vendor=\"aws\",\n    region=\"us-east-2\",\n  \
  \  type=\"protected\",  # 需要认证才能访问\n    instance_size=\"x8\",\n    instance_type=\"\
  nvidia-h200\",\n    # 自动缩放配置\n    min_replica=0,  # 启用空闲时自动缩容至零（如果支持）\n    max_replica=1,\
  \  # 单副本以控制成本\n    # 注意：HF Endpoints 通常在空闲约 15 分钟后触发缩容至零；不支持为单个端点设置 60 秒超时。\n  \
  \  # 用于优化服务的自定义 TGI 容器\n    custom_image={\n        \"health_route\": \"/health\"\
  ,\n        \"url\": \"ghcr.io/huggingface/text-generation-inference:3.3.1\",\n \
  \       \"env\": {\n            # 针对大模型的 TGI 优化\n            \"MAX_BATCH_PREFILL_TOKENS\"\
  : \"16384\",\n            \"MAX_INPUT_LENGTH\": \"32768\",\n            \"MAX_TOTAL_TOKENS\"\
  : \"65536\",\n            \"MODEL_ID\": \"/repository\"\n        }\n    }\n)\n```\n\
  \n这个初始配置定义了端点的标识、模型和基础设施：我们针对 `us-east-2` 区域的 8x H200 GPU 上的 `DeepSeek-V3`，并设置为需要认证的\
  \ `protected` 类型。这些基础设置确定了模型的运行位置和访问权限，之后我们将添加扩缩容和服务细节。\n\n自动缩放设置用于控制成本和可用性：`min_replica=0`\
  \ 启用空闲时缩容至零（在支持的情况下），而 `max_replica=1` 在初始测试阶段限制开销。如果后续需要更高的并发性，可以增加这些值。\n\n我们指定了一个\
  \ TGI 容器并调整服务限制（预填充、输入和总 token 数），以在内存限制内处理大模型请求并最大化吞吐量。`MODEL_ID` 将容器指向挂载的仓库以加载模型权重。\n\
  \n##### 部署监控\n\n部署通常需要 10-15 分钟来拉取镜像并将权重加载到 GPU；`wait()` 方法提供了一个带有超时限制的阻塞流程。如果失败，`fetch()`\
  \ 可以帮助你检查部分状态以进行快速调试。\n\n你可以通过以下代码监控部署进度：\n\n```python\nprint(f\"Initial status:\
  \ {endpoint.status}\")\nprint(\"Waiting for deployment (this typically takes 10-15\
  \ minutes)...\")\ntry:\n    endpoint.wait(timeout=1200)  # 20 分钟超时\n    print(f\"\
  ✓ Deployment successful!\")\n    print(f\"Endpoint URL: {endpoint.url}\")\n    print(f\"\
  Status: {endpoint.status}\")\nexcept Exception as e:\n    print(f\"✓ Deployment\
  \ failed: {e}\")\n    # 检查是否发生了部分部署\n    endpoint.fetch()\n    print(f\"Current\
  \ status: {endpoint.status}\")\n```\n\n##### 通过 REST API 部署\n\n对于 CI/CD 流水线或不支持\
  \ Python 的环境，REST API 同样适用，可帮助你监控部署。\n\n首先，配置环境变量：\n\n```bash\n#!/bin/bash\n# 配置\n\
  HF_TOKEN=\"${HF_TOKEN:-your-token-here}\"\nHF_USERNAME=\"${HF_USERNAME:-your-username}\"\
  \nENDPOINT_NAME=\"deepseek-v3-prod\"\n```\n\n这些变量为你的组织上下文和凭证提供给 Hugging Face Endpoints\
  \ API。确保 `HF_TOKEN` 具有 `write` 范围，并与目标账户/空间匹配。\n\n此请求创建端点并镜像了 Python SDK 的字段：模型、服务镜像、token\
  \ 限制、硬件和缩放。一些字段是提供者特定的（例如，缩放语义），因此如果您的区域或计划不支持某个选项，请省略或调整它们：\n\n```bash\n# 通过 curl\
  \ 部署并正确处理错误\n# 注意：一些缩放字段（例如 \"scaleToZeroTimeout\"）是特定于提供者的；如果不支持，请省略它们。\nRESPONSE=$(curl\
  \ -s -w \"\\n%{http_code}\" \\\n  \"https://api.endpoints.huggingface.cloud/v2/endpoint/${HF_USERNAME}\"\
  \ \\\n  -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization:\
  \ Bearer ${HF_TOKEN}\" \\\n  -d '{\n    \"name\": \"'\"${ENDPOINT_NAME}\"'\",\n\
  \    \"type\": \"protected\",\n    \"model\": {\n      \"repository\": \"deepseek-ai/DeepSeek-V3\"\
  ,\n      \"framework\": \"pytorch\",\n      \"task\": \"text-generation\",\n   \
  \   \"fromCatalog\": false,\n      \"image\": {\n        \"tgi\": {\n          \"\
  url\": \"ghcr.io/huggingface/text-generation-inference:3.3.1\",\n          \"healthRoute\"\
  : \"/health\"\n        }\n      },\n      \"env\": {\n        \"MAX_BATCH_PREFILL_TOKENS\"\
  : \"16384\",\n        \"MAX_INPUT_LENGTH\": \"32768\",\n        \"MAX_TOTAL_TOKENS\"\
  : \"65536\"\n      }\n    },\n    \"compute\": {\n      \"accelerator\": \"gpu\"\
  ,\n      \"instanceType\": \"nvidia-h200\",\n      \"instanceSize\": \"x8\",\n \
  \     \"scaling\": {\n        \"minReplica\": 0,\n        \"maxReplica\": 1,\n \
  \       \"metric\": \"hardwareUsage\",\n        \"measure\": {\n          \"hardwareUsage\"\
  : 80\n        }\n      }\n    },\n    \"provider\": {\n      \"vendor\": \"aws\"\
  ,\n      \"region\": \"us-east-2\"\n    }\n  }')\n```\n\n我们解析 HTTP 状态和 JSON 响应体，以便在\
  \ CI 日志中提供清晰的成功/失败信号。状态码 `200` 表示部署已被接受；否则，错误载荷有助于定位访问权限、配额或无效字段问题：\n\n```bash\n\
  # 解析响应\nHTTP_CODE=$(echo \"$RESPONSE\" | tail -n1)\nBODY=$(echo \"$RESPONSE\" |\
  \ sed '$d')\nif [ \"$HTTP_CODE\" -eq 200 ]; then\n    echo \"✓ Deployment initiated\
  \ successfully\"\n    echo \"$BODY\" | jq -r '.status'\nelse\n    echo \"✗ Deployment\
  \ failed with HTTP $HTTP_CODE\"\n    echo \"$BODY\" | jq -r '.error // .'\nfi\n\
