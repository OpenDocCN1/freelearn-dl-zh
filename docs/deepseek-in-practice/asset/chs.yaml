  \ Packt 购买无需发票。*\n\n---\n\n# 第三部分\n\n# 蒸馏与部署 DeepSeek\n\n在本书的第三部分，我们将从理解和使用 `DeepSeek`\
  \ 转向将其改造为生产环境应用。我们首先探讨推理蒸馏——利用 `DeepSeek` 高级推理能力，创建能够在普通硬件上运行、同时保持专业级性能的专用高效模型。接着，我们解决部署全规模\
