  \ API。\n5.  最后，我们将逐步介绍如何使用 Docker 部署所有内容。\n\n让我们从从 Garmin 获取数据开始。\n\n### 获取数据\n\n\
  首要任务是查询 Garmin 关于我们拥有的数据。这完全是以编程方式检索我们的 Garmin 手表记录的关于我们的健康数据（心率、睡眠时长、压力等）。为了完成这项工作，我们将利用`python-garminconnect`项目（`https://github.com/cyberjunky/python-garminconnect`）。\n\
  \n为了使其工作，您应该同时拥有您的 Garmin 电子邮件和用于登录 Garmin 账户的密码。两者都应适用于`https://connect.garmin.com/signin`。\n\
  \n**注意**\n\n如果您没有 Garmin 账户，请不要担心。GitHub 仓库包含加载示例数据的说明，因此您可以毫无问题地运行 API 和示例。\n\n\
  一旦您手头有了这些信息，我们就可以使用以下函数登录 Garmin：\n\n```python\n# We get the values as environmental\
  \ variables\nGARMIN_EMAIL = os.getenv(\"GARMIN_EMAIL\") # your email\nGARMIN_PASSWORD\
  \ = os.getenv(\"GARMIN_PASSWORD\") # your password\n# and we define our function\n\
  def start_garmin() -> Garmin:\n    \"\"\"Initialize Garmin connection.\"\"\"\n \
  \   try:\n        GARMIN = Garmin(\n            email=GARMIN_EMAIL,\n          \
  \  password=GARMIN_PASSWORD,\n            is_cn=False, # if you are in China, set\
  \ to True\n        )\n        GARMIN.login()\n        print(\"You are now logged\
  \ in.\")\n        return GARMIN\n    except Exception as e:\n        print(f\"Could\
  \ not login with email and password: {e}\")\n        raise\nIf everything goes well,\
  \ you can now run the following:\ngarmin = start_garmin()\n# prints: You are now\
  \ logged in.\n```\n\n此函数现在为我们提供了一个可以处理和查询 API 的`garmin`实例。现在我们知道如何实例化 Garmin API，让我们继续查询给定日期所需的所有信息。为此，我们创建一个`get_daily_health_summary`函数。此函数将接收一个\
  \ API 实例、一个开始日期和一个结束日期。目标是返回该日期范围内的健康信息。\n\n首先，我们将创建几个辅助函数：一个将日期转换为 ISO 格式的函数（因为\
  \ Garmin 要求此格式），另一个接收两个日期并返回我们可以迭代的范围的函数：\n\n```python\ndef get_daily_health_summary(\n\
  \    api: Any, start: datetime.date, end: datetime.date\n) -> list[dict[str, Any]]:\n\
  \    def dstr(d: datetime.date) -> str:\n        return d.isoformat()\n    def daterange(a:\
  \ datetime.date, b: datetime.date):\n        for i in range((b - a).days + 1):\n\
  \            yield a + datetime.timedelta(days=i)\n```\n\n现在我们遍历每一天，并可以通过使用`get_user_summary`方法从\
  \ Garmin 检索摘要信息。此方法返回一个字典，其中包含我们想要用于上下文的字段，例如静息心率、步数、运动分钟数和睡眠时长：\n\n```python\n\
  \ for day in daterange(start, end):\n        s = dstr(day)\n        day_of_week\
  \ = day.strftime(\"%A\")\n        summary = api.get_user_summary(s) or {}\n    \
  \    rhr = summary.get(\"restingHeartRate\")\n        steps = summary.get(\"totalSteps\"\
  )\n        stress_level = summary.get(\"averageStressLevel\")\n        body_battery_final\
  \ = summary.get(\"bodyBatteryMostRecentValue\") or summary.get(\n            \"\
  mostRecentBodyBattery\"\n        )\n        exercise_minutes = (summary.get(\"moderateIntensityMinutes\"\
  ) or 0) + (\n            summary.get(\"vigorousIntensityMinutes\") or 0\n      \
  \  )\n        sleep_seconds = summary.get(\"sleepingSeconds\")\n        sleep_hours\
  \ = round(sleep_seconds / 3600, 2)\n        body_battery_start = summary.get(\"\
  bodyBatteryAtWakeTime\")\n        total_distance_meters = summary.get(\"totalDistanceMeters\"\
  )\n```\n\n最后，一旦我们提取了所有感兴趣的字段，现在可以将它们附加到函数将返回的数组中：\n\n```python\n out.append(\n \
  \           {\n                \"date\": s,\n                \"day_of_week\": day_of_week,\n\
  \                \"resting_heart_rate\": rhr,\n                \"exercise_minutes\"\
  : exercise_minutes,\n                \"stress_level\": stress_level,\n         \
  \       \"sleep_hours\": sleep_hours,\n                \"steps\": steps,\n     \
  \           \"total_distance_meters\": total_distance_meters,\n                \"\
  body_battery_start_day\": body_battery_start,\n                \"body_battery_end_day\"\
  : body_battery_final,\n            }\n        )\n    return out\n```\n\n有了这个函数，我们现在可以为任何感兴趣的日期调用它。例如，如果我们想获取昨天的数据，我们可以获取今天的日期，减去一天（使用`timedelta`），并调用`get_daily_health_summary`方法：\n\
  \n```python\nyesterday = datetime.date.today() - datetime.timedelta(days=1)\nsummary_for_yesterday\
  \ = get_daily_health_summary(\n    garmin, yesterday, yesterday)\nsummary_for_yesterday\n\
  ```\n\n调用此函数后，我们可以看到在 8 月 13 日，我的静息心率为 62，总共睡了 9 个小时（！）。我不确定发生了什么，但那确实睡了很多！俗话说，睡眠是运动员最好的朋友。\n\
  \n\n```\n[{'date': '2025-08-13', 'day_of_week': 'Wednesday', 'resting_heart_rate':\
  \ 62, 'exercise_minutes': 0, 'stress_level': 38, 'sleep_hours': 9.09, 'steps': 1866,\
  \ 'total_distance_meters': 1387, 'body_battery_start_day': 74, 'body_battery_end_day':\
  \ 17}]\n\n请注意，我们也可以为一个日期范围调用我们的函数，这很有帮助，例如：\n\n```python\npast_7_days_start = yesterday\
  \ - datetime.timedelta(days=7)\npast_7_days_end = yesterday - datetime.timedelta(days=1)\n\
  summary_for_past_7_days = get_daily_health_summary(\n    garmin, past_7_days_start,\
  \ past_7_days_end\n)\nsummary_for_past_7_days\n```\n\n这将返回一个介于 `past_7_days_start`\
  \ 和 `past_7_days_end` 之间每一天的数据列表。如果这看起来不太明白，别担心！一切很快就会清晰：\n\n```python\n[\n    {\n\
  \        'date': '2025-08-06',\n        'day_of_week': 'Wednesday',\n        'resting_heart_rate':\
  \ 58,\n        'exercise_minutes': 3,\n        'stress_level': 32,\n        'sleep_hours':\
  \ 8.17,\n        'steps': 5320,\n        'total_distance_meters': 3953,\n      \
  \  'body_battery_start_day': 97,\n        'body_battery_end_day': 20\n    },\n \
  \   {\n        'date': '2025-08-07',\n        'day_of_week': 'Thursday',\n     \
  \   # ...\n\n    },\n    {\n        'date': '2025-08-08',\n        # ...\n```\n\n\
  ### 构建上下文\n\n我们现在可以查找特定日期或日期范围内的健康数据。接下来，我们需要为我们的 DeepSeek 模型准备数据。有很多种方法可以实现，但我们想保持简单。我们将创建一个提示词（prompt），其中包含一个简短的\
  \ Markdown 部分来呈现每个测量指标。对于每个测量指标（例如压力水平），我们希望向大语言模型（LLM）展示以下内容：\n\n*   该指标的当日数值。\n\
  \n*   过去七天的平均值（基线），不包括今天。\n\n*   与基线相比，今天数值的百分比变化。\n\n*   基线期间的趋势。\n\n*   对于该测量指标，较低的数值是否更好。\n\
  \n例如，对于睡眠时长，我们希望得到以下内容：\n\n```markdown\n### 睡眠时长\n- 今日数值 (2025-08-13): 9.09\n- 7\
  \ 天基线平均值 (不含今日): 8.21\n- 与基线相比的百分比变化: +10.7%\n- 过去 7 天趋势: up ↑\n- 较低的数值更好: False\n\
  ```\n\n这将为每个我们获取的其他指标重复生成。\n\n通过这些信息，我们现在是为模型提供了一个在特定上下文下的指标，而不是一个孤立的指标。这将确保模型减少“幻觉”，并理解指标更广泛的背景。\n\
  \n为了识别趋势，我们需要一个启发式方法。这里有一个简单的函数，它接受一个数字列表并返回 `up`（上升）、`down`（下降）或 `flat`（平稳）。它比较列表中前三项和后三项的平均值。如果这些平均值在\
  \ 5%以内，函数返回 `flat`，因为指标没有发生重大变化。这不是一个完美的启发式方法，但能达到我们的目的：\n\n```python\ndef detect_trend(values,\
  \ pct_threshold=5):\n    recent, earlier = np.mean(values[-3:]), np.mean(values[:3])\n\
  \    return (\n        \"up\"\n        if recent > earlier * (1 + pct_threshold\
  \ / 100)\n        else (\"down\" if recent < earlier * (1 - pct_threshold / 100)\
  \ else \"flat\")\n    )\n```\n\n有了我们的启发式方法，我们现在可以创建一个构建上下文的函数；`build_llm_context_md`\
  \ 接收今天的摘要和过去七天的摘要。这些是相同的字典列表，其中包含当前日期和过去七天的健康指标信息。\n\n然后，我们创建一个字符串列表，每个字符串代表 LLM\
  \ 的一行上下文。最后，我们创建一个 `better_is_lower` 数组，用于存储那些分数较低更可取的指标，例如压力水平：\n\n```python\n\
  def build_llm_context_md(\n    summary_for_today: list[dict], summary_for_past_7_days:\
  \ list[dict]\n) -> str:\n    assert len(summary_for_today) == 1, \"Expected 1 day\
  \ of summary\"\n    today = summary_for_today[0]\n    metrics = [key for key in\
  \ today.keys() if key not in [\"date\", \"day_of_week\"]]\n    lines = [\n     \
  \   f\"# {today['date']} ({today['day_of_week']}) 每日指标摘要\",\n        \"_ 注意：所有比较仅使用**过去\
  \ 7 天的数据**，不含今日。_\",\n        \"\",\n    ]\n    better_is_lower = [\n        \"\
  resting_heart_rate\",\n        \"stress_level\",\n    ]\n```\n\n之后，我们遍历指标。对于每个指标，我们创建一个值列表。包括指标的当前值、基线期间的平均值，以及“较低的数值是否更好”标志。遍历完成后，我们通过\
  \ `join` 所有行来构建我们给 DeepSeek 的上下文：\n\n```python\nfor metric in metrics:\n    today_val\
  \ = today[metric]\n    if not today_val:\n        print(f\"Skipped {metric} since\
  \ no values were found\")\n    past_vals = [\n        day[metric] for day in summary_for_past_7_days\
  \ \n        if day[metric] is not None\n    ]\n    avg_7d = sum(past_vals) / len(past_vals)\
  \ if past_vals else 0\n    delta_pct = ((today_val - avg_7d) / avg_7d * 100) if\
  \ avg_7d else 0\n    trend_dir = detect_trend(past_vals)\n    arrow = \"↑\" if trend_dir\
  \ == \"up\" else (\"↓\" if trend_dir == \"down\" else \"→\")\n    lines.append(\n\
  \        f\"## {metric.replace('_', ' ').title()}\\n\"\n        f\"- 今日数值 ({today['date']}):\
  \ {today_val}\\n\"\n        f\"- 7 天基线平均值 (不含今日): {avg_7d:.2f}\\n\"\n        f\"\
  - 与基线相比的百分比变化: {delta_pct:+.1f}%\\n\"\n        f\"- 过去 7 天趋势: {trend_dir} {arrow}\\\
  n\"\n        f\"- 较低的数值更好: {metric in better_is_lower}\\n\"\n    )\nreturn \"\\\
  n\".join(lines)\n```\n\n我们现在可以通过以下方式调用该函数：\n\n```python\n# 启动客户端并定义日期\ngarmin =\
  \ start_garmin()\ndate = \"2025-08-13\"\n# 获取指定日期的摘要数据\ndate_for_summary = datetime.datetime.strptime(date,\
  \ \"%Y-%m-%d\").date()\nsummary_in_date = get_daily_health_summary(\n        garmin,\
  \ date_for_summary, date_for_summary\n)\n# 获取该日期之前 7 天的数据\npast_period_start = date_for_summary\
  \ - datetime.timedelta(days=7)\npast_period_end = date_for_summary - datetime.timedelta(days=1)\n\
  summary_in_past_period = get_daily_health_summary(\n        garmin, past_period_start,\
  \ past_period_end\n)\n# 构建提示词\nprompt = build_llm_context_md(summary_in_date, summary_in_past_period)\n\
  print(prompt)\n```\n\n这将输出一个清晰的摘要，我们可以将其输入给我们的大语言模型：\n\n```markdown\n# 2025-08-13\
  \ (Wednesday) 每日指标摘要\n_ 注意：所有比较仅使用**过去 7 天的数据**，不含今日。_\n### 静息心率\n- 今日数值 (2025-08-13):\
  \ 62\n- 7 天基线平均值 (不含今日): 55.86\n- 与基线相比的百分比变化: +11.0%\n- 过去 7 天趋势: up ↑\n- 较低的数值更好:\
  \ True\n### 运动时长（分钟）\n- 今日数值 (2025-08-13): 0\n- 7 天基线平均值 (不含今日): 3.00\n- 与基线相比的百分比变化:\
  \ -100.0%\n- 过去 7 天趋势: up ↑\n- 较低的数值更好: False\n### 压力水平\n- ....\n### 睡眠时长\n- ...\n\
  ... 其他指标因简洁而隐藏\n```\n\n很好！我们现在拥有了想要提供给 DeepSeek 模型的所有信息。但我们具体希望它如何回应呢？\n\n### 定义结构化输出\n\
  \n现在是时候定义我们希望“每日健康摘要”呈现何种形态了。与大多数基于大语言模型的应用程序一样，让模型返回某种结构化输出（JSON 格式）通常是一个好做法（我们在\
  \ *第 2 章* 和 *第 3 章* 中讨论过）。为了表示我们的每日健康摘要，我们创建两个 Pydantic ([`docs.pydantic.dev/`](https://docs.pydantic.dev/))\
  \ 模型：\n\n*   `DayType`：将我们的日期分类为五种类型之一。\n\n*   `DailySummary`：创建一个对象，包含日期类型、标题、表情符号、观察结果和建议。\n\
  \n代码如下：\n```\n\n\n# 创建每日健康摘要\n\n现在，我们已具备制作第一份每日健康摘要的所有要素。让我们开始创建摘要。\n\n首先，我们将创建一个简单的函数，该函数使用\
  \ `type: json_object` 调用 DeepSeek API，以强制模型返回 JSON 结构。这并不出奇；它会返回模型创建的 JSON 以及推理内容（如果有的话，例如在使用\
  \ `deepseek-reasoner` 时）：\n\n```python\nfrom pydantic import BaseModel, Field\n\
  class DayType(str, Enum):\n    TRAINING = \"training\"\n    ACTIVE_RECOVERY = \"\
  active_recovery\"\n    REST = \"rest\"\n    HIGH_STRESS = \"high_stress\"\n    BALANCED\
  \ = \"balanced\"\nclass DailySummary(BaseModel):\n    day_type: DayType = Field(\n\
  \        ...,\n        description=\"基于活动和恢复指标对这一天进行分类\",\n    )\n    title: str\
  \ = Field(..., description=\"对这一天的单句总结\")\n    emoji: str = Field(..., description=\"\
  代表当天类型的 Emoji 表情\")\n    observation: str = Field(\n        ...,\n        description=\"\
  关于关键指标和模式的两句话观察\",\n    )\n    recommendation: str = Field(\n        ...,\n    \
  \    description=\"针对明天的两条可操作建议\",\n    )\n```\n\n```python\ndef llm(\n    messages:\
  \ list[dict], model: str, response_format: dict | None = None\n) -> tuple[dict,\
  \ str | None]:\n    client = OpenAI(\n        api_key=os.environ[\"DEEPSEEK_API_KEY\"\
  ],\n        base_url=\"https://api.deepseek.com\",\n    )\n    response = client.chat.completions.create(\n\
  \        model=model, messages=messages, response_format=response_format, temperature=0.0\n\
  \    )\n    message = response.choices[0].message\n\n    if hasattr(message, \"\
  reasoning_content\"):\n        reasoning_content = message.reasoning_content\n \
  \   else:\n        reasoning_content = None\n\n    return json.loads(message.content),\
  \ reasoning_content\n```\n\n为了确保我们的模型表现良好，我们创建了两个 `DailyHealthSummary` 示例，并制定了系统提示词：\n\
  \n```python\n# 示例 1：训练日\ntraining_day_example = DailySummary(\n    day_type=DayType.TRAINING,\n\
  \    title=\"强有力的训练日，所有指标活动量均有所增加。\",\n    emoji=\"\U0001F4AA\",\n    observation=\"\
  运动分钟数达到基线的两倍，活动了 95 分钟，并伴有 18,500 步。尽管训练负荷很高，但身体电量从 85 的良好水平开始，表明从昨天恢复得不错。\",\n\
  \    recommendation=\"考虑明天进行积极恢复或休息日，以适应今天付出的努力。今晚优先保证睡眠，以维持身体电量水平并支持肌肉恢复。\",\n\
  )\n# 示例 2：高压力日\nhigh_stress_day_example = DailySummary(\n    day_type=DayType.HIGH_STRESS,\n\
  \    emoji=\"\U0001F62B\",\n    title=\"尽管体力活动极少，但压力升高且恢复不佳。\",\n    observation=\"\
  压力水平比基线高出 46%，而睡眠时间降至仅 6.1 小时，导致身体电量起点较低，仅为 45。运动和活动极少，表明压力来自非体力来源。\",\n    recommendation=\"\
  专注于压力管理技巧，争取今晚睡足 8 小时以上。考虑明天进行轻度锻炼，如散步或瑜伽，因为温和的活动有助于调节压力水平。\",\n)\nexamples = [training_day_example,\
  \ high_stress_day_example]\nexamples_str = \"\\n\\n\\n\".join([example.model_dump_json()\
  \ for example in examples])\n```\n\n系统提示词包含三个部分——为模型提供背景和指导的通用指令、我们期望它遵循的 JSON 模式，以及一些示例\
  \ JSON 输出：\n\n```python\nsystem_prompt = f\"\"\"\nInstructions:\n* 你将收到用户今天与过去 7\
  \ 天相比的健康与健身数据摘要。\n* 你的目标是生成一个将在用户智能手表上显示的摘要。\n* 保持内容简短，同时也要让用户感兴趣。\n* 你的摘要应包括当天类型、标题、一些观察和给用户的建议。\n\
  * 你的摘要应采用 JSON 格式。仅输出 JSON，不要有其他文本。\n---JSON SCHEMA---\n{DailySummary.model_json_schema()}\n\
  ---END JSON SCHEMA---\n---EXAMPLE JSON OUTPUTS---\n{examples_str}\n---END EXAMPLE\
  \ JSON OUTPUTS---\n\"\"\"\n```\n\n现在万事俱备，我们可以创建最后一个函数了。这个函数的作用就是将我们至今构建的所有部分整合起来。它执行以下步骤：\n\
  \n1.  接收一个 `Garmin` API 实例和一个字符串格式的日期。\n2.  从 `Garmin` 获取该日期及之前七天的数据。\n3.  构建我们的提示词和消息列表，包括系统提示词。\n\
  4.  调用模型，并根据我们的 `DailySummary` Pydantic 模型验证其响应。\n\n```python\ndef get_daily_summary(\n\
  \    garmin: Garmin,\n    date: str,\n    model: Literal[\"deepseek-chat\", \"deepseek-reasoner\"\
  ],\n    verbose: bool = False,\n) -> DailySummary:\n        # 转换为日期时间格式\n    date_for_summary\
  \ = datetime.datetime.strptime(date, \"%Y-%m-%d\").date()\n\n        # 获取指定日期的信息\n\
  \    summary_in_date = get_daily_health_summary(\n        garmin, date_for_summary,\
  \ date_for_summary\n    )\n        # 获取基线时期的信息\n    past_period_start = date_for_summary\
  \ - datetime.timedelta(days=7)\n    past_period_end = date_for_summary - datetime.timedelta(days=1)\n\
  \    summary_in_past_period = get_daily_health_summary(\n        garmin, past_period_start,\
  \ past_period_end\n    )\n        # 使用趋势和指标创建提示词\n    prompt = build_llm_context_md(summary_in_date,\
  \ summary_in_past_period)\n        # 创建消息列表\n    messages = [\n        {\"role\"\
  : \"system\", \"content\": system_prompt},\n        {\"role\": \"user\", \"content\"\
  : prompt},\n    ]\n\n        # 调用大语言模型并验证响应\n    response, reasoning = llm(messages,\
  \ model, {\"type\": \"json_object\"})\n    health_summary = DailySummary.model_validate(response)\n\
  \    return health_summary\n```\n\n从现在开始，我们需要获取 `DailyHealthSummary` 时，只需调用 `get_daily_summary`\
  \ 函数，传入日期和我们想使用的模型即可：\n\n```python\ndaily_summary = get_daily_summary(garmin, \"\
  2025-08-19\", \"deepseek-chat\")\nprint(daily_summary.model_dump_json())\n```\n\n\
  然后，它会返回我们构建的每日健康摘要：\n\n```json\n{\n   \"day_type\":\"balanced\",\n   \"title\":\"\
  恢复改善、压力降低、平衡良好的一天。\",\n   \"emoji\":\"⚖️\",\n   \"observation\":\"静息心率下降 9.3%至 39，压力水平显著降低\
  \ 58.8%，表明恢复极佳。身体电量起点高达 82，终点为 72，显示尽管睡眠和活动略有减少，但能量使用高效。\",\n   \"recommendation\"\
  :\"通过持续适度运动和保证充足睡眠来维持这种平衡。专注于压力管理以保持低水平并支持持续恢复。\"\n}\n```\n\n如你所见，这效果相当不错。看这个例子，我可以告诉你它完全正确。这是我八月份假期的第一天，这使得摘要特别准确。我们现在有了第一个原型。但构建应用程序并不仅限于此。我们希望构建一个完整的服务，为任何感兴趣的人计算这些每日摘要。为此，我们需要构建一个\
  \ API。\n\n### 重构为 API\n\n既然我们的系统已经可以作为简单函数运行，是时候为它构建一个 API 了。目标是创建一个服务，能够接收用户的请求及其登录\
  \ Garmin API 的详细信息，并返回他们的健康指标的 `DailyHealthSummary`。为了实现这一点，我们将使用 `FastAPI`。\n\n\
  **安全注意事项**\n\n### Garmin 健康摘要 API 服务介绍\n\n#### API 端点与认证\n\nAPI 服务使用您的认证凭据（包括密码）来调用\
  \ Garmin Connect API。这种方法对于原型是可接受的，但在生产环境中，用户通常不愿与陌生服务共享明文密码。对于实际应用，建议考虑实现 OAuth\
  \ 或使用官方 Garmin Connect 开发者计划：[`developer.garmin.com/gc-developer-program/activity-api`](https://developer.garmin.com/gc-developer-program/activity-api)。\n\
  \n我们的 API 包含两个端点。第一个是一个小型生活质量改进：当用户访问 `/`（根路径）时，他们会自动重定向到 `/docs`。这使得开发者（尤其是项目新手）能够更轻松快速地查找和探索可用端点，并理解预期输出：\n\
  \n```\nfrom fastapi import FastAPI, Header, HTTPException\nfrom fastapi.responses\
  \ import RedirectResponse\napp = FastAPI(title=\"Garmin Health Summary API\")\n\
  @app.get(\"/\")\nasync def root():\n    return RedirectResponse(url=\"/docs\")\n\
  ```\n\n应用实例化后，我们创建 `HealthSummaryRequest`，这是期望从用户获得的请求。如以下所示，我们期望他们提供一个日期，如果未提供，则默认为今天的日期。用户还可以选择指定两个模型之一（`deepseek-chat`\
  \ 或 `deepseek-reasoner`）来创建摘要：\n\n```\nclass Model(str, Enum):\n    chat = \"deepseek-chat\"\
  \n    reasoner = \"deepseek-reasoner\"\nclass HealthSummaryRequest(BaseModel):\n\
  \    date: str = Field(\n        default_factory=lambda: datetime.date.today().isoformat(),\n\
  \        description=\"Date in YYYY-MM-DD format, defaults to today\",\n       \
  \ example=datetime.date.today().isoformat(),\n    )\n    model: Model = Field(\n\
  \        default=Model.chat,\n        description=\"Model to use for the summary\"\
  ,\n    )\n```\n\n为了进行身份验证，用户必须在请求头中提供 Garmin 凭据。我们返回之前介绍过的同一个 `DailySummary` 请求：\n\
  \n```\n@app.post(\"/health-summary\", response_model=DailySummary)\nasync def get_health_summary(\n\
  \    request: HealthSummaryRequest,\n    garmin_email: str = Header(..., description=\"\
  Garmin email address\"),\n    garmin_password: str = Header(..., description=\"\
  Garmin password\"),\n) -> DailySummary:\n```\n\n`get_health_summary` 端点的核心部分运行着与之前看到的完全相同的逻辑，并额外添加了一些错误处理以防万一出错：\n\
  \n```\n\"\"\"Get Daily Health Summary for a specific date.\n    Args:\n        request:\
  \ Health summary request with date and model\n        garmin_email: Garmin account\
  \ email from header\n        garmin_password: Garmin account password from header\n\
  \    Returns:\n        Daily Health Summary with AI-generated insights\n    \"\"\
  \"\n    try:\n        garmin = get_garmin_client(garmin_email, garmin_password)\n\
  \        summary = get_daily_summary(garmin, request.date, request.model)\n    \
  \    logger.info(\n            f\"Daily Health Summary API request completed successfully\
  \ for {request.date}\"\n        )\n        return summary\n    except ValueError\
  \ as e:\n        logger.error(f\"Invalid date format provided: {request.date}\"\
  )\n        raise HTTPException(\n            status_code=400, detail=f\"Invalid\
  \ date format: {e}\"\n        )\n    except Exception as e:\n        logger.error(\n\
  \            f\"Failed to generate Daily Health Summary for {request.date}: {e}\"\
  \n        )\n        raise HTTPException(\n            status_code=500, detail=f\"\
  Error generating summary: {e}\"\n        )\n```\n\n有了这一切，我们现在可以使用以下命令运行我们的 API：\n\
  \n```\n$ uv run fastapi run 02-api.py\n```\n\n这将在您机器的端口 `8000` 上启动一个生产服务器。当您访问 `http://0.0.0.0:8000`\
  \ 时，您将看到 API 页面已准备好供您交互：\n\n![Figure 5.2: Garmin 健康摘要 API 页面](img/B33471_05_2.png)\n\
  图 5.2: Garmin 健康摘要 API 页面\n\n您可以通过界面或命令行调用 API。如果您安装了 `curl`（[`curl.se/`](https://curl.se/)），以下是如何调用的示例：\n\
  \n```\n$ curl -X 'POST' \\\n        'http://localhost:8000/health-summary' \\\n\
  \        -H 'accept: application/json' \\\n        -H 'garmin-email: your.email@example.com'\
  \ \\\n        -H 'garmin-password: your-password' \\\n        -H 'Content-Type:\
  \ application/json' \\\n        -d '{\n    \"date\": \"2025-08-19\"\n  }'\n```\n\
  \n这将以 JSON 格式返回模型的响应：\n\n```\n{\n   \"day_type\":\"rest\",\n   \"title\":\"Rest\
  \ day with minimal activity and good recovery indicators.\",\n   \"emoji\":\"\U0001F634\
  \",\n   \"observation\":\"Exercise minutes and steps were significantly below your\
  \ baseline, suggesting a deliberate rest. Body battery started high and stress levels\
  \ were low, indicating effective recovery from previous days.\",\n   \"recommendation\"\
  :\"Continue with light activity or rest tomorrow to maintain this positive recovery\
  \ state. Ensure adequate sleep to keep your body battery levels optimal for future\
  \ training.\"\n}\n```\n\n### 使用 Docker 部署\n\n我们的服务的最后一个方面是部署。您可能通过 SSH 连接并运行 `fastapi\
  \ run` 命令，甚至在本地运行。然而，在处理实时生产系统时，您可能会使用 **Docker**。\n\n现在，您的 API 可以运行了。这很棒。但不幸的是，我们无法将您的计算机运送给用户。如果我们的应用将在生产中运行，它需要部署到云中的某个地方。这意味着我们的应用需要在另一台计算机上运行。我们如何确保那台计算机上也安装了所有需要的东西？在过去的十年里，答案一直是**容器**。\n\
  \nDocker 是业界一个成熟的工具，它使用容器来声明式地定义依赖关系，并在部署时保持应用程序隔离。简而言之，Docker 让您可以将应用程序及其所需的一切——代码、库和工具——打包到一个轻量级的容器中。这确保了它可以在任何机器上以相同的方式运行，从您的笔记本电脑到生产环境，而不会出现环境问题。尽管我们很乐意写一本关于\
  \ Docker 惊人与不那么惊人的事物的厚书，但这不是那本书。如果您不熟悉它并想学习基础知识，我们建议您从这里开始：[`www.docker.com/101-tutorial`](https://www.docker.com/101-tutorial)。\n\
  \n现在，这是我们的详细注释的 `Dockerfile`，它打包了我们日常健康摘要服务的所有依赖项。如果您有兴趣深入了解此处的一些选择，我们建议您深入 `uv`\
  \ Docker 教程/演练，因为我们的 `Dockerfile` 很大程度上受其启发（[`docs.astral.sh/uv/guides/integration/docker/`](https://docs.astral.sh/uv/guides/integration/docker/)）：\n\
  \n```\n# First, build the application in the `/app` directory\nFROM ghcr.io/astral-sh/uv:bookworm-slim\
  \ AS builder\nENV UV_COMPILE_BYTECODE=1 UV_LINK_MODE=copy\n# Configure the Python\
  \ directory so it is consistent\nENV UV_PYTHON_INSTALL_DIR=/python\n# Only use the\
  \ managed Python version\nENV UV_PYTHON_PREFERENCE=only-managed\n# Install Python\
  \ before the project for caching\nRUN uv python install 3.12\nWORKDIR /app\nRUN\
  \ --mount=type=cache,target=/root/.cache/uv \\\n    --mount=type=bind,source=uv.lock,target=uv.lock\
  \ \\\n    --mount=type=bind,source=pyproject.toml,target=pyproject.toml \\\n   \
  \ uv sync --locked --no-install-project --no-dev --no-group local\nCOPY . /app\n\
  RUN --mount=type=cache,target=/root/.cache/uv \\\n    uv sync --locked --no-dev\
  \ --no-group local\n# Then, use a final image without uv\nFROM debian:bookworm-slim\n\
  # Copy the Python version\nCOPY --from=builder --chown=python:python /python /python\n\
  # Copy the application from the builder\nCOPY --from=builder --chown=app:app /app\
  \ /app\n# Place executables in the environment at the front of the path\nENV PATH=\"\
  /app/.venv/bin:$PATH\"\n# Expose the port\nEXPOSE 8000\n# Run the FastAPI application\n\
  CMD [\"fastapi\", \"run\", \"app/02-api.py\", \"--host\", \"0.0.0.0\", \"--port\"\
  , \"8000\"]\n```\n\n## 与 DeepSeek 模型交互\n\n我们可以运行该应用程序，通过构建容器并在我们自己的机器上运行它，使用 `docker\
  \ build` 和 `docker run` 命令。第一个命令构建一个名为 `api` 的镜像，使用 `02-api.Dockerfile` 作为 Dockerfile；第二个命令从该镜像启动一个容器，暴露端口\
  \ `8000` 并传递 `DEEPSEEK_API_KEY` 环境变量：\n\n```\n$ docker build -t api -f 02-api.Dockerfile\
  \ .\n$ docker run -it -e DEEPSEEK_API_KEY=sk-... -p 8000:8000 -t api\n```\n\n应用程序应再次在你的本地\
  \ URL 启动：[`localhost:8000`](http://localhost:8000)。\n\n内容很多，但你应该感到高兴。你创建了一个接收用户\
  \ Garmin 凭据并返回由 DeepSeek 驱动的每日健康摘要的服务。恭喜！现在，尽管我们很想向你展示如何在服务器上运行它，但本书不会这样做。容器的好处在于你可以将它们部署在*任何地方*。几乎所有云提供商在云上部署容器至少有\
  \ 5 种方式，尽管 AWS 有 17 种不同方式：[`www.lastweekinaws.com/blog/the-17-ways-to-run-containers-on-aws/`](https://www.lastweekinaws.com/blog/the-17-ways-to-run-containers-on-aws/)。\n\
  \n在休息之后，你会开始思考，虽然系统运行良好，但它并非特定于 DeepSeek。我们只是在调用 DeepSeek API。我们也可以调用任何其他 API（OpenAI，Anthropic\
  \ 等）。然而，DeepSeek 的真正力量在于其开源本质。这为我们打开了一些大门。接下来我们将探索它们。\n\n### LiteLLM\n\nLiteLLM\
  \ 是一个库，允许我们使用单一统一格式轻松地与不同的 LLM 和提供商交互。\n\nLiteLLM 的优势在于，当你更换提供商时，真正需要更改的只是你传递给 `completion`\
  \ 函数的 `model` 字符串。\n\n在以下示例中，我们演示如何使用 `litellm` 库通过三种不同的提供商使用 DeepSeek：\n\n*   `deepseek/deepseek-chat`：使用\
  \ DeepSeek API 中的 DeepSeek chat 模型。\n*   `bedrock/us.deepseek.r1-v1:0`：使用 Amazon\
  \ Bedrock ([`aws.amazon.com/bedrock/`](https://aws.amazon.com/bedrock/)) 运行 DeepSeek-R1\
  \ 推理模型的推理。\n*   `openrouter/deepseek/deepseek-r1-distill-qwen-14b`：使用 OpenRouter\
  \ ([`openrouter.ai/`](https://openrouter.ai/)) 运行 Qwen 14B 蒸馏模型。\n\n> **警告**\n>\n\
  > 使用不同提供商时，你可能必须设置不同的 API 密钥和认证方法。请务必查看它们的文档以获取更多信息。内容非常丰富！\n\n以下是你如何使用 `litellm`\
  \ 的示例：\n\n```\nfrom litellm import completion\n\ndef litellm(messages: list[dict])\
  \ -> tuple[str, str | None]:\n    response = completion(\n        # model=\"deepseek/deepseek-chat\"\
  , # 使用 DeepSeek API\n        # model=\"bedrock/us.deepseek.r1-v1:0\", # 使用 AWS bedrock\
  \ 进行推理\n        model=\"openrouter/deepseek/deepseek-r1-distill-qwen-14b\", # 使用\
  \ OpenRouter 进行推理\n        messages=messages,\n        temperature=0.0,\n    )\n\
  \    message = response.choices[0].message\n        # 如果存在推理内容，则提取出来\n    if hasattr(message,\
  \ \"reasoning_content\"):\n        reasoning_content = message.reasoning_content\n\
  \    else:\n        reasoning_content = None\n    return message.content, reasoning_content\n\
  \n# 使用示例：\nmessages = [\n    {\"role\": \"system\", \"content\": \"You are a helpful\
  \ assistant.\"},\n    {\"role\": \"user\", \"content\": \"What is the capital of\
  \ France?\"},\n]\nresult, reasoning = llm(messages)\nprint(f\"Result: {result}\"\
  )\n# Result: The capital of France is Paris.\nprint(f\"Reasoning: {reasoning}\"\
  )\n# Reasoning: Okay, so I need to figure out the capital ...\n```\n\n`litellm`\
  \ 是一个强大的工具，结合 **OpenRouter**，意味着你可以调用任何 API 和模型，甚至是本地模型！是的，我们说的是本地……但让我们一步步来。\n\n\
  ## 使用 Ollama 在本地运行\n\n2025 年 1 月发布的 DeepSeek-R1 震惊了世界，原因有很多。旗舰 R1 模型不仅在基准测试中表现出色，并与当时的最先进技术相媲美，而且这家中国实验室更进一步。你可能还记得我们在\
  \ *第 1 章* 和 *第 2 章* 中的讨论，除了旗舰模型，他们还发布了六个不同的蒸馏模型。\n\n每个模型都是使用 DeepSeek-R1 模型生成的样本，从一个基础开源模型微调而来。原始模型包含\
  \ 6850 亿参数，总权重为 641.33 GB。粗略地说，以全精度运行该模型大约需要 1540 GB 的显存。现在，你可能在后院拥有那种计算能力，但现实是很少有公司拥有那种计算能力，因为它需要多\
  \ GPU 设置。\n\n但蒸馏版本则讲述了一个不同的故事。在 *表 5.1* 中，你可以看到蒸馏模型、它们的基础模型（从中微调而来）以及以 4 位量化运行它们所需的显存。这为我们这些在后院没有\
  \ GPU 集群的人打开了大门。其中一些可以在非常小的 GPU 上运行。事实上，我们甚至可以在单个 GPU 上运行它们！\n\n| **模型** | **基础模型**\
  \ | **Hugging Face 仓库** | **显存需求** |\n| :--- | :--- | :--- | :--- |\n| DeepSeek-R1\
  \ | - | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1](https://huggingface.co/deepseek-ai/DeepSeek-R1)\
  \ | ~436 GB |\n| DeepSeek-R1-Distill-Llama-70B | Llama-3.3-70B-Instruct ([`huggingface.co/meta-llama/Llama-3.3-70B-Instruct`](https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-70B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-70B)\
  \ | ~46 GB |\n| DeepSeek-R1-Distill-Qwen-32B | Qwen2.5-32B ([`huggingface.co/Qwen/Qwen2.5-32B`](https://huggingface.co/Qwen/Qwen2.5-32B))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B)\
  \ | ~21 GB |\n| DeepSeek-R1-Distill-Qwen-14B | Qwen2.5-14B ([`huggingface.co/Qwen/Qwen2.5-14B`](https://huggingface.co/Qwen/Qwen2.5-14B))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-14B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-14B)\
  \ | ~9 GB |\n| DeepSeek-R1-Distill-Llama-8B | Llama-3.1-8B ([`huggingface.co/meta-llama/Llama-3.1-8B`](https://huggingface.co/meta-llama/Llama-3.1-8B))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-8B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-8B)\
  \ | ~5 GB |\n| DeepSeek-R1-Distill-Qwen-7B | Qwen2.5-Math-7B ([`huggingface.co/Qwen/Qwen2.5-Math-7B`](https://huggingface.co/Qwen/Qwen2.5-Math-7B))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B)\
  \ | ~4.5 GB |\n| DeepSeek-R1-Distill-Qwen-1.5B | Qwen2.5-Math-1.5B ([`huggingface.co/Qwen/Qwen2.5-Math-1.5B`](https://huggingface.co/Qwen/Qwen2.5-Math-1.5B))\
  \ | \U0001F917 [huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B)\
  \ | ~1 GB |\n\n表 5.1: DeepSeek 模型的显存需求\n\n本地运行 LLM 有两个成熟的工具。第一个是 `llama.cpp` ([`github.com/ggml-org/llama.cpp`](https://github.com/ggml-org/llama.cpp))，第二个，使用第一个作为其推理引擎，是\
  \ `Ollama` ([`ollama.com/`](https://ollama.com/))。\n\n使用 `Ollama` 运行本地模型很简单。安装 `Ollama`\
  \ ([`ollama.com/download`](https://ollama.com/download)) 后，只需在终端中输入以下命令：\n\n###\
  \ 使用本地模型进行健康数据摘要\n\n### 使用 Ollama 运行本地模型\n\n```\n$ ollama run deepseek-r1:1.5b\n\
  >>> Hi there!\nHello! How can I assist you today? \U0001F60A\n```\n\n此命令将下载蒸馏后的\
  \ 1.5B 模型（如果你之前没有运行过），并启动一个聊天会话。根据你的系统情况，它可能会运行得比较热，但 1.5B 参数模型应该能在大多数现代计算机上运行。\n\
  \n我们可以使用 Ollama Python SDK ([`github.com/ollama/ollama-python`](https://github.com/ollama/ollama-python))\
  \ 来生成每日健康摘要。我们只需适配 `get_daily_summary` 函数，并利用我们刚下载的 1.5B 参数蒸馏模型：\n\n```python\n\
  from ollama import chat\ndef get_daily_summary(\n    garmin: Garmin,\n    date:\
  \ str,\n) -> DailySummary:\n    prompt = get_daily_summary_prompt(garmin, date)\n\
  \    messages = [\n        {\"role\": \"system\", \"content\": SYSTEM_PROMPT},\n\
  \        {\"role\": \"user\", \"content\": prompt},\n    ]\n    response = chat(\n\
  \        messages=messages,\n        model=\"deepseek-r1:1.5b\",\n        format=DailySummary.model_json_schema(),\n\
  \        options={\n            \"temperature\": 0.0,\n        },\n    )\n    return\
  \ DailySummary.model_validate_json(response.message.content)\n```\n\n我们可以通过设置 `format=DailySummary.model_json_schema()`\
  \ 来为 Ollama 指定返回格式。这会将 Pydantic 模型的 JSON schema 也传递给模型。我们可以这样调用函数：\n\n```python\n\
  garmin = get_garmin_client(\n        email=os.environ[\"GARMIN_EMAIL\"],\n     \
  \   password=os.environ[\"GARMIN_PASSWORD\"],\n    )\nsummary = get_daily_summary(garmin,\
  \ \"2025-08-14\")\nprint(summary)\n```\n\n这会输出以下内容：\n\n```\nday_type=<DayType.HIGH_STRESS:\
  \ 'high_stress'> title='Elevated stress and poor recovery despite minimal physical\
  \ activity.' emoji='\U0001F62B' observation='Stress levels jumped 46% above baseline\
  \ while sleep dropped to just 6.1 hours, resulting in a low body battery start of\
  \ 45\\. Exercise and movement were minimal, suggesting stress is from non-physical\
  \ sources.' recommendation='Focus on stress management techniques and aim for 8+\
  \ hours of sleep tonight. Consider light exercise like walking or yoga tomorrow,\
  \ as gentle movement can help regulate stress levels.'\n```\n\n是的，今天状态不太好。但我们刚刚将本地的\
  \ 1.5B 参数模型接入了我们的每日健康摘要服务！在继续之前，请记住，你也可以像我们之前展示的那样，使用 LiteLLM 来使用本地模型，只需将模型设置为例如\
  \ `ollama_chat/deepseek-r1:1.5b`。\n\n### 使用 Transformers 和 XGrammar 在 CPU 上进行推理\n\
  \nOllama 非常适合快速测试和试验本地模型。但要真正构建我们的每日健康摘要服务，我们需要对设备、提示结构、分词过程以及生成过程本身有更精细的控制。这就是我们更接近底层，利用成熟的\
  \ Transformers 库 ([`github.com/huggingface/transformers`](https://github.com/huggingface/transformers))\
  \ 的地方。\n\n要在 CPU 上运行我们的 1.5B 参数模型，让我们使用 Unsloth 版本的 1.5B 蒸馏模型，你也可以在 Hugging Face\
  \ 上找到它。Unsloth ([`docs.unsloth.ai/`](https://docs.unsloth.ai/)) 是另一个值得关注的有趣库，如果你对微调和自己运行模型感兴趣的话。\n\
  \n我们首先用以下代码加载模型：\n\n```python\nfrom transformers import AutoModelForCausalLM, AutoTokenizer,\
  \ TextStreamer\nmodel_name = \"unsloth/DeepSeek-R1-Distill-Qwen-1.5B\"\ndevice =\
  \ \"cpu\"\nquestion = \"What is the capital of Le Marche, Italy?\"\nmax_tokens =\
  \ 1200\ntokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForCausalLM.from_pretrained(model_name).to(device)\n\
  ```\n\n我们对消息使用 `apply_chat_template` 将它们转换为模型输入：\n\n```python\nmessages =\n[\n \
  \   {\"role\": \"user\", \"content\": question},\n]\ninputs = tokenizer.apply_chat_template(\n\
  \    messages,\n    add_generation_prompt=True,\n    tokenize=True,\n    return_dict=True,\n\
  \    return_tensors=\"pt\",\n).to(model.device)\n```\n\n有了这些，我们现在可以直接从 CPU 流式输出\
  \ token：\n\n```python\nstreamer = TextStreamer(tokenizer, skip_prompt=True, skip_special_tokens=False)\n\
  model.generate(\n    **inputs,\n    max_new_tokens=max_tokens,\n    streamer=streamer,\n\
  )\n# prints Okay, so I need to figure out the capital of Le Marche, Italy. Hmm,\
  \ I'm not super familiar with Italy, but I know it's one of the largest and most\
  \ populous countries in Europe....\n```\n\n这使用 `transformers` 库直接在 CPU 上运行我们的模型。效果很好，但如果我们想将此模型与每日健康摘要服务的其余部分集成，我们需要确保模型能有效遵守我们的\
  \ `DailySummary` 格式。这正是开源模型真正闪光的地方。\n\n记住，模型是本地运行的，所以我们对它生成的 token 拥有完全的控制权。我们可以编写一个函数来限制每个\
  \ token，使其符合我们定义的 JSON schema。但这正是 `outlines` ([`dottxt-ai.github.io/outlines`](https://dottxt-ai.github.io/outlines))、`xgrammar`\
  \ ([`github.com/mlc-ai/xgrammar`](https://github.com/mlc-ai/xgrammar)) 和 `guidance`\
  \ ([`github.com/guidance-ai/guidance`](https://github.com/guidance-ai/guidance))\
  \ 等库开箱即用的功能。它们执行**受限**生成。它们不仅仅是让模型生成 JSON，而是明确地将 token 限制在符合 JSON 结构的范围内。\n\n根据我们的经验，`xgrammar`\
  \ 产生了最佳结果。使用它的代码有些复杂，但如果你有疑问，我们建议你查阅该库的文档。不过，我们还是会在高层次上解释一下。\n\n代码的第一部分只是导入模型，将其放置在\
  \ CPU 上，并设置所需的种子（以获得可复现的输出）：\n\n```python\nimport xgrammar as xgr\nfrom transformers\
  \ import AutoConfig, AutoModelForCausalLM, AutoTokenizer\nMODEL_NAME = \"unsloth/DeepSeek-R1-Distill-Qwen-1.5B\"\
  \nMODEL = AutoModelForCausalLM.from_pretrained(\n    MODEL_NAME,\n    torch_dtype=torch.float32,\n\
  \    device_map=\"cpu\",\n)\nTOKENIZER = AutoTokenizer.from_pretrained(MODEL_NAME)\n\
  CONFIG = AutoConfig.from_pretrained(MODEL_NAME)\nMAX_NEW_TOKENS = 1024\ntransformers.set_seed(42)\n\
  ```\n\n现在，我们将调整 `get_daily_summary` 函数以适配我们的 API。我们接收消息，但现在也将它们通过 `apply_chat_template`\
  \ 处理：\n\n```python\ndef get_daily_summary(\n    garmin: Garmin,\n    date: str,\n\
  ) -> DailySummary:\n    prompt = get_daily_summary_prompt(garmin, date)\n    messages\
  \ = [\n        {\"role\": \"system\", \"content\": SYSTEM_PROMPT},\n        {\"\
  role\": \"user\", \"content\": prompt},\n    ]\n    texts = TOKENIZER.apply_chat_template(\n\
  \        messages, tokenize=False, add_generation_prompt=True\n    )\n```\n\n乍一看，代码可能令人生畏，但它实际上只做了四件事：\n\
  \n1.  它首先用 `TokenizerInfo.from_huggingface` 提取分词器元数据，为正确解释 token 提供基础。\n\n2.  在生成过程中，它应用一个\
  \ `xgrammar` logits 处理器，强制模型仅生成在 `DailySummary` schema 下有效的 token。\n\n3.  生成步骤本身在较低的\
  \ `temperature` 并启用采样的情况下运行，在一致性和多样性之间取得平衡。\n\n4.  最后，输出通过 `DailySummary.model_validate_json`\
  \ 进行解码和验证，返回一个干净的结构化 Pydantic 对象。\n\n5.  **温度（Temperature）**\n\n    `temperature`\
  \ 参数控制模型输出的随机性。较低的值使响应更确定，较高的值提供更有创意的答案。实际上，`temperature` 通过操纵 DeepSeek 生成每个 token\
  \ 的概率来实现这一点。\n\n    Patrick von Platen 有一篇关于使用 Transformers 进行文本生成的优秀教程，深入探讨了包括\
  \ `temperature` 在内的参数：[`huggingface.co/blog/how-to-generate`](https://huggingface.co/blog/how-to-generate)。\n\
  \n\n这些部分协同工作，确保我们每次都能获得完全符合需求——即干净且有效的 JSON：\n\n```\nmodel_inputs = TOKENIZER(texts,\
  \ return_tensors=\"pt\").to(MODEL.device)\ntokenizer_info = xgr.TokenizerInfo.from_huggingface(\n\
  \    TOKENIZER, vocab_size=CONFIG.vocab_size\n)\ngrammar_compiler = xgr.GrammarCompiler(tokenizer_info)\n\
  compiled_grammar = grammar_compiler.compile_json_schema(DailySummary)\nxgr_logits_processor\
  \ = xgr.contrib.hf.LogitsProcessor(compiled_grammar)\ngenerated_ids = MODEL.generate(\n\
  \    **model_inputs,\n    max_new_tokens=MAX_NEW_TOKENS,\n    logits_processor=[xgr_logits_processor],\n\
  \    do_sample=True,\n    temperature=0.01,\n    top_p=0.95,\n    top_k=50,\n)\n\
  generated_ids = generated_ids[0][len(model_inputs.input_ids[0]) :]\nmodel_response\
  \ = TOKENIZER.decode(generated_ids, skip_special_tokens=True)\nreturn DailySummary.model_validate_json(model_response)\n\
  ```\n\n我们为获得**确定性输出**而将 `temperature` 设置为 `0.01`，倾向于选择高概率的令牌。`top_k=50` 将每一步的选择限制为最可能的\
  \ 50 个令牌，而 `top_p=0.95` 则将生成范围限定在覆盖 95%概率质量的令牌内，去除了不太可能的长尾部分。这些选择并非严格规定，因此可以自行尝试调整。\n\
  \n有了 `xgrammar`，我们现在可以将每日健康摘要服务重构为**完全**在本地运行。无需 API 调用，也不会出现 JSON 格式错误。\n\n###\
  \ 为本地 CPU 生成进行重构\n\n既然我们已经替换了 `get_daily_summary`，就可以创建一个全新的、完全在本地运行的 API。在本书代码仓库的\
  \ `Chapter05` 文件夹中，我们提供了一个 `05-api-cpu-xgrammar.py` 文件。它看起来*完全像*我们设计的第一个模型服务，但运行\
  \ 100%在本地。\n\n要运行它，我们再次使用 FastAPI，命令如下：\n\n```\n$ uv run fastapi run 05-api-cpu-xgrammar.py\n\
  ```\n\n在另一个终端中，我们可以通过命令行调用此 API：\n\n```\n$ curl -X 'POST' \\\n        'http://localhost:8000/health-summary'\
  \ \\\n        -H 'accept: application/json' \\\n        -H 'garmin-email: your.email@example.com'\
  \ \\\n        -H 'garmin-password: your-password' \\\n        -H 'Content-Type:\
  \ application/json' \\\n        -d '{\n    \"date\": \"2025-08-19\"\n}'\n```\n\n\
  这再次返回了格式良好的 JSON，由 `DeepSeek-R1-Distill-Qwen-1.5B` 生成，100%在你自己的机器上运行：\n\n```json\n\
  {\n   \"day_type\":\"high_stress\",\n   \"title\":\"Elevated stress and poor recovery\
  \ despite minimal physical activity.\",\n   \"emoji\":\"\U0001F62B\",\n   \"observation\"\
  :\"Stress levels jumped 46% above baseline while sleep dropped to just 6.1 hours,\
  \ resulting in a low body battery start of 45\\. Exercise and movement were minimal,\
  \ suggesting stress is from non-physical sources.\",\n   \"recommendation\":\"Focus\
  \ on stress management techniques and aim for 8+ hours of sleep tonight. Consider\
  \ light exercise like walking or yoga tomorrow, as gentle movement can help regulate\
  \ stress levels.\"\n}\n```\n\n`Dockerfile` 有 99%的相似度，只有少量依赖差异，为简洁起见，我们将其略过。\n\n\
  呼！干得漂亮！你刚刚创建了一个完全本地化的每日健康摘要服务。你学会了如何在 CPU 上运行 DeepSeek 模型，确保它们产生可靠的 JSON，并清晰地理解了如何部署它们以及如何与我们设计的服务进行整合。这内容相当多。\n\
  \n然而，需要注意的是，我们为 1.5B 参数模型设计的方案同样适用于任何其他 DeepSeek 模型，但有一个主要限制：你需要专门的硬件。你可能无法在 CPU\
  \ 上运行比 1.5B 版本更大的模型。对于更大的模型，我们需要 GPU。你们中的一些人可能拥有强大的电脑，但现实是，更大的模型往往比小模型表现更好。\n\n\
  假设我们希望用 `DeepSeek-R1` 的 70B 参数蒸馏版来运行每日健康摘要；我们至少需要 46GB 的显存。我有一台配置相当高的 MacBook，拥有\
  \ 64GB 统一内存，但事实是我从未能舒适地运行过超过 30B 参数的模型。而且我们不可能把我的 MacBook 寄出去。\n\n你明白这个意思。我们需要在别人的机器上运行——也就是在云端。但我们仍然希望拥有本地模型的优势，即我们可以紧密控制生成过程。在下一节中，我们将探讨如何在云端部署一个更大的蒸馏模型。系好安全带，这将会很有趣！\n\
  \n## 使用 AWS 部署隔离的模型服务\n\n**亚马逊云科技**（**AWS**）是全球最受欢迎的云计算平台之一。我们将重点介绍它，以便部署一个更大的 DeepSeek\
  \ 模型，并将其与我们的每日健康摘要服务集成。和大多数云计算平台一样，实现同一目标的方式几乎有 25 种之多。AWS 也不例外。\n\n要在 AWS 上使用/部署\
  \ DeepSeek 模型，你可以采取以下方式：\n\n*   使用 **Bedrock API**，AWS 在此托管基础模型（包括 DeepSeek）。在这里，你可以像我们使用\
  \ DeepSeek API 一样调用和使用模型。你不会进行部署；你只是使用。\n\n*   使用 **Bedrock 自定义模型导入**，这是 AWS 提供的一项服务，允许你将训练好的模型导入\
  \ Bedrock，然后通过 Bedrock API 使用它。模型需要是 Hugging Face 格式。请注意，仅支持某些架构（例如，不支持 Gemma 模型）。\n\
  \n*   **Hugging Face 深度学习容器**（**DLC**）也可用于在 AWS 上部署模型。用于推理时，它们包含 PyTorch 或**文本生成推理**（**TGI**,\
  \ [`github.com/huggingface/text-generation-inference`](https://github.com/huggingface/text-generation-inference))\
  \ 作为受支持的框架。如果你想使用这些框架，这是一个有趣的选择。你也可以使用 DLC 来训练模型，这将通过 AWS 的 SageMaker 服务完成。\n\n\
  *   **自行构建**：我们的意思是，你在云端购买一个带有 GPU 的虚拟机（即一个 `EC2` 实例），安装你需要的所有软件包，管理依赖项、访问、升级等等——拥有最大控制权，但也可能带来不少麻烦。\n\
  \n*   最后，通过 `SageMaker` 的**大模型推理**（**LMI**）容器允许你使用多种可用的推理后端来部署大语言模型。这是为更大的模型设计的，你需要完全控制，但又不想管理基础设施——接近底层，但又无需太多烦心事。LMI\
  \ 容器由 **Deep Java Library**（**DJL**）框架提供支持。可以将 `DJL` 视为驱动这些容器的引擎。\n\n这并非详尽无遗的列表。AWS\
  \ 提供了更多选项，其中一些可能会持续多年，而另一些可能不会。在 AWS 上部署模型*没有唯一正确的方式*；但是，你应该在选择前权衡利弊。我们汇编了一张表格（*表\
  \ 5.2*），列出了每个选项的优缺点以及何时使用：\n\n| 选项 | 优点 | 缺点 | 使用场景 |\n| :--- | :--- | :--- | :---\
  \ |\n| Bedrock API | 无需管理基础设施。可访问众多前沿模型（包括 Anthropic、Mistral 和 DeepSeek）。集成身份验证。自动扩展和服务等级协议。\
  \ | 你不拥有模型。定制化有限。大规模使用时每令牌成本较高。 | 你只需要通过 API 使用模型，不想托管任何东西。 |\n| Bedrock 自定义模型导入\
  \ | 无需管理基础设施即可部署你微调过的模型。与 Bedrock API、代理和知识库集成。受益于 Bedrock 的安全性和日志记录。 | 架构支持有限。必须将模型转换为\
  \ Hugging Face 格式。比托管基础模型需要更多设置。 | 你有自己的训练好的模型，但想利用 Bedrock 的托管环境。 |\n| Hugging\
  \ Face DLC (SageMaker) | 托管式训练和推理。包含 TGI 用于优化的 LLM 推理。与 Hugging Face Hub 轻松集成。自动扩展端点。\
  \ | | |\n\n\n\n### 部署选项对比\n\n*   仅限于 Hugging Face、TGI 和 PyTorch 技术栈。\n*   相比 DJL，对于非常大的模型优化较少。\n\
  *   仍需为 SageMaker 基础设施付费。\n\n| 适用场景：您需要一条基于 Hugging Face 的原生路径，在 SageMaker 上进行训练或推理。\
  \ |\n| :--- |\n\n| **自定义在 EC2 上部署** |\n| :--- |\n| *   最大程度的控制。\n*   可自由选择任何服务栈，例如\
  \ vLLM、TGI 和 Triton。\n*   没有 SageMaker 或 Bedrock 的额外开销。 |\n| *   您需要管理所有事情，包括扩缩容、安全和网络。\n\
  *   更难可靠地运行。\n*   运维负担更高。 |\n\n| 适用场景：您需要完全的控制权，或者想要尝试自定义的栈和内核。 |\n| :--- |\n\n\
  | **大型模型推理（LMI/DJL）** |\n| :--- |\n| *   专为大模型构建。\n*   支持 vLLM、TensorRT-LLM 以及用于\
  \ Inf2 的 NeuronX。\n*   管理基础设施、扩缩容和分片。\n*   在大型模型上拥有最佳吞吐量。 |\n| *   设置过程比 Hugging\
  \ Face DLC 稍微复杂。\n*   需要了解 SageMaker。\n*   开箱即用时，“Hugging Face 魔法”较少。 |\n\n| 适用场景：您需要为大型或生产级模型获得最大性能，同时无需管理基础设施。\
  \ |\n| :--- |\n\n*表 5.2：AWS 上部署选项的比较*\n\n我们建议几乎总是从 API 调用开始，避免复杂的自托管，除非您知道您的产品确实需要它。所以，如果您正在构建产品，请从\
  \ API 调用开始。一旦您有了一百万用户，就该开始考虑部署了。本书中我们也“吃自己的狗粮”，这就是为什么我们从通过 API 使用 DeepSeek 模型开始。现在我们将深入探讨使用\
  \ LMI 容器部署 DeepSeek。这是因为我们相信 vLLM 是一个极其强大的推理引擎（[`github.com/vllm-project/vllm`](https://github.com/vllm-project/vllm)）。\n\
  \n您可能已经在问自己：到底什么是推理引擎？问得好。\n\n## 推理后端\n\n一个**推理引擎**是简化 LLM 部署过程的框架。它提供了打包、优化和服务能力。这样您就无需考虑\
  \ GPU 优化、请求管理、内存优化、LLM 架构、流式传输或对结构化生成的支持。推理后端提供了所有这些功能，因此您可以专注于使用模型。我们编译了另一份（非详尽的）推理引擎列表，见*表\
  \ 5.3*：\n\n| **引擎** | **主要创新点** | **性能优化** | **量化（内置）** | **分布式推理** | **易用性** |\
  \ **独特功能** |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| `vLLM` ([`github.com/vllm-project/vllm`](https://github.com/vllm-project/vllm))\
  \ | PageAttention 与 GPU 友好的 KV 分页 | 连续批处理、融合的 CUDA 内核、异步 I/O | INT8 / INT4（AWQ,\
  \ GPTQ），SmoothQuant | 张量并行与流水线并行 | 高（单命令启动） | 兼容 OpenAI 的 API；实时 KV 缓存交换 |\n| `Hugging\
  \ Face TGI` ([`github.com/huggingface/text-generation-inference`](https://github.com/huggingface/text-generation-inference))\
  \ | Rust + Python gRPC 服务器 | Token 流式传输、连续批处理、推测解码、FlashAttention | GPTQ, AWQ, bits-and-bytes,\
  \ Marlin | 可选的分片与张量并行 | 高（Docker/CLI） | Triton 后端，Prometheus 指标 |\n| `SGLang` ([`github.com/sgl-project/sglang`](https://github.com/sgl-project/sglang))\
  \ | 预填充/解码解耦；RadixAttention | 连续批处理、专家/流水线/张量并行 | FP8, INT4 (AWQ/GPTQ) | 数据、张量与流水线并行\
  \ | 中等（需要额外 DSL） | 支持视觉语言模型；内置路由器 |\n| `LMDeploy` ([`github.com/InternLM/lmdeploy`](https://github.com/InternLM/lmdeploy))\
  \ | 压缩到服务的工具包 | 持久化批处理、阻塞 KV、split-fuse 内核 | 4 位权重+KV，AWQ，SmoothQuant | 张量并行；K8s\
  \ Helm chart | 高（单个可执行文件） | 集成的量化→部署流程 |\n| `TensorRT-LLM` ([`github.com/NVIDIA/TensorRT-LLM`](https://github.com/NVIDIA/TensorRT-LLM))\
  \ | 端到端 TensorRT 图编译 | 自定义内核、运行中批处理、分页 KV | FP8, FP4, INT4 (AWQ), INT8 | Triton\
  \ 后端（多 GPU/节点） | 中等（需要 TRT 构建） | 主/从协调 |\n\n*表 5.3：流行推理引擎的比较*\n\n尽管每个引擎都有其优缺点，但\
  \ `vLLM` 已经逐渐确立了其作为主流引擎的地位。它还支持许多我们对于“每日健康摘要”服务感兴趣的功能：结构化生成、兼容 OpenAI 的 API、量化、对\
  \ DeepSeek 模型的一流支持，甚至支持推理输出！\n\n## 使用 LMI 容器部署 DeepSeek\n\nSageMaker 支持多种用于训练和推理作业的容器镜像。您可以在\
  \ GitHub 上的 **AWS DLC** 仓库中查看完整列表：[`github.com/aws/deep-learning-containers`](https://github.com/aws/deep-learning-containers)。\n\
  \n在这个生态系统中，我们将特别关注 **LMI 容器**，因为它们对 **vLLM** 提供了一流的支持。LMI 容器是 DJL 的一部分并由其文档化：一个用于深度学习的开源\
  \ Java 框架。我们理解这有点令人困惑。\n\n关键在于，如果我们对将要部署的容器的文档感兴趣，可以在 [`docs.djl.ai/`](https://docs.djl.ai/)\
  \ 找到。\n\n我们需要首先弄清楚的是模型所需的总内存。我们将专注于为我们的用例部署 `DeepSeek-R1 Distill Qwen 14B`。为此，我们将使用一个\
  \ `ml.g6.12xlarge` AWS 实例。该实例将为我们提供大约 96 GB 的 GPU 显存，这应该足以运行我们的模型。\n\n**警告**\n\n\
  在此部署中，我们将使用一台 `ml.g6.12xlarge` 机器。根据区域的不同，它每小时的成本约为 5 美元。忘记关闭它，您将被收取每月 3,720 美元的费用！**始终**确保在测试后关闭资源。特此警告。\n\
  \n在*表 5.4*中，我们提供了一些关于为不同流行开源模型选择哪种机器的指导：\n\n| **参数量** | **实例类型** | **GPU 显存** |\
  \ **示例模型** |\n| :--- | :--- | :--- | :--- |\n| ~7B | `ml.g5.4xlarge`，`ml.g6.4xlarge`\
  \ | 24 GB | Llama 2 7B，Mistral 7B，DeepSeek-LLM 7B，DeepSeek-R1 Distill Qwen 7B |\n\
  | ~13B | `ml.g5.12xlarge`，`ml.g6.12xlarge` | 96 GB | Llama 2 13B，Code Llama 13B，Qwen2.5\
  \ 14B，DeepSeek-R1 Distill Qwen 14B |\n| ~20B | `ml.g5.12xlarge`，`ml.g6.12xlarge`\
  \ | 96 GB | GPT-OSS 20B，Mistral Small 24B，Solar Pro 22B |\n| ~35B | `ml.g5.48xlarge`，`ml.g6.48xlarge`\
  \ | 192 GB | Code Llama 34B，Falcon 40B，Yi 34B，DeepSeek-R1 Distill Qwen 32B |\n|\
  \ ~70B | `ml.g5.48xlarge`，`ml.g6.48xlarge` | 192 GB | Llama 2 70B，Code Llama 70B，DeepSeek-R1\
  \ Distill Llama 70B，DeepSeek-R1 Distill Qwen 70B |\n| ~70B | `ml.p4d.24xlarge` |\
  \ 320 GB | - |\n| ~180B | `ml.p4de.24xlarge`，`ml.p5.48xlarge` | 640 GB | Falcon\
  \ 180B，GPT-OSS 120B，DeepSeek V2 236B (MoE)，DeepSeek V3 671B (37B active) |\n\n*表\
  \ 5.4：流行开源模型的实例类型选项*\n\n为了部署我们的模型，我们将利用 SageMaker 的 Python SDK（[`sagemaker.readthedocs.io/`](https://sagemaker.readthedocs.io/)）。以下脚本创建了部署\
  \ DeepSeek 模型的通用配置。您可以将模型替换为您感兴趣的模型，并根据前面的速查表调整机器配置（同时考虑成本）。在运行之前，您应确保以下几点：\n\n\
  *   您有一个启用了计费的 AWS 账户并已安装 AWS CLI。如果您还没有 CLI，可以在此处获取：[`docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html`](https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html)。\n\
  *   您已创建了一个附加了 `AmazonSageMakerFullAccess` 策略的 **IAM 角色**，并设置了以下信任关系以便 SageMaker\
  \ 可以扮演该角色（创建后请务必获取该角色的 **Amazon 资源名称** (**ARN**))：\n\n\n```markdown\n{\n    \"Version\"\
  : \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\"\
  ,\n            \"Principal\": {\n                \"Service\": \"sagemaker.amazonaws.com\"\
  \n            },\n            \"Action\": \"sts:AssumeRole\"\n        }\n    ]\n\
  }\n```\n\nSageMaker Python SDK 已包含在本项目的依赖项中，因此无需单独安装。\n\n您可能需要为所使用的实例类型请求配额增加。对于以下脚本，您需要至少一个\
  \ `ml.g6.12xlarge` 实例的服务配额。AWS 文档中有关于如何操作的良好说明：[`docs.aws.amazon.com/servicequotas/latest/userguide/request-quota-increase.html`](https://docs.aws.amazon.com/servicequotas/latest/userguide/request-quota-increase.html)。\n\
  \n### 如何部署您的模型\n\n以下是部署模型的方法：\n\n```python\nimport boto3\nimport sagemaker\nimport\
  \ os\nimport time\n\n# setup session\nboto_session = boto3.session.Session()\nregion\
  \ = boto_session.region_name\nsess = sagemaker.Session()\n\n# create our configuration\n\
  CONFIG = {\n    \"INSTANCE_TYPE\": \"ml.g6.12xlarge\", # the instance type\n   \
  \ \"ENV\": {\n        \"HF_MODEL_ID\": \"deepseek-ai/DeepSeek-R1-Distill-Qwen-14B\"\
  ,  # hugginface model id\n        \"TENSOR_PARALLEL_DEGREE\": \"max\",  # set max\
  \ to use all GPUs\n        \"OPTION_ENABLE_REASONING\": \"true\", # enable reasoning\
  \ parsing\n        \"OPTION_REASONING_PARSER\": \"deepseek_r1\", # set reasoning\
  \ parser\n    },\n    \"IMAGE_NAME\": \"djl-inference:0.33.0-lmi15.0.0-cu128\",\
  \ # image\n    \"BEDROCK_ROLE_ARN\": \"arn:aws:iam::ACCOUNT_NUMBER:role/replace-with-yours\"\
  , # role\n}\n\n# get base model name\nts = time.time()\nhf_model_id = CONFIG[\"\
  ENV\"][\"HF_MODEL_ID\"]\nmodel_name = hf_model_id.split(\"/\")[-1]\nbase_model_name\
  \ = sagemaker.utils.name_from_base(model_name)\n\n# create SageMaker model\ncurrent_region\
  \ = os.environ[\"AWS_DEFAULT_REGION\"]\nimage_name = CONFIG[\"IMAGE_NAME\"]\ninference_image_uri\
  \ = (\n    f\"763104351884.dkr.ecr.{current_region}.amazonaws.com/{image_name}\"\
  \n)\nlmi_model = sagemaker.Model(\n    image_uri=inference_image_uri,\n    env=CONFIG[\"\
  ENV\"],\n    role=CONFIG[\"BEDROCK_ROLE_ARN\"],\n    name=base_model_name,\n)\n\
  endpoint_name = f\"{base_model_name}-endpoint\"\n\n# print details\nprint(f\"{base_model_name=}\"\
  )\nprint(f\"{current_region=}\")\nprint(f\"{inference_image_uri=}\")\nprint(f\"\
  {endpoint_name=}\")\n\n# deploy model (this can take up to 15 mins!)\nlmi_model.deploy(\n\
  \    initial_instance_count=1,\n    instance_type=CONFIG[\"INSTANCE_TYPE\"],\n \
  \   container_startup_health_check_timeout=900,\n    endpoint_name=endpoint_name,\n\
  )\nprint(f\"Model has been deployed to endpoint {endpoint_name}\")\n```\n\n模型的部署（取决于您的区域和实例可用性）可能需要长达\
  \ 15 分钟。完成后，当您导航到 AWS 控制台时，会注意到一个新的模型和端点刚刚被创建：\n\n![图 5.3: 我们在 AWS 上创建的模型](img/B33471_05_3.png)\n\
  \n图 5.3: 我们在 AWS 上创建的模型\n\n![图 5.4: SageMaker 端点的仪表板](img/B33471_05_4.png)\n\n图\
  \ 5.4: SageMaker 端点的仪表板\n\n模型部署完成后，我们可以导航到 Amazon SageMaker AI 控制台。点击 **Inference**\
  \ 部分，可以导航至 **Inference** > **Models**，您将看到新部署的 DeepSeek 模型。导航至 **Inference** > **Endpoints**\
  \ 将显示您的模型端点，以及一组供您监控端点状态（CPU 利用率、内存利用率、GPU 内存、GPU 利用率以及调用/请求指标）的指标。\n\n### 危险\n\n\
  完成模型端点使用后，请记得将其关闭，否则实例开启期间您将继续被收费！为此，您可以在 AWS 控制台删除端点或使用 SageMaker SDK：\n\n```python\n\
  import sagemaker\nsess = sagemaker.Session()\nsess.delete_endpoint(endpoint_name)\n\
  sess.delete_endpoint_config(endpoint_name)\nlmi_model.delete_model()\n```\n\n###\
  \ LMI 容器 API 格式与结构化输出\n\nLMI 容器支持三种不同的 API 模式：OpenAI 的 Chat Completions 格式、OpenAI\
  \ Completions 格式和 TGI 格式。如果我们希望进行预测，以下三个示例实际上是等效的：\n\n```python\nllm = sagemaker.Predictor(\n\
  \    endpoint_name=endpoint_name,\n    sagemaker_session=sess,\n    serializer=sagemaker.serializers.JSONSerializer(),\n\
  \    deserializer=sagemaker.deserializers.JSONDeserializer(),\n)\nTEMPERATURE =\
  \ 0.01\nMAX_TOKENS = 1024\nUSER_MESSAGE = \"What is the capital of Le Marche, Italy?\"\
  \n\n# 1. OpenAI chat completions\nllm.predict(\n    {\n        \"messages\": [\n\
  \            {\n                \"role\": \"user\",\n                \"content\"\
  : user_message,\n            }\n        ],\n        \"temperature\": TEMPERATURE,\n\
  \        \"max_tokens\": MAX_TOKENS,\n    }\n)\n\n# 2. OpenAI Completions format\n\
  llm.predict(\n    {\n        \"prompt\": user_message,\n        \"temperature\"\
  : TEMPERATURE,\n        \"max_tokens\": MAX_TOKENS,\n    }\n)\n\n# 3. TGI format\n\
  llm.predict(\n    {\n        \"inputs\": user_message,\n        \"parameters\":\
  \ {\n            \"max_new_tokens\": MAX_TOKENS,\n            \"temperature\": TEMPERATURE,\n\
  \        },\n    }\n)\n```\n\n然而，正如我们之前提到的，选择 LMI 容器的一个重要原因是它支持 `vLLM` 作为推理引擎以及结构化输出的各种选项。事实上，LMI\
  \ 容器支持 Chat Completions 格式**因为** LMI 容器使用 `vLLM` 作为推理引擎。使用 `vLLM` 进行结构化生成的一个选项是\
  \ `xgrammar` ([`docs.vllm.ai/en/v0.8.1/features/structured_outputs.html`](https://docs.vllm.ai/en/v0.8.1/features/structured_outputs.html))。\n\
  \n接下来是一个名为 `llm` 的函数示例，该函数将使用我们的 SageMaker 端点和结构化输出，返回符合我们传递给它的 `response_model`\
  \ 的预测。如您所见，`vLLM` 支持 `response_format` 和一个 `extra_body` 参数，我们可以在此指定希望其遵守的 Pydantic\
  \ 模型以及希望使用的解码后端：\n\n```python\ndef llm(\n    messages: list[dict],\n    endpoint_name:\
  \ str,\n    response_model: BaseModel,\n) -> BaseModel:\n    client = get_aws_llm(endpoint_name=endpoint_name)\n\
  \    response = client.predict(\n        {\n            \"messages\": messages,\n\
  \            \"temperature\": 0.01,\n            \"max_tokens\": 1024,\n       \
  \     \"response_format\": {\n                \"type\": \"json_schema\",\n     \
  \           \"json_schema\": {\n                    \"name\": response_model.__name__,\n\
  \                    \"schema\": response_model.model_json_schema(),\n         \
  \           \"strict\": True,\n                },\n            },\n            \"\
  extra_body\": {\"guided_decoding_backend\": \"xgrammar\"},\n        }\n    )\n \
  \   return response_model.model_validate_json(\n        response[\"choices\"][0][\"\
  message\"][\"reasoning_content\"]\n    )\n```\n\n然后我们可以通过提供一个 Pydantic 模型和消息列表来使用此函数，如以下示例：\n\
  \n```python\nclass Capital(BaseModel):\n        capital: str\n        population:\
  \ int\n\nmessages = [\n        {\n                \"role\": \"user\",\n        \
  \        \"content\": \"What is the capital of France?\",\n        }\n]\n\nresponse\
  \ = llm(\n        messages,\n        \"DeepSeek-R1-Distill-Qwen-14B-2025-08-24-08-52-31-391-endpoint\"\
  ,\n        response_model=Capital,\n)\nprint(response)\n# capital='Paris' population=2161512\n\
  ```\n\n因此，现在我们已在 AWS 上部署了大型 DeepSeek 模型，并拥有一个支持 `vLLM` 推理引擎**任何**功能的端点。剩下的唯一步骤是将其与我们的每日健康摘要服务再次集成。由于我们正在对\
  \ AWS 进行 API 调用，这应该非常简单。\n\n## 将我们的服务更新为使用 Amazon SageMaker 端点\n\n要将我们的服务更新为使用在\
  \ AWS 中部署的模型，我们只需替换之前构建的 `llm` 函数即可。在章节材料中，我们包含了一个 `07-api-deepseek-sagemaker.py`\
  \ API，可通过以下方式运行：\n\n\n## 最佳实践和建议\n\n我们的 API 后端现在是 Amazon SageMaker，但其他一切保持不变：请求格式、命令和用户体验。这展示了结构化输出的优势。你可以将后端切换到另一个服务，而不会干扰用户的工作流或破坏\
  \ API。事实上，我们也可以同时构建一个服务于三个不同后端（DeepSeek API、CPU 推理和 Amazon SageMaker）的三端点 API——我们就把这个留作练习吧。\n\
  \n在本章中，通过构建每日健康摘要服务，我们探索了使用 DeepSeek 模型的三种主要方式：调用 API、在本地 CPU 上运行蒸馏模型，以及使用 AWS、LMI\
  \ 容器和 vLLM 部署更大的模型。这些只是冰山一角。开源的好处在于，如果需要，你还有更多的选择可以探索。\n\n话虽如此，**很少**需要自己部署 DeepSeek\
  \ 模型。自托管能让你拥有控制权和隐私性，但也意味着额外的工作和成本。你必须管理基础设施、监控性能并确保可靠性。对于大多数情况，尤其是在测试想法或验证产品时，从\
  \ API 开始几乎总是最佳选择。保持简单，直到你确定需要更多。\n\n在决定是否自己托管模型时，可以参考这个快速清单：\n\n*   **成本**：比较 API\
  \ 使用成本与自部署成本。它们相差多少？\n\n*   **延迟**：响应需要多快？你的用户能接受吗？\n\n*   **可扩展性**：你的设置能否应对峰值使用量？如果用户一夜暴增怎么办？你还能为他们服务吗？\n\
  \n*   **稳健性**：你的设置需要多稳健？你有负责基础设施的团队吗？\n\n*   **灵活性**：你能轻松地将应用程序从 API 调用演进到自托管，反之亦然吗？\n\
  \n我们已经展示了如何从 API 开始，转向 CPU 推理，并最终部署更大的模型。由于我们的 API 格式保持一致，用户不会注意到变化。这是一种经过验证的演进方式，不会破坏现有系统。\n\
  \n## 总结\n\n在本章中，我们带你从最初的想法到一个完全可用的服务，该服务用 DeepSeek 驱动的动态洞察取代了无聊的智能手表摘要。我们首先展示了如何使用\
  \ DeepSeek API 快速构建一个简单的原型，以满足我们的初始需求。然后，我们探索了使用蒸馏版本在本地运行模型，并构建了一个轻量级的、基于 CPU 的服务，无需\
  \ GPU 即可运行。\n\n接下来，我们专注于灵活性，展示了`LiteLLM`等库如何让你无需修改应用代码即可无缝切换后端提供商。最后，我们通过使用 LMI\
  \ 容器和`vLLM`在 AWS 上部署 LLM 来扩展规模，从而在保持控制的同时能够部署更大的模型。\n\n至此，你已经掌握了将任何 DeepSeek 驱动的应用推向生产环境的工具集，无论你是想保持小而高效、通过\
  \ API 运行，还是在云端部署更大的模型。\n\n但今天许多成功的应用程序并非由单个 LLM 驱动，而是由多个模型协同工作，这通常被称为**智能体**。这正是我们将在下一章中探讨的内容。\n\
