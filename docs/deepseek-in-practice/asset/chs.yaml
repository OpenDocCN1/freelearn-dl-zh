  \ tenant_id, user_role)\n        else:\n            return error_response(405, \"\
  Method not allowed\")\n\n    except Exception as e:\n        logger.error(f\"Unhandled\
  \ error: {str(e)}\")\n        return error_response(500, \"Internal server error\"\
  )\n\n@xray_recorder.capture('get_user')\ndef get_user(event, tenant_id):\n    \"\
  \"\"Get user with tenant isolation\"\"\"\n    try:\n        user_id = event['pathParameters']['user_id']\n\
  \n        response = table.get_item(\n            Key={\n                'user_id':\
  \ user_id,\n                'tenant_id': tenant_id  # Ensures tenant isolation\n\
  \            }\n        )\n\n        if 'Item' not in response:\n            return\
  \ error_response(404, \"User not found\")\n\n        return success_response(response['Item'])\n\
  \n    except ClientError as e:\n        logger.error(f\"DynamoDB error: {e.response['Error']['Message']}\"\
  )\n        return error_response(500, \"Database error\")\n\ndef success_response(data):\n\
  \    return {\n        'statusCode': 200,\n        'headers': {'Content-Type': 'application/json'},\n\
  \        'body': json.dumps(data, default=str)\n    }\n```\n\n### Lambda 授权方\n\n\
  ```\nimport json\nimport os\nimport jwt\nfrom jwt import PyJWKClient\nfrom jwt.exceptions\
  \ import ExpiredSignatureError, InvalidTokenError\n\n# Configuration\nUSER_POOL_ID\
  \ = os.environ['USER_POOL_ID']\nREGION = os.environ['AWS_REGION']\nJWKS_URL = f\"\
  https://cognito-idp.{REGION}.amazonaws.com/{USER_POOL_ID}/.well-known/jwks.json\"\
  \n\n# Initialize JWKS client\njwks_client = PyJWKClient(JWKS_URL)\n\ndef lambda_handler(event,\
  \ context):\n    \"\"\"\n    Lambda Authorizer with JWT validation and tenant isolation\n\
  \    \"\"\"\n    try:\n        # Extract token from Authorization header\n     \
  \   token = extract_token(event)\n        if not token:\n            raise Exception(\"\
  No token provided\")\n\n        # Validate JWT token\n        decoded_token = validate_jwt_token(token)\n\
  \n        # Extract custom claims\n        tenant_id = decoded_token.get('custom:tenant_id')\n\
  \        role = decoded_token.get('custom:role', 'user')\n\n        if not tenant_id:\n\
  \            raise Exception(\"Missing tenant_id in token\")\n\n        # Generate\
  \ IAM policy\n        policy = generate_policy(\n            decoded_token['sub'],\n\
  \            'Allow',\n            event['methodArn'],\n            tenant_id,\n\
  \            role\n        )\n\n        return policy\n\n    except Exception as\
  \ e:\n        print(f\"Authorization failed: {str(e)}\")\n        raise Exception('Unauthorized')\n\
  \ndef validate_jwt_token(token):\n    \"\"\"Validate JWT token with Cognito JWKS\"\
  \"\"\n    try:\n        # Get signing key\n        signing_key = jwks_client.get_signing_key_from_jwt(token)\n\
  \n        # Decode and validate token\n        decoded_token = jwt.decode(\n   \
  \         token,\n            signing_key.key,\n            algorithms=[\"RS256\"\
  ],\n            options={\"verify_exp\": True}\n        )\n\n        return decoded_token\n\
  \n    except ExpiredSignatureError:\n        raise Exception(\"Token has expired\"\
  )\n    except InvalidTokenError:\n        raise Exception(\"Invalid token\")\n```\n\
