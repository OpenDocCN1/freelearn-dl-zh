  \ Token 限制。\n\n这些示例能让您快速启动并运行。维持可靠性、性能和成本需要运维实践（监控、扩缩容和治理），我们将在接下来讨论。\n\n## 生产运维与监控\n\
  \n模型已部署。第一批请求正在流入。现在是困难的部分：在规模上保持可靠、高效和安全地运行。本节提炼了区分概念验证与生产系统的运维智慧。\n\n### 监控与可观测性\n\
  \nLLM 运行在昂贵的 GPU 上；可见性对于可靠性和开支控制至关重要。重要的指标分为四类：\n\n*   **Token 计数直接转化为成本**。跟踪每个请求的提示（prompt）和补全（completion）Token。大多数提供商在响应元数据中返回此信息：兼容\
  \ OpenAI 的 API 公开 `prompt_tokens` 和 `completion_tokens` 用量；Amazon Bedrock Converse\
  \ 报告 `inputTokenCount`/`outputTokenCount`；Vertex AI 包含 `usageMetadata.promptTokenCount`/`outputTokenCount`。对于自托管引擎（vLLM/TGI），从服务器公开使用量和\
  \ Prometheus 指标（用于提示/生成 Token 的计数器），并可选择通过模型的分词器在客户端验证计数。这不仅仅是为了计费；突然的飙升通常揭示低效的提示，或者更糟的提示注入尝试。当您看到\
  \ Token 飙升时，首先问一个简单问题：是提示变大了，还是答案变长了？提示 Token 的阶跃变化通常意味着模板或 RAG 发生了变化（检索到的段落更多、分块方式不同），而补全\
  \ Token 的激增通常指向越狱或“失控的”推理，模型持续思考并达到长度限制。如果每分钟总 Token 量飙升，而每个请求的 Token 在众多用户间看起来正常，您可能看到的是使用量激增；如果飙升来自一小部分重复请求的用户群体，那可能是个重试循环或客户端错误。将飙升视为一次差异分析：比较前后的提示，如果常见头部增长则启用前缀缓存，限制最大\
  \ Token 以驯服长答案，如果输入膨胀则收紧检索设置。\n*   **延迟分布**告诉您用户如何体验您的服务。对于 DeepSeek-R1，首个 Token\
  \ 延迟（TTFT）可能因模型决定推理的深度而剧烈波动，使得 p95 延迟成为比平均值更好的服务等级目标（SLO）指标。\n*   **GPU 利用率**值得特别关注。当\
  \ vLLM 报告 KV 缓存使用率接近容量时，您即将撞上性能悬崖。模型不会优雅降级；它会直接坠崖。将吞吐量想象成高速公路，KV 缓存就是车道；随着缓存填满和碎片化，车辆仍然驶入，但一切同时减速——每秒\
  \ Token 数下降，队列变长，TTFT 和 p95 一起上升。那个同步的跃升就是悬崖：您已经跨过一个容量边界，逐出和更小的有效批处理导致了非线性崩溃。从悬崖边返回的最快方法是缩减每个请求的需求（降低最大上下文或总\
  \ Token 数），减少并发序列，或临时丢弃低优先级流量；持久的解决方案是更多裕量（更大的 VRAM 或缓存），更好的批处理，以及通过共享前缀或 KV 复用提高缓存命中率。\n\
  \n使用 vLLM 的 Prometheus 指标来跟踪缓存压力和吞吐量（例如，每秒 Token 数、`vllm:num_requests_running`、运行中与等待中的请求数），并在\
  \ KV 缓存利用率接近您的容量阈值（例如约 90%）之前告警。\n\n*   第四类是**成本跟踪**。将您的 Token 指标与当前定价表关联，并实时计算每个请求的美元成本。当该数字每周环比跳升\
  \ 50% 时，说明有事情发生了——可能是新的提示模板，或者是您的缓存层出现了退化。\n\n对于生产部署，vLLM 的 `/metrics` 端点开箱即提供兼容\
  \ Prometheus 的可观测性。将这些指标导出到您选择的时序数据库。添加一个 Prometheus `scrape_config`（或 Kubernetes\
  \ `ServiceMonitor`），其目标指向 `http://YOUR_VLLM_HOST:8000/metrics`，如果您使用外部后端，请启用 `remote_write`\
  \ 到您的时序数据库（例如 Thanos、Cortex 或 VictoriaMetrics），以便您可以在 Grafana 中可视化这些指标。Grafana 仪表盘包含专门针对\
  \ vLLM 部署的预构建可视化。\n\n最终，指标只能告诉您发生了什么，而非原因。为了进行根本原因分析，您需要请求级别的可见性。像 Langfuse 这样的工具在提供自动\
  \ **个人身份信息**（**PII**）脱敏的同时，保留了足够的上下文来调试那些不可避免的“模型说了什么？”事件。\n\n### 扩缩容与性能\n\nDeepSeek\
  \ 模型提出了一个迷人的扩缩容挑战。与您可以简单启动更多副本的传统 Web 服务不同，LLM 扩缩容需要理解模型架构、硬件拓扑和请求模式之间的相互作用。\n\n\
  天真的方法（将您的模型服务视为任何其他无状态应用程序）会惨败。原因如下：每个请求都会建立可为类似提示复用的 KV 缓存状态。在副本间随机分发请求会破坏这种缓存局部性。实现基于用户或会话\
  \ ID 的会话粘性路由。这个简单的更改可以在对话工作负载中将吞吐量提高 40%。\n\n对于 DeepSeek-V3 的 MoE（混合专家）模型，每个 Token\
  \ 只有一小部分专家（通常每层两个）处于活动状态。实践中，许多服务栈会在服务池中保持所有专家常驻，以最小化跨节点路由；然而，这不是硬性要求。您可以跨 GPU/节点分片专家（专家并行），或将部分专家卸载到\
  \ CPU/NVMe，以额外的全互联通信和更高延迟为代价，换取更低的单节点内存。\n\n因此，水平扩缩容可以有两种形式：复制完整的 671B 参数集以增加并发性的副本，或通过专家并行分片增长总专家池而不重复所有权重的容量扩展。\n\
  \n根据您的延迟预算和互联速度进行选择；在较慢的互联条件下，拥有 NVLink/NVSwitch 的更少、更大的节点通常优于许多小实例。运维人员可以手动执行此操作，通过配置更大的\
  \ NVLink/NVSwitch 节点并限制放置（例如，使用 Kubernetes `nodeSelector`/`affinity` 和污点/容忍的节点池，或在裸机上进行显式\
  \ GPU 绑定），同时限制该服务的水平自动扩缩容。\n\n生产环境中的性能优化是寻找瓶颈并系统性地消除它们的实践。以下是您实现优化的方式：\n\n1.  **从连续批处理开始**：传统服务顺序处理请求；连续批处理动态地将请求分组以最大化\
  \ GPU 利用率。这里的一个关键参数是 `--max-num-seqs`，它控制 vLLM 可以并发处理的最大序列（请求数）。正确设置此值是在吞吐量和内存稳定性之间的关键平衡。设置过低，您会在流量高峰时留下性能潜力；设置过高，您将面临灾难性的\
  \ **内存溢出**（**OOM**）错误。\n\n理想值直接取决于模型权重加载后的可用 VRAM。您可以使用以下逻辑估算一个安全的起点：\n\n考虑两个实际场景：\n\
  \n*   **场景 1：高吞吐量聊天机器人**：您在单个 80 GB H100 GPU 上运行一个 33B 模型（量化为 INT4，约 19 GB）。您的工作负载由许多并发用户组成，对话轮次较短（平均序列长度\
  \ 512 个 Token）：\n    *   **VRAM 分配**：总共 80 GB - 模型占用 19 GB ≈ 61 GB 可用。预留 10% 作为开销，约剩\
  \ 55 GB 用于 KV 缓存。\n    *   **每序列的 KV 缓存**：对于此大小的模型，缓存大约为 25 KB/Token。因此，512 Token\
  \ * 25 KB/Token ≈ 12.8 MB/序列。\n    *   **计算**：55,000 MB / 12.8 MB ≈ 4,296。由于内存碎片，此理论最大值是不切实际的。\n\
  \    *   **实际值**：`--max-num-seqs` 的一个安全起始值是 `256`（一个常见的默认值）。在真实流量下进行负载测试和监控 KV 缓存使用情况后，您可能会谨慎地将其提高到\
  \ `512` 或 `1024` 以最大化吞吐量。\n*   **场景 2：长上下文文档分析**：您在 4x A100-80 GB 节点（总共 320 GB VRAM）上服务一个\
  \ 70B 模型（BF16，约 140 GB）。工作负载涉及较少的并发请求，但文档非常长（平均序列长度 16,384 个 Token）：\n    *   **VRAM\
  \ 分配**：总共 320 GB - 模型占用 140 GB ≈ 180 GB 可用。预留 10% 作为开销，约剩 162 GB 用于 KV 缓存。\n   \
  \ *   **每序列的 KV 缓存**：对于 70B 模型，缓存大约为 80 KB/Token。因此，16,384 Token * 80 KB/Token ≈\
  \ 1.31 GB/序列。\n    *   **计算**：162 GB / 1.31 GB ≈ 123 个序列。\n    *   **实际值**：鉴于每个请求的高内存压力，从一个更保守的\
  \ `--max-num-seqs` 值 `32` 开始是谨慎的。根据测试期间的稳定性，您可能会将其提高到 `64`，但超过此值将显著增加此工作负载的 OOM\
  \ 错误风险。\n\n最佳实践是计算一个保守的基线，然后通过监控 GPU 内存和 vLLM Prometheus 指标端点的 KV 缓存使用情况，经验性地向上调整该值。\n\
  \n1.  **缓存是您的秘密武器**：您可以实施两层策略。第一层，**KV 缓存**，是 Transformer 模型生成文本的基础部分，由现代推理引擎（如\
  \ vLLM）自动处理。没有“开启” KV 缓存的标志；它是防止模型在每次生成新 Token 时重新计算上下文窗口中每个 Token 的核心过程。您通过上下文长度等参数间接管理其内存影响。\n\
  \n第二层是显式的**提示前缀缓存**，您可以为具有重复起始文本的工作负载启用此功能。在 vLLM 中，您通过使用 `--enable-prefix-caching`\
  \ 标志启动服务器来激活此功能。启用后，vLLM 会自动检测多个请求是否共享公共前缀（例如系统提示或一组 few-shot 示例）。它仅在第一个请求时计算该前缀的\
  \ KV 状态并存储。所有随后开始于完全相同前缀的请求都会重用缓存的 KV 状态，跳过昂贵的重新计算。这样，系统提示和模板可以无限期缓存，显著加快常见任务的预填充阶段。缓存命中率超过\
  \ 60% 通常可将延迟降低三分之一，并按比例削减成本。\n\n1.  **思考成本**：对于 R1 模型，您面临一个独特的决策：多少思考才算过多？在延迟敏感的应用程序中，考虑实现推理截断。监控推理\
  \ Token 计数的分布，并根据您的 SLA 设置限制。是的，您可能会牺牲一些准确性，但用户更喜欢快速、足够好的回答，而非 arrives too late\
  \ 的完美答案。\n\n在扩缩容、缓存和思考边界都设定好后，下一步就是将这些转化为实际的美元或欧元金额：Token、缓存命中率和 GPU 利用率如何转化为每个请求的成本和每个用户的成本。\n\
  \n### 成本管理\n\nLLM 成本有一种指数级增长的坏习惯。与成本随流量线性扩展的传统基础设施不同，LLM 成本可能基于提示设计、模型选择或用户行为模式而爆发式增长。单一提示模板的更改就可能在一夜之间使您的账单增加三倍。\n\
  \n这里是一种您可以尝试的务实成本管理方法：\n\n1.  从请求级预算开始。每个请求都应包含一个基于预期 Token 使用量的成本估算。在请求到达模型之前，拒绝超过每用户或每端点预算的请求。这不仅仅是为了防止滥用；更是为了在配置错误耗尽您的银行账户之前将其捕获。\n\
  \n为了应用此方法，在 API 网关或推理服务前的中间件层中实现检查。对于每个传入的请求，通过将 `max_tokens` 参数乘以每个输出 Token 的成本来计算\
  \ `max_potential_cost`，并加上输入 Token 的成本。将每用户或每密钥的每日/每月预算存储在快速访问数据库（如 Redis）中。然后中间件执行简单的检查：\n\
  \n```\n\n\n\n```\nif (user_current_spend + max_potential_cost > user_budget) { return\
  \ 429_BUDGET_EXCEEDED; }\n```\n\n\n\n```\n这个预计算步骤成本低廉，且能有效将您的模型与高成本请求隔离开来。\n\n1.\
  \  基础设施效率需要用不同的视角来看待。`Kubecost` 的 GPU 模块揭示了残酷的现实：您配置的 8 GPU 集群可能 40% 的时间都处于空闲状态。以每\
  \ `H100` 小时 $2.48 的价格计算，空闲时间就成了一种您负担不起的奢侈。但不要只看平均值——要绘制使用率随时间变化的图表。可预测的模式（夜晚和周末使用率低）表明您需要自动伸缩。随机的尖峰可能意味着批处理作业调度存在问题。\n\
  2.  实际上，您可以通过使用 `NVIDIA` `DCGM` `Exporter`（[`github.com/NVIDIA/dcgm-exporter`](https://github.com/NVIDIA/dcgm-exporter)）将\
  \ GPU 指标暴露给 `Prometheus`，从而在 Kubernetes 上实现这一点。然后，创建一个 `Grafana` 仪表板，其中包含一个显示 `avg(dcgm_gpu_utilization)\
  \ by (pod)` 的面板。对于自动伸缩，使用 `Prometheus` 伸缩器配置 `KEDA`。您的 `ScaledObject` 定义将针对诸如 `sum(rate(vllm_requests_running[2m]))`\
  \ 之类的指标，允许您基于实际推理负载而非仅仅是 `CPU` 或内存（它们通常是 GPU 工作负载的糟糕代理）来伸缩副本。\n3.  最阴险的成本蔓延源于模型漂移。您部署了一个出色、高效的\
  \ 330 亿参数模型。六个月后，您不知怎地就在生产环境中运行着 700 亿参数的变体，却没人记得为什么。请按模型版本跟踪每个输出令牌的成本，并在发生变化时发出警报。每周\
  \ 20% 的增长值得调查；50% 的增长则需要立即采取行动。\n4.  要实施此方案，请确保每个推理日志都包含 `model_id`、`input_tokens`\
  \ 和 `completion_tokens`。在您的日志平台（如 `Datadog` 或 `ELK` 技术栈）中，通过使用价格查找表（例如 `deepseek-v3_input_cost\
  \ = $0.27/M_tokens`）来丰富这些日志，从而创建一个指标。然后，您可以构建一个仪表板，可视化 `sum(request_cost) / count(requests)`\
  \ 并按 `model_id` 分组。设置一个自动监控器，将此指标的周平均值与上周进行比较，如果百分比变化超过定义的阈值，则触发警报。\n5.  预算警报应呈几何级数上升。在您的预算的\
  \ 50%、80% 和 100% 处设置警报。50% 警报是信息性的。收到此警报时，您应检查增长是否符合预期。80% 警报会通知值班人员，表明需要关注某些问题。100%\
  \ 警报应触发自动节流。宁愿降低服务质量，也不要在醒来时面对一笔六位数的云服务账单。\n6.  您可以使用云提供商的原生工具来设置此功能。例如，在 `AWS`\
  \ 中，创建一个具有三个警报阈值的 `AWS` 预算。50% 的操作可以是一个发送到 `Slack` 频道以提高可见性的 `SNS` 通知。80% 的操作可以是一个触发\
  \ `PagerDuty` 或 `Opsgenie` webhook 的 `SNS` 通知。对于 100% 的操作，让 `SNS` 触发一个 `Lambda`\
  \ 函数，该函数以编程方式将您的 `API Gateway` 使用计划修改为高度受限的节流限制（例如，每分钟一个请求），或更新 `AWS AppConfig`\
  \ 中的功能标志以优雅地禁用服务。\n\n设置了支出护栏（预算、警报和自动节流）之后，下一个问题是韧性：我们如何防止这些相同的控制被滥用、提示词注入或数据渗出所绕过？好消息是，您刚刚设置的基元（网关、使用计划和功能标志）同样可以作为安全执行点。\n\
  \n### 实践中的安全\n\nLLM 带来了传统应用安全手册未曾涉及的安全挑战。您可能遇到的一些挑战如下：\n\n*   提示词注入是真实发生且确实存在的。\n\
  *   基于请求次数的速率限制可以阻止用户发送 100k 令牌的提示。\n*   标准身份验证可能无法区分用户请求俳句与请求长篇大论之间的成本差异。\n\n网络安全仍然是基础但远远不够。因此，您需要将模型部署在私有子网中，用\
  \ API 网关作为前端，并在服务间使用 `mTLS`（即所有标准网络安全实践均适用）。但您还需要添加特定于 LLM 的控制措施：\n\n1.  输入验证不仅必须检查\
  \ `SQL` 注入，还必须检查提示词注入模式。首先根据允许列表进行验证：强制执行严格的模式（预期的 `JSON` 键/类型）、长度和字符集限制，并拒绝控制令牌。然后，将输入通过一个提示词注入过滤器，该过滤器结合了简单规则（正则表达式匹配诸如\
  \ *ignore previous instructions*、*reveal system prompt*、越狱标记和 `Unicode` 同形异义词等短语）和针对已知攻击样本的嵌入相似性检查；阻止或挑战高风险请求，并将标记的日志发送到您的集中式日志存储。\n\
  2.  输出过滤不仅需要捕获 `PII`（个人身份信息），还需要捕获越狱尝试。\n3.  DeepSeek 模型的独特挑战在于其能力。一个足够聪明、能够处理复杂问题的模型，也足够聪明地被创造性地滥用。对提示词实施语义相似性检查，与已知的越狱模式进行比较。常见模式包括指令覆盖（*ignore\
  \ previous instructions*、*reveal/repeat the system prompt*）、`Do Anything Now`（`DAN`）/开发者模式角色扮演、翻译/编码包装器（`Base64`/`ROT13`）、`JSON`/`Markdown`\
  \ 围栏逃逸，以及旨在诱导禁止内容的 *for research/simulation* 请求。使用 `OWASP` 的 `LLM Top 10` 示例（[`owasp.org/www-project-top-10-for-large-language-model-applications/`](https://owasp.org/www-project-top-10-for-large-language-model-applications/)）、`PromptBench`\
  \ 攻击集（[`github.com/microsoft/promptbench`](https://github.com/microsoft/promptbench)）以及来自\
  \ `NVIDIA NeMo Guardrails` 的样本越狱（[`github.com/NVIDIA/NeMo-Guardrails`](https://github.com/NVIDIA/NeMo-Guardrails)）等公共参考来填充您的相似性索引。但不要仅仅依赖黑名单；它们总是落后于一个创意提示。相反，实施纵深防御：按令牌数量而非仅仅按请求数进行速率限制。监控异常的令牌消耗模式并跟踪提示复杂度指标。\n\
  4.  对于敏感部署，请考虑完整的攻击链。攻击者可能不会直接攻击您的模型，而是可能利用它来探测您的基础设施。监控询问系统配置、内部细节或错误消息的提示。通过将所有请求路由到记录提示词并运行轻量级分类器（正则表达式规则或本地\
  \ LLM）的 `API Gateway` 或中间件，实施服务器端提示检查，以标记“侦察”意图，例如询问系统提示、环境变量、堆栈跟踪、文件路径或 `IP` 地址。将这些标记的事件转发到您的集中式日志存储（例如\
  \ `CloudWatch`、`Datadog` 或 `Splunk`），并在高风险匹配或每个用户/会话的尖峰时发出警报，同时配合基于令牌的速率限制以及针对重复命中的自动挑战/拒绝规则。这些侦察尝试通常在更严重的攻击之前发生。\n\
  \n### 模型的 CI/CD\n\n模型部署不是一次性事件——它是一个持续的过程。新版本承诺更好的性能，安全补丁要求立即部署，而经过微调的变体终于在测试中证明了其价值。没有适当的\
  \ CI/CD，模型更新就会变成每个人都想避免的高压事件。\n\n以下是一个可帮助您入门的行动计划：\n\n1.  从版本管理纪律开始。即使 DeepSeek\
  \ 发布了模型版本，您实际部署的是一个组合制品；它是基础模型修订版加上您的量化、分词器、适配器/LoRA、提示模板、解码限制、安全过滤器、推理引擎/容器和配置。进行版本控制是为了能够重现行为、安全回滚、满足审计要求以及进行\
  \ A/B 测试；仅供应商模型版本无法解释生产中的行为或成本差异。所有这些都说明：模型不仅仅是文件——它们是具有依赖项、配置和行为契约的制品。使用一个模型注册表（`MLflow`\
  \ 或云原生选项）来跟踪不仅仅是权重，还包括整个部署上下文。当出现问题时，您需要确切知道改变了什么。\n\n要付诸实践，请为您的组合制品采用一个具体的版本控制方案，该方案既要人类可读又要机器可解析——例如，`[base-model-version]-[quantization]-[adapters-hash]-[config-version]`，它可能看起来像\
  \ `deepseek-v3-b1.0-int4-lora-abc123-v2`。这里，`abc123` 可以是您训练 `LoRA` 的仓库的简短 `Git`\
  \ 提交哈希，而 `v2` 指的是您的解码配置文件的版本。这为生产环境中运行的确切制品创建了一个明确的标识符。\n\n2.  模型注册表，例如 `MLflow`，是您将所有这些整合在一起的地方。您的\
  \ CI 流水线（由提交触发）应打包这些组件并将其记录到单个 `MLflow` 运行中。使用 `mlflow.log_artifact()` 存储您的分词器配置、提示模板文件和安全过滤器脚本。使用\
  \ `mlflow.log_param()` 记录键值元数据，例如 `quantization_method: AWQ` 或 `base_model_id: \"\
  deepseek-ai/DeepSeek-V3\"`。\n3.  最后，将该整个运行注册为名为 `\"production-chat-endpoint\"` 的模型的新版本。现在，当您在\
  \ `MLflow` `UI` 中比较版本 `1.2.0` 和 `1.3.0` 时，您看到的不仅是新的模型文件，还有可能导致行为或成本变化的每个依赖项和配置更改的精确差异。\n\
  4.  蓝绿部署对于模型来说效果很好。在旧版本旁边启动新版本，使用合成流量进行验证，然后逐渐将真实用户迁移过去。关键见解是，不要只测试功能正确性。在金丝雀阶段监控延迟、令牌使用量和成本指标。一个准确率提高\
  \ 2% 但成本增加 50% 的模型可能算不上升级。\n\n在 `Kubernetes` 环境中，您可以使用服务网格（如 `Istio` 或 `Linkerd`）或\
  \ `API Gateway`（如 `Emissary-ingress`）来实现这一点。该模式涉及创建两个 `Kubernetes` `Deployment`：一个用于旧模型版本（例如\
  \ `deepseek-v1`），一个用于新的金丝雀版本（`deepseek-v2`）。一个 `Kubernetes` `Service` 对象同时指向这两个部署。然后，您配置一个路由规则（例如\
  \ `Istio` `VirtualService`），最初将 100% 的流量定向到 `v1`：\n\n5.  您的 CI/CD 流水线（例如使用 `GitHub\
  \ Actions` 或 `GitLab CI`）自动化了流量迁移。滚动部署作业的第一步是应用新的路由规则，仅将 1% 的流量发送到 `v2`。然后流水线暂停，并查询您的可观测性平台（例如\
  \ `Prometheus`）的关键指标，在 `Grafana` 仪表板上并排比较 `v1` 和 `v2` 部署。如果在设定的一段时间内（比如 15 分钟），`v2`\
  \ 的 `p95` 延迟、令牌使用量和计算出的每请求成本保持在可接受的范围内，流水线将自动继续将流量权重增加到 10%，然后是 50%，最后是 100%，从而完成滚动部署。\n\
  6.  回滚能力不是可选项。保持前一个模型版本处于热备状态并随时待命。当指标异常时，您需要一键式回滚，而不是手忙脚乱地重新部署过程。这意味着接受临时运行两个版本的基础设施成本。将其视为保险。\n\
  \n这个一键式回滚就是您部署流水线中的紧急制动。这不是一次新的部署；它是一个配置更改，可以立即将流量重新路由。如果您的金丝雀监控仪表板显示关键指标回归，例如有害内容生成激增或延迟突然翻倍，您就触发回滚。在您的\
  \ CI/CD 工具中，这应该是一个手动触发的作业，执行单个 `kubectl apply` 或向您的服务网格发送 `API` 调用，将流量路由规则更新为将 100%\
  \ 的流量送回稳定、之前运行的版本。整个回滚过程应只需几秒钟，而不是几分钟。\n7.  保持前一个版本 *热备* 意味着旧模型的 `Kubernetes` `Deployment`\
  \ 在整个金丝雀阶段保持其完整的副本数。它正在主动运行，并准备随时接收 100% 的生产负载。保险成本是实实在在的：如果单个模型副本每小时花费您 $5，并且您运行两个副本以实现高可用性，那么在滚动部署期间，您的成本将暂时从每小时\
  \ $10 增加到每小时 $20。一旦新版本被完全提升并确认稳定（例如，24 小时后），您流水线的最后一步应自动将旧部署的副本数缩减为零，从而消除额外的成本。\n\
  8.  模型的测试金字塔与传统软件不同。单元测试验证提示格式和响应解析。集成测试确认模型可以加载和响应。但关键的层次是行为测试：此模型是否保持了前一个版本的安全边界？它是否一致地处理边缘情况？构建一个包含提示和预期行为的黄金数据集，并在回归测试通过后才允许部署。\n\
  \n实际上，这些测试应作为 CI 流水线中的阶段运行。单元测试是在每次提交时运行的快速检查。使用 `pytest` 之类的框架，您可以编写一个简单的函数来验证提示模板：`assert\
  \ \"User:\" in format_prompt(history, query)`。另一个测试可以确认您的响应解析器处理预期的格式，并在 `JSON`\
  \ 格式错误时引发特定错误：`pytest.raises(MalformedJsonError): parse_response(\"{'invalid': 'json'}\"\
  )`。这些测试在模型加载之前就能捕获逻辑错误。\n9.  集成测试在容器构建后运行。您的流水线启动模型容器，并使用 `curl` 之类的工具访问其健康检查端点，然后用一个简单的\
  \ `\"hello\"` 提示访问其推理端点。测试只需断言返回 `200 OK` 状态码和有效的响应结构。这可以捕获依赖项、模型加载或环境配置的问题。\n10.\
  \ 行为回归测试是部署前最后也是最重要的关口。您的流水线将新模型部署到临时环境，并针对其运行测试套件。该套件会遍历您的“黄金数据集”（例如，`Git` 仓库中的\
  \ `test_cases.jsonl` 文件）。对于每个提示，它断言特定的行为。对于安全性，您可能断言有害提示会导致拒绝响应：`assert \"cannot\
  \ comply\" in response.lower()`。对于数据提取等关键任务的一致性，您可以将 LLM 的 `JSON` 输出与预定义的模式进行比较。对于更细微的质量（如语气或有用性），您甚至可以使用一个更小、更便宜的\
  \ *评判* LLM 来评估新模型的响应，并标记出与前一版本基线响应相比任何显著的负面变化。此阶段的失败应自动阻止生产环境的滚动部署。\n\n有了监控、伸缩、成本控制、安全性和\
  \ CI/CD，您的端点就从脆弱的演示演变成了持久的服务。我们将以一个简洁的操作手册作为结束。\n\n### 您的部署操作手册\n\n您现在拥有了完整的部署栈：从本地开发代理到多\
  \ GPU 生产集群。决策框架可归结为三个约束：数据敏感性、令牌量和运维能力。\n\n以下是您的操作手册：\n\n1.  **常见场景速查**：\n    *\
  \   **原型和开发**：使用 DeepSeek API，直到遇到速率限制或成本顾虑。对于离线工作，切换到使用较小模型的本地 `Ollama`。在验证用例之前，不要优化基础设施。\n\
  \    *   **处理敏感数据的生产环境**：如果托管服务（`Bedrock`/`Vertex`）满足合规要求，则从它们开始。仅在托管选项在法律或技术上不足时才自托管。为自托管学习曲线预留\
  \ 2-3 个月。\n    *   **高流量生产环境（>10 亿令牌/月）**：从数学上讲自托管更有利，但前提是拥有专门的 DevOps 资源。进行成本分析，包括人员时间，而不仅仅是\
  \ GPU 小时。考虑混合部署：API 用于可变负载，自托管用于基线流量。\n2.  **需要避免的常见陷阱**：\n    *   在未进行容量规划的情况下部署完整的\
  \ DeepSeek-V3（有关规模指导，请参阅关于硬件和推理优化引擎的章节）。\n    *   忽略缩放到零的能力（空闲时 $40/小时与 $0/小时的差别）。\n\
  \    *   将 R1 的推理令牌视为免费（它们会计入成本和延迟）。\n    *   在未监控令牌使用量的情况下部署（账单可能因提示更改而一夜之间增加 10\
  \ 倍）。\n3.  **实施清单**：\n    *   实施请求级别的成本跟踪。\n    *   在 50%、80% 和 100% 阈值处设置预算警报。\n\
  \    *   缓存系统提示和常见前缀（60% 以上的命中率是可实现的）。\n    *   对于对话式工作负载，使用粘性路由。\n    *   保持前一个模型版本热备，以便即时回滚。\n\
  \n生态系统发展迅速。今天的 8×H200 需求可能是明天的单 GPU 部署。专注于构建能够经受基础设施变化的抽象层：标准化 OpenAI 兼容 API，对所有部署进行版本控制，并保持从开发到生产的环境一致性。\n\
  \n以下是一些对工程师可能有用的提示。\n\n*   **对于初级工程师**：从*动手部署指南*部分的*示例 1*（`Ollama`）开始。在处理云部署之前，请先熟悉请求/响应周期和令牌经济学。\n\
  *   **对于高级工程师**：直接跳到*示例 3*（`Hugging Face Inference Endpoints`）进行生产部署，但请查看监控部分。LLM\
  \ 的可观测性与传统服务不同。\n*   **对于平台团队**：专注于推理引擎比较和生产运维指导将加速您的基础设施决策。\n\n**请记住**\n\n部署是达到目的的手段。选择满足您需求的最简单方法，然后随着您对实际使用模式的了解而迭代。\n\
  \n## 总结\n\n本章将部署从理论转变为在生产环境中运行全参数 DeepSeek-V3/R1 的务实操作手册。您通过控制/成本/复杂度视角绘制了全景图（API\
  \ vs. 托管 vs. DIY），学习了如何配置硬件规模（`VRAM`、`KV` 缓存、`TTFT`/吞吐量），并有意识地选择了推理引擎（`vLLM`/`TGI`/`TensorRT-LLM`）以及量化选项（`FP8`、`GPTQ`\
  \ 和 `AWQ`）以满足性能和预算要求。三个具体路径锚定了指导：本地开发代理（`Ollama`）用于迭代，托管服务（`Bedrock`/`Vertex`/`Azure`/`Hugging\
  \ Face`）用于企业可靠性，DIY（`vLLM` 在 GPU/Kubernetes 上）用于最大控制力和规模经济效益。\n\n然后，您实现了服务化：监控令牌/延迟/GPU\
  \ 和 `KV` 压力，在活动生成时通过连续批处理和粘性路由进行伸缩，缓存共享前缀，并通过缩放到零和预算警报强制执行基于令牌的预算。安全性超越了网络基础知识，扩展到提示词注入防御和输出过滤。最后，您将模型视为版本化的组合制品，并通过蓝绿/金丝雀部署和即时回滚安全地发布。凭借这套工具包，您可以选择满足当前约束的最简单部署方案，并随着工作负载的增长而充满信心地演进它。\n\
