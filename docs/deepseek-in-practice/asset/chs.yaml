  \n我们听到了您的心声，Duarte！\n\n当我们三位作者开始构思这本书时，我们意识到在像 DeepSeek 这样的 **大语言模型** (**LLM**)\
  \ 时代，佳明的通知肯定可以做得更好——好得多。一条更动态、个性化的消息——一条可以接受某种用户输入的消息。您知道我们的意思。有 *很多* 方法我们可以让它变得更好。所以，这就是我们打算做的。\n\
