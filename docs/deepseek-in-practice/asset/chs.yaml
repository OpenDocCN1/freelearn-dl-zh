  \n#### 设置\n\n在这里，我们将向您展示如何开始使用 DeepSeek API 进行构建。要进行设置，请遵循以下步骤：\n\n1.  访问平台网站 [`platform.deepseek.com/`](https://platform.deepseek.com/)。\n\
