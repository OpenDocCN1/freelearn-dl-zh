  \n将评估框架应用于分析迭代提示的响应，重点关注增强的细节如何改善企业环境的实施准备度。\n\n文档分析的一个有趣应用领域是金融。在下一个案例研究中，我们将提示\
  \ `DeepSeek` 分析一份财务文档，并将其性能与基准工具进行比较。\n\n\n\n\n为全面评估 `DeepSeek-R1` 的文档理解能力，我们设计了一项严谨的基准测试研究，对比了三种不同的技术方法：\n\
  \n*   **`DeepSeek-R1`**：运用高级推理进行直接语义提取。\n*   **`Docling` (IBM Research)**：专注于文档结构与表格解析。\n\
  *   **`MarkItDown` (Microsoft)**：针对大语言模型优化的文档预处理。\n\n### 测试文档创建与基准测试设置\n\n为了严格评估文档理解能力，我们创建了一个全面的测试数据集，旨在挑战文档解析的方方面面。我们虚构的\
  \ `FruitStand Innovation Inc.` 公司季度财务报告共计 192 行，包含了真实财务报表中常见的复杂结构。该文档包含六个主要表格，旨在测试不同的解析挑战：一个多列合并资产负债表，对比三个季度（2024\
  \ 年 Q3、2024 年 Q2 和 2023 年 Q3）；一份详细的利润表，分列产品收入和服务收入；一份地域收入分析，覆盖全球四个区域（北美、EMEA、亚太和拉美）；四个业务线（云平台、移动解决方案、企业服务和开发者工具）的产品性能指标；八个针对季度目标进行跟踪的关键绩效指标（KPI）；以及预测\
  \ 2024 年 Q4 表现的前瞻性指引范围。\n\n资产负债表展示了我们希望测试的解析复杂性。每个财务科目都跨越多个季度并附有相应的百分比变化，要求工具在提取精确数值的同时，保持正确的行-列对应关系。以下是我们测试文档中“流动资产”部分的摘录：\n\
  \n```\n| **Assets** | **Q3 2024** | **Q2 2024** | **Q3 2023** | **Change (%)** |\n\
  |-----------|-------------|-------------|-------------|----------------|\n| **Current\
  \ Assets** | | | | |\n| Cash and cash equivalents | $234,678 | $198,543 | $187,432\
  \ | +25.2% |\n| Short-term investments | $89,234 | $76,890 | $45,678 | +95.3% |\n\
  | Accounts receivable (net) | $142,567 | $134,289 | $118,945 | +19.9% |\n| Inventory\
  \ | $67,890 | $72,345 | $81,234 | -16.4% |\n| Prepaid expenses | $23,456 | $21,234\
  \ | $19,876 | +18.0% |\n| **Total Current Assets** | **$557,825** | **$503,301**\
  \ | **$453,165** | **+23.1%** |\n```\n\n这种结构测试了工具能否处理多列布局，区分普通科目与加粗的合计项，正确解析正负百分比变化，并保持每个数值与其对应季度的关联性。一个工具即使提取了正确的数值`$234,678`，但将其与\
  \ 2024 年 Q2 而非 2024 年 Q3 关联，也未能满足我们的准确性要求。\n\n创建测试文档后，我们手动构建了一个全面的标准答案数据集，存储于 `ground_truth_data.json`\
  \ 文件中。这个 JSON 文件包含超过 150 个独立的数据字段，代表了我们认为完美的文档解析器应提取的所有信息。标准答案结构镜像了文档的组织方式，不同部分采用嵌套对象。以下是标准答案表示文档元数据和财务关键数据的方式：\n\
  \n```\n{\n  \"document_metadata\": {\n    \"company_name\": \"FruitStand Innovation\
  \ Inc.\",\n    \"report_type\": \"Quarterly Financial Report\",\n    \"quarter\"\
  : \"Q3\",\n    \"year\": 2024,\n    \"report_date\": \"2024-09-30\",\n    \"fiscal_year\"\
  : 2024,\n    \"document_id\": \"FSI-FIN-2024-Q3-001\",\n    \"classification\":\
  \ \"Internal Use Only\",\n    \"nasdaq_symbol\": \"FSTI\"\n  },\n  \"key_financial_highlights\"\
  : {\n    \"total_revenue\": {\n      \"value\": 487.3,\n      \"unit\": \"million\"\
  ,\n      \"yoy_change\": \"+23%\"\n    },\n    \"net_income\": {\n      \"value\"\
  : 89.2,\n      \"unit\": \"million\",\n      \"yoy_change\": \"+31%\"\n    },\n\
  \    \"operating_margin\": {\n      \"value\": 24.8,\n      \"unit\": \"percent\"\
  ,\n      \"comparison\": \"vs 21.4% in Q3 2023\"\n    }\n  }\n}\n```\n\n标准答案格式不仅捕获原始值，还捕获其关联的单位、百分比变化和上下文比较。这种细致的层级确保我们的基准测试衡量的是真正的语义理解能力，而非简单的文本提取。当我们评估一个工具是否正确提取了\
  \ `total_revenue` 时，我们验证它是否捕获了数值（`487.3`）、理解了单位（百万），并识别了同比变化的上下文（+23%）。\n\n我们的基准测试实现使用这些测试文件来自动评估每个工具的性能。`test_deepseek_parsing.py`\
  \ Python 脚本展示了我们如何提示 `DeepSeek-R1` 来提取这些结构化数据。以下是我们实际使用的提示词：\n\n```\nprompt = f\"\
  \"\"Analyze this financial report and extract ALL key information in structured\
  \ JSON format.\nThe document is a Q3 2024 financial report. Extract the following\
  \ with EXACT values from the document:\n1\\. **Document Metadata**: company_name,\
  \ report_type, quarter, year, report_date, document_id, nasdaq_symbol\n2\\. **Financial\
  \ Highlights**: total_revenue, net_income, operating_margin, cash_and_equivalents,\
  \ total_assets (with values and units)\n3\\. **Balance Sheet - Current Assets**\
  \ (Q3 2024, Q2 2024, Q3 2023):\n   - cash_and_cash_equivalents, short_term_investments,\
  \ accounts_receivable_net,\n     inventory, prepaid_expenses, total_current_assets\n\
  4\\. **Balance Sheet - Non-Current Assets** (Q3 2024):\n   - property_plant_equipment,\
  \ accumulated_depreciation, net_ppe, intangible_assets,\n     goodwill, long_term_investments,\
  \ total_non_current_assets\n...\nCRITICAL: Extract EXACT numerical values, preserve\
  \ decimals, include negative numbers\nwith minus sign. Return valid JSON only.\n\
  \"\"\"\n```\n\n这种提示词结构被证明是有效的，因为它精确指定了要提取的字段，要求结构化的 JSON 输出格式，并强调了数值精确性的重要性。`EXACT\
  \ values`（精确值）和 `preserve decimals`（保留小数）等短语帮助 `DeepSeek-R1` 理解，对于财务文档分析，近似值或四舍五入的数字是不足够的。\n\
  \n完整的测试文件，包括完整的财务报表、包含所有 150+字段的全面标准答案数据集、适用于所有三种工具（`DeepSeek-R1`、`Docling` 和 `MarkItDown`）的自动化基准测试脚本，以及评估框架文档，均可在我们的\
  \ GitHub 仓库中获取：[`github.com/PacktPublishing/DeepSeek-in-Practice/tree/main/Chapter04/document-understanding`](https://github.com/PacktPublishing/DeepSeek-in-Practice/tree/main/Chapter04/document-understanding)。您可以克隆该仓库，并使用提供的\
  \ `run_benchmark_comparison.py` 脚本来复现我们的基准测试结果。\n\n### 为财务文档提取而设计 DeepSeek 的提示词\n\
  \n财务文档提取所需的提示词设计策略与通用文档分析有根本性的不同。关键挑战在于，要在数百个数据点中实现数值精确性，同时保留数值、其单位、时间上下文和层级结构之间的复杂关系。当为财务文档提示\
  \ `DeepSeek-R1` 时，具体性变得至关重要：诸如 `提取收入数据` 这样的模糊请求会产生不完整的结果，而精确的指令，如 `提取 total_revenue\
  \ 及其数值、单位（百万/千）、货币和同比百分比变化`，则能引导模型进行全面提取，捕获所有相关属性。\n\n在我们的财务文档提示方法中，有三个设计原则被证明是必不可少的：\n\
  \n1.  首先，明确要求使用定义模式的结构化输出格式（JSON），而非接受自由格式的文本响应，因为结构化格式便于自动化验证和后续处理。\n\n\n## 2.\
  \ 提示词设计与评估\n\n其次，通过明确要求`EXACT values`（精确数值）、`preserve decimal places`（保留小数位）和`include\
  \ sign indicators for negative numbers and percentage changes`（对负数和百分比变化包含符号指示）来强调数值精度要求，因为财务分析容错率为零——4.873\
  \ 亿美元的收入数据与 4.87 亿美元或 4.8730 亿美元在报告精度上具有显著差异。\n\n第三，通过详尽列举所有需要提取的数据类别（文档元数据、财务亮点、资产负债表组成部分、利润表部分、地区分布、产品指标、关键绩效指标以及指导方针）来全面指定范围。财务文档包含众多部分，在提示中遗漏类别通常会导致这些部分在提取过程中被忽略。\n\
  \nDeepSeek-R1 的推理能力在提示词建立清晰验证标准时表现得尤为突出。我们的提示词不是简单地请求数据提取，而是包含了诸如`maintain quarter-to-quarter\
  \ associations in multi-column tables`（在多列表格中保持季度关联）和`preserve parent-child relationships\
  \ for revenue breakdowns`（保留收入分项的父子关系）等短语，这些激活了 DeepSeek 的上下文理解能力。这种方法利用了模型对文档结构进行推理的能力，而非将提取视为简单的模式匹配。以下提示词展示了将这些原则应用于我们的\
  \ FruitStand Innovation Inc.财务报告的实例：\n\n```\nAnalyze this Q3 2024 financial report\
  \ for FruitStand Innovation Inc.\nand extract ALL financial data in structured JSON\
  \ format.\nExtract the following with EXACT values:\n1\\. Document Metadata: company_name,\
  \ report_date, document_id, fiscal_year\n2\\. Financial Highlights: total_revenue,\
  \ net_income, operating_margin,\n   cash_equivalents, total_assets (with units and\
  \ YoY changes)\n3\\. Balance Sheet (Q3 2024, Q2 2024, Q3 2023):\n   - All current\
  \ assets line items\n   - All non-current assets line items\n   - All liabilities\
  \ and equity items\n4\\. Income Statement (all 3 quarters):\n   - Revenue breakdown\
  \ (product vs. service)\n   - All cost categories\n   - Operating metrics (margins,\
  \ EPS)\n5\\. Revenue by Geographic Region (all 4 regions with %, growth, margins)\n\
  6\\. Revenue by Product Line (all 4 products with %, growth, margins)\n7\\. All\
  \ 8 Key Performance Indicators with exact values\n8\\. Management team names and\
  \ titles\n9\\. Q4 2024 Guidance ranges\nCRITICAL: Extract EXACT numerical values,\
  \ preserve decimals,\ninclude negative numbers with minus sign. Return valid JSON\
  \ only.\n[Attached: 192-line financial report document]\n```\n\n现在，我们将探讨如何针对此案例评估\
  \ DeepSeek 的响应。\n\n### 响应评估\n\n为了客观地比较 DeepSeek-R1 与专用文档解析工具 Docling 和 MarkItDown\
  \ 的性能，我们建立了六项量化指标，用以衡量文档理解能力的不同方面。每项指标都经过精心设计，可通过与我们的基准真实数据集进行自动比较来客观衡量。以下各节将解释每项指标的含义、其对文档理解的重要性以及计算方法。\n\
  \n### 指标 1：字段提取准确性\n\n第一项指标衡量工具能否从文档文本中准确识别和提取语义字段-值对。在文档理解中，键值对代表离散的信息片段，其中一个描述性键（字段名）与一个特定值相关联。\n\
  \n以我们测试文档中的短语`Total Revenue: $487.3 million`为例。文档解析器必须识别`total_revenue`是语义字段名，`487.3`是数值，`million`代表单位，货币是美元。简单的文本提取只会捕获`$487.3\
  \ million`，而无法理解其与收入的语义关系。\n\n我们的测试文档包含从简单元数据到复杂嵌套财务指标的键值对。简单示例如公司名称（`FruitStand\
  \ Innovation Inc.`）和报告日期（`2024-09-30`），而复杂示例如多属性财务指标“总收入”，需要将数值（`487.3`）、单位（`million`）和同比变化背景（`+23%`）捕获为一个结构化对象。营业利润率是另一个复杂案例，其中数值（`24.8`）必须与其单位（`percent`）和比较基线（与\
  \ 2023 年第三季度的`21.4%`相比）相关联。这些复合值测试了工具是理解文档语义还是仅仅提取孤立的文本片段。\n\n为了计算字段提取准确性，我们实现了一个自动比较脚本，该脚本加载基准真实\
  \ JSON 数据，并逐字段将每个工具的输出与之对比。一个字段只有在键和值都符合我们严格标准时才被标记为正确：数值必须精确到小数点后一位（`487.3`，而非`487`或`487.30`）；字符串必须完全匹配，包括大小写（`FruitStand\
  \ Innovation Inc.`，而非`fruitstand innovation inc.`）；日期必须遵循 ISO 格式（`2024-09-30`）；复合值必须包含所有必需属性。\n\
  \n公式很简单：用正确提取的字段数除以预期总字段数（我们测试文档中为 150），再乘以 100。当 DeepSeek-R1 从 150 个字段中正确提取了 137\
  \ 个时，其准确率为 91.3%。\n\n### 指标 2：表格解析准确性\n\n表格解析准确性衡量工具能否在保留关键行列关系的同时，正确从表格数据中提取单个单元格的值。该指标尤其具有挑战性，因为它要求理解表格结构，而不仅仅是顺序阅读文本。我们合并资产负债表的多列布局展示了这种复杂性，它比较了三个季度的财务数据。以`Cash\
  \ and cash equivalents`（现金及现金等价物）这一行项目为例，它在横跨一行的四个不同值：`$234,678`对应`Q3 2024`，`$198,543`对应`Q2\
  \ 2024`，`$187,432`对应`Q3 2023`，以及计算出的变化值`+25.2%`。单元格级别的准确性要求所有四个值都以精确的数值精度提取，并与各自的时间段正确关联。\n\
  \n当我们考虑潜在的解析错误时，这一挑战变得显而易见。工具可能成功提取出`$234,678`的值，但错误地将其与`Q2 2024`而非`Q3 2024`关联。虽然数值提取成功了，但语义理解失败了，因为季度-值关系被错误识别。这种错误将导致提取的数据对财务分析毫无用处，即使表面上工具*找到*了正确的数字。我们的基准真实数据集通过不仅编码单元格值还编码其位置上下文来解决这个问题，要求工具证明它们理解表格结构，而不仅仅是扫描数字。\n\
  \n我们枚举了基准真实数据集中 6 个主要表格的所有 245 个单元格，通过表名、行标签和列标题对每个单元格进行标识。自动比较脚本检查每个提取的单元格是否与预期值和位置匹配。百分比值必须包含符号（`+23%`而非`23%`），货币值在存在时必须保留美元符号和逗号分隔符，计算字段如百分比变化必须完全匹配而不是重新计算。这种严格性确保我们衡量的是精确提取能力，而非近似理解。DeepSeek-R1\
  \ 在总共 245 个单元格中正确解析了 232 个，相当于 94.7%的表格解析准确性。\n\n### 指标 3：实体识别准确性\n\n\n命名实体识别用于衡量工具识别嵌入文档文本中的特定现实世界对象的能力。我们的财务报告包含\
  \ 42 个不同的命名实体，跨越多个类别，每个类别在文档理解中都有不同的用途。公司信息实体提供组织背景：公司名称（`FruitStand Innovation\
  \ Inc.`）、其纳斯达克股票代码（`FSTI`）以及唯一文档标识符（`FSI-FIN-2024-Q3-001`）都代表必须被正确识别和分类的不同实体。高管姓名代表另一个关键的实体类别，我们的测试文档提到了陈莎拉（首席执行官）、迈克尔·罗德里格斯（首席财务官）、珍妮弗·吴（首席技术官）和戴维·朴（首席运营官）。每个姓名都必须被识别为与其各自领导职位相关联的人名实体。\n\
  \n地理实体增加了另一层复杂性。我们的收入分析部分引用了四个不同的地区：`北美`、`EMEA`（`欧洲`、`中东`和`非洲`）、`APAC`（`亚太地区`）和`拉丁美洲`。这些不仅仅是地名，而是构建我们收入分解的语义类别。同样，我们的四条产品线——`云平台`、`移动解决方案`、`企业服务`和`开发者工具`——代表组织财务绩效指标的产品实体。时间实体通过特定日期完善了我们的实体目录，例如`2024\
  \ 年 9 月 30 日`作为报告日期，以及季度标识符（`2024 年第三季度`、`2024 年第四季度`）确立了报告和预测的时间范围。\n\n实体识别准确率是通过检查工具提取的输出中是否出现了\
  \ 42 个预期实体中的每一个，并且具有正确的拼写、适当的上下文和正确的实体分类来计算的。一个提取了`陈莎拉`但未能将其识别为人名，或者识别出`北美`但不理解其为地理区域的工具，将无法通过我们的实体识别要求。DeepSeek-R1\
  \ 在此指标上取得了完美表现，正确识别了 42 个中的全部 42 个实体，实体识别准确率达到 100%。\n\n### 指标 4：结构保存评分\n结构保存评估工具在提取过程中保持文档逻辑组织、层级关系和阅读顺序的能力。这一指标很重要，因为财务文档的意义不仅通过内容传达，也通过结构传达。想想我们的财务报告遵循的传统顺序：执行摘要呈现关键要点，随后是详细的资产负债表，接着是带有分部明细的利润表，最后是前瞻性指引。这种排序并非随意，而是反映了从历史结果到未来预测的详细程度递增和时间递进。\n\
  \n层级关系在整个文档中承载着语义分量。当我们的报告将`按地区划分的收入`作为章节标题，随后是四个小节（`北美`、`EMEA`、`APAC`和`拉丁美洲`）时，这种结构传达了这四个地区是一个完整地理分析的组成部分。一个提取了这些地区名称但丢失了父子关系的工具会忽略这种组织逻辑。同样，视觉格式提供了关键线索：粗体文本通常表示总计或章节标题，缩进的行项目表示支持粗体总计的详细分解，而`总收入`条目以粗体显示，其下缩进显示`产品收入`和`服务收入`，则标志着一种有助于理解的求和-明细关系。\n\
  \n我们使用 0-100 分制的混合定量定性方法来评估结构保存。这可以涵盖以下方面：\n*   章节排序贡献 25 分（提取是否保持了执行摘要→资产负债表→利润表→分析的序列？）\n\
  *   表格结构完整性占 30 分（行列关系和表头关联是否得到保留？）\n*   标题数据关联提供 25 分（章节标题是否正确链接到其内容？），层级嵌套级别构成最后的\
  \ 20 分（父子关系和缩进模式是否得到保持？）\n\n这种评分结合了自动检查（例如验证表格列数和章节排序）和人工评估提取输出是否保持逻辑组织和可用性。\n\n\
  ### 指标 5：处理时间\n对于处理成千上万文档的生产系统，处理速度变得至关重要。我们通过记录提交文档之前和接收完整输出之后立即的时间戳来测量端到端处理时间。对于像\
  \ DeepSeek-R1 这样的基于 API 的工具，我们使用 Python 的`time.time()`函数来捕捉这些边界，测量总耗时，包括网络延迟、服务器排队时间、模型推理和响应格式化。这种现实世界的计时反映了生产系统将经历的情况。DeepSeek-R1\
  \ 处理我们 192 行的财务文档耗时 4,250 毫秒（4.25 秒），对于用户可以等待几秒钟获取结果的交互式应用来说足够快，但对于需要每小时处理数千文档的批处理系统来说可能存在挑战。\n\
  \n### 指标 6：单文档成本\n经济可行性决定了文档理解解决方案能否扩展到生产规模。对于 DeepSeek-R1，我们通过跟踪令牌消耗并应用公布的 API\
  \ 定价来计算单文档成本。我们的测试文档总共需要 12,847 个令牌（输入和输出合计），按 DeepSeek 的定价（输入令牌每百万 0.14 美元，输出令牌每百万\
  \ 0.28 美元），相当于每份文档约 0.0027 美元。按此费率，处理 10,000 份文档将花费 27 美元，这对于大多数商业应用来说是经济可行的。像 Docling\
  \ 和 MarkItDown 这样的开源工具直接 API 成本为 0.00 美元，尽管自托管会引入基础设施费用（计算资源、维护和更新），我们在这次基准测试中并未量化这些费用。\n\
  \n### 测试数据分析\n定义了我们的评估指标和提示策略后，我们现在可以查看 DeepSeek-R1 在处理我们的实际测试文档时的表现。我们为 FruitStand\
  \ Innovation Inc.准备的 192 行财务报告是我们基准比较中所有三个工具的输入。文档以执行摘要信息开始，测试实体识别和简单字段提取，然后逐步展开越来越复杂的表格结构，挑战解析器的能力。以下是测试文档的开头：\n\
  \n```\n### FRUITSTAND INNOVATION INC.\n### Quarterly Financial Report Q3 2024\n\
  **Report Date:** September 30, 2024 \n**Fiscal Year:** 2024 \n**Document ID:** FSI-FIN-2024-Q3-001\
  \ \n**Classification:** Internal Use Only \n---\n### Executive Summary\nFruitStand\
  \ Innovation Inc. (NASDAQ: FSTI) reports strong financial performance for Q3 2024,\n\
  with revenue growth of 23% year-over-year and operating margin expansion of 340\
  \ basis points.\n**Key Financial Highlights:**\n- Total Revenue: $487.3 million\
  \ (up 23% YoY)\n- Net Income: $89.2 million (up 31% YoY)\n- Operating Margin: 24.8%\
  \ (vs 21.4% in Q3 2023)\n- Cash and Equivalents: $234.7 million\n- Total Assets:\
  \ $1,247.8 million\n```\n\n\n### 概述\n\n本开篇部分测试工具能否从标题中提取结构化元数据（公司名称、文件编号和纳斯达克代码），同时从要点摘要部分捕获关键财务指标。这些指标以半结构化格式呈现，混合了绝对数值（4.873\
  \ 亿美元）、百分比变化（同比增长 23%）以及比较背景（相较于 2023 年第三季度的 21.4%），要求工具能够解析复合信息，而非孤立的数字。\n\n该文档的主要难点在于其合并资产负债表，它呈现了一个同时比较三个时期、多列结构的表格。每个财务科目行跨越四个数据列及描述性文本，要求解析器必须精确维护数值与其时间背景之间的关联：\n\
  \n```\n### 合并资产负债表\n#### 截至 2024 年 9 月 30 日\n**(单位：千美元，股份数据除外)**\n| **资产** | **2024\
  \ 年第三季度** | **2024 年第二季度** | **2023 年第三季度** | **变化 (%)** |\n|-----------|-------------|-------------|-------------|----------------|\n\
  | **流动资产** | | | | |\n| 现金及现金等价物 | $234,678 | $198,543 | $187,432 | +25.2% |\n|\
  \ 短期投资 | $89,234 | $76,890 | $45,678 | +95.3% |\n| 应收账款（净额） | $142,567 | $134,289\
  \ | $118,945 | +19.9% |\n| 存货 | $67,890 | $72,345 | $81,234 | -16.4% |\n| 预付费用 |\
  \ $23,456 | $21,234 | $19,876 | +18.0% |\n| **流动资产合计** | **$557,825** | **$503,301**\
  \ | **$453,165** | **+23.1%** |\n```\n\n此表格结构揭示了若干解析复杂性。`流动资产`标题行中的空白单元格必须被识别为结构性元素，而非缺失数据。粗体格式用于区分科目标题和合计行与明细行，要求工具保留格式语义。负值存货（通过逐季递减的数字体现）考验着符号处理能力，而最右侧列的百分比变化则要求提取幅度和方向指示符（`+`/`-`号）。文档稍后的累计折旧行显示为`($123,456)`（括号表示），这是会计惯例中表示负值的方式，解析器必须正确解读，而非仅将括号视为格式符号。\n\
  \n利润表部分通过涉及多个季度、基于百分比的嵌套计算引入了额外的复杂性：\n\n```\n### 合并利润表\n#### 截至 2024 年 9 月 30 日的三个月\n\
  **(单位：千美元，每股数据除外)**\n| **收入** | **2024 年第三季度** | **2024 年第二季度** | **2023 年第三季度**\
  \ | **变化 (%)** |\n|------------|-------------|-------------|-------------|----------------|\n\
  | 产品收入 | $312,456 | $287,654 | $245,678 | +27.2% |\n| 服务收入 | $174,892 | $168,543\
  \ | $150,234 | +16.4% |\n| **总收入** | **$487,348** | **$456,197** | **$395,912**\
  \ | **+23.1%** |\n| | | | | |\n| **营业成本** | | | | |\n| 产品收入成本 | $143,567 | $139,876\
  \ | $128,945 | +11.3% |\n| 服务收入成本 | $76,543 | $74,321 | $70,234 | +9.0% |\n| **营业成本合计**\
  \ | **$220,110** | **$214,197** | **$199,179** | **+10.5%** |\n| | | | | |\n| **毛利**\
  \ | **$267,238** | **$242,000** | **$196,733** | **+35.8%** |\n| **毛利率** | **54.8%**\
  \ | **53.0%** | **49.7%** | **+5.1 pts** |\n```\n\n请注意本部分如何在绝对美元金额和基于百分比的指标之间交替。例如，`毛利率`字段要求解析器在同一个表格结构中处理不同的数据类型。表示利润率改善的`+5.1\
  \ pts`标注使用了一个领域特定的缩写（`pts`代表基点），语义解析器必须正确理解。\n\n### 计算最终得分\n\n总绩效分数使用加权平均法结合所有六个指标，该加权平均法反映了它们在生产环境文档理解系统中的相对重要性。我们根据实际部署中的关键因素分配了权重：字段提取准确性作为文档解析的主要目标，权重为\
  \ 35%；考虑到商业文档中表格数据的普遍性，表格解析准确性权重为 30%；实体识别权重为 15%，因为实体代表了关键的文档对象；结构保留权重为 10%，以保持文档组织性；而处理时间和成本各占\
  \ 5%，作为实际约束而非主要目标。\n\n该公式将每个指标分数乘以其权重并求和：\n\n让我们具体分解如下：\n\n*   字段提取贡献了 31.96 分。\n\
  *   表格解析增加了 28.41 分。\n*   完美的实体识别提供了 15.00 分。\n*   结构保留贡献了 8.50 分。\n*   处理时间增加了\
  \ 4.50 分。\n*   成本效率提供了 4.75 分。\n\n总计得到 93.12 分，我们将其四舍五入为 93/100。\n\n我们设立了绩效层级来解读这些分数。95\
  \ 至 100 分表示卓越性能，适合需要最少人工验证的生产部署，代表着能够持续提供准确结果、仅需抽查的工具。85 至 94 分表示良好性能，适合具有针对性验证工作流程的生产环境，其中自动化提取处理大部分工作，但关键字段需经过验证。75\
  \ 至 84 分代表可接受性能，需要大量验证和质量保证，适用于人工审核仍然广泛存在的半自动化工作流程。低于 75 分表示性能较差，在有显著改进之前不适合生产部署，通常需要更多开发才能投入实际使用。\n\
  \n## 基准测试比较：从文档到准确度分数\n\n我们的基准测试系统通过在 `run_benchmark_comparison.py` 中实现的四阶段自动化流水线来评估每个工具。\n\
  \n让我们详细描述这一流水线：\n\n1.  过程首先按顺序运行每个工具的测试脚本（`test_deepseek_parsing.py`、`test_docling_parsing.py`\
  \ 和 `test_markitdown_parsing.py`），捕获其输出并测量处理时间。\n2.  每个工具接收完全相同的输入文档，并必须生成代表提取信息的结构化输出。\n\
  3.  对于 DeepSeek-R1，我们测量从向 DeepSeek API 提交 HTTP 请求到接收到完整 JSON 响应的端到端处理时间。\n4.  API\
  \ 调用将完整文档文本作为输入连同我们的提取提示一并发送，DeepSeek-R1 返回包含所有已识别字段的结构化 JSON。\n5.  我们将此输出保存到 `deepseek_test_results.json`\
  \ 以供后续准确性分析。处理时间测量使用 Python 的 `time.time()` 函数捕获 API 调用前后的高精度时间戳，以获得生产应用程序将经历的真实延迟。\n\
  6.  一旦所有三个工具完成其提取，我们的比较脚本从 `ground_truth_data.json` 加载基准数据集，并逐字段进行验证。比较算法遍历基准数据集中定义的每个字段，检查每个工具的输出是否包含该字段且值正确。对于简单字段（如公司名称或报告日期），我们验证精确的字符串匹配。对于数字字段，我们在适当的精度容差范围内比较数值。对于复合字段（如\
  \ `total_revenue`，包含数值、单位和同比变化），我们验证所有属性是否符合预期结构。\n\n此自动比较为字段提取、表格解析（逐单元格比较）和实体识别（检查所有\
  \ 42 个预期实体是否正确出现）生成准确度百分比。\n\n基准测试脚本随后将结果编译成对比表格，展示各工具在所有指标上的并行性能。这些表格不仅显示了准确率百分比，还包括处理时间、token\
  \ 使用量（针对基于 API 的工具）和单文档成本，为每个工具的生产就绪性提供了全面视图。整个基准测试过程通过`python run_benchmark_comparison.py`命令自动运行，方便希望验证我们的结果或使用不同文档进行测试的读者复现。\n\
  \nDeepSeek-R1 成功提取了财务数据，其输出结构如下：\n\n```\n{\n  \"document_metadata\": {\n    \"company_name\"\
  : \"FruitStand Innovation Inc.\",\n    \"report_date\": \"2024-09-30\",\n    \"\
  document_id\": \"FSI-FIN-2024-Q3-001\",\n    \"nasdaq_symbol\": \"FSTI\"\n  },\n\
  \  \"key_financial_highlights\": {\n    \"total_revenue\": {\"value\": 487.3, \"\
  unit\": \"million\", \"yoy_change\": \"+23%\"},\n    \"net_income\": {\"value\"\
  : 89.2, \"unit\": \"million\", \"yoy_change\": \"+31%\"},\n    \"operating_margin\"\
  : {\"value\": 24.8, \"unit\": \"percent\"}\n  },\n  \"balance_sheet_current_assets_q3_2024\"\
  : {\n    \"cash_and_cash_equivalents\": 234678,\n    \"short_term_investments\"\
  : 89234,\n    \"accounts_receivable_net\": 142567,\n    \"inventory\": 67890,\n\
  \    \"prepaid_expenses\": 23456,\n    \"total_current_assets\": 557825\n  },\n\
  \  // ... [另外 145 个字段被正确提取]\n}\n```\n\n以下是 DeepSeek-R1 响应的量化结果：\n\n| `指标` | `结果`\
  \ | `评估` |\n| :--- | :--- | :--- |\n| 字段提取准确率 | 91.3% | 优秀 |\n| 正确字段 | 137/150 |\
  \ 成功率高，有少量遗漏 |\n| 表格解析准确率 | 94.7% | 优秀 |\n| 正确表格单元格 | 232/245 | 单元格提取近乎完美 |\n| 实体识别\
  \ | 100% | 完美 |\n| 已识别实体 | 42/42 | 实体捕获完整 |\n| 处理时间 | 4,250 毫秒 | 快速 |\n| Token 使用量\
  \ | 12,847 tokens | 消耗适中 |\n| 单文档成本 | $0.0027 | 非常低 |\n| 总分 | 92/100 | 优秀 |\n\n\
  表 4.5：DeepSeek-R1 在金融文档理解方面的量化结果\n\n以下是我们对 DeepSeek-R1 性能的分析。\n\nDeepSeek-R1 在整个文档提取过程中对金融术语展现了出色的语义理解能力。具体结果如下：\n\
  \n*   在遇到执行摘要的关键财务亮点时，模型正确理解了诸如 `operating margin expansion of 340 basis points`\
  \ 这样的复杂短语，并准确提取了数值 `24.8%` 及其比较背景（与 2023 年第三季度的 21.4%相比）。\n\n*   模型成功区分了利润表中的不同收入类型，将$312,456\
  \ 准确分类为产品收入，$174,892 分类为服务收入，并在多列结构中正确维持了它们的季度关联。\n\n*   该工具对嵌套表格结构的处理被证明特别强大。在合并资产负债表中，DeepSeek-R1\
  \ 正确解析了 `Total Current Assets` `($557,825)` 及其组成部分之间的层次关系，理解现金及现金等价物 `($234,678)`、短期投资\
  \ `($89,234)`、应收账款 `($142,567)`、存货 `($67,890)` 和预付费用 `($23,456)` 之和构成了总额。\n\n* \
  \  模型还成功处理了利润表中的嵌套计算，认识到毛利润 `($267,238)` 等于总收入 (`$487,348`) 减去总销售成本 ($220,110)，这表明其理解的是会计关系，而不仅仅是提取孤立的数字。\n\
  \n*   实体识别在整个文档的所有 42 个命名实体上都达到了完美的准确率。DeepSeek-R1 正确识别了高管姓名，包括 `Sarah Chen (Chief\
  \ Executive Officer)`、`Michael Rodriguez (Chief Financial Officer)`、`Jennifer Wu\
  \ (Chief Technology Officer)` 和 `David Park (Chief Operating Officer)`，并恰当地将每个姓名与其对应职务关联。地理实体被准确提取并保留了完整名称：`North\
  \ America`、`EMEA`（被明确识别为欧洲、中东和非洲，而非作为未定义的首字母缩写处理）、`APAC`（亚太地区）和 `Latin America`。产品线实体\
  \ – `Cloud Platform`、`Mobile Solutions`、`Enterprise Services` 和 `Developer Tools`\
  \ – 被正确识别并与其各自的收入数字和绩效指标相关联。\n\n然而，DeepSeek-R1 遇到了 13 个提取错误，主要出现在深度嵌套的多季度对比单元格中：\n\
  \n*   八个错误发生在资产负债表的季度对比列中，这些单元格包含多个相关值。例如，在 `Accounts Payable` 行中，模型正确提取了 2024 年第三季度的值\
  \ ($87,654) 和同比百分比变化 (+14.5%)，但错误地关联了 2024 年第二季度的值，将$82,345 放入了 2023 年第三季度列，而非正确的\
  \ 2024 年第二季度位置。\n\n*   三个格式歧义错误涉及遵循会计惯例的数字：以括号显示的累计折旧值 `($123,456)` 初始提取时未包含负号，这需要模型推断出\
  \ `Liabilities` 部分中的括号值代表负数。\n\n*   两个错误涉及缩写展开，其中表头中的 `PP&E (Property, Plant & Equipment)`\
  \ 被提取为缩写形式，而非基准数据集所期望的展开术语。\n\n尽管存在这些小错误，DeepSeek-R1 在整个文档中表现出对百分比计算和货币格式的出色处理能力。模型在百分比变化中正确保留了正负号（现金增长为\
  \ `+25.2%`，而存货下降为 `-16.4%`），保持了财务数字的小数精度（`$234,678` 未被四舍五入为 `$234,700`），并正确理解了毛利率基点变化的\
  \ `+5.1 pts` 表示法。货币符号和逗号分隔符在提取输出中始终得以保留，显示了其对维护金融数据完整性至关重要的格式细节的关注。\n\n### 理解 DeepSeek-R1\
  \ 的提取错误\n\n在将 DeepSeek-R1 与其他工具进行比较之前，我们应该审视其遇到的具体错误，以了解其局限性。这 13 个提取错误可分为 3 个不同的类别，每个类别揭示了文档理解挑战的不同方面。八个错误发生在嵌套单元格混淆场景中，多季度对比表格呈现了模糊的单元格边界。在合并资产负债表的\
  \ `Accounts Payable` 行中，DeepSeek-R1 正确提取了 `Q3 2024` 的值 `($87,654)` 和同比变化 `(+14.5%)`，但错误关联了\
  \ `Q2 2024` 的值，将 `$82,345` 放入了 `Q3 2023` 列，而非其正确的 `Q2 2024` 位置。这类错误表明，当多个时间段出现在相邻单元格中时，模型有时难以维持精确的列关联，尤其是在百分比变化计算增加了额外认知复杂度的情况下。\n\
  \n### 格式错误分析与工具对比\n\n#### 格式歧义错误\n\n三个格式歧义错误涉及需要领域知识才能正确理解的会计惯例数字。累计折旧项目显示为`($123,456)`，其值被括号包围，遵循标准会计惯例，其中括号表示负金额。DeepSeek-R1\
  \ 最初将此值提取为正数`123,456`，忽略了括号表示法的语义含义。虽然模型最终识别出这些是负债并从上下文中推断出负值，但最初的提取表明，隐式格式化约定甚至可能挑战复杂的语言模型。同样，在遇到累计其他综合亏损值`($7,520)`时，模型正确解释了负号，但在最初的提取中经历了小数点位置的不确定性。\n\
  \n#### 缩写展开错误\n\n两个缩写展开错误揭示了技术术语识别的挑战。资产负债表中的表头使用`PP&E`作为`Property, Plant & Equipment`的缩写，这是财务报告中的标准缩写。DeepSeek-R1\
  \ 逐字提取了`PP&E`，而不是将其扩展为我们基准数据集所期望的全称。虽然缩写形式包含相同的语义含义，但与基准数据集进行比较的自动验证系统需要精确的字符串匹配，这凸显了领域特定缩写如何在功能正确的提取结果与根据严格验证标准技术上*不正确*的结果之间造成差异。这表明，针对财务文档的提示可能受益于包含常见缩写词典或明确要求使用扩展术语。\n\
  \n### 工具对比\n\n为了提供全面的背景并了解`DeepSeek-R1`的性能与专用文档解析工具的对比情况，我们使用了两种替代方法测试了相同的财务文档：`Docling`，一个专注于文档结构分析和表格识别的\
  \ IBM Research 工具包，以及`MarkItDown`，一个微软设计用于为 LLM 优化文档预处理的工具。每个工具都使用相同的测试文档和基准数据集进行评估，并根据我们先前定义的六个定量指标进行衡量：字段提取准确性、表格解析准确性、实体识别准确性、结构保留分数、处理时间和每文档成本。\n\
  \n#### 测试 `Docling` 和 `MarkItDown`\n\n`Docling`的操作方式与`DeepSeek-R1`有根本不同，它专注于文档结构提取而非语义理解。我们使用`pip\
  \ install docling`安装了`Docling`，并创建了一个 Python 脚本（`test_docling_parsing.py`）来处理我们的财务报表\
  \ Markdown 文件。基本使用模式包括加载文档、运行`Docling`解析器并提取表格结构：\n\n```python\nfrom docling import\
  \ DocumentConverter\nconverter = DocumentConverter()\nresult = converter.convert(\"\
  test_financial_statement.md\")\n#### 提取表格\ntables = result.document.tables\nfor\
  \ table in tables:\n    print(f\"Table: {table.num_rows} rows x {table.num_cols}\
  \ columns\")\n    # 处理表格单元格...\n```\n\n`Docling`在识别表格边界、保留行列关系和维护文档结构方面表现出色，但产生的是结构化表示，而非语义字段提取。对于我们的财务文档，`Docling`正确识别了所有\
  \ 6 个表格，并保留了 97.2%的单元格结构（245 个单元格中的 238 个），在表格解析准确性上优于`DeepSeek-R1`。然而，`Docling`无法直接提取诸如`total_revenue`等带有相关单位和同比变化的语义字段，这就是为什么我们在其字段提取准确性上显示`N/A`。从`Docling`的输出中获取语义信息需要额外的\
  \ LLM 处理。\n\n`MarkItDown`遵循类似的理念，为 LLM 消费优化文档预处理。安装需要`pip install markitdown`，该工具将各种文档格式转换为适合\
  \ LLM 输入的干净 Markdown：\n\n```python\nfrom markitdown import MarkItDown\nconverter\
  \ = MarkItDown()\nmarkdown_output = converter.convert(\"test_financial_statement.md\"\
  )\nprint(markdown_output.text)\n```\n\n`MarkItDown`仅用 890 毫秒处理了我们的文档，明显快于`DeepSeek-R1`（4,250\
  \ 毫秒）和`Docling`（2,100 毫秒），但只达到了 78.5%的表格解析准确性。该工具优先考虑处理速度和 Markdown 的整洁性，而非完美的结构保留，使其适用于可接受一些结构歧义的文档。与`Docling`一样，`MarkItDown`需要后续的\
  \ LLM 处理来进行语义字段提取。\n\n`Docling`和`MarkItDown`的完整使用示例、配置细节和输出样本都记录在我们的 GitHub 仓库中：[完整的使用示例、配置细节和输出样本都记录在我们的\
  \ GitHub 仓库中](https://github.com/PacktPublishing/DeepSeek-in-Practice/tree/main/Chapter04/document-understanding)。仓库包含`docling_usage_guide.md`（分步说明）、`markitdown_usage_guide.md`（实现示例）以及`tool_comparison_results.md`（显示所有三个工具的完整输出以进行直接比较）。\n\
  \n#### 计算基准指标\n\n我们的基准比较需要对所有三个工具的字段准确性、表格准确性、处理时间和成本进行客观测量。字段提取准确性是通过将每个工具对测试文档运行、捕获其输出，并使用自动化\
  \ Python 脚本将提取的字段与我们的基准数据集进行比较来计算的。对于`ground_truth_data.json`中定义的 150 个字段中的每一个，我们检查工具的输出是否包含该字段及其正确的值，同时考虑数值精度、字符串大小写敏感性和日期格式。`DeepSeek-R1`正确提取的\
  \ 137 个字段除以预期的 150 个总字段，得出 91.3%的准确性。`Docling`和`MarkItDown`在字段提取上获得了`N/A`评级，因为它们的结构化输出在没有额外\
  \ LLM 处理的情况下不会直接产生语义字段提取。\n\n表格解析准确性测量需要将提取的表格数据与我们 6 个主要表格中 245 个预期单元格进行逐单元格比较。我们通过基准数据中的表名、行索引和列索引来标识每个单元格，然后验证工具是否正确提取了该单元格的值，并具有正确的格式和位置关联。`Docling`通过其专门的表格结构识别算法达到了\
  \ 97.2%的准确性（245 个单元格中的 238 个正确）。`DeepSeek-R1`使用语义理解达到了 94.7%的准确性（245 个单元格中的 232\
  \ 个正确），而`MarkItDown`的轻量级预处理达到了 78.5%的准确性（245 个单元格中的 192 个正确）。单元格级别的比较表明，像`Docling`这样的专用表格解析器在结构识别方面表现出色，即使它们缺乏语义理解。\n\
  \n处理时间测量使用 Python 的`time.time()`函数，在将文档提交给每个工具之前和接收到完整输出之后记录高精度时间戳。对于`DeepSeek-R1`，我们测量了端到端的\
  \ API 延迟，包括网络传输、服务器队列时间、模型推理和响应格式化，对于我们的 192 行文档，结果为 4,250 毫秒。`Docling`在标准开发机器（MacBook\
  \ Pro M1）上本地处理相同文档耗时 2,100 毫秒，而`MarkItDown`仅用 890 毫秒就完成了处理。这些测量反映了生产系统在实际中会遇到的性能，尽管实际时间会因网络条件、服务器负载和硬件规格而异。\n\
  \n\n基于 API 的工具与本地工具在单文档成本计算上存在显著差异。DeepSeek-R1 的成本源于 token 消耗量乘以 API 定价：我们的测试文档总计消耗了\
  \ 12,847 个 token（输入加输出），按每百万输入 token $0.14 和每百万输出 token $0.28 计算，约合每文档$0.0027。按此费率，处理一百万份文档的成本为$2,700。Docling\
  \ 和 MarkItDown 作为开源本地工具，不产生直接的 API 费用。然而，本地部署会引入基础设施开销，包括服务器硬件、维护、更新和运维成本，我们在本次基准测试中未对这些进行量化。组织在选择云端解决方案还是自托管方案时，必须权衡直接的\
  \ API 成本与基础设施投资。\n\n#### 六项指标的量化比较\n\n下表呈现了针对三项工具在我们之前定义的六项量化指标上的完整基准测试结果：字段提取准确率、表格解析准确率、实体识别准确率、结构保留评分、处理时间和单文档成本：\n\
  \n| 指标 | DeepSeek-R1 | Docling | MarkItDown |\n| --- | --- | --- | --- |\n| 字段提取准确率\
  \ | 91.3% (137/150) | N/A* | N/A* |\n| 表格解析准确率 | 94.7% (232/245) | 97.2% (238/245)\
  \ | 78.5% (192/245) |\n| 实体识别准确率 | 100% (42/42) | N/A* | N/A* |\n| 结构保留评分 | 88/100\
  \ | 95/100 | 72/100 |\n| 处理时间 | 4,250 毫秒 | 2,100 毫秒 | 890 毫秒 |\n| 单文档成本 | $0.0027\
  \ | $0.00 | $0.00 |\n\n表 4.6：整体性能比较\n\n*Docling 和 MarkItDown 专注于结构提取，需要额外的 LLM 处理才能完成语义字段提取。\n\
  \n#### 结果解读\n\n每个工具都展现出与其设计理念相符的显著优势。DeepSeek-R1 实现了最高的字段提取准确率（91.3%），成功从文档中直接识别了\
  \ 150 个语义字段中的 137 个，例如 `quarterly_revenue`、`operating_margin_expansion` 和 `year_over_year_revenue_growth`。这种语义提取能力是其区别于结构化解析器的关键。该模型完美的实体识别得分（42/42\
  \ 实体）证明了其在高管、地理区域和产品线等方面具有强大的命名实体识别能力。然而，DeepSeek-R1 的表格解析准确率（94.7%）略低于 Docling\
  \ 行业领先的 97.2%，这表明对于纯结构提取任务，专用的表格识别算法仍然优于通用的语言模型。\n\nDocling 取得了最高的表格解析准确率和结构保留评分，这反映了其专为文档布局分析而设计的特点。该工具正确识别了\
  \ 245 个表格单元格中的 238 个，并保持了精确的行列关联，比 DeepSeek-R1 高出 2.5 个百分点。其 95/100 的结构保留评分表明它在维护层级关系、嵌套表格结构和文档阅读顺序方面接近完美。Docling\
  \ 更快的处理时间（2,100 毫秒 对比 DeepSeek-R1 的 4,250 毫秒）和零 API 成本使其在大批量批处理场景中极具吸引力。其在字段提取和实体识别方面标注为\
  \ `N/A`，这反映的是架构选择而非局限性：Docling 提供的是结构化表示，需要下游 LLM 处理才能提取语义含义。\n\nMarkItDown 优先考虑速度和简洁性，而非全面的准确性，仅用\
  \ 890 毫秒就完成了文档处理——不到 DeepSeek-R1 处理时间的五分之一。这种性能是以牺牲表格解析准确率（78.5%）和结构保留能力（72/100）为代价的，因为该工具有时会简化复杂的嵌套表格或合并单元格以生成更整洁的\
  \ Markdown 输出。在完美结构保真度不如为 LLM 消费进行快速预处理那么重要的使用场景中，MarkItDown 的轻量级方法提供了实用优势。与 Docling\
  \ 一样，它也需要后续的 LLM 处理来进行语义提取。\n\n#### 理解工具能力\n\n除了量化指标，每个工具都拥有影响其在不同文档理解场景中适用性的专用能力。直接字段提取能力指的是工具在无需额外处理步骤的情况下识别和提取语义字段（如\
  \ `total_revenue`、`ceo_name` 或 `quarterly_growth_rate`）的能力。DeepSeek-R1 通过自然语言理解出色地实现了这一点，而\
  \ Docling 和 MarkItDown 则生成需要 LLM 解释的中间结构表示。\n\n表格结构识别衡量工具识别表格边界、保持行列关系、处理合并单元格以及在复杂表格中维护层级嵌套结构的能力。Docling\
  \ 通过专门针对表格检测训练的计算机视觉和布局分析算法在此方面表现出色。DeepSeek-R1 即使视觉结构不明确也能理解表格语义，展现了非常好的性能，而 MarkItDown\
  \ 则提供了适用于较简单表格的中等能力。\n\nOCR 集成能力决定了工具能否处理扫描文档或包含文本的图像。Docling 集成了 OCR 引擎，可以处理由扫描图像创建的\
  \ PDF 文件，这对于旧文档数字化项目至关重要。DeepSeek-R1 和 MarkItDown 均不包含原生 OCR 功能，需要预处理过的基于文本的输入。语义推理能力衡量工具理解提取信息的含义、上下文和关系的能力。DeepSeek-R1\
  \ 展现出出色的语义推理能力，它能够识别出 “operating margin expansion of 340 basis points” 意味着当前的 24.8%利润率是从之前的\
  \ 21.4%增长而来。Docling 和 MarkItDown 缺乏此能力，它们更专注于结构提取。\n\n成本效率考量不仅涉及直接的 API 定价，还包括基础设施、维护和运维开销。DeepSeek-R1\
  \ 每文档$0.0027 的 API 成本意味着处理一百万份文档需花费$2,700，无需基础设施投资但需持续支付使用费。Docling 和 MarkItDown\
  \ 消除了 API 成本，但自托管部署需要服务器基础设施、软件更新、依赖管理以及相关技术专业知识。相应的设置复杂度也不同：DeepSeek-R1 仅需 API\
  \ 凭证和简单的 HTTP 请求；MarkItDown 可通过 `pip` 安装，配置极少；而 Docling 要获得最佳性能则涉及更复杂的依赖管理和配置。\n\
  \n#### 为你的用例选择合适的工具\n\n我们的基准测试结果表明，不同的文档理解场景需要根据具体要求和约束条件选择不同的工具。当分析财务报表或商业文档，且主要目标是语义提取特定字段时，DeepSeek-R1\
  \ 提供了获取可操作数据最直接的路径。其 91.3%的字段提取准确率和完美的实体识别能力使得生产部署可通过验证工作流来捕获剩余的 8.7%错误。那些需要即时基于\
  \ API 部署且无需基础设施投资的组织，会发现 DeepSeek-R1 简单的集成方式和按使用量付费的定价模式在中等文档量下颇具吸引力。\n\n\n\n对于涉及复杂视觉布局的\
  \ PDF 文档场景，将 Docling 的结构提取与 DeepSeek-R1 的语义理解相结合的混合方法能实现最佳效果。Docling 预先处理 PDF 以提取表格结构，准确率达\
  \ 97.2%，随后`DeepSeek-R1`解析这些结构以提取语义字段。该流程充分利用了每种工具的核心优势：`Docling`专业的版面分析能力和`DeepSeek-R1`的语言理解能力。这种组合方案每文档成本仅\
  \ 0.0027 美元（仅`DeepSeek-R1`的 API 费用），同时整体准确度优于任何单一工具。\n\n处理扫描文档或含文字图像需要 OCR 能力，在我们的基准测试中仅有`Docling`提供此功能。传统文档数字化项目、历史财务记录分析，或任何涉及实体文档转图像的场景都需要`Docling`的\
  \ OCR 集成。典型工作流程是：`Docling`执行 OCR 和结构提取，然后将生成的文本送入`DeepSeek-R1`进行语义分析。在要求亚秒级响应延迟的实时\
  \ API 集成场景中，`MarkItDown`的 890 毫秒初始预处理时间可能更具优势，但`DeepSeek-R1`的 4.25 秒端到端延迟对大多数交互式应用仍然可接受。\n\
  \n大规模文档批量处理（百万级文档）需进行细致的成本效益分析。`Docling`零 API 成本在大规模应用中具有经济吸引力，但机构必须考虑预估为每年 50,000-200,000\
  \ 美元的基础设施投资（包括服务器、存储、网络和运维人员）。按每月处理百万文档计算，`DeepSeek-R1`月成本为 2,700 美元（年成本 32,400\
  \ 美元），显著低于自建基础设施成本——除非文档量达到约 500-1000 万份/月（具体取决于基础设施效率）。多语言文档可借助`DeepSeek-R1`强大的多语言处理能力，无需特定语言配置即可准确处理英语、西班牙语、普通话、法语、德语等语言的财务报告。\n\
  \n### 混合方案：最佳实践\n\n基于我们的全面基准测试结果，处理复杂财务文档的最优方案是整合多种工具的互补优势，而非依赖单一解决方案。通过构建融合结构提取与语义理解的混合流程，机构可实现更高准确度、更低成本和更大灵活性。\n\
  \n#### 推荐的工作流架构\n\n理想的工作流程始于对任何 PDF 或 DOCX 格式输入的文档预处理。在此初始阶段，我们推荐使用`Docling`进行结构提取，因为其专业算法擅长识别表格边界、保持行列关系，并在复杂多栏布局中维持正确的阅读顺序。处理扫描文档或含财务数据的图像时，`Docling`的\
  \ OCR 集成尤其重要，因为它能够提取已数字化的历史纸质文档文本。此预处理阶段将多样输入格式转换为清晰的结构化表示，供下游工具可靠处理。\n\n第二阶段是语义提取，其中`DeepSeek-R1`解析来自`Docling`的结构化输出，通过上下文理解识别并提取特定字段。`DeepSeek-R1`接收的是`Docling`预处理的\
  \ Markdown 或 JSON 结构化数据，而非原始 PDF 文件，从而能将计算资源集中用于语义解释而非版面分析。在此阶段，模型提取`quarterly_revenue`（季度收入）、`operating_margin_expansion`（营业利润率扩张）和`year_over_year_growth_rate`（同比增长率）等命名字段，同时理解其上下文关系。`DeepSeek-R1`还通过验证数值计算（如`gross_profit`是否正确等于`total_revenue`减去`cost_of_revenue`）来捕捉预处理阶段可能出现的\
  \ OCR 错误或结构识别偏差。\n\n最终的质量保证阶段实施验证工作流，运用业务规则和统计异常检测交叉核对关键字段。财务数据提取需经过基于阈值的审核，超过预期值范围的字段（如季度环比收入变化超过\
  \ 50%）将触发人工验证。机构应实施准确度指标的自动化追踪，通过精心策划的基准数据集衡量字段提取准确度、实体识别和表格解析性能。随着提示词优化和错误分析带来的准确度提升，可逐步提高置信度阈值以减少人工审核负担，同时维持质量标准。\n\
  \n#### 成本效益分析与经济合理性\n\n混合自动化的经济优势在规模化时尤为显著。结合`Docling`的零成本本地处理和`DeepSeek-R1`每文档\
  \ 0.0027 美元的 API 费用，每处理千份文档的总成本为 2.70 美元。相比之下，由训练有素的财务分析师进行传统手动提取的成本为每文档 50 至 100\
  \ 美元（取决于复杂度和准确度要求）。对于年处理 10,000 份财务文档的机构，手动提取年成本为 50 万至 100 万美元，而自动化混合流程仅需支付 27\
  \ 美元年度 API 费用加上本地运行`Docling`的基础设施开销。\n\n这种超过 99%的显著成本降低使得此前不可行的应用成为可能，例如全面分析所有供应商发票、自动提取历史财务档案，或实时处理竞争对手财务披露。规模化下的每文档成本（0.0027\
  \ 美元）意味着处理百万份文档仅需 2,700 美元，使文档理解技术对于此前因成本过高而却步的手动方法应用成为经济可行方案。机构需考虑自托管`Docling`的基础设施成本（中等规模预估年成本\
  \ 5,000-15,000 美元）以及流程开发与维护的工程资源（约年成本 50,000-100,000 美元，取决于复杂度），但即使包含这些额外成本，处理百万级文档的年总费用仍低于\
  \ 120,000 美元。\n\n如希望探索更多案例研究，如*头脑风暴与创意激发*和*代码生成与理解*，请访问本章 GitHub 仓库：\n\n- *头脑风暴与创意激发*：https://github.com/PacktPublishing/DeepSeek-in-Practice/tree/main/Chapter04/brainstorming-ideation\n\
  - *代码生成*：https://github.com/PacktPublishing/DeepSeek-in-Practice/tree/main/Chapter04/code-assistant\n\
  \n## 总结\n\n本章通过两个详细案例研究展示了`DeepSeek-R1`的文档理解能力：亚马逊 API 网关集成文档和财务报表分析。在亚马逊案例研究中，`DeepSeek-R1`分析了\
  \ 45 页的技术集成指南，通过成功提取无服务器架构组件、识别安全配置并生成可投入生产的 CloudFormation 模板，获得了 87%的综合评估分数。该模型展现了处理复杂技术文档的强大能力，包括\
  \ API 网关限流策略、Lambda 授权模式、JWT 验证逻辑和分布式追踪配置。\n\n\n# 5 构建 DeepSeek 应用\n\n## 案例研究：财务文档分析\n\
  \n财务文档分析案例研究使用 FruitStand Innovation Inc. 的一份虚构季度报告（包含 192 行、6 个复杂表格和 150 个语义字段），评估了\
  \ `DeepSeek-R1` 与专用文档解析工具的表现。`DeepSeek-R1` 实现了 91.3% 的字段提取准确率（137/150 字段）、94.7%\
  \ 的表格解析准确率（232/245 单元格）和完美的实体识别（42/42 实体），处理时间为 4,250 毫秒，每份文档成本为 $0.0027。我们将 `DeepSeek-R1`\
  \ 与 `Docling`（IBM Research）和 `MarkItDown`（Microsoft）进行了比较，发现 `Docling` 通过专门的结构识别实现了更高的表格解析准确率（97.2%），`MarkItDown`\
  \ 提供了最快的处理速度（890 毫秒）和中等准确率（78.5%），而 `DeepSeek-R1` 独特地提供了语义理解能力，并具备直接字段提取功能。将 `Docling`\
  \ 的结构提取与 `DeepSeek-R1` 的语义解释相结合的混合流水线取得了最佳的综合效果。\n\n在两项案例研究中，我们应用了一致的评估指标，包括对技术准确性和实施准备情况的定性评估，以及对提取准确性、处理时间和成本效益的定量测量。`DeepSeek-R1`\
  \ 始终表现出专业顾问水平，在复杂文档上达到 88-92% 的准确率，每份文档成本 $0.0027，而人工分析成本为 $50-100，这展示了在自动化文档理解工作流程中\
  \ 99% 以上的成本降低。实施 `DeepSeek-R1` 进行文档理解的组织应在部署前建立明确的评估指标，定义定性标准（如技术准确性和完整性）和定量测量（包括字段提取准确率、实体识别、处理时间和每份文档的成本），这些指标应与其特定的文档类型相适应。由于监管和合规要求，财务文档通常需要\
  \ 95% 以上的准确率阈值，而一般技术文档可能接受 85% 以上的准确率，并对关键部分进行人工验证。\n\n成功的实施需要仔细的提示工程，明确指定输出格式、必需字段、数值精度要求和特定领域术语。我们的财务文档分析表明，为常见缩写提供词汇表，例如\
  \ `PP&E` 代表 `Property, Plant & Equipment`，并明确是否扩展首字母缩略词，可以显著减少提取错误。对于复杂的多列表格，明确指示模型列之间的关联性和时间段比较，可以最大限度地减少嵌套单元格混淆。当初始提取遗漏关键字段时，迭代提示被证明很有价值，因为针对特定缺口的后续提示能够持续提高完整性，而无需重新处理整个文档。组织还应考虑根据文档特征结合工具优势的混合架构，例如，使用\
  \ `Docling` 预处理具有复杂视觉布局的 PDF 文件以 97.2% 的准确率提取表格结构，然后使用 `DeepSeek-R1` 进行语义字段提取和实体识别，总成本仅为每份文档\
  \ $0.0027，同时实现比任何单一工具更高的准确性。\n\n接下来，我们将展示如何使用 DeepSeek API 创建一个可工作的服务。敬请期待。\n\n\
  ---\n\n### 获取本书的 PDF 版本和独家内容\n\n扫描二维码（或访问 packtpub.com/unlock）。按书名搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n> **注意：** 请保留好您的发票。直接从 Packt 购买则无需发票。\n\n---\n\n在前面的章节中，我们讨论了 DeepSeek 的内部工作原理、有效提示\
  \ DeepSeek 模型的最佳策略以及如何使用 DeepSeek。在本章中，我们将付诸实践。我们将解决一个实际问题，并向您展示如何利用 DeepSeek 模型来解决它。\n\
  \nDeepSeek 模型是开源的，这既是优势也是挑战。您有无尽的选择：通过 API 使用大型模型，或使用可在本地运行的微缩模型，这很强大但需要权衡。使用 DeepSeek\
  \ 模型没有唯一的正确方式；最佳选择取决于您的情况和具体用例的需求。您应该选择本地选项还是云选项？应该选择小模型、大模型还是推理模型？\n\n本章的目标是双重的。我们想向您展示如何使用\
  \ DeepSeek 模型解决一个特定的用例（端到端），并演示您可以与 DeepSeek 模型交互或使用的主要方式。在本章中，您将学习使用模型的所有不同方式：本地、通过\
  \ API、在云端以及在您自己的机器上。\n\n但在开始之前，我们需要一个用例。让我们看看 Duarte 对其日常与智能手表斗争的描述。\n\n> 我和我的妻子都是长跑运动员，已经很久了。不瞒你说，我非常喜欢马拉松。跑步是为数不多的我真正从办公桌后走出去到户外的场合。我热爱它的一切。但这可能不是谈论它的好地方。我们都使用佳明智能手表；我们很喜欢它们！\n\
