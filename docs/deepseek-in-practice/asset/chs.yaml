  \ DeepSeek*\n\n# 1\n\n## 什么是 DeepSeek？\n\n**人工智能**（**AI**）正在快速发展，随之而来的是一套工具，允许开发者、研究人员和创新者构建更智能、更自适应的系统。其中一个新兴的工具就是\
  \ **DeepSeek**：一个强大的、开源的**大语言模型**（**LLM**），旨在与 GPT-4 和 LLaMA 等主要大语言模型（LLM）的功能相媲美。但\
  \ DeepSeek 到底是什么，为什么我们应该关注它？\n\n在本章中，我们将深入探讨 DeepSeek 是什么，它如何融入更广泛的 AI 领域，以及为什么它在整个科技行业引起如此兴趣。您将了解\
  \ DeepSeek 的独特功能，以及它在训练数据、效率和性能基准方面与其他模型的比较。\n\n学完本章后，您将能够理解 DeepSeek 的发展及其成功的关键贡献者。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n*   介绍 DeepSeek\n*   理解 DeepSeek 的技术突破\n*   对全球 AI 生态系统的影响\n\
  *   探索 DeepSeek 的版本和演变\n\n### 免费福利\n\n您的购买包含本书的免费 PDF 副本以及其他独家福利。请查看前言中的 *书籍附带的免费福利*\
  \ 部分以立即解锁它们，并最大化您的学习体验。\n\n### 介绍 DeepSeek\n\nDeepSeek 是一种开源语言模型，旨在使先进 AI 民主化和易于获取。第一个版本\
  \ DeepSeek-R1 于 2025 年 1 月 20 日发布，就在中国农历新年前夕。该团队不仅发布了闭源二进制文件，还公开了权重、训练脚本和推理代码，因此任何人都可以检查或重建该系统。\n\
  \n该模型在 MIT 许可证下发布，没有使用费或严格条款。任何人都可以在本地运行它或将其调整用于新任务。这种自由吸引了世界各地的开发者、研究人员、教师和小型公司。他们将\
  \ DeepSeek-R1 应用于客服机器人、课堂辅助工具、实验室研究和写作工具。\n\n\n基准测试显示，DeepSeek-R1 与 OpenAI-o3 和\
  \ Gemini-2.5-Pro 竞争。它能处理数学、代码、多种语言和复杂提示。结果表明，强大的模型不一定必须是封闭的，并凸显了中国在前沿人工智能领域日益增长的作用。该模型的发布也重新引发了关于开放获取与安全性、以及改善全球研究合作的辩论。2025\
  \ 年 9 月 17 日，另一个里程碑达成，DeepSeek-AI 团队在 `Nature` 上发表了关于 DeepSeek-R1 模型的研究论文，并登上了当期封面\
  \ ([`www.nature.com/articles/s41586-025-09422-z`](https://www.nature.com/articles/s41586-025-09422-z))。\n\
  \n从架构角度来看，DeepSeek 深度借鉴了基于 Transformer 模型的创新，并在后续版本中加入了自身的特色（在 *DeepSeek 的版本与演进*\
  \ 章节中有深入探讨）。但真正使其脱颖而出的是其可用性。DeepSeek 可以部署在多种环境中，从云服务器到边缘设备，甚至可以使用轻量版本运行在笔记本电脑上。\n\
  \n![图 1.1：DeepSeek-R1 (0528) 的基准性能 (来源：https://api-docs.deepseek.com/news/news250528)](img/B33471_01_1.png)\n\
  \n图 1.1：DeepSeek-R1 (0528) 的基准性能 (来源：[`api-docs.deepseek.com/news/news250528`](https://api-docs.deepseek.com/news/news250528))\n\
  \n我们来谈谈促成 DeepSeek 突然崛起和普及的各种因素：\n\n*   **开源架构和训练细节**：DeepSeek-R1 附带了一份详细的研究论文 ([`arxiv.org/abs/2501.12948`](https://arxiv.org/abs/2501.12948))\
  \ 一起发布，概述了其架构和训练方法，以及在推理、数学和编程任务上的基准分数 ([`artificialanalysis.ai/providers/deepseek`](https://artificialanalysis.ai/providers/deepseek))。此次发布得到了完整的模型权重、配置文件和训练脚本的支持，还包括六个适合本地或低资源环境的较小蒸馏版本\
  \ ([`api-docs.deepseek.com/news/news250120`](https://api-docs.deepseek.com/news/news250120))，以及面向需要托管服务开发者的即时\
  \ API 可用性 ([`api-docs.deepseek.com/guides/reasoning_model`](https://api-docs.deepseek.com/guides/reasoning_model))。\n\
  \n*   **时机**：其部分流行度源于时机恰当，当时全球组织、科学家和开发者开始探索这一新版本。此外，MIT 许可证提供了商用完全自由——这在高性能模型中已越来越罕见。这次发布还因其并非仅适用于研究；它具有实用性而引发了兴奋。开发者能够对其进行微调，部署到生产环境，并将其集成到现有的\
  \ AI 工作流中。这种强大功能与可用性的结合立刻吸引了众人。\n\n*   **初始技术亮点**：DeepSeek-R1 发布时最值得注意的方面包括：\n \
  \   *   **推理能力**：在涉及数学、代码和逻辑推理的关键基准测试中，它超越或匹敌了领先的模型。\n    *   **效率**：它以显著更低的推理成本提供了接近\
  \ GPT-4 级别系统的性能。\n    *   **强化优先的训练**：不同于依赖监督式人工标注数据的传统微调工作流，DeepSeek 跳过了中间步骤，直接使用\
  \ `基于人类反馈的强化学习`（`RLHF`）或类似范式——尽管使用了最小化的人类标注。这一改变加速了推理分数的提升，降低了人工标注成本，并使模型能够处理各种任务，例如数学问题、零样本代码等，而无需狭窄的特定任务指令。\n\
  \    *   **自定义架构**：虽然基于 Transformer 框架，但 DeepSeek-R1 融入了针对训练稳定性和长上下文理解优化的创新。\n\n\
  这些要素共同使该模型能够发挥远超其体量的实力，特别是在多步推理和问题解决方面。\n\n*   **现实世界就绪性**：DeepSeek 从一开始就展示了现实世界就绪性，这与许多在基准测试中表现出色但在部署时举步维艰的最先进模型不同。与那些需要大量设置或封闭基础设施的模型不同，DeepSeek\
  \ 可以在实际环境中立即使用。它通过其 API 提供生产就绪访问，通过开放权重和推理代码支持本地部署，并通过 LoRA 微调或提示工程进行定制。与 Trae 和\
  \ Windsurf 等企业平台的集成进一步简化了编排。这些能力在发布时很少在其他模型中如此无缝地结合，凸显了 DeepSeek 超越学术性能、致力于实际效用的承诺。\n\
  \n*   **社区兴趣**：DeepSeek-R1 的发布引发了激烈的社区活动。GitHub 上迅速涌现了大量插件、适配器和微调衍生版本，而数千个 Hugging\
  \ Face 分叉为合同审查、辅导、研究辅助、摘要和编程支持等工具提供了支持。在线论坛分享基准测试和硬件指南，大学将该模型用于课程和实验室项目。Reddit、知乎和\
  \ Stack Overflow 等论坛充满了分享的实验、性能测试以及在本地硬件上微调 DeepSeek 的指南。该模型的易获取性将业余爱好者转变为研究人员，将开发者转变为企业家。如今，DeepSeek\
  \ 也推动着教育计划。许多慕课和大学实验室已开始使用 DeepSeek 作为基础模型教授大语言模型理论和实践，因为它开放且清晰。\n\n*   **哲学愿景**：DeepSeek\
  \ 的愿景与更广泛的运动保持一致，即构建的 AI 不应是被守门的资产，而是全球共享的资源。正如 Linux 重塑了软件行业一样，DeepSeek 旨在通过将工具交到任何有好奇心或能力使用它们的人手中，来重塑\
  \ AI 开发。其战略不仅是与 OpenAI 或 Google 竞争，而是专注于可访问性和协作创新。\n\nDeepSeek-R1 的成功归功于三个因素：`RLHF`\
  \ 训练、开源承诺以及其在基准测试中具有竞争力的表现。\n\n这些要素共同奠定了基础，使 DeepSeek 不仅仅成为一个模型，更成为一个生态系统。本章剩余部分将探讨\
  \ DeepSeek-R1 的反响及其开放哲学背后的动机，什么技术突破推动了它的发展，以及它如何演变成一个完整的生态系统。\n\n### 理解 DeepSeek\
  \ 的技术突破\n\n真正使 DeepSeek-R1 与众不同的是其架构和训练过程中嵌入的技术创新。这些创新使其能够超越许多当代模型，并帮助重新定义未来大语言模型的构建方式。\n\
  \n#### 训练过程\n\n在开始介绍 DeepSeek 的训练过程之前，我们先看看主流大语言模型的开发过程，通常包括以下步骤：\n\n1.  **在大规模语料库上进行自监督学习预训练**：在这个阶段，模型暴露在大规模、多样化的数据集中，例如书籍、网页和代码。目标是学习通用的语言模式，而无需显式标签。常见的预训练策略包括：\n\
  \    1.  **自回归建模**（例如，GPT）：模型预测序列中的下一个词。\n    2.  **掩码语言建模**（例如，BERT）：模型预测被遮盖（masked）的词。\n\
  \    3.  **基于排列的建模**（例如，XLNet）：模型学习多种可能的词序。\n\n2.  **Transformer 架构**：大多数大语言模型使用\
  \ Transformer 架构（*图 1.2*），以其在**自然语言处理（NLP）**任务中的可扩展性和性能而闻名。它们通常使用自注意力机制来确定词与词之间的上下文关系。其中一些变体如下：\n\
  \n\n##### 仅编码器、仅解码器与编码器-解码器\n\n1.  **仅编码器**（例如 BERT）用于分类或理解。\n2.  **仅解码器**（例如 GPT）用于生成。\n\
  3.  **编码器-解码器**（例如 T5）用于翻译和摘要等任务。\n\n![图 1.2: Transformer 架构（Attention Is All You\
  \ Need, Vaswani 等人, https://arxiv.org/pdf/1706.03762）](img/B33471_01_2.png)\n图 1.2:\
  \ Transformer 架构（Attention Is All You Need, Vaswani 等人, [`arxiv.org/pdf/1706.03762`](https://arxiv.org/pdf/1706.03762)）\n\
  \n##### 监督微调与 RLHF\n\n1.  `在精心策划的指令遵循数据集上进行监督微调`：预训练后，模型会在高质量、带标签的数据集上进行微调，学习遵循特定指令并执行有用任务。这些数据集通常包含人工编写的提示和理想响应，帮助模型学习如何更直接和有目的地进行交互。\n\
  \n2.  `RLHF`：为了更好地使模型输出与人类偏好对齐，应用了 RLHF：\n    1.  人工评审员评估并排序多个模型响应。\n    2.  训练一个\
  \ `奖励模型` 来预测这些排名。\n    3.  然后使用强化学习算法（常用 `近端策略优化 (PPO)`）对 `LLM` 进行微调，以生成能最大化 `奖励模型`\
  \ 分数的输出，从而更好地与人类价值观和期望对齐。\n\nDeepSeek-R1 打破了这一惯例，它 `完全绕过了监督微调`。相反，它直接从预训练跳到强化学习，帮助其自主学习到强大的推理能力。\n\
  \n避免 `监督微调 (SFT)` 消除了对昂贵人工标注数据集的依赖。相反，DeepSeek 采用了 `基于规则的奖励机制`，例如自动验证正确答案或检查输出格式。这种方法更具可扩展性且成本效益更高，有助于克服人工数据策划的局限性。此外，使用明确、规则驱动的奖励，例如在指定结构内验证答案或确认代码功能，可以缓解奖励黑客（reward\
  \ hacking）问题，这是不太可预测的神经奖励模型的一个常见问题。\n\n`图 1.3` 展示了 DeepSeek 模型训练的流程图。\n\n![图 1.3:\
  \ DeepSeek-R1 模型训练](img/B33471_01_3.jpg)\n图 1.3: DeepSeek-R1 模型训练\n\n##### DeepSeek-R1\
  \ 训练流程\n\nDeepSeek-R1 的训练流程始于 `DeepSeek-V3`，一个拥有 6710 亿参数的大型基础模型。这个基础模型使用侧重于准确性和输出格式的奖励进行\
  \ `强化学习` (**`RL`**)，产生了一个名为 `DeepSeek-R1-Zero` 的中间模型。该模型作为一个关键的过渡点，使得在后续阶段能够进行更多针对特定任务的训练。\n\
  \n接下来，`DeepSeek-R1-Zero` 使用 `冷启动数据` 进行微调，这指的是广泛多样的指令遵循示例集合。这些数据通常结构良好、经过精心策划，为模型提供了对各种任务格式和领域的基本理解，使其适用于初步的通用指令调整。\n\
  \n在此阶段之后，应用了额外的监督微调（SFT）轮次，使用两个专门的数据集。第一个是 `思维链` (**`CoT`**) **`数据**`，强调多步骤推理。该数据帮助模型学习通过分解为中间步骤来解决复杂问题——这对于数学推理、逻辑推理和多跳问题回答至关重要。第二组是\
  \ `知识数据`，包含事实丰富、特定领域的内容，如科学文献、百科全书信息和技术手册。这有助于模型提高事实准确性并扩展领域覆盖。\n\n这些微调阶段完成后，通过先进的\
  \ RL 技术进一步增强了得到的模型 DeepSeek-R1。它不仅使用针对准确性和格式的 `奖励` 进行训练，还使用针对一致性的奖励，确保其输出在逻辑上连贯且自洽。此外，应用\
  \ `基于规则的验证` 来自动验证数学和代码生成等领域的响应。最后，引入 `人类偏好微调` 以使模型的行为与人类期望和质量判断保持一致。\n\nDeepSeek-R1\
  \ 已被蒸馏成更小、更高效的变体。这些变体包括 `DeepSeek-R1-Distill-Qwen`，它使用从 15 亿到 320 亿参数不等的 Qwen 2.5\
  \ 模型；以及 `DeepSeek-R1-Distill-LLaMA`，它利用 80 亿和 700 亿大小的 LLaMA 3 模型。这些蒸馏版本保留了原始 R1\
  \ 模型的大部分能力，但针对不同的资源和延迟约束进行了优化。\n\n总体而言，DeepSeek-R1 流程代表了一种多阶段策略，结合了监督学习、基于奖励的调整和针对性的模型蒸馏，以提供一系列针对性能、泛化性和部署灵活性进行优化的指令遵循语言模型。\n\
  \n结果，训练过程变得更加稳定和高效，受益于简化、可靠的奖励信号，减少了噪声和歧义。\n\nDeepSeek 的训练方法在以下方面带来了帮助：\n\n*   **`降低人力成本`**：无需手动标注或排列数千条指令。\n\
  *   **`更快的开发周期`**：训练时间线被显著精简。\n*   **`更强的泛化能力`**：模型通过试错交互而非固定模板学会了泛化指令遵循能力。\n\n\
  尽管缺乏传统的监督指令数据集，DeepSeek-R1 展示了 `强大的指令遵循能力`，与经过微调的模型具有竞争力。这表明，当设计良好时，仅靠强化学习就能赋予模型对指令和意图的深刻理解。\n\
  \n让我们看一下 DeepSeek 的 `推理流水线`，如 `图 1.4` 所示。\n\n![图 1.4: DeepSeek-R1 模型推理](img/B33471_01_4.png)\n\
  图 1.4: DeepSeek-R1 模型推理\n\n##### DeepSeek-R1 推理流程\n\nDeepSeek-R1 的推理流程旨在通过结合 `规则感知解码`\
  \ 和 `提示优化` 来优先输出结构化、可验证的结果。在推理期间，DeepSeek-R1 利用 `格式感知生成机制`，模型受到鼓励（通常通过提示设计和内部对齐）生成结构良好、可解释的响应，特别是对于涉及代码、数学或\
  \ `CoT` 推理的任务。它不仅针对流畅性进行了优化，还针对事实和逻辑一致性进行了优化，通常在答案中包含中间步骤（`CoT`），即使没有明确提示也是如此。这使得\
  \ DeepSeek-R1 能够提供分步解决方案和结构化输出（如 JSON、Markdown 或代码块），从而提高了下游应用的可靠性。\n\nDeepSeek-R1\
  \ 与其他最先进的 `LLMs` 不同之处在于其基于规则的 `奖励对齐推理行为`。许多领先的 `LLMs` 主要依赖端到端训练和人类偏好微调，而 DeepSeek-R1\
  \ 将 `基于规则的验证` 技术直接集成到 `RL` 循环中。这在推理时产生了下游效应：DeepSeek-R1 更有可能生成与形式化验证器或下游评估器兼容的输出（例如，代码的测试用例，数学的方程式）。因此，它在精度、结构和可解释性至关重要的领域表现出更强的性能，同时略微牺牲了开放式对话的灵活性。\n\
  \n接下来是 DeepSeek 的 `RL` 方法。\n\n#### 强化学习\n\n\nDeepSeek-R1 的强化学习方法因其独特的设计选择而备受关注，我们将在第\
  \ 2 章中深入探讨。与许多仅在训练最终阶段应用强化学习的模型不同，DeepSeek-R1 引入了`对齐技术`。`对齐技术`旨在训练早期就引导模型的输出变得更有帮助、更诚实、更无害。这种早期对齐有助于模型在整个发展过程中表现更一致、更理想。\n\
  \n它还用自动化的奖励模型取代了大规模人工标注，显著提升了可扩展性，并减少了对人工标注的依赖。另一个显著特点是它使用了自我博弈和`迭代优化`，使模型能够生成、评估并改进自身的输出。这种方法帮助\
  \ DeepSeek-R1 内化了高级推理模式和战略决策能力，使其在多轮推理、代码解释与补全以及解决复杂数学问题方面尤为有效。\n\n此外，强化学习训练通过基于自我生成的成功指标强化事实准确性，帮助`减轻幻觉`。\n\
  \n对于不熟悉 AI 语境中“对齐”概念的读者，它通常指确保模型行为与人类意图和价值观相符的技术。关于这些概念的有用介绍，可以在 OpenAI 的对齐概述（[`openai.com/index/our-approach-to-alignment-research/`](https://openai.com/index/our-approach-to-alignment-research/)）或对齐通讯（[`www.alignmentforum.org/s/dT7CKGXwq9vt76CeX`](https://www.alignmentforum.org/s/dT7CKGXwq9vt76CeX)）中找到。\n\
  \n除此之外，DeepSeek 对 Transformer 架构进行了一些修改。让我们来一探究竟。\n\n#### 架构修改\n\nDeepSeek-R1 构建于广泛采用的\
  \ Transformer 架构之上，该架构构成了大多数现代大语言模型的基础。其核心是 Transformer 使用的`自注意力机制`，允许输入序列中的每个 token\
  \ 无论位置如何，都能权衡所有其他 token 的重要性。这使得模型能够比传统的循环模型更有效地捕捉长程依赖和上下文关系。\n\n然而，标准注意力机制的计算成本会随着输入长度增加而变得高昂。为了解决这个问题，DeepSeek-R1\
  \ 引入了`自适应注意力路由`，这是一个重大的架构演进。与传统的对所有 token 应用固定全注意力的 Transformer 不同，此机制允许模型根据训练过程中计算的`相关性分数`，`有选择地关注最相关的\
  \ token`。这些分数通常源自内部注意力权重或辅助的`门控机制`，优先处理对最小化训练损失贡献最大的 token。通过将计算资源集中在高影响 token 上，尤其是在长序列中，`自适应注意力路由`使\
  \ DeepSeek-R1 能够更高效地处理最多 `32,000 tokens` 的输入。这不仅增强了模型理解和总结大型文档的能力，还通过避免对信息量较少的 token\
  \ 进行冗余注意力计算来减少计算开销。\n\n`图 1.5` 比较了传统 Transformer 注意力机制和 DeepSeek 的`自适应注意力路由`。\n\n\
  ![图 1.5：传统 Transformer 注意力与 DeepSeek-R1 自适应注意力路由对比](img/B33471_01_5.jpg)\n\n图 1.5：传统\
  \ Transformer 注意力与 DeepSeek-R1 `自适应注意力路由`对比\n\n此外，DeepSeek-R1 采用了`混合精度优化`，结合 `FP16（半精度）`和\
  \ `INT8（量化）`运算以提高训练和推理效率。这种方法在降低内存使用和加速计算的同时，保持了模型在准确率和困惑度方面的竞争力性能。通常，`FP16` 用于模型大部分的一般计算，而\
  \ `INT8` 量化则选择性地应用于推理时的矩阵乘法，通常是在注意力和前馈层中，这些地方的精度降低不会显著影响输出质量。通过仔细选择要量化的层，DeepSeek-R1\
  \ 实现了效率与性能之间的有利权衡。这种方法在保持输出质量的同时显著加速了推理和训练，使其非常适合大规模部署。\n\n该模型还受益于高效的并行化策略。它利用张量并行和激活检查点来减少训练期间的内存使用，使其能够在多\
  \ GPU 系统上更有效地进行训练。\n\n总的来说，这些增强使得 DeepSeek-R1 成为 Transformer 架构的演进，它不仅更具可扩展性和上下文感知能力，而且在训练和推理方面也更具成本效益。\n\
  \n现在，让我们将焦点转向 DeepSeek 架构与其他大语言模型架构的比较。\n\n##### 主流大语言模型架构对比（2025 年）\n\n随着大语言模型领域的发展，不同的架构和训练范式应有尽有。本对比（`表\
  \ 1.1`）重点关注关键差异，特别是近年来一些最具影响力的模型中 `Mixture-of-Experts` (`MoE`) 架构和强化学习的使用情况。\n\n\
  | **模型** | **是否使用 MoE？** | **关键架构亮点** | **RLHF** | **开源？** |\n| --- | --- | ---\
  \ | --- | --- |\n| DeepSeek-R1 | 是。稀疏 `MoE` | 671 B 参数；`MoE` + `多头潜在注意力`；以推理为中心\
  \ | 无 RLHF，使用纯强化学习 (`GRPO`) | 是 (`MIT`) |\n| Claude 4 | 否 | 密集 Transformer；采用 Anthropic\
  \ 的 Constitutional AI 和 `直接偏好优化` (`DPO`) 构建 | 是，先进的 `RLHF` + `DPO` | 否 |\n| Gemini\
  \ 2.5 Pro | 是。稀疏 `MoE` | 多模态稀疏 `MoE` Transformer；1 M token 上下文（即将支持 2 M） | 是。`RLHF`\
  \ + 持续对齐 | 否 |\n| GPT-4.5 | 否 | 2025 年 2 月 27 日发布；OpenAI 最大的非 CoT 模型 (`Orion`) |\
  \ 是。`RLHF` + `SFT` | 否 |\n| o3 | 未知（可能为密集） | 针对个性化助手任务优化；改进的定位和记忆模块 | 是，先进的 `RLHF`\
  \ | 否 |\n| Grok 3.5 | 无 `MoE` 证据 | 密集 Transformer；增强了 Grok 3 的推理能力；高级 \"Think\"\
  \ 模式；仍为专有 | 是。基于 RL 的训练 + `RLHF` 微调 | 否 |\n| Gemma 3 | 否，密集型 | 轻量级 `MoE`；经过长上下文指令微调\
  \ | 是。`RLHF` | 是 (`Apache 2.0`) |\n| LLaMA 4 | 否 | 密集 Transformer；高级记忆和模块化层 | 是。`RLHF`\
  \ 和安全微调 | 是 |\n\n表 1.1：大语言模型架构对比\n\n领先的语言模型在其架构策略上日益分化，特别是在 `MoE` 的使用方面。像 Gemini\
  \ 2.5 Pro 和 DeepSeek-R1 这样的模型采用了稀疏 `MoE` 架构，使其能够拥有大规模参数，同时保持高效的计算利用率。基于其强大的性能和低延迟特性，外界普遍认为\
  \ GPT-4.1 采用了某种形式的 `MoE` 或稀疏专家路由，尽管具体细节尚未披露。\n\n介于这些方法之间，Grok 3.5 保留了密集 Transformer\
  \ 架构，针对实时响应能力和集成推理进行了优化。它完全避免了 `MoE`，转而专注于强化学习技术和使用实时反馈数据的`迭代优化`。\n\n相比之下，Claude\
  \ 4 和 LLaMA 4 继续采用完全密集的设计，优先考虑简单性、对齐稳定性和可预测行为，而非原始的参数规模扩展。\n\n既然我们已经向您介绍了 DeepSeek\
  \ 的技术创新，我们将更深入地探讨 DeepSeek 的 `MoE` 设计。\n\n#### MoE 架构\n\nDeepSeek-R1 的一个重大架构突破是集成了\
  \ `MoE` 设计。\n\n\n\nMoE 是一种模块化的神经网络设计，其特点是对于任何给定的输入，只激活一部分参数（称为`experts`）。MoE 并非在每次预测中都使用完整的参数空间，而是动态地、有选择性地激活少数专家。\n\
  \n#### DeepSeek 如何实现 MoE\n\nDeepSeek 采用了一种稀疏的`MoE 架构`，其中门控网络在每一层动态地从`N`个专家网络中选出两个来处理给定的输入。选择两位专家在计算效率和模型表达能力之间取得了平衡。它允许模型利用多样化的专业知识，而无需承担激活所有专家的全部成本。这种方法使得专家能够实现专门化，同时保持推理延迟和资源使用处于可管理的水平。这些专家并非被手动分配给特定任务，如数学或代码；相反，专门化是在训练过程中涌现的。门控机制通过优化来学习，根据上下文线索将输入路由到最有效的专家。随着时间的推移，由于这种学习到的路由机制，某些专家在特定领域（例如语言、推理和编码）被更频繁地激活，从而有效地发展出功能性专门化。\n\
  \n`图 1.6` 概览了此架构。\n\n![图 1.6：MoE 架构概念图](img/B33471_01_6.png)\n\n图 1.6：MoE 架构概念图\n\
  \n每个专家处理相同类型的输入表示，但可能会根据接收到的模式学会强调不同的方面。它们的`角色`由它们最常被路由的数据所塑造，而这反过来又引导着它们的参数更新。这使得专家能够有机地承担不同的角色，而无需不同的输入格式或编码。模型包含一个大型的专家子网络池（每个都是一个小型的前馈网络），但每个输入令牌只激活一小部分——通常是两个。门控网络评估上下文，并动态决定激活哪些专家，允许模型将信息自适应地路由到最有效的处理位置。\n\
  \n这种结构带来了几个关键优势：\n\n*   **可扩展性**：由于任何时刻只有少数专家处于活动状态，模型可以维护大量的总参数，同时每个令牌消耗的计算量比同等规模的密集模型更少。这使得\
  \ DeepSeek 能够扩展，而不会线性地增加计算成本。\n*   **模块化**：专家可以独立进行训练、冻结、更新甚至替换。这种模块性允许多高效的持续学习、领域适应或特定任务微调，而无需重新训练整个模型。\n\
  *   **专门化**：随着门控网络学会将不同的输入路由给不同的专家，这些子网络开始专门化；一些更擅长代码，另一些则更擅长数学推理、自然语言或对话。这降低了过拟合的风险，并增强了模型在多样化任务上的泛化能力。\n\
  \n通过这种架构，DeepSeek-R1 本质上表现得像一个特定领域模型的集成，但没有资源重复或通常与并行运行多个系统相关的延迟开销。\n\n除了 DeepSeek，许多**最先进**（**SOTA**）的\
  \ LLM 也采用了 MoE 架构，详细信息见下表：\n\n| **模型** | **参数数量** | **每个令牌激活的专家数** | **总专家数** |\
  \ **路由类型** | **用例优势** |\n| --- | --- | --- | --- | --- | --- |\n| `DeepSeek-R1`\
  \ | 总计约 1300 亿 / 激活约 300 亿 | 2 | 约 64 | 稀疏 + 门控 | 数学、推理、代码和多语言理解 |\n| `Gemini 2.5\
  \ Pro` | 估计 1 万亿+ (MoE 配置) | 未指定 (可能 2–4) | 数十 | 专有稀疏 | 多模态应用、代码和检索增强推理 |\n| `Grok-3`\
  \ | 估计总参数 4000 亿+ (MoE) | 2–4 (自适应) | 未指定 (20+) | 高级动态 MoE | 增强推理、DeepSearch、视觉+代码+对话，以及长上下文\
  \ |\n| `Grok-1.5` | 估计总参数 3000 亿 | 2–4 (自适应) | 16+ | 动态路由 | 实时交互、多模态学习和大规模上下文跟踪\
  \ |\n| `Mixtral 8x7B` | 总计 560 亿 / 激活 129 亿 | 2 | 8 | Top-2 门控 MoE | 通用推理、快速推理和多语言\
  \ |\n| `Switch Transformer` | 总计 1.6 万亿 / 激活约 150 亿 | 1 | 2,048 | Top-1 路由 | 可扩展性基准；开创了万亿规模的\
  \ MoE |\n| `GLaM` | 总计 1.2 万亿 / 激活 930 亿 | 2 | 64 | Top-2 路由 | NLP 理解、代码和科学任务 |\n\
  \n表 1.2：MoE 模型比较\n\n随着 MoE 架构获得关注，Mixtral 8×7B 展示了开源模型如何在有限计算资源下获得强大的推理能力，而 Grok\
  \ 和 Gemini 2.5 等更新系统则增加了自适应或专有路由以及多模态预训练。谷歌的 Switch Transformer 和 GLaM，这两个万亿参数的原型，首先证实了\
  \ MoE 可以可靠地扩展。这些项目共同展示了 MoE 如何让超大规模模型发展，同时保持足够快的推理速度以满足实时、高性能任务的需求。\n\n构建 LLM 的另一个基础方面是其训练所用的数据。让我们看看\
  \ DeepSeek 如何利用其训练数据集。\n\n#### 训练数据集与理念\n\n在论文`DeepSeek-R1：通过强化学习激发 LLM 的推理能力` (https://arxiv.org/abs/2501.12948)\
  \ 中，作者指出 DeepSeek-R1 是在一个大规模、多样化且领域丰富的多语言数据集上训练的，旨在支持推理、编程和跨语言理解。\n\n虽然该数据集的确切组成并未公开，但论文概述了使用精心策划的冷启动数据和大约\
  \ 80 万个 SFT 样本，这些数据被整合到一个多阶段的强化学习框架中以开发模型。\n\n数据选择策略强调跨多个关键领域的高质量来源：\n\n*   模型在`Python`、`JavaScript`和`Rust`等编程语言上接受了大量训练，使用了来自\
  \ GitHub 等仓库以及 Stack Overflow 等开发者问答平台的精选代码。\n*   为了加强数学和逻辑推理，数据集纳入了形式逻辑语料库、符号数学基准以及竞赛数学问题集（例如`MATH`、`GSM8K`和`ProofWriter`）。\n\
  *   科学理解通过在学术出版物和技术手册上进行预训练得到加强，这些资料来源于 arXiv 等平台以及开放获取的研究数据集。\n*   数据集的多语言部分以中文和英语为基础，并额外覆盖了主要全球语言，数据来源包括`CCMatrix`和`OPUS`等数据集。\n\
  \n这种多样化的训练基础反映了 DeepSeek-R1 的目标：将高级推理与强大的多语言和领域能力相结合。\n\n\n\n在同一篇论文中，作者描述了在构建训练数据时采用了低过滤策略，这与许多其他大语言模型开发者使用的更激进的数据过滤流程形成对比。做出这一设计选择是为了保留语言的自然复杂性和多样性，使模型能更好地捕捉非正式表达、文化特定习语、情感化语言以及边缘案例场景。根据作者的说法，这种语言多样性支持更具表现力、创造性和语境流畅性的模型行为。然而，论文并未明确说明过滤掉了哪些类型的内容，或者是否进行了过滤。由于数据集的组成或过滤标准缺乏透明度，目前尚不清楚训练语料库是否包含了潜在有害内容，如仇恨言论、错误信息或攻击性材料。虽然这种低过滤方法可能增强模型在多样化语言和文化语境下的泛化能力，但它也引入了模型可能学习并再现不良内容的风险。这些权衡凸显了下游安全措施和负责任使用的重要性，尤其是在将模型部署于现实世界环境时。\n\
  \n`DeepSeek-R1`的架构和训练策略使其特别适合开放式任务。它在头脑风暴、创意生成和探索性对话——这些需要灵活性和最少预设的领域——展现出强大能力。得益于其多样化的语言训练，该模型在精细翻译和多语言推理方面也表现出色。此外，`DeepSeek-R1`还以其适应用户语气和对话风格的能力而闻名，许多用户认为这在创意和协作场景中非常有用。\n\
  \n嗯，DeepSeek 已经推出过多个版本，我们预计随着通往通用人工智能竞赛的白热化，未来还会有更新的版本发布。\n\n在下一节中，我们将探讨自 R1 发布以来，DeepSeek\
  \ 生态系统是如何演进的。\n\n### DeepSeek 的版本与演进\n\nDeepSeek 的故事不仅仅关乎一次模型的发布。它关乎一个持续演进的生态系统。DeepSeek\
  \ 的每一次迭代都在推理能力、易用性、安全性和跨平台集成方面带来了重大升级。理解 DeepSeek 的演进过程，对于把握其长远愿景和潜力至关重要。\n\n####\
  \ DeepSeek 不断演进的生态系统\n\n自首次亮相以来，DeepSeek 在多个领域取得了长足进步，包括语言理解、数学推理、代码生成和多模态能力。每个版本都引入了有意义的增强，强调了\
  \ DeepSeek 在不妥协质量的前提下，实现高性能语言模型民主化的目标。\n\n理解 DeepSeek 的演进，能为其增长轨迹、愿景以及它如何持续颠覆闭源和开源\
  \ AI 生态提供关键见解。在下面的表格中，我们将按时间顺序探讨构成 DeepSeek 套件的关键里程碑、模型变体和产品层次。\n\n| 版本 | 发布日期 |\
