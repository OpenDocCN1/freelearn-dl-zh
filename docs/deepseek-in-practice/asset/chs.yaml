  \ DeepSeek 模型。我们在本书的*附录*中介绍了一些这些选项。请去查看。\n\n## 构建第一个原型\n\n在本节中，我们将为“每日健康摘要”构建一个端到端的原型，遵循五个高级步骤：\n\
  \n1.  首先，我们将从 Garmin API 获取数据并学习如何查询它。\n2.  接下来，我们将把这些原始健康数据塑造成 DeepSeek 能够理解和推理的格式。\n\
