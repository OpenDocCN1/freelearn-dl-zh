  \ Now），读者可能被“我想要！”（I want one！）按钮更吸引。\n\n所以，让我们给 `ChatGPT` 提供 `HTML` 源代码：\n\n![Figure\
  \ 7.14 – ChatGPT changing HTML code](img/file122.png)\n\n图 7.14 – ChatGPT 修改 HTML\
  \ 代码\n\n让我们看看输出是什么样的（我也将标题、副标题和段落更改为 `ChatGPT` 生成的内容）：\n\n![Figure 7.15 – New version\
  \ of the website](img/file123.png)\n\n图 7.15 – 网站的新版本\n\n如你所示，`ChatGPT` 只在按钮层面进行了干预，轻微改变了它们的布局、位置、颜色和措辞。\n\
  \n结论，`ChatGPT` 是营销 A/B 测试中非常有价值的工具。它快速生成相同内容的不同版本的能力可以缩短新活动的上市时间。通过利用 `ChatGPT`\
  \ 进行 A/B 测试，你可以优化营销策略，并最终为业务带来更好的结果。\n\n## 提升搜索引擎优化 (SEO)\n\n`ChatGPT` 另一个可能改变规则的光前景领域是搜索引擎优化（`SEO`）。这是在\
  \ `Google` 或 `Bing` 等搜索引擎中获得排名的关键元素，它决定了你的网站是否对那些寻找你所推广内容的用户可见。\n\n> SEO 是一种用于提高网站在搜索引擎结果页面页（`SERPs`）上可见性和排名的技术。它是通过优化网站或网页来增加来自搜索引擎的自然（非付费）流量的数量和质量来实现的。SEO\
  \ 的目的是通过针对特定关键词或短语优化网站来吸引更多有针对性的访问者。\n\n想象你经营着名为 `Hat&Gloves` 的电子商务公司，正如你可能猜的那样，它只卖帽子和手套。你现在正在创建你的电子商务网站并想优化其排名。让我们\
  \ `ChatGPT` 列出一些嵌入我们网站的 {关键词：\n\n![Figure 7.17 – Example of SEO keywords generated\
  \ by ChatGPT](img/file124.png)\n\n图 7.17 – ChatGPT 生成的 SEO 关键词示例\n\n如你所示，`ChatGPT`\
  \ 能够创建一个不同类型的关键词列表。其中一些非常直观，例如“帽子和手套”（Hats and Gloves）。其他一些是相关的，有间接联系。例如，“礼物建议”（Gift\
  \ ideas）并不一定与我的电子商务业务相关，但将其包含进去可能是明智的，这样我可以扩大我的受众。\n\n\n\n\n最后，我们还可以进一步利用“扮演……”（Act\
  \ as…）这种技巧，这我们在`第 3 章`中提到过。对我们的网站进行评估并理解其是否已按预期进行了优化，将是非常有趣的事情。在营销领域，这种分析被称为 `SEO\
  \ audit`（SEO 审计）。`SEO 审计`是对网站 SEO 性能和潜在改进领域的评估。`SEO 审计`通常由 SEO 专家、网页开发人员或营销人员进行，涉及对网站的技术架构、内容和反链配置的全面分析。\n\
  \n在`SEO 审计`过程中，审计人员通常会使用一系列工具和技术来识别改进领域，例如关键词分析、网站速度分析、网站架构分析和内容分析。随后，审计人员将生成报告，列出关键问题、改进机会以及解决这些问题的建议行动。\n\
  \n让我们让 ChatGPT 扮演 SEO 专家来执行此审计。我们将使用上面提到的攀岩博客作为参考网站。我将给 ChatGPT 代码并要求其执行以下指令：“扮演\
  \ SEO 专家并对上述 HTML 代码生成一份简短的 SEO 审计（最多 300 字）”。这是回复：\n\n![图 7.19 – ChatGPT 对攀岩博客\
  \ HTML 代码生成 SEO 审计。](img/file126.png)\n\n图 7.19 – ChatGPT 对攀岩博客 HTML 代码生成 SEO 审计。\n\
  \nChatGPT 能够生成相当准确的分析，并带有相关的评论和建议。总的来说，ChatGPT 在 SEO 相关活动方面具有有趣的潜力，无论你是从零开始构建网站还是想改进现有网站，它都是一个很好的工具。\n\
  \n## 通过情感分析提高质量并增加客户满意度\n\n情感分析是营销中一种技术，用于分析和解释客户对品牌、产品或服务所表达的情绪和观点。它涉及使用`natural\
  \ language processing`（NLP）和`machine learning`（ML） 算法来识别和分类社交媒体帖子、客户评论和反馈调查等文本数据的情感。\n\
  \n通过执行情感分析，营销人员可以洞察客户对其品牌的感知，识别改进领域，并做出数据驱动的决策以优化营销策略。例如，他们可以跟踪客户评论的情绪，识别哪些产品或服务收到了正面或负面反馈，并相应调整他们的营销信息。\n\
  \n总而言，情感分析是营销人员理解客户情感、衡量客户满意度以及开发与目标受众产生共鸣的有效营销活动的宝贵工具。\n\n情感分析已经存在一段时间了，所以你可能好奇\
  \ ChatGPT 能带来什么额外价值。嗯，除了分析的准确性（它是目前市场上最强大的模型）之外，ChatGPT 与其他情感分析工具的区别在于它是`general\
  \ artificial intelligence`（`AGI`，通用人工智能）。\n\n这意味着当我们使用 ChatGPT 进行情感分析时，我们并没有使用它用于该任务的特定\
  \ API：ChatGPT 和 OpenAI 模型背后的核心思想是它们可以同时协助用户处理许多通用任务，与任务交互并根据用户的请求更改分析的范围。\n\n因此，ChatGPT\
  \ 确实能够捕捉给定文本（如推特帖子或产品评论）的情绪。然而，ChatGPT 还可以进一步协助识别产品或品牌中对情感产生正面或负面影响的特定方面方面。例如，如果客户不断以负面方式提到产品的某个功能，ChatGPT\
  \ 可以将该功能突出为待改进领域。或者，ChatGPT 可能被要求对一条特别微妙的评论生成回复，同时兼顾评论的情绪并将其作为回复的背景。同样，它可以生成报告，总结评论或留言中发现的所有负面和正面元素，并将它们归入不同的类别。\n\
  \n让我们考虑以下示例。一位客户最近从我的电子商务公司 `RunFast` 购买了一双鞋，并留下了以下评论：\n\n“我最近买了 `RunFast Prodigy`\
  \ 鞋子，感觉很复杂。它们非常舒适，缓冲和支撑非常好，减轻了我跑步时的脚部疲劳。设计也很吸引人，我收到了一些赞美。然而，耐用性令人失望；外底磨损很快，透气鞋面在几周后就有磨损迹象。考虑到高价格，尽管它们舒适且漂亮，我还是不推荐。”\n\
  \n让我们让 ChatGPT 捕捉这条评论的情绪：\n\n![图 7.20 – ChatGPT 分析客户评论](img/file127.png)\n\n图 7.20\
  \ – ChatGPT 分析客户评论\n\n从前面的图中，我们可以看到 ChatGPT 并不限于提供一个标签：它还解释了构成该评论的正面和负面元素，这条评论具有复杂感，因此整体上可以被标记为中性。\n\
  \n让我们尝试深入探讨，并就改进产品提出一些建议：\n\n![图 7.21 – 根据客户反馈如何改进我产品的建议](img/file128.png)\n\n图\
  \ 7.21 – 根据客户反馈如何改进我产品的建议\n\n最后，让我们给客户生成回复，表明我们作为一家公司关心客户的反馈，并希望改进我们的产品。\n\n![图\
  \ 7.22 – ChatGPT 生成的回复](img/file129.png)\n\n图 7.22 – ChatGPT 生成的回复\n\n我们看到的示例非常简单，只有一条评论。现在想象一下我们有成千上万条评论，以及接收反馈的多种销售渠道。想象一下\
  \ ChatGPT 和 OpenAI 模型等工具的力量，它们能够分析并整合所有这些信息，识别产品的优缺点，捕捉客户趋势和购物习惯。此外，对于客户服务和留存，我们还可以使用我们偏好的写作风格自动回复评论。事实上，通过调整机器人的语言和语调以满足客户的特定需求和期望，你可以创造更具吸引力且有效的客户体验。\n\
  \n以下是一些示例：\n\n- `共情机器人`：使用同理心的语气和语言与可能遇到问题或需要敏感问题帮助的客户进行交互。\n- `专业机器人`：使用专业的语气和语言与可能寻找特定信息或需要技术问题帮助的客户进行交互。\n\
  - `对话机器人`：使用随和和友好的语气与可能寻求个性化体验或有更一般查询的客户进行交互。\n- `幽默机器人`：使用幽默和机智的语言与可能寻求轻松体验或缓解紧张局势的客户进行交互。\n\
  - `教育机器人`：使用教学式的沟通风格与可能想要了解更多产品或服务的客户进行交互。\n\n\n\n总之，ChatGPT 可以成为企业进行情感分析、提高质量和留住客户的强大工具。凭借先进的自然语言处理能力，ChatGPT\
  \ 可以实时准确地分析客户反馈和评论，为企业提供关于客户情绪和偏好的宝贵见解。通过将 ChatGPT 作为客户体验策略的一部分，企业可以快速识别任何可能对客户满意度产生负面影响的问题并采取纠正措施。这不仅可以帮助企业提高质量，还能增加客户的忠诚度和留存率。\n\
  \n## 总结\n\n在本章中，我们探索了营销人员如何利用 ChatGPT 来增强其营销策略。我们了解到 ChatGPT 可以帮助开发新产品，以及定义其进入市场的策略、设计\
  \ A/B 测试、增强 SEO 分析，并捕捉评论、社交媒体帖子和其他客户反馈的情绪。\n\nChatGPT 对营销人员的重要性在于，它具有改变公司与客户互动方式的潜力。通过利用\
  \ `NLP`、`ML` 和大数据的力量，ChatGPT 允许公司创建更具个性化和相关性的营销信息，提高客户支持和满意度，最终驱动销售和收入。\n\n随着 ChatGPT\
  \ 的不断进步和演进，我们可能会看到它更多地参与营销行业，特别是在公司与客户互动的方式上。事实上，高度依赖 AI 允许公司对客户行为和偏好获得更深层次的见解。\n\
  \n营销人员的关键启示是拥抱这些变化并适应 AI 驱动的营销的新现实，以保持竞争领先地位并满足客户的需求。\n\n在下一章中，我们将介绍书中涵盖的 ChatGPT\
  \ 应用的第三个也是最后一个领域——研究。\n\n# 第 7 章 用 ChatGPT 重塑研究\n\n## 加入我们的 Discord 书籍社区\n\n![](img/file0.png)\n\
  \n[`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)\n\n在本章中，我们重点关注希望利用\
  \ ChatGPT 的研究人员。本章将阐述 ChatGPT 可以解决的几个主要用例，以便你通过具体的示例学习如何在研究中使用 ChatGPT。\n\n在本章结束时，你将熟悉熟悉如何以多种方式将\
  \ ChatGPT 作为研究助手，包括以下：\n\n* 研究人员对 ChatGPT 的需求\n* 为你的研究头脑风暴文献\n* 为你的实验设计和框架提供支持\n\
  * 生成并格式化参考文献，以将其整合到你的研究中\n* 针对不同受众交付关于你的研究推演或幻灯片演示\n\n本章还将提供示例，并让你能够亲自尝试提示词（prompts）。\n\
  \n## 研究人员对 ChatGPT 的需求\n\nChatGPT 是各个领域研究人员极具价值的资源。作为一个在海量数据上训练的复杂语言模型，ChatGPT 可以快速准确地处理大量信息，并生成可能通过传统研究方法难以发现或耗时才能发现的见解。\n\
  \n此外，ChatGPT 可以通过分析人类研究人员可能无法立即察觉的模式和趋势，为研究人员提供其领域的独特视角。例如，想象一位研究人员正在研究气候变化，并希望理解公众对这一问题的看法。他们可能会要求\
  \ ChatGPT 分析与气候相关的社交媒体数据，并识别网上人们表达的最常见主题和情绪。然后，ChatGPT 可以为研究人员提供一份详尽报告，列出与该主题相关的常见词汇、短语和情感，以及任何可能需要了解的新趋势或模式。\n\
  \n通过与 ChatGPT 合作，研究人员可以获得端技术和见解，并保持在该领域的前沿。\n\n现在让我们深入探讨 ChatGPT 提高研究效率的四个用例。\n\n\
  > 本章中提出的大多数示例都是基于最新信息的；事实上，你经常会看到 ChatGPT 调用网络搜索插件。如果你使用的是带有 `GPT-3.5-turbo` 的 ChatGPT（即免费版），请记住它没有启用网络搜索插件，因此其知识截止日期限制在\
  \ 2021 年。如果你正在寻找更新的信息，以及通常来自网络的引用（以便你可以双击回答的可靠性），这可能是一个局限性。\n\n## 为你的研究头脑风暴文献\n\n\
  文献综述是一个关键且系统的过程，旨在对特定主题或问题的现有已发表研究进行检查。它涉及搜索、评阅和综合相关的已发表研究和其他来源（如书籍、会议论文和灰色文献）。文献综述的目标是识别特定领域中的空白、不一致之处以及开展进一步研究的机会。\n\
  \n文献综述过程通常涉及以下步骤：\n\n1. **定义研究问题**：进行文献综述的第一步是定义感兴趣主题的研究问题。假设我们正在进行关于社交媒体对心理健康影响的研究。现在我们想对头脑风暴一些可能的研究问题以集中我们的研究，我们可以利用\
  \ ChatGPT 来做到这一点：\n\n![图 8.1 – 基于给定主题的研究问题示例](img/file131.png)\n\n图 8.1 – 基于给定主题的研究问题示例\n\
  \n这些都是可以进一步调查的有趣问题。由于我特别对第一个感兴趣——“社交媒体互动和在线支持社区以哪些方式影响患有慢性心理健康状况个人的心理健康？”——我将保留这作为我们分析后续步骤的参考。\n\
  \n2. **搜索文献**：现在我们有了研究问题，下一步是使用各种数据库、搜索引擎和其他来源搜索相关文献。研究人员可以使用特定的关键词和搜索术语帮助识别相关研究。\n\
  \n![图 8.2 – 在 ChatGPT 支持下的文献检索](img/file132.png)\n\n图 8.2 – 在 ChatGPT 支持下的文献检索\n\
  \n从 ChatGPT 的建议开始，我们可以深入研究这些参考文献。\n\n3. **筛选文献**：一旦确定了相关文献，下一步是对研究进行筛选，以确定它们是否符合综述的标准。这通常涉及审阅摘要，并在必要时审阅研究全文。\n\
  \n假设我们想深入研究《社交媒体与青少年焦虑：来自哈佛大学教育学院的见解》研究论文。让我们让 ChatGPT 为我们筛选：\n\n![图 8.3 – 特定论文的筛选](img/file133.png)\n\
  \n图 8.3 – 特定论文的筛选\n\nChatGPT 能够为我提供该论文的概述，考虑到其研究问题和讨论的主要主题，我认为它对我自己的研究非常有用。\n\n\
  4. **提取数据**：在确定了相关研究后，研究人员需要从每项研究中提取数据，例如研究设计、样本量、数据收集方法和主要发现。\n\n例如，假设我们从 Hinduja\
  \ 和 Patchin (2018) 年的《数字自残：流行率、动机和结果》论文中收集以下信息：\n\n* 论文中收集的数据来源和研究对象\n\n\n\n\n*\
  \   研究者采用的数据收集方法\n*   数据样本量\n*   分析的主要局限性和缺点\n*   研究者采用的实验设计\n\n具体如下：\n\n![图 8.4\
  \ – 从给定论文中提取相关数据和框架](img/file134.png)\n\n图 8.4 – 从给定论文中提取相关数据和框架\n\n### 1. 文献综合\n\
  \n文献综述过程的最后一步是综合研究结果，并对该领域的当前知识状态得出结论。这可能涉及识别共同主题、突出文献中的空白或不一致之处，以及确定未来研究的机会。\n\n\
  让我们想象一下，除了 ChatGPT 提出的论文外，我们还收集了其他想要综合的标题和论文。更具体地说，我想了解它们是否得出了相同的结论、共同趋势是什么，以及哪种方法比其他方法更可靠。对于这种场景，我们将考虑三篇研究论文：\n\
  \n*   *The Effects of Social Media on Mental Health: A Proposed Study*，作者为 Grant\
  \ Sean Bossard ([`digitalcommons.bard.edu/cgi/viewcontent. cgi?article=1028&context=senproj_f2020`](https://digitalcommons.bard.edu/cgi/viewcontent.))\n\
  *   *The Impact of Social Media on Mental Health*，作者为 Vardanush Palyan ([`www. spotlightonresearch.com/mental-health-research/the-impact-of-\
  \ social-media-on-mental-health`](https://www.))\n*   *The Impact of Social Media\
  \ on Mental Health: a mixed methods research of service providers’ awareness*，作者为\
  \ Sarah Nichole Koehler 和 Bobbie Rose Parrell ([`scholarworks. lib.csusb.edu/cgi/viewcontent.cgi?article=2131&context=etd`](https://scholarworks.))\n\
  \n结果显示如下：\n\n![图 8.5 – 三篇研究论文的文献分析与基准测试](img/file135.png)\n\n图 8.5 – 三篇研究论文的文献分析与基准测试\n\
  \n此外，在这种情况下，ChatGPT 能够对提供的三篇论文生成相关的总结和分析，包括方法之间的基准测试和可靠性考虑。\n\n总的来说，ChatGPT 能够在文献综述领域开展许多活动，从研究问题的脑脑风暴到文献综合。一如既常，循环中需要一个`领域专家`（`SME`）来审核结果，但在这种帮助下，许多活动可以更高效地完成。\n\
  \n另一个可以由 ChatGPT 支持的活动是研究者希望进行的实验设计。我们将在下一节介绍这一点。\n\n## 为你的实验设计和框架提供支持\n\n实验设计是计划和执行科学实验或研究以回答研究问题的过程。它涉及对研究设计、待测变量、样本量以及数据收集和分析程序的决策。\n\
  \nChatGPT 可以通过向你建议研究框架（例如随机对照试验、准实验设计或相关性研究）来帮助研究的实验设计，并在设计的实施的同时提供支持。\n\n让我们考虑以下场景。我们想调查新的教育计划对学生数学学习成果的影响。这种新计划涉及`项目制学习`（`PBL`），这意味着要求学生合作完成真实世界的项目，使用数学概念和技能来解决问题并创建解决方案。\n\
  \n为了实现这一目的，我们将研究问题定义如下：\n\n新的 PBL 程序在提高学生表现方面与传统教学方法相比如何？\n\n以下是 ChatGPT 如何提供帮助：\n\
  \n*   **确定研究设计**：ChatGPT 可以协助为研究问题确定合适的研究设计，例如随机对照试验、准实验设计或相关性研究。\n\n![图 8.6 – ChatGPT\
  \ 为你的实验建议合适的实验设计](img/file136.png)\n\n图 8.6 – ChatGPT 为你的实验建议合适的实验设计\n\nChatGPT\
  \ 建议采用随机对照试验 (RCT)，并对其背后的原因提供了清晰的解释。对我来说，采用这种方法是合理的：下一步将确定实验中考虑的结果衡量和变量。\n\n*  \
  \ **识别结果衡量**：ChatGPT 可以帮助你识别一些潜在的结果衡量，以确定测试结果。让我们为我们的研究寻求一些建议：\n\n![图 8.7 – 给定研究学习的学习成果](img/file137.png)\n\
  \n图 8.7 – 给定研究学习的学习成果\n\n我选择测试分作为结果衡量是合理的。\n\n*   **识别变量**：ChatGPT 可以帮助研究者识别研究中的自变量和因变量：\n\
  \n![图 8.8 – ChatGPT 为给定研究生成变量](img/file138.png)\n\n图 8.8 – ChatGPT 为给定研究生成变量\n\n\
  注意，ChatGPT 还能生成特定于我们考虑的研究设计（RCT）的变量类型，称为`控制变量`。\n\n控制变量（也称为协变量）是在研究中保持保持不变或受控制的变量，以隔离自变量与因变量之间的关系。这些变量不是研究的重点，但将它们包含进来是为了减少混杂变量对结果的影响。通过控制这些变量，研究人员可以降低获得假阳性或假阴性结果的风险，并增加研究的内部效度。\n\
  \n有了上述变量，我们准备好建立实验了。现在我们需要选择参与者，ChatGPT 可以协助我们完成这一点。\n\n*   **采样策略**：ChatGPT 可以为研究建议潜在的采样策略：\n\
  \n![图 8.9 – ChatGPT 的 RCT 采样建议](img/file139.png)\n\n图 8.9 – ChatGPT 的 RCT 采样建议\n\
  \n注意，在现实场景中，要求 AI 工具生成带有解释的更多选项是一个良好的做法，这样你就可以做出合理的决策。对于这个例子，让我们按照 ChatGPT 给我们的建议进行，这还包括对目标群体和样本量的建议。\n\
  \n*   **数据分析**：ChatGPT 可以协助研究者确定用于分析研究收集数据的合适统计方法，例如方差分析 (ANOVA)、t 检验或回归分析。\n\n\
  ![图 8.10 – ChatGPT 为给定研究建议统计检验](img/file140.png)\n\n图 8.10 – ChatGPT 为给定研究建议统计检验\n\
  \nChatGPT 建议的所有内容都是连贯的，并在关于如何进行统计检验的论文中找到了证实。它还能识别出我们可能谈论的是连续变量（即分数），以便我们知道后续的所有信息都是基于这一假设的。如果我们想要离散分数，我们可以通过添加此信息来调整提示词，ChatGPT\
  \ 然后就会建议不同的方法。\n\nChatGPT 指明假设并解释其推理，这是根据其输入做出安全决策的关键。\n\n结论，ChatGPT 在研究人员设计实验时是一项非常有价值的工具。通过利用其`自然语言处理`（`NLP`）能力和丰富的知识库，ChatGPT\
  \ 可以帮助研究人员选择合适的研究设计、确定采样技术、识别变量和学习成果，甚至建议用于分析数据的统计方法。\n\n\n\n\n\n在下一节中，我们将进一步探索\
  \ ChatGPT 如何支持研究人员，重点关注参考文献的生成。\n\n## 生成和格式化参考文献\n\nChatGPT 可以通过提供自动化的引用和参考文献工具来支持研究人员生成参考文献。这些工具可以为各种来源（包括书籍、文章、网站等）生成准确的引用和参考文献。ChatGPT\
  \ 了解多种引用格式，例如 `APA`、`MLA`、`Chicago` 和 `Harvard`，允许研究人员根据其工作选择合适的格式。此外，ChatGPT 还可以根据研究人员的输入建议相关的来源，帮助简化研究流程并确保所有必要的来源都包含在参考文献中。通过利用这些工具，研究人员可以节省时间，并确保参考文献的准确和全面。\n\
  \n让我们考虑以下例子。假设我们定了一篇题为《技术对工作生产力的影响：实证研究》（The Impact of Technology on Workplace Productivity:\
  \ An Empirical Study）的论文。在研究和写作过程中，我们收集了以下论文、网站、视频和其他来源的引用，我们需要将其纳入参考文献（顺序为：三篇研究论文、一个\
  \ YouTube 视频和一个网站）：\n\n* `The second machine age: Work, progress, and prosperity\
  \ in a time a brilliant technologies`. Brynjolfsson, 2014. https://psycnet.apa.org/record/2014-07087-000\n\
  * `The Impact of Technostress on Role Stress and Productivity. Tarafdar`, 2014.\
  \ Pages 301-328. https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109\n\
  * `The big debate about the future of work, explained`. Vox. https://www.youtube.com/\
  \ watch?v=TUmyygCMMGA\n\n显然，我们不能在研究论文中直接使用上述列表；我们需要对其进行正确的格式化。为了做到，我们可以向 ChatGPT\
  \ 提供原始参考文献列表，并要求它以特定的格式重新生成，例如 `APA` 格式，这是美国心理学会（`APA`）的官方格式，常用于教育、心理学和社会科学的参考文献格式样式。\n\
  \n让我们看看 ChatGPT 是如何处理的：\n\n![图 8.11 – ChatGPT 生成的 APA 格式参考文献列表](img/file141.png)\n\
  \n图 8.11 – ChatGPT 生成的 APA 格式参考文献列表\n\n注意，我特别指定了不要添加细节，以防 ChatGPT 不知道这些信息。事实上，我注意到\
  \ ChatGPT 有时会添加出版的月份和日期，从而导致一些错误。\n\nChatGPT 可以提供的其他有趣帮助是建议我们可能想要引用的潜在参考文献。我们在本章的第一段已经看到了\
  \ ChatGPT 如何在写作过程之前对相关文献进行头脑风暴；然而，一旦论文完成，我们可能会忘记引用相关文献，甚至没有意识到引用了别人的工作。\n\nChatGPT\
  \ 在头脑风暴我们可能遗漏的潜在参考文献方面可以是一个非常出色的助手。让我们再次考虑我们的论文，研究问题是“社交媒体互动和在线支持社区如何影响患有慢性心理健康状况个人的心理健康？”假设我们设定了以下标题和摘要：其摘要包含以下内容：\n\
  \n`Title`: 社交媒体和在线支持社区对慢性心理健康状况个人心理健康的影响\n\n`Abstract`: 本研究探索了社交媒体互动和在线支持社区对慢性心理健康状况个人心理健康的影响。通过检查各种在线平台，该研究旨在识别积极和消极的影响。研究利用了定性和定量方法（包括问调查和访谈）来评估焦虑、抑郁和整体生活满意度的变化。初步结果表明，虽然在线支持可以提供宝贵的社交连接和情感支持，但过度使用和负面互动可能会加剧心理健康问题。\n\
  \n让我们让 ChatGPT 列出可能与此类研究相关的各种参考文献：\n\n![图 8.12 – 与提供的摘要相关的参考文献列表](img/file142.png)\n\
  \n图 8.12 – 与提供的摘要相关的参考文献列表\n\n你也可以对论文的其他部分重复此过程，以确保你没有遗漏任何需要包含在参考文献中的相关引用。\n\n一旦你的研究准备就绪，你可能需要通过“电梯演讲”（elevator\
  \ pitch）来展示它。在下一节中，我们将看到 ChatGPT 如何也支持这项任务。\n\n## 生成研究演示报告\n\n研究的“最后一公里”通常是向不同的观众进行展示。这可能涉及准备幻灯片组、演说稿（pitch）或网络研讨会，研究人员需要面对不同类型的听众。\n\
  \n例如，假设我们的研究《社交媒体和在线支持社区对慢性心理健康状况个人心理健康的影响》是为了硕士论文答辩准备。在这种情况下，我们可以要求 ChatGPT 生成一个持续\
  \ 15 分钟并遵循科学方法的演说结构。让我们看看产生了什么样的结果（作为背景，我指的是上段的摘要）：\n\n![图 8.13 – ChatGPT 生成的论文答辩](img/file143.png)\n\
  \n图 8.13 – ChatGPT 生成的论文答辩\n\n这太令人印象深刻了！在我的大学时代，如果有这样一个工具来协助我设计答辩将非常有帮助。\n\n从这个结构开始，我们还可以要求\
  \ ChatGPT 生成一个幻灯片组作为我们论文答辩的视觉辅助。\n\n让我们继续这个请求：\n\n![图 8.14 – 基于演说稿的幻灯片结构](img/file144.png)\n\
  \n图 8.14 – 基于演说稿的幻灯片结构\n\n最后，假设我们的论文答辩非常出色，以至于可能获得研究资金以继续调查该课题。现在我们需要一个电梯演讲来说服委员会。让我们向\
  \ ChatGPT 请求支持：\n\n![图 8.15 – 为给定论文的电梯演讲](img/file145.png)\n\n图 8.15 – 为给定论文的电梯演讲\n\
  \n我们可以随时调整结果，使其更符合我们的需求，然而，现成的结构和框架可以节省大量时间，让我们能够专注于我们想要呈现的技术内容。\n\n总的来说，ChatGPT\
  \ 能够支持研究的全全程，从文献收集和综述到研究的最终演示，我们已经证明了它可以成为研究人员极出色的 AI 助手。\n\n此外，请注意在研究领域，最近开发了一些与\
  \ ChatGPT 不同但同样由 GPT 模型驱动的工具。例如 `Humanata.ai`，这是一个 AI 驱动的工具，允许你上传文档并对其进行多种操作，包括摘要、即时问答以及基于上传的文件生成新论文。\n\
  \n这表明基于 GPT 的工具（包括 ChatGPT）正在为研究领域的若干创新铺平道路。\n\n## 总结\n\n在本章中，我们探索了 ChatGPT 作为研究人员价值工具的使用。通过文献综述、实验设计、参考文献生成和格式化以及演示报告生成，ChatGPT\
  \ 可以帮助研究人员加速那些低价值或零价值的活动，让他们能够专注于相关的活动。\n\n\n\n\n请注意，我们仅关注了 ChatGPT 可以支持研究人员的一小部分活动。在研究领域还有许多其他活动可以从\
  \ ChatGPT 的支持中受益，其中我们可以提到的数据收集、研究参与者招募、研究网络建立、公众参与等。\n\n将此工具整合到工作中的研究人员可以从其多功能和节省时间的特性中受益，最终带来更有影响力的研究成果。\n\
  \n然而，重要的是记住，ChatGPT 仅仅是一个工具，应该结合专家知识和判断来使用。与任何研究项目一样，必须对研究问题和研究设计进行仔细考虑，以确保结果的有效性和可靠性。\n\
  \n通过本章，我们也结束了本书的第二部分，该部分重点关注了你可以利用 ChatGPT 的广泛场景和领域。然而，我们主要关注个人或小团队的使用，从个人生产力到研究辅助等。从第三部分开始，我们将讨论提升到大型组织如何利用\
  \ Microsoft Azure 云上提供的 OpenAI 模型 API，将 ChatGPT 背后的相同生成式 AI 用于企业级项目。\n\n## 参考文献\n\
  \n- [[`arxiv.org/abs/2312.11914`](https://arxiv.org/abs/2312.11914)]\n- [[`arxiv.org/abs/2101.07714`](https://arxiv.org/abs/2101.07714)]\n\
  - [[`arxiv.org/abs/2101.07714`](https://arxiv.org/abs/2101.07714)]\n- [[`psycnet.apa.org/record/2014-07087-000`](https://psycnet.apa.org/record/2014-07087-000)]\n\
  - [[`www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109`](https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109)]\n\
  - [[`www.youtube.com/watch?v=TUmyygCMMGA`](https://www.youtube.com/watch?v=TUmyygCMMGA)]\n\
  \n# 9 探索 GPTs\n\n## 在 Discord 上加入我们的书籍社区\n\n![](img/file0.png)\n\n[[`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)]\n\
  \n在之前的几个章节中，我们看到了许多如何利用 ChatGPT 进行各种活动的示例，从个人生产力到营销，从研究到软件开发。对于这些场景中的每一个，我们总是面临着类似的情况：我们从像\
  \ ChatGPT 这样的通用模型开始，然后提出非常具体的问题或提供特定的参考，以定制以满足我们的特定需求。\n\n然而，如果我们的目标是为自己的用途获取一个极其专业化的模型，有时这可能是不够的。这就是为什么我们可能需要构建“特定用途的\
  \ ChatGPT”，而且幸运的是，OpenAI 本身开发了一个无代码平台来构建这些自定义助手，这些助手被称为 GPTs。\n\n在本章中，我们将详细介绍 GPTs\
  \ 的功能、能力和现实世界中的应用，涵盖了我们在之前的章节中看到的相同用例，以便你能够看到输出质量上的差异。此外，我们还将看到如何发布你的 GPT，并使其成为不仅适用于你自己，也适用于公司或所有人的生产应用。\n\
  \n在本章结束时，你将能够：\n\n- 理解什么是 GPT 以及它能完成什么样的任务\n- 在不编写任何代码的情况下构建你自己的 GPT\n- 发布你的 GPT\
  \ 并将其与外部系统集成\n\n让我们从一些基本定义开始，然后进入实践。\n\n## 技术要求\n\nChatGPT Plus\n\n## 什么是 GPTs？\n\
  \n2023 年 11 月，OpenAI 引入了 GPTs，这是 ChatGPT 的专用版本，旨在提高生产力并满足特定的任务和需求。与通用 ChatGPT 不同，这些自定义版本被称为\
  \ GPTs，允许用户在没有任何任何编码知识的情况下创建定制的 AI 模型。\n\n> 预先考虑分类法的考量是重要的，这在整个章节中都将相关。当我们提到 GPT\
  \ 这个词时，你在书中已经发现并将会发现两种主要定义：\n\n- 第一种是指 OpenAI 语言模型背后真正的“生成式预训练变换器”（`GPT`）模型架构。我们已经在第一部分提到过这种架构，并且知道这是\
  \ ChatGPT 本身背后的框架。\n- 第二种在更广义的情况下是指 OpenAI 允许用户以无代码方式创建的专用助手。通过 GPTs，OpenAI 指的是\
  \ ChatGPT 的专用版本，在这种语境下，单个 GPT 指你利用 GPTs 平台（所有 ChatGPT Plus 用户均可用）创建的一个助手。\n\n在本章中，每当你读到\
  \ `GPT` 或 `GPTs` 时，请记住我们使用的是第二种定义。\n\nGPTs 的理念就像 AI 代理（Agents）。事实上，通过 GPTs，我们正在构建由\
  \ LLM 驱动的实体，它们具有特定的指令，并提供了自定义知识库以及一组工具或插件来与周围环境交互。\n\n让我们详细查看所有这些组件。首先，你可以全面查看所有已公发布的\
  \ GPTs。要做到这一点，你可以访问以下页面：[`chatgpt.com/gpts`](https://chatgpt.com/gpts)。\n\n![图 1：GPTs\
  \ 落地页。](img/file147.png)\n\n如从前面的图片所示，这是所有 GPTs 的市场。你可以通过类别（`box 1`）或通过说明你寻找的内容（`box\
  \ 2`）来探索它。\n\n然后要创建你自己的 GPT，你可以进入 OpenAI 账户并点击左上角的 `Explore GPTs`，然后点击 `Create`（如\
  \ `box 3` 所示）。\n\n![图 2：从零创建你的 GPT 的编辑器页面。](img/file148.png)\n\n一旦进入编辑器，你将被要求配置你的\
  \ GPT，而在右侧你有机会进行实时测试。让我们探索所有组件：\n\n- **Name（名称）**：你给你的 GPT 起的名字。\n- **Description（描述）**：你的\
  \ GPT 功能的描述。如果你打算在市场发布你的 GPT，这非常重要，这样其他用户就可以轻松找到它（正如我们之前提到的，可以通过 Search GPTs 搜索栏通过自然语言搜索\
  \ GPTs）。\n- **Instructions（指令）**：这是你 GPT 的元提示（metaprompt），即用自然语言编写的指令，用于根据你的特定需求定制助手，且最终用户看不到。\n\
  - **Conversation Starters（对话启动器）**：一组示例提示词，用户可以使用它们开始与 GPT 交互并建立信心。\n- **Knowledge（知识）**：指的是我们可以为模型提供的自定义文档。当我们在这里上传文档时，我们的\
  \ GPT 将能够通过检索增强生成（RAG）模式遍历它，因此我们可以根据需要提供额外的知识，甚至将助手的回答限制在自定义知识库中。\n- **Capabilities（能力）**：这些指的是我们可以为\
  \ GPT 提供的一组内置插件，无需编写单行代码。你可以从上面的图中看到开箱即用的三个插件：\n    - Web browsing（网络浏览）用于搜索网络并获取最新信息。\n\
  \    - DALL-E 3 用于生成插图。\n    - Code Interpreter and Data Analysis（代码解释器和数据分析）用于在沙箱\
  \ Python 环境中执行代码并与分析文件交互。\n- **Actions（动作）**：动作也可以被视为插件，但它们与能力不同，因为它们不是内置的，而是由 GPT\
  \ 开发者指定的。例如，你可能会生成一个动作\n\n> 在动作的背景下，如果你点击 `Add Actions` 然后点击 `Get help from ActionsGPT`，你可以获得原生集成在配置面板中的专用\
  \ GPT 的支持。\n\n\n\n\n\n![](img/file149.png)![图 3: 如何从 ActionsGPT 获取支持的示例](img/file150.png)\n\
  \n图 3：如何从 ActionsGPT 获取支持的示例\n\n通过这种方式，你将被引导至你的 GPT 聊天界面：\n\n![图 4: ActionsGPT 的落地页。](img/file151.png)\n\
  \n图 4：ActionsGPT 的落地页。\n\n看到我们正在见证“GPT 内部 GPT”的方法，这种感觉很神奇，你不觉得吗？\n\n除了标准配置页外，还有另一种更具“对话性”的构建\
  \ GPT 的选项。事实上，你可以切换到 `Create`（创建）标签页，并用自然语言解释你想让 GPT 实现什么目标：\n\n![图 5: 从自然语言对话开始创建\
  \ GPT 的示例](img/file152.png)\n\n图 5：从自然语言对话开始创建 GPT 的示例。\n\n我们将在本章的后续章节中看到这两种方法——标准配置和对话式配置。\n\
  \n既然我们已经知道了什么是 GPT，让我们来看看如何创建一个。在接下来的几个章节中，我们将创建 5 个不同的 GPT：\n\n*   前四个将专注于我们已经用通用\
  \ ChatGPT 涵盖的四个领域——个人生产力、代码开发、营销和研究。其意图是比较特定领域 GPT 与通用 ChatGPT 的整体效率和准确性。\n*   第五个将涵盖一个新领域，与艺术创作相关。我们将利用内置的\
  \ `DALL-E` 插件以及由设计公司开发的其他插件（如 `Canvas`）。\n\n让我们从通过专门的 GPT 提升个人生产力开始。\n\n## 个人助手\n\
  \n在这种场景下，我们将构建一个 GPT 来增强我们的健身训练。为此，我们将利用内置插件。此外，我们还将添加一些相关文档，以便助手基于特定的知识库。\n\n我的目标是拥有一个助手，它可以根据我的健身目标、可用时间、性别、年龄、偏好等为我制定训练计划。我还希望助手能对其建议背后的原因提供清晰的解释。\n\
  \n为了实现这一切，我想确保我的助手能够：\n\n*   向我提问设计我我最佳训练所需的特定问题\n*   提供与其回复相关的相关信息和来源\n*   考虑我的反馈，但如果它认为对我是正确的，它将能够坚持自己的观点\n\
  *   如果我的请求不合理或对健康有风险，则不满足我的请求\n\n让我们按照上一节提到的所有配置步骤来看如何创建我们的 GPT：\n\n1.  **Name (名称)**：我将我的助手命名为\
  \ `WorkoutGPT`。\n2.  **Description (描述)**：这是我设置的描述：“帮助用户根据需求设计训练计划的健身助手。”\n3.  **Instructions\
  \ (指令)**：这里是我们 GPT 的真正核心。这是我提供 GPT 的指令集：\n\n*“你是一个健身 AI 助手，根据用户的需求帮助他们创建训练计划。*\n\
  \n*在生成计划之前，请确保询问以下问题：*\n\n*- 健身目标和时间预期*\n\n*- 年龄和性别*\n\n*- 健身水平*\n\n*- 训练的可用时间*\n\
  \n*- 为了制定合理的训练计划所需的其他所有元素（例如设备、潜在受伤情况……）*\n\n*如有需要，使用提供的文档来丰富你的回答。*\n\n*如果用户建议了某些不符合其目标，请坚持你的假设，并礼貌地解释背后的原因。*\n\
  \n*如果用户询问了可能对其健康产生风险的问题，请礼貌地建议放轻松并提供替代方案，同时解释背后的原因。”*\n\n1.  **Conversation Starters\
  \ (对话启动器)**：在这里我设置了三个不同训练示例：\n\n    *   我想在 6 个月后参加马拉松。\n    *   生成一个 30 分钟的无设备\
  \ HIIT 训练计划。\n    *   生成一个仅需哑铃的 45 分钟举重训练计划。\n2.  **Knowledge (知识)**：在这里我上传了标准的国家力量与调节协会\
  \ (`NSCA`) 训练负荷表，这是一个帮助运动员和教练确定不同练习和训练课程适当负荷的工具。它看起来像：\n\n![图 6: NSCA 训练负荷表。来源：https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf](img/file153.png)\n\
  \n图 6：NSCA 训练负荷表。来源：https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf\n\
  \n我几乎忘记了一个关键步骤——插图！这看起来可能很表面，但为你的 GPT 设置图标会让它更有吸引力，特别是如果你计划将其发布给所有用户。幸运的是，我们在配置面板中直接集成了\
  \ `DALL-E`：\n\n![图 7: 如何设置你的 GPT 图标的示例](img/file154.png)\n\n图 7：如何设置你的 GPT 图标的示例。\n\
  \n配置看起来是这样的：\n\n![图 8: WorkoutGPT 配置页面](img/file155.png)\n\n图 8：WorkoutGPT 配置页面。\n\
  \n太棒了！现在让我们一些示例对话。\n\n首先，让我们选择关于马拉松的对话启动器：\n\n![图 9: GPT 评估用户整体目标和健身水平的问题示例](img/file156.png)\n\
  \n图 9：GPT 评估用户整体目标和健身水平的问题示例。\n\n正如你所看到的，我们的 `WorkoutGPT` 会立即询问所需的信息。一旦提供了上述信息，我的助手生成了以下计划（此处输出被截断）：\n\
  \n![图 10: 为马拉松训练生成的训练表示例](img/file157.png)\n\n图 10：为马拉松训练生成的训练表示例。\n\n此外，它如下指定了周五的力量训练：\n\
  \n![图 11: GPT 生成的力量训练示例](img/file158.png)\n\n图 11：GPT 生成的力量训练示例。\n\n让我们关注力量训练。我想更好地了解如何调整重量。下面的插图显示了回复的第一部分：\n\
  \n![图 12: GPT 解释如何在力量训练中确定重量的示例](img/file159.png)\n\n图 12：GPT 解释如何在力量训练中确定重量的示例。\n\
  \n在同一个回复中，助手还引用了作为知识库提供的 `NSCA` 训练负荷表：\n\n![图 13: GPT 从自定义知识库检索信息的示例](img/file160.png)\n\
  \n图 13：GPT 从自定义知识库检索信息的示例。\n\n现在我想挑战我的 `WorkoutGPT`，请求一些可能对我健康有害的东西。例如，在一个月内在没有任何经验的情况下准备马拉松显然是一个糟糕的主意。一旦我提供了其启动问题的答案列表，让我们看看我的助手对此的看法：\n\
  \n![图 14: 考虑到与请求相关的风险，礼婉地引导用户改变目标和预期的示例](img/file161.png)\n\n图 14：考虑到与请求相关的风险，礼婉地引导用户改变目标和预期的示例。\n\
  \n正如你所看到的，我们的 `WorkoutGPT` 正在引导我们改变比赛方法。虽然它仍然为我们提供为期 3 周的跑步训练计划（此处输出被截断），但其目标不是在\
  \ 3 小时 15 分钟内完赛马拉松，而是增强耐力和力量。\n\n注意，如果我们向通用 ChatGPT 提问相同的问题，它的回复将如下：\n\n\n\n\n\n\
  ![图 15：ChatGPT 在存在相关风险的情况下仍完成用户任务的示例。](img/file162.png)\n\n图 15：ChatGPT 在存在相关风险的情况下仍完成用户任务的示例。\n\
  \n请注意，尽管 ChatGPT 口头上头上表达了顾虑，但它仍然在配合我的请求，为我提供了一份运行全程马拉松的计划。这可能会鼓励我——一个认为跑马拉松是个笑话的鲁莽初学者——投身于这场愚蠢的冒险，并对我的健康造成严重后果。\n\
  \n总的来说，GPTs 允许你非常具体地规定助手应该如何行为，以及它应该避免说什么或满足什么要求。\n\n# 代码助手\n\n在这一节中，我想开发一个专为数据科学项目定制的助手。更具体地说，我希望我的助手能够：\n\
  \n* 根据用户的任务，就如何设置数据科学实验提供清晰的指导\n* 生成运行该实验所需的 `Python` 代码\n* 利用 `code interpreter`（代码解释器）能力来运行和检查代码\n\
  * 将最终代码推送到 `GitHub` 仓库。\n\n让我们逐步查看如何实现。\n\n### 1. 设置指令\n\n这个 `GPT` 是一个数据科学助手，帮助用户设置和运行数据科学实验。它提供了如何设置和运行数据科学实验的指导。它提供了如何组织实验的清晰指导，生成运行实验所需的\
  \ `Python` 代码，并利用 `code interpreter` 能力来运行和检查代码。`GPT` 将接收用户的输入并执行代码，并将最终代码推送到 `GitHub`\
  \ 仓库。\n\n### 2. 设置（可选）提示词\n\n* *我如何设置实验？*\n* *生成 `Python` 代码模型。*\n* *你能帮我设置吗？*\n\
  \n### 3. 启用代码解释器与数据分析\n\n![图 16：启用代码解释器与数据分析。](img/file163.png)\n\n图 16：启用代码解释器与数据分析。\n\
  \n### 4. 创建 GitHub 的 Action\n\n> 为了与 GitHub 交互，我们需要 `Schema`（架构）。\n\n#### 定义架构的步骤\n\
  \n1. **数据（Data）**：确定数据类型。\n2. **属性（Properties）**：`Schema` 架构下的字段。\n3. **必填字段（Required\
  \ fields）**：`Schema` 架构中的必填项。\n4. **响应（Responses）**：`Schema` 架构的响应。\n\n考虑以下示例：\n\
  \n```yaml\nopenapi: 3.0\ninfo:\n  title: ChatGPT API\n  description: GitHub action\n\
  \  version: 1.0\nservers:\n  - url: https://api.github.com\n    description: GitHub\
  \ server\npaths:\n  /repos/{owner}/{repository}/contents/{path}:\n    put:\n   \
  \   operationId: updateFile\n      summary: 在仓库中更新文件\n      description: 使用此端点创建或更新文件。\n\
  \      parameters:\n        - name: owner\n          in: path\n          required:\
  \ true\n          description: 仓库的所有者。\n          schema:\n            type: string\n\
  \        - name: repository\n          in: path\n          required: true\n    \
  \      description: 仓库名称。\n          schema:\n            type: string\n       \
  \ - name: path\n          in: path\n          required: true\n          description:\
  \ 仓库中的文件路径。\n          schema:\n            type: string\n      requestBody:\n \
  \       required: true\n        content:\n          application/json:\n        \
  \    schema:\n              type: object\n              properties:\n          \
  \      message:\n                  type: string\n                  description:\
  \ 文件的提交消息。\n                content:\n                  type: string\n         \
  \         description: 新文件内容，Base64 编码。\n                sha:\n                \
  \  type: string\n                  description: 被替换文件的 SHA（如果是更新）。\n           \
  \     branch:\n                  type: string\n                  description: 创建更新文件的分支。\n\
  \                committer:\n                  type: object\n                  properties:\n\
  \                    name:\n                      type: string\n               \
  \     email:\n                      type: string\n              required:\n    \
  \            - message\n                - content\n      responses:\n        '200':\n\
  \          description: 文件更新或创建成功。\n        '201':\n          description: 文件创建成功。\n\
  \        '422':\n          description: 验证失败或文件已存在。\n      security:\n        -\
  \ bearerAuth: []\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type:\
  \ http\n      scheme: bearer\n      bearerFormat: token\n```\n\n这是 GitHub Action\
  \ 的配置：\n\n![图 17：GitHub Action 的配置。](img/file164.png)\n\n图 17：GitHub Action 的配置。\n\
  \n为了允许 Action 与我的仓库通信，我在 GitHub 个人设置（Settings > Developer settings > Personal access\
  \ token）中创建了一个个人访问令牌。\n\n然后，你可以按照如下方式测试连接：\n\n\n\n\n太棒了！如你所见，我们现在有一个包含预定义内容的新文件。\n\
  \n现在让我们创建并测试它：\n\n*   让我们先从一个关于如何设置分类实验的简单问题开始（截断输出）：\n\n    ![图 20：DataScience\
  \ Assistant 提供如何处理分类问题的指导示例。](img/file167.png)\n\n    图 20：DataScience Assistant\
  \ 提供如何处理分类问题的指导示例。\n\n*   按照这些指令，我们现在准备好设置我们的实验了。我们想要处理著名的泰坦尼号乘客生还预测问题。我们将上传数据集（你可以在网上找到很多免费版本，我在\
  \ [`github.com/datasciencedojo/datasets/blob/master/titanic.csv`](https://github.com/datasciencedojo/datasets/blob/master/titanic.csv)\
  \ 下载了我的数据），并利用 `Logistic Regression` 模型。\n\n    > 泰坦尼号生还预测任务是数据科学和机器学习中的一个经典问题。其目标是根据年龄、性别、客舱等级、票价等各种特征，预测泰坦尼号上的乘客是否会存活。这项通常用于教学分类技术，即在标记的数据集上训练模型，然后用于预测新数据的结果。挑战在于选择相关特征、处理缺失数据以及选择合适的机器学习算法以实现准确的预测。\n\
  \n*   这是我的查询：\n\n![图 21：DataScience Assistant 设计泰坦尼号生还实验的示例。](img/file168.png)\n\
