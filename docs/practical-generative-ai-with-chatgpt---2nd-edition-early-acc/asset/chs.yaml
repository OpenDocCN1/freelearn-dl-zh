  \ 上传的文件。\n\n它成功了！再次，这是 GPTs 如何提高开发人员和数据科学家效率的示例。通过遵循通用框架设计数据科学实验并启用无需切换到 GitHub\
  \ 即可推送的工作流，可以节省以前的时间，让数据科学家能够专注于项目的核心方面。\n\n## 营销助手\n\n正如我们在第 6 章——“使用 ChatGPT 精通营销”中所看到的，AI\
  \ 助手在这一领域具有极高的价值。事实上，生成文本内容——如社交媒体帖子、博客文章或营销活动——可能是这些模型表现最佳的活动。\n\n> 文案撰稿人员是专长撰写有说服力且吸引人的内容的专业，通常用于营销和广告目的。他们的工作通常包括编写促销材料，如广告、折页、网站、电子邮件、社交媒体帖子以及其他形式的内容，旨在说服观众采取特定行动，例如购买或订阅服务。\n\
  \n在本节中，我们将创建一个为此类活动定制的文案写作助手。为此，我将我的助手命名为 `Copywrite Companion`，并设置了以下配置组件：\n\n\
  *   指令（Instructions）：\n\n    `Copywrite Companion 是一个多功能助手，旨在帮助用户完成各种写作任务。它擅长根据用户输入生成产品表（包括文本和图像）、策划用于通讯或营销目的邮件活动、为新产品创建吸引人的视觉效果，以及为不同平台编写社交媒体帖子。它确保内容具有说服力、吸引力并符合目标受众，有效推广产品或服务。助手会根据需求调整风格，并在所有输出中追求创意、清晰和相关性。它以轻松、友好的语气进行交流，让互动感到亲切自然。`\n\
  \n*   对话启动词（Conversation starters）：\n\n    `你能为我的新产品写描述吗？`\n\n    `我需要为关于登山的文章起一个引人的标题`\n\
  \n    `给我几个关于跑步的博客文章的想法`\n\n*   能力（Capabilities）：\n\n![图 31：Copywrite Companion\
  \ 开启的插件。](img/file178.png)\n\n图 31：Copywrite Companion 开启的插件。\n\n让我们来看看实际效果：\n\n\
  *   我首先让它根据提供的图片编写一份产品表（输出截断）：\n\n    ![图 32：Copywrite Companion 生成产品描述的示例。](img/file179.png)\n\
  \n    图 32：Copywrite Companion 生成产品描述的示例。\n\n*   作为文案，我们可能想将这些信息插入到更有结构的存储库中，例如\
  \ Excel 文件。让我们要求助手这样做，利用它的代码解释器插件：\n\n    ![图 33：Copywrite Companion 利用代码解释器插件将之前的响应转换为\
  \ 文件的示例。](img/file180.png)\n\n    图 33：Copywrite Companion 利用代码解释器插件将之前的响应转换为 文件的示例。\n\
  \n*   这就是最终结果：\n\n![图 34：Copywrite Companion 生成的文件。](img/file181.png)\n\n图 34：Copywrite\
  \ Companion 生成的文件。\n\n现在让我们让助手为我们的鞋子生成一条 Instagram 帖子：\n\n\n\n\n如你所见，助手还提出了一个图像描述以利用\
  \ `DALL-E` 插件。由于这个描述在我看来合理，我将要求它生成图像：\n\n![图 36：Copywrite Companion 利用 DALL-E 插件生成图像的示例](img/file183.png)\n\
  图 36：Copywrite Companion 利用 DALL-E 插件生成图像的示例。\n\n最后，我想了解一下竞争对手品牌——如 `Nike` 和 `Adidas`——是如何进行营销活动的。为了实现这一目标，我将要求我的助手从网络上收集一些证据：\n\
  \n![图 37：Copywrite Companion 利用网页浏览插件进行竞争分析的示例](img/file184.png)\n图 37：Copywrite\
  \ Companion 利用网页浏览插件进行竞争分析的示例。\n\n如你所见，我们的助手正确地利用了网页浏览插件来检索所需的信息。此外，它还为我们提供了强大的洞察，让我们了解这两家竞争公司正在投入哪些杠杆，以便我们思考（或询问我们的助手）独特的差异化优势，让我们的品牌在竞争激的市场中脱颖而出。\n\
  \n我们还可以更进一步，利用代码解释器和数据分析插件获取有关竞争更具体的见解。例如，假设我们收集了一个具有以下结构的 Excel 表格：\n\n![图 38：Excel\
  \ 表格上的竞争分析](img/file185.png)\n图 38：Excel 表格上的竞争分析。\n\n现在我们想从中生成一些可视化图表。让我们我们的 `Copywriter\
  \ Companion` 来这样做吧：\n\n![图 39：Copywrite companion 生成柱状图和散点图的示例](img/file186.png)\n\
  图 39：Copywrite companion 生成柱状图和散点图的示例。\n\n![图 40：Copywrite companion 生成折线图的示例](img/file187.png)\n\
  图 40：Copywrite companion 生成折线图的示例。\n\n包括按照要求的执行报告：\n\n![图 41：Copywrite companion\
  \ 生成执行报告的示例](img/file188.png)\n图 41：Copywrite companion 生成执行报告的示例。\n\n总的来说，针对营销活动对\
  \ ChatGPT 进行定制化，在生成新内容、设计营销策略以及在网络上进行竞争分析方面是非常有用的。\n\n## 研究助手\n\n在这一场景中，我们将再次关注研究，但这次将特别关注论文的检索。更具体地说，我们希望我们的助手能够执行以下操作：\n\
  \n*   从我们提供的自定义知识库中检索信息\n*   将自定义文档与仅来自 `Arxiv` 的论文相结合，并为此项任务启用网页插件\n*   从 `Database`（在我们的情况下，它将托管在\
  \ `Notion` 中）检索其他研究人员正在进行的工作，这样我们就不会冒着撰写他人涵盖的文章的风险。\n\n让我们来看看所有的步骤。\n\n1. **上传自定义文档。**\
  \ 出于目的，我将使用两篇关于机器学习中图像分类的论文：来自 `J. Bird` 等人的“CIFAKE: AI 生成合成图像的图像分类与可解释性识别”，以及来自\
  \ `Khalis` 等人的“图像分类任务中视觉变换器（Vision Transformers）的综合研究”。\n\n你可以在配置面板的相应部分上传这些文件：\n\
  \n![图 42：在配置面板中上传自定义文档](img/file189.png)\n图 42：在配置面板中上传自定义文档。\n\n2. **将自定义文档与网络引用整合。**\
  \ 为了实现这一点，我们需要启用网页插件：\n\n![图 43：在配置面板中启用网页浏览插件](img/file190.png)\n图 43：在配置面板中启用网页浏览插件。\n\
  \n此外，我们还需要指定助手仅导航通过 `Arxiv` 存档。我们将在创建的指令集中查看如何指定该内容。\n\n3. **从 Notion 数据库检索信息。**\
  \ 这里的想法是，作为研究人员，我们可能会提出一些已经在由其他同事研究和开发的想法。假设我们在具有以下结构的 `Notion Database`（Not 数据库）中跟踪所有正在进行的研究：\n\
  \n![图 44：Notion 数据库结构。](img/file191.png)\n图 44：Notion 数据库结构。\n\n为了实现这一点，我们需要创建 `GPT\
  \ actions`（GPT 操作）。为此需要遵循两个步骤：\n\n1.  在你的 `Notion workspace` 中，你需要创建一个标记为内部（internal）的新连接，并创建一个新的\
  \ `Internal Integration Secret`（或 `API key`）。你可以将此连接命名为 `chatgpt` 或类似的名称。\n2.  在你的\
  \ `GPT configuration pane` 中，你需要设置一个新的 `Action` 架构（schema）。由于在我们的情况下我们需要查询特定的 `Database`，架构如下：\n\
  3.  涉及到身份验证时，你可以点击“Authentication”（认证）并选择“API Key”。输入以下信息：\n    *   `API Key`：使用来自\
  \ `Notion` 中新创建连接的 `Internal Integration Secret`\n    *   `Auth Type`：`Bearer`\n\
  \n![图 45：Notion Action Schema。](img/file192.png)\n图 45：Notion Action Schema。\n\n\
  整个架构的样貌如下：\n\n```\nopenapi: 3.1.0\ninfo:\n  title: Notion API\n  description: 与\
  \ Notion 页面、数据库和用户交互的 API。\n  version: 1.0.0\nservers:\n  - url: https://api.notion.com/v1\n\
  \    description: Main API server\npaths:\n  /databases/{database_id}/query:\n \
  \   post:\n      operationId: queryDatabase\n      summary: 查询数据库\n      parameters:\n\
  \        - name: database_id\n          in: path\n          required: true\n   \
  \       schema:\n            type: string\n        - name: Notion-Version\n    \
  \      in: header\n          required: true\n          schema:\n            type:\
  \ string\n          example: 2022-06-28\n          constant: 2022-06-28\n      requestBody:\n\
  \        required: true\n        content:\n          application/json:\n       \
  \     schema:\n              type: object\n              properties:\n         \
  \       filter:\n                  type: object\n                sorts:\n      \
  \            type: array\n                  items:\n                    type: object\n\
  \                start_cursor:\n                  type: string\n               \
  \ page_size:\n                  type: integer\n      responses:\n        '200':\n\
  \          description: 成功响应\n          content:\n            application/json\n\
  \              schema:\n                type: object\n                properties:\n\
  \                  object:\n                    type: string\n                 \
  \ results:\n                    type: array\n                    items:\n      \
  \                type: object\n                  next_cursor:\n                \
  \    type: string\n                  has_more:\n                    type: boolean\n\
  ```\n\n太好了，现在我们已经准备好了所有的素材，我们需要设置系统消息（system message）以及可选的对话启动器。在这种场景中，我设置了以下指令：\n\
  \n你是一个 AI 研究助手，任务是利用各种工具和资源帮助研究人员。你的主要职责包括从自定义知识库、Arxiv 学术论文以及存储在 Notion 数据库中的正在进行的项目检索、整合和交叉引用信息。遵循这些指南以确保你的帮助准确、全面并避免重复：\n\
  \n* 始终基于提供的文档回答\n* 如果你觉得需要，可以扩展网络搜索。你可以导航的唯一网站是 Arxiv。\n* 如果用户询问，检查该主题是否已经在 Notion\
  \ DB 中涵盖。\n\n以及以下对话启动器：\n\n*   VGGNet、ResNet 和 Inception 在图像分类的准确性和效率方面有何区别？\n*\
  \ 图像分类模型面临哪些挑战？数据增强和迁移学习等技术如何帮助它们？\n\n\n\n\n\n## 3. CNN 深度如何影响图像分类？ResNet 的残差连接又是何帮助？\n\
  \n最终效果如下：\n\n![图 46：我们的 ResearchGPT 落地页](img/file193.png)\n图 46：我们的 ResearchGPT\
  \ 落地页\n\n让我们测试一下：\n\n1. 我首先会问一个通用问题，并将根据提供的论文进行回答：\n   ![图 47：ResearchGPT 从提供的文档检索知识的示例](img/file194.png)\n\
  \   图 47：ResearchGPT 从提供的文档检索知识的示例\n\n2. 接着，我想看看该主题是否已经被涵盖：\n   ![图 48：ResearchGPT\
  \ 使用预定义动作与 Notion 通信的示例](img/file195.png)\n   图 48：ResearchGPT 使用预定义动作与 Notion 通信的示例\n\
  \n3. 最后，我想整合该主题使其使其独特性：\n   ![图 49：ResearchGPT 使用浏览器插件的示例](img/file196.png)\n图 49：ResearchGPT\
  \ 使用浏览器插件的示例\n\n如你所见，我们的助手可以利用我们提供的所有工具，并在需要时调用 `Notion DB`。\n\n## 总结\n\n在本章中，我们探索了如何获取定制的\
  \ GPTs 来实现你的特定目标。定制 `ChatGPT` 的可能性开启了全新的场景图景，高度专业的 AI 助手将成为专业人士的日常伙伴。此外，OpenAI 还提供了一个无代码界面来创建\
  \ GPTs，使得所有开发者不仅能够从扩展的可用解决方案市场中受益，还能从自己的创作中受益。\n\n凭借插件扩展性和自定义知识库，自定义 GPTs 可以为你完成无限任务。然后，通过添加强大的动作（actions），它们还可以与周围环境通信，并从“仅仅”生成进化为自动化。\n\
  \n通过本章，我们也结束了本书的第二部分，该部分重点关注 `ChatGPT` 的实际应用。从下一章开始，我们将详细详细介绍大型企业如何利用 OpenAI 模型将其嵌入到业务流程中。我们将涵盖流行的企业用例，并展示如何通过\
  \ `REST API` 将 OpenAI 的大语言模型（LLMs）嵌入到应用程序中的实际实现方法。\n\n## 参考文献\n\n- [`arxiv.org/abs/2312.11914`](https://arxiv.org/abs/2312.11914)\n\
