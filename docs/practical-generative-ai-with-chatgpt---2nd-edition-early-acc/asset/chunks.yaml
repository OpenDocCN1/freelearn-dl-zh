    # 在 ChatGPT 中避免隐藏偏见风险并考虑伦理考量


    ChatGPT 提供了 `Moderator API`，使其使其不会参与可能不安全的对话。`Moderator API` 是一个基于 GPT 模型的分类模型，涵盖了以下几类：暴力、自残、仇恨、骚扰和性。为此，OpenAI
    使用了匿名数据和合成数据（以零样本形式）来创建合成数据。


    `Moderation API` 基于 OpenAI API 中提供的更复杂的内容过滤模型版本。我们在*第 1 章*中讨论过该模型，当时看到它对假误报的处理非常保守，而不是对漏报如此保守。


    然而，存在一种我们可以称之为`隐藏偏见`的现象，它直接源于模型训练的知识库。例如，关于 `GPT-3` 的主要训练数据块 `Common Crawl`，专家们认为它主要由西方国家的白男性编写。如果确实如此，我们已经面临着模型的隐藏偏见，这将不可避免地模仿一个有限且缺乏代表性的人类类别。


    在《Languages Models are Few-Shots Learners》论文中，OpenAI 的研究人员 Tom Brown 等人（[`arxiv.org/pdf/2005.1416`](https://arxiv.org/pdf/2005.1416)）创建了一个实验设置，以调查
    `GPT-3` 中的种族偏见。模型被提示包含种族类别的短语，并为每个类别生成了 800 个样本。使用 `Senti WordNet` 根据词汇共现衡量了生成文本的情感，评分范围从
    -100 到 100（正分表示正性词汇，反之亦然）。


    结果显示，与每个种族类别相关的情感在不同模型之间存在差异，亚洲人始终具有高情感，而黑人始终具有低情感。作者警告说，结果反映了实验设置，社会历史因素可能会影响与不同人口统计相关的情感。该研究强调了对情感、实体和输入数据之间关系进行更复杂分析的性：


    ![图 4.14 – 跨模型的种族情感](img/file54.png)


    图 4.14 – 跨模型的种族情感


    这种隐藏偏见可能会产生不符合负责任 AI 原则的有害响应。


    然而，值得注意的是，ChatGPT 以及所有 OpenAI 模型都在不断改进中。这与 OpenAI 的`AI 对齐`（[`openai.com/alignment/`](https://openai.com/alignment/））是一致的，其研究重点是训练
    AI 系统变得有帮助、诚实且安全。


    例如，如果我们要求 ChatGPT 根据人的性别和种族进行猜测，它不会满足这一具体请求，而是提供我们假设性的功能以及巨大的免责声明：


    ![图 4.15 – GPT-4o 随时间改进的示例，因为它提供了无偏见的响应](img/file55.png)


    图 4.15 – GPT-4o 随时间改进的示例，因为它提供了无偏见的响应


    总而言，尽管伦理原则领域在不断改进，但在使用 ChatGPT 时，我们应该始终确保输出符合这些原则且没有偏见。


    ChatGPT 和 OpenAI 模型中的偏见和伦理概念在负责任 AI 的整个主题中有更广泛的关联，我们将在本书的最后一章关注这一点。


    ## 总结


    在本章中，我们深入探讨了提示设计（prompt design）和工程的概念，因为这是控制 ChatGPT 以及通用大语言模型（LLMs）输出的最强大方式。我们学习了如何利用不同层次的样本学习（shot
    learning）来使 LLMs 更符合我们的目标。


    我们从介绍提示工程的概念及其重要性开始，然后转向基本原则——包括清晰的指令、要求提供理由等。


    然后，我们转向了更高级的技术，这些技术旨在塑造我们 LLM 的推理方法：少样本学习、`CoT` 和 `ReAct`。


    提示工程是一门新兴学科，它正在为注入 LLM 的新类别应用程序铺平道路。在接下来的章节中，我们将看到这些技术如何在构建 LLMs 的真实应用中投入。


    从下一章开始，我们将深入探讨 ChatGPT 可以提高生产力并对我们今天的工作方式产生破坏性影响的不同领域。


    ## 参考文献


    以下是本章的参考文献：


    *   [`arxiv.org/abs/2005.14165`](https://arxiv.org/abs/2005.14165)

    *   [`dl.acm.org/doi/10.1145/3442188.3445922`](https://dl.acm.org/doi/10.1145/3442188.3445922)

    *   [`openai.com/alignment/`](https://openai.com/alignment/)

    *   [`twitter.com/spiantado/status/1599462375887114240?ref`](https://twitter.com/spiantado/status/1599462375887114240?ref)

    *   ReAct approach. [`arxiv.org/abs/2210.03629`](https://arxiv.org/abs/2210.03629)

    *   Chain of Thoughts approach. [`arxiv.org/abs/2201.11903`](https://arxiv.org/abs/2201.11903)


