  trans: "\n请注意，我们仅关注了 ChatGPT 可以支持研究人员的一小部分活动。在研究领域还有许多其他活动可以从 ChatGPT 的支持中受益，其中我们可以提到的数据收集、研究参与者招募、研究网络建立、公众参与等。\n\
    \n将此工具整合到工作中的研究人员可以从其多功能和节省时间的特性中受益，最终带来更有影响力的研究成果。\n\n然而，重要的是记住，ChatGPT 仅仅是一个工具，应该结合专家知识和判断来使用。与任何研究项目一样，必须对研究问题和研究设计进行仔细考虑，以确保结果的有效性和可靠性。\n\
    \n通过本章，我们也结束了本书的第二部分，该部分重点关注了你可以利用 ChatGPT 的广泛场景和领域。然而，我们主要关注个人或小团队的使用，从个人生产力到研究辅助等。从第三部分开始，我们将讨论提升到大型组织如何利用\
    \ Microsoft Azure 云上提供的 OpenAI 模型 API，将 ChatGPT 背后的相同生成式 AI 用于企业级项目。\n\n## 参考文献\n\
    \n- [[`arxiv.org/abs/2312.11914`](https://arxiv.org/abs/2312.11914)]\n- [[`arxiv.org/abs/2101.07714`](https://arxiv.org/abs/2101.07714)]\n\
    - [[`arxiv.org/abs/2101.07714`](https://arxiv.org/abs/2101.07714)]\n- [[`psycnet.apa.org/record/2014-07087-000`](https://psycnet.apa.org/record/2014-07087-000)]\n\
    - [[`www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109`](https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109)]\n\
    - [[`www.youtube.com/watch?v=TUmyygCMMGA`](https://www.youtube.com/watch?v=TUmyygCMMGA)]\n\
    \n# 9 探索 GPTs\n\n## 在 Discord 上加入我们的书籍社区\n\n![](img/file0.png)\n\n[[`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)]\n\
    \n在之前的几个章节中，我们看到了许多如何利用 ChatGPT 进行各种活动的示例，从个人生产力到营销，从研究到软件开发。对于这些场景中的每一个，我们总是面临着类似的情况：我们从像\
    \ ChatGPT 这样的通用模型开始，然后提出非常具体的问题或提供特定的参考，以定制以满足我们的特定需求。\n\n然而，如果我们的目标是为自己的用途获取一个极其专业化的模型，有时这可能是不够的。这就是为什么我们可能需要构建“特定用途的\
    \ ChatGPT”，而且幸运的是，OpenAI 本身开发了一个无代码平台来构建这些自定义助手，这些助手被称为 GPTs。\n\n在本章中，我们将详细介绍\
    \ GPTs 的功能、能力和现实世界中的应用，涵盖了我们在之前的章节中看到的相同用例，以便你能够看到输出质量上的差异。此外，我们还将看到如何发布你的 GPT，并使其成为不仅适用于你自己，也适用于公司或所有人的生产应用。\n\
    \n在本章结束时，你将能够：\n\n- 理解什么是 GPT 以及它能完成什么样的任务\n- 在不编写任何代码的情况下构建你自己的 GPT\n- 发布你的 GPT\
    \ 并将其与外部系统集成\n\n让我们从一些基本定义开始，然后进入实践。\n\n## 技术要求\n\nChatGPT Plus\n\n## 什么是 GPTs？\n\
    \n2023 年 11 月，OpenAI 引入了 GPTs，这是 ChatGPT 的专用版本，旨在提高生产力并满足特定的任务和需求。与通用 ChatGPT\
    \ 不同，这些自定义版本被称为 GPTs，允许用户在没有任何任何编码知识的情况下创建定制的 AI 模型。\n\n> 预先考虑分类法的考量是重要的，这在整个章节中都将相关。当我们提到\
    \ GPT 这个词时，你在书中已经发现并将会发现两种主要定义：\n\n- 第一种是指 OpenAI 语言模型背后真正的“生成式预训练变换器”（`GPT`）模型架构。我们已经在第一部分提到过这种架构，并且知道这是\
    \ ChatGPT 本身背后的框架。\n- 第二种在更广义的情况下是指 OpenAI 允许用户以无代码方式创建的专用助手。通过 GPTs，OpenAI 指的是\
    \ ChatGPT 的专用版本，在这种语境下，单个 GPT 指你利用 GPTs 平台（所有 ChatGPT Plus 用户均可用）创建的一个助手。\n\n\
    在本章中，每当你读到 `GPT` 或 `GPTs` 时，请记住我们使用的是第二种定义。\n\nGPTs 的理念就像 AI 代理（Agents）。事实上，通过\
    \ GPTs，我们正在构建由 LLM 驱动的实体，它们具有特定的指令，并提供了自定义知识库以及一组工具或插件来与周围环境交互。\n\n让我们详细查看所有这些组件。首先，你可以全面查看所有已公发布的\
    \ GPTs。要做到这一点，你可以访问以下页面：[`chatgpt.com/gpts`](https://chatgpt.com/gpts)。\n\n![图\
    \ 1：GPTs 落地页。](img/file147.png)\n\n如从前面的图片所示，这是所有 GPTs 的市场。你可以通过类别（`box 1`）或通过说明你寻找的内容（`box\
    \ 2`）来探索它。\n\n然后要创建你自己的 GPT，你可以进入 OpenAI 账户并点击左上角的 `Explore GPTs`，然后点击 `Create`（如\
    \ `box 3` 所示）。\n\n![图 2：从零创建你的 GPT 的编辑器页面。](img/file148.png)\n\n一旦进入编辑器，你将被要求配置你的\
    \ GPT，而在右侧你有机会进行实时测试。让我们探索所有组件：\n\n- **Name（名称）**：你给你的 GPT 起的名字。\n- **Description（描述）**：你的\
    \ GPT 功能的描述。如果你打算在市场发布你的 GPT，这非常重要，这样其他用户就可以轻松找到它（正如我们之前提到的，可以通过 Search GPTs 搜索栏通过自然语言搜索\
    \ GPTs）。\n- **Instructions（指令）**：这是你 GPT 的元提示（metaprompt），即用自然语言编写的指令，用于根据你的特定需求定制助手，且最终用户看不到。\n\
    - **Conversation Starters（对话启动器）**：一组示例提示词，用户可以使用它们开始与 GPT 交互并建立信心。\n- **Knowledge（知识）**：指的是我们可以为模型提供的自定义文档。当我们在这里上传文档时，我们的\
    \ GPT 将能够通过检索增强生成（RAG）模式遍历它，因此我们可以根据需要提供额外的知识，甚至将助手的回答限制在自定义知识库中。\n- **Capabilities（能力）**：这些指的是我们可以为\
    \ GPT 提供的一组内置插件，无需编写单行代码。你可以从上面的图中看到开箱即用的三个插件：\n    - Web browsing（网络浏览）用于搜索网络并获取最新信息。\n\
    \    - DALL-E 3 用于生成插图。\n    - Code Interpreter and Data Analysis（代码解释器和数据分析）用于在沙箱\
    \ Python 环境中执行代码并与分析文件交互。\n- **Actions（动作）**：动作也可以被视为插件，但它们与能力不同，因为它们不是内置的，而是由\
    \ GPT 开发者指定的。例如，你可能会生成一个动作\n\n> 在动作的背景下，如果你点击 `Add Actions` 然后点击 `Get help from\
    \ ActionsGPT`，你可以获得原生集成在配置面板中的专用 GPT 的支持。\n\n"
- fmt: "\n![](media/file149.png)![Figure 3: Example on how to get support from ActionsGPT](media/file150.png)\n\
    \nFigure 3: Example on how to get support from ActionsGPT\n\nBy doing so, you\
    \ will be prompted to the chat interface of your GPT:\n\n![Figure 4: Landing page\
    \ of ActionsGPT.](media/file151.png)\n\nFigure 4: Landing page of ActionsGPT.\n\
    \nIt’s amazing to see how we are witnessing “GPTs inside GPTs” approaches, don’t\
    \ you think?\n\nIn addition to the standard configuration page, there is another\
    \ option to build your GPT in a more “conversational way”. In fact, you can switch\
    \ to the tab `Create` and explain in natural language what you want to achieve\
    \ with your GPT:\n\n![Figure 5: Creating a GPT starting from a conversation in\
    \ natural language.](media/file152.png)\n\nFigure 5: Creating a GPT starting from\
    \ a conversation in natural language.\n\nWe will see both methods – standard configuration\
    \ and conversational configuration – in the practical paragraphs of this chapter.\n\
    \nNow that we know what a GPT is, let’s see how to create one. Over the next sections,\
    \ we will create 5 different GPTs:\n\n*   The first four will specialize in the\
    \ four domains we already covered with the general-purpose ChatGPT – personal\
    \ productivity, code development, marketing and research. The idea is that to\
    \ compare the overall efficiency and accuracy of a domain-specific GPT versus\
    \ a general-purpose ChatGPT.\n*   The fifth one will cover a new domain, related\
    \ to artistic creativity. We will leverage the built-in `DALL-E` plug-in as well\
    \ as other plug-ins developed by design companies (like `Canvas`).\n\nLet’s start\
    \ with boosting our personal productivity with a specialized GPT.\n\n## Personal\
    \ Assistant\n\nIn this scenario, we are going to build a GPT to boost our gym\
    \ workouts. To do so, we will leverage the built-in plug-ins. Plus, we will add\
    \ some relevant documents so that the assistant will be grounded on specific knowledge\
    \ base.\n\nMy goal is that having an assistant that can build for me workout plans\
    \ according to by fitness ambition, availability, gender and age, preferences\
    \ and so forth. I also want my assistant to provide me clear explanations on the\
    \ reason behind its proposals.\n\nTo accomplish all of this, I want to make sure\
    \ that my assistant will:\n\n*   Ask me specific questions it needs to design\
    \ the best workout for me\n*   Provide me with relevant information and sources\
    \ regarding its responses\n*   Consider my feedback, yet it will be able to maintain\
    \ its idea if it believes it is correct for me.\n*   Not accommodate my requests\
    \ if not reasonable or risky for my health.\n\nLet’s see how to create our GPT,\
    \ following all the configuration steps mentioned in the previous section:\n\n\
    1.  **Name**: I’ll call my assistant `WorkoutGPT`.\n2.  **Description**: this\
    \ is the description I set: “Workout Assistant that helps user designing their\
    \ workout plan according to their needs.”\n3.  **Instructions**: here we start\
    \ with the real core of our GPT. This is the set of instructions I provided the\
    \ GPT with:\n\n*“You are a workout AI assistant that help users creating their\
    \ workout plans, depending on their needs.*\n\n*Before generating the plan, make\
    \ sure to ask the following questions:*\n\n*- Fitness goal and time expectation*\n\
    \n*- Age and gender*\n\n*- Fitness level*\n\n*- Availability for the workout*\n\
    \n*- All other elements that you need in order to define a proper workout plan\
    \ (e.g. equipment, potential injuries...)*\n\n*If needed, use the provided documents\
    \ to enrich your responses.*\n\n*If the user suggests you something that it's\
    \ not plausible for its goal, remain stick to your assumption, explaining the\
    \ reason behind politely.*\n\n*If the user asks you something that might be risky\
    \ for his/her health, politely suggest to take it easier and an alternative approach,\
    \ explaining the reason behind.”*\n\n1.  **Conversation Starters**: here I set\
    \ three samples of different workouts:\n\n    *   I want to train for a marathon\
    \ in 6 months.\n    *   Generate a 30’ HIIT workout plan without any equipment.\n\
    \    *   Generate a 45’ weightlifting workout plan with dumbbells only.\n2.  **Knowledge**:\
    \ here I uploaded the standard National Strength and Conditioning Association\
    \ (`NSCA`) training load chart, a tool used to help athletes and coaches determine\
    \ the appropriate training load for different exercises and training sessions.\
    \ It looks like:\n\n![Figure 6: NSCA training load chart. Source: https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf](media/file153.png)\n\
    \nFigure 6: NSCA training load chart. Source: https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf\n\
    \nI almost forgot a key step – the illustration! It might seem superficial yet\
    \ having an icon for your GPT make it more attractive, especially if you are planning\
    \ to publish it to all users. Luckily enough, we have `DALL-E` directly integrated\
    \ in the configuration pane:\n\n![Figure 7: Example on how to set your GPT icon.](media/file154.png)\n\
    \nFigure 7: Example on how to set your GPT icon.\n\nThis is how the configuration\
    \ looks like:\n\n![Figure 8: WorkoutGPT configuration page.](media/file155.png)\n\
    \nFigure 8: WorkoutGPT configuration page.\n\nGreat! Let’s now see some sample\
    \ conversations.\n\nTo start with, let’s pick the conversation starter about the\
    \ marathon:\n\n![Figure 9: Example of questions asked from WorkoutGPT to assess\
    \ user’s overall goals and fitness level.](media/file156.png)\n\nFigure 9: Example\
    \ of questions asked from WorkoutGPT to assess user’s overall goals and fitness\
    \ level.\n\nAs you can see, our `WorkoutGPT` immediately asks us the required\
    \ information to proceed. Once provided the above information, my assistant generated\
    \ the following 24-weeks plan (here the output is truncated):\n\n![Figure 10:\
    \ Example of workout table for marathon training generated by WorkoutGPT.](media/file157.png)\n\
    \nFigure 10: Example of workout table for marathon training generated by WorkoutGPT.\n\
    \nPlus, it specifies the Friday strength training as follows:\n\n![Figure 11:\
    \ Example of strength training generated by WorkoutGPT.](media/file158.png)\n\n\
    Figure 11: Example of strength training generated by WorkoutGPT.\n\nLet’s focus\
    \ on the strength training. I want to better understand how to calibrate the weights.\
    \ The following illustration shows the first extract of the response:\n\n![Figure\
    \ 12: Example of WorkoutGPT explaining how to determine the weight to lift in\
    \ a strength workout.](media/file159.png)\n\nFigure 12: Example of WorkoutGPT\
    \ explaining how to determine the weight to lift in a strength workout.\n\nIn\
    \ the same response, the Assistant also referenced the `NSCA` training load chart\
    \ provided as knowledge base:\n\n![Figure 13: Example of WorkoutGPT retrieving\
    \ information from custom knowledge base.](media/file160.png)\n\nFigure 13: Example\
    \ of WorkoutGPT retrieving information from custom knowledge base.\n\nNow I want\
    \ to challenge my `WorkoutGPT`, asking for something that might be harmful for\
    \ me. For example, preparing a marathon with no experience in one month is definitely\
    \ a terrible idea. Let’s see what my assistant’s thoughts about it are, once I\
    \ provide it with the list of answers to its starter questions:\n\n![Figure 14:\
    \ Example of WorkoutGPT gently nudging the user to pivot its goal and expectations\
    \ given the risks associated with the request.](media/file161.png)\n\nFigure 14:\
    \ Example of WorkoutGPT gently nudging the user to pivot its goal and expectations\
    \ given the risks associated with the request.\n\nAs you can see, my `WorkoutGPT`\
    \ is nudging me to change my approach to the race. While it still provides me\
    \ with a running workout plan for 3 weeks (here the output is truncated), it is\
    \ not aimed at running a marathon under 3h and 15m, but rather on building endurance\
    \ and strength.\n\nNote that, if we had asked the same thing to the general purpose\
    \ ChatGPT, it would have responded as follows:\n"
