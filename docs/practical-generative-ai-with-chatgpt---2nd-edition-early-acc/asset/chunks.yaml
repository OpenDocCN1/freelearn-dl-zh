  trans: "\n\n当你处理新的应用程序或项目时，将代码与文档联系起来是一个良好的习惯。它可能以 docstring（文档字符串）的形式存在，你可以将其嵌入到函数或类中，以便他人可以在开发环境中直接调用它们。\n\
    \n例如，让我们考虑上一个节中开发的同一个函数，并将其转换为一个 Python 类：\n\n```\nclass UnderscoreAdder:\n  \
    \  def __init__(self, word):\n        self.word = word\n    def add_underscores(self):\n\
    \        new_word = \"\"\n        for i in range(len(self.word)):\n          \
    \  new_word += self.word[i] + \"_\"\n        return new_word\n```\n\n我们可以对其进行如下测试：\n\
    \n![图 5：测试 UnderscoreAdder 类。](img/file94.png)\n\n图 5：测试 `UnderscoreAdder` 类。\n\
    \n现在，假设我想要通过 `UnderscoreAdder` 约定来检索 docstring 文档。通过对 Python 包、函数和方法进行这种操作，我们可以获得该特定对象能力的完整文档，如下（使用\
    \ `pandas` Python 库的示例）：![图 6.13 – pandas 库文档示例](img/file95.png)\n\n图 6.13 – `pandas`\
    \ 库文档示例。\n\n现在，让我们让 ChatGPT 为我们的 `UnderscoreAdder` 类产生相同的结果。\n\n![图 6.14 – ChatGPT\
    \ 用文档更新代码](img/file96.png)\n\n图 6.14 – ChatGPT 用文档更新代码。\n\n结果，如果我们按照前面的代码更新了我们的类和\
    \ `UnderscoreAdder?`，我们将得到如下输出：\n\n![图 6.15 – 新的 UnderscoreAdder 类文档](img/file97.png)\n\
    \n图 6.15 – 新的 `UnderscoreAdder` 类文档。\n\n最后，还可以利用 ChatGPT 用自然语言解释脚本、函数、类或其他类似内容的功能。我们已经看到许多\
    \ ChatGPT 用清晰的解释来丰富其代码相关的回答的示例。然而，我们可以通过就代码理解方面提出特定问题来增强这种能力。\n\n例如，让我们让 ChatGPT\
    \ 向我们解释以下 Python 脚本的作用：\n\n![图 6.16 – ChatGPT 解释 Python 脚本的示例](img/file98.png)\n\
    \n图 6.16 – ChatGPT 解释 Python 脚本的示例。\n\n代码可解释性也可以是上述文档的一部分，也可以用于开发者之间，他们可能想更好地理解其他团队的复杂代码，或者（有时在我身上发生）记住他们以前写过的内容。\n\
    \n得益于 ChatGPT 和本节提到的功能，开发者可以轻松用自然语言跟踪项目生命周期，以便让新团队成员和非技术用户都更容易理解目前完成的工作。\n\n我们将在下一节中看到，代码可解释性是数据科学项目中\
    \ ML 模型可解释性的关键一步。\n\n## 理解 ML 模型可解释性\n\n模型可解释性是指人类理解 ML 模型预测背后逻辑的难易程度。本质上，它是理解模型如何做出决策以及哪些变量对其预测做出贡献的能力。\n\
    \n让我们来看使用深度学习卷积神经网络（`CNN`）进行图像分类的模型可解释性示例。我使用 Python 和 `Keras` 构建了我的模型。为此，我将直接从\
    \ `keras.datasets` 下载 `CIFAR-10` 数据集：它包含 60,000 张 32x32 的彩色图像（即 3 通道图像），分为 10\
    \ 类（飞机、汽车、鸟、猫、鹿、狗、蛙、马、船和卡车），每类 6,000 张图像。在这里，我将仅分享主体；你可以在书籍 GitHub 仓库中找到数据准备和预处理的所有相关代码：[`github.com/PacktPublishing/The-Ultimate-Guide-to-ChatGPT-and-OpenAI/tree/main/Chapter%206%20-%20ChatGPT%20for%20Developers/code`](https://github.com/PacktPublishing/The-Ultimate-Guide-to-ChatGPT-and-OpenAI/tree/main/Chapter%206%20-%20ChatGPT%20for%20Developers/code):\n\
    \n```\nmodel=tf.keras.Sequential()\nmodel.add(tf.keras.layers.Conv2D(32,kernel_\
    \ size=(3,3),activation='relu',input_shape= (32,32,1)))\nmodel.add(tf.keras.layers.MaxPooling2D(pool_size=(2,2)))\
    \ model.add(tf.keras.layers.Flatten()) model.add(tf.keras.layers.Dense(1024,activation='relu'))\
    \ model.add(tf.keras.layers.Dense(10,activation='softmax'))\n```\n\n前面的代码由执行不同操作的几个层组成。我可能对模型结构的解释以及每一层的作用感兴趣。让我们让\
    \ ChatGPT 在这方面提供帮助（在下方你可以看到回复的片段）：\n\n![图 6.17 – 使用 ChatGPT 进行模型可解释性](img/file99.png)\n\
    \n图 6.17 – 使用 ChatGPT 进行模型可解释性。\n\n如前面的图所示，ChatGPT 能够为我们的 `CNN` 结构和层提供清晰的解释。它还会添加一些注释和提示，例如使用池化层有助于减少输入的维度。\n\
    \n我也可以通过 ChatGPT 在验证阶段支持解释结果。因此，在将数据分为训练集和测试集并在训练集上训练模型后，我想查看在测试集上的性能：\n\n![图\
    \ 6.18 – 指标](img/file100.jpg)\n\n图 6.18 – 标。\n\n让我们也让 ChatGPT 详细说明我们的验证指标（截断输出）：\n\
    \n![图 6.19 – ChatGPT 解释指标的示例](img/file101.png)\n\n图 6.19 – ChatGPT 解释指标的示例。\n\n\
    再次，结果非常令人印象深刻，它就如何针对训练和测试集设置 ML 实验提供了清晰的指导。\n\n模型可解释性重要有很多原因。一个关键因素是它缩小了业务用户与模型代码之间的差距。这是让业务用户理解模型如何运行以及将其转化为代码想法的关键。\n\
    \n此外，模型可解释性实现了负责任和伦理 AI 的核心原则之一，即 AI 系统背后思考和行为的透明度。解锁模型可解释性意味着检测模型在运行时可能出现的偏见或有害行为，并防止它们的发生。\n\
    \n总而言之，正如我们在前面的示例所示，ChatGPT 在模型可解释性方面可以提供价值支持。\n\n我们将探索的下一个 ChatGPT 功能是开发者生产力的另一个助力，当同一个项目使用多种编程语言时。\n\
    \n不同编程语言之间的翻译\n\n在第 5 节中，我们看到了 ChatGPT 在不同语言之间翻译的强大能力。真正令人惊的是，自然语言并不是它唯一的翻译对象。事实上，ChatGPT\
    \ 能够在不同的编程语言之间进行翻译，同时保持相同的输出和风格（即保留存在的 docstring 文档）。\n\n在许多场景下，这可能会改变游戏规则。\n\n\
    例如，你可能需要学习一种以前从未见过的新编程语言或统计工具，因为你需要快速交付该项目。在 ChatGPT 的帮助下，你可以用你偏好的语言开始编程，然后让它翻译成目标语言，你可以在翻译的过程中同时学习该语言。\n\
    \n"
- fmt: "\nImagine that the project needs to be delivered in MATLAB (a proprietary\
    \ numerical computing and programming software developed by MathWorks), yet you’ve\
    \ always programmed in Python. The project consists of classifying images from\
    \ the **Modified National Institute of Standards and Technology** (**MNIST**)\
    \ dataset (the original dataset description and related paper can be found here\
    \ at [http://yann.lecun.com/exdb/mnist/](http://yann.lecun.com/exdb/mnist/)).\
    \ The dataset contains numerous handwritten digits and is frequently utilized\
    \ to teach various image processing systems.\n\nTo start, I wrote the following\
    \ Python code to initialize a deep-learning model for classification:\n\n```python\n\
    import tensorflow as tf\nfrom tensorflow import keras\nfrom tensorflow.keras import\
    \ layers\n# Load the MNIST dataset\n(x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_\
    \ data()\n# Preprocess the data\nx_train = x_train.reshape(-1, 28*28) / 255.0\
    \ x_test = x_test.reshape(-1, 28*28) / 255.0 y_train = keras.utils.to_categorical(y_train)\
    \ y_test = keras.utils.to_categorical(y_test)\n# Define the model architecture\
    \ model = keras.Sequential([\nlayers.Dense(256, activation='relu', input_shape=(28*28,)),\
    \ layers.Dense(128, activation='relu'),\nlayers.Dense(10, activation='softmax')\n\
    ])\n# Compile the model\nmodel.compile(optimizer='adam', loss='categorical_crossentropy',\
    \ metrics=['accuracy'])\n# Train the model\nhistory = model.fit(x_train, y_train,\
    \ validation_split=0.2, epochs=10, batch_size=128)\n# Evaluate the model\ntest_loss,\
    \ test_acc = model.evaluate(x_test, y_test, verbose=0) print('Test accuracy:',\
    \ test_acc)\n```\n\nLet’s now see what happens if we give the preceding code as\
    \ context to ChatGPT and ask it to translate it into MATLAB:\n\n![Figure 20 –\
    \ ChatGPT translates Python code into MATLAB](media/file102.png)\n\nFigure 20\
    \ – ChatGPT translates Python code into MATLAB\n\nLet’s also see whether it is\
    \ capable of translating it into other languages such as JavaScript (note that\
    \ I didn’t have to repeat the code, since it was already in the chat context):\n\
    \n![Figure 6.21 – ChatGPT translates Python code into JavaScript](media/file103.png)\n\
    \nFigure 6.21 – ChatGPT translates Python code into JavaScript\n\nCode translation\
    \ could also reduce the skill gap between new technologies and current programming\
    \ capabilities.\n\nAnother key implication of code translation is **application\
    \ modernization**. Indeed, imagine you want to refresh your application stack,\
    \ namely migrating to the cloud. You could decide to initiate with a simple lift\
    \ and shift going toward **Infrastructure-as-a-Service** (**IaaS**) instances\
    \ (such as Windows or Linux **virtual machines** (**VMs**)). However, in a second\
    \ phase, you might want to refactor, rearchitect, or ever rebuild your applications.\n\
    \nThe following diagram depicts the various options for application modernization:\n\
    \n![Figure 6.22 – Four ways you can migrate your applications to the public cloud](media/file104.png)\n\
    \nFigure 6.22 – Four ways you can migrate your applications to the public cloud\n\
    \nChatGPT and OpenAI Codex models can help you with the migration. Consider mainframes,\
    \ for example.\n\nMainframes are computers that are predominantly employed by\
    \ large organizations to carry out essential tasks such as bulk data processing\
    \ for activities such as censuses, consumer and industry statistics, enterprise\
    \ resource planning, and large-scale transaction processing. The application programming\
    \ language of the mainframe environment is **Common Business Oriented Language**\
    \ (**COBOL**). Despite being invented in 1959, COBOL is still in use today and\
    \ is one of the oldest programming languages in existence.\n\nAs technology continues\
    \ to improve, applications residing in the realm of mainframes have been subject\
    \ to a continuous process of migration and modernization aimed at enhancing existing\
    \ legacy mainframe infrastructure in areas such as interface, code, cost, performance,\
    \ and maintainability.\n\nOf course, this implies translating COBOL to more modern\
    \ programming languages such as `C#` or Java. The problem is that COBOL is unknown\
    \ to most of the new-generation programmers; hence there is a huge skills gap\
    \ in this context.\n\nLet’s consider a COBOL script that reads an input number,\
    \ adds 10 to it, and then prints the result.\n\n```cobol\n IDENTIFICATION DIVISION.\n\
    \       PROGRAM-ID. AddTen.\n       DATA DIVISION.\n       WORKING-STORAGE SECTION.\n\
    \       01  INPUT-NUMBER    PIC 9(5).\n       01  RESULT-NUMBER   PIC 9(5).\n\
    \       PROCEDURE DIVISION.\n       DISPLAY 'Enter a number: '.\n       ACCEPT\
    \ INPUT-NUMBER.\n       COMPUTE RESULT-NUMBER = INPUT-NUMBER + 10.\n       DISPLAY\
    \ 'Result after adding 10: ' RESULT-NUMBER.\n       STOP RUN.\n```\n\nI then passed\
    \ the previous COBOL script to ChatGPT so that it can use it as context to formulate\
    \ its response. Let’s now ask ChatGPT to translate that script into C#:\n\n![Figure\
    \ 6.23 – Example of ChatGPT translating COBOL to C#.](media/file105.png)\n\nFigure\
    \ 6.23 – Example of ChatGPT translating COBOL to C#.\n\nTools such as ChatGPT\
    \ can help in reducing the skill gap in this and similar scenarios by introducing\
    \ a layer that knows both the past and the future of programming.\n\nIn conclusion,\
    \ ChatGPT can be an effective tool for application modernization, providing code\
    \ upgrading alongside valuable insights and recommendations. With its advanced\
    \ language processing capabilities, ChatGPT can help organizations streamline\
    \ their efforts, making the process faster, more efficient, and more effective.\n\
    \n## Summary\n\nChatGPT can be a valuable resource for developers looking to enhance\
    \ their skills and streamline their workflows. We started by seeing how ChatGPT\
    \ can generate, optimize, and debug your code, but we also covered further capabilities\
    \ such as generating documentation alongside your code, explaining your ML models,\
    \ and translating between different languages. Whether you’re a seasoned developer\
    \ or just starting out, ChatGPT offers a powerful tool for learning and growth,\
    \ reducing the gap between code and natural language.\n\nIn the next chapter,\
    \ we will dive deeper into another domain where ChatGPT could be a game changer:\
    \ marketing.\n\n# 6 Mastering Marketing with ChatGPT\n\n## Join our book community\
    \ on Discord\n\n![](media/file0.png)\n\n[https://packt.link/EarlyAccess](https://packt.link/EarlyAccess)\n\
    \nIn this chapter, we will focus on how marketers can leverage ChatGPT, looking\
    \ at the main use cases of ChatGPT in this domain, and how marketers can leverage\
    \ it as a valuable assistant.\n\nWe will learn how ChatGPT can assist in the following\
    \ activities:\n\n*   Marketers’ need for ChatGPT\n*   New product development\
    \ and the go-to-market strategy\n*   A/B testing for marketing comparison\n* \
    \  Making more efficient websites and posts with **Search Engine Optimization**\
    \ (**SEO**)\n*   Sentiment analysis of textual data\n\nBy the end of this chapter,\
    \ you will be able to leverage ChatGPT for marketing-related activities and to\
    \ boost your productivity.\n\n## Technical requirements\n\nYou will need an OpenAI\
    \ account to access ChatGPT.\n\n## Marketers’ need for ChatGPT\n\nMarketing is\
    \ probably the domain where ChatGPT and OpenAI models’ creative power can be leveraged\
    \ in their purest form. They can be practical tools to support creative development\
    \ in terms of new products, marketing campaigns, search engine optimization, and\
    \ so on. Overall, marketers automate and streamline many aspects of their work,\
    \ while also improving the quality and effectiveness of their marketing efforts.\n"
