    \n3.  Set Required Fields: Use the required array to specify which fields must\
    \ be provided.\n\n4.  Apply to Paths: Place the schema under the appropriate HTTP\
    \ method in your paths (e.g., POST, GET).\n\nLet’s consider the following example:\n\
    \n```\nopenapi: 3.1.0\ninfo:\n  title: ChatGPT Action API\n  version: 1.0.0\n\
    paths:\n  /perform-action:\n    post:\n      operationId: performAction\n    \
