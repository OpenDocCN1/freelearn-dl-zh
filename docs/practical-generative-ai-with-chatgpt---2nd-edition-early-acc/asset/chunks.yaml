    * ChatGPT 能够捕捉俚语或成语更深层次的含义。这使得翻译不再是字面直译，从而能够保留其深层含义。例如，让我们考虑英语表达 `It’s not my
    cup of tea`，它表示某物符合符合人的喜好或偏好。让 ChatGPT 和 Google Translate 将其翻译成意大利语：


    ![图 5.19 – ChatGPT 与 Google Translate 从英语翻译成意大利语对比](img/file74.png)


    图 5.19 – ChatGPT 与 Google Translate 从英语翻译成意大利语对比


    如你所示，ChatGPT 可以提供几个与原句等价的意大利语成语，同样以俚语的形式呈现。相比之下，Google Translate 执行了字面翻译，忽略了成语的真实含义。


    * 与任何其他任务一样，你总是可以为 ChatGPT 提供上下文。因此，如果你希望翻译具有特定的俚语或风格，你始终可以在提示词中指定。或者，更有趣的是，你可以要求
    ChatGPT 用讽刺的语气翻译你的提示词：


    ![图 5.20 – ChatGPT 用讽刺语气翻译提示词的示例。提示词原始内容取自 OpenAI 的维基百科页面：https://it.wikipedia.org/wiki/OpenAI](img/file75.png)


    图 5.20 – ChatGPT 用讽刺语气翻译提示词的示例。提示词原始内容取自 OpenAI 的维基百科页面：https://it.wikipedia.org/wiki/OpenAI


    所有这些场景都突出了 ChatGPT 以及整个 OpenAI 模型的一个核心杀手锏功能。由于它们代表了 OpenAI 定义的 `通用人工智能` (`AGI`)
    的体现，它们的设计初衷并非为了专注于单一任务（即被局限于单一任务）。相反，它们旨在动态地服务于多种场景，以便你通过一个模型处理广泛的用例。


    总之，ChatGPT 不仅能够生成新文本，还能操纵现有材料以满足你的需求。它已被证明在语言之间的翻译方面非常精确，同时保持术语和特定语言表达的完整性。


    在下一节中，我们将看到 ChatGPT 如何帮助我们检索信息和竞争情报。


    ## 快速信息检索与竞争情报


    信息检索和竞争情报是 ChatGPT 另一个改变游戏规则的领域。ChatGPT 检索信息的第一个例子就是它目前最流行的使用方式：作为搜索引擎。每当我们问 ChatGPT
    某些问题时，它都能从其知识库中检索信息并以原创的方式进行重构。


    一个例子是要求 ChatGPT 为我们可能感兴趣阅读的书籍提供快速摘要或评论：


    ![图 5.21 – ChatGPT 提供书籍摘要和评论的示例](img/file76.png)


    图 5.21 – ChatGPT 提供书籍摘要和评论的示例


    或者，我们可以根据自己的偏好为想要读的新书寻求一些建议：


    ![图 5.22 – ChatGPT 根据我的偏好推荐书单的示例](img/file77.png)


    图 5.22 – ChatGPT 根据我的偏好推荐书单的示例


    此外，如果我们在提示词中加入更具体的信息，ChatGPT 可以作为一个工具，引导我们找到研究或学习的正确参考文献。


    具体来说，你可能想要快速检索关于你想要进一步学习的主题的一些背景参考文献——例如，前馈神经网络。你可能会要求 ChatGPT 指向一些介绍广泛讨论该主题的网站或论文：


    ![图 5.23 – ChatGPT 列出相关参考文献的示例](img/file78.png)


    图 5.23 – ChatGPT 列出相关参考文献


    如你所示，ChatGPT 能够为我提供相关的参考文献以开始学习该主题。然而，在竞争情报方面，它还可以更进一步。


    假设我正在写一本名为 `Introduction to Convolutional Neural Networks – an Implementation
    with Python` 的书。我想对市场上的潜在竞争对手进行一些研究。我想要调查的第一件事是是否已经类似的竞争性书籍，因此我可以要求 ChatGPT 生成一份内容相同的现有书籍列表：


    ![图 5.24 – ChatGPT 提供竞争性书籍列表的示例](img/file79.png)


    图 5.24 – ChatGPT 提供竞争性书籍列表的示例


    你还可以就你想要出版的市场饱和度征求反馈：


    ![图 5.25 – ChatGPT 关于如何在市场中保持竞争力的建议](img/file80.png)


    图 5.25 – ChatGPT 关于如何在市场中保持竞争力的建议


    最后，让 ChatGPT 更精确地告诉我为了在我运营的市场中保持竞争力我应该做什么：


    ![图 5.26 – ChatGPT 如何建议改进书籍内容以使其脱颖出的示例](img/file81.png)


    图 5.26 – ChatGPT 如何建议改进书籍内容以使其脱颖出


    ChatGPT 在列出一些让我的书籍独独特的技巧方面表现得非常好。


    总的来说，ChatGPT 可以成为信息检索和竞争情报的价值助手。然而，重要的是记住知识库的截止日期是 2021 年：这意味着每当我们需要检索实时信息，或者在对今天进行竞争市场分析时，我们可能无法依靠
    ChatGPT。


    尽管如此，无论知识库截止日期如何，该工具仍然提供了良好的建议和最佳实践。


    ## 总结


    我们在本章中看到的所有示例都是通过 ChatGPT 实现某些成就的简要代表。这些小技巧可以极地帮助你处理重复性任务（例如使用类似的模板回复邮件）或繁重任务（例如搜索背景文档或竞争情报）。


    在下一章中，我们将深入探讨 ChatGPT 改变游戏的三个主要领域——开发、营销和研究。


