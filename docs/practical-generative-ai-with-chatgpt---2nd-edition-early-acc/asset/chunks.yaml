  raw: 'In this chapter, we explored the exciting world of generative AI and its various
    domains of application, including image generation, text generation, music generation,
    and video generation. We learned how generative AI models such as ChatGPT and
    DALL-E, trained by OpenAI, use DL techniques to learn patterns in large datasets
    and generate new content that is both novel and coherent. We also discussed the
    history of generative AI, its origins, and the current status of research on it.


    The goal of this chapter was to provide a solid foundation in the basics of generative
    AI and to inspire you to explore this fascinating field further.


    In the next chapter, we will focus on one of the most promising technologies available
    on the market today, ChatGPT: we will go through the research behind it and its
    development by OpenAI, the architecture of its model, and the main use cases it
    can address as of today.


    ## References


    *   [https://arxiv.org/abs/1406.2661](https://arxiv.org/abs/1406.2661)


    *   [https://www.youtube.com/watch?v=Iy9vRvyRf_E](https://www.youtube.com/watch?v=Iy9vRvyRf_E)


    *   [https://arxiv.org/abs/1912.04958](https://arxiv.org/abs/1912.04958)


    *   This person does not exist: [https://this-person-does-not-exist.com](https://this-person-does-not-exist.com)


    *   [https://arxiv.org/abs/1808.06601](https://arxiv.org/abs/1808.06601)


    *   [https://www.microsoft.com/en-us/research/blog/a-deep-generative- model-trifecta-three-advances-that-work-towards-harnessing-
    large-scale-power/](https://www.microsoft.com/en-us/research/blog/a-deep-generative-)


    *   [https://tcwang0509.github.io/vid2vid/](https://tcwang0509.github.io/vid2vid/)


    *   [https://arxiv.org/pdf/2302.13971](https://arxiv.org/pdf/2302.13971)


    *   [https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/](https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/)


    # 2 OpenAI and ChatGPT: Beyond the Market Hype


    ## Join our book community on Discord


    ![](media/file22.png)


    [https://packt.link/EarlyAccess](https://packt.link/EarlyAccess)


    This chapter provides an overview of OpenAI and its most notable development—ChatGPT,
    highlighting its history, technology, and capabilities.


    The overall goal is to provide a deeper knowledge of how ChatGPT can be used in
    various industries and applications to improve communication and automate processes
    and, finally, how those applications can impact the world of technology and beyond.


    We will cover all this with the following topics:


    *   What is OpenAI?


    *   Overview of OpenAI model families


    *   Road to ChatGPT: the math of the model behind it


    *   ChatGPT: the state of the art


    ## Technical requirements


    In order to be able to test the example in this chapter, you will need the following:


    *   An OpenAI account to access the Playground and the Models API ([https://openai.com/api/login20](https://openai.com/api/login20))


    *   Your favorite IDE environment, such as Jupyter or Visual Studio


    *   Python 3.7.1+ installed ([https://www.python.org/downloads](https://www.python.org/downloads))


    *   `pip` installed ([https://pip.pypa.io/en/stable/installation/](https://pip.pypa.io/en/stable/installation/))


    *   OpenAI Python library ([https://pypi.org/project/openai/](https://pypi.org/project/openai/))


    ## What is OpenAI?


    OpenAI is a research organization founded in 2015 by Elon Musk, Sam Altman, Greg
    Brockman, Ilya Sutskever, Wojciech Zaremba, and John Schulman. As stated on the
    OpenAI web page, its mission is “to ensure that Artificial General Intelligence
    (AGI) benefits all of humanity”. As it is general, AGI is intended to have the
    ability to learn and perform a wide range of tasks, without the need for task-specific
    programming.


    Since 2015, OpenAI has focused its research on **Deep** **Reinforcement** **Learning**
    (**DRL**), a subset of **machine** **learning** (**ML**) that combines **Reinforcement**
    **Learning** (**RL**) with deep neural networks. The first contribution in that
    field traces back to 2016 when the company released OpenAI Gym, a toolkit for
    researchers to develop and test **RL** algorithms.


    ![Figure 2.1 – Landing page of Gym documentation (https://www.gymlibrary.dev/)](media/file23.jpg)


    Figure 2.1 – Landing page of Gym documentation (https://www.gymlibrary.dev/)


    OpenAI kept researching and contributing in that field, yet its most notable achievements
    are related to generative models—**Generative** **Pre-trained** **Transformers**
    (**GPT**).


    After introducing the model architecture in their paper “Improving Language Understanding
    by Generative Pre-Training” and baptizing it **GPT-1**, OpenAI researchers soon
    released, in 2019, its successor, the GPT-2\. This version of the GPT was trained
    on a corpus called **WebText**, which at the time contained slightly over 8 million
    documents with a total of 40 GB of text from URLs shared in Reddit submissions
    with at least 3 upvotes. It had 1.2 billion parameters, ten times as many as its
    predecessor.


    Here, you can see the landing page of a UI of GPT-2 published by HuggingFace ([https://
    transformer.huggingface.co/doc/distil-gpt2](https://transformer.huggingface.co/doc/distil-gpt2)):


    ![Figure 2.2 – GPT-2 writing a paragraph based on a prompt. Source: https://transformer.huggingface.co/doc/distil-gpt2](media/file24.jpg)


    Figure 2.2 – GPT-2 writing a paragraph based on a prompt. Source: https://transformer.huggingface.co/doc/distil-gpt2


    Then, in 2020, OpenAI first announced and then released GPT-3, which, with its
    175 billion parameters, dramatically improved benchmark results over GPT-2\. It
    was with the GPT-3 model – more precisely, with its fine-tuned version called
    GPT-3.5 – that we entered the era of ChatGPT: in fact, at its first release, ChatGPT
    was powered by GPT-3.5.


    From that moment (November 2022) to today, OpenAI released many new version of
    its GPT series: GPT-4, GPT-4-turbo, GPT-4vision (first multimodal model) and GPT-4o,
    where the “o” stands for “omni”, referring to its multimodal capabilities.


    In addition to natural language generative models, OpenAI also developed in other
    fields of Generative AI, including:


    *   **DALL-E**🡪 A text-to-image model that generates detailed and creative images
    from textual descriptions. It can produce a wide variety of images, from realistic
    scenes to imaginative and abstract art.


    *   **Whisper**🡪 A speech recognition model designed to transcribe spoken language
    into text. It excels in understanding various accents, dialects, and noisy environments,
    making it highly effective for real-time transcription and voice-controlled applications.


    *   **SORA**🡪A text-to-video model that generates realistic and imaginative videos
    from text instructions. SORA can create videos up to a minute long, maintaining
    visual quality and adherence to the user’s prompt. At the time of writing, SORA
    is not available to the general public yet.


    Although OpenAI has invested in many fields of Generative AI, its contribution
    to text understanding and generation has been outstanding, thanks to the development
    of the foundation GPT models we are going to explore in the following paragraphs.


    ## An overview of OpenAI Playground


    Today, OpenAI offers a set of pre-trained, ready-to-use models that can be consumed
    by the general public. This has two important implications:


    *   Powerful foundation models can be consumed without the need for long and expensive
    training


    *   It’s not necessary to be a data scientist or an ML engineer to manipulate
    those models


    Users can test OpenAI models in two ways:


    *   OpenAI Playground, a friendly user interface where you can interact with models
    without the need to write any code.


    *   Via REST API with a pro-code approach. In fact, all OpenAI models – and, generally
    speaking, LLMs – comes as pre-built components that can be consumed by applications
    via endpoints and keys.'
