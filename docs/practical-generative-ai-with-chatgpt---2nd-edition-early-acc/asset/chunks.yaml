  trans: "\n\n通过对 OpenAI 模型的初步了解，我们将看到测试或将预训练模型嵌入到你的应用程序中是多么简单：这里的关键因素在于，你不需要强大的硬件和花费数小时的时间来训练模型，因为它们已经可以供你使用，并在需要时还可以通过少量示例进行自定义。\n\
    \n在下一章中，我们将开始介绍本书的`Part 2`，在 ways 我们将看到 ChatGPT 在各个领域的实际应用，以及如何释放它的潜力。你将学习如何通过正确设计提示（prompts）从\
    \ ChatGPT 中获得最高价值，如何提高你的日常工作效率，以及它如何成为开发者、营销人员和研究人员优秀的项目助手。\n\n## 参考文献\n\n*  \
    \ Radford, A., & Narasimhan, K. (2018). Improving language understanding by generative\
    \ pre-training.\n*   Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones,\
    \ L., Gomez, A. N., Kaiser, L., & Polosukhin, I. (2017). Attention Is All You\
    \ Need. ArXiv. [`doi.org/10.48550/ arXiv.1706.03762`](https://doi.org/10.48550/)\
