    ## 音乐生成


    音乐生成的生成式 AI 早期方法可以追溯到 50 年代，源于算法作曲领域的研究，这是一种使用算法生成音乐作品的技术。事实上，1957 年，Lejaren Hiller
    和 Leonard Isaacson 创建了《伊利亚克弦四奏组曲》（Illiac Suite for String Quartet）（[`www.youtube.com/watch?v=n0njBFLQSk8`](https://www.youtube.com/watch?v=n0njBFLQSk8)，这是第一首完全由
    AI 作曲的音乐。以来，音乐生成式 AI 一直是几十年来持续的研究课题。在近年的发展中，新的架构和框架已经在公众中普及，例如 Google 在 2016 年引入的
    `WaveNet` 架构，它能够生成高质量的音频样本；或者同样由 Google 开发的 `Magenta` 项目，它使用循环神经网络（`RNNs`）和其他机器学习技术来生成音乐和其他艺术形式。然后，在
    2020 年，OpenAI 也宣布了 `Jukebox`，这是一种生成音乐的神经网络，可以在音乐和人声风格、流派、参考艺术家等方面自定义输出。


    这些和其他框架构成了许多用于音乐生成的 AI 作曲助手的基础。例如是由 Sony CSL Research 开发的 `Flow Machines`。这个生成式
    AI 系统在大型音乐作品数据库上进行训练，以创建各种风格的新音乐。它被法国作曲家 Benoît Carré 用于创作一张名为 *Hello World* 的专辑（[`www.helloworldalbum.net/`](https://www.helloworldalbum.net/)），该专辑包含了与多位人类音乐家的合作。


