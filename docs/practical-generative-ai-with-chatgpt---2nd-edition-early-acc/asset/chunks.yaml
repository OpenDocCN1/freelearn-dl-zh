- fmt: "\nNote that we focused only on a small set of activities where ChatGPT can\
    \ support researchers. There are many other activities within the domain of research\
    \ that could benefit from the support of ChatGPT, among which we can mention data\
    \ collection, study participant recruitment, research networking, public engagement,\
    \ and many others.\n\nResearchers who incorporate this tool into their work can\
    \ benefit from its versatility and time-saving features, ultimately leading to\
    \ more impactful research outcomes.\n\nHowever, it is important to keep in mind\
    \ that ChatGPT is only a tool and should be used in conjunction with expert knowledge\
    \ and judgment. As with any research project, careful consideration of the research\
    \ question and study design is necessary to ensure the validity and reliability\
    \ of the results.\n\nWith this chapter, we also close Part 2 of this book, which\
    \ focused on the wide range of scenarios and domains you can leverage ChatGPT\
    \ for. However, we mainly focused on individual or small team usage, from personal\
    \ productivity to research assistance. Starting from Part 3, we will elevate the\
    \ conversation to how large organizations can leverage the same generative AI\
    \ behind ChatGPT for enterprise-scale projects, using OpenAI model APIs available\
    \ on the Microsoft Azure cloud.\n\n## References\n\n- [https://arxiv.org/abs/2312.11914](https://arxiv.org/abs/2312.11914)\n\
    - [https://arxiv.org/abs/2101.07714](https://arxiv.org/abs/2101.07714)\n- [https://arxiv.org/abs/2101.07714](https://arxiv.org/abs/2101.07714)\n\
    - [https://psycnet.apa.org/record/2014-07087-000](https://psycnet.apa.org/record/2014-07087-000)\n\
    - [https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109](https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109)\n\
    - [https://www.youtube.com/watch?v=TUmyygCMMGA](https://www.youtube.com/watch?v=TUmyygCMMGA)\n\
    \n# 9 Exploring GPTs\n\n## Join our book community on Discord\n\n![](media/file0.png)\n\
    \n[https://packt.link/EarlyAccess](https://packt.link/EarlyAccess)\n\nIn last\
    \ Chapters, we saw several examples of how to leverage ChatGPT for various activities,\
    \ from personal productivity to marketing, from research to software development.\
    \ For each of these scenarios, we always faced a similar situation: we started\
    \ with a general purpose model as ChatGPT, to then ask very specific questions\
    \ or providing specific references to tailor it to our specific need.\n\nHowever,\
    \ sometimes this might not be enough if our aim is that of obtaining an extremely\
    \ specialized model for our own purposes. That’s why we might need to build “purpose-specific\
    \ ChatGPT” and, luckily enough, OpenAI itself developed a no-code platform to\
    \ build those customized assistants, that are called GPTs.\n\nIn this Chapter,\
    \ we are going through the GPTs features, capabilities and real-world applications,\
    \ covering the same use cases we saw in previous Chapters, so that you can see\
    \ the difference in the output’s quality. Plus, we will also see how to publish\
    \ your GPT and make it a production application not only for yourself but also\
    \ for company or for everyone else.\n\nBy the end of this Chapter, you will be\
    \ able to:\n\n- Understand what a GPT is and what kind of tasks it can achieve\n\
    - Build your own GPT without writing a line of code\n- Publish your GPT and integrate\
    \ it with external systems\n\nLet’s start from some basic definitions and then\
    \ jump into the practice.\n\n## Technical requirements\n\nChatGPT Plus\n\n## What\
    \ are GPTs?\n\nIn November 2023, OpenAI introduced GPTs, specialized versions\
    \ of ChatGPT designed to enhance productivity and cater to specific tasks and\
    \ needs. Unlike the general-purpose ChatGPT, these custom versions, called GPTs,\
    \ allow users to create tailored AI models without any coding knowledge.\n\n>\
    \ It is important to anticipate a taxonomy consideration that will be relevant\
    \ throughout this chapter. When we mention the word GPT, there are two main definitions\
    \ that you found - and will find – in this book:\n\n- The first one refers to\
    \ the proper “Generative Pre-trained Transformer” (`GPT`) model architecture behind\
    \ OpenAI’s language models. We already mentioned this architecture in Part 1,\
    \ and we know that this is the framework behind ChatGPT itself.\n- The second\
    \ one refers, in a more generic way, to the specialized assistants that OpenAI\
    \ allows users to create in a no-code approach. With GPTs, OpenAI refers to specialized\
    \ versions of ChatGPT and, in this context, a single GPT refers to one assistant\
    \ that you created leveraging the GPTs platform (available to all users with ChatGPT\
    \ Plus).\n\nOver this chapter, whenever you will read `GPT` or `GPTs`, keep in\
    \ mind that we are using the second definition.\n\nThe idea of GPTs is like that\
    \ of AI Agents. In fact, with GPTs, we are building entities powered by LLMs,\
    \ with specific instructions and provided with both custom knowledge base and\
    \ a set of tools or plug-ins to interact with the surrounding environment.\n\n\
    Let’s see more in details all these components. First of all, you can have a comprehensive\
    \ look at all existing GPTs that have been publicly published. To do so, you can\
    \ navigate through the following page: [https://chatgpt.com/gpts](https://chatgpt.com/gpts).\n\
    \n![Figure 1: Landing page of GPTs.](media/file147.png)\n\nAs you can see from\
    \ the preceding picture, this is the marketplace of all GPTs. You can explore\
    \ it by category (`box 1`) or by explaining what you are looking for (`box 2`).\n\
    \nThen, to create your own GPT, you can navigate through your OpenAI account and\
    \ select on the top-left corner `Explore GPTs`, then `Create` (as illustrated\
    \ in `box 3`).\n\n![Figure 2: Editor page to create your GPT from scratch.](media/file148.png)\n\
    \nOnce in the editor, you will be asked to configure your GPT, while on the right-hand\
    \ side you have the possibility to test it in real time. Let’s explore all the\
    \ components:\n\n- **Name**: the name you give to your GPT.\n- **Description**:\
    \ the description of the capabilities of your GPT. This is extremely important\
    \ if you are going to publish your GPT in the marketplace, so that other users\
    \ can find it easily (as we previously mentioned, GPTs can be searched via natural\
    \ language in the Search GPTs bar).\n- **Instructions**: this is the metaprompt\
    \ of your GPT, so that set of instructions in natural language that tailor the\
    \ assistant to your specific need and that the final user doesn’t see.\n- **Conversation\
    \ Starters**: this is a set of sample prompts that users could start with to interact\
    \ with the GPT and gain confidence.\n- **Knowledge**: this refers to the custom\
    \ documentation we can ground the model on. When we upload documents here, our\
    \ GPT will be able to navigate through it with the Retrieval Augmented Generation\
    \ pattern, so that we can provide additional knowledge or even limit our assistant’s\
    \ responses to the custom knowledge base, depending on our needs.\n- **Capabilities**:\
    \ these refer to a set of built-in plug-ins we can provide the GPT with, without\
    \ writing a single line of code. You can see from the above picture that there\
    \ are three plug-ins out of the box:\n    - Web browsing for searching the web\
    \ and retrieve up to date information.\n    - DALL-E 3 to generate illustrations.\n\
    \    - Code Interpreter and Data Analysis to execute code in a sandboxed Python\
    \ environment and interact with analytical files (like spreadsheets).\n- **Actions**:\
    \ actions can be seen as plug-ins as well, however they differ from capabilities\
    \ since they are not built-in, but rather specified by the GPT developer. For\
    \ example, you might generate an action\n\n> In the context of actions, you can\
    \ be supported by a specialized GPT which is natively integrated in the configuration\
    \ pane if you click on `Add Actions` and then `Get help from ActionsGPT`.\n"
