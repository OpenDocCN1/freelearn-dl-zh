    ChatGPT can also be a loyal and disciplined study partner. It could help you,
    for example, in summarizing long papers so that you gain a first overview of the
    discussed topic or help you prepare for exams.


    Namely, let’s say you are preparing for mathematics exams using the university
    book titled `Mathematics for Economics and Business`, by Lorenzo Peccati et al.
    Before diving deeper into each chapter, you might want to get an overview of the
    content and main topics that are discussed, as well as whether you need further
    prerequisites and – mostly importantly if I’m preparing for an exam – how long
    it will take to study it. You can ask ChatGPT for this:


    ![Figure 5.5 – ChatGPT providing an overview of a university book](media/file60.png)

    Figure 5.5 – ChatGPT providing an overview of a university book


    When it comes to questions about specific assets or personal information, we are
    increasing the risk of ChatGPT’s hallucination. In fact, in the previous example,
    the model was able to answer since the synopsis of the book was clearly part of
    the training set, yet the model didn’t have full visibility on the book, as it’s
    not available on the web for free. If this is the case, it might be a good practice
    to specify the model to navigate the web to answer these specific questions. Let’s
    see an example of it:


    ![Figure 1: Example of ChatGPT invoking the web plug-in.](media/file61.png)

    Figure 1: Example of ChatGPT invoking the web plug-in.


    As you can see, now ChatGPT invoked the web plug-in and searched over 5 files,
    also providing the links it navigated through.


    You can also ask ChatGPT to ask you some questions about the material you have
    just studied:


    ![Figure 5.6 – Example of ChatGPT acting as a professor](media/file62.png)

    Figure 5.6 – Example of ChatGPT acting as a professor


    > The technique of `Act as`… is a great example of efficient prompting techniques,
    and it can be listed among the examples described in `Chapter 3`.


    Now, let’s look at some more examples of using ChatGPT for more specific tasks,
    including text generation, writing assistance, and information retrieval.


    ## Generating text


    As a language model, ChatGPT is particularly suited for generating text based
    on users’ instructions. For example, you could ask ChatGPT to generate emails,
    drafts, or templates that target a specific audience:


    ![Figure 5.7 – Example of an email generated by ChatGPT](media/file63.png)

    Figure 5.7 – Example of an email generated by ChatGPT


    Another example might be asking ChatGPT to create a pitch structure for a presentation
    you have to prepare (I’ll put here only the first slide as an example):


    ![Figure 5.8 – Slideshow agenda and structure generated by ChatGPT](media/file64.png)

    Figure 5.8 – Slideshow agenda and structure generated by ChatGPT


    You can also generate blog posts or articles about trending topics this way. Here
    is an example:


    ![Figure 5.9 – Example of a blog post with relevant tags and SEO keywords generated
    by ChatGPT](media/file65.png)

    Figure 5.9 – Example of a blog post with relevant tags and SEO keywords generated
    by ChatGPT


    We can even get ChatGPT to reduce the size of the post to make it fit for a tweet.
    Here is how we can do this:


    ![Figure 5.10 – ChatGPT shrinks an article into a Twitter post](media/file66.png)

    Figure 5.10 – ChatGPT shrinks an article into a Twitter post


    Finally, ChatGPT can also generate video or theatre scripts, including the scenography
    and the suggested editing. The following figure shows an example of a theatre
    dialog including scenography and actors:


    ![Figure 5.11 – Theatre dialog with scenography generated by ChatGPT](media/file67.png)

    Figure 5.11 – Theatre dialog with scenography generated by ChatGPT


    I only provided one scene out of the four generated by ChatGPT, to keep you in
    suspense regarding the ending…


    Overall, whenever new content needs to be generated from scratch, ChatGPT does
    a very nice job of providing a first draft, which could act as the starting point
    for further refinements.


    However, ChatGPT can also support pre-existing content by providing writing assistance
    and translation, as we will see in the next section.


    ## Improving writing skills and translation


    Sometimes, rather than generating new content, you might want to revisit an existing
    piece of text. It this be for style improvement purposes, audience changes, language
    translation, and so on.


    Let’s look at some examples. Imagine that I drafted an email to invite a customer
    of mine to a webinar. I wrote two short sentences. Here, I want ChatGPT to improve
    the form and style of this email since the target audience will be executive level:


    ![Figure 5.12 – Example of an email revisited by ChatGPT to target an executive
    audience](media/file68.png)

    Figure 5.12 – Example of an email revisited by ChatGPT to target an executive
    audience


    Now, let’s ask the same thing but with a different target audience:


    ![Figure 5.13 – Example of the same email with a different audience, generated
    by ChatGPT](media/file69.png)

    Figure 5.13 – Example of the same email with a different audience, generated by
    ChatGPT


    ChatGPT can also give you some feedback about your writing style and structure.


    Imagine, for example, that you wrote an introduction for an essay titled `The
    History of Natural Language Processing` and you want some feedback about the writing
    style and its consistency with the title:


    ![Figure 5.15 – Example of ChatGPT giving feedback on an introduction for an essay](media/file70.png)

    Figure 5.15 – Example of ChatGPT giving feedback on an introduction for an essay


    As you can see, not only ChatGPT provided me with feedback and tips for the overall
    essay, but also it gave me a revised introduction which incorporates all of them.


    Let’s also ask ChatGPT to be more specific regarding its suggestion of `Refining
    Examples`:


    ![Figure 5.16 – Example of ChatGPT elaborating on something it mentioned](media/file71.png)

    Figure 5.16 – Example of ChatGPT elaborating on something it mentioned


    I’m also interested in knowing whether my introduction was consistent with the
    title or whether I’m taking the wrong direction:


    ![Figure 5.17 – ChatGPT provides feedback about the consistency of the introduction
    with the title](media/file72.png) evenFigure 5.17 – ChatGPT provides feedback
    about the consistency of the introduction with the title


    I was impressed by this last one. ChatGPT was smart enough to see that there was
    no specific mention of NLP in my introduction. Nevertheless, it sets up the expectation
    about that topic to be treated later on. This means that ChatGPT also has expertise
    in terms of how an essay should be structured and it was very precise in applying
    its judgment, knowing that it was just an introduction.


    Let’s now unveil the last ChatGPT skill of the Chapter. In fact, ChatGPT is also
    an excellent tool for translation. It knows at least 95 languages (if you have
    doubts about whether your language is supported, you can always ask ChatGPT directly).
    Here, however, there is a consideration that might arise: what is the added value
    of ChatGPT for translation when we already have cutting-edge tools such as Google
    Translate?


    To answer this question, we have to consider some key differentiators and how
    we can leverage ChatGPT’s embedded translations capabilities:


    * ChatGPT can capture the intent. This means that you could also bypass the translation
    phase since it is something that ChatGPT can do in the backend. For example, if
    you write a prompt to produce a social media post in French, you could write that
    prompt in any language you want – ChatGPT will automatically detect it (without
    the need to specify it in advance) and understand your intent:


    ![Figure 5.18 – Example of ChatGPT generating an output in a language that is
    different from the input](media/file73.png)

    Figure 5.18 – Example of ChatGPT generating an output in a language that is different
    from the input

