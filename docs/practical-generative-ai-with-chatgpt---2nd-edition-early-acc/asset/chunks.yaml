  trans: "\n\n- 将文本转换为中间表示，并保留原始文本的含义和结构。\n- 从中间表示生成目标语言的文本。\n- **诗歌生成**：一项创意任务，涉及创作遵循特定风格、主题或情感的诗歌。该任务可以分为若干子任务，例如：\n\
    \    - 为诗歌选择诗歌形式（如十四行诗、俳句、五味打诗等）和韵律（如 ABAB、AABB、ABCB 等）。\n    - 根据用户的输入或偏好为诗歌生成标题和主题。\n\
    \    - 生成符合所选形式、韵律和主题的诗行或诗节。\n    - 对诗歌进行精炼和润色，以确保连贯性、流畅性和原创。\n- **代码生成**：一项技术任务，涉及生成执行特定功能或任务的代码段。该任务可以分为若干子任务，例如：\n\
    \    - 为代码选择编程语言（如 `Python`、`Java`、`C++` 等）以及框架或库（如 `TensorFlow`、`PyTorch`、`React`\
    \ 等）。\n    - 根据用户的输入或规范为代码生成函数名以及参数列表和返回值。\n    - 生成实现代码逻辑和功能的函数体。\n    - 添加注释和文档以解释代码及其用法。\n\
    - 让我们考虑以下示例。我们将为模型提供的一篇短文章，并要求它按照这些指令进行总结：\n\n```\nYou are an AI assistant that\
    \ summarize articles.\nTo complete this task, do the following subtasks:\nRead\
    \ the provided article context comprehensively and identified the main topic and\
    \ key points\nGenerated a paragraph summary of the current article context that\
    \ captures the essential information and conveys the main idea\nPrint each step\
    \ of the process.\n```\n\n这是我将提供的短文：\n\n```\n大语言模型（LLMs）作为人工智能的一个子集，通过展现出前所未有的理解和生成类人文本的能力，彻底改变了自然语言处理领域。这些模型在包含多样化语言输入的海量数据集上进行训练，使其能够针对广泛的主题生成连贯且上下文相关的响应。通过利用\
    \ transformers 等架构，GPT-3 及其后续者等 LLM 可以完成文本补、回答问题、执行翻译，甚至参与复杂的对话。它们的应用范围从自动化客户支持、内容创作到先进的研究和教育工具。尽管拥有惊人的能力，LLM\
    \ 也面临着挑战，包括训练数据中固有的偏差倾向以及生成误导性或虚假信息的风险。随着 LLM 的不断进步，在伦理 AI 研究和部署策略方面的持续的努力对于负责任且有效地利用其益处至关重要。\n\
    ```\n\n让我们看看模型是如何工作的：\n\n![图 6：OpenAI GPT-4o 将任务拆分为子任务以生成摘要的示例。](img/file48.png)\n\
    \n图 6：OpenAI GPT-4o 将任务拆分为子任务以生成摘要的示例。\n\n将复杂任务拆分为更简单的子任务是一种强大的技术，尽管如此它并没有解决 LLM\
    \ 生成内容的主要风险之一，即输出错误结果。在接下来的两个章节中，我们将看到一些旨在解决这一风险的技术。\n\n### 请求理由（Ask for justification）\n\
    \nLLM 的构建方式是它们根据之前的标记（token）预测下一个标记，而不回溯其已生成的内容。这可能导致模型向用户输出错误内容，但方式非常具有说服力。如果\
    \ LLM 驱动的应用没有为该响应提供特定的引用，可能很难验证其背后的事实。\n\n因此，在提示词（prompt）中指定通过一些反思和理由来支持 LLM 的答案，可能会提示模型从其行为中恢复。\n\
    \n此外，请求理由在答案正确的情况下也可能有用，只是因为我们并不知道 LLM 背后的思考过程。例如，假设我们想让 LLM 解决谜语。为了做到，我们可以这样指示它：\n\
    \n```\nYou are an AI assistant specialized in solving riddles.\nGiven a riddle,\
    \ solve it the best you can.\nProvide a clear justification of your answer and\
    \ the reasoning behind it.\n```\n\n如你所见，我在元提示词（metaprompt）中指定 LLM 为其答案提供理由，并将其推理社交化。让我们用下面的谜语来测试一下：\n\
    \n```\n什么有脸有只手，但没有手脚？\n```\n\n输出：\n\n![图 7：OpenAI 的 GPT-4o 在解决谜语后提供理由的示例。](img/file49.png)\n\
    \n图 7：OpenAI 的 GPT-4o 在解决谜语后提供理由的示例。\n\n理由是使你的模型更可靠、更健壮的佳工具，因为它们“迫使”模型重新思考其输出，同时为我们提供了推理是如何设定以解决问题的视角。\n\
    \n通过类似的方法，我们也可以在不同的提示词层面进行干预，以提高 LLM 的性能。例如，我们可能会发现模型正在系统地以错误的方式处理数学问题，因此我们可能想在元提示词层面上直接建议正确的方法。另一个例子可能是要求模型生成多个输出——以及它们对应的理由——以评估不同的推理技术，并在元提示词中选择最佳的一个。\n\
    \n在下一节中，我们将关注这些示例之一，更具体说是生成多个输出然后选择最可能的一个的可能。\n\n### 生成多个输出，然后使用模型选择最佳的一个\n\n\
    正如我们在上一节中看到的，LLM 的构建方式是它们根据之前的标记预测下一个标记，而不回溯其已生成的内容。如果是这种情况下，如果采样的标记是错误的（换句话说，如果模型运气不好），LLM\
    \ 将继续生成错误的标记，从而产生错误的内容。现在坏消息是，与人类不同，LLM 无法从错误中自动恢复。这意味着，如果我们询问它们，它们会承认错误，但我们需要明确提示它们进行思考。\n\
    \n克服这一局限性的方法是扩大选择正确标记的概率空间。与其只生成一个响应，我们可以提示模型生成多个响应，然后选择最适合用户查询的一个。这为我们的 LLM 分配两个子任务：\n\
    \n1. 为用户查询生成多个响应；\n2. 比较这些响应并根据我们可以在元提示词中指定的标准选择最佳的一个。\n\n让我们来看一个示例，接上上一节检查过的谜语：\n\
    \n```\nYou are an AI assistant specialized in solving riddles.\nGiven a riddle,\
    \ you have to generate three answers to the riddle.\nFor each answer, be specific\
    \ about the reasoning you made.\nThen, among the three answer, select the one\
    \ which is most plausible given the riddle.\n```\n\n在这种情况下，我提示模型为谜语生成三个答案，然后给出最可能的那个，并说明理由。让我们看看结果：\n\
    \n![图 8：GPT-4o 生成三个可能的答案并选择最可能的一个、提供理由的示例。](img/file50.png)\n\n图 8：GPT-4o 生成三个可能的答案并选择最可能的一个、提供理由的示例。\n\
    \n"
- fmt: "\nAs aforementioned, forcing the model to tackle a problem with different\
    \ approaches is a way to collect multiple samples of reasonings, which might serve\
    \ as further instructions in the metaprompt. For example, if we want the model\
    \ to always propose us something which is not the most straightforward solution\
    \ to a problem – in other words, if we want it to “think differently” – we might\
    \ force it to solve a problem in N ways and then use the most creative reasoning\
    \ as framework in the metaprompt.\n\nThe last element we are going to examine\
    \ is the overall structure we want to give to our metaprompt. In fact, in previous\
    \ examples, we saw a sample system message with some statements and instructions.\
    \ In next section, we will see how the order and “strength” of those statements\
    \ and instructions is not an invariant.\n\n## Use delimiters\n\nThe last principle\
    \ to be covered is related to the format we want to give to our meta prompt. This\
    \ helps our LLM to better understand its intents as well as making relations among\
    \ sections and paragraphs.\n\nTo achieve this, we can use delimiters within our\
    \ prompt. A delimiter can by any sequence of characters or symbols that is clearly\
    \ mapping a schema rather than a concept. For example, we can consider delimiters\
    \ the following sequences:\n\n* `>>>>`\n* `====`\n* `------`\n* `####`\n* ` `\
    \ ` ` `\n\nAnd so on. Let’s consider, for example, a meta prompt that aims at\
    \ instructing the model to translate user’s tasks into Python code, providing\
    \ also an example to do so.\n\n```\nYou are a Python expert that produces python\
    \ code as per user's request.\n===>START EXAMPLE\n---User Query---\nGive me a\
    \ function to print a string of text.\n---User Output---\nBelow you can find the\
    \ described function:\n```def my_print(text):\n\n     #returning the printed text\n\
    \n     return print(text)\n```\n<===END EXAMPLE\n```\n\nLet’s see how it works:\n\
    \n![Figure 9: Sample output of a model using delimiters in the system message.](media/file51.png)\n\
    \nFigure 9: Sample output of a model using delimiters in the system message.\n\
    \nAs you can see, it also printed the code in backsticks as showed within the\
    \ system message.\n\nAll the principles examined up to this point are general\
    \ rules that can make your LLM-powered application more robust. In next sections,\
    \ we are going to see some advanced techniques for prompt engineering that address\
    \ the way the model reason and think to the answer, before providing it to the\
    \ final user.\n\n## Advanced techniques\n\nIn previous sections, we covered some\
    \ basics techniques of prompt engineering. Those techniques should be kept in\
    \ mind regardless of the type of application your are developing, since are general\
    \ best practices that improve your LLM performance anyway.\n\nOn the other hand,\
    \ there are some advanced techniques which might be implemented for specific scenarios,\
    \ that we are going to cover in the upcoming sections.\n\n### Chain of Thoughts\n\
    \nIntroduced in the paper “Chain-of-Thought Prompting Elicits Reasoning in Large\
    \ Language Models” by Wei et al., Chain of thought (CoT) is a technique that enables\
    \ complex reasoning capabilities through intermediate reasoning steps. It also\
    \ encourages the model to explain its reasoning, “forcing” it not to be too fact\
    \ and risking to give the wrong response (as we saw in previous sections).\n\n\
    Let’s say that we want to prompt our LLM to solve first-degree equations. To do\
    \ so, we are going to provide it with a generic reasoning list as a metaprompt:\n\
    \n```\nTo solve a generic first-degree equation, follow these steps:\n1\\. **Identify\
    \ the Equation:** Start by identifying the equation you want to solve. It should\
    \ be in the form of \"ax + b = c,\" where 'a' is the coefficient of the variable,\
    \ 'x' is the variable, 'b' is a constant, and 'c' is another constant.\n2\\. **Isolate\
    \ the Variable:** Your goal is to isolate the variable 'x' on one side of the\
    \ equation. To do this, perform the following steps:\n\n   a. **Add or Subtract\
    \ Constants:** Add or subtract 'b' from both sides of the equation to move constants\
    \ to one side.\n\n   b. **Divide by the Coefficient:** Divide both sides by 'a'\
    \ to isolate 'x'. If 'a' is zero, the equation may not have a unique solution.\n\
    3\\. **Simplify:** Simplify both sides of the equation as much as possible.\n\
    4\\. **Solve for 'x':** Once 'x' is isolated on one side, you have the solution.\
    \ It will be in the form of 'x = value.'\n5\\. **Check Your Solution:** Plug the\
    \ found value of 'x' back into the original equation to ensure it satisfies the\
    \ equation. If it does, you've found the correct solution.\n6\\. **Express the\
    \ Solution:** Write down the solution in a clear and concise form.\n7\\. **Consider\
    \ Special Cases:** Be aware of special cases where there may be no solution or\
    \ infinitely many solutions, especially if 'a' equals zero.\nEquation:\n```\n\n\
    Let’s see how it works:\n\n![Figure 10: Output of the model solving an equation\
    \ with CoT approach.](media/file52.png)\n\nFigure 10: Output of the model solving\
    \ an equation with CoT approach.\n\nNote that you can also combine combine it\
    \ with few-shot prompting to get better results on more complex tasks that require\
    \ reasoning before responding.\n\nWith CoT, we are prompting the model to generate\
    \ intermediate reasoning steps. This is also a component of another reasoning\
    \ technique that we are going to examine in next section.\n\n### ReAct\n\nIntroduced\
    \ in the paper “ReAct: Synergizing Reasoning and Acting in Language Models” by\
    \ Yao et al., ReAct (Reason and Act) is a general paradigm that combines reasoning\
    \ and acting with large language models. ReAct prompts the language model to generate\
    \ verbal reasoning traces and also receives observations from external sources\
    \ such as web search. This allows the language model to perform dynamic reasoning,\
    \ and quickly adapt its plan based on external information. For example, you can\
    \ prompt the language model to answer a question by first reasoning about it,\
    \ then performing an action to send a query to the web, then receiving an observation\
    \ from the search results, and then continuing with this thought, action loop\
    \ until it reaches a conclusion.\n\nThe difference between chain of thought and\
    \ ReAct approaches is that chain of thought prompts the language model to generate\
    \ intermediate reasoning steps for a task, while ReAct prompts the language model\
    \ to generate intermediate reasoning steps, actions, and observations for a task.\n\
    \nIn the following example we won’t use tools, but rather refer to “action” any\
    \ task we ask the model to do.\n\nThis is how the ReAct metaprompt might look\
    \ like:\n\n```\nAnswer the following questions as best you can.\nUse the following\
    \ format:\nQuestion: the input question you must answer\nThought: you should always\
    \ think about what to do\nAction: the action to take\nAction Input: the input\
    \ to the action\nObservation: the result of the action\n... (this Thought/Action/Action\
    \ Input/Observation can repeat N times)\nThought: I now know the final answer\n\
    Final Answer: the final answer to the original input question\n```\n\nLet’s see\
    \ how does it work with a simple user’s query:\n\n![Figure 11: Example of ReAct\
    \ metaprompting](media/file53.png)\n\nFigure 11: Example of ReAct metaprompting\n\
    \nAs you can see, in this scenario the model skipped the Action Input and the\
    \ following observation, since we didn’t provide it with any tool to be used.\n\
    \nThis is a great example of how prompting a model to think step by step and explicit\
    \ each step of the reasoning makes it “wiser” and cautious before answering. It\
    \ is also a great technique to prevent hallucination.\n\nOverall, prompt engineering\
    \ is a powerful discipline, still in its emerging phase yet already widely adopted\
    \ within LLM-powered applications. In next Chapters, we are going to see concrete\
    \ applications of this techniques.\n"
