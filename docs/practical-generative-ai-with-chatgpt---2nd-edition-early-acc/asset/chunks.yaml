    \ that.\n\nThe second method is more sophisticated and is called `fine-tuning`.\
    \ Fine-tuning is the process of adapting a pre-trained model to a new task.\n\n\
    In fine-tuning, the parameters of the pre-trained model are altered, either by\
    \ adjusting the existing parameters or by adding new parameters, to better fit\
    \ the data for the new task. This is done by training the model on a smaller labeled\
    \ dataset that is specific to the new task. The key idea behind fine-tuning is\
    \ to leverage the knowledge learned from the pre-trained model and fine-tune it\
    \ to the new task, rather than training a model from scratch. Have a look at the\
    \ following figure:\n\n![Figure 2.12 – Model fine-tuning](media/file32.jpg)\n\n\
    Figure 2.12 – Model fine-tuning\n\nIn the preceding figure, you can see a schema\
    \ on how fine-tuning works on OpenAI pre-built models. The idea is that you have\
    \ available a pre-trained model with general-purpose weights or parameters. Then,\
    \ you feed your model with custom data, typically in the form of `key-value` prompts\
    \ and completions as shown here:\n\n```\n{\"prompt\": \"<prompt text>\", \"completion\"\
    : \"<ideal generated text>\"}\n{\"prompt\": \"<prompt text>\", \"completion\"\
    : \"<ideal generated text>\"}\n{\"prompt\": \"<prompt text>\", \"completion\"\
    : \"<ideal generated text>\"}\n...\n```\n\nOnce the training is done, you will\
    \ have a customized model that performs particularly well for a given task, for\
