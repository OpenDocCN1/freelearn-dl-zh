  raw: '*   ChatGPT can capture the more refined meaning of slang or idioms. This
    allows for a translation that is not literal so that it can preserve the underlying
    meaning. Namely, let’s consider the British expression It’s not my cup of tea,
    which indicates that something is not to one’s liking or preference. Let’s ask
    both ChatGPT and Google Translate to translate it into Italian:


    ![Figure 5.19 – Comparison between ChatGPT and Google Translate while translating
    from English into Italian](media/file74.png)


    Figure 5.19 – Comparison between ChatGPT and Google Translate while translating
    from English into Italian


    As you can see, ChatGPT can provide several Italian idioms that are equivalent
    to the original one, also in their slang format. On the other hand, Google Translate
    performed a literal translation, leaving behind the real meaning of the idiom.


    *   As with any other task, you can always provide context to ChatGPT. So, if
    you want your translation to have a specific slang or style, you can always specify
    it in the prompt. Or, even funnier, you can ask ChatGPT to translate your prompt
    with a sarcastic touch:


    ![Figure 5.20 – Example of ChatGPT translating a prompt with a sarcastic touch.
    The original content of the prompt was taken from OpenAI’s Wikipedia page: https://it.wikipedia.org/wiki/OpenAI](media/file75.png)


    Figure 5.20 – Example of ChatGPT translating a prompt with a sarcastic touch.
    The original content of the prompt was taken from OpenAI’s Wikipedia page: https://it.wikipedia.org/wiki/OpenAI


    All these scenarios highlight one of the key killing features of ChatGPT and OpenAI
    models in general. Since they represent the manifestation of what OpenAI defined
    as **Artificial General Intelligence** (**AGI**), they are not meant to be specialized
    (that is, constrained) on a single task. On the contrary, they are meant to serve
    multiple scenarios dynamically so that you can address a wide range of use cases
    with a single model.


    In conclusion, ChatGPT is able not only to generate new text but also to manipulate
    existing material to tailor it to your needs. It has also proven to be very precise
    at translating between languages, also keeping the jargon and language-specific
    expressions intact.


    In the next section, we will see how ChatGPT can assist us in retrieving information
    and competitive intelligence.


    ## Quick information retrieval and competitive intelligence


    Information retrieval and competitive intelligence are yet other fields where
    ChatGPT is a game-changer. The very first example of how ChatGPT can retrieve
    information is the most popular way it is used right now: as a search engine.
    Every time we ask ChatGPT something, it can retrieve information from its knowledge
    base and reframe it in an original way.


    One example involves asking ChatGPT to provide a quick summary or review of a
    book we might be interested in reading:


    ![Figure 5.21 – Example of ChatGPT providing a summary and review of a book](media/file76.png)


    Figure 5.21 – Example of ChatGPT providing a summary and review of a book


    Alternatively, we could ask for some suggestions for a new book we wish to read
    based on our preferences:


    ![Figure 5.22 – Example of ChatGPT recommending a list of books, given my preferences](media/file77.png)


    Figure 5.22 – Example of ChatGPT recommending a list of books, given my preferences


    Furthermore, if we design the prompt with more specific information, ChatGPT can
    serve as a tool for pointing us toward the right references for our research or
    studies.


    Namely, you might want to quickly retrieve some background references about a
    topic you want to learn more about – for example, feedforward neural networks.
    Something you might ask ChatGPT is to point you to some websites or papers where
    this topic is widely treated:


    ![Figure 5.23 – Example of ChatGPT listing relevant references](media/file78.png)


    Figure 5.23 – Example of ChatGPT listing relevant references


    As you can see, ChatGPT was able to provide me with relevant references to start
    studying the topic. However, it could go even further in terms of competitive
    intelligence.


    Let’s consider I’m writing a book titled Introduction to *Convolutional Neural
    Networks – an Implementation with Python*. I want to do some research about the
    potential competitors in the market. The first thing I want to investigate is
    whether there are already some competitive titles around, so I can ask ChatGPT
    to generate a list of existing books with the same content:


    ![Figure 5.24 – Example of ChatGPT providing a list of competitive books](media/file79.png)


    Figure 5.24 – Example of ChatGPT providing a list of competitive books


    You can also ask for feedback in terms of the saturation of the market you want
    to publish in:


    ![Figure 5.25 – ChatGPT advising about how to be competitive in the market](media/file80.png)


    Figure 5.25 – ChatGPT advising about how to be competitive in the market


    Finally, let’s ask ChatGPT to be more precise about what I should do to be competitive
    in the market where I will operate:


    ![Figure 5.26 – Example of how ChatGPT can suggest improvements regarding your
    book content to make it stand out](media/file81.png)


    Figure 5.26 – Example of how ChatGPT can suggest improvements regarding your book
    content to make it stand out


    ChatGPT was pretty good at listing some good tips to make my book unique.


    Overall, ChatGPT can be a valuable assistant for information retrieval and competitive
    intelligence. However, it is important to remember the knowledge base cut-off
    is 2021: this means that, whenever we need to retrieve real-time information,
    or while making a competitive market analysis for today, we might not be able
    to rely on ChatGPT.


    Nevertheless, this tool still provides excellent suggestions and best practices
    that can be applied, regardless of the knowledge base cut-off.


    ## Summary


    All the examples we saw in this chapter were modest representations of what you
    can achieve with ChatGPT to boost your productivity. These small hacks can greatly
    assist you with activities that might be repetitive (answering emails with a similar
    template rather than writing a daily routine) or onerous (such as searching for
    background documentation or competitive intelligence).


    In the next chapter, we are going to dive deeper into three main domains where
    ChatGPT is changing the game – development, marketing, and research.


