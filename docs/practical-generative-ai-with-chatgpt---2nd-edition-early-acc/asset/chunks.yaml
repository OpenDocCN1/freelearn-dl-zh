  raw: 'In the previous illustration, I instructed the model to output only the label
    of the tweet’s sentiment, providing it with three examples on how to do that.


    The second method is more sophisticated and is called **fine-tuning**. Fine-tuning
    is the process of adapting a pre-trained model to a new task.


    In fine-tuning, the parameters of the pre-trained model are altered, either by
    adjusting the existing parameters or by adding new parameters, to better fit the
    data for the new task. This is done by training the model on a smaller labeled
    dataset that is specific to the new task. The key idea behind fine-tuning is to
    leverage the knowledge learned from the pre-trained model and fine-tune it to
    the new task, rather than training a model from scratch. Have a look at the following
    figure:


    ![Figure 2.12 – Model fine-tuning](media/file32.jpg)


    Figure 2.12 – Model fine-tuning


    In the preceding figure, you can see a schema on how fine-tuning works on OpenAI
    pre-built models. The idea is that you have available a pre-trained model with
    general-purpose weights or parameters. Then, you feed your model with custom data,
    typically in the form of *key-value* prompts and completions as shown here:


    ```

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    ...

    ```


    Once the training is done, you will have a customized model that performs particularly
    well for a given task, for example, the classification of your company’s documentation.


    The nice thing about fine-tuning is that you can make pre-built models tailored
    to your use cases, without the need to re-train them from scratch, yet leveraging
    smaller training datasets and hence less training time and computing. At the same
    time, the model keeps its generative power and accuracy learned via the original
    training, the one that occurred on the massive dataset.


    In this paragraph, we got an overview of the models offered by OpenAI to the general
    public, from those you can try directly in the Playground (GPT, Codex) to more
    complex models such as embeddings. We also learned that, besides using models
    in their pre-built state, you can also customize them via fine-tuning, providing
    a set of examples to learn from.


    In the following sections, we are going to focus on the background of those amazing
    models, starting from the math behind them and then getting to the great discoveries
    that made ChatGPT possible.


    ## ChatGPT: the state of the art


    In November 2022, OpenAI announced the web preview of its conversational AI system,
    ChatGPT, available to the general public. This was the start of huge hype coming
    from subject matter experts, organizations, and general users – to the point that,
    after only 5 days, the service reached 1 million users!


    Before writing about ChatGPT, I will let it introduce itself, using a snapshot
    taken a few days after the launch:


    ![Figure 2.25 – ChatGPT introduces itself in November 2022.](media/file33.png)


    Figure 2.25 – ChatGPT introduces itself in November 2022.


    As mentioned above, the first release of ChatGPT was built on top of an advanced
    language model that utilizes a modified version of GPT-3, which has been fine-tuned
    specifically for dialogue. This fine-tuned version is called GPT-3.5-turbo. The
    optimization process involved **Reinforcement Learning with Human Feedback** (**RLHF**),
    a technique that leverages human input to train the model to exhibit desirable
    conversational behaviors.


    We can define RLHF as a machine learning approach where an algorithm learns to
    perform a task by receiving feedback from a human. The algorithm is trained to
    make decisions that maximize a reward signal provided by the human, and the human
    provides additional feedback to improve the algorithm’s performance. This approach
    is useful when the task is too complex for traditional programming or when the
    desired outcome is difficult to specify in advance.


    The relevant differentiator here is that ChatGPT has been trained with humans
    in the loop so that it is aligned with its users. By incorporating RLHF, ChatGPT
    has been designed to better understand and respond to human language in a natural
    and engaging way.


    > The same RLHF mechanism was used for what we can think of as the predecessor
    of ChatGPT— InstructGPT. In the related paper published by OpenAI’s researchers
    in January 2022, InstructGPT is introduced as a class of models that is better
    than GPT-3 at following English instructions.


    ChatGPT is still available today as a free application anyone can use; however,
    since February 2023, OpenAI announced a new paid version called ChatGPT Plus and
    costs 20$/month, offering subscribers several advantages, including access to
    the latest models, fastest response time, a great set of plug-ins and the possibility
    to create your own Assistant in the GPTs playground.


    Let’s have a quick tour of ChatGPT user interface at the current date:


    ![Figure 3: Landing page of ChatGPT at chatgpt.com](media/file34.png)


    Figure 3: Landing page of ChatGPT at chatgpt.com


    Let’s double click on each section:


    1.  You can decide the model to use behind ChatGPT. In my case, I have set the
    GPT-4o, which is only available for paid subscription. This is the model we are
    going to use throughout this book.


    2.  A set of pre-built prompts are proposed to the user to familiarize themselves
    with the application.


    3.  The text box is the place where users can ask their questions. Note that there
    is a small clip in the left-hand corner: it indicates the possibility of uploading
    files the model will be able to navigate through. Those files can be either uploaded
    locally, or retrieved from cloud storage like Google Drive or OneDrive.


    4.  On the left-hand sidebar, you can see the list of previous chats (mine are
    covered) you had with ChatGPT. This is an extremely useful tool, since in each
    chat, through the various round of interactions you had with the model, you created
    a context ChatGPT is aware of. This means that, if you want to continue a previously
    started conversation, you can open the related chat and start talking with the
    model without describing again the whole scenario.


    5.  A nice recently added feature is the possibility of having shared workspaces
    with other users, so that you can cooperate with your team members. Note that
    this is an additional paid feature which is not included in the Plus plan, and
    it costs extra 5$/month.


    6.  Finally, ChatGPT Plus offers the possibility of creating the GPTs, that are
    personalized assistant you can tailor for specific functions. You can decide to
    keep your GPT private or to publish it into the GPTs store, where anyone can use
    and rate it. We are going to cover the GPTs in a dedicated Chapter later on in
    this book.


    Finally, ChatGPT Plus comes with two built-in plugins that the model can invoke
    autonomously if needed: the web search plug-in (to retrieve up-to-date information)
    and the code-interpreter plug-in (to process analytical documentation or perform
    complex mathematical tasks).


    Throughout this book, we will leverage ChatGPT Plus to showcase the capabilities
    of the latest models and features, nevertheless the majority of examples that
    we will cover can be achieved with the free version of ChatGPT as well (which
    is currently powered by GPT-3.5-turbo).


    The ongoing developments and improvements in ChatGPT’s architecture and training
    methods promise to push the boundaries of language processing even further.


    ## Summary


    In this chapter, we went through the history of OpenAI, its research fields, and
    the latest developments, up to ChatGPT. We went deeper into the OpenAI Playground
    for the test environment and how we can leverage all the OpenAI’s models families.'
