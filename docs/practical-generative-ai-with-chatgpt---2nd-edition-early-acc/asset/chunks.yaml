    ## 函数 (Functions)


    函数是对第 1 章中引入的工具或插件概念的另一种定义。通过函数，我们为模型提供了一种额外的技能，模型可以调用该技能来完成用户的任务。函数始终包含一个自然语言编写的描述，以便模型知道何时调用它。


    前面的定义对于理解如何使用 Azure OpenAI 模型系列以及如何配置它们的参数至关重要。


    在 Playground（游场）中，有四个部分可以与模型交互：


    ### 聊天 (Chat)

    在这里你可以测试今天可用的所有聊天模型，包括仅文本的模型（如 `GPT-3.5`）或多模态模型（如 `GPT-4o`）。你可以提供系统消息（system message）——即提供给模型的指令集，全部使用自然语言编写。你还可以在给定相同用户的情况下的情况下两个不同模型的输出。以下是此操作的示例：


    ![图 2.5 – 两个模型的比较示例。](img/file27.png)


    图 2.5 – 两个模型的比较示例。


    对于每个模型，你还可以调整一些可以配置的参数。列表如下：


    *   **温度 (Temperature)**（范围从 0 到 1）：这控制模型响应的随机性。低温度会让你的模型更具确定性，这意味着它倾向于对相同的问题给出相同的输出。例如，如果我在温度设置为
    0 的情况下多次询问我的模型*OpenAI 是什么？*，它将始终给出相同的答案。另一方面，如果我对一个温度设置为 1 的模型进行相同的操作，它会尝试在措辞和风格上每次都修改其答案。

    *   **最大标记数 (Max tokens)**：这控制模型对用户提示（prompt）响应的长度（以 token 为单位）。

    *   **停止序列 (Stop sequences)**（用户输入）：这使得响应在指定的点结束，例如句子或列表的末尾。

    *   **高概率 (Top probabilities)**（范围从 0 到 1）：这控制模型在生成响应时考虑哪些 token。将其设置为 0.9 将考虑所有可能的
    token 中概率最高的前 90% 的部分。有人可能会问*为什么不将高概率设为 1 以选择所有最可能的 token 呢？*答案是，当模型置信度较低时，即使在得分最高的
    token 中，用户可能仍然希望保持多样性。

    *   **频率惩罚 (Frequency penalty)**（范围从 0 到 1）：这控制生成响应中相同 token 的重复次数。惩罚越高，在同一个响应中看到相同
    token 出现一次以上的概率就越低。惩罚根据 token 到此为止在文中出现的频率比例减少概率（这与下一个参数的关键区别）。

    *   **存在惩罚 (Presence penalty)**（范围从 0 到 2）：这与上一个参数类似但更严格。它减少了重复到此为止在文中出现过的任何 token
    的概率。因为它比频率惩罚更严格，存在惩罚也增加了在响应中引入新话题的可能性。


    除了在 Playground 中尝试 OpenAI 模型之外，你始终可以在自定义代码中调用模型 API 并模型嵌入到你的应用程序中。事实上，在 Playground
    的右角，你可以点击 `View code`（查看代码）并按所示导出配置：


    ### 助手 (Assistants)

    OpenAI 助手可以看作是一种更快速、更方便开发 AI 代理（在第 1 章中介绍）的方法。事实上，助手可以定义为由 LLM 驱动的实体，拥有一套需要遵循的指令和一套可使用的工具或插件——基本上与
    AI 代理的定义相同！


    在 OpenAI 助手的情况下，它们带有三个预构建工具：


    *   **文件搜索 (File Search)**：它允许用户上传自定义文档，以便助手可以导航这些文档以完成查询。它基于 RAG 框架运行。

    *   **函数调用 (Function Calling)**：它允许用户定义一组自定义函数，助手可以调用这些函数来完成给定任务。

    *   **代码解释器 (Code Interpreter)**：指的是助手针对提供的文档运行代码的能力（例如需要数学计算的电子表格或分析论文），或简单解决用户提供的复杂任务（例如复杂的数学问题）。


    在接下面的图中，你可以看到一个名为“Chat with PDF”的助手的示例，它专门根据提供的文档进行回答（在我的情况下，我上传了 Hugo Touvron
    等人的论文“LLaMA: Open and Efficient Foundation Language Models”）。


    ![图 2.8 – OpenAI 助手的示例。](img/file28.png)


    图 2.8 – OpenAI 助手的示例。


    从前面的屏幕截可以看出，助手能够从提供的文档中检索知识来回答我的问题。事实上，我的问题相当模糊，因为“毒性”（toxicity）一词可以指多个领域；尽管如此，助手知道将提供的文档作为主要信息来源。


    ### 补全 (Completions)

    此部分指的是类被称为“基础模型”（base models）的模型，如 `GPT-3`，它们是构建所谓的“助手模型”（或我们之前看到的聊天模型）的基础。例如，聊天模型
    `GPT-3.5-turbo`（ChatGPT 背后的模型）是基础模型 `GPT-3` 的微调版本。


    > 补全（基础）模型设计用于对提示生成单个响应，这使得它们适用于文本生成和摘要等任务，而无需在多次交互中维护上下文。相比之下，聊天（助手）模型针对交互式对话进行了优化，能够在多轮会话中维护上下文，是聊天机器人和虚拟助手等应用的理想选择。


    在下面你可以看到 Playground 中一个典型补全任务的示例：


    ![图 1: Playground 中的补全任务示例](img/file29.png)


    图 1: Playground 中的补全任务示例


    如你所见，当我输入“今天我我去了一家杂货店并”，模型用最可能的词补全了句子。今天，补全模型很少使用，因为它们的性能被聊天模型超越，但它们可以进一步微调以适应特定的用例（我们稍后会介绍微调）。


    *   **文本转语音 (Text to speech)**：除了上述语音转文本模型 `Whisper` 外，OpenAI 还发布了其 `TTS`（文本转语音）模型，可以在
    Playground 中直接测试。


    让我们来看一个示例：


    ![图 2: 在 Playground 中使用 OpenAI TTS 模型的示例](img/file30.png)


    图 2: 在 Playground 中使用 OpenAI TTS 模型的示例


    如上面的图片所示，你可以选择生成音频的语音、模型、速度和格式。


    所有之前的模型都是预构建的，这意味着因为它们已经在海量知识库上进行了预训练。


    然而，你有一些方法可以让你的模型更加定制化并适应你的用例。


    第一种方法嵌入在模型的设计中，它涉及通过**少样本学习方法**（few-learning approach）为模型提供上下文（我们将在书中后面重点介绍这种技术）。具体来说，你可以要求模型生成一篇与你已经写的文章模板和词汇相类似的文章。为此，你可以为模型提供生成文章的查询*以及*之前的文章作为参考或上下文，以便模型为你的请求做好更好的准备。


    以下是它的示例：


    ![图 2.11 – OpenAI Playground 中带有少样本学习的对话示例](img/file31.png)


    图 2.11 – OpenAI Playground 中带有少样本学习的对话示例


