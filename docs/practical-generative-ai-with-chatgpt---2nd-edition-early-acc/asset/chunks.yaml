    ## 图像生成


    生成式 AI 在图像合成领域最早且最为人知的例子之一，是 I. Goodfellow 等人在 2014 年的论文《生成对抗网络》（*Generative Adversarial
    Networks*）中引入的`生成对抗网络`（`GAN`）架构。`GAN` 的目的是生成与真实图像无区分的真实图像。这种能力具有许多有趣的业务应用，例如为训练计算机视觉模型生成合成数据集、生成真实的商品图像，以及为虚拟现实和增强现实应用生成真实的图像。


