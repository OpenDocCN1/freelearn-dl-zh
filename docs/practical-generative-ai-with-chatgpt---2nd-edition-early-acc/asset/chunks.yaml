- fmt: '

    To overcome this limitation, AI agents emerge as key players. But what exactly
    are they? Agents can be seen as AI systems powered by Large Language Models that,
    given a user’s query, are able to interact with the surrounding ecosystem to the
    extent to which we allow them to. The perimeter of the ecosystem is delimited
    by the tools (or plug-ins) we provide the agents with (in our previous example,
    we might provide the agent with a LinkedIn plug-in, so that it is able to post
    the generated content).


    Agents are made of the following ingredients:


    * An LLM which acts as the reasoning engine of the AI system.

    * A system message which instructs the Agent to behave and think in a given way.
    For example, you can design an Agent as a teaching assistant for students with
    the following system message: “You are a teaching assistant. Given a student’s
    query, NEVER provide the final answer, but rather provide some hints to get there”.

    * A set of tools the Agent can leverage to interact with the surrounding ecosystem.


    AI Agents are a perfect representation of the meaning of “LLM as reasoning engine
    of an application”. In fact, the beauty of Agents is that they can pick the best
    tool to use to accomplish a user’s request. For example, let’s say we have an
    AI agent to produce LinkedIn content, and we provide it with two tools: a LinkedIn
    plug-in and a web search plug-in (each one with a proper description of its functionality).
    Then, let’s explore the behaviour of the agent upon two different questions:


    * Generate a story about a little dog walking around the mountains🡪the Agent will
    generate the story without involving any plug-in.

    * Generate a story about the current weather in Milan🡪the Agent will invoke the
    web search plug-in to get the current weather in Milan.

    * Generate a LinkedIn post about the current weather in Mialn and publish it on
    my profile:the Agent will invoke the web search plug-in to get the current weather
    in Milan and the LinkedIn plug-in to post it on my profile.


    The combinations of instructions and set of plug-ins make AI Agents extremely
    versatile, and you can create highly specialized entities to address specific
    scenarios.


    And that’s not all.


    Why having only one Agents if you can create your own crew of Agents talking to
    and cooperating among each other? Imagine multiple agents, each one with a specific
    expertise and goal, communicating and interacting among each other to accomplish
    a task. This is how `multi-agent applications` look like, and in the last few
    months, this pattern started showing emergent behaviors.


    Let’s consider the following example. We want to generate an elevator pitch about
    the climate change. We need up date information to do so (latest trends and research,
    future perspectives and so on), as well as solid research grounded by academic
    papers. Plus, we need to be concise yet sharp and effective, delivering all the
    key information in a very short pitch.


    Now, we could ask all of that to a single agent, providing it with all the needed
    tools and with long instructions to accomplish the task. However, it is proven
    that LLMs tend to perform worse when we give them “too many things to do”. Instead,
    let’s use a multi-agent approach, creating a team with the following AI professionals:


    * A market analyst who can search the web for the latest news about climate change
    this will be an Agent with a web search plug-in and specific instructions to search
    for news;

    * An expert researcher who can easily navigate through academic research papers
    about climate change this will be an Agent with an `Arxiv` plug-in and specific
    instructions on how to retrieve relevant information;

    * A expert in public speaking who can easily consolidate all the information in
    one elevator pitch this will be an Agent with proper instructions on how to deliver
    perfect pitches;

    * A critic who will review the pitch and propose some changes to the expert in
    public speaking, if needed this will be an Agent with proper instructions on how
    to deliver perfect pitches;


    So, upon the user’s question “Generate an elevator pitch about the current issue
    of climate change”, all the agents can start working on the project.


    There are many frameworks that can help developer with multi-agent applications
    (including `AutoGen`, `LangGraph`, `CrewAI`), especially when it comes to the
    “flow” that we want our agents to follow. For example, we might want to enforce
    a specific number of iterations; or that all agents are invoked at least once;
    or even to involve us, as users, every iteration to provide further feedback to
    be incorporated in the upcoming iteration.


    At the time of writing, multi-agent framework is showing promising advancements,
    yet it is still in an experimentation phase and probably still far from being
    enterprise-ready. Nevertheless, it is a glimpse of the outstanding reasoning capabilities
    behind LLMs and how they can unlock new ways of problem solving and creation.


    ### Small Language Models


    Large Language Models are, unsurprisingly, large. It means that the architecture
    of the Artificial Neural Network featuring LLMs is made of a huge amount of parameters,
    of the order of trillions. Ideally, the higher the number of parameters, the better
    the reasoning capabilities of the LLM. However, with high numbers of parameters
    come high cost of training and hosting, since a powerful AI infrastructure is
    needed. Plus, the energy consumption required by those models raise serious questions
    about the environmental impact of LLMs training and their overall sustainability
    in the long run. To give you an idea, these are some numbers related to open-source
    LLMs with different sizes (measured in number of parameters):


    ![Figure 2: Carbon footprint and compute power required to train different models
    in the same datacenter. Source: https://arxiv.org/pdf/2302.13971](media/file20.png)


    Figure 2: Carbon footprint and compute power required to train different models
    in the same datacenter. Source: https://arxiv.org/pdf/2302.13971


    Luckily, over the last months, we witnessed a rising interest and investment in
    the research of smaller models, with the goal of maintaining decent reasoning
    capabilities while reducing the number of parameters. The idea is that smaller
    models, even if “less intelligent”, can still reach the desired requirements if
    specialized in more tailored activities.


    These smaller models are called Small Language Models (SMLs) and, beside being
    lighter and less demanding in terms of infrastructure, they are also showing surprisingly
    high performance.


    For example, if we consider the smaller version of `Phi-3`, part of the popular
    SLM family developed by Microsoft, with “only” 7 billion parameters, we can see
    that it beats `GPT-3.5-turbo` in all the most popular LLMs benchmarks:


    Figure 3: benchmark table of Phi-3 Small capabilities compared to other SLMs and
    LLMs. Source: https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/](media/file21.png)


    Figure 3: benchmark table of Phi-3 Small capabilities compared to other SLMs and
    LLMs. Source: https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/


    Now, we might think that `GPT-3.5-turbo` is kind of “deprecated”, however we have
    to remember that, with its 175B parameters, it used to be the most powerful model
    in the market just 1 year ago, and it is remarkable to see that a 7B model is
    capable of better results.


    That of SLMs is definitely a research stream to keep an eye on, especially when
    it comes to those scenarios where I might want to deploy my model locally or even
    customizing it with fine-tuning (we will cover fine tuning in the next chapter).

    '
