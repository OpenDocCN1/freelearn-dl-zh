  trans: '

    Transformers 确实是名为 `Bidirectional Encoder Representations from Transformers` (`BERT`)
    的大规模语言模型的基础，该模型由 Google 于 2018 年引入，并迅速成为 NLP 实验的基准。


    Transformers 也是 OpenAI 引入的所有 `Generative Pre-Trained` (`GPT`) 模型的基础，包括 ChatGPT
    背后的模型 `GPT-3`，以及其他大型基础模型（Large Foundation Models）。


    尽管在这些几年取得了大量的研究和成就，但直到 2022 年下半年，公众的注意力才开始转向生成式 AI 领域。


    并非巧合，2022 年被称为“生成式 AI 之年”。这一年，强大的 AI 模型和工具在普通民众中变得普及：基于扩散的图像服务（MidJourney、`DALL-E
    2` 和 `Stable Diffusion`）、OpenAI 的 `ChatGPT`、文本生成视频（`Make-a-Video` 和 `Imagen Video`）以及文本生成
    3D 工具（`DreamFusion`、`Magic3D` 和 `Get3D`）都向个人用户开放，有时甚至是免费的。


    这产生了颠覆性的影响，原因有二：


    * 一旦生成式 AI 模型在公众中普及，每个个人用户或组织都有可能尝试并欣赏其潜力，即使他们不是数据科学家或 ML 工程师。

    * 这些新模型的输出及其嵌入的创造力在客观上是令人惊叹的，而且往往令人担忧。一种针对个人和政府的、适应变革的紧迫呼声随之而起。


    因此，在不久的将来，我们可能会见证个人使用和企业级项目采用 AI 系统的激增。


    ## 18 个月后：主要趋势与创新


    从 2022 年 11 月到今天，我们见证了生成式 AI（GenAI）领域海量的创新。这些创新许多与向公众开发并发布的全新模型有关，例如 OpenAI 的
    `GPT-4o` 和 `DALL-E3`，以及 Google 的 `Gemini`、Meta 的 `Llama 3`、微软的 `Phi3` 等。


    然而，最引注目的成就可能在于我们与这些模型交互以及围绕它们构建应用程序的方式。在本节中，我们将探索标记了生成式 AI 应用最流行的参考架构的三大主要进展。


    ### 检索增强生成 (Retrieval Augmented Generation)


    `ChatGPT` 以及广义上的 `LLMs` 的早期局限性之一是知识库截止。事实上，`LLMs` 的知识局限于它们训练过的训练集（由互联网上的公共信息组成），只要这些信息不是详尽的，它们就是过时的。此外，它们还缺少可能与我们或我们的组织相关的私有知识库。例如，如果你问
    `ChatGPT` “我们公司员工健康保险的政策是什么？”，模型将无法回答，因为它无法访问这些信息。


    为了绕过这一局限，设计了一种新框架，允许 `LLMs` 导航我们提供的自定义文档。这个框架被称为检索增强生成（`RAG`）。


    `RAG` 背后的思想是将 `LLM` 与我们想要导航的知识库解耦。为了实现这一点，外部知识库需要通过一个名为 `embedding`（嵌入）的过程转换为数值向量，并存储在专门的
    `Vector Database`（向量数据库）中。


    > 嵌入是在低维空间（如向量）中表示高维非数值数据（如单词或句子）的方法。文本嵌入可以捕捉文本的语义和语法特征，例如含义、上下文和相似性。


    > > 每个嵌入都是一个浮点数向量，使得向量空间中两个嵌入之间的距离与原始格式中两个输入之间的语义相似性相关。


    例如，如果两个概念相似，那么它们的向量表示也相似的。


    ![](img/file12.png)


    `RAG` 由三个阶段组成：


    * **检索 (Retrieval)**：给定用户的查询及其对应的向量，检索出最相似的文档片段（那些对应的向量接近用户查询向量的片段），并将其作为 `LLM`
    的基础上下文。

    ![](img/file13.png)

    * **增强 (Augmentation)**：通过额外的指令、规则、安全护栏以及类似于提示词工程（prompt engineering）技术的典型实践来丰富检索到的上下文（我们将在第
    3 章中介绍提示词工程主题）。

    ![](img/file14.png)

    * **生成 (Generation)**：基于增强的上下文，`LLM` 生成对用户查询的响应。

    ![](img/file15.png)


    整个流程如下：


    ![](img/file16.png)


    `RAG` 结合了生成式模型和信息检索系统的优势，以增强生成内容的质量和相关性。传统的生成式模型仅依赖其训练数据来产生响应，这有时会导致过时或无关的信息。`RAG`
    通过在生成过程中整合外部知识库解决了这一局限性。


    例如，OpenAI 的 `ChatGPT` 在通过 `RAG` 增强后，可以从可靠源获取当前数据，以回答关于近期事件的查询，这本属于其训练截止的范围。这种检索与生成的协同扩大了生成式
    AI 的适用性，使其在动态、信息丰富的环境中更加稳健和实用。


    ### 多模态性 (Multimodality)


    在本章的第一段，我们看到了生成式 AI 的各个领域，从文本到图像，从视频到音乐。通常，大型基础模型倾向于特定领域，正如我们在语言理解和生成领域的大型语言模型（LLMs），或图像生成领域的
    `DALL-E3` 中看到的那样。


    然而，生成式 AI 的最新进展使得大型多模态模型（`LMMs`）成为，它们可以处理和生成不同类型的数据，如文本、图像、音频和视频。


    `LMMs` 与“标准”大型语言模型（`LLMs`）共享大型基础模型典型的泛化和适应能力。然而，`LMMs` 能够处理异构数据，其理念是镜像人类与周围生态系统交互的方式——即通过我们所有的感官。


    多模态模型的一个很好的例子是 OpenAI 的 `GPT-4o`，它能够通过文本、图像和音频与用户交互。让我们来看例子：


    ![](img/file17.png)


    如你所示，模型能够分析图像并对其进行推理。现在让我们让模型生成一张插图：


    ![](img/file18.png)


    关于 `LMMs` 最有趣的事实是，它们保留了推理能力，使得它们适用于异构数据语境下的复杂推理。让我们考虑最后这个例子（仅显示响应的前几行）：


    ![](img/file19.png)


    正如你所想象的，这为各个行业开启了应用前景，我们将在后续章节中看到一些示例。


    ### AI 代理 (AI Agents)


    在之前的节中，我们揭示了 `LFMs` 在共鸣和生成内容方面表现出色。然而，它们缺乏一种能力，即超越单个用户采取行动并与周围生态系统交互的能力。例如，如果我们希望
    `LLM` 不仅能生成一条出色的 LinkedIn 帖子，还能将其发布在我们的页面上，呢？


