    \ Landing page of our ResearchGPT](media/file193.png)\nFigure 46: Landing page\
    \ of our ResearchGPT\n\nLet’s test it:\n\n1. I’ll first ask a generic question,\
    \ that will be addressed with the provided papers:\n   ![Figure 47: Example of\
    \ ResearchGPT retrieving knowledge from provided documents](media/file194.png)\n\
    \   Figure 47: Example of ResearchGPT retrieving knowledge from provided documents\n\
    \n2. Then, I want to see whether the topic is already covered:\n   ![Figure 48:\
    \ Example of ResearchGPT talking to Notion with the pre-defined action.](media/file195.png)\n\
    \   Figure 48: Example of ResearchGPT talking to Notion with the pre-defined action.\n\
    \n3. Finally, I want to integrate the topic to make it unique:\n   ![Figure 49:\
    \ Example of ResearchGPT using the web browser plugin.](media/file196.png)\nFigure\
    \ 49: Example of ResearchGPT using the web browser plugin.\n\nAs you can see,\
    \ our Assistant could leverage all the tools we provided it with, calling the\
    \ `Notion DB` when needed.\n\n## Summary\n\nIn this Chapter, we explored how to\
    \ get customized GPTs to address your specific goals. The possibility of tailoring\
    \ `ChatGPT` opens a new landscape of scenarios, where highly specialized AI assistant\
    \ becomes the everyday companion of professionals. Plus, OpenAI offered a no-code\
    \ UI to create GPTs, so that all citizen developers can benefit not only from\
    \ the extended marketplace of available solutions, but also from their own creations.\n\
    \nWith the plugins extensibility and the custom knowledge base, custom GPTs can\
    \ serve you for limitless tasks. Then, with the addition of powerful actions,\
    \ they can also communicate with the surrounding environment and evolve from “mere”\
    \ generation to automation.\n\nWith this Chapter, we also conclude Part 2 of this\
    \ book, where we focused on practical applications of `ChatGPT`. Starting from\
    \ next Chapter, we are going to cover more in details how large enterprises can\
    \ leverage OpenAI models and embed them into their business processes. We will\
    \ cover trending enterprise use cases and see practical implementation on how\
    \ to embed OpenAI’s LLMs via `REST API` in your applications.\n\n## References\n\
    \n- [https://arxiv.org/abs/2312.11914](https://arxiv.org/abs/2312.11914)\n- [https://arxiv.org/abs/2101.07714](https://arxiv.org/abs/2101.07714)\n\
