- fmt: "\nWhenever working with new applications or projects, it is always good practice\
    \ to correlate your code with documentation. It might be in the form of a docstring\
    \ that you can embed in your functions or classes so that others can invoke them\
    \ directly in the development environment.\n\nFor example, let’s consider the\
    \ same function developed in the previous section and let’s make it a Python class:\n\
    \n```\nclass UnderscoreAdder:\n    def __init__(self, word):\n        self.word\
    \ = word\n    def add_underscores(self):\n        new_word = \"\"\n        for\
    \ i in range(len(self.word)):\n            new_word += self.word[i] + \"_\"\n\
    \        return new_word\n```\n\nWe can test it as follows:\n\n![Figure 5: Testing\
    \ the UnderscoreAdder class.](media/file94.png)\n\nFigure 5: Testing the `UnderscoreAdder`\
    \ class.\n\nNow, let’s say I want to be able to retrieve the docstring documentation\
    \ using the `UnderscoreAdder`` convention. By doing so with Python packages, functions,\
    \ and methods, we have full documentation of the capabilities of that specific\
    \ object, as follows (an example with the `pandas` Python library):![Figure 6.13\
    \ – Example of the pandas library documentation](media/file95.png)\n\nFigure 6.13\
    \ – Example of the `pandas` library documentation.\n\nSo, let’s now ask ChatGPT\
    \ to produce the same result for our `UnderscoreAdder` class.\n\n![Figure 6.14\
    \ – ChatGPT updating the code with documentation](media/file96.png)\n\nFigure\
    \ 6.14 – ChatGPT updating the code with documentation.\n\nAs a result, if we update\
    \ our class as shown in the preceding code and `UnderscoreAdder`?, we will get\
    \ the following output:\n\n![Figure 6.15 – The new UnderscoreAdder class documentation](media/file97.png)\n\
    \nFigure 6.15 – The new `UnderscoreAdder` class documentation.\n\nFinally, ChatGPT\
    \ can also be leveraged to explain what a script, function, class, or other similar\
    \ things do in natural language. We have already seen many examples of ChatGPT\
    \ enriching its code-related response with clear explanations. However, we can\
    \ boost this capability by asking specific questions in terms of code understanding.\n\
    \nFor example, let’s ask ChatGPT to explain to us what the following Python script\
    \ does:\n\n![Figure 6.16 – Example of ChatGPT explaining a Python script](media/file98.png)\n\
    \nFigure 6.16 – Example of ChatGPT explaining a Python script.\n\nCode explainability\
    \ can also be part of the preceding mentioned documentation, or it can be used\
    \ among developers who might want to better understand complex code from other\
    \ teams or (as sometimes happens to me) remember what they wrote some time ago.\n\
    \nThanks to ChatGPT and the capabilities mentioned in this section, developers\
    \ can easily keep track of the project life cycle in natural language so that\
    \ it is easier for both new team members and non-technical users to understand\
    \ the work done so far.\n\nWe will see in the next section how code explainability\
    \ is a pivotal step for ML model interpretability in data science projects.\n\n\
    ## Understanding ML model interpretability\n\nModel interpretability refers to\
    \ the degree of ease with which a human can comprehend the logic behind the ML\
    \ model’s predictions. Essentially, it is the capability to comprehend how a model\
    \ arrives at its decisions and which variables are contributing to its forecasts.\n\
    \nLet’s see an example of model interpretability using a deep learning convolutional\
    \ neural network (`CNN`) for image classification. I built my model in Python\
    \ using `Keras`. For this purpose, I will download the `CIFAR-10` dataset directly\
    \ from `keras.datasets`: it consists of 60,000 32x32 color images (so 3-channels\
    \ images) in 10 classes (airplane, automobile, bird, cat, deer, dog, frog, horse,\
    \ ship, and truck), with 6,000 images per class. Here, I will share just the body\
    \ of the model; you can find all the related code in the book’s GitHub repository\
    \ for data preparation and pre-processing at [https://github.com/PacktPublishing/The-Ultimate-Guide-to-ChatGPT-and-OpenAI/tree/main/Chapter%206%20-%20ChatGPT%20for%20Developers/code](https://github.com/PacktPublishing/The-Ultimate-Guide-to-ChatGPT-and-OpenAI/tree/main/Chapter%206%20-%20ChatGPT%20for%20Developers/code):\n\
    \n```\nmodel=tf.keras.Sequential()\nmodel.add(tf.keras.layers.Conv2D(32,kernel_\
    \ size=(3,3),activation='relu',input_shape= (32,32,1)))\nmodel.add(tf.keras.layers.MaxPooling2D(pool_size=(2,2)))\
    \ model.add(tf.keras.layers.Flatten()) model.add(tf.keras.layers.Dense(1024,activation='relu'))\
    \ model.add(tf.keras.layers.Dense(10,activation='softmax'))\n```\n\nThe preceding\
    \ code is made of several layers that perform different actions. I might be interested\
    \ in having an explanation of the structure of the model as well as the purpose\
    \ of each layer. Let’s ask ChatGPT for some help with that (below you can see\
    \ an extract of the response):\n\n![Figure 6.17 – Model interpretability with\
    \ ChatGPT](media/file99.png)\n\nFigure 6.17 – Model interpretability with ChatGPT.\n\
    \nAs you can see in the preceding figure, ChatGPT was able to give us a clear\
    \ explanation of the structure and layers of our `CNN`. It also adds some comments\
    \ and tips, such as the fact that using the max pooling layer helps reduce the\
    \ dimensionality of the input.\n\nI can also be supported by ChatGPT in interpreting\
    \ model results in the validation phase. So, after splitting data into training\
    \ and test sets and training the model on the training set, I want to see its\
    \ performance on the test set:\n\n![Figure 6.18 – Evaluation metrics](media/file100.jpg)\n\
    \nFigure 6.18 – Evaluation metrics.\n\nLet’s also ask ChatGPT to elaborate on\
    \ our validation metrics (truncated output):\n\n![Figure 6.19 – Example of ChatGPT\
    \ explaining evaluation metrics](media/file101.png)\n\nFigure 6.19 – Example of\
    \ ChatGPT explaining evaluation metrics.\n\nOnce again, the result was really\
    \ impressive, and it provided clear guidance on how to set up ML experiments in\
    \ terms of training and test sets. It explains how important it is for the model\
    \ to be sufficiently generalized so that it not notfit and is able to predict\
    \ accurate results on data that it has never seen before.\n\nThere are many reasons\
    \ why model interpretability is important. A pivotal element is that it reduces\
    \ the gap between business users and the code behind models. This is key to enabling\
    \ business users to understand how a model behaves, as well as translate it into\
    \ code business ideas.\n\nFurthermore, model interpretability enables one of the\
    \ key principles of responsible and ethical AI, which is the transparency of how\
    \ a model behind AI systems thinks and behaves. Unlocking model interpretability\
    \ means detecting potential biases or harmful behaviors a model could have while\
    \ in production and consequently preventing them from happening.\n\nOverall, ChatGPT\
    \ can provide valuable support in the context of model interpretability, generating\
    \ insights at the row level, as we saw in the previous example.\n\nThe next and\
    \ last ChatGPT capability we will explore will be another boost for developers’\
    \ productivity, especially when various programming languages are being used within\
    \ the same project.\n\n## Translation among different programming languages\n\n\
    In Chapter 5, we saw how ChatGPT has great capabilities for translating between\
    \ different languages. What is really incredible is that natural language is not\
    \ its only object of translation. In fact, ChatGPT is capable of translating between\
    \ different programming languages while keeping the same output as well as the\
    \ same style (namely, it preserves docstring documentation if present).\n\nThere\
    \ are so many scenarios when this could be a game changer.\n\nFor example, you\
    \ might have to learn a new programming language or statistical tool you’ve never\
    \ seen before because you need to quickly deliver a project on it. With the help\
    \ of ChatGPT, you can start programming in your language of preference and then\
    \ ask it to translate to the desired language, which you will be learning alongside\
    \ the translation process.\n"
