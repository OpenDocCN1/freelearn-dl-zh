  trans: "\n\n- **单样本学习（One-shot learning）**：在这种学习类型中，模型对于每个要求执行的新任务只获得一个示例。模型必须利用其先验知识从这个单一示例中泛化，以完成任务。如果我们考虑之前的示例，我可以在要求模型生成新内容之前，为它提供一个\
    \ `prompt-completion` 示例：\n\n![Figure 4.4 – 单样本学习示例](img/file43.png)\n\n图 4.4\
    \ – 单样本学习示例\n\n```\n{\"prompt\": \"<prompt text>\", \"completion\": \"<ideal generated\
    \ text>\"}\n```\n\n注意，我提供示例的方法与用于微调的结构相似：\n\n- **少样本学习（Few-shot learning）**：在这种学习类型中，模型对于每个要求执行的新任务会被给出一个少量示例（通常在\
    \ 2 到 5 个之间）。模型必须利用其先验知识从这些示例中泛化以完成任务。让我们继续之前的示例，为模型提供更多示例：\n\n![Figure 4.5 –\
    \ 包含三个示例的少样本学习示例](img/file44.png)\n\n图 4.5 – 包含三个示例的少样本学习示例\n\n少样本学习的优点在于，你还可以控制模型输出的呈现方式。你也可以为模型提供一个你希望输出格式的模板。例如，考虑以下推文分类器：\n\
    \n![Figure 4.6 – 用于推文分类器的少样本学习。这是来自 https://learn.microsoft.com/en-us/azure/cognitive-services/openai/how-to/completions\
    \ 原始脚本的修改版本](img/file45.png)\n\n图 4.6 – 用于推文分类器的少样本学习。这是来自 https://learn.microsoft.com/en-us/azure/cognitive-services/openai/how-to/completions\
    \ 原始脚本的修改版本。\n\n让我们检查上面的图。首先，我为 ChatGPT 提供了一些带标签的推文示例。然后，我提供了相同的推文，但使用了不同的数据格式（列表格式），以及同样格式的标签。最后，我以列表格式提供了未标记的推文，以便模型以列表形式返回标签。\n\
    \n标签。\n\n少样本学习（Shot-learning）的可能性是无限的——这取决于测试以及在寻找合适的提示词（prompt）设计时的一点耐心。\n\n\
    如之前提到的，重要的是记住这些学习形式与传统的监督学习以及微调是不同的。在少样本学习中，目标是让模型能够从极少数示例中学习，并从这些示例泛化到新任务。\n\n\
    现在我们已经学会了如何让 OpenAI 模型从示例中学习，让我们关注如何正确定义我们的提示词，以使模型的响应尽可能准确。\n\n## 提示词工程原则\n\n\
    传统上，在计算和数据处理的背景下，我们经常使用“垃圾进，垃圾出（garbage in, garbage out）”这一说法，意味着输出的质量取决于输入的质量。如果向系统输入了错误或低质量的数据（垃圾），输出也将是有缺陷或毫无意义的（垃圾）。\n\
    \n在涉及提示词（prompting）时，情况也类似：如果我们希望从 LLM 获得准确且相关的结果，我们需要提供高质量的输入。然而，构建良好的提示不仅取决于响应的质量。事实上，我们可以构建良好的提示词来：\n\
    \n* 最大化 LLM 响应的相关性\n* 指定响应的类型、格式和风格\n* 提供对话上下文\n* 减少内部偏见并提高公平性和包容性\n* 减少幻觉\n\n\
    > 在大语言模型（LLMs）的语境下，“幻觉（hallucination）”指的是生成事实上错误、无意义或未基于训练数据的文本或响应。当 LLM 产生听起来自信但错误或虚假的信息时，就会发生幻觉。幻觉的产生由于这些模型的概率性质，它们可能会根据模式而非验证的事实来预测下一个词或短语。\n\
    \n让我们看看实现这些结果的基本技术。\n\n### 清晰的指令\n\n给出清晰指令的原则是为模型提供足够的信息和指导，使其正确且高效地执行任务。清晰的指令应该包含以下元素：\n\
    \n* 任务的目标或目的，例如“写一首诗”或“总结文章”。\n* 预期输出的格式或结构，例如“使用带有押韵字的四行诗”或“使用项目符号，每项不超过 10 个字”。\n\
    * 任务的约束或限制，例如“不要使用任何脏话”或“不要从源文件中复制任何文本”。\n* 任务的上下文或背景，例如“这首诗是关于秋天的”或“这篇文章来自某科学期刊”。\n\
    \n假设，我们希望模型从文本中提取任何类型的指令，并以项目列表的形式向我们返回教程。此外，如果提供的文本没有指令，模型应该告知我们。\n\n为了尝试这样做，让我们利用\
    \ OpenAI Playground 中的聊天部分，这样我们就可以同时提供元提示词（metaprompt）和提示词（prompt）。\n\n对于这种场景，我将设置以下元提示词：\n\
    \n```\n你是一个 AI 助手，通过根据文本生成教程来帮助人类。\n你将提供一段文本。如果文本包含关于如何进行某事的任何指令，请生成一个列表格式的教程。\n\
    否则，告知用户文本不包含任何指令。\n```\n\n这是我们的用户提示词：\n\n```\n为了准备来自意大利热那亚的已知酱汁，你可以从烤松子开始，然后在厨房研钵中与罗勒和大蒜一起粗略切碎。然后，在厨房研钵中加入一半油，并用盐和胡椒调味。\n\
    最后，将青酱转移到碗中，拌入碎的帕玛森奶酪。\n```\n\n让我们看看它是如何工作的：\n\n![Figure 4: 元提示词中清晰指令的示例](img/file46.png)\n\
    \n图 4: 元提示词中清晰指令的示例。\n\n注意，如果我们给模型传递另一个不包含任何指令的文本，它将按照我们指示的方式做出回答：\n\n![Figure\
    \ 5: 聊天模型遵循指令的示例](img/file47.png)\n\n图 5: 聊天模型遵循指令的示例。\n\n通过给出清晰的指令，你可以帮助模型理解你想让它做什么以及你想让怎么做。这可以提高模型输出的质量和相关性，并减少进一步修订或修正的需求。\n\
    \n然而，有时仅仅有清晰度是不够的。我们可能需要推断 LLM 的思维方式，使其在执行任务时更加健壮。在下一节中，我们将检查这种技术之一，它在完成复杂任务时非常有用。\n\
    \n### 将复杂任务拆分为子任务\n\n提示词工程是一项设计有效输入以供大语言模型（LLMs）执行各种任务的技术。有时，任务对于单个提示词来说过于复杂或模糊，此时将它们拆分为由不同提示词解决的更简单的子任务更好。\n\
    \n以下是将复杂任务拆分为子任务的一些示例：\n\n* 文本摘要：一项涉及为长文本生成简洁准确摘要的复杂任务。该任务可以拆分为若干子任务，例如：\n   \
    \ * 从文本中提取要点或关键词。\n    * 以连贯流畅的方式重写要点或关键词。\n    * 修剪摘要以符合所需的长度或格式。\n* 机器翻译：一项涉及将文本从一种语言翻译成另一种语言的复杂任务。该任务可以被拆分为若干子任务，例如：\n\
    \    * 检测文本的源语言。\n\n"
- fmt: "\n- Converting the text into an intermediate representation that preserves\
    \ the meaning and structure of the original text.\n- Generating the text in the\
    \ target language from the intermediate representation.\n- **Poem generation**:\
    \ A creative task that involves producing a poem that follows a certain style,\
    \ theme, or mood. This task can be split into subtasks such as:\n    - Choosing\
    \ a poetic form (such as sonnet, haiku, limerick, etc.) and a rhyme scheme (such\
    \ as ABAB, AABB, ABCB, etc.) for the poem.\n    - Generating a title and a topic\
    \ for the poem based on the user’s input or preference.\n    - Generating the\
    \ lines or verses of the poem that match the chosen form, rhyme scheme, and topic.\n\
    \    - Refining and polishing the poem to ensure coherence, fluency, and originality.\n\
    - **Code generation**: A technical task that involves producing a code snippet\
    \ that performs a specific function or task. This task can be split into subtasks\
    \ such as:\n    - Choosing a programming language (such as `Python`, `Java`, `C++`,\
    \ etc.) and a framework or library (such as `TensorFlow`, `PyTorch`, `React`,\
    \ etc.) for the code.\n    - Generating a function name and a list of parameters\
    \ and return values for the code based on the user’s input or specification.\n\
    \    - Generating the body of the function that implements the logic and functionality\
    \ of the code.\n    - Adding comments and documentation to explain the code and\
    \ its usage.\n- Let’s consider the following example. We will provide the model\
    \ with a short article and ask it to summarize it following these instructions:\n\
    \n```\nYou are an AI assistant that summarize articles.\nTo complete this task,\
    \ do the following subtasks:\nRead the provided article context comprehensively\
    \ and identified the main topic and key points\nGenerated a paragraph summary\
    \ of the current article context that captures the essential information and conveys\
    \ the main idea\nPrint each step of the process.\n```\n\nThis is the short article\
    \ I will provide:\n\n```\nLarge Language Models (LLMs), a subset of artificial\
    \ intelligence, have revolutionized the field of natural language processing by\
    \ demonstrating an unprecedented ability to understand and generate human-like\
    \ text. These models are trained on vast datasets comprising diverse linguistic\
    \ inputs, enabling them to produce coherent and contextually relevant responses\
    \ across a wide range of topics. By leveraging architectures such as transformers,\
    \ LLMs like GPT-3 and its successors can complete text, answer questions, perform\
    \ translations, and even engage in complex dialogue. Their applications span from\
    \ automated customer support and content creation to advanced research and education\
    \ tools. Despite their incredible capabilities, LLMs also pose challenges, including\
    \ the potential for biases inherent in training data and the risk of generating\
    \ misleading or false information. As the development of LLMs continues to advance,\
    \ ongoing efforts in ethical AI research and deployment strategies are crucial\
    \ to harness their benefits responsibly and effectively.\n```\n\nLet’s see how\
    \ the model works:\n\n![Figure 6: Example of OpenAI GPT-4o splitting a task into\
    \ subtasks to generate a summary.](media/file48.png)\n\nFigure 6: Example of OpenAI\
    \ GPT-4o splitting a task into subtasks to generate a summary.\n\nSplitting complex\
    \ tasks into easier sub-tasks is a powerful technique, nevertheless it does not\
    \ address one of the main risks of LLM-generated content, that is, having a wrong\
    \ output. In next two sections, we are going to see some techniques that are mainly\
    \ aimed at addressing this risk.\n\n### Ask for justification\n\nLLMs are built\
    \ in such a way that they predict the next token based on the previous ones without\
    \ looking back at their generations. This might lead the model to output wrong\
    \ content to the user, yet in a very convincing way. If the LLM-powered application\
    \ does not provide specific reference to that response, it might be hard to validate\
    \ the ground truth behind it.\n\nHenceforth, specifying in the prompt to support\
    \ the LLM’s answer with some reflections and justification could prompt the model\
    \ to recover from its actions.\n\nFurthermore, asking for justification might\
    \ be useful also in case of answers that are right, but simply we don’t know the\
    \ LLM thought process behind it. For example, let’s say we want our LLM to solve\
    \ riddles. To do so, we can instruct it as follows:\n\n```\nYou are an AI assistant\
    \ specialized in solving riddles.\nGiven a riddle, solve it the best you can.\n\
    Provide a clear justification of your answer and the reasoning behind it.\n```\n\
    \nAs you can see, I’ve specified in the metaprompt to the LLM to justify its answer\
    \ and also socializing its reasoning. Let’s test it with the following riddle:\n\
    \n```\nWhat has a face and two hands, but no arms or legs?\n```\n\nOutput:\n\n\
    ![Figure 7: Example of OpenAI’s GPT-4o providing justification after solving a\
    \ riddle.](media/file49.png)\n\nFigure 7: Example of OpenAI’s GPT-4o providing\
    \ justification after solving a riddle.\n\nJustifications are a great tool to\
    \ make your model more reliable and robust, since they “force” it to re-think\
    \ about its output, as well as providing us with a view of how the reasoning was\
    \ set to solve the problem.\n\nWith a similar approach, we could also intervene\
    \ at different prompts level to improve our LLM’s performance. For example, we\
    \ might discover that the model is systematically tackling a mathematical problem\
    \ in the wrong way, henceforth we might want to suggest the right approach directly\
    \ at the metaprompt level. Another example might be that of asking the model to\
    \ generate multiple outputs – along with their justifications – to evaluate different\
    \ reasoning techniques and prompt the best one in the metaprompt.\n\nIn next section,\
    \ we are going to focus on one of this example, more specifically the possibility\
    \ of generating multiple outputs and then picking the most likely one.\n\n###\
    \ Generate many outputs, then use the model to pick the best one\n\nAs we saw\
    \ in the previous section, LLMs are built in such a way that they predict the\
    \ next token based on the previous ones without looking back at their generations.\
    \ If this is the case, if one sampled token is the wrong one (in other words,\
    \ if the model is unlucky), the LLM will keep generating wrong tokens and, hence,\
    \ wrong content. Now, the bad news is that, unlike humans, LLMs cannot recover\
    \ from errors on their own. It means that, if we ask them, they acknowledge the\
    \ error, but we need to explicitly prompt them to think about that.\n\nOne way\
    \ to overcome this limitation is that of broadening the space of probabilities\
    \ of picking the right token. Rather than generating just one response, we can\
    \ prompt the model to generate multiple response, and then picking the one which\
    \ is most suitable for the user’s query. This splits the job into two sub-jobs\
    \ for our LLM:\n\n1. Generating multiple responses to user’s query;\n2. Comparing\
    \ those responses and picking the best one, according to some criteria we can\
    \ specify in the metaprompt.\n\nLet’s see an example, following up with the riddles\
    \ examined in the previous section.\n\n```\nYou are an AI assistant specialized\
    \ in solving riddles.\nGiven a riddle, you have to generate three answers to the\
    \ riddle.\nFor each answer, be specific about the reasoning you made.\nThen, among\
    \ the three answer, select the one which is most plausible given the riddle.\n\
    ```\n\nIn this case, I’ve prompted the model to generate three answers to the\
    \ riddle, then to give me the most likely, justifying why. Let’s see the result:\n\
    \n![Figure 8: Example of GPT-4o generating 3 plausible answers and picking the\
    \ most likely one, providing justification.](media/file50.png)\n\nFigure 8: Example\
    \ of GPT-4o generating 3 plausible answers and picking the most likely one, providing\
    \ justification.\n"
