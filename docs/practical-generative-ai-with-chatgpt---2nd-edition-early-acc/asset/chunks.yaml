    在本章中，我们探索了生成式 AI 的精彩世界及其各个应用领域，包括图像生成、文本生成、音乐生成和视频生成。我们学习了由 OpenAI 训练的 `ChatGPT`
    和 `DALL-E` 等生成式 AI 模型如何利用 `DL` 技术学习大型数据集中的模式，并生成既新颖又连贯的新内容。我们还讨论了生成式 AI 的历史、起源以及目前的研究现状。


    本章的目标是为生成式 AI 的基础提供坚实的基础，并启发你进一步探索这一迷人的领域。


    在下一章中，我们将关注目前市场上最有前景的技术之一 `ChatGPT`：我们将介绍其背后的研究以及 OpenAI 的开发过程、模型架构，以及截至目前它可以解决的主要用例。


