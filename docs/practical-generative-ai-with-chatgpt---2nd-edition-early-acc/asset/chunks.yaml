    \ of the GitHub Action schema.](media/file164.png)\n\nFigure 17: Configuration\
    \ of the GitHub Action schema.\n\nThis is the full schema I used:\n\n```\nopenapi:\
    \ 3.1.0\ninfo:\n  title: GitHub API\n  description: API for interacting with GitHub,\
