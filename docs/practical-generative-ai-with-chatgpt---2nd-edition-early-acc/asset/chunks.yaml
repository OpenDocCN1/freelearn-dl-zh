    \ the distance between woman and man should be equal to the distance between Queen\
    \ and King.\n\nEmbeddings can be extremely useful in intelligent search scenarios.\
    \ Indeed, by getting the embedding of the user input and the documents the user\
    \ wants to search, it is possible to compute distance metrics (namely, cosine\
    \ similarity) between the input and the documents. By doing so, we can retrieve\
    \ the documents that are closer, in mathematical distance terms, to the user input.\n\
    \nThe OpenAI’s embedding models **text-embedding-ada-002** and **text-embedding-3-large**\
    \ models offer state-of-the-art performance in tasks such as text similarity,\
    \ text search, and code search by creating dense vector representations of text.\
    \ These embeddings allow for efficient and effective comparison of large text\
    \ datasets, improving search accuracy and relevance\n\n*   **Moderation**\U0001F86A\
    OpenAI's moderation models are designed to detect and filter out inappropriate,\
    \ harmful, or unsafe content in text. These models are integral to maintaining\
    \ safe and respectful online environments by identifying potentially offensive\
    \ or harmful language. The latest moderation model, **text-moderation-007**, is\
    \ robust and effective in ensuring content compliance and safety across platforms.\
    \ It helps developers and companies enforce community guidelines and prevent the\
    \ spread of harmful content, thereby promoting safer digital interactions.\n\n\
    Overall, OpenAI has reached more and more coverage over the last years, addressing\
    \ diverse areas of Generative AI with state-of-the-art models.\n\n### Trying OpenAI\
    \ models in the Playground\n\nTo access your OpenAI playground, you need to create\
    \ an OpenAI account and navigate through [https://platform.openai.com/playground](https://platform.openai.com/playground).\
    \ This is how the landing page looks like:\n\n![Figure 2.4 – OpenAI Playground\
    \ at https://platform.openai.com/playground](media/file26.png)\n\nFigure 2.4 –\
    \ OpenAI Playground at https://platform.openai.com/playground\n\nAs you can see\
    \ from *Figure 2.4*, the Playground offers a UI where the user can start interacting\
    \ with the model, which you can select on the right-hand side of the UI.\n\nBefore\
    \ diving deeper into the main sections of the playground, let’s first define some\
    \ jargon you will see in this chapter:\n\n*   **Tokens**: Tokens can be considered\
    \ as word fragments or segments that are used by the API to process input prompts.\
    \ Unlike complete words, tokens may contain trailing spaces or even partial sub-words.\
    \ To better understand the concept of tokens in terms of length, there are some\
    \ general guidelines to keep in mind. For instance, one token in English is approximately\
    \ equivalent to four characters, or three-quarters of a word.\n\n*   **Prompt**:\
    \ In the context of **natural** **language** **processing** (**NLP**) and ML,\
    \ a prompt refers to a piece of text that is given as input to an AI language\
    \ model to generate a response or output. The prompt can be a question, a statement,\
    \ or a sentence, and it is used to provide context and direction to the language\
    \ model.\n\n*   **Context**: In the field of GPT, context refers to the words\
    \ and sentences that come before the user’s prompt. This context is used by the\
    \ language model to generate the most probable next word or phrase, based on the\
    \ patterns and relationships found in the training data.\n\n*   **Model** **confidence**:\
    \ Model confidence refers to the level of certainty or probability that an AI\
    \ model assigns to a particular prediction or output. In the context of NLP, model\
    \ confidence is often used to indicate how confident the AI model is in the correctness\
    \ or relevance of its generated response to a given input prompt."
