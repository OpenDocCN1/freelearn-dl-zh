    # 1 Introduction to Generative AI


    ## Join our book community on Discord


    ![](media/file0.png)

    [https://packt.link/EarlyAccess](https://packt.link/EarlyAccess)


    Hello! Welcome to *The Ultimate Guide to ChatGPT and OpenAI!* In this book, we
    will explore the fascinating world of `Generative` `Artificial Intelligence` (`GAI`)
    and its groundbreaking applications. Generative AI has transformed the way we
    interact with machines, enabling computers to create, predict, and learn without
    explicit human instruction. Since the launch of `ChatGPT` in November 2023, we
    have witnessed unprecedented advances in natural language processing, image and
    video synthesis, and many other fields. Whether you are a curious beginner or
    an experienced practitioner, this guide will equip you with the knowledge and
    skills to navigate the exciting landscape of generative AI. So, let’s dive in
    and start with some definitions of the context we are moving in.


    This chapter provides an overview of the field of generative AI, which consists
    of creating new and unique data or content using `machine learning` (`ML`) algorithms.


    It focuses on the applications of generative AI to various fields, such as image
    synthesis, text generation, and music composition, highlighting the potential
    of generative AI to revolutionize various industries. This introduction to generative
    AI will provide context for where this technology lives, as well as the knowledge
    to collocate it within the wide world of AI, ML, and `Deep Learning` (`DL`). Then,
    we will dwell on the main areas of applications of generative AI with concrete
    examples and recent developments so that you can get familiar with the impact
    it may have on businesses and society in general.


    Also, being aware of the research journey toward the current state of the art
    of generative AI will give you a better understanding of the foundations of recent
    developments and state-of-the-art models.


    All this, we will cover with the following topics:


    * Understanding generative AI

    * Exploring the domains of generative AI

    * The history and current status of research on generative AI


    By the end of this chapter, you will be familiar with the exciting world of generative
    AI, its applications, the research history behind it, and the current developments,
    which could have – and are currently having – a disruptive impact on businesses.


    ## Introducing generative AI


    AI has been making significant strides in recent years, and one of the areas that
    has seen considerable growth is generative AI. Generative AI is a subfield of
    AI and DL that focuses on generating new content, such as images, text, music,
    and video, by using algorithms and models that have been trained on existing data
    using ML techniques.


    In order to better understand the relationship between AI, ML, DL, and generative
    AI, consider AI as the foundation, while ML, DL, and generative AI represent increasingly
    specialized and focused areas of study and application:


    * AI represents the broad field of creating systems that can perform tasks, showing
    human intelligence and ability and being able to interact with the ecosystem.

    * ML is a branch that focuses on creating algorithms and models that enable those
    systems to learn and improve themselves with time and training. ML models learn
    from existing data and automatically update their parameters as they grow.

    * DL is a sub-branch of ML, in the sense that it encompasses deep ML models. Those
    deep models are called `neural networks` and are particularly suitable in domains
    such as `computervision` or `Natural Language Processing` (`NLP`). When we talk
    about ML and DL models, we typically refer to discriminative models, whose aim
    is that of making predictions or inferencing patterns on top of data.

    * And finally, we get to generative AI, a further sub-branch of DL, which doesn’t
    use deep Artificial Neural Networks to cluster, classify, or make predictions
    on existing data: it uses those powerful Artificial Neural Network models to generate
    brand new content, from images to natural language, from music to video.


    The following figure shows how these areas of research are related to each other:


    ![Figure 1.1 – Relationship between AI, ML, DL, and generative AI](media/file1.jpg)


    Figure 1.1 – Relationship between AI, ML, DL, and generative AI


    Generative AI models can be trained on vast amounts of data and then they can
    generate new examples from scratch using patterns in that data. This generative
    process is different from discriminative models, which are trained to predict
    the class or label of a given example.


    The type of Neural Networks that feature Generative AI are called Large Foundation
    Models LFMs) and, in the case of language models like `ChatGPT`, we talk about
    `Large Language Models` (`LLMs`).


    > Large Language Models are a type of Artificial Neural Network featured by a
    transformer architecture. They are characterized by a huge number of parameters
    (in the order of trillions of parameters) and have been trained on billions of
    words. Given the training set, LLMs are capable of understanding and generating
    natural language given user’s input.


    Even though text understanding and generation is probably one of the most outstanding
    features of Generative AI, this field covers many domains.


    ### Domains of generative AI


    In recent years, generative AI has made significant advancements and has expanded
    its applications to a wide range of domains, such as art, music, fashion, architecture,
    and many more. In some of them, it is indeed transforming the way we create, design,
    and understand the world around us. In others, it is improving and making existing
    processes and operations more efficient.


    The fact that generative AI is used in many domains also implies that its models
    can deal with different kinds of data, from natural language to audio or images.
    Let us understand how generative AI models address different types of data and
    domains.


    ### Text generation


    One of the greatest applications of generative AI—and the one we are going to
    cover the most throughout this book—is its capability to produce new content in
    natural language. Indeed, generative AI algorithms can be used to generate new
    text, such as articles, poetry, and product descriptions.

