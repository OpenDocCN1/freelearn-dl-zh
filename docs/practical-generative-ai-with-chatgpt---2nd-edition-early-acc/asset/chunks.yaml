    \ should also be similar.\n\n![](media/file12.png)\n\nRAG is made of three phases:\n\
    \n*   **Retrieval**: given a user’s query and its corresponding vector, the most\
    \ similar pieces of documents (those corresponding to the vectors that are closer\
    \ to the user query’s vector) are retrieved and used as the base context for the\
    \ LLM.\n\n    ![](media/file13.png)\n\n*   **Augmentation**: the retrieved context\
    \ is enriched through additional instructions, rules, safety guardrails and similar\
    \ practices that are typical of prompt engineering techniques (we will cover the\
    \ topic of prompt engineering in Chapter 3).\n\n    ![](media/file14.png)\n\n\
    *   **Generation**: based on the augmented context, the LLM generates the response\
    \ to the user’s query.\n\n![](media/file15.png)\n\nThe overall process looks as\
    \ follows:\n\n![](media/file16.png)\n\nRAG combines the strengths of generative\
    \ models and information retrieval systems to enhance the quality and relevance\
    \ of generated content. Traditional generative models rely solely on their training\
    \ data to produce responses, which can sometimes result in outdated or irrelevant\
    \ information. RAG addresses this limitation by integrating external knowledge\
    \ bases during the generation process.\n\nFor example, OpenAI's ChatGPT, when\
    \ enhanced with RAG, can pull in current data from reliable sources to answer\
    \ a query about recent events, which would be beyond the scope of its training\
    \ cut-off. This synergy of retrieval and generation broadens the applicability\
    \ of generative AI, making it more robust and useful in dynamic, information-rich\
    \ environments.\n\n### Multimodality\n\nIn the first paragraph of this Chapter,\
    \ we saw the various domains of Generative AI, ranging from text to images, from\
    \ videos to music. Typically, Large Foundation Models tend to me domain-specific,\
    \ as we saw for Large Language Models in the case of language understanding and\
    \ generation, or DALL-E3 in case of image generation.\n\nHowever, the recent advances\
    \ in Generative AI have enabled the development of Large Multimodal Models (LMMs)\
    \ that can process and generate different types of data, such as text, images,\
    \ audio, and video.\n\nLMMs share with “standard” Large Language Models (LLMs)\
    \ the capability of generalization and adaptation typical of Large Foundation\
    \ Models. However, LMMs are capable of processing heterogeneous data with the\
    \ idea of mirroring the way humans interact with the surrounding ecosystem – that\
    \ is, with all our senses.\n\nA great example of multimodal model is OpenAI’s\
    \ GPT-4o, which is able to interact with users via text, images and audio. Let’s\
    \ see the following example:\n\n![](media/file17.png)\n\nAs you can see, the model\
    \ was able to analyze the image and reason over it. Let’s now go ahead and ask\
    \ the model to generate an illustration:\n\n![](media/file18.png)\n\nThe most\
    \ interesting fact about LMMs is that they preserve their reasoning capabilities,\
    \ making them suitable for complex reasoning in heterogeneous data contexts. Let’s\
    \ consider this last example (showing only the first lines of the response):\n\
    \n![](media/file19.png)\n\nAs you may imagine, this opens a landscape of applications\
    \ in various industries, and we are going to see some concrete examples in the\
    \ upcoming chapters.\n\n### AI Agents\n\nIn previous sections, we uncovered how\
    \ LFMs are great when it comes to resonate and generate content. However, they\
    \ lack one ability, that is the one of taking actions and interact with the surrounding\
    \ ecosystem that goes beyond the single user. For example, what if we want our\
    \ LLM to be able not only to generate an amazing LinkedIn post, but also publish\
    \ it on our page?"
