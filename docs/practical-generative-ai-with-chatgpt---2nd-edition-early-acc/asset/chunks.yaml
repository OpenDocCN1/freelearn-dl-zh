  trans: "\n\n在本章中，我们将探索第一种方法，并在第 11 章中介绍如何整合 OpenAI 模型的 API。\n\n在进入 Playground 之前，让我们先概览一下\
    \ OpenAI 的模型家族。\n\n### OpenAI 模型家族\n\n在过去的几年里，OpenAI 在模型开发领域取得了巨大的进展，以惊人的速度发布了新版本的模型。在本节中，我们将看到按领域划分的主要模型。\n\
    \n- **语言模型** \U0001F86A OpenAI 的 GPTs 是先进的语言模型，旨在根据给定的提示词（prompts）生成类人类文本。它们多才且，可以用于各种自然语言处理任务，如文本补全、翻译、摘要和编码。得益于其旗舰模型系列\
    \ GPTs，OpenAI 在这一领域展现了卓越的性能。自 2022 年 11 月 ChatGPT 发布以来，OpenAI 发布了：\n    - `GPT-3.5-turbo`，第一版\
    \ ChatGPT 背后的模型\n    - `GPT-4`（第一个多模态模型）和 `GPT-4-turbo`（针对聊天和助手进行了优化）\n    - `GPT-4o`，最先进的多模态模型\n\
    \    - `GPT-4o mini`，`GPT-4o` 的较小版本，速度更快且更便宜。\n\n除了这些最新模型外，用户还可以访问一组所谓的“GPT 基础模型”，如\
    \ `Babbage-002` 或 `davinci-002`（`GPT-2`），它们代表了旧版的补全 API（pletions APIs）（我们将在下一节介绍补全\
    \ API）。\n\n- **图像模型** \U0001F86A OpenAI 的图像模型（如 `DALL-E`）旨在根据描述生成并处理图像。`DALL-E`\
    \ 模型可以创建高度详细且富有想象力的视觉效果，使用户创作独特的艺术品、设计概念等。例如，`DALL-E 3`（该模型的最新版本）能够根据复杂的提示词创建复杂且富有创意的图像，推向\
    \ AI 在视觉艺术领域的边界。这些模型在创意产业、数字营销以及任何受益于高质量、定制化视觉效果的领域都特别有用。\n\n- **文本转语音和语音转文本**\
    \ \U0001F86A 在第 1 章中，我们已经提到了 OpenAI 开发的语音转文本（STT）模型 `Whisper`，它可以处理和分析音频输入。此外，OpenAI\
    \ 还开发了文本转语音（TTS）模型，提供既清晰又具表现力的高质量输出，使其适用于从客服机器人到教育工具的广泛应用。OpenAI 开发的文本转语音（TTS）模型将文字文本转换为口语语言，产生真实且自然的音频。这些模型对于创建语音助手、提高视障用户的无障碍性以及生成自动公告至关重要。\n\
    \n- **文本转视频** \U0001F86A 随着 `SORA` 的发布，OpenAI 展示了其尖端的文本转视频模型，模型能够根据文本描述生成现实且富有想象力的视频场景。通过借鉴\
    \ `DALL-E` 的技术并结合 Transformer，`SORA` 可以创建长达一分钟的高保真视频。它在保持 3D 一致性、物体持久性和模拟视频内交互方面表现出色。尽管在准确建模复杂物理和确保时间连贯性方面仍面临挑战，但\
    \ `SORA` 在创意产业具有巨大潜力，为视频制作和故事讲述提供了新的可能性。\n\n- **嵌入（Embeddings）** \U0001F86A OpenAI\
    \ 的嵌入模型将文本转换为称为向量（或嵌入）的数值表示，这些向量捕捉了语义含义并投影到多维向量空间中。\n\n该空间中不同实例之间的数学距离代表了它们在含义上的相似性。例如，想象单词\
    \ `queen`（皇后）、`woman`（女性）、`king`（国王）和 `man`（男性）。理想情况下，在我们在这个向量空间中，如果表示是正确的，我们希望实现以下效果：\n\
    \n![图 2.10 – 单词向量方程示例](img/file25.png)\n\n图 2.10 – 单词向量方程示例\n\n这意味着 `woman` 和\
    \ `man` 之间的距离应该等于 `Queen` 和 `King` 之间的距离。\n\n嵌入在智能搜索场景中非常有用。事实上，通过获取用户输入和用户想要搜索的文档的嵌入可以计算输入与文档之间的距离度量（即\
    \ `cosine similarity` 余弦相似度）。通过这种方式，我们可以检索在数学距离上更接近用户输入的文档。\n\nOpenAI 的嵌入模型 `text-embedding-ada-002`\
    \ 和 `text-embedding-3-large` 通过创建文本的稠密向量表示，在文本相似性、文本搜索和代码搜索等任务中提供了顶尖性能。这些嵌入允许对大型文本数据集进行高效有效的比较，提高了搜索的准确性和相关性。\n\
    \n- **审核（Moderation）** \U0001F86A OpenAI 的审核模型旨在检测并过滤文本中不适当、有害或不安全的内容。这些模型通过识别潜在的冒犯或有害语言，对于维护安全尊重的在线环境至关重要。最新的审核模型\
    \ `text-moderation-007` 在确保跨平台内容合规安全方面稳健且有效。它帮助开发者和公司执行社区准则并防止有害内容的传播，从而促进更安全的数字交互。\n\
    \n总体来说，OpenAI 近年来覆盖范围越来越广，用顶尖模型解决了生成式 AI 的各个领域。\n\n### 在 Playground 中尝试 OpenAI\
    \ 模型\n\n要访问你的 OpenAI Playground，你需要创建一个 OpenAI 账户并访问 [`platform.openai.com/playground`](https://platform.openai.com/playground)。落地页的样式如下：\n\
    \n![图 2.4 – https://platform.openai.com/playground 的 OpenAI Playground](img/file26.png)\n\
    \n图 2.4 – https://platform.openai.com/playground 的 OpenAI Playground\n\n从图 2.4\
    \ 所示，Playground 提供了一个用户可以在其中与模型交互的界面，你可以在界面右侧选择模型。\n\n在深入研究 Playground 的主要部分之前，让我们先定义一下章中会看到的术语：\n\
    \n- **Token（标记）**：Token 可以被视为 API 用于处理输入提示词的单词碎片或片段。与完整的单词不同，Token 可能包含尾随空格甚至部分子词。为了更好地理解\
    \ Token 的长度概念，有一些通用指南需要记住。例如，英语中的一个 Token 大约相当于四个字符，或四分之三个单词。\n\n- **提示词（Prompt）**：在自然语言处理（NLP）和机器学习（ML）语境下，提示词是指输入\
    \ AI 语言模型以生成响应或输出的文本。提示词可以是问题、陈述或句子，用于为语言模型提供上下文和方向。\n\n- **上下文（Context）**：在 GPT\
    \ 领域，上下文是指用户提示词之前的单词和句子。语言模型利用这些上下文根据训练数据中发现的模式和关系生成最可能的下一个单词或短语。\n\n- **模型置信度（Model\
    \ confidence）**：模型置信度是指 AI 模型对特定预测或输出分配的确定程度或概率。在 NLP 语境下，模型置信度通常用于表示 AI 模型对其针对输入提示词生成的响应的正确性或相关性有多信心。\n\
    \n"
