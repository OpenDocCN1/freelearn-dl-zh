  trans: "\n如前所述，强制模型用不同的方法解决问题是收集多个推理样本的一种方法，这些样本可以作为元提示词（metaprompt）中的进一步指令。例如，如果我们希望模型总是对问题提出**不是最直观**的解决方案——换句话说，如果我们希望它能“以不同方式思考”——我们可能会强制它以\
    \ N 种方式解决问题，然后将最具创意的推理作为元提示词中的框架。\n\n我们将检查的最后一个元素是我们想要赋予元提示词的整体结构。事实上，在之前的示例中，我们看到了一个包含某些陈述和指令的示例系统消息。在下一节中，我们将看到这些陈述和指令的顺序和“强度”并不是不变的。\n\
    \n## 使用分隔符\n\n涵盖的最后一个原则与我们想要赋予元提示词的格式有关。这有助于我们的大语言模型（LLM）更好地理解其意图，并建立章节与段落之间的关系。\n\
    \n为了实现这一点，我们可以在提示词中使用分隔符。分隔符可以是任何字符或符号序列，它能清晰地映射到一个模式（schema）而不是一个概念。例如，我们可以考虑以下序列作为分隔符：\n\
    \n* `>>>>`\n* `====`\n* `------`\n* `####`\n* ` ` ` ` `\n\n等等。让我们考虑一个元提示词，其目标是指示模型将用户的任务转换为\
    \ Python 代码，并提供一个操作示例。\n\n```\nYou are a Python expert that produces python code\
    \ as per user's request.\n===>START EXAMPLE\n---User Query---\n给我一个打印文本字符串的函数。\n\
    ---User Output---\n下面你可以找到描述的函数：\n```def my_print(text):\n\n     #returning the\
    \ printed text\n\n     return print(text)\n```\n<===END EXAMPLE\n```\n\n让我们看看它是如何工作的：\n\
    \n![图 9：在系统消息中使用分隔符的模型示例输出。](img/file51.png)\n\n图 9：在系统消息中使用分隔符的模型示例输出。\n\n如你所见的，它还像系统消息中显示的那样用反引号打印了代码。\n\
    \n到目前为止的所有原则都是通用规则，可以使你的基于 LLM 的应用程序更加健壮。在接下来的章节中，我们将看到一些高级的提示工程技术，这些技术在将答案提供给最终用户之前，解决了模型推理和思考答案的方式。\n\
    \n## 高级技术\n\n在之前的章节中，我们涵盖了一些提示工程的基础技术。无论你开发的是什么类型的应用程序，都应该记住这些技术，因为它们是提高你 LLM\
    \ 性能的通用最佳实践。\n\n另一方面，还有一些针对特定场景实施的高级技术，我们将在接下来的章节中介绍。\n\n### 思维链 (Chain of Thoughts)\n\
    \n由 Wei 等人在论文《Chain-of-Thought Prompting Elicits Reasoning in Large Language Models》中引入的思维链（CoT）是一种通过中间推理步骤实现复杂推理能力的技术。它还鼓励模型解释其推理过程，“强制”它不要太草率，从而避免给出错误回答的风险（正如我们在之前的章节中看到的）。\n\
    \n假设我们想提示 LLM 求解一元方程。为了做到，我们将为它提供一个通用的推理列表作为元提示词：\n\n```\n要求解通用的一元方程，请遵循以下步骤：\n\
    1\\. **识别方程：** 首先识别你想要求解的方程。它应该是 \"ax + b = c\" 的形式，其中 'a' 是变量的系数，'x' 是变量，'b'\
    \ 是常数，'c' 是另一个常数。\n2\\. **隔离变量：** 你的目标是在方程的一侧隔离变量 'x'。为了做到，请执行以下步骤：\n\n   a. **加减常数：**\
    \ 在方程两边加上或减去 'b'，将常数移到一侧。\n\n   b. **除以系数：** 将方程两边除以 'a' 以隔离 'x'。如果 'a' 为零，方程可能没有唯一解。\n\
    3\\. **简化：** 尽可能地简化方程的两边。\n4\\. **求解 'x'：** 一旦 'x' 在一侧被隔离，你就得到了解。它将是 'x = 值' 的形式。\n\
    5\\. **检查你的解：** 将找到的 'x' 值代回原始方程，确保它满足方程。如果是，你就找到了正确解。\n6\\. **表示解：** 以清晰简洁的形式写下解。\n\
    7\\. **考虑特殊情况：** 注意可能无解或无限解的特殊情况，特别是当 'a' 等于零时。\n方程：\n```\n\n让我们看看它是如何工作的：\n\n\
    ![图 10：模型使用 CoT 方法求解方程的输出。](img/file52.png)\n\n图 10：模型使用 CoT 方法求解方程的输出。\n\n注意，你也可以将其与少样本提示（few-shot\
    \ prompting）结合，以便在回答之前需要推理的更复杂任务上获得更好的结果。\n\n通过 CoT，我们正在提示模型生成中间推理步骤。这也是我们在下一节中将检查的另一种推理技术的组成部分。\n\
    \n### ReAct\n\n由 Yao 等人在论文《ReAct: Synergizing Reasoning and Acting in Language\
    \ Models》中引入的 ReAct（推理与行动）是一种将推理与大语言模型相结合的通用范式。ReAct 提示语言模型生成语言推理轨迹，并接收来自网络等外部来源的观察。这允许语言模型执行动态推理，并根据外部信息快速调整计划。例如，你可以提示语言模型通过对问题进行推理，然后执行向网络发送查询，然后接收搜索结果的观察，并继续这种“思考-行动”循环，直到得出结论。\n\
    \n思维链和 ReAct 方法的区别在于，思维链提示语言模型为任务生成中间推理步骤，而 ReAct 提示语言模型为任务生成中间推理步骤、行动和观察。\n\n\
    在下面的示例中，我们不使用工具，而是将要求模型执行的任何任务称为“行动”。\n\n这个 ReAct 元提示词可能像这样：\n\n```\n尽力回答以下问题。\n\
    使用以下格式：\nQuestion: 你必须回答的输入问题\nThought: 你应该始终思考要做什么\nAction: 要采取的行动\nAction Input:\
    \ 动作的输入\nObservation: 行动的结果\n...（此 Thought/Action/Action Input/Observation 可以重复\
    \ N 次）\nThought: 我现在知道了最终答案\nFinal Answer: 原始输入问题的最终答案\n```\n\n让我们看看它在简单的用户查询下是如何工作的：\n\
    \n![图 11：ReAct 元提示词的示例](img/file53.png)\n\n图 11：ReAct 元提示词的示例\n\n如你所见，在这种场景下，模型跳过了\
    \ Action Input 和随后的观察，因为我们没有为它提供任何可使用的工具。\n\n这是一个很好的例子，说明了提示模型逐步思考并显式说明推理每一步如何让它在回答之前变得更加“明智”和谨慎。这也是防止幻觉的一种很好的技术。\n\
    \n总的来说，提示工程是一门强大的学科，尽管仍处于新兴阶段，但已经在基于 LLM 的应用程序中被广泛采用。在接下来的章节中，我们将看到这些技术的具体应用。\n"
