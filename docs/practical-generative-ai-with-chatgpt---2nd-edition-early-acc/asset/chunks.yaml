- fmt: '

    Transformers were indeed the foundations for massive language models called `Bidirectional
    Encoder Representations from Transformers` (`BERT`), introduced by Google in 2018,
    and they soon become the baseline in NLP experiments.


    Transformers are also the foundations of all the `Generative Pre-Trained` (`GPT`)
    models introduced by OpenAI, including `GPT-3`, the model behind ChatGPT, as well
    as other Large Foundation Models.


    Although there was a significant amount of research and achievements in those
    years, it was not until the second half of 2022 that the general attention of
    the public shifted toward the field of generative AI.


    Not by chance, 2022 has been dubbed the `year of generative AI*. This was the
    year when powerful AI models and tools became widespread among the general public:
    diffusion-based image services (MidJourney, `DALL-E 2`, and `Stable Diffusion`),
    OpenAI’s `ChatGPT`, text-to-video (`Make-a-Video` and `Imagen Video`), and text-to-3D
    (`DreamFusion`, `Magic3D`, and `Get3D`) tools were all made available to individual
    users, sometimes also for free.


    This had a disruptive impact for two main reasons:


    * Once generative AI models have been widespread to the public, every individual
    user or organization had the possibility to experiment with and appreciate its
    potential, even without being a data scientist or ML engineer.

    * The output of those new models and their embedded creativity were objectively
    stunning and often concerning. An urgent call for adaptation—both for individuals
    and governments—rose.


    Henceforth, in the very near future, we will probably witness a spike in the adoption
    of AI systems for both individual usage and enterprise-level projects.


    ## 18 months later: main trends and innovations


    Fast forward from November 2022 to today, we have witnessed a huge amount of innovation
    in the field of GenAI. Many of these innovations are linked to the brand-new models
    developed and released to the public, like the OpenAI’s `GPT-4o` and `DALL-E3`,
    but also Google `Gemini`, Meta `Llama 3`, Microsoft `Phi3` and many others.


    However, the most remarkable achievements probably lie in the way we interact
    with and build applications around those models. In this section, we are going
    to explore three main advancements that have marked the most popular reference
    architectures for GenAI-powered applications.


    ### Retrieval Augmented Generation


    One of the first limitations of `ChatGPT` and, generally speaking, of `LLMs`,
    was that of the knowledge base cutoff. In fact, the knowledge of `LLMs` is limited
    to the training set (made od public information from the internet) they have been
    trained on and, as long as this can be exhaustive, it’s not up to date. Plus,
    it is missing the proprietary knowledge base that might be relevant for us or
    our organization. For example, if you ask `ChatGPT` “what are my company’s policy
    for employees health insurance?”, the model won’t be able to answer since it has
    no access to this information.


    To bypass this limitation, a new framework was designed to allow `LLMs` to navigate
    through customized documentations that we can provide. This framework is called
    Retrieval Augmented Generation (`RAG`).


    The idea behind `RAG` is of decoupling the `LLM` from the knowledge base we want
    to navigate through. To make it possible, the external knowledge base needs to
    be transformed into numerical vectors through a process called `embedding` and
    stored into a specialized `Vector Database`.


    > An embedding is a way of representing high-dimensional, non-numeric data, such
    as words or sentences, in a lower-dimensional space, such as vector. A text embedding
    can capture the semantic and syntactic features of the text, such as meaning,
    context, and similarity.


    > > Each embedding is a vector of floating-point numbers, such that the distance
    between two embeddings in the vector space is correlated with semantic similarity
    between two inputs in the original format.


    For example, if two concepts are similar, then their vector representations should
    also be similar.


    ![](media/file12.png)


    `RAG` is made of three phases:


    * **Retrieval**: given a user’s query and its corresponding vector, the most similar
    pieces of documents (those corresponding to the vectors that are closer to the
    user query’s vector) are retrieved and used as the base context for the `LLM`.

    ![](media/file13.png)

    * **Augmentation**: the retrieved context is enriched through additional instructions,
    rules, safety guardrails and similar practices that are typical of prompt engineering
    techniques (we will cover the topic of prompt engineering in Chapter 3).

    ![](media/file14.png)

    * **Generation**: based on the augmented context, the `LLM` generates the response
    to the user’s query.

    ![](media/file15.png)


    The overall process looks as follows:


    ![](media/file16.png)


    `RAG` combines the strengths of generative models and information retrieval systems
    to enhance the quality and relevance of generated content. Traditional generative
    models rely solely on their training data to produce responses, which can sometimes
    result in outdated or irrelevant information. `RAG` addresses this limitation
    by integrating external knowledge bases during the generation process.


    For example, OpenAI''s `ChatGPT`, when enhanced with `RAG`, can pull in current
    data from reliable sources to answer a query about recent events, which would
    be beyond the scope of its training cut-off. This synergy of retrieval and generation
    broadens the applicability of generative AI, making it more robust and useful
    in dynamic, information-rich environments.


    ### Multimodality


    In the first paragraph of this Chapter, we saw the various domains of Generative
    AI, ranging from text to images, from videos to music. Typically, Large Foundation
    Models tend to me domain-specific, as we saw for Large Language Models in the
    case of language understanding and generation, or `DALL-E3` in case of image generation.


    However, the recent advances in Generative AI have enabled the development of
    Large Multimodal Models (`LMMs`) that can process and generate different types
    of data, such as text, images, audio, and video.


    `LMMs` share with “standard” Large Language Models (`LLMs`) the capability of
    generalization and adaptation typical of Large Foundation Models. However, `LMMs`
    are capable of processing heterogeneous data with the idea of mirroring the way
    humans interact with the surrounding ecosystem – that is, with all our senses.


    A great example of multimodal model is OpenAI’s `GPT-4o`, which is able to interact
    with users via text, images and audio. Let’s see the following example:


    ![](media/file17.png)


    As you can see, the model was able to analyze the image and reason over it. Let’s
    now go ahead and ask the model to generate an illustration:


    ![](media/file18.png)


    The most interesting fact about `LMMs` is that they preserve their reasoning capabilities,
    making them suitable for complex reasoning in heterogeneous data contexts. Let’s
    consider this last example (showing only the first lines of the response):


    ![](media/file19.png)


    As you may imagine, this opens a landscape of applications in various industries,
    and we are going to see some concrete examples in the upcoming chapters.


    ### AI Agents


    In previous sections, we uncovered how `LFMs` are great when it comes to resonate
    and generate content. However, they lack one ability, that is the one of taking
    actions and interact with the surrounding ecosystem that goes beyond the single
    user. For example, what if we want our `LLM` to be able not only to generate an
    amazing LinkedIn post, but also publish it on our page?

