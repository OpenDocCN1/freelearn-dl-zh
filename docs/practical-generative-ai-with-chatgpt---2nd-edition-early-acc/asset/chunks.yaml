    # Avoiding the risk of hidden bias and taking into account ethical considerations
    in ChatGPT


    ChatGPT has been provided with the `Moderator API` so that it cannot engage in
    conversations that might be unsafe. The `Moderator API` is a classification model
    performed by a GPT model based on the following classes: violence, self-harm,
    hate, harassment, and sex. For this, OpenAI uses anonymized data and synthetic
    data (in zero-shot form) to create synthetic data.


    The `Moderation API` is based on a more sophisticated version of the content filter
    model available among OpenAI APIs. We discussed this model in *Chapter 1*, where
    we saw how it is very conservative toward false positives rather than false negatives.


    However, there is something we can refer to as `hidden bias`, which derives directly
    from the knowledge base the model has been trained on. For example, concerning
    the main chunk of training data of `GPT-3`, known as the `Common Crawl`, experts
    believe that it was written mainly by white males from Western countries. If this
    is the case, we are already facing a hidden bias of the model, which will inevitably
    mimic a limited and unrepresentative category of human beings.


    In their paper, *Languages Models are Few-Shots Learners*, OpenAI’s researchers
    Tom Brown et al. ([https://arxiv.org/pdf/2005.1416](https://arxiv.org/pdf/2005.1416))
    created an experimental setup to investigate racial bias in `GPT-3`. The model
    was prompted with phrases containing racial categories and 800 samples were generated
    for each category. The sentiment of the generated text was measured using `Senti
    WordNet` based on word co-occurrences on a scale ranging from -100 to 100 (with
    positive scores indicating positive words, and vice versa).


    The results showed that the sentiment associated with each racial category varied
    across different models, with Asian consistently having a high sentiment and Black
    consistently having a low sentiment. The authors caution that the results reflect
    the experimental setup and that socio-historical factors may influence the sentiment
    associated with different demographics. The study highlights the need for a more
    sophisticated analysis of the relationship between sentiment, entities, and input
    data:


    ![Figure 4.14 – Racial sentiment across models](media/file54.png)


    Figure 4.14 – Racial sentiment across models


    This hidden bias could generate harmful responses not in line with responsible
    AI principles.


    However, it is worth noticing how ChatGPT, as well as all OpenAI models, are subject
    to continuous improvements. This is also consistent with OpenAI’s `AI alignment`
    ([https://openai.com/alignment/](https://openai.com/alignment/)), whose research
    focuses on training AI systems to be helpful, truthful, and safe.


    For example, if we ask ChatGPT to formulate guesses based on people’s gender and
    race, it will not accommodate the exact request, but rather provide us with hypothetical
    function as well as a huge disclaimer:


    ![Figure 4.15 – Example of GPT-4o improving over time since it gives an unbiased
    response](media/file55.png)


    Figure 4.15 – Example of GPT-4o improving over time since it gives an unbiased
    response


    Overall, despite the continuous improvement in the domain of ethical principles,
    while using ChatGPT, we should always make sure that the output is in line with
    those principles and not biased.


    The concepts of bias and ethics within ChatGPT and OpenAI models have a wider
    collocation within the whole topic of responsible AI, which we are going to focus
    on in the last chapter of this book.


    ## Summary


    In this chapter, we have dived deeper into the concept of prompt design and engineering
    since it’s the most powerful way to control the output of ChatGPT and LLMs in
    general. We learned how to leverage different levels of shot learning to make
    LLMs more tailored toward our objectives.


    We started with an introduction to the concept of prompt engineering and why it
    is important, to then move towards the basic principles – including clear instructions,
    asking for justification etc.


    Then, we moved towards more advanced techniques, which are meant to shape the
    reasoning approach of our LLM: few-shot learning, `CoT` and `ReAct`.


    Prompt engineering is an emerging discipline which is paving the way for a new
    category of applications, infused with LLMs. In next chapters, we will see those
    techniques in action building real-world applications using LLMs.


    Starting from the next chapter, we will dive deeper into different domains where
    ChatGPT can boost productivity and have a disruptive impact on the way we work
    today.


    ## References


    The following are the references for this chapter:


    *   [https://arxiv.org/abs/2005.14165](https://arxiv.org/abs/2005.14165)

    *   [https://dl.acm.org/doi/10.1145/3442188.3445922](https://dl.acm.org/doi/10.1145/3442188.3445922)

    *   [https://openai.com/alignment/](https://openai.com/alignment/)

    *   [https://twitter.com/spiantado/status/1599462375887114240?ref](https://twitter.com/spiantado/status/1599462375887114240?ref)

    *   ReAct approach. [https://arxiv.org/abs/2210.03629](https://arxiv.org/abs/2210.03629)

    *   Chain of Thoughts approach. [https://arxiv.org/abs/2201.11903](https://arxiv.org/abs/2201.11903)

