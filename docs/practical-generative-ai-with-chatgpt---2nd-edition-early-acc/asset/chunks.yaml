    For example, a language model such as GPT-4o, developed by OpenAI, can be trained
    on large amounts of text data and then used to generate new, coherent, and grammatically
    correct text in different languages (both in terms of input and output), as well
    as extracting relevant features from text such as keywords, topics, or full summaries.


    Here is an example of working with GPT-3:


    ![Figure 1.2 – Example of ChatGPT responding to a user prompt, also adding references](media/file2.png)


    Figure 1.2 – Example of ChatGPT responding to a user prompt, also adding references


    Next, we will move on to image generation.


    ## Image generation


    One of the earliest and most well-known examples of generative AI in image synthesis
    is the `Generative Adversarial Network` (`GAN`) architecture introduced in the
    2014 paper by I. Goodfellow et al., *Generative Adversarial Networks*. The purpose
    of `GANs` is to generate realistic images that are indistinguishable from real
    images. This capability had several interesting business applications, such as
    generating synthetic datasets for training computer vision models, generating
    realistic product images, and generating realistic images for virtual reality
    and augmented reality applications.


    Here is an example of faces of people who do not exist since they are entirely
    generated by AI:


    ![Figure 1.3 – Imaginary faces generated by GAN StyleGAN2 at https://this-person-does-not-exist.com/en](media/file3.jpg)


    Figure 1.3 – Imaginary faces generated by GAN StyleGAN2 at `https://this-person-does-not-exist.com/en`


    Then, in 2021, a new generative AI model was introduced in this field by OpenAI,
    `DALL-E`. Different from `GANs`, the `DALL-E` model is designed to generate images
    from descriptions in natural language (`GANs` take a random noise vector as input)
    and can generate a wide range of images, which may not look realistic but still
    depict the desired concepts.


    `DALL-E` has great potential in creative industries such as advertising, product
    design, and fashion, among others, to create unique and creative images.


    Since its first release to date (December 2024), `DALL-E` has improved dramatically,
    as you can see in the following examples. Let’s see below an artistic creation
    authored by `DALL-E` at the dawn of its life:


    ![Figure 1.4 – Images generated by DALL-E with a natural language prompt as input](media/file4.jpg)


    Figure 1.4 – Images generated by `DALL-E` with a natural language prompt as input


    Let’s now see what `DALL-E3`, the most recent version of the model at the time
    of writing this book, can produce (here I’m using Microsoft Image Creator powered
    by `DALL-E3`. You can try it at [https://copilot.microsoft.com/images/create](https://copilot.microsoft.com/images/create)):


    ![Figure 1.5 – Images generated by DALL-E3 with a natural language prompt as input](media/file5.png)


    Figure 1.5 – Images generated by `DALL-E3` with a natural language prompt as input


    It’s impressive to see the level of improvement of this model in less than 18
    months. Funny enough, we are just scraping the surface of the massive improvements
    occurring over the last months in the field of Generative AI.


    ## Music generation


    The first approaches to generative AI for music generation trace back to the 50s,
    with research in the field of algorithmic composition, a technique that uses algorithms
    to generate musical compositions. In fact, in 1957, Lejaren Hiller and Leonard
    Isaacson created the `Illiac Suite for String Quartet` ([https://www.youtube.com/watch?v=n0njBFLQSk8](https://www.youtube.com/watch?v=n0njBFLQSk8)),
    the first piece of music entirely composed by AI. Since then, the field of generative
    AI for music has been the subject of ongoing research for several decades. Among
    recent years’ developments, new architectures and frameworks have become widespread
    among the general public, such as the `WaveNet` architecture introduced by Google
    in 2016, which has been able to generate high-quality audio samples, or the `Magenta`
    project, also developed by Google, which uses `Recurrent Neural Networks` (`RNNs`)
    and other ML techniques to generate music and other forms of art. Then, in 2020,
    OpenAI also announced `Jukebox`, a neural network that generates music, with the
    possibility to customize the output in terms of musical and vocal style, genre,
    reference artist, and so on.


    Those and other frameworks became the foundations of many AI composer assistants
    for music generation. An example is `Flow Machines`, developed by Sony CSL Research.
    This generative AI system was trained on a large database of musical pieces to
    create new music in a variety of styles. It was used by French composer Benoît
