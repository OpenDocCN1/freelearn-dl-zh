  trans: '


    为了克服这一局限性，AI 代理（AI agents）成为了关键角色。但它们究竟是什么呢？代理可以被看作是由大语言模型（LLM）驱动的 AI 系统，根据用户的查询，它们能够在我们允许范围内与周围的生态系统进行交互。生态系统的边界由我们为代理提供的工具（或插件）决定（在我们之前的示例中，我们可能会为代理提供一个
    LinkedIn 插件，以便它能够发布生成的内容）。


    代理体由以下要素组成：


    *   一个作为 AI 系统推理引擎的 LLM（大语言模型）。

    *   一条系统消息（system message），用于指示代理以特定的方式行为和思考。例如，你可以将一个代理体设计为学生的助教，并带有如下系统消息：“你是一个助教。给定学生的查询，**永远**提供最终答案，而是提供一些提示来帮助他们获得答案”。

    *   一组代理可以利用其与周围生态系统进行交互的工具。


    AI 代理体是“LLM 作为应用程序推理引擎”这一含义的完美体现。事实上，代理体的优之处在于，它们可以选择最合适的工具来完成用户的请求。例如，假设我们有一个用于生成
    LinkedIn 内容的 AI 代理，并为其提供了两个工具：一个 LinkedIn 插件和一个网络搜索插件（每个插件都对其功能有适当的描述）。然后，让我们探索代理面对两个不同问题时的行为：


    *   生成一个关于小狗在山间散步的故事🡪代理将在不涉及任何插件的情况下生成故事。

    *   生成一个关于米兰当前天气的故事🡪代理将调用网络搜索插件获取米兰当前的天气。

    *   生成一个关于米兰当前天气的 LinkedIn 帖子并发布在我的个人页上：代理将调用网络搜索插件获取米兰当前的天气，并调用 LinkedIn 插件将其发布到我的个人页。


    指令和插件集的组合使得 AI 代理体极其多功能，你可以创建高度特化的实体来应对特定场景。


    而且不仅于此。


    既然你可以创建一个相互对话和协作的代理体团队，为什么要只用一个代理呢？想象一下多个代理，每个都有特定的专业知识和目标，它们之间相互通信和交互以完成任务。这就是`多代理应用`（multi-agent
    applications）的模样，在过去的几个月里，这种模式开始表现出涌现行为。


    让我们考虑以下示例。我们想生成一个关于气候变化的电梯演讲（elevator pitch）。我们需要更新信息来完成（最新趋势和研究、未来展望等），以及基于学术论文的坚实研究。此外，我们需要保持简洁、敏锐且高效，在非常短的演讲中交付所有关键信息。


    现在，我们可以向单个代理提出所有要求，为它提供所有需要的工具和长长的指令来完成任务。然而，事实证明，当我们给 LLM 安排“太多的要做的事情”时，它们的表现往往会变差。相反，让我们使用多代理方法，创建一个由以下
    AI 专业人士组成的团队：


    *   一个市场分析师，可以在网络上搜索有关气候变化的最新新闻；这将是一个拥有网络搜索插件和特定搜索指令的代理；

    *   一个专家研究员，可以轻松查阅关于气候变化的学术论文；这将是一个拥有 `Arxiv` 插件和如何检索相关信息特定指令的代理；

    *   一个演讲专家，可以轻松地将所有信息整合进一个电梯演讲中；这将是一个拥有如何进行完美演讲的恰当指令的代理；

    *   一个批评者，将审查演讲并在需要时向演讲专家提出修改建议；这将是一个拥有如何进行完美演讲的恰当指令的代理；


    因此，当用户提问“生成一个关于当前气候变化问题的电梯演讲”时，所有代理都可以开始开展该项目。


    有很多框架可以帮助开发者构建多代理应用（包括 `AutoGen`、`LangGraph`、`CrewAI`），特别是涉及到我们希望代理遵循的“流程”时。例如，我们可能希望强制特定的迭代次数；或者所有代理至少被调用一次；或者甚至让我们作为用户参与每次迭代，提供进一步的反馈并将其整合到下次迭代中。


    在编写此时，多代理框架显示出广阔的进展，但它仍然处于实验阶段，可能远未达到企业级水平。尽管如此，它是 LLM 后方卓越推理能力的一种瞥，展示了它们如何开启解决问题和创造的新方法。


    ### 小语言模型


    大语言模型名如其义非常大。这意味着包含 LLM 的人工神经网络架构由海量参数组成，数量级达数万亿。理想情况下，参数数量越高，LLM 的推理能力越强。然而，高参数量也意味着高昂的训练和托管成本，因为需要强大的
    AI 基础设施。此外，这些模型消耗的能源引发了关于 LLM 训练对环境的影响及其长期可持续性的严肃问题。为了让你有一个直观的概念，以下是与不同规模（以参数数量衡量）的开源
    LLM 相关的一些数字：


    ![图 2：在同一数据中心训练不同模型所需的碳足迹和算力。来源：https://arxiv.org/pdf/2302.13971](img/file20.png)


    图 2：在同一数据中心训练不同模型所需的碳足迹和算力。来源：https://arxiv.org/pdf/2302.13971


    幸运的是，在过去的几个月里，我们见证了对小模型研究兴趣和投入的增加，目标是在保持良好推理能力的同时减少参数数量。这种理念是，小模型即使“智能程度较低”，但如果专注于特定的活动，仍然可以满足需求。


    这些较小的模型被称为小语言模型（SMLs），除了对基础设施的要求更轻、更低之外，它们还表现出了惊人的性能。


    例如，如果我们考虑 `Phi-3` 的较小版本（微软开发的流行的 SLM 家族的一部分），它仅有 70 亿参数，我们可以看到它在所有最流行的 LLM 基准测试中都胜了
    `GPT-3.5-turbo`：


    ![图 3：Phi-3 与其他 SLM 和 LLM 的能力对比表。来源：https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/](img/file21.png)


    图 3：Phi-3 与其他 SLM 和 LLM 的能力对比表。来源：https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/


    现在，我们可能会认为 `GPT-3.5-turbo` 已经过时，但我们必须记住，凭借 1750 亿参数在一年前还是市场上最强大的模型，看到一个 70 亿的模型能够产生更好的结果是非常令人惊讶的。


    SLM 领域绝对值得关注的研究方向，特别是当我可能希望在本地部署模型甚至通过微调对其进行定制的场景时（我们将在下一章介绍微调）。


