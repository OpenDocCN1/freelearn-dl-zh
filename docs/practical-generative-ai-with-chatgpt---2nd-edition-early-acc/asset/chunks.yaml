    ## Video generation


    Generative AI for video generation shares a similar timeline of development with
    image generation. In fact, one of the key developments in the field of video generation
    has been the development of GANs. Thanks to their accuracy in producing realistic
    images, researchers have started to apply these techniques to video generation
    as well. One of the most notable examples of `GAN`-based video generation is DeepMind’s
    `Motion to Video`, which generated high-quality videos from a single image. Another
    great example is NVIDIA’s `Video-to-Video Synthesis` (`Vid2Vid`) DL-based framework,
    which uses `GANs` to synthesize high-quality videos from input videos.


    The `Vid2Vid` system can generate temporally consistent videos, meaning that they
    maintain smooth and realistic motion over time. The technology can be used to
    perform a variety of video synthesis tasks, such as the following:


    *   Converting videos from one domain into another (for example, converting a
    daytime video into a nighttime video or a sketch into a realistic image)

