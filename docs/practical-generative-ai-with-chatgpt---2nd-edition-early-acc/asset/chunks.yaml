    \n# 3 理解提示词设计\n\n## 在 Discord 上加入我们的书籍社区\n\n![](img/file0.png)\n\n[`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)\n\
    \n在之前的章节中，我们在提到 ChatGPT 以及通用的 LLM 模型的用户输入时，多次使用了 `prompt`（提示词）一词。\n\n由于提示词对 LLM\
    \ 的性能有巨大影响，因此提示词工程（prompt engineering）是设计 LLM 驱动的应用时项至关重要的活动。事实上，有多种技术可以实现，不仅可以优化你的\
    \ LLM 响应，还可以减少与幻觉（hallucination）和偏差相关的风险。\n\n在本章中，我们将涵盖提示词工程领域的新兴技术，从基础方法到高级框架。具体来说，我们将介绍以下主题：\n\
    \n*   提示词工程简介\n*   零样本、单样本和少样本学习（Zero, one and few shot learning）\n*   提示词工程的基本原理\n\
    *   提示词工程的高级技术\n*   通过提示词工程缓解风险和幻觉\n*   处理提示注入（prompt injections）\n\n在本章结束时，你将拥有为你的\
    \ LLM 驱动的应用构建功能且稳健的提示词的基础，这在接下来的章节中也会相关。\n\n## 什么是提示词工程？\n\n在解释什么是提示词工程之前，让我们从提示词（prompt）的原子定义开始。\n\
    \n提示词是一种文本输入，引导 LLM 的行为以生成文本输出。在 LLM 和 LLM 驱动的应用的语境下，我们可以将提示词分为两类：\n\n*   用户在与\
    \ LLM 交互时输入的提示词。例如，一个提示词可能是“给我详细解释一下质子”，或者“生成一个运行马拉松的跑步训练计划”。下面你可以看到一个简单的用户提示词示例：\n\
    \n    ![](img/file36.png)![图 1：用户提示词示例。](img/file37.png)\n\n    图 1：用户提示词示例。\n\
    \n    你会听到人们简单地将此组件称为“prompt”、“query”（查询）或“user’s input”（用户输入）。\n\n*   无论用户的查询如何，指示模型以某种方式运行的提示词。这指的是我们提供给模型的自然语言指令集，使其在与终端用户交互时以某种方式运行。你可以将其理解为\
    \ LLM 的某种“后端”，即由应用程序开发者处理而非最终用户处理的内容。\n\n在接下来的图片中，你可以看到一个示例，我们向模型提出了上述问题，但这次我们添加了一个系统消息（system\
    \ message）来指示模型以某种方式运行：\n\n    ![](img/file38.png)![](img/file39.png)![图 2：元提示词（metaprompt）示例。](img/file40.png)\n\
    \n    图 2：元提示词示例。\n\n    我们将这类提示词称为“metaprompt”（元提示词）或“system message”（系统消息）。\n\
    \n从此以后，提示词工程是指设计有效提示词的过程，旨在从 LLM 中引导高质量且相关的输出。提示词工程需要创造力、对 LLM 的理解以及精确性。\n\n![图\
    \ 3：通过提示词工程使 LLM 专业化的示例。](img/file41.png)\n\n图 3：通过提示词工程使 LLM 专业化的示例。\n\n在过去的几年里，提示词工程本身变成了一门全新的学科，这证明了与这些模型交互需要一套以前不存在的新技能和能力。“提示词艺术”（art\
    \ of prompting）已成为在企业场景下构建生成式 AI 应用的顶级技能；然而，对于在日常任务中使用 ChatGPT 或类似 AI 助手的个人用户来说，它也非常有用，因为它极大提高了结果的质量和准确性。\n\
    \n在接下来的章节中，我们将看到一些如何为你的 LLM 应用构建高效稳健的提示词和元提示词的示例。请注意，我们将涵盖的所有技术都可以嵌入到用户提示词和元提示词中，取决于你的具体需求。为了做到这一点，我将利用\
    \ OpenAI Playground，以便能够更灵活地在两个层级的提示上进行操作。\n\n## 零样本、单样本和少样本学习——Transformer 的典型\n\
    \n在之前的章节中，我们提到了 LLM 通常以预训练格式出现。它们已经在海量数据上进行了训练。\n\n然而，这并不意味着它们现在不能学习了。在第 2 章中，我们看到自定义\
    \ OpenAI 模型并使其更适用于特定任务的方法是微调（fine-tuning）。\n\n> 微调是将预训练模型适配到新任务的过程。在微调中，预训练模型的参数会被更改，即通过调整现有参数或添加新参数来适应数据。这是通过在特定任务的较小数据集上训练模型来实现的。微调的核心思想是利用从预训练模型中学到的知识并使其新任务，而不是从头训练模型。\n\
    \n微调是一个正式的训练过程，需要训练数据集、计算能力和一些时间（取决于数据量和计算实例）。\n\n这就是为什么测试另一种让模型在特定任务中变得更技能的方法：样本学习（shot\
    \ learning）：其思想是让模型从示例学习，而不是整个数据集。这些示例是我们希望模型响应的方式，以便模型不仅学习内容，还学习在其响应中使用的格式、风格和分类。\n\
    \n此外，样本学习直接通过提示词发生（正如我们在后续场景中看到的），因此整个过程更不耗时且更容易执行。\n\n提供的示例数量决定了我们所指的样本学习水平。换句话说，如果不提供示例则为零样本（zero-shot），提供一个示例则为单样本（one-shot），提供\
    \ 2-3 个以上的示例则为少样本（few-shot）。\n\n让我们关注每一个场景：\n\n*   零样本学习。在这种类型的学习中，模型被要求执行一项它未见过任何训练示例的任务。模型必须依靠先验知识或关于任务的通用信息来完成任务。例如，零样本学习的方法可以是要求模型生成描述，正如我的提示词中所定义的：\n\
    \n    ![图 4.3 零样本学习示例](img/file42.png)\n\n    图 4.3 零样本学习示例\n\n"
- fmt: "\n- **One-shot learning**: In this type of learning, the model is given a\
    \ single example of each new task it is asked to perform. The model must use its\
    \ prior knowledge to generalize from this single example to perform the task.\
    \ If we consider the preceding example, I could provide my model with a `prompt-completion`\
    \ example before asking it to generate a new one:\n\n![Figure 4.4 – Example of\
    \ one-shot learning](media/file43.png)\n\nFigure 4.4 – Example of one-shot learning\n\
    \n```\n{\"prompt\": \"<prompt text>\", \"completion\": \"<ideal generated text>\"\
    }\n```\n\nNote that the way I provided an example was similar to the structure\
    \ used for fine-tuning:\n\n- **Few-shot learning**: In this type of learning,\
    \ the model is given a small number of examples (typically between 2 and 5) of\
    \ each new task it is asked to perform. The model must use its prior knowledge\
    \ to generalize from these examples to perform the task. Let’s continue with our\
    \ example and provide the model with further examples:\n\n![Figure 4.5 – Example\
    \ of few-shot learning with three examples](media/file44.png)\n\nFigure 4.5 –\
    \ Example of few-shot learning with three examples\n\nThe nice thing about few-shot\
    \ learning is that you can also control model output in terms of how it is presented.\
    \ You can also provide your model with a template of the way you would like your\
    \ output to look. For example, consider the following tweet classifier:\n\n![Figure\
    \ 4.6 – Few-shot learning for a tweets classifier. This is a modified version\
    \ of the original script from https://learn.microsoft.com/en-us/azure/cognitive-services/openai/how-to/completions](media/file45.png)\n\
    \nFigure 4.6 – Few-shot learning for a tweets classifier. This is a modified version\
    \ of the original script from https://learn.microsoft.com/en-us/azure/cognitive-services/openai/how-to/completions\n\
    \nLet’s examine the preceding figure. First, I provided ChatGPT with some examples\
    \ of labeled tweets. Then, I provided the same tweets but in a different data\
    \ format (list format), as well as the labels in the same format. Finally, in\
    \ list format, I provided unlabeled tweets so that the model returns a list of\
    \ labels.\n\nShot-learning possibilities are limitless– it’s only a matter of\
    \ testing and a little bit of patience in finding the proper prompt design.\n\n\
    As mentioned previously, it is important to remember that these forms of learning\
    \ are different from traditional supervised learning, as well as fine-tuning.\
    \ In few-shot learning, the goal is to enable the model to learn from very few\
    \ examples, and to generalize from those examples to new tasks.\n\nNow that we’ve\
    \ learned how to let OpenAI models learn from examples, let’s focus on how to\
    \ properly define our prompt to make the model’s response as accurate as possible.\n\
    \n## Principles of prompt engineering\n\nTraditionally, in the context of computing\
    \ and data processing, we often use the expression “garbage in, garbage out”,\
    \ meaning that the quality of output is determined by the quality of the input.\
    \ If incorrect or poor-quality data (garbage) is entered into a system, the output\
    \ will also be flawed or nonsensical (garbage).\n\nWhen it comes to prompting,\
    \ the story is similar: if we want accurate and relevant results from our LLMs,\
    \ we need to provide high-quality input. However, building good prompts is not\
    \ just about the quality of the response. In fact, we can construct good prompts\
    \ to:\n\n* Maximize the relevancy of LLM’s responses\n* Specify the type formatting\
    \ and style of responses\n* Provide conversational context\n* Reduce inner biases\
    \ and improve fairness and inclusivity\n* Reduce hallucination\n\n> In the context\
    \ of large language models (LLMs), \"hallucination\" refers to the generation\
    \ of text or responses that are factually incorrect, nonsensical, or not grounded\
    \ in the training data. This occurs when an LLM produces confident-sounding but\
    \ erroneous or fabricated information. Hallucinations can arise due to the probabilistic\
    \ nature of these models, which may predict the next word or phrase based on patterns\
    \ rather than verified facts.\n\nLet’s see some basic techniques to achieve these\
    \ results.\n\n### Clear Instructions\n\nThe principle of giving clear instructions\
    \ is to provide the model with enough information and guidance to perform the\
    \ task correctly and efficiently. Clear instructions should include the following\
    \ elements:\n\n* The goal or objective of the task, such as “write a poem” or\
    \ “summarize an article”.\n* The format or structure of the expected output, such\
    \ as “use four lines with rhyming words” or “use bullet points with no more than\
    \ 10 words each”.\n* The constraints or limitations of the task, such as “do not\
    \ use any profanity” or “do not copy any text from the source”.\n* The context\
    \ or background of the task, such as “the poem is about autumn” or “the article\
    \ is from a scientific journal”.\n\nLet’s say, for example, that we want our model\
    \ to fetch any kind of instructions from text and return to us a tutorial in a\
    \ bullet list. Plus, if there are no instructions in the provided text, the model\
    \ should inform us about that.\n\nTo try so, let’s leverage the OpenAI Playground\
    \ under the chat section, so that we can provide both the metaprompt and the prompt.\n\
    \nFor this scenario, I’ll set the following metaprompt:\n\n```\nYou are an AI\
    \ assistant that helps human by generating tutorials given a text.\nYou will be\
    \ provided with a text. If the text contains any kind of istructions on how to\
    \ proceed with something, generate a tutorial in a bullet list.\nOtherwise, inform\
    \ the user that the text does not contain any instructions.\n```\n\nAnd this will\
    \ be our user prompt:\n\n```\nTo prepare the known sauce from Genova, Italy, you\
    \ can start by toasting the pine nuts to then coarsely\nchop them in a kitchen\
    \ mortar together with basil and garlic. Then, add half of the oil in the kitchen\
    \ mortar and season with salt and pepper.\nFinally, transfer the pesto to a bowl\
    \ and stir in the grated Parmesan cheese.\n```\n\nLet’s see how it works:\n\n\
    ![Figure 4: Example of clear instructions in the metaprompt.](media/file46.png)\n\
    \nFigure 4: Example of clear instructions in the metaprompt.\n\nNote that, if\
    \ we pass the model another text which does not contain any instructions, it will\
    \ be able to respond as we instructed it:\n\n![Figure 5: Example of chat model\
    \ following instructions.](media/file47.png)\n\nFigure 5: Example of chat model\
    \ following instructions.\n\nBy giving clear instructions, you can help the model\
    \ understand what you want it to do and how you want it to do it. This can improve\
    \ the quality and relevance of the model’s output, and reduce the need for further\
    \ revisions or corrections.\n\nHowever, sometimes there are scenarios where clarity\
    \ is not enough. We might need to infer the way of thinking of our LLM to make\
    \ it more robust with respect to its task. In next section, we are going to examine\
    \ one of this techniques, very useful in case of complex tasks to accomplish.\n\
    \n### Split complex tasks into subtasks\n\nPrompt engineering is a technique that\
    \ involves designing effective inputs for large language models (LLMs) to perform\
    \ various tasks. Sometimes, the tasks are too complex or ambiguous for a single\
    \ prompt to handle, and it is better to split them into simpler subtasks that\
    \ can be solved by different prompts.\n\nHere are some examples of splitting complex\
    \ tasks into subtasks:\n\n* Text summarization: A complex task that involves generating\
    \ a concise and accurate summary of a long text. This task can be split into subtasks\
    \ such as:\n    * Extracting the main points or keywords from the text.\n    *\
    \ Rewriting the main points or keywords in a coherent and fluent way.\n    * Trimming\
    \ the summary to fit a desired length or format.\n* Machine translation: A complex\
    \ task that involves translating a text from one language to another. This task\
    \ can be split into subtasks such as:\n    * Detecting the source language of\
    \ the text.\n"
