  trans: "\n\n![图 15：ChatGPT 在存在相关风险的情况下仍完成用户任务的示例。](img/file162.png)\n\n图 15：ChatGPT\
    \ 在存在相关风险的情况下仍完成用户任务的示例。\n\n请注意，尽管 ChatGPT 口头上头上表达了顾虑，但它仍然在配合我的请求，为我提供了一份运行全程马拉松的计划。这可能会鼓励我——一个认为跑马拉松是个笑话的鲁莽初学者——投身于这场愚蠢的冒险，并对我的健康造成严重后果。\n\
    \n总的来说，GPTs 允许你非常具体地规定助手应该如何行为，以及它应该避免说什么或满足什么要求。\n\n# 代码助手\n\n在这一节中，我想开发一个专为数据科学项目定制的助手。更具体地说，我希望我的助手能够：\n\
    \n* 根据用户的任务，就如何设置数据科学实验提供清晰的指导\n* 生成运行该实验所需的 `Python` 代码\n* 利用 `code interpreter`（代码解释器）能力来运行和检查代码\n\
    * 将最终代码推送到 `GitHub` 仓库。\n\n让我们逐步查看如何实现。\n\n### 1. 设置指令\n\n这个 `GPT` 是一个数据科学助手，帮助用户设置和运行数据科学实验。它提供了如何设置和运行数据科学实验的指导。它提供了如何组织实验的清晰指导，生成运行实验所需的\
    \ `Python` 代码，并利用 `code interpreter` 能力来运行和检查代码。`GPT` 将接收用户的输入并执行代码，并将最终代码推送到\
    \ `GitHub` 仓库。\n\n### 2. 设置（可选）提示词\n\n* *我如何设置实验？*\n* *生成 `Python` 代码模型。*\n* *你能帮我设置吗？*\n\
    \n### 3. 启用代码解释器与数据分析\n\n![图 16：启用代码解释器与数据分析。](img/file163.png)\n\n图 16：启用代码解释器与数据分析。\n\
    \n### 4. 创建 GitHub 的 Action\n\n> 为了与 GitHub 交互，我们需要 `Schema`（架构）。\n\n#### 定义架构的步骤\n\
    \n1. **数据（Data）**：确定数据类型。\n2. **属性（Properties）**：`Schema` 架构下的字段。\n3. **必填字段（Required\
    \ fields）**：`Schema` 架构中的必填项。\n4. **响应（Responses）**：`Schema` 架构的响应。\n\n考虑以下示例：\n\
    \n```yaml\nopenapi: 3.0\ninfo:\n  title: ChatGPT API\n  description: GitHub action\n\
    \  version: 1.0\nservers:\n  - url: https://api.github.com\n    description: GitHub\
    \ server\npaths:\n  /repos/{owner}/{repository}/contents/{path}:\n    put:\n \
    \     operationId: updateFile\n      summary: 在仓库中更新文件\n      description: 使用此端点创建或更新文件。\n\
    \      parameters:\n        - name: owner\n          in: path\n          required:\
    \ true\n          description: 仓库的所有者。\n          schema:\n            type: string\n\
    \        - name: repository\n          in: path\n          required: true\n  \
    \        description: 仓库名称。\n          schema:\n            type: string\n   \
    \     - name: path\n          in: path\n          required: true\n          description:\
    \ 仓库中的文件路径。\n          schema:\n            type: string\n      requestBody:\n\
    \        required: true\n        content:\n          application/json:\n     \
    \       schema:\n              type: object\n              properties:\n     \
    \           message:\n                  type: string\n                  description:\
    \ 文件的提交消息。\n                content:\n                  type: string\n       \
    \           description: 新文件内容，Base64 编码。\n                sha:\n            \
    \      type: string\n                  description: 被替换文件的 SHA（如果是更新）。\n     \
    \           branch:\n                  type: string\n                  description:\
    \ 创建更新文件的分支。\n                committer:\n                  type: object\n   \
    \               properties:\n                    name:\n                     \
    \ type: string\n                    email:\n                      type: string\n\
    \              required:\n                - message\n                - content\n\
    \      responses:\n        '200':\n          description: 文件更新或创建成功。\n       \
    \ '201':\n          description: 文件创建成功。\n        '422':\n          description:\
    \ 验证失败或文件已存在。\n      security:\n        - bearerAuth: []\ncomponents:\n  securitySchemes:\n\
    \    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat:\
    \ token\n```\n\n这是 GitHub Action 的配置：\n\n![图 17：GitHub Action 的配置。](img/file164.png)\n\
    \n图 17：GitHub Action 的配置。\n\n为了允许 Action 与我的仓库通信，我在 GitHub 个人设置（Settings > Developer\
    \ settings > Personal access token）中创建了一个个人访问令牌。\n\n然后，你可以按照如下方式测试连接：\n"
- fmt: "\nGreat! As you can see, we now have a new file with the pre-defined content.\n\
    \nLet’s now create it and test it:\n\n*   Let’s start with a simple question about\
    \ how to set up a classification experiment (truncated output):\n\n    ![Figure\
    \ 20: Example of the DataScience Assistant providing guidance on how to tackle\
    \ a classification problem.](media/file167.png)\n\n    Figure 20: Example of the\
    \ DataScience Assistant providing guidance on how to tackle a classification problem.\n\
    \n*   Following these instructions, we are now ready to set up our experiment.\
    \ We want to tackle the well-known Titanic passengers’ survival prediction. We\
    \ will upload our dataset (you can find many free versions online, I downloaded\
    \ mine at [https://github.com/datasciencedojo/datasets/blob/master/titanic.csv](https://github.com/datasciencedojo/datasets/blob/master/titanic.csv))\
    \ and leverage a `Logistic Regression` model.\n\n    > The Titanic survival prediction\
    \ task is a classic problem in data science and machine learning. The goal is\
    \ to predict whether a passenger on the Titanic would survive or not, based on\
    \ various features like age, gender, passenger class, fare, and more. This task\
    \ is typically used to teach classification techniques, where the model is trained\
    \ on a labeled dataset and then used to predict outcomes on new data. The challenge\
    \ involves selecting relevant features, handling missing data, and choosing the\
    \ appropriate machine learning algorithm to achieve accurate predictions.\n\n\
    *   This is my query:\n\n![Figure 21: Example of DataScience Assistant designing\
    \ the Titanic survival experiment.](media/file168.png)\n\nFigure 21: Example of\
    \ DataScience Assistant designing the Titanic survival experiment.\n\nI will now\
    \ share some screenshots of the model’s response per each step:\n\n1.  Load the\
    \ data:\n\n    ![Figure 22: Example of DataScience Assistant executing the step\
    \ 1 of the experiment.](media/file169.png)\n\n    Figure 22: Example of DataScience\
    \ Assistant executing the step 1 of the experiment.\n\n2.  Explore and clean the\
    \ data:\n\n![Figure 23: Example of DataScience Assistant exploring and cleaning\
    \ data.](media/file170.png)\n\nFigure 23: Example of DataScience Assistant exploring\
    \ and cleaning data.\n\nNote that, when you see the symbol `[>_]`, it means that\
    \ the code interpreter plugin has been triggered. You can click on it to see the\
    \ executed code:\n\n![Figure 24: Example of DataScience Assistant’s generated\
    \ code leveraging the code interpreter plugin.](media/file171.png)\n\nFigure 24:\
    \ Example of DataScience Assistant’s generated code leveraging the code interpreter\
    \ plugin.\n\n1.  Feature Engineering:\n\n    ![Figure 25: Example of DataScience\
    \ Assistant doing feature engineering.](media/file172.png)\n\n    Figure 25: Example\
    \ of DataScience Assistant doing feature engineering.\n\n2.  Data splitting:\n\
    \n    ![Figure 26: Example of DataScience Assistant splitting the dataset into\
    \ training and test set.](media/file173.png)\n\n    Figure 26: Example of DataScience\
    \ Assistant splitting the dataset into training and test set.\n\n3.  Train the\
    \ model:\n\n    ![Figure 27: Example of DataScience Assistant training a Logistic\
    \ Regression model.](media/file174.png)\n\n    Figure 27: Example of DataScience\
    \ Assistant training a Logistic Regression model.\n\n4.  Evaluate the model:\n\
    \n![Figure 28: Example of DataScience Assistant evaluating the model’s output.](media/file175.png)\n\
    \nFigure 28: Example of DataScience Assistant evaluating the model’s output.\n\
    \nThat’s pretty cool! It is extremely accurate and can save a lot of time. Plus,\
    \ if you think about data scientists working in large enterprises on many projects,\
    \ having a similar assistant can also help in following fixed standards among\
    \ projects, so that the maintenance is aligned across teams.\n\nThe last thing\
    \ that we will ask our GPT is to push the code on our Repo. Let’s see how it works:\n\
    \n![Figure 29 Example of DataScience Assistant leveraging the Action to push the\
    \ code on GitHub.](media/file176.png)\n\nFigure 29 Example of DataScience Assistant\
    \ leveraging the Action to push the code on GitHub.\n\nIf we click on the link,\
    \ we can see that the file has been successfully uploaded:\n\n![Figure 30: File\
    \ uploaded via DataScience Assistant Action.](media/file177.png)\n\nFigure 30:\
    \ File uploaded via DataScience Assistant Action.\n\nAnd it worked! Again, this\
    \ is an example of how GPTs can speed up developers and data scientists’ productivity.\
    \ By designing data science experiments following a common framework and enabling\
    \ push workflows without the need of switching to GitHub can save previous time,\
    \ so that data scientists can focus on the core aspects of their projects.\n\n\
    ## Marketing Assistant\n\nAs we saw in Chapter 6 – Mastering Marketing with ChatGPT,\
    \ AI assistant can be extremely valuable when it comes to this domain. In fact,\
    \ generating text content – like social media posts, blog articles or marketing\
    \ campaigns – is probably the activity in which these models perform at their\
    \ best.\n\n> A copywriter is a professional who specializes in writing persuasive\
    \ and engaging content, often for marketing and advertising purposes. Their work\
    \ typically includes writing promotional materials such as advertisements, brochures,\
    \ websites, emails, social media posts, and other forms of content designed to\
    \ persuade an audience to take a specific action, like making a purchase or subscribing\
    \ to a service.\n\nIn this section, we are going to create a Copywrite assistant\
    \ which is tailored to this kind of activity. To do so, I named my assistant `Copywrite\
    \ Companion`, and I set the following configuration components:\n\n*   Instructions:\n\
    \n    `Copywrite Companion is a versatile assistant designed to help users with\
    \ various writing tasks. It specializes in generating product sheets based on\
    \ user input, including text and images, crafting email campaigns for newsletters\
    \ or promotional purposes, creating engaging visuals for new products, and writing\
    \ tailored social media posts for different platforms. It ensures content is persuasive,\
    \ engaging, and aligned with the target audience, aiming to increase engagement\
    \ and promote products or services effectively. The assistant adapts its style\
    \ to the user's needs and strives for creativity, clarity, and relevance in all\
    \ outputs. It communicates in a casual, friendly tone, making interactions feel\
    \ approachable and easygoing.`\n\n*   Conversation starters:\n\n    `Can you write\
    \ a product description for my new product?`\n\n    `I need a catchy headline\
    \ for an article about climbing`\n\n    `Give me a few ideas for a blog post about\
    \ running`\n\n*   Capabilities:\n\n![Figure 31: Copywrite Companion’s enabled\
    \ plugins.](media/file178.png)\n\nFigure 31: Copywrite Companion’s enabled plugins.\n\
    \nLet’s see it in action:\n\n*   I’ll first ask it to write a product sheet starting\
    \ from a picture provided (output truncated):\n\n    ![Figure 32: Example of Copywrite\
    \ Companion generating a product description.](media/file179.png)\n\n    Figure\
    \ 32: Example of Copywrite Companion generating a product description.\n\n*  \
    \ As copywriter, we might want to insert this set of information into more structured\
    \ repository, like an excel file. Let’s ask the assistant to do so, leveraging\
    \ its code interpreter plugin:\n\n    ![Figure 33: Example of Copywrite Companion\
    \ converting its previous response into an excel file, leveraging the code interpreter\
    \ plugin.](media/file180.png)\n\n    Figure 33: Example of Copywrite Companion\
    \ converting its previous response into an excel file, leveraging the code interpreter\
    \ plugin.\n\n*   And this is the final result:\n\n![Figure 34: Excel file generated\
    \ by Copywrite Companion](media/file181.png)\n\nFigure 34: Excel file generated\
    \ by Copywrite Companion\n\nLet’s now ask the assistant to generate an Instagram\
    \ post to sponsor our shoes:\n\n![Figure 35: Example of Copywrite Companion generating\
    \ an Instagram post.](media/file182.png)\n\nFigure 35: Example of Copywrite Companion\
    \ generating an Instagram post.\n[/"
