- fmt: "\nWith this first glance at the OpenAI models, we will also saw how easy it\
    \ is to test or embed pre-trained models into your applications: the game-changer\
    \ element here is that you don’t need powerful hardware and hours of time to train\
    \ your models, since they are already available to you and can also be customized\
    \ if needed, with a few examples.\n\nIn the next chapter, we also begin `Part\
    \ 2` of this book, where we will see ChatGPT in action within various domains\
    \ and how to unlock its potential. You will learn how to get the highest value\
    \ from ChatGPT by properly designing your prompts, how to boost your daily productivity,\
    \ and how it can be a great project assistant for developers, marketers, and researchers.\n\
    \n## References\n\n*   Radford, A., & Narasimhan, K. (2018). Improving language\
    \ understanding by generative pre-training.\n*   Vaswani, A., Shazeer, N., Parmar,\
    \ N., Uszkoreit, J., Jones, L., Gomez, A. N., Kaiser, L., & Polosukhin, I. (2017).\
    \ Attention Is All You Need. ArXiv. [https://doi.org/10.48550/ arXiv.1706.03762](https://doi.org/10.48550/)\
    \ OpenAI. Fine-Tuning Guide. OpenAI platform documentation. [https://platform.openai.com/docs/guides/fine-tuning](https://platform.openai.com/docs/guides/fine-tuning).\n\
    \n# 3 Understanding Prompt Design\n\n## Join our book community on Discord\n\n\
    ![](media/file0.png)\n\n[https://packt.link/EarlyAccess](https://packt.link/EarlyAccess)\n\
    \nIn the previous chapters, we mentioned the term `prompt` several times while\
    \ referring to user input in ChatGPT and LLMs models in general.\n\nSince prompts\
    \ have a massive impact on LLMs performance, prompt engineering is a crucial activity\
    \ while designing LLM-powered applications. In fact, there are several techniques\
    \ that can be implemented to not only to refine your LLM’s responses, but also\
    \ to reduce risks associated with hallucination and biases.\n\nIn this chapter,\
    \ we are going to cover the emerging techniques in the field of prompt engineering,\
    \ starting from basic approaches up to advanced frameworks. More specifically,\
    \ we will go through the following topics:\n\n*   Introduction to prompt engineering\n\
    *   Zero, one and few shot learning\n*   Basic principles of prompt engineering\n\
    *   Advanced techniques of prompt engineering\n*   Mitigation of risks and hallucinations\
    \ with prompt engineering\n*   Handling prompt injections\n\nBy the end of this\
    \ chapter, you will have the foundations to build functional and solid prompts\
    \ for your LLM-powered applications, which will also be relevant in the upcoming\
    \ chapters.\n\n## What is prompt engineering?\n\nBefore explaining what prompt\
    \ engineering is, let’s start with the atomic definition of prompt.\n\nA prompt\
    \ is a text input that guides the behaviour of an LLM to generate a text output.\
    \ In the context of LLMs and LLMs-powered applications, we can distinguish two\
    \ types of prompts:\n\n*   The prompt that the user’s type when interacting with\
    \ the LLM. For example, a prompt might be “Give me a detailed explanation of a\
    \ proton”, or “Generate a workout plan to run a marathon”. Below you can see an\
    \ example of a simple user prompt:\n\n    ![](media/file36.png)![Figure 1: Example\
    \ of user’s prompt.](media/file37.png)\n\n    Figure 1: Example of user’s prompt.\n\
    \n    You will hear referring to this component simply as “prompt”, “query”, or\
    \ “user’s input”.\n\n*   The prompt that instruct the model to behave in a certain\
    \ way regardless of the user’s query. This refers to the set of instructions in\
    \ natural language that we provide the model with, so that it behaves in a certain\
    \ way when interacting with end users. You can think about that as a sort of “backend”\
    \ of your LLM, something that will be handled by the application developers rather\
    \ than the final users.\n\nIn the following picture, you can see an example where\
    \ we ask the model the same above questions, yet this time we add a system message\
    \ to instruct the model to behave in a certain way:\n\n    ![](media/file38.png)![](media/file39.png)![Figure\
    \ 2: Example of a metaprompt.](media/file40.png)\n\n    Figure 2: Example of a\
    \ metaprompt.\n\n    We refer to this type of prompt as “metaprompt” or “system\
    \ message”.\n\nHenceforth, prompt engineering is the process of designing effective\
    \ prompts that elicit high-quality and relevant outputs from LLMs. Prompt engineering\
    \ requires creativity, understanding of the LLM, and precision.\n\n![Figure 3:\
    \ Example of prompts engineering to specialize LLMs.](media/file41.png)\n\nFigure\
    \ 3: Example of prompts engineering to specialize LLMs.\n\nOver the last years,\
    \ prompt engineering became a brand new discipline itself, and this is a demonstration\
    \ of the fact that, interacting with those models require a new set of skills\
    \ and capabilities that did not exist before. The “art of prompting” has become\
    \ a top skill when it comes to build Generative AI applications in enterprise\
    \ scenarios; however, it can also be extremely useful for individual users that\
    \ use ChatGPT or similar AI assistant in daily tasks, as it improves dramatically\
    \ the quality and accuracy of results.\n\nOver the next sections, we are going\
    \ to see some examples of how to build efficient and robust prompts and metaprompts\
    \ for your LLM applications. Note that all the techniques we are going to cover,\
    \ can be embedded both in the user prompt and the metaprompt, depending on your\
    \ specific requirements. To do that, I will leverage the OpenAI Playground, so\
    \ that I can have greater flexibility to operate at both levels of prompting.\n\
    \n## Zero-, one-, and few-shot learning – typical of transformers\n\nIn the previous\
    \ chapters, we mentioned how LLMs typically come in a pre-trained format. They\
    \ have been trained on a huge amount of data and have had (billions of) parameters\
    \ configured.\n\nHowever, this doesn’t mean that those models can’t learn anymore.\
    \ In Chapter 2, we saw that one way to customize an OpenAI model and make it more\
    \ capable of addressing specific tasks is fine-tuning.\n\n> Fine-tuning is the\
    \ process of adapting a pre-trained model to a new task. In fine-tuning, the parameters\
    \ of the pre-trained model are altered, either by adjusting the existing parameters\
    \ or by adding new parameters so that they fit the data for the new task. This\
    \ is done by training the model on a smaller dataset that is specific to the new\
    \ task. The key idea behind fine-tuning is to leverage the knowledge learned from\
    \ the pre-trained model and fine-tune it to the new task, rather than training\
    \ a model from scratch.\n\nFine-tuning is a proper training process that requires\
    \ a training dataset, compute power, and some training time (depending on the\
    \ amount of data and compute instances).\n\nThat is why it is worth testing another\
    \ method for our model to become more skilled in specific tasks: shot learning:\
    \ The idea is to let the model learn from simple examples rather than the entire\
    \ dataset. Those examples are samples of the way we would like the model to respond\
    \ so that the model not only learns the content but also the format, style, and\
    \ taxonomy to use in its response.\n\nFurthermore, shot learning occurs directly\
    \ via the prompt (as we will see in the following scenarios), so the whole experience\
    \ is less time-consuming and easier to perform.\n\nThe number of examples provided\
    \ determines the level of shot learning we are referring to. In other words, we\
    \ refer to zero-shot if no example is provided, one-shot if one example is provided,\
    \ and few-shot if more than 2-3 examples are provided.\n\nLet’s focus on each\
    \ of those scenarios:\n\n*   Zero-shot learning. In this type of learning, the\
    \ model is asked to perform a task for which it has not seen any training examples.\
    \ The model must rely on prior knowledge or general information about the task\
    \ to complete the task. For example, a zero-shot learning approach could be that\
    \ of asking the model to generate a description, as defined in my prompt:\n\n\
    \    ![Figure 4.3 – Example of zero-shot learning](media/file42.png)\n\n    Figure\
    \ 4.3 – Example of zero-shot learning\n"
