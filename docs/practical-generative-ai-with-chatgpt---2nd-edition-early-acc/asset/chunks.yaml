    # 1 生成式 AI 简介


    ## 在 Discord 上加入我们的书籍社区


    ![](img/file0.png)

    [`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)


    你好！欢迎来到*ChatGPT 和 OpenAI 终极指南！*在本书书中，我们将探索迷人的`生成式` `人工智能`（`GAI`）世界及其突破性的应用。生成式
    AI 改变了我们与机器交互的方式，使计算机能够在没有显式人类指令的情况下创建、预测和学习。自 2023 年 11 月 `ChatGPT` 发布以来，我们见证了自然语言处理、图像和视频合成以及许多其他领域前所未有的进步。无论您是好奇的初学者还是经验丰富的从业者，本指南都将为您提供知识和技能，帮助您在激动生成式
    AI 领域中穿行。因此，让我们深入研究，从我们所处环境的一些定义开始。


    本章提供了生成式 AI 领域的概述，该领域由使用`机器学习`（`ML`）算法创建新的独特数据或内容组成。


    它重点关注生成式 AI 在各个领域的应用，如图像合成、文本生成和音乐创作，强调了生成式 AI 变革各行业的潜力。这一关于生成式 AI 的介绍将为该技术的所在位置提供背景，以及将其置于广阔的
    AI、ML 和`深度学习`（`DL`）世界中的知识。然后，我们将通过具体的示例和近期进展，深入探讨生成式 AI 的主要应用领域，让您可以熟悉它对企业和整个社会可能产生的影响。


    此外，了解通往当前生成式 AI 领先水平的研究历程，将让您能够更好地理解近期进展和顶尖模型的基础。


    对于所有这些内容，我们将涵盖以下主题：


    * 理解生成式 AI

    * 探索生成式 AI 的领域

    * 生成式 AI 研究的历史和现状


    在本章结束时，您将熟悉生成式 AI 这一激动的世界、它的应用、背后的研究历史以及现状，这些发展可能已经且目前正在对企业产生颠覆性的影响。


    ## 介绍生成式 AI


    AI 近年来一直取得了显著进展，其中增长相当大的领域之一就是生成式 AI。生成式 AI 是 AI 和 DL 的子领域，侧重于使用 ML 技术在现有数据上训练的算法和模型来生成新内容，如图像、文本、音乐和视频。


    为了更好地理解 AI、ML、DL 和生成式 AI 之间的关系，请将 AI 视为基础，而 ML、DL 和生成式 AI 代表了日益专业和专注的研究与应用领域：


    * AI 代表创建可以执行任务的系统的广泛领域，展示出人类的智能和能力，并能够与生态系统交互。

    * ML 是一个分支，专注于创建算法和模型，使这些系统能够随着时间和训练而进行自我学习和改进。ML 模型从现有数据中学习，并随着增长自动更新其参数。

    * DL 是 ML 的一个子分支，因为它包含了深度 ML 模型。这些深度模型被称为`神经网络`，特别适用于`计算机视觉`或自然语言处理（`NLP`）等领域。当我们谈论
    ML 和 DL 模型时，通常指的是判别式模型，其目标是在数据之上进行预测或推断模式。

    * 最后，我们得到了生成式 AI，它是 DL 的进一步子分支，它不使用深度人工神经网络对现有数据进行聚类、分类或预测：它使用那些强大的人工神经网络模型来生成全新的内容，从图像到自然语言，从音乐到视频。


    接下来的图表显示了这些研究领域之间的相互关系：


    ![图 1.1 – AI、ML、DL 和生成式 AI 的关系](img/file1.jpg)


    图 1.1 – AI、ML、DL 和生成式 AI 的关系


    生成式 AI 模型可以在海量数据上进行训练，然后它们可以根据数据中的模式生成新的示例。这种生成过程与判别式模型不同，后者的目标是预测给定示例的类别或标签。


    具有生成式 AI 特性的神经网络类型被称为大基础模型（LFMs），对于 `ChatGPT` 这样的语言模型，我们称之为`大语言模型`（LLMs）。


    > 大语言模型是一种以 Transformer 架构为特征的人工神经网络。它们的特点是具有海量的参数（以万亿计），并已在数十亿词汇上进行过训练。给定训练集，LLMs
    能够理解并生成自然语言。


    尽管文本理解和生成可能是生成式 AI 最突出的特征之一，但该领域涵盖了许多领域。


    ### 生成式 AI 的领域


    近年来，生成式 AI 取得了显著进展，并将其应用扩展到广泛的领域，如艺术、音乐、时尚、建筑等。在某些领域中，它确实改变了我们创造、设计和理解周围世界的方式。在其他领域，它正在改进并使现有的流程和操作更加高效。


    生成式 AI 被应用于许多领域这一事实意味着它的模型可以处理不同类型的数据，从自然语言到音频或图像。让我们了解生成式 AI 如何处理不同类型的数据和领域。


    ### 文本生成


    生成式 AI 的最大应用之一（也是我们在书中涵盖最多的部分）是它在自然语言中产生新内容的能力。事实上，生成式 AI 算法可以用于生成新的文本，如文章、诗歌和产品描述。


