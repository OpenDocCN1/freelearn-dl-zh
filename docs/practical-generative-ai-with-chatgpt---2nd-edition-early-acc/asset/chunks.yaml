    The first method is embedded in the way the model is designed, and it involves
    providing your model with the context in the **few-learning** **approach** (we
    will focus on this technique later on in the book). Namely, you could ask the
    model to generate an article whose template and lexicon recall another one you
    have already written. For this, you can provide the model with your query of generating
    an article *and* the former article as a reference or context, so that the model
    is better prepared for your request.


    Here is an example of it:


    ![Figure 2.11 – An example of a conversation within the OpenAI Playground with
    the few-shot learning approach](media/file31.png)


    Figure 2.11 – An example of a conversation within the OpenAI Playground with the
    few-shot learning approach'
