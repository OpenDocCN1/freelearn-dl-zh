    ## Functions


    Functions is yet another definition for the concept of tools or plug-ins introduced
    in Chapter 1. With functions, we provide the model with an extra skill that it
    can invoke to accomplish user’s task. A function will always have a description
    in natural language, so that the model knows when to invoke it.


    The preceding definitions will be pivotal in understanding how to use Azure OpenAI
    model families and how to configure their parameters.


    In the Playground, there are four main sections to interact with the models:


    ### Chat

    Here you can test all the chat models available today, including both text-only
    models (like the `GPT-3.5`) or multimodal models (like the `GPT-4o`). You can
    provide a system message – that is the set of instructions that you provide your
    model with, all in natural language. You can also compare the output of two different
    models, given the same user’s question. The following is an example on how to
    do that:


    ![Figure 2.5 – An example of comparison between two models.](media/file27.png)


    Figure 2.5 – An example of comparison between two models.


    For each model, you can also play with some parameters that you can configure.
    Here is a list:


    *   **Temperature** (ranging from 0 to 1): This controls the randomness of the
    model’s response. A low-level temperature makes your model more deterministic,
    meaning that it will tend to give the same output to the same question. For example,
    if I ask my model multiple times *What is OpenAI?* with temperature set as 0,
    it will always give the same answer. On the other hand, if I do the same with
    a model with temperature set as 1, it will try to modify its answers each time,
    in terms of wording and style.

    *   **Max tokens**: This controls the length (in terms of tokens) of the model’s
    response to the user’s prompt.

    *   **Stop sequences** (user input): This makes responses end at the desired point,
    such as the end of a sentence or list.

    *   **Top probabilities** (ranging from 0 to 1): This controls which tokens the
    model will consider when generating a response. Setting this to 0.9 will consider
    the top 90% most likely of all possible tokens. One could ask *Why not set top
    probabilities as 1 so that all the most likely tokens are chosen?* The answer
    is that users might still want to maintain variety when the model has low confidence,
    even in the highest-scoring tokens.

    *   **Frequency penalty** (ranging from 0 to 1): This controls the repetition
    of the same tokens in the generated response. The higher the penalty, the lower
    the probability of seeing the same tokens more than once in the same response.
    The penalty reduces the chance proportionally, based on how often a token has
    appeared in the text so far (this is the key difference from the following parameter).

    *   **Presence penalty** (ranging from 0 to 2): This is similar to the previous
    one but stricter. It reduces the chance of repeating any token that has appeared
    in the text at all so far. As it is stricter than the frequency penalty, the presence
    penalty also increases the likelihood of introducing new topics in a response.


    Besides trying OpenAI models in the Playground, you can always call the models
    API in your custom code and embed models into your applications. Indeed, in the
    right corner of the Playground, you can click on `View code` and export the configuration
    as shown here:


    ### Assistants

    OpenAI Assistants can be seen as a way to develop AI Agents (introduced in Chapter
    1) faster and more easily. In fact, Assistants can be defined as entities powered
    by an LLM, with a set of instructions to follows and a set of tools or plug-ins
    to use – basically the same definition of AI Agents!


    In the case of OpenAI assistants, they come with three pre-built tools:


    *   **File Search**: it allows the user to upload custom documents so that the
    Assistant can navigate through it to accomplish the query. It operates with a
    RAG-based framework.

    *   **Function Calling**: it allows the user to define a set of custom functions
    that can be invoked by the Assistant to accomplish a given task.

    *   **Code Interpreter**: it refers to the capability of the Assistant to run
    code either against provided documents (for example, in case of spreadsheets or
    analytical papers that required mathematical computations) or simply to solve
    complex tasks provided by the user (for example, complex mathematical problems).


    In the following picture, you can see an example of an Assistant called “Chat
    with PDF”, which is specialized in responding upon provided documents (in my case,
    I uploaded the paper “LLaMA: Open and Efficient Foundation Language Models” by
    Hugo Touvron et al.


    ![Figure 2.8 – Example of an OpenAI Assistant.](media/file28.png)


    Figure 2.8 – Example of an OpenAI Assistant.


    As you can see from the preceding screenshot, the Assistant was able to answer
    my question retrieving knowledge from the provided document. In fact, my question
    was pretty vague, since the term “toxicity” can refer to multiple domains; nevertheless,
    the Assistant knows to watch over the provided documents as primary source of
    information.


    ### Completions

    This section refers to a class of models called “base models”, like the `GPT-3`,
    they are the basis from where the so called “assistant models” (or chat models,
    as we saw previously) are built. For example, the chat model `GPT-3.5-turbo` (the
    model behind ChatGPT), is a fine-tuned version of the base model `GPT-3`.


    > Completions (base) models are designed for generating single responses to prompts,
    making them suitable for tasks like text generation and summarization without
    maintaining context over multiple interactions. Chat (assistant) models, on the
    other hand, are optimized for interactive conversations, capable of maintaining
    context across multiple turns, and are ideal for applications like chatbots and
    virtual assistants.


    Below you can see an example of a typical completion task in the Playground:


    ![Figure 1: Example of completion task in Playground](media/file29.png)


    Figure 1: Example of completion task in Playground


    As you can see, upon my words “Today I went to a grocery store and”, the model
    completed the sentence with the most likely words. Today, completion models are
    rarely used as they are outperformed by chat models, yet they can be further fine-tuned
    to tailored use cases (we will cover fine-tuning later on).


    *   **Text to speech**: In addition to `Whisper`, the aforementioned speech-to-text
    model, OpenAI also released its `TTS` (text-to-speech) model that can be tested
    directly in the Playground.


    Let’s see an example:


    ![Figure 2: Example of using OpenAI’s TTS models in the Playground](media/file30.png)


    Figure 2: Example of using OpenAI’s TTS models in the Playground


    As you can see from the above picture, you can select the voice, model, speed
    and format of the generated audio.


    All the previous models come as pre-built, in the sense that they have already
    been pre-trained on a huge knowledge base.


    However, there are some ways you can make your model more customized and tailored
    for your use case.


    The first method is embedded in the way the model is designed, and it involves
    providing your model with the context in the **few-learning approach** (we will
    focus on this technique later on the book). Namely, you could ask the model to
    generate an article whose template and lexicon recall another one you have already
    written. For this, you can provide the model with your query of generating an
    article *and* the former article as a reference or context, so that the model
    is better prepared for your request.


    Here is an example of it:


    ![Figure 2.11 – An example of a conversation within the OpenAI Playground with
    the few-shot learning approach](media/file31.png)


    Figure 2.11 – An example of a conversation within the OpenAI Playground with the
    few-shot learning approach

    '
