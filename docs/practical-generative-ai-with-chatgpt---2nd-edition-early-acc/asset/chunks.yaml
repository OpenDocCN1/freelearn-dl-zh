- fmt: "\nIn this chapter, we will explore the first approach, while we will see how\
    \ to incorporate OpenAI models’ APIs in Chapter 11.\n\nBefore jumping into the\
    \ Playground, let’s first have an overview of OpenAI’s models families.\n\n###\
    \ OpenAI Models Families\n\nOver the last years, OpenAI made huge advancements\
    \ in the field of model developments, releasing newer models’ versions at insane\
    \ speed. In this section, we will see the main models divided by domain.\n\n-\
    \ **Language Models** \U0001F86A OpenAI's GPTs are advanced language models designed\
    \ to generate human-like text based on given prompts. They are versatile and can\
    \ be used for various natural language processing tasks such as text completion,\
    \ translation, summarization, and coding. This is the field where OpenAI demonstrates\
    \ outstanding performance thanks to its flagship models family: the GPTs. Since\
    \ November 2022, when ChatGPT was launched, OpenAI released:\n    - `GPT-3.5-turbo`,\
    \ the model behind the first version of ChatGPT\n    - `GPT-4` (first multimodal\
    \ model) and `GPT-4-turbo` (optimized for chats and assistants)\n    - `GPT-4o`,\
    \ the most advanced multimodal model\n    - `GPT-4o mini`, the smaller version\
    \ of the `GPT-4o` which is faster and cheaper.\n\nIn addition to those latest\
    \ models, users can access a set of so called “GPT base models”, like the `Babbage-002`\
    \ or `davinci-002` (the `GPT-2`), that represents the legacy completions APIs\
    \ (we will cover completions APIs in the next section).\n\n- **Image model** \U0001F86A\
    \ OpenAI's image models, like `DALL-E`, are designed to generate and manipulate\
    \ images from textual descriptions. `DALL-E` models can create highly detailed\
    \ and imaginative visuals, enabling users to produce unique artwork, design concepts,\
    \ and more. For instance, `DALL-E 3` (the latest version of the model) is capable\
    \ of creating intricate and creative images based on complex prompts, pushing\
    \ the boundaries of what AI can do in the field of visual arts. These models are\
    \ particularly useful in creative industries, digital marketing, and any field\
    \ that benefits from high-quality, custom visuals​.\n\n- **Text to speech and\
    \ Speech to text** \U0001F86A In Chapter 1, we already mentioned the Speech-to-text\
    \ (STT) model developed by OpenAI, `Whisper`, that can handle and process audio\
    \ input. In addition to that, OpenAI also developed Text-to-Speech (TTS) models\
    \ that provide high-quality outputs that are both intelligible and expressive,\
    \ making them suitable for a wide range of applications from customer service\
    \ bots to educational tools. Text-to-Speech (TTS) models developed by OpenAI convert\
    \ written text into spoken language, producing realistic and natural-sounding\
    \ audio. These models are essential for creating voice assistants, improving accessibility\
    \ for visually impaired users, and generating automated announcements.\n\n- **Text\
    \ to video** \U0001F86A with the announcement of `SORA`, OpenAI revealed its cutting-edge\
    \ text-to-video model capable of generating realistic and imaginative video scenes\
    \ from text descriptions. By adapting techniques from `DALL-E` and incorporating\
    \ transformers, `SORA` can create high-fidelity videos up to one minute long.\
    \ It excels in maintaining 3D consistency, object permanence, and simulating interactions\
    \ within videos. While still facing challenges like accurately modeling complex\
    \ physics and ensuring temporal coherence, `SORA` holds significant potential\
    \ for creative industries, offering new possibilities in video production and\
    \ storytelling\n\n- **Embeddings** \U0001F86A Embeddings models from OpenAI transform\
    \ text into numerical representations called vectors (or embeddings) that capture\
    \ semantic meaning and are projected in a multi-dimensional vector space.\n\n\
    The mathematical distances between different instances in this space represent\
    \ their similarity in terms of meaning. As an example, imagine the words `queen`,\
    \ `woman`, `king`, and `man`. Ideally, in our multidimensional space, where words\
    \ are vectors, if the representation is correct, we want to achieve the following:\n\
    \n![Figure 2.10 – Example of vectorial equations among words](media/file25.png)\n\
    \nFigure 2.10 – Example of vectorial equations among words\n\nThis means that\
    \ the distance between `woman` and `man` should be equal to the distance between\
    \ `Queen` and `King`.\n\nEmbeddings can be extremely useful in intelligent search\
    \ scenarios. Indeed, by getting the embedding of the user input and the documents\
    \ the user wants to search, it is possible to compute distance metrics (namely,\
    \ `cosine similarity`) between the input and the documents. By doing so, we can\
    \ retrieve the documents that are closer, in mathematical distance terms, to the\
    \ user input.\n\nThe OpenAI’s embedding models `text-embedding-ada-002` and `text-embedding-3-large`\
    \ models offer state-of-the-art performance in tasks such as text similarity,\
    \ text search, and code search by creating dense vector representations of text.\
    \ These embeddings allow for efficient and effective comparison of large text\
    \ datasets, improving search accuracy and relevance.\n\n- **Moderation** \U0001F86A\
    \ OpenAI's moderation models are designed to detect and filter out inappropriate,\
    \ harmful, or unsafe content in text. These models are integral to maintaining\
    \ safe and respectful online environments by identifying potentially offensive\
    \ or harmful language. The latest moderation model, `text-moderation-007`, is\
    \ robust and effective in ensuring content compliance and safety across platforms.\
    \ It helps developers and companies enforce community guidelines and prevent the\
    \ spread of harmful content, thereby promoting safer digital interactions.\n\n\
    Overall, OpenAI has reached more and more coverage over the last years, addressing\
    \ diverse areas of Generative AI with state-of-the-art models.\n\n### Trying OpenAI\
    \ models in the Playground\n\nTo access your OpenAI playground, you need to create\
    \ an OpenAI account and navigate through [https://platform.openai.com/playground](https://platform.openai.com/playground).\
    \ This is how the landing page looks like:\n\n![Figure 2.4 – OpenAI Playground\
    \ at https://platform.openai.com/playground](media/file26.png)\n\nFigure 2.4 –\
    \ OpenAI Playground at https://platform.openai.com/playground\n\nAs you can see\
    \ from Figure 2.4, the Playground offers a UI where the user can start interacting\
    \ with the model, which you can select on the right-hand side of the UI.\n\nBefore\
    \ diving deeper into the main sections of the playground, let’s first define some\
    \ jargon you will see in this chapter:\n\n- **Tokens**: Tokens can be considered\
    \ as word fragments or segments that are used by the API to process input prompts.\
    \ Unlike complete words, tokens may contain trailing spaces or even partial sub-words.\
    \ To better understand the concept of tokens in terms of length, there are some\
    \ general guidelines to keep in mind. For instance, one token in English is approximately\
    \ equivalent to four characters, or three-quarters of a word.\n\n- **Prompt**:\
    \ In the context of **natural** **language** **processing** (NLP) and ML, a prompt\
    \ refers to a piece of text that is given as input to an AI language model to\
    \ generate a response or output. The prompt can be a question, a statement, or\
    \ a sentence, and it is used to provide context and direction to the language\
    \ model.\n\n- **Context**: In the field of GPT, context refers to the words and\
    \ sentences that come before the user’s prompt. This context is used by the language\
    \ model to generate the most probable next word or phrase, based on the patterns\
    \ and relationships found in the training data.\n\n- **Model confidence**: Model\
    \ confidence refers to the level of certainty or probability that an AI model\
    \ assigns to a particular prediction or output. In the context of NLP, model confidence\
    \ is often used to indicate how confident the AI model is in the correctness or\
    \ relevance of its generated response to a given input prompt.\n"
