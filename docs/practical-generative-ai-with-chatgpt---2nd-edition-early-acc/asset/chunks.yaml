  trans: "\n\n![](img/file149.png)![图 3: 如何从 ActionsGPT 获取支持的示例](img/file150.png)\n\
    \n图 3：如何从 ActionsGPT 获取支持的示例\n\n通过这种方式，你将被引导至你的 GPT 聊天界面：\n\n![图 4: ActionsGPT\
    \ 的落地页。](img/file151.png)\n\n图 4：ActionsGPT 的落地页。\n\n看到我们正在见证“GPT 内部 GPT”的方法，这种感觉很神奇，你不觉得吗？\n\
    \n除了标准配置页外，还有另一种更具“对话性”的构建 GPT 的选项。事实上，你可以切换到 `Create`（创建）标签页，并用自然语言解释你想让 GPT\
    \ 实现什么目标：\n\n![图 5: 从自然语言对话开始创建 GPT 的示例](img/file152.png)\n\n图 5：从自然语言对话开始创建 GPT\
    \ 的示例。\n\n我们将在本章的后续章节中看到这两种方法——标准配置和对话式配置。\n\n既然我们已经知道了什么是 GPT，让我们来看看如何创建一个。在接下来的几个章节中，我们将创建\
    \ 5 个不同的 GPT：\n\n*   前四个将专注于我们已经用通用 ChatGPT 涵盖的四个领域——个人生产力、代码开发、营销和研究。其意图是比较特定领域\
    \ GPT 与通用 ChatGPT 的整体效率和准确性。\n*   第五个将涵盖一个新领域，与艺术创作相关。我们将利用内置的 `DALL-E` 插件以及由设计公司开发的其他插件（如\
    \ `Canvas`）。\n\n让我们从通过专门的 GPT 提升个人生产力开始。\n\n## 个人助手\n\n在这种场景下，我们将构建一个 GPT 来增强我们的健身训练。为此，我们将利用内置插件。此外，我们还将添加一些相关文档，以便助手基于特定的知识库。\n\
    \n我的目标是拥有一个助手，它可以根据我的健身目标、可用时间、性别、年龄、偏好等为我制定训练计划。我还希望助手能对其建议背后的原因提供清晰的解释。\n\n\
    为了实现这一切，我想确保我的助手能够：\n\n*   向我提问设计我我最佳训练所需的特定问题\n*   提供与其回复相关的相关信息和来源\n*   考虑我的反馈，但如果它认为对我是正确的，它将能够坚持自己的观点\n\
    *   如果我的请求不合理或对健康有风险，则不满足我的请求\n\n让我们按照上一节提到的所有配置步骤来看如何创建我们的 GPT：\n\n1.  **Name\
    \ (名称)**：我将我的助手命名为 `WorkoutGPT`。\n2.  **Description (描述)**：这是我设置的描述：“帮助用户根据需求设计训练计划的健身助手。”\n\
    3.  **Instructions (指令)**：这里是我们 GPT 的真正核心。这是我提供 GPT 的指令集：\n\n*“你是一个健身 AI 助手，根据用户的需求帮助他们创建训练计划。*\n\
    \n*在生成计划之前，请确保询问以下问题：*\n\n*- 健身目标和时间预期*\n\n*- 年龄和性别*\n\n*- 健身水平*\n\n*- 训练的可用时间*\n\
    \n*- 为了制定合理的训练计划所需的其他所有元素（例如设备、潜在受伤情况……）*\n\n*如有需要，使用提供的文档来丰富你的回答。*\n\n*如果用户建议了某些不符合其目标，请坚持你的假设，并礼貌地解释背后的原因。*\n\
    \n*如果用户询问了可能对其健康产生风险的问题，请礼貌地建议放轻松并提供替代方案，同时解释背后的原因。”*\n\n1.  **Conversation Starters\
    \ (对话启动器)**：在这里我设置了三个不同训练示例：\n\n    *   我想在 6 个月后参加马拉松。\n    *   生成一个 30 分钟的无设备\
    \ HIIT 训练计划。\n    *   生成一个仅需哑铃的 45 分钟举重训练计划。\n2.  **Knowledge (知识)**：在这里我上传了标准的国家力量与调节协会\
    \ (`NSCA`) 训练负荷表，这是一个帮助运动员和教练确定不同练习和训练课程适当负荷的工具。它看起来像：\n\n![图 6: NSCA 训练负荷表。来源：https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf](img/file153.png)\n\
    \n图 6：NSCA 训练负荷表。来源：https://www.nsca.com/contentassets/61d813865e264c6e852cadfe247eae52/nsca_training_load_chart.pdf\n\
    \n我几乎忘记了一个关键步骤——插图！这看起来可能很表面，但为你的 GPT 设置图标会让它更有吸引力，特别是如果你计划将其发布给所有用户。幸运的是，我们在配置面板中直接集成了\
    \ `DALL-E`：\n\n![图 7: 如何设置你的 GPT 图标的示例](img/file154.png)\n\n图 7：如何设置你的 GPT 图标的示例。\n\
    \n配置看起来是这样的：\n\n![图 8: WorkoutGPT 配置页面](img/file155.png)\n\n图 8：WorkoutGPT 配置页面。\n\
    \n太棒了！现在让我们一些示例对话。\n\n首先，让我们选择关于马拉松的对话启动器：\n\n![图 9: GPT 评估用户整体目标和健身水平的问题示例](img/file156.png)\n\
    \n图 9：GPT 评估用户整体目标和健身水平的问题示例。\n\n正如你所看到的，我们的 `WorkoutGPT` 会立即询问所需的信息。一旦提供了上述信息，我的助手生成了以下计划（此处输出被截断）：\n\
    \n![图 10: 为马拉松训练生成的训练表示例](img/file157.png)\n\n图 10：为马拉松训练生成的训练表示例。\n\n此外，它如下指定了周五的力量训练：\n\
    \n![图 11: GPT 生成的力量训练示例](img/file158.png)\n\n图 11：GPT 生成的力量训练示例。\n\n让我们关注力量训练。我想更好地了解如何调整重量。下面的插图显示了回复的第一部分：\n\
    \n![图 12: GPT 解释如何在力量训练中确定重量的示例](img/file159.png)\n\n图 12：GPT 解释如何在力量训练中确定重量的示例。\n\
    \n在同一个回复中，助手还引用了作为知识库提供的 `NSCA` 训练负荷表：\n\n![图 13: GPT 从自定义知识库检索信息的示例](img/file160.png)\n\
    \n图 13：GPT 从自定义知识库检索信息的示例。\n\n现在我想挑战我的 `WorkoutGPT`，请求一些可能对我健康有害的东西。例如，在一个月内在没有任何经验的情况下准备马拉松显然是一个糟糕的主意。一旦我提供了其启动问题的答案列表，让我们看看我的助手对此的看法：\n\
    \n![图 14: 考虑到与请求相关的风险，礼婉地引导用户改变目标和预期的示例](img/file161.png)\n\n图 14：考虑到与请求相关的风险，礼婉地引导用户改变目标和预期的示例。\n\
    \n正如你所看到的，我们的 `WorkoutGPT` 正在引导我们改变比赛方法。虽然它仍然为我们提供为期 3 周的跑步训练计划（此处输出被截断），但其目标不是在\
    \ 3 小时 15 分钟内完赛马拉松，而是增强耐力和力量。\n\n注意，如果我们向通用 ChatGPT 提问相同的问题，它的回复将如下：\n\n"
- fmt: "\n![Figure 15: Example of ChatGPT accomplishing user’s task despite the associated\
    \ risk.](media/file162.png)\n\nFigure 15: Example of ChatGPT accomplishing user’s\
    \ task despite the associated risk.\n\nNote how ChatGPT, despite being vocal in\
    \ disclosing its concerns, it's still accommodating my request, providing me with\
    \ a plan to run a full marathon. This could encourage me – a reckless beginner\
    \ who thinks that running a marathon is a joke – to dive into this dumb adventure,\
    \ with serious consequences for me health.\n\nOverall, GPTs allow you to be extremely\
    \ specific about how your assistant should behave and what it should avoid saying\
    \ or accommodate.\n\n# Code Assistant\n\nIn this section, I want to develop an\
    \ assistant that is tailored towards data science projects. More specifically,\
    \ I want my assistant to be able to:\n\n* Provide clear guidance on how to set\
    \ up a data science experiment, given the user’s task\n* Generate the `Python`\
    \ code needed to run the experiment\n* Leverage the `code interpreter` capabilities\
    \ to run and check the code\n* Push the final code to the `GitHub` repository.\n\
    \nLet’s see how to do that step by step.\n\n### 1. Setting the instructions\n\n\
    This `GPT` is a data science assistant that helps users set up and run data science\
    \ experiments. It provides clear guidance on how to define and organize tasks,\
    \ generate `Python` code needed for the experiments, and leverages `code interpreter`\
    \ capabilities to run and check the code. The `GPT` will take the user's input\
    \ and provide step-by-step instructions to structure the experiment, create the\
    \ necessary scripts, and execute the code.\n\nThe `GPT` will execute the code\
    \ to see whether it works. Once the final code is accepted by the user, it can\
    \ be pushed to the `GitHub` repo as a `.ipynb` file.\n\n### 2. Setting the (optional)\
    \ conversation starters\n\n* *How do I set up a classification experiment?*\n\
    * *Generate `Python` code for a random forest model.*\n* *Can you help me preprocess\
    \ this dataset?*\n* *Run this code and check for errors.*\n\n### 3. Enabling the\
    \ Code Interpreter & Data Analysis plugin\n\n![Figure 16: Enabling the code Interpreter\
    \ & Data analysis plugin.](media/file163.png)\n\nFigure 16: Enabling the code\
    \ Interpreter & Data analysis plugin.\n\n### 4. Creating an Action to communicate\
    \ with GitHub\n\nTo do so, we need to click on “Create new action” and define\
    \ the required `Schema`.\n\n> To set the schema of a `ChatGPT` action using an\
    \ `OpenAPI 3.1.0` specification, you define the structure of the data (requests\
    \ and responses) that the action will handle. This involves specifying the `schema`\
    \ property under content in your API `paths`. The schema outlines the expected\
    \ data types, required fields, and possible values for your request and response\
    \ bodies.\n\n#### Steps to Define a Schema\n\n1. **Identify the Data Structure**:\
    \ Determine the type of data the action will handle (e.g., `JSON` objects, arrays).\n\
    2. **Define Properties**: Under the `schema`, specify the properties, their types,\
    \ and any constraints. For example, if the action requires a username and an email,\
    \ you'd define these under `properties`.\n3. **Set Required Fields**: Use the\
    \ `required` array to specify which fields must be provided.\n4. **Apply to Paths**:\
    \ Place the `schema` under the appropriate HTTP method in your `paths` (e.g.,\
    \ `POST`, `GET`).\n\nLet’s consider the following example:\n\n```\nopenapi: 3.1.0\n\
    info:\n  title: ChatGPT Action API\n  version: 1.0.0\npaths:\n  /perform-action:\n\
    \    post:\n      operationId: performAction\n      summary: Perform a specific\
    \ action with given inputs.\n      requestBody:\n        required: true\n    \
    \    content:\n          application/json:\n            schema:\n            \
    \  type: object\n              properties:\n                action:\n        \
    \          type: string\n                  description: The action to perform\n\
    \                parameters:\n                  type: object\n               \
    \   description: Parameters for the action\n                  properties:\n  \
    \                  userId:\n                      type: string\n             \
    \       content:\n                      type: string\n              required:\n\
    \                - action\n                - parameters\n      responses:\n  \
    \      '200':\n          description: Successful action response\n          content:\n\
    \            application/json:\n              schema:\n                type: object\n\
    \                properties:\n                  success:\n                   \
    \ type: boolean\n                  message:\n                    type: string\n\
    ```\n\nIn this example, the `requestBody` for the `POST` method defines a `schema`\
    \ with `action` and `parameters` as required fields. The response is also defined,\
    \ specifying the structure of the data returned after the action is performed.\n\
    \nThis is how the schema looks like:\n\n![Figure 17: Configuration of the GitHub\
    \ Action schema.](media/file164.png)\n\nFigure 17: Configuration of the GitHub\
    \ Action schema.\n\nThis is the full schema I used:\n\n```\nopenapi: 3.1.0\ninfo:\n\
    \  title: GitHub API\n  description: API for interacting with GitHub, including\
    \ pushing code to a repository.\n  version: 1.0.0\nservers:\n  - url: https://api.github.com\n\
    \    description: GitHub API server\npaths:\n  /repos/{owner}/{repository}/contents/{path}:\n\
    \    put:\n      operationId: updateFileContents\n      summary: Create or update\
    \ a file in a GitHub repository\n      description: Use this endpoint to create\
    \ a new file or update an existing file in a repository.\n      parameters:\n\
    \        - name: owner\n          in: path\n          required: true\n       \
    \   description: The owner of the repository.\n          schema:\n           \
    \ type: string\n        - name: repo\n          in: path\n          required:\
    \ true\n          description: The name of the repository.\n          schema:\n\
    \            type: string\n        - name: path\n          in: path\n        \
    \  required: true\n          description: The file path in the repository.\n \
    \         schema:\n            type: string\n      requestBody:\n        required:\
    \ true\n        content:\n          application/json:\n            schema:\n \
    \             type: object\n              properties:\n                message:\n\
    \                  type: string\n                  description: Commit message\
    \ for the file.\n                content:\n                  type: string\n  \
    \                description: The new file content, Base64 encoded.\n        \
    \        sha:\n                  type: string\n                  description:\
    \ SHA of the file being replaced, if updating.\n                branch:\n    \
    \              type: string\n                  description: The branch where the\
    \ file should be created or updated.\n                committer:\n           \
    \       type: object\n                  properties:\n                    name:\n\
    \                      type: string\n                    email:\n            \
    \          type: string\n              required:\n                - message\n\
    \                - content\n      responses:\n        '200':\n          description:\
    \ Successful file update or creation.\n        '201':\n          description:\
    \ Successful file creation.\n        '422':\n          description: Validation\
    \ failed or the file already exists.\n      security:\n        - bearerAuth: []\n\
    components:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme:\
    \ bearer\n      bearerFormat: token\n  schemas:  # This subsection contains schema\
    \ definitions (if needed).\n    ExampleSchema:  # Example object schema\n    \
    \  type: object\n      properties:\n        exampleProperty:\n          type:\
    \ string\n```\n\nTo allow the Action to communicate with my repo, I created an\
    \ access token in my GitHub profile under Settings>Developer Settings>Personal\
    \ access token.\n\nYou can then test the connection as follows:\n\n![Figure 18:\
    \ Example of testing the action.](media/file165.png)\n\nFigure 18: Example of\
    \ testing the action.\n\nLet’s now navigate through the Repo and see whether it\
    \ worked:\n\n![Figure 19: Example of file uploaded via the GPT Action.](media/file166.png)\n\
    \nFigure 19: Example of file uploaded via the GPT Action.\n"
