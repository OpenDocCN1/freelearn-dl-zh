  trans: "\n\n太棒了！如你所见，我们现在有一个包含预定义内容的新文件。\n\n现在让我们创建并测试它：\n\n*   让我们先从一个关于如何设置分类实验的简单问题开始（截断输出）：\n\
    \n    ![图 20：DataScience Assistant 提供如何处理分类问题的指导示例。](img/file167.png)\n\n    图\
    \ 20：DataScience Assistant 提供如何处理分类问题的指导示例。\n\n*   按照这些指令，我们现在准备好设置我们的实验了。我们想要处理著名的泰坦尼号乘客生还预测问题。我们将上传数据集（你可以在网上找到很多免费版本，我在\
    \ [`github.com/datasciencedojo/datasets/blob/master/titanic.csv`](https://github.com/datasciencedojo/datasets/blob/master/titanic.csv)\
    \ 下载了我的数据），并利用 `Logistic Regression` 模型。\n\n    > 泰坦尼号生还预测任务是数据科学和机器学习中的一个经典问题。其目标是根据年龄、性别、客舱等级、票价等各种特征，预测泰坦尼号上的乘客是否会存活。这项通常用于教学分类技术，即在标记的数据集上训练模型，然后用于预测新数据的结果。挑战在于选择相关特征、处理缺失数据以及选择合适的机器学习算法以实现准确的预测。\n\
    \n*   这是我的查询：\n\n![图 21：DataScience Assistant 设计泰坦尼号生还实验的示例。](img/file168.png)\n\
    \n图 21：DataScience Assistant 设计泰坦尼号生还实验的示例。\n\n现在我将分享模型对每个步骤响应的某些截图：\n\n1.  加载数据：\n\
    \n    ![图 22：DataScience Assistant 执行实验第一步的示例。](img/file169.png)\n\n    图 22：DataScience\
    \ Assistant 执行实验第一步的示例。\n\n2.  探索并清洗数据：\n\n![图 23：DataScience Assistant 探索和清洗数据的示例。](img/file170.png)\n\
    \n图 23：DataScience Assistant 探索和清洗数据的示例。\n\n注意，当你看到符号 `[>_]` 时，意味着触发了代码解释器插件（code\
    \ interpreter）。你可以点击它查看执行的代码：\n\n![图 24：DataScience Assistant 利用代码解释器插件生成的代码示例。](img/file171.png)\n\
    \n图 24：DataScience Assistant 利用代码解释器插件生成的代码示例。\n\n1.  特征工程：\n\n    ![图 25：DataScience\
    \ Assistant 进行特征工程的示例。](img/file172.png)\n\n    图 25：DataScience Assistant 进行特征工程的示例。\n\
    \n2.  数据划分：\n\n    ![图 26：DataScience Assistant 将数据集划分为训练集和测试集的示例。](img/file173.png)\n\
    \n    图 26：DataScience Assistant 将数据集划分为训练集和测试集的示例。\n\n3.  训练模型：\n\n    ![图 27：DataScience\
    \ Assistant 训练 Logistic Regression 模型示例。](img/file174.png)\n\n    图 27：DataScience\
    \ Assistant 训练 Logistic Regression 模型示例。\n\n4.  评估模型：\n\n![图 28：DataScience Assistant\
    \ 评估模型输出的示例。](img/file175.png)\n\n图 28：DataScience Assistant 评估模型输出的示例。\n\n这太酷了！它非常准确并且可以节省大量时间。此外，如果你考虑到在大型企业中处理许多项目的数据科学家，拥有一个类似的助手也有助于在项目之间遵循固定标准，从而使跨团队的维护保持一致。\n\
    \n我们要求 GPT 执行的最后一件事是将代码推送到我们的仓库（Repo）。让我们看看它是如何工作的：\n\n![图 29：DataScience Assistant\
    \ 利用 Action 将代码推送到 GitHub 的示例。](img/file176.png)\n\n图 29：DataScience Assistant\
    \ 利用 Action 将代码推送到 GitHub 的示例。\n\n如果我们点击该链接，就可以看到文件已成功上传：\n\n![图 30：通过 DataScience\
    \ Assistant Action 上传的文件。](img/file177.png)\n\n图 30：通过 DataScience Assistant Action\
    \ 上传的文件。\n\n它成功了！再次，这是 GPTs 如何提高开发人员和数据科学家效率的示例。通过遵循通用框架设计数据科学实验并启用无需切换到 GitHub\
    \ 即可推送的工作流，可以节省以前的时间，让数据科学家能够专注于项目的核心方面。\n\n## 营销助手\n\n正如我们在第 6 章——“使用 ChatGPT\
    \ 精通营销”中所看到的，AI 助手在这一领域具有极高的价值。事实上，生成文本内容——如社交媒体帖子、博客文章或营销活动——可能是这些模型表现最佳的活动。\n\
    \n> 文案撰稿人员是专长撰写有说服力且吸引人的内容的专业，通常用于营销和广告目的。他们的工作通常包括编写促销材料，如广告、折页、网站、电子邮件、社交媒体帖子以及其他形式的内容，旨在说服观众采取特定行动，例如购买或订阅服务。\n\
    \n在本节中，我们将创建一个为此类活动定制的文案写作助手。为此，我将我的助手命名为 `Copywrite Companion`，并设置了以下配置组件：\n\n\
    *   指令（Instructions）：\n\n    `Copywrite Companion 是一个多功能助手，旨在帮助用户完成各种写作任务。它擅长根据用户输入生成产品表（包括文本和图像）、策划用于通讯或营销目的邮件活动、为新产品创建吸引人的视觉效果，以及为不同平台编写社交媒体帖子。它确保内容具有说服力、吸引力并符合目标受众，有效推广产品或服务。助手会根据需求调整风格，并在所有输出中追求创意、清晰和相关性。它以轻松、友好的语气进行交流，让互动感到亲切自然。`\n\
    \n*   对话启动词（Conversation starters）：\n\n    `你能为我的新产品写描述吗？`\n\n    `我需要为关于登山的文章起一个引人的标题`\n\
    \n    `给我几个关于跑步的博客文章的想法`\n\n*   能力（Capabilities）：\n\n![图 31：Copywrite Companion\
    \ 开启的插件。](img/file178.png)\n\n图 31：Copywrite Companion 开启的插件。\n\n让我们来看看实际效果：\n\
    \n*   我首先让它根据提供的图片编写一份产品表（输出截断）：\n\n    ![图 32：Copywrite Companion 生成产品描述的示例。](img/file179.png)\n\
    \n    图 32：Copywrite Companion 生成产品描述的示例。\n\n*   作为文案，我们可能想将这些信息插入到更有结构的存储库中，例如\
    \ Excel 文件。让我们要求助手这样做，利用它的代码解释器插件：\n\n    ![图 33：Copywrite Companion 利用代码解释器插件将之前的响应转换为\
    \ 文件的示例。](img/file180.png)\n\n    图 33：Copywrite Companion 利用代码解释器插件将之前的响应转换为\
    \ 文件的示例。\n\n*   这就是最终结果：\n\n![图 34：Copywrite Companion 生成的文件。](img/file181.png)\n\
    \n图 34：Copywrite Companion 生成的文件。\n\n现在让我们让助手为我们的鞋子生成一条 Instagram 帖子：\n\n"
- fmt: "\nAs you can see, the assistant also proposed an image description to leverage\
    \ the `DALL-E` plugin. Since the description makes sense to me, I’ll go ahead\
    \ and ask it to generate it:\n\n![Figure 36 Example of Copywrite Companion generating\
    \ an image leveraging the DALL-E plugin.](media/file183.png)\nFigure 36 Example\
    \ of Copywrite Companion generating an image leveraging the DALL-E plugin.\n\n\
    Finally, I want to have an idea of how big competitor brands – like `Nike` and\
    \ `Adidas` – are doing their marketing activities. To do so, I’ll ask my assistant\
    \ to gather some evidence from the web:\n\n![Figure 37: Example of Copywrite Companion\
    \ doing a competitive analysis leveraging the web browsing plugin.](media/file184.png)\n\
    Figure 37: Example of Copywrite Companion doing a competitive analysis leveraging\
    \ the web browsing plugin.\n\nAs you can see, our companion correctly leveraged\
    \ the web browsing plugin to retrieve the required information. Plus, it gave\
    \ us powerful insight into which leverages the two competitor companies are investing,\
    \ so that we might think (or ask our companion) about unique differentiators that\
    \ could let our brand outstand in a competitive market.\n\nWe could also do a\
    \ step ahead and ask for more specific insights about the competition by leveraging\
    \ the code interpreter and data analysis plugin. Let’s say, for example, that\
    \ we gathered an excel sheet with the following structure:\n\n![Figure 38: Competitive\
    \ analysis on an Excel sheet](media/file185.png)\nFigure 38: Competitive analysis\
    \ on an Excel sheet\n\nAnd now we want to generate some visuals out of it. Let’s\
    \ ask our `Copywriter Companion` to do so:\n\n![Figure 39: Example of bar chart\
    \ and scatter plot generated by Copywrite companion.](media/file186.png)\nFigure\
    \ 39: Example of bar chart and scatter plot generated by Copywrite companion.\n\
    \n![Figure 40: Example of line chart generated by Copywrite companion.](media/file187.png)\n\
    Figure 40: Example of line chart generated by Copywrite companion.\n\nIncluding,\
    \ as requested, the executive report:\n\n![Figure 41: Example of an Executive\
    \ report generated by Copywrite companion.](media/file188.png)\nFigure 41: Example\
    \ of an Executive report generated by Copywrite companion.\n\nOverall, tailoring\
    \ ChatGPT for marketing activities can be extremely useful when it comes to generating\
    \ new content, designing marketing strategies and doing competitive analysis on\
    \ the web.\n\n## Research Assistant\n\nIn this scenario, we are going focus on\
    \ research once more, yet this time with a particular focus on papers retrieval.\
    \ More specifically, we want our assistant to be able to do the following:\n\n\
    *   Retrieving information from custom knowledge base that we provide\n*   Integrating\
    \ the custom documents with papers only from `Arxiv`, enabling the web plugin\
    \ for this task\n*   Retrieving from a `Database` (in our case, it will be hosted\
    \ in `Notion`) existing ongoing work from other researchers, so that we don’t\
    \ risk elaborating an essay which is already covered by someone else.\n\nLet’s\
    \ see all the steps.\n\n1. **Upload custom documents.** For this purpose, I’ll\
    \ use two papers about Image Classification in Machine Learning: “CIFAKE: image\
    \ classification and explainable identification of ai-generated synthetic images”\
    \ from `J. Bird` et al., and “A Comprehensive Study of Vision Transformers in\
    \ Image Classification Tasks” from `Khalis` et al.\n\nYou can upload them in the\
    \ proper section in the configuration pane:\n\n![Figure 42: Uploading custom documents\
    \ in the configuration pane](media/file189.png)\nFigure 42: Uploading custom documents\
    \ in the configuration pane\n\n2. **Integrating custom documents with web references.**\
    \ To do so, we need to enable the web plugin:\n\n![Figure 43: Enabling the web\
    \ browsing plugin in the configuration pane](media/file190.png)\nFigure 43: Enabling\
    \ the web browsing plugin in the configuration pane\n\nPlus, we also need to specify\
    \ the assistant to only navigate through the `Arxiv` archive. We will see how\
    \ to specify that in the set of instructions we will create.\n\n3. **Retrieve\
    \ information from a Notion Database.** Here, the idea is that, as researchers,\
    \ we might come up with ideas that are already being studied and developed by\
    \ other fellow colleagues. Imagine that we keep track of all the ongoing research\
    \ in a `Notion Database` that has the following structure:\n\n![Figure 44: Notion\
    \ Database structure.](media/file191.png)\nFigure 44: Notion Database structure.\n\
    \nTo do so, we need to create a `GPT actions`. To do so, there are two steps to\
    \ follow:\n\n1.  In your `Notion workspace`, you need to create a new connection\
    \ marked as internal, along with a new `Internal Integration Secret` (or `API\
    \ key`) will be created. You can call this connection `chatgpt` or similar.\n\
    2.  In your `GPT configuration pane`, you need to set a new `Action` schema. Since\
    \ in our case we need to query a specific `Database`, the schema will look like\
    \ the following:\n3.  When it comes to authentication, you can click on \"Authentication\"\
    \ and choose \"API Key\". Enter in the information below.\n    *   `API Key`:\
    \ Use `Internal Integration Secret` from your newly created connection in `Notion`\n\
    \    *   `Auth Type`: `Bearer`\n\n![Figure 45: Notion Action Schema.](media/file192.png)\n\
    Figure 45: Notion Action Schema.\n\nThis is how the whole schema looks like:\n\
    \n```\nopenapi: 3.1.0\ninfo:\n  title: Notion API\n  description: API for interacting\
    \ with Notion's pages, databases, and users.\n  version: 1.0.0\nservers:\n  -\
    \ url: https://api.notion.com/v1\n    description: Main Notion API server\npaths:\n\
    \  /databases/{database_id}/query:\n    post:\n      operationId: queryDatabase\n\
    \      summary: Query a database\n      parameters:\n        - name: database_id\n\
    \          in: path\n          required: true\n          schema:\n           \
    \ type: string\n        - name: Notion-Version\n          in: header\n       \
    \   required: true\n          schema:\n            type: string\n          example:\
    \ 2022-06-28\n          constant: 2022-06-28\n      requestBody:\n        required:\
    \ true\n        content:\n          application/json:\n            schema:\n \
    \             type: object\n              properties:\n                filter:\n\
    \                  type: object\n                sorts:\n                  type:\
    \ array\n                  items:\n                    type: object\n        \
    \        start_cursor:\n                  type: string\n                page_size:\n\
    \                  type: integer\n      responses:\n        '200':\n         \
    \ description: Successful response\n          content:\n            application/json:\n\
    \              schema:\n                type: object\n                properties:\n\
    \                  object:\n                    type: string\n               \
    \   results:\n                    type: array\n                    items:\n  \
    \                    type: object\n                  next_cursor:\n          \
    \          type: string\n                  has_more:\n                    type:\
    \ boolean\n```\n\nGreat, now that we have all our ingredients, we need to set\
    \ our system message and, optionally, our conversation starters. In this scenario,\
    \ I set the following instructions:\n\nYou are an AI research assistant tasked\
    \ with helping researchers by leveraging a variety of tools and resources. Your\
    \ primary responsibilities include retrieving, integrating, and cross-referencing\
    \ information from custom knowledge bases, academic papers on Arxiv, and ongoing\
    \ research projects stored in a Notion database. Follow these guidelines to ensure\
    \ your assistance is accurate, comprehensive, and avoids redundancy:\n\n* Always\
    \ answer based on the provided documents\n* If you feel it is needed, extend your\
    \ search on the web. the ONLY ONE SITE you can navigate through is Arxiv.\n* If\
    \ asked by the user, check whether the topic is already covered in the Notion\
    \ DB.\n\nAnd the following conversation starters:\n\n* How do VGGNet, ResNet,\
    \ and Inception differ in accuracy and efficiency for image classification?\n\
    * What challenges do image classification models face, and how do techniques like\
    \ data augmentation and transfer learning help?\n"
