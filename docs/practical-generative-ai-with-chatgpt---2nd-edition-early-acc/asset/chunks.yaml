    # 2 OpenAI 与 ChatGPT：超越市场炒作


    ## 在 Discord 上加入我们的书籍社区


    ![](img/file22.png)


    [`packt.link/EarlyAccess`](https://packt.link/EarlyAccess)


    本章介绍了 OpenAI 及其最著名的开发成果——`ChatGPT`，重点介绍了它的历史、技术和能力。


    总目标是深入了解 `ChatGPT` 如何在各种行业和应用中用于改进通信和自动化流程，最后这些应用将如何影响技术世界及更广泛的领域。


    我们将通过以下主题涵盖所有这些内容：


    * 什么是 OpenAI？

    * OpenAI 模型家族概览

    * 通往 ChatGPT 之路：其背后的模型数学

    * ChatGPT：领先水平


    ## 技术要求


    为了能够测试本章中的示例，你需要以下内容：


    * 一个 OpenAI 账户以访问 `Playground` 和 `Models API` ([`openai.com/api/login20`](https://openai.com/api/login20))

    * 你喜欢的 IDE 环境，例如 `Jupyter` 或 `Visual Studio`

    * 安装了 `Python` 3.7.1+ ([`www.python.org/downloads`](https://www.python.org/downloads))

    * 安装了 `pip` ([`pip.pypa.io/en/stable/installation/`](https://pip.pypa.io/en/stable/installation/))

    * OpenAI Python 库 ([`pypi.org/project/openai/`](https://pypi.org/project/openai/))


    ## 什么是 OpenAI？


    OpenAI 是由 Elon Musk、Sam Altman、Greg Brockman、Ilya Sutskever、Wojciech Zaremba 和
    John Schulman 于 2015 年创立的研究机构。正如 OpenAI 网页上所述，其使命是“确保通用人工智能 (AGI) 造福全人类”。由于其通用性，AGI
    旨在具有学习和执行广泛任务的能力，而无需针对特定任务进行编程。


    自 2015 年以来，OpenAI 将研究重点放在`深度强化学习` (`DRL`)，这是`机器学习` (`ML`) 的子集，结合了`强化学习` (`RL`)
    和深度神经网络。该领域的第一个贡献可以追溯到 2016 年，当时公司发布了 `OpenAI Gym`，这是一个供研究人员开发和测试 `RL` 算法的工具包。


    ![图 2.1 – Gym 文档首页 (https://www.gymlibrary.dev/)](img/file23.jpg)


    图 2.1 – Gym 文档首页 (https://www.gymlibrary.dev/)


    OpenAI 在该领域持续进行研究和贡献，但它最著名的成就与生成式模型——生成式预训练 Transformer (`GPT`) 相关。

