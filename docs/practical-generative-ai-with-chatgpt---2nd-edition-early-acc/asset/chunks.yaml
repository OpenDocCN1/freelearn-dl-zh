- fmt: '

    In the next section, we are going to move forward in exploring how ChatGPT can
    support researchers, focusing on bibliography generation.


    ## Generating and formatting a bibliography


    ChatGPT can support researchers in bibliography generation by providing automated
    citation and reference tools. These tools can generate accurate citations and
    references for a wide range of sources, including books, articles, websites, and
    more. ChatGPT knows various citation styles, such as `APA`, `MLA`, `Chicago`,
    and `Harvard`, allowing researchers to select the appropriate style for their
    work. Additionally, ChatGPT can also suggest relevant sources based on the researcher’s
    input, helping to streamline the research process and ensure that all necessary
    sources are included in the bibliography. By utilizing these tools, researchers
    can save time and ensure that their bibliography is accurate and comprehensive.


    Let’s consider the following example. Let’s say we finalized a research paper
    titled, The Impact of Technology on Workplace Productivity: An Empirical Study.
    During the research and writing process, we collected the following references
    to papers, websites, videos, and other sources that we need to include in the
    bibliography (in order, three research papers, one YouTube video, and one website):


    * `The second machine age: Work, progress, and prosperity in a time a brilliant
    technologies`. Brynjolfsson, 2014. https://psycnet.apa.org/record/2014-07087-000

    * `The Impact of Technostress on Role Stress and Productivity. Tarafdar`, 2014.
    Pages 301-328. https://www.tandfonline.com/doi/abs/10.2753/MIS0742-1222240109

    * `The big debate about the future of work, explained`. Vox. https://www.youtube.com/
    watch?v=TUmyygCMMGA


    Obviously, we cannot have the preceding list in our research paper; we need proper
    formatting for it. To do so, we can provide ChatGPT with the raw list of references
    and ask it to re-generate it with the specific format, for example, `APA` style,
    the official style of the `American Psychological Association` (`APA`), commonly
    used as reference format style in education, psychology, and social sciences.


    Let’s see how ChatGPT works with that:


    ![Figure 8.11 – A list of references generated in APA format by ChatGPT](media/file141.png)


    Figure 8.11 – A list of references generated in APA format by ChatGPT


    Note that I specified not to add details in case ChatGPT doesn’t know them. Indeed,
    I noticed that sometimes ChatGPT was adding the month and day of publication,
    making some mistakes.


    Other interesting assistance ChatGPT can provide is that of suggesting potential
    reference papers we might want to quote. We’ve already seen in the first paragraph
    of this chapter how ChatGPT is able to brainstorm relevant literature before the
    writing process; however, once the paper is done, we might have forgotten to quote
    relevant literature, or even not be aware of having quoted someone else’s work.


    ChatGPT can be a great assistant in brainstorming possible references we might
    have missed. Let’s consider once more our paper, focused on the research question
    “In what ways do social media interactions and online support communities affect
    the mental well-being of individuals with chronic mental health conditions?”.
    Let’s say that we set the following title and abstracts: which has the following
    abstract:


    `Title`: The Impact of Social Media and Online Support Communities on Mental Well-being
    in Individuals with Chronic Mental Health Conditions


    `Abstract`: This study explores the effects of social media interactions and online
    support communities on the mental well-being of individuals with chronic mental
    health conditions. By examining various online platforms, the research aims to
    identify both positive and negative impacts. The study utilizes qualitative and
    quantitative methods, including surveys and interviews, to assess changes in anxiety,
    depression, and overall life satisfaction. Preliminary findings suggest that while
    online support can offer valuable social connections and emotional support, excessive
    use and negative interactions may exacerbate mental health issues.


    Let’s ask ChatGPT to list all the possible references that might be related to
    this kind of research:


    ![Figure 8.12 – List of references related to the provided abstract](media/file142.png)


    Figure 8.12 – List of references related to the provided abstract


    You can repeat this process with other sections of your paper also, to make sure
    you are not missing any relevant references to include in your bibliography.


    Once you have your study ready, you will probably need to present it with an elevator
    pitch. In the next section, we will see how ChatGPT can also support this task.


    ## Generating a presentation of the study


    The last mile of a research study is often that of being presented to various
    audiences. This might involve preparing a slide deck, pitch, or webinar where
    the researcher needs to address different kinds of audiences.


    Let’s say, for example, that our study *The Impact of Social Media and Online
    Support Communities on Mental Well-being in Individuals with Chronic Mental Health
    Conditions* is meant for a master’s degree thesis discussion. In that case, we
    can ask ChatGPT to produce a pitch structure that is meant to last 15 minutes
    and adheres to the scientific method. Let’s see what kind of results are produced
    (as context, I’m referring to the abstract of the previous paragraph):


    ![Figure 8.13 – Thesis discussion generated by ChatGPT](media/file143.png)


    Figure 8.13 – Thesis discussion generated by ChatGPT


    That was impressive! Back in my university days, it would have been useful to
    have such a tool to assist me in my discussion design.


    Starting from this structure, we can also ask ChatGPT to generate a slide deck
    as a visual for our thesis discussion.


    Let’s proceed with this request:


    ![Figure 8.14 – Slide deck structure based on a pitch](media/file144.png)


    Figure 8.14 – Slide deck structure based on a pitch


    Finally, let’s imagine that our thesis discussion was outstanding to the point
    that it might be selected for receiving research funds in order to keep investigating
    the topic. Now we need an elevator pitch to convince the funding committee. Let’s
    ask for some support from ChatGPT:


    ![Figure 8.15 – Elevator pitch for the given thesis](media/file145.png)


    Figure 8.15 – Elevator pitch for the given thesis


    We can always adjust results and make them more aligned to what we are looking
    for, however, having structures and frameworks already available can save a lot
    of time and allows us to focus more on technical content we want to bring.


    Overall, ChatGPT is able to support an end-to-end journey in research, from literature
    collection and review to the generation of the final pitch of the study, and we’ve
    demonstrated how it can be a great AI assistant for researchers.


    Furthermore, note that in the field of research, some tools that are different
    from ChatGPT, yet still powered by GPT models, have been developed recently. An
    example is `Humanata.ai`, an AI-powered tool that allows you to upload your documents
    and perform several actions on them, including summarization, instant Q&A, and
    new paper generation based on uploaded files.


    This suggests how GPT-powered tools (including ChatGPT) are paving the way toward
    several innovations within the research domain.


    ## Summary


    In this chapter, we explored the use of ChatGPT as a valuable tool for researchers.
    Through literature review, experiment design, bibliography generation and formatting,
    and presentation generation, ChatGPT can assist the researcher in speeding up
    those activities with low or zero added value, so that they can focus on relevant
    activities.

