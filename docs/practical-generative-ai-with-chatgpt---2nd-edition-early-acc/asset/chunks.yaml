    在之前的示例中，我指示模型仅输出推文情感的标签，并为它提供了三个示例来演示如何操作。


    第二种方法更为复杂，被称为 `fine-tuning`（微调）。微调是将预训练模型适配到新任务的过程。


    在微调过程中，预训练模型的参数会发生变化，这种变化通过调整现有参数或添加新参数，以更好地拟合新任务的数据。这是通过在特定于新任务的较小标注数据集上训练模型来实现的。微调背的核心思想是利用从预训练模型中学到的知识，并将其微调到新任务中，而不是从零开始训练模型。请看下图：


    ![Figure 2.12 – Model fine-tuning](img/file32.jpg)


    图 2.12 – 模型微调


    在前面的图中，你可以看到一个关于微调如何在 OpenAI 预构建模型上工作的原理图。其核心是：你拥有一个具有通用权重或参数的预训练模型。然后，你向模型输入自定义数据，通常是以此处所示的
    `key-value` 提示词（prompts）和完成项（completions）的形式：


    ```

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    ...

    ```


    一旦训练完成，你将获得一个自定义模型，它在特定任务上表现特别出色，例如对你公司的文档进行分类。


    微调的妙处在于，你可以为自己的用例定制预构建模型，而无需从零开始重新训练，同时可以使用较小的训练数据集，从而缩短训练时间并减少计算量。同时，模型保留了通过原始训练（即在大规模数据集上进行的训练）学到的生成能力和准确性。


    在本节中，我们概述了 OpenAI 向公众提供的模型，从你可以在 Playground 中直接尝试的（`GPT`、`Codex`）到更复杂的模型（如嵌入模型
    embeddings）。我们还了解到，除了使用预构建状态的模型外，你还可以通过微调对它们进行定制，并提供一组示例供学习。


    在接下来的章节中，我们将专注于这些惊模型的背景，从它们背后的数学原理开始，一直到让 ChatGPT 可能的伟大发现。


    ## ChatGPT：顶尖技术


    2022 年 11 月，OpenAI 宣布了其对话 AI 系统 `ChatGPT` 的网页预览版并向公众开放。这引发了来自专家、机构和普通用户的巨大热潮——在发布仅
    5 天后，该服务的用户量就达到了 100 万！


    在开始介绍 ChatGPT 之前，我将让它自我介绍一下，这是发布几天后的快照：


    ![Figure 2.25 – ChatGPT introduces itself in November 2022.](img/file33.png)


    图 2.25 – ChatGPT 在 2022 年 11 月自我介绍。


    如上所述，`ChatGPT` 的第一个版本构建在一个高级语言模型之上，该模型使用了 `GPT-3` 的修改版本，并专门针对对话进行了微调。这个微调后的版本被称为
    `GPT-3.5-turbo`。优化过程涉及“基于人类反馈的强化学习”（`Reinforcement Learning with Human Feedback`,
    `RLHF`），这是一种利用人类输入来训练模型展现理想对话行为的技术。


    我们将 `RLHF` 定义为一种机器学习方法，算法通过接收人类的反馈来学习执行某任务。算法被训练用于做出决策，以最大化人类提供的奖励信号，而人类则提供额外的反馈以改进算法的性能。当任务复杂到传统编程无法处理，或者预期结果难以预定义时，这种方法非常有用。


    这里相关的区别在于，`ChatGPT` 在训练过程中包含了人类参与（humans in the loop），以便使其与用户保持一致（aligned）。通过引入
    `RLHF`，`ChatGPT` 的设计旨在以更自然、更有互动的方式理解并响应人类语言。


    > 同样的 `RLHF` 机制也被用于我们可以认为是 ChatGPT 前身的模型——`InstructGPT`。在 OpenAI 研究人员于 2022 年
    1 月发表的相关论文中，`InstructGPT` 被介绍为一类在遵循英语指令方面优于 `GPT-3` 的模型。


    `ChatGPT` 直如今仍作为任何人都可以使用的免费应用程序可用；但自 2023 年 2 月起，OpenAI 宣布了一个名为 `ChatGPT Plus`
    的新付费版本，每月费用 20 美元，为订阅者提供了若干优势，包括访问最新模型、最快的响应时间、一套强大的插件集，以及在 GPTs 游乐场中创建自己的助手的可能性。


    让我们快速浏览一下当前日期的 ChatGPT 用户界面：


    ![Figure 3: Landing page of ChatGPT at chatgpt.com](img/file34.png)


    图 3: `chatgpt.com` 的 ChatGPT 首页


    让我们双击每个部分：


    1. 你可以决定 `ChatGPT` 后端使用的模型。在我情况下，我设置了 `GPT-4o`，它仅对付费订阅开放。这是我们在整本书中将使用的模型。

    2. 系统向用户推荐一组预构建的提示词，帮助他们熟悉应用程序。

    3. 文本框是用户提问的地方。注意左上角有一个小回针图标：它表示模型可以上传的文件。这些文件可以从本地上传，也可以从 `Google Drive` 或 `OneDrive`
    等云存储检索。

    4. 在左侧边栏中，你可以看到与 `ChatGPT` 的聊天列表。这是一个非常有用的工具，因为在每个聊天中，通过你与模型的多次交互，创建了模型感知的上下文。这意味着如果你想继续之前的对话，只需打开相应的聊天即可，无需再次描述整个场景。

    5. 最近添加的一个很棒的功能是与其他用户共享工作空间的功能，以便你与团队成员协作。请注意这是一个额外的付费功能，不包含在 Plus 计划中，每月额外收费
    5 美元。

    6. 最后，`ChatGPT Plus` 提供了创建 GPTs 的可能性，这些是你为特定功能定制的个性化助手。你可以决定将 GPT 设置为私有，或将其发布到
    GPTs 商店供任何人使用和评分。我们将在本书后后的专门章节中介绍 GPTs。


    最后，`ChatGPT Plus` 带有两个可以根据需要自动调用的内置插件：网络搜索插件（用于检索最新信息）和代码解释器插件（用于处理分析文档或执行复杂的数学任务）。


    在本书中，我们将利用 `ChatGPT Plus` 展示最新模型和功能的特性，尽管如此，我们涵盖的大多数示例通过免费版的 `ChatGPT` 实现（该版本目前由
    `GPT-3.5-turbo` 驱动）。


    ChatGPT 架构和训练方法的持续发展和改进有望进一步推向语言处理的边界。


    总结


    在本章中，我们回顾了 OpenAI 的历史、研究领域以及最新进展，直到 ChatGPT。我们深入探讨了用于测试的 OpenAI Playground 以及我们如何利用
    OpenAI 的所有模型系列。


