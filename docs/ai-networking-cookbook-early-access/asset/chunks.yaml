  trans: "\n\n## 4. 在集合中，我们可以为 `OPENAI_API_KEY` 创建一个授权头（Authorization header）来节省时间，因为我们在每一个\
    \ API 请求中都需要它。\n\n![Image 6](img/B32646_2_6.png)\n图 2.6: 添加授权头\n\n## 5. 我们还可以创建一个可以在单个请求中引用的全局变量。导航到\
    \ `Variables`（变量）并创建一个值为 `'https://api.openai.com.'` 的 `base_url` 变量。确保你点击了顶部的\
    \ `Save`（保存）按钮以保存更改。\n\n![Image 7](img/B32646_2_7.png)\n图 2.7: 集合变量\n\n## 6. 点击\
    \ `Add a request`（添加请求）。\n\n![Image 8](img/B32646_2_8.png)\n图 2.8: 添加请求\n\n##\
    \ 7. 对于第一个请求，可以使用简单的 GET 请求来查看模型列表。我们可以将请求命名为 `model lists`，并使用 `{{base_url}}`\
    \ 来引用集合级别的基础 URL 变量，然后追加 `/v1/models` 以完成完整路径。由于我们已经在集合级别输入了 API key，只需点击 `Send`（发送）即可接收响应。\n\
    \n![Image 9](img/B32646_2_9.png)\n图 2.9: 第一个 GET 请求\n\n## 8. 我们来完成另一个请求。对于此请求，我们将类型更改为\
    \ POST，端点设置为 `{{base_url}}/v1/chat/completions`。\n\n![Image 10](img/B32646_2_10.png)\n\
    图 2.10: B32646_02_10.png 聊天完成请求\n\n## 9. 我们需要添加一个额外的 `Content-Type` 请求头。\n\n![Image\
    \ 11](img/B32646_2_11.png)\n图 2.11: 新聊天完成头\n\n## 10. 在 `Body`（主体）下，我们将使用 `Raw`（原始）和\
    \ `JSON` 格式，并输入与之前用于聊天完成时相同的内容。\n\n![Image 12](img/B32646_2_12.png)\n图 2.12: 新聊天完成请求主体\n\
    \n## 11. 如果所有输入都正确，点击 `Send` 后，我们应该能够看到之前过的响应。\n\n![Image 13](img/B32646_2_13.png)\n\
    图 2.13: 新聊天完成响应\n\n## 工作原理……\n\n这个配方非常直观，因为我们没有从 curl 部分向请求中引入任何新元素。头、主体和响应都是完全相同的。我们引入的是新的\
    \ Postman 界面，它对用户更友好，并将我们的 API 调用简化为层次结构。我们使用环境（Environments）来区分高层环境，如测试、QA 和生产环境。我们还使用集合（Collections）将不同的\
    \ API 调用根据其逻辑用例进行隔来。\n\nPostman 提供了一种易于继承头的方法，例如从集合将 `OPENAI_API_KEY` 认证头继承到单个请求，从而节省了我们的时间并减少了错误概率。该界面还允许我们在需要修改参数（例如模型类型或温度）时轻松修改请求主体，而无需复制粘贴或重新输入其他未更改的参数。\n\
    \n当 OpenAI 处理我们的请求时，它会返回一个 HTTP 响应，状态码 200 表示成功，401 表示身份验证问题，500 表示服务器错误。有了语法高亮，故障排除也变得更容易了。\n\
    \n## 更多……\n\nPostman 在 API 测试方面非常有用，对于额外的挑战，请随时创建更多环境，如“Production”和“QA”。在环境内根据需要创建相应的集合。\n\
    \n# 对 OpenAI 响应进行微调\n\nOpenAI LLM 基础模型（有时称为基础模型 Foundation model）在处理我们交给它的绝多数甚至所有任务方面功能异常强大。正如我们目前所看到的，它能够帮助我们完成许多通用网络工程任务，例如配置\
    \ VLAN、分配 IP 地址和更改接口描述。\n\n但它们目前无法做的一点（因为没有任何现成工具可以）是针对我们特定的组织需求提供个性化反馈。例如，如果我们的团队在配置\
    \ BGP 时始终使用 Loopback 0 作为 router-id，基础模型将不知道这一点。\n\n我们根据特定需求自定义 OpenAI 模型的方法是对其进行微调（Fine-tuning）。微调允许我们教会\
    \ OpenAI 模型我们组织特定的网络配置标准，这样我们就不再只得到通用的配置。\n\n在这个配方中，我们将学习如何准备训练数据、执行微调过程并验证结果，以确保模型反映我们公司的标准程序。\n\
    \n## 准备工作\n\n请查看第一章关于设置 OpenAI 开发环境的教程，包括使用 Python 虚拟环境、OpenAI API key 以及安装 `openai`\
    \ Python 包。\n\n## 如何操作……\n\n1. 我们将开始查询默认的 OpenAI 模型来生成 BGP 邻居配置，我们将此脚本命名为 `recipe_3_01_test_model.py`。\n\
    \n```python\nimport os\nfrom openai import OpenAI\n\napi_key = os.getenv('OPENAI_API_KEY')\n\
    client = OpenAI(api_key=api_key)\n\nquery = \"Configure BGP for AS 6501 with neighbor\
    \ 192.168.1.2 in AS 6502\"\n\nresponse = client.chat.completions.create(\n   \
    \ model=\"gpt-3.5-turbo\",\n    messages=[\n        {\n            \"role\": \"\
    system\",\n            \"content\": \"You are a network engineer. Generate BGP\
    \ configuration.\"\n        },\n        {\n            \"role\": \"user\",\n \
    \           \"content\": query\n        }\n    ],\n    max_tokens=200,\n    temperature=0.1\n\
    )\n\nprint(\"BASE MODEL OUTPUT:\")\nprint(response.choices[0].message.content)\n\
    ```\n\n2. 结果是一个通用的 BGP 配置，没有问题，但它已经非常基础了。\n\n```bash\n$ python recipe_3_01_test_base_model.py\n\
    BASE MODEL OUTPUT:\n\nrouter bgp 65001\n\nneighbor 192.168.1.2 remote-as 65002\n\
    ```\n\n3. 让我们使用脚本来生成一些训练数据，我们将此脚本命名为 `recipe_3_02_create_training_data.py`。在编写时，OpenAI\
    \ 至少需要 10 个训练数据示例，输出保存在名为 `bgp_training_data.jsonl` 的文件中。\n\n"
