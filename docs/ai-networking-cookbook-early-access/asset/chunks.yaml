  trans: "\n\n4. 后端和前端最大的区别之一是，后端主要关注提供内容，*而不是*用户界面。如果我们导航到 `127.0.0.1:8000`，我们将看到一个并不漂亮的页面：\n\
    \n![Image 1](img/B32646_7_1.png)\n\n图 7.1: 默认 FastAPI 页面\n\n5. 然而，在 FastAPI 中，文档始终是“一等公民”。我们可以在\
    \ `/docs` 端点看到自动生成的文档：\n\n![Image 2](img/B32646_7_2.png)\n\n图 7.2: FastAPI 文档\n\
    \n## 工作原理……\n\nFastAPI 将我们的应用程序封装在一个函数中，该函数会自动处理 HTTP 请求、JSON 序列化和 API 文档生成。`title`\
    \ 参数会在每次显示 `title` 时（例如文档页面）设置该名称。\n\n```python\napp = FastAPI(title=\"Network\
    \ AI\")\n```\n\nFastAPI 最优特性之一是与 Pydantic 的集成。在以下代码中，如果有人为 `question` 发送了无效数据（例如类型错误或缺少值），Pydantic\
    \ 会自动验证传入的 JSON 请求，FastAPI 将生成错误消息。\n\n```python\nclass QuestionRequest(BaseModel):\n\
    \    question: str\n```\n\n接下来的部分是 AI 魔法所在，我们编写提示词（prompt）、指定模型并解析响应。\n\n```python\n\
    response = client.chat.completions.create(\n    model=\"gpt-3.5-turbo\",\n   \
    \ messages=[\n        {\n            \"role\": \"system\",\n            \"content\"\
    : \"你是一个网络工程师助手。\n                        请就网络故障排除、配置和\n                     \
    \   性能问题提供简洁、实用的回答。\"\n        },\n        {\"role\": \"user\", \"content\": request.question}\n\
    \    ],\n    max_tokens=150\n)\nreturn {\"answer\": response.choices[0].message.content}\n\
    ```\n\n结尾处的导入看起来可能很奇怪，但这是 FastAPI 的最佳实践。它只在需要时（直接运行该文件时）才导入 `uvicorn`。\n\n```python\n\
    if __name__ == \"__main__\":\n    import uvicorn\n    uvicorn.run(app, port=8000)\n\
    ```\n\n## 更多内容……\n\n为了获得更详细的日志，我们可以使用以下模式来记录更多信息。\n\n```python\nimport logging\n\
    logging.basicConfig(level=logging.INFO)\n@app.post(\"/ask\")\ndef ask_question(request:\
    \ QuestionRequest):\n    logging.info(f\"Question received: {request.question}\"\
    )\n```\n\n## 另请\n\n请访问 [`fastapi.tiangolo.com/`](https://fastapi.tiangolo.com/)\
    \ 查看更多关于 FastAPI 的信息。\n\n# 7.2 添加设备上下文\n\n让我们增强我们的 AI 应用，包含一个提供特定设备建议的功能。这将带给我们更详细的答案，因为额外信息将提供特定的命令。此教程旨在演示我们如何重构代码以添加更多功能。\n\
    \n## 准备工作\n\n请完成教程 7.1\n\n## 如何实现……\n\n1. 我们将增强在 7.1 中创建的脚本，复制相同的脚本并命名为 `main_v2.py`。\n\
    2. 我们将在 `QuestionRequest` 类中添加一个额外的 `device_type` 参数。\n\n```python\nclass QuestionRequest(BaseModel):\n\
    \    question: str\n    device_type: str = \"generic\"\n```\n\n3. 我们可以添加一个 if-else\
    \ 循环来修改我们的提示词。\n\n```python\nif request.device_type.lower() == \"cisco\":\n  \
    \  system_msg += \"关注 Cisco/IOS-XE 的命令和语法。提供特定的 'show' 和 'configure' 命令。\"\nelif\
    \ request.device_type.lower() == \"uniper\":\n    system_msg += \"关注 Junos 的命令和语法。使用\
    \ 'show' 和 'set' 命令格式。\"\nelif request.device_type.lower() == \"arista\":\n  \
    \  system_msg += \"关注 Arista EOS 的命令和语法。使用 EOS 特有的功能和命令。\"\nelif request.device_type.lower()\
    \ == \"alo alto\":\n    system_msg += \"关注 Palo Alto（Palo Alto）防火墙的命令和 Web 指导。\"\
    \nelse:\n    system_msg += \"提供中立（不针对厂商）的指导。\"\nsystem_msg += \"在相关时，提供带有特定命令的简洁、实用的回答。\"\
    \n```\n\n4. 我们还可以将模型更改为 `gpt-4.1` 模型。\n\n```python\nresponse = client.chat.completions.create(\n\
    \    model=\"gpt-4.1\",\n    messages=[\n        {\"role\": \"system\", \"content\"\
    : system_msg},\n        {\"role\": \"user\", \"content\": request.question}\n\
    \    ],\n    max_tokens=200\n)\nreturn {\n    \"answer\": response.choices[0].message.content,\n\
    \    \"device_type\": request.device_type\n}\n```\n\n5. 最后，我们使用 `curl` 命令进行尝试，我们可以获取支持的厂商列表，并指定特定的厂商（如\
    \ Cisco 或 Juniper）。\n\n```bash\n$ curl \"http://localhost:8000/devices\" | jq\n\
    …\n{\n  \"supported_devices\": [\n    \"cisco\",\n    \"juniper\",\n    \"arista\"\
    ,\n    \"palo alto\",\n    \"generic\"\n  ]\n}\n```\n\n"
- fmt: "\n## 4. Specify the database model for questions.\n\n```python\nclass Question(Base):\n\
    \    tablename__ = \"questions\"\n    id = Column(Integer, primary_key=True)\n\
    \    question = Column(String)\n    answer = Column(String)\n    device_type =\
    \ Column(String)\n    timestamp = Column(DateTime, default=datetime.now)\n```\n\
    \n## 5. The following code allows automatic table creation.\n\n```python\nBase.metadata.create_all(engine)\n\
    ```\n\n## 6. We use the following code in the `ask_question()` function to save\
    \ the answer to the database.\n\n```python\n# Save to database\nsession = Session()\n\
    session.add(\n    Question(\n        question=request.question,\n        answer=answer,\n\
    \        device_type=request.device_type\n    )\n)\nsession.commit()\nsession.close()\n\
    ```\n\n## 7. We also create a `/history` endpoint to query the questions.\n\n\
    ```python\n@app.get(\"/history\")\ndef get_history():\n    session = Session()\n\
    \    questions = session.query(Question).order_by(Question.timestamp.desc()).limit(10).all()\n\
    \    session.close()\n    return [{\"question\": q.question, \"answer\": q.answer,\
    \ \"device_type\": q.device_type, \"time\": q.timestamp} for q in questions]\n\
    ```\n\n## 8. Let's try it out. We will start by asking a few questions.\n\n```bash\n\
    $ curl -X POST \"http://localhost:8000/ask\" \\\n  -H \"Content-Type: application/json\"\
    \ \\\n  -d '{\"question\": \"How do I troubleshoot OSPF neighbor issues?\", \"\
    device_type\": \"cisco\"}' | jq\n$ curl -X POST \"http://localhost:8000/ask\"\
    \ \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"question\": \"How do\
    \ I configure VLANs?\", \"device_type\": \"juniper\"}' | jq\n$ curl -X POST \"\
    http://localhost:8000/ask\" \\\n  -H \"Content-Type: application/json\" \\\n \
    \ -d '{\"question\": \"Why is my interface down?\", \"device_type\": \"arista\"\
    }' | jq\n```\n\n## 9. We can use the new `/history` endpoint to retrieve all the\
    \ questions and answers.\n\n```bash\n$ curl \"http://localhost:8000/history\"\n\
    [{\"question\":\"Why is my interface down?\",\"answer\":\"To check why an interface\
    \ is down on an Arista switch, you can use the following commands:\\n\\n1\\. Verify\
    \ the administrative and operational status of the interface:\\n```\\nshow interfaces\
    \ status\\n```\\n\\n2\\. Check if the interface is configured:\\n```\\nshow running-config\
    \ interface <interface>\\n```\\n\\n3\\. Verify if there are any error counters\
    \ on the interface:\\n```\\nshow interfaces <interface> | include errors\\n```\\\
    n\\n4\\. Check if the interface is physically connected and the link is up:\\\
    n```\\nshow interfaces <interface> | include connected\\n```\\n\\nUsing these\
    \ commands will help you diagnose why the interface is down on your Arista switch.\"\
    ,\"device_type\":\"arista\",\"time\":\"2025-07-31T00:06:36.104963\"},{\"question\"\
    :\"How do I configure VLANs?\",\"answer\":\"To configure VLANs on a Juniper device,\
    \ you can use the following commands:\\n\\n1\\. Enter configuration mode:\\n```shell\\\
    nconfigure\\n```\\n\\n2\\. Create a VLAN and assign a VLAN ID:\\n```shell\\nset\
    \ vlans VLAN_NAME vlan-id VLAN_ID\\n```\\n\\n3\\. Assign interfaces to the VLAN:\\\
    n```\\n…\\n```\"}]\n```\n\n---\n\n## How it works…\n\nHere are the new SQLAlchemy\
    \ key objects:\n\n- `Engine`: Connects to SQLite database `db`.\n- `Base`: Declare\
    \ Base class.\n- `Session`: Factory for creating sessions.\n\nThe database model\
    \ includes:\n\n- `id`: auto-incrementing the primary key, is an integer.\n- `question`:\
    \ the user's question, a string.\n- `answer`: The AI's response, a string.\n-\
    \ `device_type`: string object.\n- `Timestamp`: DateTime object that we automatically\
    \ insert the time of creation.\n\nAs you saw, the way to save entries to the database\
    \ is to use a session. We initiate the session, add the information, commit, and\
    \ close.\n\n## There's more…\n\nWe can use sqlalchemy's built-in functions to\
    \ provide statistics\n\n```python\nfrom sqlalchemy import func\n\n@app.get(\"\
