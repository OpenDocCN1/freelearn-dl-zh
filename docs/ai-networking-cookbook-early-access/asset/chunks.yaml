  trans: "\n\n1. 创建并激活 Python 虚拟环境。\n\n```bash\n$ python3 -m venv .venv\n$ source\
    \ .venv/bin/activate\n```\n\n2. 安装 `openai` 和 `python-dotenv` 软件包。\n\n```bash\n\
    $ pip install openai python-dotenv\n```\n\n3. 使用文本编辑器创建一个 `.env` 文件并输入你的 `OPENAI_API_KEY`。\n\
    \n```bash\n$ touch .env #创建文件\n$ vim .env #编辑文件\n..\nOPENAI_API_KEY=\"your-openai-api-key\"\
    \n```\n\n某些配方需要特定的额外 Python 软件包，这些包将包含在配方的“准备工作”（Getting Ready）章节中。\n\n# 为 AI\
    \ 模型提供指令\n\n将 AI 模型想象成入职第一天的新网络工程师，他们很有能力，但需要通过清晰的方向和指令来完成“入职”。\n\n## 准备工作 (Getting\
    \ Ready)\n\n请参考本配方的“准备工作”章节。\n\n## 如何操作……\n\n1. 创建一个提示词（prompt）相对模糊的 Python 脚本。\n\
    \n```python\nfrom openai import OpenAI\nimport os\nfrom dotenv import load_dotenv\n\
    \nload_dotenv()\nclient = OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\n# 坏示例\
    \ - 模糊且缺乏方向\nvague_prompt = \"Help me with BGP configuration\"\n\nresponse_vague\
    \ = client.chat.completions.create(\n    model=\"gpt-4\",\n    messages=[{\"role\"\
    : \"user\", \"content\": vague_prompt}]\n)\n\nprint(\"Vague Response:\")\nprint(response_vague.choices[0].message.content)\n\
    print(\"\\n\" + \"=\"*50 + \"\\n\")\n```\n\n2. 执行脚本查看反馈，你的结果可能会略不同。\n\n```bash\n\
    $ python 3_1_vague_prompt.py\nVague Response:\n边界网关协议 (BGP) 是一种用于自治系统 (AS)之间路由的复杂路由协议。以下是在你的路由器上配置\
    \ BGP 的基本示例：\n\n在开始配置之前，请确保你拥有以下信息：\n1\\. 你的网络的自治系统编号 (ASN)\n2\\. 你将添加到 BGP 网络的路由器\
    \ IP 地址\n\n```cisco\nRouter#configure terminal\n\nRouter(config)#router bgp <ASN>\
    \ // 进入你的 ASN\n\nRouter(config-router)#network <network> // 指定你想要宣告的网络\n\nRouter(config-router)#neighbor\
    \ <neighbor IP address> remote-as <AS of neighbor> // 定义相邻的 BGP 路由器并指定其 AS 号\n\
    \nRouter(config-router)#exit\n\nRouter(config)#exit\n\nRouter#copy running-config\
    \ startup-config // 将配置保存到内存以便在重启后依然保留\n```\n\n将 `<ASN>`, `<network>`, `<neighbor\
    \ IP address>` 和 `<AS of neighbor>` 替换为实际值。\n\n请记住，每个路由器的配置将根据你的网络拓扑和大小而不同。在尝试实施\
    \ BGP 之前，对你的网络现有配置良好的良好的理解。\n\n请注意，错误配置 BGP 可能对你的网络产生严重后果，因此在进行更改时务必小心，如果你不确定过程中的任何步骤，请考虑咨询网络专家。\n\
    \n在尝试在网络上实施 BGP 之前，请彻底学习 BGP 及相关主题。有很多书籍、网站和正式培训课程可以在这提供帮助。\n\n在将配置更改应用于生产设备之前，请考虑先在测试环境中进行练习。在推广到整个网络之前，测试新设置的性能和可靠性是一个主意。\n\
    \n最后，确保你的配置符合所有安全最佳实践。BGP 与任何其他互联网协议一样，如果不妥善安全，很容易被滥用。确保你的 BGP 路由器是安全的，并经过配置以限制攻击和误配置的风险。\n\
    \n==================================================\n```\n\n3. 创建一个具有更好方向的提示词\
    \ Python 脚本。\n\n```python\nfrom openai import OpenAI\nimport os\nfrom dotenv import\
    \ load_dotenv\n\nload_dotenv()\nclient = OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"\
    ))\n\ndirected_prompt = \"\"\"\n    你是一位专通 BGP 路由协议的高级网络工程师。\n    我需要你为 Cisco\
    \ ASR9000 路由器生成一个 BGP 配置，要求如下：\n\n1\\. 与两个上游 ISP (AS 65001 和 AS 65002) 建立 EBGP\
    \ 对等\n2\\. 实现路由过滤，仅接受来自上游的默认路由\n3\\. 在两个上游之间设置负载均衡\n4\\. 为 BGP 会话包含基础的安全加固\n\n\
    \    我的路由器 AS 号是 65100，对等 IP 为：\n    - ISP1 (AS 65001): 192.168.1.1\n    - ISP2\
    \ (AS 65002): 192.168.2.1\n\n    以 IOS-XR 格式提供配置并带有解释性注释。\n    \"\"\"\n\nresponse_directed\
    \ = client.chat.completions.create(\n    model=\"gpt-4\",\n    messages=[{\"role\"\
    : \"user\", \"content\": directed_prompt}]\n)\n\nprint(\"Directed Response:\"\
    )\nprint(response_directed.choices[0].content)\n```\n\n4. 执行脚本查看反馈。\n\n```bash\n\
    $ python 3_1_directed_prompt.py\nDirected Response:\n好的，这里是根据要求在 ASR9000 上运行 IOS-XR\
    \ 的基本配置：\n\n! ASR 配置\n\nrouter bgp 65100\n  ! 为 AS 65100 定义 BGP 路由配置\n  bgp router-id\
    \ 192.168.0.1\n  address-family ipv4 unicast\n    ! 定义 IPv4 单播族上下文\n    maximum-paths\
    \ 2\n    ! 在两个等代价路径之间启用负载均衡\n  neighbor 192.168.1.1\n    ! 为 ISP1 配置 BGP 邻居\n\
    \    remote-as 65001\n    ! 设置 ISP1 的远程 AS 为 65001\n    address-family ipv4 unicast\n\
    \      ! 与 ISP1 启用 IPv4 单播\n      send-community\n      ! 向邻居发送社区属性\n      maximum-prefix\
    \ 1\n      ! 将从 ISP1 接收的前缀限制为 1\n  neighbor 192.168.2.1\n    ! 为 ISP2 配置 BGP 邻居\n\
    \    remote-as 65002\n    ! 设置 ISP2 的远程 AS 为 65002\n    address-family ipv4 unicast\n\
    \      ! 与 ISP2 启用 IPv4 单播\n      send-community\n      ! 向邻居发送社区属性\n      maximum-prefix\
    \ 1\n      ! 将从 ISP2 接收的前缀限制为 1\n!\n\nroute-policy RECEIVE-DEFAULT-ROUTE\n  !\
    \ 定义策略仅接受默认路由\n  if destination in (0.0.0.0/0) then\n    pass\n  else\n    drop\n\
    \  endif\nend-policy\n!\nrouter bgp 65100\n  neighbor 192.168.1.1\n    address-family\
    \ ipv4 unicast\n      route-policy RECEIVE-DEFAULT-ROUTE in\n      ! 应用路由策略仅从\
    \ ISP1 接受默认路由\n  neighbor 192.168.2.1\n    address-family ipv4 unicast\n     \
    \ route-policy RECEIVE-DEFAULT-ROUTE in\n      ! 应用路由策略仅从 ISP2 接受默认路由\n!\n```\n\
    \n现在让我们加固 BGP 安全：\n\nBGP 安全加固包括多个方面，例如身份验证、TTL 安全和更新源验证。以下是此类配置的基本示例：\n\n```cisco\n\
    ! 实现 BGP 身份验证\nrouter bgp 65100\n  neighbor 192.168.1.1\n    password cisco\n\
    \  neighbor 192.168.2.1\n    password cisco\n\n! 实现 TTL 安全\nrouter bgp 65100\n\
    \  neighbor 192.168.1.1\n    ttl-security 1\n  neighbor 192.168.2.1\n    ttl-security\
    \ 1\n\n! 实现更新源验证\nrouter bgp 65100\n  neighbor 192.168.1.1\n    update-source\
    \ Loopback0\n  neighbor 192.168.2.1\n    update-source Loopback0\n!\n```\n"
- fmt: "\nPlease remember to replace `cisco` with the respective BGP session password.\
    \ Also, ensure to replace the `Loopback0` interface with the actual interface\
    \ from your configuration.\n\n## How it works…\n\nWe started both scripts with\
    \ the same code block to import Python packages and load the environment variables\
    \ for `OPENAI_API_KEY`. We then modify only the prompt to get two dramatically\
    \ different answers. When you do not initially receive the answer you expected\
    \ from an expert, the first thing you want to check is how you can improve the\
    \ prompt.\n\nThe directed prompt works better because they:\n\n* **Set the role**:\
    \ We told the model to respond with a \"senior network engineer.\"\n* **Define\
    \ the scope**: We define a clear scope, such as \"Cisco ASR9000 router,\" the\
    \ ASN with upstream routers, and `EBGP` peering.\n* **Provide context**: We also\
    \ provide the network details.\n\nThe direction given in the prompt is where a\
    \ slightly improved prompt can have a dramatic difference in the result we receive.\n\
    \n## There's more…\n\nWe can further improve prompt with negative instructions,\
    \ for example:\n\n\"Do not use route-reflection, Do not include deprecated `IOS-XR`\
    \ commands.\"\n\nWe can also include multiple steps:\n\n\"1. First, analyze the\
    \ current proposed configuration. 2. Then, identify any security vulnerabilities\"\
    \n\n## See also…\n\nPlease see the recipe in the following section *Specifying\
    \ Return Formats* if you would like to receive a different format than a copy-and-paste\
    \ command snippet.\n\n# Specifying Return Formats\n\nAs we saw in some previous\
    \ recipes, if we want a certain return format, we need to be clear and precise\
    \ about it. In the preceding recipe, we asked for 'IOS-XR format' in its response,\
    \ that is an example of a ready-to-paste CLI command. By the same token, we can\
    \ also specify `JSON` format for API integration, `YAML` for human-readable format,\
    \ or Ansible playbook-style return format.\n\nIn this recipe, let's experiment\
    \ with different return formats.\n\n## Getting Ready\n\nWe will need to install\
    \ additional Python package `pyyaml`. We will also export the `OPENAI_API_KEY`\
    \ in our environment variable.\n\n```bash\n$ pip install pyyml\n$ export OPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\n## How to do it…\n\n1. Create the script that provides\
    \ a base scenario and request a `JSON` return format with instructions.\n\n```python\n\
    #!/usr/bin/env python3\nimport os\nfrom openai import OpenAI\n\nclient = OpenAI(api_key=os.getenv(\"\
    OPENAI_API_KEY\"))\n\n# Simple base scenario\nbase_scenario = \"\"\"\nI have a\
    \ network with the following devices:\n- 2 core switches (Cisco Catalyst 9400)\n\
    - 4 distribution switches (Cisco Catalyst 9300)\n- 8 access switches (Cisco Catalyst\
    \ 9200)\n\nCreate an inventory document for this network.\n\"\"\"\n\n# Request\
    \ JSON format\njson_prompt = base_scenario + \"\"\"\n\nReturn the inventory in\
    \ JSON format with the following structure:\n- Each device should have: hostname,\
    \ model, role, mgmt_ip\n- Group devices by role (core, distribution, access)\n\
    - Include a summary section with total counts\n\nProvide ONLY the JSON output,\
    \ no additional text.\n\"\"\"\n\nresponse_json = client.chat.completions.create(\n\
    \    model=\"gpt-4\",\n    messages=[{\"role\": \"user\", \"content\": json_prompt}]\n\
    )\n\nprint(\"JSON Format Response:\")\nprint(response_json.choices[0].message.content)\n\
    ```\n\n2. Execute the script and observe the output.\n\n```bash\n$ python 3_2_Return_JSON_Format.py\n\
    JSON Format Response:\n```json\n{\n  \"network_inventory\": {\n    \"core\": [\n\
    \      {\n        \"hostname\": \"core_switch_1\",\n        \"model\": \"Cisco\
    \ Catalyst 9400\",\n        \"role\": \"core\",\n        \"mgmt_ip\": \"192.168.1.1\"\
    \n      },\n      {\n        \"hostname\": \"core_switch_2\",\n        \"model\"\
    : \"Cisco Catalyst 9400\",\n        \"role\": \"core\",\n        \"mgmt_ip\":\
    \ \"192.168.1.2\"\n      }\n    ],\n    \"distribution\": [\n      {\n       \
    \ \"hostname\": \"distribution_switch_1\",\n        \"model\": \"Cisco Catalyst\
    \ 9300\",\n        \"role\": \"distribution\",\n        \"mgmt_ip\": \"192.168.1.3\"\
    \n      },\n      {\n        \"hostname\": \"distribution_switch_2\",\n      \
    \  \"model\": \"Cisco Catalyst 9300\",\n        \"role\": \"distribution\",\n\
    \        \"mgmt_ip\": \"192.168.1.4\"\n      }\n      <output skipped>\n    ],\n\
    \    \"access\": [\n      {\n        \"hostname\": \"access_switch_1\",\n    \
    \    \"model\": \"Cisco Catalyst 9200\",\n        \"role\": \"access\",\n    \
    \    \"mgmt_ip\": \"192.168.1.7\"\n      },\n      {\n        \"hostname\": \"\
    access_switch_2\",\n        \"model\": \"Cisco Catalyst 9200\",\n        \"role\"\
    : \"access\",\n        \"mgmt_ip\": \"192.168.1.8\"\n      }\n      <output skipped>\n\
    \    ],\n    \"summary\": {\n      \"total_core\": 2,\n      \"total_distribution\"\
    : 4,\n      \"total_access\": 8\n    }\n  }\n}\n```\n\n3. Create a second script\
    \ with the same base scenario and request a `YAML` return format (only the return\
    \ format is shown here, please see the GitHub repository to see the full version).\n\
    \n```python\n# Top portion is the same as Step 1\n# Request YAML format\nyaml_prompt\
    \ = base_scenario + \"\"\"\n\nReturn the inventory in YAML format suitable for\
    \ Ansible.\nStructure it as:\n- Group devices by role using YAML groups\n- Include\
    \ vars for each group (os_type, default_credentials, etc.)\n- Add individual host\
    \ variables where needed\n- Make it ready to use with ansible-playbook\n\nProvide\
    \ ONLY the output, no additional text.\n\"\"\"\n\nresponse_yaml = client.chat.completions.create(\n\
    \    model=\"gpt-4\",\n    messages=[{\"role\": \"user\", \"content\": yaml_prompt}]\n\
    )\n\nprint(\"YAML Format Response:\")\nprint(response_yaml.choices[0].message.content)\n\
    ```\n\n4. Execute the script and observe the output.\n\n```bash\npython 3_2_Return_YML_Format.py\n\
    YAML Format Response:\n```yaml\nall:\n  children:\n    core:\n      hosts:\n \
    \       core_switch1:\n          ansible_host: core_switch1.example.com\n    \
    \    core_switch2:\n          ansible_host: core_switch2.example.com\n      vars:\n\
    \        os_type: 'ios'\n        default_credentials:\n          username: 'admin'\n\
    \          password: 'password'\n    distribution:\n      hosts:\n        distribution_switch1:\n\
    \          ansible_host: distribution_switch1.example.com\n        distribution_switch2:\n\
    \          ansible_host: distribution_switch2.example.com\n      <output skipped>\n\
    \    access:\n      hosts:\n        access_switch1:\n          ansible_host: access_switch1.example.com\n\
    \        access_switch2:\n          ansible_host: access_switch2.example.com\n\
    \    <output skipped>\n```\n```\n\n## How it works…\n\nFormat specification leverages\
    \ AI model's training on existing knowledge. What is great is we might miss a\
    \ detail or two despite our best effort, a missing period or an extra space is\
    \ not uncommon if we were to perform the same task manually. The key to the instructions\
    \ are:\n\n* Be explicit, such as \"Return JSON format.\"\n* Specify the structure,\
    \ for example, \"Group devices by role using YAML groups.\"\n* Use format-specific\
    \ language, such as \"make it ready to use with ansible-playbook.\"\n\nWhen it\
    \ comes to specify formats, it is helpful to specify \"no additional text\" to\
    \ let AI know we do not need documentation and explanation.\n\n## There's more…\n\
    \nWe can also combine format request with validation instructions:\n\n```python\n\
    validation_prompt = \"\"\"\n\n[your main request here]\n\nReturn as valid JSON\
    \ that passes the following validation:\n\n1. All strings must be properly quoted\n\
    \n2. No trailing commas\n\n3. Include a \"validation\" field with timestamp\n\n\
    4. Test that json.loads() can parse it successfully\n\nAfter generating the JSON,\
    \ mentally validate it against these rules before returning.\n\"\"\"\n```\n"
