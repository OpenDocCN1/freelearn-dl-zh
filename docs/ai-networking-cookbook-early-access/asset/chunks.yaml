- fmt: "\n*   The first recipe from [Chapter 2](#Chapter_2.xhtml_h1_42), `Implementing\
    \ Curl Testing with OpenAI`.\n*   The fifth recipe from [Chapter 3](#Chapter_3.xhtml_h1_71),\
    \ `Building Prompt Gradually`.\n\n# 4.4 Using Llama 2 Uncensored Model for Advanced\
    \ Code Generation\n\nOne of the benefits of housing our own local AI LLM is the\
    \ freedom to 'try out' new models. When we use a hosted model, such as `OpenAI`\
    \ or `Anthropic`, we are using their version of the sometimes opinionated model.\
    \ When we house our own models, we get to try out models 'in the wild.' In this\
    \ recipe, we will use the Llama 2 Uncensored models for testing.\n\nSome of the\
    \ reasons we might want to use an uncensored model:\n\n*   The script generation\
    \ is unrestricted for complex network configurations.\n*   We might not want any\
    \ content filtering limitations, such as security assessment for authorized penetration\
    \ testing.\n*   The model will not impose any restrictions for generating code\
    \ involving sensitive system details.\n\nImportant information: As the saying\
    \ goes, 'with great power, comes with great responsibilities.' Using an uncensored\
    \ model is probably one of these scenarios when we want to be sure we take extra\
    \ precautions for the security implication. After all, it is an 'uncensored' of\
    \ the model.\n\nWe will begin by downloading the Llama 2 Uncensored model.\n\n\
    ## Getting Ready\n\nWe can use the CLI or the WebUI to pull down the Llama 2 Uncensored\
    \ model.\n\n```\n$ sudo docker exec -it ch04_ollama_1 ollama pull llama2-uncensored\n\
    pulling manifest\npulling 6aa74acf170f: 100% ██████████████████████ 3.8 GB   \
    \                    \n<output skipped>\nverifying sha256 digest\nwriting manifest\n\
