    \ sys\n\n    dot_file = sys.argv[1]\n    output_file = \"topology.png\"\n\n  \
    \  # Generate PNG from dot file\n    subprocess.run(['dot', '-Tpng', dot_file,\
    \ '-o', output_file])\n\n    print(f\"Generated {output_file}\")\n    ```\n\n\
    4.  We can execute the script with the dot file as the second argument.\n\n  \
    \  ```\n    $ python3 recipe_4_02_create_topology.py fat_tree_topology.dot\n \
    \   ```\n\n5.  The final result is a topology file generated from code.\n\n  \
    \  ![Image 15](images/B32646_2_15.png)\n\n    Figure 2.15: Topology File\n\n##\
    \ How it works…\n\nThe topology generation process consist of two script that\
    \ works in sequence to create a visual network diagram. The first script is where\
    \ OpenAI comes in where we call GPT-4 model to automatically generate a Graphviz\
    \ DOT file describing a fat-tree network topology. The prompt describes the elements,\
    \ such as 2 core routers, 4 spine routers, and 8 leaf devices.\n\nThe second script\
    \ transforms the topology into a visual PNG file. We can also generate other diagram\
    \ formats, such as JSON.\n\nThis recipe is a simple illustration of the ability\
    \ to codify topology generation process. The topology graph might need some more\
    \ work to be production ready, but they can save the team time and effort by automating\
    \ the process.\n\n## There's more…\n\nAdditional information on making the topology\
    \ more visually appealing can be found on Graphviz's documentation, [https://graphviz.org/](https://graphviz.org/).\n\
    \n# Generating Methods of Procedures (MOP) with OpenAI\n\nFor any network engineer\
    \ working in a medium to large enterprise environment, they are familiar with\
    \ the **Method of Procedure**, or MOP, document. The MOP is generally a detail\
    \ document outlining the steps for executing a specific task or process, often\
    \ used in network engineering operations. An example would be a MOP to create\
    \ a new VLAN, find an available IP block to be used with the VLAN, then assign\
    \ a gateway IP to the VLAN interface.\n\nThe MOP focuses on the technical aspect\
    \ of the process and is often used in a form of knowledge transfer between senior\
    \ to junior engineers, or just as a simple reminder of steps when the sleepy engineer\
    \ performing the task at 3am in the morning. While the MOP is useful, creating\
    \ it can be pretty boring. In this recipe, we will show you how to leverage OpenAI\
    \ LLM models to help you create a MOP.\n\n## Getting Ready\n\nWe just need the\
    \ openai Python package for this recipe.\n\n## How to do it…\n\n1.  We will use\
    \ the following script to combine operation steps with OpenAI generated procedures."
