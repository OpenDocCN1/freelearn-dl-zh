    \ is self-explanatory. Good prompt building should following the following steps:\n\
    \n* Establish context.\n* Layer complexity incrementally.\n* Maintain coherence.\n\
    * Correct mistakes at each layer.\n\nThe key is to realize AI models are better\
    \ at doing one thing at a time (just like their human counterparts) with hierarchical\
    \ structures.\n\n## There's more…\n\nOnce we are comfortable with the separate\
    \ scripts, we can also combine them into a single script without losing the hierarchical\
    \ structure.\n\n## Network Engineer's Advantage\n\nAs with any new technologies,\
    \ one of the questions most heard is, *\"Will this technology replace my job?\"\
    * I heard this question when network automaton was introduced many years ago,\
    \ *\"Will I automate my job away?\"*\" I also heard a different variation of this\
    \ question when cloud computing became a mainstay, *\"Will all physical networks\
    \ become obsolete?\"*\" This is also the question on everybody's mind, *\"Will\
    \ AI take away my job?\"*\"\n\nMany of the experts predict the AI revolution is\
