    \   # Set up the connection with the router using netmiko\\n\n    <output skipped>\n\
    \    ```\n\n6.  Increase the memory allocation more as needed.\n\n## How it works…\n\
    \nThis recipe illustrates how to gradually fine-tune resource allocation for our\
    \ local AI LLM models.\n\n## There's more…\n\nAdditional resources for tweaking\
    \ resources:\n\n*   Official Ollama Docker documentation: [https://github.com/ollama/ollama/blob/main/docs/docker.md](https://github.com/ollama/ollama/blob/main/docs/docker.md)\n\
    \n*   Ollma Docker Compose Examples Repository: [https://github.com/rolfhelder/ollama-docker-compose](https://github.com/rolfhelder/ollama-docker-compose)\n\
    \n# 4.3 Generating Network Code Examples with CodeLlama\n\nNow that we have a\
    \ local AI LLM model installed and running, we can start to experiment with it\
    \ using the API interface we learned from [Chapter 2](#Chapter_2.xhtml_h1_42)\
    \ and prompt engineering technics we learned about from [Chapter 3](#Chapter_3.xhtml_h1_71).\n\
    \n## Getting Ready\n\nPlease make sure you have completed the first recipe pf\
    \ this chapter to have Ollama and CodeLlama models successfully installed and\
    \ executed the first example.\n\n## How to do it…\n\n1.  Use curl and streaming\
    \ mode to gradually build up our prompt.\n\n    ```\n    $ curl -X POST http://localhost:11434/api/generate\
    \ -H \"Content-Type: application/json\" -d '{\n      \"model\": \"codellama:7b\"\
    ,\n      \"prompt\": \"Write a Python script using netmiko to connect to Cisco\n\
    \      routers and retrieve device information.\",\n      \"stream\": true\n \
    \   }'\n    <output skipped>\n    ```\n\n2.  Add parallel processing and asyncio\
    \ to the script.\n\n    ```\n    $ curl -X POST http://localhost:11434/api/generate\
    \ -H \"Content-Type: application/json\" -d '{\n      \"model\": \"codellama:7b\"\
    ,\n      \"prompt\": \"Write a Python script using netmiko that connects to\n\
    \      multiple Cisco routers in parallel. Use threading or asyncio for\n      concurrent\
    \ connections.\",\n      \"stream\": true\n    }'\n    {\"model\":\"codellama:7b\"\
    ,\"created_at\":\"2025-07-26T18:56:15.979416766Z\",\"response\":\"\\n\",\"done\"\
    :false}\n    {\"model\":\"codellama:7b\",\"created_at\":\"2025-07-26T18:56:16.184958516Z\"\
    ,\"response\":\"Here\",\"done\":false}\n    {\"model\":\"codellama:7b\",\"created_at\"\
    :\"2025-07-26T\n    <output skipped>\n    ```\n\n3.  Provide more specific data\
    \ collection requirements.\n\n    ```\n    $ curl -X POST http://localhost:11434/api/generate\
    \ -H \"Content-Type: application/json\" -d '{\n      \"model\": \"codellama:7b\"\
    ,\n      \"prompt\": \"Write a Python script using netmiko that connects to\n\
    \      multiple Cisco routers in parallel and retrieves:\\n1\\. Device\n      version\
    \ information (show version)\\n2\\. Interface status\n      (show ip interface\
    \ brief)\\n3\\. Routing table summary\n      (show ip route summary)\\n\\nUse\
    \ threading for concurrent\n      connections.\",\n      \"stream\": true\n  \
    \  }'\n    {\"model\":\"codellama:7b\",\"created_at\":\"2025-07-27T00:23:36.357048029Z\"\
    ,\"response\":\"Here\",\"done\":false}\n    {\"model\":\"codellama:7b\",\"created_at\"\
    :\"2025-07-27T00:23:36.556794192Z\",\"response\":\" is\",\"done\":false}\n   \
    \ <output skipped>\n    ```\n\n4.  Add error handling to the instructions.\n\n\
    \    ```\n    $ curl -X POST http://localhost:11434/api/generate -H \"Content-Type:\
    \ application/json\" -d '{\n      \"model\": \"codellama:7b\",\n      \"prompt\"\
    : \"Write a Python script using netmiko that connects to\n      multiple Cisco\
    \ routers in parallel and retrieves device version,\n      interface status, and\
    \ routing table summary. Include comprehensive\n      error handling for:\\n-\
    \ Connection failures\\n- Authentication\n      errors\\n- Command execution timeouts\\\
    n- Network connectivity\n      issues\\n\\nUse threading for concurrent connections.\"\
    ,\n      \"stream\": true\n    }'\n    ```\n\n5.  Add logging requirements.\n\n\
    \    ```\n    $ curl -X POST http://localhost:11434/api/generate -H \"Content-Type:\
    \ application/json\" -d '{\n      \"model\": \"codellama:7b\",\n      \"prompt\"\
    : \"Write a Python script using netmiko that connects to\n      multiple Cisco\
    \ routers in parallel and retrieves device version,\n      interface status, and\
    \ routing table summary. Include:\\n-\n      Comprehensive error handling for\
    \ connection/auth/timeout issues\\n-\n      Logging to syslog with appropriate\
    \ log levels (INFO, WARNING,\n      ERROR)\\n- Use Python logging module with\
    \ SysLogHandler\\n\\nUse\n      threading for concurrent connections.\",\n   \
    \   \"stream\": true\n    }'\n    ```\n\n6.  Provide output format in JSON.\n\n\
    \    ```\n    $ curl -X POST http://localhost:11434/api/generate -H \"Content-Type:\
    \ application/json\" -d '{\n      \"model\": \"codellama:7b\",\n      \"prompt\"\
    : \"Write a Python script using netmiko that connects to\n      multiple Cisco\
    \ routers in parallel and retrieves device version,\n      interface status, and\
    \ routing table summary. Include:\\n-\n      Comprehensive error handling for\
    \ connection/auth/timeout issues\\n-\n      Logging to syslog with appropriate\
    \ log levels\\n- Output results in\n      structured JSON format with device hostname,\
    \ timestamp, and\n      collected data\\n- JSON should be suitable for network\
    \ monitoring\n      systems\\n\\nUse threading for concurrent connections.\",\n\
    \      \"stream\": true\n    }'\n    ```\n\n7.  Final Comprehensive Prompt.\n\n\
    \    ```\n    $ curl -X POST http://localhost:11434/api/generate -H \"Content-Type:\
    \ application/json\" -d '{\n      \"model\": \"codellama:7b\",\n      \"prompt\"\
    : \"Write a comprehensive Python script using netmiko that\n      connects to\
    \ multiple Cisco routers in parallel, retrieves device\n      version information,\
    \ interface status, and routing table summary.\n      Include proper error handling,\
    \ logging to syslog, and output\n      results in JSON format suitable for network\
    \ monitoring systems.\",\n      \"stream\": true\n    }'\n    ```\n\n## How it\
    \ works…\n\nThe kind of iterative process is generally easier to be done in a\
    \ chat window, such as the interface provided by ollama-webui. However, as we\
    \ saw in this recipe, it is also possible to perform the same steps via command\
    \ line interface.\n\nThis recipe is a good example of combining multiple recipes\
    \ together. Note that in [Chapter 2](#Chapter_2.xhtml_h1_42), we used Curl with\
    \ OpenAI endpoint, but here we used it with local AI LLM model with a slightly\
    \ different endpoint and body.\n\n## There's more…\n\nWe can always improve on\
    \ existing prompts. For example, we can add some best practices with the additional\
    \ input validation and security requirements.\n\n## See also…"
