  trans: "\n6. `Temperature` 参数控制 AI 响应的`创造性或随机性`。温度越高，响应的确定性越低，创造性越强。我们可以尝试将温度一直调到\
    \ 2 并询问同一个问题。如 `图 1.10` 所示，响应的内容变得无法识别，甚至出现了外语字符。\n\n![Image 11](img/B32646_1_11.png)\n\
    \n图 1.10 –\n\n7. 将 `Temperature` 改回 `1` 并将最大标记（max tokens）降低到 `20`。如果我们再次问同一个问题，可以看到响应非常短。`token`\
    \ 决定了模型可以返回的响应数量。![Image 12](img/B32646_1_12.png)\n\n8. 最后，我们将 `Top_P` 从 1 调整到\
    \ 0.25。该设置决定了响应的“多样性”。值越低，响应的确定性越高，多样性越低。\n\n## 工作原理…\n\nOpenAI 的文本生成模型经过训练，能够理解自然语言并根据输入提供文本输出。模型利用训练过程中的概率来确定应该返回什么类型的响应。我们在本配方中涵盖的参数可以用来影响返回文本的程度，即其确定性或创造性。\n\
    \n## 更多内容…\n\n请查看[高级用法](https://platform.openai.com/docs/advanced-usage](https://platform.openai.com/docs/advanced-usage）页面，获取有关参数详情、标记管理和可复现输出的信息。\n\
    \n# 实验 OpenAI 系统消息（System Message）\n\n在参数下方有一个系统消息框。默认情况下，那里有灰色的提示文字显示为`描述预期的模型行为（语气、工具使用和响应样式）`。这是我们可以影响\
    \ OpenAI 与用户交互的最早期区域之一，通过提供所需的指南、语气和目标来实现。\n\n## 准备工作\n\n在继续示例之前，请在 `图 1.5` 中找到`系统消息框`。\n\
    \n## 如何操作…\n\n1. 让我们从以下系统消息开始：\n\n```\nYou are an AI assistant specialized in\
    \ network engineering. Your role is to assist with tasks, provide explanations,\
    \ and offer guidance related to network engineering concepts, protocols, tools,\
    \ and troubleshooting.\n```\n\n2. 对于用户提示词，让我们询问 OpenAI `What are the steps to\
    \ set up WiFi 7?` 并观察响应。\n\n![Image 13](img/B32646_1_13.png)\n\n图 1.12 –\n\n3.\
    \ 让我们将系统消息修改为：\n\n```\nYou are an AI assistant 5th grade teacher specialized in\
    \ network engineering. Your role is to assist with tasks, provide explanations,\
    \ and offer guidance related to network engineering concepts, protocols, tools,\
    \ and troubleshooting and explain them to elementary school kids.\n```\n\n交互指令如下：\n\
    \n*   必要时提供幽默的解释。\n*   使用非技术性的语言。\n\n4. 我们可以询问同一个问题，`What are the steps to set\
    \ up WiFi 7?` 并观察响应：\n\n![Image 14](img/B32646_1_14.png)\n\n图 1.13 –\n\n5. 我们在系统消息中可以做的的一些额外更改包括：\n\
    \n*   “以段落格式提供答案。”\n*   “以 YAML 格式提供答案。”\n*   “以 JSON 格式提供答案。”![Image 15](img/B32646_1_15.png)\n\
    \n图 1.14 –\n\n## 工作原理…\n\n系统消息可以影响 OpenAI 以产生预期的输出。系统消息的几个关键概念是：\n\n*   **设置正确的上下文**：提供背景信息或任务描述。例如，“你是一个专注于网络工程的\
    \ AI 助手。”\n*   **提供清晰的指令**：使用清晰、简洁且无歧的语言，并明确说明你想让模型做什么。例如，“你的角色是协助任务、提供解释并提供与网络工程概念、协议、工具和故障排除相关的指导，并向小学生解释这些内容。”\n\
    *   **指定输出格式**：指定你希望输出如何结构化。例如，`provide the answer in YAML format.`。\n\n在其他配方中我们将介绍其他的提示词工程方法，本配方提供了一个良好的开始。\n\
    \n## 更多内容…\n\nOpenAI 提示词工程指南 [`platform.openai.com/docs/guides/text?api-mode=responses#prompt-engineering`](https://platform.openai.com/docs/guides/text?api-mode=responses#prompt-engineering)\
    \ 为系统消息的提示词工程提供了极好的起点。\n\n# 在聊天中使用 OpenAI 提示词工程实验\n\n提示词工程的相同概念可以用于 OpenAI 聊天。与系统消息不同，我们使用的提示词（prompt）仅影响当前对话，如果开始新对话，它将被清除。\n\
    \n## 准备工作\n\n除了使用聊天框外不需要其他准备。\n\n## 如何操作…\n\n1. 确保系统消息中没有任何指令。\n2. 输入与上一个配方相同的指令，但现在是在聊天框中：\n\
    \n```\nYou are an AI assistant 5th grade teacher specialized in network engineering.\
    \ Your role is to assist with tasks, provide explanations, and offer guidance\
    \ related to network engineering concepts, protocols, tools, and troubleshooting\n\
    ```\n\n交互指令：\n\n*   必要时提供幽默的解释。\n*   使用非技术性的语言。\n*   以段落格式提供答案。![Image 16](img/B32646_1_16.png)\n\
    \n图 1.15 –\n\n3. 观察输出，它们应该是相似的。然而，当我们进入一个带有自动清除的新聊天时，之前的指令会被清除。\n\n## 工作原理…\n\n\
    我们在上一个配方中观察到的相同提示词工程可以应用于聊天中。区别在于指令在聊天之间不是持久的。\n\n## 更多内容…\n\nOpenAI 提示词工程指南 [`platform.openai.com/docs/text?api-mode=responses#prompt-engineering`](https://platform.openai.com/docs/text?api-mode=responses#prompt-engineering)\
    \ 为提示词工程提供了极好的起点。\n\n# 使用 OpenAI 的 Python 脚本\n\n我们也可以用 Python 与 ChatGPT 交互。\n\n\
    ## 准备工作\n\n从上一个配方中获取 OpenAI Key，因为我们将在脚本中使用它。创建一个 Python 虚拟环境来执行以下操作：\n\n```bash\n\
    $ python3 -m venv .venv\n$ source .venv/activate\n```\n\n将你的 OpenAI Key 导出为环境变量。\n\
    \n```bash\n$ export OPENAI_API_KEY=\"your-api-key\"\n```\n\n## 如何操作…\n\n1. 安装\
    \ `openai` 包。\n\n```bash\n$ pip install openai\n```\n\n2. 构造 Python 脚本：\n\n```python\n\
    import os\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=os.environ.get(\"\
    OPENAI_API_KEY\"),\n)\n\ncompletion = client.chat.completions.create(\n    model=\"\
    gpt-4o\",\n    messages=[\n        {\n            \"role\": \"developer\",\n \
    \           \"content\": \"You are an AI assistant specialized in network engineering..\"\
    \n        },\n        {\n            \"role\": \"user\",\n            \"content\"\
    : \"How do I install WiFi 7?\",\n        },\n    ],\n)\nprint(completion.choices[0].message.content)\n\
    ```\n\n3. 观察输出：\n"
- fmt: "\n```python\n$ python ch01_hello_world.py\n```\nWiFi 7, also known as IEEE\
    \ 802.11be, is the next generation of WiFi technology designed to provide faster\
    \ data rates, improved efficiency, and enhanced capacity. As of my last update\
    \ in October 2023, WiFi 7 was in development and might not yet be widely available\
    \ in consumer products. However, if you're looking to install WiFi 7 when compatible\
    \ equipment becomes available, here are the general steps you would follow:\n\n\
    1. **Check for Compatibility:**\n   - Ensure that your devices (router, access\
    \ points, and client devices like smartphones, tablets, and laptops) support WiFi\
    \ 7. You may need to upgrade your hardware if it isn't compatible.\n   …\n\n##\
    \ How it works…\n\nIn the script, we use the `os` module to access the environment\
    \ variable for OpenAI API key as well as import the `openai` Python library and\
    \ initiate the client object.\n\nThe `client.chat.completion.create` is a method\
    \ sent to OpenAI's endpoint to generate a response. The `role` is similar to the\
    \ system message we have seen before in previous recipe, the `user` is the chat\
    \ message we sent to OpenAI.\n\n## There's more…\n\nOpenAI Python API Library,\
    \ [https://github.com/openai/openai-python](https://github.com/openai/openai-python),\
    \ provides more examples of the Python library.\n\n# Local AI Model Ollama\n\n\
    `Ollama` is an easy way to experiment with running language model locally.\n\n\
    ## Getting Ready\n\nEnsure you have an Ollama account, sign up at [https://ollama.com/signup](https://ollama.com/signup)\
    \ if you need to. Also make sure you have Docker Engine ([https://www.docker.com/](https://www.docker.com/))\
    \ and `docker-` ([https://docs.docker.com/compose/](https://docs.docker.com/compose/))\
    \ are installed on the machine you wish to run the images on.\n\n## How to do\
    \ it…\n\nThe Ollama site allows easy-to-download docker images that can switch\
    \ between models easily.\n\n1. Launch Docker engine, such as `docker.desktop`.\n\
    \n2. Write the docker-compose file with text editor, name it `docker-compose.yml`.\n\
    \n```yaml\nnetworks:\n  ollama:\n\nservices:\n  ollama:\n    image: ollama/ollama\n\
    \    networks:\n      - ollama\n    # deploy:\n    #   resources:\n    #     reservations:\n\
    \    #       devices:\n    #         - driver: nvidia\n    #           count:\
    \ 1\n    #         capabilities: [ gpu ]\n    volumes:\n      - ./data/ollama:/root/.ollama\n\
    \    ports:\n      - 11434:11434\n\n  ollama-webui:\n    image: ghcr.io/ollama-webui/ollama-webui:main\n\
    \    volumes:\n      - ./data/ollama-webui:/app/backend/data\n    depends_on:\n\
    \      - ollama\n    ports:\n      - 3002:8080\n    environment:\n      - 'OLLAMA_API_BASE_URL=http://ollama:11434/api'\n\
    \    extra_hosts:\n      - host.docker.internal:host-gateway\n    networks:\n\
    \      - Ollama\n```\n\n3. Launch the docker images and custom network with `docker-compose`\
    \ command:\n\n```bash\n$ docker-compose up\n✔ ollama-webui Pulled            \
    \                                        30.0s\n   ✔ f546e941f15b Pull complete\
    \                                            2.3s\n   ✔ 24935aba99a7 Pull complete\
    \                                            2.5s\n…\n✔ ollama Pulled        \
    \                                                 115.7s\n   ✔ 1b9f3c55f9d4 Pull\
    \ complete                                           14.9s\n✔ Network ollama-docker_ollama\
    \            Created                         0.0s\n ✔ Container ollama-docker-ollama-1\
    \        Created                         0.3s\n ✔ Container ollama-docker-ollama-webui-1\
    \  Created                         0.0s\nollama-webui-1  | INFO:     Application\
    \ startup complete.\nollama-webui-1  | INFO:     Uvicorn running on http://0.0.0.0:8080\
    \ (Press CTRL+C to quit)\n```\n\n4. Access the Ollama WebUI with [http://localhost:3002](http://localhost:3002)\n\
    \n![Image 17](images/B32646_1_17.png)\n\nFigure 1.16 –\n\n5. Use the `sign up`\
    \ link to create a local account, the initial account will have administrative\
    \ access.\n\n![Image 18](images/B32646_1_18.png)\n\nFigure 1.17 –\n\n6. Use [http://localhost:11434/](http://localhost:11434/)\
    \ to verify Ollama is running.\n\n![Image 19](images/B32646_1_19.png)\n\nFigure\
    \ 1.18 –\n\n7. Click on the `settings gear` to launch the settings menu.\n\n![Image\
    \ 20](images/B32646_1_20.png)\n\nFigure 1.19 –\n\n8. Choose `Models` and type\
    \ in `gemma3:1b` and click on the green download button to pull the model from\
    \ Ollama.\n\n![Image 21](images/B32646_1_21.png)\n\nFigure 1.20–\n\n9. Once the\
    \ model finishes download, we can choose the model from a list of dropdowns.\n\
    \n10. Ask a question in the chat box, such as \"What is Layer 1 of the OSI model?\"\
    \n\n![Image 22](images/B32646_1_22.png)\n\nFigure 1.21 –\n\n## How it works…\n\
    \nThere are two images involved in this recipe, `ollama` and `ollama-webui`. The\
    \ ollama images is where the model is located while `ollama-webui` provides a\
    \ management interface to easily manage the model download and a chat frontend.\n\
    \nOut of the box, there is no model installed on the docker image, we need to\
    \ search and install a model. We picked `gemma3:1b` model because it is relatively\
    \ small to download while still reasonable in its performance. There are so many\
    \ models to pick from, we can rely on the ranking of the model as well as the\
    \ model description to start picking the model we should work with. From the web\
    \ page, we can evaluate the model based on the number of pulls, size of the model,\
    \ and the number of parameters.\n\n![Image 23](images/B32646_1_23.png)\n\nWe can\
    \ also scroll down the model page to see the different version of the model, such\
    \ as text, vision, and others.\n\n![Image 24](images/B32646_1_24.png)\n\nFigure\
    \ 1.23\n\n## There's more…\n\nCheck out [https://ollama.com/](https://ollama.com/)\
    \ for more information on the models and other ways to launch local LLM models.\n\
    \n# Python Script with Ollama\n\nWe can use a Python script to programmatically\
    \ interact with the local Ollama LLM model.\n\n## Getting Ready\n\nUse the existing\
    \ Python virtual environment or create a new one and install the `ollama` Python\
    \ library:\n\n```bash\n$ python3 -m venv .venv\n$ source .venv/bin/activate\n\
    $ pip install ollama\n```\n\n## How to do it…\n\n1. Construct a simple Python\
    \ library:\n\n```python\nfrom ollama import Client\n\nclient = Client(host='http://localhost:11434')\n\
    response = client.chat(model='gemma3:1b', messages=[\n  {\n    'role': 'user',\n\
    \    'content': 'What is Layer 2 of the OSI model?',\n  },\n])\nprint(response['message']['content'])\n\
    ```\n\n2. Execute and observe the output:\n"
