    \ += \"Focus on Palo Alto firewall commands and web guidance.\"\nelse:\n    system_msg\
    \ += \"Provide vendor-neutral guidance.\"\nsystem_msg += \"Give concise, practical\
    \ answers with specific commands when relevant.\"\n```\n\n4. We can also change\
    \ our model to the `gpt-4.1` model.\n\n```python\nresponse = client.chat.completions.create(\n\
    \    model=\"gpt-4.1\",\n    messages=[\n        {\"role\": \"system\", \"content\"\
    : system_msg},\n        {\"role\": \"user\", \"content\": request.question}\n\
    \    ],\n    max_tokens=200\n)\nreturn {\n    \"answer\": response.choices[0].message.content,\n\
    \    \"device_type\": request.device_type\n}\n```\n\n5. Finally, we get to try\
    \ it out with our `curl` commands, we can get a list of supported vendors as well\
