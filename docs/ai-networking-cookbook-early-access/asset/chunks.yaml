    \ Documenation\n\n## How it works…\n\nFastAPI wraps our application in a function\
    \ that automatically handles HTTP requests, JSON serialization, and API documentation\
    \ generation. The `title` parameter sets the name whenever `title` is shown, such\
    \ as the documentation page.\n\n```python\napp = FastAPI(title=\"Network AI\"\
    )\n```\n\nOne of FastAPI's best features is its integration with Pydantic. In\
    \ the following code, if someone sends invalid data for `question`, such as wrong\
    \ type or missing value, Pydantic automatically validates the incoming JSON request\
    \ and FastAPI will generate an error message.\n\n```python\nclass QuestionRequest(BaseModel):\n\
    \    question: str\n```\n\nThe following section is the AI-magic where we craft\
    \ the prompt, specify the model, and parse out the response.\n\n```python\nresponse\
    \ = client.chat.completions.create(\n    model=\"gpt-3.5-turbo\",\n    messages=[\n\
    \        {\n            \"role\": \"system\",\n            \"content\": \"You\
    \ are a network engineer assistant.\n                        Give concise, practical\
    \ answers about\n                        network troubleshooting, configuration,\
    \ and                            performance issues.\"\n        },\n        {\"\
    role\": \"user\", \"content\": request.question}\n    ],\n    max_tokens=150\n\
    )\nreturn {\"answer\": response.choices[0].message.content}\n```\n\nThe import\
    \ at the end might look weird, but it is FastAPI's best practice. This only imports\
    \ `uvicorn` when needed (when running the file directly).\n\n```python\nif __name__\
    \ == \"__main__\":\n    import uvicorn\n    uvicorn.run(app, port=8000)\n```\n\
    \n## There's more…\n\nFor more verbose logging, we can use the following pattern\
    \ to document more information.\n\n```python\nimport logging\nlogging.basicConfig(level=logging.INFO)\n\
    @app.post(\"/ask\")\ndef ask_question(request: QuestionRequest):\n    logging.info(f\"\
    Question received: {request.question}\")\n```\n\n## See also…\n\nPlease see more\
    \ about FastAPI at [https://fastapi.tiangolo.com/](https://fastapi.tiangolo.com/).\n\
    \n# 7.2 Adding Device Context\n\nLet's enhance our AI application to include a\
    \ feature to give device-specific advice. This will give us more detailed answers\
    \ as the additional information will provide specific commands. This recipe is\
    \ meant to demonstrate how we can refactor our code to add more features.\n\n\
    ## Getting Ready\n\nPlease complete Recipe 7.1\n\n## How to do it…\n\n1. We will\
