    \ the response.\n\n    ![Image 8](images/B32646_1_8.png)\n\n    Figure 1.7 –\n\
    \n3.  Pick a different model, such as **gpt-4.1-nano** and ask the same question,\
    \ *How to configure* *VLAN* *on a Cisco* *IOS-XE* *device?* and observe the response.\n\
    \n4.  We can also see the response time difference between the two models. In\
    \ my run, the *gpt-4.1-nano* generated response in *1.542ms* while *gpt-4o* took\
    \ twice as long with *5.575ms* for the same question, the nano model was more\
    \ than twice as fast.\n\n    ![Image 9](images/B32646_1_9.png)\n\n    Figure 1.8\
    \ –\n\n5.  Use the modal selector to see the **Temperature**, **Max tokens**,\
    \ and **Top P** sliders.\n\n    ![Image 10](images/B32646_1_10.png)\n\n    Figure\
    \ 1.9 –"
