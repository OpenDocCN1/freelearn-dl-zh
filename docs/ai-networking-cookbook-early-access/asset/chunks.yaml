- fmt: "\n# Welcome to Packt Early Access\n\n# AI Networking Cookbook: Practical Recipes\
    \ for AI-Assisted Network Automation and Development\n\nWelcome to Packt Early\
    \ Access. We’re giving you an exclusive preview of this book before it goes on\
    \ sale. It can take many months to write a book, but our authors have cutting-edge\
    \ information to share with you today. Early Access gives you an insight into\
    \ the latest developments by making chapter drafts available. The chapters may\
    \ be a little rough around the edges right now, but our authors will update them\
    \ over time.\n\nYou can dip in and out of this book or follow along from start\
    \ to finish; Early Access is designed to be flexible. We hope you enjoy getting\
    \ to know more about the process of writing a Packt book.\n\n1. [Chapter 1](#Chapter_1.xhtml_h1_3):\
    \ The AI LLM Landscape and Key Parameters\n2. [Chapter 2](#Chapter_2.xhtml_h1_42):\
    \ OpenAI Recipes for Network Engineers\n3. [Chapter 3](#Chapter_3.xhtml_h1_71):\
    \ Prompt Engineering for Reliable Outputs\n4. [Chapter 4](#Chapter_4.xhtml_h1_103):\
    \ Local AI LLM Playground in Network Engineering\n5. [Chapter 7](#Chapter_5.xhtml_h1_139):\
    \ Building AI LLM Application Backends\n6. [Chapter 10](#Chapter_6.xhtml_h1_172):\
    \ Network Security Through Vibe Coding\n\n# 1: The AI LLM Landscape and Key Parameters\n\
    \nAI is changing the landscape of every technology field. Network engineering\
    \ is no exception.\n\nSpecifically, we will cover the following recipes in this\
    \ chapter:\n\n* Setting up OpenAI account\n* Experiment with OpenAI LLM Model\
    \ and Model Parameters\n* Script with OpenAI\n* Setting up local AI Ollama models\n\
    * Script with Ollama models\n\n# Join Eric Live for Build Intelligent Networks\
    \ with AI\n\nWant to go hands-on with the ideas in this book? Join Eric Chou for\
    \ a live, online workshop on January 24, 2026. We’ll dig into network design patterns,\
    \ real-world demos, and practical Q&A to help you ship faster, more reliable networks.\
    \ Seats are limited—secure your spot now: https://packt.link/buildnetworksai.\n\
    \nHands-on workshop in automation and observability\n\n![Image](images/B32646_1_1.png)\n\
    \n# Technical requirements\n\nThis chapter requires no prior knowledge on Artificial\
    \ Intelligence or Large Language Model. If additional technology is required for\
    \ a particular recipe, they will be mentioned in the recipe.\n\n# Setting Up OpenAI\
    \ Environment\n\nOpenAI is the dominate player when it comes to Large Languages\
    \ Models (LLM). Their ChatGPT application was arguably what kick started the artificial\
    \ intelligence (AI) movement in 2023, reaching 100 million users in only 2 months.\
    \ Before we can access OpenAI resources, such as experiment with playground and\
    \ make API requests, we will need to set up the developer environment.\n\nIn this\
    \ recipe, we will set up the OpenAI Environment to start using OpenAI services,\
    \ including generating the API key, familiarize with the settings page, and other\
    \ settings.\n\n## Getting Ready\n\nWe will need to create an OpenAI platform account;\
    \ this is not the same as OpenAI account. The OpenAI account are primarily used\
    \ for individual users to interact with OpenAI's AI model through a web interface\
    \ like ChatGPT. The OpenAI platform account, on the other hand, is designed for\
    \ developers to build application and services that leverage OpenAI's models.\n\
    \nNavigate to `https://platform.openai.com/` and sign in to your existing OpenAI\
    \ account. If you do not have an account, you can sign up for a free account with\
    \ an email address. You can also log in to OpenAI with a valid Google, Microsoft,\
    \ or Apple account.\n\nFollow the on screen instruction to complete the creation\
    \ of your account with steps of identity verification and payment setup.\n\n##\
    \ How to do it…\n\n1. Navigate to `https://platform.openai.com/settings/organization/`\
    \ and use the left navigation bar to create API Keys, create new Projects, check\
    \ usage, and other administrative tasks.\n\n   ![Image 2](images/B32646_1_2.png)\n\
    \n   Figure 1.1 – OpenAI Platform Settings\n\n2. Create an organization API key\
    \ on the `https://platform.openai.com/settings/organization/api-keys` page. Copy\
    \ the key in a safe place to be used later.\n\n   ![Image 3](images/B32646_1_3.png)\n\
    \n   Figure 1.2 – OpenAI Organization API Key Creation\n\n3. Use the top navigation\
    \ menu or link, `https://platform.openai.com/playground/`, to access OpenAI playground.\n\
    \n   ![Image 4](images/B32646_1_4.png)\n\n   Figure 1.3 – OpenAI Playground\n\n\
    4. Type in a question in the chat prompt and observe the answer from OpenAI.\n\
    \n   ![Image 5](images/B32646_1_5.png)\n\n   Figure 1.4 – OpenAI Chat Conversation\n\
    \n## How it works…\n\nThe playground and API are two of the key components we\
    \ will use in our development process. The playground is where we can learn and\
    \ experiment with different model settings, parameters, and the result. As shown\
    \ in Figure 1.5, the playground consists of system messages, chat input, and conversation.\
    \ Once we are happy with the result, we can use the API to programmatically interact\
    \ with models.\n\n![Image 6](images/B32646_1_6.png)\n\nFigure 1.5 – OpenAI Playground\n\
    \n## There's more…\n\nThe OpenAI platform is constantly changing with new parameters,\
    \ models. Navigate to the FAQ page, `https://platform.openai.com/docs/faq`, for\
    \ commonly asked questions. The web interface is a quick way to interact.\n\n\
    # Experiment with OpenAI LLM Model and Model Parameters\n\nThe OpenAI Playground\
    \ allows the user to select different models and tweak parameters. At the time\
    \ of writing, here are the general types:\n\n* Reasoning Models: o-series models\
    \ that excel at complex, multi-step tasks.\n* Chat Models: Original versatile,\
    \ high-intelligence models.\n* Cost-optimized Models: smaller, faster models that\
    \ cost less to run.\n* Realtime Models: Models capable of realtime text and audio\
    \ input.\n\nThe pricing of the models can be found on `https://platform.openai.com/docs/pricing`,\
    \ in increments of price per 1M tokens.\n\n## Getting Ready\n\nMake sure you are\
    \ logged in OpenAI playground and at the interface as shown in Figure 1.5.\n\n\
    ## How to do it…\n\n1. We can begin by selecting the model we want to use with\
    \ the drop-down menu. Let's select gpt-4o to start:\n\n   ![Image 7](images/B32646_1_7.png)\n\
    \n   Figure 1.6 –\n\n2. Type in the question How to configure VLAN on a Cisco\
    \ IOS-XE device? and observe the response.\n\n   ![Image 8](images/B32646_1_8.png)\n\
    \n   Figure 1.7 –\n\n3. Pick a different model, such as gpt-4.1-nano, and ask\
    \ the same question, How to configure VLAN on a Cisco IOS-XE device? and observe\
    \ the response.\n\n4. We can also see the response time difference between the\
    \ two models. In my run, the gpt-4.1-nano generated response in 1.542ms while\
    \ gpt-4o took twice as long with 5.575ms for the same question, the nano model\
    \ was more than twice as fast.\n\n   ![Image 9](images/B32646_1_9.png)\n\n   Figure\
    \ 1.8 –\n\n5. Use the modal selector to see the Temperature, Max tokens, and Top\
    \ P sliders.\n\n   ![Image 10](images/B32646_1_10.png)\n\n   Figure 1.9 –\n"
