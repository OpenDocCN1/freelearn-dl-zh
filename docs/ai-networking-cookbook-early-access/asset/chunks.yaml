- fmt: "\nAt the time of writing, there are generally two ways to 'vibe code'. The\
    \ first is to integrate the tool inside of the Integrated Development Environment\
    \ (IDE), and the other newer approach is to integrate the tool in the terminal.\
    \ Using the IDE is more familiar with folks who already uses IDE to write code,\
    \ while terminal is more universal (like on your mobile phone). We will illustrate\
    \ both approaches, using GitHub Copilot with VSCode for the first approach and\
    \ Anthropic Claude Code for the second approach.\n\nInformation: Please note that\
    \ at the time of writing, GitHub Copilot offers a free tier and `VSCode` is free\
    \ as well, but both are subject to change. `Claude Code` only has paid subscription\
    \ tiers at this time, but in my opinion well worth the price for what they offer.\n\
    \nThe field is quickly evolving, please check the resources for the latest pricing\
    \ and installation if you find them to be different than below:\n\n*   GitHub\
    \ Cop Copilot: [https://github.com/features/copilot](https://github.com/features/copilot)\n\
    *   Anthropic Claude Code: [https://www.anthropic.com/claude-code](https://www.anthropic.com/claude-code)\n\
    \nLet's start by setting up GitHub Copilot.\n\n# 10.1 Set Up GitHub Copilot\n\n\
    In this recipe, we will set up GitHub Copilot on our local computer.\n\n## Getting\
    \ Ready\n\nYou will need a computer capable of running `VSCode`. The screenshots\
    \ below are from Apple Mac computer, but instructions to install them on different\
    \ operating systems are readily available.\n\n## How to do it…\n\nGo to [https://code.visualstudio.com/](https://code.visualstudio.com/)\
    \ and the browser will check your Operating System and prompt you the appropriate\
    \ software to download, you can also click on the Download button on top right\
    \ corner for downloads.\n\n![Image 1](images/B32646_10_1.png)\n\nFigure 10.1:\
    \ Visual Studio Code Home Page\n\n1.  Visual Studio Code has always been a free\
    \ product since inception. At this time, GitHub Copilot also offers both a free\
    \ and multiple paid tiers.\n\n    ![Image 2](images/B32646_10_2.png)\n\n    Figure\
    \ 10.2: GitHub Copilot Pricing\n\n2.  Open up `VSCode` and click on the `Extension`\
    \ Tab, search for `GitHub` `Copilot` and click on `Install`.\n\n    ![Image 3](images/B32646_10_3.png)\n\
    \n    Figure 10.3: GitHub Copilot Extension\n\n3.  Once installed, you should\
    \ see the Copilot icon on the top. If the right panel is hidden, please use the\
    \ top right corner icon to display it. Look for the chat window once the right\
    \ panel is opened.\n\n    ![Image 4](images/B32646_10_4.png)\n\n    Figure 10.4:\
    \ Copilot Panel\n\n4.  In the chat box, look for the drop down menu to choose\
    \ between different modes: `Agent`, `Ask`, and `Edit`. We will switch between\
    \ Agent and Edit.\n\n    ![Image 5](images/B32646_10_5.png)\n\n    Figure 10.5:\
    \ Configure Modes\n\n5.  On the drop down box to the right, you can also find\
    \ the option to choose between different models, feel free to choose any standard\
    \ or premium models (premium models has a slight cost associated to them).\n\n\
    \    ![Image 6](images/B32646_10_6.png)\n\n    Figure 10.6: Model Selections\n\
    \n6.  Pick the `Ask` mode and `GPT-4.1` as the model. Ask a question, such as\
    \ `explain the structure of a JSON file`.\n\n    ![Image 7](images/B32646_10_7.png)\n\
    \n    Figure 10.7: Ask Mode with GPT-4.1\n\n7.  Switch to `Agent` mode with model\
    \ `GPT-4.1`. Type in instruction to create a virtual environment in the folder\
    \ you created for this chapter. For example, `please change to /home/ubuntu/ai_network_cookbook/ch10\
    \ and create a Python virtual environment named .venv.`.\n\nWARNING. Please be\
    \ careful with Agent mode, it WILL make changes on your behalf. There are usually\
    \ options to revers them, but not always. Please take extra precaution when you\
    \ are in Agent mode.\n\n1.  The agent will act on your behalf and make changes\
    \ if you click on `Continue` with the instruction. We can click on `Cancel` since\
    \ we already created the virtual environment manually.\n\n    ![Image 8](images/B32646_10_8.png)\n\
    \n    Figure 10.8: Agent Mode with GPT-4.1\n\n## How it works…\n\nThe Ask mode\
    \ is similar to having a AI LLM Chatbot directly in the IDE. Stick with the Ask\
    \ mode to begin with and copy and paste the code or commands manually. Be careful\
    \ with Agent mode, it will act on your behalf and make changes. There are usually\
    \ a 'confirm' or 'accept' options, but it is easier to make irreversible mistakes\
    \ in agent mode if we are not careful.\n\n## There's more…\n\nWe can include other\
    \ files and links to help with the answer. Click on the `Add Context` button and\
    \ we can choose from local files or other links to be included.\n\n![Image 9](images/B32646_10_9.png)\n\
    \nFigure 10.9: Add Context\n\n## See also…\n\nGitHub Copilot Tutorial: [https://github.com/features/copilot](https://github.com/features/copilot)\n\
    \n# 10.2 Set Up Claude Code\n\nHaving the ability to vibe code within IDE is great.\
    \ However, not every platform is suited to be able to run IDE (think of tablets\
    \ and phones) and not everyone is comfortable working in IDE.\n\nAnthropic ([https://www.anthropic.com/](https://www.anthropic.com/)),\
    \ the creator of the Claude LLM models, also created a vibe code tool called `Claude\
    \ Code` that operates directly in the terminal via `CLI`. At the time of writing,\
    \ Claude Code only have paid subscription model. Hopefully by the time you read\
    \ this Claude Code will have a free tier available.\n\n![Image 10](images/B32646_10_10.png)\n\
    \nFigure 10.10: Claude Code Pricing\n\n## Getting Ready\n\nPlease use your favorite\
    \ terminal window for this recipe.\n\n## How to do it…\n\n1.  Go to [https://docs.anthropic.com/en/docs/claude-code/overview#install-and-authenticate](https://docs.anthropic.com/en/docs/claude-code/overview#install-and-authenticate)\
    \ for the latest installation instruction.\n2.  Install `@anthropic-ai/claude-code`\
    \ via `npm`. If you do not have npm on your platform, please follow the instruction\
    \ here, [https://docs.npmjs.com/downloading-and-installing-node-js-and-npm](https://docs.npmjs.com/downloading-and-installing-node-js-and-npm),\
    \ for your operating system.\n\n    ```\n    # npm install -g @anthropic-ai/claude-code\n\
    \n    added 3 packages in 3s\n\n    2 packages are looking for funding\n\n   \
    \ run `npm fund` for details\n\n    npm notice\n\n    npm notice New major version\
    \ of npm available! 10.9.2 -> 11.5.2\n\n    npm notice Changelog: https://github.com/npm/cli/releases/tag/v11.5.2\n\
    \n    npm notice To update run: npm install -g npm@11.5.2\n\n    npm notice\n\
    \    ```\n"
  raw: "```\n\nAt the time of writing, there are generally two ways to 'vibe code'.\
