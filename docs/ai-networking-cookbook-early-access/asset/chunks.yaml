    \  \"object\": \"chat.completion\",\n  \"created\": 1752981163,\n  \"model\":\
    \ \"gpt-3.5-turbo-0125\",\n  \"choices\": [\n    {\n      \"index\": 0,\n    \
    \  \"message\": {\n        \"role\": \"assistant\",\n        \"content\": \"TCP\
    \ (Transmission Control Protocol) 和 UDP (User Datagram Protocol) 是计算机网络中最常用的两种传输层协议。以下是\
    \ TCP 和 UDP 之间的主要区别：\\n\\n1. **面向连接 vs 无连接**: TCP 是面向连接的，这意味着在数据传输之前，它会在发送者和接收者之间建立连接。另一方面，UDP\
    \ 是无连接的，数据可以在无需事先通信的情况下发送。\\n\\n2. **可靠性**: TCP 提供可靠的、经过错误检查的数据交付。它确保数据按正确顺序接收，并重传任何丢失的数据包。而\
    \ UDP 不保证数据包的交付或顺序。它被认为是不可靠的，但由于开销较小速度更快。\\n\\n3. **流量控制和拥塞控制**: TCP 包含流控和拥塞控制机制以管理数据传输速率并防止网络拥塞。UDP\
    \ 没有内置的流控或拥塞控制机制。\\n\\n4. **头部大小**:\",\n        \"refusal\": null,\n        \"\
    annotations\": []\n      },\n      \"logprobs\": null,\n      \"finish_reason\"\
    : \"length\"\n    }\n  ]\n}\n```\n\n3. 对于交互式应用或长响应，我们希望使用流式和无缓冲区（no-buffer）选项。\n\
    \n```bash\ncurl -X POST \"https://api.openai.com/v1/chat/completions\" -H \"Authorization:\
    \ Bearer $OPENAI_API_KEY\" -H \"Content-Type: application/json\" -d '{\n    \"\
    model\": \"gpt-3.5-turbo\",\n    \"messages\": [\n      {\n        \"role\": \"\
    system\",\n        \"content\": \"You are creating a comprehensive network security\
    \ checklist.\"\n      },\n      {\n        \"role\": \"user\",\n        \"content\"\
    : \"Create a detailed network security audit checklist for a mid-size company\
    \ with 500 employees, covering perimeter security, internal segmentation, and\
    \ monitoring.\"\n      }\n    ],\n    \"max_tokens\": 800\n}' --no-buffer\n```\n\
    \n响应太长，无法在此显示。但你应该看到比之前示例更多的流式输出。\n\n## 工作原理\n\n在步骤 1 中，作为一种安全实践，我们导出 `OPENAI_API_KEY`\
    \ 并将其创建为环境变量。如果我们启动另一个会话，我们需要重新创建它。对于 Windows 提示符，请使用 `set OPENAI_API_KEY=\"your-api-key\"\
    `。\n\n在步骤 2 中，我们向 `https://api.openai.com/v1/models` 发送 http GET 请求，`-v` 切换开启详细模式，在学习过程中为我们更多信息。`/v1/models`\
    \ 端点列出了所有可用模型。`-H` 指定要包含在请求中的头部。在这种情况下，我们使用 `Authorization: Bearer` 来指示身份验证的 HTTP\
    \ 头部，并在发送请求时使用 `$OPENAI_API_KEY` 指定实际值。`Content-Type: application/json` 告诉服务器我们以\
    \ JSON 格式发送数据。最后，`max-time 30` 设置了操作允许的最大时间。这主要是为了防止出现任何网络问题时会话挂起。\n\n在步骤 3 中，我们向\
    \ `https://api.openai.com/v1/chat/completions` 发送 http POST 请求，使用相同的授权和内容-类型 头部。然而，由于是\
    \ POST 请求，我们现在可以包含主体。主体包含了 model 和 messages。在消息内部，我们可以指定系统消息、用户消息、max tokens 以及温度。这些参数在第\
    \ 1 章之前的教程中涵盖过。\n\n在步骤 4 中，我们预期的响应将会很。在传统的 API 调用中，服务器将收集所有答案并一次性响应。对于较长的响应，可能需要\
    \ 30 秒。通过使用 `stream: true` 选项，我们能够立即看到响应，从而提升用户体验。\n\n## 更多内容\n\nCurl 是一个成熟且强大的命令行工具。我们在本教程中只涵盖了基础知识。如果你感兴趣，请随时研究后续主题：\n\
    \n- 高级 curl 特性，例如用于复杂配置的 `config`、用于重试逻辑的 `retry` 以及使用 `-o` 保存响应到文件。\n- 使用 shell\
    \ 脚本进行错误处理、日志记录和批量处理。\n- 使用 `jq` (https://jqlang.org/) 进行 JSON 输出处理。\n\n# 使用 Postman\
    \ 配合 OpenAI API\n\n涉及到 API 测试，curl 擅长剥离所有非本质项目（如图形界面）。但一旦我们熟悉了基本流程，我们可能想要转向具有更精细用户界面的完善工具。毕竟，每次都在命令行中输入选项选项可能不是你一天中最喜欢的活动。\n\
    \nPostman (https://www.postman.com/) 是处理 API 时的另一个流行工具。它通过引入用户友好的图形界面提升了你的 API\
    \ 测试能力。Postman 为 API 测试、开发和协作提供了专业级的界面。\n\n本教程涵盖了使用 Postman 配合 OpenAI 的基本功能，如环境变量管理、自动化测试和团队协作。\n\
    \n## 准备工作\n\n为了使用 Postman，我们需要使用 Postman Web 界面或下载适用于操作系统的应用程序。它有免费和付费层级。为了使用免费层，我们需要注册账户。如果你还没有账户，请访问\
    \ https://www.postman.com/account/ 创建一个。\n\nWeb 界面和应用程序界面在设计上相当。\n\n![Image 1](img/B32646_2_1.png)\n\
    图 2.1：Postman Web 界面\n\n这里是 Postman Mac 应用程序（Windows 类似）：\n\n![Image 2](img/B32646_2_2.png)\n\
    图 2.2：Postman App\n\n我发现 Postman 应用程序更容易操作，因此在本教程中我将使用 App 进行演示。如果你更喜欢，可以使用 Web\
    \ 界面。\n\n我们还需要准备好 OpenAI API key，如果你还没有，请参考第 1 章教程。\n\n## 如何操作\n\n1. 我们可以先为本教程创建一个专门的工作空间。\n\
    \    1. 点击左侧顶部导航菜单中的 Workspace 并选择创建新工作空间。有多个模板可选，但我们可以从“空白工作空间”开始。我将工作空间命名为“第\
    \ 2 章. 使用 Postman 测试 OpenAI。”![Image 3](img/B32646_2_3.png)\n    图 2.3：创建新工作空间\n\
    \n2. 通过点击左侧边栏中的“Environments”并选择“**Create Environment**”创建一个环境。创建后，我们可以使用三个点重命名此环境。在示例中，我们将此环境命名为“``OpenAI`\
    \ `网络工程` `– 测试`。”\n    ![Image 4](img/B32646_2_4.png)\n    图 2,4：创建环境\n\n3. 从左菜单通过“Collections”创建新集合，并确保我们选择了左上角创建的环境。\n\
    \    ![Image 5](img/B32646_2_5.png)\n    图 2.5：创建集合\n\n"
- fmt: "\n## 4. In the collection, we can save time by creating an authorization header\
    \ for `OPENAI_API_KEY` since we need to use it for every single API request.\n\
    \n![Image 6](images/B32646_2_6.png)\nFigure 2.6: Add Authorization Header\n\n\
    ## 5. We can also create global variable we can reference in our indivisual request.\
    \ Navigate to `Variables` and create a `base_url` variable with the value of `'https://api.openai.com.'`.\
    \ Make sure you click on the `Save` button on the top to save the changes.\n\n\
    ![Image 7](images/B32646_2_7.png)\nFigure 2.7: Collection Variables\n\n## 6. Click\
    \ on `Add a request`.\n\n![Image 8](images/B32646_2_8.png)\nFigure 2.8: Add Requests\n\
    \n## 7. For our first request, we can use the simple GET request to see a list\
    \ of models. We can name the request `model lists` and use `{{base_url}}` to reference\
    \ the collection-level variable for the base url, then append the `/v1/models`\
    \ to complete the full path. Since we entered the API key at the collection level,\
    \ we can simply click on `Send` and receive the response.\n\n![Image 9](images/B32646_2_9.png)\n\
    Figure 2.9: First GET Request\n\n## 8. Let's go ahead and make another request.\
    \ For this request, we want to change the type to POST with endpoint being `{{base_url}}/v1/chat/completions`.\n\
    \n![Image 10](images/B32646_2_10.png)\nFigure 2.10: B32646_02_10.png Chat Completion\
    \ Request\n\n## 9. We need to add an additional header for the `Content-Type`.\n\
    \n![Image 11](images/B32646_2_11.png)\nFigure 2.11: New Chat Completion Header\n\
    \n## 10. Under `Body`, we will use `Raw` and `JSON` format and type in the same\
    \ context we used before for chat completion.\n\n![Image 12](images/B32646_2_12.png)\n\
    Figure 2.12: New Chat Completion Request Body\n\n## 11. If everything is entered\
    \ correctly, after clicking on `Send`, we should be able to see the response we\
    \ have seen before.\n\n![Image 13](images/B32646_2_13.png)\nFigure 2.13: New Chat\
    \ Completion Response\n\n## How it works…\n\nThis recipe is pretty straight forward\
    \ as we did not introduce any new element to our request from the curl section.\
    \ The header, the body, and the responses were identical. What we did introduce\
    \ is the new Postman interface that is more user friendly and streamlined our\
    \ API calls into a hierarchical structure. We use environments to separate our\
    \ high-level environment such as testing, QA, and production. We also used collections\
    \ to separate group different API calls into their logical use cases.\n\nPostman\
    \ provides an easy way to inherent headers, such as the `OPENAI_API_KEY` authentication\
    \ header from collection to individual requests, thus saving us time and reduce\
    \ the chance of errors. The interface also allows us to easily modify the request\
    \ body if we need modify the parameters, such as the model type or temperature,\
    \ without needing to copy and paste or typing in the other unchanged parameters.\n\
    \nWhen OpenAI processes our request, it returns an HTTP response with status code\
    \ of 200 for success, 401 for authentication issues, and 500 for server errors.\
    \ With syntax highlighting, troubleshooting issues also becomes easier.\n\n##\
    \ There's more…\n\nPostman is very useful when it comes to API testing, for additional\
    \ challenges, please feel free to create more environment such as 'Production'\
    \ and 'QA.`. Within the environment create separate collections as applicable.\n\
    \n# Fine Tuning OpenAI Responses\n\nThe OpenAI LLM base model, sometimes referred\
    \ to as the Foundation model, is amazingly functional to handle most, if not all,\
    \ the tasks we throw at it. As we have seen so far, it is able to help us with\
    \ many general network engineering tasks, such as configuring vlans, assign IP\
    \ addresses, and change interface description.\n\nBut one thing they do not currently\
    \ do, as no out-of-the-box can do, is to personalize the feedback for our specific\
    \ organizational needs. For example, if our team want to always use the Loopback\
    \ 0 for the router-id when we configure BGP, the foundational model would not\
    \ know that.\n\nThe way we can customize OpenAI model for our specific needs is\
    \ to fine tune the OpenAI model. Fine-tuning allows us to teach OpenAI models\
    \ our organizationls specific network configuration standard, for example, so\
    \ we do not just get the generic configurations.\n\nIn this recipe, we will learn\
    \ how to prepare training data, execute the fine-tuning process, and validate\
    \ results to ensure the model reflect our company's standardize procedures.\n\n\
    ## Getting Ready\n\nPlease review [Chapter 1](#Chapter_1.xhtml_h1_3) recipe for\
    \ setting up OpenAI development environment, including using a Python virtual\
    \ environment, OpenAI API key, and installing the `openai` Python package.\n\n\
    ## How to do it…\n\n1. We will start by querying the default OpenAI model to generate\
    \ a BGP neighbor configuration, we will name this script, `recipe_3_01_test_model.py`.\n\
    \n```python\nimport os\nfrom openai import OpenAI\n\napi_key = os.getenv('OPENAI_API_KEY')\n\
    client = OpenAI(api_key=api_key)\n\nquery = \"Configure BGP for AS 6501 with neighbor\
    \ 192.168.1.2 in AS 6502\"\n\nresponse = client.chat.completions.create(\n   \
    \ model=\"gpt-3.5-turbo\",\n    messages=[\n        {\n            \"role\": \"\
    system\",\n            \"content\": \"You are a network engineer. Generate BGP\
    \ configuration.\"\n        },\n        {\n            \"role\": \"user\",\n \
    \           \"content\": query\n        }\n    ],\n    max_tokens=200,\n    temperature=0.1\n\
    )\n\nprint(\"BASE MODEL OUTPUT:\")\nprint(response.choices[0].message.content)\n\
    ```\n\n2. The result is a generic BGP configuration, nothing wrong with it, but\
    \ it is just about basic as it gets.\n\n```bash\n$ python recipe_3_01_test_base_model.py\n\
    BASE MODEL OUTPUT:\n\nrouter bgp 65001\n\nneighbor 192.168.1.2 remote-as 65002\n\
    ```\n\n3. Let's use a script to generate some training data, we will name this\
    \ script `recipe_3_02_create_training_data.py`. At the time of writing, OpenAI\
    \ requires at least 10 examples of training data, the output is saved in a file\
    \ named `bgp_training_data.jsonl`.\n"
