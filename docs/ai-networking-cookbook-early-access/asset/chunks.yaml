    \n    ```\n\n## How it works…\n\nFor this recipe, we have built a feedback loop\
    \ system that tracks conversation and improves responses iteratively. AI models\
    \ are good at context retention, which is why the iterative feedback approach\
    \ works. We started the example with a general requirement and gradually add specificity.\
    \ Then we point out the gaps to fix them, then finally make final adjustments.\n\
    \n## There's more…\n\nTry putting more categories:\n\n```\n\nstructured_feedback_template\
    \ = \"\"\"\n\nANALYSIS OF CURRENT RESPONSE:\n\nWhat works well: [specific positives]\n\
    \nWhat's missing: [specific gaps]\n\nWhat needs changing: [specific problems]\n\
    \nSPECIFIC IMPROVEMENTS NEEDED:\n\n1\\. Technical accuracy: [corrections needed]\n\
    \n2\\. Best practices: [standards to follow]\n\n3\\. Completeness: [missing components]\n\
    \n4\\. Environment-specific: [local requirements]\n\nPRIORITY:\n\n- Must have:\
    \ [critical requirements]\n\n- Should have: [important improvements]\n\n- Nice\
    \ to have: [optional enhancements]\n\nPlease revise the configuration addressing\
    \ the \"Must have\" items first.\n\n\"\"\"\n\n```\n\n## See also…\n\nSee the following\
    \ recipe, *Building* *Prompts* *Gradually*, which follows the same approach.\n\
    \n# Building Prompts Gradually\n\nAs we stated in the preceding recipe, *Providing\
    \ Feedback*, the prompt engineering process requires constant feedback. In some\
    \ complicated cases, we will deliberately build up the prompt gradually in order\
    \ to NOT overwhelm the AI LLM tool. Building complex prompts is similar to designing\
    \ a complex network or studying for a difficult certification exam, like CCIE.\
    \ In the design example, we would start with a basic technology that aims for\
    \ connectivity, satisfy the basic technical requirement (bandwidth, budget), then\
    \ layer on top with routing, security, and monitoring. In the studying for exam\
    \ example, we would start with the basic topics, then gradually layer on top the\
    \ more advanced technologies.\n\nIf we try to do too much, too fast, with the\
    \ AI LLM model, it often leads to confusion and suboptimal results.\n\nIn this\
    \ recipe, we will learn to construct prompts systematically, layer complexities\
    \ gradually until we reach our intended goal.\n\n## Getting Ready\n\nWe will use\
    \ the same OpenAI setup as the preceding recipe.\n\n## How to do it…\n\n1.  Start\
    \ with the basic requirements.\n\n    ```\n\n    #!/usr/bin/env python3\n\n  \
    \  import os\n\n    from openai import OpenAI\n\n    client = OpenAI(api_key=os.getenv(\"\
    OPENAI_API_KEY\"))\n\n    # Layer 1: Basic role and context\n\n    layer1 = \"\
    \"\"\n\n    You are a network engineer designing a simple branch office network.\n\
    \n    \"\"\"\n\n    # Layer 2: Basic task definition\n\n    layer2 = \"\"\"\n\n\
    \    Design a basic network configuration for a small branch office with 20 users.\n\
    \n    The office needs internet connectivity and basic network services.\n\n \
    \   \"\"\"\n\n    # Layer 3: Technical requirements for reachability\n\n    layer3\
    \ = \"\"\"\n\n    REQUIREMENTS:\n\n    - 1 router (Cisco ISR 4321)\n\n    - 1\
    \ switch (Cisco Catalyst 9200-24P)\n\n    - Internet connection via ISP\n\n  \
    \  - Internal network: 192.168.10.0/24\n\n    - DHCP for user devices\n\n    -\
    \ Basic routing configuration\n\n    Provide the complete configuration for both\
    \ devices.\n\n    \"\"\"\n\n    # Build the complete prompt gradually\n\n    complete_prompt\
    \ = f\"{layer1}\\n\\n{layer2}\\n\\n{layer3}\"\n\n    print(\"=== GRADUAL PROMPT\
    \ BUILDING - BASIC REACHABILITY ===\")\n\n    print(\"Complete prompt:\")\n\n\
    \    print(complete_prompt)\n\n    print(\"\\n\" + \"=\"*60 + \"\\n\")"
