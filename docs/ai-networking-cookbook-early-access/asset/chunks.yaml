    \ -H \"Content-Type: application/json\" -d '{\n  \"model\": \"simple-network\"\
    ,\n  \"prompt\": \"configure vlan 20\",\n  \"stream\": true\n}' | jq -r '.response'\
    \ | tr -d '\\n'\n```\n<output skipped>\nThe following is a sample configuration\
    \ for VLAN 20.\n```\nswitch(config)#vlan 20\nswitch(config-vlan)#name MyVLAN\n\
    switch(config-vlan)#exit\nswitch(config)#interface vlan 20\nswitch(config-if)#ip\
    \ address 192.168.10.1 255.255.255.0\n```\nThe following is a sample configuration\
    \ for VLAN 30.\n```\nswitch(config)#vlan 30\nswitch(config-vlan)#name MyVLAN\n\
    switch(config-vlan)#exit\nswitch(config)#interface vlan 30\nswitch(config-if)#ip\
    \ address 192.168.11.1 255.255.255.0\n```\nThe following is a sample configuration\
    \ for VLAN 40.\n```\nswitch(config)#vlan 40\nswitch(config-vlan)#name MyVLAN\n\
    switch(config-vlan)#exit\n```\n\n## 6. We can also pick the newly created model\
    \ and generate the configuration from the WebUI.\n\n![Image 5](images/B32646_4_5.png)\n\
    \nFigure 4.5: New Model Interaction in Ollama-WebUI\n\n## How it works…\n\nLet's\
    \ break down the steps to see how we transformed the base CodeLlama model to customize\
    \ with our network data. When we asked the original general purpose CodeLlama\
    \ model to generate configuration for 'vlan 50', it might generate generic configuration\
    \ syntax and mix different vendors.\n\nIn our model file, we use custom system\
    \ injection to change the model's behavior:\n\n```text\n# Simple system context\n\
    SYSTEM \"\"\"\n\nYou are a network automation expert focusing on Cisco devices.\n\
    \nYour expertise includes:\n- Cisco IOS configuration syntax\n- VLAN configuration\
    \ and management\n- Interface configuration with IP addressing\n- Basic routing\
    \ configuration\n- Python automation using netmiko library\n- Network device monitoring\
    \ and verification\n\nAlways provide:\n- Accurate Cisco IOS syntax\n- Proper error\
    \ handling in Python scripts\n- Clear and concise configurations\n- Working automation\
    \ code\n\nFocus on practical, immediately usable solutions for network engineers.\n\
    \n\"\"\"\n```\n\nThe system context establishes the context and prime the model\
    \ to think like a network engineer and sets the expectation to receive the training\
    \ data in Cisco-specific syntax and conventions.\n\nThe parameter tuning also\
    \ played a part in the output:\n\n```text\nPARAMETER temperature 0.1\nPARAMETER\
    \ top_p 0.9\nPARAMETER repeat_penalty 1.1\n```\n\nThe lower the temperature the\
    \ more deterministic the responses are, this is what we prefer since we want the\
    \ output to be precise and not creative. The `Top_p` specifies the most likely\
    \ word and reduce randomness. The `Repeat_penalty` prevents the model from getting\
    \ stuck in loops or repeating commands.\n\nThe response template specified the\
    \ return output:\n\n```text\nTEMPLATE \"\"\"{{ if .System }}<|start_header_id|>system<|end_header_id|>\n\
    \n{{ .System }}<|eot_id|>{{ end }}{{ if .Prompt }}<|start_header_id|>user<|end_header_id|>\n\
    \nNetwork Task: {{ .Prompt }}\n\n<|eot_id|>{{ end }}<|start_header_id|>assistant<|end_header_id|>\n\
    \n{{ .Response }}<|eot_id|>\"\"\"\n```\n\nThis template ensures consistent formatting\
    \ for the same structure with the `Network Task` prefix reminds the model of its\
    \ role.\n\n## There's more…\n\nWe can tweak the parameters to experiment with\
    \ different model parameters:\n\n```text\nPARAMETER temperature 0.05  # More deterministic\n\
    PARAMETER top_p 0.95        # More creative\nPARAMETER num_ctx 8192      # Longer\
    \ context window\n```\n\nAs we have seen in previous recipes, we can change the\
    \ level of the deterministic level the response would be with the `temperature`\
    \ parameter. In addition, the `top_n` and `num_ctx` allow us to change the creativity\
    \ and context window, respectively.\n\n# 4.6 Using Local LLM for Network Documentation\
    \ Generation\n\nThis recipe demonstrates how to automatically generate network\
    \ documentation from a configuration.\n\n## Getting Ready\n\nPlease make sure\
