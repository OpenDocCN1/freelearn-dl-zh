    2. We will add an additional parameter of `device_type` in our `QuestionRequest`\
    \ class.\n\n```python\nclass QuestionRequest(BaseModel):\n    question: str\n\
    \    device_type: str = \"generic\"\n```\n\n3. We can add an if-else loop to modify\
    \ our prompt.\n\n```python\nif request.device_type.lower() == \"cisco\":\n   \
    \ system_msg += \"Focus on Cisco/IOS-XE commands and syntax. Provide specific\
