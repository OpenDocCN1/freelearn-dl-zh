  trans: "\n\n```python\n$ python ch01_hello_world.py\n```\nWiFi 7 也称为 IEEE 802.11be，是下一代\
    \ WiFi 技术，旨在提供更快的数据速率、更高的效率和增强容量。截至我 2023 年 10 月的最后更新，WiFi 7 仍在开发中，可能尚未在消费产品中广泛可用。然而，如果你想在兼容设备可用后安装\
    \ WiFi 7，以下是你需要遵循的通用步骤：\n\n1. **检查兼容性：**\n   - 确保你的设备（路由器、访问点以及手机、平板电脑和笔记本电脑等客户端设备）支持\
    \ WiFi 7。如果不兼容，你可能需要升级硬件。\n   …\n\n## 工作原理…\n\n在脚本中，我们使用 `os` 模块来访问 OpenAI API\
    \ 密钥的环境变量，并导入 `openai` Python 库并初始化客户端对象。\n\n`client.chat.completion.create` 是发送到\
    \ OpenAI 端点以生成响应的方法。`role` 类似于我们在之前的配方中见过的系统消息，`user` 是我们发送给 OpenAI 的聊天消息。\n\n\
    ## 更多内容…\n\nOpenAI Python API 库 [`github.com/openai/openai-python`](https://github.com/openai/openai-python)\
    \ 更多 Python 库的示例。\n\n# 本地 AI 模型 Ollama\n\n`Ollama` 是一种在本地运行语言模型的简单方法。\n\n## 准备工作\n\
    \n确保你有一个 Ollama 账户，如果需要，请在 [`ollama.com/signup`](https://ollama.com/signup) 注册。同时确保在你想要运行的的上安装了\
    \ Docker Engine ([`www.docker.com/`](https://www.docker.com/)) 和 `docker-compose`\
    \ ([`docs.docker.com/compose/`](https://docs.docker.com/compose/))。\n\n## 操作步骤\n\
    \nOllama 提供了易于下载的 docker 镜像，可以在模型之间轻松切换。\n\n1. 启动 Docker 引擎，例如 `docker.desktop`。\n\
    \n2. 使用文本编辑器编写 docker-compose 文件，命名为 `docker-compose.yml`。\n\n```yaml\nnetworks:\n\
    \  ollama:\n\nservices:\n  ollama:\n    image: ollama/ollama\n    networks:\n\
    \      - ollama\n    # deploy:\n    #   resources:\n    #     reservations:\n\
    \    #       devices:\n    #         - driver: nvidia\n    #           count:\
    \ 1\n    #         capabilities: [ gpu ]\n    volumes:\n      - ./data/ollama:/root/.ollama\n\
    \    ports:\n      - 11434:11434\n\n  ollama-webui:\n    image: ghcr.io/ollama-webui/ollama-webui:main\n\
    \    volumes:\n      - ./data/ollama-webui:/app/backend/data\n    depends_on:\n\
    \      - ollama\n    ports:\n      - 3002:8080\n    environment:\n      - 'OLLAMA_API_BASE_URL=http://ollama:11434/api'\n\
    \    extra_hosts:\n      - host.docker.internal:host-gateway\n    networks:\n\
    \      - Ollama\n```\n\n3. 使用 `docker-compose` 命令启动 docker 镜像和自定义网络：\n\n```bash\n\
    $ docker-compose up\n✔ ollama-webui Pulled                                   \
    \                 30.0s\n   ✔ f546e941f15b Pull complete                     \
    \                       2.3s\n   ✔ 24935aba99a7 Pull complete                \
    \                            2.5s\n…\n✔ ollama Pulled                        \
    \                                 115.7s\n   ✔ 1b9f3c55f9d4 Pull complete    \
    \                                       14.9s\n✔ Network ollama-docker_ollama\
    \            Created                         0.0s\n ✔ Container ollama-docker-ollama-1\
    \        Created                         0.3s\n ✔ Container ollama-docker-ollama-webui-1\
    \  Created                         0.0s\nollama-webui-1  | INFO:     Application\
    \ startup complete.\nollama-webui-1  | INFO:     Uvicorn running on http://0.0.0.0:8080\
    \ (Press CTRL+C to quit)\n```\n\n4. 通过 [`localhost:3002`](http://localhost:3002)\
    \ 访问 Ollama WebUI\n\n![Image 17](img/B32646_1_17.png)\n\n图 1.16 –\n\n5. 使用 `sign\
    \ up` 链接创建本地账户，初始账户将具有管理权限。\n\n![Image 18](img/B32646_1_18.png)\n\n图 1.17 –\n\n\
    6. 使用 [`localhost:11434/`](http://localhost:11434/) 验证 Ollama 正在运行。\n\n![Image\
    \ 19](img/B32646_1_19.png)\n\n图 1.18 –\n\n7. 点击 `settings gear`（设置齿轮）启动设置菜单。\n\
    \n![Image 20](img/B32646_1_20.png)\n\n图 1.19 –\n\n8. 选择 `Models` 并输入 `gemma3:1b`，点击绿色下载按钮从\
    \ Ollama 拉取模型。\n\n![Image 21](img/B32646_1_21.png)\n\n图 1.20–\n\n9. 一旦模型完成下载，我们就可以从下拉列表中选择模型。\n\
    \n10. 在聊天框中提问，例如“OSI 模型的第 1 层是什么？”\n\n![Image 22](img/B32646_1_22.png)\n\n图 1.21\
    \ –\n\n## 工作原理…\n\n此配方涉及两个镜像：`ollama` 和 `ollama-webui`。`ollama` 镜像是模型所在的地方，而 `ollama-webui`\
    \ 提供了一个管理界面，用于方便地管理模型下载和聊天前端。\n\n默认情况下，docker 镜像中没有安装模型，我们需要搜索并安装模型。我们选择了 `gemma3:1b`\
    \ 模型，因为它下载相对较小，同时性能仍然合理。有很多模型可供选择，我们可以根据模型的排名以及模型描述来开始选择我们要使用的模型。从网页上，我们可以根据下载次数、模型大小和参数数量来评估模型。\n\
    \n![Image 23](img/B32646_1_23.png)\n\n我们还可以向下滚动模型页面查看不同版本的模型，例如文本、视觉等。\n\n![Image\
    \ 24](img/B32646_1_24.png)\n\n图 1.23\n\n## 更多内容…\n\n访问 [`ollama.com/`](https://ollama.com/)\
    \ 获取有关模型和其他启动本地 LLM 模型方法的更多信息。\n\n# Ollama Python 脚本\n\n我们可以使用 Python 脚本与本地 Ollama\
    \ LLM 模型进行交互。\n\n## 准备工作\n\n使用现有的 Python 虚拟环境或创建一个并安装 `ollama` Python 库：\n\n```bash\n\
    $ python3 -m venv .venv\n$ source .venv/bin/activate\n$ pip install ollama\n```\n\
    \n## 操作步骤\n\n1. 构建一个简单的 Python ：\n\n```python\nfrom ollama import Client\n\nclient\
    \ = Client(host='http://localhost:11434')\nresponse = client.chat(model='gemma3:1b',\
    \ messages=[\n  {\n    'role': 'user',\n    'content': 'OSI 模型的第 2 层是什么？',\n \
    \ },\n])\nprint(response['message']['content'])\n```\n\n2. 执行并观察输出：\n\n"
- fmt: "\n```bash\n$ python example_1.py\n```\n\nLayer 2 of the OSI model is the `Data\
    \ Link Layer`. It's the layer closest to the user and responsible for reliable\
    \ transfer of data between two directly connected nodes – like your computer and\
    \ your router – within a local network (like your home or office network).\n\n\
    Here's a breakdown of what it does and its key functions:\n\n1. **Focus:** Reliable\
    \ data delivery over a physical link.\n\n2. **Key Functions:**\n\n* **Physical\
    \ Addressing:** Layer 2 uses `MAC` (Media Access Control) addresses to identify\
    \ devices on the local network. This allows devices to communicate directly without\
    \ needing to understand the IP address.\n* **Error Detection and Correction:**\
    \ It implements mechanisms to detect and correct errors that occur during transmission,\
    \ ensuring data integrity.\n* **Framing:** It packages data into frames, which\
    \ are the basic units of transmission over a network. This includes things like\
    \ header and trailer information.\n* **Logical Addressing:** While it doesn't\
    \ have IP addresses, it uses `MAC` addresses for identification and manages the\
    \ flow of data within a network segment.\n* **Media Access Control (MAC) Protocols:**\
    \ This is a `critical` function. Layer 2 protocols like `Ethernet` and `Wi-Fi`\
    \ dictate how devices on the local network share the network medium. It manages\
    \ collisions and ensures that devices don't interfere with each other.\n\n3. Replace\
    \ the content with other network engineering related questions.\n\n## How it works…\n\
    \nThe script demonstrates how to interact with a local AI Ollama server. It uses\
    \ the `ollama` `Python library` to query the model `gemma3:1b` we installed. We\
    \ initiated the `client` object to communicate with the server at port `11434`.\n\
    \nThe `client.chat` method is used to send a conversation to the AI model and\
    \ received a response.\n\n## There's more…\n\nCheck out [https://github.com/ollama/ollama-python](https://github.com/ollama/ollama-python)\
    \ for more information on Ollama Python library.\n\n# OpenAI Recipes for Network\
    \ Engineers\n\nIn [Chapter 1], we discussed various ways to set up our environment,\
    \ including development environment for OpenAI, the company many perceived as\
    \ started the AI LLM revolution. OpenAI's large language model (LLM) offers network\
    \ engineers a powerful toolkit to automate routine tasks, generate topology, device\
    \ configuration, and provide expert-level assistance in many other areas.\n\n\
    In this chapter, we will dive deeper into using OpenAI's models to help us work\
    \ on tasks within the network engineering context.\n\nThis chapter provides five\
    \ recipes that progressively build your expertise in leveraging OpenAI's capabilities\
    \ for network engineering tasks. We will experiment with different tools, such\
    \ as `curl` and `postman`, as well as leveraging OpenAI's test-to-image capabilities.\
    \ Specifically, we will cover the following recipes:\n\n* Using Curl for OpenAI\
    \ API Communications\n* Using Postman with OpenAI API\n* Fine tuning OpenAI models\n\
    * Generating Network Topology with OpenAI\n* Generating Methods of Procedures\
    \ (MOP) with OpenAI\n\nAs we saw from [chapter 1], OpenAI's offerings are cloud-based,\
    \ they have never officially provided locally hosted versions of their modern\
    \ models such as `GPT-3` or `GPT-4`. They did, at one point, provided an open-source\
    \ version of the model, `GPT-2`, that can be run locally, but this is an older,\
    \ much limited model compare to their current offerings. Therefore, in this chapter,\
    \ we will focus on the cloud-based offerings.\n\n# Technical requirements\n\n\
    This chapter builds on recipes in [Chapter 1] when we set up OpenAI environment,\
    \ such as signing up for an account, generating the API key, and understanding\
    \ the different parameters. If you are unfamiliar with them, please review them\
    \ before moving on to this chapter's recipes.\n\n# Using Curl for OpenAI API Communication\n\
    \n`curl` ([https://github.com/curl/curl](https://github.com/curl/curl)) is one\
    \ of the most ubiquitous command line tools when it comes to testing API communications.\
    \ It allows to learn about the fundamentals of API communication with OpenAI such\
    \ as establish connectivity, handle authentication, and process responses directly\
    \ in the command line interface.\n\n## Getting Ready\n\nFor many Linux distributions,\
    \ `curl` is installed by default. We can check if that is the case with the `curl`\
    \ command:\n\n```bash\n$ curl --version\ncurl 8.5.0 (x86_64-pc-linux-gnu) libcurl/8.5.0\
    \ OpenSSL/3.0.13 zlib/1.3 brotli/1.1.0 zstd/1.5.5 libidn2/2.3.7 libpsl/0.21.2\
    \ (+libidn2/2.3.7) libssh/0.10.6/openssl/zlib nghttp2/1.59.0 librtmp/2.3 OpenLDAP/2.6.7\n\
    ```\n\nHowever if it is not already installed, you can find the installation instruction\
    \ on [https://curl.se/docs/install.html](https://curl.se/docs/install.html).\n\
    \nObtain OpenAI keys and have it ready to go (see 'Setting Up OpenAI Environment'\
    \ and 'Python Script with OpenAI' from [Chapter 1]).\n\n## How to do it…\n\n1.\
    \ Export OpenAI API key as environment variable.\n\n```bash\nexport OPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\n2. Let's make an API call to list all the available\
    \ models.\n\n```bash\ncurl -v https://api.openai.com/v1/models -H \"Authorization:\
    \ Bearer $OPENAI_API_KEY\" -H \"Content-Type: application/json\"\n```\n\nWe should\
    \ see a list of available models, your output might be different if there are\
    \ models offered at time of execution:\n\n```bash\n$ curl -v https://api.openai.com/v1/models\
    \ -H \"Authorization: Bearer $OPENAI_API_KEY\" -H \"Content-Type: application/json\"\
    \n* api.openai.com:443 resolved.\n* IPv6: (none)\n* IPv4: 162.159.40.25, 172.66.0.23\n\
    * Trying 162.159.40.25:43...\n* Connected to api.openai.com (162.159.40.25) port\
    \ 43\n* ALPN: curl h2/1.1\n…\n{\n  \"object\": \"list\",\n  \"data\": [\n    {\n\
    \      \"id\": \"gpt-4-063\",\n      \"object\": \"model\",\n      \"created\"\
    : 168588896,\n      \"owned_by\": \"openai\"\n    },\n    {\n      \"id\": \"\
    gpt-4\",\n      \"object\": \"model\",\n      \"created\": 168782411,\n      \"\
    owned_by\": \"openai\"\n    },\n    {\n      \"id\": \"gpt-3.5-turbo\",\n    \
    \  \"object\": \"model\",\n      \"created\": 167761062,\n      \"owned_by\":\
    \ \"openai\"\n    },\n    …\n    {\n      \"id\": \"ft:gpt-3.5-turbo-0125::9FZ8Mnc\"\
    ,\n      \"object\": \"model\",\n      \"created\": 1713497002,\n      \"owned_by\"\
    : \"network-automation-nerds\"\n    }\n  ]\n* Connection #0 to host api.openai.com\
    \ intact\n```\n\nRemember we were able to influence OpenAI's response via system\
    \ messages, user prompt, and temperature? We can also use them with curl.\n\n\
    ```bash\n$ curl -X POST \"https://api.openai.com/v1/chat/completions\" \\\n  -H\
    \ \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\"\
    \ \\\n  -d '{\n    \"model\": \"gpt-3.5-turbo\",\n    \"messages\": [\n      {\n\
    \        \"role\": \"system\",\n        \"content\": \"You are a senior network\
    \ engineer with 15 years of experience. Provide technical, accurate responses\
    \ with practical examples.\"\n      },\n      {\n        \"role\": \"user\",\n\
    \        \"content\": \"Explain the difference between TCP and UDP, including\
    \ when to use each in network applications.\"\n      }\n    ],\n    \"temperature\"\
    : 0.3\n  }'\n```\n\nWe should receive a response similar to the one below:\n"
