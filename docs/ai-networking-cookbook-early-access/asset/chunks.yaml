    \ 162.159.40.25:43...\n* Connected to api.openai.com (162.159.40.25) port 43\n\
    * ALPN: curl h2/1.1\n…\n{\n  \"object\": \"list\",\n  \"data\": [\n    {\n   \
    \   \"id\": \"gpt-4-063\",\n      \"object\": \"model\",\n      \"created\": 168588896,\n\
    \      \"owned_by\": \"openai\"\n    },\n    {\n      \"id\": \"gpt-4\",\n   \
