    \ == \"succeeded\":\n        print(f\"Fine-tuning completed: {job_status.fine_tuned_model}\"\
    )\n        with open('fine_tuned_model_id.txt', 'w') as f:\n            f.write(job_status.fine_tuned_model)\n\
    \        break\n    elif job_status.status in [\"failed\", \"cancelled\"]:\n \
    \       print(f\"Fine-tuning {job_status.status}\")\n        break\n\n    time.sleep(30)\n\
    ```\n\n5. 当我们执行上述脚本时，将需要 10 到 30 分钟不等。最后，我们将获得微调后的模型 ID，并将该 ID 保存到名为 `fine_tuned_model_id.txt`\
    \ 的文件中，以供后续步骤使用。\n\n```bash\n$ python recipe_3_03_create_fine_tuned_model.py\n\
    Uploading training data...\nFile uploaded: file-QFBjPJCse6L9Zfbtan5A\nStarting\
    \ fine-tuning job...\nFine-tuning job created: ftjob-TlSBbLCxyQ2NS6qqfHRSa\nWaiting\
    \ for completion...\n[note. 这需要一些时间]\nFine-tuning completed: ft:gpt-3.5-turbo-0125:network-automation-nerds:bgp-standards:BvTBFsu\n\
    ```\n\n6. 我们将能够在 OpenAI 的控制台上查看微调模型的进度以及成功/失败情况。\n\n![Image 14](img/B32646_2_14.png)\n\
    \n图 2.14: OpenAI 微调模型\n\n7. 我们将使用以下脚本，`recipe_3_04_test_fine_tuned_model.py` 来查询新的微调模型。\n\
    \n```python\nimport os\nfrom openai import OpenAI\n\napi_key = os.getenv('OPENAI_API_KEY')\n\
    client = OpenAI(api_key=api_key)\n\nwith open('fine_tuned_model_id.txt', 'r')\
    \ as f:\n    fine_tuned_model = f.read().strip()\n\nquery = \"Configure BGP for\
    \ AS 65001 with neighbor 192.168.1.2 in AS 65002\"\n\nresponse = client.chat.completions.create(\n\
    \    model=fine_tuned_model,\n    messages=[\n        {\"role\": \"system\", \"\
    content\": \"You are a network engineer. Always use Loopback0 for BGP router-id\
