    \n# 7.5 Docker Deployment\n\nIn this recipe, we will package our Network AI Assistant\
    \ app into a Docker container so it and be run anywhere.\n\n## Getting Ready\n\
    \nPlease make sure Recipe 7.4 is completed and Docker is installed.\n\n## How\
    \ to do it…\n\n1. Create a Docker file named `dockerfile`. Note that we used `main_v4.py`\
    \ but you can use earlier version as well.\n\n```\nFROM python:3.11-slim\nWORKDIR\
    \ /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY main_v4.py\
    \ .\nEXPOSE 8000\nCMD [\"python\", \"main_v4.py\"]\n```\n\n2. For the FastAPI\
    \ file, we only listened to localhost in our `uvicorn` configuration, we will\
    \ need to change that to listen on all interfaces.\n\n```\nif __name__ == \"__main__\"\
    :\n    import uvicorn\n    uvicorn.run(app, host=\"0.0.0.0\", port=8000)\n```\n\
    \n3. Create `requiremetns.txt` file.\n\n```\nfastapi\nuvicorn\nopenai\nsqlalchemy\n\
    python-multipart\n```\n\n4. Build the container image with `docker build -t <name>\
    \ .` in the terminal.\n\n```\n$ docker build -t network-ai .\n[+] Building 6.2s\
    \ (7/9)                                    docker:default\n => => resolve docker.io/library/python:3.11-slim@sha256:0ce77749ac\
    \  0.0s\n => => sha256:f3bfd8e9386c2a97d52a0f28a4cc8db81b034 5.37kB / 5.37kB \
    \ 0.0s\n => => sha256:59e22667830bf04fb35e15ed9c70023e9d1 28.23MB / 28.23MB  0.4s\n\
    \ => => sha256:abd846fa1cdb2ae1ef7731213cd4f0c40b05f 3.51MB / 3.51MB  0.1s\n =>\
    \ => sha256:b7b61708209ad8f9b9a11c61dc9df90f74c 16.21MB / 16.21MB  0.3s\n```\n\
    \n5. run containers with `OPENAI_API_KEY`.\n\n```\n$ docker run -p 8000:8000 -e\
    \ OPENAI_API_KEY=\"your-openai-key\" network-ai\n/app/main_v4.py:14: MovedIn20Warning:\
    \ declarative_base() function is now available as sqlalchemy.orm.declarative_base().\
    \ (deprecated since: 2.0) (Background on SQLAlchemy 2.0 at https://sqlalche.me/e/b8d9)\n\
    \  Base = declarative_base()\nINFO:     Started process [1]\nINFO:     Waiting\
    \ for application.\nINFO:     Application startup.\nINFO:     Uvicorn running\
    \ on http://127.0.0.1:8000 (Press CTRL+C to quit)\n```\n\n6. We should see the\
    \ same web interface at port 8000.\n\n![Image 5](images/B3264_7_5.png)\nFigure\
    \ 7.5: Web Interface from Container\n\n7. Test the containerized AI Network Assistant.\n\
    \n```\n$ curl -X POST \"http://127.0.0.1:8000/ask\" -H \"Content-Type: application/json\"\
    \ -d '{\"question\": \"How do I configure VLANs on a switch?\", \"device_type\"\
    : \"cisco\"}'\n{\"answer\":\"To configure VLANs on a Cisco, follow these steps:\\\
    n1. Enter global configuration:\\n```\nenable\nconfigure terminal\n```\n2. Create\
    \ VLANs and assign names to them:\\n```\nvlan <vlan_id>\nname <vlan_name>\n```\n\
    3. Assign interfaces to VLANs:\\n```\ninterface <interface_type> <interface_number>\n\
    switchport mode access\nswitchport access vlan <vlan_id>\n```\n4. Exit configuration\
    \ mode and save the configuration:\\n```\nend\nwr\n```\n5. Verify the VLAN configuration:\\\
    n```\nshow vlan\nshow interfaces\n```\",\"device_type\":\"cisco\"}\n```\n\n##\
    \ How it works…\n\nThis is a pretty standard workflow for building Docker containers:\n\
    \n1. Create `Dockerfile`.\n2. Create `requirements.txt`.\n3. Build and run container,\
    \ add environment variable as required.\n4. Test the containerized application.\n\
    \nOnce we containerized our application, we can move it to lots of providers such\
    \ as DigitalOcean, AWS, or Azure.\n\n## There's more…\n\nSee [Chapter 4](#Chapter_4.xhtml_h1_10)\
    \ technical requirements for Docker installation.\n\n## Summary\n\nIn this chapter,\
    \ we built a complete AI-powered backend with a simple web interface that our\
    \ frontend team can use. As any developer would tell you, the work is never done.\
    \ We are constantly adding more data, more business logic, and demand to the application.\
    \ It also seems like every week there is a new JavaScript frontend library that\
    \ the \"hotness\" that puts additional requirements to the backend application.\n\
    \nPython is known to have a robust ecosystem of backend web frameworks, including\
    \ Django and FastAPI. As a mature ecosystem, there are constant features to be\
    \ added, bug fixed, and more ways to optimize our code. This chapter serves as\
    \ an introduction to the FastAPI framework, but we should prepare to have a longer\
    \ learning curve in order to deploy our AI application into production.\n\nIn\
    \ the next chapter, we will go back to the core functionalities building a network\
    \ copilot application.\n\n# 10 Network Security Through Vibe Coding\n\nOne of\
    \ the areas where AI-assisted tasks shine the most is writing code. Compared to\
    \ human languages, computer languages are much easier to master for computers.\
    \ Computer programming languages, like Python, are designed to be unambiguous\
    \ and highly structured. Each statement, parameter, or keywords followed a clearly\
    \ defined grammar and syntax rules. If we miss a closing bracket or a comma, the\
    \ program will simply fail to run until we correct the syntax mistake.\n\nOn the\
    \ other hand, human languages are ambiguous and rely heavily on cultural and context\
    \ references. Take the following sentence as an example, \"Eric writes code in\
    \ Python, it is his favorite coding language.\" To English speakers, the \"it\"\
    \ in the second part of the sentence naturally refers to the language `Python`\
    \ but it is a (surprisingly) difficult task for computers to accurately know that\
    \ contextual reference.\n\nThis is why coding-assistant was one of the first areas\
    \ AI LLM model really shined. Often referred to as `vibe coding` in the community,\
    \ it generally refers to the `translation layer` of converting human's ambiguous\
    \ and unstructured natural language tasks to computer code. When we are brainstorming,\
    \ prototyping, or brainstorming, we can describe our thoughts to this `vibe code`\
    \ tool and it will translate the intent to code.\n\nIn this chapter, we will introduce\
    \ vibe coding in the context of network security. While vibe coding can be applied\
    \ whenever we need to write code, network security is a great fit for vibe coding\
    \ for the following reasons:\n\n* Security operations often requires rapid prototyping\
    \ and iterative development of detection scripts.\n* Security experts often times\
    \ are not top-tier coder, they need the code to be `good enough` but matches the\
    \ security expert's intent.\n* Vibe coding is conversational and exploratory that\
    \ can quickly turn conversation into code instead of formal software development\
    \ cycles.\n* We can develop custom security tools that are more fitted to us than\
    \ generic solutions that we can purchase.\n* The iterative nature matches how\
    \ security professionals often need to quickly adapt and modify their security\
    \ logic.\n\nIn this chapter, we will cover the following recipes:\n\n* Set Up\
    \ GitHub Copilot\n* Set Up Claude Code\n* Conversational Log Analysis and Threat\
    \ Detection\n* Rapid Security Script Development for Incident Response\n\nPlease\
    \ keep in mind vibe coding, by definition, will yield different result every single\
    \ time. For the recipes in this chapter, focus on the *flow, prompt, and process*,\
    \ your result will 100% be different than what you see between these pages.\n"
