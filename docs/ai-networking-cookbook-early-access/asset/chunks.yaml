    \ mask 255.255.255.0\n    network 192.168.20.0 mask 255.255.255.0\n    neighbor\
    \ 203.0.13.1 activate\n    neighbor 203.0.13.1 soft-reconfiguration\n    neighbor\
    \ 203.0.13.5 activate\n    neighbor 203.0.13.5 soft-reconfiguration\n    neighbor\
    \ 192.168.1.2 activate\n    neighbor 192.168.1.2 route-reflector-client\n  exit-address-family\n\
    interface GigabitEther0/0\n  description BGP Connection - Primary\n  ip address\
    \ 203.0.13.2 255.255.255.2\n  no shutdown\ninterface GigabitEther0/1\n  description\
    \ BGP Connection - Backup\n  ip address 203.0.13.6 255.255.255.2\n  no shutdown\n\
    interface GigabitEther0/2\n  description iBGP Connection\n  ip address 192.168.1.1\
    \ 255.255.255.0\n  no shutdown\nip route 192.168.10.0 255.255.255.0 Null0\nip\
    \ route 192.168.20.0 255.255.255.0 Null0\n```\n\n2. Use the following `bgp_doc_generator.py`\
    \ to generate a md file for documentation.\n\n```python\n#!/usr/bin/env python3\n\
    \"\"\"\nSimple BGP Documentation Generator\n\"\"\"\nimport subprocess\n\ndef generate_bgp_documentation():\n\
    \    \"\"\"Generate BGP documentation from configuration file\"\"\"\n    # Read\
    \ BGP configuration\n    with open(\"configs/bgp-config.txt\", 'r') as f:\n  \
    \      config = f.read()\n    # Create prompt for LLM\n    prompt = f\"\"\"Analyze\
    \ this BGP configuration:\n{config}\nProvide:\n1. AS number and Router ID\n2.\
    \ BGP neighbors and their AS numbers\n3. Networks being advertised\nKeep it simple\
    \ and clear.\"\"\"\n    # Query the LLM\n    result = subprocess.run([\n     \
    \ 'docker', 'exec', 'ch04_ollama_1',\n      'ollama', 'run', 'codellama:7b', prompt\n\
    \    ], capture_output=True, text=True)\n    # Create documentation\n    doc_content\
    \ = f\"\"\"# BGP Configuration Documentation\n## Analysis\n{result.stdout}\n\n\
    ## Configuration\n\"\"\"\n    # Save documentation\n    with open(\"bgp_documentation.md\"\
    , 'w') as f:\n        f.write(doc_content)\n    print(\"BGP documentation saved:\
    \ bgp_documentation.md\")\n\nif __name__ == \"__main__\":\n    generate_bgp_documentation()\n\
    ```\n\n3. Execute the file to generate configuration.\n\n```bash\n$ python bgp_doc_generator.py\n\
    \nBGP documentation saved: bgp_documentation.md\n```\n"
