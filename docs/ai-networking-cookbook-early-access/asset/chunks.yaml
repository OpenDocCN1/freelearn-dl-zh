  trans: "\n\n```bash\n$ python example_1.py\n```\n\nOSI 模型的第二层是`数据链路层`（Data Link\
    \ Layer）。它是离用户最近的一层，负责本地网络（如你的家庭或办公室网络）中直接连接的节点之间（例如你的计算机和路由器）的数据可靠传输。\n\n以下是其功能及其关键性的详细说明：\n\
    \n1. **重点：** 物理链路上的可靠数据交付。\n\n2. **关键功能：**\n\n* **物理地址：** 第二层使用 `MAC`（介质访问控制）地址来识别本地网络上的设备。这允许设备在不需要理解\
    \ IP 地址的情况下直接通信。\n* **错误检测与纠正：** 它实现了检测和纠正传输过程中发生错误的机制，确保数据的完整性。\n* **成帧：** 它将数据封装成帧（frames），这是网络上传输的基本单位。这包括头部和尾部信息等。\n\
    * **逻辑地址：** 虽然它没有 IP 地址，但它使用 `MAC` 地址进行标识，并管理网段内的数据流。\n* **介质访问控制 (MAC) 协议：**\
    \ 这是一个`关键`功能。像 `以太网`（Ethernet）和 `Wi-Fi` 这样的第二层协议规定了本地网络设备如何共享网络介质。它管理冲突并确保设备之间互不干扰。\n\
    \n3. 将内容替换为其他网络工程相关的问题。\n\n## 工作原理……\n\n该脚本演示了如何与本地 AI Ollama 服务器交互。它使用 `ollama`\
    \ `Python 库` 来查询我们安装的 `gemma3:1b` 模型。我们初始化了 `client` 对象以与端口为 `11434` 的服务器通信。\n\
    \n使用 `client.chat` 方法向 AI 模型发送对话并接收响应。\n\n## 更多内容……\n\n查阅 [`github.com/ollama/ollama-python`](https://github.com/ollama/ollama-python)\
    \ 以获取更多关于 Ollama Python 库的信息。\n\n# 网络工程师的 OpenAI 配方\n\n在[第 1 章]中，我们讨论了设置环境的各种方法，包括\
    \ OpenAI 的开发环境——这被许多人认为开启了 AI 大模型革命的公司。OpenAI 的大语言模型（LLM）为网络工程师提供了一个强大的工具包，用于自动化常规任务、生成拓扑结构、设备配置，并在许多其他领域提供专家级的协助。\n\
    \n在本章中，我们将深入探讨使用 OpenAI 的模型来帮助我们处理网络工程背景下的任务。\n\n本章提供了五个配方，循序渐进地建立利用 OpenAI 能力处理网络工程任务的专业知识。我们将尝试不同的工具，例如\
    \ `curl` 和 `postman`，并利用 OpenAI 的文本生成图像能力。具体来说，我们将涵盖以下配方：\n\n* 使用 Curl 进行 OpenAI\
    \ API 通信\n* 在 Postman 中 OpenAI API\n* 微调 OpenAI 模型\n* 使用 OpenAI 生成网络拓扑结构\n* 使用\
    \ OpenAI 生成操作程序说明书 (MOP)\n\n正如我们在[第 1 章]中看到的，OpenAI 的产品是基于云的，他们从未官方提供过其现代模型（如\
    \ `GPT-3` 或 `GPT-4`）的本地托管版本。他们曾一度提供过一个开源模型版本，即 `GPT-2`，可以在本地运行，但与他们目前的产品相比，这是一个较旧且功能受限得的模型。因此，在本章中，我们将关注云端产品。\n\
    \n# 技术要求\n\n本章建立在[第 1 章]设置 OpenAI 环境的配方之上，例如注册账户、生成 API 密钥以及理解不同的参数。如果不熟悉这些内容，请在学习本章配方之前进行复习。\n\
    \n# 使用 Curl 进行 OpenAI API 通信\n\n`curl` ([`github.com/curl/curl`](https://github.com/curl/curl))\
    \ 是测试 API 通信时最通用的命令行工具之一。它允许直接在命令行界面中学习与 OpenAI API 通信的基础知识，例如建立连接、处理身份验证和处理响应。\n\
    \n## 准备工作\n\n对于许多 Linux 发行版，`curl` 是默认安装的。我们可以通过 `curl` 命令检查情况是否如此：\n\n```bash\n\
    $ curl --version\ncurl 8.5.0 (x86_64-pc-linux-gnu) libcurl/8.5.0 OpenSSL/3.0.13\
    \ zlib/1.3 brotli/1.1.0 zstd/1.5.5 libidn2/2.3.7 libpsl/0.21.2 (+libidn2/2.3.7)\
    \ libssh/0.10.6/openssl/zlib nghttp2/1.59.0 librtmp/2.3 OpenLDAP/2.6.7\n```\n\n\
    但是，如果尚未安装，你可以在 [`curl.se/docs/install.html`](https://curl.se/docs/install.html)\
    \ 上找到安装说明。\n\n获取 OpenAI 密钥并就绪（参见[第 1 章]中的“设置 OpenAI 环境”和“带有 OpenAI 的 Python 脚本”）。\n\
    \n## 如何操作……\n\n1. 将 OpenAI API 密钥导出为环境变量。\n\n```bash\nexport OPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\n2. 让我们进行 API 调用以列出所有可用模型。\n\n```bash\ncurl -v https://api.openai.com/v1/models\
    \ -H \"Authorization: Bearer $OPENAI_API_KEY\" -H \"Content-Type: application/json\"\
    \n```\n\n我们应该能看到可用模型列表，在执行时你的输出可能会有所不同：\n\n```bash\n$ curl -v https://api.openai.com/v1/models\
    \ -H \"Authorization: Bearer $OPENAI_API_KEY\" -H \"Content-Type: application/json\"\
