    \n这个配方是不言自喻的。良好的提示（Prompt）构建应该遵循以下步骤：\n\n* 建立上下文。\n* 逐步增加复杂度。\n* 保持连贯性。\n* 在每一层纠正错误。\n\
    \n关键在于意识到 AI 模型更擅长通过层级结构一次处理一件事（就像它们的人类一样）。\n\n## 还有更多……\n\n一旦我们熟悉了这些独立的脚本，我们也可以将它们合并成单个脚本，而不会丢失层级结构。\n\
    \n## 网络工程师的优势\n\n与任何新技术一样，最常听到的问题是：“这项技术会取代我的工作吗？”多年前当网络自动化引入时，我听过这个问题：“我会把自己的工作也自动化掉吗？”当云计算成为主流时，我也听过这个问题的另一个变体：“所有的物理网络都会过时吗？”这也是每个人脑海中的问题：“AI\
    \ 会夺走我的工作吗？”\n\n许多专家预测 AI 革命将比云计算规模更大，有些人甚至认为它将比互联网更大。在这种情况下，它将威胁**每一个人**的工作，而不仅仅是网络工程师。然而，如果我们使用之前的网络自动化和云计算示例，网络工程师的角色会随着新技术而演进，某些功能会被取代，而其他功能将不断进化，并引入一些我们以前从未见过的新工作。虽然没有人能预见未来，但我认为网络专业人员确实具有显著优势，正如本章中通过提示词工程的概念所示：\n\
    \n* 网络工程需要将复杂问题分解为逻辑步骤。\n* 网络工程师通常需要指定精确的需求和约束条件。\n* 网络工程师需要提供清晰的示例和文档。\n* 网络工程通常需要多次迭代和完善的解决方案。\n\
    \n这些技能听起来熟悉吗？它们应该是，因为它们与我们在本章中讨论的用于构建良好提示的技能相同。成为优秀网络工程师的技能与在提示词工程方面与 AI LLM 模型工作所需的技能是相同的。本章介绍的技能并不是为了取代你的网络知识，而是为了放大它们。正如我们在配方中看到的，提供\
    \ BGP、VLAN 和安全信息可以在 AI 的帮助下显著缩短解决方案的时间。\n\n让我们昂首挺胸，学习如何利用 AI 为我们所用！\n\n## 总结\n\
    \n在本章中，我们学习了提示词工程的要素。通过使用正确的提示，我们可以将 AI 从一个通用的助手转变为一个我们都能欣赏的专业网络自动化伙伴。简单回顾一下，我们涵盖了提供特定的、基于角色的提示、指定返回格式、提供可靠的示例和反馈，以及以循序渐进的方式构建提示。\n\
    \n我们应该注意，提示词工程并不是一种新技术，它是在新的界面上应用现有的网络工程技能，这个界面作为通往 AI LLM 伙伴的网关。如果我们把网络工程技能中同样的系统性思维、精确需求和迭代过程应用于与\
    \ AI 模型的工作中，我们就可以准备好了。\n\n到目前为止，我们主要一直通过 API 请求使用云端 LLM 模型。在某些需要物理隔离安全或需要遵守某些政府法规的环境中，这种并不总是可行。在下一章中，我们将更深入地使用本地\
    \ LLM 模型。下章节见！\n\n# 4. 网络工程中的本地 AI LLM 场\n\n在之前的章节中，我们大多数时候通过 API 访问云端大语言模型 (LLM)\
    \ 来利用其能力。然而，有很多原因导致云端 AI LLM 解决方案在你的环境中可能无效：\n\n* 数据主权：在某些行业（如医疗、金融和法律），尽管供应商承诺不使用你的数据进行训练，你仍倾向于将数据（包括网络信息）存储在自己的环境中。\n\
    * 合规性要求：GDPR、HIPAA 和 SOX 合规要求物理隔离或本地部署。\n* 成本：按 Token 付费的云端解决方案随着推推可能会变得昂贵。（相比之下，在本章介绍的本地\
    \ LLM 模型不需要持续向 AI LLM 供应商付费）。\n* 延迟：云端解决方案为每次交易增加了往返路由延迟，这对于实时应用程序可能是无法接受的。\n\n\
    主要由于上述原因，我们希望为网络自动化工作构建本地 AI LLM 解决方案。\n\n正如我们在第一章 中看到的，我们可以为网络自动化任务运行本地大语言模型。在本章中，我们将扩展已有的知识，并查看更多使用本地\
    \ AI LLM 模型的配方。本章将涵盖以下配方：\n\n* 下载 Code Ollama 模型\n* 微调 LLM 资源\n* 使用 CodeLlama\
    \ 生成网络代码示例\n* 使用 Llama 2 Uncensored 模型进行高级代码生成\n* 使用自定义网络数据调整模型\n* 使用本地 LLM 生成网络文档\n\
    \n让我们从技术要求开始。\n\n## 技术要求\n\n在本章中，我们将重点使用带有 docker 容器的 Linux 系统运行必要的配方。在以下示例中，我们使用\
