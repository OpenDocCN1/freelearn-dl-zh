    \ 65002\n    neighbor 192.168.1.2 activate\n    ```\n\n## How it works…\n\nFine-tuning\
    \ and prompt engineering (we will cover prompt engineering in the next chapter)\
    \ are two of the most common ways to influence the response we received from LLMs.\n\
    \nIn the first script, we demonstrated the output from a generic model that was\
    \ based on previous training data. In the second script, we followed OpenAI's\
    \ model optimization guide to provide more training data, specifically the file\
    \ format needs to be in jsonl (sequence of independent JSON objects, one per line)\
    \ and at least 10 examples needs to be provided (the more the better).\n\nNote\
