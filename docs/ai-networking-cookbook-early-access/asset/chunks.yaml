    \ vlan 30\nswitch(config-if)#ip address 192.168.11.1 255.255.255.0\n```\n以下是 VLAN\
    \ 40 的示例配置。\n```\nswitch(config)#vlan 40\nswitch(config-vlan)#name MyVLAN\nswitch(config-vlan)#exit\n\
    ```\n\n## 6. 我们也可以从 WebUI 选择新创建的模型并生成配置。\n\n![Image 5](img/B32646_4_5.png)\n\n\
    图 4.5: Ollama-WebUI 中的新模型交互\n\n## 工作原理……\n\n让我们拆解这些步骤，看看我们如何将基础 CodeLlama 模型转换为使用我们的网络数据进行自定义的模型。当我们要求原始的通用\
    \ CodeLlama 模型为 'vlan 50' 生成配置时，它可能会生成通用的配置语法并混合不同厂商的命令。\n\n在我们的模型文件中，我们使用自定义系统注入来更改模型的行为：\n\
    \n```text\n# 系统上下文\nSYSTEM \"\"\"\n\n你是一个专注于 Cisco 设备的网络自动化专家。\n\n你的专业包括：\n- Cisco\
    \ IOS 配置语法\n- VLAN 配置与管理\n- 带 IP 地址的接口配置\n- 基础路由配置\n- 使用 netmiko 库进行 Python 自动化\n\
    - 网络设备监控与验证\n\n始终提供：\n- 准确的 Cisco IOS 语法\n- Python 脚本中适当错误处理\n- 清晰简洁的配置\n- 可运行的自动化代码\n\
    \n专注于为网络工程师提供实用且即插用的解决方案。\n\n\"\"\"\n```\n\n系统上下文建立了背景，并引导模型像网络工程师一样思考，同时设定了接收\
    \ Cisco 特有语法和规范训练数据的预期。\n\n参数调优对输出也起了作用：\n\n```text\nPARAMETER temperature 0.1\n\
    PARAMETER top_p 0.9\nPARAMETER repeat_penalty 1.1\n```\n\n温度（temperature）越低，响应的确定性越高，这是我们所偏好的，因为我们希望输出是精确的而不是创造性的。`Top_p`\
    \ 指定了最可能的词并减少了随机性。`Repeat_penalty`（重复惩罚）防止模型陷入循环或重复命令。\n\n响应模板指定了返回的输出格式：\n\n\
    ```text\nTEMPLATE \"\"\"{{ if .System }}<|start_header_id|>system<|end_header_id|>\n\
    \n{{ .System }}<|eot_id|>{{ end }}{{ if .Prompt }}<|start_header_id|>user<|end_header_id|>\n\
    \nNetwork Task: {{ .Prompt }}\n\n<|eot_id|>{{ end }}<|start_header_id|>assistant<|end_header_id|>\n\
    \n{{ .Response }}<|eot_id|>\"\"\"\n```\n\n该模板确保了相同结构的格式一致性，而 `Network Task` 前缀提醒了模型其角色。\n\
    \n## 还有更多……\n\n我们可以调整参数来实验不同的模型参数：\n\n```text\nPARAMETER temperature 0.05  # 更加确定\n\
    PARAMETER top_p 0.95        # 更具创造性\nPARAMETER num_ctx 8192      # 更长的上下文窗口\n\
    ```\n\n正如我们在之前的食谱中看到的，我们可以通过 `temperature` 参数更改响应的确定性水平。此外，`top_n` 和 `num_ctx`\
    \ 分别允许我们更改创造力和上下文窗口。\n\n# 4.6 使用本地 LLM 生成网络文档\n\n本食谱演示了如何从配置自动生成网络文档。\n\n## 准备工作\n\
    \n请确保你已经完成了此部分的第一个食谱。\n\n## 如何操作……\n\n1. 可选使用 `bgp_config.py` 生成示例配置，或使用书籍仓库中的现有配置。\n\
    \n```bash\n$ cat configs/bgp-config.txt\nhostname Router-BGP-01\nrouter bgp 65001\n\
    \  bgp router-id 10.1.1\n```\n\n"
