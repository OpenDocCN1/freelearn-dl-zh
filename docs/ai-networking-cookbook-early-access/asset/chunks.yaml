    \    <a href=\"/\">再提一个问题</a>\n        </div>\n    </body>\n    </html>\n    \"\
    \"\"\n\n@app.get(\"/history\")\ndef get_history():\n    session = Session()\n\
    \    questions = session.query(Question).order_by(Question.timestamp.desc()).limit(10).all()\n\
    \    session.close()\n    return [{\"question\": q.question, \"answer\": q.answer,\
    \ \"device_type\": q.device_type, \"time\": q.timestamp} for q in questions]\n\
    \n@app.get(\"/devices\")\ndef supported_devices():\n    return {\n        \"supported_devices\"\
    : [\"cisco\", \"juniper\", \"arista\", \"palo alto\", \"generic\"],\n        \"\
    usage\": \"在您的 JSON 请求中包含 device_type 以获取特定设备的帮助\"\n    }\n\nif __name__ == \"\
    __main__\":\n    import uvicorn\n    uvicorn.run(app, port=8000)\n```\n"
