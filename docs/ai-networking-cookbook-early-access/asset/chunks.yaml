    hostname Router-BGP-01\nrouter bgp 65001\n  bgp router-id 10.1.1\n  bgp log-changes\n\
    \  neighbor 203.0.13.1 remote-as 65002\n  neighbor 203.0.13.1 description Connection-Primary\n\
    \  neighbor 203.0.13.5 remote-as 65003\n  neighbor 203.0.13.5 description Connection-Backup\n\
    \  neighbor 192.168.1.2 remote-as 65001\n  neighbor 192.168.1.2 description iBGP-Peer\n\
