    \n# 4.1 Downloading Code Ollama Models\n\nIn this recipe, we will set up the infrastructure\
    \ to download a specialized AI model from Meta called `CodeLlama` tailored trained\
    \ for generating software code.\n\nPlease note: As with most build vs. buy decision,\
    \ when using local LLM models, we are picking to 'build'. Therefore, we are on\
    \ the hook for maintaining the hardware and software bundle. The first thing to\
    \ consider is which model to use. The models available for local downloads tend\
    \ to be more permissive in usage, ranging from 100% open source to closed source\
    \ but free to use. Please double check the usage guidance for the model you want\
    \ to use.\n\n## Getting Ready\n\nThe recipes in this chapter requires a local\
    \ machine, physical or virtual, to house the docker containers. I would recommend\
    \ using a machine with at least 16G of RAM and at least 50GB of storage. For the\
    \ recipes, I used an AWS `t2.xlarge` instance ([https://aws.amazon.com/ec2/instance-types/t2/])\
    \ with 4vCPUs, 16G RAM, and 100GB EBS storage.\n\n## How to do it…\n\n1. Create\
    \ a folder named `ch04` and switch to the folder.\n   ```bash\n   $ mkdir ch04\
    \ && cd ch04\n   ```\n\n2. Use the following `docker-compose.yml` file to specify\
    \ the two container we will download, one for housing models named `ollama` and\
    \ the `ollama-webui` as the web interface.\n   ```yaml\n   networks:\n     ollama:\n\
    \   services:\n     ollama:\n       image: ollama/ollama\n       networks:\n \
    \        - ollama\n       volumes:\n         - ./data/ollama:/root/.ollama\n \
    \      ports:\n         - 11434:11434\n       restart: unless-stopped\n      \
    \ # Linux-specific resource limits\n       deploy:\n         resources:\n    \
    \       limits:\n             memory: 8G\n           reservations:\n         \
    \    memory: 4G\n     ollama-webui:\n       image: ghcr.io/ollama-webui/ollama-webui:main\n\
    \       volumes:\n         - ./data/ollama-webui:/app/backend/data\n       depends_on:\n\
    \         - ollama\n       ports:\n         - 3002:8080\n       environment:\n\
    \         - 'OLLAMA_API_BASE_URL=http://ollama:11434/api'\n       extra_hosts:\n\
    \         - host.docker.internal:host-gateway\n       networks:\n         - ollama\n\
    \       restart: unless-stopped\n   ```\n\n3. Launch the containers using `docker-compose`.\n\
    \   ```bash\n   $ sudo dockeer-compose up\n   ```\n\n4. Check to see the name\
    \ of the container, by default, it uses the `<;foldername>;_<lt;containername>;`\
    \ format. In our example, it is `ch04_ollama_1` and `ch04_ollama-webui_1`. This\
    \ is the name we will need to use when we need to execute commands on the container.\n\
    \   ```bash\n   $ sudo docker ps\n   CONTAINER ID   IMAGE                    \
    \                COMMAND               CREATED          STATUS         PORTS \
    \                                            NAMES\n   fe33a3ecadac   ghcr.io/ollama-webui/ollama-webui:main\
    \   \"bash.sh\"       18 minutes ago   Up 5 minutes   0.0.0.0:3002->8080/tcp,\
    \ [::]:3002->8080/tcp       ch04_ollama-webui_1\n   232ae96fe447   ollama/ollama\
    \                            \"/bin/ollama serve\"   18 minutes ago   Up 5 minutes\
    \   0.0.0.0:11434->11434/tcp, [::]:11434->11434/tcp       ch04_ollama_1\n   ```\n\
    \n5. List the current models on the `ollama` container, it should be an empty\
    \ list.\n   ```bash\n   $ sudo docker exec -it ch04_ollama_1 ollama list\n   NAME\
    \    ID    SIZE    MODIFIED\n   ```\n\n6. We can also access `ollama-webui` on\
    \ port `3002` using `localhost` or port-forwarding from our IDE. Since this is\
    \ the first time we access the instance, we will need to create an account.\n\
    \   ![Image 1](images/B32646_4_1.png) Figure 4,1: ollama-webui page\n\n7. Once\
    \ logged in, if we use the dropdown menu from 'select a model,' we will also see\
    \ an empty list.\n   ![Image 2](images/B32646_4_2.png) Figure 4.2: Model List\n\
    \n8. We can pull the `codellama:7b` model, the `7b` means 7 billion parameters,\
    \ other options include `13b` for 13 billion or `7b-python` for Python-specific\
    \ tasks.\n   ```bash\n   $ sudo docker exec -it ch04_ollama_1 ollama pull codellama:7b\n\
    \   pulling manifest\n   pulling 3a43f9b78ec:100% ███████████ 3.8 GB         \
    \              <skip>\n   verifying sha256 digest\n   writing manifest\n   success\n\
    \   ```\n\n9. Now we should see the model in `ollama` container.\n   ```bash\n\
    \   $ sudo docker exec -it ch04_ollama_1 ollama list\n   NAME            ID  \
    \            SIZE      MODIFIED\n   codellama:7b    8fdff752f6e    3.8 GB    3\
    \ minutes ago\n   ```\n\n10. We should also see the model in the dropdown list.\n\
    \    ![Image 3](images/B32646_4_3.png) Figure 4.3: ollama-webui model list with\
    \ codellama:7b\n\n11. Try a simple instruction for the newly downloaded model\
    \ in the WebUI by logging in, pick `codllama:7b` model, and type in the request\
    \ in the chat window.\n    ![Image 4](images/B32646_4_4.png) Figure 4.4: CodeLlama\
    \ 'Hello World' Example\n\n12. We can also use the CLI to perform the same task.\n\
    \    ```bash\n    $ sudo docker exec -it ch04_ollama_1 ollama run codellama:7b\
    \ \"Write a Python hello world function\"\n    def hello_world():\n      print(\"\
    Hello, World!\")\n    ```\n\nThis function will print \"Hello, World!\" to the\
    \ console when it is called. Here's an explanation of what each line does:\n*\
    \ `def`: This keyword defines a new function.\n* `hello_world()`: is the name\
    \ of the function. It can be anything you want, but it's traditionally named after\
    \ the task that the function performs. In this case, the function is called `hello_world`\
    \ because it prints out the string \"Hello, World!\".\n\n## How it works…\n\n\
    This recipe should be self-explanatory from the steps. The main objective is to\
    \ set up a foundation to house local LLM models and familiarize ourselves with\
    \ the Web, API, and CLI interfaces to download models, execute commands, and interact\
    \ with the various models.\n\n## There's more…\n\nThere are a few ways in which\
    \ we can improve this recipe:\n* Optimize Linux system for container and LLM model\
    \ performance.\n* Use system service to automatically run the containers.\n* Create\
    \ system monitoring for the services.\n\n## See also…\n\nSee the recipe, `Local\
    \ AI Model` `Ollama` in [Chapter 1](#Chapter_1.xhtml_h1_3).\n\n# 4.2 Fine Tuning\
    \ LLM Resources\n\nWe will quickly find out housing local AI LLM models puts resource\
    \ constraints for memory, storage, and CPU cycles. We are in this constant battle\
    \ to balance between available resources and resources given to AI LLM models.\n\
    \n## Getting Ready\n\nPlease make sure you have completed the preceding recipe.\n\
    \n## How to do it…\n\n1. Use the following `curl` command to observe the limited\
    \ resource causing the `Ollama` container under memory stress.\n   ```bash\n \
    \  $ curl -X POST http://localhost:11434/api/generate -H \"Content-Type: application/json\"\
    \ -d '{\n     \"model\": \"codellama:7b\",\n     \"prompt\": \"Write a Python\
    \ script using netmiko to connect to Cisco routers and retrieve device information.\"\
    ,\n     \"stream\": false\n   }'\n   <use Ctrl+C to terminate>\n   ```\n\n2. Stop\
    \ the docker compose services with `Ctrl+C`.\n3. Modify `docker-compose.yml` file\
    \ to increase memory allocated to `Ollama` service.\n   ```yaml\n   networks:\n\
    \     ollama:\n   services:\n     ollama:\n       image: ollama/ollama\n     \
    \  networks:\n         - ollama\n       volumes:\n         - ./data/ollama:/root/.ollama\n\
    \       ports:\n         - 11434:11434\n       restart: unless-stopped\n     \
    \  # Linux-specific resource limits\n       deploy:\n         resources:\n   \
    \        limits:\n   ```\n"
