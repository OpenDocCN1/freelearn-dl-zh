  trans: "\n\n# 准备工作\n\n我们将使用几个 Python 软件包来实现此功能，请在你的虚拟环境中安装以下包。\n\n```\n$ sudo apt-get\
    \ install graphviz\n```\n\n## 如何操作…\n\n1.  第一步我们需要向 OpenAI 提供拓扑描述并生成一个 Graphviz\
    \ dot 文件，我们将此脚本命名为 `recipe_4_01.generate_dot.py`。\n\n    python\n    #!/usr/bin/env\
    \ python3\n    \"\"\"\n    使用 OpenAI 生成胖树拓扑 dot 文件的简单脚本\n    \"\"\"\n\n    import\
    \ openai\n    import os\n\n    # 设置 OpenAI\n    client = openai.OpenAI(api_key=os.getenv('OPENAI_API_KEY'))\n\
    \n    # 生成 dot 文件内容\n    prompt = \"\"\"Generate a Graphviz DOT file for a fat-tree\
    \ network topology:\n    - 2 个核心路由器: core1, core2\n    - 4 个脊层路由器: spine1, spine2,\
    \ spine3, spine4 \n    - 8 个叶节点路由器: leaf1, leaf2, leaf3, leaf4, leaf5, leaf6,\
    \ leaf7, leaf8\n\n    每个核心路由器连接所有脊层路由器，每个脊层路由器连接所有叶节点路由器。\n    为每种类型的路由器使用不同的颜色。仅返回\
    \ DOT 文件内容。\"\"\"\n\n    response = client.chat.completions.create(\n        model=\"\
    gpt-4\",\n        messages=[{\"role\": \"user\", \"content\": prompt}],\n    \
    \    temperature=0.3\n    )\n\n    # 提取并保存 dot 文件内容\n    content = response.choices[0].message.content\n\
    \n    # 查找实际 DOT 内容（graph/digraph 与结束大括号之间）\n    import re\n    dot_match = re.search(r'((?:di)?graph\\\
    s+\\w*\\s*\\{.*\\})', content, re.DOTALL)\n\n    if dot_match:\n        dot_content\
    \ = dot_match.group(1)\n    else:\n        # 备用：尝试清理内容\n        lines = content.split('\\\
    n')\n        dot_lines = []\n        in_graph = False\n        for line in lines:\n\
    \            if 'graph' in line and '{' in line:\n                in_graph = True\n\
    \            if in_graph:\n                dot_lines.append(line)\n          \
    \  if in_graph and '}' in line:\n                break\n    dot_content = '\\\
    n'.join(dot_lines)\n\n    with open(\"fat_tree_topology.dot\", \"w\") as f:\n\
    \        f.write(dot_content)\n\n    print(\"Generated fat_tree_topology.dot\"\
    )\n    ```\n\n2.  当我们执行该文件时，它将在当前目录下生成一个名为 `fat_tree_topology.dot` 文件。\n\n   \
    \ python\n    $ python3 recipe_4_01_generate_dot.py\n    Generated fat_tree_topology.dot\n\
    \    cat fat_tree_topology.dot\n    digraph FatTree {\n        node [shape=circle];\n\
    \n        // Core routers\n        \"core1\" [color=red];\n        \"core2\" [color=red];\n\
    \n        // Spine routers\n        \"spine1\" [color=blue];\n        \"spine2\"\
    \ [color=blue];\n        \"spine3\" [color=blue];\n        \"spine4\" [color=blue];\n\
    \n        // Leaf routers\n        \"leaf1\" [color=green];\n        \"leaf2\"\
    \ [color=green];\n        \"leaf3\" [color=green];\n        \"leaf4\" [color=green];\n\
    \        \"leaf5\" [color=green];\n        \"leaf6\" [color=green];\n        \"\
    leaf7\" [color=green];\n        \"leaf8\" [color=green];\n    ...\n    ```\n\n\
    3.  我们将使用以下脚本生成实际的拓扑结构。\n\n    python\n    #!/usr/bin/env python3\n    \"\"\"\n\
    \    将 dot 文件转换为 PNG 拓扑可视化的简单脚本\n    \"\"\"\n\n    import subprocess\n    import\
    \ sys\n\n    dot_file = sys.argv[1]\n    output_file = \"topology.png\"\n\n  \
    \  # 从 dot 文件生成 PNG\n    subprocess.run(['dot', '-Tpng', dot_file, '-o', output_file])\n\
    \n    print(f\"Generated {output_file}\")\n    ```\n\n4.  我们可以将 dot 文件作为第二个参数执行脚本。\n\
    \n    python\n    $ python3 recipe_4_02_create_topology.py fat_tree_topology.dot\n\
    \    ```\n\n5.  最终结果是由代码生成的拓扑结构。\n\n    ![Image 15](img/B32646_15.png)\n\n   \
    \ 图 2.15: 拓扑文件\n\n"
- fmt: "\n```python\n#!/usr/bin/env python3\n\"\"\"\nVLAN MOP Generator using OpenAI\
    \ API\nGenerates Method of Procedure documents for Cisco IOS VLAN configuration\n\
    \"\"\"\n\nimport openai\nimport os\nimport sys\nfrom datetime import datetime\n\
    \nclass VLANMOPGenerator:\n    def __init__(self, api_key):\n        \"\"\"Initialize\
    \ the MOP generator with OpenAI API key\"\"\"\n        self.client = openai.OpenAI(api_key=api_key)\n\
    \n    def generate_mop(self, vlan_config):\n        \"\"\"Generate a MOP for VLAN\
    \ configuration\"\"\"\n\n        prompt = f\"\"\"\nGenerate a Method of Procedure\
    \ (MOP) document for configuring VLANs on a Cisco IOS device:\n\nDevice: {vlan_config.get('device_name',\
    \ 'Cisco Switch')}\nVLANs: {vlan_config.get('vlans', [])}\nTrunk ports: {vlan_config.get('trunk_ports',\
    \ [])}\nAccess ports: {vlan_config.get('access_ports', {}\n\nInclude: prerequisites,\
    \ configuration commands, verification steps, and rollback procedures.\n\"\"\"\
    \n\n        response = self.client.chat.completions.create(\n            model=\"\
    gpt-4\",\n            messages=[\n                {\"role\": \"system\", \"content\"\
    : \"You are a network engineer. Generate professional MOP documents for Cisco\
    \ IOS VLAN configuration.\"},\n                {\"role\": \"user\", \"content\"\
    : prompt}\n            ],\n            max_tokens=2000,\n            temperature=0.3\n\
    \        )\n\n        return response.choices[0].message.content\n\ndef main():\n\
    \    # VLAN configuration\n    vlan_config = {\n        \"device_name\": \"SW-CORE-01\"\
    ,\n        \"vlans\": [\n            {\"id\": 10, \"name\": \"USERS\"},\n    \
    \        {\"id\": 20, \"name\": \"SERVERS\"},\n            {\"id\": 30, \"name\"\
    : \"GUEST\"}\n        ],\n        \"trunk_ports\": [\"GigabitEthernet1/0/1\",\
    \ \"GigabitEthernet1/0/2\"],\n        \"access_ports\": {\n            \"GigabitEthernet1/0/10\"\
    : {\"vlan\": 10},\n            \"GigabitEthernet1/0/11\": {\"vlan\": 20},\n  \
    \          \"GigabitEthernet1/0/12\": {\"vlan\": 30}\n        }\n    }\n\n   \
    \ # Get API key from environment\n    api_key = os.getenv('OPENAI_API_KEY')\n\
    \    if not api_key:\n        print(\"Error: OPENAI_API_KEY variable not!\")\n\
    \        sys.exit(1)\n\n    # Generate and save MOP\n    generator = VLANMOPGenerator(api_key)\n\
    \    mop_document = generator.generate_mop(vlan_config)\n\n    timestamp = datetime.now().strftime(\"\
    %Y%m%d_%H%M%S\")\n    filename = f\"VLAN_MOP_{timestamp}.txt\"\n\n    with open(filename,\
    \ 'w') as f:\n        f.write(mop_document)\n\n    print(f\"MOP saved to: {filename}\"\
    )\n\nif __name__ == \"__main__\":\n    main()\n```\n\n2. We can execute the script\
    \ to generate the MOP.\n\n```bash\n$ python recipe_5_MOP_generation_v1.py\nMOP\
    \ saved to: VLAN_MOP_20250720_214956.txt\n```\n\n3. There should be a new `VLAN_MOP_[date].txt`\
    \ in the current directory.\n\n```text\n$ cat VLAN_MOP_20250720_214956.txt\nMethod\
    \ of Procedure (MOP) Document\n\nTitle: VLAN Configuration on Cisco IOS Device\
    \ (SW-CORE-01)\n\nObjective: To configure VLANs on Cisco IOS device (SW-CORE-01)\
    \ and assign them to the respective ports.\n\nPrerequisites:\n1. Network administrator\
    \ credentials for the Cisco IOS device.\n2. Ensure that the device is powered\
    \ on and connected to the network.\n3. Ensure that the trunk and access ports\
    \ are operational.\n\nConfiguration Steps:\n\n1. Login to the Cisco IOS device\
    \ (SW-CORE-01) using the network administrator credentials.\n\n2. Enter the global\
    \ configuration mode:\n```\nSW-CORE-01>enable\nSW-CORE-01#configure terminal\n\
    ```\n\n3. Create the VLANs and assign names:\n```\nSW-CORE-01(config)#vlan 10\n\
    SW-CORE-01(config-vlan)#name USERS\nSW-CORE-01(config-vlan)#exit\nSW-CORE-01(config)#vlan\
    \ 20\nSW-CORE-01(config-vlan)#name SERVERS\nSW-CORE-01(config-vlan)#exit\nSW-CORE-01(config)#vlan\
    \ 30\nSW-CORE-01(config-vlan)#name GUEST\nSW-CORE-01(config-vlan)#exit\n```\n\
    ... [output skipped]\n```\n\n## How it works\n\nThis script is pretty straight\
    \ forward. In Step 1, the script grabs the `OPENAI_API_KEY` from the environment\
    \ variable, then combined the VLAN setup the engineer defined. This part can easily\
    \ be tweaked or read from another file. The next portion is where the AI magic\
    \ happens. The script takes the `vlan_config` and use OpenAI's `gpt-4` to write\
    \ a Method of Procedure document. The magic relies on the previous trained knowledge\
    \ from the OpenAI model and further change can be implemented via the prompt change.\n\
    \n## There's more\n\nFor additional challenges, feel free to take other existing\
    \ procedures, such as BGP configuration or interface configuration, use the same\
