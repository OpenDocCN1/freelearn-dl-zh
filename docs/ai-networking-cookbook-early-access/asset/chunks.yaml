    \    },\n    …\n    {\n      \"id\": \"ft:gpt-3.5-turbo-0125::9FZ8Mnc\",\n   \
    \   \"object\": \"model\",\n      \"created\": 1713497002,\n      \"owned_by\"\
    : \"network-automation-nerds\"\n    }\n  ]\n}\n* Connection #0 to host api.openai.com\
    \ intact\n```\n\n记得我们能够通过系统消息、用户提示和温度影响 OpenAI 的响应吗？我们也可以通过 curl 使用它们。\n\n```bash\n\
    $ curl -X POST \"https://api.openai.com/v1/chat/completions\" \\\n  -H \"Authorization:\
    \ Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d\
    \ '{\n    \"model\": \"gpt-3.5-turbo\",\n    \"messages\": [\n      {\n      \
    \  \"role\": \"system\",\n        \"content\": \"你是一位拥有 15 年经验的高级网络工程师。请提供技术、准确的回答并附带实际示例。\"\
    \n      },\n      {\n        \"role\": \"user\",\n        \"content\": \"解释 TCP\
    \ 和 UDP 的区别，包括在网络应用中何时使用它们。\"\n      }\n    ],\n    \"temperature\": 0.3\n  }'\n\
    ```\n\n我们应该会收到类似下方的响应：\n\n"
