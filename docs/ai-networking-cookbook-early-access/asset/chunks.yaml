  trans: "\n\n```python\n#!/usr/bin/env python3\n\"\"\"\n使用 OpenAI API 的 VLAN MOP\
    \ 生成器\n生成用于 Cisco IOS VLAN 配置的操作程序（MOP）文档\n\"\"\"\n\nimport openai\nimport os\n\
    import sys\nfrom datetime import datetime\n\nclass VLANMOPGenerator:\n    def\
    \ __init__(self, api_key):\n        \"\"\"使用 OpenAI API key 初始化 MOP 生成器\"\"\"\n\
    \        self.client = openai.OpenAI(api_key=api_key)\n\n    def generate_mop(self,\
    \ vlan_config):\n        \"\"\"为 VLAN 配置生成 MOP\"\"\"\n\n        prompt = f\"\"\
    \"\n为在 Cisco IOS 设备上配置 VLAN 生成一份操作程序（MOP）文档：\n\n设备: {vlan_config.get('device_name',\
    \ 'Cisco Switch')}\nVLAN: {vlan_config.get('vlans', [])}\nTrunk 端口: {vlan_config.get('trunk_ports',\
    \ [])}\nAccess 端口: {vlan_config.get('access_ports', {}\n\n包含：前提条件、配置命令、验证步骤和回滚程序。\n\
    \"\"\"\n\n        response = self.client.chat.completions.create(\n          \
    \  model=\"gpt-4\",\n            messages=[\n                {\"role\": \"system\"\
    , \"content\": \"你是一个网络工程师。请为 Cisco IOS VLAN 配置生成专业的 MOP 文档。\n               \
    \ {\"role\": \"user\", \"content\": prompt}\n            ],\n            max_tokens=2000,\n\
    \            temperature=0.3\n        )\n\n        return response.choices[0].message.content\n\
    \ndef main():\n    # VLAN 配置\n    vlan_config = {\n        \"device_name\": \"\
    SW-CORE-01\",\n        \"vlans\": [\n            {\"id\": 10, \"name\": \"USERS\"\
    },\n            {\"id\": 20, \"name\": \"SERVERS\"},\n            {\"id\": 30,\
    \ \"name\": \"GUEST\"}\n        ],\n        \"trunk_ports\": [\"GigabitEthernet1/0/1\"\
    , \"GigabitEthernet1/0/2\"],\n        \"access_ports\": {\n            \"GigabitEthernet1/0/10\"\
    : {\"vlan\": 10},\n            \"GigabitEthernet1/0/11\": {\"vlan\": 20},\n  \
    \          \"GigabitEthernet1/0/12\": {\"vlan\": 30}\n        }\n    }\n\n   \
    \ # 从环境变量获取 API key\n    api_key = os.getenv('OPENAI_API_KEY')\n    if not api_key:\n\
    \        print(\"错误: 未设置环境变量 OPENAI_API_KEY!\")\n        sys.exit(1)\n\n    #\
    \ 生成并保存 MOP\n    generator = VLANMOPGenerator(api_key)\n    mop_document = generator.generate_mop(vlan_config)\n\
    \n    timestamp = datetime.now().strftime(\"%Y%m%d_%H%M%S\")\n    filename = f\"\
    VLAN_MOP_{timestamp}.txt\"\n\n    with open(filename, 'w') as f:\n        f.write(mop_document)\n\
    \n    print(f\"MOP 已保存至: {filename}\")\n\nif __name__ == \"__main__\":\n    main()\n\
    ```\n\n2. 我们可以执行该脚本来生成 MOP。\n\n```bash\n$ python recipe_5_MOP_generation_v1.py\n\
    MOP 已保存至: VLAN_MOP_20250720_214956.txt\n```\n\n3. 当前目录下应该出现一个新的 `VLAN_MOP_[date].txt`\
    \ 文件。\n\n```text\n$ cat VLAN_MOP_20250720_214956.txt\n操作程序 (MOP) 文档\n\n标题: Cisco\
    \ IOS 设备上的 VLAN 配置 (SW-CORE-01)\n\n目标: 在 Cisco IOS 设备 (SW-CORE-01) 上配置 VLAN 并将它们分配到相应的端口。\n\
    \n前提条件:\n1. Cisco IOS 设备的网络管理员凭据。\n2. 确保设备已通电并连接到网络。\n3. 确保 trunk 和 access 端口运行正常。\n\
    \n配置步骤:\n\n1. 使用网络管理员凭据登录 Cisco IOS 设备 (SW-CORE-01)。\n\n2. 进入全局配置模式：\n```\nSW-CORE-01>enable\n\
    SW-CORE-01#configure terminal\n```\n\n3. 创建 VLAN 并分配名称：\n```\nSW-CORE-01(config)#vlan\
    \ 10\nSW-CORE-01(config-vlan)#name USERS\nSW-CORE-01(config-vlan)#exit\nSW-CORE-01(config)#vlan\
    \ 20\nSW-CORE-01(config-vlan)#name SERVERS\nSW-CORE-01(config-vlan)#exit\nSW-CORE-01(config)#vlan\
    \ 30\nSW-CORE-01(config-vlan)#name GUEST\nSW-CORE-01(config-vlan)#exit\n```\n\
    ... [输出已略]\n```\n\n## 工作原理\n\n此脚本非常直观。在步骤 1 中，脚本从环境变量中获取 `OPENAI_API_KEY`，然后结合工程师定义的\
    \ VLAN 设置。这部分可以轻松调整或从另一个文件中读取。接下来的部分是 AI 魔法发生的地方。脚本获取 `vlan_config` 并使用 OpenAI\
    \ 的 `gpt-4` 编写一份操作程序文档。这种魔法依赖于 OpenAI 的训练知识。\n\n## 更多内容\n\n对于额外的挑战，可以尝试使用相同的框架应用于现有的流程，例如\
    \ BGP 配置或接口配置。\n\n## 总结\n\n在本章中，我们提供了五个方案，逐步建立你利用 OpenAI 能力的专业知识。更重要的是，它们是针对网络工程背景编写的，因此与日常工作相关。\n\
    \n在下一章中，我们将进入 LLM 最重要的主题之一：提示工程（Prompt Engineering）。下章节见！\n\n# 3 用于获得可靠输出的提示工程\n\
    \n在过去的两个章节中，我们看到了如何利用 LLM 模型回答许多问题。现在我们知道，与 AI 交互很大程度上取决于我们如何“询问”我们需要的内容。例如，在第\
    \ 1 章中，我们看到提供不同的系统消息会产生不同的响应。这对于我们来说并不意外。毕竟，作为网络工程师，我们花了几十年时间掌握通过 CLI 命令与设备通信的艺术。当我们打开喜欢的终端窗口并\
    \ ssh 连接到路由器时，我们实际上打开了一个通信的“窗口”来告诉设备我们要做什么。随着时间的推移，我们逐渐为设备集成更多的通信方法，例如 SNMP 和\
    \ API，但最终目标仍然是提供一组指令让设备按照我们的指示执行。\n\n现在随着 LLM 成为我们工具箱中的强大工具，我们需要掌握与模型高效通信的方式，即提示工程。我们可以将提示工程视为模型中等同于“CLI\
    \ 语法”，但与厂商制定的严格 CLI 语法不同，我们使用自然语言来帮助 AI 理解我们需要做什么。正如格式错误的 BGP 配置可能会导致我们的网络崩溃一样，编写不当的提示词可能会给我们带来危险的响应。\n\
    \n在本章中，我们将介绍一些构建有效提示词的方案：\n\n*   为模型提供指令\n*   指定返回格式\n*   提供示例\n*   提供反馈\n*  \
    \ 逐步构建提示\n\n编写有效的提示需要耐心和实践，有时我们甚至需要针对正在使用的模型对提示进行定制。但本章涵盖的方案无论我们使用哪种模型都是通用的。\n\
    \n准备好了吗？让我们开始吧。\n\n"
- fmt: "\n1. Create and activate Python virtual environment.\n\n```bash\n$ python3\
    \ -m venv .venv\n$ source .venv/bin/activate\n```\n\n2. Install `openai` and `python-dotenv`\
    \ packages.\n\n```bash\n$ pip install openai python-dotenv\n```\n\n3. Create a\
    \ `.env` file using a text editor and enter your `OPENAI_API_KEY`.\n\n```bash\n\
    $ touch .env #create the file\n$ vim .env #edit the file\n..\nOPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\nSome of the recipes require additional Python packages\
    \ specific to the recipe, they will be included in the recipe 'Getting Ready'\
    \ section.\n\n# Giving Direction for AI Models\n\nThink of AI model as a newly\
    \ hired network engineer on their first day, they are capable, but they need to\
    \ be 'onboarded' with clear directions and instructions.\n\n## Getting Ready\n\
    \nPlease refer to the chapter 'Getting Ready' section for this recipe.\n\n## How\
    \ to do it…\n\n1. Create a Python script with relatively vague prompt.\n\n```python\n\
    from openai import OpenAI\nimport os\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\
    client = OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\n# Bad example - vague\
    \ and directionless\nvague_prompt = \"Help me with BGP configuration\"\n\nresponse_vague\
    \ = client.chat.completions.create(\n    model=\"gpt-4\",\n    messages=[{\"role\"\
    : \"user\", \"content\": vague_prompt}]\n)\n\nprint(\"Vague Response:\")\nprint(response_vague.choices[0].message.content)\n\
    print(\"\\n\" + \"=\"*50 + \"\\n\")\n```\n\n2. Execute the script to see the feedback,\
    \ your result will be slightly different.\n\n```bash\n$ python 3_1_vague_prompt.py\n\
    Vague Response:\nBorder Gateway Protocol (BGP) is a sophisticated routing protocol\
    \ used for routing between autonomous systems (ASs). The following is a basic\
    \ example of how to configure BGP on your router:\n\nBefore starting configuration,\
    \ make sure you have the following information:\n1\\. Your network's autonomous\
    \ system number (ASN)\n2. The IP addresses of the routers you'll be adding to\
    \ the BGP network\n\n```cisco\nRouter#configure terminal\n\nRouter(config)#router\
    \ bgp <ASN> // Enter your ASN\n\nRouter(config-router)#network <network> // Specify\
    \ the networks that you want to advertise\n\nRouter(config-router)#neighbor <neighbor\
    \ IP address> remote-as <AS of neighbor> // Define a neighboring BGP router and\
    \ specify its AS number\n\nRouter(config-router)#exit\n\nRouter(config)#exit\n\
    \nRouter#copy running-config startup-config // Save the configuration to memory\
    \ so it stays even after reboot\n```\n\nReplace `<ASN>`, `<network>`, `<neighbor\
    \ IP address>`, and `<AS of neighbor>` with your actual values.\n\nRemember that\
    \ each router configuration will be different depending on your network's topology\
    \ and size. It's important to have a good understanding of your network's existing\
    \ configuration before attempting to implement BGP.\n\nPlease note that configuring\
    \ BGP incorrectly can have serious consequences for your network, so always take\
    \ caution when making changes and consider consulting with a network specialist\
    \ if you're unsure about any steps involved in the process.\n\nEducate yourself\
    \ thoroughly about BGP and related topics before attempting to implement it on\
    \ your network. There are numerous books, websites, and formal training courses\
    \ available that can help you in this aspect.\n\nConsider practicing in a test\
    \ environment first before applying configuration changes to production equipment.\
    \ It's a good idea to test the performance and reliability of your new settings\
    \ before rolling them out to your entire network.\n\nLastly, ensure your configuration\
    \ meets all security best practices. BGP, like any other internet protocol, is\
    \ susceptible to misuse if not secured properly. Ensure your BGP routers are secured\
    \ and configured to limit the risk of attacks and misconfigurations.\n\n==================================================\n\
    ```\n\n3. Create a Python script with prompt with better directions.\n\n```python\n\
    from openai import OpenAI\nimport os\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\
    client = OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\ndirected_prompt = \"\
    \"\"\n    You are a senior network engineer specializing in BGP routing protocols.\n\
    \    I need you to generate a BGP configuration for a Cisco ASR9000 router that\
    \ will:\n\n1\\. Establish EBGP peering with two upstream ISPs (AS 65001 and AS\
    \ 65002)\n2\\. Implement route filtering to accept only default routes from upstreams\n\
    3\\. Set up load balancing between the two upstreams\n4\\. Include basic security\
    \ hardening for BGP sessions\n\n    My router's AS number is 65100, and the peer\
    \ IPs are:\n    - ISP1 (AS 65001): 192.168.1.1\n    - ISP2 (AS 65002): 192.168.2.1\n\
    \n    Provide the configuration in IOS-XR format with explanatory comments.\n\
    \    \"\"\"\n\nresponse_directed = client.chat.completions.create(\n    model=\"\
    gpt-4\",\n    messages=[{\"role\": \"user\", \"content\": directed_prompt}]\n\
    )\n\nprint(\"Directed Response:\")\nprint(response_directed.choices[0].content)\n\
    ```\n\n4. Execute the script to see the feedback.\n\n```bash\n$ python 3_1_directed_prompt.py\n\
    Directed Response:\nSure, here's the basic configuration for IOS-XR on a ASR9000\
    \ with the given requirements:\n\n! ASR Configuration\n\nrouter bgp 65100\n  !\
    \ Defining BGP routing configuration for AS 65100\n  bgp router-id 192.168.0.1\n\
    \  address-family ipv4 unicast\n    ! Defining IPv4 unicast family context\n \
    \   maximum-paths 2\n    ! Enable load balancing between two equal-cost paths\n\
    \  neighbor 192.168.1.1\n    ! Configuring BGP Neighbor for ISP1\n    remote-as\
    \ 65001\n    ! Setting remote AS for ISP1 to 65001\n    address-family ipv4 unicast\n\
    \      ! Enabling IPv4 unicast with ISP1\n      send-community\n      ! Sending\
    \ community attribute to neighbor\n      maximum-prefix 1\n      ! Limiting the\
    \ prefixes received from ISP1 to 1\n  neighbor 192.168.2.1\n    ! Configuring\
    \ BGP Neighbor for ISP2\n    remote-as 65002\n    ! Setting remote AS for ISP2\
    \ to 65002\n    address-family ipv4 unicast\n      ! Enabling IPv4 unicast with\
    \ ISP2\n      send-community\n      ! Sending community attribute to neighbor\n\
    \      maximum-prefix 1\n      ! Limiting the prefixes received from ISP2 to 1\n\
    !\n\nroute-policy RECEIVE-DEFAULT-ROUTE\n  ! Define policy to accept only default\
    \ route\n  if destination in (0.0.0.0/0) then\n    pass\n  else\n    drop\n  endif\n\
    end-policy\n!\nrouter bgp 65100\n  neighbor 192.168.1.1\n    address-family ipv4\
    \ unicast\n      route-policy RECEIVE-DEFAULT-ROUTE in\n      ! Applying route-policy\
    \ to accept only default route from ISP1\n  neighbor 192.168.2.1\n    address-family\
    \ ipv4 unicast\n      route-policy RECEIVE-DEFAULT-ROUTE in\n      ! Applying\
    \ route-policy to accept only default route from ISP2\n!\n```\n\nLet's harden\
    \ BGP security now:\n\nBGP security hardening includes various aspects, such as\
    \ authentication, TTL security, and updates source verification. Here's a basic\
    \ example of how this could be configured:\n\n```cisco\n! Implement BGP authentication\n\
    router bgp 65100\n  neighbor 192.168.1.1\n    password cisco\n  neighbor 192.168.2.1\n\
    \    password cisco\n\n! Implement TTL security\nrouter bgp 65100\n  neighbor\
    \ 192.168.1.1\n    ttl-security 1\n  neighbor 192.168.2.1\n    ttl-security 1\n\
    \n! Implement updates source verification\nrouter bgp 65100\n  neighbor 192.168.1.1\n\
    \    update-source Loopback0\n  neighbor 192.168.2.1\n    update-source Loopback0\n\
    !\n```\n"
