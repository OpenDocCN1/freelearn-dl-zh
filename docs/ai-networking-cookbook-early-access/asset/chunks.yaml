    \        <div>\n            <h3>最近的问题</h3>\n            <p><a href=\"/history\"\
    >查看对话历史</a></p>\n        </div>\n    </body>\n    </html>\n    \"\"\"\n\n# 处理表单提交\n\
    @app.post(\"/web-ask\", response_class=HTMLResponse)\ndef web_ask_question(question:\
    \ str = Form(...), device_type: str = Form(\"generic\")):\n    answer = get_ai_answer(question,\
    \ device_type)\n\n    # 保存到数据库\n    session = Session()\n    session.add(Question(question=question,\
    \ answer=answer, device_type=device_type))\n    session.commit()\n    session.close()\n\
    \n    return f\"\"\"\n    <!DOCTYPE html>\n    <html>\n    <head>\n    <title>网络\
