  trans: "\n\n4. 查看文档文件。\n\n![Image 6](img/B32646_4_6.png)\n\n图 4.6: 简单的 BGP 文档\n\n\
    ## 工作原理……\n\n让我们拆解 `bgp_doc_generator.py` 文件。第一步是读取 BGP 配置 `config/bgp_config.txt`。我们为\
    \ LLM 准备了如下提示词（prompt）：\n\n```python\nprompt = f\"\"\"Analyze this BGP configuration:\n\
    \n{config}\n\nProvide:\n\n1\\. AS number and Router ID\n\n2\\. BGP neighbors and\
    \ their AS numbers\n\n3\\. Networks being advertised\n\nKeep it simple and clear.\"\
    \"\"\n```\n\n我们将使用 `subprocess` 模块查询本地 LLM，并将结果存储在变量中：\n\n```python\n# Query the\
    \ LLM\nresult = subprocess.run([\n    'docker', 'exec', 'ch04_ollama_1',\n   \
    \ 'ollama', 'run', 'codellama:7b', prompt\n], capture_output=True, text=True)\n\
    ```\n\n脚本将获取结果并保存到文档文件中：\n\n```python\n# Create documentation\ndoc_content = f\"\
    \"\"# BGP Configuration Documentation\n\n## Analysis\n\n{result.stdout}\n\n##\
    \ Configuration\n\n\"\"\"\n\n# Save documentation\nwith open(\"bgp_documentation.md\"\
    , 'w') as f:\n    f.write(doc_content)\nprint(\"BGP documentation saved: bgp_documentation.md\"\
    )\n```\n\n这是一个简单的脚本，展示了我们如何捕获 LLM 输出以创建简单文档的整体结构。\n\n## 更多内容……\n\n尝试添加额外的配置，并针对\
    \ BGP 路由策略和其他 BGP 相关配置修改提示词。\n\n# 总结\n\n本章向网络工程师介绍了如何使用本地 LLM 进行网络自动化任务的实际应用。通过使用\
    \ `Ollama` 在本地运行 LLM，我们可以在保持对数据完全控制权的同时，利用 AI 辅助，并消除对其他云端 LLM 服务的依赖。\n\n在下一章中，我们将看到如何使用开源项目\
    \ `LangChain` 进行 AI LLM 开发。\n\n# 7. 构建 AI LLM 应用后端\n\n在 Web 早期，甚至在几年前，我们为 Web\
    \ 服务通常只有一个单体应用。我们使用 `HTML/CSS/JavaScript` 处理用户可见的部分，并添加一些逻辑和代码来处理业务逻辑以及用户界面与逻辑之间的连接器。快到今天，大多数\
    \ Web 应用已经将应用分为两个主要部分：前端（Frontend）和后端（Backend）。分离的原因大致归纳为三点：\n\n* **专业化**：开发者可以专注于用户体验（前端）或业务逻辑和数据（后端）。\n\
    * **可扩展性**：在进行更新时，只需更新部分代码库，因此出错的概率较低，且更具扩展性。\n* **安全性**：大多数敏感数据存储在后端以受到保护。\n\n\
    在前端和后端之间，我遇到过的最好的类比之一是餐厅。前端类似于用餐区，即客户看到并与之交互的地方。后端就像厨房，许多工作在客户看不的地方进行，烹饪菜肴并在送达客户之前送送到用餐区。这些每个领域都需要不同的技能组合和技术，但它们共同工作以交付最终产品（我不知道你们怎么想，但我现在有点饿了）。\n\
    \n在上一章中，我们看到了使用 `Streamlit` 创建前端的简单方法。然而，许多业务逻辑仍然存在于我们创建的同一个 `Streamlit` 应用中。如果我们想开始使用数据库来持久化数据怎么办？如果我们将应用拆分为更小的部分进行扩展呢？我们已经看到了如何直接向\
    \ `OpenAI` 调用 API，那么为我们自己的服务创建一个类似的服务又如何？\n\n在本章中，我们将开始学习如何创建一个基础 API 服务器（即 Web\
    \ 后端），为我们的应用程序提供服务。我们将构建一个 `FastAPI` 应用，使用 `OpenAI` 的 `GPT` 模型智能地回答网络问题。\n\n在本章中，我们将涵盖以下配方：\n\
    \n* 简单的网络 AI API\n* 添加设备上下文\n* 添加数据库存储\n* 简单的 Web 界面\n* Docker 部署\n\n与之前的章节不同（之前的配方之间是相互独立的），在本章中，我们将从每个配方逐步构建出我们的应用程序。\n\
    \n# 技术要求\n\n在开始之前，请记住为本章创建一个新文件夹以及一个 Python 虚拟环境来存放代码。由于本章是逐步构建应用程序，我们不需要为每个配方创建子文件夹。\n\
    \n我们还需要安装以下新的 Python 包并导出我们的 OpenAI API 密钥：\n\n```bash\n$ pip install fastapi\
    \ uvicorn openai sqlalchemy python-multipart openai\n$ export OPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\n# 7.1 简单的网络 AI APIs\n\n让我们创建一个基础的 `FastAPI` 应用，使用\
    \ `OpenAI` 的 `GPT` 模型回答问题。我们在其他配方中完成过类似的任务，但在本配方中，将在 `FastAPI` 的上下文中完成，以学习该框架的基础。\n\
    \n## 准备工作\n\n此配方不需要新软件，请确保你已经安装了“技术要求”部分中的包。\n\n## 如何实现……\n\n1. 创建以下 Python 文件\
    \ `main_1.py`。\n\n```python\nfrom fastapi import FastAPI\nfrom pydantic import\
    \ BaseModel\nimport openai\nimport os\n\napp = FastAPI(title=\"Network AI\")\n\
    client = openai.OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\nclass Request(BaseModel):\n\
    \    question: str\n\n@app.post(\"/ask\")\ndef ask_question(request: Request):\n\
    \    if not client.api_key:\n        return {\n            \"answer\": \"Please\
    \ set your OPENAI_API_KEY\"\n        }\n    try:\n        response = client.chat.completions.create(\n\
    \            model=\"gpt-3.5-turbo\",\n            messages=[\n              \
    \  {\n                    \"role\": \"system\",\n                    \"content\"\
    : \"You are a network engineer assistant Give concise, practical answers about\
    \ network troubleshooting, configuration, and performance issues.\"\n        \
    \        },\n                {\"role\": \"user\", \"content\": request.question}\n\
    \            ],\n            max_tokens=150\n        )\n        return {\"answer\"\
    : response.choices[0].message.content}\n    except Exception as e:\n        return\
    \ {\"answer\": f\"AI service unavailable: {str(e)}\"}\n\nif __name__ == \"__main__\"\
    :\n    import uvicorn\n    uvicorn.run(app, port=8000)\n```\n\n2. 我们可以如下运行服务器：\n\
    \n```bash\n$ python main_1.py\nINFO:     Started server process [142204]\nINFO:\
    \     Waiting for application startup.\nINFO:     Application startup complete.\n\
    INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)\nINFO:\
    \     127.0.0.1:44394 - \"POST /ask HTTP/1.1\" 200 OK\n```\n\n3. 我们可以使用 `curl`\
    \ 和 `/ask` 端点来尝试该函数。\n\n```bash\n$ curl -X POST \"http://localhost:8000/ask\"\
    \ -H \"Content-Type: application/json\" -d '{\"question\": \"Why is my BGP session\
    \ down?\"}'\n{\"answer\":\"您的 BGP 会话可能由于多种原因中断，例如配置不当、对端配置错误、网络连接问题、MTU 不匹配、路由问题或\
    \ BGP 邻居密码不匹配。检查配置、网络连通性和日志以识别 BGP 会话中断的确的确原因。\"}\n```\n\n"
