  trans: "\n\n# 欢迎访问 Packt 早期访问\n\n# AI 网络食谱：AI 辅助网络自动化与开发的实用配方\n\n欢迎访问 Packt 早期访问。在本书上市之前，我们为您提供这本书的独家预览。写一本书可能需要几个月的时间，但我们的作者拥有前沿的信息可以与您分享。早期访问让您能够直观了解最新进展。章节目前可能有些粗糙，但作者会随着时间的推移进行更新。\n\
    \n您可以随时进入或退出本书，从头到尾跟随；早期访问的设计非常灵活。我们希望您享受阅读 Packt 书籍的过程。\n\n1. 第 1 章: LLM 景观与关键参数\n\
    2. 第 2 章: 网络工程师的 OpenAI \n3. 第 3 章: 可靠输出的提示工程\n4. 第 4 章: 网络工程中的本地 LLM 场\n5. 第\
    \ 7 章: 构建 LLM 后端\n6. 第 10 章: 通过代码进行网络\n\n# 1：LLM 景观与关键参数\n\nAI 正在改变每一个技术领域。网络工程也不例外。\n\
    \n具体来说，本章将涵盖以下配方：\n\n* 设置 OpenAI 账户\n* 实验 OpenAI LLM 模型和参数\n* 使用 OpenAI 脚本\n*\
    \ 设置本地 AI 模型\n* 使用 OpenAI 脚本\n\n# 使用 AI 构建智能网络\n\n想在书中实操 AI 吗？加入 1 月 24 日在线研讨会。我们将深入网络设计模式、真实演示和问答，帮助您更快地交付更可靠的网络。名额有限——立即预留：https://packt.link/buildnetworksai。\n\
    \n自动化与可观测性实战\n\n![Image](img/B32646_1_1.png)\n\n# 技术要求\n\n本章不需要人工智能或大语言模型（LLM）的先知识。如果特定的配方需要额外的技术，将在配方提到。\n\
    \n# 设置 OpenAI 环境\n\nAI 在涉及大语言模型（LLM）方面是主导者。ChatGPT 应用无疑在 2023 年引发了人工智能（AI）运动，两个月内达到了\
    \ 1 亿用户。在访问 OpenAI 资源（如 Playground 和和 API 请求）之前，我们需要设置开发者环境。\n\n在本配方中，我们将设置 OpenAI\
    \ 环境以使用 OpenAI 服务，包括生成 API 密钥、熟悉设置页。\n\n## 准备工作\n\n我们需要创建一个 OpenAI 平台账户；这与 OpenAI\
    \ 账户不同。OpenAI 账户主要供个人用户通过 ChatGPT 等网页界面与 AI 模型交互。另一方面，OpenAI 平台账户旨在让开发者利用 OpenAI\
    \ 模型构建应用程序和服务。\n\n访问 https://platform.openai.com/ 并登录您现有的 OpenAI 账户。如果没有账户，可以使用电子邮件注册免费账户。您也可以使用有效的\
    \ Google、Microsoft 或 Apple 账户登录 OpenAI。\n\n按照屏幕指令完成身份验证和支付设置。\n\n## 如何操作……\n\n\
    1. 访问 ...并使用左侧导航栏创建 API 密钥、创建新项目、检查使用情况和其他管理任务。\n\n   ![Image 2](img/B32646_1_2.png)\n\
    \n   图 1.1 – OpenAI 平台设置\n\n2. 在 https://platform.openai.com/settings/organization/api-keys\
    \ 页面创建组织 API 密钥。将密钥复制到安全的地方以便后使用。\n\n   ![Image 3](img/B32646_1_3.png)\n\n   图\
    \ 1.2 – 创建 组织 API 密钥\n\n3. 使用顶部导航菜单或链接 https://platform.openai.com/playground/\
    \ 进入 OpenAI Playground。\n\n   ![Image 4](img/B32646_1_4.png)\n\n   图 1.3 – OpenAI\
    \ Playground\n\n4. 在聊天提示词中输入问题并观察 OpenAI 的回答。\n\n   ![Image 5](img/B32646_1_5.png)\n\
    \n   图 1.4 – OpenAI 聊天对话\n\n## 工作原理……\n\nPlayground 和 API 是我们开发过程中将使用的两个关键组件。Playground\
    \ 是我们学习和实验不同模型设置、参数和结果的地方。如图 1.5 所示，Playground 由系统消息、聊天输入和对话组成。一旦我们对结果满意，就可以使用\
    \ API 以编程的方式与模型进行交互。\n\n![Image 6](img/B32646_1_6.png)\n\n图 1.5 – OpenAI Playground\n\
    \n## 更多内容……\n\nOpenAI 平台随着新参数、模型的不断变化。访问 FAQ 页面 https://platform.openai.com/docs/faq\
    \ 了解常见问题。网页界面是交互的快速方式。\n\n# 实验 OpenAI LLM 模型和模型参数\n\nOpenAI Playground 允许用户选择不同的模型并调整参数。在编写时，这里是通用类型：\n\
    \n* 推理模型：o 系列模型，擅长复杂、多步骤的任务。\n* 聊天模型：原始的多功能、高智能模型。\n* 成本优化模型：更小、更快且运行更便宜的模型。\n\
    * 实时模型：能够处理文本和音频输入的模型。\n\n模型的定价可以在 https://platform.openai.com/docs/pricing 找到，以每百万\
    \ token 的价格增为单位。\n\n## 准备工作\n\n确保您已登录 OpenAI Playground 并处于图 1.5 所示的界面。\n\n##\
    \ 如何操作……\n\n1. 我们从通过下拉菜单选择想要使用的模型开始。让我们选择 gpt-4o 开始：\n\n   ![Image 7](img/B32646_1_7.png)\n\
    \n   图 1.6 –\n\n2. 输入问题“如何在 Cisco IOS-XE 设备上配置 VLAN?”并观察回答。\n\n   ![Image 8](img/B32646_1_8.png)\n\
    \n   图 1.7 –\n\n3. 选择一个不同的模型，例如 gpt-4.1-nano，问同样的问题“如何在 Cisco IOS-XE 设备上配置 VLAN?”并观察回答。\n\
    \n4. 我们还可以看到两个模型之间的响应时间。在我的运行中，gpt-4.1-nano 生成响应耗时 1.542ms，而 gpt-4o 相同的问题花费了双倍的时间达到\
    \ 5.575ms，nano 模型速度快了一倍以上。\n\n   ![Image 9](img/B32646_1_9.png)\n\n   图 1.8 –\n\
    \n5. 使用模式选择器查看温度（Temperature）、最大标记数（Max tokens）和 Top P 滑块。\n\n   ![Image 10](img/B32646_1_10.png)\n\
    \n   图 1.9 –\n\n"
- fmt: "\n6. The `Temperature` parameter controls the `creativity or randomness` of\
    \ the AI response. The higher the temperature, the less deterministic and more\
    \ creative of the response. We can try dial up the temperature all the way to\
    \ 2 and ask the same question. As you can see in `Figure 1.10`, the response was\
    \ unrecognizable, even with foreign characters.\n\n![Image 11](images/B32646_1_11.png)\n\
    \nFigure 1.10 –\n\n7. Change the `Temperature` back to `1` and lower the max tokens\
    \ down to `20`. If we ask the same question, we can see the response was really\
    \ short. The `token` determines the amount of response the model can return.![Image\
    \ 12](images/B32646_1_12.png)\n\n8. Finally, let's tweak the `Top_P` from 1 to\
    \ 0.25. The setting determines the \"diversity\" of the response. The lower the\
    \ value, the more deterministic and less diverse of the response.\n\n## How it\
    \ works…\n\nOpenAI's text generation models have been trained to understand natural\
    \ language and provide text outputs in response to their inputs. The model uses\
    \ probability from their training to determine the type of response they should\
    \ return. The parameters we covered in this recipe are what we can use to influence\
    \ the return text for how deterministic, or creative, they should be.\n\n## There's\
    \ more…\n\nTake a look at the Advanced usage, [https://platform.openai.com/docs/advanced-usage](https://platform.openai.com/docs/advanced-usage),\
    \ page for the parameter details, managing tokens, and reproducible outputs.\n\
    \n# Experiment with OpenAI System Message\n\nLocated below the parameters is a\
    \ box for system message. By default, there are greyed-out words stating `Describe\
    \ desired model behavior (tone, tool usage, and response style)`. This is one\
    \ of the first places we can influence how OpenAI interacts with the user by providing\
    \ desired guidelines, tone, and objective.\n\n## Getting Ready\n\nLocate the `System\
    \ message box` from `Figure 1.5` before proceeding with the examples.\n\n## How\
    \ to do it…\n\n1. Let's begin with the following system message:\n\n```\nYou are\
    \ an AI assistant specialized in network engineering. Your role is to assist with\
    \ tasks, provide explanations, and offer guidance related to network engineering\
    \ concepts, protocols, tools, and troubleshooting.\n```\n\n2. For the user prompt,\
    \ let's ask OpenAI `What are the steps to set up WiFi 7?` and observe the response.\n\
    \n![Image 13](images/B32646_1_13.png)\n\nFigure 1.12 –\n\n3. Let's modified the\
    \ System message to the following:\n\n```\nYou are an AI assistant 5th grade teacher\
    \ specialized in network engineering. Your role is to assist with tasks, provide\
    \ explanations, and offer guidance related to network engineering concepts, protocols,\
    \ tools, and troubleshooting and explain them to elementary school kids.\n```\n\
    \nInstructions for interaction are:\n\n*   Provide funny explanations whenever\
    \ necessary.\n*   Use non-technical language.\n\n4. We can ask the same question,\
    \ `What are the steps to set up WiFi 7?` and observe the response:\n\n![Image\
    \ 14](images/B32646_1_14.png)\n\nFigure 1.13 –\n\n5. Some of the additional change\
    \ we can make in system message include:\n\n*   \"Provide the answer in a paragraph\
    \ format.\"\n*   \"Provide the answer in a YAML format.\"\n*   \"Provide the answer\
    \ in a JSON format.\"![Image 15](images/B32646_1_15.png)\n\nFigure 1.14 –\n\n\
    ## How it works…\n\nThe system message can influence the response from OpenAI\
    \ for the desired output. A few key concepts for system messages:\n\n*   **Set\
    \ the right context**: Provide background information or a description of the\
    \ tasks. For example, \"you are an AI assistant specialized in network engineering.\"\
    \n*   **Provide clear instructions**: Use clear, concise, and unambiguous language\
    \ and be explicit about what you want the model to do. For example, \"Your role\
    \ is to assist with tasks, provide explanations, and offer guidance related to\
    \ network engineering concepts, protocols, tools, and troubleshooting and explain\
    \ them to elementary school kids.\"\n*   **Specify output formatting**: Specify\
    \ how you want the output to be structured. For example, `..provide the answer\
    \ in YAML format.`\n\nThere are other prompt engineering methods we will get into\
    \ in other recipes, this recipe provides a good start.\n\n## There's more…\n\n\
    OpenAI prompt engineering guide, [https://platform.openai.com/docs/guides/text?api-mode=responses#prompt-engineering](https://platform.openai.com/docs/guides/text?api-mode=responses#prompt-engineering),\
    \ provides excellent guides as a starting point for prompt engineering for system\
    \ messages.\n\n# Experiment with OpenAI Prompt Engineering in Chat\n\nThe same\
    \ concept for prompt engineering can be used in the OpenAI chat. Unlike the system\
    \ message, the prompt we use only impacts the current conversation and will be\
    \ cleared if we start a new conversation.\n\n## Getting Ready\n\nNo other preparation\
    \ required besides using the Chat box.\n\n## How to do it…\n\n1. Make sure the\
    \ system message is clear of any instructions.\n2. Enter the same instruction\
    \ as last recipe, but now in the chat box:\n\n```\nYou are an AI assistant 5th\
    \ grade teacher specialized in network engineering. Your role is to assist with\
    \ tasks, provide explanations, and offer guidance related to network engineering\
    \ concepts, protocols, tools, and troubleshooting\n```\n\nInstructions for interaction:\n\
    \n*   Provide funny explanations whenever necessary.\n*   Use non-technical language.\n\
    *   Provide the answer in a paragraph format.![Image 16](images/B32646_1_16.png)\n\
    \nFigure 1.15 –\n\n3. Observe the output, they should be similar. However, when\
    \ we enter a new chat with auto-clear, the previous instruction would be cleared.\n\
    \n## How it works…\n\nThe same prompt engineering we observed in the last recipe\
    \ can be applied in the chat. The difference is the instruction are not persistent\
    \ between chats.\n\n## There's more…\n\nThe OpenAI prompt engineering guide, [https://platform.openai.com/docs/text?api-mode=responses#prompt-engineering](https://platform.openai.com/docs/text?api-mode=responses#prompt-engineering),\
    \ provides excellent guides as a starting point for prompt engineering.\n\n# Python\
    \ Script with OpenAI\n\nWe can also use Python to interact with the ChatGPT.\n\
    \n## Getting Ready\n\nLocate the OpenAI key from previous recipe as we will use\
    \ it in our script. Create a Python virtual environment to work with the following:\n\
    \n```bash\n$ python3 -m venv .venv\n$ source .venv/activate\n```\n\nExport your\
    \ OpenAI key as an environment variable.\n\n```bash\n$ export OPENAI_API_KEY=\"\
    your-api-key\"\n```\n\n## How to do it…\n\n1. Install the `openai` package.\n\n\
    ```bash\n$ pip install openai\n```\n\n2. Construct the Python script:\n\n```python\n\
    import os\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=os.environ.get(\"\
    OPENAI_API_KEY\"),\n)\n\ncompletion = client.chat.completions.create(\n    model=\"\
    gpt-4o\",\n    messages=[\n        {\n            \"role\": \"developer\",\n \
    \           \"content\": \"You are an AI assistant specialized in network engineering..\"\
    \n        },\n        {\n            \"role\": \"user\",\n            \"content\"\
    : \"How do I install WiFi 7?\",\n        },\n    ],\n)\nprint(completion.choices[0].message.content)\n\
    ```\n\n3. Observe the output:\n"
