    \ we can use all of the Linux tools available in the prompt, such as '*pwd*',\
    \ '*cd*', and \"*ls*\".\n\n    ![Image 19](images/B32646_10_19.png)\n\n    Figure\
    \ 10.19: Claude with Linux Tools\n\n3.  Start with conversation with, \"*I need\
    \ to build an incident response system that can automatically isolate infected\
    \ systems, block malicious* *IPs, and collect forensic evidence. The system should\
    \ handle different incident types like* *ransomware, data exfiltration, and credential\
    \ compromise. Please help me design this from the ground up.*\"\n4.  Claude Code\
    \ will start to list out a few steps and start its work on the process.![Image\
    \ 20](images/B32646_10_20.png)Figure 10.20: Claude Code Design Solution\n5.  Claude\
    \ Code will propose a incident_resposne_system.py and you have the option to create\
    \ the file or iterate on the script.![Image 21](images/B32646_10_21.png)Figure\
    \ 10.21: Create incident_response_system.py\n6.  Start to engage in other conversation,\
    \ such as \"*What is the best way to structure this so it can handle multiple\
    \ incident types and integrate with different security tools?*\"\n\n## How it\
    \ works…\n\nThe Claude Code conversation approach to incident response development\
    \ provides several advantages over simple code completion:\n\n*   *Natural language\
    \ Problem-Solving conversation*: Claude Code maintain context across complex,\
    \ multi-turn discussions.\n*   *Architectural Guidance*: Claude arguably has a\
    \ better understanding of architectural guidance. Whether it is better than, say,\
    \ GitHub Copilot is a judgement call, but it is definitely better than traditional\
    \ code completion.\n*   *Terminal integration*: Claude Code directly integrates\
    \ in the terminal and offers a smoother experience for experienced CLI users.\n\
    *   *Iterative Refinement*: Just like GitHub Copilot, Claude Code allows for real-time\
    \ refinement of response logic, escalation procedures, and itegration approaches\
    \ based on user feedback.\n\n## There's more…\n\nClaude Code can also work with\
    \ Python code using claude-code-sdk on PyPI, [https://docs.anthropic.com/en/docs/claude-code/sdk#python](https://docs.anthropic.com/en/docs/claude-code/sdk#python).\
    \ The following terminal command installs the claude-code-sdk for Python.\n\n\
    ```\n\n$ pip install claude-code-sdk\n\n```\n\n![Image 22](images/B32646_10_22.png)\n\
    \nFigure 10.22: Claude Code Python SDK Basic Usage\n\n## See also…\n\nClaude Code\
    \ Common Worfklows: [https://docs.anthropic.com/en/docs/claude-code/common-workflows](https://docs.anthropic.com/en/docs/claude-code/common-workflows)\n\
    \n# Summary\n\nIn this chapter, we introduced vibe coding as a conversational\
    \ approach to develop network security automation. Unlike traditional development\
    \ approach, vibe coding prioritize rapid prototyping through natural language\
    \ conversation with AI assistants. The core concepts include:\n\n*   *Conversation\
    \ over formal spec requirements*: instead of providing a formal document, security\
    \ professionals just describe the problem and intended solutions.\n*   *Speed\
    \ over perfection*: we rarely get the script right the first time, or the second\
    \ time, but since the time-to-script is so fast, we get to iterate really quickly.\n\
    *   *Domain Expertise First*: Vide coding allows subject matter expert to leverage\
    \ their domain expertise and allow the vibe coding tool to write code.\n\nUsing\
    \ GitHub Copilot, we are able to use vibe coding directly in Visual Studio Code.\
    \ The assistant can behave in ask or agent mode, with a different mix-and-match\
    \ of models to choose from. With Claude Code, the vibe coding assistant is integrated\
    \ into the terminal.\n\nThis is the last chapter of the book. Thank you for taking\
    \ this journey with me through the evolving landscape at the intersection of AI\
    \ LLM and Network Engineering. The time and effort you have invested in this book\
    \ should serve you well for the fundamental shift in how network professionals\
    \ can solve complex problems. This book is intended as your starting point, not\
    \ the destination. The real magic happens when you take these patterns and adapt\
    \ them for your own usage.\n\nI want to thank you again for giving the book a\
    \ piece of your time. I hope the solutions in the book have offered value to you\
    \ and I want to wish you the best of luck on your AI LLM Network Engineering journey,\
    \ the future of network engineering will be written by practitioners like you,\
    \ using AI to amplify and not to replace human engineers. Onwards and upwards!\n\
    ```"
