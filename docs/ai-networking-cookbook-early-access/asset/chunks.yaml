  raw: "## Getting Ready\n\nWe will use several Python packages to do this, please\
    \ install the following packages in your virtual environment.\n\n```\n$ sudo apt-get\
    \ install graphviz\n```\n\n## How to do it…\n\n1.  The first step requires us\
    \ to give topology description to OpenAI and generate a Graphviz dot file, we\
    \ will name this script recipe_4_01.generate_dot.py.\n\n    ```\n    #!/usr/bin/env\
    \ python3\n    \"\"\"\n    Simple script to generate a fat-tree topology dot file\
    \ using OpenAI\n    \"\"\"\n\n    import openai\n    import os\n\n    # Setup\
    \ OpenAI\n    client = openai.OpenAI(api_key=os.getenv('OPENAI_API_KEY'))\n\n\
    \    # Generate dot file content\n    prompt = \"\"\"Generate a Graphviz DOT file\
    \ for a fat-tree network topology:\n    - 2 Core routers: core1, core2\n    -\
    \ 4 Spine routers: spine1, spine2, spine3, spine4 \n    - 8 Leaf routers: leaf1,\
    \ leaf2, leaf3, leaf4, leaf5, leaf6, leaf7, leaf8\n\n    Each core connects to\
    \ all spines, each spine connects to all leaves.\n    Use different colors for\
    \ each router type. Return only the DOT file content.\"\"\"\n\n    response = client.chat.completions.create(\n\
    \        model=\"gpt-4\",\n        messages=[{\"role\": \"user\", \"content\"\
    : prompt}],\n        temperature=0.3\n    )\n\n    # Extract and save dot file\
    \ content\n    content = response.choices[0].message.content\n\n    # Find the\
    \ actual DOT content (between graph/digraph and the closing brace)\n    import\
    \ re\n    dot_match = re.search(r'((?:di)?graph\\s+\\w*\\s*\\{.*\\})', content,\
    \ re.DOTALL)\n\n    if dot_match:\n        dot_content = dot_match.group(1)\n\
    \    else:\n        # Fallback: try to clean up the content\n        lines = content.split('\\\
    n')\n        dot_lines = []\n        in_graph = False\n        for line in lines:\n\
    \            if 'graph' in line and '{' in line:\n                in_graph = True\n\
    \            if in_graph:\n                dot_lines.append(line)\n            if in_graph and '}' in line:\n\
    \                break\n        dot_content = '\\n'.join(dot_lines)\n\n    with open(\"\
    fat_tree_topology.dot\", \"w\") as f:\n        f.write(dot_content)\n\n    print(\"\
    Generated fat_tree_topology.dot\")\n    ```\n\n2.  When we execute the file, it\
    \ will generate a file named `fat_tree_topology.dot` file in the current directory.\n\
    \n    ```\n    $ python3 recipe_4_01_generate_dot.py\n    Generated fat_tree_topology.dot\n\
    \    cat fat_tree_topology.dot\n    digraph FatTree {\n        node [shape=circle];\n\
    \n        // Core routers\n        \"core1\" [color=red];\n        \"core2\" [color=red];\n\
    \n        // Spine routers\n        \"spine1\" [color=blue];\n        \"spine2\"\
     [color=blue];\n        \"spine3\" [color=blue];\n        \"spine4\" [color=blue];\n\
    \n        // Leaf routers\n        \"leaf1\" [color=green];\n        \"leaf2\"\
     [color=green];\n        \"leaf3\" [color=green];\n        \"leaf4\" [color=green];\n\
    \        \"leaf5\" [color=green];\n        \"leaf6\" [color=green];\n        \"\
    leaf7\" [color=green];\n        \"leaf8\" [color=green];\n    …\n    ```\n\n3.\
    \  We will use the following script to generate the actual topology.\n\n    ```\n\
    \    #!/usr/bin/env python3\n    \"\"\"\n    Simple script to convert dot file\
