  trans: "\n在本文写作时，通常有两种“氛围编程”（vibe code）的方法。第一种是将工具集成在集成开发环境（IDE）内部，另一种较新的方法是将工具集成在终端中。对于已经习惯\
    \ IDE 编写代码的人来说，使用 IDE 更加熟悉，而终端更具通用性（例如在手机上）。我们将演示这两种方法：第一种使用配合 VSCode 的 GitHub\
    \ Copilot，第二种使用 Anthropic 的 Claude Code。\n\n信息：请注意，在写作时，GitHub Copilot 提供免费层级，且\
    \ `VSCode` 也是免费的，但这两者都可能发生变化。`Claude Code` 目前只有付费订阅层级，但我认为其提供的功能物超有所值。\n\n该领域正在迅速发展，如果你发现定价或安装方式与下方不同，请检查相关资源以获取最新信息：\n\
    \n*   GitHub Copilot: [`github.com/features/copilot`](https://github.com/features/copilot)\n\
    *   Anthropic Claude Code: [`www.anthropic.com/claude-code`](https://www.anthropic.com/claude-code)\n\
    \n让我们从设置 GitHub Copilot 开始。\n\n# 10.1 设置 GitHub Copilot\n\n在本教程中，我们将在本地计算机上设置\
    \ GitHub Copilot。\n\n## 准备工作\n\n你需要一台能够运行 `VSCode` 的计算机。下方的截图截自 Apple Mac 电脑，但在不同操作系统上的安装指令说明也是可以轻松获取的。\n\
    \n## 如何操作……\n\n访问 [`code.visualstudio.com/`](https://code.visualstudio.com/)，浏览器将检查你的操作系统并提示你下载相应的软件，你也可以点击右上角的“Download”按钮进行下载。\n\
    \n![Image 1](img/B32646_10_1.png)\n\n图 10.1：Visual Studio Code 首页\n\n1.  Visual\
    \ Studio Code 从诞生起初一直是一个免费产品。此时，GitHub Copilot 也提供了免费和多个付费层级。\n\n    ![Image 2](img/B32646_10_2.png)\n\
    \n    图 10.2：GitHub Copilot 定价\n\n2.  打开 `VSCode` 并点击 `Extension`（扩展）选项卡，搜索 `GitHub`\
    \ `Copilot` 并点击 `Install`（安装）。\n\n    ![Image 3](img/B32646_10_3.png)\n\n    图\
    \ 10.3：GitHub Copilot 扩展\n\n3.  安装完成后，你应该能在顶部看到 Copilot 图标。如果右侧面板被隐藏了，请使用右上角的图标显示它。打开右侧面板后，寻找聊天窗口。\n\
    \n    ![Image 4](img/B32646_10_4.png)\n\n    图 10.4：Copilot 面板\n\n4.  在对话框中，寻找下拉菜单以在不同模式切换：`Agent`、`Ask`\
    \ 和 `Edit`。我们将在 Agent 和 Edit 之间切换。\n\n    ![Image 5](img/B32646_10_5.png)\n\n\
    \    图 10.5：配置模式\n\n5.  在右侧的下拉框中，你还可以找到选择不同模型的选项，可以自由选择任何标准或高级模型（高级模型会产生少量费用）。\n\
    \n    ![Image 6](img/B32646_10_6.png)\n\n    图 10.6：模型选择\n\n6.  选择 `Ask` 模式并将\
    \ `GPT-4.1` 作为模型。提一个问题，例如 `explain the structure of a JSON file`。\n\n    ![Image\
    \ 7](img/B32646_10_7.png)\n\n    图 10.7：使用 GPT-4.1 的 Ask 模式\n\n7.  切换到 `Agent`\
    \ 模式并使用模型 `GPT-4.1`。输入指令在你为此章节创建的文件夹创建一个虚拟环境。例如：`please change to /home/ubuntu/ai_network_cookbook/ch10\
    \ and create a Python virtual environment named .venv.`。\n\n警告。请谨慎使用 Agent 模式，它**将**代表你执行更改。虽然通常有撤销更改的选项，但并非总是如此。在\
    \ Agent 模式下请格外小心。\n\n1.  如果你点击指令并选择 `Continue`（继续），代理将代表你执行并做出更改。我们可以点击 `Cancel`（取消），因为我们已经手动创建了虚拟环境。\n\
    \n    ![Image 8](img/B32646_10_8.png)\n\n    图 10.8：使用 GPT-4.1 的 Agent 模式\n\n\
    ## 工作原理……\n\nAsk 模式类似于直接在 IDE 中拥有一个 AI LLM 聊天机器人。先从 Ask 模式开始，手动复制粘贴代码或命令。谨慎使用\
    \ Agent 模式，它会代表你执行并更改。通常有“confirm”（确认）或“accept”（接受）选项，但如果我们不小心，在 agent 模式下更容易犯不可逆的错误。\n\
    \n## 更多功能……\n\n我们可以包含其他文件和链接来帮助回答。点击 `Add Context`（添加上下文）按钮，我们可以从本地文件或其他链接中选择包含的内容。\n\
    \n![Image 9](img/B32646_10_9.png)\n\n图 10.9：添加上下文\n\n## 参见……\n\nGitHub Copilot\
    \ 教程：[`github.com/features/copilot`](https://github.com/features/copilot)\n\n\
    # 10.2 设置 Claude Code\n\n在 IDE 内进行氛围编程的能力很棒。然而，并非所有平台都适合 IDE（例如平板和平手机），而且每个人都习惯在\
    \ IDE 中工作。\n\nAnthropic ([`www.anthropic.com/`](https://www.anthropic.com/)) 作为\
    \ Claude LLM 模型的创建者，创建一个名为 `Claude Code` 的氛围编程工具，通过 `CLI` 直接在终端运行。在写作时，Claude\
    \ Code 只有付费订阅模式。希望当你读到这里时，Claude Code 已提供免费层级。\n\n![Image 10](img/B32646_10_10.png)\n\
    \n图 10.10：Claude Code 定价\n\n## 准备工作\n\n本教程请使用你喜欢的终端窗口。\n\n## 如何操作……\n\n1.  访问\
    \ [`docs.com/en/docs/claude-code/overview#install-and-authenticate`](https://docs.anthropic.com/en/docs/claude-code/overview#install-and-authenticate)\
    \ 获取最新的安装指令。\n2.  通过 `npm` 安装 `@anthropic-ai/claude-code`。如果你的平台没有 npm，请遵循此处的说明：[`docs.npmjs.com/downloading-and-installing-node-js-and-npm`](https://docs.npmjs.com/downloading-and-installing-node-js-and-npm)，适用于你的操作系统。\n\
    \n    ```\n    # npm install -g @anthropic-ai/claude-code\n\n    added 3 packages\
    \ in 3s\n\n    2 packages are looking for funding\n\n    run `npm fund` for details\n\
    \n    npm notice\n\n    npm notice New major version of npm available! 10.9.2\
    \ -> 11.5.2\n\n    npm notice Changelog: https://github.com/npm/cli/releases/tag/v11.5.2\n\
    \n    npm notice To update run: npm install -g npm@11.5.2\n\n    npm notice\n\
    \    ```\n"
- fmt: "\n3. Once installed, we can navigate to our project directory and launch Claude\
    \ Code with `claude` (needs to be root for Linux platform).\n4. Keep in mind everything\
    \ is in terminal, so we need to use arrow key for navigate and Enter key for conformation.\n\
    5. When launch for the first time, Claude Code will ask for display style.\n\n\
    ![Image 11](images/B32646_10_11.png)\nFigure 10.11: Claude Code Text Style\n\n\
    6. Follow the onscreen instruction to log in to Claude account.\n\n![Image 12](images/B32646_10_12.png)\n\
    Figure 10.12: Claude account log in\n\n7. Once logged in, the Claude Code console\
    \ will appear.\n\n![Image 13](images/B32646_10_13.png)\nFigure 10.13: Claude Code\
    \ Console\n\n8. Type `/` to see the command options.\n\n![Image 14](images/B32646_10_14.png)\n\
    Figure 10.14: Claude Code Options\n\n9. This is the *interactive mode* to have\
    \ direct conversation with Claude Code to ask questions, request tasks, and get\
    \ immediate responses.\n10. Type in `quit` to exit Claude Code\n\n## How it works…\n\
    \nIt might take a bit of getting used to if you are used to code with a graphical\
    \ interface in an IDE. However, I do find the operations faster in a terminal\
    \ window than a GUI interface.\n\n## There's more…\n\nTry to have a *conversational*\
    \ *Git* *operation* as indicated on [https://docs.anthropic.com/en/docs/claude-code/quickstart#step-5%3A-use-git-with-claude-code](https://docs.anthropic.com/en/docs/claude-code/quickstart#step-5%3A-use-git-with-claude-code).\n\
    \n![Image 15](images/B32646_10_15.png)\nFigure 10.15: Git Operations with Claude\
    \ Code\n\n## See also…\n\nClaude Code Quick Start: [https://docs.anthropic.com/en/docs/claude-code/quickstart](https://docs.anthropic.com/en/docs/claude-code/quickstart)\n\
    \n# 10.3 Conversational Log Analysis and Threat Detection\n\nThis recipe demonstrates\
    \ how to build threat detection capabilities through conversational AI development.\
    \ We will use GitHub Copilot as an example.\n\n## Getting Ready\n\nPlease complete\
    \ *Recipe 10.1* to prepare the GitHub Copilot development environment.\n\n## How\
    \ to do it…\n\n1. Please create a new directory, `mock_data`, to store mock data:\
    \ `firewall_logs.txt`, `network_info.yaml`, and `threat_intelligence.json`. The\
    \ files are available for download from the book download page and the book's\
    \ GitHub repository.\n2. The firewall logs is a mix of different vendor firewall\
    \ logs with threat patterns.\n\n```\n%ASA-6-302013: Built inbound TCP connection\
    \ 12345 for outside:203.0.113.100/443 (203.0.113.100/443) to inside:10.0.1.50/80\
    \ (10.0.1.50/80)\n%ASA-4-106023: Deny tcp src outside:203.0.113.50/1337 dst inside:10.0.1.100/22\
    \ by access-group outside_in\n%ASA-6-302014: Teardown TCP connection 12345 for\
    \ outside:203.0.113.100/443 to inside:10.0.1.50/80 duration 0:02:30 bytes 2048\n\
    %ASA-4-106023: Deny tcp src outside:198.51.100.25/4444 dst inside:10.0.1.200/3389\
