  trans: "\n\n请记住将 `cisco` 替换为相应的 BGP 会话密码。同时，确保将 `Loopback0` 接口替换为您配置中的实际接口。\n\n\
    ## 工作原理……\n\n我们对两个脚本都使用了相同的代码块，以导入 Python 包并加载 `OPENAI_API_KEY` 的环境变量。然后我们只修改了提示词（prompt），以获得两个截然不同的答案。当你最初没有从专家那里获得预期的答案时，你想要检查的是如何改进提示词。\n\
    \n引导性提示词效果更好，因为它们：\n\n*   **设定角色**：我们告诉模型以“高级网络工程师”的身份进行回复。\n*   **定义范围**：我们定义了清晰的范围，例如“Cisco\
    \ ASR9000 路由器”、带有上游路由器的 ASN 以及 `EBGP` 对等。\n*   **提供上下文**：我们还提供了网络细节。\n\n提示词中给出的方向是稍微改进提示词就能让我们收到的结果产生巨大差异的地方。\n\
    \n## 更多内容……\n\n我们可以通过负向指令进一步改进提示词，例如：\n\n“不要使用路由反射（route-reflection），不要包含已弃的 `IOS-XR`\
    \ 命令。”\n\n我们还可以包含多个步骤：\n\n“1. 首先，分析当前的建议配置。2. 然后，识别任何安全漏洞”\n\n## 另见……\n\n如果您希望接收不同于复制并粘贴命令片段的格式，请参阅后续章节*指定返回格式*（Specifying\
    \ Return Formats）。\n\n# 指定返回格式\n\n正如我们在之前的一些配方中看到的，如果我们想要特定的返回格式，我们需要对其进行清晰且精确的描述。在上一个配方中，我们在回复中要求了“IOS-XR\
    \ 格式”，这是一个即插即用的 CLI 命令示例。同样，我们也可以为 API 集成指定 `JSON` 格式，为人类可读格式指定 `YAML`，或者 Ansible\
    \ playbook 风格的返回格式。\n\n在本配方中，让我们尝试不同的返回格式。\n\n## 准备工作\n\n我们需要安装额外的 Python 包 `pyyaml`。我们还将在环境变量中导出\
    \ `OPENAI_API_KEY`。\n\n```bash\n$ pip install pyyml\n$ export OPENAI_API_KEY=\"\
    your-openai-api-key\"\n```\n\n## 如何操作……\n\n1. 创建脚本，提供一个基础场景并请求带有指令的 `JSON` 返回格式。\n\
    \n```python\n#!/usr/bin/env python3\nimport os\nfrom openai import OpenAI\n\n\
    client = OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\n# 基础场景\nbase_scenario\
    \ = \"\"\"\n我有一个包含以下设备的网络：\n- 2 台核心交换 (Cisco Catalyst 9400)\n- 4 台分布交换机 (Cisco\
    \ Catalyst 9300)\n- 8 台接入交换机 (Cisco Catalyst 9200)\n\n为此网络创建一个清单文档。\n\"\"\"\n\n\
    # 请求 JSON 格式\njson_prompt = base_scenario + \"\"\"\n\n以 JSON 格式返回清单，结构如下所示：\n\
    - 每个设备应包含：hostname, model, role, mgmt_ip\n- 按角色（core, distribution, access）对设备分组\n\
    - 包含一个带有总数的摘要部分\n\n仅提供 JSON 输出，不要有额外的文本。\n\"\"\"\n\nresponse_json = client.chat.completions.create(\n\
    \    model=\"gpt-4\",\n    messages=[{\"role\": \"user\", \"content\": json_prompt}]\n\
    )\n\nprint(\"JSON Format Response:\")\nprint(response_json.choices[0].message.content)\n\
    ```\n\n2. 执行脚本并观察输出。\n\n```bash\n$ python 3_2_Return_JSON_Format.py\nJSON Format\
    \ Response:\n```json\n{\n  \"network_inventory\": {\n    \"core\": [\n      {\n\
    \        \"hostname\": \"core_switch_1\",\n        \"model\": \"Cisco Catalyst\
    \ 9400\",\n        \"role\": \"core\",\n        \"mgmt_ip\": \"192.168.1.1\"\n\
    \      },\n      {\n        \"hostname\": \"core_switch_2\",\n        \"model\"\
    : \"Cisco Catalyst 9400\",\n        \"role\": \"core\",\n        \"mgmt_ip\":\
    \ \"192.168.1.2\"\n      }\n    ],\n    \"distribution\": [\n      {\n       \
    \ \"hostname\": \"distribution_switch_1\",\n        \"model\": \"Cisco Catalyst\
    \ 9300\",\n        \"role\": \"distribution\",\n        \"mgmt_ip\": \"192.168.1.3\"\
    \n      },\n      {\n        \"hostname\": \"distribution_switch_2\",\n      \
    \  \"model\": \"Cisco Catalyst 9300\",\n        \"role\": \"distribution\",\n\
    \        \"mgmt_ip\": \"192.168.1.4\"\n      }\n      <output skipped>\n    ],\n\
    \    \"access\": [\n      {\n        \"hostname\": \"access_switch_1\",\n    \
    \    \"model\": \"Cisco Catalyst 9200\",\n        \"role\": \"access\",\n    \
    \    \"mgmt_ip\": \"192.168.1.7\"\n      },\n      {\n        \"hostname\": \"\
    access_switch_2\",\n        \"model\": \"Cisco Catalyst 9200\",\n        \"role\"\
    : \"access\",\n        \"mgmt_ip\": \"192.168.1.8\"\n      }\n      <output skipped>\n\
    \    ],\n    \"summary\": {\n      \"total_core\": 2,\n      \"total_distribution\"\
    : 4,\n      \"total_access\": 8\n    }\n  }\n}\n```\n\n3. 创建第二个脚本，使用相同的场景并请求 `YAML`\
    \ 返回格式（此处显示返回格式）。\n\n```python\n# 顶部部分与步骤 1 相同\n# 请求 YAML 格式\nyaml_prompt = base_scenario\
    \ + \"\"\"\n\n以 YAML 格式返回清单，适用于 Ansible。\n结构如下：\n- 按角色对设备分组\n- 为每个组包含变量（os_type,\
    \ default_credentials 等）\n- 确保可以直接用于 Ansible playbook\n\n仅提供输出，不要有额外的文本。\n\"\"\
    \"\n\nresponse_yaml = client.chat.completions.create(\n    model=\"gpt-4\",\n\
    \    messages=[{\"role\": \"user\", \"content\": yaml_prompt}]\n)\n\nprint(\"\
    YAML Format Response:\")\nprint(response_yaml.choices[0].message.content)\n```\n\
    \n4. 执行脚本并观察输出。\n\n```bash\npython 3_2_Return_YAML_Format.py\nYAML Format Response:\n\
    ```yaml\nall:\n  children:\n    core:\n      hosts:\n        core_switch_1:\n\
    \          ansible_host: 192.168.1.1\n        core_switch_2:\n          ansible_host:\
    \ 192.168.1.2\n      vars:\n        os_type: 'ios'\n        default_credentials:\n\
    \          username: 'admin'\n          password: 'password'\n    distribution:\n\
    \      hosts:\n        distribution_switch_1:\n          ansible_host: 192.168.1.3\n\
    \        distribution_switch_2:\n          ansible_host: 192.168.1.4\n      <output\
    \ skipped>\n    access:\n      hosts:\n        access_switch_1:\n          ansible_host:\
    \ 192.168.1.7\n        access_switch_2:\n          ansible_host: 192.168.1.8\n\
    \    <output skipped>\n```\n```\n"
- fmt: "\n# Giving Examples\n\nSimply put, the more example we can provide, the better\
    \ AI can understand our needs. As the saying goes, \"a picture is worth a thousand\
    \ words.\" In prompt engineering, concrete examples can provide our organization's\
    \ standards, naming conventions, best practices, and much more.\n\nUsing a newly\
