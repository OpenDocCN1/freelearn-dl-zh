    $ docker --version\nDocker version 28.3.2, build 578ccf6\n$ docker-compose --version\n\
    docker-compose version 1.29.2, build unknown\n```\n\n# 4.1 下载代码 Ollama 模型\n\n\
    在本节中，我们将搭建基础架构，从 Meta 下载一个名为 `CodeLlama` 的专用 AI 模型，该模型是专为生成软件代码而训练的。\n\n请注意：与大多数“自建还是购买”的决策一样，在运行本地\
    \ LLM 模型时，我们选择了“自建”。因此，我们需要维护硬件和软件组合。首先要考虑的是使用哪种模型。可本地下载的模型在用途上通常更加宽松，范围从 100%\
    \ 开源到闭源但免费使用。请务必仔细检查你想要使用的模型的使用指南。\n\n## 准备工作\n\n本章的配方需要一台本地机器（物理或虚拟）来运行 docker\
    \ 容器。我建议使用至少具有 16G RAM 和至少 50GB 存储空间的机器。对于这些配方，我使用了一个 AWS `t2.xlarge` 实例 ([https://aws.amazon.com/ec2/instance-types/t2/])，它拥有\
    \ 4 个 vCPU、16G RAM 和 100GB EBS 存储。\n\n## 如何操作……\n\n1. 创建名为 `ch04` 的文件夹并进入该文件夹。\n\
    \   ```bash\n   $ mkdir ch04 && cd ch04\n   ```\n\n2. 使用以下 `docker-compose.yml`\
    \ 文件来指定我们将下载的两个容器：一个用于存放名为 `ollama` 的模型，另一个作为 Web 界面的 `ollama-webui`。\n   ```yaml\n\
    \   networks:\n     ollama:\n   services:\n     ollama:\n       image: ollama/ollama\n\
    \       networks:\n         - ollama\n       volumes:\n         - ./data/ollama:/root/.ollama\n\
    \       ports:\n         - 11434:11434\n       restart: unless-stopped\n     \
    \  # Linux 特有的资源限制\n       deploy:\n         resources:\n           limits:\n\
    \             memory: 8G\n           reservations:\n             memory: 4G\n\
    \     ollama-webui:\n       image: ghcr.io/ollama-webui/ollama-webui:main\n  \
    \     volumes:\n         - ./data/ollama-webui:/app/backend/data\n       depends_on:\n\
    \         - ollama\n       ports:\n         - 3002:8080\n       environment:\n\
    \         - 'OLLAMA_API_BASE_URL=http://ollama:11434/api'\n       extra_hosts:\n\
    \         - host.docker.internal:host-gateway\n       networks:\n         - ollama\n\
    \       restart: unless-stopped\n   ```\n\n3. 使用 `docker-compose` 启动容器。\n   ```bash\n\
    \   $ sudo dockeer-compose up\n   ```\n\n4. 检查容器名称，默认情况下，它使用 `<文件夹名>_<容器名>;` 的格式。在我们的示例中，它是\
    \ `ch04_ollama_1` 和 `ch04_ollama-webui_1`。这是我们需要在容器上执行命令时需要使用的名称。\n   ```bash\n\
    \   $ sudo docker ps\n   CONTAINER ID   IMAGE                                \
    \    COMMAND               CREATED          STATUS         PORTS             \
    \                                NAMES\n   fe33a3ecadac   ghcr.io/ollama-webui/ollama-webui:main\
    \   \"bash.sh\"       18 minutes ago   Up 5 minutes   0.0.0.0:3002->8080/tcp,\
    \ [::]:3002->8080/tcp       ch04_ollama-webui_1\n   232ae96fe447   ollama/ollama\
    \                            \"/bin/ollama serve\"   18 minutes ago   Up 5 minutes\
    \   0.0.0.0:11434->11434/tcp, [::]:11434->11434/tcp       ch04_ollama_1\n   ```\n\
    \n5. 列出 `ollama` 容器上的当前模型，它应该是一个空列表。\n   ```bash\n   $ sudo docker exec -it ch04_ollama_1\
    \ ollama list\n   NAME    ID    SIZE    MODIFIED\n   ```\n\n6. 我们也可以通过 `localhost`\
    \ 端口 `3002` 或通过 IDE 的端口转发访问 `ollama-webui`。由于这是第一次访问该实例，我们需要创建一个账户。\n   ![Image\
    \ 1](img/B32646_4_1.png) 图 4,1: ollama-webui 页面\n\n7. 一旦登录后，如果我们使用“select a model”的下拉菜单，我们也会看到一个空列表。\n\
