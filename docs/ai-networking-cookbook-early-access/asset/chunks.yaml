    \n       ```\n    … [output skipped]\n    ```\n\n## How it works…\n\nT0his script\
    \ is pretty straight forward. In Step 1, the script grabs the OPENAI_API_KEY from\
    \ the environment variable, then combined the VLAN setup the engineer defined.\
    \ This part can easily be tweaked or read from another file. The next portion\
    \ is where the AI magic happens. The script takes the VLAN config ans use OpenAI's\
    \ GPT-4 to write a Method of Procedure document. The magic relies on the previous\
    \ trained knowledge from the OpenAI model and further change can be implemented\
    \ via the prompt change.\n\n## There's more…\n\nFor additional challenges, feel\
    \ free to take other existing procedures, such as BGP configuration or interface\
    \ configuration, use the same script framework to turn them into MOP automatically.\n\
    \n# Summary\n\nIn this chapter, we provided five comprehensive recipes that progressively\
    \ build your expertise in leveraging OpenAI's capabilities for network engineering\
    \ tasks. Each recipe follows a practical, hands-on approach that you can immediately\
    \ apply in your environment. More importantly, they are written in the network\
    \ engineering context, so they are relevant and applicable to our daily jobs.\n\
    \nIn the next chapter, we will move on to one of the most important topics in\
    \ AI LLM, Prompt Engineering. See you there!\n\n# 3\n\n# Prompt Engineering for\
    \ Reliable Outputs\n\nIn the last two chapters, we saw how we can leverage AI\
    \ LLM model to answer many of questions and help with daily tasks. By now, we\
    \ know a big part of working with AI LLM is with how we 'ask' AI for what we need.\
    \ For example, in [chapter 1](#Chapter_1.xhtml_h1_3), we saw we received very\
    \ different responses when we provide different system messages. This should not\
    \ come as a surprise to us. After all, as network engineers, we have spent decades\
    \ mastering the art of communicating with network devices through CLI commands.\
    \ When we open our favorite terminal window and ssh to a routers, we literally\
    \ open up a 'window' of communication to tell the device what we want it to do.\
    \ In time, we gradually integrate more communication methods to the device, say,\
    \ SNMP and API, but the end goal is still to provide a set of instructions to\
    \ make the device do what we tell it to do.\n\nNow with AI LLM becoming a power\
    \ tool in our toolkit, we need to master the way we communicate with AI models\
    \ effectively, with prompt engineering. We can think of prompt engineering as\
    \ the equivalent of 'CLI syntax' for AI models, except instead of the strict CLI\
    \ syntax dictated by the vendor, we use natural language to help AI understand\
    \ what we need it to do. Just as a poorly formatted BGP configuration can bring\
    \ down our network, a poorly crafted prompt can give us dangerous AI response.\n\
    \nOften, people think of prompt engineering as a new skill; but it is really about\
    \ applying existing network engineering skills to a new type of interface. We\
    \ need to leverage the same type of system thinking and planning from our network\
    \ engineering background into the new interface to help the AI model be more effective\
    \ in solving our own problems.\n\nIn this chapter, we will go over some recipes\
    \ for constructing effective prompts:\n\n*   Giving Directions for AI models\n\
    \n*   Specifying Return Formats\n\n*   Giving Examples\n\n*   Providing Feedback\n\
    \n*   Building Prompts Gradually\n\nCrafting effective prompt takes patience and\
    \ practice, sometimes we even need to tailor the prompt toward the specific model\
    \ we are using. But the recipes covered in this chapter should be universal regardless\
    \ of the model we are using and provide a good starting point for all queries.\n\
    \nAre you ready? Let's get started.\n\n# Technical requirements\n\nFor the recipes\
    \ below, we will need to create and enable Python virtual environment as well\
    \ as install the openai and python-dotenv packages. If you have previously completed\
    \ these steps and want to re-use them for this chapter, please feel free to skip\
    \ this section."
