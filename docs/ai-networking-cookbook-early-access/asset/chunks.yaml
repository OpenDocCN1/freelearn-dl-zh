    \ text=True)\n```\n\nThe script will take the result and save it in a documentation\
    \ file:\n\n```python\n# Create documentation\ndoc_content = f\"\"\"# BGP Configuration\
    \ Documentation\n\n## Analysis\n\n{result.stdout}\n\n## Configuration\n\n\"\"\"\
    \n\n# Save documentation\nwith open(\"bgp_documentation.md\", 'w') as f:\n   \
    \ f.write(doc_content)\nprint(\"BGP documentation saved: bgp_documentation.md\"\
    )\n```\n\nThis is a simple script that illustrates the overall structure of how\
    \ we can capture LLM output to create a simple documentation.\n\n## There's more…\n\
    \nTry to add additional configuration and modify prompt for bgp route policies\
    \ and other bgp-related configurations.\n\n# Summary\n\nThis chapter introduced\
    \ network engineers to the practical application of using local LLM for network\
    \ automation tasks. By running LLMs locally using `Ollama`, we can leverage AI\
    \ assistance while maintaining complete control over our data and eliminate dependencies\
    \ on other cloud-based LLM services.\n\nIn the next chapter, we will see how we\
    \ can use the open source project `LangChain` for AI LLM development.\n\n# 7.\
    \ Building AI LLM Application Backends\n\nIn the early days of the web, or even\
    \ just a few years ago, we have one monolithic application for our web services.\
    \ We would use `HTML/CSS/JavaScript` for the part where the user sees, and we\
    \ would add some logic and code to handle the business logic and the connector\
    \ between what the user sees and the logic. Fast forward to today, most web applications\
    \ have now separated the application into two main components, Frontend and Backend.\
    \ The reasons for separation can be broadly categorized into three reasons:\n\n\
    * **Specialization**: Developers can focus on user experience (frontend) or business\
    \ logic and data (backend).\n* **Scalability**: When making updates, only part\
    \ of the code base needs to be updated, thus less likely to break and more scalable.\n\
    * **Security**: Most of the sensitive data lives in the backend to be protected.\n\
    \nOne of the best analogies I came across between frontend and backends is with\
    \ restaurants. Frontend is similar to the dining area and what the customer sees\
    \ and interact with. The backend is like the kitchen, where many of the work happened\
    \ out of sight of the customer, cook the meal and delivered to the dining area\
    \ before it reaches the customer. Each of these areas require different skillsets\
    \ and technologies but they work together to deliver the finished product (I don't\
    \ know about you, but now I am kind of hungry).\n\nIn the last chapter, we saw\
    \ a simple way to create frontend with `Streamlit`. However, many of the business\
    \ logic still lives in the same `Streamlit` app we created. What if we want to\
    \ start using databases to persist our data? What about scaling our application\
    \ into smaller parts? We did see how we can just make API calls to `OpenAI`, how\
    \ about recreate a service just like that for our own services?\n\nIn this chapter,\
    \ we will start to learn how to create a basic API server, a.k.a. web backend,\
    \ to service our application. We will build a `FastAPI` application that uses\
    \ `OpenAI`'s `GPT` models to answer network questions intelligently.\n\nIn this\
    \ chapter, we will cover the following recipes:\n\n* Simple network AI API's\n\
    * Adding device context\n* Adding database storage\n* Simple Web interface\n*\
    \ Docker deployment\n\nDifferent from previous chapters, where the recipes are\
    \ somewhat independent from each other, this chapter we will gradually build out\
    \ our application from each of the recipes.\n\n# Technical requirements\n\nBefore\
    \ we get started, remember to create a new folder for this chapter and a Python\
    \ virtual environment to house the code. Since this chapter gradually builds up\
    \ the application, we do not need to create subfolders for each recipe.\n\nWe\
    \ will need to install the following new Python packages as well as export our\
    \ OpenAI API key:\n\n```bash\n$ pip install fastapi uvicorn openai sqlalchemy\
    \ python-multipart openai\n$ export OPENAI_API_KEY=\"your-openai-api-key\"\n```\n\
    \n# 7.1 Simple Network AI APIs\n\nLet's create a basic `FastAPI` application that\
    \ uses `OpenAI`'s `GPT` model to answer questions. We have completed similar tasks\
    \ from other recipes, but in this recipe, we will do it in the context of `FastAPI`\
    \ to learn the basics of the framework.\n\n## Getting Ready\n\nNo new software\
    \ is needed for this recipe, please make you installed the packages in the Technical\
    \ Requirements section.\n\n## How to do it…\n\n1. Create the following Python\
    \ file, `main_1.py`.\n\n```python\nfrom fastapi import FastAPI\nfrom pydantic\
    \ import BaseModel\nimport openai\nimport os\n\napp = FastAPI(title=\"Network\
    \ AI\")\nclient = openai.OpenAI(api_key=os.getenv(\"OPENAI_API_KEY\"))\n\nclass\
    \ Request(BaseModel):\n    question: str\n\n@app.post(\"/ask\")\ndef ask_question(request:\
    \ Request):\n    if not client.api_key:\n        return {\n            \"answer\"\
    : \"Please set your OPENAI_API_KEY environment variable\"\n        }\n    try:\n\
    \        response = client.chat.completions.create(\n            model=\"gpt-3.5-turbo\"\
    ,\n            messages=[\n                {\n                    \"role\": \"\
    system\",\n                    \"content\": \"You are a network engineer assistant\
    \ Give concise, practical answers about network troubleshooting, configuration,\
    \ and performance issues.\"\n                },\n                {\"role\": \"\
    user\", \"content\": request.question}\n            ],\n            max_tokens=150\n\
    \        )\n        return {\"answer\": response.choices[0].message.content}\n\
    \    except Exception as e:\n        return {\"answer\": f\"AI service unavailable:\
    \ {str(e)}\"}\n\nif __name__ == \"__main__\":\n    import uvicorn\n    uvicorn.run(app,\
    \ port=8000)\n```\n\n2. We can run the server as follows:\n\n```bash\n$ python\
    \ main_1.py\nINFO:     Started server process [142204]\nINFO:     Waiting for\
    \ application startup.\nINFO:     Application startup complete.\nINFO:     Uvicorn\
    \ running on http://127.0.0.1:8000 (Press CTRL+C to quit)\nINFO:     127.0.0.1:44394\
    \ - \"POST /ask HTTP/1.1\" 200 OK\n```\n\n3. We can use `curl` and the `/ask`\
