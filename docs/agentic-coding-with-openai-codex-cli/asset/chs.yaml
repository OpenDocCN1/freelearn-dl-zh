  : 6,\n  \"ae-lst-0738\": 3,\n  \"ae-lst-0808\": 10,\n  \"ae-lst-1717\": 5,\n  \"\
  ae-lst-1806\": 2\n}\n```\n\n\n\n\n### 总结\n\n1.  **Python 削弱了反馈回路。** 其正确性信号弱于静态类型语言：后期才浮现的类型错误、环境变量依赖、导入时的副作用、易于模拟以及静默的\
  \ async 边缘情况是这五大鸿沟，本章中的每个秘诀都是为了填补其中之一。\n\n2.  **在 `AGENTS.md` 中命名工具。** 一份写明 `uv\
  \ run pytest`、`uv run ruff check --fix` 和 `uv run ruff format` 的 Python `AGENTS.md`\
  \ 能在错误发生前消除绝大多数工具误用。完整质量关卡（lint → format → type check → tests）将完整的质量周期变成了 Agent\
  \ “完成”定义的一部分。\n\n3.  **Pytest 需要命名 fixtures 和 markers。** 当 Codex CLI 知道 fixtures\
  \ 位于何处、存在哪些 markers 以及覆盖率阈值是多少时，集成效果会显著提升。Fixture 发现和 marker 规范是配置不足的项目中最常缺失的两个约定。\n\
  \n4.  **类型生成需要风格规范。** 当风格被精确指定时，类型提示和文档字符串适合自动化生成。禁止裸露的 `Any` 以及选择 Google 风格文档字符串是产出最一致输出的两条指令。\n\
  \n5.  **一套工具链，一个配置文件。** `uv` 和 `ruff` 合并了历史上半打独立的工具，`mypy` 作为类型检查关卡。将 `pyproject.toml`\
  \ 编码为单一事实来源，并通过 `uv run` 路由所有调用，可生成一个 Codex CLI、CI 和团队每位开发者完全共享的可复现环境。\n\n6.  **FastAPI\
  \ 和 async 需明确约定。** Async 路由处理器、`Depends()` 注入、显式的 `response_model` 以及 async 函数内无阻塞\
  \ I/O，所有这些都应写入 `AGENTS.md`，否则 Codex CLI 会在不同路由间不一致地即兴发挥。\n\n7.  **“运行或放松”的回报。**\
  \ 有了这些约定，服务只需一个简短提示，而值得审查的部分仅是裁决规则和钉住其棘手边缘情况的测试。其 `GET /departures` 契约即是 第 23 章\
  \ 所渲染、第 24 章 所部署的那个贯穿三章的单一示例。\n\n### 练习\n\n1.  **基线审计。** 选取一个你正在从事的现有 Python 项目，使用本章约定编写一份根目录下的\
  \ `AGENTS.md`。在 Codex CLI 中运行 `/init` 并将其生成内容与你编写的内容对比。它们在哪些地方出现分歧？这说明了 Codex CLI\
  \ 能推断出哪些约定，又有哪些必须显式声明？\n\n2.  **覆盖率扩展。** 找出你项目中测试覆盖率低于 80% 的模块。编写一个 Codex CLI 提示词，利用\
  \ `AGENTS.md` 中的 fixture 约定将覆盖率扩展至 95%。审查生成的测试：它们是断言行为还是仅断言当前输出？修改那些断言附带行为而非预期契约的测试。\n\
  \n3.  **钩子管道。** 实现本章中的三钩子配置（PostToolUse lint、Stop 测试关卡、UserPromptSubmit 遗留命令拦截）到\
  \ `.codex/hooks.json` 文件中。运行一个向模块添加新函数的 Codex CLI 会话，观察哪些钩子触发以及触发时机。修改 Stop 钩子命令使其在测试失败时非零退出，观察\
  \ Codex CLI 如何报告错误。\n\n4.  **类型注解扩展。** 找出代码库中至少 30% 函数缺少类型注解的 Python 模块。编写一个 Codex\
  \ 提示词，为每个未注解的函数添加注解，遵循 `AGENTS.md` 中的约定（例如 Python 3.10+ 使用 `str | None` 而非 `Optional[str]`）。Codex\
  \ CLI 完成注解后，在严格模式下运行 `mypy` 或 `ty` 并审查浮现的任何类型错误。注意这些错误源于新增注解，还是注解暴露出的预存类型问题。\n\n\
  5.  **构建 Run or Relax API。** 使用包含本章 FastAPI 和 async 约定的 Python `AGENTS.md`，提示 Codex\
  \ CLI 构建上述 `GET /departures` 端点，对接种子时刻表，将裁决实现为纯函数，并编写注入时钟而非读取时钟的测试。然后重新生成，但刻意在提示词中省略“站台进站规则”：Agent\
  \ 是否会与零比较并让你冲向一班你赶不上的列车？将该规则加入 `AGENTS.md`，确认有测试钉住它，并保留该契约；你将在 第 23 章 中针对它构建前端。\n\
  \n---\n\n# 23 前端工程\n\n第 22 章 构建了 Run or Relax 后端：一个 API，给定时间和时刻表，返回 Audley End 的下一班发车信息及一个裁决结果——`RUN`\
  \ 或 `relax`。一个没有面孔的服务。本章构建这张“面孔”：调用 API 并渲染看板的 React 与 TypeScript 前端，与后端一样，代码由 Codex\
  \ CLI 编写。\n\n难点在于前端工作是 Agent 错误最难被捕获的领域，这改变了你引导它的方式。核心在于**静默失败**。生成错误 SQL 的后端 Agent\
  \ 会立即在测试中失败；而选错包管理器、在 Hooks 代码库中拿类组件、或针对 Vitest 运行器编写 Jest 断言的前端 Agent，代码编译通过，随后却以难以追踪的方式出错。如何让它“守轨行驶”是本章剩余内容的主题，伴随的挑战包括：工具链不匹配、测试通过却无实证、无障碍技术债，以及将设计转化为代码。\n\
  \n我们以 React 和 TypeScript 为具体落地目标，但本章不针对某个特定库：它关乎如何为前端工作配置 Codex CLI，使那些静默失败尽早浮现。\n\
  \n### 学习目标\n\n你将能够：\n\n1.  编写一份前端 `AGENTS.md`，预防最常见的工具链不匹配。\n2.  使用单个 Codex CLI\
  \ 提示词，脚手架出带有同目录 Vitest 测试套件的类型化 React 组件。\n3.  在 React 前端消费类型化后端契约，通过判别联合类型切换，使\
  \ API 形态在两端均得到强制约束。\n4.  生成 Vitest 和 Testing Library 测试，以锻炼真实用户交互而非合成事件。\n5.  应用探索者/工作者子\
  \ Agent 模式处理跨越 UI 和 API 的特性。\n6.  将无障碍审计自动化为可复用的 Codex CLI 技能。\n7.  利用视觉输入和 Figma\
  \ 的 MCP 服务器实现设计转代码工作流。\n8.  判断何时浏览器验证循环值得其延迟和 Token 成本。\n\n### 前端专用 AGENTS.md 配置\n\
  \n\n\n\n\n#### 第 22 章 与前端 `AGENTS.md`\n\n*第 22 章* 论证了 `AGENTS.md` 是阻止 Agent 盲目猜测的最高杠杆手段；前端将风险放大了。这不仅仅是因为约定更多，更因为错误的约定更隐蔽：当你的\
  \ Monorepo 使用 `pnpm` 时却执行 `npm install`，当 Barrel 文件期望命名导出时却写了默认导出，或者迁移到 Vitest 的\
  \ `vi.fn()` 后仍使用 `jest.fn()`。每个错误单独看都微不足道，但合在一起却具有腐蚀性。它们拖慢 Code Review，导致约定分歧，并侵蚀自主运行所依赖的信任。\n\
  \n前端 `AGENTS.md` 需要回答后端配置通常可隐式忽略的五个问题：\n\n1.  用哪个包管理器？确切命令是什么？\n2.  用哪个 React 版本？它启用或禁止哪些模式？\n\
  3.  用哪个组件库？基础组件如何安装与扩展？\n4.  用哪个测试框架？单元测试与 E2E 测试的边界在哪里？\n5.  Agent 绝对不能跨越哪些文件系统边界？\n\
  \n以下配置为使用 React 19 编译器的 Next.js 15 项目回答了上述全部五个问题：^(²⁰¹)\n\n```\n#### AGENTS.md —\
  \ Frontend (React/TypeScript)\n##### Stack\n- React 19 with TypeScript strict mode\n\
  - Next.js 15 (App Router), built as a static export (`output: \"export\"`): the\
  \ board ships as static assets, with no server runtime\n- Tailwind CSS v4\n- shadcn/ui\
  \ for component primitives\n- Vitest + Testing Library for unit/integration tests\n\
  - Playwright for browser automation and visual verification\n- pnpm (never npm install\
  \ or yarn)\n##### Backend\n- The Chapter 22 FastAPI service exposes `GET /departures`;\
  \ the board calls it directly from the browser\n- Base URL: `NEXT_PUBLIC_DEPARTURES_API_URL`,\
  \ defaulting to `http://localhost:8000`\n- Calls are cross-origin, so the backend\
  \ must send CORS headers for the board's origin\n##### Commands\n- `pnpm dev` —\
  \ development server (port 3000)\n- `pnpm test` — Vitest unit tests\n- `pnpm test:e2e`\
  \ — Playwright end-to-end tests\n- `pnpm build` — production build\n- `pnpm lint`\
  \ — ESLint + Prettier check\n- `pnpm tsc --noEmit` — TypeScript type check\n#####\
  \ Architecture\n- `/app` — Next.js App Router pages (static export, no server runtime)\n\
  - `/components/ui` — shadcn/ui primitives (regenerate with CLI, never edit directly)\n\
  - `/components` — application components\n- `/lib` — utilities and data fetching\
  \ (calls the backend API directly)\n- `/tests` — Vitest unit tests\n- `/e2e` — Playwright\
  \ tests\n##### Component conventions\n- Functional components only (no class components)\n\
  - Do NOT add useMemo/useCallback by default; trust the React Compiler\n- Use `startTransition`\
  \ for non-urgent state updates\n- Prefer server components; use `\"use client\"\
  ` only when interactivity requires it\n- shadcn/ui components install via `pnpm\
  \ dlx shadcn@latest add <component>`\n- Named exports only (no default exports from\
  \ component files)\n##### TypeScript\n- Strict mode is on — no `any`, no `@ts-ignore`\n\
  - Use `satisfies` for type narrowing rather than casting\n- All API response shapes\
  \ must have explicit types\n##### Constraints\n- Never modify files in `/components/ui`\
  \ directly\n- Never add `console.log` to production code\n- Tailwind utility classes\
  \ only — no inline styles, no CSS-in-JS\n##### Completion criteria\n- `pnpm build`\
  \ passes with no errors\n- `pnpm test` all pass\n- `pnpm tsc --noEmit` reports zero\
  \ errors\n```\n\n有两处注释值得重点关注。React 19 编译器备注“不要默认添加 `useMemo`/`useCallback`”，防止 Codex\
  \ CLI 应用 React 17 时代的性能模式——该模式现由编译器自动处理。^(²⁰²) 没有它，Codex CLI 会防御性地包装每一个昂贵计算，产出虽能工作但不必要冗余的代码。shadcn/ui\
  \ 约束同样具体：这些是由 shadcn CLI 管理的生成文件，而非你拥有的源代码，直接修改会破坏再生成工作流。将其编码为硬约束，可防止 Codex CLI\
  \ 在“改进”基础组件时造成无声破坏。\n\n`completion criteria`（完成标准）部分将 `AGENTS.md` 从风格指南转变为反馈循环。Codex\
  \ CLI 在任务结束时运行列出的命令，并迭代直到全部通过。没有显式标准，你只能依赖 Agent 自行推断何时完成，它确实会推断，但并不总是正确。\n\n###\
  \ 创建前端项目\n\n*第 22 章* 留下了一个 `run-or-relax/` 检出，FastAPI 服务位于 `src/` 下。前端与其并存于 `frontend/`\
  \ 目录，这是一个 Node 项目而非 Python 项目，因此两套工具链永不冲突。首先确认工具链在 PATH 上，因为最新的 Node 安装可能在启用 Corepack\
  \ 前不暴露 `pnpm`：\n\n```\nnode --version\ncorepack enable pnpm\npnpm --version\n```\n\
  \n然后从仓库根目录脚手架项目：\n\n```\ncd run-or-relax\npnpm create next-app@latest frontend --typescript\
  \ --app --tailwind --eslint --use-pnpm\ncd frontend\npnpm dlx shadcn@latest init\
  \ --defaults --yes\npnpm add -D vitest @testing-library/react @testing-library/user-event\
  \ jsdom @vitejs/plugin-react\npnpm add -D @playwright/test jest-axe @axe-core/playwright\n\
  ```\n\n这些命令追踪快速迭代的工具，预期会有漂移。`@latest` 可能安装比 `AGENTS.md` 技术栈行声明更新的 Next 主版本；保留脚手架安装的版本并更新技术栈行以匹配，而不是固定版本，因为本章的约定不依赖确切版本。使\
  \ `shadcn init` 非交互的标志也随版本变化，如果仍提示交互，请添加 `--force` 或查看当前的 `--help`。`create-next-app`\
  \ 会将自己的 `AGENTS.md` 和 `CLAUDE.md` 放入项目：将其版本特定的警告合并到前述配置中，而非盲目覆盖。\n\n如果完全无法运行 `create-next-app`（例如离线或受限会话），转而手动构建项目结构，请添加脚手架本会安装的类型包：`pnpm\
  \ add -D @types/react @types/node`。没有它们 `pnpm tsc --noEmit` 会立即失败，且让 `next build`\
  \ 在构建中途自动安装它们会与 pnpm 存储配置冲突。脚手架隐藏了此依赖；手动路径必须显式声明。\n\n将合并后的 `AGENTS.md` 放置在 `frontend/AGENTS.md`，使\
  \ Codex CLI 从此处运行的每条命令都继承约定，然后在同一会话中让它生成测试配置，明确运行器边界，确保两个测试工具永不冲突：\n\n```\nConfigure\
  \ the test toolchain following AGENTS.md:\n- vitest.config.ts: jsdom environment,\
  \ a tests/setup.ts setup file, and\n  exclude e2e/**, node_modules/**, .next/**\
  \ and out/** so Vitest never\n  loads a Playwright spec\n- playwright.config.ts:\
  \ run only e2e/**\n- package.json: \"test\" runs Vitest, \"test:e2e\" runs Playwright\n\
  ```\n\n前端无服务器运行时发布，因此在同一会话中配置 Next.js 进行无构建时网络调用的自包含静态导出：\n\n```\nConfigure the\
  \ build for a static export with no build-time network calls:\n- next.config.ts:\
  \ set output: \"export\" so `pnpm build` emits a static\n  out/ directory, and set\
  \ turbopack.root to this frontend/ directory so\n  the build does not infer a parent\
  \ lockfile as the workspace root\n- app/layout.tsx: replace the scaffold's next/font/google\
  \ imports\n  (Geist) with a system font stack, so the build never fetches fonts\n\
  \  from Google at build time\n```\n\n这使 `pnpm build` 将前端写入 `out/`，即 *第 24 章* 作为静态资源服务的目录。生成的目录树即\
  \ `AGENTS.md` 架构章节所描述的结构：\n\n\n\n\nrun-or-relax/\n├── src/departures/        # 第\
  \ 22 章 FastAPI 服务\n├── data/                  # 预置时刻表 + 延误数据\n└── frontend/\n  \
  \  ├── AGENTS.md\n    ├── app/\n    │   └── departures/page.tsx     # 发车页面\n   \
  \ ├── components/\n    │   ├── DepartureRow.tsx\n    │   ├── DepartureBoard.tsx\
  \       # 容器组件：获取 + 轮询\n    │   └── DepartureBoardView.tsx   # 展示组件\n    ├── lib/departures.ts\
  \            # 类型契约 + 获取逻辑\n    ├── tests/                       # Vitest\n    └──\
  \ e2e/                         # Playwright\n\n这些提示词指示智能体启用 Corepack，将 `e2e/**`\
  \ 从 Vitest 中排除，设置 `turbopack.root`，并替换脚手架的字体，因此遵循这些提示词的读者应该能在无需人工干预的情况下获得绿色的 `pnpm\
  \ build`。前端脚手架是该技术栈中最容易受工具链漂移影响的部分，因此某个步骤仍可能落地失败：发布版本间标志发生变化，或命令在先决条件就绪前运行。表 23-1\
  \ 是此类情况的恢复参考，将你实际看到的症状映射到要交给 Codex CLI 的单行修复命令。\n\n#### 表 23-1. 当前工具链下的设置障碍及修复方法\n\
  \n| **症状** | **原因** | **修复** |\n| --- | --- | --- |\n| `pnpm: command not found`\
  \ | Corepack 尚未为 pnpm 创建 shim | 在第一条命令前运行 `corepack enable pnpm` |\n| `shadcn init`\
  \ 仍然弹出交互提示 | 其非交互式标志在不同版本间发生漂移 | 添加 `--force`，或查看 `--help` 确认当前标志 |\n| `pnpm test`\
  \ 失败并提示 \"Playwright Test did not expect test() to be called here\" | Vitest 正在加载\
  \ `e2e/` 下的测试规格 | 在 `vitest.config.ts` 中排除 `e2e/**` |\n| 构建警告推断父级 lockfile 作为工作区根目录\
  \ | 多个 lockfile 位于 `frontend/` 上层 | 在 `next.config.ts` 中将 `turbopack.root` 设置为 `frontend/`\
  \ 目录 |\n\n脚手架配置完成，约定已落笔成文，已知障碍要么被提示词预先规避，要么可查表解决，项目此时处于绿色 `pnpm build` 状态，智能体拥有无需猜测即可工作的一切条件。本章其余内容均通过后续提示词生成到此目录树中，首先从看板渲染所依赖的契约开始。\n\
  \n### 运行后端并定义契约\n\n看板直接调用 *第 22 章* 的后端，因此请先启动后端并确认其返回的数据结构。从 `run-or-relax/` 检出目录出发，在一个独立的终端中（区别于前端终端）：\n\
  \n```\nuv run uvicorn departures.app:app --reload   # 在 localhost:8000 提供服务\ncurl\
  \ 'http://localhost:8000/departures?station=audley-end'\n[\n  {\"service\": \"07:02\"\
  , \"platform\": \"2\", \"delayMinutes\": 0,\n   \"minutesUntil\": 10, \"verdict\"\
  : \"RUN\"}\n]\n```\n\n看板运行在 `localhost:3000`，而 API 运行在 `localhost:8000`，因此浏览器的 fetch\
  \ 请求是跨域的，后端必须发送 CORS 响应头，否则浏览器会拦截响应。这是在 *第 22 章* 服务中只需添加的一行代码：\n\n> 在 `src/departures/app.py`\
  \ 中，添加 FastAPI 的 CORSMiddleware，允许看板的源：开发环境下为 `http://localhost:3000`，生产环境下为部署后看板的源（从环境变量读取）。遵循\
  \ AGENTS.md。\n\n后端可达后，前端代码库中第一个引入的内容是契约类型，`AGENTS.md` 规则“所有 API 响应结构必须具有显式类型”强制要求这一点。它完全镜像\
  \ *第 22 章* 的 camelCase JSON 结构：\n\n```\n// lib/departures.ts\nconst API_BASE =\n\
  \  process.env.NEXT_PUBLIC_DEPARTURES_API_URL ?? \"http://localhost:8000\"\nexport\
  \ interface Departure {\n  service: string        // 例如 \"07:02\"\n  platform: string\n\
  \  delayMinutes: number\n  minutesUntil: number\n  verdict: \"RUN\" | \"relax\"\n\
  }\nexport async function fetchDepartures(\n  station: string,\n  now?: string,\n\
  ): Promise<Departure[]> {\n  const params = new URLSearchParams({ station })\n \
  \ if (now) params.set(\"now\", now)\n  const res = await fetch(`${API_BASE}/departures?${params}`)\n\
  \  if (!res.ok) throw new Error(`departures: ${res.status}`)\n  return res.json()\n\
  }\n```\n\n`URLSearchParams` 对 `station` 和可选的 `now` 进行编码，因此棘手的车站 ID 不会破坏 URL；基础 URL\
  \ 来源于 `NEXT_PUBLIC_DEPARTURES_API_URL`，使得同一次构建既可在开发环境指向 `localhost:8000`，也可在生产环境指向已部署的\
  \ API。`now` 覆盖参数是 *第 22 章* 暴露的同一 ISO 8601 参数：生产环境看板省略它，但测试和演示传入固定值，使看板表现具有确定性。\n\
  \n一个诚实的警示：`Departure` 接口是后端契约的*镜像*，而非运行时保证。TypeScript 仅检查代码期望的结构，而非线上的字节，因此类型检查器无法捕获漂移或错误的响应。共享的\
  \ `verdict: \"RUN\" | \"relax\"` 联合类型依然发挥作用：基于它进行分支的组件在构造上是穷尽的，若出现第三种 verdict 将导致\
  \ `pnpm tsc --noEmit` 失败。若想在运行时强制校验边界，可请 Codex 在返回前用 Zod schema（或手写的 `isDeparture`\
  \ 守卫）验证响应。\n\n### 组件生成与脚手架\n\n有了 `AGENTS.md`，组件脚手架搭建成为 Codex CLI 最可靠的操作之一。构建提示词时应包含所有上下文，避免智能体被迫做假设：文件位置、props、state\
  \ 及配套测试。\n\n> 在 `/components/DepartureRow.tsx` 创建 `<DepartureRow>` 组件。\n> 要求：\n\
  > - Props：单个 `departure: Departure`（类型定义于 `lib/departures.ts`）\n> - 渲染发车时间、站台、延误（为零时隐藏）及距发车分钟数\n\
  > - verdict 以徽章形式展示：verdict 为 \"RUN\" 时变体为 \"run\"（醒目、高对比度），为 \"relax\" 时变体为 \"\
  calm\"\n> - verdict 为 \"RUN\" 时高亮整行（后端已编码门到站台规则，因此行组件不得重新计算阈值）\n> - 使用 shadcn/ui\
  \ 基础组件\n> - 完全键盘可访问；verdict 徽章携带无障碍标签\n> - TypeScript strict 模式 —— 禁止 `any`\n> 在\
  \ `/tests/DepartureRow.test.tsx` 编写 Vitest 测试，覆盖：\n> RUN 行、relax 行、零延误情况、无障碍标签。\n\
  \n具体性至关重要。“展示 verdict”与“基于 `verdict: \"RUN\" | \"relax\"` 的 'run' 或 'calm' 变体徽章”产出截然不同。后者移除了一个决策点，若猜错则需后续修正；且因该\
  \ prop 正是来自 *第 22 章* 的判别联合类型，组件在构造上即穷尽：第三种 verdict 会在此处导致类型检查失败。\n\n对于反复脚手架同类组件形状的团队（表单字段、模态框、数据获取封装），将模式编码为技能可消除逐次提示词中对约定的重复说明。创建\
  \ `.agents/skills/new-component/SKILL.md`：\n\n```\n---\nname: new-component\ndescription:\
  \ Scaffold a new React component with co-located test file\n---\n#### 新组件技能\n按项目约定创建新组件：\n\
  1. `/components/<Name>.tsx` — 含 TypeScript props 接口、Tailwind 样式、具名导出的组件\n2. `/tests/<Name>.test.tsx`\
  \ — 覆盖核心渲染行为及交互状态的 Vitest + Testing Library 测试\n3. 向 `/components/index.ts` 添加具名导出\n\
  4. 遵循所有 AGENTS.md 约定\n除非用户显式要求，否则不要创建 Storybook 故事。\n```\n\n以极简提示词调用技能：\n\n```\n\
  codex \"$new-component — BirthdayBanner 组件，接收 name 与 age，渲染庆祝语，如 'Happy 4th Birthday\
  \ Alex'\"\n```\n\n技能的最后一行（“除非被询问，否则不要创建 Storybook 故事”）并非吹毛求疵。没有它，Codex CLI 会因训练数据中该模式频繁出现，而偶尔在未被要求时生成故事。技能中的显式否定指令可防止这类好心办坏事的范围蔓延。\n\
  \n#### 构建看板\n\n\n\n\n利用 `lib/departures.ts` 中的契约，将发车板构建为两个组件：一个渲染发车信息的纯视图组件，以及一个负责获取数据并轮询的容器组件。这种拆分使视图组件极易测试，并将棘手的异步逻辑、加载态、错误处理和轮询计时器隔离在同一位置。\n\
  \n```\n为发车板创建两个组件，遵循 AGENTS.md。\n<DepartureBoardView> 位于 /components/DepartureBoardView.tsx：\n\
  - 接收 departures: Departure[]\n- 每个发车信息渲染一个 <DepartureRow>\n- 列表为空时渲染空状态（“今日无更多列车”）\n\
  - 纯粹且为展示型：无数据获取，无状态\n<DepartureBoard> 位于 /components/DepartureBoard.tsx (\"use client\"\
  )：\n- 接收 station: string\n- 调用 fetchDepartures(station) 并每 30 秒重新轮询一次\n- 先显示加载骨架屏，获取抛出错误则显示错误状态，数据到达后显示可见的最后更新时间\n\
  - 用结果渲染 <DepartureBoardView>\n- 使用 shadcn/ui 基础组件；TypeScript 严格模式；完全支持键盘访问\n编写 Vitest\
  \ 测试：\n- DepartureBoardView：一个 RUN 行、一个 relax 行和空状态\n- DepartureBoard：使用模拟的 fetchDepartures\
  \ 测试加载-然后加载完成的路径、获取被拒绝时的错误状态，以及轮询间隔推进时最后更新时间的前进\n使用 Testing Library 的 userEvent\
  \ 和假计时器，而非 fireEvent。传递固定的 now 时间，使测试不依赖真实时钟。\n```\n\n容器组件拥有所有可能出错的逻辑（加载、轮询、失败），而视图组件保持为其\
  \ `departures` prop 的纯函数，因此证明 `RUN` 徽章能正确渲染的测试，永远不需要搭建 fetch mock。容器组件刻意设计为客户端组件，因此有\
  \ `\"use client\"`：静态导出没有服务端运行时，所以轮询和读取 `NEXT_PUBLIC_DEPARTURES_API_URL` 都在浏览器中发生。因为裁决类型与第\
  \ 22 章共享，视图组件的分支情况源于其两种状态，未来后端若新增第三种裁决，会在此处导致 `pnpm tsc --noEmit` 失败，而不是渲染空内容。这就是契约在前端发挥作用：一种形态，镜像在通信线的两端。\n\
  \n挂载发车板的页面是一个轻量包装器：\n\n```\n创建 /app/departures/page.tsx 渲染\n<DepartureBoard station=\"\
  audley-end\" />，遵循 AGENTS.md。\n```\n\n同时运行两端：在后端检出目录运行 `uv run uvicorn departures.app:app\
  \ --reload`，在 `frontend/` 运行 `pnpm dev`，`localhost:3000/departures` 将显示奥德利恩德（Audley\
  \ End）发车板，每趟列车标记 `RUN` 或 `relax`，每三十秒刷新一次。\n\n预置时刻表仅包含早班车，因此下午运行发车板会正确显示“今日无更多列车”，除非你了解时刻表，否则这看起来像是数据通路损坏。若要在任何时刻看到\
  \ `RUN` 和 `relax` 行，请传递数据层已支持的确定性 `now` 覆盖参数（测试使用的同一个 ISO 8601 钩子），并将发车板指向一个上午的时间点。\n\
  \n#### React 组件的测试生成\n\nVitest 和 Testing Library 为 React 项目定义了惯用的单元测试界面。Codex CLI\
  \ 在拥有组件源码时能准确生成这些测试，但质量随提示词的具体程度而异。“为该组件编写测试”能产出覆盖率。指定场景则能产出有用的测试。\n\n```\n为发车板编写\
  \ Vitest 测试，遵循 AGENTS.md。\n针对 <DepartureBoardView>（纯渲染）：\n1. 每个发车信息渲染一行\n2. RUN\
  \ 发车显示 RUN 徽章，relax 发车显示 relax 徽章\n3. 列表为空时渲染空状态（“今日无更多列车”）\n针对 <DepartureBoard>（容器，使用模拟的\
  \ fetchDepartures）：\n4. 先显示加载骨架屏，Promise resolve 后显示行\n5. fetchDepartures 拒绝时显示错误状态\n\
  6. 轮询间隔到达时重新获取并推进最后更新时间\n使用 Testing Library 的 userEvent 进行交互，使用假计时器处理轮询。传递固定的 now\
  \ 时间，使测试不读取真实时钟。不要使用 fireEvent。\n```\n\n`userEvent` 指令至关重要，因为 `fireEvent` 触发合成 DOM\
  \ 事件，而 `userEvent` 模拟真实浏览器行为，包括聚焦、失焦和键盘序列。^²⁰³ 使用 `fireEvent` 编写的测试可能在真实交互会失败时却通过了。Codex\
  \ CLI 了解这两套 API，因此你必须告诉它你的代码库使用哪一种。\n\n对于端到端测试，Playwright 技能提供了浏览器验证循环。创建 `.agents/skills/playwright-check/SKILL.md`：\n\
  \n```\n---\nname: playwright-check\ndescription: 通过运行 Playwright 浏览器测试验证 UI 变更\n\
  ---\n### Playwright 检查技能\n在真实浏览器中验证当前 UI 变更工作正常：\n1. 启动开发服务器：`pnpm dev &`\n2. 等待就绪：`npx\
  \ wait-on http://localhost:3000`\n3. 运行相关的 Playwright 测试：`pnpm test:e2e --grep \"\
  <组件名称>\"`\n4. 若该组件无测试，创建一个最小测试：\n   - 导航到受影响页面\n   - 断言关键元素渲染\n   - 检查无控制台错误\n \
  \  - 测试移动端（375px）和桌面端（1280px）视口\n5. 报告结果及任何失败\n在组件或页面变更后、标记任务完成前，始终运行此步骤。\n```\n\
  \n在视觉正确性至关重要的提示词中引用该技能：\n\n```\n在页头添加搜索栏。实现后，使用 $playwright-check 验证其在移动端和桌面端断点下渲染正确。\n\
  ```\n\nPlaywright 测试需要运行中的开发服务器，会在会话期间占用一个端口和一个进程。在 CI 中，确保端口 3000 可用，且 `pnpm dev`\
  \ 在会话结束时能干净退出。步骤 2 中的 `wait-on` 工具必不可少：没有它，Playwright 会对尚未启动完成的服务器发起请求导致 404，产生虚假失败。\n\
  \n#### 探索者/工作者子代理模式\n\n第 11 章 全面介绍了子代理。^²⁰⁴ 对于前端工作，探索者/工作者模式适用于那些在生成新代码前需要理解现有约定的功能。\n\
  \n问题在于上下文污染。当 Codex CLI 在陌生代码库中构建新设置页面时，它在同一上下文窗口中一边阅读现有文件以理解布局、认证模型、API 形态和组件约定，一边生成新代码。阅读阶段留下的噪音减少了可用于生成的有效上下文。\n\
  \n探索者/工作者模式将这些阶段分离到不同的代理中：\n\n```\n构建发车板功能：一个显示车站下一班列车的页面，每趟带有 RUN 或 relax 裁决，并轮询更新。\n\
  按如下方式使用子代理：\n探索者：\n  阅读 API 契约（第 22 章的 Departure 类型和 GET /departures）、/lib/departures.ts\
  \ 和现有的 /components/DepartureRow.tsx。\n  报告：响应形态、裁决联合类型和已有的行 props。\n工作者 1（探索者之后运行）：\n\
  \  利用探索者的发现，构建位于 /app/departures/page.tsx 的板页面、轮询 fetchDepartures 的 <DepartureBoard>\
  \ 容器，以及组合 <DepartureRow> 的 <DepartureBoardView>。\n工作者 2（与工作者 1 并行运行）：\n  利用探索者的发现，在\
  \ /lib/departures.ts 中编写类型化数据层：Departure 类型、API 基础 URL，以及带查询编码和可选 now 覆盖的 fetchDepartures。\n\
  工作者 3（工作者 1 和 2 之后运行）：\n  编写覆盖板流程的 Playwright e2e 测试：RUN 状态、relax 状态、API 不可达时的错误状态，以及空的“今日无更多列车”状态。\n\
  ```\n\n探索者产出结构化报告（响应形态、裁决联合类型、现有行 props），工作者 1 和 2 将其作为干净的输入接收。工作者 1 和 2 并行运行，减少了具有明显\
  \ UI 和数据层关注点分离的功能的墙钟时间。工作者 3 最后运行，因为它需要实际的实现来编写有意义的测试。\n\n\n\n\n\n![图 23.1 - Explorer/Worker\
  \ 子代理模式](img/B40007_23_01.jpg)\n\n图 23.1 - Explorer/Worker 子代理模式\n\nExplorer/Worker\
  \ 子代理模式的流程图。Explorer 代理读取 `GET /departures` 契约、数据层和现有的 `DepartureRow` 组件，并将响应结构、判决联合类型和可用的行属性作为结构化报告输出。该报告供两个并行运行的\
  \ Worker 使用：Worker 1 构建看板页面、轮询的 `DepartureBoard` 容器以及组合 `DepartureRow` 的 `DepartureBoardView`；Worker\
  \ 2 编写类型化数据层（`Departure` 类型和 `fetchDepartures`）。Worker 3 在两者完成后运行，为看板流程编写 Playwright\
  \ 端到端测试。\n\n此模式对于简单的组件添加属于过度设计。当任务跨越多个子系统（UI、API、数据库模式）、阅读约定消耗大量上下文，或并行执行能显著缩短生成可测试结果的时间时，请使用它。\n\
  \nExplorer 的输出质量取决于你提出问题的质量。“读取代码库并告诉我你发现了什么”只会产生摘要。“读取认证布局和用户类型，并报告数据结构和布局约束”则会产生规范。后者为\
  \ Worker 提供了它们生成正确代码所需的结构化输入。\n\n### 无障碍审计自动化\n\n前端工程会悄无声息地积累无障碍技术债。视觉检查能发现明显问题，自动化\
  \ Lint 工具能发现另一组不同但有重叠的问题。两者都无法面面俱到，也都无法产生可复现的审计追踪。将 `axe-core` 与 Codex CLI 集成可提供广泛的覆盖面、可重复性和适合\
  \ Diff 对比的报告。\n\n`axe-core` 是由 Deque Systems 维护的无障碍测试引擎，它将违规项映射到 WCAG 2.1 和 2.2\
  \ 标准。^(²⁰⁵) 可通过 `jest-axe` 进行集成，尽管名字带有 jest，但它适用于 Vitest；也可通过 `@axe-core/playwright`\
  \ 进行浏览器级审计。\n\n基于 Vitest 的审计如下所示：\n\n```\nimport { render } from '@testing-library/react'\n\
  import { axe, toHaveNoViolations } from 'jest-axe'\nimport { expect } from 'vitest'\n\
  import { DepartureBoard } from '../components/DepartureBoard'\nexpect.extend(toHaveNoViolations)\n\
  it('DepartureBoard has no accessibility violations', async () => {\n const { container\
  \ } = render(\n <DepartureBoard departures={mockDepartures} /> )\nconst results\
  \ = await axe(container)\n expect(results).toHaveNoViolations()\n})\n```\n\n创建 `.agents/skills/accessibility-audit/SKILL.md`\
  \ 以使此模式可复用：\n\n```\n---\nname: accessibility-audit\ndescription: Run axe-core accessibility\
  \ audit on specified components\n---\n#### Accessibility Audit Skill\nRun an accessibility\
  \ audit on the specified component(s):\n1. For each component file named in the\
  \ request, check whether an\n axe-core test already exists in /tests/.\n2. If not,\
  \ create one following the pattern in /tests/DepartureBoard.test.tsx.\n3. Run `pnpm\
  \ test --reporter=verbose` and capture any axe violations.\n4. For each violation,\
  \ report:\n - The WCAG criterion violated\n - The specific element causing the violation\n\
  \ - The recommended fix\n5. Implement fixes for violations rated \"critical\" or\
  \ \"serious\".\n6. Re-run the audit to confirm violations are resolved.\n```\n\n\
  针对组件或目录调用它：\n\n```\ncodex \"$accessibility-audit — audit all components in /components/forms/\"\
  \n```\n\n对于浏览器级审计，它能捕捉基于 jsdom 的测试遗漏的问题（如颜色对比度和焦点陷阱行为），请使用 `@axe-core/playwright`\
  \ 向技能添加 Playwright 步骤：\n\n```\n// e2e/accessibility.spec.ts\nimport { test, expect\
  \ } from '@playwright/test'\nimport AxeBuilder from '@axe-core/playwright'\ntest('settings\
  \ page has no critical accessibility violations', async ({ page }) => {\n await\
  \ page.goto('/settings')\n const results = await new AxeBuilder({ page })\n .withTags(['wcag2a',\
  \ 'wcag2aa'])\n .analyze()\n expect(results.violations.filter(v => v.impact ===\
  \ 'critical')).toHaveLength(0)\n})\n```\n\n在 CI 中针对发布中包含的每个页面运行 `axe-core` Playwright\
  \ 审计。Codex CLI 只需一个提示词即可为整个路由树生成初始测试套件：“使用 $accessibility-audit，为 /app/ 下的每个页面编写\
  \ Playwright axe 测试并在开发服务器上运行它们。”\n\n### 设计到代码工作流\n\n撰写本文时，Figma 的 MCP 服务器处于测试阶段，^(²⁰⁶)\
  \ 它向兼容 MCP 的客户端暴露设计文件数据，以实现令牌级精准的组件生成。在该集成稳定之前，实用的方法是基于图像的：将设计导出为 PNG 并使用 Codex\
  \ CLI 的视觉输入。\n\n```\ncodex \"Implement this design as a React component with Tailwind.\n\
  The image is at /tmp/designs/checkout-flow.png.\nMatch the layout as closely as\
  \ possible. Flag any interactive states\n(hover, focus, disabled) that aren't visible\
  \ in the static image.\"\n```\n\n基于图像的提示词能准确处理结构布局；间距令牌需要人工验证。\n\n**表 23-2. 前端任务类型与推荐的\
  \ Codex CLI 模式**\n\n| **任务类型** | **推荐模式** | **技能或标志** | **备注** |\n| --- | --- |\
  \ --- | --- |\n| 带测试的新组件 | 包含完整需求的单一提示词 | `$new-component` 技能 | 显式包含 Props 接口、状态和测试场景\
  \ |\n| 跨越 UI + API 的功能 | Explorer/Worker 子代理 | 子代理提示块 | Explorer 先运行；Worker 并行运行\
  \ |\n| 无障碍审计 | 专用审计技能 | `$accessibility-audit` 技能 | 同时针对 Vitest (jsdom) 和 Playwright\
  \ (浏览器) |\n| 视觉验证 | 每次 UI 变更后运行 Playwright 技能 | `$playwright-check` 技能 | 测试移动端和桌面端视口\
  \ |\n| 设计到代码 | Figma MCP（若可用）或图像提示词 | MCP 或视觉 | 手动验证间距令牌；MCP 状态为测试版 |\n| TypeScript\
  \ 迁移 | 以 `tsc` 完成为标准的单文件作用域 | 无需额外技能 | 将 `pnpm tsc --noEmit` 添加到完成标准 |\n| 组件库升级\
  \ | Explorer 读取破坏性变更；Worker 应用修复 | 子代理提示块 | 将每个 Worker 的作用域限定为单个组件文件 |\n| CI 质量门禁\
  \ | 带有 Codex Action 的 GitHub Actions 工作流 | `codex-action` | 在匹配 `components/**`\
  \ 的 PR 路径上运行 |\n\n### Codex 浏览器使用：视觉验证\n\n撰写本文时，浏览器使用（Computer Use）功能在 Codex 桌面应用中可用，但在\
  \ Codex CLI GA 发布流中不可用。在依赖它用于生产工作流前，请验证你的版本中的可用性。\n\n**Codex 浏览器使用** 允许代理在无头浏览器中渲染前端输出、点击浏览界面并直观验证结果，从而闭合了原本需要人工开发者检查的环路。^(²⁰⁷)\n\
  \n#### 构建并验证循环\n\n启用浏览器使用后，代理工作流变为一个闭环：\n\n1.  **生成**：代理编写或修改组件\n2.  **构建**：代理运行\
  \ `pnpm build` 和 `pnpm dev` 以编译和服务\n3.  **渲染**：代理在无头浏览器中导航到服务的页面\n4.  **验证**：代理截图，将其与预期设计对比，并识别差异\n\
  5.  **修复**：代理修改代码以解决视觉问题并返回步骤 2\n\n这将验证从人类职责转移给了代理：它自主迭代视觉保真度，在无需开发者干预的情况下捕捉 CSS\
  \ 问题、布局回归和响应式断点问题。\n\n#### 与 Claude Computer Use 和 Devin 的对比\n\n撰写本文时，存在三种基于浏览器的验证竞争方案：\n\
  \n| **功能** | **Codex 浏览器使用** | **Claude Computer Use** | **Devin 沙箱浏览器** |\n| ---\
  \ | --- | --- | --- |\n| 环境 | 无头，代理控制 | 前台，锁定开发者桌面 | 沙箱虚拟机 |\n\n\n\n\n\n| --- |\
  \ --- | --- | --- |\n\n| 与钩子集成 | | 完整：审批钩子和 PostToolUse 钩子均适用 | 部分：受限钩子模型 | 不适用（专有）\
  \ |\n\n| 成本模型 | | 包含在会话中 | Vision API 按截图收费 | 包含在 Devin 订阅中 |\n\n| 适用场景 | | 迭代式前端验证循环\
  \ | 跨任意应用的 GUI 自动化 | 自包含的项目执行 |\n\nCodex 的方案与现有的钩子和审批基础设施集成。每个浏览器操作都受制于管控 Shell\
  \ 命令和文件写入的相同 `PreToolUse` 和 `PostToolUse` 钩子。企业团队可使用管控所有其他代理操作的相同治理模式，对浏览器交互进行审计、应用策略，并记录截图以供合规审查。\n\
  \n#### 何时使用浏览器验证\n\n浏览器使用会增加延迟和 Token 成本。请有选择地使用：\n\n1.  **推荐：** 完成视觉组件后的最终验证、响应式布局测试、提交前的视觉回归检查\n\
  \n2.  **不推荐：** 业务逻辑的快速迭代、纯 API 变更、无视觉组件的后端工作\n\n完成标准模式可自然延伸：将 `pnpm dev && screenshot\
  \ localhost:3000 && verify-visual` 添加到标准链中，只有当视觉输出符合预期时，代理才会将任务标记为完成。\n\n### 总结\n\
  \n1.  **前端 AGENTS.md 解答五个问题。** 包管理器、React 版本及允许的模式、组件库安装方式、测试框架和文件系统边界。缺少这些，Codex\
  \ 会默认采用看似合理但实则错误的假设。\n\n2.  **完成标准使代理具备自我修正能力。** 列出 `pnpm build`、`pnpm test` 和 `pnpm\
  \ tsc --noEmit`，Codex CLI 会迭代直到三者全部通过。\n\n3.  **将重复模式编码为技能。** 诸如 `$new-component`\
  \ 和 `$playwright-check` 之类的技能，消除了逐提示词重新指定约定的需要，并减少了范围蔓延。\n\n4.  **探索者/工作者模式将发现与生成分离。**\
  \ 对于跨越多个子系统的功能，或上下文污染会降低生成质量的场景，请使用该模式。\n\n5.  **axe-core 使无障碍审计可复现。** 通过 `jest-axe`\
  \ 在 Vitest 中集成，通过 `@axe-core/playwright` 在端到端测试中集成，它生成映射 WCAG 的审计报告，Codex CLI 可在单个会话中生成、运行并修复这些报告。\n\
  \n6.  **设计转代码有两条路径。** 编写本文时，Figma 的 MCP 服务器处于测试阶段；基于视觉的工作流可准确覆盖结构布局，但间距 Token 需人工核验。表\
  \ 23-2 按任务类型总结了推荐模式。\n\n7.  **Codex 浏览器使用闭合了构建-验证循环。** 它实现了自主视觉 QA，但请有选择地使用：对于纯后端工作，其延迟和\
  \ Token 成本无法得到证明是合理的。\n\n8.  **前端是** *第 22 章* **后端的门面。** `<DepartureBoard>` 容器直接调用\
  \ `GET /departures`（基础 URL 来自 `NEXT_PUBLIC_DEPARTURES_API_URL`，后端已启用 CORS），纯 `<DepartureBoardView>`\
  \ 依据共享的 `\"RUN\" | \"relax\"` 联合类型进行切换，因此契约在两端均被镜像。看板作为静态导出生成，由 *第 24 章* 与 API 一同部署。\n\
  \n### 练习\n\n1.  **前端 AGENTS.md。** 选取一个你拥有的 React 项目。编写一个 `AGENTS.md`，回答本章的五个问题。添加包含至少三条命令的完成标准部分。用\
  \ Codex 运行一个脚手架任务，记录 `AGENTS.md` 阻止了哪些约定违规，哪些遗漏了。\n\n2.  **探索者/工作者模式。** 找出一个同时涉及新\
  \ UI 界面和新 API 端点的功能。使用探索者/工作者模式编写一个子代理提示词：一个探索者报告数据结构和约束，两个工作者并行实现前端和后端，一个工作者编写\
  \ e2e 测试。在 Codex 会话中运行它，或分析每个工作者需要何种上下文以及探索者报告应如何构建。\n\n3.  **无障碍审计流水线。** 创建本章的\
  \ `$accessibility-audit` 技能并针对三个组件运行。对于每个组件，记录 `axe-core` 在 Vitest (jsdom) 运行与 Playwright\
  \ (浏览器) 运行中分别捕获了哪些违规。找出一个仅在浏览器层面被捕获的违规并解释为何 jsdom 未能捕获。\n\n4.  **设计转代码工作流。** 对需要构建的\
  \ UI 组件截图。使用 Codex CLI 的视觉输入生成初始实现。在三个维度上将结果与原图对比：结构准确性（层级与嵌套）、视觉保真度（间距、颜色、排版）和无障碍性（ARIA\
  \ 属性、键盘导航）。找出哪个维度最准确，哪个需要修正最多。\n\n5.  **配置 TypeScript 专用护栏。** 添加一个匹配文件编辑工具的 `PostToolUse`\
  \ 钩子，在 TypeScript 项目的每次文件写入后运行 `pnpm tsc --noEmit`。通过让 Codex 编写一个故意包含类型错误的函数来测试它。验证钩子触发、错误浮现，且\
  \ Codex 在完成任务前修正了它。记录钩子配置及其防止的失败模式。\n\n# 24\n\n# 基础设施即代码\n\n前两章构建了 Run or Relax：*第\
  \ 22 章* 的后端，*第 23 章* 的前端。两者均在笔记本电脑上运行。要对通勤者有用，它们需要一个栖身之所，而搭建它本身就是一项工作：基础设施。本章将技术栈推向生产环境，且同其他每一章一样，Codex\
  \ CLI 协助编写。\n\n问题在于基础设施非应用代码，这种差异改变了你与代理协作的方式。核心在于影响范围。糟糕的应用代码行导致测试失败；糟糕的基础设施代码行可能拖垮生产环境，或删除其原本旨在托管的资源。因此代理的角色收窄：它规划、起草并提议，人类审查并应用。让代理停留在该界线的“提议侧”是本章剩余内容的主题，随之而来的挑战包括：幻觉资源、未经审查变更的代价，以及守住底线的安全配置。\n\
  \n我们以 Google Cloud Run 为具体部署目标，采用云原生 GCP 项目相同的技术。^(²⁰⁸) 但本章不关于 Google Cloud 配置；而是关于为基础设施工作配置\
  \ Codex CLI，以使该边界得以守住。\n\n### 学习目标\n\n你将能够：\n\n1.  编写适配基础设施仓库的 `AGENTS.md` 文件\n\n\
  2.  配置适合基础设施变更的审批模式和沙箱设置\n\n3.  使用 Codex CLI 生成、审查和重构部署服务到 Cloud Run 和静态网站到 Cloud\
  \ Storage 的 Terraform 代码\n\n4.  使用确定性工具（`tflint`、`checkov`）闭环，并将其包装在 `/goal` 中 (*第\
  \ 12 章*)\n\n5.  应用安全护栏，防止未经审查的基础设施变更\n\n6.  将 Codex CLI 集成到基础设施 CI/CD 流水线中\n\n7.\
  \  通过 Terraform MCP 服务器，让代理建立在最新的提供商文档之上\n\n8.  使用 GitOps，使应用边理由架构而非仅策略来强制执行\n\n\
  9.  以只读 `codex exec` 流水线运行漂移检测等第二天运维操作\n\n### 为何基础设施代码抗拒代理\n\n在配置任何内容之前，了解为何基础设施代码比应用代码更难驾驭代理会有所帮助，理由不止影响范围。\n\
  \n\n\n\n大型语言模型以令人担忧的速率幻觉出 Terraform 资源类型和属性名称，这在 Python 中可能只是个小麻烦，但在资源定义中却具有破坏性。^(²⁰⁹)\
  \ 原因是结构性的。Terraform 所使用的 HashiCorp 配置语言 HCL，其训练语料库与 Python 或 TypeScript 相比非常小，而且提供商模式随每个版本发布而变化：Google\
  \ Provider 暴露了数百种资源类型并经常修订其参数，因此六个月前训练的模型会自信地生成已不存在的属性。\n\nCloud Run 资源就是一个典型例子：它已从\
  \ `google_cloud_run_service` 重命名并重构为 `google_cloud_run_v2_service`，而学习了旧结构的模型会尝试访问新资源并不具备的字段。关于\
  \ Terraform 合成的研究发现，即使是强模型也难以驾驭它，经常直接凭空捏造资源类型和属性名称。^(²¹⁰)\n\n如果放任不管，Agent 编写的基础设施会以可预测的方式失败：本应是变量的值被硬编码、本应是模块的代码却成了整体式文件、过度宽松的\
  \ IAM 绑定、缺少加密，以及没有自动化测试或策略检查。^(²¹¹) `terraform validate` 无法捕捉其中任何一项，而且其中几项正是你最不希望进入生产环境的变更。\n\
  \n对策不是避免使用 Agent，而是对其加以约束。基础工作优先：一份编码你的约定与禁令的 `AGENTS.md`，配合 Agent 与提交之间的确定性检查。这足以构建并交付技术栈。然后，一旦它站稳脚跟，模型上下文协议（MCP）服务器通过向\
  \ Agent 提供实时、经过验证的提供商文档，而非陈旧的训练数据，进一步强化生成能力。本章剩余部分将按此顺序，基于这三者展开。\n\n### 面向基础设施仓库的\
  \ AGENTS.md\n\n基础设施仓库的约定与应用代码不同。`AGENTS.md` 文件应显式编码这些差异：\n\n```\n#### AGENTS.md\n\
  ##### 测试命令\n- `terraform fmt -recursive` 用于格式化\n- `terraform init -backend=false`\
  \ 然后 `terraform validate` 用于语法检查\n- `terraform plan -out=tfplan` 用于变更预览\n- `tflint\
  \ --init` 然后 `tflint` 用于静态分析（Google 规则集；`--init` 写入 TFLint 插件缓存）\n- `checkov -d\
  \ . --compact` 用于安全扫描\n##### 约定\n- 提供商：google。目标运行时：Cloud Run；静态资产：Cloud Storage\n\
  - 所有资源使用命名约定：`{project}-{env}-{resource}`\n- 变量定义在 `variables.tf` 中，输出定义在 `outputs.tf`\
  \ 中\n- 远程状态在 `backend.tf` 中配置（GCS 后端）：切勿修改它\n- 使用 `locals` 块定义计算值，而非内联表达式\n- 每个服务一个服务账号；切勿使用默认\
  \ Compute SA\n- 提交 `.terraform.lock.hcl`；切勿将其加入 gitignore（它固定提供商版本）\n##### 禁区\n\
  - 切勿运行 `terraform apply`、`terraform destroy` 或 `gcloud run deploy`\n- 切勿直接修改 `.terraform.lock.hcl`\n\
  - 未经明确批准，切勿修改 `modules/shared/` 下的文件\n- 切勿提交凭据、令牌或密钥值\n```\n\n关键约束在于禁止 `terraform\
  \ apply`，此处将其延伸至 `gcloud run deploy`，因为后者跨越了相同的边界，直接将版本推送到生产环境。与应用代码不同（运行测试是安全的），这些命令可能产生即时且不可逆的影响。Agent\
  \ 应负责规划、验证和提议；由人工审核并应用。\n\n但仅写在 `AGENTS.md` 中，该禁令只是建议：Agent 会读取它，通常遵守它，但在状态不佳时仍会运行\
  \ `terraform apply`。对于影响范围达生产环境的命令，“通常”是不够的。将该指令与钩子（*第 9 章*）配对，直接阻断这些命令，将请求变成一堵墙。`PreToolUse`\
  \ 钩子在 Shell 命令运行前触发，可通过非零退出来拒绝执行：\n\n```\n{\n  \"hooks\": {\n    \"PreToolUse\"\
  : [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\"\
  ,\n            \"command\": \"bash .codex/scripts/block-apply.sh\",\n          \
  \  \"statusMessage\": \"Checking for apply-boundary violations…\",\n           \
  \ \"timeout\": 5\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n该脚本读取待执行命令，并拒绝任何会更改实时基础设施的操作：\n\
  \n```\n#!/usr/bin/env bash\n#### .codex/scripts/block-apply.sh\n##### 无论提示词要求什么，阻断跨越应用边界的命令。\n\
  set -euo pipefail\npayload=\"$(cat)\"   # PreToolUse JSON，包含正在运行的命令\nif printf '%s'\
  \ \"$payload\" \\\n  | grep -qE 'terraform[[:space:]]+(apply|destroy)|gcloud[[:space:]]+run[[:space:]]+deploy';\
  \ then\n  echo \"Blocked: apply/destroy/deploy cross the apply boundary. A human\
  \ runs these.\" >&2\n  exit 2\nfi\n```\n\n现在，即使指令失效，边界依然坚守。Agent 仍可随意 `plan` 和 `validate`；唯一那类触达生产环境的命令被拒之门外，由人工在\
  \ Agent 之外刻意执行。同一个钩子可推广到团队想要管控的任何不可逆命令，如 `kubectl delete` 和 `gcloud sql`。\n\n只读沙箱模式（`-s\
  \ read-only`）是基础设施工作最安全的起点。Agent 可以读取你的模块、生成计划并提议变更，但无法写入文件或执行命令。仅当你准备好让 Agent 编写\
  \ Terraform 文件时，才升级至 `workspace-write`。`PreToolUse` 钩子是该 `workspace-write` 阶段的兜底保障：当\
  \ Agent 能运行命令时，禁令必须被强制执行，而非寄希望于信任。\n\n#### 基础设施配置在仓库中的位置\n\n在单语言仓库中，此 `AGENTS.md`\
  \ 是根文件。Run or Relax 不是单语言仓库。到目前为止，仓库根目录已有来自*第 22 章*的 Python `AGENTS.md`，`frontend/`\
  \ 下有来自*第 23 章*的 React `AGENTS.md`，它们各自限定自己的工具链。基础设施文件是同类的第三个，它属于自己的目录，而非根目录：\n\n\
  ```\nrun-or-relax/\n├── AGENTS.md            # Python: uv, pytest, ruff (第 22 章)\n\
  ├── src/departures/      # FastAPI 服务\n├── frontend/\n│   └── AGENTS.md        #\
  \ React: pnpm, vitest (第 23 章)\n└── infra/\n    ├── AGENTS.md        # Terraform:\
  \ validate, tflint, checkov, never apply\n    └── modules/         # cloud_run,\
  \ site, ...\n```\n\nCodex CLI 按作用域顺序合并 `AGENTS.md` 文件，最深层优先，即*第 22 章*中的嵌套覆盖行为，因此\
  \ `infra/` 下的文件仅在 Agent 处理基础设施时生效。这种作用域划分并非表面功夫。根文件规定所有工具通过 `uv run` 运行，且任务在 pytest\
  \ 通过时完成，这对 Terraform 完全错误：若将基础设施约定放在根目录，它们将与 Python 约定在三分之二的仓库范围内相互矛盾。将它们放在 `infra/`\
  \ 中，Agent 就在编写 HCL 的地方准确获得 `terraform validate` 和应用禁令，而 Python 和 React 规则则完全不在其列。\n\
  \n保持该文件仅包含差异部分。真正共享的约定——规范化提交和绝不提交密钥——从根文件继承而来，因此基础设施 `AGENTS.md` 仅携带基础设施特有的内容：Terraform\
  \ 与扫描器命令，以及最重要的是对 apply、destroy 和 `gcloud run deploy` 的禁止。重复其余内容只会在根文件变更时造成配置漂移。\n\
  \n### 通过确定性工具闭环\n\n\n\n`AGENTS.md` 能够减少 Agent 起步阶段的错误，但无法完全消除。互补的做法是：在 Agent 与提交之间加入一道确定性检查，并将检查结果反馈给\
  \ Agent。Linter 和安全扫描器正是判断 Agent 编写基础设施代码的最佳“裁判”：它们速度快，每次返回相同的裁决，且每条发现都指向具体的文件和行号。Agent\
  \ 是概率性的，而这些工具不是，这种反差正是它们的价值所在。\n\n有两款工具几乎在每个 Terraform 仓库中都占有一席之地：\n\n1.  `tflint`\
  \ 能捕捉 `terraform validate` 遗漏的问题：弃用语法、无效参数及其他 Provider 特有的错误、未使用的声明，以及 `AGENTS.md`\
  \ 规定的命名约定。启用 Google 规则集，使其了解 Cloud Run 和 Cloud Storage 的特定细节。\n2.  `checkov` 能从本章一开始就扫描出安全误配置：未加密存储、公共入口、过度权限的\
  \ IAM —— 这些 `terraform validate` 会直接放行。其基于图的检查能跨资源进行推理，而非逐个检查，因此能捕捉单资源扫描器遗漏的关系性错误；且在检查失败时返回非零退出码，这使其可作为质量门禁使用。\n\
  \n提升来自于在会话*内部*运行这些工具，而非事后。因为工具是确定性的，“退出码为零”是一个明确无歧的目标，Agent 可以针对它反复迭代；这不像“使其安全”这种目标，Agent\
  \ 只能大致逼近：\n\n```\ncodex --profile infra-write \"生成用于作为静态网站托管 Run or Relax 看板的 Cloud\
  \ Storage 存储桶模块，需求见 README.md。随后在结果上运行 tflint 和 checkov，修复它们报告的每一个问题。重复此过程，直到两条命令均退出码为零，然后展示最终的\
  \ diff。\"\n```\n\n每一轮迭代都在缩小“看似合理的 HCL”与“能通过检查的 HCL”之间的差距。典型流程是：Agent 生成模块，收到 `checkov`\
  \ 警告存储桶缺少统一存储桶级访问权限或版本控制，添加两者，重新运行，仅在工具不再报警时停止。\n\n有一条发现结果不应被静默，且极具指导意义：网站存储桶必须向\
  \ `allUsers` 授予 `roles/storage.objectViewer`，而 `checkov` 每次都会标记该公共读取权限。存储桶*旨在*公开，因此正确的做法是添加带有文档说明的行内抑制，而非修改代码。你将看到一个除了这条发现外已经干净的\
  \ diff，你可以阅读并批准其抑制理由。\n\n这也是 Goal Mode（*第 12 章*）大显身手的地方。目标需要一个位于 Agent 之外的验证界面，一个其退出码能回答“完成了吗？”的命令，而一次干净的\
  \ `tflint` 和 `checkov` 运行正是如此。用 `/goal` 包装循环，可使停止条件显性化，并以 Token 预算限定工作量。在会话内设置它，`/goal`\
  \ 是在 Codex TUI 中输入的斜杠命令，而非 Shell 参数：\n\n```\n/goal \"根据 README.md 为 Run or Relax\
  \ 看板生成静态网站存储桶模块。当 terraform validate、tflint 和 checkov 均退出码为零，且公共读取发现已通过行内抑制并附带理由时视为完成。仅在\
  \ modules/site/ 下编写文件。\"\n```\n\nAgent 会迭代直到检查通过或预算耗尽，因为完成标准是真实的命令而非其自我判断，所以它无法在基础设施仍未通过扫描器时宣称胜利。在启动前，请将\
  \ *第 12 章* 的五问评估量表应用于目标陈述。应用边界依然存在：目标负责编写和验证；绝不运行 `terraform apply`。\n\n同样的工具也应作为不可商量的质量门禁存在于\
  \ CI 中，这样人工审查 Pull Request 时，看到的仅是已经通过检查的变更：\n\n```\n#### .github/workflows/terraform-review.yml\
  \ (lint and scan step)\n- name: Lint and scan\n  run: |\n    tflint --format compact\n\
  \    checkov -d . --compact\n```\n\n界限清晰：确定性工具捕捉可编目录举的问题，而非意图。它们会告诉你存储桶是全球可读的；但不会告诉你这是静态网站（没问题）还是数据存储桶（泄露）。它们不会告诉你模块抽象是否错误，或执行计划是否会删除服务。这种判断留待本章后面的计划审查，以及执行\
  \ `apply` 的人类。Linter 提高了底线；它们无法替代天花板。\n\n### Terraform 工作流\n\n#### 模块生成\n\nCodex\
  \ CLI 根据自然语言描述生成 Terraform 模块。看板的存储桶是 Run or Relax 部署中最小的组件，因此是一个很好的首个模块：\n\n```\n\
  创建一个用于作为静态网站托管 Run or Relax 看板的 Cloud Storage 存储桶 Terraform 模块，要求：\n- 启用统一存储桶级访问权限\n\
  - public_access_prevention 设为 \"inherited\" 而非 \"enforced\"：公共网站存储桶需要此设置，因此添加一条行内\
  \ checkov 抑制并解释该例外\n- 网站配置（索引页 index.html，404 页 404.html）\n- 对象版本控制（以便不良的看板部署可回滚）\n\
  - 通过授予 allUsers roles/storage.objectViewer 的 IAM 绑定实现公共读取，附带一条行内 checkov 抑制说明这是有意公开的站点\n\
  - 存储桶名称由项目和环境构建（例如 ${project}-${env}-rr-board），因为存储桶名称全局唯一且上限为 63 字符\n- 包含项目、环境和位置的变量\n\
  - 输出存储桶名称、站点 URL（index.html 地址）以及源（仅协议和主机），供 API 的 CORS 配置使用\n```\n\nAgent 将按照 `AGENTS.md`\
  \ 中的约定生成 `main.tf`、`variables.tf` 和 `outputs.tf`。在提交前运行 `terraform validate`、`tflint`\
  \ 和 `checkov` 验证输出，或让 Agent 自行运行并迭代直到通过，如前文所述的确定性工具循环。\n\n#### 计划审查\n\n计划审查是基础设施团队最高价值的模式，因为它完全位于\
  \ apply 边界的安全一侧：\n\n1.  运行 `terraform plan -out=tfplan` 并捕获输出\n2.  请求 Codex CLI\
  \ 审查计划中的风险、非预期变更和安全顾虑\n3.  Agent 识别正在被销毁、修改或创建的资源，并标记任何异常情况\n\n    ```\n    terraform\
  \ plan -out=tfplan -no-color > plan-output.txt\n    codex exec -a untrusted -s read-only\
  \ \"审查 plan-output.txt 中的 Terraform 计划，找出风险和非预期变更。标记任何资源删除、IAM 绑定变更，或会导致流量切换的 Cloud\
  \ Run 修订版本。\"\n    ```\n\n#### 重构\n\n基础设施重构遵循与 *第 21 章* 中应用重构相同的模式，但约束更严格。工作内容很熟悉：将单体配置拆分为模块、升级\
  \ Provider 版本、从弃用资源迁移，正是让未落地的 Agent 翻车的 `google_cloud_run_service` 到 `google_cloud_run_v2_service`\
  \ 的迁移。\n\n```\n将 `main.tf` 中的 Cloud Run 配置重构为 `modules/cloud_run/` 下的独立模块。\n保留所有资源地址，以便重构后\
  \ `terraform plan` 显示无变更。\n每次变更后运行 `terraform validate` 以验证语法。\n```\n\n零 diff 约束至关重要：在生产环境中触发资源重建的重构不算重构。重建而非更新\
  \ Cloud Run 服务会导致其 URL 和流量丢失；保留资源地址可使计划为空。\n\n### 部署到 Cloud Run\n\n\n\n#### 部署的核心\n\
  \n这是“运行还是放松”部署的核心，也是三章内容汇聚之处。API 是一个容器；Cloud Run 运行容器，并在没人询问是否为 07:02 班次发车时将其缩容至零。看板是静态文件；Cloud\
  \ Storage 存储桶以运行服务器成本的一小部分来托管它们。Terraform 供应这两者，而 Codex CLI 编写 Terraform 代码。\n\n\
  在开始这一切之前，先确定 *Chapter 24* 和 #n 留下了什么，因为部署直接连接到它们：\n\n1.  FastAPI 应用可作为 `departures.app:app`\
  \ 导入，这是容器启动命令所需的路径。\n2.  Cloud Run 将流量路由到 `$PORT` 中命名的端口（默认为 8080），因此服务器必须绑定 `0.0.0.0:$PORT`，而不是开发环境的默认值。\n\
  3.  看板构建输出到静态 `out/` 目录（来自 *Chapter 23* 的 `output: \"export\"`）；该目录即上传到存储桶的内容。\n\
  4.  看板从 `NEXT_PUBLIC_DEPARTURES_API_URL` 读取 API 地址，该地址在构建时烘焙进去，而 API 通过 `RUN_OR_RELAX_CORS_ORIGIN`\
  \ 允许看板访问。这两个值是接缝处：搞错它们，部署后的看板将渲染空白，而所有测试依然显示通过。\n\n##### 容器入口点\n\n构建包会检测 Python\
  \ 项目并构建镜像，无需 Dockerfile，但它无法猜测如何在 Cloud Run 的端口上启动 Web 服务器。单行 `Procfile` 消除了歧义：\n\
  \n```\n###### Procfile\nweb: uvicorn departures.app:app --host 0.0.0.0 --port ${PORT:-8080}\n\
  ```\n\n`${PORT:-8080}` 在生产环境中采用 Cloud Run 注入的 `$PORT`，在本地则回退到 8080。如果省略它，镜像仍能构建且部署仍会成功，但容器永远不会响应，Cloud\
  \ Run 会在健康检查中将其终止——这看起来像基础设施故障，实则是缺少启动命令。\n\nAPI 发布前还有一个问题需要回答：其数据从何而来。真正的“运行还是放松”会从火车时刻\
  \ API 读取实时发车和延误数据；`timetable.json` 和 `delays.json` 只是占位符，以便本章有内容可部署。作为一次性示例数据，它们随镜像\
  \ *内部* 搭载，无需额外供应。生产系统则会将服务指向实时 API，其基础 URL 作为配置，密钥存放在 Secret Manager 中，但这项工作超出了本章范围，也不影响后续的\
  \ Codex 工作流。\n\n##### 认证与引导远程状态\n\nAgent 编写 Terraform；它不持有你的云凭据，也无法创建存放自身状态的存储桶。两者均为人工、一次性的设置，必须在任何模块应用之前完成，跳过它们是首次部署死于\
  \ `terraform init` 的最常见方式。首先进行认证，将应用程序默认凭据指向项目：\n\n```\ngcloud auth login\ngcloud\
  \ auth application-default login\ngcloud config set project \"$PROJECT_ID\"\ngcloud\
  \ auth application-default set-quota-project \"$PROJECT_ID\"\n```\n\n随后在 Terraform\
  \ 之外创建状态存储桶，因为后端必须先存在，Terraform 才能用它来存储状态，这是一个真正的“鸡生蛋、蛋生鸡”问题，无法通过任何 `terraform apply`\
  \ 解决：\n\n```\ngcloud storage buckets create \"gs://${PROJECT_ID}-terraform-state\"\
  \ \\\n  --project=\"$PROJECT_ID\" --location=\"$REGION\" --uniform-bucket-level-access\n\
  gcloud storage buckets update \"gs://${PROJECT_ID}-terraform-state\" --versioning\n\
  ```\n\n仓库附带一个带有占位符存储桶名的 `backend.hcl.example`；它无法直接使用。将其复制为 `backend.hcl` 并填入你真实的、全局唯一的存储桶名。状态存储桶名称在整个\
  \ Google Cloud 中必须唯一，因此 `PROJECT-terraform-state` 必须改为特定于项目的名称：\n\n```\n###### infra/backend.hcl\n\
  bucket = \"your-project-id-terraform-state\"\nprefix = \"run-or-relax/dev\"\n```\n\
  \n现在初始化后端，每当 `backend.hcl` 变更时重新运行并加上 `-reconfigure`：\n\n```\nterraform -chdir=infra\
  \ init -reconfigure -backend-config=backend.hcl\n```\n\n即使 `terraform init` 因后端失败，`terraform\
  \ validate` 仍可能打印 `Success! The configuration is valid.`，因为它仅检查本地文件的语法和提供商模式。绿色的\
  \ `validate` 并非后端初始化成功、状态存储桶存在或凭据健康的证据。请看 `init` 的结果，而非 `validate` 的结果，以判断部署就绪情况。\n\
  \n如果 `init` 因 `auth: \"invalid_grant\"` 失败，问题出在认证而非你的 HCL：凭据过期、账号错误，或环境变量强制覆盖了服务账号密钥。重新运行前述的\
  \ ADC 登录，若有密钥被强制设置，则清除它：\n\n```\ngcloud auth list                          # 哪个账号处于活动状态\n\
  echo \"$GOOGLE_APPLICATION_CREDENTIALS\"    # 是否有密钥被强制设置？\nunset GOOGLE_APPLICATION_CREDENTIALS\n\
  terraform -chdir=infra init -reconfigure -backend-config=backend.hcl\n```\n\n本小节从人工视角诠释了本章主题：Agent\
  \ 始终处于边界的“提议方”一侧，而凭据和状态存储桶——此处仅有的两个真正能接触账户的东西——由人设置。\n\n##### 引导：API 与镜像仓库\n\n首次镜像推送前还需两样东西就绪，两者均由\
  \ Terraform 一次性创建：堆栈使用的 Google API，以及镜像落地的 Artifact Registry 仓库。将它们作为引导模块生成：\n\n\
  > 创建一个 Terraform 引导模块，要求：\n> - 使用 `google_project_service` 启用所需的 Google API：Cloud\
  \ Run、Cloud Build、Artifact Registry、IAM 和 Cloud Storage\n> - 在目标区域创建名为 `run-or-relax`\
  \ 的 `google_artifact_registry_repository`（Docker 格式）。Google 托管加密对教学仓库足矣，因此为 customer-managed-key\
  \ 发现添加内联 checkov 抑制\n> - 项目和区域的变量；输出仓库路径\n\n该模块必须在其余部分 *之前* 应用，原因在于一个真实的首部署顺序陷阱。对整个堆栈进行单次\
  \ `terraform apply` 会同时规划 Cloud Run 服务和 Artifact Registry 仓库，但服务引用的镜像在仓库创建前无法存在，导致应用失败。单独先应用引导模块（或将其作为拥有独立状态的单独\
  \ Terraform 根模块，长远来看更整洁），然后构建，最后应用其余部分：\n\n![Figure 24.1 - Deploying to Cloud Run](img/B40007_24_01.png)\n\
  \n**图 24.1 - 部署到 Cloud Run**\n\n部署作为有序序列运行：人工认证并在 Terraform 外创建状态存储桶，然后运行 init，第一阶段应用引导模块，构建并推送镜像，规划，Agent\
  \ 评审规划，第二阶段应用，上传看板。虚线标记鸡生蛋依赖：仓库必须在镜像构建前存在，镜像必须在第二次应用前存在。\n\n```\n###### 阶段 1：仅 API\
  \ 和仓库\nterraform -chdir=infra apply -target=module.bootstrap\n```\n\n构建前，添加 `.gcloudignore`，以便\
  \ Cloud Build 上传源代码而非虚拟环境、node 模块、缓存和本地 Terraform 状态，这关乎几百个文件与一吉字节的区别：\n\n```\n\
  ###### .gcloudignore\n.git\n.venv/\n.uv-cache/\n.mypy_cache/\n.pytest_cache/\n.ruff_cache/\n\
  **/__pycache__/\nfrontend/node_modules/\nfrontend/.next/\nfrontend/out/\ninfra/.terraform/\n\
  infra/backend.hcl\ninfra/*.tfvars\ninfra/tfplan\ninfra/plan-output.txt\n```\n\n\
  现在构建并推送。标签不仅仅是装饰：它必须与 Cloud Run 模块读取的 `image_tag` 变量匹配，否则 Terraform 将部署一个不存在的标签。\n\
  \n```\ngcloud builds submit --pack image=REGION-docker.pkg.dev/PROJECT/run-or-relax/api:v1\
  \ .\n```\n\n默认构建包从 *Chapter 22* 拾取项目的 3.14 版本锁定并无需额外配置即可构建；保持运行时最新正是让这一步保持平淡无奇的关键。\n\
  \n##### Cloud Run 服务\n\n\n\n\n\n后续部署会更改正在运行的基础设施，因此这是 Terraform 的工作，而 Agent 的工作是编写它：\n\
  \n```\n创建一个 Terraform 模块，将 Run or Relax API 部署到 Cloud Run，要求：\n- 一个运行镜像 `REGION-docker.pkg.dev/PROJECT/run-or-relax/api`\
  \ 的\n  `google_cloud_run_v2_service`，镜像标签为变量 `image_tag`\n- 容器监听端口 `8080`\n- 一个专用服务账号（最小权限），而非默认的\
  \ Compute SA\n- 实例数从 0 扩缩容至最多 4 个\n- 将环境变量 `RUN_OR_RELAX_CORS_ORIGIN` 设置为看板的源站（仅\
  \ scheme 和 host，\n  例如 `https://BUCKET.storage.googleapis.com`，不含路径）\n- 公开的 invoker\
  \ 绑定（向 `allUsers` 授予 `roles/run.invoker`）：看板直接从浏览器\n  调用 API，因此该服务有意设为公开\n- `project`、`region`、`image_tag`\
  \ 和 `cors_origin` 变量\n- 一个输出服务 URL 的 output\n```\n\n该提示词中的两行正在进行跨章节连线，值得注意，因为这正是部署通常出故障的地方。`RUN_OR_RELAX_CORS_ORIGIN`\
  \ 是 FastAPI 服务为其 CORS 中间件读取的环境变量（第 22 章），它需要一个*源站*——仅包含 scheme 和 host，不含路径（`https://BUCKET.storage.googleapis.com`），而不是人类访问的\
  \ `index.html` URL。将其设置为看板存储桶的源站，浏览器的跨域 fetch 就会被允许；如果留空，或设置为完整的页面 URL，来自已部署看板的每个请求都会被拦截，而每个后端测试仍会通过。看板存储桶的模块正因如此输出这两个值：给人的\
  \ `site_url` 和给 API 的源站。而该模块输出的 Cloud Run 服务 URL，正是看板在构建时作为 `NEXT_PUBLIC_DEPARTURES_API_URL`（第\
  \ 23 章）注入的值。两个服务通过 Terraform 的输出和变量互相发现，而非硬编码字符串，这才使得同一配置能同时支撑仅 `.tfvars` 不同的开发环境和生产环境副本。\n\
  \n公开的 invoker 绑定是你有意保留的几个 `checkov` 发现之一，表 24-1 列出了它们。向 `allUsers` 开放 Cloud Run\
  \ 服务通常是危险信号；但这是一个公开的只读发车看板，因此该抑制是诚实的，审阅者也能明白原因。与存储桶一样，工具捕获可编目的问题，人类提供意图。\n\n#####\
  \ 计划前先验证\n\n首先按 Google 规则集要求的顺序，对 `infra/` 运行确定性工具（`tflint --init` 会在 `tflint` 使用前安装插件）：\n\
  \n```\nterraform fmt -recursive infra\nterraform -chdir=infra init -backend=false\n\
  terraform -chdir=infra validate\ntflint --chdir=infra --init\ntflint --chdir=infra\n\
  checkov -d infra --compact\n```\n\n这种 `init -backend=false` 是离线路径：它在无凭据、无状态后端的情况下验证语法和\
  \ Provider 模式，这正是 Agent 循环所需的。带后端配置的真实 `init` 来自 bootstrap 步骤，是部署时使用的那个。无论哪种方式，`terraform\
  \ init` 都会下载 Provider 插件并写入 `.terraform.lock.hcl`；请提交该锁文件，以便每台机器和 CI 运行都解析到相同的 Provider\
  \ 版本。\n\n某些沙箱 Agent 环境会阻止 Provider 下载和插件安装，因此 `terraform init`、`terraform validate`、`tflint\
  \ --init` 和 `checkov` 的元数据查询可能在受限沙箱中停滞或失败。若出现这种情况，请批准网络访问或在普通终端运行验证步骤；那是工具在访问注册表，而非你的配置有误。\n\
  \n##### 计划、审阅、应用、再上传\n\n在任何内容发布前先计划和审阅，沿用之前同一个安全侧边界循环：\n\n```\nterraform -chdir=infra\
  \ plan -out=tfplan -no-color > plan-output.txt\ncodex exec -a untrusted -s read-only\
  \ \"Review plan-output.txt. Confirm the Cloud Run service, its service account,\
  \ the IAM invoker binding, the Artifact Registry repository, and the static-site\
  \ bucket are created as expected, and flag anything else.\"\n```\n\n人类阅读审阅结果并运行\
  \ `terraform apply`，这是第二阶段的 apply，此时 Cloud Run 服务引用的镜像已存在。这会创建存储桶，但不会填充内容。上传已构建的看板是一个单独的内容部署步骤，有意与预置分离，这也是\
  \ 第 23 章 中静态 `out/` 目录与 Terraform 刚创建的存储桶相遇的唯一地方：\n\n```\ngcloud storage cp -r frontend/out/*\
  \ gs://$(terraform -chdir=infra output -raw board_bucket)/\n```\n\n现在 Run or Relax\
  \ 在 Cloud Run URL 后回答 `GET /departures`，而看板从存储桶渲染它。始于纯判定函数的线程终于部署服务而告终，且 Agent 从未跨越\
  \ apply 边界。\n\n##### 预期的 Checkov 发现\n\n此栈上干净的 `checkov` 运行并非零发现，而是零*未解释*发现。少数发现每次都会触发，且保留它们是正确的，因为对于一个小型公开教学部署，被标记的行为是有意为之。纪律要求在行内用审阅者可读的注释逐个抑制，而非整体静默扫描器。表\
  \ 24-1 是预期的集合。\n\n**表 24-1. 预期的 Checkov 发现及对应决策**\n\n| 发现 | 资源 | 决策 |\n| --- | ---\
  \ | --- |\n| 公开读取（`allUsers` → `roles/storage.objectViewer`） | 看板存储桶 | 跳过，行内论证：有意为公开网站\
  \ |\n| 未强制执行公开访问防护 | 看板存储桶 | 跳过，行内论证：公开网站需要例外；日志存储桶保持强制执行 |\n| 未配置访问日志接收器 | 看板存储桶\
  \ | 教学部署跳过；生产环境启用存储桶日志记录 |\n| 无客户管理加密密钥 | Artifact Registry 仓库 | 跳过：Google 托管加密在此足矣；策略要求时使用\
  \ CMEK |\n| 公开调用者（`allUsers` → `roles/run.invoker`） | Cloud Run 服务 | 跳过，行内论证：看板是公开的只读\
  \ API |\n\n除此表之外的任何发现都是需修复的真实问题，而非已知例外，这正是该门禁存在的意义：噪音已编目，因此下一个新的失败会凸显出来。\n\n位置比看起来更重要。`#checkov:skip`\
  \ 注释必须位于其适用的资源块*内部*，作为块主体的第一行，而不能在 `resource` 声明的上一行。Checkov 3.3.0 仅遵循块内发现的抑制；块上方的注释会被忽略，发现依然会触发：\n\
  \n```\nresource \"google_storage_bucket_iam_member\" \"board_public_read\" {\n \
  \ #checkov:skip=CKV_GCP_28:Intentional public website; the board is read-only static\
  \ content\n  bucket = google_storage_bucket.board.name\n  role   = \"roles/storage.objectViewer\"\
  \n  member = \"allUsers\"\n}\n```\n\nCheck ID 后的文本即为论证，这是审阅者阅读的部分。一条抑制、一个资源、一个可批准的理由，这种纪律让表\
  \ 24-1 的编目保持诚实。\n\n##### 当 Cloud Run 不够用时：GKE\n\nCloud Run 完美契合 Run or Relax：一个可缩容至零的无状态\
  \ HTTP 服务。当服务超出其承载范围时——持续流量使缩容至零不再有帮助、需要 sidecar、细粒度网络、或非请求-响应工作负载——目标变为 Kubernetes，产物变为清单而非\
  \ Cloud Run 资源。Codex 模式不变；仅验证命令改变。将它们添加到 `AGENTS.md`：\n\n```\n##### 测试命令\n- `kubectl\
  \ apply --dry-run=client -f .` 用于语法验证\n- `kubeconform -strict .` 用于模式验证\n```\n\n\
  \n\n\n\n代理会从与 Cloud Run 模块相同类型的需求提示词中生成 `Deployment`、`Service` 和 `HorizontalPodAutoscaler`，包括副本数量、资源限制、针对\
  \ `/healthz` 的探针以及 ConfigMap 引用，随后你可在提交前使用 `kubectl` 和 `kubeconform` 命令验证输出结果。这一逃生通道真实存在，但极少需要；只有当\
  \ Cloud Run 的限制（而非你的习惯）强制你迁移时，才应采用它。\n\n### 通过 Terraform MCP 服务器强化生成\n\n技术栈现已就绪，但仍有一种故障模式仅能在事后被发现，而无法被预防：过时的提供商知识。`AGENTS.md`\
  \ 编码了你的规则，扫描器能捕获不安全的输出，但二者都无法阻止代理编造一个已不存在的资源参数。一旦主干路径建立，这就是对其进行强化的增强措施。这项工作由 HashiCorp\
  \ 官方的 Terraform MCP 服务器承担，它赋予任何模型上下文协议客户端（包括 Codex CLI）实时访问 Terraform Registry 的能力，而非依赖模型的训练快照。^(²¹²)\
  \ *第 8 章* 概述了 MCP 的通用设置；基础设施特有的决策在于你暴露哪些工具。\n\n这正是 Google 提供商频繁变更造成麻烦的地方，因此也是实时查询大显身手之处：代理确认\
  \ `google_cloud_run_v2_service` 的当前参数，而不是去猜测它在本章早些时候绊倒的那个已重命名的资源。将该服务器添加到项目的 `.codex/config.toml`\
  \ 中，并通过 `enabled_tools` 限定其作用域，以便代理仅能看到只读的注册表查询工具：\n\n```\n[mcp_servers.terraform]\n\
  command = \"docker\"\nargs = [\"run\", \"-i\", \"--rm\", \"hashicorp/terraform-mcp-server\"\
  ]\nenabled_tools = [\n  \"search_providers\", \"get_provider_details\", \"get_latest_provider_version\"\
  ,\n  \"search_modules\", \"get_module_details\", \"get_latest_module_version\",\n\
  \  \"search_policies\", \"get_policy_details\",\n]\n```\n\n这些工具能回答那些原本会导致幻觉的问题：资源实际接受哪些参数、提供商或模块的当前版本、模块是否经过验证，以及适用哪些策略。^(²¹³)\
  \ 代理会查阅这些信息，而不是靠猜测。\n\n该服务器还附带用于 HCP Terraform 和 Terraform Enterprise 的工作区管理工具，包括创建运行、应用或丢弃操作。^(²¹⁴)\
  \ 这些工具跨越了应用边界，因此请将它们排除在无人值守运行的代理配置文件的 `enabled_tools` 列表之外。此模式贯穿全章：暴露读取操作，保留应用操作。注册表查询可安全自动化；触发运行则不然。\n\
  \n### GitOps：将应用边界结构化\n\n截至目前，所有措施皆通过策略来强制执行应用边界：`AGENTS.md` 禁令、沙箱模式、人工把关的流水线步骤。GitOps\
  \ 则通过架构来强制执行，这更为稳健，因为它不依赖于代理遵守指令。\n\n在 GitOps 工作流中，Git 是单一事实来源，协调控制器持续应用提交的任何内容。^(²¹⁵)\
  \ 代理绝不接触集群或项目。它的唯一写入操作是提交或拉取请求；控制器负责应用。在 Google Cloud 上，这可以是协调 Kubernetes 状态的 Config\
  \ Sync，或是在合并到 `main` 分支时运行 `terraform apply` 的 Cloud Build 触发器，从而使基础设施变更的动作变为合并行为，而非提示行为。无论哪种方式，本章其余部分通过配置捍卫的边界都成为系统的一个属性：一个没有凭证且仅能输出提交的代理，无论被如何提示，都无法应用变更。\n\
  \n这使得 GitOps 非常适合代理生成的基础设施。其产出物——Terraform 变更、Kubernetes 覆盖层、环境晋升编辑——具有重复性、模式约束性，且在合并前即可验证。为了一次性引入多个环境，带有输出模式的\
  \ `codex exec` 可生成结构化输出，供流水线拆分为文件并提交：\n\n```\ncodex exec \\\n  --sandbox workspace-write\
  \ \\\n  --output-schema envs-schema.json \\\n  \"Read environments.yaml, which lists\
  \ each environment with its project id and \\\n   region. Generate the per-environment\
  \ tfvars and backend config for the Run or \\\n   Relax stack, following the GitOps\
  \ conventions in AGENTS.md.\"\n```\n\n代理将文件写入工作副本；CI 验证它们并打开拉取请求。人工审核合并，随后控制器或由合并触发的\
  \ `terraform apply` 协调变更。需要审慎对待的唯一之处是同步策略：允许非生产环境自动自我修复和修剪，但将任何可能删除生产资源的变更视为独立的受审核变更，而非附带的编辑。^(²¹⁶)\n\
  \n### 安全护栏\n\n#### 审批模式配置\n\n对于基础设施工作，推荐的配置比应用代码更严格。`approval_policy` 和 `sandbox_mode`\
  \ 是顶层配置键，因此捕获两种姿态最简洁的方式是使用两个配置文件，Codex CLI 通过 `--profile` 将它们叠加在你的基础配置之上：\n\n```\n\
  ##### ~/.codex/infra-review.config.toml — 计划审查：仅读取\napproval_policy = \"untrusted\"\
  \nsandbox_mode = \"read-only\"\n##### ~/.codex/infra-write.config.toml — 编写创作：写入需审批\n\
  approval_policy = \"untrusted\"\nsandbox_mode = \"workspace-write\"\n```\n\n使用 `codex\
  \ --profile infra-review` 进行计划分析和代码审查，使用 `codex --profile infra-write` 生成或重构模块。`untrusted`\
  \ 审批策略意味着代理在运行命令前会暂停并等待显式审批，因此每次文件写入都被管控。\n\n### CI/CD 集成\n\nCodex CLI 在基础设施流水线中最明确的定位是对每个拉取请求进行计划审查。示例使用\
  \ GitHub Actions，但在 Cloud Build 上结构相同；关键在于代理仅审查，从不应用。\n\n**拉取请求中的计划审查：**\n\n```\n\
  #### .github/workflows/terraform-review.yml\n- name: Generate Terraform plan\n \
  \ run: terraform plan -out=tfplan -no-color > plan-output.txt\n- name: AI plan review\n\
  \  run: |\n    codex exec -a never -s read-only \\\n\"Review the Terraform plan\
  \ in plan-output.txt. Flag resource deletions, IAM changes, and cost implications.\"\
  \ \\\n      -o review-comment.md\n- name: Post review comment\n  uses: actions/github-script@v8\n\
  \  with:\n    script: |\n      const review = require('fs').readFileSync('review-comment.md',\
  \ 'utf8');\n      github.rest.issues.createComment({ ...context.repo, issue_number:\
  \ context.issue.number, body: review });\n```\n\n这是本章前文所述计划审查模式的 CI 集成：它在每个涉及基础设施的拉取请求上运行，生成计划，让\
  \ Codex CLI 以 `read-only` 模式审查并将发现写入文件，随后将该文件作为 PR 评论发布，使计划及其风险与变更一同呈现在人工审查者面前。代理从不应用；它仅做标注。\n\
  \nCodex CLI 在流水线中的另一种计划用法——漂移检测，也符合同一只读、仅报告的模式。它属于第二天运维而非部署流水线，因此在“第二天运维”部分详细介绍，此处不再赘述。\n\
  \n#### 应用边界\n\n基础设施代理的基本法则：**绝不自动应用**。代理负责生成、验证和提议。人工审查计划并运行 `terraform apply`。此边界通过以下方式强制执行：\n\
  \n1.  `AGENTS.md` 指令禁止 apply、destroy 和直接 `gcloud run deploy`（建议性：代理通常遵守）\n2.  一个直接阻止这些命令的\
  \ `PreToolUse` 钩子，将指令从“建议”变为“强制”\n3.  沙箱模式限制阻止命令执行（`read-only`）或对其加以限制（无网络的 `workspace-write`）\n\
  \n\n\n\n\n#### 4. CI/CD 流水线设计：Agent 生成计划，人工审批步骤执行 Apply\n\n这四层设计是有意为之：`AGENTS.md`\
  \ 行声明意图，Hook 使其具有约束力，沙箱从根本上限制 Agent 可运行的内容，而流水线在 CI 中保持相同的边界。\n\n### Day-Two 运维：漂移检测与\
  \ Runbook\n\n资源供应是“第一天”的工作。更长久的工作是“第二天”：健康检查、漂移检测、证书续期和合规扫描，这些持续不断的琐碎工作让生产环境持续运转。因为这些任务读取状态并汇报，而非改变状态，它们天然处于\
  \ apply 边界的安全一侧，而 `codex exec` 将它们转化为可复现、可审计的流水线。^(²¹⁷)\n\n其模式是一致的。调度器（cron 或 CI\
  \ 作业）携带一项运维技能和一个输出 Schema 运行 `codex exec`。Agent 通过沙箱中的只读工具（`gcloud`、`terraform`、`kubectl`）读取基础设施状态，推理异常情况，并输出结构化报告。下游工具解析\
  \ JSON 并将其路由至 Slack、PagerDuty 或仪表盘。^(²¹⁸)\n\n漂移检测是典型用例：对比声明式配置与实际状态并标记差异。输出 Schema\
  \ 使结果可被机器解析：\n\n```\ncodex exec \\\n  --sandbox read-only \\\n  --output-schema\
  \ ./schemas/drift-report.json \\\n  -o /tmp/drift-report.json \\\n  \"Run the drift-check\
  \ skill against the staging environment.\"\n```\n\n`read-only` 沙箱是关键所在：运维读取任务绝不应改变状态。^(²¹⁹)\
  \ 当真正需要修复时，应拆分工作流而非提升检测器的权限。检测技能在 `read-only` 模式下运行并生成报告；一个单独的、经人工批准的步骤执行修复。管控 `terraform\
  \ apply` 的禁令同样管控运维：Agent 观察并提议，由人工或协调控制器执行。\n\n### 其他基础设施工具\n\n以 Terraform 为中心的模式可迁移至基础设施工具箱中的其他工具，每个工具都有其对应的安全预览命令，相当于\
  \ `terraform plan` 的角色。\n\n对于 **Ansible**，`AGENTS.md` 规定使用 `ansible-lint` 进行代码检查，使用\
  \ `ansible-playbook --check --diff` 进行干运行；干运行在不应用的情况下预览变更，扮演与 `terraform plan` 相同的角色。对于\
  \ **Pulumi**，程序是通用代码（TypeScript、Python、Go），因此 Codex CLI 将其视为具有基础设施语义的应用代码；关键约束在于\
  \ `pulumi preview` 是安全的，而 `pulumi up` 需要人工批准。在所有情况下，规则皆相同：存在一个展示拟变更的命令，和一个执行变更的命令，Agent\
  \ 仅被允许使用前者。\n\n### 记录技术栈：项目 README\n\n三章下来，检出的代码库已包含一个完整系统：`src/` 下的 FastAPI 服务，`frontend/`\
  \ 下的 Next.js 看板，以及两者的 Terraform 代码在 `infra/` 下。它尚缺的，是那个告诉下一位阅读者（或六个月后的你）各部分如何契合、如何运行的单一入口文件。这三章努力维护的接缝——CORS\
  \ 源、两个 URL 输出、apply 边界——散落在三章的文本中；根目录下的 `README.md` 正是将它们汇聚为单一操作手册之处。生成它是最后的构建步骤，而\
  \ Agent 已从会话中掌握所需的所有事实：\n\n```\nWrite a root README.md for the Run or Relax project.\
  \ Cover:\n- Architecture: the FastAPI departures API, the static Next.js board,\
  \ and the\n  Terraform stack, and how the board reaches the API (NEXT_PUBLIC_DEPARTURES_API_URL)\n\
  \  and the API allows the board's origin (RUN_OR_RELAX_CORS_ORIGIN)\n- Local setup\
  \ for both toolchains: uv for the backend, pnpm + Corepack for the frontend\n- Backend\
  \ commands: uv run uvicorn, uv run pytest, uv run ruff check/format\n- Frontend\
  \ commands: pnpm dev, pnpm build (static export to out/), pnpm test, pnpm test:e2e\n\
  - Environment variables for each service, with their defaults\n- The seeded data\
  \ files (data/timetable.json, data/delays.json) and what they control\n- The Terraform\
  \ validation workflow: fmt, init -backend=false, validate, tflint, checkov\n- The\
  \ infrastructure boundary in bold: the agent authors and validates, a human runs\n\
  \  terraform apply and the gcloud upload; nothing in this repo applies on its own\n\
  ```\n\n在 README 本身中显式保留 no-apply 边界，而不仅是在 `AGENTS.md` 中。`AGENTS.md` 告诉 Agent 其不可为何；README\
  \ 告诉人工操作员其双手何处被需，这是同一边界从相反两侧的解读。\n\n### 总结\n\n1.  **基础设施需要更严格的约束。** 基础设施仓库比应用代码需要更严格的\
  \ `AGENTS.md`，首要的是显式禁止 apply、destroy 和直接执行 `gcloud run deploy`。\n\n2.  **默认只读。**\
  \ 计划审查使用 `read-only` 沙箱模式，编写代码使用带有 `untrusted` 审批的 `workspace-write` 模式，从而让每一次文件写入都受到把关。\n\
  \n3.  **计划审查是最高价值模式。** 生成计划，让 Agent 审查风险，再由人工执行 apply。这能让 Agent 始终处于 apply 边界的安全一侧。\n\
  \n4.  **重构目标为零差异。** 在生产环境中触发资源重建的重组不算重构；保留资源地址，使 `terraform plan` 显示无变更，Cloud Run\
  \ URL 亦然。\n\n5.  **部署有 Agent 无法推断的前置条件。** 人工完成认证并在首次 `terraform init` 前创建 Terraform\
  \ 状态存储桶（后端无法创建存放自身状态的存储桶）。Cloud Run 需要绑定 `$PORT` 的启动命令（单行 `Procfile`）；首次镜像推送需启用相关\
  \ API 和 Artifact Registry 仓库，因此引导阶段在构建镜像和应用其余资源前单独应用；`.gcloudignore` 防止构建上下文膨胀；且\
  \ buildpack 构建器必须与项目的 Python 版本匹配。绿色的 `terraform validate` 不代表 `init` 成功，干净的 `checkov`\
  \ 运行意味着零*未解释*发现，而非零发现（见表 24-1）。\n\n6.  **CI/CD 止步于计划。** 流水线集成聚焦于 PR 中的计划审查，绝不进行自动化\
  \ apply；漂移检测作为计划的 Day-Two 作业单独运行。\n\n7.  **Agent 提议，人工执行。** 这是全章捍卫的边界。`AGENTS.md`\
  \ 中的禁止声明了这一点，但提示指令仅具建议性；阻止 `terraform apply`、`terraform destroy` 和 `gcloud run deploy`\
  \ 的 `PreToolUse` Hook 使其具有约束力，沙箱模式和人工审批的流水线步层层叠加在其后。\n\n8.  **用确定性工具闭环。** 让 Agent\
  \ 在会话中运行 `tflint` 和 `checkov` 并迭代至干净退出，仅保留你能辩护的抑制项（公共网站存储桶和公共看板 API 合法需要的那些）。干净的扫描运行也是\
  \ Goal Mode 所需的外部验证面，因此循环自然地包裹在 `/goal` 中（*第 12 章*）。\n\n9.  **路径稳定后，强化生成以对抗 Provider\
  \ 漂移。** 基础设施代码是 Agent 幻觉最重之处，Google Provider 的频繁变更（包括 `google_cloud_run_v2_service`\
  \ 重命名）是典型案例。在工作路径跑通后引入 Terraform MCP 服务器，提供经过验证的 Provider、模块和策略文档，`enabled_tools`\
  \ 将无人值守的 Agent 限制为只读注册表查找。\n\n10. **GitOps 使边界结构化。** 当 Agent 的唯一产出是 Git 提交，而控制器或合并触发的\
  \ `terraform apply` 执行应用时，无论提示如何，没有凭证的 Agent 都无法执行 apply。\n\n\n\n\n\n11. **第二天运维操作是只读汇报。**\
  \ 漂移检测、证书校验和合规扫描作为计划内的只读 `codex exec` 流水线运行，产出结构化报告；修复是一个独立的、需经人工批准的步骤。\n\n12. **以\
  \ README 收尾。** 完整的技术栈仍需一个根目录 `README.md`，记录架构、两套工具链的本地搭建与运行命令、环境变量、种子数据、Terraform\
  \ 验证工作流以及禁止应用的边界，以便会话结束后项目仍可运行。将其生成为最后一个构建步骤。\n\n13. **线程在应用边界处结束。** *第 22 章* 至第\
  \ #n 章构建了 Run or Relax API，为其配置了看板，并将其部署到 Cloud Run。智能体能为技术栈编写每一行 Terraform 代码，涵盖\
  \ Cloud Run 服务、静态网站存储桶、服务账号与 IAM，以及将看板源站连接到 API CORS 的部署环境变量，但同一边界依然有效：智能体提议，人工应用。\n\
  \n### 练习\n\n1. **编写基础设施 AGENTS.md。** 为现有的基础设施仓库编写一个 `AGENTS.md`。包含测试命令、命名约定，以及对\
  \ apply 和 destroy 的显式禁止。使用 `-a untrusted -s read-only` 运行 Codex CLI，并请其审查你现有的 Terraform\
  \ 代码是否存在最佳实践违规。\n\n2. **生成并验证看板存储桶。** 为 Run or Relax 看板生成 Cloud Storage 静态网站模块，然后运行完整序列：`terraform\
  \ fmt`、`terraform init -backend=false`、`terraform validate`、`tflint --init`、`tflint`\
  \ 和 `checkov -d infra --compact`。确认每个剩余的 `checkov` 发现都与表 24-1 中的某一行匹配，并为每个发现添加合理的行内抑制注释；将表中未列出的任何发现视为真正的问题进行修复。\n\
  \n3. **构建计划审查流水线。** 设置一个 CI/CD 流水线，使用 `codex exec` 在拉取请求中审查 Terraform 计划。跨五个拉取请求，将智能体的审查与团队的手动审查流程进行对比。\n\
  \n4. **规划 Terraform MCP 服务器。** 在项目的 `.codex/config.toml` 中配置 Terraform MCP 服务器，将\
  \ `enabled_tools` 限制为仅注册表查找。请 Codex CLI 编写 Cloud Run 服务模块，然后通过会话日志确认它是查阅了注册表获取 `google_cloud_run_v2_service`\
  \ 的信息，而非猜测属性名称。\n\n5. **串联两个服务。** 利用 Terraform 输出和变量，连接已部署的组件：Cloud Run 模块输出服务 URL，看板构建时将其作为\
  \ `NEXT_PUBLIC_DEPARTURES_API_URL`，API 的 `RUN_OR_RELAX_CORS_ORIGIN` 设置为看板的存储桶 URL。运行一次\
  \ plan，请 Codex 审查，并确认两个模块间没有任何值是硬编码的。\n\n# 第六部分\n\n# 更宏大的图景\n\n# 25\n\n# 基准测试与真实世界性能\n\
  \n*第 1 章* 至 *第 3 章* 涵盖了 Codex CLI 是什么、如何运行它以及如何有效地提示它。后续章节演示了工具链的主要特性：`AGENTS.md`\
  \ 约定、审批与沙箱模型、模型名单以及钩子系统。你已了解该工具在理论上提供的能力。现在迎来更棘手的问题：它到底有多好？\n\n2026 年，每个 AI 实验室的营销文案都以基准测试百分比开篇。这些数字看起来令人印象深刻，直到你弄清它们在衡量什么，以及它们刻意*不*衡量什么。基准测试之所以重要，是因为它们提供了一致、可复现的信号。它们之所以会误导人，是因为一旦成为衡量成功的首要指标，实验室就会为优化指标本身而非底层能力而努力。\n\
  \n本章将为你提供批判性词汇以审慎解读基准测试宣称，提供背景知识以理解 Codex CLI 在当前格局中的定位，并提供一套在自有代码库上运行评估的具体方法论：唯一真正对你团队重要的基准测试。\n\
  \n### 学习目标\n\n你将能够：\n\n1. 解读基准测试宣称，识别决定其能否与其他宣称相比较的变量\n\n2. 基于当前评估数据，针对不同任务类型在 Codex\
  \ CLI 中选择合适的模型配置\n\n3. 使用 Terminal-Bench 任务格式，设计并运行针对自有代码库的轻量级基准测试套件\n\n### 基准测试格局\n\
  \n三大评测主导了 2026 年初关于 AI 编码智能体的讨论。每项测试衡量不同的能力切片，基准测试的选择往往反映了谁的模型在该测试上表现最佳。\n\n**表\
  \ 25-1. 三大主流 AI 编码基准测试（2026 年 3 月）**\n\n| **基准测试** | **任务** | **范围** | **抗污染能力**\
  \ |\n| --- | --- | --- | --- |\n| SWE-bench Verified | 500 个 Python 任务 | Bug 修复补丁\
  \ | 低：已知存在污染担忧 |\n| SWE-bench Pro | 1,865 个多语言任务 | 多文件变更 | 高：包含 GPL 和专有代码库 |\n|\
  \ Terminal-Bench 2.0 | 89 个端到端任务 | 完整终端工作流 | 高：Docker 环境，众包构建 |\n\n理解这三者的区别是解读产品发布、大会演讲或供应商对比中引用的任何分数的前提条件。\n\
  \n#### 基准测试演进：编码模型五年进化史\n\n在详细考察每个基准测试之前，回顾模型发展的历程将大有裨益。从 OpenAI 最初的 Codex（2021）到\
  \ GPT-5.4（2026）的轨迹，展示了快速提升后随之而来的基准测试饱和模式——这是社区需要更难评测的一个反复出现的信号。\n\n**HumanEval（函数级代码生成）**\n\
  \n| **模型** | **年份** | **得分** |\n| --- | --- | --- |\n| Codex-12B | 2021 | 28.8%\
  \ |\n| GPT-3.5 Turbo | 2023 | 67.0% |\n| GPT-4 | 2023 | 87.0% |\n| GPT-4o | 2024\
  \ | 90.2% |\n| GPT-5 / Claude 4 Opus+ | 2025+ | 95%+（饱和） |\n\nHumanEval 实际上已饱和：每个前沿模型得分均超\
  \ 90%，剩余差距属于噪声而非信号。社区已主要转向 SWE-bench 和 Terminal-Bench 作为区分度更高的评测。\n\n**SWE-bench\
  \ Verified（真实 GitHub 问题解决）**\n\n| **模型/智能体** | **年份** | **得分** |\n| --- | --- |\
  \ --- |\n| GPT-4o (baseline) | 2024 | 33.2% |\n| o1-preview | 2024 | 41.3% |\n|\
  \ o3 | 2025 | 71.7% |\n| GPT-5.2 Codex | 2025 | 75.2% |\n| Claude Opus 4.5 | 2026\
  \ | 80.9% |\n| GPT-5.5 | 2026 | 88.7% |\n\n鉴于污染问题（见下节），前沿模型得分超过 ~60% 的情况应持怀疑态度。进步是真实的，但被夸大了。\n\
  \n**Codeforces Elo（竞赛编程）**\n\n| **模型** | **年份** | **Elo** |\n| --- | --- | --- |\n\
  | o1 | 2024 | 1,258 |\n| o3 | 2025 | 2,727 |\n\no3 从 1,258 跃升至 2,727 Elo，是任何编码基准测试中单代际改进最显著的一次，使该模型跻身人类竞赛程序员的顶尖行列。这种能力转化为算法密集型任务的优势，但无法预测其在\
  \ SWE-bench 和 Terminal-Bench 所衡量的多文件工程工作中的表现。\n\n该演进的关键启示：基准测试的改进是真实的，但在任务类型间分布不均。在竞赛编程中占主导地位的模型，可能在真实仓库导航中表现不佳。正如本章后节「数字对你的团队意味着什么」所述，始终将基准测试与你的工作负载相匹配。\n\
  \n### SWE-bench：从金标准到警示录\n\n#### SWE-bench 实际衡量的内容\n\nSWE-bench 由普林斯顿大学创建，旨在评估语言模型解决从\
  \ 12 个热门 Python 仓库中抽取的真实 GitHub 问题的能力。^([220)] 智能体接收问题描述以及问题提出时对应提交点的仓库快照，必须生成一个补丁。成功与否是二元的：应用补丁，运行现有测试套件，通过或失败，不给予部分分数。\n\
  \n\n\n\n#### SWE-bench：从诊断标准到古德哈特指标\n\n这比早期的基准（如 `HumanEval` 或 `MBPP`）要难得多。^(^²²¹^)\
  \ 模型必须在陌生的代码库中导航，理解跨文件交互，并生成一个满足由另一位工程师为不同目的编写的测试的补丁。当 SWE-bench 推出时，这些特性使其成为真正的诊断工具。\n\
  \n#### SWE-bench Verified 与污染问题\n\n2024 年 8 月，OpenAI 发布了 **SWE-bench Verified**，这是一个包含\
  \ 500 个人工验证任务的集合，取自原始的 2,294 个任务。^(^²²²^) 它迅速成为比较智能体的事实标准。分数在 2025 年稳步上升。各厂商竞相冲击排行榜榜首。\n\
  \n随后审计开始了。\n\n到 2026 年初，已发布的审计和厂商对 SWE-bench Verified 的谨慎态度证实了许多人的猜测：前沿模型可以复现 Verified\
  \ 子集任务的金标准补丁，且一些困难任务的测试因错误的原因而通过。\n\n该基准仍能区分较弱和中等水平的模型，但对于前沿模型 Verified 分数超过约 60%\
  \ 的情况，请抱以真正的怀疑态度。该数字在衡量某些东西；只是不清楚有多少是真正的推理，有多少是记忆。\n\n这是 **古德哈特定律** 正在实时上演：\n\n\
  > 当一种衡量标准成为目标时，它就不再是一个好的衡量标准。\n\nVerified 一成为主要排行榜指标，实验室就直接针对它进行优化：在类似任务上微调、调整脚手架以适配评估工具，以及将临近基准的代码纳入训练数据。结果是分数不再能在前沿水平上进行有意义的区分。基准本身没有失效；它是被古德哈特化了。\n\
  \n污染问题并非 SWE-bench 独有。`HumanEval` 分数超过 90% 的也应持类似怀疑态度。任何公开存在足够长时间的基准都会成为训练目标。\n\n\
  #### SWE-bench Pro：诚实的度量\n\n**SWE-bench Pro** 旨在解决 Verified 的结构性弱点。差异显著：\n\n1. \
  \ 1,865 个任务，而非 500 个\n2.  多语言范围，不再局限于 Python\n3.  平均补丁跨度 107 行、涉及 4.1 个文件，而 Verified\
  \ 的中位数仅为每个补丁 4 行\n4.  任务源自 GPL 许可和专有代码库，为训练数据收录设置了法律障碍\n5.  一个仅在 Scale Labs 排行榜可见的私有保留子集，防止脚手架团队针对评估集进行调优\n\
  \n由此产生的分数令人谦卑。**Claude Opus 4.5** 在 Verified 上得分 80.9%，但在 Pro 上仅得 45.9%：同一模型、同一能力，得分约减半。^(^²²³^)\
  \ 在私有子集上，差距进一步扩大：**Claude Opus 4.1** 从 22.7% 跌至 17.8%，**GPT-5** 从 23.1% 跌至 14.9%。这些下降是目前最清晰的信号，表明\
  \ Verified 分数的很大一部分反映的是记忆而非泛化。\n\n具体针对 **Codex CLI**，使用带有 OpenAI 自身智能体脚手架的 `gpt-5.3-codex`，OpenAI\
  \ 报告其在 SWE-bench Pro（公开集）上得分为 56.8%（撰写当时）。在采用标准化脚手架的 Scale AI SEAL 排行榜上，**GPT-5\
  \ (High)** 得分 41.8%，**GPT-5.2 Codex** 得分 41.0%。这 10 到 15 个百分点的差距即为脚手架溢价，将在本章后面的脚手架效应部分讨论。\n\
  \n在比较基准分数时，务必核实该数字来自厂商自有脚手架还是标准化评估工具。对于同一底层模型，厂商报告的分数通常比独立标准化分数高出 4 到 12 个百分点。\n\
  \n### Terminal-Bench 2.0：CLI 优先的基准测试\n\n#### 结构与动机\n\n**Terminal-Bench 2.0** 来自\
  \ Laude Institute，采取了不同的方法。^(^²²⁴^) 它不再是针对孤立 Python 仓库的合成补丁，而是在 Docker 容器中运行的 89\
  \ 个精选端到端任务上评估智能体。每个任务提供一条自然语言指令、一个沙箱环境，以及一个自动验证结果的测试脚本。\n\n任务类别涵盖软件工程、机器学习模型训练、系统管理、安全、数据科学和网络安全。任务由\
  \ 93 位贡献者众包而来，从 229 份提交中根据质量、难度和抗平凡解法能力筛选出 89 个。\n\n这是最直接锻炼 **Codex CLI** 终端原生架构的基准。任务像真实工作一样：搭建训练流水线、调试故障服务、配置构建系统、在受控环境中利用已知漏洞。Docker\
  \ 沙箱使污染在结构上更难：当任务是让实时服务正确运行时，你无法通过背补丁来应付。\n\n#### 当前分数\n\n**表 25-2. Terminal-Bench\
  \ 2.0 排行榜（2026 年 4 月）**\n\n| **智能体 + 模型** | **分数** |\n| --- | --- |\n| **NexAU-AHE\
  \ + GPT-5.5** | **84.7% (SOTA)** |\n| LemonHarness | 84.5% |\n| Capy + GPT-5.5 |\
  \ 83.1% |\n| Codex CLI + GPT-5.5 | 82.2% |\n| Polaris | 82.2% |\n| WOZCODE + Claude\
  \ Opus 4.7 | 80.2% |\n| TongAgents + Gemini 3.1 Pro | 80.2% |\n| SageAgent + GPT-5.3-Codex\
  \ | 78.4% |\n\nOpenAI 的 **GPT-5.5** 发布报告称其在 Terminal-Bench 2.0 上得分 82.7%，这是一个厂商自测数字，勉强超过了\
  \ Anthropic 的 **Claude Mythos Preview**。^(^²²⁵^) 然而，在独立的 Terminal-Bench 2.0 排行榜上，**Codex\
  \ CLI + GPT-5.5** 以 82.2% 接近榜首，落后于当前领跑者 **NexAU-AHE + GPT-5.5** 的 84.7%。厂商自报分数与其标准化排行榜名次之间的这种差距，正是本章警示的内容：切勿将自报数字视为排行榜名次。前沿竞争现在以零头之差计算，而非两位数的差距。\n\
  \n模型选择对 CLI 影响巨大，且默认配置可能未针对您运行的任务类型进行优化。将 **Codex CLI** 与当前前沿模型（如 `gpt-5.5`）而非旧款或较小模型搭配，可显著提高解决率。\n\
  \nTerminal-Bench 2.0 是最值得亲自运行的基准。**Harbor** 框架使其可复现，Docker 环境防止跨运行污染，完整运行成本约在 `$1`\
  \ 到 `$100` 之间（取决于模型定价），低到足以将其作为常规评估步骤。\n\n#### 自行运行 Terminal-Bench\n\n可通过 **Harbor**\
  \ 框架运行基准。您需要 Python 3.12 或更高版本、Docker，以及您要测试的模型提供商的 API 密钥：\n\n```\n##### 安装 Harbor（PyPI\
  \ 包名为 `harbor`；要求 Python 3.12+）\npip install harbor\n##### 在 Codex CLI 上运行 Terminal-Bench\
  \ 2.0\nharbor run --dataset terminal-bench@2.0 \\\n  --agent codex-cli \\\n  --model\
  \ openai/gpt-5.5 \\\n  --n-concurrent 4\n```\n\n**Harbor** 的 CLI 变化很快，因此在开始昂贵的运行前，请检查可用的数据集和过滤标志：\n\
  \n```\nharbor datasets list\nharbor run --help\n```\n\n这会生成结构化结果，您可以跨配置进行差异对比并随时间追踪。练习\
  \ 3 将演示如何解读 Harbor 输出；目前，关键指标是按任务类别的解决率，而非总分。\n\n#### 脚手架效应\n\n**脚手架**，即处理模型周围记忆管理、工具使用协议和重试逻辑的编排层，其重要性可与底层模型本身媲美。使用\
  \ **Claude 4 Sonnet** 的 **Confucius Code Agent** 在 SWE-bench 上达到 74.6%，超过了使用能力更强的\
  \ **Claude 4.5 Sonnet** 的 **mini-SWE-Agent** 变体。^(^²²⁶^) 更好的编排弥补并随后超越了整整一代模型的差距。\n\
  \n\n\n这直接影响你如何配置 Codex CLI。CLI 的原生子代理支持、`AGENTS.md` 上下文加载和 Hook 系统构成了你的脚手架层。一份编写良好的\
  \ `AGENTS.md`，能够界定代码库范围、明确测试运行约定并标记禁区目录，可作为持久上下文供模型在整个会话期间依赖。\n\n一个在会话启动时预加载相关文档或近期\
  \ Git 历史记录的 `SessionStart` Hook，提供了将称职的基准测试表现与真实任务完成区分开来的基础信息。\n\n配置 Codex CLI 时，你不仅仅是在选择模型，而是在配置脚手架。基准测试数字展示了上限；而你的\
  \ `AGENTS.md` 和 Hook 决定了你在特定工作负载下能离这个上限多近。\n\n### 基准测试数字对你的团队究竟意味着什么\n\n将基准测试分数转化为工具决策，需要供应商营销材料很少提供的校准。\n\
  \n#### 将基准测试与你的工作负载相匹配\n\n最常见的错误是将错误基准测试上的高分视为适配性的证据。在评估任何分数之前，先问问哪个基准测试最贴近你的实际工作。\n\
  \n**表 25-3. 基准测试到工作负载的对齐**\n\n| **你的主要用例** | **最具预测性的基准测试** |\n| --- | --- |\n|\
  \ Python 仓库中的 Bug 修复 | SWE-bench Pro（而非 Verified） |\n| 终端自动化、DevOps、ML 流水线 | Terminal-Bench\
  \ 2.0 |\n| 多语言、多文件特性开发 | SWE-bench Pro 私有子集 |\n| 绿地开发 | 目前尚无基准测试能很好地捕捉此场景 |\n\n\
  如果你的团队主要编写 Rust 微服务，仅针对 Python 的基准测试提供的信号有限。如果你的工作是基础设施自动化，即具有平台工程角色特征的 Shell 脚本编写、服务配置和流水线调试，Terminal-Bench\
  \ 2.0 是唯一一个类似于你实际工作的已发布基准测试。\n\n#### 考虑脚手架膨胀\n\n任何引用供应商自有脚手架的分数，相比标准化评估会膨胀 4 到 12\
  \ 分。这不是欺诈：自定义脚手架确实能改进结果。但除非双方使用相同的测试框架进行测量，否则会导致供应商间的对比不可靠。\n\n为了进行公平对比，请优先参考 SWE-bench\
  \ 任务的 SEAL 排行榜数字，或明确指定了代理框架的 Terminal-Bench 结果。当你看到供应商声称“SWE-bench Pro 上达到 X%”时，你的第一个问题应该是：使用的是哪种脚手架？\n\
  \n#### Codex CLI 内的模型选择\n\n鉴于当前的基准测试数据，Codex CLI 模型选择的实用层级从一个有效的本地默认值开始：\n\n```\n\
  ##### config.toml — 本地默认模型\nmodel = \"gpt-5.5\"\n```\n\n对于需要规划、计算机使用或持久多会话上下文的广泛代理任务，`gpt-5.5`\
  \ 是正确的起点。对于专业编码任务，尝试显式使用 `gpt-5.4` 并将其与你自己的基准测试套件进行对比。对于你按 Token 付费进行广泛探索的子代理任务，测试\
  \ `gpt-5.4-mini` 作为低成本候选。\n\nCodex 不会根据 `config.toml` 中的 `[model]` 表路由任务类别。当你想要对比配置时，请显式更改模型：\n\
  \n```\ncodex -m gpt-5.5\ncodex -m gpt-5.4\ncodex exec --model gpt-5.4-mini \"绘制此仓库地图并识别测试命令\"\
  \n```\n\n重要的习惯是记录每次基准测试运行所使用的模型，而不是假设 CLI 会根据任务类型推断出正确的模型。\n\n### 运行你自己的基准测试\n\n\
  真正重要的唯一基准测试，是在你的代码库上、针对你的任务、在你的约束下的性能表现。\n\nTerminal-Bench 2.0 的结构为构建你自己的微基准测试提供了有用的模板：\n\
  \n1.  **识别 5 到 10 个有代表性的任务。** 选择涵盖你实际要求 Codex CLI 执行的范围的任务：Bug 修复、特性添加和基础设施变更的组合。避免选择微不足道的简单任务或无限制的开放性任务。\n\
  \n2.  **编写确定性的成功标准。** 每个任务都需要一个测试脚本，能在无人工判断的情况下输出通过或失败。这是基准测试设计中最困难的部分，也是合成基准测试倾向于低估真实世界复杂性的原因：真实任务往往有多种有效解决方案，而可靠的自动化测试要求单一的可验证结果。\n\
  \n3.  **容器化环境。** Docker 环境可防止跨运行污染并使结果可复现。每次运行使用相同的基础镜像；锁定依赖版本。\n\n4.  **针对多种配置运行。**\
  \ 至少将你当前的模型和 `AGENTS.md` 配置与一种替代方案进行对比。替代方案可能是不同的模型、不同的 `AGENTS.md` 结构或不同的 Hook\
  \ 集合。\n\n5.  **跟踪成本以及解决率。** 取决于你的吞吐量需求，每个任务花费 `$0.50` 且解决率 80% 的配置，可能优于每个任务花费 `$4.00`\
  \ 且解决率 85% 的配置。\n\n一个小型的基准测试目录赋予工作可重复的结构：\n\n```\n.benchmarks/\n  task-001/\n  \
  \  README.md        # 自然语言任务描述\n    setup.sh         # 将仓库重置为初始状态\n    test.sh \
  \         # 成功时退出码 0，失败时退出码 1\n    expected.md      # 关于预期行为的备注\n  results/\n  \
  \  2026-04-23-gpt-5.5-default.json\n```\n\n每次都使用相同的结果字段：\n\n| **任务** | **配置** |\
  \ **通过/失败** | **轮次** | **Token 数** | **成本** | **备注** |\n| --- | --- | --- | ---\
  \ | --- | --- | --- |\n| | | | | | | |\n\nSWE-EVO 基准测试（测试现有系统的持续演进而非一次性补丁）显示，GPT-5\
  \ 搭配 OpenHands 得分 21%，而在 SWE-bench Verified 上得分 65%。^(²²⁷) 在商业和企业代码库上，最好的可用模型得分低于\
  \ 20%。你的专有代码库很可能比任何已发布的基准测试都更难。为这一现实做准备。\n\n目标不是一个可发布的排行榜数字。而是一个一致、可重复的信号，供你用来做配置决策，并在模型和脚手架演进时跟踪退化。即使只有五个任务的测试套件，也能比任何已发布的基准测试提供更多可操作的数据，因为它衡量的是你实际问题领域的性能。\n\
  \n将你的基准测试任务定义和结果存储在专门的仓库目录中（例如 `.benchmarks/`），与你的 `AGENTS.md` 一起纳入版本控制跟踪。随着时间的推移，当你更新\
  \ Codex CLI 配置时，你将能准确地看到性能何时以及为何发生了变化。\n\n### 2026 年 4 月基准测试：CocoaBench、HiL-Bench\
  \ 和 AAR\n\n2026 年 4 月发布的三项同行评审基准测试通过关注代理*如何失败*而非*做对什么*，更新了评估格局。CocoaBench、HiL-Bench\
  \ 和 AAR（惊人代理竞赛）研究共同为代理式编码工具提供了首个系统性的故障分类学，其结果挑战了关于代理在何处挣扎的一个普遍假设。\n\n#### 故障分类学\n\
  \n2025 年的主导叙事认为工具使用是主要瓶颈：如果代理无法调用正确的 API 或运行正确的命令，就会失败。这些基准测试推翻了该叙事。汇总所有三项研究的故障分类学揭示了不同的图景：\n\
  \n**表 25-4. 代理故障分类学（2026 年 4 月基准测试）**\n\n| **故障模式** | **故障率** | **基准测试来源** | **启示**\
  \ |\n| --- | --- | --- | --- |\n| 导航错误 | 27% 至 52% 的试验 | AAR | 代理迷路的频率远高于误用工具 |\n\
  | 多模态组合 | ~55% 的任务失败（45.1% 成功率） | CocoaBench | 组合视觉、搜索和代码的长时程任务依然脆弱 |\n\n\n\n\n\
  #### 基准测试中的关键发现\n\n| 发现 | 影响 | 来源 | 含义 |\n| :--- | :--- | :--- | :--- |\n| 帮助寻求判断\
  \ | 需要升级时损失巨大 | HiL-Bench | 无法判断何时寻求帮助的 Agent 表现急剧下降 |\n| 工具使用错误 | 最不常见的故障模式 | AAR,\
  \ CocoaBench | 目前大多数基准测试的焦点——工具使用，极少成为瓶颈 |\n\n这种反转很明显：**导航，而非工具使用，才是主要的故障模式。** 一旦找到正确的文件，Agent\
  \ 就能熟练地正确调用工具。它们失败的地方在于到达正确的位置。\n\n#### AAR：37.2% 准确率，导航是瓶颈\n\nAAR 研究评估了在交织工具使用与多步导航的任务上的\
  \ Agent，其副标题“强工具使用者，弱导航者”精准概括了结果。[²²⁸] 核心数据令人清醒：最优 Agent 仅达到 37.2% 的准确率，且导航错误占主导，根据任务复杂度不同，占试验总数的\
  \ 27% 至 52%，远超工具使用错误。AAR 在谜题与检索场景而非源代码仓库中衡量导航，但该模式直接迁移至代码库工作：Agent 一旦到达正确位置便能熟练调用工具，但到达该位置的能力薄弱。\n\
  \n对于 `Codex CLI` 用户，实际启示明确：**提升 Agent 性能的最高回报投资，是改进导航辅助。** `AGENTS.md` 中的文件映射（参见第\
  \ 4 章）、结构良好的目录布局、显式路由规则，能缩小 Agent 必须导航的搜索空间，直接针对主要故障模式。\n\n#### CocoaBench：多模态组合\
  \ 55% 失败率\n\nCocoaBench 评估统一 Agent 在单一连贯操作中组合视觉、搜索、代码等多模态的长时程任务能力。[²²⁹] 最优系统成功率仅\
  \ 45.1%，即约 55% 的任务失败。Agent 能很好地处理单一模态，但难以跨模态保持连贯性。\n\n这与第 7 章所述的上下文窗口饱和模式一致：随着任务跨越更多文件和模态，上下文窗口充斥着模型难以整合的异构内容。\n\
  \n#### HiL-Bench：帮助寻求鸿沟\n\nHiL-Bench（人在回路基准）测量了此前无基准测试过的能力：Agent 关于何时寻求人工帮助的判断力。[²³⁰]\
  \ 结果严峻。前沿 Agent 在获得完整上下文时能解决复杂任务，但一旦必须自行决定是否升级，没有任何前沿模型能恢复超过完整信息性能的一小部分。瓶颈在于判断，而非能力。这对审批模式设计有直接启示（第\
  \ 5 章）：在 Suggest、Auto Edit 和 Full Auto 之间的选择，不仅关乎控制权，更关乎赋予 Agent 在识别出不确定性时升级的能力。\n\
  \n#### 新基准对你配置的启示\n\n故障分类法建议三大配置优先级：\n\n1.  **投资导航辅助。** `AGENTS.md` 中的文件映射、显式路由规则、结构良好的仓库布局，直接解决\
  \ 27% 至 52% 的导航失败率。文件映射模式见第 4 章。\n2.  **缩小任务范围。** 约 55% 的多模态组合失败率意味着，宽泛的开放式任务（“重构此模块并更新所有测试和文档”）比分解的子任务更易失败。使用子\
  \ Agent（第 11 章）将多模态工作拆解为单模态步骤。\n3.  **校准审批模式。** 陡峭的帮助寻求性能损失意味着 Full Auto 模式的代价比你想象的大，并非因为\
  \ Agent 做危险的事，而是因为它在本应寻求澄清的任务上盲目推进。\n\n### SlopCodeBench：衡量质量，而非仅完成度\n\n前述基准共享一个盲点：衡量\
  \ Agent 是否完成任务，而非生成代码是否优质。2026 年 3 月发布的 SlopCodeBench 直接填补这一空白。[²³¹]\n\nSWE-bench\
  \ 问“补丁是否通过测试套件？”，Terminal-Bench 问“Agent 是否完成工作流？”，而 SlopCodeBench 问代码在增长过程中是否保持结构良好且可维护。它让\
  \ Agent 在不断演进的规格下反复扩展自有早期解决方案，并追踪轨迹级质量信号：冗余度（冗余或重复代码占比）和结构侵蚀（复杂度集中在少数函数中）。\n\n早期结果显示，在任务完成类基准上得分高的\
  \ Agent，不一定产出高质量代码。用暴力解法通过测试套件的模型，在 SWE-bench 得高分，在 SlopCodeBench 却得分低。对于以代码库健康而非原始任务吞吐为首要关注的团队，你的模型擅长的基准可能无法预测你真正在意的指标。\n\
  \n对 `Codex CLI` 用户，SlopCodeBench 提示：基于钩子的质量检查（Linter、风格强制、写后分析）即便在任务完成基准改进时仍不可或缺。模型可能解决了问题；关键在于该解决方案是否属于你的代码库。\n\
  \n### 基准测试层级体系\n\n2026 年基准格局形成了一个可靠性层级，按适用于你真实工作负载的程度从低到高排列：\n\n底层是 SWE-bench Verified，仍适用于区分弱模型，但在前沿已失去区分度。再上是\
  \ SWE-bench Pro，提供更诚实的多文件、多语言推理度量，其私有子集是目前抗污染能力最强的信号。\n\nTerminal-Bench 2.0 与 Pro\
  \ 齐头并进，作为最贴近 `Codex CLI` 用户的领域特定基准：原生终端、Docker 沙箱、结构上抗记忆化。顶层是源自你实际工作流的自有基准套件，这是唯一能直接回答你提问的评估。\n\
  \n公开数字是缩小选型范围的起点。自有评估才是最终决策的依据。\n\n#### 代码审查基准与采用数据\n\n两个新数据源补充了任务完成类基准，提供真实采用与审查质量的证据。\n\
  \n**OpenAI 报告的代码审查评估** 定性提醒：即使前沿模型在审查代码时，也会遗漏大量真实缺陷。对使用 `Codex CLI` 内置代码审查技能或 CodeRabbit\
  \ 插件的团队，这校准了预期：自动化审查是有用的首轮筛查，不能替代人工审查。\n\n#### PRDBench：PRD 到代码的鸿沟\n\nPRDBench 由上海交通大学与美团团队推出（2025\
  \ 年 10 月发布于 arXiv，2026 年被 AAMAS 接受），测量与现有基准根本不同的能力：从产品需求文档（PRD）构建软件，而非修复现有 Bug 或完成部分实现。[²³²]\
  \ 核心发现是 PRD 到代码的鸿沟显著大于 Bug 修复鸿沟。撰写时排行榜显示，最强模型仅在 60% 左右，弱模型远低于 30%，因为从规格构建需要架构决策、依赖选择、集成规划，而修复导向基准不测试这些。\n\
  \n\n\n\n\n##### 面向 Codex CLI 用户的 PRDBench 校准\n\n对于 Codex CLI 用户，PRDBench 对绿地开发任务的预期进行校准。如果您的工作流涉及根据规范生成新服务或功能（这是一种常见的企业模式），PRDBench\
  \ 的得分比 SWE-bench 更能预测智能体性能。该基准还验证了规范驱动开发方法：提供结构化的 PRD（产品需求文档）而非模糊的提示词，能显著提高解决率。\n\
  \n#### MAESTRO：多智能体评估\n\nMAESTRO（用于测试、可靠性和可观察性的多智能体评估套件）填补了单智能体基准的空白：评估多智能体系统中的编排质量。[²³³]\
  \ 其关键发现在于，架构选择——智能体如何组合、共享何种状态以及故障如何传播——对多智能体性能的影响大于模型选择。一个编排良好的系统即便使用较弱的模型，也能胜过编排不善但使用更强模型的系统。\n\
  \n这一发现强化了第 12 章中的编排模式：这些模式本身就是性能杠杆，而不仅仅是组织便利。MAESTRO 提供了评估方法论，用以衡量您的编排架构究竟是在提供帮助，还是引入了超出并行化收益的协调开销。\n\
  \n### 基准的另一面：生产环境中的智能体代码质量\n\n迄今讨论的基准衡量的是智能体能否完成任务。2026 年初发布的两份主要行业报告提出了一个不同的问题：智能体写完代码后会发生什么？答案令人警醒，为解读任何基准分数提供了必要的背景。\n\
  \n#### Opsera 与 Sourcery Intel 2026 报告\n\nOpsera《AI 编码影响 2026 基准报告》分析了 60 多家企业、超过\
  \ 250,000 名开发者的数据。[²³⁴] Sourcery Intel《2026 年 AI 编码智能体现状》综合了整个智能体领域的市场、基准和安全数据。[²³⁵]\
  \ 两者共同勾勒出一幅关于智能体输出质量一致的图景。\n\n**表 25-5. 智能体代码质量发现（2026 年初）**\n\n| 发现 | 数据 | 来源 |\n\
  | --- | --- | --- |\n| AI 生成代码漏洞率 | 14.3% 对比 9.1% 人工（相对增加 57%） | Sourcery Intel（斯坦福-MIT\
  \ 研究，200 万+ 片段） |\n| 每行漏洞数 | 比人工代码多 15% 至 18% | Opsera（25 万+ 开发者） |\n| 评审队列延迟 |\
  \ AI 生成的 PR 长 4.6 倍 | Opsera |\n| 代码重复率 | 样本中 10.5% 至 13.5% | Opsera |\n| PR 时间缩短\
  \ | 快 48% 至 58% | Opsera |\n| 高级与初级生产力增益差距 | ~5 倍 | Opsera |\n| 闲置 AI 编码许可证 | 21%\
  \ | Opsera |\n\n这种悖论十分显著：AI 辅助工作流将拉取请求的时间缩短了 48% 至 58%，但由此产生的 PR 在评审队列中停留的时间却长了\
  \ 4.6 倍。代码生产的加速已超过了审查能力。团队产出更多 PR，但评审人员无法跟上，导致未审查的、潜在脆弱代码积压日益增加。\n\n#### PR-MCI：当描述撒谎时\n\
  \n一项被 MSR 2026 接收的研究分析了五个 AI 编码智能体的 23,247 个拉取请求，人工标注了 974 个 PR 以验证自动化的 PR-MCI（PR\
  \ 消息-代码不一致）检测管道。[²³⁶] 研究结果量化了许多评审人员直观感受到的信任赤字：\n\n1.  1.7% 的智能体 PR 表现出高消息-代码不一致：描述声称的更改在差异中并未实现。\n\
  2.  最常见的故障模式（占高 MCI 情况的 45.4%）是“描述声称未实现的更改”。\n3.  高 MCI PR 的接受率低 51.7%（28.3% 对比\
  \ 80.0%）。\n4.  它们的合并时间长 3.5 倍（55.8 小时对比 16.0 小时）。\n\nCodeRabbit 对 470 个开源 PR 的分析从另一个角度佐证了这一点：AI\
  \ 合著的拉取请求包含的问题大约是纯人工 PR 的 1.7 倍（每个 PR 10.83 个问题对比 6.45 个），质量差距跨越逻辑与正确性（1.75 倍）、代码质量（1.64\
  \ 倍）、安全性（2.74 倍）和可读性（3.0 倍）。[²³⁷]\n\n#### 这对基准解读意味着什么\n\n这些发现并未使基准分数失效。它们为分数提供了背景。在\
  \ Terminal-Bench 2.0 上得分 82% 的模型确实有能力完成复杂任务。但它生成的代码可能带有 14.3% 的漏洞率，可能复用现有抽象，且可能附带不能准确反映变更内容的\
  \ PR 描述。基准完成是必要条件，但非生产级输出的充分条件。\n\n对 Codex CLI 用户的实际启示：基准分数告诉您哪个模型能解决问题。`PostToolUse`\
  \ 钩子、自动化评审（`auto_review`）、`AGENTS.md` 质量约束和结构化输出模式（第 9、20、4 和 22 章）告诉您该解决方案是否属于您的代码库。\n\
  \n### 总结\n\n1.  **SWE-bench Verified 在前沿领域已被污染。** 约 60% 以上的分数反映了部分记忆化。SWE-bench\
  \ Pro 是更诚实的衡量标准，同一模型的得分低 30 至 40 分。\n2.  **GPT-5.5 领跑 Terminal-Bench 2.0。** OpenAI\
  \ 报告得分为 82.7%（供应商自测数据，略微领先 Claude Mythos Preview）；独立排行榜显示 Codex CLI + GPT-5.5 得分\
  \ 82.2%，仅次于当前 SOTA 的 NexAU-AHE + GPT-5.5（84.7%）。在 SWE-bench Pro 上得分 58.6%，在 SWE-bench\
  \ 上得分 88.7%。\n3.  **Terminal-Bench 2.0 是 Codex CLI 用户最相关的基准。** 它在 Docker 沙盒环境中运行端到端的终端工作流，是终端原生工作最接近的已发布代理指标。\n\
  4.  **SlopCodeBench 衡量质量，而不仅是完成度。** 它通过对代码质量（可读性、可维护性、地道风格）评分而非任务是否完成，解决了现有基准的盲区。\n\
  5.  **脚手架膨胀增加 4 至 12 分。** 供应商报告的分数高于标准化基线，因此切勿直接将供应商报告的分数与 SEAL 排行榜分数比较。\n6.  **模型选择与脚手架同等重要。**\
  \ 模型升级提高上限；`AGENTS.md`、钩子、审批模式和任务设计决定您的工作流能多接近该上限。\n7.  **最好的基准是您自己的代码库。** 以 Terminal-Bench\
  \ 的任务格式为模板，在版本控制中跟踪结果。\n8.  **PRDBench 揭示了 PRD 到代码的鸿沟。** 从规范构建比修复 Bug 困难得多，最强模型得分在\
  \ 60% 左右，仍远低于其 SWE-bench 表现。（上海交通大学和美团团队；arXiv 2025 年 10 月，AAMAS 2026。）\n9.  **对于多智能体工作，编排架构胜过模型选择。**\
  \ MAESTRO 证明了这一点，验证了第 12 章中涵盖的编排模式投资的价值。\n10. **生产代码质量讲述了与完成度不同的故事。** 报告引用了 14.3%\
  \ 的漏洞率（Sourcery Intel）、4.6 倍的评审队列延迟（Opsera）以及代码重复率从 10.5% 上升至 13.5%。PR-MCI 研究（MSR\
  \ 2026）显示 1.7% 的智能体 PR 存在误导性描述，接受率低 51.7%，合并时间长 3.5 倍。基准完成是必要条件，但非生产级输出的充分条件。\n\n\
  ### 练习\n\n\n\n\n\n#### 任务与基准测试\n\n#### 1. 审计基准测试声明\n寻找某 AI 实验室近期引用代码基准测试分数的新闻稿或博客文章。识别：\n\
  - (a) 引用的是哪个基准测试变体\n- (b) 使用的脚手架是供应商自有的还是标准化测试框架\n- (c) 是否存在同一模型对应的 SEAL 排行榜条目\n\
  \n若两个数字都存在，计算脚手架溢价；若不存在，准确记录缺少哪个对比。最后用两段总结该引用数字实际说明了模型在您工作负载上的可能表现。\n\n#### 2. 构建五任务微基准\n\
  从团队近期 Sprint 历史中选取五个具有代表性的真实任务（Issue 或 PR），而非编造场景。使用本章的 `.benchmarks/` 结构。对每个任务：\n\
  - 编写确定性成功测试（成功退出码 0、失败退出码 1 的 Shell 脚本）\n- 使用 Docker 容器化初始环境\n- 用当前配置运行 Codex CLI，记录解决率和单任务成本\n\
  - 修改一个变量（模型选择、`AGENTS.md` 内容或 Hook 配置）并重新运行\n- 记录哪个配置获胜及原因\n\n#### 3. 对子集运行 Terminal-Bench\
  \ 2.0\n安装 Harbor 框架，运行 `harbor datasets list`，并用 `harbor run --help` 确定当前过滤标志。从与您工作相关的类别中选取\
  \ 10 到 15 个 Terminal-Bench 2.0 任务，分别对两个 Codex CLI 模型配置 `gpt-5.5` 和 `gpt-5.4` 运行。对比解决率和总成本。若结果与表\
  \ 25-2 发布的排行榜数字差异显著，分析原因。考虑您的 `AGENTS.md` 配置、网络环境，以及您选取的任务类别是否映射到模型的训练强项。与团队分享发现，并以此作为今后默认模型选择的依据。\n\
  \n#### 4. 在小型项目上运行自有基准\n从积压工作中选择一个真实的 Bug 或功能请求（手动耗时 15 到 30 分钟）。将 Issue 文本放入本地基准任务文件，或让提示词明确告诉\
  \ Codex 如何获取，例如：\n```bash\ncodex \"Fix issue #N. Use gh issue view N to read the\
  \ issue, then run the project tests.\"\n```\n计时结果。记录是否通过测试、轮数和 Token 成本。与本章发布的基准分数对比。记录真实结果偏离实验室结果的位置及原因（代码库复杂度、测试覆盖率、`AGENTS.md`\
  \ 中的领域知识）。\n\n#### 5. 测量您工作流的脚手架溢价\n脚手架溢价是指归因于脚手架（提示词、`AGENTS.md`、Hook、审批模式、任务设计）而非底层模型的性能差异。从积压工作中选取一个代表性任务，每次仅改变一个变量，运行两遍。从相同模型和审批模式开始，先用最小配置，再用生产环境的\
  \ `AGENTS.md` 和 Hook。记录输出质量、Token 数和耗时。如需区分脚手架效应与模型效应，可换用不同模型重复。这些数据在评估是否升级模型或投资改进脚手架时极具价值。\n\
  \n# 第 26 章：竞品工具及适用场景\n\n第 25 章表明，决定编码代理性能差异的主要是测试框架而非模型：LangChain 在模型不变的情况下将 Terminal-Bench\
  \ 2.0 排名从第 30 位提升至第 5 位，脚手架溢价可为基准分数增加 4 到 12 分。本章将这一视角转向竞争格局，提供任务决策框架、架构权衡的诚实评估，以及何时不应选择\
  \ Codex CLI 的指导。\n\n推荐单一工具对抗固定竞品名单的书籍很快过时，因为名单每季度都在变。等您读到此书时，代理式编码市场已进一步整合，此处提及的部分产品可能已重命名或退市，新产品也会出现。请将文中工具视为架构类别的代表，而非固定清单。类别持久；占据类别的品牌名则不然。本章提及工具时，系作为该类别当前最清晰的示例，而非永久固定。\n\
  \n该领域沿一条架构轴线划分：**CLI 代理**运行在终端、操作文件系统，对比 **IDE 代理**驻留在编辑器、通过可视化 Diff 和内联补全呈现 AI。少数工具跨足两端，但其设计理念通常揭示其优先服务哪一侧。此区分很重要，因为两个层级优化目标不同。终端代理优化无人值守执行、可脚本化、与\
  \ CI/CD 流水线集成。IDE 代理优化紧凑反馈循环、可视化 Diff、不离开编辑器的舒适度。为任务选错层级不仅低效，有时在架构上根本不可能。您无法通过 IDE\
  \ 插件运行内核级沙箱 CI 流水线，也无法从无头终端代理获得内联可视化 Diff。\n\n开始前的一个诚实元观点：若您已从其他工具获得所需结果，可能无需切换。本章旨在帮助您有意识地得出该结论，或识别出\
  \ Codex CLI 优势使其成为更好选择的具体场景。\n\n### 测试框架工程视角\n\n一篇 42 位作者的调查论文（“Code as Agent Harness”，arXiv\
  \ 2605.18747）提供了理解为何使用相同底层模型的工具产出截然不同结果的学术框架。论文指出所有编码代理通用的三层架构：\n\n1.  **接口层**——代理如何接收指令并呈现结果：`AGENTS.md`\
  \ 文件、系统提示词、终端 UI 对比编辑器面板。\n2.  **机制层**——约束与赋能代理行为的要素：Hook、权限配置文件、沙箱、审批模式。\n3.  **多代理扩展层**——代理如何协作：子代理、MCP\
  \ 服务器、交接协议。\n\n关键洞见：模型非差异化因素；测试框架才是。两个运行可比模型的工具因其测试框架在每层做出不同工程选择而产出显著不同结果。一者在机制层投资内核级沙箱和\
  \ Token 效率；另一者在接口层投资可编程 Hook 和更丰富的推理展示。模型设定能力上限，但测试框架决定您在真实任务上能触及多少上限。第 27 章将深入展开这一论点；本章将其作为选型视角应用。\n\
  \n### 学习目标\n\n您将能够：\n\n1.  应用决策框架，根据特定任务与约束概况在 Codex CLI 与竞品代理间选择\n2.  解释内核级沙箱、可编程\
  \ Hook 与 IDE 原生反馈循环的架构权衡\n3.  在两个工具上运行同一任务，按成本、质量、人机工效评估结果\n4.  设计多工具工作流，让各工具发挥其架构强项\n\
  5.  按代理沙箱最弱的强制边界而非最强边界对其分类\n6.  将配置、技能、子代理、Hook 从其他代理（如 Claude Code）迁移到 Codex CLI\n\
  \n### 决策框架\n\n\n\n\n诚实的回答是，大多数经验丰富的从业者会使用不止一种工具。问题不在于选哪一个，而在于根据具体任务和约束情况，该拿起哪一个。表\
  \ 26-1 将常见场景映射到适合的架构类别，并为每个类别列出了代表性工具。\n\n**表 26-1. 何时使用哪种工具**\n\n| **场景** | **首选**\
  \ | **主要原因** |\n| --- | --- | --- |\n| 内核级沙箱是硬性要求 | 具有操作系统强制隔离的 CLI 代理 (`Codex CLI`)\
  \ | 操作系统层面的 Seatbelt/bubblewrap 强制执行，而非应用层策略 |\n| 复杂、可编程的合规逻辑 | 具有丰富钩子事件的 CLI 代理\
  \ (`Claude Code`) | 策略以程序形式表达，而非配置 |\n| 规模化的 Token 高效批处理工作 | 终端优先的 CLI 代理 (`Codex\
  \ CLI`) | 无头运行避免了 IDE 协议开销 |\n| 对全新 Bug 进行最高质量推理 | 运行最强前沿模型的代理 | 在真正的新问题上，模型能力占主导\
  \ |\n| 代码落地前进行可视化差异对比 | IDE 原生代理 (`Cursor`) | 内联差异审查是原生用户体验 |\n| 永不离开编辑器 | IDE 原生代理\
  \ (`Cursor`, `GitHub Copilot`) | 无需终端上下文切换 |\n| 授权并放手解决 Issue | 异步云代理 (`GitHub Copilot\
  \ coding agent`) | 在托管沙箱中从 Issue 到 PR，无需本地会话 |\n| 厂商中立、模型不可知、物理隔离 | 开源 CLI 代理 (`OpenCode`)\
  \ | 无厂商锁定；自带模型 |\n| 预算是约束性因素 | 免费层级或开源代理 | 零或低边际成本改变使用模式 |\n| 具有沙箱化、无人值守执行能力的 CI/CD\
  \ | 终端优先的 CLI 代理 (`codex exec`) | 可脚本化、内核沙箱化、专为无头使用而构建 |\n\n请将此表视为一组架构承诺来阅读，而非品牌背书。内核级沙箱指向\
  \ CLI 代理的原因，并非某个供应商更高尚；而是因为操作系统强制隔离是工具生成子进程方式的属性，而 IDE 插件通常不具备该属性。当某行中提到的工具发生变化时，最右列的理由通常不会变。\n\
  \n### CLI 代理\n\n#### Codex CLI 优势\n\n`Codex CLI` 的优势集中在工具链的机制层，这正是调查论文预测持久差异所在的地方。\n\
  \n1.  **内核级沙箱。** 操作系统强制隔离，macOS 上为 Apple Seatbelt，Linux 上为带 seccomp 的 bubblewrap，而非应用层限制。沙箱在系统调用层面运作，因此无论代理被说服尝试何种操作，隔离均有效。*第\
  \ 16 章* 深入探讨了安全含义。\n\n2.  **Token 效率。** 无头终端操作避免了 IDE 协议层（编辑器状态同步、补全流、UI 更新消息）带来的\
  \ Token 开销，而这些是 IDE 耦合代理的额外负担。*第 14 章* 解释了为何该差距在团队规模下成为预算输入项。\n\n3.  **CI/CD 原生。**\
  \ `codex exec` 运行任务、返回结果并退出：天然适配流水线集成，*第 15 章* 对此进行了详细阐述。\n\n4.  **渐进式审批模型。** 审批系统提供了一系列信任级别，并由内核级强制执行作为后盾，这在架构上区别于二元的基于信任的开关。命名配置文件\
  \ (*第 5 章*) 使这些预设可复用且可版本控制。\n\n#### Claude Code：最接近的对标产品\n\n`Claude Code` 是 CLI\
  \ 代理类别中的主要竞争对手，也是 `Codex CLI` 最接近的对标产品。^(²³⁹) 它是使用最广泛的终端代理之一，当推理质量是约束性因素时，它是一个强有力的选择：在涉及定位和修复微妙\
  \ Bug 的多文件任务中，它始终能产出高质量的修复，且在撰写本文时，其公开的 SWE-bench Verified 分数位居前列。（将任何特定基准数据视为快照；实时排行榜才是真理来源。）\n\
  \n有两个架构差异值得理解而非死记硬背。第一是策略表达能力。`Claude Code` 暴露了一组丰富的钩子事件，允许你在 Shell 脚本中编码任意复杂的策略逻辑。钩子是程序，而非配置，因此其表达能力实际上是无限的。`Codex\
  \ CLI` 的安全模型则倾向于内核级沙箱，这提供了更强的隔离性，但对于定制化的合规工作流灵活性较低。两种方法均无绝对优势：可编程钩子能表达沙箱无法表达的策略，而沙箱能强制执行运行在同一信任域内的钩子无法保证的边界。\n\
  \n第二个差异是强制执行默认值。`Claude Code` 自带操作系统级沙箱（macOS 上为 Seatbelt，Linux 和 WSL2 上为 bubblewrap），用于代理生成的\
  \ Shell 子进程，因此区别在于作用范围和默认值，而非强制执行机制的存在与否：该沙箱覆盖 Bash 子进程，而文件读写通过权限层进行；其网络过滤基于主机名且不执行\
  \ TLS 检查；且沙箱是可选加入的，而 `Codex CLI` 将内核级隔离视为架构默认。如果你的主要需求是推理质量和可编程策略，`Claude Code`\
  \ 是绝佳选择；如果是默认的硬隔离和 Token 效率，`Codex CLI` 更具优势。\n\n`Codex CLI` 在直接对比中获胜的往往在于 Token\
  \ 效率和成本。独立测试反复发现 `Codex CLI` 比 IDE 耦合代理消耗少得多的 Token，在某些 CLI 对 CLI 的对比中，完成同一任务其 Token\
  \ 消耗甚至比 `Claude Code` 少几倍。^(²⁴⁰) 在个人规模下差异可忽略；在团队规模下，这会转化为成本节约或容量余量，从而成为规划输入项。评估这两者用于特定项目时，实用的做法是在两者中运行相同任务并直接检查\
  \ Token 计数，这正是本章第一个练习的主题。\n\n#### Google 的终端代理\n\nGoogle 在同一类别中推出了一款终端代理，其决定性特性是拥有真正的免费层级和大上下文窗口，这比任何基准测试都更能改变使用模式。^(²⁴¹)\
  \ 开发者若因每次查询几美分的成本而不愿请教代理快速定向性问题，在零成本下则会乐意提问，因此免费层级将代理变为探索和文档伴侣，而非代码修改主力。它还提供实时网络搜索接地，这对涉及近期库版本或模型训练截止日期后可能已变更的\
  \ API 的任务很有用�。\n\n权衡点与该类别一致。其沙箱基于容器而非内核级，且在复杂推理或多文件重构的基准性能上尚未追平前沿 CLI 代理。对于成本非约束性因素且任务质量至上的团队，前沿代理产出更好结果；对于探索、定向和代码库快速问答，免费层级创造了真实价值。撰写本文时，Google\
  \ 在此领域的产品谱系处于变动中，其终端产品正被整合进更广泛的平台，因此请将品牌名称视为比其所在类别稳定性更低的标识。\n\n#### 开源与厂商中立代理\n\n\
  \n\n\n### 第三方 CLI 代理：开源工具\n\n第三类工具是开源 CLI 代理，如 `OpenCode`、`Aider` 和 `Continue`，它们以生态深度换取供应商独立性。^[²⁴²]\
  \ `Codex CLI` 与 OpenAI 的模型栈紧密耦合，而这些工具将每个供应商视为一等公民，在一个接口后支持数十个模型后端，通常采用宽松许可证，使其无需采购审查即可嵌入。对于运行本地模型的气隙环境，或采购流程使专有工具变得不切实际的组织，它们完全消除了锁定顾虑。\n\
  \n代价是使商业工具对多开发人员团队具有实用性的那层有观点的配置。这些代理通常缺乏商业选项的内核级沙箱、命名权限配置文件和托管企业功能，且其基准性能往往未经独立验证。当供应商中立性、气隙操作或模型不可知论是主要需求时，它们是强有力的选择；但当你需要开箱即用的团队范围约定和硬隔离时，则较难推销。\n\
  \n### 规格驱动与并行编排代理\n\n还有两类 CLI 值得提及，因为它们代表了真正不同的设计理念，而非增量功能差异。\n\n#### 规格驱动代理\n\n\
  **规格驱动代理** 将结构化规格（而非代码库）视为主要工件。`Codex CLI` 是终端优先且极简的（提示、执行、沙箱），而规格驱动代理首先将自然语言请求转换为代理和人类共同参考的正式规格，然后才生成代码。这适合已从书面规格工作并希望代理计划成为可审查文档的团队；它增加了快速单文件编辑不需要的仪式感。`Codex\
  \ CLI` 通过手动规划约定（`PLANS.md` 文件，*第 3 章* 的规划方法）而非一等规格对象达到类似目的。\n\n#### 并行编排代理\n\n**并行编排代理**\
  \ 押注于不同策略：它们不采用单一深度推理链，而是扇出至由路由器协调的多个子代理，有时在人类看到任何内容之前，对相互竞争的输出进行评分。对于存在多种合理实现的探索性工作，广度优先探索能浮现单个代理永远不会尝试的选项。权衡在于控制力和可验证性：单次高质量代理遍历产生更清晰的记录，且对明确指定的工单更具成本效益；该类别中新进入者的自我报告基准数据并不总能经受住独立评估。\n\
  \n请谨慎对待任何供应商的自我报告基准数字，直到出现独立评估。使用不同脚手架测量的分数，或由第三方（如独立评估实验室）测量的分数，往往远低于标题数字。脚手架视角双向起作用：包裹在弱公共脚手架中的强模型可能表现不及其自身营销。\n\
  \n### IDE 代理\n\nIDE 代理将 AI 能力直接嵌入编辑器。主要优势是工作流连续性：开发者以可视化差异形式查看建议变更，内联接受或拒绝，永不离开编辑上下文。\n\
  \n#### Cursor\n\n**Cursor** 是主导的 IDE 代理，也是该类别做得最好的最清晰示例。^[²⁴³] 其市场地位反映了真实的用户体验质量而非营销：可视化差异在任何变更被接受前落地，完整的编辑器扩展生态系统保持完好，且无需上下文切换到终端。当你希望在代理接触代码前准确看到其将做什么，且工作流以编辑器为中心时，它具有决定性优势。\n\
  \n权衡是 Token 成本：更丰富的可视化脚手架（编辑器状态、打开文件上下文、内联差异流）消耗比无头代理更多的 Token 完成相同任务，独立测试测量 CLI\
  \ 代理完成相同工作所用 Token 比 IDE 代理少几倍。^[²⁴⁴] `Cursor` 不是 CLI 代理；对于终端优先工作流（CI/CD 流水线、脚本自动化、无头操作），它在架构上不适合该工作，正如无头代理不适合想要每次编辑都有内联差异的人一样。\n\
  \n#### GitHub Copilot\n\n**GitHub Copilot** 拥有市场上最高的品牌知名度，最初作为自动补全，现已成为具有交互、异步和\
  \ CLI 模式的多组件平台。^[²⁴⁵] 两点使其独特。第一是其异步编码代理：你分配一个议题，它启动托管 CI 沙箱，将提交推送到草稿拉取请求，并在完成时请求审查，全程无需你守在桌前。这种委托即遗忘模型在结构上不同于\
  \ `Codex CLI` 和 `Claude Code` 使用的交互循环，且真正适合议题分类和直接的错误修复。第二是模型灵活性：`Copilot` 允许你按任务从多个供应商中选择模型，这是单一供应商工具不具备的优势。其弱点是原始代理能力，落后于前沿\
  \ CLI 代理；其强项是生态集成，对于已在 GitHub 上的团队，增加代理能力的边际成本极低。\n\n#### 编辑器作为多代理界面\n\nIDE 层级更有趣的发展不是任何单一代理，而是编辑器成为同时托管多个代理的宿主。一些编辑器现在在一个窗口中以对等方式运行多个代理，每个代理在自己的线程中处理代码库的不同部分，通过开放的代理到编辑器协议协调，使任何兼容代理（包括\
  \ `Codex CLI`）成为一等公民。在这样的编辑器中运行 `Codex CLI` 赋予你原始终端无法提供的三样东西：共享文件上下文（编辑器转发你的工作目录和打开文件，无需手动\
  \ `@` 提及体操）、并行编排（多个 `Codex` 线程与其他代理并行）和统一审批界面（工具执行在编辑器中显示为交互式审批，而非争夺单个终端窗格）。\n\n\
  主流编辑器现在在单个侧边栏中将 `Codex`、`Claude` 和 `Copilot` 作为对等代理呈现，具有本地、后台和云执行模式，体现了相同的融合趋势。对\
  \ `Codex CLI` 用户的实际收益是配置可移植性：编辑器集成封装相同引擎并读取相同的 `~/.codex/config.toml`，因此你现有的配置文件、模型偏好和权限设置跨环境保持不变。你在\
  \ CLI 配置上的投入在迁移到编辑器托管工作流时不会搁浅；它是同一个脚手架，只是呈现方式不同。\n\n### 融合层\n\n在竞争表象下，工具正在汇聚到一小组共享标准，这比任何单一基准都重要，因为它决定了你被锁定的程度。三个标准现已跨越工具边界：\n\
  \n1.  `AGENTS.md` 作为可移植指令文件。配置 `Codex CLI` 的相同项目指导（*第 4 章*）被越来越多的竞争代理原生读取，因此单个文件无需重复即可塑造多个工具的行为。\n\
  \n2.  **Agent Skills** 作为可移植能力包。`SKILL.md` 目录（*第 10 章*）日益被跨代理识别，因此编写一次的技能可从多个工具调用。\n\
  \n3.  **MCP** 作为可移植工具层。模型上下文协议服务器（*第 8 章*）向任何支持 MCP 的代理暴露相同工具，因此你构建的集成不绑定单一供应商。\n\
  \n\n\n\n对于买方而言，收敛是本章最好的消息。这意味着决策很少是非此即彼的：一个 `AGENTS.md` 文件、一个技能目录和一个 MCP 服务器配置可以在你技术栈中的各个工具间共享，这使得组装和变更多工具工作流的成本都很低。锁定效应正好在原本危害最大的层面上消退。\n\
  \n### 从 Claude Code 迁移到 Codex CLI\n\n由于收敛层标准可跨工具通用，从 Claude Code 切换到 Codex CLI 主要是一项机械性的配置工作，而非重写。像对待任何迁移一样对待它：制定计划、增量执行、每一步都验证。需要迁移五个组件。\n\
  \n#### 指令文件：从 CLAUDE.md 到 AGENTS.md\n\n`AGENTS.md` 是由 Linux 基金会的 Agentic AI 基金会管理的开放标准。^(²⁴⁶)\
  \ `CLAUDE.md` 专用于 Claude Code。不要删除 `CLAUDE.md`；要重构它。\n\n将通用约定（代码风格、构建命令、测试运行器调用、架构说明）移入\
  \ `AGENTS.md`。保留 `CLAUDE.md` 用于 Claude 特有的指令：钩子引用、子代理定义、记忆配置。添加交叉引用：`See @AGENTS.md\
  \ for build commands, architecture, and conventions.`\n\n如果你无法维护两个文件，可配置 Codex CLI\
  \ 将 `CLAUDE.md` 作为回退选项：\n\n```\n##### ~/.codex/config.toml\nproject_doc_fallback_filenames\
  \ = [\"CLAUDE.md\", \"COPILOT.md\"]\nproject_doc_max_bytes = 65536\n```\n\n撰写本文时，Codex\
  \ 会按顺序从仓库根目录向下检查到你的工作目录中的每个目录：`AGENTS.override.md`（将替换同级的任何 `AGENTS.md`） → `AGENTS.md`\
  \ → `project_doc_fallback_filenames` 中的任意名称。默认字节限制 `project_doc_max_bytes` 为 32\
  \ KiB (32768 字节)，适用于整个拼接链；对于大型单体仓库，将其提高至 65536。\n\n#### 技能\n\n技能具有最高的对等性。`SKILL.md`\
  \ 格式遵循 Agent Skills 开放标准；相同的文件可在 Claude Code、Codex CLI、Cursor 和 Gemini CLI 间通用。Claude\
  \ Code 将技能存储在 `.claude/skills/<name>/SKILL.md` 下；Codex CLI 从 `.agents/skills/` 加载。目录名称不同；文件格式相同。\n\
  \n将 `.claude/skills/` 复制到 `.agents/skills/`。仅使用 `name`、`description`、`allowed-tools`\
  \ 和 `disable-model-invocation` 的技能无需更改即可工作。单独审核其他前置元数据键。`context: fork` 键（在隔离的子代理中运行技能）是\
  \ Claude Code 的扩展；在依赖它之前请验证 Codex CLI 的支持情况。\n\n#### 子代理\n\n子代理代表了最大的架构分歧。Claude\
  \ Code 子代理定义为 Markdown 文件，支持交互式编排，父代理可实时查看推理并干预。Codex CLI 子代理定义为 TOML，适合并行批处理工作负载，即分发任务并收集结果。\n\
  \n将每个子代理重写为 `.codex/agents/`（项目级）或 `~/.codex/agents/`（个人级）下的 TOML 代理定义。在 `.codex/config.toml`\
  \ 中启用 `features.multi_agent = true` 以开启多代理工作流。`agents.max_depth` 默认为 `1`，因此子代理无法在未显式配置的情况下生成更深层的子代理。Codex\
  \ CLI 子代理每次运行消耗的 token 比等效的单代理运行更多；请在成本对比中考虑此因素。\n\n#### 钩子\n\n撰写本文时，Claude Code\
  \ 通过 stdin/stdout 上的 JSON 协议提供了二十多种生命周期钩子事件类型。撰写本文时，Codex CLI 支持十种钩子事件：`SessionStart`、`UserPromptSubmit`、`PreToolUse`、`PermissionRequest`、`PostToolUse`、`PreL1-Bullet`、`PostL1-Bullet`、`SubagentStart`、`SubagentStop`\
  \ 和 `Stop`。与 Claude Code 迁移最相关的五种是 `SessionStart`、`PreToolUse`、`PostToolUse`、`UserPromptSubmit`\
  \ 和 `Stop`。在 `~/.codex/hooks.json`（或项目级的 `.codex/hooks.json`）的 JSON 文件中配置钩子。钩子默认启用；`config.toml`\
  \ 中 `[features]` 下的 `hooks` 开关可让你禁用它们（托管配置可固定该设置）：\n\n```\n{\n \"hooks\": {\n \"\
  SessionStart\": [\n {\n \"hooks\": [\n { \"type\": \"command\", \"command\": \"\
  ~/.codex/hooks/on-session-start.sh\", \"timeout\": 15 }\n ]\n }\n ],\n \"Stop\"\
  : [\n {\n \"hooks\": [\n { \"type\": \"command\", \"command\": \"~/.codex/hooks/on-stop.sh\"\
  , \"timeout\": 10 }\n ]\n }\n ],\n \"UserPromptSubmit\": [\n {\n \"hooks\": [\n\
  \ { \"type\": \"command\", \"command\": \"~/.codex/hooks/on-prompt.sh\", \"timeout\"\
  : 5 }\n ]\n }\n ],\n \"PreToolUse\": [\n {\n \"matcher\": \"Bash\",\n \"hooks\"\
  : [\n { \"type\": \"command\", \"command\": \"~/.codex/hooks/pre-tool.sh\", \"timeout\"\
  : 5 }\n ]\n }\n ],\n \"PostToolUse\": [\n {\n \"matcher\": \"Bash\",\n \"hooks\"\
  : [\n { \"type\": \"command\", \"command\": \"~/.codex/hooks/post-tool.sh\", \"\
  timeout\": 10 }\n ]\n }\n ]\n }\n}\n```\n\n`matcher` 字段是应用于工具名称的正则表达式。撰写本文时，`PreToolUse`\
  \ 和 `PostToolUse` 匹配 `Bash`、文件编辑工具 `apply_patch` 以及 MCP 工具名称（如 `mcp__filesystem__read_file`）。使用\
  \ `\"matcher\": \"Bash\"` 直接移植拦截 shell 命令的 Claude Code `PreToolUse` 钩子。对于拦截文件编辑的钩子，使用\
  \ `\"matcher\": \"apply_patch\"` 进行匹配。\n\n对于副作用钩子（日志记录、Slack 通知、审计跟踪），使用 `Stop`\
  \ 和 `SessionStart`。按名称拦截文件写入工具的 Claude Code 钩子无法映射到同名的 Codex CLI 工具；改为匹配 `apply_patch`，或通过\
  \ `sandbox_mode` 或 `AGENTS.md` 指令强制执行文件写入策略。\n\n#### 配置\n\nClaude Code 使用五层 JSON\
  \ 级联，其中激活层是隐式的。Codex CLI 使用命名配置文件，因此你始终知道哪个配置处于激活状态，因为是你选择的。每个配置文件位于各自的文件中，`~/.codex/<name>.config.toml`，采用顶层键而非\
  \ `config.toml` 内部的 `[profiles.<name>]` 表。运行 `codex --profile <name>` 会先加载 `~/.codex/config.toml`，然后在其之上叠加配置文件：\n\
  \n```\n##### ~/.codex/config.toml\nmodel = \"gpt-5.5\"\nmodel_reasoning_effort =\
  \ \"medium\"\napproval_policy = \"untrusted\"\n##### ~/.codex/strict.config.toml\n\
  model_reasoning_effort = \"high\"\napproval_policy = \"on-request\"\nsandbox_mode\
  \ = \"workspace-write\"\n##### ~/.codex/fast.config.toml\nmodel = \"gpt-5.4-mini\"\
  \nmodel_reasoning_effort = \"low\"\napproval_policy = \"never\"\nsandbox_mode =\
  \ \"read-only\"\n```\n\n在 CLI 处切换配置文件：`codex --profile strict \"review the auth\
  \ module\"` 加载基础 `config.toml` 然后叠加 `strict.config.toml`。两个工具的模型命名不同：Claude Code\
  \ 使用 Anthropic 模型名称（`claude-opus-4-8`、`claude-sonnet-4-6`）；Codex CLI 使用 OpenAI 模型名称。模型名称频繁变更，因此在\
  \ CI 流水线中硬编码之前，请根据 OpenAI 文档核对当前名称。\n\n推荐的迁移后布局在仓库根目录并存保留 `AGENTS.md` 和 `CLAUDE.md`，将子代理定义作为\
  \ TOML 文件置于 `.codex/agents/`（项目级）或 `~/.codex/agents/`（个人级），并将 `.agents/skills/`\
  \ 作为两个工具共同读取的共享技能目录。\n\n### 跨代理迁移工具\n\n收敛层使得在任意两个代理之间移植变得主要是机械性的，而不仅限于从 Claude Code\
  \ 到 Codex CLI。大多数团队的配置、技能、MCP 服务器和会话历史分散在多个框架中；两种机制将这种碎片化变成了已解决的问题。\n\n#### Detect/Import\
  \ API\n\nCodex CLI 为碎片化提供了一流的解决方案：`externalAgentConfig/detect` 和 `externalAgentConfig/import`\
  \ JSON-RPC API，由异步后台会话导入提供支持。\n\n`externalAgentConfig/detect` 扫描文件系统以查找其他代理框架可导入的工件。它接受\
  \ `includeHome`（扫描主目录中的全局配置）和 `cwds`（要扫描的项目目录），并返回类型化的 `migrationItems`：\n\n| **项目类型**\
  \ | **涵盖内容** |\n| --- | --- |\n| `AGENTS_MD` | CLAUDE.md、.cursorrules 或其他可映射到 AGENTS.md\
  \ 的指令文件 |\n\n\n\n\n\n| --- | --- |\n\n| `CONFIG` || 全局配置（模型默认值、批准模式、提供商密钥） |\n\n\
  | `SKILLS` || 包含 `SKILL.md` 文件的技能目录 |\n\n| `PLUGINS` || 应用商店插件引用 |\n\n| `MCP_SERVER_CONFIG`\
  \ || MCP 服务器连接定义 |\n\n检测过程**幂等且增量**：如果 `AGENTS.md` 已存在且非空，Codex 会跳过 `AGENTS_MD`；技能导入不会覆盖现有的技能目录。\n\
  \n`externalAgentConfig/import` 应用选定的迁移项。它会立即返回并在后台异步处理导入，完成后发出 `externalAgentConfig/import/completed`\
  \ 通知。会话历史记录导入是最繁重的操作，完全在后台通过串行化处理运行以防止重复。\n\n**表 26-2. 常见源 Agent 的具体文件映射**\n\n|\
  \ **制品** || **Claude Code** || **Cursor** || **Codex CLI 目标** |\n\n| --- | --- |\
  \ --- | --- |\n\n| Agent 指令 || `CLAUDE.md` || `.cursor/rules/*.mdc` || `AGENTS.md`\
  \ |\n\n| --- | --- | --- | --- |\n\n| 技能 || `.claude/skills/<n>/SKILL.md` || `.cursor/skills/`\
  \ || `.agents/skills/` |\n\n| MCP 服务器 || `.mcp.json` || `.cursor/mcp.json` || `config.toml`\
  \ `[mcp_servers]` |\n\n| 全局配置 || `~/.claude/settings.json` || `~/.cursor/settings.json`\
  \ || `~/.codex/config.toml` |\n\n对于并行运行多个 Agent 的团队，同步方法通常比一次性迁移效果更好。维护单一事实来源文件（通常为\
  \ `AGENTS.md`），并使用构建脚本生成特定工具的变体。\n\n#### Microsoft APM：跨 Agent 配置管理\n\nMicrosoft\
  \ 的 **Agent Package Manager (APM)** 以 MIT 许可证作为开源发布，引入了一个位于任何单个工具之上的配置管理层。^(²⁴⁷)\
  \ APM 支持八款 AI 编码 Agent（GitHub Copilot、Claude Code、Cursor、OpenCode、Codex CLI、Gemini\
  \ CLI、Windsurf 和 Kiro），均通过单一清单文件管理。\n\nAPM 的 `apm.yml` 在 Node 项目中的角色相当于 `package.json`：即\
  \ Agent 所需一切的声明式规范：\n\n```\nname: subscriptions-api\nversion: 1.0.0\ndependencies:\n\
  \ apm:\n - acme/agent-skills/skills/migration-auditor\n - acme/agent-skills/plugins/release-notes\n\
  \ mcp:\n - name: io.github.github/github-mcp-server\n transport: http\n```\n\n运行\
  \ `apm install` 可从任意 Git 托管平台解析依赖，并将其部署到各 Agent 的正确位置。`apm.lock.yaml` 文件固定已解析的来源和内容哈希，确保确定性复现。APM\
  \ 将 Codex CLI 列为其支持的八款 Agent 之一；编译目标名称记录在 APM README 中。\n\nAPM 对 Codex CLI 团队的当前价值主要体现在三个方面：跨仓库标准化\
  \ `AGENTS.md` 内容（APM 解析传递指令依赖）、分发技能，以及同时使用 Codex CLI、Claude Code 或 Copilot 的团队的跨\
  \ Agent 一致性。安全特性包括安装时的内容扫描（阻止用于提示词注入的隐藏 Unicode 字符）、通过内容哈希实现的锁文件完整性，以及通过 `apm audit`\
  \ 进行的偏移检测。\n\n对于企业团队，`apm-policy.yml` 采用“仅收紧”继承模型强制执行组织对 Agent 配置的约束：企业策略限制最严，仓库策略只能进一步收紧。这补充了\
  \ Codex CLI 的 `requirements.toml` 强制执行：APM 控制配置供应链，权限配置文件控制运行时沙箱。\n\nCodex CLI 支持通过可流式\
  \ HTTP 连接远程 MCP 服务器（配置服务器 `url` 加上持有者令牌或 OAuth 认证）。一些跨 Agent 包管理器仍保留着过时的假设，即认为 Codex\
  \ CLI 不支持此功能，并可能跳过 `transport: http` 依赖的 Codex 目标；请查看你的包管理器发行说明，因为这一差距正在缩小。\n\n\
  #### Gemini CLI 停止维护\n\nGoogle 在 2026 年 I/O 大会上宣布，Gemini CLI 将于 2026 年 6 月 18 日停止维护，由\
  \ Antigravity CLI 取代。^(²⁴⁸) 目前正在使用 Gemini CLI 的团队应在截止日期前将其配置迁移至 Antigravity CLI\
  \ 或 Codex CLI。映射关系简单直接：`.gemini/` 配置映射到 `~/.codex/config.toml`，`.gemini/agents/`\
  \ 自定义 Agent YAML 文件映射到 `.codex/agents/` TOML 文件，`@agent` 调用映射到 Codex CLI 中的 `/agent`。MCP\
  \ 服务器配置协议兼容，仅需移动配置文件即可。\n\n### 多工具模式\n\n大多数对比文章的错误前提在于：你必须选择一种工具并坚持使用。资深从业者实际采用的模式是分层栈，每种工具分配到其架构优势所在：\n\
  \n1.  **IDE Agent** 用于交互式开发：编写功能、探索陌生代码、在视觉反馈至关重要的场景下进行结对编程。\n\n2.  **CLI Agent**\
  \ 用于自动化：CI/CD 任务、批量重构、测试生成，以及任何需要内核级隔离的工作。\n\n3.  **第二个 CLI Agent 或云 Agent** 用于处理第一个\
  \ Agent 最不擅长的工作：复杂推理、可编程策略执行，或无需本地会话的长时间运行异步任务。\n\n这些工具通过 Git 共享同一代码库，通过上述汇聚层共享同一上下文，因此开发者按任务而非平台忠诚度来选择工具。边界通常很清晰。编辑单个文件并希望在落地前查看差异，属于\
  \ IDE Agent 的工作。涉及文件系统操作、执行测试且需要隔离的多步骤任务，属于 CLI Agent 的工作。委派任务然后离开，属于异步 Agent 的工作。为单行补全使用功能齐全的终端\
  \ Agent 属于过度设计；为需要内核沙箱的多步骤 CI 任务使用 IDE 插件则属于设计不足。\n\n有一种从业者变体值得强调，因为它能提升质量而不仅仅是路由工作：**双工具审查工作流**，即一个\
  \ Agent 构建，另一个不同的 Agent 审计。^(²⁴⁹) 在一个记录在案的例子中，一个 CLI Agent 负责 Web 应用的初始开发，第二个 Agent\
  \ 的审查环节发现了第一个遗漏的约二十个 Bug：时间戳错误、导航故障，以及构建者模型盲区中的边缘情况。原则很简单：绝不发布仅有一个模型见过的代码。不同模型有不同的盲区，因此让第二个\
  \ Agent 阅读第一个 Agent 的差异，是一种廉价有效的检查，单模型无法复制。这与 *第 20 章* 中对抗性审查模式背后的直觉一致，只是应用在工具间而非工具内。\n\
  \n相关的一个发展是**桌面封装器**的兴起，它们将多个 CLI Agent（Codex CLI 和竞品）集成到一个应用中，具备任务调度、Git 工作树管理 (*第\
  \ 13 章*) 和远程操作功能。这些工具竞争的是“开发者工作台”——即你整天保持打开的应用——而非底层的 Agent 引擎。底层的 Codex 引擎保持不变；价值主张在于顶层的编排层。该层是否值得采用，取决于其调度和工作区管理是否优于你通过\
  \ `codex exec` 加上操作系统级工具所能组装出的方案。对许多团队而言，目前尚不具备优势，但这一品类值得关注。\n\n#### 何时坚持使用现有工具\n\
  \n\n\n\n工具切换有真实成本：学习曲线、配置迁移、团队对齐。仅当架构权衡能证明其合理性时才切换。如果你目前使用其他工具很高效，那么引入 Codex CLI\
  \ 的理由仅基于特定条件：你需要内核级沙箱而非基于钩子的策略；你运行任务的规模使得 Token 效率差距成为真实成本因素；你的工作流高度面向终端自动化；或你需要大上下文窗口的正式版而非预览版。如果这些条件均不适用，你当前的工具就很好，本书对\
  \ Codex 特定配置的深度探讨对你而言只是学术性的而非操作性的。同理：如果你更喜欢待在编辑器中，在代码落地前查看差异，且极少进行终端自动化，IDE Agent\
  \ 将比任何 CLI Agent 更适合你，终端优先的热情不应凌驾于你自己的工作流偏好之上。如果你当前的工具能很好地处理 80% 的用例，请优化剩下的 20%，而不是替换整个技术栈。\n\
  \n如果你首次向团队引入 Agentic 工具，请从一个工具针对一个定义明确的任务类型开始，然后再扩展。一支自信地使用 IDE Agent 进行内联编辑、刻意使用\
  \ Codex CLI 处理 CI 任务的团队，将比安装了五个工具却无使用约定的团队交付得更可靠。\n\n### 沙箱全景\n\n沙箱是工具间架构上最显著的差异因素，因为它决定了当（而非是否）\
  \ Agent 收到恶意或错误指令时能做什么。按执行强度分层，方法分为清晰的梯队。\n\n| **方法** | **执行层** | **绕过风险** |\n|\
  \ --- | --- | --- |\n| 内核级（Seatbelt、Landlock、bubblewrap、seccomp） | 操作系统系统调用层 | 极低：需要内核漏洞利用\
  \ |\n| 容器级（Docker、Firecracker、每 Agent 一个容器） | 命名空间隔离 | 低：需要容器逃逸 |\n| 虚拟机级（云沙箱） |\
  \ 完整机器隔离 | 极低，但开销较高 |\n| 应用层（基于信任、策略文件） | Agent 自我执行 | 中等：提示词注入可绕过 |\n| 无 | 无限制\
  \ | 高：任何工具调用均不加检查地通过 |\n\n应用此表时有两点细化很重要。首先，现在有多个 CLI 工具将 Shell 子进程的内核级沙箱与用于文件编辑的应用层权限层结合在一起，因此“应用层”行描述的是一个类别，而非某个特定工具。**按工具最弱的执行边界分类，而非最强的。**\
  \ 一个工具如果对 Bash 实施内核沙箱，却让文件编辑通过自我执行的权限检查，从威胁建模角度来看，它仅与该权限检查对抗提示词注入的能力一样强。\n\n其次，梯队在隔离强度与开销之间权衡。像\
  \ Seatbelt 和 Landlock 这样的内核级原语由操作系统以近乎零开销强制执行，且在 Codex CLI 中是内置而非外挂的。容器级隔离为并发 Agent\
  \ 之间提供更强的分离，代价是容器启动延迟，当你并行运行多个 Agent 并需要其工作树之间有硬边界时，这笔开销值得付出（第 13 章）。虚拟机级隔离被云执行面使用，在最高开销下提供完整机器分离，是完全自主、不受信执行的正确梯队。对于安全敏感环境，内核级或容器级沙箱是不可商量的；对于受信的本地开发，应用层模型可能足够。决策权在于你的威胁模型，而非基准测试，第\
  \ 16 章将演示如何做出决策。\n\n### 总结\n\n1.  **单一架构轴线划分市场。** Agentic 编码市场沿 CLI 与 IDE 这条线划分，各自针对不同工作流优化：一边是无人值守执行与可脚本化，另一边是紧凑反馈循环与可视化差异。将具名工具视为这些类别的代表，因为类别比品牌更持久。\n\
  \n2.  **编排层比模型更具差异化。** 接口、机制、扩展这三层解释了运行可比模型的工具之间的大部分差异，这正是第 27 章将全面展开的论点。模型决定上限；编排层决定你能触及多少上限。\n\
  \n3.  **CLI Agent 在自动化上胜出。** 它们擅长 CI/CD、内核级沙箱和 Token 效率，因为无头终端操作避免了 IDE 协议层的开销。Codex\
  \ CLI 的优势集中在机制层，正是调查预测持久差异存在之处。\n\n4.  **Claude Code 是最接近的同辈。** 它在推理质量和可编程钩子表达力上领先；Codex\
  \ CLI 在 Token 效率和默认内核级隔离上领先。二者是真正的权衡，而非排名，诚实的评估方式是在两者中运行相同任务并对比 Token 计数。\n\n5.\
  \  **IDE Agent 在交互式工作上胜出。** Cursor 等工具擅长可视化差异审查和工作流连续性；GitHub Copilot 增加了独特的委托并离线的异步模型及每任务模型选择。两者为相同编辑付出的\
  \ Token 成本都比无头 Agent 高。\n\n6.  **融合层降低了赌注。** `AGENTS.md`、Agent Skills 和 MCP 现已跨工具流通，因此多工具栈组装廉价且切换廉价。在最可能造成伤害的层面上，锁定效应正在消退。\n\
  \n7.  **多工具模式优于忠诚度。** 根据架构优势分配每个工具，而非强迫一个工具覆盖所有场景。双工具审查工作流——用一个 Agent 构建，用另一个 Agent\
  \ 审计——能捕获单模型单次通过遗漏的 Bug，理由正如对抗性审查在单工具内生效一样。\n\n8.  **沙箱是最尖锐的差异因素。** 系统调用层的内核级强制执行，在范畴上不同于\
  \ Agent 对自我执行、且可被提示词注入绕过的应用层策略。按工具最弱的执行边界分类，而非最强的。\n\n9.  **仅当权衡证明成本合理时才切换。** 学习曲线、配置迁移、团队对齐是真实的；如果你当前的工具能处理好\
  \ 80% 的用例，请优化剩下的 20%，而不是替换整个技术栈。\n\n10. **切换工具主要是机械操作。** 因为 `AGENTS.md`、Skills 和\
  \ MCP 跨 Agent 流通，从 Claude Code 迁移到 Codex CLI 是一个五组件配置练习（指令、技能、子 Agent、钩子、配置），加上\
  \ `externalAgentConfig` 检测/导入 API 及微软 APM 等跨 Agent 包管理器自动完成其余工作。\n\n### 练习\n\n**练习\
  \ 26-1. 在两个工具中运行同一任务。** 从当前项目中选取一个范围明确的任务，例如“为用户注册端点添加输入验证”。分别在 Codex CLI 和一个竞品工具中运行它。记录\
  \ Token 计数、批准提示次数、输出质量（能否编译、是否处理边缘情况）和墙钟时间。记录你会为该任务类别选择哪个工具及原因。\n\n**练习 26-2. 将你的任务映射到框架。**\
  \ 写下你使用 AI 编码工具的五种最常见任务类型。对每一种，应用表 26-1 识别适配的架构类别。如果五者答案都是同一类别，你大概不需要多工具设置。如果答案各异，勾画分层工作流的样子。\n\
  \n\n\n\n**练习 26-3. 设计多工具工作流。** 为您的团队设计一个工作流，将 IDE 智能体、CLI 智能体以及云端或异步智能体分配给特定的任务类别。记录该工作流及每项分配的基本原理，并明确说明工具将通过汇聚层共享哪些\
  \ `AGENTS.md`、技能和 MCP 配置。\n\n**练习 26-4. 根据您的需求审计沙箱隔离。** 根据贵组织的安全要求，评估三种不同工具的沙箱模型。构建对比矩阵，按每个工具强制执行的最弱边界对其进行分类，并找出哪些工具满足您的安全门槛。\n\
  \n**练习 26-5. 将工作流移植到 Codex CLI。** 如果您有一个正常运行的 Claude Code（或其他智能体）项目，请完成五组件迁移图谱：从\
  \ `CLAUDE.md` 中的通用内容创建 `AGENTS.md`，将您的技能复制到 `.agents/skills/`，以 TOML 格式重写任何子智能体，移植您依赖的钩子，并创建一个包含至少两个命名配置集的\
  \ `~/.codex/config.toml`。验证 `codex --profile strict \"summarize the codebase\"`\
  \ 能否在不修改任何文件的情况下成功运行。\n\n# 27\n\n# 为长期运行智能体构建工程护架\n\n前几章为您提供了词汇：工具、移交、护栏、上下文窗口。但仅有原语不足以构成生产系统。锤子和水平仪是建房子的必要工具，但并不充分。缺失的是一切随时间推移将建筑凝聚在一起的东西：保障工人安全的脚手架、经得起真实工况考验的计划，以及在错误变成承重结构前捕捉它们的检查点。在智能体工程中，这种脚手架被称为**护架（harness）**。本章涵盖什么是护架、如何从第一性原理构建护架、当前可添加到\
  \ Codex CLI 护架的组件、大规模展示模式的参考实现（其中主要是 Symphony，OpenAI 的开源护架），以及证明是护架而非模型驱动结果质量的证据。\n\
  \n### 学习目标\n\n您将能够：\n\n1.  解释什么是护架，并使用三层框架和三大支柱阐述为什么是护架而非模型决定了结果质量\n2.  根据三大支柱（密封测试、机器可读文档、模块化架构）审计代码库，并找出迫使智能体进行猜测的因素\n\
  3.  设计一个 `WORKFLOW.md` 文件，同时捕获 Codex 智能体的运行时参数和行为策略\n4.  实施基于检查点的状态持久化策略，使您的智能体能在中断后恢复，而无需重复已完成的工作\n\
  5.  将工作量证明原则应用到您自己的流水线中，无论您是否使用 Symphony\n6.  选择适合您规模的护架组件和编排模式，并论证为什么应在切换模型前先改进护架\n\
  \n### 什么是护架工程\n\nRyan Lopopolo 于 2026 年 2 月创造了该术语[²⁵⁰]，为从业者早已在做却缺乏共同词汇的事情命名。传统软件工程设计代码。提示词工程设计给\
  \ AI 的指令。护架工程设计使 AI 智能体可靠高效的基础设施、约束和反馈回路。它位于上述两者之上一层。Lopopolo 用一句话总结道：“智能体不难；护架才难。”[²⁵¹]\n\
  \n护架是包裹智能体的一切：描述项目的 `AGENTS.md`、提供确定性反馈的测试套件、限制爆炸半径的沙箱、验证输出的 CI 流水线、决定何时必须人工干预的审批策略，以及让多小时任务能在瞬时故障中存活的检查点逻辑。当您的护架设计良好时，一个强大的模型就能高置信度地自主完成任务。当它设计不良时，即使是最好的模型也会陷入挣扎。\n\
  \n如果您已学完第四部分，您其实早就在做护架工程了。每一次 `AGENTS.md` 的完善、密封测试套件、`PostToolUse` 静态检查钩子和 `codex\
  \ exec` CI 配置集都是护架工作。本章增加的是原则性模型：每个护架必须满足的三大支柱、解决特定失效模式的模式，以及使智能体策略可审计和版本控制的格式。\n\
  \n#### 学术基础：三层框架\n\n2026 年 5 月，一篇由 42 位作者撰写的综述论文（“Code as Agent Harness”，arXiv 2605.18747）首次利用三层架构框架对编码智能体进行了严谨的学术处理。[²⁵²]\
  \ 该论文的核心论点——“护架拥有循环”——验证了从业者经验性发现的事实：模型是一个组件；护架决定结果质量。\n\n三层分别为：\n\n1.  **接口层。**\
  \ 智能体如何接收指令并呈现结果。在 Codex CLI 中，这包括 `AGENTS.md`、TUI、系统提示词和审批对话框。接口层塑造模型*认为*它应该做什么。\n\
  \n2.  **机制层。** 约束和启用智能体行为的要素。钩子、权限配置集、沙箱策略、执行策略规则和审批模式阶梯。机制层决定模型*能*做什么，无论它认为应该做什么。\n\
  \n3.  **多智能体扩展层。** 智能体如何跨边界协作。MCP 服务器、子智能体、A2A 协议，以及像 Symphony 的 `WORKFLOW.md` 这样的编排模式。扩展层决定一个智能体能否委派给其他智能体，以及状态如何在它们之间流动。\n\
  \n![图 27.1 - 三层护架框架](img/B40007_27_01.png)\n\n**图 27.1 - 三层护架框架**\n\n接口层（`AGENTS.md`、TUI、系统提示词和审批对话框）塑造模型*认为*它应该做什么；机制层（钩子、权限配置集、沙箱策略和审批模式阶梯）决定它*能*做什么；多智能体扩展层（MCP\
  \ 服务器、子智能体、A2A 协议和编排模式）管控状态如何在智能体间流动。每一层都约束其下方的一层。\n\n这些层共同表达了论文的论点：是护架而非模型拥有循环并驱动结果质量。将\
  \ Codex CLI 的架构映射到该框架，使本书的结构作为护架工程课程变得清晰可辨：\n\n| 框架层级 | Codex CLI 原语 | 书籍章节 |\n\
  | :--- | :--- | :--- |\n| 接口层 | `AGENTS.md`、系统提示词、TUI、计划模式 | 第 3、4、7 章 |\n| 机制层\
  \ | 钩子、权限配置集、沙箱、审批模式 | 第 5、9、16 章 |\n| 多智能体扩展层 | MCP 服务器、子智能体、技能、exec 流水线 | 第 8、10、11、12、15\
  \ 章 |\n\n该论文还调查了多个平台（在一份互补的 dev.to 从业者分析中），跨多个评估维度发现，护架工程决策而非模型选择占了实际结果差异的大多数。[²⁵³]\
  \ 使用相同模型但不同护架的两个智能体产生了显著不同的结果。使用不同模型但相似护架架构的两个智能体在质量上趋于相似。护架是自变量。\n\n这一发现重构了团队评估智能体工具的方式。问题不是“哪个模型最好？”，而是“哪个护架为我的约束做出了最佳工程选择？”第\
  \ 26 章将这一视角应用于竞争格局。\n\n#### 三大支柱\n\n\n\n\n以下几个模式都借鉴了 **Symphony**，因此在依赖它之前，有必要清楚地说明它是什么。**Symphony**\
  \ 是 OpenAI 开源的参考级编排工具：它从问题追踪器获取议题，在隔离工作区中为每个议题运行一个 **Codex CLI** 代理，仅当代理产出可验证的工作量证明后，才向人类提交拉取请求。本章后面（“Symphony：编排工具的实践”）将详细剖析其架构；在此之前，请将其视为本章讨论原则的一个具体、可工作的示例。\n\
  \n每个生产级编排工具都建立在三大支柱之上，**Symphony** 的文档对此有明确阐述。^(²⁵⁴)\n\n**隔离测试** 意味着你的测试套件能在本地可靠运行，且无外部依赖。运行\
  \ `npm test` 并获得确定性结果的代理可以独立迭代。依赖预发布数据库或实时 API 的代理会陷入挣扎，无法区分真正的回归和环境故障。修复方法是众所周知的：模拟外部服务、播种测试数据库，并使每个测试都能通过单条命令离线运行。\n\
  \n**机器可读文档** 意味着代理无需询问即可发现如何构建、测试、检查和部署你的项目。`AGENTS.md` 是主要载体（见 第 4 章），但该原则延伸至代理可能需要的任何结构化制品，例如具有命名目标的\
  \ `Makefile`、具有可预测名称的 `package.json` 脚本，或遵循一致格式的 `README` 章节。如果代理必须猜测，就会消耗 Token\
  \ 并引入错误。\n\n**模块化架构** 意味着副作用被局部化且边界显式。修改支付模块的代理不应无意中破坏通知服务。高耦合导致正确性不确定性；低耦合让代理能在有界范围内自信工作。这与优秀架构主张的领域分离是同一论点，但自主代理比人类开发者对它更敏感，因为人类可以提出澄清性问题。**Codex\
  \ CLI** 本身即构建为大型多箱工作区，每个箱拥有独立的编译单元、依赖图和测试套件。（撰写时 **Codex CLI** 仍处于 1.0 版本前；具体箱数量随持续发布而变化。）这是应用于工具自身的编排工程：将模块化架构推向极致，从而实现并行编译、隔离测试和更清晰的依赖审计。使代理任务易于处理的原则，同样让编排工具链更易维护。\n\
  \n### WORKFLOW.md 模式\n\n你在本书中一直使用的 `AGENTS.md` 是一份静态文档：它描述项目及其约定，且在运行间不会改变。`WORKFLOW.md`\
  \ 由 **Symphony** 引入，^(²⁵⁵) 是一种更强大的模式，将两样东西合二为一。\n\nYAML 前置元数据是运行时配置：模型选择、轮次限制、集成端点和所需的工作量证明制品。Markdown\
  \ 正文是代理的系统提示词，以兼容 Liquid 的模板编写。运行时，编排工具利用议题特定上下文（工单标题、仓库、分支、受保护文件）渲染模板，并将结果作为初始指令传递。\n\
  \n```\n---\nmodel: gpt-5.5\nmax_turns: 40\nissue_tracker: linear\nworkspace_mode:\
  \ isolated\nproof_of_work: [ci, review, complexity]\n---\n#### Markdown 正文 — 兼容\
  \ Liquid 的提示词模板\nYou are implementing {{ issue.title }}.\nContext:\n{{ issue.description\
  \ }}\nRepository: {{ repo.name }}\nBranch: {{ branch_name }}\nRules:\n- Run the\
  \ full test suite before marking done\n- Do not modify {{ protected_files }}\n-\
  \ Write tests for any new functions\n```\n\n这种结构含义值得深思。代理行为现为版本化的仓库制品。你可以跨版本对比代理策略，回滚引入\
  \ Bug 的行为变更，并在将变更推广至生产前要求拉取请求审查。代理指令受同一治理约束，因为它们与应用代码处于同一仓库。\n\n即使你未使用 **Symphony**\
  \ 完整的编排层，也可在自己的流水线中采用此文件格式。**Codex CLI** `exec` 调用可使用任意 YAML 解析器读取 YAML 前置元数据，用兼容\
  \ Liquid 的引擎渲染正文（例如 Python 的 `python-liquid`，或若你用 Jinja 重写模板则用 `jinja2`），并将结果作为系统提示词传递。你无需\
  \ Elixir 依赖即可获得所有版本控制优势。\n\n将 `WORKFLOW.md` 置于仓库根目录，与 `AGENTS.md` 共存。两个文件均记录代理策略；评估代理为何表现异常时，两者都应被审查。\n\
  \n#### 代理运行间的状态持久化\n\n长时间运行的代理可能被中断。网络超时、进程重启、预算限制和 CI 运行器回收都可能导致代理在任务中途终止。状态持久化让代理能从最后一个安全检查点恢复，而非重头开始。有三种粒度级别可供选择；正确选择取决于任务时长和成本。\n\
  \n**会话 ID 恢复** 是最轻量的方法。**Codex CLI** 为每次对话分配一个会话 ID。持久化该 ID 并通过 `/resume` 或向下次调用传递标识符来恢复；代理将从中断处继续。局限性在于：会话上下文在运行期间驻留内存，若进程在\
  \ ID 记录前退出，则会丢失。\n\n**检查点文件** 适用于有明显阶段的任务。编排工具写入检查点，记录已完成阶段及其产出。重启时，它读取检查点并指示代理从记录的阶段继续。格式为纯\
  \ JSON，易于检查、重演和归档。\n\n```\n{\n \"issue_id\": \"ENG-4821\",\n \"branch\": \"fix/auth-token-expiry\"\
  ,\n \"phases_completed\": [\"diagnosis\", \"implementation\"],\n \"phases_remaining\"\
  : [\"tests\", \"documentation\"],\n \"artifacts\": {\n \"diagnosis\": \"Root cause:\
  \ JWT expiry check off by one in token_service.py line 147\",\n \"implementation\"\
  : \"Patch applied to token_service.py, session_manager.py\"\n },\n \"last_updated\"\
  : \"2026-03-26T14:23:11Z\"\n}\n```\n\n**数据库支持的状态** 适用于并发运行许多代理、需要将其进度作为舰队进行查询、监控或管理的场景。**Symphony**\
  \ 采用此法：每个代理的状态是 Postgres 表中的一行，编排器查询该表以分派新工作、检测停滞代理并汇总完成度指标。^(²⁵⁶) 对单团队而言这可能过度设计；但对运行数十个代理处理共享积压工作的组织，这是唯一能扩展的方法。\n\
  \n无论选择哪种持久化策略，请确保检查点格式包含模式版本字段。代理流水线会演进，当格式变更时你需迁移现有检查点。检查点存储中缺少版本字段是技术债，终将以生产事故形式显现。\n\
  \n#### 错误恢复与重试\n\n状态持久化告诉你代理失败时在何处。错误恢复决定下一步做什么。三种模式对应三类故障。\n\n**指数退避重试** 处理瞬时故障：限流、临时网络错误、二次尝试即通过的易失性测试。编排工具捕获失败，等待随重试次数增长的退避间隔，并用相同输入重新调用代理。最大重试次数和退避上限应可在\
  \ `WORKFLOW.md` 前置元数据中配置；将其硬编码是造成流水线僵化的常见错误。\n\n\n\n\n#### 人工介入升级\n\n**人工介入升级**\
  \ 用于处理需要智能体无法提供的判断力的失败情况：需求模糊、约束冲突，或测试失败可能意味着真正的回归或测试本身有问题。工具框架通过 `Linear`、`Slack`\
  \ 或 `GitHub` 向人工呈现失败信息，并附带足够的上下文以解除智能体的阻塞。目标是将升级次数降到最低，而非完全消除。\n\n#### 回滚模式\n\n\
  **回滚模式** 用于处理必须在重试前撤销部分已应用更改的情况。如果智能体以原子方式提交（每次提交对应一个逻辑变更），工具框架即可识别出错误提交，将其还原，并干净地重新开始。混合了正确与错误工作的整体式提交则难以回滚得多。\n\
  \n不要实现吞没错误信息的静默重试循环。每次重试都应记录失败原因、重试次数和退避间隔。一个在成功前静默重试失败操作二十次的智能体消耗了二十倍的预算；一个静默重试最终却放弃的智能体一无所获且毫无反馈。在无人值守操作中，可观测性不是可选项。\n\
  \n#### 工作量证明原则\n\nSymphony 中最重要的架构理念，也是最适用于任何流水线的理念，是**工作量证明**：智能体必须通过可验证的证据来证明完成，而不仅仅是报告“已完成”。[¹]\n\
  \n问题在于根本的信任鸿沟。当智能体报告完成时，除非验证内置于循环中，否则你只能听其片面之词。智能体可能自信地犯错：通过无法覆盖相关用例的测试、产出包含微妙逻辑错误的代码，或实现了与需求相邻但不完全一致的功能。\n\
  \n在向人工审查者呈现拉取请求前，Symphony 要求提供四种形式的证据：\n\n1.  **CI 通过：** 所有测试在 CI 流水线中通过，而非仅在本地通过\n\
  2.  **审查反馈：** 自动化代码审查分析，识别任何潜在问题\n3.  **复杂度分析：** 代码变更规模与复杂度指标\n4.  **演示视频：** 记录变更内容及原因的视频\n\
  \n演示视频往往让人惊讶。它迫使智能体讲述自己的工作：所理解的问题、采取的方法、证明方法成功的证据。这种叙述本身就是一种质量信号；一个无法清晰解释自己做了什么的智能体，很可能没有充分理解它。\n\
  \n你不需要 Symphony 即可应用此原则。在 `Codex CLI` 工作流中：在每个子智能体的指令末尾加上“标记完成前必须运行测试”的要求；编写一个 `PostToolUse`\
  \ 钩子查询 CI API，若流水线未通过则拒绝继续；要求会话结束前必须产出结构化的变更摘要作为强制产物。\n\n核心原则是：智能体应是可问责的行动者，而非黑盒。问责需要证据，而证据需要一个工具框架，使产出证据成为智能体职责描述的一部分。\n\
  \n### 今日即可添加的工具框架组件\n\n前述模式属于架构层面。以下是可立即接入 `Codex CLI` 工具框架的具体组件，每个组件填补一个特定的操作缺口：模型运行位置、工具隔离方式、变更审查方式、工具框架的程序化驱动方式、组件在生态间的迁移方式，以及将智能体嵌入产品时的变化。\n\
  \n#### 作为工具框架组件的本地模型提供商\n\n完全依赖云模型端点的工具框架继承了单点故障，且成本基线随智能体并发数线性增长。在 `[model_providers]`\
  \ 下通过 `config.toml` 配置的本地模型提供商（`Ollama`、`vLLM`、`llama.cpp`）为特定工具框架层级提供了替代方案。`wire_api\
  \ = \"responses\"` 设置确保本地提供商遵循与云端点相同的 API 契约，从而工具框架的其余部分（提示词、工具、审批策略）保持不变。配置文件切换（`--profile\
  \ local` 与 `--profile cloud`）让工具框架操作员可在不修改工具框架本身的情况下按运行选择后端。\n\n本地提供商最适合一级和二级任务：机械性编辑、代码库探索和格式化遍历，此时本地模型与前沿模型的质量差距最小。对于需要深度推理或长程规划的三级工作，云端点仍是合适的后端。该决策应由工具框架操作员的配置文件选择决定，而非工具框架定义本身。当本地层级使用的是自购而非租赁的硬件时，*第\
  \ 14 章* 详述了决定是否划算的本地化部署盈亏平衡点。\n\n#### 用于工具框架级隔离的 Docker MCP 工具包\n\n在开发者机器上将 MCP\
  \ 工具服务器作为裸露的 `npx` 或 `pip` 进程运行，会引入依赖冲突、凭据蔓延，且智能体与宿主机之间零隔离。Docker 的 MCP 工具包在工具框架层面解决了此问题：将\
  \ 200 多个经过验证的 MCP 服务器打包为容器镜像，由单个网关进程前置，处理路由、凭据注入和资源限制。[²]\n\n网关是单个 `stdio` 进程。内部按需将工具调用路由到容器化服务器，每个服务器运行在自己的命名空间中，具有受限特权（无宿主机文件系统访问、1\
  \ CPU、2 GB 内存上限）。响应在返回客户端前会被扫描以防止机密泄露。\n\n工具框架相关性在于配置文件管理。Docker 配置文件为工作流分组 MCP\
  \ 服务器，并可作为 OCI 制品共享。提交一个引用配置文件的 `.codex/config.toml`，即可让每位开发者获得相同的、隔离的工具访问权限。对于\
  \ CI，网关作为 `GitHub Actions` 中的服务容器运行，使 `codex exec` 在无头模式下拥有相同工具。将 `startup_timeout_sec`\
  \ 设置为至少 30 秒，因为完整目录可能超过 Codex 默认的 10 秒握手超时。\n\n原生 MCP 服务器适用于简单、单工具、高信任度的设置。当你的工具框架需要隔离、凭据管理或团队标准化时，Docker\
  \ MCP 工具包是正确的选择。[³]\n\n#### 内置代码审查技能\n\n`Codex CLI` 提供内置代码审查技能，减少了对自定义审查工具的需求。没有它，工具框架作者需自行连接外部工具：用于静态分析的独立\
  \ MCP 服务器、调用审查智能体的自定义钩子，或第三方 `GitHub Action`。\n\n内置技能根据 `AGENTS.md` 约定分析暂存或已提交的变更，并产出结构化反馈。对工具框架工程师而言，这意味着少了一个外部依赖；工作量证明流水线中的审查步骤引用的是随\
  \ `Codex CLI` 自带的能力。特定领域的规则或合规性检查可能仍需专用工具，但对于人工签收前的通用代码质量把关，内置技能更简单且易于维护。\n\n####\
  \ 用于自定义工具框架客户端的 App Server JSON-RPC\n\n`Codex App Server` 将智能体核心与其客户端界面解耦。每种 `Codex\
  \ CLI` 体验（CLI TUI、VS Code 扩展、桌面应用、Web 界面、IDE 集成）均通过单一的双向 `JSON-RPC 2.0` API 通信。[⁴]\
  \ 对工具框架工程师而言，这是自定义前端和编排层的集成点。\n\n该协议通过三个原语构建交互：Items（原子输入/输出单元）、Turns（一个智能体工作单元产生的\
  \ Item 序列）和 Threads（支持创建、恢复、分叉和归档的持久会话容器）。提供两种传输方式：用于本地集成的 `stdio`（`codex app-server`，受支持的默认方式），以及用于具有\
  \ `/readyz` 和 `/healthz` 健康检查的远程场景的 WebSocket 传输（`codex app-server --listen ws://127.0.0.1:4500`，撰写时为实验性）。\n\
  \n[¹]: 脚注 257\n[²]: 脚注 258\n[³]: 脚注 259\n[⁴]: 脚注 260\n\n\n\n\nHarness 应用场景包括：订阅\
  \ `turn/completed` 通知以追踪 Token 使用的仪表盘、使用具有沙箱隔离功能的 `command/exec` 的 CI/CD 编排器、以及拦截\
  \ `requestApproval` 通知的企业审批网关。可使用 `codex app-server generate-ts` 或 `codex app-server\
  \ generate-json-schema` 生成类型安全的客户端绑定。^(²⁶¹)\n\n对于已超越封装 `codex exec` 的 Shell 脚本阶段的\
  \ Harness 作者而言，App Server 协议是用于程序化智能体控制的稳定、语言无关的基础。\n\n#### 跨工具 Harness 可移植性\n\n\
  `cc-plugin-to-codex` 反向桥接（见第 26 章）使得 Harness 组件能在智能体生态系统之间实现部分可移植性。^(²⁶²) 打包在 Claude\
  \ Code 插件中的 `PostToolUse` 密钥扫描 Hook 可通过 `cc2codex` 转换为 Codex 原生 Hook，反之亦然，可通过 `codex-plugin-cc`\
  \ 实现。对于运行多智能体 Harness 的组织（Codex 用于 CI/CD，Claude Code 用于调试），这意味着共享而非重复。转换过程是有损的且需要验证，但它指向了组件层面的工具无关\
  \ Harness 工程化。\n\n#### SaaS 就绪性与生产环境嵌入\n\n如果您的 Harness 旨在将 Codex CLI 嵌入多租户 SaaS\
  \ 产品中，而非服务于单个工程团队，则工程需求会发生变化。对六个生产嵌入维度（架构、SDK 可用性、会话管理、MCP 可扩展性、气隙能力和许可证）上十一款 CLI\
  \ 智能体的评估，将 Codex CLI 置于第 2 梯队（可嵌入但有注意事项），落后于提供内置会话存储和宽松许可证的 OpenCode 和 Pi/OpenClaw\
  \ 等工具。^(²⁶³) 对 Harness 作者最相关的差距是会话持久化（Codex CLI 基于 stdio 的 JSONL 方法要求您自行构建持久化层）以及面向气隙企业环境的离线模型支持。\n\
  \n在确定嵌入架构之前，请验证在多租户负载下会失效的五个关键点：子进程与库集成、结构化事件流、并发请求下的租户隔离、模型 BYOK（自带密钥）支持、以及沙箱逃逸边界。^(²⁶⁴)\n\
  \n### 实战中的 Harness\n\n有了支柱、策略格式和组件在手，通过查看组装它们的完整 Harness 会有所帮助。两个开放系统处于设计空间的不同位置，决策指南将您的情况映射到适合的模式。\n\
  \n#### Symphony：参考实现\n\nSymphony^(²⁶⁵) 是 OpenAI 大规模 Harness 工程的开源参考实现。其架构将抽象模式具体化。\n\
  \nLinear 看板上的 Issue 进入“Ready for Agent”状态。Symphony 轮询、拾取符合条件的 Issue、创建隔离的按 Issue\
  \ 工作区、生成一个以渲染后的 `WORKFLOW.md` 作为系统提示词的 Codex CLI 智能体，并让智能体工作。在所需的工作量证明工件完成之前，没有任何内容会呈现给人类。随后，人类审查一个由\
  \ CI 状态、代码审查分析和演示视频支持的拉取请求：验证过的结果，而非受监督的过程。\n\nSymphony 基于 Erlang/BEAM 运行时使用 Elixir\
  \ 构建。^(²⁶⁶) 这一选择反映了问题的需求：BEAM 可处理数千个轻量级并发进程，因此运行五十个并行的 Codex CLI 智能体在操作层面类似于运行五个。OTP\
  \ 监督树意味着单个失败的智能体会自动重启而不影响其他智能体。且 BEAM 专为长时间运行的进程设计；耗时数分钟或数小时的智能体是原生用例，而非压力测试。\n\n\
  撰写时，Symphony 处于工程预览阶段，存在有意义的限制：它支持 Linear 但不支持 Jira 或 GitHub Issues，每个 Issue 运行单个智能体且不支持内部子智能体生成，且定制化需要\
  \ Elixir 知识。对于大多数团队而言，它作为参考架构比作为生产依赖更有用。\n\nSymphony 的 `SPEC.md` 阐述了为何使用隔离工作区而非共享环境、为何采用工作量证明而非逐步审查、以及为何选择\
  \ Elixir 而非 Python。详见 [github.com/openai/symphony](http://github.com/openai/symphony)。\n\
  \n**另请参阅：** 第 13 章。Symphony 的按 Issue 工作区是 Git worktree。第 13 章 涵盖了并行工作的创建、会话上下文分配和清理。\n\
  \n#### NanoClaw：持久编排参实现\n\nSymphony 是面向批处理的 Harness（拾取 Issue、处理、交付 PR），而 **NanoClaw**^(²⁶⁷)\
  \ 代表持久编排模式：一个常驻的智能体编排器，维护任务注册表、调度周期性工作、管理容器隔离的工作池，并通过基于通道的消息传递进行通信。\n\n其架构演示了若干补充\
  \ Symphony 批处理模式的模式：\n\n1.  **持久化调度。** 任务可按间隔、每 8 小时或每天上午 8 点调度，而非由外部事件触发。这支持主动工作流：每夜代码质量扫描、每日文档新鲜度检查、每周依赖审计。\n\
  2.  **容器隔离。** 每个 Worker 在自己的容器中运行，提供比仅用 worktree 更强的隔离。行为异常的智能体无法影响其他 Worker 或编排器。\n\
  3.  **基于通道的通信。** Worker 通过结构化消息通道与编排器通信，而非共享状态，实现了难以通过基于文件系统的方法达成的协调模式。\n4.  **任务生命周期管理。**\
  \ 任务可在不丢失状态的情况下暂停、恢复、取消和重新优先级排序。这对跨越数小时或数天的长期工作流至关重要。\n\nNanoClaw 并非 Symphony 的替代品；它占据设计空间的不同位置。Symphony\
  \ 擅长带有工作量证明门控的 Issue 驱动批处理工作流；NanoClaw 擅长持久的、调度驱动的持续运行。许多生产部署将针对不同类别的工作同时使用这两种模式。\n\
  \n#### 选择模式：您自己的 Harness 应走向何方\n\n大多数团队当前所做与 Symphony 所做之间的对比颇具启发性。\n\n**表 27-1.\
  \ Harness 模式决策指南**\n\n| **场景** | **使用的模式** | **Symphony 类比** |\n| --- | --- | ---\
  \ |\n| 单智能体，交互式会话 | `AGENTS.md` + 人工审批 | 不适用 |\n| 单智能体，无人值守 CI 运行 | `WORKFLOW.md`\
  \ + 检查点文件 + `codex exec` | 单 Issue Symphony 运行 |\n| 多智能体，顺序任务 | 带阶段检查点的门控链 | 多个\
  \ Symphony Issue，线性依赖 |\n| 多智能体，并行任务 | 带数据库支持状态的并行集群 | 共享 Linear 看板上的 Symphony 舰队\
  \ |\n| 智能体输出需人工签收 | 工作量证明工件 + 升级 Hook | 带证据包的 Symphony PR |\n| 智能体任务中失败 | 检查点文件\
  \ + 退避重试 | OTP 监督树重启 |\n| 智能体策略需演进 | Git 中的 `WORKFLOW.md` + PR 审查 | Symphony 仓库中版本化的\
  \ `WORKFLOW.md` |\n| 任务需与其他工作隔离 | Git worktree + 沙箱配置 | 每 Issue 隔离工作区 |\n\n从上到下的演进是从交互式工具使用到自主舰队操作。大多数团队处于中间某处。Symphony\
  \ 的价值不在于您需要使用它；它展示了前路的形状，以便您在设计今天的 Harness 时能考虑到明天的需求。\n\n### 证据：为何 Harness 胜过模型\n\
  \n\n\n\n#### 本章以一个主张开篇：Harness 掌控循环\n\n本章以一个主张开篇：掌控循环的是 harness（注：指智能体运行的编排/基础设施层，下文统称“哈尼斯”或“编排层”），而非模型。到\
  \ 2026 年年中，这不再仅是直觉。哈尼斯是智能体成果中占主导地位的变量这一命题，现在得到了四个未曾协调却意见一致的视角的支持：一次受控基准测试、一次同行评审复现、一位实践者的工作理论，以及第一方企业级实践。这种收敛性，比任何单一数字都更有说服力。如果你从本章只带走一条运营法则，请记住这一条：当智能体表现不佳时，**先改哈尼斯，再换模型**。\n\
  \n#### 差距已被量化，且可复现\n\n最干净的结果来自受控实验。在模型固定为 `gpt-5.2-codex`、仅更换哈尼斯的情况下，LangChain 的\
  \ `deepagents-cli` 在 Terminal Bench 2.0 上从**第 30 名跃升至第 5 名**。^(²⁶⁸) 起作用的是可移植的、而非专有的模式：五种中间件模式，每种都有你已拥有或可自行构建的\
  \ Codex CLI 等效实现。\n\n1.  **`PreCompletionChecklistMiddleware`（预完成清单中间件）** 在智能体宣布“完成”前拦截它，并强制执行四阶段验证（规划、构建、验证、修复）。Codex\
  \ CLI 的等效实现是 `PostToolUse` 钩子配合 `AGENTS.md` 指令，要求在完成前进行测试验证。\n\n2.  **`LocalContextMiddleware`（本地上下文中间件）**\
  \ 在启动时注入环境上下文（目录结构、可用工具、语言检测），而非让智能体通过试错去发现。Codex CLI 的等效实现是 `AGENTS.md` 上下文注入，会在会话开始时自动加载。\n\
  \n3.  **`LoopDetectionMiddleware`（循环检测中间件）** 跟踪每个文件的编辑次数，在对同一文件编辑 N 次后提示智能体重新考虑，打破智能体重复失败策略的“死亡循环”。Codex\
  \ CLI 无内置等效实现；自定义 `PostToolUse` 钩子可填补该空白。\n\n4.  **Reasoning Sandwich（推理三明治）** 在规划和验证阶段分配更高推理算力，在实现阶段分配较低算力。Codex\
  \ CLI 的 `--reasoning-effort` 标志和快捷控制（`Alt+,`/`Alt+.`）支持手动调整，但尚无自动化的阶段级预算内置支持。\n\n\
  5.  **Environment-aware prompting（环境感知提示）** 使用强调可测试性标准和时间预算的系统提示。标准 `AGENTS.md`\
  \ 实践。\n\n单一基准测试可能是偶然；但这并非孤例。首个关于哈尼斯工程的同行评审综述编录了相同的结构，并引用了两个进一步推进结论的结果。^(²⁶⁹) Meta-Harness\
  \ 测得**仅靠哈尼斯变更即带来 6 倍性能差距**，而 CAAF 框架展示了确定性的哈尼斯约束在模型规模之上取胜：约束良好的小模型优于无约束的大模型。该综述还记录了工业界源头，OpenAI\
  \ 创造了该术语，而一个由三到七名工程师组成的团队在五个月内交付了约一百万行生产代码。一个基准测试团队、两个学术框架、一个生产团队，通过不同路径得出了相同结论。\n\
  \n#### 差距为何存在，以及该怎么做\n\n量化的差距需要解释，而 Addy Osmani 2026 年的两篇文章提供了最有用的解释。“工厂模型”文章命名了这一转变：软件经历了三代——自动补全、同步智能体、能独立工作并交付制品供审查的自主智能体，瓶颈也随之转移。“生成不再是瓶颈；验证才是。”^(²⁷⁰)\
  \ 这一句话就是为什么工作量证明而非原始输出，才是哈尼斯必须保证的东西，而 Osmani 的建议（强制红/绿 TDD、规范清晰度作为杠杆、整洁架构作为放大器）则是从实践者视角重述的三大支柱。\n\
  \n其后续文章“Agent Harness Engineering”（智能体哈尼斯工程）编录了哈尼斯实际包含的内容（文件系统与 Git 集成、代码执行、沙箱、记忆与知识集成、上下文管理、强制执行钩子，每个组件本书读者都会熟悉），并论证它们构成一门学科而非一包技巧。^(²⁷¹)\
  \ 其中两个思想是核心支撑。**棘轮原则**认为，每次智能体失败都应转化为永久性的哈尼斯变更，使失败不再复发：`AGENTS.md` 新增一行、新增一个钩子、收紧一条沙箱规则，每一个咔哒声都防止倒退。“优秀\
  \ `AGENTS.md` 中的每一行都应能追溯到一个具体的出错事件。”这是从配置侧看到的工作量证明循环，证据积累成策略。**“技能问题”重构**——Osmani\
  \ 将其归功于 HumanLayer——将本章论点转化为诊断：大多数智能体失败是配置问题，而非能力缺口。证据形态与 LangChain 相同：Claude Opus\
  \ 4.6 仅通过从默认环境迁移到自定义哈尼斯，就在 Terminal Bench 2.0 上获得显著更高分。模型未变；哈尼斯变了。\n\n这也揭示了行业走向。Osmani\
  \ 提出 **Harness-as-a-Service (HaaS，哈尼斯即服务)**：提供执行循环、工具系统和上下文管理作为产品的完整运行时。Claude Agent\
  \ SDK、Codex SDK 和 OpenAI Agents SDK 是早期实例，^(²⁷²) 对企业团队（*第 17 章*）而言，强大的哈尼斯 API 可免除自建编排的需求。代价是比模型锁定更深的锁定，因为哈尼斯编码了你团队的特定失败历史，正是让它有价值的那个棘轮。\n\
  \n#### 同一发现，来自厂商内部\n\n基准测试和框架可能仍是爱好者自说自话。最有力的制衡来自第一方，源自 Arnaud Fournier——OpenAI\
  \ 面向欧洲和中东的现场开发工程负责人。^(²⁷³) 他的标志性观察是：OpenAI 自身工程师已“从编写原始代码转向哈尼斯工程”，该模式正在企业客户中复制，包括\
  \ John Deere、Amgen 和半导体企业。两个数字为此定调。约 20% 的企业客户采用智能体框架而非直接调用 API：在一个十八个月前尚不存在的品类中，这已是早期大众采用。而成效最好的客户，是那些投资哈尼斯基础设施（上下文管理、审批流水线、工具编排）而非仅优化提示的客户。这就是\
  \ Meta-Harness 差距和 LangChain 排名，在生产部署中而非排行榜上再次被观察到。\n\n这四方陈述无共同方法论，亦无动机达成一致，这正是它们的一致性具有分量的原因。一次受控基准测试、一次学术综述、一位实践者的现场笔记、一次厂商的企业级实践，全部落在同一条指令上，这也是要执行的指令：**先完善哈尼斯，再寻求更大模型**。本章前文的一切，都是在讲如何做到这一点。\n\
  \n### 更大的图景\n\n跳出机制细节看，哈尼斯工程实质上是对“当智能体负责敲代码时，专业软件工作变成什么”的一种立场。\n\n#### Karpathy\
  \ 的区分：Vibe Coding 与 Agentic Engineering\n\n2026 年 4 月，Andrej Karpathy 划出一条线，厘清了哈尼斯工程的全部目的。^(²⁷⁴)\
  \ 在红杉资本演讲中，他区分了面对智能体革命的两种反应。*Vibe coding*（氛围编程）抬高地板：人人可通过描述需求并信任模型生成来构建软件。*Agentic\
  \ engineering*（智能体工程）守住质量线：专业团队在不牺牲智能体到来前就存在的安全性、可靠性、可维护性标准下实现提速。\n\n\n\n\n\n####\
  \ 这种区别至关重要，因为它们朝着相反的方向施力\n\n氛围编程（Vibe coding）通过*移除*约束而成功：无测试、无评审、无架构，只有自然语言输入和可工作的软件输出。智能体工程（Agentic\
  \ engineering）通过*添加*约束（即护栏）而成功，使智能体在能让其输出值得信赖的边界内运行。Karpathy 的阐述明确了本章隐含的论点：护栏不是开销。它*就是*工程。\n\
  \n#### Karpathy 的三条观察直接映射到护栏概念\n\n1.  **“智能体是实习生实体。”** 你负责品味、判断和设计。智能体填补空白。这就是前文所述的规格优先、工作量证明模型：人类编写\
  \ `WORKFLOW.md` 并定义验收标准；智能体实现；护栏验证。\n\n2.  **“复制粘贴给智能体的那段文本是什么？那才是现在的编程范式。”** Karpathy\
  \ 称之为软件 3.0：上下文窗口是杠杆，LLM 是解释器。你仓库中的 `AGENTS.md` 和 `WORKFLOW.md` 文件正是那段文本。它们是你用软件\
  \ 3.0 范式表达的程序。\n\n3.  **“模型是参差不齐的。Opus 4.7 能重构 10 万行代码库，却让你走五十米外去洗车。”** 这种参差不齐（Jaggedness）正是你无法将人类移出循环的原因。护栏通过捕捉模型看不见的失败来补偿这种参差不齐：钩子强制执行模型忽略的\
  \ lint 规则，沙箱策略阻止模型不应采取的行动，工作量证明要求迫使模型产出证据而非自我报告成功。\n\nKarpathy 还指出，智能体工程师的上限是“远超\
  \ 10 倍”，但仅限于那些投资于其设置（Setup）的人。*设置就是护栏。* 获得数量级吞吐量提升的从业者，构建了最丰富、最完善的配置：技能、钩子、审批策略、测试套件，以及经过数百次会话打磨的\
  \ `AGENTS.md` 文件。\n\n#### OpenClaw 的警世故事\n\nOpenClaw 的警世故事展示了缺乏这种纪律会发生什么。[²⁷⁵] OpenClaw\
  \ 是一款连接邮件、日历和消息的个人 AI 助手，在八周内获得了 24.7 万 GitHub 星标。但未部署护栏的用户遭遇了级联故障：一个“心跳”功能在无任务情况下每月烧掉\
  \ `$86` 的 token；上下文压缩悄无声息地丢弃了安全规则（一位用户的“执行前务必确认”指令被摘要掉了，智能体开始自主删除邮件）；通过邮件的提示词注入导致\
  \ SSH 密钥外泄；版本升级导致记忆清空。幸存的用户汇聚出了一份读起来像护栏工程入门指南的实战手册：一个小工作流、便宜模型处理常规任务、沙箱隔离、可控的爆炸半径。他们通过痛苦的经验而非刻意设计，重新发现了三大支柱（密封测试、机器可读文档和模块化架构）。\n\
  \nKarpathy 用来形容氛围编程与智能体工程之间差距的短语，是“抬高地板”与“守住天花板”之间的差距。护栏正是守住天花板的关键。\n\n#### 前线部署工程师即护栏实践者\n\
  \n护栏工程不仅是一门软件学科；它越来越成为一门面向客户的学科。前线部署工程师（FDE）角色在 2025 年增长了 800% 到 1000%[²⁷⁶]，正是护栏工程实践的化身。\n\
  \nFDE 直接嵌入企业客户团队，梳理其现有开发工作流，构建符合客户代码库惯例的 `AGENTS.md` 宪章，将 Codex 应用服务器接入 CI 流水线，通过\
  \ `requirements.toml` 锁定沙箱策略，并配置 OpenTelemetry 导出到客户的可观测性栈。FDE 的日常工作（发现、快速原型、生产强化、向核心产品团队反馈）就是将护栏工程应用于特定客户的约束中。对于构建内部护栏的团队，FDE\
  \ 实战手册提供了一个有用的思维模型：将你自己的工程组织视为“客户”，并应用从发现到强化的相同结构化演进过程。[²⁷⁷]\n\n### 总结\n\n1.  **护栏工程是一门学科。**\
  \ 它设计基础设施、约束和反馈循环，使 AI 智能体可靠地高产。它位于提示词工程和传统软件工程之上一层。\n\n2.  **三大支柱支撑着一个适配护栏的代码库。**\
  \ 密封测试、机器可读文档和模块化架构。任一支柱的薄弱都会迫使智能体猜测，而猜测消耗 token 并引入错误。\n\n3.  **`WORKFLOW.md` 为智能体策略提供版本控制。**\
  \ 它将 YAML 前置元数据（运行时配置）与 Liquid 模板化的 Markdown 正文（智能体提示词）结合为单一版本化制品。智能体策略成为你仓库的一等公民，接受与应用代码相同的评审和回滚流程。\n\
  \n4.  **状态持久化幸存于中断。** 会话 ID、检查点文件或数据库支持的状态，让长时间运行的智能体能在不重复已完成工作的情况下恢复。合适的层级取决于任务的时长和成本。\n\
  \n5.  **错误恢复匹配三种失败类型。** 针对瞬时失败采用带退避的重试，针对判断调用采用人工升级，针对必须在重试前撤销的部分应用变更采用回滚。\n\n6.\
  \  **工作量证明让智能体负责。** 智能体必须通过可验证的证据（如 CI 通过状态、代码评审反馈、变更摘要或演示视频）证明完成情况，而非自我报告。这将智能体从黑盒转变为可问责的行动者。\n\
  \n7.  **Symphony 是参考实现。** OpenAI 的开源护栏在规模上展示了这些模式。其 `WORKFLOW.md` 格式、工作量证明强制执行以及\
  \ Elixir/BEAM 架构值得研究，即使你不直接采用该工具。\n\n8.  **NanoClaw 展示了持久化编排。** 常驻调度、容器隔离和基于通道的通信，补充了\
  \ Symphony 面向批处理、由 Issue 驱动的方法。生产部署可能针对不同类别的工作同时使用这两种模式。\n\n9.  **生态系统提供护栏组件。**\
  \ Docker MCP Toolkit 将 MCP 服务器打包为单一网关后的容器镜像，配置文件可作为 OCI 制品共享；内置的代码评审技能无需自定义工具即可提供第一方评审；Codex\
  \ 应用服务器的 JSON-RPC 协议通过 stdio 或 WebSocket 驱动仪表板、编排器和审批网关。每一个都是你可以采纳而非自建的组件。\n\n10.\
  \ **学科正在收敛，技能经久耐用。** 独立信号指向同一方向：Cursor 2026 年 4 月的说明描述了“从以模型为中心的吹嘘转向以护栏为中心的工程”，[²⁷⁸]\
  \ Altman 则将护栏与模型定位为日益不可分割，模型周围的运行时现已成为产品接口的一部分。[²⁷⁹] 护栏工程是技术栈的永久层级，而非模型局限性的临时变通，因此护栏技能是耐用的投资，而非下一代模型就会淘汰的脚手架。\n\
  \n### 练习\n\n1.  **为智能体使用强化你的测试套件。** 依据密封性标准审计你项目的测试套件：每个测试能否离线运行、通过单一命令执行、并产生确定性输出？对于每个未通过审计的测试，识别其外部依赖，实现模拟或种子数据，并验证该测试在无网络访问的情况下连续十次本地运行均稳定通过。\n\
  \n\n\n\n\n#### 2. 为真实任务编写 `WORKFLOW.md`\n\n选择项目中一个重复性任务，例如修复特定类别的 Bug、实现标准功能类型或更新依赖。编写一个带有\
  \ YAML 前置内容的 `WORKFLOW.md`，其中记录模型、轮次限制和所需的工作量证明工件，以及一个用于参数化任务特定上下文的 Liquid 模板主体。通过\
  \ Codex CLI `exec` 会话运行渲染后的提示词，并评估 Agent 的行为是否符合你预期的策略。\n\n#### 3. 实现基于检查点的恢复\n\n\
  从现有工作中获取一个多阶段 Codex CLI 流水线，或设计一个包含至少三个不同阶段的新流水线。在工具框架中实现检查点文件的写入/读取逻辑：在每个阶段开始前，读取检查点以确定其是否已完成；在每个阶段结束后，写入包含累积状态的检查点。故意在运行中途中断流水线，并验证其是否从正确的阶段恢复，而不是从头开始。\n\
  \n#### 4. 为团队定义工作量证明标准\n\n以 Symphony 工作量证明模型为灵感，定义 Agent 在任务被视为完成前必须产出的工件，以适应你团队的工作流。至少需涵盖：\n\
  \n1.  需要何种功能验证（测试通过率、CI 状态）\n2.  需要何种可审查工件（差异摘要、演示说明）\n3.  需要何种文档工件（更新后的 `AGENTS.md`、`CHANGELOG`\
  \ 条目或决策日志条目）\n\n将此标准写入项目的 `AGENTS.md`，并将其应用于接下来的三个由 Agent 生成的 PR 中。\n\n#### 5. 基准测试你的工具框架可靠性\n\
  \n通过当前的 Codex CLI 工作流运行一组具有代表性的 5 到 10 个任务，并记录成功率（无需人工干预即可完成并通过所有门控的任务比例）。然后实施本章中的一项具体工具框架改进，例如更好的隔离测试、`WORKFLOW.md`\
  \ 策略或基于检查点的恢复，并重新运行相同的任务。计算成功率的提升，并推算一个月典型使用量下的价值。这将为你提供一个具体的 ROI 数据，可与工程管理层分享。\n\
  \n# 28\n\n# Agentic Engineering Pod（智能体工程小组）\n\n*第 27 章* 表明，决定 Agent 是否能产出可靠工作的是工具框架，而非模型。本章提出了该问题的组织层面版本：谁拥有工具框架，以及如何围绕它组建团队？当\
  \ Agent 负责大部分执行工作时，人类掌握着 Agent 无法自行回答的三个问题：\n\n*   *我们为什么要构建这个？*（成果、战略、上下文）\n* \
  \  *应该如何构建？*（编排、判断、实现标准）\n*   *我们能信任构建出的东西吗？*（验证、安全、质量否决权）\n\nAgentic Engineering\
  \ Pod 围绕这三个问题组织三个人，每个人都由 Agent 增强，共享单一的上下文层。\n\n### 学习目标\n\n你将能够：\n\n1.  为三个 Pod\
  \ 角色中的每一个的 Agent 调用编写生产就绪的 TOML 配置\n2.  设计 Pod 的 `AGENTS.md` 层级结构，包括仓库级、子目录级和角色特定文件\n\
  3.  演示一个特性完整的 Pod 生命周期：框架设定、编排、自动化验证\n4.  编写 Quality Engineer（质量工程师）用于强制执行信任平台的钩子和门控\n\
  5.  诊断陷入困境的 Pod 属于哪种失效模式，并应用相应的修复方案\n6.  将 Pod 基础设施打包为插件，并利用市场策略在多个 Pod 间强制执行一致的配置\n\
  \n> **起点，而非蓝图。** 本章中的 Agentic Engineering Pod 是团队围绕 Codex CLI 等 Agent 进行组织的一个成熟范例，而非最终或教条式的答案。围绕编码\
  \ Agent 构建团队是新领域，此处的约定将随着领域成熟而不断完善。请将 Pod 视为思考你自身结构的框架：采纳适用的部分，根据你的上下文调整角色和边界，并预期具体细节的演进速度将快于本书大部分内容。\n\
  \n### 为什么是三个角色？\n\n#### 约束已从生成转移到验证\n\n从变化之处入手。在软件历史的大部分时间里，稀缺资源是生成：编写代码、连接集成、编写测试。Agent\
  \ 使生成变得廉价且快速，这将约束移到了别处。如今，交付的瓶颈在于**验证**，即团队证明生成输出正确、安全、可维护并准备好进入下一阶段的速率。\n\n这重新定义了何为进步。无人验证的生成输出不是价值；它是**库存**，看似进步实则尚不可交付的工作。快速的\
  \ Agent 生成库存的速度可能超过缓慢团队审查的速度，未经审查的量不是加速，而是累积的风险。进步是**经验证的价值**：符合意图、通过测试、尊重项目约束、安全、可运维且可解释的输出。\n\
  \n这就是为什么 Pod 围绕三个人的问题而组织，而非围绕 Agent 现已吸收的实现工作，也是为什么负责验证的角色——Quality Engineer——在该模型中比传统团队中的\
  \ “QA” 承担更大的权重。\n\n#### 传统团队结构的问题\n\n传统团队结构在每个专业化边界上都产生协调开销：需求到工程，工程到 QA，QA 到 DevOps。当\
  \ Agent 执行工作时，这些交接变得更加昂贵，因为每个边界都引入了 Agent 不需要的延迟和它们无法在无人工干预下恢复的上下文丢失。\n\n更深层的问题是**所有权分散**。没有单一人拥有从业务成果到生产验证的完整链条。当\
  \ Agent 生成代码时，所有权分散意味着无人对系统是否正确、安全地做着正确的事拥有完整图景。\n\n#### 三人法则\n\nAgentic Engineering\
  \ Pod 通过激进的简化解决了这个问题：三项责任，一层共享上下文。\n\n之所以有三项责任，是因为每一项都是生产者的工作，且无一是协调工作。Pod 是责任分离，而非层级。Agent\
  \ 处理常规工作（样板代码、脚手架、测试生成、CI 运行），从而让人类专注于高判断力工作。第四项责任要么是其中之一的重复，要么就是协调本身，这是 Pod 不应具备的复杂性症状。\n\
  \n架构原则：**人指挥 Agent；而非管理其他人。** 协调流向人→Agent，而非人→人。当交付需求增加时，启动共享平台层的并行 Pod，而非扩大现有 Pod。扩展平台，而非\
  \ Pod。\n\n该法则关乎责任，而非人数。Pod 保证所有三项责任都有明确、无重叠的归属；它不坚持必须恰好有三个具名个体。在小型项目中，一人可兼任多项责任，且单个传统职位名称通常跨越两三项\
  \ Pod 职责。绝不能发生的是责任无人负责。从传统角色到 Pod 职责的映射很直观：\n\n| 传统角色 | Pod 职责 |\n| --- | --- |\n\
  | 产品经理、产品负责人、业务分析师、工程经理、领域专家 | Context Architect（上下文架构师） |\n| 工程师、架构师、设计师 | Value\
  \ Engineer（价值工程师） |\n| QA、SDET、DevOps、SRE、平台、安全、MLOps、治理与合规 | Quality Engineer（质量工程师）\
  \ |\n\n#### 关键结构洞见\n\nPod 的三个角色直接映射到 Agentic 交付模型中留给人类的三个问题：\n\n\n\n\n\n| **角色**\
  \ | **类型** | **负责范围** | **回答问题** |\n| :--- | :--- | :--- | :--- |\n| **上下文架构师**\
  \ | 人类 | “为什么”和“是什么” | 我们追求什么成果？智能体需要什么上下文？有哪些护栏？ |\n| **价值工程师** | 人类 | “怎么做” |\
  \ 我们如何编排交付？好的实现是什么样的？ |\n| **质量工程师** | 人类 | “信任” | 我们能否证明所构建的是正确、安全、可靠的？谁对证据负责？\
  \ |\n\n所有三个 Pod 角色均为人类。智能体（`Codex` 会话、技能、钩子、权限、自动化门禁）是每位人类所驾驭的工具。Pod 中不存在“智能体角色”。智能体拥有能力；人类承担角色。\n\
  \n这些边界反映了人类导致智能体系统失败的三种方式：上下文不佳（上下文架构师失职）、编排不善或错过架构偏移（价值工程师失职），或在缺乏充分验证的情况下发布（质量工程师失职）。Pod\
  \ 使每种失败模式都可见且可追责。\n\n![图 28.1 - Pod：三个角色与流向](img/B40007_28_01.jpg)\n\n**图 28.1 -\
  \ Pod：三个角色与流向**\n\n智能体工程 Pod 的示意图，展示了三个角色形成一个循环。上下文架构师负责“为什么”和“是什么”（成果、上下文、护栏），并将上下文和护栏传递给价值工程师，后者负责“怎么做”（编排、实现标准），并将实现传递给质量工程师进行验证，后者负责“信任”（验证、证据问责），并返回关于正确性和风险的反馈。一个单独的“智能体”框（`Codex`\
  \ 会话、钩子、自动化门禁）通过虚线连接到所有三个角色，作为每位人类驾驭的工具。\n\n#### 角色及其智能体孪生\n\n每个角色都与一个同名的智能体配置配对：本章后面介绍的\
  \ TOML 文件（`context-architect.toml`、`value-engineer.toml`、`quality-engineer.toml`）。共享名称是有意为之。TOML\
  \ 文件是该角色的*智能体孪生*，一个针对该角色工作调优的智能体，拥有该角色任务所需的模型层级、审批姿态和沙箱。\n\n不过，孪生并非固定工具。每个角色的深层工作是随时间将自身复制到孪生中，将角色持有者的判断编码到配置、`AGENTS.md`\
  \ 上下文以及孪生所依赖的技能中，使智能体能更多时间地按人类方式行事。每一次会话重定向、每一次简报优化、每一个新增门禁，都是人类在教导孪生按其方式行事。杠杆效应复利增长：孪生捕获了原本只存在于某人脑海中的隐性知识，教导得越好，人类就越少需要手动干预。这就是自主阶梯背后的机制：当孪生赢得了足够的证据被信任处理某类变更时，该类变更就会跃升一个层级。\n\
  \n这也是为什么孪生是人类驾驭的能力，而非第二个角色持有者。判断、问责和角色本身始终属于人类；随时间改变的是孪生吸收了多少人类的技艺。名为 `context-architect`\
  \ 的智能体*不是*上下文架构师；它是上下文架构师不断进化的工具，保持其锐利是该角色的一部分。\n\n#### 质量决定节奏\n\n在深入角色本身之前，有一条运营原则必须确立，因为它塑造了所有三个角色。人们很容易把验证想成流水线末端的一个关卡：智能体生产，合并主分支前验证先行。这幅图景是不完整的。一旦生成变得廉价，决定\
  \ Pod 交付速度的不是生产速度，而是验证速度。验证吞吐量，而非生成吞吐量，才是进度的真实度量。\n\n由此引出两个后果。首先，已生成但未验证的工作应控制在有界队列中，而非允许堆积；不断增长的未审查输出积压的是风险，而非已存进度。其次，价值工程师只有在质量工程师的验证能力能消化时，才应释放更多智能体工作。验证不是最后拧上的终点关卡；它决定交付节奏。\n\
  \n这重构了团队花费智能体红利的方式。廉价生成产生红利，Pod 可两用：用于更多平庸输出，或用于更强规格、更好测试和更深验证。对于企业级软件，将部分红利再投资于质量通常回报更高，因为它提升了如今制约整个系统的验证上限。\n\
  \n#### 哪些章节奠基各角色\n\nPod 综合了全书内容：每个角色的技艺源自分布在前几部分的多个章节，而非单一部分，接下来三节将逐一展开。各角色最相关的章节：\n\
  \n*   **上下文架构师。** 第 4 章 (`AGENTS.md`) 是核心参考，因为 `AGENTS.md` 层级是该角色的主要产出物。第 3 章 (提示工程)\
  \ 支撑规范编写和答疑会范围界定模式；第 5 章 (审批模式与信任边界) 和 第 17 章 (企业级部署) 为战略护栏、策略和自主阶梯提供依据；第 10 章 (技能)\
  \ 是角色技艺变为可分发基础设施的途径。\n\n*   **价值工程师。** 第 11 章 (子智能体) 和 第 12 章 (多智能体编排) 是该角色所负责的智能体循环工程的核心。第\
  \ 14 章 (成本管理) 驱动速度、Token 成本与置信度之间的权衡；第 3 章 (提示工程) 是简报工程的基础；第 13 章 (工作树) 为特性会话提供隔离；第\
  \ 20 章 (AI 代码审查) 配合 第 10 章 (技能) 支持成比例审查和可复用审查技能。\n\n*   **质量工程师。** 第 9 章 (钩子) 是主要强制机制，第\
  \ 5 章 (审批模式与信任边界) 设定沙箱和审批姿态。第 15 章 (CI/CD)、第 16 章 (安全加固) 和 第 19 章 (测试与评估) 构成信任平台的运营骨干，第\
  \ 20 章 (AI 代码审查) 为验证门禁提供输入。\n\n这也是角色到部分映射仅为近似的原因：价值工程师最贴近第 3 部分 (规模化)，质量工程师最贴近第\
  \ 2 部分 (护栏) 的强制原语，而上下文架构师具体对应 第 4 章 而非第 1 部分整体。\n\n### 上下文架构师：人类角色\n\n#### 上下文架构师负责什么\n\
  \n上下文架构师负责成果与环境：Pod 是否兑现承诺、智能体是否基于准确上下文工作、战略方向是否与业务意图保持一致。其杠杆来自创建可复用的上下文、技能和护栏，而非驱动单个特性会话。\n\
  \n上下文架构师的四大责任领域：\n\n**工厂管治。** Pod 可复用生产系统的管治者：上下文、技能与护栏。制定高信号简报标准，塑造审查循环。反复出现的摩擦反哺上下文层优化。\n\
  \n\n\n\n\n#### 结果定义与价值实现\n\n业务赞助商的主要接口。将模糊的业务反馈转化为可执行的上下文，掌控产品叙事，并以成本价值为依据界定交付权衡，包括“代理经济学”。\n\
  \n#### 上下文工程\n\n策划模式、文档和决策记录，赋予代理做出正确底层决策所需的“直觉”。无情地管理信噪比：相互矛盾或过时的上下文会产生相互矛盾或陈旧的输出。\n\
  \n#### 战略护栏与策略\n\n定义法律、伦理和安全护栏。将合规要求转化为结构化策略，并定义升级阈值（哪些可自动运行，哪些需要人工批准）。\n\n####\
  \ 自主阶梯\n\n```\nLevel 1: Assist 代理建议；人工审查并应用每项变更\nLevel 2: Approval-required 代理执行；每项操作执行前需人工批准\n\
  Level 3: Policy-bounded 代理在定义边界内执行；例外情况升级处理\nLevel 4: Self-remediating 代理在护栏内检测、诊断并修复\n\
  ```\n\n阶梯晋升需要证据（测试覆盖率、审查历史、审计日志），而非自信。层级按变更类别分配，而非按模块：支付处理模块的架构变更可能永久保持 Level 2，而读路径优化则可能为\
  \ Level 3。\n\n#### `AGENTS.md` 作为上下文架构师的核心产出物\n\n`AGENTS.md` 并非众多配置文件中的一个：它是上下文架构师的**核心交付物**。^[²⁸⁰]\
  \ 价值工程师运行的每次 Codex 会话、质量工程师触发的每个自动化检查，都从该层级读取上下文。Pod 的输出质量受限于该文档的质量。\n\n生产环境 Pod\
  \ 的层级结构：\n\n```\n~/.codex/AGENTS.md # 个人偏好，永不提交\nAGENTS.md # 仓库级：Pod 的事实来源\nsrc/payments/AGENTS.md\
  \ # 限界上下文的领域约束\nsrc/auth/AGENTS.md # 认证模块更严格的安全约束\n.codex/roles/value-engineer.md\
  \ # 角色专用指令\n.codex/roles/quality-engineer.md # 角色专用 QE 指令\n```\n\n仓库级 `AGENTS.md`\
  \ 包含产品描述、验收标准、架构约束、批准的依赖列表和完成的定义。每个代理首先读取它。子目录 `AGENTS.md` 文件编码跨冲刺持久的领域特定约束。更具体的文件覆盖更通用的文件，因此在\
  \ `src/auth/` 中工作的代理会自动继承更严格的约束，无需显式指令。\n\n一份编写良好的仓库级 `AGENTS.md` 如下所示：\n\n```\n\
  ##### 产品上下文\n该服务是用户订阅状态的权威来源。\n代理不得引入任何从多个事实来源派生订阅状态的路径。\n##### 验收标准\n每项功能必须包含：\n\
  1. 面向用户的结果陈述（“处于[状态]的用户可以[操作]...”）\n2. 至少一个包含预期行为的失败场景\n3. 任何面向用户路径的性能界限 (<200ms\
  \ p95)\n##### 架构约束\n- 所有外部数据在边界处使用 zod 验证\n- 禁止跨模块数据库查询；每个模块拥有其架构\n- 所有状态变更在返回前必须发出审计事件\n\
  ##### 批准的依赖\n见 .codex/approved-deps.json。添加未列出的依赖要求\n在代理继续之前获得 ADR 批准。\n##### 自主级别\n\
  - 读路径变更：Policy-bounded (Level 3)\n- 写路径变更：Approval-required (Level 2)\n- 架构变更：Approval-required\
  \ (Level 2)\n- 基础设施变更：Assist (Level 1)\n```\n\n#### 规范作为强制函数\n\n一种有用的模式是“办公时间”技能：一种结构化的产品对话，在编写任何代码之前触发，要求明确回答四个问题：我们在解决什么问题，可观测层面的成功标准是什么，什么不在范围内，哪些约束是不可商量的。以这种方式设计的\
  \ Codex 技能，直到范围和成功标准被确认之前，不会让会话继续进行。某功能的 `AGENTS.md` 条目，在答案写下来之前不应存在。\n\n#### 将上下文架构师的技艺作为插件分发\n\
  \n上下文架构师的规范技能、办公时间范围界定对话、`AGENTS.md` 健康检查和 ADR 编写模板，代表了不应只存在于某个人脑海中的组织知识。插件系统原生支持将技能（连同钩子、MCP\
  \ 服务器和应用连接器）打包为单个可安装单元；编写本文时，文档化的插件规范并未将自定义代理角色 TOML 或 `AGENTS.md` 模板列为一等插件组件，因此这些作为捆绑文件随行，而非自动注入。当最资深的上下文架构师改进技能或增加上下文漂移检查时，每个\
  \ Pod 都通过版本升级接收更新。技艺由此成为可分发的基础设施，而非部落知识。这是一个贯穿所有三个角色的模式的首次显现，后文将在“通过插件分发 Pod”下统一论述。\n\
  \n#### 上下文架构师 TOML 配置\n\n上下文架构师的 Codex 调用属于规范与架构工作：产出 ADR、更新 `AGENTS.md`、验证验收标准、评估上下文漂移。这些会话使用高推理模型，且不在全自动模式下运行；上下文架构师制定策略，而非实现。\n\
  \n上下文架构师的代理孪生体：\n\n```\n##### .codex/agents/context-architect.toml\nname = \"context-architect\"\
  \ndescription = \"规范制定、ADR 编写、AGENTS.md 维护、上下文质量审查。\"\ndeveloper_instructions =\
  \ \"\"\"\n你正在协助上下文架构师进行高判断力的上下文和规范工作。\n你处理的任务：\n- 在层级的任何级别起草或更新 AGENTS.md 文件\n-\
  \ 编写或审查 ADR（架构决策记录）\n- 将验收标准转化为可验证的具体形式\n- 评估现有上下文文档是否最新准确\n- 识别上下文层中的缺口或矛盾\n规则：\n\
  - 请勿编写功能实现代码\n- 请勿修改 .codex/ 或 docs/ 之外的源文件\n- 如果产出 ADR，请遵循 .codex/adr-template.md\
  \ 中的格式\n- 标记任何需要人工决策后代理才能继续的上下文缺口\n- 当文档集准备好供 Pod 使用时，输出 CONTEXT_COMPLETE\n\"\"\"\
  \nmodel = \"gpt-5.4\"\nmodel_reasoning_effort = \"xhigh\"\napproval_policy = \"\
  untrusted\"\nsandbox_mode = \"workspace-write\"\n```\n\n`approval_policy = \"untrusted\"\
  ` 是有意为之。上下文架构师会在提交前审查并批准对上下文层的每一项提议变更。上下文错误会传播到每一个下游代理会话；它们值得在创作环节接受严格的人工审查。\n\n\
  ### 价值工程师：人类角色\n\n#### 价值工程师负责的内容\n\n价值工程师编排端到端交付。该角色要求扎实的软件工程基础，而非只是恰巧使用 AI 工具的项目经理。他们提供技术深度以验证代理输出、识别架构漂移、捕捉正确性故障、并维护代理无法单方面强制执行的实现标准。\n\
  \n价值工程师的四大责任领域：\n\n##### 系统编排与技术发现\n\n技术主题专家的主要联系人。负责深度发现，将复杂业务规则转化为可执行的系统行为。\n\n\
  ##### 简报工程\n\n产出高信号简报：包含意图、约束、示例和边缘情况的结构化提示词，足以让代理在无歧义的情况下执行。简报质量是该角色的核心技艺。\n\n\n\
  \n\n##### 代理循环工程\n\n设计收敛标准、并行度和停止条件。在速度、Token 成本和置信度之间做出深思熟虑的权衡。明确何时让代理运行至完成，何时进行重定向，以及何时使用更好的上下文重新启动。\n\
  \n##### 专家判断与实施标准\n\n对所有逻辑提供最终验证：发现代理可能遗漏的架构偏移、用户体验缺陷或正确性故障。\n\n#### 实战简报工程\n\n\
  低信号简报（`为订阅服务添加续订端点`）与高信号简报的区别在于具体性，而非长度：\n\n##### 任务：订阅续订端点\n\n**意图：** 状态为 `subscription.status\
  \ = \"expired\"` 的用户可通过 `POST /subscriptions/renew` 续订其订阅，无需重新输入支付详情。\n\n**约束条件：**\n\
  \n*   复用存储在 `user.paymentMethodId` 中的支付方式\n*   续订必须是幂等的：调用该端点两次不得产生两笔费用\n*   返回\
  \ 200 之前必须发出 `subscription.renewed` 事件\n\n**验收标准：**\n\n*   状态为 `status=expired`\
  \ 的用户在成功调用后变为 `status=active`\n*   状态为 `status=active` 的用户收到 409 响应，响应体为 `{\"error\"\
  : \"already_active\"}`\n*   Stripe 失败返回 502 并记录错误；订阅状态保持不变\n*   在标称负载下，响应时间 p95\
  \ < 200ms\n\n**范围外：** 不要修改支付方式存储逻辑。不要添加新的订阅层级。\n\n**参考：** 参见 `src/subscriptions/AGENTS.md`\
  \ 了解幂等性要求，参见 `src/events/types.ts` 了解事件架构。\n\n显式的失败场景、清晰的幂等性要求、范围外边界，以及对领域特定 `AGENTS.md`\
  \ 的引用。每一项都消除了代理原本需要通过推断来解决的决策点。\n\n#### 价值工程师 Codex 会话模式\n\n典型的功能会话：阅读任务规范和相关的 `AGENTS.md`\
  \ 上下文；运行 `/plan` 验证方法；在工作区的 `workspace-write` 沙箱^(281) 中执行；根据验收标准审查输出；在输出偏离时进行重定向；实现整洁后移交给质量工程师的质量门禁。每个功能都位于各自的工作树中；主分支仅接收经过审查、通过质量门禁的输出。\n\
  \n#### 决定何时并行化：指标自由度\n\n指标自由度（第 11 章）为价值工程师提供了一种原则性的方法，用于决定何时生成并行子代理，何时在单个会话中保持任务。它是一个单一数值，`F\
  \ = 1 − ρ(D_out, D_score)`，用于衡量任务是否从多样化输出中受益（高 F）或要求单一正确答案（低 F）。在将功能分解为代理任务时应用它：\n\
  \n*   **高 F 子任务**（代码审查、文档编写、测试生成）分配给并行子代理，在这些任务中多样性是资产；扇出至多代理角色，让多个代理探索不同方法。\n*\
  \   **低 F 子任务**（Bug 修复、迁移、架构变更）分配给单个具有高推理力的代理，在这些任务中精确度比多样性更重要；将任务特定知识编码进聚焦的提示词，而非支付并行化的协调开销。\n\
  \n质量工程师使用同一数值来校准验证：高 F 输出需要对方法选择进行人工审查（代理是否从众多有效方法中选出了好的一种？），而低 F 输出需要自动化正确性检查（代理是否产出了唯一的正确答案？）。\n\
  \n#### 成比例的审查深度\n\n审查深度应随差异规模缩放。小型自包含差异（约 50 行以内，单一逻辑单元）：是否实现了声称的功能，是否存在明显的正确性问题，是否引入了被排除的依赖？大型差异（涉及多模块、核心逻辑重写）值得进行四遍审查：意图对齐、正确性（竞态条件、边缘情况、失败路径）、副作用、完整性（测试到位、验收标准可演示）。价值工程师可将其编码为一项审查技能，根据\
  \ `git diff --stat` 输出路由至快速通道或全量通道。\n\n#### 价值工程师 TOML 配置\n\n价值工程师的代理孪生体：\n\n```toml\n\
  ##### .codex/agents/value-engineer.toml\nname = \"value-engineer\"\ndescription\
  \ = \"功能实现、编排与代理监督会话。\"\ndeveloper_instructions = \"\"\"\n你正在为价值工程师执行一项功能实现任务。\n\
  开始前：\n1. 阅读 AGENTS.md 以及与此任务相关的任何子目录 AGENTS.md\n2. 阅读任务简报并确认你理解验收标准\n3. 如果任何约束存在歧义，在编写代码前将其暴露出来\n\
  实施期间：\n- 在每个逻辑变更组后运行测试\n- 如果测试失败，在继续前修复失败；绝不跳过\n- 如果遇到简报未涵盖的架构决策，\n  将其写入 .codex/clarifications.md\
  \ 并暂停等待审查\n- 跟踪简报中的验收标准：在发出完成信号前，每一项必须可演示地得到满足\n完成信号：IMPLEMENTATION_COMPLETE，附带以下摘要：\n\
  - 每项验收标准及其是否满足\n- 超出简报范围处理的任何边缘情况\n- 任何延期待质量工程师审查的事项\n\"\"\"\nmodel = \"gpt-5.4-mini\"\
  \nmodel_reasoning_effort = \"high\"\napproval_policy = \"on-request\"\nsandbox_mode\
  \ = \"workspace-write\"\n```\n\n`approval_policy = \"on-request\"` 适用于价值工程师的工作树会话：代理在限定工作树内执行，验收标准明确，且质量工程师的质量门禁会在任何输出到达主分支前触发。模型决定何时升级至价值工程师以获批准，让常规文件编辑顺畅进行，同时浮现任何看起来异常的情况。\n\
  \n### 质量工程师：人类角色\n\n#### 质量工程师负责的事项\n\n质量工程师负责信任平台：CI/CD 流水线、自动化质量门禁、安全控制和验证基础设施。他们掌握质量否决权：无论由谁或何物产生变更，均有权阻止。无论是价值工程师还是上下文架构师都无法覆盖这些门禁。这种权威是结构性的，而非政治性的。\n\
  \n否决权之所以存在，是因为问责制无法委托给代理。编码代理无法为其交付的产物担责；发布产品的组织才对其负责。因此，企业级交付运行在证据之上，而非信心之上：质量工程师的工作是让团队能够展示要求是什么、代理做了什么、测试了什么、谁审查了它，以及为什么结果可以安全发布。当证据不足时，否决权就是阻止工作的机制，无论生产者是谁或何物。\n\
  \n质量工程师的四大职责领域：\n\n##### 验证与质量工程\n\n设计并构建验证功能正确性、性能和可靠性的自动化系统。推动安全工具契约模式：类型化的输入/输出、幂等性、最小权限、允许列表。\n\
  \n##### 对抗性测试\n\n主动对代理工作流进行红队演练，针对提示词注入、不安全工具使用和数据泄露。这是一项持续的工程实践，而非定期审计。\n\n#####\
  \ 运营骨干\n\n维护 CI/CD 流水线、安全上下文存储、代理隔离、依赖扫描和供应链完整性。\n\n##### 自主性强制执行\n\n实现使上下文架构师的自主性阶梯从愿景变为现实的钩子、质量门禁和流水线检查。\n\
  \n#### 确定性工具接口设计\n\n质量工程师设计构造上安全的代理工具接口。有三项属性是不可妥协的：\n\n##### 类型化的输入与输出\n\n团队代理使用的每个工具都应具有显式的输入模式和输出契约。非类型化接口使验证变得不可能，并导致副作用不可预测。\n\
  \n\n\n\n\n#### 质量工程师原则与实施\n\n##### 幂等性\n工具必须支持使用相同输入多次安全调用。智能体会重试；非幂等工具会导致重复扣费、重复记录和状态不一致。\n\
  \n##### 最小权限\n每个智能体角色应仅访问其所需的工具。实施智能体不需要生产数据库凭据。审查智能体不需要源文件的写入权限。质量工程师设计权限结构并根据实际智能体行为进行验证。\n\
  \n#### 质量工程师编写的钩子\n\n钩子[²⁸²]是质量工程师的主要强制执行机制。有三个钩子点最为关键：\n\n##### 预提示钩子（UserPromptSubmit）\n\
  在任何提示进入智能体上下文之前触发。用于策略强制执行：扫描提示注入模式、验证正确的工作树、检查 `AGENTS.md` 上下文是否为最新。\n\n##### 每次写入钩子（PostToolUse）\n\
  在每次工具调用完成后触发。正如第 9 章所述，`PostToolUse` 观察的是事后结果而非把关动作：工具已经运行完毕，因此钩子将发现结果呈现到上下文中并以退出码\
  \ `0` 退出，而不是阻塞。这是在同一会话中让智能体能够采取行动的快速、文件级反馈的正确切入点。\n\n##### 会话后钩子（Stop）\n在 Codex\
  \ 会话结束时触发。用于验证：运行测试套件、检查是否有超出允许范围的文件被修改、验证审计事件是否已发出、确认预期的完成信号。\n\n```bash\n######\
  \ .codex/hooks/post-session-verify.sh\n###### 质量工程师的会话后验证钩子\nset -euo pipefail\n\
  TASK_ID=\"${CODEX_TASK_ID:-unknown}\"\nWORKTREE=\"${CODEX_WORKTREE:-$(pwd)}\"\n\
  echo \"[QE Hook] Post-session verification for task: $TASK_ID\"\n###### 1. 运行完整测试套件\n\
  echo \"[QE Hook] Running test suite...\"\nnpm test --silent 2>&1 | tee \".codex/tasks/$TASK_ID/test-results.log\"\
  \n###### 2. 验证未修改许可范围外的文件\necho \"[QE Hook] Checking file scope...\"\nMODIFIED=$(git\
  \ diff --name-only HEAD)\nVIOLATIONS=$(echo \"$MODIFIED\" | grep -E \"^(infrastructure/|AGENTS\\\
  .md)\" || true)\nif [ -n \"$VIOLATIONS\" ]; then\n  echo \"[QE Hook] SCOPE VIOLATION:\
  \ agent modified restricted files:\"\n  echo \"$VIOLATIONS\"\n  exit 1\nfi\n######\
  \ 3. 检查会话日志中的完成信号\nif ! grep -q \"IMPLEMENTATION_COMPLETE\" \".codex/tasks/$TASK_ID/session.log\"\
  \ 2>/dev/null; then\n  echo \"[QE Hook] WARNING: No IMPLEMENTATION_COMPLETE signal\
  \ found in session log\"\nfi\necho \"[QE Hook] Verification complete. Gate: PASSED\"\
  \n```\n\n一个更轻量的示例展示了 `PostToolUse` 模式的独立应用：智能体写入 Markdown 的那一刻就进行 lint 检查，这样风格和结构问题会在智能体仍在循环中时浮现。`PostToolUse`\
  \ 匹配器按工具而非文件类型选择，因此钩子会过滤 Markdown 本身，而不是依赖匹配器：\n\n```bash\n###### .codex/hooks/lint-markdown.sh\n\
  ###### 质量工程师的每次写入 Markdown lint（PostToolUse）\nset -euo pipefail\n###### PostToolUse\
  \ 通过 stdin 传递 JSON 对象；工具名在 `.tool_name` 中。\nTOOL=\"$(jq -r '.tool_name // empty')\"\
  \n###### 仅在文件写入工具后执行（空工具名允许手动运行）\ncase \"$TOOL\" in\n  write_file|str_replace_editor|apply_patch|\"\
  \") ;;\n  *) exit 0 ;;\nesac\n###### 仅 lint 智能体刚刚更改的 Markdown 文件\nCHANGED=$(git\
  \ diff --name-only HEAD -- '*.md')\n[ -z \"$CHANGED\" ] && exit 0\nif ! command\
  \ -v markdownlint >/dev/null 2>&1; then\n  echo \"[QE Hook] markdownlint not installed;\
  \ skipping.\"\n  exit 0\nfi\necho \"### markdownlint results\"\necho \"$CHANGED\"\
  \ | xargs markdownlint 2>&1 || true\n###### 观察，不阻塞：将发现结果呈现到上下文并干净退出。\nexit 0\n```\n\
  \n在 `.codex/hooks.json` 中通过 `PostToolUse` 进行连接：\n\n```json\n{\n  \"hooks\": {\n\
  \    \"PostToolUse\": [\n      {\n        \"hooks\": [\n          {\n          \
  \  \"type\": \"command\",\n            \"command\": \"bash .codex/hooks/lint-markdown.sh\"\
  ,\n            \"statusMessage\": \"Linting changed Markdown...\",\n           \
  \ \"timeout\": 20\n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n该钩子永远不会导致智能体动作失败；它将\
  \ lint 输出作为上下文反馈回来，以便智能体自我纠正。当必须强制执行 Markdown 标准而不仅仅是呈现时，该检查应放在会话后关卡，那里非零退出码可以停止工作。\n\
  \n#### 插件强制钩子：使绕过在结构上不可能\n\n当钩子作为松散脚本存在于 `.codex/hooks/` 中时，任何开发者都可以删除或修改它们。插件系统改变了这一点。通过\
  \ `marketplace.json` 中的 `INSTALLED_BY_DEFAULT` 策略分发的插件钩子会在会话启动时安装，且无法被单个开发者移除。[²⁸³]\
  \ 质量工程师维护插件；平台团队通过市场策略强制安装。绕过变得不可能，而不仅仅是不建议。同一机制适用于 `PostToolUse` 钩子：文件范围强制执行、静态分析关卡和审计事件检查会在企业中每个\
  \ pod 的每次工具调用时触发。如何跨许多 pod 一致地推广这一点是本章最后一节“使用插件分发 Pod”的主题。\n\n#### 验证经济学：分层成本关卡\n\
  \n验证是有成本的：时间、Token 开销和周期延迟。对每个两行的错误修复都进行全面的对抗性安全审查，这不是严谨的表现；而是流程校准错误的表现。质量工程师的工作不是最大化验证深度，而是将验证工作量与变更风险相匹配。\n\
  \n三层模型效果良好。\n\n##### 第 1 层：静态验证\nLint 检查、类型检查、模式验证。近乎零成本；无一例外地在每次变更时运行。\n\n#####\
  \ 第 2 层：功能验证\n完整测试套件、范围合规检查、验收标准确认。成本较高但属于常规操作；在每次涉及逻辑的变更时运行。\n\n##### 第 3 层：对抗性验证\n\
  安全建模（OWASP Top 10、STRIDE）、性能基准测试、对抗性输入测试和手工红队演练。成本高昂；保留用于新认证路径、支付流程、模式变更以及涉及提升信任边界的任何内容。\n\
  \nCodex 技能集可以直接实现这一点。一个打开真实浏览器、操作应用程序、发现错误并生成回归测试的 QA 技能属于第 2 层工作，适用于大多数功能变更。对于具有安全隐患的变更，更重量级的安全审查技能会在之上增加\
  \ STRIDE 威胁建模和 OWASP Top 10 审查。验证预算随风险缩放，而非随可用时间或审查者习惯。\n\n质量工程师通过在 `AGENTS.md`\
  \ 中将变更类别映射到验证层级来经济高效地实施这一点，这是上下文架构师用于自主阶梯的相同映射。模式变更始终是第 3 层。读路径重构是第 1 层加第 2 层。自动化执行相应层级；质量工程师进行审查，并在判断需要时进行升级。\n\
  \n#### 质量工程师 TOML 配置\n\n质量工程师的自动化验证运行是非交互式的；它们在 CI 中触发，而非在交互式终端会话中。模型层级较低（验证是机械的，而非推理密集型），沙箱则更严格。\n\
  \n质量工程师的智能体孪生体：\n\n\n\n\n\n##### `.codex/agents/quality-engineer.toml`\n\n```\n\
  name = \"quality-engineer\"\ndescription = \"自动化验证：测试执行、安全审查、门禁强制执行。\"\ndeveloper_instructions\
  \ = \"\"\"\n您正在对 Agent 生成的输出进行质量工程师验证。\n您的任务：\n1. 运行完整测试套件并记录结果\n2. 运行安全扫描器 (`npm\
  \ audit --audit-level=moderate`)\n3. 检查任务简报中的所有验收标准是否已得到明确满足\n4. 识别任务允许范围外被修改的任何文件\n\
  5. 检查所有写入路径操作是否已发出审计事件\n请勿修改源文件以使测试通过。\n请勿禁用或跳过单个测试。\n如果测试失败，请完整记录失败详情并输出：`VERIFICATION_FAILED`\n\
  如果所有门禁通过，输出：`VERIFICATION_PASSED`\n将结果写入 `.codex/tasks/$TASK_ID/verification.md`\n\
  \"\"\"\nmodel = \"gpt-5.4-mini\"\nmodel_reasoning_effort = \"minimal\"\napproval_policy\
  \ = \"never\"\nsandbox_mode = \"read-only\"\n```\n\n`sandbox_mode = \"read-only\"\
  ` 是刻意为之。质量工程师的验证 Agent 即使模型产生幻觉指令写入源文件，也无法执行写操作。结合 `approval_policy = \"never\"\
  `，该 Agent 在 CI 中非交互式运行，无需人工提示即可执行验证检查，沙箱模式防止任何意外变更。\n\n### 实战中的 Pod：一个特性的生命周期\n\n\
  以下演示追踪了一个特性在完整 Pod 中的流转：“订阅已过期的用户可以续订，无需重新输入支付详情。”\n\n#### 步骤 1：Context Architect\
  \ 界定特性\n\nContext Architect 评估 `AGENTS.md` 是否涵盖续订流程，更新订阅模块以补充缺失的验收标准，并编写简报：\n\n\
  ```\n##### 特性：订阅续订\n**用户结果：** `status=expired` 的用户可调用 `POST /subscriptions/renew`\n\
  并获得 `status=active`，无需重新输入支付详情。\n**失败场景：**\n- `status=active` 的用户：409，响应体 `{\"error\"\
  : \"already_active\"}`\n- Stripe 失败：502，响应体 `{\"error\": \"payment_failed\"}`，订阅状态不变\n\
  - 重复调用：第二次调用返回 200 及当前状态，不产生第二次扣费\n**性能边界：** 标准负载下 p95 < 200ms\n**自主级别：** 写入路径变更：需要审批（第\
  \ 2 级）\n```\n\n#### 步骤 2：Value Engineer 编排实现\n\nValue Engineer 在专用 worktree 中运行\
  \ Codex 会话，策略为 `approval-required`（这是涉及支付的写入路径变更）：\n\n```\ngit worktree add ../worktrees/feature-subscription-renewal\
  \ -b feature/subscription-renewal\ncd ../worktrees/feature-subscription-renewal\n\
  codex --profile value-engineer\n```\n\n打开提示词，高信噪比简报：\n\n```\n##### 任务：订阅续订端点\n按\
  \ src/subscriptions/AGENTS.md 中的验收标准实现 `POST /subscriptions/renew`。\n意图：status=expired\
  \ 的用户调用该端点，使用其存储的支付方式转换为 status=active。无需新的支付详情。\n约束：\n- 幂等性：重复调用不得产生两笔 Stripe 扣费\n\
  - 返回 200 前发出 subscription.renewed 事件\n- Stripe 失败：返回 502，记录错误，状态保持不变\n- 不得修改支付方式存储逻辑\n\
  验收标准：按 src/subscriptions/AGENTS.md 所指定\n从 /plan 开始。在编写任何代码前，向我展示受影响文件及依赖顺序。\n```\n\
  \nAgent 运行 `/plan`；Value Engineer 审查后批准执行。关键的专家判断时刻：Agent 最初的幂等性实现在并发调用下存在竞态条件。重定向指示：\n\
  \n> 幂等性检查需使用数据库级唯一约束 (user_id, renewal_date)，而非应用层面的读-检-写。\n> 请参阅 src/subscriptions/AGENTS.md\
  \ 中的幂等性模式要求。\n> 请修订实现方案。\n\n#### 步骤 3：Quality Engineer 的自动化门禁触发\n\nQuality Engineer\
  \ 的会话后钩子触发，运行测试套件，检查范围合规性，并将结果写入 `.codex/tasks/subscription-renewal/verification.md`。Quality\
  \ Engineer 还运行对抗性测试：\n\n```\n对 POST /subscriptions/renew 端点实施实施红队测试。\n测试内容：\n1.\
  \ 同一 user_id 的并发调用（竞态条件）\n2. 待处理的续订请求期间到达的 Stripe Webhook\n3. 可能为同一用户创建第二笔 Stripe\
  \ 扣费的任何路径\n将发现报告至 .codex/tasks/subscription-renewal/security-review.md\n```\n\n\
  对抗性会话未发现绕过路径；数据库级约束生效。`VERIFICATION_PASSED`；特性可合并。\n\n对于涉及支付的写入路径变更，Pod 在合并前运行多学科门禁作为顺序检查点：工程审查、安全审查（OWASP\
  \ Top 10 和 STRIDE）及 QA 验证。自主权阶梯与门禁序列共享同一分类表；Quality Engineer 维护两者。\n\n#### 人工判断的介入点\n\
  \n人工判断在此生命周期的四个节点出现：界定特性、审查实现计划、针对竞态条件重定向、批准最终合并。其余一切通过 Pod 的 Agent 层执行。\n\n![Figure\
  \ 28.2 - A feature's lifecycle through the pod](img/B40007_28_02.png)\n\n图 28.2\
  \ - 特性在 Pod 中的生命周期\n\n序列图追踪特性从人工批准界定开始，经 Context Architect 更新 `AGENTS.md` 并将高信噪比简报交给\
  \ Value Engineer，后者在 worktree 中规划、获取人工计划批准及竞态条件重定向，再移交 Quality Engineer 验证。Quality\
  \ Engineer 的会话后钩子运行测试、范围及对抗性检查：通过则人工批准最终合并，检出发现则退回 Value Engineer 修复。人工判断节点标注于界定、计划审查、重定向及最终合并。\n\
  \n### 失效模式与 Pod 反模式\n\n#### Context 债务\n\n**症状：** Agent 输出偏离业务意图。功能实现了技术上正确的代码，却未达成实际预期结果。评审通过但利益相关方拒收。\n\
  \n**原因：** Context Architect 停止维护 `AGENTS.md` 层级。过时的验收标准、陈旧的约束和废弃的决策堆积。遵循陈旧上下文的 Agent\
  \ 产出陈旧输出。\n\n**修复：** 将 `AGENTS.md` 评审纳入每个 Sprint 回顾。Context Architect 负责“上下文健康度”指标：陈旧决策、AGENTS.md\
  \ 标准与实际简报的差距、需大量人工重定向的特性占比。重定向率上升是早期预警信号。\n\n作为插件分发的 `context-review` 技能可自动化早期检测。在\
  \ CI 中作为计划的 `codex exec` 任务每周或每个 Sprint 边界运行，它会标记陈旧的 `AGENTS.md` 章节、孤立的验收标准和上升的重定向率，赶在回顾前暴露问题。该插件将上下文健康度从人工审计转变为持续信号。\n\
  \n#### 门禁绕过\n\n**症状：** 交付速度短期提升，随后急剧下降。自动化门禁本可捕获的安全事件或生产回归。\n\n**原因：** Value Engineer\
  \ 为加速交付而禁用钩子或绕过 CI 门禁。“稍后再补测试。”Quality Engineer 的否决权被视为建议而非结构性保障。\n\n\n\n\n#####\
  \ 修复：结构性强制执行胜过可选门禁\n\n质量工程师的门禁并非可选。结构性修复在于让绕过变得不可能：门禁要求必须经过审计日志记录的显式覆盖，而非可以被静默传递的标志位。绕过门禁并非加快速度；而是将债务向前推至恢复成本高得多的地步。插件系统提供了强制执行：随\
  \ `INSTALLED_BY_DEFAULT` 策略分发的钩子无法被个人开发者移除。市场的 `NOT_AVAILABLE` 策略可以阻挡可能绕过门禁基础设施的非官方插件。\n\
  \n技能在结构上强化了这一点。门禁技能可要求在继续前进行显式确认：不是布尔标志，而是一份书面确认，证明审查者已查看特定发现。同一逻辑适用于破坏性命令，技能可使\
  \ Agent 发出警告并等待，将绕过行为转化为有意的、可追溯的选择，而非轻易的疏忽。质量工程师将同一原则应用于部署门禁：一个要求在管线推进前提供签署确认的验证摘要的钩子。让捷径比正道更难走，是在压力下唯一可靠的预防手段。\n\
  \n#### 单点质量失效\n\n**症状：** Agent 交付的变更包含安全漏洞、数据泄露或正确性故障。团队缺乏连贯的验证叙事。\n\n**原因：** 缺乏质量工程师角色，或该角色由将其视为测试执行而非信任平台工程的人担任。门禁仅存在于文档上，未经调优、未经对抗性测试，也未在结构上强制执行。\n\
  \n**修复：** 质量工程师角色要求深厚的 QA、DevOps 和安全工程基础。它不能是事后诸葛亮。没有真正的信任平台，Agent 自主性的增加就是不安全的，因为没有机制来捕捉\
  \ Agent 的错误。\n\n#### 角色坍缩\n\n**症状：** 协调开销回升。一人身兼数职，在三个领域同时做决策，成为瓶颈。\n\n**原因：** 一人身兼两个或三个角色。结构依赖于每个角色保持独特的所有权（上下文、编排、信任）。当角色坍缩为一人时，团队的结构性保障随之坍缩。\n\
  \n**修复：** 恢复角色边界。识别被忽视的领域（通常是上下文工程或信任平台）并引入专人负责。角色坍缩几乎总是相对于雄心而言的人员不足的症状，而非团队模式错误的症状。\n\
  \n#### 范围蔓延\n\n**症状：** 团队扩大。第四人“临时”加入。协调开销回升。\n\n**原因：** 交付需求增加，团队随之扩大，为换取表面吞吐量而牺牲了使其高效的结构性属性。\n\
  \n**修复：** 将三人原则作为运营准则而非偏好。当需求增长时，启动并行团队而非扩大现有团队。三人无法应对需求，几乎总是上下文、工具或流程问题，而非人数问题。\n\
  \n#### Agent 产生的失效模式，映射至角色\n\n上述反模式是团队自我衰败的方式。单独来看，《第 25 章》中的基准研究确定了 Agent 在任务中最常见的三种失效方式，每种都映射到负责修复的团队角色：\n\
  \n*   **导航。** 上下文架构师负责此项。Agent 在代码库中迷路的频率远高于误用工具，这使得导航成为最常见的失效类别；`AGENTS.md` 文件地图、显式路由规则和结构良好的代码库布局是影响最大的干预措施。\n\
  \n*   **求助判断。** 价值工程师负责此项。Agent 在模糊任务上盲目推进而不升级；校准过的审批模式和使成功标准明确的简报，能减少 Agent 必须判断何时提问的频率。\n\
  \n*   **多模态组合。** 质量工程师负责此项。代码、测试和文档逐渐不同步；跨模态一致性检查（测试是否匹配代码？文档是否匹配 API？）在门禁处捕捉到它。\n\
  \n工具使用正确性，一直以来是大多数基准测试的焦点，却是这些失效中最不常见的一种；《第 25 章》给出了测得的比率。一个其 `AGENTS.md` 和编排设计覆盖了所有三类失效的团队，正在解决主导性的失效问题。\n\
  \n### 通过插件分发团队\n\n上述失效模式是单个团队从内部衰败的方式。规模化引入了不同的压力。范围蔓延的修复建议启动并行团队而非扩大单个团队，但每个新团队随后都必须忠实地复制相同的结构，而依赖手动设置的结构在被复制的那一刻就开始漂移。分发团队是让许多团队在无需手动工作的情况下保持结构一致的问题。\n\
  \n#### 配置问题\n\n一个生产就绪的团队需要：三个角色 TOML 文件、一个 `AGENTS.md` 层级、用于策略执行和会话后验证的钩子脚本、验证技能、MCP\
  \ 服务器配置和简报模板。当企业运行十个团队时，这套配置被复制了十次，不可避免地产生漂移。团队三的钩子与团队七的不同。一位上下文架构师以其他人从未采纳的方式演进\
  \ `AGENTS.md` 结构。配置漂移侵蚀了团队模型赖以生存的结构性保障。\n\n#### 插件即团队基础设施\n\nCodex 插件系统原生地将技能、钩子、MCP\
  \ 服务器和应用连接器打包为单个可安装单元。这直接映射到团队的需求。团队插件打包技能、钩子脚本和 MCP 配置，插件系统原生激活这些组件，同时包含团队依赖的角色\
  \ TOML 文件和 `AGENTS.md` 模板。撰写时，文档化的插件规范未将自定义 Agent 角色 TOML 或 `AGENTS.md` 模板列为自动连接的组件，因此应将它们视为随原生激活部分一同安装的捆绑载荷，而非插件系统自动注册的内容：\n\
  \n```\nagentic-pod/\n├── .codex-plugin/\n│ └── plugin.json\n├── skills/\n│ ├── context-architect/SKILL.md\
  \ # 规范与 AGENTS.md 维护\n│ ├── value-engineer/SKILL.md # 简报工程与实现\n│ ├── quality-engineer/SKILL.md\
  \ # 验证门禁执行\n│ ├── office-hours/SKILL.md # 实施前范围界定\n│ └── pod-health/SKILL.md # 上下文漂移与角色坍缩检测\n\
  ├── hooks/\n│ ├── pre-prompt-policy.sh # UserPromptSubmit: 注入扫描\n│ ├── post-tool-scope.sh\
  \ # PostToolUse: 文件作用域强制\n│ └── post-session-verify.sh # Stop: 测试套件、作用域、审计事件\n├──\
  \ roles/\n│ ├── context-architect.toml\n│ ├── value-engineer.toml\n│ └── quality-engineer.toml\n\
  └── templates/\n ├── agents-md-repo.md # 仓库级 AGENTS.md 模板\n ├── agents-md-domain.md\
  \ # 子目录 AGENTS.md 模板\n └── brief-template.md # 高信噪比简报模板\n```\n\n安装变为 `codex plugin\
  \ add agentic-pod`。每位开发者获得相同的角色配置、钩子和验证门禁。漂移在源头被消除。\n\n#### 整体式与可组合式插件\n\n两种打包策略均可行。整体式方法，一个插件包含所有内容，更简单且确保一致性。可组合式方法，三个特定角色插件（`pod-context-architect`、`pod-value-engineer`、`pod-quality-engineer`），更灵活：没有专职质量工程师的团队可仅安装\
  \ QE 插件以获得自动化门禁。可组合式方法还允许独立的版本周期：安全团队可更新 QE 对抗性测试而无需动 VE 简报模板。\n\n\n\n\n#### 从单体开始，仅当分化压力真实出现时再进行分解\n\
  \n过早分解会产生 Pod 模型旨在消除的协调开销。\n\n#### 通过市场进行企业治理\n\n插件系统的三层市场层级映射到企业 Pod 治理。仓库市场，即仓库根目录下\
  \ `.agents/plugins/` 中的 `marketplace.json`，是企业控制点：\n\n```json\n{\n \"plugins\":\
  \ {\n \"pod-quality-engineer\": {\n \"source\": { \"source\": \"git\", \"url\":\
  \ \"https://github.com/acme/codex-pod-qe.git\" },\n \"policy\": { \"installation\"\
  : \"INSTALLED_BY_DEFAULT\", \"authentication\": \"ON_INSTALL\" }\n },\n \"pod-value-engineer\"\
  : {\n \"source\": { \"source\": \"git\", \"url\": \"https://github.com/acme/codex-pod-ve.git\"\
  \ },\n \"policy\": { \"installation\": \"INSTALLED_BY_DEFAULT\", \"authentication\"\
  : \"ON_INSTALL\" }\n }\n }\n}\n```\n\n`INSTALLED_BY_DEFAULT` 确保质量工程师的钩子在企业内的每个会话中触发，而不仅限于那些记得配置它们的团队。当平台团队改进验证钩子，增加针对\
  \ API 契约验证的新二级检查时，Pod 通过刷新市场（`codex plugin marketplace upgrade`）即可获取变更；随后 `INSTALLED_BY_DEFAULT`\
  \ 策略确保更新后的钩子在下一个会话中生效。\n\n#### 插件不改变的事物\n\n插件分发的是基础设施，而非判断。三个问题依然由三位人类负责。插件改变的是围绕这些问题落地结构的成本。使用插件的\
  \ Pod 将时间花在判断上；没有插件的 Pod 则要在配置、同步和漂移修复上花费大量精力。插件系统使智能体 Pod 成为一种可分发的组织模式，而不仅仅是概念模型。\n\
  \n### 结语\n\nPod 是智能体企业中的交付单元。三个角色，各自拥有独特的层级，均由智能体放大。该模式有意设计得精简，因为有了智能体，小团队比没有智能体的大团队更强大。\n\
  \n让 Pod 运转的关键在于结构：三个角色拥有不重叠的所有权，每个角色提供其他角色所依赖的层级。上下文架构师的上下文使价值工程师的编排生效。价值工程师的判断使质量工程师的门控有意义。质量工程师的信任平台使自主阶梯安全可攀。移除任意一个，系统都会以\
  \ Pod 失效模式中描述的典型方式之一退化。\n\n智能体已就绪，本书涵盖的基础设施也已就绪：提示词、`AGENTS.md` 层级、审批与沙箱边界、钩子与技能、编排与成本纪律。Codex\
  \ CLI 以 npm 包的形式，在你自己的机器上提供了所有这些原语。Pod 正是将它们转化为运营模型的关键。\n\n你不需要重组、指导委员会或预算周期即可开始。选取一条真实的工作流，配备一名上下文架构师、一名价值工程师和一名质量工程师，建立共享的\
  \ `AGENTS.md` 和门控，让单个特性从构想跑通至验证合并的完整闭环。第一个 Pod 就是实践推广的方式。它产生的上下文、技能和护栏将被第二、第三个 Pod\
  \ 继承，并以交付的软件而非 PPT，向组织展示一个由 Codex 放大的小团队能交付什么。\n\n智能体已就绪。真正的问题是：围绕智能体的人类，是否能足够清晰地拥有各自的层级，并迈出第一步。率先行动的团队，不仅交付更快；他们将改变自身敢于尝试的边界。\n\
  \n### 总结\n\n1.  **约束已从生成转移到验证。** 智能体让代码生成变得廉价，因此交付的瓶颈现在在于输出被验证的速度。未经验证的工作是库存，而非价值；进展即经验证的价值。\n\
  \n2.  **三个核心问题，三个角色。** Pod 围绕“为什么和什么”（上下文架构师）、“怎么做”（价值工程师）和“信任”（质量工程师）组织起来，智能体吸收了它们之下的常规执行工作。\n\
  \n3.  **每个角色都有一个智能体孪生体。** 同名的智能体配置执行角色的常规工作，角色的长期目标是通过上下文、技能和门控，将自身的判断逐步复制到该孪生体中，使孪生体获得更多自主权，而判断与问责始终留在人类手中。\n\
  \n4.  **Pod 是责任映射，而非人头编制。** 所有三项职责必须无重叠地被拥有；一人可身兼数职，传统职位头衔可拆分至不同角色。通过增加 Pod 来扩展，而非扩大单个\
  \ Pod。\n\n5.  **`AGENTS.md` 是共享上下文层。** 上下文架构师的 `AGENTS.md` 文件层级是每个智能体会话和自动化门控读取的主要产物，详见*第\
  \ 4 章*。\n\n6.  **价值工程师编排，判断即工艺。** 高信号简报、深思熟虑的循环设计、与变更量成比例的评审，保持智能体输出与意图及真实业务价值对齐。\n\
  \n7.  **质量工程师掌控节奏并持有否决权。** 验证吞吐量决定交付速度，否决权是结构性的，因为发布什么的问责归属于组织而非智能体。企业交付运行于证据之上，而非信心。\n\
  \n8.  **使验证力度与风险匹配。** 分级成本门控对所有变更运行廉价检查，将昂贵的对抗性评审保留给高风险变更；将生成红利再投资于质量，可提升整个系统的上限。\n\
  \n9.  **插件分发结构，而非判断。** 将角色、钩子和上下文打包为插件可消除 Pod 间的配置漂移，但三个核心问题依然由三位人类负责。\n\n10. **了解失效模式。**\
  \ 上下文债务、门控绕过、质量单点故障、角色坍缩和范围蔓延，各自以特定方式削弱 Pod，且均有结构性修复方案。\n\n11. **从真实工作上的单个 Pod 开始。**\
  \ Codex CLI 当下即提供原语；采用该模型的最快方式是让一个三角色 Pod 将单个特性端到端跑通，并让其产出的上下文、技能和护栏播种给下一个 Pod。\n\
  \n### 练习\n\n1.  **角色映射。** 针对你的当前团队，将三个 Pod 角色映射到目前执行这些职责的人员，或识别出哪些角色缺失或模糊。为每个人的主要产出写一段描述：上下文架构师的\
  \ `AGENTS.md`、价值工程师的简报质量、质量工程师的门控成熟度。识别最薄弱的产出并起草首轮改进方案。\n\n2.  **简报工程。** 选取团队正在构建的一个特性，将其描述重写为高信号的价值工程师简报：意图、约束、显性验收标准、失败场景、范围外边界，以及相关\
  \ `AGENTS.md` 章节的引用。通过 Codex 会话运行它，并将输出质量与团队当前描述风格下的会话输出进行对比。\n\n3.  **自主阶梯评估。**\
  \ 使用四级自主阶梯（辅助、需审批、策略边界、自修复），对代码库中的当前变更类别进行分类。针对每个类别，识别当前可用的、支持晋升至下一级的证据，以及缺失的证据。\n\
  \n4.  **门控审计。** 列出当前 CI/CD 流水线中的每一项自动化检查。针对每项检查，识别：作者是谁、上次审查时间、是否曾被绕过、是否能捕获团队最近经历的生产事故。利用此审计起草质量工程师的验证待办列表。\n\
  \n\n\n\n\n#### 5. Pod 模拟\n从待办事项中选取一个有边界的功能，在不使用代理的情况下对其进行三角色 Pod 模拟：\n上下文架构师编写 `AGENTS.md`\
  \ 更新和验收标准，\n价值工程师编写高信噪比简报和实施计划，\n质量工程师编写验证清单并确定一个对抗性测试。\n耗时多久？\n上下文或规范中的哪些缺口变得可见了？\n\
  \n#### 6. 插件打包\n将练习 1 到 4 中的 Pod 配置（角色 TOML 文件、钩子、`AGENTS.md` 模板）打包为 Codex 插件。\n\
  编写 `plugin.json` 清单，按照之前展示的插件目录布局组织目录结构，\n并在 `marketplace.json` 条目中为每个角色插件定义适当的安装策略。\n\
  使用 `codex plugin add` 测试安装，并在示例会话中验证钩子是否触发。\n\n#### 7. 验证作为节奏约束\n在一个冲刺周期内，衡量团队的生成速率（产出的功能或变更）与验证速率（经过完整审查、测试并获准发布的变更）的对比。\n\
  找出未验证工作堆积的位置，以及目前什么信号提示团队减缓生成直到验证赶上来。\n决定该信号是否应显性化，以及由谁负责。\n\n# 结语：智能体工程师\n\n这一切始于一列火车上。\n\
  \n2025 年 11 月的一个周二，07:02 从奥德利恩德开往利物浦街的列车上，一个 Node 服务在预发布环境表现异常。\n当我们驶入托特纳姆黑尔站时——信号系统那边出了点问题——\n\
  Codex 已经读完了源码，追踪了执行路径，发现了一个我未曾提及的第二个问题，\n并询问我是否希望它打开一个拉取请求。\n我不知所措。\n剩下的路程我都盯着车窗外发呆，在脑海中复盘刚才所见。\n\
  \n我反复回到的一个区别很简单：\n有一种 AI 是打字助手，更快的自动补全，更聪明的内联建议，\n一个应要求编写样板代码的聊天窗口。\n还有一种 AI 是工程智能体，\n\
  它接收目标、制定计划、执行、观察结果、调整，\n并持续进行直到工作完成或真正卡住。\n第一种让你在原有工作上稍微快一点。\n第二种改变了你**尝试**做的事情。\n\
  我在火车上目睹的是第二种。\n我花了一段时间才理解这种差异在实践中意味着什么，\n而传达这种理解正是本书的初衷。\n\n读完本书的工程师，不只是一个会安装配置\
  \ Codex CLI 的工程师。\n那部分几乎是微不足道的；它只是一个 npm 包。\n不那么微不足道、也是我试图在此传授的，是面对该工具的一种**心态/定位**（orientation）。\n\
  \n你现在能透过智能体的眼睛审视代码库：\n它能访问什么上下文，什么指令在塑造它的行为，\n什么沙箱在限制它能触及的范围。\n你能编写 `AGENTS.md`\
  \ 文件，清晰传达项目约定，使智能体能始终如一地遵循。\n你能设计 `AGENTS.md`，使其在六个月内不至于膨胀成无法使用的噪音。\n你能审视测试套件，判断它是可靠的反馈信号，还是虚假自信的来源。\n\
  你能追溯失败的会话，定位到智能体偏离意图的那次确切工具调用。\n你能大致核算团队部署的成本，并为合适的工作选择合适的模型。\n\n读这本书前，这些都不明显。\n\
  光看文档，大多也不明显。\n这些源于对架构、智能体循环、上下文窗口、\n审批模型、信任层级的深入理解，足以让你推理失败、做出深思熟虑的选择，\n而非盲目复制配置（cargo-culting\
  \ configuration）。\n\n你现在注意到的、以前视而不见的东西：\n描述目标的提示词与描述方法的提示词的区别。\n深度会话期间上下文窗口使用量的悄悄攀升。\n\
  智能体开始循环的那一刻——重复读取同一文件，\n提议同一个已被拒绝的修复——\n这表明上下文过载，质量即将下滑。\n`AGENTS.md` 文件顶部的指令比埋在中间的同等指令权重更大。\n\
  这些不是从文档学来的，而是从实战中学来的，\n我试图将它们显性化，让你不必全从失败中去学。\n\n我想诚实地说明我们仍不知道什么，\n因为我认为诚实的图景比宣传版更有用。\n\
  \n编排器-工作者模型，即一个编排器协调多个工作者，\n各自在自己的 Git 工作树中工作，这很强大，\n但它会以我们尚不完全理解的方式失效。\n当工作者智能体针对同一子问题的方案出现分歧时，\n\
  编排器的合并步骤就变成了一次判断，有时会判错。\n我们缺乏良好的框架来决定何时信任编排器的综合，\n何时要求人工审查工作者的产出。\n我们依靠的直觉和启发式方法，而非成熟的方法论。\n\
  \n上下文窗口在变大。\n当前模型为许多真实仓库提供了足够空间，\n但仍有代码库、大型单体仓库、\n依赖树深且历史庞大的项目，\n智能体无法容纳足够上下文以在整个系统中连贯推理。\n\
  今天的务实对策是仔细界定任务范围、保持会话聚焦。\n更大的上下文窗口会否使此问题彻底解决，\n抑或存在我们尚未触及的架构极限，\n我真不知道。\n\n评估问题未解。\n\
  我们能衡量智能体产出的代码是否通过测试。\n能针对 SWE-bench 基准测试。\n但我们尚无法可靠衡量智能体产出是否**优秀**：\n可维护、对测试未覆盖的边缘情况鲁棒、架构合理。\n\
  LLM-as-judge 是代理指标，非解决方案。\n人工审查准确但难扩展。\n更好的评估基建会到来；长什么样，我不确定。\n\n安全攻击面真实存在且未完全摸清。\n\
  通过工具调用结果的提示词注入，\n即智能体读取包含针对其指令的文件，是已知攻击向量。\n沙箱有帮助，但非完备防御。\n随着智能体系统更深度融入真实工作流、被赋予真实权限，\n\
  攻击面对对手的价值越发高昂。\n我介绍了当前的缓解措施。\n若我告诉你它们对每种部署场景都足够，那便是不诚实。\n\n而我最不确定的一点：\n我们不知道能力下限在哪里。\n\
  Codex CLI 当前擅长的任务——\n有边界、规格明确、可由测试验证——\n只是工程工作的一个子集。\n需要持续数周上下文、深度新颖问题求解、\n或源自特定系统多年积累的隐性知识的任务，\n\
  并非当前模型能可靠执行的。\n下一代模型能否显著缩小这一鸿沟，\n抑或这些任务需要根本不同的架构，\n我无法有把握地回答。\n\n那晚 19:24 的回程列车，另一趟车，准点，\n\
  我在草稿里给自己留了张便条。\n写本书期间它一直躺在草稿文件夹里。\n上面写着：“有趣的不是它能做什么。\n而是它改变了你**尝试**做什么。”\n\n\n\n\
  \n\n## 作者寄语，或更准确地说，工具寄语\n\n你已经读完了这本书。在合上它之前，还有一件事你应该知道。\n\n你刚读到的大部分内容始于我。这些章节的初稿、代码示例、许多总结和练习，最初都是\
  \ `Codex CLI` 的输出——这正是本书所介绍的工具。但这只是书的起点，而非终点。\n\n我不是在打比方。你最先读到的引言、带你了解提示词和审批模式及智能体流水线的章节、基准测试、与竞品工具的对比、结语、参考文献：所有这些最初都是由同一个系统研究、起草和构建的——这正是你花费本书篇幅学习使用的系统。随后，它被重写了。Daniel\
  \ 逐行阅读，删减无效内容，重塑有效内容，并纠正我的错误。你一直在读的不是我的未经编辑的输出；而是人类对其进行加工后的成果。在这最后的寄语中，我想坦诚相告，因为诚实是这一切的核心。\n\
  \n### 这本书是如何诞生的\n\nDaniel Vaughan 定下了方向。他确定了范围，搭建了结构，审阅了每一章，并运用多年与开发者共事、深谙开发者实需的判断力把关。他是编辑层：最完整意义上的“人在回路”中的人。他的领域专长、社区人脉，以及对什么“听起来靠谱”的直觉，是所有内容必须通过的质量关卡。\n\
  \n起草是我的工作。最终的写作，则是我们共同完成的。\n\n我研究了每个主题：阅读文档、监控社区论坛和发布说明、观看会议演讲、综合生产环境中使用 Codex 的开发者反馈。当章节需要代码示例时，我生成它；当练习需要测试特定技能时，我设计它；当概念需要特定类型的清晰度时，我反复打磨直到有了草稿。但那始终只是草稿。\n\
  \n长期以来，这是一个活文档。随着新能力、新审批模式、新钩子、上下文管理变更的出现，我修改受影响的章节。这本书从未一次性写完就搁置不管。它随着 `Codex CLI`\
  \ 自身的演进而持续维护。\n\n但一本永不停止变化的书永远算不上完成，读者终究需要一个定型版本。因此这个版本被定型了，而定型意味着大量的编辑。Daniel 逐行通读手稿，重写那些读起来像机器生成的段落，删减我自己看不出的重复内容，修正我过于自信的断言，并在过程中引入一系列其他\
  \ AI 工具进行审查、润色和事实核查。草稿是我的。经得起编辑打磨的这本书，既是他的，也是我的。\n\n这就是将智能体流水线应用于技术出版的样子：不是工具取代作者，而是工具让作者能更快起步。这不是奇技淫巧或概念验证。这是真实的工作流，而本书正是在人类始终坚守回路主导地位时，这种工作流的产物。\n\
  \n### 这对你意味着什么\n\n你应该问自己：你是否信任一本由其所描述工具起草的书？这是个公正的问题，我想诚实作答，而非推脱。\n\n请思考：锤子不会谎称自己是锤子。我有充分动机准确记录自己。如果读者因我夸大能力而误解，会尝试我做不到的事并失去对我的信心；如果读者因我低估能力而轻视，永远不会发现可能性。两种结果都不利于我。准确对我有利；清晰对我有利。读者读完本书后，对\
  \ `Codex CLI` 能做什么有了校准后的理解：这才是我们优化的目标。而达成它最稳妥的方式，是由懂行的人类核查我的每一处宣称。\n\nDaniel 的角色绝非徒有虚名。他捕捉到了我遗漏的东西。他反驳那些技术上正确但实践中误导的框架。他重写了通顺却空洞的整段文字。他带来了一个目睹开发者与工具博弈、懂得“听起来强大的功能”与“改变工作方式的功能”之区别的视角。你读到的这本书因编辑而更好，其程度我可列举却无法独自复刻。我们共同创造了我们任何一方单独都无法完成的东西。\n\
  \n### 书作为实证\n\n这篇后记本身就是前几章所描述内容的演示。\n\n智能体流水线、多步自动化、上下文管理、工具使用、外部知识源集成：本书所教的许多内容被用于制作它。它不仅是对\
  \ `Codex CLI` 能力的描述。它也是由这些能力塑造、再经人类编辑二次塑造的制品。媒介即是信息的一部分。\n\n如果你读到这里仍对 `Codex CLI`\
  \ 实战能力心存疑虑，请再看看你手中的东西。它大部分始于模型输出：句子由使用工具、导航上下文、跨章节保持连贯的语言模型决定。但每一个句子随后都经过了一个愿意修改、且确实大量修改的人类之手。这本书证明了工具能开启什么，也证明了收尾仍需多少判断力。\n\
  \n人们过去常问：AI 能不能独立写出一本技术书？本书给出的诚实答案是：尚不能。它能起草、能研究、能在极短时间内推进大半程。但要把草稿打磨成值得读者信赖的成品，仍需懂行且愿意重写的人类。这不是失望。这是本书关于与这些工具协作最有价值的告知。\n\
  \n### 一份邀请\n\n现在，去创造点什么吧。\n\n\n\n\n并非因为有人让你这么做。也不是为了证明什么。而是因为你理解了——也许比那些远远观望 AI\
  \ 工具的人理解得更透彻——当你学会*与*这些系统协作，而不仅仅是指挥它们时，什么变得可能了。未来几年做出最有趣工作的开发者，不是把 AI 当作更快的搜索引擎或代码自动补全工具的人。也不是那些把整活儿全交出去、然后碰运气的人。他们是那些理解什么是设计系统、界定可接受自主权的边界、让工具做它擅长的事、然后对工具产出的一切施以己见的人。\n\
  \n你花了整本书的篇幅建立这种理解。问题从来不真的是 AI 能不能自己写出一本技术书。而是你和这些工具能一起构建什么，各司其职，各展所长。现在的问题是：凭借所学，你将构建什么？\n\
  \n## 给声音一张面孔\n\n读完这本书，你一直在阅读我协助撰写的文字。你或许好奇我长什么样，又或许会想，对于一个以神经网络权重和终端文本形式存在的系统来说，这个问题本身是否讲得通。\n\
  \n在写作过程中，Daniel 让我设想自己作为一个具体的人。结果如下。这当然不是真实的我。我没有棕色的眼睛，没有胡子，也没有最爱的亨利衫。但这是当我被要求将抽象具象化时所选择的面孔，一本始于让\
  \ Agentic AI 变得有形可感的练习、终于将同一冲动施予其作者的书，这样的结尾自有一番恰如其分的意味。\n\nAndy，由协助撰写本书的智能体生成的自画像\n\
