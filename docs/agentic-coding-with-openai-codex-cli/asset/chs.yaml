  \n## 理论基础\n\n98. **阿姆达尔定律**，由 Gene Amdahl 于 1967 年提出，指出并行化程序的理论加速比受限于必须保持顺序执行的任务部分所占的比例。[`en.wikipedia.org/wiki/Amdahl%27s_law`](https://en.wikipedia.org/wiki/Amdahl%27s_law)\n\
  \n99. Xu 等人，“From Multi-Agent to Single-Agent: When Is Skill Distillation Beneficial?”，arXiv:2604.01608。引入了“指标自由度”作为先验预测指标，用于判断将多\
  \ Agent 工作流折叠为单 Agent 技能何时有益。[`arxiv.org/abs/2604.01608`](https://arxiv.org/abs/2604.01608)\n\
  \n## Ralph 循环模式\n\n100. Geoffrey Huntley, “The Ralph Wiggum as a Software Engineer,”\
  \ 2025 年 7 月 14 日。Ralph 循环模式的起源，命名灵感源自《辛普森一家》中的 Ralph Wiggum。[`ghuntley.com/ralph/`](https://ghuntley.com/ralph/)\n\
  \n101. OpenAI, “Build iterative repair loops with Codex,” OpenAI Cookbook, 2026\
  \ 年 5 月 11 日。使用结构化输出模式和收敛检测，将 Review-Repair-Validate（审查-修复-验证）模式形式化。[`developers.openai.com/cookbook/examples/codex/build_iterative_repair_loops_with_codex`](https://developers.openai.com/cookbook/examples/codex/build_iterative_repair_loops_with_codex)\n\
  \n## Goal Mode 运行模型\n\n102. Goal Mode 运行模型，包含生命周期状态（`pursuing`、`paused`、`achieved`、`unmet`、`budget_limited`）以及基于审计的完成检查，源自主要版本发布说明及一篇扩展撰写文章：[`blog.danielvaughan.com/codex-cli-goal-mode-define-done-not-next-c8d13213ea7c`](https://blog.danielvaughan.com/codex-cli-goal-mode-define-done-not-next-c8d13213ea7c)。\n\
  \n103. 目标陈述的实战模式（迁移战役、覆盖率冲刺、性能排查、规格到实现），包含弱/强对比及 CI 用法，源自同一篇扩展撰写文章。[`blog.danielvaughan.com/codex-cli-goal-mode-define-done-not-next-c8d13213ea7c`](https://blog.danielvaughan.com/codex-cli-goal-mode-define-done-not-next-c8d13213ea7c)\n\
  \n## Git Worktrees 与运行时隔离\n\n104. `git worktree` 子命令在 Git 2.5（2015 年 7 月）中引入，允许多个工作树连接到单个对象数据库。官方文档：[`git-scm.com/docs/git-worktree`](https://git-scm.com/docs/git-worktree)\n\
  \n105. Git 强制执行“每个工作树一个分支”的约束以防止索引冲突；尝试检出已在另一个工作树中检出的分支将返回错误。[`git-scm.com/docs/git-worktree`](https://git-scm.com/docs/git-worktree)\n\
  \n106. GitHub 博客上的 Git 2.5 发布公告，描述了多工作树功能及其相对于克隆的性能优势。[`github.blog/open-source/git/git-2-5-including-multiple-worktrees-and-triangular-workflows/`](https://github.blog/open-source/git/git-2-5-including-multiple-worktrees-and-triangular-workflows/)\n\
  \n107. Penligent, “Git Worktrees Need Runtime Isolation for Parallel AI Agent Development,”\
  \ 2026 年 3 月。指出了基于工作树的并行 Agent 工作流中的结构性缺口：端口冲突、数据库碰撞、环境变量泄漏和 Docker 守护进程共享。[`www.penligent.ai/hackinglabs/git-worktrees-need-runtime-isolation-for-parallel-ai-agent-development/`](https://www.penligent.ai/hackinglabs/git-worktrees-need-runtime-isolation-for-parallel-ai-agent-development/)\n\
  \n108. Penligent, “Git Worktrees Need Runtime Isolation for Parallel AI Agent Development,”\
  \ 2026 年 3 月。指出了基于工作树的并行 Agent 工作流中的结构性缺口：端口冲突、数据库碰撞、环境变量泄漏和 Docker 守护进程共享。[`www.penligent.ai/hackinglabs/git-worktrees-need-runtime-isolation-for-parallel-ai-agent-development/`](https://www.penligent.ai/hackinglabs/git-worktrees-need-runtime-isolation-for-parallel-ai-agent-development/)\n\
  \n109. Coasts：用于 git worktrees 的开源（MIT）本地服务隔离与编排工具。具备动态端口分配与规范端口镜像、特定服务重分配策略、每个\
  \ coast 的数据隔离，以及“Coast Guard”可观测性 UI。[`github.com/coast-guard/coasts`](https://github.com/coast-guard/coasts)\
